# Shared bibliography in CSL-YAML (the format Pandoc/citeproc, Zotero (via Better BibTeX),
# and most citation tools understand). Cite in articles as [@id] or [@id, 23–25].
# Standard abbreviations (COS, ANET, ABD…) go in `citation-label`; the site uses them for
# in-text citations. Works without one are cited author–date (George 2003).
#
# Seeded 2026-11-20 with standard text editions, translations, and reference works that the
# entries' "sources_to_check" lists rely on. Check details against a library catalogue
# before first citation; add a `verified: YYYY-MM-DD` field once checked.
# Ids: short, lowercase, stable. Series volumes use the series id plus the volume (saa2, rinap4).
