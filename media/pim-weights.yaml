title: Pim medida antigua peso hebreo.jpg
caption: >-
  A dome-shaped stone pim weight, side and top views with a drawing of its inscription pym.
description: >-
  Pim weights were polished stones about 15 mm (5/8 inch) diameter, equal to about two-thirds
  of a Hebrew shekel. Many specimens have been found since their initial discovery early in
  the 20th century, and each one weighs about 7.6 grams, compared to 11.5 grams of a shekel.
  Its name comes from the inscription seen across the top of its dome shape: the Phoenician
  letters 𐤐𐤉‬‬𐤌‬ (Hebrew פים‎, transliterated pym).
