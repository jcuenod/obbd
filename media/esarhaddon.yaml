title: Detail. Sam'al stele of Esarhaddon, 671 BCE, Pergamon Museum.jpg
caption: >-
  Esarhaddon on the basalt victory stele from Samʾal (Zincirli), 671 BCE (Pergamon Museum,
  Berlin).
description: >-
  This is the Assyrian king Esarhaddon; detail of a stele. This commemorative basalt stela
  depicts the Assyrian king Esarhaddon worshiping gods and symbols of gods. The king's left
  hand holds a royal mace and two ropes. These ropes pass through the lips of two captives.
  The kneeling smaller figure appears to an Egyptian crown prince Ushankhuru or probably pharaoh
  Taharqa, while the larger standing man is a Syrian city-state governor; probably the king
  of Tyre Baal I or king of Sidon Abdi-Milkutti. There are cuneiform inscriptions on the front
  side of the stela which narrate the victorious milita
