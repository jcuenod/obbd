caption: >-
  Amarna letter from Tushratta of Mitanni to Amenhotep III negotiating a royal marriage and
  asking for gold, Akkadian cuneiform, 14th century BCE (British Museum, ME 29791).
description: >-
  Amarna letter. A letter from Tushratta, king of Mitanni, to the Egyptian Pharaoh Amenhotep
  III. In this letter, the kings were negotiating a diplomatic marriage between Amenhotep
  III and a Mitanian princess; Tushratta asks for much gold as a bride-price. In addition,
  The king of Mitanni asks for large quantity of gold to be sent as payment for the expenses
  of his grandfather in sending gifts to the Pharaoh. Akkadian cuneiform text. 1st half of
  the 14th century BCE. From Tell el-Amarna, Egypt. British Museum, London. ME 29791.
