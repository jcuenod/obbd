description: >-
  Wall relief depicting an eagle-headed and winged man, Apkallu (Sage). This protective spirit
  holds a cone and a bucket for religious ceremonial purposes. From the North-West Palace
  of Ashurnasirpal II at Nimrud (Biblical Calah; ancient Kalhu), modern day Ninawa Governorate,
  Iraq (Mesopotamia). Neo-Assyrian period, 865-850 BCE. The British Museum, London.
