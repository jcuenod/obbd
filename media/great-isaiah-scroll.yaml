title: Great Isaiah Scroll.jpg
caption: The Great Isaiah Scroll (1QIsaᵃ) from Qumran Cave 1, photographed in full.
description: >-
  Photographic reproduction of the Great Isaiah Scroll, the best preserved of the biblical
  scrolls found at Qumran. It contains the entire Book of Isaiah in Hebrew, apart from some
  small damaged parts. This manuscript was probably written by a scribe of the Jewish sect
  of the Essenes around the second century BC. It is therefore over a thousand years older
  than the oldest Masoretic manuscripts.
