title: >-
  Clay tablet, Epic of Gilgamesh, from Hattusa, Turkey. 13th century BCE. Neues Museum, Germany.jpg
caption: >-
  Clay tablet from Hattusa with part of the Epic of Gilgamesh, 13th century BCE (VAT 12890,
  Berlin).
description: >-
  The cuneiform inscription on this clay tablet (VAT 12890) narrates part of the Epic of Gilgamesh
  (written c. 2150 - 1400 BCE). The obverse of this tablet relates the second dream of Gilgamesh
  on the journey to the Forest of Cedar, and part of the text of this passage has already
  been interpolated into the standard version of the epic at Tablet IV 55. The reverse holds
  a badly corrupted version of the episode of Ishtar and the Bull of Heaven. From Hattusa,
  in modern-day Turkey. 13th century BCE. It was displayed at the Neues Museum in Berlin,
  Germany, Exhibition of "Cinderella, Sindbad & Sinuhe
