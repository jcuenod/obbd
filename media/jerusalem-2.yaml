title: 10th century Stepped-Stone Structure and 7th century Houses (3783275736).jpg
caption: >-
  The Stepped Stone Structure on the eastern slope of the City of David, with later Iron Age
  houses.
description: >-
  The so-called "stepped stone structure" uncovered on the North-East slope of the City of
  David. The structure dates to the early 10th century BCE and seems to be part of the foundation
  for a monumental building at the top. The building has plausibly been identified as a palace
  of King David, the first Israelite ruler of Jerusalem whose conquest of the city is described
  in the biblical book 2 Samuel. In the lower half of the photo are visible 7th century BCE
  houses that were build in part on top of the 10th century structure. Jerusalem
