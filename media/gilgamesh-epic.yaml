caption: >-
  Old Babylonian clay tablet with part of Tablet V of the Epic of Gilgamesh, 2003-1595 BCE
  (Sulaymaniyah Museum, Iraq).
description: >-
  This is a newly discovered partially broken tablet V of the Epic of Gilgamesh. The tablet
  dates back to the old Babylonian period, 2003-1595 BCE; Neo-Babylonian period according
  to the edition in F. Al-Rawi et A. R. George, « Back to the Cedar Forest: The beginning
  and end of Tablet V of the Standard Babylonian Epic of Gilgameš », Journal of Cuneiform
  Studies, vol. 66,‎ 2014, pp. 69-90. From Mesopotamia, Iraq. The Sulaymaniyah Museum, Iraq.
