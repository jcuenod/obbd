description: >-
  Amarna letter. "Message from the king of Alashiya, your brother" to the Pharaoh of Egypt,
  possibly Akhenaten. Akkadian cuneiform text. The king of Alashiya (Cyprus) sends a large
  amount of copper and in return requests silver, special oils, and the services of a priest
  who can read omens. Although referred to as gifts, the exchanges of gifts were economic
  in nature. Circa 1350 BCE. From Tell e-Amarna, Egypt. British Museum, London. ME 29788.
