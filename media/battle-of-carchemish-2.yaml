description: >-
  The so-called "Chronicle of Nabopolassar". The cuneiform inscriptions on this clay tablet
  narrate the chronicle of the years 608-605 BCE. Nabopolassar (r. 658-605 BCE) was the king
  of Babylon and the father of Nebuchadnezzar II. After the fall of Nineveh, Naboplolassar
  vied with Egypt to control Assyria's western territories. His death stopped the campaign
  and sent his son Nebuchadnezzar II back to Babylon to claim the throne. From southern Iraq
  (precise provenance unknown). 550-400 BCE, made during the reign of an unknown ruler. The
  British Museum, London.
