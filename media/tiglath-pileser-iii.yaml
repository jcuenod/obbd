description: >-
  Gypsum wall panel relief: the king, Tiglath-Pileser III, wears a long full beard, a moustache,
  and carefully curled hair. His high crown is decorated with three bands which are ornamented
  with rosettes. The ornamented ends of the lowest band hang down his back. His garment has
  a fringed border decorated with rosettes alternating with concentric squares. His earring
  is of a common type; on his wrist he wears a four-fold bracelet with a many-petalled rosette
  in the middle. In his raised right hand he holds a staff; his left hand is no longer preserved.
