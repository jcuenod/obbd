description: >-
  Basalt colossal statue of Hadad, the Hittite god of weather. Erected by Panamuwa. The Aramaic
  inscription on the lower torso reads at the beginning "I'm Panamuwa, the son of QRL, the
  King of Ja'udi, I have erected this statue of Hadad, at my eternal grave". From Gerdshin
  near Sam'al, Turkey. 775 BCE. Pergamon Museum, Berlin, Germany.
