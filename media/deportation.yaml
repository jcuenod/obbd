title: Judaean people are being deported into exile after the capture of Lachish.jpg
caption: >-
  Judahite deportees leaving Lachish with their belongings, detail of the Lachish reliefs
  from Sennacherib's palace at Nineveh, c. 700 BCE (British Museum).
description: >-
  After the sack of Lachish, the prisoners of Jude were deported into exile within other parts
  of the Assyrian empire. People took their belongings and whatever animals they could. This
  relief depicts a man, 2 women, and 2 (male and female) children being deported with their
  household belongings. Wall relief from the South-West Palace at Nineveh (modern-day Ninawa
  Governorate, Iraq), Mesopotamia. Neo-Assyrian period, 700-692 BCE. The British Museum, London.
