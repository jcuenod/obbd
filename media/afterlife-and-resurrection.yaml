caption: >-
  The weighing of the heart before Osiris in the Book of the Dead of Ani, papyrus, Nineteenth
  Dynasty (British Museum, London).
description: >-
  The Weighing of the Heart from the Book of the Dead of Ani. At left, Ani and his wife Tutu
  enter the assemblage of gods. At center, Anubis weighs Ani's heart against the feather of
  Maat, observed by the goddesses Renenutet and Meshkenet, the god Shay, and Ani's own ba.
  At right, the monster Ammut, who will devour Ani's soul if he is unworthy, awaits the verdict,
  while the god Thoth prepares to record it. At top are gods acting as judges: Hu and Sia,
  Hathor, Horus, Isis and Nephthys, Nut, Geb, Tefnut, Shu, Atum, and Ra-Horakhty.
