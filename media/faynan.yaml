title: Khirbat en-Nahas.jpg
caption: >-
  Satellite image of the Khirbat en-Nahas copper-smelting site in Faynan, where black slag
  heaps mark the ancient works.
description: >-
  Black piles of slag define Khirbat en-Nahas, a copper mining and smelting site, which is
  annotated at top left in this image. It is not so unusual that a copper mine should show
  up in a satellite image, but Khirbat en-Nahas is remarkable because it was built some 3,000
  years ago. The faint square on the northern edge of the site is an Iron Age fortress.
