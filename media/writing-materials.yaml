title: Ivory writing-board from Nimrud, Iraq, with cuneiform inscriptions. Iraq Museum.jpg
caption: >-
  Ivory writing board from Nimrud, outer cover incised with a cuneiform title (Iraq Museum,
  Baghdad).
description: >-
  The outer cover of the ivory writing-boards (6 in number). The surface is incised with 4
  lines of a cuneiform text, giving the title of the astrological script which was a compilation
  of omens ordered by king Sargon II (r. 722-705 BC) to be set up in his palace at Khorsabad.
  From Well AB, North-West Palace at Nimrud, Iraq. Iraq Museum. It reads "‘Palace of Sargon,
  king of the world, king of Assyria. The series Enuma Anu Enlil, he had written on an ivory
  board and, placed in his palace at Dur-Sharrukin". Source of transliteration: IVORIES FROM
  THE NORTH-WEST PALACE (1845-1992) by GEORGINA HERRM
