description: >-
  Exhibit in the Oriental Institute Museum, University of Chicago, Chicago, Illinois, USA.
  This work is old enough so that it is in the public domain. Photography was permitted in
  the museum without restriction. Translation: "Shurrupak gave instructions to his son: /
  Do not buy an ass which brays too much. / Do not commit rape upon a man's daughter, do not
  announce it to the courtyard. / Do not answer back against your father, do not raise a 'heavy
  eye.'".
