description: >-
  The recently excavated Pool of Siloam. These steps likely ran around all four sides of the
  large rectangular pool, which collected water that had come from the Gihon Spring via "Hezekiah's
  Tunnel." The pool stood beside the Cardo Maximus, the main road running along the floor
  of the shallow Central Valley (the North-South valley separating the Temple-Mount and City
  of David from the Western Hill). Only one end of the pool has so far been excavated, and
  you can see the wall of earth (at right) where the excavation ended. Jerusalem
