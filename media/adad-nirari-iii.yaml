caption: >-
  The Tell al-Rimah stele of Adad-nirari III, which records tribute from Joash of Samaria,
  early 8th century BCE (Iraq Museum, Baghdad).
description: >-
  The so-called Tell al Rimah stele of Adad-nirari III. This "Mosul marble" stele depicts
  the Assyrian king Adad-Nirari III (reigned 810-783 BCE) praying before gods and goddesses
  symbols (Ishtar, Sin, Sibitti, Nabu, Marduk, Adad, Anu, and Assur). The cuneiform inscriptions
  mention the king's titles and military campaigns. The name of Jehoash the Samarian was mentioned,
  who paid tribute to the king. From Tell al Rimah, in modern-day Nineveh Governorate, Iraq.
  On display at the Iraq Museum in Baghdad, Republic of Iraq. IM70543.
