caption: >-
  Basalt water basin from the temple of Assur, decorated with Ea and fish-cloaked apkallus,
  reign of Sennacherib, 7th century BCE (Pergamonmuseum, Berlin), a Near Eastern analogue
  of the bronze sea.
description: >-
  When discovered, this water basin was completely shattered. It was cut originally from a
  single basalt block and was located in the courtyard of the temple of Assur. At each corner
  and side of the basin's walls, there are water gods holding water-flowing water jugs. Water
  flows from the sky above, into the jugs, and downward to the earth below. Two priests appear
