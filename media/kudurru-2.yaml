description: >-
  Kudurru (stele) of King Melishipak I (1186–1172 BC): the king presents his daughter to the
  goddess Nannaya. The crescent moon represents the god Sin, the sun the Shamash and the star
  the goddess Ishtar. Kassite period, taken to Susa in the 12th century BC as war booty.
