description: >-
  The façade and original entrance to the Iron Age monolithic tomb, which once featured the
  Royal Steward Inscription (now in the British Museum). Note the damage caused by Charles
  Clermont-Ganneau's removal of the two inscriptions in 1871. Today, the former tomb serves
  as the lower quarter of a family home built above it.
