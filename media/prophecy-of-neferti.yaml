description: >-
  The story of ‘The Prophecy of Neferti’ is set in the court of King Snefru, Pharaoh during
  the 4th Dynasty (2613–2589 BCE). The Pharaoh, being bored, receives a wise man named Neferti.
  The king questions him about the future and Neferti predicts a series of catastrophies that
  will befall the earth before the arrival of a new king who will restore order.
