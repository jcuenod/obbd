title: AssyrianWarship.jpg
caption: >-
  A Phoenician bireme with two banks of oars, Assyrian relief from Nineveh (British Museum).
description: >-
  This Phoenician warship was depicted by Assyrians in their palace of Niniveh. It is a bireme
  (dieris/Greek διήρης), with two levels of oars. Shields are fastened around the superstructure,
  as on the fortifications of some city walls. The pointed bow is either a ram, for holding
  enemy ships, or a form of cutwater. WA 124772 British Museum.
