description: >-
  Min-nakht is reading the papyrus on his lap. One of the first New Kingdom sculptures of
  this type, Min-nakht's statue was inspired by early Middle Kingdom style, including his
  large, prominent ears and his wig. The inscription on the papyrus records Min-nakht's name
  and his title, royal scribe. On the base is an offering text.
