title: Prutah Of Pontius Pilate.jpg
caption: >-
  Bronze prutah struck in Judaea under Pontius Pilate, with a lituus and the name of Tiberius.
description: >-
  Bronze prutah of Pontius Pilate in typically aged and well circulated condition. Minted
  in Jerusalem, Judaea dated 29/30 C.E., near the time of the crucifixion of Jesus Christ.
  This coin was cast as part of an attached group, and first mistakenly partially clipped
  through the body of the coin, as seen on the reverse. Obverse: ΤΙΒΕΡΙΟΥ ΚΑΙΣΑΡΟΣ surrounding
  lituus. Reverse: Wreath surrounding date LIZ (year 16, 29/30AD). Bronze, cast, clipped,
  15mm, 1.97g. Worn desert patina. Found in Lebanon.
