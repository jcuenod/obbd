title: >-
  Kadesh Treaty, written in Akkadian. 1269 BCE. From Boğazköy, Turkey. Clay tablet. Museum
  of the Ancient Orient, Istanbul, Turkey.jpg
caption: >-
  Akkadian clay tablet of the Egyptian–Hittite peace treaty from Boğazköy (Ḫattuša), 13th
  century BCE (Museum of the Ancient Orient, Istanbul).
description: >-
  The Treaty of Kadesh was written in the Akkadian language in 1269 BCE. It was a peace treaty
  that was concluded between Ramesses II (the Egyptian pharaoh) and Hattusilis (king of Hittite).
  The two fragments of the same large tablets were found in Boğazköy-Buyulkale (the ancient
  capital of the Hittite), Turkey in 1906 CE. Terracotta, Hittite imperial era, 1269 BCE.
  Clay tablet. Museum of the Ancient Orient, Istanbul, Turkey.
