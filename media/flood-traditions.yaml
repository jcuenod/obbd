title: British Museum Flood Tablet 1.jpg
caption: Tablet XI of the Gilgamesh Epic, the "Flood Tablet", from Nineveh (British Museum).
description: >-
  "The Flood Tablet. This is perhaps the most famous of all cuneiform tablets. It is the eleventh
  tablet of the Gilgamesh Epic, and describes how the gods sent a flood to destroy the world.
  Like Noah, Utnapishtim was forewarned and built an ark to house and preserve living things.
  After the flood he sent out birds to look for dry land. ME K 3375." In the British Museum.
