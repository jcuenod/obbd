description: "The Trumpeting Place inscription is an inscribed stone from the 1st century\
  \ CE discovered in 1968 by Benjamin Mazar in his early excavations of the southern wall\
  \ of the Temple Mount. The stone, showing just two complete words written in the Square\
  \ Hebrew alphabet, was carved above a wide depression cut into the inner face of the stone.\
  \ The first word is translated as \"to the place\" and the second word \"of trumpeting\"\
  \ or \"of blasting\" or \"of blowing\", giving the phrase \"To the Trumpeting Place\". The\
  \ subsequent words of the inscription are cut off. Present location Israel Museum (Identification "
