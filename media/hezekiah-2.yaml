title: >-
  Cuneiform Inscription mentioning in details the tribute sent by Hezekiah, king of Judah,
  to Sennacherib. The British Museum.jpg
caption: >-
  Inscription from the human-headed bulls of Sennacherib's palace at Nineveh, detailing Hezekiah's
  tribute (British Museum, London).
description: >-
  This is the beginning of the inscription which was carved on the pair of human-headed wing
  bulls which flanked the main entrance to the Throne Room of the Assyrian king Sennacherib
  (r. 704-681 BCE). It includes the most detailed surviving account of the tribute sent by
  Hezekiah, king of Judah, after the Assyrian military campaign to Palestine in 701 BCE. About
  693/2 BCE. From Nineveh, South-West Palace, Courtyard H, door "a". The British Museum in
  London.
