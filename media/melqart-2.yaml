description: >-
  A half-shekel minted at the Phoenician city of Tyre around 102 to 101 BCE, two and a half
  decades after it regained its independence from the fading Seleucid Empire: "The human-like
  head is that of Melkarth, the Tyrian deity (often called, slightly misleadingly, the 'Tyrian
  Hercules'). On the other side of the coin is an eagle with one foot on the prow of a galley.
  Next to it is a club, which is a symbol of Melkarth." File:C+B-Shekel-FigC-TyrianHalfShekel.PNG
