description: >-
  The front panel of this dais depicts Shalmaneser III (r. 858-824 BCE), (on the right) handshaking
  Marduk-zakir-shumi (r. 855 - 819 BCE) (left), king of Babylon. Both are surrounded by guards
  and stand below a fringed canopy supported by poles. The scene commemorates Shalmaneser's
  support of Marduk-zakir-sumi against his rebellious brother, Marduk-bel-usati and the ascent
