title: Egyptian - Group of 16 Amulets Strung as a Necklace - Walters 481685-1699 - View A.jpg
caption: >-
  Group of Egyptian amulets, restrung in modern times in the order of an amulet necklace found
  on a mummy (Walters Art Museum, Baltimore).
description: >-
  This group of amulets were strung in modern times to a necklace that follows the order of
  an amulet necklace found on a mummy in the Faiyum. On this string are 8 "djed" pillars (symbols
  of Osiris), Thoth, figures of Horus, two figures of Re, a "wadj" (papyrus scepter, symbolizing
  resurrection), Nephthys, and Khnum. The combination of amulets without an amulet of Isis
  and only one "wadj" makes it likely that these amulets come from a larger context such as
  a mummy net or amulet ensemble of a deceased, and not from a single necklace.
