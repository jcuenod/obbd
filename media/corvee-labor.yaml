title: Mesad Hashavyahu Ostracon in Israel Museum.jpg
caption: >-
  The Mesad Hashavyahu (Yavneh-Yam) ostracon, a field worker's petition about his confiscated
  garment, late 7th century BCE (Israel Museum, Jerusalem).
description: >-
  The Yavne-Yam ostracon, also known as the Mesad Hashavyahu ostracon, is an ostracon containing
  a written appeal by a field worker to the fortress's governor regarding the confiscation
  of his cloak, which the writer considers to have been unjust. The artefact was found in
  1960 by Joseph Naveh at Mesad Hashavyahu, near Yavne-Yam. The inscription is known as KAI
  200. The picture was taken in Israel Museum.
