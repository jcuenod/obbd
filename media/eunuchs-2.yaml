title: >-
  The chief eunuch, Nabu-sharussu-ukin (Nebuchadnezzar II's right-hand man), "rab sha-reshi",
  donated gold to the god Marduk temple at Babylon. His name and title occur as Nebo-Sarsekim,"rab-saris",
  in Hebrew in the Book of Jeremiah.jpg
caption: >-
  Tablet recording a gift of gold to Esagil by Nabu-šarrussu-ukin, the chief eunuch (rab ša-rēši)
  of Nebuchadnezzar II, compared with Nebo-Sarsekim the rab-saris of Jeremiah 39 (British
  Museum).
description: >-
  The chief eunuch, Nabu-sharussu-ukin (Nebuchadnezzar II's right-hand man), "rab sha-reshi",
  donated gold to the god Marduk temple at Babylon. His name and title occur as Nebo-Sarsekim,
  "rab-saris", in Hebrew in the Book of Jeremiah. He probably met the prophet Jeremiah at
  Nebuchadnezzar II's second capture of Jerusalem in 587 BCE. From Babylon, Iraq. Reign of
  Nebuchanezzar II, 605-562 BCE. British Museum, ME 114789.
