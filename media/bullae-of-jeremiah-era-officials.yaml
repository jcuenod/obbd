title: Paleo-Hebrew seal.jpg
caption: >-
  Clay bulla reading 'Natan-Melech, servant of the king', a name known from 2 Kgs 23:11, found
  in the Givati Parking Lot excavations in the City of David, late Iron Age.
description: >-
  The Natan-Melech/Eved Hamelech bulla (seal impression) dated to the First Temple period,
  features Hebrew writing: "Natan-Melech the King’s Servant" that appears in the second book
  of Kings 23:11. The seal was used to sign documents 2600 years ago and was uncovered in
  archaeological excavations of the Givati Parking Lot in the City of David National Park
  in Jerusalem conducted by Prof. Yuval Gadot of Tel Aviv University and Dr. Yiftah Shalev
  of the Israel Antiquities Authority.
