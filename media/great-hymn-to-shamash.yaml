caption: >-
  Šamaš enthroned in his shrine, detail of the Sun God Tablet of Nabu-apla-iddina from Sippar,
  9th century BCE (British Museum, London).
description: >-
  Nabu-nadin-shum (a priest) and the goddess Aa lead Nabu-aplu-iddina (Babylonian king, r.
  888-855 BCE) to a shrine. The symbols of Sin, Shamash, and Ishtar appear above the seated
  Sun God. Babylonian, circa 860-850 BCE. From Sippar (Tell Abu Habbah), Mesopotamia, Iraq.
  On display at the British Museum in London.
