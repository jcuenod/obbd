caption: >-
  Opening page of Mattia Palmieri's Latin translation of the Letter of Aristeas, illuminated
  manuscript (Bayerische Staatsbibliothek, Munich, Clm 627).
description: >-
  Epistula ad Philocratem, known in English as Letter to Philocrates or Letter of Aristeas.
  Latin translation by Mattia Palmieri. Manuscript of cirсa 1480. Munich, Bayerische Staatsbibliothek
  (BSB Clm 627). Vignette on the right represents Ptolemy II who is said by Aristeas to have
  ordered the creation of Septuagint. Th crest in the lower border is that of the book's first
  owner, Matthias Corvinus who was the king of Hungary from 1458 to 1490.
