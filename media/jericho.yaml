caption: Aerial view of Tell es-Sultan, the mound of ancient Jericho.
description: "Aerial view of the archaeological area of Jericho, specifically showing Tell\
  \ es-Sultan. The top and right parts of the image show trees, green crop fields, and other\
  \ vegetation. On the bottom left of the image, you can see houses and other structures which\
  \ are brown. White buildings, which are noticeably younger than than the ones on the bottom\
  \ left, can be seen in the green area. Two large, uncultivated pieces of land can be seen\
  \ in the middle of the bottom of the image. The top uncultivated field is dark brown, while\
  \ the bottom one is sand in color. These two fields are separated by a road. "
