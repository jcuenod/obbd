title: 7 Statuen nubischer kuschitischer Könige Kerma Musuem.jpg
caption: >-
  Granite statues of Kushite kings, including Taharqa and Tanutamani, from the Dukki Gel cache
  (Kerma Museum, Sudan).
description: >-
  Black Pharaohs and Kings left to right: Tanotamun, Taharqa (rear), Senkamanisken, again
  Tanotamun (rear), Aspelta, Anlamani, again Senkamanisken. Found in 2003 by swiss archaeologist
  Charles Bonnet in a cahe in Dukki Gel. They were broken carefully and hidden in a cache
  c. 590 BC in order - probably - to preven commemoration.
