description: >-
  Head of the Neo-Sumerian ruler Gudea, ruler of Lagash. Fake artifact; archaeological forgery.
  It was supposed to be sold as a genuine ancient Mesopotamian piece. Confiscation; not-on-display.
  The Sulaymaniyah Museum, Iraq. It resembles another head of Gudea at the Met Museum (see
  https://www.metmuseum.org/art/collection/search/324061), and therefore, I wonder if it is
  a genuine piece and has come from...? Exclusive photo.
