description: >-
  One of the three tablets that contained the Epic of Atrahasis, hero of the Babylonian Flood
  story. It recounts how the gods sent a deluge to drown the world and destroy noisy humanity.
  Enki, god of wisdom, secretly warned Atrahasis who, in time, built a boat to save mankind
  and life on earth. 1635 BCE, probably from Sipar. Currently at the British Museum
