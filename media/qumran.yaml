title: Qumran caves 1504 (509724995).jpg
caption: >-
  Cave 4 at Qumran, cut into the marl terrace, where thousands of scroll fragments were found
  in 1952.
description: >-
  The Scrolls Cave "Bedouins discovered this cave in August 1952. Fourteen thousand fragments
  of scrolls were unearthed as they sifted through the dust within. Archaeologists, who reached
  the cave later, uncovered an additional 1,000 fragments. Scholars believe that a Roman soldier
  who entered the cave in 68 CE tore the scrolls intentionally, and that later, ravages by
  animals and climate inflicted further damage. As research proceeded, the fragments of these
  scrolls were pieced together to produce 530 different scrolls. Publication of these scrolls
  was completed in 2001." from marker Dead Sea
