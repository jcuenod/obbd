title: Kurkh stele of Ashurnasirpal II. From Diyarbakır, southern Turkey. British Museum.jpg
caption: >-
  The Kurkh stele of Ashurnasirpal II, showing the king worshipping before divine symbols
  (British Museum).
description: >-
  The Assyrian King Ashurnasirpal II worships in front of god symbols. The cuneiform inscription
  describes his military campaign in the year 879 BCE when the Assyrian army attacked the
  lands of the upper Tigris River, near Diyarbakir (modern southern Turkey). This stela was
  probably set up soon afterward in one of the main cities under the Assyrian rule. Neo-Assyrian
  era, 879 BCE, from Kurkh, near Diyarbakir. British Museum.
