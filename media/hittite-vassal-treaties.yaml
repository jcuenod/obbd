description: >-
  Bronze tablet from Çorum-Boğazköy dating from 1235 BC. Photographed at Museum of Anatolian
  Civilisations. This cuneiform document excavated at Hattusa in 1986 is the only bronze tablet
  found in Anatolia. It casts light upon the historical geography of Anatolia in the 2nd millennium
  BCE, testifying to the treaty between Tudhaliya IV and Kurunta of Tarhuntassa in 1235BCE.
  With this treaty Tudhaliya promises the sovereignty of Tarhuntassa and another territory
  to Kurunta and his sons for the future, although Kurunta is advised to not want to imitate
