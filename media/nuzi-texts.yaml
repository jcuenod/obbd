description: >-
  Clay tablet from Yorghan Tepe, ancien Nuzi. Report of a trial relating to the possession
  of a land and the "tower" (dimtu) which stands at its center. Edited in JEN II, 321 by E.
  Chiera. See Maynard P. Maidman, Nuzi Texts and Their Uses as Historical Evidence, Atlanta,
  Society of Biblical Literature, 2010, text no 61 pp. 138-141. Exhibit in the Oriental Institute
  Museum, University of Chicago, Chicago, Illinois, USA.
