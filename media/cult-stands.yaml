title: >-
  Cypriot bronze wheeled stand with an animal frieze on the ring and figures in the side panels.jpg
caption: >-
  Cypriot bronze wheeled stand with figured side panels, a close analogue of the wheeled stands
  of Solomon's temple.
description: >-
  Bronze wheeled stand with an animal frieze on the ring and figures in the side panels. The
  panels principally show a seated harp-player approached by a musician and a serving boy,
  a winged sphinx, a lion gripping a water bird by its neck, and a chariot. Made in Cyprus.
  13th or 12th century BC.
