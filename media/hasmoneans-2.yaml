description: >-
  A bronze en:prutah coin of Alexander Jannaeus. Obverse: the inscription "Jonathan the High
  Priest and the Council of the Jews". Reverse: a pair of Cornucopias or Horns of Plenty,
  which were a Hellenistic and Roman symbol. The pomegranate in the center of the coin gives
  it a Jewish aspect. Pomegranate appears on many Hasmonean coins. Itamar Atzmon Collection
