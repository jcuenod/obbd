description: >-
  Drawing of the Phoenician text on the Ahiram sarcophagus. This is an edit of Sarcophag_of_Ahiram_inscription.png,
  whereby the original configuration of the textstrings was restored, namely a short first
  line (on the head side of the sarcophagus), and a longer second line (on the side of its
  lid). In Sarcophag_of_Ahiram_inscription.png the long second line was cut in two, and the
  first part of line 2 was then "pasted" to line 1.
