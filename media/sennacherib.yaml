title: Capture of Lachish - Sennacherib.jpg
caption: >-
  Sennacherib enthroned receiving the surrender of Lachish, relief from the South-West Palace
  at Nineveh, 700–692 BCE (British Museum, London).
description: >-
  Bas-relief from the south-west palace of Nineveh, on the taking of Lachish. After the capture
  of the city: King Sennacherib on his throne contemplates the procession of prisoners and
  receives respects from his soldiers and the defeated. He is accompanied by servants, and
  behind him is his tent. His face was deliberately slashed when Nineveh was taken in 612
  BC. Panels 11-13 from Room XXXVI, c. 700-692 BC.
