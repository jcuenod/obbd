title: Kurkh stele of Shalmaneser III. From Diyarbakır, southern Turkey. British Museum.jpg
caption: >-
  The Kurkh Monolith of Shalmaneser III, showing the king before divine symbols, with the
  account of the battle of Qarqar (853 BCE) (British Museum).
description: >-
  Shalmaneser III praying in front of divine symbols (Ashur, Ishtar, Anu, and Sin). The cuneiform
  inscription is a text of a version of the King's annals and narrates his campaign in chronological
  order, concluding with a description of the battle of Qarqar in 853 BCE against a large
  coalition led by the kings of Damascus and Hamath. Neo-Assyrian Period, reign of Shalmaneser
  III, circa 852 BCE. From Kurkh, Diyarbakir, modern-day Turkey. British Museum.
