description: >-
  Originally at Persepolis, the Treasury Reliefs are now in the National Archaeological Museum,
  Tehran. From left to right: Darius (who never reigned); the Persian King, Xerxes, on his
  throne; a pair of incense burners; the commander of the royal bodyguard; and a pair of Persian
  guards.
