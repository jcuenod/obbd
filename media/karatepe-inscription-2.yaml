title: Karatepe Azatiwada inscription Luwian text 5253.jpg
caption: Hieroglyphic Luwian text of the Azatiwada bilingual, Karatepe-Aslantaş.
description: >-
  The Karatepe bilingual (8th century BC), also known as the Azatiwada inscription, is a bilingual
  inscription on stone slabs consisting of Phoenician and Luwian text each, which enabled
  the decryption of the Anatolian hieroglyphs. One of a set of pictures, not trying to cover
  the whole, and with attention mainly of the Luwian hieroglyphs (only one picture of the
  Phoenician side).
