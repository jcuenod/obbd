description: >-
  The so-called "Nabonidus Chronicle". Nabonidus's faults and absence were recorded on this
  clay tablet alongside events of his reign. By the autumn of 539 BCE, Babylon had surrendered
  to the army of king Cyrus to become part of the growing Achaemenid Empire. From Babylon,
  Iraq, 530-400 BCE. British Museum, London.
