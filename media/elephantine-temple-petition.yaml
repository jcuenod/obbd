title: Elephantine Temple reconstruction request.gif
caption: >-
  Aramaic papyrus of the petition from Jedaniah and the priests of Elephantine to Bagavahya,
  governor of Judah, 407 BCE.
description: >-
  A letter from the Elephantine Papyri, a collection of 5th century BCE writings of the Jewish
  community at Elephantine in Egypt. Authors are Yedoniah and his colleagues the priests and
  it is addressed to Bagoas, governor of Judah. The letter is a request for the rebuilding
  of a Jewish temple at Elephantine, which had been destroyed by Egyptian pagans. The letter
  is dated year 17 of king Darius (II) under the rule of the satrap of Egypt Arsames, which
  corresponds to 407 BCE.
