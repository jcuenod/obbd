description: >-
  A Canaanite ivory inlay plaque, discovered at Megiddo and dates to 1350–1150 BCE (Late Bronze
  Age). Both the scenes and the design are influenced by Egyptian art. The plaque is a fragment
  of a larger work that didn't completely survive. The surviving fragment depicts parts of
  two scenes. On the right, a victorious ruler returns from battle, riding in his chariot.
  Above him is a winged sun disk—a symbol of divine blessing. Two naked prisoners of war,
  bound in chains, walk ahead of the chariot, preceded by a warrior leading the procession.
