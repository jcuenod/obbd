title: Syrians bringing presents in the tomb of Rekhmire. Animals of all kind.jpg
caption: Syrian tribute bearers in the transverse hall of the tomb of Rekhmire (TT100).
description: "Detail from the scene from the transverse hall (left side). The tribute of foreign\
  \ people. Rekhmire receives tribute on behalf of the king from various foreign countries.\
  \ In the middle register, ebony, leopard skins, dogs, giraffe, ivory, and other animals\
  \ from Nubia. In the fourth register, are people from Retenu (Syria - Palestine). All men\
  \ have very fair skin and wear the same long white robe. They bring brown bear and an elephant.\
  \ In the bottom register, are Nubian and Syrian captives. Here the women are dressed in\
  \ bell-shaped dresses. They are accompanied by children. 18th dynasty, Sheik "
