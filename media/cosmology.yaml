caption: >-
  Relief on the Tablet of Shamash from Sippar, showing the sun god enthroned above the heavenly
  waters, 9th century BCE (British Museum, London).
description: >-
  Relief image on the Tablet of Shamash, British Library room 55. Found in Sippar (Tell Abu
  Habbah), in Ancient Babylonia ; it dates from the 9th century BC and shows the sun god Shamash
  on the throne, in front of the Babylonian king Nabu-apla-iddina (888-855 BC) between two
  interceding deities. The text tells how the king made a new cultic statue for the god and
  gave privileges to his temple.
