description: >-
  Reconstruction of an ancient Israelite horned altar (based upon the remnants of the original
  one) as it was used to sacrifice animals. The original altar was probably dismantled during
  the time of Hezekiah, the King of Judah, with the centralization of the Israelite cult in
  the temple of Jerusalem. Location: Tel Be'er Sheva.
