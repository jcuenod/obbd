title: Shema Seal (Replica).jpg
caption: >-
  Bronze cast replica of the Seal of Shema, servant of Jeroboam, made in the early 20th century;
  the original jasper seal from Megiddo is lost.
description: >-
  A bronze cast replica of the Shema Seal, c. early 20th century. The original was made in
  the 8th century BCE for Shema, a servant of King Jeroboam II, found by archaeologist Gottlieb
  Schumacher and his team in Megiddo in 1904 and sent to Constantinople, where it was lost.
  Size: 85.2 x 61.2 mm; weight: 158.43 grams. In the Cherrygarden collection, ex Schulman
  b.v. (Veiling E-04, Lot 2205).
