description: >-
  Portion of a photographic reproduction of the Great Isaiah Scroll, the best preserved of
  the biblical scrolls found at Qumran. It contains the entire Book of Isaiah in Hebrew, apart
  from some small damaged parts. This manuscript was probably written by a scribe of the Jewish
  sect of the Essenes around the second century BC. It is therefore over a 1000 years older
  than the oldest Masoretic manuscripts.This picture shows all of Isaiah 53 (and is mostly
  identical to the Masoretic version).
