description: >-
  This is the Sumerian King List, an ancient stone tablet listing cities in Sumer and its
  neighbouring regions, their rulers and the length of their reigns. It contains a reference
  to the flood myth and mythological origins of Kingship, with the details of the later kings
  listed on the tablet having more realistic reigns than the excessively long ones of the
  earlier entries. The artefact is a prism, with its cuneiform writing in the Sumerian language.
