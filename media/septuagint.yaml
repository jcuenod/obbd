description: >-
  The John Rylands University Library holds one of the richest and most wide-ranging papyrus
  collections in Britain, including religious, devotional, literary and administrative texts.
  The images show some of the highlights of the * Greek papyri, numbering approximately 2,000
  items, include the famous fragments of St John's Gospel and Deuteronomy, the earliest surviving
  pieces of the New Testament and the Greek Old Testament respectively.
