title: Edwin Smith Papyrus v2.jpg
caption: The Edwin Smith surgical papyrus, hieratic, c. 1600 BCE (New York Academy of Medicine).
description: >-
  The Edwin Smith papyrus, the world's oldest surviving surgical document. Written in hieratic
  script in ancient Egypt around 1600 B.C., the text describes anatomical observations and
  the examination, diagnosis, treatment, and prognosis of 48 types of medical problems in
  exquisite detail. Among the treatments described are closing wounds with sutures, preventing
  and curing infection with honey and moldy bread, stopping bleeding with raw meat, and immobilization
  of head and spinal cord injuries. Translated in 1930, the document reveals the sophistication
  and practicality of ancient Egyptian medic
