caption: >-
  Old Assyrian debt-note for silver with its sealed clay envelope, 19th century BCE (Museum
  of the Ancient Orient, Istanbul).
description: >-
  Clay tablet and its stamped envelop. Legal debt-note on silver. A debt of 2/3 minas and
  7 1/4 shekels of silver (218 grams) owed by the couple of "Halus and Asue" to be paid to
  the creditor by the "Sa Parka" festival. The envelope is stamped with the seals of the witnesses
  and debtors. Old Assyrian dialect. Assyrian Colony Period, 19th century BCE. Ancient Orient
  Museum, Istanbul, Turkey.
