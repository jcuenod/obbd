description: >-
  VESPASIAN. 69-79 AD. Æ Sestertius (26.30 gm). "Judaea Capta" issue. Struck 71 AD. IMP CAES
  VESPASIAN AVG P M TR P P P COS III, laureate head right / IVDEA [CAPTA], S C in exergue,
  Jewess in attitude of mourning, seated left beneath palm tree; to right, captive Jew with
  hands tied behind back standing left; captured weapons behind. RIC II 426; BMCRE 542; BN
  494; Cohen 238. Good Fine, reddish brown patina, spotty surfaces, roughness on reverse.
