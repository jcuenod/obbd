title: >-
  Passover potsherd from Elephantine, Egypt circa 475 BCE, housed at the Ashmolean Museum,
  Oxford.jpg
caption: >-
  Aramaic ostracon from Elephantine mentioning Passover, 5th century BCE (Ashmolean Museum,
  Oxford).
description: >-
  This letter, written in Aramaic on a potsherd (ostraca), contains one of the earliest known
  references to the Jewish festival of Passover. It comes from the 5th century BCE settlement
  of Elephantine, Egypt, home to a thriving Jewish community. Clay potsherds were a cheap
  alternative to papyrus and ideal for writing short messages. Passover commemorates the escape
  of the Israelites from slavery in Egypt, led by Moses through the wilderness back to the
  land of Canaan.
