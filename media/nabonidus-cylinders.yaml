description: >-
  This terracotta cylinder records, in 3 columns, the building operations done by Nabonidus,
  including the restoration of the temple of the God Shamash at Larsa. Probably from Larsa,
  southern Mesopotamia. Neo-Babylonian period, 555-539 BCE. The British Museum, London.
