title: Atargatis, Nabatean, c.100 AD, Jordan Archaeological Museum.jpg
caption: >-
  Relief bust of Atargatis from the Nabataean temple at Khirbet et-Tannur, c. 100 CE (Jordan
  Archaeological Museum, Amman).
description: >-
  This statue comes from the Nabatean temple at Khirbet Tannur. Atargatis, the "Syrian Goddess"
  (Lucian, De Syria Dea) was a vegetation goddess, responsible for the fertility of the land,
  and perhaps the sea as well; her dolphin is a puzzling attribute, which appears on other
  representations, although not on this one. Here, the goddess emerges from a profusion of
  vines, fruits, and other vegetation. Her head is crowned by an eagle, symbol of the Edomite
  god, Qos (Taylor, p. 122).[1]
