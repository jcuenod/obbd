# Canonical book identifiers used in all scripture references.
#
# `id` is the OSIS book ID and is what appears in entry YAML (e.g. "2Kgs 18:13-19:37").
# `sbl` is the SBL Handbook of Style abbreviation used for display.
# `chapters` is the maximum chapter number accepted by the validator. Where English
# and Hebrew (MT) chapter divisions differ (Joel, Malachi), the larger count is used.
# Default versification is English (NRSV); see docs/data-model.md.
#
# corpus: ot | dc (deuterocanonical/apocrypha) | pseud (pseudepigrapha) | nt
