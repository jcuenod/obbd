# Geopolitical guide labels for the site map (dist/site/map.html).
#
# These are LABEL ANCHORS, not borders: each region is drawn as a name placed at
# `at` [lat, lon], shown only while the selected period overlaps [from, to].
# Years are historical (negative = BCE) and deliberately approximate; they say when
# the name is a sensible label for the area, not exact founding or conquest dates.
#
# tier: 1 = empire / great land (large, faint, shown zoomed out)
#       2 = land / kingdom / province
#       3 = small kingdom (Levantine states)
#       4 = district or small feature (shown zoomed in)
# kind: land (default) | water
# entry: optional OBBD entry id the label links to
#
# STATUS: first-pass draft (2026-11-23), anchors and dates need scholarly review.

periods:
  - {id: mba,      label: "Middle Bronze Age (c. 2000–1550 BCE)",   from: -2000, to: -1550}
  - {id: lba,      label: "Late Bronze Age (c. 1550–1200 BCE)",     from: -1550, to: -1200}
  - {id: iron1,    label: "Iron Age I (c. 1200–1000 BCE)",          from: -1200, to: -1000}
  - {id: iron2a,   label: "Early monarchies (c. 1000–850 BCE)",     from: -1000, to: -850}
  - {id: iron2b,   label: "Israel and Judah (c. 850–722 BCE)",      from: -850,  to: -722}
  - {id: assyria,  label: "Assyrian domination (722–612 BCE)",      from: -722,  to: -612}
  - {id: babylon,  label: "Neo-Babylonian (612–539 BCE)",           from: -612,  to: -539}
  - {id: persia,   label: "Persian (539–332 BCE)",                  from: -539,  to: -332}
  - {id: hellen,   label: "Hellenistic (332–63 BCE)",               from: -332,  to: -63}
  - {id: roman,    label: "Roman (63 BCE–135 CE)",                  from: -63,   to: 135}
default_period: iron2b

