editorial:
  author_notes:
  - >-
    Explain the elliptical self-curse syntax: ʾim 'if' introduces a negative oath and ʾim
    lōʾ 'if not' a positive one, with the curse left unstated.
  - >-
    Akkadian parallels include oaths 'by the life (nīš) of the god/king' and exculpatory oaths
    'before the god' in Old Babylonian law collections (cf. Exod 22:10-11).
  - >-
    The hand under the thigh (genitals) probably invokes progeny or ancestors. Raising the
    hand (Gen 14:22; Exod 6:8; Deut 32:40) is the usual oath gesture.
