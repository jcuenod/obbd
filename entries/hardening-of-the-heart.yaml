  role: primary
external: {}
editorial:
  author_notes:
  - >-
    The three verbs are unevenly distributed. Source critics usually assign ḥzq to P and kbd
    to J, with qšh rare (Exod 7:3). Mention the source-critical patterns briefly.
  - >-
    The Egyptian background (a heart heavy with wrongdoing fails the weighing; Currid, Hoffmeier)
    is a proposal, not a consensus. Present it as an attractive but debated reading.
  - >-
    The wordplay on kbd ("heavy" heart; YHWH "gains glory") is secure in the Hebrew and does
    not depend on the Egyptian proposal.
  - >-
    Theological debates (divine determinism versus pharaoh's agency) lie outside the background
    scope. Note them only briefly.
  sources_to_check:
  - Currid, Ancient Egypt and the Old Testament (1997)
  image_query: Papyrus of Ani weighing of the heart
