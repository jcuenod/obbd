id: hardening-of-the-heart
title: Hardening of Pharaoh's Heart
aliases: [Hardening of Pharaoh's heart]
type: concept
cultures: [egyptian, hebrew]
scope: >-
  The motif in Exod 4-14 of pharaoh's heart being made "strong" (ḥzq), "heavy" (kbd), or "hard"
  (qšh), whether by YHWH or by pharaoh himself. The entry covers the proposal that the "heavy
  heart" plays on the Egyptian judgment scene, where the deceased's heart is weighed against
  maat.
passages:
- ref: Exod 4:21
  rel: concept
  note: YHWH announces he will make pharaoh's heart strong (ḥzq)
- ref: Exod 7:14
  rel: polemic
  disputed: true
  note: Pharaoh's heart is 'heavy' (kābēd); proposed play on the Egyptian weighing of the
    heart
- ref: Exod 8:15
  rel: language
  note: Pharaoh makes his own heart heavy (hikbîd); MT 8:11
- ref: Exod 9:34
  rel: language
  note: Pharaoh again makes his heart heavy after the hail
- ref: Exod 10:1
  rel: language
  note: YHWH has made pharaoh's heart heavy
- ref: Exod 14:4, 17
  rel: language
  note: YHWH 'gains glory' (ʾikkābĕdâ, root kbd) over pharaoh
- ref: Prov 21:2
  rel: concept
  note: YHWH weighs the heart
related: [book-of-the-dead, ten-plagues-and-egyptian-gods, egyptian-kingship, maat, exodus-historical-questions,
  mighty-hand-outstretched-arm]
