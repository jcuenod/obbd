editorial:
  author_notes:
  - >-
    The usual identification is ʿAin el-Qudeirat, with nearby ʿAin Qedeis preserving the name.
    Cohen's excavations (1976-82) uncovered three superimposed Iron Age fortresses.
  - >-
    There are no Late Bronze remains, which features in discussions of the exodus. Caution
    against arguments from silence in both directions.
  - >-
    The date of the earliest (oval) fortress is debated, tenth century (Cohen) or later (Finkelstein
    and others). The latest fortress is seventh to sixth century and produced Hebrew ostraca
    with hieratic numerals.
  - Do not confuse it with Kadesh on the Orontes (the Egyptian-Hittite battle).
  sources_to_check:
  - >-
    Cohen and Bernick-Greenberg, Excavations at Kadesh Barnea (Tell el-Qudeirat) 1976-1982
    (IAA Reports 34, 2007)
