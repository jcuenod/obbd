editorial:
  author_notes:
  - >-
    Pseudepigraphic. Most scholars date it c. 150-100 BCE; some argue earlier. It shows anachronisms
    (e.g. Demetrius of Phalerum's role).
  - >-
    Distinguish the legend (72 translators in 72 days; later the miraculous agreement in Philo,
    Mos. 2.25-44) from the probable historical kernel: a 3rd-century Alexandrian translation
    of the Pentateuch.
  - >-
    Josephus paraphrases much of it (Ant. 12.11-118). Present debates on its purpose (apologetic,
    defence of the translation's authority against revisions).
