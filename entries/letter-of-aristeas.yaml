  note: People's assent to the book of the covenant
- ref: Deut 4:2
  rel: concept
  note: No adding or subtracting; curse on altering the translation (Arist. 311)
- ref: Lev 11:1-47
  rel: practice
  note: Allegorical defence of the food laws (Arist. 128-171)
- ref: Exod 25:23-30
  rel: realia
