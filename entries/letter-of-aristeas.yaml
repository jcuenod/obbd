  circa: true
  display: c. 200–100 BCE
scope: >-
  A Greek Jewish work presented as a letter by a courtier of Ptolemy II Philadelphus. It narrates
  the translation of the Jewish Law into Greek by seventy-two Jerusalem elders, with a description
  of Jerusalem and its temple, an apologetic account of the food laws, and a symposium.
