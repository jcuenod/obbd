id: dreams-and-dream-interpretation
title: Dreams and Dream Interpretation
type: practice
cultures: [egyptian, babylonian, assyrian, amorite]
scope: >-
  Dreams as a medium of divine communication in the ancient Near East: message dreams to kings,
  symbolic dreams needing expert interpretation, dream books, and dream reports at Mari. The
  entry also covers the biblical evaluation of dreams from Genesis to Daniel and Matthew.
