editorial:
  author_notes:
  - >-
    Oppenheim's typology (message dreams versus symbolic dreams, and the dream-report form)
    remains standard (Oppenheim, The Interpretation of Dreams in the Ancient Near East, TAPS
    46/3, 1956).
  - >-
    The Egyptian dream book (P. Chester Beatty III, New Kingdom) and the Assyrian dream book
    (Ziqīqu) list dream omens. Joseph's interpretations rely on divine revelation, not manuals
    (Gen 40:8; 41:16). This contrast is often noted.
  - >-
    Royal dream reports include Gudea, Thutmose IV's Dream Stele, Hattusili III, Ashurbanipal,
    and Nabonidus. Mari letters report dreams by non-specialists.
  - >-
    Gen 41:8 ḥarṭōm is a secure Egyptian loanword. Many (e.g. Redford) place several Egyptian
    names and terms in the Joseph story in the first millennium, which is relevant to dating.
    This is debated.
  sources_to_check:
  - Kasia Szpakowska, Behind Closed Eyes (2003)
  - Frances Flannery-Dailey, Dreamers, Scribes, and Priests (2004)
