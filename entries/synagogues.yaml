editorial:
  author_notes:
  - >-
    Origins debated (exilic, Hellenistic Egypt, Judean town gate). The earliest firm evidence
    is 3rd-century BCE proseuchē dedications from Ptolemaic Egypt.
  - >-
    Pre-70 buildings: Gamla, Masada, Herodium, Magdala, Qiryat Sefer, Modiʿin, among others.
    The white-limestone Capernaum synagogue is late antique, built over an earlier basalt
    structure.
  - >-
    Avoid retrojecting later rabbinic liturgy. Reading and teaching Torah are the best-attested
    functions; the prominence of prayer is debated.
  sources_to_check:
