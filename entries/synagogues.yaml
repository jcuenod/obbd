id: synagogues
title: Synagogues in the Late Second Temple Period
type: realia
cultures: [jewish]
scope: >-
  Jewish assembly buildings and institutions (synagōgē, proseuchē) before 135 CE. The entry
  covers their debated origins, the excavated pre-70 buildings in the land of Israel and the
  diaspora, and their functions of scripture reading, teaching, and community life as reflected
  in the New Testament.
