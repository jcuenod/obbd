id: amulets
title: Amulets
aliases: [Charms, Phylacteries]
type: realia
cultures: [egyptian, judahite, phoenician, assyrian]
scope: >-
  Protective objects worn on the body or placed in homes and tombs, from Egyptian-style amulets
  common in Iron Age Judah to inscribed silver scrolls and Mesopotamian anti-demon amulets.
  The entry covers biblical references to charms, crescents and the binding of words on hand
  and forehead.
