editorial:
  author_notes:
  - >-
    Egyptian and Egyptianizing amulets (wedjat eye, Bes, Pataikos, scarabs) are very common
    in Iron Age Judahite tombs. They show ordinary piety, not marginal 'syncretism'. C. Herrmann
    has catalogued them.
  - >-
    The Ketef Hinnom silver scrolls quote a form of Num 6:24-26. The late Iron Age date favoured
    by Barkay et al. (BASOR 334, 2004) is accepted by most; a minority argue for a later date.
  - >-
    Many read Deut 6:8 as metaphorical in origin, later literalized in tefillin (Qumran examples).
    The etymology of ṭôṭāpōt is uncertain.
  - Use the Arslan Tash incantation plaques with caution, as their authenticity is disputed.
