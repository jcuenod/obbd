editorial:
  author_notes:
  - >-
    The classic laments (Ur; Sumer and Ur; Nippur; Eridu; Uruk) are Isin-period compositions
    tied to temple rebuilding; the first-millennium balag and eršemma laments provide a possibly
    more direct chronological bridge to Lamentations.
  - >-
    McDaniel (1968) doubted direct influence on Lamentations; Dobbs-Allsopp (1993) argued
    for a native Israelite city-lament genre with comparable motifs. Present the comparison
    as generic and typological.
  - >-
    Divine abandonment of a city is a widespread Mesopotamian theme (also in Esarhaddon's
    Babylon inscriptions and the Marduk Prophecy) relevant to Ezekiel's departing glory (Block;
    Bodi).
