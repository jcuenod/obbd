- ref: Lam 1-5
  rel: form
  note: Communal lament over a destroyed city and sanctuary
- ref: Lam 1:1-2, 16
  rel: imagery
  note: City personified as a weeping woman; cf. the goddess weeping for her city
- ref: Lam 2:1-8
  rel: concept
  note: The deity as enemy who destroys his own city and temple
- ref: Ezek 10:18-19; 11:22-23
  rel: concept
  note: Divine abandonment of the temple before its destruction
- ref: Ps 74:1-11
  rel: form
