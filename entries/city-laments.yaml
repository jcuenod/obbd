scope: >-
  The five Sumerian city laments composed after the collapse of the Ur III state (c. 2004
  BCE), mourning the destruction of cities and temples by divine decree, the gods' abandonment
  of their shrines, and the hope of restoration. The entry also notes the later balag and
  eršemma liturgical laments.
