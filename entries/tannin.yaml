editorial:
  author_notes:
  - >-
    Ugaritic tnn appears among foes defeated by Anat and Baal (KTU 1.3 III) and as muzzled
    by a deity (KTU 1.83); give the cognate evidence.
  - >-
    Gen 1:21's naming of the tanninim as created beings is widely read as demythologizing;
    avoid overstating it as explicit polemic.
  - Ezek 29:3 MT tannîm is commonly read tannîn; note textual issues.
  - >-
    LXX usually renders tannin as drakōn, the background for the dragon of Revelation and
    of Bel and the Dragon.
  sources_to_check:
