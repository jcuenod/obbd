id: cyrus-cylinder
title: Cyrus Cylinder
type: artifact
cultures: [persian, babylonian]
date:
  from: -539
  to: -538
  circa: true
  display: c. 539–538 BCE
scope: >-
  Inscribed clay barrel cylinder in Akkadian cuneiform, found at Babylon in 1879, issued in
  the name of Cyrus II after his capture of Babylon in 539 BCE. It presents Cyrus as chosen
  by Marduk to replace the impious Nabonidus and records the return of divine images and displaced
  peoples to their sanctuaries.
passages:
- ref: Isa 44:28-45:7
  rel: concept
  note: Cyrus called by name and his hand grasped by the deity; cf. Marduk choosing Cyrus
- ref: Ezra 1:1-4
  rel: parallel
  note: Cyrus's decree permitting return and temple rebuilding; comparable restoration policy
- ref: Ezra 6:3-5
  rel: parallel
  note: Aramaic memorandum of Cyrus on rebuilding the Jerusalem temple
- ref: 2Chr 36:22-23
  rel: parallel
  note: Cyrus charged by the God of heaven to build him a house
- ref: Ezra 1:7-11
  rel: practice
  note: Return of temple vessels; cf. the Cylinder's return of divine images to their shrines
- ref: Dan 5:30-31
  rel: event
  note: Fall of Babylon; Daniel assigns the kingdom to Darius the Mede (5:31 = MT 6:1)
related: [cyrus-the-great, fall-of-babylon-539, nabonidus-chronicle, verse-account-of-nabonidus,
  marduk, persian-imperial-authorization, babylon]
