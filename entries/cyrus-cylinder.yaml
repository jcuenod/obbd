editorial:
  author_notes:
  - >-
    Present the text as a Babylonian royal building inscription in Mesopotamian tradition
    (it even cites an inscription of Ashurbanipal), written to legitimate Cyrus before a Babylonian
    audience.
  - >-
    Correct the popular claim that it is a 'charter of human rights'; the restorations it
    describes are pragmatic imperial policy toward Mesopotamian cult centres.
  - >-
    The Cylinder does not mention Judah, Jerusalem, or Jews. The link to Ezra 1 is an analogy
    of policy, not direct attestation of the biblical decree.
  - >-
    Note the debate over the authenticity of Ezra's decrees: the Aramaic memorandum (Ezra
    6:3-5) is more often defended than the Hebrew edict (Ezra 1:2-4).
  - >-
    Mention the joined Yale fragment and the cuneiform tablet copies of the same text identified
    in the British Museum in 2010.
  sources_to_check:
