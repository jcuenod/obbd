id: jehoiachin-ration-tablets
title: Jehoiachin's Ration Tablets
aliases: [Jehoiachin's Rations Tablets, Babylonian ration lists]
type: artifact
cultures: [babylonian]
date:
  from: -595
  to: -570
  circa: true
  display: c. 595–570 BCE
scope: >-
  Administrative cuneiform tablets from Nebuchadnezzar II's palace in Babylon listing oil
  rations for foreign dependants. They include "Yaʾukin, king of the land of Yahudu", his
  five sons, and other Judeans, and are direct evidence for the exiled king's maintenance
  at the Babylonian court.
passages:
