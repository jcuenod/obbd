editorial:
  author_notes:
  - >-
    Excavated in the Southern Palace at Babylon by Koldewey's expedition and published by
    Weidner (1939). One relevant text is dated to Nebuchadnezzar's 13th year (592/591); verify
    the date range of the group.
  - >-
    The tablets predate Amel-Marduk's release of Jehoiachin (2 Kgs 25:27; 562) by about three
    decades and show he was provisioned and still titled 'king' early in his exile; discuss
    how this fits 'released from prison'.
  - >-
    Other recipients (from Ashkelon, Egypt, Ionia, Lydia, etc.) illustrate the cosmopolitan
    court of Babylon.
  sources_to_check:
