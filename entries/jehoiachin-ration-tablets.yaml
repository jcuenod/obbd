  rel: attests
  note: >-
    Allowance at the Babylonian court after 562; the tablets show royal rations already c.
    592
- ref: Jer 52:31-34
  rel: attests
  note: Jehoiachin's regular allowance from the king of Babylon
- ref: 2Kgs 24:12, 15
  rel: attests
  note: Jehoiachin and his household taken to Babylon in 597
- ref: 1Chr 3:17-18
  rel: attests
  note: Sons of Jehoiachin; the tablets list five sons of the king of Judah
- ref: Ezek 1:2
  rel: setting
  note: Exilic dating by King Jehoiachin's exile
