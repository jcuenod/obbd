editorial:
  author_notes:
  - >-
    Correct the common label 'boundary stone'. Most kudurrus were set up in temples, with
    copies on clay, and were not field markers; Slanski calls them 'entitlement narûs'.
  - >-
    The divine symbols (sun disk, crescent, star, spade of Marduk, etc.) place the grant under
    the gods' protection; avoid treating them as an early zodiac.
  - >-
    The curses (no heir, disease, loss of name) are close in form to biblical and treaty curses;
    useful for Deut 27-28.
  - >-
    The biblical landmark laws concern ordinary field markers; the connection with kudurrus
    is the shared protection of land tenure by divine sanction.
  sources_to_check:
