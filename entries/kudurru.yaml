scope: >-
  Inscribed stone monuments from Kassite and post-Kassite Babylonia recording royal land grants,
  tax exemptions, and property settlements, carved with divine symbols and protected by elaborate
  curses. The entry covers the object type, its imagery, and its curse formulae.
