editorial:
  author_notes:
  - >-
    The "Reed Sea" rendering rests on sûp = Egyptian ṯwf (papyrus or reeds). But several passages
    clearly mean the Gulf of Suez or the Gulf of Aqaba (1 Kgs 9:26), so "Red Sea" is not simply
    a mistranslation. Batto argued for a mythic "Sea of End/Extinction" reading.
  - >-
    Candidate crossing sites include the Lake Menzaleh/Ballah area, Lake Timsah, the Bitter
    Lakes, and the Gulf of Suez. Hoffmeier's palaeo-environmental work on the northern Sinai
    lagoons is relevant. No location can be confirmed.
  - >-
    The P strand of Exod 14 speaks only of "the sea". The term Yam Suph appears in the Song
    of the Sea and in itinerary and Deuteronomistic texts.
  - >-
    Popular claims of a Gulf of Aqaba crossing at Nuweiba with "chariot wheels" on the seabed
    (Ron Wyatt and successors) are pseudo-archaeology. Mention them only as misconceptions.
  sources_to_check:
  - Batto, 'The Reed Sea. Requiescat in Pace', JBL 102 (1983)
  - Hoffmeier, Ancient Israel in Sinai (2005)
