id: yam-suph
title: Yam Suph ("Red Sea"/"Reed Sea")
aliases: [Red Sea, Reed Sea, Sea of Reeds]
type: site
cultures: [egyptian, hebrew]
scope: >-
  The Hebrew yam sûp, traditionally the "Red Sea" (following the Septuagint's erythra thalassa)
  and often rendered "Reed Sea". It names the sea of the exodus crossing as well as the Gulfs
  of Suez and Aqaba. The entry covers the term's meaning, its biblical uses, and the debate
  over the crossing's location.
