id: murashu-archive
title: Murašû Archive
aliases: [Murašû archive, Murashu Sons]
type: text
cultures: [babylonian, persian]
date:
  from: -454
  to: -404
  circa: true
  display: c. 454–404 BCE
scope: >-
  The business archive of the Murašû family firm of Nippur under Artaxerxes I and Darius II,
  recording the management and financing of land-for-service holdings. It names the Kebar
  canal and includes West Semitic, among them Judean, clients, and is a key source for Persian-period
  Babylonia.
passages:
- ref: Ezek 1:1, 3; 3:15
  rel: setting
  note: Kebar canal (nār kabari) near Nippur, named in Murašû texts
- ref: Neh 5:4
  rel: practice
  note: Borrowing against fields and vineyards to pay the king's tax
- ref: Ezra 4:13
  rel: practice
  note: Persian levies (tribute, poll-tax, land-tax) on imperial subjects
- ref: Ezra 8:15-17
  rel: setting
  note: Judean communities remaining in Babylonia under Persian rule
