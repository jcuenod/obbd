editorial:
  author_notes:
  - >-
    Several hundred tablets found at Nippur by the University of Pennsylvania expedition (1893);
    dates run 454-404. The firm leased and financed ḫaṭru holdings of military colonists who
    owed service and taxes (Stolper).
  - >-
    Yahwistic names appear among the clients (Coogan; Zadok); Judeans appear as ordinary participants
    in the regional economy. Avoid fixed counts unless verified.
  - >-
    The Kebar canal identification links Ezekiel's setting to the Nippur region (also attested
    in the Āl-Yāhūdu corpus).
  sources_to_check:
  - >-
    M. W. Stolper, Entrepreneurs and Empire: The Murašû Archive, the Murašû Firm, and Persian
    Rule in Babylonia (1985)
  - M. D. Coogan, West Semitic Personal Names in the Murašû Documents (HSM 7, 1976)
  - R. Zadok, The Jews in Babylonia during the Chaldean and Achaemenian Periods (1979)
