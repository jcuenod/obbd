editorial:
  author_notes:
  - >-
    Hebrew ʾărārāṭ corresponds to Assyrian Urarṭu/Uruaṭri. The kingdom, which called itself
    Biainili, had its capital at Tushpa (Van). It spoke Urartian, a language related to Hurrian,
    and rivalled Assyria in the ninth to seventh centuries.
  - >-
    Gen 8:4 names a mountainous region. The identification with the volcano Ağrı Dağı ('Mount
    Ararat') is much later. Other traditions locate the landing at Jebel Judi (Syriac and
    Qurʾan), and Gilgamesh XI has Mount Nimush.
  - >-
    Correct claims of discovering the ark (e.g. the Durupınar formation) as pseudo-archaeology.
  - >-
    Urartu ended in the early sixth century, probably under Median or Scythian pressure (the
    details are debated).
  sources_to_check:
