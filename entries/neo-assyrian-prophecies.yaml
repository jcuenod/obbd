id: neo-assyrian-prophecies
title: Neo-Assyrian Prophecies
type: text
cultures: [assyrian]
date:
  from: -681
  to: -650
  circa: true
  display: c. 681–650 BCE
scope: >-
  The corpus of about thirty prophetic oracles, chiefly from prophets of Ishtar of Arbela,
  delivered to Esarhaddon and Ashurbanipal and preserved on archival collection tablets and
  reports from Nineveh. They are the closest ANE parallel to the "fear not" salvation oracles
  of Isaiah 40-55.
passages:
- ref: Isa 41:10
  rel: form
  note: '''Fear not, for I am with you'': salvation oracle (cf. Akk. lā tapallaḫ)'
- ref: Isa 41:13-14
  rel: form
  note: '''Fear not, worm Jacob, I will help you'''
- ref: Isa 43:1-5
  rel: form
  note: '''Fear not, for I have redeemed you; I am with you'''
- ref: Isa 44:2
  rel: imagery
  note: Deity who formed the addressee in the womb; Ishtar as the king's midwife and nurse
- ref: Isa 66:12-13
  rel: imagery
  note: Carried on the hip and comforted like a nursing child
- ref: 2Sam 7:8-16
  rel: concept
  note: Divine promise of protection and lasting rule to the chosen king
- ref: Jer 36:1-4
  rel: practice
  note: Oracles written down and collected for preservation
