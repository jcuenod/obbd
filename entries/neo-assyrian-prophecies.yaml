external: {}
editorial:
  author_notes:
  - >-
    SAA 9 gathers about 29 oracles on 11 tablets; prophets (raggimu/raggintu, maḫḫû) include
    women and persons of ambiguous gender. Collection tablets (e.g. SAA 9 1-3) show oracles
    being edited and archived, relevant to the formation of prophetic books.
  - >-
    The 'fear not' oracle (Begrich's Heilsorakel) is best paralleled here and in royal inscriptions
    (e.g. Zakkur); Deutero-Isaiah transfers the royal oracle to the people.
  - >-
    Much of the content legitimates Esarhaddon's contested succession, hence the links with
    the succession treaty.
  sources_to_check:
  - S. Parpola, Assyrian Prophecies (SAA 9, 1997)
  - >-
    M. Nissinen, Prophets and Prophecy in the Ancient Near East (SBLWAW 12, 2003; 2nd ed.
    2019)
