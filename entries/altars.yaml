cultures: [hebrew, canaanite]
scope: >-
  Altars for sacrifice and offering in Israel and the Levant: earthen and fieldstone altars,
  bronze-plated altars, the large stepped temple altar of Ezekiel's vision, and archaeological
  examples. The entry covers the biblical laws on construction and the contested history of
  altar legislation.
