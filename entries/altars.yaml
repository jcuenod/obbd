editorial:
  author_notes:
  - >-
    The Arad sanctuary altar (fieldstones and earth, about five cubits square) is often compared
    with Exod 20:25 and 27:1. The Beersheba horned altar of dressed stones contradicts Exod
    20:25. Use both to discuss the gap between law and practice.
  - >-
    The Mount Ebal structure (Zertal) is interpreted by some as an early Israelite altar and
    by others as a watchtower or farmstead. Present it as contested.
  - >-
    Ezekiel's harʾēl/ʾărîʾēl has been compared to the Mesha Stele's ʾrʾl (line 12) and to
    Akkadian terms. These links are debated.
  - >-
    The relationship between the altar law of Exod 20:24 ("in every place") and Deuteronomic
    centralization is a classic crux of pentateuchal criticism. Give it brief treatment.
