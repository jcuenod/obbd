editorial:
  author_notes:
  - >-
    Tablet II lists offences that may have caused the sufferer's affliction, mixing ethical
    wrongs (false scales, moving a boundary, entering a neighbour's house and approaching
    his wife, saying 'yes' for 'no', despising parents) with ritual faults. Quote from Reiner's
    edition and check line numbers.
  - >-
    The ritual (peeling an onion, unravelling wool, stripping dates and burning them) enacts
    the dissolving of the curse. Distinguish this ritual logic from the biblical sacrificial
    remedy for unwitting sin in Lev 4-5.
  - >-
    Composition is usually placed in the Middle Babylonian period; most copies are Neo-Assyrian
    and later. Say this in the article.
  - >-
    Compare and contrast with the Egyptian 'negative confession' (Book of the Dead 125) and
    Job 31. These are distinct genres with overlapping catalogues, not one form.
  sources_to_check:
  - >-
    E. Reiner, Šurpu: A Collection of Sumerian and Akkadian Incantations (AfO Beiheft 11,
    1958)
