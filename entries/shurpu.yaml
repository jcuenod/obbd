id: shurpu
title: Šurpu Incantation Series
aliases: [Šurpu, Burning]
type: text
cultures: [babylonian, assyrian]
date:
  from: -1400
  to: -1000
  circa: true
  display: c. 1400–1000 BCE
scope: >-
  The Akkadian incantation series Šurpu ("Burning"), a ritual of the exorcist (āšipu) that
  frees a sufferer from a curse or ban (māmītu) incurred through offences he may not know
  he committed. Its long catalogues of possible sins, ritual and ethical, are the main Mesopotamian
  parallel to biblical concern with unwitting and hidden sin. The anti-witchcraft ceremony
  Maqlû has its own entry.
passages:
- ref: Lev 4:2, 13-14
  rel: concept
  note: Sin committed unwittingly (bišgāgâ) that later becomes known
- ref: Lev 5:1-6
  rel: concept
  note: >-
    Guilt incurred through unnoticed impurity, an ignored adjuration, or a rash oath; confession
    required
- ref: Lev 5:17-19
  rel: concept
  note: Guilt offering for an offence committed without knowing
- ref: Ps 19:12
  rel: concept
  note: '''Who can detect their errors? Clear me from hidden faults'' (MT 19:13)'
- ref: Deut 27:15-26
  rel: parallel
  note: >-
    Curses on secret offences: parents dishonoured, boundaries moved, a neighbour struck in
    secret
- ref: Job 31:5-34
  rel: form
  disputed: true
  note: Oath of clearance listing possible offences; cf. Šurpu II's catalogue
- ref: Ezek 18:5-9
  rel: form
  disputed: true
  note: Catalogue of ethical and cultic acts defining the righteous man
