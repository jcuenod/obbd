cultures: [hebrew, phoenician, assyrian]
scope: >-
  The cherubim, winged composite guardian creatures of the Hebrew Bible who guard Eden, flank
  the ark, bear YHWH's throne and decorate the sanctuary. The entry covers their ANE iconographic
  background in winged sphinxes and guardian figures.
