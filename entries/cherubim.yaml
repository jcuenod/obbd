editorial:
  author_notes:
  - >-
    Mainstream view identifies the cherub with the Levantine winged sphinx (lion body, human
    head, wings), as on the Ahiram sarcophagus throne and Megiddo and Samaria ivories.
  - Etymology from Akkadian kāribu/kurību (intercessory genius) is common but debated.
  - Correct the later image of cherubs as winged infants (Renaissance putti).
  - >-
    Ezekiel's cherubim combine several iconographic types (Assyrian lamassu, four-winged genii,
    atlas figures); see the throne-chariot entry.
  sources_to_check:
