id: khirbet-el-qom-inscription
title: Khirbet el-Qom Inscription
type: artifact
cultures: [judahite]
date:
  from: -750
  to: -700
  circa: true
  display: c. 750–700 BCE
scope: >-
  A Hebrew tomb inscription from Khirbet el-Qom west of Hebron, blessing one Uriyahu 'by YHWH'
  and stating that he was saved from his enemies 'by his asherah'. An incised human hand appears
  below the text. The entry also covers the other inscriptions from the site's tombs.
passages:
- ref: Deut 16:21
  rel: practice
  note: Prohibition of an asherah beside YHWH's altar
- ref: 2Kgs 23:6
  rel: practice
  note: Josiah removes the asherah from YHWH's temple
- ref: 1Sam 15:13
  rel: language
  note: Blessing formula bārûk ... laYHWH 'blessed by YHWH'
- ref: Ps 18:3
  rel: parallel
  note: Calling on YHWH and being saved from enemies (MT 18:4)
related: [asherah, kuntillet-ajrud-inscriptions, bench-tombs, hebron, ketef-hinnom-amulets,
