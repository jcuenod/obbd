editorial:
  author_notes:
  - >-
    Found by W. G. Dever in 1967 after tomb robbers had been active. The text is badly incised
    over earlier lines, so readings vary widely. Compare Dever, Zevit, Hadley and Dobbs-Allsopp
    et al.
  - >-
    The phrase 'by his asherah' parallels Kuntillet ʿAjrud. Treat the two corpora together,
    but note that the el-Qom readings are less secure.
  - >-
    The function of the hand (apotropaic, or a memorial yād) is uncertain. Present suggestions
    as such.
