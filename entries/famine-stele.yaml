editorial:
  author_notes:
  - >-
    The stele is a Ptolemaic composition (probably 2nd century BCE) with an Old Kingdom setting.
    It is likely a priestly text supporting the Khnum temple's claims to revenue, possibly
    against the claims of Isis of Philae. It is not evidence for a historical famine under
    Djoser.
  - >-
    Because it postdates Genesis, it cannot be its source. The parallel reflects a shared
    tradition of seven-year famines and Nile failure. Compare also seven-year cycles of plenty
    and dearth in Mesopotamian and Ugaritic texts.
  - >-
    Do not use the stele to argue for the historicity of Joseph's famine. Use it to illustrate
    Egyptian anxieties about the inundation.
