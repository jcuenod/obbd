scope: >-
  A Ptolemaic-period rock inscription on Sehel Island near Aswan, set in the reign of Djoser
  (Third Dynasty). It tells of seven years of low Nile floods and famine, the king's consultation
  of Imhotep, and a dream in which Khnum promises renewed inundation. In gratitude Djoser
  grants revenues to Khnum's temple.
passages:
- ref: Gen 41:25-36
  rel: parallel
  note: Seven years of famine tied to the Nile and announced in a royal dream
- ref: Gen 41:1-8
  rel: parallel
  note: Troubled pharaoh seeks an interpreter (cf. Djoser and Imhotep)
- ref: Gen 47:22, 26
  rel: practice
  note: Temple land and grain levies in Egypt; cf. the stele's grant to Khnum
related: [khnum, nile, dreams-and-dream-interpretation, dream-stele, elephantine]
