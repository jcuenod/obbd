id: david
title: 'David: Historical Questions'
type: person
cultures: [hebrew]
date:
  from: -1010
  to: -970
  circa: true
  display: c. 1010–970 BCE
scope: >-
  The historical questions surrounding David: the extrabiblical evidence (the Tel Dan Stele's
  'House of David', a disputed reading in the Mesha Stele), the archaeology of 10th-century
  Jerusalem and the Shephelah, and the debate over the scale of his kingdom. It does not cover
  David's literary portrayal as such.
