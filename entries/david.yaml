editorial:
  author_notes:
  - >-
    The Tel Dan Stele (c. 840-800) shows a dynasty named after David about 150 years later.
    It is the only secure extrabiblical evidence. Mesha line 31 and the Shoshenq list's proposed
    'heights of David' are disputed readings.
  - >-
    Present the positions on 10th-century Judah and Jerusalem: the high chronology (Mazar,
    Garfinkel), the low chronology (Finkelstein), and modified positions. Cover the Stepped
    Stone Structure and E. Mazar's 'Large Stone Structure'.
  - >-
    Khirbet Qeiyafa: its fortification, the ostracon, and the debate over whether it is Judahite
    or Philistine-related.
  - >-
    Dates are conventional (c. 1010-970) and derived from biblical numbers. Do not imply precision.
