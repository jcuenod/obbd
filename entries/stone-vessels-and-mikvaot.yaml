editorial:
  author_notes:
  - >-
    Stone vessels: chalk workshops near Jerusalem (e.g. Ḥizma, Mount Scopus) and in Galilee
    (Reina, ʿEinot Amitai). Their distribution marks Jewish settlement; the rationale appears
    later in m. Kelim 10:1 and m. Parah 3:2.
  - >-
    Miqvaʾot appear from the late 2nd or early 1st century BCE. Do not read later rabbinic
    specifications (40 seʾahs, ʾotsar) back into all early pools.
  - >-
    John 2:6's 'two or three measures' (metrētai) per jar fits the large lathe-turned stone
    jars known archaeologically.
