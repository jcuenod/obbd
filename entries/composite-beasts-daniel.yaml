editorial:
  author_notes:
  - >-
    Present the main proposals: Šumma izbu omens of anomalous births (Porter 1983); Mesopotamian
    glyptic and monumental hybrids; Cumont's astral geography for the ram and goat; Canaanite
    sea-chaos background (Gunkel, Emerton, Collins).
  - >-
    Avoid one-to-one mapping between Daniel's beasts and specific reliefs. The 2nd-century
    author more likely drew on a broad, mediated stock of motifs.
  - >-
    Note how the hybrid, monstrous form serves the theological evaluation of empires as chaotic.
  sources_to_check:
