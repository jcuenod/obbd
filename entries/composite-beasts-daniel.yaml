id: composite-beasts-daniel
title: Composite Beasts in Daniel and Mesopotamian Iconography
type: concept
cultures: [jewish, mesopotamian]
scope: >-
  The hybrid creatures of Daniel's visions (winged lion, bear, four-headed leopard, iron-toothed
  beast, ram, and goat) and their possible backgrounds. The entry covers Mesopotamian composite
  iconography, anomalous-birth omens (Šumma izbu), astral geography, and West Semitic sea-chaos
  myth.
passages:
- ref: Dan 7:2-8
  rel: imagery
  note: Four hybrid beasts rising from the stirred-up sea
- ref: Dan 7:4
  rel: imagery
  note: Lion with eagle's wings; cf. Mesopotamian winged lions
- ref: Dan 8:3-12
  rel: imagery
  note: Two-horned ram and one-horned goat; astral-geographic readings proposed
- ref: Ezek 1:5-14
  rel: imagery
  note: Composite living creatures in prophetic vision
- ref: Rev 13:1-2
  rel: imagery
  note: Composite sea beast reworking Dan 7
