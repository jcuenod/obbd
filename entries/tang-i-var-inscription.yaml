id: tang-i-var-inscription
title: Tang-i Var Rock Inscription of Sargon II
type: artifact
cultures: [assyrian]
scope: >-
  Sargon II's rock inscription at Tang-i Var in western Iran, which recounts the Ashdod rebellion
  and the extradition of its leader Yamani by the Kushite ruler Shebitku. It illuminates relations
  among Assyria, Philistia, and Kush.
passages:
- ref: Isa 20:1
  rel: event
  note: >-
    Assyrian evidence for Sargon's capture of Ashdod; it does not attest Isaiah's symbolic
    action
- ref: Isa 20:3-6
  rel: setting
  note: >-
    Yamani's unsuccessful refuge and extradition illuminate political reliance on Egypt and
    Cush
related: [cush, sargon-ii-inscriptions, sargon-ii, ashdod, taharqa]
location:
  institution: Tang-i Var, Kurdistan Province, Iran (in situ)
  accession: null
media:
- id: tang-i-var-inscription
  role: primary
- id: tang-i-var-inscription-2
  role: gallery
