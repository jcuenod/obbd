editorial:
  author_notes:
  - >-
    In the Hebrew Bible and in Homer, 'Sidonians' often means Phoenicians in general. Ethbaal
    (Ittobaal) of 1 Kgs 16:31 was king of Tyre according to Josephus.
  - >-
    Sennacherib drove out Luli in 701. Esarhaddon destroyed Sidon c. 677 and founded Kar-Esarhaddon.
  - >-
    In the Persian period Sidon flourished under a royal dynasty (sarcophagi of Tabnit and
    Eshmunazar II). The Eshmun temple at Bustan esh-Sheikh yielded the Bodashtart inscriptions.
  - >-
    British Museum excavations at the 'College site' (Doumet-Serhal) have produced important
    Bronze Age burials.
  sources_to_check:
  - Aubet, The Phoenicians and the West (2nd ed., 2001)
  image_query: Temple of Eshmun Sidon
