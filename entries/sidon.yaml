scope: >-
  The Phoenician city of Sidon on the Lebanese coast. Covers its Bronze Age remains, its Iron
  Age history under Assyria, its Persian-period royal dynasty and Eshmun sanctuary, and the
  use of 'Sidonians' as a general term for Phoenicians.
