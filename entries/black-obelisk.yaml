  note: Jehu, king of Israel, shown or represented paying tribute
- ref: 2Kgs 9:2
  rel: language
  note: Jehu son of Jehoshaphat son of Nimshi, yet 'son of Omri' (Bit-Humri) in Assyrian usage
- ref: 2Kgs 10:32-33
  rel: setting
  note: Hazael's pressure on Israel, after Assyria withdrew from the west
- ref: 1Kgs 19:15-17
  rel: attests
  note: Hazael and Jehu, both named in Shalmaneser's inscriptions
- ref: 2Kgs 8:7-15
  rel: attests
  note: Hazael of Damascus, Shalmaneser's opponent in 841 and 838
