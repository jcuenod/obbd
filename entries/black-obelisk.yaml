id: black-obelisk
title: Black Obelisk of Shalmaneser III
type: artifact
cultures: [assyrian]
date:
  from: -827
  to: -827
  circa: true
  display: c. 827 BCE
scope: >-
  A black limestone obelisk of Shalmaneser III from Nimrud summarising his campaigns to his
  31st year. Its five registers of reliefs show tribute from five lands; the second shows
  a figure prostrate before the king, labelled as the tribute of 'Jehu of Bit-Humri', the
  only known depiction of an Israelite king or his envoy.
