editorial:
  author_notes:
  - >-
    Discovered by Layard at Nimrud in 1846. The main text runs to Shalmaneser's 31st year
    (c. 828/827); the Jehu tribute itself dates to 841 BCE (18th year), recorded also on other
    inscriptions.
  - >-
    "Son of Omri" (mār Ḫumrî) reflects the Assyrian practice of naming a state after a dynastic
    founder (Bit-Humri); it is not a genealogical claim and does not contradict 2 Kgs 9:2.
  - >-
    Whether the prostrate figure is Jehu himself or an envoy is debated; the epigraph names
    Jehu's tribute. McCarter's proposal to read Joram is a minority view.
  - >-
    The Bible does not mention Jehu's submission; Kings is silent about Assyria in this period.
    Note the value of the obelisk for absolute chronology (841 BCE).
