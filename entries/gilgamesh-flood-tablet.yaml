editorial:
  author_notes:
  - >-
    George Smith announced the identification to the Society of Biblical Archaeology in December
    1872; the Daily Telegraph then funded his 1873 Nineveh expedition, which recovered further
    flood fragments. Verify details against museum and George's accounts.
  - >-
    Present it as one 7th-c. manuscript among several witnesses to Tablet XI, not as 'the
    original' flood story; the tradition goes back to Old Babylonian Atrahasis.
  - >-
    Its reception history (Smith, Delitzsch's 'Babel und Bibel' lectures of 1902) is part
    of the story and shows how such finds were used both to defend and to relativise Genesis.
  sources_to_check:
