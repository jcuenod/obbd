id: gilgamesh-flood-tablet
title: Gilgamesh Flood Tablet (Tablet XI)
aliases: [Flood Tablet, Tablet XI of the Epic of Gilgamesh, K.3375]
type: artifact
cultures: [assyrian, babylonian]
date:
  from: -700
  to: -600
  circa: true
  display: c. 700–600 BCE
scope: >-
  The Neo-Assyrian clay tablet from Ashurbanipal's libraries at Nineveh that preserves Tablet
  XI of the Standard Babylonian Gilgamesh epic, including Utnapishtim's flood story. Its identification
  by George Smith in 1872 made the Babylonian flood narrative famous and launched the modern
  comparison of Genesis with cuneiform literature.
passages:
- ref: Gen 6:5-9:17
  rel: parallel
  note: Flood narrative whose 1872 discovery first exposed the Genesis-Babylon parallel
- ref: Gen 8:4
  rel: parallel
  note: Boat grounds on Mount Nimush; ark rests on the mountains of Ararat
- ref: Gen 8:6-12
  rel: parallel
  note: Dove, swallow, and raven released to find dry land
- ref: Gen 8:20-21
  rel: parallel
  note: Offering after the flood; gods smell the sweet savour
