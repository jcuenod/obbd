editorial:
  author_notes:
  - >-
    Magen's excavations date the first sacred precinct to the mid-fifth century BCE (Persian
    period). It was rebuilt in the second century BCE and destroyed by John Hyrcanus (c. 111-110
    BCE, from coins). Josephus' account of a temple founded under Alexander (Ant. 11) is thus
    too late for the first phase.
  - >-
    Hundreds of Aramaic and Hebrew dedicatory inscriptions are primary evidence for Samarian
    Yahwism.
  - >-
    Avoid using 'Samaritan' in the later sectarian sense for the fifth-century worshippers.
    The parting between Samaritans and Jews was gradual.
  - >-
    Later phases include a Roman temple of Zeus at Tell er-Ras and a Byzantine church of the
    Theotokos.
  sources_to_check:
  - Magen, Mount Gerizim Excavations, Vol. 2 - A Temple City (2008)
  - >-
    Magen, Misgav and Tsfania, Mount Gerizim Excavations, Vol. 1 - The Aramaic, Hebrew and
    Samaritan Inscriptions (2004)
