scope: >-
  The mountain above Shechem, site of the blessing ceremony in Deuteronomy and of the Samarian
  (later Samaritan) Yahwistic sanctuary. Covers the Persian and Hellenistic sacred precinct,
  its inscriptions and destruction, and its place in Samaritan tradition.
