editorial:
  author_notes:
  - >-
    At Arad, Herzog dates the dismantling of the shrine to the late 8th century, against Aharoni's
    split between Hezekiah (altar) and Josiah (shrine). The stratigraphy remains disputed.
    Residue analysis (2020) identified frankincense and cannabis on its incense altars.
  - >-
    The Beersheba horned altar was found dismantled, with its stones reused in a storehouse
    wall. Aharoni linked this to Hezekiah, but the timing is debated.
  - >-
    The Lachish Level III gate shrine had cut altar horns and a stone toilet. The excavators
    read it as reform-era desecration (compare 2 Kgs 10:27), but this is contested.
  - >-
    Some scholars (e.g., Na'aman; Fried) question whether the archaeology supports the reform
    reports. Judean pillar figurines and the Tel Moẓa temple show continuing cult practice.
    Present the evidence as ambiguous.
