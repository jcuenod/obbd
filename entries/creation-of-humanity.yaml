editorial:
  author_notes:
  - >-
    Atrahasis I narrates the mixing of clay with the flesh and blood of a slain god (We-ila)
    so that humans bear the labour of the gods. Enuma Elish VI has humans made from Kingu's
    blood for the same purpose. Contrast Gen 2:15, where humans tend God's garden, and Gen
    1:28, where they receive dominion.
  - >-
    Egyptian images include Khnum shaping humans on a potter's wheel and humans arising from
    the tears of the creator (a wordplay on rmṯ "people" and rmyt "tears"). The Instruction
    for Merikare calls humans the god's "cattle" and his images.
  - >-
    The Sumerian "rib" pun (ti = "rib" and "life") in Enki and Ninhursag, proposed as background
    to Gen 2:21-22, is widely repeated but contested. Mark it as such.
  image_query: Khnum potter's wheel relief
