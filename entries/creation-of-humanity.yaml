id: creation-of-humanity
title: Creation of Humanity
type: concept
cultures: [ane]
scope: >-
  Ancient Near Eastern accounts of how and why humans were made: from clay, divine blood,
  or tears; shaped by a potter god; and created to relieve the gods of labour. Covers the
  comparative background of Gen 1:26-28 and 2:7 and related poetic texts.
passages:
- ref: Gen 2:7
  rel: parallel
  note: >-
    Human formed from dust of the ground and animated by divine breath; cf. clay and divine
    blood in Atrahasis
- ref: Gen 2:15
  rel: concept
  note: Human placed to till and keep the garden; contrast humans created to bear the gods'
    toil
- ref: Gen 1:26-28
  rel: concept
  note: Humanity created in the divine image to rule
- ref: Gen 2:21-22
  rel: parallel
  disputed: true
  note: Woman built from the man's side; 'rib' wordplay with Enki and Ninhursag is contested
- ref: Job 10:8-9
  rel: imagery
  note: '''You fashioned me like clay'''
- ref: Job 33:6
  rel: imagery
  note: '''I too was formed from a piece of clay'''
- ref: Isa 64:8
  rel: imagery
  note: '''We are the clay, and you are our potter''; MT 64:7'
- ref: Jer 18:1-6
  rel: imagery
  note: Potter and clay
- ref: Ps 8:3-8
  rel: concept
  note: Humans made a little lower than God, crowned to rule; MT 8:4-9
- ref: Rom 9:20-21
  rel: imagery
  note: Potter's right over the clay
