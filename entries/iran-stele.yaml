scope: >-
  A stele of Tiglath-pileser III, reportedly from western Iran, that commemorates his campaign
  to Media and includes a list of western rulers who paid tribute in 738 BCE, among them Menahem
  of Samaria and Rezin of Damascus. It is the best-preserved list of these tributaries and
  anchors Menahem's chronology.
