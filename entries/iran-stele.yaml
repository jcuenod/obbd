editorial:
  author_notes:
  - >-
    The stele is unprovenanced (acquired, reportedly from western Iran) and was published
    by L. D. Levine (1972). Note the provenance problem but also that its text agrees with
    the excavated Nimrud annals.
  - >-
    Check the king of Tyre named in the list. RINAP 1 no. 35 appears to read Tubaʾil (Ethbaal)
    of Tyre, whereas the annals' tribute list has Hiram. Tadmor discussed the discrepancy
    as evidence of a change of ruler. Do not assert 'Hiram' for the stele without checking.
  - >-
    The list also names Zabibe, queen of the Arabs, and rulers of Byblos, Carchemish, Hamath
    and Samʾal (Panamuwa). It gives a full picture of the western vassal system on the eve
    of the Syro-Ephraimite crisis.
  - >-
    The date of Menahem's tribute (738, or 740 in some reconstructions) conflicts with some
    biblical chronologies; refer to chronology-of-kings rather than resolving it here.
  sources_to_check:
  - >-
    H. Tadmor and S. Yamada, The Royal Inscriptions of Tiglath-pileser III and Shalmaneser
    V (RINAP 1, 2011), no. 35
  - L. D. Levine, Two Neo-Assyrian Stelae from Iran (1972)
  - H. Tadmor, The Inscriptions of Tiglath-pileser III, King of Assyria (1994)
