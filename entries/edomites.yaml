scope: >-
  The land and people of Edom in southern Transjordan and, later, Idumea in the southern Judean
  hills. Covers Egyptian and Assyrian evidence, the debate over when the Edomite state formed,
  Edomite religion and expansion, and the hostility toward Edom in biblical texts after 586.
