editorial:
  author_notes:
  - >-
    Egyptian texts mention Shasu of Edom and Seir (Papyrus Anastasi VI). Assyrian sources
    name Edomite kings (Qaus-malaka, Qaus-gabri). Qos is the national god.
  - >-
    When the state formed is debated, with options ranging from the late seventh century (Bienkowski,
    centred on Bozrah) or much earlier, from the Faynan copper evidence of the eleventh to
    ninth centuries (Levy, Ben-Yosef).
  - >-
    In the seventh and sixth centuries Edom expanded into the Negev (Horvat Qitmit shrine,
    ʿEn Ḥaṣeva). Arad ostracon 24 warns of an Edomite threat. Later Idumea was absorbed by
    the Hasmoneans, and Herod was of Idumean descent.
  - >-
    Post-586 anti-Edom polemic (Obadiah, Ps 137, Lam 4:21-22) should be read against both
    these material realities and kinship traditions (Deut 23:7).
  sources_to_check:
  - Bienkowski (ed.), Early Edom and Moab (1992)
  - >-
    Levy, Najjar and Ben-Yosef (eds.), New Insights into the Iron Age Archaeology of Edom,
    Southern Jordan (2014)
