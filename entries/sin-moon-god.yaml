title: Sin (Moon God)
aliases: [Nanna, Suen, Yarikh, moon god of Harran]
type: deity
cultures: [mesopotamian, aramean]
scope: >-
  Sin (Sumerian Nanna), the Mesopotamian moon god, with major cult centres at Ur and Harran,
  and the moon god Yarikh of the Levant. The entry covers lunar worship and the biblical references
  to the moon as an object of cult.
passages:
- ref: Gen 11:28, 31
  rel: setting
  note: Terah's family linked to Ur and Harran, the two chief cult centres of Sin
- ref: Deut 4:19
  rel: polemic
  note: Moon among the heavenly bodies not to be worshipped
- ref: 2Kgs 23:5
  rel: practice
  note: Josiah suppresses priests who burn incense to the moon (yārēaḥ)
- ref: Job 31:26-28
  rel: practice
  note: The moon 'moving in splendour' as an object of veneration
- ref: Jer 8:2
  rel: practice
  note: Bones spread before sun, moon and host they served
- ref: Judg 8:21, 26
  rel: realia
  note: Crescent ornaments on the Midianite kings' camels
- ref: Isa 3:18
  rel: realia
  note: Crescents (śahărōnîm) among Jerusalem women's ornaments
