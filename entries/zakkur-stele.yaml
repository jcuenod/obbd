editorial:
  author_notes:
  - >-
    This is one of the few West Semitic witnesses to intuitive prophecy outside the Bible.
    Compare it with Mari and Neo-Assyrian prophecy, and with Deir ʿAlla.
  - >-
    Bar-Hadad son of Hazael fixes this Ben-hadad historically. Discuss its bearing on the
    several Ben-hadads of Kings.
  - >-
    The siege is usually dated c. 800-785, linked to Assyrian intervention under Adad-nirari
    III. Zakkur's appeal to the gods and the coalition's withdrawal parallel the 701 narrative
    in a general way only.
