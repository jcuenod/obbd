- ref: Isa 41:8-13
  rel: form
  note: 'Oracle of salvation: ''Do not fear, for I am with you'''
- ref: 2Chr 20:1-17
  rel: parallel
  note: Besieged king prays; an inspired speaker answers 'Do not fear'
- ref: Isa 7:1-9
  rel: parallel
  note: Coalition threatens a king; prophetic 'do not fear'
- ref: Amos 7:12
  rel: language
  note: ḥōzeh 'seer', cognate with the stele's ḥzyn
