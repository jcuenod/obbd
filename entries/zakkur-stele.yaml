scope: >-
  An Old Aramaic stele of Zakkur, king of Hamath and Luʿash, found at Tell Afis in 1903. It
  tells how Bar-Hadad son of Hazael and a coalition of kings besieged Zakkur in Hazrach, and
  how the god Baalshamayn answered his prayer through seers and diviners with an oracle of
  salvation.
