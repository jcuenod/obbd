editorial:
  author_notes:
  - >-
    'Via Maris' is a medieval Latin label derived from Isa 9:1, not an ancient name for the
    coastal highway. Use it only as a modern convention.
  - >-
    Egyptian sources illuminate the North Sinai 'Ways of Horus' (Seti I's Karnak reliefs;
    Papyrus Anastasi I), with excavated forts such as Tell el-Borg and Tjaru.
  - >-
    Derek hammelek (Num 20:17) may be generic ('the royal road') rather than a proper name.
    The later Roman Via Nova Traiana followed the plateau route.
  sources_to_check:
  - Dorsey, The Roads and Highways of Ancient Israel (1991)
