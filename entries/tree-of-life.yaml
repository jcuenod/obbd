editorial:
  author_notes:
  - >-
    Mesopotamian literature has life-giving plants rather than a "tree of life" as such (Gilgamesh
    XI's plant "Old Man Becomes Young", Adapa's bread and water of life). Present these as
    thematic parallels.
  - >-
    The stylized tree flanked by caprids is common in Levantine iconography (Lachish ewer,
    Kuntillet ʿAjrud pithos A, Taanach stand). Its association with Asherah is widely argued
    but debated. The Assyrian "sacred tree" has its own entry, and its meaning is uncertain.
  - >-
    Mention Egyptian tree goddesses (Nut or Hathor in a sycamore offering water to the deceased)
    as a separate image complex.
  - >-
    Parpola's Kabbalistic interpretation of the Assyrian tree is not mainstream. Leave it
    out or flag it as such.
