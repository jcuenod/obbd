editorial:
  author_notes:
  - >-
    Nebuchadnezzar (Nabu-kudurri-uṣur) and many Babylonian names carry Nabu; give the etymology.
  - >-
    Nabu as keeper of the Tablet of Destinies and divine scribe is a frequent comparison for
    heavenly books and the scribal figure in Ezek 9; present as background, not source.
