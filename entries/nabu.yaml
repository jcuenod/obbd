- ref: 2Kgs 25:8
  rel: language
  note: Nebuzaradan (Nabu-zer-iddin), captain of the guard
- ref: Jer 39:13
  rel: language
  note: Nebushazban, a Babylonian officer
- ref: Num 32:38
  rel: language
  disputed: true
  note: The Moabite town Nebo, possibly named for the god
- ref: Ezek 9:2-4
  rel: imagery
