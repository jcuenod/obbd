title: Nabu (Nebo)
aliases: [Nebo, Nabû]
type: deity
cultures: [babylonian, assyrian]
scope: >-
  Nabu, Babylonian god of scribes and writing, son of Marduk, with his main temple (Ezida)
  at Borsippa and a major cult in first-millennium Assyria. The entry covers his cult and
  his presence in biblical names and polemic.
