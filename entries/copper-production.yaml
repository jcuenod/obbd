editorial:
  author_notes:
  - >-
    Timna had Egyptian New Kingdom mining expeditions with a Hathor shrine (and copper snake),
    and intensive Iron Age smelting (11th-9th centuries) by local groups. Faynan (Khirbat
    en-Nahas) shows large-scale 10th-century production (Levy, Najjar, Ben-Yosef).
  - >-
    'King Solomon's Mines' (Glueck) is a popular label with no evidence for Israelite control.
    Present the current debate over a complex, partly nomadic Edomite polity in the 11th-9th
    centuries. Ben-Yosef argues that archaeology is biased towards architecture.
  - >-
    Biblical nĕḥōšet covers both copper and bronze. Note tin sourcing and Cypriot (Alashiya)
    copper in the Late Bronze trade (Amarna letters, Uluburun wreck).
