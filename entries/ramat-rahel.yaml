id: ramat-rahel
title: Ramat Raḥel
aliases: [Ramat Rachel, Khirbet Salih, Beth-haccherem (proposed)]
type: site
cultures: [judahite, persian]
scope: >-
  The palace and administrative site on a hill between Jerusalem and Bethlehem, occupied from
  the late Iron Age through the Persian period. Covers the royal palace with its proto-Aeolic
  capitals and garden, its role in collecting taxes under Assyrian, Babylonian and Persian
  rule, and identifications that have been proposed.
