editorial:
  author_notes:
  - >-
    Excavated by Aharoni (1954, 1959-62) and by Lipschits, Oeming and Gadot (2005-10). The
    renewed project dates the first palace to the late eighth or early seventh century and
    stresses its role as an imperial administrative centre.
  - >-
    The site holds the largest assemblage of lmlk, rosette and Yehud stamp impressions, which
    shows administrative continuity from the Assyrian to the Persian period.
  - >-
    Pollen from the garden includes exotic species, among them citron (Langgut and others).
    Verify the details before citing.
  - >-
    The links to Beth-haccherem and to Jehoiakim's palace are proposals, not established.
    Many place Beth-haccherem at ʿAin Karim.
  sources_to_check:
  - NEAEHL
  - Lipschits et al., What Are the Stones Whispering? Ramat Raḥel (2017)
