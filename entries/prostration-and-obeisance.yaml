id: prostration-and-obeisance
title: Prostration and Obeisance Formulas
aliases: [Proskynesis, Bowing]
type: practice
cultures: [ane, egyptian, persian]
scope: >-
  Bowing and prostration before kings, superiors and deities, with the accompanying formulas
  of self-abasement, in the Hebrew Bible and in ancient Near Eastern diplomatic and court
  practice. The entry covers vocabulary, numbers of bows, licking dust, and Persian court
  proskynesis.
