editorial:
  author_notes:
  - >-
    Hebrew hištaḥăwâ is now generally analysed as an Št-stem of ḥwy (Ugaritic yštḥwy), not
    a hithpael of šḥh.
  - >-
    The Amarna vassal formula 'At the feet of the king my lord seven times and seven times
    I fall' (often 'on the stomach and on the back') is the classic parallel to Gen 33:3.
  - >-
    The Black Obelisk shows Jehu (or his envoy) prostrate before Shalmaneser III. For Esth
    3:2, use Persian court proskynesis and Greek reactions to it (Herodotus 1.134), but note
    that Esther gives no motive for Mordecai's refusal.
  sources_to_check:
