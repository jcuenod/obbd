scope: >-
  The oasis site of Tell es-Sultan near the spring of ʿAin es-Sultan, one of the oldest continuously
  visited settlements, and the nearby Hasmonean and Herodian palace complex of New Testament
  Jericho. Covers its Neolithic remains, the Bronze Age city, the debate over Joshua 6, and
  the later sites.
