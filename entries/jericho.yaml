editorial:
  author_notes:
  - >-
    Garstang (1930s) dated a collapsed wall to c. 1400 and linked it to Joshua. Kenyon (1952-58)
    redated it to the Early Bronze Age and found the Middle Bronze city destroyed c. 1550,
    with Late Bronze occupation slight and eroded. Wood's 1990 attempt to revive a c. 1400
    destruction has not won mainstream acceptance.
  - >-
    The Pre-Pottery Neolithic A tower and wall (c. 8000 BCE) and the PPNB plastered skulls
    make the site important well beyond biblical studies.
  - >-
    New Testament Jericho centres on the Hasmonean and Herodian winter palaces at Tulul Abu
    el-ʿAlayiq, where Herod died. The Mark 10:46 / Luke 18:35 'two Jerichos' harmonization
    should be noted only as a harmonization.
  - >-
    Recent Italian-Palestinian excavations (Nigro and Marchetti). The site was inscribed on
    the UNESCO World Heritage List in 2023.
  sources_to_check: [NEAEHL, 'Kenyon, Digging Up Jericho (1957)']
