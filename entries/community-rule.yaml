editorial:
  author_notes:
  - >-
    Discuss the redactional history revealed by the shorter Cave 4 copies (e.g. 4QSᵇ,ᵈ). Present
    the debate over whether the 1QS or 4QS forms are earlier (Metso, Alexander).
  - >-
    The same scroll contains the Rule of the Congregation (1QSa) and the Blessings (1QSb).
    Compare the Damascus Document, which addresses a different, family-based form of community
    life.
  - >-
    The match with Josephus's and Philo's Essenes underpins the Essene hypothesis. Note both
    the agreements and the differences.
  - >-
    Treat the NT parallels as comparative, not as evidence of dependence. Links between John
    the Baptist and Qumran are speculative.
  sources_to_check:
