id: community-rule
title: Community Rule (1QS)
aliases: [1QS, Serekh ha-Yaḥad, Manual of Discipline]
type: artifact
cultures: [jewish]
date:
  from: -100
  to: -75
  circa: true
  display: c. 100–75 BCE
scope: >-
  The Rule of the Community (Serekh ha-Yaḥad) from Qumran Cave 1 (1QS), with further copies
  from Cave 4 (4QS). It sets out admission, covenant renewal, the Treatise on the Two Spirits,
  communal discipline, and penal codes. The date given is that of the 1QS copy; the work itself
  was composed and revised earlier.
passages:
- ref: Isa 40:3
  rel: concept
  note: Separation to the wilderness to prepare the way by studying Torah (1QS 8:13-16)
- ref: Mark 1:2-4
  rel: parallel
  note: John the Baptist's wilderness mission framed by Isa 40:3
- ref: Acts 2:44-45; 4:32-35
  rel: practice
  note: Shared property; cf. the yaḥad's pooling of goods (1QS 1:11-13; 6:19-22)
- ref: Matt 18:15-17
  rel: practice
  note: Graded reproof before witnesses and the assembly (1QS 5:24-6:1)
- ref: Lev 19:17-18
  rel: practice
  note: Duty of reproof, the scriptural basis of the Qumran procedure
- ref: Num 6:24-26
  rel: form
  note: Priestly blessing expanded in the covenant ceremony (1QS 2:2-4)
- ref: Deut 27:14-26
  rel: form
  note: Levitical curses as a model for the covenant ceremony (1QS 1:16-2:18)
- ref: Deut 18:15-18
  rel: concept
  note: Awaited prophet alongside the messiahs of Aaron and Israel (1QS 9:11)
- ref: 1Thess 5:5
  rel: language
  note: '''Children of light''; cf. ''sons of light'' (1QS 1:9; 3:13)'
