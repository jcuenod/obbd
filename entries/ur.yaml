editorial:
  author_notes:
  - >-
    Woolley excavated Ur from 1922 to 1934. Key finds are the Royal Cemetery (c. 2600 BCE),
    the Ur III ziggurat of Ur-Nammu, and Nabonidus' restorations, including the residence
    of his daughter, the en-priestess Ennigaldi-Nanna.
  - >-
    The phrase 'of the Chaldeans' is anachronistic for any second-millennium setting. The
    Chaldeans (Kaldu) are attested only from the ninth century BCE, which points to a first-millennium
    perspective in the text.
  - >-
    A northern location (Urfa or a northern 'Ura'; Gordon and others) is a minority view.
    Most scholars accept southern Ur, but the problem should be stated. The Ur-Harran link
    through the moon-god Sin is often noted.
  - >-
    Woolley's 'flood deposit' is a local flood layer and should not be presented as evidence
    for Gen 6-9.
  sources_to_check:
  - Woolley and Moorey, Ur 'of the Chaldees' (1982)
