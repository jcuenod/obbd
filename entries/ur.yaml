scope: >-
  The Sumerian and Babylonian city in southern Iraq, famous for its Royal Cemetery and the
  ziggurat of Ur-Nammu, and named in Genesis as Abraham's place of origin. Covers the site,
  its main periods and the problems of the biblical 'Ur of the Chaldeans'.
