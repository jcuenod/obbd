id: esarhaddon-succession-treaty
title: Esarhaddon's Succession Treaty (Vassal Treaties)
aliases: [Vassal Treaties of Esarhaddon, VTE, EST, adê of Esarhaddon]
type: text
cultures: [assyrian]
date:
  from: -672
  to: -672
  display: 672 BCE
scope: >-
  The loyalty oath (adê) imposed in 672 BCE by Esarhaddon of Assyria on vassals and subjects
  to secure the succession of Ashurbanipal, known from copies found at Nimrud and Tell Tayinat.
  Its loyalty clauses and curse sequences are the closest known parallels to Deuteronomy 13
  and 28.
passages:
- ref: Deut 13:1-18
  rel: parallel
  note: Duty to report and punish incitement to disloyalty, even by prophets or kin (MT 13:2-19)
- ref: Deut 28:26-30
  rel: parallel
  note: 'Curse sequence: corpses to birds, skin disease, blindness, wife taken (EST §§39-42)'
- ref: Deut 28:23
  rel: parallel
  note: Sky of bronze and earth of iron (EST §§63-64)
- ref: Deut 6:5
  rel: language
  note: Command to 'love' the overlord with all one's heart; 'love Ashurbanipal as yourselves'
- ref: Deut 12:32
  rel: parallel
  note: Do not add to or take from the words (MT 13:1); EST forbids altering the treaty tablet
- ref: Deut 6:6-9
  rel: practice
  disputed: true
  note: Oath to be passed on to children and descendants
- ref: 2Kgs 21:1-18
  rel: setting
  disputed: true
  note: Manasseh, an Assyrian vassal under Esarhaddon, probably bound by such oaths
- ref: Ezek 17:11-21
  rel: concept
  note: Breaking a vassal oath sworn in the deity's name as an offence against that deity
