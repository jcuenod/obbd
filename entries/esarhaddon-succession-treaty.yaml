editorial:
  author_notes:
  - >-
    Copies found in 1955 in the Nabû temple at Nimrud (sworn by Median rulers) and in 2009
    at Tell Tayinat in the Syrian west. The Tayinat copy shows western vassals bound by the
    same text and strengthens (but does not prove) the case that Judah knew it.
  - >-
    Many (Otto, Levinson, Steymans) see Deut 13 and 28 as a deliberate, subversive adaptation
    that transfers loyalty from the Assyrian king to YHWH; Crouch (2014) and others question
    the criteria for direct dependence. Present it as influential but contested.
  - >-
    Moran (CBQ 1963) established 'love' as treaty language for loyalty; the EST loyalty clauses
    are a key comparandum.
  - >-
    Section numbers follow SAA 2 6; check them, since older literature uses line numbers (Wiseman
    1958).
  sources_to_check:
  - S. Parpola and K. Watanabe, Neo-Assyrian Treaties and Loyalty Oaths (SAA 2, 1988), no.
    6
  - D. J. Wiseman, 'The Vassal-Treaties of Esarhaddon,' Iraq 20 (1958)
  - >-
    J. Lauinger, 'Esarhaddon's Succession Treaty at Tell Tayinat: Text and Commentary,' JCS
    64 (2012): 87-123
  - >-
    H. U. Steymans, Deuteronomium 28 und die adê zur Thronfolgeregelung Asarhaddons (OBO 145,
    1995)
