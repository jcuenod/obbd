id: first-jewish-revolt
title: First Jewish Revolt and the Destruction of Jerusalem (66–73 CE)
aliases: [First Jewish-Roman War, Great Revolt, Jewish War]
type: event
cultures: [jewish, roman]
date:
  from: 66
  to: 74
  display: 66–74 CE
scope: >-
  The Judean revolt against Rome from 66 CE to the fall of Masada in 73 or 74 CE: its causes
  and factions, Vespasian's campaign in Galilee, Titus's siege and the destruction of Jerusalem
  and the temple in 70, and its aftermath. It also covers the revolt's importance for dating
  and reading the Gospels. The Arch of Titus, the Judaea Capta coins, the revolt coinage and
  Masada have their own entries.
