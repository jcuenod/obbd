editorial:
  author_notes:
  - >-
    Josephus's Jewish War is almost the only narrative source. He commanded rebel forces in
    Galilee, then served with Titus, so read him critically. Add Tacitus (Hist. 5.1-13), Cassius
    Dio, and archaeology: Gamla, Yodefat (Jotapata), Jerusalem (the Burnt House, the Herodian
    street with fallen Temple Mount stones), and Masada.
  - >-
    Causes and factions: misgovernment under Florus, conflict at Caesarea, and the end of
    the sacrifice for the emperor (War 2.409-410). The factions included the Zealots, the
    Sicarii, John of Gischala and Simon bar Giora. Do not treat 'the Zealots' as a single
    movement existing long before 66.
  - >-
    Timeline: Cestius Gallus defeated (66); Vespasian in Galilee (67); Titus's siege (spring
    to summer 70) and the burning of the temple in Ab; Masada (73 or 74).
  - >-
    For the NT, discuss whether Mark 13 and Luke 21:20-24 are prophecies after the event,
    and how far Luke's more specific siege language reflects 70. The usual dating of Mark
    around 70 and of Matthew and Luke later depends on this. The tradition of the Jerusalem
    church's flight to Pella (Eusebius, Hist. eccl. 3.5.3) is debated.
  - >-
    Aftermath: the fiscus Iudaicus, the end of sacrificial worship, the rabbinic gathering
    at Yavneh, and the decline of the Sadducees.
  sources_to_check:
