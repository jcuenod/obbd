id: ziggurat-and-babel
title: The Tower of Babel and Its Mesopotamian Background
aliases: [Tower of Babel]
type: concept
cultures: [babylonian, sumerian, assyrian]
scope: >-
  The Tower of Babel story (Gen 11:1-9) against its Mesopotamian background: ziggurats (especially
  Etemenanki in Babylon), brick-and-bitumen construction, the name Babylon, and Mesopotamian
  traditions about one language and imperial building projects.
