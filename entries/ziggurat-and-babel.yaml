editorial:
  author_notes:
  - >-
    Etemenanki ('House of the foundation of heaven and earth') in Babylon is the most likely
    referent. Nebuchadnezzar II's inscriptions boast of raising its top to rival the heavens.
    Compare Enuma Elish VI, where the gods build Esagila with bricks.
  - >-
    Uehlinger (Weltreich und 'eine Rede', OBO 101, 1990) reads the story against Neo-Assyrian
    imperial 'one speech' ideology and Sargon II's Dur-Sharrukin. This is influential but
    debated.
  - >-
    The 'spell of Nudimmud' in Enmerkar and the Lord of Aratta speaks of a single language.
    Whether it describes an original unity or a future one is disputed.
  - >-
    Do not identify the 'actual' tower archaeologically. The story is generally assigned to
    the non-Priestly primeval history, and its date is debated.
