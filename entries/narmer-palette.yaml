- ref: Josh 10:24
  rel: practice
  note: Victors place their feet on the necks of defeated kings
- ref: Ps 110:1
  rel: imagery
  note: Enemies made a footstool beneath the king's feet
- ref: Ps 110:5-6
  rel: imagery
  note: Kings and heads shattered (māḥaṣ) on the day of wrath; the smiting motif
- ref: Ps 68:21
  rel: imagery
  note: God shatters the heads of his enemies; MT 68:22
- ref: Deut 33:17
  rel: imagery
  note: Ruler as a wild bull goring the peoples
