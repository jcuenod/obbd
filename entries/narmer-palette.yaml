editorial:
  author_notes:
  - >-
    Scholars debate whether the palette records an actual unification or is an ideological
    and ritual image. Present both views.
  - >-
    The relevance to the Bible is iconographic and long-term. The smiting-king and enemies-underfoot
    motifs reached the Levant through scarabs, stelae (e.g., Beth-shean), and Egyptian imperial
    art. Do not imply Israelite authors knew this object.
  - Keel's work on the iconography of the Psalms is the standard entry point.
  sources_to_check:
