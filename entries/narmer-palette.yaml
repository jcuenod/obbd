id: narmer-palette
title: Narmer Palette
type: artifact
cultures: [egyptian]
date:
  from: -3100
  to: -3100
  circa: true
  display: c. 3100 BCE
scope: >-
  A ceremonial siltstone palette from Hierakonpolis showing King Narmer, wearing the crowns
  of Upper and Lower Egypt, smiting a kneeling enemy with a mace, inspecting decapitated foes,
  and (as a bull) breaking a city wall. It is the earliest full-scale example of the "smiting
  pharaoh" and of the conqueror treading on enemies, motifs that persisted for three millennia.
