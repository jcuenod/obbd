id: adoption
title: Adoption
type: practice
cultures: [hebrew, akkadian, hurrian, egyptian, roman]
scope: >-
  Adoption and adoption-like legitimation in the Hebrew Bible, the ancient Near Eastern legal
  evidence for adoption, the royal 'sonship' formulae, and the Greco-Roman background of Paul's
  metaphor of adoption (huiothesia).
