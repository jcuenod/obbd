editorial:
  author_notes:
  - >-
    The Hebrew Bible has no adoption law and no technical term for it. Whether Israel practised
    formal adoption is debated; many cases are legitimation within the family (Gen 48) or
    set in foreign contexts (Egypt, Persia).
  - >-
    Cuneiform evidence includes LH §§185-193, many Old Babylonian and Nuzi adoption contracts,
    and declaratory formulae ('you are my son' / 'you are not my father') used in adoption
    and disinheritance. These bear on the royal formulae of 2 Sam 7:14 and Ps 2:7.
  - >-
    The old view that Gen 15:2-3 reflects Nuzi-style adoption of a slave heir is now widely
    doubted. Present it as a historical proposal.
  - >-
    Pauline huiothesia draws on Greco-Roman adoption (adoptio, adrogatio) rather than Israelite
    practice.
  sources_to_check:
  - Roth, Law Collections from Mesopotamia and Asia Minor (SBLWAW 6, 2nd ed. 1997)
