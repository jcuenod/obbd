editorial:
  author_notes:
  - >-
    Present the dating debate fairly. Redford (1970) argued that the Egyptian details fit
    the Saite and Persian periods best (name types, titles, Goshen); Kitchen and Hoffmeier
    argue for New Kingdom or earlier parallels. Many scholars now see a late monarchic or
    Persian-period composition by authors familiar with Egypt.
  - >-
    Several details are anachronistic for any 2nd-millennium setting: the 'land of Rameses'
    (Gen 47:11), camels in the incense trade (Gen 37:25), and Philistines elsewhere in Genesis.
    Point these out without overstating the conclusion.
  - >-
    Treat the story's genre (court tale or diaspora novella, compared with Esther and Dan
    1-6; von Rad's wisdom reading) as part of the background, since the Egyptian setting serves
    the plot.
  - >-
    There is no Egyptian record of Joseph. Identifications with Imhotep, Amenhotep son of
    Hapu or a Hyksos-era vizier, and the medieval idea that the pyramids were Joseph's granaries,
    are not supported; mention them only as misconceptions. Asiatics did rise high at the
    Egyptian court (e.g. the chancellor Bay), which is a fair typological point.
  sources_to_check:
  - D. B. Redford, A Study of the Biblical Story of Joseph (VTSup 20, 1970)
  - J. Vergote, Joseph en Égypte (1959)
  - J. K. Hoffmeier, Israel in Egypt (1996)
  - K. A. Kitchen, On the Reliability of the Old Testament (2003)
