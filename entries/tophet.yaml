editorial:
  author_notes:
  - >-
    The vocalization tōpet is often explained as a deliberate distortion with the vowels of
    bōšet ("shame"), from a word meaning "hearth" or "fireplace" (cf. Aramaic). Present this
    as the common proposal.
  - >-
    The Jerusalem Topheth has not been located archaeologically. The application of "tophet"
    to Punic sanctuaries is modern scholarly usage.
  - >-
    Trace the line from the Hinnom valley to Gehenna as a place of eschatological punishment
    (1 En 27; NT) briefly, with cross-reference.
