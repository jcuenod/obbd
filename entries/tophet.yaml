id: tophet
title: Tophet
aliases: [Topheth]
type: site
cultures: [judahite, phoenician]
scope: >-
  Topheth, the cult place in the Valley of Hinnom outside Jerusalem associated with burning
  children, and by extension the modern scholarly term "tophet" for Phoenician-Punic sacred
  precincts with urn burials of infants and animals (Carthage, Motya, Tharros, Sulcis).
passages:
- ref: 2Kgs 23:10
  rel: setting
  note: Josiah defiles Topheth in the valley of Ben-hinnom
- ref: Jer 7:31-32
  rel: setting
  note: High place of Topheth; the valley renamed 'valley of Slaughter'
- ref: Jer 19:6, 11-14
  rel: setting
  note: Topheth as burial place; Jerusalem's houses to be defiled like Topheth
- ref: Isa 30:33
  rel: language
  note: >-
    'His burning place (topteh) has long been prepared; it is made ready for the king (lammelek)'
- ref: Josh 15:8
  rel: setting
  note: Valley of the son of Hinnom on Judah's boundary
- ref: Mark 9:43-48
  rel: concept
  note: Gehenna as place of unquenchable fire
