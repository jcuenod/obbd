editorial:
  author_notes:
  - >-
    Distinguish three referents. (1) The Late Bronze Hittite empire centred at Hattusa (c.
    1650-1180 BCE). (2) The Iron Age Neo-Hittite (Luwian and Luwian-Aramean) states such as
    Carchemish and Hamath, the 'kings of the Hittites' in Kings and the 'Hatti' of Assyrian
    texts. (3) The 'sons of Heth' in Canaan (Gen 23), whose names are Semitic, probably a
    literary or local category rather than Anatolian Hittites.
  - >-
    Mendenhall's comparison of Hittite vassal treaties with biblical covenant form remains
    important but is debated against the Neo-Assyrian treaties. Cross-refer the treaty entries.
  - The Yahwistic name of Uriah 'the Hittite' leaves his ethnicity uncertain.
