type: people
cultures: [hittite, luwian]
scope: >-
  The Hittites of the Bible and their possible referents: the Late Bronze Hittite empire of
  Anatolia, the Iron Age Neo-Hittite states of Syria, and the 'sons of Heth' living in Canaan
  in Genesis. The entry sets out how these relate and where the biblical usage fits.
