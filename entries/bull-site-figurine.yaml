id: bull-site-figurine
title: '"Bull Site" Figurine'
aliases: [Dhahrat et-Tawileh bull]
type: artifact
cultures: [israelite, canaanite]
date:
  from: -1200
  to: -1100
  circa: true
  display: c. 1200–1100 BCE
scope: >-
  A bronze figurine of a zebu bull found in 1977 at an open-air Iron Age I cult place (the
  'Bull Site', Dhahrat et-Tawileh) in the northern Samarian hills, excavated by A. Mazar.
  It is a key artefact for bull imagery among the early highland settlers.
