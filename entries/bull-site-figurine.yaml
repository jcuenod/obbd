editorial:
  author_notes:
  - >-
    Mazar interpreted the site as an Israelite open cult place associated with El or Baal.
    Others (e.g. Ahlström) questioned the date and the Israelite attribution. Present both.
  - >-
    The bull may represent a deity or serve as a pedestal or emblem. This distinction matters
    for the golden-calf texts.
  - >-
    Avoid treating the figurine as a 'model' of the golden calf. It is evidence for bull iconography
    in the region.
  sources_to_check:
