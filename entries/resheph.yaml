editorial:
  author_notes:
  - >-
    Resheph's archery (Cypriot "Resheph of the arrow", ršp ḥṣ, equated with Apollo) explains
    the arrow and flame imagery in Ps 76 and Song 8.
  - >-
    At Ugarit he is equated with Nergal in god lists; relevant to plague and netherworld associations.
  - >-
    Present Hab 3:5 as the clearest case of a demoted deity in YHWH's entourage; the other
    passages show varying degrees of demythologization.
  - >-
    His Egyptian iconography (gazelle-headed crown, smiting pose) is well documented; use
    it for the image.
  sources_to_check:
