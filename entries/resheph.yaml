id: resheph
title: Resheph
aliases: [Reshef, Rašap]
type: deity
cultures: [canaanite, ugaritic, egyptian, phoenician]
scope: >-
  Resheph, a West Semitic god of plague and war, archer and gatekeeper of the netherworld,
  attested from Ebla to Cyprus and popular in New Kingdom Egypt as a smiting warrior god.
  In the Hebrew Bible rešep appears as a demoted divine figure and as a word for pestilence,
  flame or lightning.
passages:
- ref: Hab 3:5
  rel: imagery
  note: Deber (Pestilence) and Resheph (Plague) march in YHWH's retinue
- ref: Deut 32:24
  rel: imagery
  note: Devoured by Resheph and bitter Qeteb
- ref: Ps 78:48
  rel: imagery
  note: Flocks given over to rəšāpîm (thunderbolts or plagues)
- ref: Ps 76:3
  rel: imagery
  note: YHWH broke the 'rəšāpîm of the bow', flashing arrows (MT 76:4)
- ref: Job 5:7
  rel: imagery
  note: '''Sons of Resheph'' fly upward (sparks or birds)'
- ref: Song 8:6
  rel: imagery
  note: Love's flashes are 'flashes of fire'
- ref: 1Chr 7:25
  rel: language
  note: Resheph as an Ephraimite personal name
