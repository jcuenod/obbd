id: ephesus-silversmiths-hermeias-inscription
title: Ephesian Silversmiths' Inscription for Hermeias and Erotis
type: artifact
cultures: [greek, roman]
date:
  from: 41
  circa: true
  display: Reign of Claudius (41–54 CE) or later
scope: >-
  A funerary inscription from Ephesus recording the silversmith Hermeias, his wife Claudia
  Erotis, and the silversmiths' association responsible for protecting their tomb. It is a
  named, surviving witness to organized silversmiths at Ephesus.
passages:
- ref: Acts 19:24-27
  rel: attests
  note: >-
    Attests Ephesian silversmiths as an organized body; neither Demetrius nor the riot is
    independently attested
related: [greco-roman-associations, temple-of-artemis-ephesus, tebtynis-salt-merchants-papyrus]
media: []
external: {}
editorial:
