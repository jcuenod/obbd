editorial:
  author_notes:
  - >-
    Brunner's proposal that "righteousness and justice are the foundation of your throne"
    reflects Egyptian throne iconography (the throne base shaped like the maat sign) is widely
    cited and plausible.
  - >-
    Kayatz's thesis that Lady Wisdom in Prov 1-9 is modelled partly on Maat is influential
    but contested. Alternatives include Isis aretalogies, a Canaanite goddess, or inner-Israelite
    development.
  - >-
    H. H. Schmid's view of ṣedeq/ṣĕdāqâ as "world order" analogous to maat shaped a generation
    of scholarship and has since been criticised. Present it as part of the history of research.
  sources_to_check:
  - Assmann, Ma'at. Gerechtigkeit und Unsterblichkeit im Alten Ägypten (1990)
  - Kayatz, Studien zu Proverbien 1-9 (1966)
  - Brunner, 'Gerechtigkeit als Fundament des Thrones', VT 8 (1958)
