id: maat
title: Maat
aliases: [Ma'at]
type: concept
cultures: [egyptian]
scope: >-
  The Egyptian concept of right order (truth, justice, and cosmic and social harmony), personified
  as a goddess with an ostrich feather. The king was charged to "do maat". The entry covers
  maat as the foundation of kingship, ethics, and the judgment of the dead, and its proposed
  relevance to biblical ideas of righteousness and to Lady Wisdom.
