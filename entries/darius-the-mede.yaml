id: darius-the-mede
title: Darius the Mede
type: concept
cultures: [persian, jewish]
scope: >-
  The king who in the book of Daniel receives the kingdom after Belshazzar's death and under
  whom Daniel is thrown to the lions. No such ruler is attested between Nabonidus and Cyrus.
  The entry covers the figure's literary function and the identifications that have been proposed.
passages:
- ref: Dan 5:31
  rel: setting
  note: Darius the Mede receives the kingdom at age 62 (MT 6:1)
- ref: Dan 6:1-28
  rel: setting
  note: Darius's court, the 120 satraps, and the lions' den (MT 6:2-29)
- ref: Dan 9:1
  rel: setting
  note: '''Darius son of Ahasuerus, by birth a Mede'''
- ref: Dan 11:1
  rel: setting
  note: The first year of Darius the Mede
- ref: Dan 5:28
  rel: concept
  note: Kingdom given to 'the Medes and Persians'
- ref: Dan 2:39; 7:5; 8:20
  rel: concept
  note: Second kingdom usually read as Media (2:39; 7:5); 8:20 joins Media and Persia in one
    ram
- ref: Isa 13:17
  rel: concept
  note: Medes stirred up against Babylon
- ref: Jer 51:11, 28
  rel: concept
  note: The kings of the Medes against Babylon
