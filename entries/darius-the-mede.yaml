editorial:
  author_notes:
  - >-
    Mainstream critical view: Darius the Mede is a literary construct. He fills a Median slot
    required by prophecies of Median conquest and by the four-kingdom schema, and is partly
    modelled on Darius I (satrapies; cf. Dan 6:1).
  - >-
    Survey identifications neutrally and note that none has consensus: Gubaru/Ugbaru (Nabonidus
    Chronicle), Cyrus himself (reading Dan 6:28 as 'Darius, that is, Cyrus'), Cyaxares II
    (Xenophon), Astyages.
  - >-
    Dan 9:1 makes him son of Ahasuerus (Xerxes), inverting the historical relationship of
    Darius I and Xerxes.
  - >-
    Check the Old Greek's divergent royal names in Dan 5-6, which are useful for the figure's
    textual history.
  sources_to_check:
  - H. H. Rowley, Darius the Mede and the Four World Empires in the Book of Daniel (1935)
  - J. J. Collins, Daniel (Hermeneia, 1993)
