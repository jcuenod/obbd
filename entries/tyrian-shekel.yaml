id: tyrian-shekel
title: Tyrian Shekel and the Temple Tax
aliases: [Tyrian tetradrachm, Shekel of Tyre, Didrachm (half-shekel)]
type: realia
cultures: [phoenician, jewish]
date:
  from: -126
  to: 66
  display: 126 BCE–66 CE
scope: >-
  The silver shekels (tetradrachms) and half-shekels minted at Tyre from 126/125 BCE to the
  mid-60s CE, with the head of Melqart-Herakles and an eagle. Because of their reliable weight
  and purity they were required for the temple tax in late Second Temple Jerusalem. The entry
  covers the coin, the half-shekel tax and the money changers; coinage in general is treated
  under coinage.
