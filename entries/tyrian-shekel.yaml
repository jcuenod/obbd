editorial:
  author_notes:
  - >-
    Describe the coin: obverse laureate head of Melqart (Herakles), reverse eagle with the
    legend 'of Tyre the holy and inviolable'; dated by the Tyrian era from 126/125 BCE. Meshorer
    argued that from c. 18 BCE cruder 'KP/KAP' shekels were struck in Jerusalem under Herod's
    authority. That is a hypothesis and is debated.
  - >-
    Temple tax: rabbinic texts specify Tyrian currency for sanctuary payments (e.g. m. Bekhorot
    8:7), probably for its weight and purity despite the pagan image. Money changers set up
    tables in the provinces on 15 Adar and in the temple on 25 Adar (m. Sheqalim 1:3) and
    charged an agio (qolbon).
  - >-
    The annual half-shekel tax is a Second Temple development out of the one-time ransom of
    Exod 30 and the third-shekel of Neh 10:32. 4Q159 (Ordinances) appears to limit the half-shekel
    to once in a lifetime, which shows that the practice was disputed.
  - >-
    Matt 17:24-27: the didrachma (half-shekel) paid by each man, and the stater (tetradrachm)
    paying for two. After 70 the tax was diverted to the fiscus Iudaicus, which may affect
    how Matthew's readers heard the story.
  - >-
    The identification of the 'thirty pieces of silver' with Tyrian shekels is plausible but
    cannot be proved.
  sources_to_check:
