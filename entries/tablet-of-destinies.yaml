editorial:
  author_notes:
  - >-
    Distinguish the Tablet of Destinies (Enuma Elish I-IV; the Anzu myth), an emblem of power
    over the cosmos, from registers of individuals; the closer analogue to the 'book of life'
    is Nabu as scribe of destinies and the fixing of fates at the akītu festival.
  - >-
    Biblical heavenly books also draw on administrative practice (citizen rolls, Ezek 13:9;
    Isa 4:3) and records of deeds (Mal 3:16; Dan 7:10); S. Paul (1973) remains the standard
    survey.
  - >-
    Correct the popular claim that the biblical book of life is simply derived from the Tablet
    of Destinies.
  sources_to_check:
