id: tablet-of-destinies
title: Tablet of Destinies and the Book of Life
aliases: [ṭuppi šīmāti, Book of Life]
type: concept
cultures: [babylonian, mesopotamian]
scope: >-
  The Mesopotamian Tablet of Destinies, the emblem of supreme cosmic authority seized by Marduk
  in Enuma Elish and stolen by Anzu, together with the related idea of divine scribes (especially
  Nabu) writing the fates. The entry also covers the biblical "book of life" and heavenly
  books.
