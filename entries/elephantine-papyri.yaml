editorial:
  author_notes:
  - >-
    The colony predates Cambyses (525 BCE) according to the temple petition. Its origins (Saite
    mercenaries? refugees after 587?) are debated.
  - >-
    Discuss the colonists' self-designation (yhwdyʾ 'Judeans', also 'Arameans') and their
    worship of YHW alongside other named deities. Avoid anachronistic labels such as 'heterodox
    Judaism', and note the debate over syncretism versus Aramean neighbours.
  - >-
    Emphasize the absence of any clear knowledge of a written Torah, which matters for dating
    Pentateuchal authority.
  - >-
    Distinguish the main archives (Mibtahiah, Ananiah/Tamet, Jedaniah communal letters) and
    cite documents by TAD number.
  sources_to_check:
