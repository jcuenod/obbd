id: elephantine-papyri
title: Elephantine Papyri and Ostraca
type: text
cultures: [jewish, persian, egyptian]
date:
  from: -495
  to: -399
  circa: true
  display: c. 495–399 BCE
scope: >-
  The Aramaic papyri and ostraca of the Judean military colony on Elephantine island (Yeb)
  at Egypt's southern frontier, mostly from the 5th century BCE. The corpus includes family
  archives, contracts, communal letters about the temple of YHW, lists, and literary texts
  (Ahiqar, the Bisitun inscription). Individual key documents have their own entries.
passages:
- ref: Jer 44:1
  rel: setting
  note: Judeans settled in Egypt, including Pathros (Upper Egypt)
- ref: Jer 44:15-19
  rel: practice
  note: >-
    Judeans in Egypt honouring other deities; cf. Anat-Yahu and Eshem-Bethel in Elephantine
    texts
- ref: Neh 2:10, 19
  rel: attests
  note: Sanballat governor of Samaria, whose sons the colonists petitioned
- ref: Neh 12:22-23
  rel: attests
  note: Johanan the high priest, addressed by the colonists
- ref: Ezra 4:11-16; 5:7-17
  rel: form
  note: Aramaic official letter formulae, address and 'and now' transitions
- ref: Neh 13:23-27
  rel: practice
  note: Intermarriage; Elephantine contracts record Judean-Egyptian marriages
- ref: Deut 24:1-4
  rel: practice
  note: Divorce; Elephantine marriage contracts let either spouse initiate divorce
- ref: Mal 2:16
  rel: language
  note: '''Hate'' (śnʾ) as technical term for divorce, as in Elephantine contracts'
- ref: Neh 13:15-22
  rel: practice
  note: Ostraca refer to the Sabbath as a fixed day in diaspora life
