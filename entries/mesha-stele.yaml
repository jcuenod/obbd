scope: >-
  The basalt victory and building inscription of Mesha, king of Moab, found at Dhiban in 1868.
  It records Moab's liberation from Israelite control after the reign of Omri's dynasty and
  Mesha's building works, and is the longest Iron Age inscription from the southern Levant.
