editorial:
  author_notes:
  - >-
    Explain the discovery in 1868, the stone's breakage, and the role of Clermont-Ganneau's
    squeeze in its reconstruction.
  - >-
    Contrast the Moabite and biblical accounts of the revolt's timing ('in his days' vs. after
    Ahab's death) and outcome. The stele's 'forty years' of Omride control is a round number
    and does not fit biblical chronology.
  - >-
    Lines 17-18 (Mesha takes the [vessels] of YHWH from Nebo and drags them before Chemosh)
    contain the earliest datable extrabiblical attestation of the divine name YHWH.
  - >-
    Note the theological parallel of a national god angry with his land (Chemosh/YHWH) and
    the language of ḥērem. The stele says nothing about the sacrifice of the king's son in
    2 Kgs 3:27.
  - >-
    Present the 'House of David' (line 31) reading as proposed and debated, not as settled.
    Lemaire proposed it in 1994; Finkelstein, Na'aman and Römer (2019) proposed 'Balak'; new
    imaging has been claimed for both readings.
  sources_to_check: [KAI 181, COS 2.23, ANET 320-321, 'Aḥituv, Echoes from the Past (2008)']
