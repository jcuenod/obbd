id: treatment-of-captives
title: Treatment of Captives and War Atrocities
aliases: [War atrocities, Prisoners of war]
type: practice
cultures: [assyrian, egyptian, ane]
scope: >-
  The treatment of defeated enemies and captives in ancient Near Eastern warfare: mutilation,
  blinding, impalement, display of bodies, trophy-taking, killing of non-combatants, and enslavement.
  The entry covers biblical narratives, laws and prophetic oracles alongside Assyrian and
  Egyptian reliefs and inscriptions.
