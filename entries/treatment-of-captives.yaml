editorial:
  author_notes:
  - >-
    Assyrian reliefs (impaled Judahites at Lachish) and inscriptions (Ashurnasirpal II's flaying
    and piles of heads) served as propaganda of terror. Separate rhetoric from routine practice.
  - >-
    Egyptian scenes of counting severed hands and phalli (Medinet Habu) illustrate 1 Sam 18:25-27.
  - On 'ripping open pregnant women' as a stock motif, see M. Cogan, JAOS 103 (1983).
  - >-
    Blinding captives for labour (Samson; Zedekiah) is attested in Mesopotamia. Deuteronomy's
    war laws (Deut 20; 21:10-14) regulate rather than abolish practices.
