id: lamassu
title: Lamassu (Assyrian Winged Guardian Figures)
aliases: [aladlammû, shedu, human-headed winged bulls]
type: realia
cultures: [assyrian]
scope: >-
  The colossal human-headed winged bulls and lions that guarded the gateways of Neo-Assyrian
  palaces at Nimrud, Khorsabad and Nineveh, later adopted at Persepolis. The entry covers
  their form, protective function, and use as comparative material for the biblical cherubim
  and Ezekiel's living creatures.
passages:
- ref: Ezek 1:5-10
  rel: imagery
  note: Composite living creatures with human, lion, ox and eagle faces
- ref: Ezek 10:14
  rel: imagery
  note: Cherub's face identified as an ox face elsewhere
- ref: Gen 3:24
  rel: concept
  note: Cherubim stationed as guardians at the entrance to Eden
- ref: 1Kgs 6:23-28
  rel: realia
  note: Colossal winged cherubim in the inner sanctuary
- ref: Ezek 28:14, 16
  rel: concept
  note: Guardian cherub
- ref: Dan 7:4
  rel: imagery
  note: Lion with eagle's wings
- ref: Rev 4:6-8
  rel: imagery
  note: Four living creatures with faces of lion, ox, human, eagle
