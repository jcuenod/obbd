editorial:
  author_notes:
  - >-
    Biblical cherubim are now usually reconstructed from Levantine iconography as winged sphinxes
    (lion body, human head), as on the Megiddo ivories and the Ahiram sarcophagus, not as
    Assyrian bulls.
  - >-
    The proposed etymology of kerub from Akkadian karibu ('one who blesses/prays') is possible
    but uncertain; flag it as debated.
  - >-
    Ezekiel, writing in Babylonia, could have seen such composite guardians; the comparison
    is iconographic background, not identity.
  - >-
    Many lamassu have five legs, designed to be seen from front and side; ISIS destruction
    at Nimrud and Nineveh (2015) is relevant for current state.
  sources_to_check:
  - Keel, The Symbolism of the Biblical World (1978)
