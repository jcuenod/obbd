id: athtar
title: Athtar (ʿAṯtar)
aliases: [ʿAṯtar, Ashtar, Attar]
type: deity
cultures: [ugaritic, arabian, moabite]
scope: >-
  The West Semitic and South Arabian male deity ʿAṯtar, associated with the Venus star. In
  the Ugaritic Baal Cycle he is made king after Baal's death but proves too small for Baal's
  throne and comes down to rule the earth. The entry covers his Ugaritic, Moabite (Ashtar-Chemosh)
  and South Arabian forms and the proposal that his myth lies behind the fall of the "Day
  Star" in Isa 14.
passages:
- ref: Isa 14:12-15
  rel: parallel
  disputed: true
  note: >-
    Day Star, son of Dawn, aspires to the mount of assembly in Zaphon and falls; cf. Athtar's
    failed enthronement
- ref: Ezek 28:2-10
  rel: parallel
  disputed: true
  note: A ruler who claims to sit on the seat of the gods is brought down to the Pit
related: [baal-cycle, astarte, ishtar, shahar-and-shalim, mesha-stele, chemosh, cosmic-mountain]
media: []
external:
