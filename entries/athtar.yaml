  wikidata: Q755753
editorial:
  author_notes:
  - >-
    The key Ugaritic passage is KTU 1.6 I 43-67: El and Athirat choose ʿAṯtar ʿrẓ ('the terrible'?),
    whose feet do not reach the footstool and whose head does not reach the top of Baal's
    throne; he descends and rules 'the earth'. In KTU 1.2 III he complains that he has no
    palace. Quote from a standard translation.
  - >-
    Linking Isa 14:12-15 to ʿAṯtar is one of several proposals (others include Helel and Shahar
    as Venus and Dawn, or Greek Phaethon). Present it as debated. H. R. Page (1996) traces
    a 'cosmic rebellion' myth through Ugaritic and biblical texts; note that this is a reconstruction.
  - >-
    ʿAṯtar is the male counterpart of Astarte (ʿAštart) and Mesopotamian Ishtar; keep the
    gender distinction clear. On the Mesha Stele (line 17) Mesha devotes Nebo's population
    to ʿštr kmš (Ashtar-Chemosh), probably a compound or a consort pairing; its meaning is
    debated.
  - >-
    In South Arabia ʿAṯtar was a leading god (often first in lists). Some scholars connect
    him with irrigation and rain; avoid building too much on later Arabic etymologies.
  sources_to_check:
