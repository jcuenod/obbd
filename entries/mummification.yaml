id: mummification
title: Mummification and Embalming
aliases: [Embalming]
type: practice
cultures: [egyptian]
scope: >-
  Egyptian practices of preserving the body for the afterlife: evisceration, desiccation in
  natron, anointing, and wrapping, with the associated mourning period. The entry covers the
  embalming of Jacob and Joseph in Genesis, and the contrast with Israelite and later Jewish
  burial customs.
passages:
- ref: Gen 50:2-3
  rel: practice
  note: 'Physicians embalm Jacob: forty days for embalming, seventy days of Egyptian mourning'
- ref: Gen 50:26
  rel: practice
  note: Joseph embalmed and placed in a coffin in Egypt
- ref: Exod 13:19
  rel: practice
  note: Joseph's bones carried out of Egypt for burial in the homeland
- ref: 2Chr 16:14
  rel: practice
  note: 'Asa laid on a bier filled with spices: Judahite practice without mummification'
- ref: John 19:39-40
  rel: practice
  note: Jewish burial with spices and linen wrappings, in contrast to Egyptian embalming
