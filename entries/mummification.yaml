editorial:
  author_notes:
  - >-
    Compare the 40 and 70 days of Gen 50:3 with Herodotus (70 days in natron) and with Egyptian
    texts that put about 70 days between death and burial. The biblical figures do not match
    any single source exactly, so do not force harmonisation.
  - >-
    In Gen 50:2 the embalmers are called "physicians" (rōpĕʾîm). This is often noted as an
    unusual detail.
  - >-
    Jacob and Joseph are the only Israelites said to be embalmed, a deliberate Egyptian touch
    in the narrative. Israelite practice favoured bench tombs and secondary burial of bones.
  - Avoid popular claims that particular mummies are those of biblical figures.
  sources_to_check:
  - Herodotus, Histories 2.86-89
  - Diodorus Siculus, Library of History 1.91
  - Ikram and Dodson, The Mummy in Ancient Egypt (1998)
