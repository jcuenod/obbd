id: 4q246-son-of-god
title: 4Q246 (Son of God Text)
aliases: [4Q246, Aramaic Apocalypse]
type: artifact
cultures: [jewish]
scope: >-
  A fragmentary Aramaic apocalypse from Qumran describing successive kingdoms and a disputed
  figure called "Son of God" and "Son of the Most High". The entry consolidates a comparison
  already explained under Messianic Expectations.
passages:
- ref: Luke 1:32-35
  rel: language
  note: >-
    Shares Son of God and Son of the Most High titles without establishing identical referents
    or dependence
- ref: Dan 7:13-14, 27
  rel: parallel
  note: >-
    An enduring kingdom and the people of God connect the apocalypse with Daniel's kingdom
    vision
- ref: Ps 82:6-8
  rel: parallel
  disputed: true
  note: >-
    A proposed allusion links divine sonship language and judgment of rulers or heavenly powers
related: [messianic-expectations, king-as-son-of-god, four-kingdoms-schema, dead-sea-scrolls,
  divine-council]
