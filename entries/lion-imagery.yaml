editorial:
  author_notes:
  - >-
    B. A. Strawn (What Is Stronger than a Lion?, 2005) shows that the lion stands for both
    threat and power and is applied to gods, kings and enemies alike.
  - >-
    Royal lion hunts (Assyrian reliefs; Ezek 19) express the king as protector against chaos.
    Lion-flanked thrones and gates are standard royal display.
  - >-
    Lions lived in the Iron Age Levant, so the imagery also reflects a real pastoral danger
    (Amos 3:12, cf. Exod 22:13; 1 Sam 17:34-37).
  - >-
    Distinguish ancient usage from the later 'Lion of Judah' tradition (Ethiopian royal ideology).
