id: lion-imagery
title: Lion Imagery
type: concept
cultures: [ane]
scope: >-
  The lion as an image of deity, king, tribe and enemy in the Hebrew Bible, against the ancient
  Near Eastern iconography of royal lion hunts, lion-guarded thrones and gates, and lion-associated
  deities. The entry covers metaphor and material culture. Composite lion-creatures belong
  elsewhere.
