editorial:
  author_notes:
  - >-
    Meshel excavated the site in 1975-76, and the final report appeared in 2012. It is essentially
    a single-phase site dated by radiocarbon to c. 800 BCE, with strong links to the northern
    kingdom (the Joash and Jeroboam II era).
  - >-
    Its function is debated. Most see a way station or caravanserai with a religious dimension
    rather than a temple proper. The 'bench room' held the inscribed pithoi.
  - >-
    The drawings (Bes-like figures, a seated lyre player, a cow suckling a calf) need not
    illustrate the inscriptions. Avoid identifying the lyre player as Asherah.
  sources_to_check:
  - >-
    Meshel, Kuntillet ʿAjrud (Ḥorvat Teman) - An Iron Age II Religious Site on the Judah-Sinai
    Border (2012)
