  rel: concept
  note: YHWH comes from Sinai, Seir and Paran; cf. 'YHWH of Teman'
- ref: Hab 3:3
  rel: language
  note: '''God came from Teman''; cf. ''YHWH of Teman'' at the site'
- ref: Judg 5:4
  rel: concept
  note: YHWH marching from Seir and Edom
- ref: Deut 16:21
  rel: practice
  disputed: true
  note: Ban on an asherah beside YHWH's altar; cf. 'YHWH ... and his asherah'
- ref: Amos 8:14
  rel: concept
  note: Local manifestations of a god; cf. 'YHWH of Samaria'
