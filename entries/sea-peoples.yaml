scope: >-
  The groups called 'Sea Peoples' in modern scholarship, after Egyptian texts of Merneptah
  and Ramesses III that describe invaders 'from the islands'. Covers the sources, the groups
  named, and their role in the Late Bronze Age collapse and in the settlement of the Philistines
  and others on the Levantine coast.
