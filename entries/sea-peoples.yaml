editorial:
  author_notes:
  - >-
    The term is modern (Maspero). The Egyptian sources are Merneptah's Libyan war texts and
    the Ramesses III Year 8 inscriptions and reliefs at Medinet Habu. They name the Peleset,
    Tjeker (Sikil), Shekelesh, Denyen, Weshesh, Sherden, Lukka and Ekwesh.
  - >-
    The Late Bronze collapse had many causes (drought, systems collapse, earthquakes, migration).
    Avoid a single-cause story in which the Sea Peoples destroyed everything.
  - >-
    Sherden appear earlier as Egyptian mercenaries (e.g. in the Kadesh reliefs). The proposed
    link between the Denyen and the tribe of Dan (Yadin) is speculative.
  - Ugarit's final letters about enemy ships are often cited. Cross-refer ugarit.
  sources_to_check:
  - >-
    Killebrew and Lehmann (eds.), The Philistines and Other 'Sea Peoples' in Text and Archaeology
    (2013)
