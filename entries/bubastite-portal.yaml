- ref: Josh 17:11
  rel: attests
  note: Beth-shean, Taanach, and Megiddo, all named in the list
- ref: 1Kgs 12:25
  rel: attests
  note: Penuel, fortified by Jeroboam, appears in the list; the campaign also struck Israel
