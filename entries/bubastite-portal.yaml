editorial:
  author_notes:
  - >-
    Jerusalem does not appear in the preserved list, although parts of the list are lost.
    Present the usual explanations (payment of tribute, as in 1 Kgs 14:26; damage to the list;
    Jerusalem not targeted) without choosing one dogmatically.
  - >-
    Scholars debate whether the order of name-rings can be read as an itinerary (Mazar, Kitchen,
    Na'aman) or reflects separate columns and scribal conventions (K. A. Wilson). Present
    the route reconstruction as hypothetical.
  - >-
    The campaign is a key synchronism for Israelite chronology (c. 925), but its absolute
    date depends on Third Intermediate Period chronology. Destruction layers attributed to
    Shoshenq figure in the low-chronology debate.
  - A fragment of a Shoshenq stele found at Megiddo confirms an Egyptian presence there.
  - Breasted's reading of one name as "the Field of Abram" is uncertain. Do not build on it.
  sources_to_check:
  - Ritner, The Libyan Anarchy (SBL Writings from the Ancient World, 2009)
  - Kitchen, The Third Intermediate Period in Egypt (1100-650 BC)
  - Wilson, The Campaign of Pharaoh Shoshenq I into Palestine (2005)
