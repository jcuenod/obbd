id: bubastite-portal
title: Bubastite Portal of Shoshenq I
aliases: [Shoshenq I topographical list, Shishak relief]
type: artifact
cultures: [egyptian]
date:
  from: -925
  to: -925
  circa: true
  display: c. 925 BCE
scope: >-
  The gateway and adjoining relief of Shoshenq I in the first court of the Amun temple at
  Karnak. The relief shows the king smiting Asiatics and Amun leading rows of name-rings of
  captured towns in Palestine. It is the Egyptian record of the campaign remembered in Kings
  and Chronicles as Shishak's invasion.
