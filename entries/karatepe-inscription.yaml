id: karatepe-inscription
title: Karatepe Bilingual (Azatiwada)
aliases: [Azatiwada Inscription, Karatepe Bilingual]
type: artifact
cultures: [luwian, phoenician]
date:
  from: -725
  to: -675
  circa: true
  display: c. 725–675 BCE
scope: >-
  The Phoenician and Hieroglyphic Luwian bilingual of Azatiwada, a vassal ruler under Awariku,
  king of the Danunians (Adana), carved at the gates of the fortress of Karatepe-Aslantaş
  in Cilicia (found 1946). It describes the peace, plenty and security of his rule and was
  key to the decipherment of Hieroglyphic Luwian.
passages:
- ref: 1Kgs 4:25
  rel: concept
  note: 'Peace and security: each under vine and fig tree (MT 5:5)'
- ref: Mic 4:4
  rel: concept
  note: Security under vine and fig tree, with none to make afraid
- ref: Judg 5:6
  rel: imagery
  note: Roads deserted in insecurity; Azatiwada says a woman could walk alone with her spindles
- ref: Zech 8:4-5
  rel: imagery
  note: Old and young safe in the streets as a sign of restored order
- ref: 1Kgs 10:28-29
  rel: setting
  note: Kue (Que, Cilicia), the Danunian kingdom, as a source of horses
related: [royal-ideology, kilamuwa-stele, phoenicians, resheph, chariots-and-horses, hittites-and-hethites]
