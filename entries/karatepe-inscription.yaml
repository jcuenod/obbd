editorial:
  author_notes:
  - >-
    Awariku is the Urikki of Que in Assyrian sources (Tiglath-pileser III, Sargon II). This
    anchors the date in the late 8th century, though some prefer the early 7th.
  - >-
    The bilingual is valuable for divine-name equivalences, e.g. Phoenician Baal and Luwian
    Tarhunza, and Resheph of the birds (ršp ṣprm).
  - >-
    The link between the Danunians (dnnym) and the biblical tribe of Dan or the Homeric Danaoi
    is speculative. If mentioned, label it as such.
