editorial:
  author_notes:
  - >-
    The 701 account first appears on the Rassam Cylinder (700), the copy closest to the events;
    later prisms abridge it. Do not confuse the Sennacherib Rassam Cylinder with Ashurbanipal's
    Rassam Cylinder.
  - >-
    The gold tribute (30 talents) matches 2 Kgs 18:14; the silver differs (800 vs 300 talents).
    The annals place the tribute after Sennacherib's return to Nineveh.
  - >-
    The annals do not claim the capture of Jerusalem; their silence on its fall, against the
    reported capture of 46 walled cities and 200,150 people, is central to the historical
    debate.
  - >-
    The two-campaign theory (a second invasion c. 688) is now largely abandoned; present the
    mainstream view that the biblical accounts combine sources about one campaign (Stade's
    B1/B2 analysis).
