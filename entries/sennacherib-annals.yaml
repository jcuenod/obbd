scope: >-
  The annalistic inscriptions of Sennacherib on clay cylinders and hexagonal prisms (Rassam
  Cylinder, 700 BCE; Taylor and Jerusalem Prisms, 691; Oriental Institute Prism, 689), whose
  third-campaign account narrates the 701 campaign to the Levant, the siege of Judahite cities,
  and Hezekiah shut up in Jerusalem 'like a bird in a cage'.
