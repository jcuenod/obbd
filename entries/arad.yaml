scope: >-
  The two-part site of Tel Arad in the eastern Negev: an Early Bronze Age city and, on its
  hill, a series of Iron Age Judahite fortresses containing a shrine. Covers the fortress
  and shrine, the ostraca, and the problem of the Late Bronze Canaanite king of Arad.
