editorial:
  author_notes:
  - >-
    There is no Late Bronze occupation at Tel Arad. Proposed solutions to Num 21 include Tel
    Malhata or 'Arad' as the name of a region. Present this as a known problem.
  - >-
    The shrine has a raised niche with one (perhaps two) massebot and two limestone altars.
    Residue analysis (Arie et al., 2020) identified cannabis on one altar and frankincense
    on the other; report this carefully.
  - >-
    The dating of the shrine and its dismantling is contested. Aharoni placed it from Strata
    XI-VII with closure under Hezekiah or Josiah; Herzog's reappraisal limits it to Strata
    X-IX (eighth century) with closure c. 715-700.
  - >-
    The Eliashib archive (Stratum VI, c. 600) mentions Kittim and the Edomite threat. Leave
    detail to arad-ostraca.
  sources_to_check: [NEAEHL, 'Aharoni, Arad Inscriptions (1981)']
