editorial:
  author_notes:
  - >-
    The comparisons are typological. Israelite texts lack a post-mortem judgment of the dead
    comparable to Spell 125, and the entrance liturgies (Pss 15; 24) concern access to the
    temple, not the afterlife.
  - >-
    The image of YHWH weighing hearts (Proverbs) is widely linked to Egyptian iconography,
    which circulated in the Levant on scarabs and other objects. Note this mediation.
  - >-
    Explain that "Book of the Dead" is a modern label. Each papyrus was a selection of spells,
    and there was no canonical sequence before the Saite recension.
  - Popular descriptions of it as an "Egyptian Bible" are misleading.
