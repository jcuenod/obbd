id: book-of-the-dead
title: Book of the Dead
aliases: [Spells for Going Forth by Day]
type: text
cultures: [egyptian]
date:
  from: -1550
  to: -50
  circa: true
  display: c. 1550–50 BCE
scope: >-
  The modern name for a corpus of nearly two hundred Egyptian funerary spells, written on
  papyri and other burial equipment from the New Kingdom to the Roman period, to guide and
  protect the deceased. Spell 125, with the judgment and weighing of the heart and the "negative
  confession", matters most for biblical studies.
passages:
- ref: Job 31:5-40
  rel: form
  note: >-
    Oath of clearance listing wrongs not committed; cf. Spell 125's declarations of innocence
- ref: Job 31:6
  rel: imagery
  note: '''Let me be weighed in a just balance'''
- ref: Prov 16:2; 21:2; 24:12
  rel: imagery
  note: YHWH 'weighs' spirits/hearts; cf. weighing of the heart
- ref: Ps 24:3-6
  rel: parallel
  note: 'Qualifications for entering the holy place: clean hands, pure heart'
- ref: Ps 15:1-5
  rel: parallel
  note: Entrance requirements stated as moral conduct
- ref: Deut 26:13-14
  rel: form
  disputed: true
  note: >-
    Declaration of ritual innocence regarding the tithe, compared with the negative confession
- ref: Dan 5:27
  rel: imagery
  disputed: true
  note: '''Weighed on the scales and found wanting'''
