editorial:
  author_notes:
  - >-
    No cited inscription establishes universal compulsory guild membership or compulsory participation
    in idol meals. The reconstruction of Rev 2:20 as a guild-meal dispute is contested and
    must remain flagged.
  - >-
    The Iobacchoi regulations (IG II² 1368) date to 164/165 CE. Present them as later comparative
    evidence, not direct evidence for Paul's congregation.
  - >-
    Distinguish comparative institutional similarities from claims of organizational or literary
    dependence. Compare synagogues without equating all group types.
  - >-
    The Sarapis invitation (P.Oxy. I 110) names no association and is no evidence of compulsory
    guild attendance.
  sources_to_check:
  - TAM V 972 = IGR IV 1242 = AGRW 129
  - IEph 2212 = NewDocs IV 1 = GRA 126 = AGRW 161
  - P.Mich. V 245 = GRA III 219 = AGRW 302
  - IG II² 1368 = LSCG 51 = GRA 51 = AGRW 7
  - P.Oxy. I 110, lines 1-4
