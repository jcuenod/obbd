id: greco-roman-associations
title: Associations, Occupational Guilds, and Communal Life
type: practice
cultures: [greek, roman]
scope: >-
  Greco-Roman associations organized people around occupations, cults, origins, and social
  ties through officers, contributions, gatherings, meals, mutual obligations, and commemorative
  practices. The entry treats the institution across the Mediterranean; Jewish synagogues
  and the West Semitic marzeaḥ have their own entries.
passages:
- ref: Acts 19:23-41
  rel: practice
  note: >-
    Ephesian occupational organization provides institutional background for the gathering
    of craftsmen
- ref: 1Cor 6:1-8
  rel: practice
  note: >-
    Later association rules for internal dispute resolution offer a comparison for Paul's
    objections to members' public lawsuits
- ref: 1Cor 11:17-34
  rel: practice
  note: >-
    Association gatherings provide comparative evidence for the social organization of communal
    meals
- ref: 1Cor 14:26-40
  rel: practice
  note: >-
    Later association regulations offer comparative evidence for order, participation, and
    discipline at gatherings
- ref: Rev 2:18-29
  rel: practice
  note: Thyatiran associations connect occupation, civic honor, and imperial priesthood
- ref: Rev 2:20
  rel: practice
  disputed: true
  note: >-
    Guild-related cult meals are one proposed context for the sacrificial eating criticized
    here
related:
