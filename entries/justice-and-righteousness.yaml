editorial:
  author_notes:
  - >-
    Weinfeld (1995) argued that mišpāṭ ûṣĕdāqâ, like kittum u mīšarum, refers above all to
    royal social reform and release, not abstract jurisprudence. His thesis is influential;
    note criticisms that it can flatten differences between texts.
  - >-
    Hammurabi's prologue and epilogue (he was called 'to make justice appear in the land'
    and styles himself 'king of justice', šar mīšarim) and Old Babylonian mīšarum edicts give
    the institutional background. Kittum (from kânu 'be firm') and mīšarum (from ešēru 'be
    straight') parallel Hebrew ʾĕmet/ṣedeq and mêšārîm.
  - >-
    Kittu and Mīšaru appear as deified attendants of Šamaš, which helps explain personified
    righteousness and justice around the divine throne (Ps 85; 89:14; 97:2). Egyptian maat
    is also depicted as the base of the throne.
  - >-
    The prophetic critique (Amos, Isaiah, Jeremiah) applies the royal ideal to the whole society
    and judges kings by it. Keep this distinction clear from the ideology itself.
  sources_to_check:
  - M. Weinfeld, Social Justice in Ancient Israel and in the Ancient Near East (1995)
  - F. R. Kraus, Königliche Verfügungen in altbabylonischer Zeit (SD 11, 1984)
  - H. H. Schmid, Gerechtigkeit als Weltordnung (BHT 40, 1968)
