id: justice-and-righteousness
title: Justice and Righteousness and Royal Equity (kittum and mīšarum)
aliases: [mišpāṭ ûṣĕdāqâ, kittum u mīšarum, social justice, royal equity]
type: concept
cultures: [hebrew, babylonian, egyptian]
scope: >-
  The paired ideals of "justice and righteousness" (mišpāṭ ûṣĕdāqâ) in the Hebrew Bible and
  their ancient Near Eastern counterparts, especially Akkadian kittum u mīšarum ("truth and
  equity") and Egyptian maat. It covers the king's duty to protect the weak, royal acts of
  release, and justice as the foundation of the divine throne. Maat, the mīšarum edicts and
  debt release have their own entries.
