  - Susa already summarizes this composition; it should not be counted as absent evidence.
  - >-
    The type is text, for the multi-witness composition. An artifact treatment would have
    to specify SB 2789 and its physical properties. Do not describe SB 2789 alone as trilingual;
    that witness is Old Persian.
  - The account does not establish Esther's banquet or identify its room or participants.
