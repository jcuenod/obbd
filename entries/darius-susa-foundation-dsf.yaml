title: Darius's Susa Foundation Inscription (DSf)
aliases: [DSf, Susa foundation charter]
type: text
cultures: [persian]
scope: >-
  Darius I's foundation inscription describing the materials, supply routes, and workers drawn
  from across his empire to build the palace at Susa. The composition survives in multiple
  witnesses, including the Old Persian clay tablet Louvre SB 2789.
passages:
- ref: Esth 1:2-7
  rel: setting
  note: >-
    Background for Susa's imperial palace and resources; Darius's project predates the narrative's
    reign of Ahasuerus
- ref: Ezra 3:7
  rel: practice
  note: >-
    Compare procurement of materials and skilled labor across regions; the projects and politics
    differ
related: [susa, darius-i, persia, temple-building-accounts, persepolis]
