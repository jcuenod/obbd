editorial:
  author_notes:
  - >-
    R. R. Wilson, Genealogy and History in the Biblical World (1977), is the standard work
    on the domestic, political and religious functions of genealogies and their fluidity.
  - >-
    The Assyrian King List begins with 'kings who lived in tents', and the Genealogy of the
    Hammurabi Dynasty shares names with it. A. Malamat (JAOS 88, 1968) compared both with
    biblical genealogies.
  - >-
    The lifespans in Gen 5 and 11 differ across the MT, Samaritan Pentateuch and LXX. Compare
    the much larger reigns of the antediluvian kings in the Sumerian King List.
  - >-
    Genealogies are not chronologies. Telescoping and gaps are normal, so a calculation like
    Ussher's misuses them.
