id: genealogies
title: Genealogies in the Ancient Near East
aliases: [Genealogy, King lists]
type: concept
cultures: [ane, assyrian, amorite]
scope: >-
  The forms and functions of genealogies in the Hebrew Bible compared with ancient Near Eastern
  king lists and royal genealogies, such as the Sumerian King List, the Assyrian King List
  and the Genealogy of the Hammurabi Dynasty. The entry covers linear and segmented forms,
  ten-generation patterns and long lifespans.
