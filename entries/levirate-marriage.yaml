id: levirate-marriage
title: Levirate Marriage
aliases: [Yibbum, Ḥaliṣah]
type: practice
cultures: [hebrew, assyrian, hittite]
scope: >-
  The custom by which the brother (or another male relative) of a man who died without a son
  married the widow to provide an heir for the dead man, as regulated in Deut 25:5-10 and
  reflected in Gen 38 and Ruth, with Middle Assyrian and Hittite parallels.
passages:
- ref: Deut 25:5-10
  rel: practice
  note: Levirate duty to 'raise up a name' for the dead brother; ḥălîṣâ ceremony
- ref: Gen 38:6-26
  rel: practice
  note: Onan's refusal; Tamar secures an heir from her father-in-law
- ref: Ruth 4:5, 10
  rel: practice
  note: Boaz acquires Ruth 'to maintain the dead man's name on his inheritance'
- ref: Ruth 3:9-13
  rel: practice
  note: Ruth's appeal to Boaz as redeemer (gōʾēl)
- ref: Lev 18:16
  rel: practice
  note: Prohibition of a brother's wife, in tension with the levirate
- ref: Lev 20:21
  rel: practice
  note: Childlessness as penalty for taking a brother's wife
- ref: Mark 12:18-27
  rel: practice
  note: Sadducees' levirate puzzle about the resurrection
related: [middle-assyrian-laws, hittite-laws, inheritance-and-birthright, land-redemption,
  marriage-and-bride-price, courts-and-legal-procedure]
media: []
