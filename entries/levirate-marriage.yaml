editorial:
  author_notes:
  - >-
    Comparative texts include MAL A §§30, 33, 43 and HL §193, where the widow passes to a
    brother, then to the father-in-law, then to a nephew. The father-in-law clause illuminates
    Gen 38.
  - >-
    Debate whether Ruth depicts levirate (Boaz is not a brother) or a fusion of levirate custom
    with land redemption. Also debate how Deut 25 relates to the narratives.
  - >-
    Explain the purpose (the deceased's name and patrimony) and the shaming ḥălîṣâ rite (sandal
    removed, spitting). Compare the sandal in Ruth 4:7-8, where it seals a transfer.
  - >-
    Note the apparent conflict with Lev 18:16; 20:21 and its rabbinic resolution (m. Yevamot).
  sources_to_check:
