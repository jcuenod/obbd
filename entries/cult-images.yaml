editorial:
  author_notes:
  - >-
    In Mesopotamian theology the statue was a locus of divine presence. It was "born in heaven",
    consecrated by ritual, and treated as a living being, but not simply identical with the
    god. Note that the biblical parodies (Isa 44; Jer 10) deliberately collapse this distinction.
  - >-
    Godnapping and return were standard imperial practice. Examples are Marduk's statue taken
    to Hatti and Elam, Assyrian removal of divine images, and the Cyrus Cylinder's account
    of returning gods to their shrines. This is relevant to 1 Sam 4-6 and Isa 46.
  - >-
    Cult statues were made of a wooden core overlaid with precious metal and clothed (cf.
    Isa 30:22; Jer 10:9). Give the material realities.
  - >-
    Avoid the term "idolatry" in descriptive sections, or explain it as an insider polemical
    category.
  sources_to_check:
