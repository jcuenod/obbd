scope: >-
  The making, care, transport, capture, and theology of divine statues in Mesopotamia, Egypt,
  and the Levant, and the biblical polemic against "idols". Covers godnapping and the return
  of statues. The induction rituals and Israel's aniconic tradition have their own entries.
