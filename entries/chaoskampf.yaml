editorial:
  author_notes:
  - >-
    The closest biblical parallels are Ugaritic (Baal versus Yam, and Anat's and Baal's defeat
    of Litan/Lotan, the seven-headed serpent). The parallels are not mainly Babylonian (Day,
    God's Conflict with the Dragon and the Sea). Isa 27:1 echoes KTU 1.5 I 1-3 almost word
    for word.
  - >-
    Distinguish combat from creation. At Ugarit, Baal's victory over Yam secures kingship
    and a palace and is not a creation story. In Enuma Elish combat leads to creation. Biblical
    texts link the combat to creation (Ps 74; 89), to the exodus (Isa 51), and to eschatology
    (Isa 27; Rev).
  - >-
    Whether Gen 1 deliberately demythologizes the combat myth is debated (Gunkel versus Tsumura;
    Watson, Chaos Uncreated). Present it as a debate. Some scholars question whether "chaos"
    is the right category at all.
  - >-
    Mention the Mari letter (A.1968) in which Addu gives Zimri-Lim the weapons with which
    he fought Sea, as evidence of the motif in the Amorite West.
  sources_to_check:
