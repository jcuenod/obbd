editorial:
  author_notes:
  - >-
    Standard works: D. M. Carr, Writing on the Tablet of the Heart (2005); K. van der Toorn,
    Scribal Culture and the Making of the Hebrew Bible (2007); C. A. Rollston, Writing and
    Literacy in the World of Ancient Israel (2010).
  - >-
    Epigraphic evidence for formal training includes a standardized Old Hebrew script, hieratic
    numerals, and abecedaries and practice texts (Kuntillet ʿAjrud, Tel Zayit, ʿIzbet Ṣarṭah).
  - >-
    Whether Israel had formal 'schools' is debated (A. Lemaire versus J. Crenshaw and M. Haran).
    Avoid assuming Mesopotamian-style institutions.
  - >-
    Sirach's praise of the scribe echoes the Egyptian Satire of the Trades, though the degree
    of dependence is debated.
