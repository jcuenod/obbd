scope: >-
  The scribe (sōpēr) as royal official, temple functionary and tradent of texts in Israel
  and Judah, and the education of scribes as known from Mesopotamian, Egyptian and Levantine
  evidence. The entry covers the role of scribal culture in the formation of the Hebrew Bible.
