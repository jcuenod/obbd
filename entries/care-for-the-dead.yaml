id: care-for-the-dead
title: Care for the Dead and Ancestor Veneration
aliases: [Cult of the dead, Ancestor veneration, Kispu]
type: practice
cultures: [ane, ugaritic, babylonian, aramean]
scope: >-
  Practices of feeding, commemorating, invoking and consulting dead kin and ancestors in Israel
  and its neighbours: Mesopotamian kispu, Ugaritic royal ancestor rites, and the Katumuwa
  stele. The entry covers the debate over how widespread such practices were in Israel and
  Judah.
