editorial:
  author_notes:
  - >-
    Mesopotamian kispu (regular food and water offerings and invocation of the name, with
    a pāqidu caretaker) and the Ugaritic duties of the ideal son (KTU 1.17 i 26-34, including
    setting up a stele for the ancestral god) are central comparanda.
  - >-
    The Katumuwa stele (Zincirli, c. 735 BCE) speaks of the dead man's 'soul' (nbš) in the
    stele and of annual offerings.
  - >-
    Present the range of views: maximalists such as E. Bloch-Smith and T. J. Lewis see an
    established cult of the dead in Judah; B. B. Schmidt (Israel's Beneficent Dead, 1994)
    argues for a late, limited one. Distinguish feeding and commemoration from worship.
  - >-
    The identification of the teraphim as ancestor figurines (K. van der Toorn) is one hypothesis
    among several.
  sources_to_check:
  - KTU 1.17 i 26-34 (duties of the son)
  - KTU 1.161 (Ugaritic royal funerary ritual)
  image_query: Katumuwa stele
