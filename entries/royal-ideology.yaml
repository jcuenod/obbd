id: royal-ideology
title: Royal Ideology and Sacral Kingship
aliases: [Sacral kingship, Royal theology]
type: concept
cultures: [ane]
scope: >-
  The ancient Near Eastern ideology of kingship as divinely chosen, guarantor of justice,
  fertility and order, and victor over chaos and enemies, and its Israelite and Judahite form
  in the royal psalms, the Davidic promise and prophetic texts. The entry also covers internal
  biblical critiques of kingship.
