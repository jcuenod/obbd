editorial:
  author_notes:
  - >-
    Explain the Myth and Ritual and Scandinavian 'divine kingship' school (Mowinckel, Engnell)
    and its decline. The consensus now: the Judahite king was sacral and adopted as YHWH's
    son, but not divine in the Egyptian sense. Ps 45:6 remains debated.
  - >-
    Key ancient Near Eastern comparanda: the Hammurabi prologue and epilogue; Ashurbanipal's
    coronation hymn (SAA 3 11), close to Ps 72 in its wishes for abundance and justice; Egyptian
    royal titulary.
  - >-
    Weinfeld on mišpāṭ ûṣĕdāqâ as social-justice measures parallel to the Mesopotamian kittum
    u mīšarum and debt-release edicts.
  - >-
    The dating of the royal psalms is contested. Many hold that a pre-exilic core was later
    reinterpreted messianically.
  sources_to_check:
  - SAA 3 11 (Assurbanipal's coronation hymn)
