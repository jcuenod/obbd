scope: >-
  A first-millennium Akkadian text in which Sargon of Akkad recounts his secret birth to a
  high priestess, his exposure in a reed basket sealed with bitumen on the Euphrates, his
  rescue by a water-drawer, and his rise to kingship through Ishtar's love.
passages:
- ref: Exod 2:1-10
  rel: parallel
  note: Infant placed in a reed basket sealed with bitumen, set on the river, rescued and
    raised
- ref: Exod 2:3
  rel: language
  note: >-
    Papyrus basket coated with bitumen and pitch, as Sargon's 'basket of rushes' sealed with
    bitumen
