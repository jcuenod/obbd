editorial:
  author_notes:
  - >-
    Known from Neo-Assyrian and Neo-Babylonian copies; many date its composition to Sargon
    II's reign (721-705), when a usurper bearing the old king's name had reason to celebrate
    him. This matters for dating Exod 2 (Redford, Otto argue for 7th-c. dependence).
  - >-
    The exposed-hero motif is widespread (Lewis collected dozens of tales: Cyrus, Romulus,
    etc.); a motif parallel is not by itself proof of borrowing.
  - >-
    Differences: Moses' mother and sister act to save him, he is raised at the Egyptian court,
    and his name has an Egyptian etymology.
