cultures: [phoenician, canaanite, judahite]
scope: >-
  The image of YHWH 'enthroned on the cherubim' and the Levantine sphinx-flanked throne behind
  it, as known from Late Bronze and Iron Age ivories and the Ahiram sarcophagus. The entry
  covers the epithet, the cherubim of the temple's inner sanctuary, and the debate over an
  'empty throne'.
