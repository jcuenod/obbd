editorial:
  author_notes:
  - >-
    The key comparanda are the Megiddo ivory plaque and the Ahiram sarcophagus, both showing
    a king on a throne with winged-sphinx sides. Cherubim are winged sphinxes, not Renaissance
    putti.
  - >-
    Explain the reconstruction (Haran, Keel, Mettinger): the inner-sanctuary cherubim formed
    a throne and the ark served as its footstool. Mettinger's 'empty throne' model of aniconism
    is influential but debated.
  - >-
    The epithet yōšēb hakkĕrûbîm is attached to the ark in Samuel. Whether it originated at
    Shiloh or in Jerusalem temple theology is debated.
