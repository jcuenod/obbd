id: letter-writing-conventions
title: Letter-Writing Conventions
aliases: [Epistolography, Ancient letters]
type: concept
cultures: [ane, judahite, aramean, persian]
scope: >-
  The structure and formulas of ancient Hebrew, Aramaic and other Near Eastern letters (address,
  greeting, transition markers, body), and the practices of writing, sealing and sending them.
  The entry covers letters quoted or described in the Bible, compared with Lachish, Arad,
  Elephantine and Amarna letters.
