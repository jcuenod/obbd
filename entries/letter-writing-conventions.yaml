editorial:
  author_notes:
  - >-
    Hebrew letters follow a pattern: address ('to my lord X, your servant Y'), blessing or
    greeting ('may YHWH cause my lord to hear tidings of peace'), transition wĕʿattâ, then
    the body. Aramaic uses kʿt or kʿnt.
  - >-
    Standard references: D. Pardee, Handbook of Ancient Hebrew Letters (1982); J. A. Fitzmyer,
    'Some Notes on Aramaic Epistolography' (JBL 93, 1974); J. M. Lindenberger, Ancient Aramaic
    and Hebrew Letters.
  - >-
    The authenticity of the Aramaic documents in Ezra 4–7 is debated, with assessments ranging
    from authentic but edited to literary compositions. Compare Elephantine and the Arshama
    letters.
  sources_to_check:
  - TAD A4.7 (Elephantine temple petition)
  - D. Pardee, Handbook of Ancient Hebrew Letters (1982)
  - J. M. Lindenberger, Ancient Aramaic and Hebrew Letters (SBLWAW 14; 2nd ed., 2003)
