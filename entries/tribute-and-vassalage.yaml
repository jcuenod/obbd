id: tribute-and-vassalage
title: Tribute and Vassalage
aliases: [Vassalage, Tribute]
type: practice
cultures: [assyrian, babylonian, egyptian]
scope: >-
  The obligations of vassal kingdoms to imperial overlords (tribute, audience gifts, oaths
  of loyalty, military service) and the consequences of rebellion. The entry covers the payments
  and submissions of Israelite and Judahite kings to Assyria, Egypt and Babylon recorded in
  Kings and in Assyrian inscriptions.
