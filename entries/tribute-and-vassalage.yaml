editorial:
  author_notes:
  - >-
    Assyrian terms: maddattu (regular tribute) versus nāmurtu (audience gift), with the vassal
    bound by a loyalty oath (adê). Rebellion was oath-breaking and was punished as such.
  - >-
    Compare the biblical amounts with the Assyrian ones: Sennacherib lists 800 talents of
    silver against 300 in 2 Kgs 18:14. Note differing talent standards and propaganda without
    forcing a harmonization.
  - >-
    Assyrian inscriptions list Menahem, Ahaz (Jehoahaz) and Hoshea as tribute-payers, and
    the Tell al-Rimah stele names Joash of Samaria.
  - >-
    Most scholars read Hos 5:13 and 10:6 melek yārēb as malkî rab or a corruption of it, 'great
    king'.
  sources_to_check: [RINAP 1 (Tiglath-pileser III), RINAP 3/1 (Sennacherib)]
