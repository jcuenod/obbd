title: Bread, Ovens, and Diet
aliases: [Baking, Ovens, Tannur, Tabun, Food]
type: realia
cultures: [hebrew]
scope: >-
  Bread-making and everyday diet in ancient Israel: kneading, leavening and baking on hot
  stones, griddles and clay ovens (tannûr), professional bakers, and a diet based on cereals,
  legumes, olive oil, wine and fruit, with meat eaten mainly on special occasions. Grinding
  is treated under millstones-and-grinding, and food laws under pig-avoidance and related
  entries.
