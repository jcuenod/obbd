editorial:
  author_notes:
  - >-
    Ovens: the tannûr was a cylindrical clay oven heated from inside, with dough slapped against
    the wall; 'tabun' is the later Arabic term. Courtyard ovens are common in Iron Age houses,
    and some appear to have been shared (cf. Lev 26:26). Bread was also baked on embers, hot
    stones and griddles.
  - >-
    Diet: cereals (wheat and barley) supplied most calories, with legumes, olive oil, wine,
    figs, dates, grapes and dairy products. Meat was mainly eaten at sacrifices and feasts.
    Do not quote precise calorie percentages unless they come from a source such as MacDonald.
  - >-
    Grinding and baking took many hours a day and were women's work in the household (Meyers).
    Cities also had professional bakers (Jer 37:21; Gen 40).
  - >-
    Leaven was a sourdough starter (śĕʾōr). Explain its ritual exclusion (Passover; Lev 2:11)
    without claiming that leaven always symbolizes evil (contrast Lev 23:17; Matt 13:33).
  - >-
    Leḥem can mean 'food' in general, and the 'staff of bread' (Lev 26:26; Ezek 4:16) is the
    food supply.
  sources_to_check:
  - N. MacDonald, What Did the Ancient Israelites Eat? Diet in Biblical Times (2008)
  - P. J. King and L. E. Stager, Life in Biblical Israel (2001)
  - 'C. Meyers, Rediscovering Eve: Ancient Israelite Women in Context (2013)'
