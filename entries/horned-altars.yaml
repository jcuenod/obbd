id: horned-altars
title: Horned Altars
type: realia
cultures: [hebrew, philistine, canaanite]
scope: >-
  Altars with projecting "horns" at the four corners, known from biblical descriptions and
  from Iron Age examples at Beersheba, Megiddo, Dan, and Ekron. The entry covers the ritual
  use of the horns in blood rites and as a place of asylum.
