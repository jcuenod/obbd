editorial:
  author_notes:
  - >-
    The Beersheba altar of dressed stones was found dismantled and reused in later walls.
    Its dismantling is often linked to Hezekiah's reform (2 Kgs 18:4, 22), but that link and
    the stratigraphy are debated.
  - >-
    Small four-horned limestone altars (Megiddo, Ekron, and elsewhere) were probably for incense
    or other non-animal offerings. Distinguish them from large altars of burnt offering.
  - >-
    The original function or symbolism of the horns is unknown. Present the proposals without
    choosing one.
