scope: >-
  The Achaemenid ceremonial capital in Fars, founded by Darius I and burned by Alexander.
  Covers its terrace palaces and reliefs, the Fortification and Treasury archives, and what
  they show about Persian court life and administration as background to Persian-period biblical
  books.
