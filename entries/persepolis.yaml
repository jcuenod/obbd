editorial:
  author_notes:
  - >-
    Founded by Darius I c. 518 BCE and expanded by Xerxes and later kings, the site has the
    Gate of All Nations, the Apadana and the Hall of a Hundred Columns. Alexander burned it
    in 330.
  - >-
    The Fortification tablets (c. 509-493, mostly Elamite, some Aramaic) and the Treasury
    tablets document the economy, rations, travel and sealing practice. They are prime evidence
    for Achaemenid administration.
  - >-
    The Apadana reliefs show gift-bearing delegations of subject peoples. Their reading as
    'tribute' versus ceremonial gifts is debated.
  - >-
    Esther is set at Susa, not Persepolis. Use Persepolis for the court culture, not as the
    stage of the story.
  sources_to_check:
