editorial:
  author_notes:
  - >-
    The earliest possible attestation is the Egyptian toponym "land of the Shasu of Yhw(3)"
    at Soleb (Amenhotep III) and Amarah West (Ramesses II); its link to the divine name is
    widely but not universally accepted.
  - >-
    Present the Midianite-Kenite hypothesis as influential but debated (Blenkinsopp 2008);
    recent reconstructions (Römer, Lewis) differ on the southern origin.
  - >-
    Kuntillet ʿAjrud's "YHWH of Teman" supports southern associations; the Mesha Stele (9th
    c.) is the earliest secure mention of YHWH.
  - >-
    Flag as fringe or discredited the claims of YHWH at Ebla (ya- names) or in Ugaritic yw
    (KTU 1.1 IV 14).
  sources_to_check:
  - J. Blenkinsopp, "The Midianite-Kenite Hypothesis Revisited," JSOT 33 (2008)
  - T. Römer, The Invention of God (2015)
  - T. J. Lewis, The Origin and Character of God (2020)
  - DDD, s.v. "Yahweh"
