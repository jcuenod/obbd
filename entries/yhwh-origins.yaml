id: yhwh-origins
title: Origins of the Worship of YHWH
aliases: [origins of Yahweh, Kenite hypothesis, Midianite hypothesis]
type: concept
cultures: [hebrew, egyptian, arabian, edomite]
scope: >-
  The historical origins of the worship of YHWH: the earliest extrabiblical attestations,
  biblical traditions of a southern homeland (Sinai, Seir, Edom, Teman, Midian), the Midianite-Kenite
  hypothesis, and YHWH's relationship to El. The entry covers critical debate without endorsing
  any one reconstruction.
