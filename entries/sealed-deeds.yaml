editorial:
  author_notes:
  - >-
    Compare Babylonian contracts in sealed clay envelopes, the 4th-century Wadi Daliyeh slave-sale
    papyri sealed with bullae, and the tied double deeds of the Babatha archive (2nd c. CE).
  - >-
    Elephantine papyri were usually single documents, rolled and sealed, not double documents,
    so do not overstate the parallel.
  - >-
    Whether Jer 32 describes one double document or two separate copies is debated. Note the
    storage in a jar, which Elephantine and Qumran also illustrate.
  - >-
    On Gen 23 as a Neo-Babylonian 'dialogue document', see G. M. Tucker, JBL 85 (1966), and
    later critiques. Rev 5:1 as a double document or opisthograph is also debated.
  image_query: Wadi Daliyeh Samaria papyri bullae
