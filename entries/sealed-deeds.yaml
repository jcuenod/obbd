id: sealed-deeds
title: Sealed and Double Deeds
aliases: [Double deeds, Doppelurkunde]
type: practice
cultures: [babylonian, judahite, aramean, persian, jewish]
scope: >-
  Legal documents sealed and witnessed to guarantee their authenticity, including the 'double
  document' with a sealed inner text and an open outer copy. The entry covers Jeremiah's deed
  of purchase and the metaphor of the sealed book, with Mesopotamian, Aramaic and Greek-period
  comparanda.
