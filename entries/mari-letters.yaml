scope: >-
  The roughly 20,000 cuneiform tablets from the palace of Mari (Tell Hariri, Syria), mainly
  letters and administrative texts from the reigns of Yasmah-Addu and Zimri-Lim before Hammurabi's
  conquest. They are a major source for Amorite tribal society, treaty ritual, and above all
  prophecy outside Israel.
