editorial:
  author_notes:
  - >-
    About 50 letters report oracles of āpilum ('answerer'), muḫḫûm ('ecstatic'), and others,
    many published in ARM 26. Officials sometimes sent the prophet's hair and garment hem
    so the message could be checked by extispicy.
  - >-
    The Adad of Aleppo letter (A.1968), in which the god gives Zimri-Lim the weapons he used
    against Têmtum (Sea), is key for the royal chaoskampf of Ps 89 and for Lambert's case
    that the combat myth is West Semitic.
  - >-
    Older 'Mari and the patriarchs' comparisons (tribal terms, gôy/gāyum, nāweh, ḥērem/asakkum,
    census) should be nuanced; Fleming (2004) offers a recent treatment of Mari tribal politics.
  - >-
    The Binu-yamina reading (formerly 'Benjaminites') is onomastic; do not imply a historical
    link with Israel's Benjamin.
  sources_to_check:
  - J.-M. Durand, Archives épistolaires de Mari I/1 (ARM 26/1, 1988)
  - >-
    M. Nissinen, Prophets and Prophecy in the Ancient Near East (SBLWAW 12, 2003; 2nd ed.
    2019)
  - W. Heimpel, Letters to the King of Mari (2003)
  - A. Malamat, Mari and the Bible (1998)
  - >-
    D. E. Fleming, Democracy's Ancient Ancestors: Mari and Early Collective Governance (2004)
