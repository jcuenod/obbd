editorial:
  author_notes:
  - >-
    Iron Age Damascus lies beneath the Old City and is almost unexcavated. The temple of Hadad
    is presumed to underlie the Roman temple of Jupiter and the Umayyad Mosque, where a basalt
    orthostat with a sphinx was found.
  - >-
    Assyrian sources call the kingdom KUR ša-imērīšu. Its kings include Hadadezer (Adad-idri
    at Qarqar), Hazael, Bar-Hadad, and Rezin (Raḫiānu). The biblical Ben-hadads are hard to
    number and correlate.
  - How and when the Nabataean ethnarch controlled the city (2 Cor 11:32) is debated.
  sources_to_check:
  - Younger, A Political History of the Arameans (2016)
