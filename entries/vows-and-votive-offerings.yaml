scope: >-
  Conditional promises to a deity (vows) and the offerings, dedications and inscriptions given
  in fulfilment. The entry covers biblical vow narratives and laws, and their ancient Near
  Eastern counterparts, especially Ugaritic and Phoenician/Punic votive texts.
