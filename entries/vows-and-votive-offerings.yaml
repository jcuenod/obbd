editorial:
  author_notes:
  - >-
    Biblical vows are conditional, in the form 'If you… then I will…'. They are paid in thanksgiving
    contexts (tôdâ psalms) and often in public.
  - >-
    Kirta's vow to Asherah of Tyre and Sidon (KTU 1.14 iv), and his illness after failing
    to keep it, is the classic Ugaritic parallel to Deut 23:21-23 and Eccl 5:4-5.
  - >-
    Phoenician and Punic votive inscriptions (Melqart stele, KAI 201; tophet stelae) use the
    formula 'which X vowed, because he heard his voice'. Relevant to the tophet and child-sacrifice
    debate.
  - >-
    On Num 30, discuss the gendered legal control of women's vows without anachronism. T.
    Cartledge, Vows in the Hebrew Bible and the Ancient Near East (1992), is a standard study.
  sources_to_check: [KTU 1.14 iv (Kirta's vow), KAI 201 (Melqart stele)]
