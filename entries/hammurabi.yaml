editorial:
  author_notes:
  - >-
    The old identification of Hammurabi with Amraphel of Gen 14:1 is philologically and chronologically
    untenable and has been abandoned; mention it only as a historical misconception.
  - >-
    Dates follow the middle chronology (1792-1750); note that low or ultra-low chronologies
    would lower them.
  - >-
    The Mari archives illuminate his diplomacy and wars; use them alongside his own inscriptions
    and letters.
  - >-
    In the stele's relief Hammurabi stands before Shamash; the god commissions justice but
    the king is the lawgiver, a contrast with the Torah's divine authorship.
  sources_to_check:
