id: hammurabi
title: Hammurabi
type: person
cultures: [akkadian]
date:
  from: -1792
  to: -1750
  display: 1792–1750 BCE
scope: >-
  The sixth king of the First Dynasty of Babylon (middle chronology), who unified southern
  Mesopotamia and issued the best-known ancient Near Eastern law collection. He presented
  himself as shepherd and just king appointed to protect the weak.
passages:
- ref: Ps 72:1-4, 12-14
  rel: concept
  note: King as guarantor of justice for the poor and oppressed
- ref: Exod 21:1-23:19
  rel: parallel
  note: Covenant Code casuistic laws parallel to Hammurabi's laws
- ref: 1Kgs 3:9, 28
  rel: concept
  note: Royal wisdom to execute justice
- ref: Deut 4:5-8
  rel: polemic
  disputed: true
  note: '''What great nation has statutes so righteous?''; cf. Hammurabi''s boast of just
    laws'
- ref: Exod 24:12
  rel: concept
  note: Law given by God, in contrast to laws authored by the king under Shamash
related: [code-of-hammurabi, babylon, mari-letters, shepherd-kingship, ane-law-collections,
  widow-orphan-sojourner, shamash]
