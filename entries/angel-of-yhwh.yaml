editorial:
  author_notes:
  - >-
    Present the main models for the angel-YHWH fluidity: representation or agency (the messenger
    speaks in the sender's voice), interpolation (angel added to earlier theophanies), and
    hypostasis; avoid later christological identifications as historical exegesis.
  - >-
    Ugaritic and Mesopotamian messengers (often paired, e.g. Gapn and Ugar) deliver messages
    verbatim in the first person of the sender, a key analogy.
  - >-
    Distinguish malʾāk "messenger" (human or divine) from later angelology with names and
    ranks (Daniel, Tobit, 1 Enoch).
  sources_to_check:
