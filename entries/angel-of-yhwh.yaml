id: angel-of-yhwh
title: Divine Messengers and the Angel of YHWH
aliases: [Angel of the Lord, malʾak YHWH, divine messengers]
type: concept
cultures: [hebrew, ugaritic, ane]
scope: >-
  Divine messengers in the ancient Near East and the Hebrew Bible, and in particular the "angel
  (messenger) of YHWH", whose identity often merges with YHWH in the narratives. The entry
  covers ANE messenger conventions and the main interpretive models.
