title: Menorah
aliases: [Temple lampstand, Seven-branched lampstand]
type: realia
cultures: [hebrew, jewish]
scope: >-
  The gold lampstand of the tabernacle and Second Temple, described in Exodus as a six-branched
  stand with almond-blossom cups bearing seven lamps. The entry covers its biblical descriptions,
  its tree symbolism, Solomon's ten lampstands, Zechariah's vision, and its Second Temple
  and Roman-period depictions.
