editorial:
  author_notes:
  - >-
    Carol Meyers (The Tabernacle Menorah, 1976) argued that its form derives from Late Bronze
    Age stylized-tree imagery. This is widely accepted as background, not as proof of a date.
  - >-
    The Exodus description belongs to the Priestly source. Kings gives Solomon ten lampstands,
    so trace the development rather than harmonizing.
  - >-
    Zechariah's lampstand (a bowl with seven spouted lamps) recalls Iron Age multi-spouted
    lamps. It is not the same as the Exodus form.
  - >-
    Earliest securely dated depictions: Mattathias Antigonus coins (40–37 BCE), the Magdala
    stone, and the Arch of Titus (after 81 CE). Note the debate over the Arch's stepped/octagonal
    base.
