editorial:
  author_notes:
  - >-
    Hazor appears in the Mari archives (eighteenth century) as a major trading city and in
    the Amarna letters (e.g. EA 227-228; verify). Both are unusual for a southern Levantine
    city.
  - >-
    The violent destruction of the Late Bronze city (thirteenth century) is undisputed, but
    who caused it is not. Ben-Tor and Yadin attribute it to Israelites, Zuckerman argues for
    an internal revolt, and others propose Egyptian or other agents. The date is also debated.
  - >-
    Yadin assigned the Stratum X gate and casemate wall to Solomon. Finkelstein and others
    place them in the ninth century. Present this as part of the chronology debate.
  - >-
    Jabin appears both in Josh 11 and in Judg 4, which raises literary-historical questions.
    The 'Hazor' of Jer 49:28-33 is an Arabian location and should not be confused with this
    site.
