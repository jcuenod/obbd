title: Hazor
aliases: [Tel Hazor, Tell el-Qedah]
type: site
cultures: [canaanite, israelite]
scope: >-
  The largest Bronze Age city of the southern Levant, in the Huleh basin of upper Galilee,
  with an upper city and a vast lower city, and later an Israelite fortified town. Covers
  its Bronze Age prominence, the Late Bronze destruction, and the Iron Age strata down to
  the Assyrian conquest.
