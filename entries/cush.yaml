id: cush
title: Cush and the Kushite (25th) Dynasty
aliases: [Kush, Nubia, Ethiopia (biblical), Twenty-fifth Dynasty]
type: people
cultures: [nubian]
date:
  from: -744
  to: -656
  circa: true
  display: c. 744–656 BCE
scope: >-
  Kush, the Nile valley south of Egypt (Nubia, in modern Sudan), and especially its Napatan
  kings who ruled Egypt as the Twenty-fifth Dynasty and confronted Assyria in the Levant.
  The entry covers biblical Cush in prophecy and narrative. It does not cover the Midianite
  "Cushan" (Hab 3:7) except as a source of confusion.
