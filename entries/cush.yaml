editorial:
  author_notes:
  - >-
    Biblical Cush is usually Nubia. The Greek and English "Ethiopia" does not refer to modern
    Ethiopia, though Gen 10:7-8 and some passages may reflect other "Cushes" (Arabian; Kassite
    Kush, linked to Nimrod).
  - >-
    Kushite chronology has been revised. The Tang-i Var inscription of Sargon II and recent
    studies (e.g., Payraudeau) favour placing Shebitku before Shabaka. This affects the 701
    campaign and the role of Taharqa.
  - >-
    Sargon II's inscriptions report that Yamani of Ashdod fled to Kush and was extradited.
    This provides the setting for Isa 20.
  - >-
    Isa 18 probably reflects Kushite diplomacy in Hezekiah's reign. Treat any precise dating
    as hypothetical.
  sources_to_check:
