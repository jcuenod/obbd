editorial:
  author_notes:
  - >-
    Daniel 7-12 is dated to 167-164 BCE by its accurate ex eventu detail down to 167 and its
    inaccurate prediction of his death (he died in Persia in 164).
  - >-
    Causes of the persecution are debated: royal Hellenizing zeal, Jewish Hellenizers' initiative
    (Bickerman), or response to revolt (Tcherikover). Present the debate neutrally.
  - >-
    šiqqûṣ šōmēm 'abomination of desolation' is generally understood as a pun on Baʿal Šamêm.
  sources_to_check:
