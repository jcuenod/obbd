editorial:
  author_notes:
  - >-
    The Tell Fekheriye bilingual (9th c. BCE) uses both Aramaic ṣlm and dmwt for the ruler's
    statue. This makes it a key text against sharp distinctions between "image" and "likeness".
  - >-
    Egyptian kings are called the "living image" of a god, and Neo-Assyrian letters call the
    king the image (ṣalmu) of Bel or Shamash. Many scholars therefore read Gen 1:26-28 as
    a "democratization" of royal ideology (Clines; Middleton, The Liberating Image). The Instruction
    for Merikare already extends image language to humanity.
  - >-
    Present the main interpretive families (functional/royal, relational, structural) neutrally.
    The royal-functional reading is the dominant critical view.
  - >-
    Note the tension with biblical aniconism. Humans, not statues, represent God on earth,
    and some see this as implicit polemic.
