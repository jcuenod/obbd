title: Image of God (Imago Dei)
aliases: [imago Dei]
type: concept
cultures: [ane, egyptian, assyrian, aramean]
scope: >-
  The biblical claim that humans are made "in the image (ṣelem) and likeness (dĕmût)" of God,
  read against ancient Near Eastern uses of image language for cult statues and for kings
  as earthly representatives of gods.
