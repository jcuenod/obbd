editorial:
  author_notes:
  - >-
    Mesopotamian temple names express cosmic roles. Examples are E-temen-anki ("House, foundation
    platform of heaven and earth") at Babylon and Dur-an-ki ("bond of heaven and earth") for
    Nippur. Egyptian temples represent the primeval mound, with papyrus columns and star-studded
    ceilings.
  - >-
    The verbal links between Gen 1:1-2:3 and Exod 39-40 (finishing the work, seeing, blessing)
    are widely accepted (Blenkinsopp; Weinfeld). The seven-speech structure of Exod 25-31
    as a creation pattern (Kearney) is more speculative.
  - >-
    Josephus (Ant. 3.180-187) and Philo explicitly read the tabernacle cosmologically. Use
    them as reception, not as evidence for the original design.
  - >-
    Avoid maximal claims that every temple feature has a cosmic referent. Levenson, "The Temple
    and the World" (JR 1984), is a balanced starting point.
