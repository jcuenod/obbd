id: temple-as-cosmos
title: Temple as Microcosm
aliases: [temple as microcosm]
type: concept
cultures: [ane, egyptian, babylonian, hebrew]
scope: >-
  The idea that temples were built and decorated as models of the cosmos or of primeval creation,
  and the biblical correspondences between creation and the construction of the tabernacle
  and temple.
