title: Ethnicity and Material Culture in Iron Age Israel
aliases: [Ethnic markers, Pots and peoples]
type: concept
cultures: [hebrew, philistine, canaanite]
scope: >-
  The methodological debate over whether, and how, ethnic identities such as 'Israelite' and
  'Philistine' can be detected in Iron Age material culture. Covers proposed markers (house
  plans, pottery, foodways, circumcision, language) and the biblical construction of ethnic
  boundaries.
