editorial:
  author_notes:
  - >-
    Proposed Israelite markers are the four-room house, collared-rim pithoi, scarcity of pig
    bones, little decorated or imported pottery, and circumcision (archaeologically invisible).
    Faust treats these as boundary markers against Philistines. Finkelstein stresses pig avoidance.
  - >-
    Counter-arguments are that collared-rim jars and pillared houses occur outside the Israelite
    highlands, and that environment and economy can explain foodways. Ethnicity is situational
    and constructed (Barth), not given.
  - >-
    Philistine markers include Aegean-style pottery, hearths, cooking jugs, spool-shaped loom
    weights, and pork consumption in early phases.
  - >-
    Warn against both essentialism ('pots = people') and denying any ethnic signal in material
    culture.
  sources_to_check:
  - Faust, Israel's Ethnogenesis (2006)
  - Killebrew, Biblical Peoples and Ethnicity (2005)
