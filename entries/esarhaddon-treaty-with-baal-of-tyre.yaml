id: esarhaddon-treaty-with-baal-of-tyre
title: Esarhaddon's Treaty with Baal of Tyre
aliases: [Treaty of Esarhaddon with Baal of Tyre, SAA 2 5]
type: text
cultures: [assyrian, phoenician]
date:
  from: -681
  to: -669
  circa: true
  display: c. 681–669 BCE
scope: >-
  A fragmentary Neo-Assyrian treaty imposed by Esarhaddon on Baal (Baʿalu), king of Tyre.
  It regulates Tyre's trade, ports and shipwrecks under Assyrian supervision and ends with
  curses invoking Assyrian gods together with Bethel, Anat-Bethel, Baal-shamayin, Baal-malage,
  Baal-saphon, Melqart, Eshmun and Astarte. It is the only surviving Assyrian treaty with
  a Phoenician city.
