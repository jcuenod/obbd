editorial:
  author_notes:
  - >-
    The date within Esarhaddon's reign is uncertain; a date soon after the destruction of
    Sidon (677/676) is often proposed. Ashurbanipal later besieged Baal (Rassam Cylinder),
    so the treaty did not secure lasting loyalty.
  - >-
    The trade clauses are the most informative part: they name ports and routes (Akko, Dor,
    the Philistine coast, Byblos, the Lebanon) and specify that the cargo of a Tyrian ship
    wrecked on Assyrian-controlled coast belongs to the king while the crew is spared. Explain
    what this shows about Assyrian economic interest in Phoenician trade.
  - >-
    The curse list is valuable evidence for the Phoenician pantheon in the 7th century, including
    the first-millennium god Bethel. Do not overstate links to Jer 48:13, where the reading
    of Bethel as a god is debated.
  - >-
    The tablet is badly broken, so translations differ in restorations. Quote from SAA 2 and
    mark restorations.
