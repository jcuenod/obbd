title: Assyrian and Babylonian Deportation Policy
aliases: [Mass deportation, Exile]
type: practice
cultures: [assyrian, babylonian]
scope: >-
  The Neo-Assyrian and Neo-Babylonian policy of deporting conquered populations: its aims,
  scale and methods, and the different Assyrian and Babylonian patterns. The entry covers
  the deportations from Israel and Judah described in Kings, Jeremiah and Ezra, and the evidence
  for deportee communities.
