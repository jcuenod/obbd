editorial:
  author_notes:
  - >-
    B. Oded, Mass Deportations and Deportees in the Neo-Assyrian Empire (1979), is the standard
    study. His overall estimate of deportees should be quoted with appropriate caveats.
  - >-
    Contrast the Assyrian two-way exchange of populations with the Babylonian one-way pattern.
    Cover the debate about the 'empty land' of Judah after 586 (H. Barstad).
  - >-
    Sargon II's figures for Samaria (27,280 or 27,290 in different inscriptions) are far lower
    than the 'ten lost tribes' legend implies. Archaeology indicates continuity of population
    and southward migration to Judah.
  - The Al-Yahudu and Murashu texts document rural Judean deportee communities in Babylonia.
