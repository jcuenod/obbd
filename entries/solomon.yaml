title: 'Solomon: Historical Questions'
type: person
cultures: [hebrew]
date:
  from: -970
  to: -931
  circa: true
  display: c. 970–931 BCE
scope: >-
  The historical questions surrounding Solomon: the lack of contemporary inscriptions, the
  archaeological debate over 'Solomonic' building at Hazor, Megiddo and Gezer, copper production
  in the Arabah, Phoenician relations, and the chronological anchor of Shishak's campaign.
  It does not cover Solomon's literary portrayal or later traditions.
