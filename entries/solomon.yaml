editorial:
  author_notes:
  - No extrabiblical text names Solomon. Say so plainly.
  - >-
    Yadin's six-chamber gates as 'Solomonic' versus the low chronology and radiocarbon redating.
    Present the current state of the debate fairly.
  - >-
    Copper production at Timna and Faynan peaked in the 10th century. Its political control
    (Edomite or other local groups, not necessarily Jerusalem) is debated.
  - >-
    Dates derive from biblical numbers anchored by Shoshenq I's campaign (c. 925). The regnal
    span is conventional.
