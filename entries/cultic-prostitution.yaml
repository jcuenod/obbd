editorial:
  author_notes:
  - >-
    The present consensus is sceptical (Westenholz, HTR 82, 1989; Budin, The Myth of Sacred
    Prostitution in Antiquity, 2008). Akkadian qadištu designates a class of women with cultic
    and social roles (e.g. wet-nursing and midwifery), not prostitutes. Ugaritic qdšm are
    a class of temple personnel listed alongside priests.
  - >-
    Herodotus 1.199 (Babylonian women and Mylitta) is the main classical source. It is widely
    regarded as unreliable or misunderstood. Treat Lucian and Strabo similarly.
  - >-
    In biblical texts, the parallel of qĕdēšâ with zônâ (Gen 38; Hos 4; Deut 23) is the main
    basis for the older view. Explain it as polemical association, not documentation of a
    sexual cult.
  - Note that translations such as NRSV "temple prostitute" perpetuate the older view.
