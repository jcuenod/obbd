id: cultic-prostitution
title: '"Cultic Prostitution" (qedeshah): A Contested Category'
aliases: [sacred prostitution, temple prostitution, qedeshah]
type: practice
cultures: [hebrew, babylonian, ugaritic, greek]
scope: >-
  The once-standard view that ancient Near Eastern and Canaanite temples employed "sacred
  prostitutes", the biblical terms qādēš and qĕdēšâ on which it was partly based, and the
  present scholarly consensus that the category is largely unsupported by primary evidence.
passages:
- ref: Gen 38:15, 21-22
  rel: language
  note: Tamar called zônâ by Judah, and qĕdēšâ in Hirah's inquiry
- ref: Deut 23:17-18
  rel: language
  note: No qĕdēšâ or qādēš in Israel; 'fee of a prostitute' and 'wages of a dog'; MT 23:18-19
- ref: Hos 4:13-14
  rel: polemic
  note: Men 'sacrifice with qĕdēšôt' in parallel with prostitutes
- ref: 1Kgs 14:24
  rel: language
  note: qādēš personnel 'in the land'
- ref: 1Kgs 15:12
  rel: language
  note: Asa expels the qĕdēšîm
- ref: 2Kgs 23:7
  rel: language
  note: Houses of the qĕdēšîm in the temple where women wove for Asherah
related: [ishtar, asherah, sacred-marriage, astarte, ugaritic-texts, cult-reforms-archaeology]
