scope: >-
  The small corpus of Iron Age Edomite inscriptions: ostraca, seals and seal impressions from
  Buseirah (Bozrah), Umm el-Biyara, Tell el-Kheleifeh and the eastern Negev, including the
  Horvat ʿUza letter that blesses its recipient by Qos. It covers the Edomite script and language
  and what the texts show about Edomite religion and expansion. Edomite history in general
  is treated under edomites and the god under qos.
