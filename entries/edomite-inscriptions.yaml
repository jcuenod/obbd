editorial:
  author_notes:
  - >-
    Outline the corpus and verify each item: the Horvat ʿUza ostracon (a letter of c. 600
    BCE invoking a blessing by Qos), the Umm el-Biyara seal impression of Qos-gabar king of
    Edom (the Qaus-gabri of Esarhaddon's and Ashurbanipal's inscriptions), the Tell el-Kheleifeh
    jar impressions of 'Qosʿanal, servant of the king', ostraca and seals from Buseirah, and
    the inscriptions from the Horvat Qitmit shrine.
  - >-
    The Edomite script had developed distinctive letter forms by the seventh century, with
    influence from Aramaic cursive. Whether particular finds from Judahite sites are Edomite
    or Judahite is sometimes debated, so classify them with care.
  - >-
    The texts confirm Qos as the main Edomite god and an Edomite presence in the eastern Negev
    in the late seventh and early sixth centuries; compare Arad ostracon 24, which warns of
    Edom. Do not assume all Edomite presence was military. Trade and mixed settlement are
    also likely.
  - >-
    The fourth-century Idumean ostraca are Aramaic and much later. Many are unprovenanced.
    Treat them as continuity evidence (they contain many Qos names), not as part of the Iron
    Age corpus.
  sources_to_check:
  - I. Beit-Arieh and B. Cresson, 'An Edomite Ostracon from Ḥorvat ʿUza,' Tel Aviv 12 (1985)
  - 'I. Beit-Arieh (ed.), Ḥorvat Qitmit: An Edomite Shrine in the Biblical Negev (1995)'
  - >-
    S. Aḥituv, Echoes from the Past: Hebrew and Cognate Inscriptions from the Biblical Period
    (2008)
