editorial:
  author_notes:
  - >-
    Tanis rose to prominence only from the late 11th century, under Smendes (see Wenamun).
    Ps 78's placing of the exodus wonders "in the fields of Zoan" therefore reflects first-millennium
    geography.
  - >-
    The Ramesside monuments at Tanis were moved from Pi-Ramesses. Explain how they misled
    earlier identifications.
  - >-
    Montet's discovery (1939-1940) of the royal tombs (Psusennes I, Shoshenq II) is important
    for Third Intermediate Period chronology.
  - >-
    The film image of Tanis as the Ark's resting place is fiction. Mention it only if useful
    for readers.
  sources_to_check:
  - Kitchen, The Third Intermediate Period in Egypt (1100-650 BC)
