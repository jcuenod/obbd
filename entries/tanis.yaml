id: tanis
title: Tanis (Zoan)
aliases: [Zoan, San el-Hagar, Djanet]
type: site
cultures: [egyptian]
scope: >-
  Tanis (Egyptian Djanet; Hebrew Zōʿan, modern San el-Hagar) in the north-eastern Delta, capital
  of the Twenty-first and Twenty-second Dynasties. It was built largely with monuments brought
  from Pi-Ramesses, and Montet found intact royal tombs there. In the Bible Zoan is the seat
  of pharaoh's counsellors and the scene of the exodus wonders.
