type: site
cultures: [canaanite, israelite]
scope: >-
  The city in the pass between Mounts Gerizim and Ebal, a Bronze Age city-state and early
  Israelite political and covenant centre. Covers its Middle Bronze fortifications and fortress
  temple, its Amarna-period ruler Labayu, and its Iron Age and Hellenistic phases.
