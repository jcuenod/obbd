editorial:
  author_notes:
  - >-
    Ḫabiru/ʿApiru (logogram SA.GAZ) are attested c. 1800-1100 BCE across the Near East as
    uprooted people, mercenaries, bandits and contract labourers. The term is social, not
    ethnic.
  - >-
    A linguistic connection with ʿibrî is possible but disputed (ʿ-p-r vs. ʿ-b-r). Most scholars
    reject a simple Habiru = Hebrews equation while allowing some historical or semantic relation.
  - >-
    In the Amarna letters rulers accuse rivals (e.g. Labayu of Shechem) of siding with the
    ʿApiru. Seti I's Beth-shean stele mentions ʿApiru.
  - >-
    In the Hebrew Bible, 'Hebrew' is used mostly by or to outsiders and in slave laws, which
    some see as a trace of the social sense.
  sources_to_check:
  - Moran, The Amarna Letters (1992)
  - >-
    Na'aman, "Ḫabiru and Hebrews - The Transfer of a Social Term to the Literary Sphere,"
    JNES 45 (1986)
