scope: >-
  Sanballat (Akkadian Sin-uballiṭ), governor of Samaria and Nehemiah's leading opponent. He
  is attested in the Elephantine petition of 407 BCE as father of Delaiah and Shelemiah, and
  his family's continued rule is reflected in the Wadi Daliyeh papyri.
passages:
- ref: Neh 2:10, 19
  rel: attests
  note: Sanballat the Horonite opposes Nehemiah's mission
- ref: Neh 4:1-8
  rel: attests
  note: Sanballat mocks the wall-building before the army of Samaria (MT 3:33-4:2)
- ref: Neh 6:1-14
  rel: attests
  note: Plots and an open letter against Nehemiah
- ref: Neh 13:28
  rel: attests
  note: A grandson of the high priest Eliashib married Sanballat's daughter
