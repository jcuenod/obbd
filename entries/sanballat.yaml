editorial:
  author_notes:
  - >-
    His sons' Yahwistic names (Delaiah, Shelemiah) indicate a Yahwistic family despite his
    Babylonian name.
  - The gentilic 'Horonite' is debated (Beth-horon, Hauran, or Horonaim).
  - >-
    Josephus (Ant. 11.302-347) places a Sanballat under Darius III and Alexander who built
    the Gerizim temple. Discuss papponymy and Josephus's chronological confusion; archaeology
    dates the first Gerizim sanctuary to the mid-5th century.
