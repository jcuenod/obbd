id: jewish-revolt-coinage
title: Coins of the Jewish Revolts
aliases: [Shekel of Israel, First Revolt shekel, Bar Kokhba coins]
type: realia
cultures: [jewish]
date:
  from: 66
  to: 135
  display: 66–135 CE
scope: >-
  The coins struck by Jewish authorities during the First Revolt (66-70 CE), chiefly silver
  shekels and half-shekels dated years 1-5 and bronze prutot, and during the Bar Kokhba revolt
  (132-135 CE), struck over Roman coins. Both series use paleo-Hebrew legends and temple-related
  imagery as statements of independence. Roman victory coinage is treated under judaea-capta-coins
  and the Tyrian shekel separately.
passages:
- ref: Exod 30:13
  rel: language
  note: >-
