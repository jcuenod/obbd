editorial:
  author_notes:
  - >-
    First Revolt silver: shekels and half-shekels (rare quarters) of high-quality silver,
    dated year 1 to year 5 (the year-5 issue is very rare). They have a chalice with 'shekel
    of Israel' and a stem with three pomegranates with 'Jerusalem the holy'. They were probably
    minted in Jerusalem under temple authority. Whether the chalice and pomegranates refer
    to temple vessels or Aaron's rod is speculative.
  - >-
    First Revolt bronzes: year 2-3 prutot with amphora and vine leaf and the legend 'freedom
    of Zion' (ḥērût ṣîyôn). The larger year-4 bronzes have lulav and etrog and the legend
    'for the redemption of Zion'.
  - >-
    Bar Kokhba coins were struck over Roman denarii and tetradrachms. Legends include 'Simon',
    'Simon prince of Israel', 'Eleazar the priest', 'year one of the redemption of Israel'
    and 'for the freedom of Jerusalem'. Types include a temple facade (with an object inside
    variously read as the ark or the showbread table), lulav, trumpets, lyres and jugs. See
    Mildenberg.
  - >-
    The paleo-Hebrew script was by then an archaizing national symbol, already used on Hasmonean
    coins. Mention that forgeries of revolt coins are common on the market.
  - >-
    Link to judaea-capta-coins for the Roman answer to these claims of freedom, and to tyrian-shekel
    for the temple-tax standard they replaced.
  sources_to_check:
  - Y. Meshorer, A Treasury of Jewish Coins (2001)
  - D. Hendin, Guide to Biblical Coins (5th ed., 2010)
  - L. Mildenberg, The Coinage of the Bar Kokhba War (1984)
