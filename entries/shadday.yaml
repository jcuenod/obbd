id: shadday
title: Shadday (El Shaddai)
aliases: [El Shaddai, Shaddai, the Almighty]
type: deity
cultures: [hebrew]
scope: >-
  The divine name or epithet Shadday, alone or as ʾēl šadday, used in the Priestly patriarchal
  narratives, in archaic and archaizing poetry, and above all in Job. The entry covers its
  distribution, the Priestly theory of revelation in Exod 6:3, the debated etymology, and
  the šdyn gods of the Deir ʿAlla inscription.
