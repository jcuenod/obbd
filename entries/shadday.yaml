editorial:
  author_notes:
  - >-
    Set out the etymologies neutrally: 'the one of the mountain(s)' (Akkadian šadû; Albright,
    Cross), 'the one of the field/steppe' (Hebrew śādeh), and links with šad 'breast' (fertility;
    cf. Gen 49:25). The mountain etymology is the most widely held but is not certain.
  - >-
    The translation 'Almighty' comes from the Septuagint (pantokratōr, mainly in Job) and
    the Vulgate (omnipotens), and from the rabbinic folk etymology še-day 'who is sufficient'.
    It is not the original sense.
  - >-
    Whether Shadday is genuinely archaic or deliberately archaizing (in P and Job) is debated.
    Note the personal names Shedeur, Zurishaddai and Ammishaddai (Num 1:5-12), which some
    date early.
  - >-
    The Deir ʿAlla plaster text (8th c.) has šdyn, a group of gods in council, alongside ʾlhn.
    This is the clearest extrabiblical evidence but does not settle the etymology.
  sources_to_check:
