editorial:
  author_notes:
  - >-
    Koldewey's German excavations (1899-1917) exposed mainly the Neo-Babylonian city of Nebuchadnezzar
    II, including the Ishtar Gate, the Processional Way, the Southern Palace, the foundation
    of Etemenanki and Esagila. Earlier levels lie below the water table.
  - >-
    The 'Hanging Gardens' have not been securely identified. Koldewey's 'vaulted building'
    is now usually read as a storehouse, where the Jehoiachin ration tablets were found. Dalley
    has argued for Nineveh.
  - >-
    Saddam Hussein's reconstruction damaged the ruins. Babylon was inscribed as a UNESCO World
    Heritage Site in 2019.
  - >-
    In Revelation and 1 Pet 5:13 'Babylon' is code for Rome. Keep the symbolic afterlife distinct
    from the historical city.
  sources_to_check:
  - George, Babylonian Topographical Texts (1992)
  - Koldewey, The Excavations at Babylon (1914)
