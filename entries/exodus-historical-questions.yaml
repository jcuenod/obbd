editorial:
  author_notes:
  - >-
    Consensus position. No Egyptian source mentions Israelites in Egypt, their enslavement,
    or an exodus. A departure of 600,000 men plus dependants is demographically and logistically
    impossible. Most critical scholars regard the narrative as a later composition, which
    may preserve memories of smaller movements and of Egyptian domination in Canaan.
  - >-
    Lay out the range of views. (a) A cultural memory built from Hyksos expulsions, Egyptian
    control of Canaan, and Semites in the Delta (Redford, Assmann). (b) A small group's exodus
    (often linked to the Levites) later generalised (Friedman, Hendel). (c) A 13th-century
    Ramesside exodus (Kitchen, Hoffmeier). (d) A 15th-century exodus based on 1 Kgs 6:1, a
    minority view largely confined to conservative scholarship, with archaeological difficulties.
  - >-
    The Egyptian local colour (Raamses, Pithom, Egyptian names, frontier forts) spans several
    periods, and its dating is disputed. The Merneptah Stele sets a terminus ante quem (c.
    1208) for Israel in Canaan.
  - >-
    Sinai and Kadesh-barnea lack Late Bronze evidence for a large wilderness population. Mention
    the debates about the archaeological visibility of nomads.
  - >-
    Flag popular misconceptions, such as Ipuwer as plague record, Thera as the cause of the
    plagues, Red Sea chariot-wheel finds, and claims about Ramesses II's mummy.
  sources_to_check:
  - >-
    Levy, Schneider, and Propp (eds.), Israel's Exodus in Transdisciplinary Perspective (2015)
  - Redford, Egypt, Canaan, and Israel in Ancient Times (1992)
  - Hoffmeier, Israel in Egypt (1997)
