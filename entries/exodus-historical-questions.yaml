id: exodus-historical-questions
title: 'The Exodus: Historical Questions'
aliases: [Historicity of the Exodus, Date of the Exodus]
type: concept
cultures: [egyptian, hebrew]
scope: >-
  The historical questions raised by the exodus narrative: Semites in Egypt, the oppression,
  the date and route, the numbers involved, and the relation to the emergence of Israel in
  Canaan. The entry assesses the Egyptian and archaeological evidence and the range of scholarly
  positions, from a non-historical cultural memory to a small-group exodus to traditional
  early or late dates.
