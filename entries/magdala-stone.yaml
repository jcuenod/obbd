id: magdala-stone
title: Magdala Stone and Synagogue
type: artifact
cultures: [jewish]
date:
  from: 1
  to: 67
  circa: true
  display: c. 1–67 CE
scope: >-
  Carved stone block found in 2009 in a first-century synagogue at Magdala (Migdal) on the
  Sea of Galilee. Its decoration includes a seven-branched menorah, and it is widely interpreted
  as a symbolic representation of the Jerusalem temple. The entry also covers the synagogue
  itself.
