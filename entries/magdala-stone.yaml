editorial:
  author_notes:
  - >-
    Interpretation as a model of the temple (Aviam, Bauckham and others) is common but debated
    in its details. Its function (a table for Torah reading?) is uncertain.
  - >-
    It is one of the earliest menorah depictions outside Jerusalem (compare the coins of Mattathias
    Antigonus).
  - >-
    Magdala's identification with Josephus's Taricheae is widely accepted. Avoid sensational
    claims that Jesus taught in this building.
  sources_to_check:
