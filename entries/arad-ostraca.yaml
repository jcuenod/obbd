- ref: Ps 137:7
  rel: setting
  note: Edom remembered for its part in Jerusalem's fall
- ref: Ezek 25:12-14
  rel: setting
  note: Oracle against Edom for vengeance on Judah
- ref: Gen 10:4
  rel: attests
  note: >-
    Kittim, who receive rations in the ostraca; probably Greek or Cypriot mercenaries in Judahite
    service
- ref: Jer 2:10
