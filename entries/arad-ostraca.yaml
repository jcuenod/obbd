id: arad-ostraca
title: Arad Ostraca
type: artifact
cultures: [judahite]
date:
  from: -605
  to: -587
  circa: true
  display: c. 605–587 BCE
scope: >-
  More than a hundred Hebrew ostraca from the Judahite fortress at Arad, with smaller Aramaic
  and other groups. The best-known group is the archive of Eliashib son of Eshiyahu (early
  6th century), recording rations of wine, flour and oil for the Kittim and others and military
  orders about an Edomite threat.
