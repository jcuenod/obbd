editorial:
  author_notes:
  - >-
    Date given is for the Eliashib archive (Stratum VI). The corpus as a whole runs from the
    8th (perhaps 9th) century to the Persian and later periods, and Arad's stratigraphy has
    been revised since Aharoni (Herzog; Singer-Avitz).
  - >-
    Arad 24 orders troops to Ramat-negeb 'lest Edom should come there'. Arad 40, earlier,
    also refers to Edom. These letters support the biblical memory of Edomite hostility, but
    do not tie it to a specific biblical event.
  - >-
    Arad 18 mentions 'the house of YHWH', most likely the Jerusalem temple. Keep it distinct
    from the Arad shrine, which is treated under arad and cult-reforms-archaeology.
  - >-
    The ostraca are important evidence for literacy, administration, and the bureaucratic
    use of hieratic numerals and measures in Judah.
