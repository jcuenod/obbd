editorial:
  author_notes:
  - >-
    De Vaux excavated the site in 1951-56. Magness revised his phasing, placing the sectarian
    settlement from c. 100-50 BCE to its destruction by Rome in 68 CE. An Iron Age II fort
    lies beneath.
  - >-
    The Essene hypothesis (based on Pliny, Nat. Hist. 5.73; Philo; Josephus) remains the majority
    view. Alternatives include a villa, a fortress, a pottery workshop, and scrolls brought
    from Jerusalem. Pottery and proximity (especially Caves 4, 7-10) support a link between
    site and caves.
  - >-
    The stepped pools are read as ritual baths (miqvaʾot) by most, though some see them as
    cisterns. The cemetery holds about 1,100 graves, and the excavated sample is mostly male.
  - >-
    Links with John the Baptist or Jesus are popular but speculative. Do not equate the Qumran
    group with all Essenes.
  sources_to_check:
  - de Vaux, Archaeology and the Dead Sea Scrolls (1973)
  - Magness, The Archaeology of Qumran and the Dead Sea Scrolls (2002; 2nd ed. 2021)
