  - J. C. VanderKam, Jubilees, 2 vols. (Hermeneia, 2018)
  - 'H. Attridge et al., Qumran Cave 4.VIII: Parabiblical Texts, Part 1 (DJD XIII, 1994)'
  - >-
    O. S. Wintermute, 'Jubilees', in J. H. Charlesworth (ed.), The Old Testament Pseudepigrapha,
    vol. 2 (1985)
