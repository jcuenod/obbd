editorial:
  author_notes:
  - >-
    Composed in Hebrew; about fourteen or fifteen copies were found at Qumran. The full text
    survives in Ge'ez and part in Latin. It is canonical in the Ethiopian church.
  - 'Dating: usually c. 160-150 BCE (VanderKam). Some argue for a pre-Maccabean date.'
  - >-
    Note the calendar polemic (Jub 6:32-38) and its links to Qumran calendrical texts and
    the Temple Scroll.
  - >-
    The demonology (Mastema, the spirits of the giants) reshapes problematic divine actions,
    a useful comparison with 1 Chr 21:1.
  sources_to_check:
