id: jubilees
title: Book of Jubilees
aliases: [Book of Jubilees, Little Genesis]
type: text
cultures: [jewish]
date:
  from: -170
  to: -150
  circa: true
  display: c. 170–150 BCE
scope: >-
  A Hebrew retelling of Genesis 1 to Exodus 24, presented as revealed to Moses on Sinai by
  the Angel of the Presence from the heavenly tablets. It sets history within a chronology
  of jubilee periods and promotes a 364-day calendar and strict halakha.
passages:
- ref: Exod 24:12-18
  rel: setting
  note: 'Moses on the mountain forty days: the book''s revelatory frame (Jub 1)'
- ref: Gen 1:1-2:3
  rel: parallel
  note: Creation retold as 22 works culminating in the Sabbath (Jub 2)
- ref: Exod 31:12-17
  rel: practice
  note: Sabbath laws expanded (Jub 2:17-33; 50:6-13)
- ref: Gen 6:1-4
  rel: parallel
  note: Watchers and giants (Jub 5; 7:21-25)
- ref: Gen 7:11-8:14
  rel: concept
  note: Flood chronology read within the 364-day year (Jub 5-6; 6:32-38)
- ref: Gen 22:1-19
  rel: parallel
  note: Prince Mastema instigates the testing of Abraham (Jub 17:15-18:19)
- ref: Exod 4:24-26
  rel: parallel
  note: Mastema, not YHWH, attacks Moses (Jub 48:2-3)
- ref: Gal 3:19
  rel: concept
  note: Law 'ordained through angels'; cf. the Angel of the Presence dictating (Jub 1:27-2:1)
related: [first-enoch, dead-sea-scrolls, genesis-apocryphon, temple-scroll, calendars-and-month-names,
  sabbath, satan-the-adversary, demons]
