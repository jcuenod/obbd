  circa: true
  display: c. 675–650 BCE
scope: >-
  A limestone block found in 1996 in the main temple complex at Tel Miqne-Ekron, recording
  that Achish (ʾkyš) son of Padi, ruler of Ekron, built the temple for the goddess PTGYH.
  It confirms the identification of the site and names two Ekronite kings known from Assyrian
  records.
