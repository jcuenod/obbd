editorial:
  author_notes:
  - >-
    ʾkyš is the Ikausu of Ekron in Esarhaddon's and Ashurbanipal's vassal lists, and Padi
    appears in Sennacherib's annals. This anchors the inscription in the early 7th century.
  - >-
    The biblical Achish of Gath (David's era) is not the same person. The link is onomastic:
    Achish is probably a non-Semitic (Aegean or Anatolian) name that the Philistine royal
    houses kept using.
  - >-
    The language is Phoenician-like Northwest Semitic. Proposed meanings of PTGYH include
    a Greek Potnia (or Pythogaia). The reading and identity remain open.
  - >-
    Set it in the context of 7th-century Ekron as a major olive-oil production centre under
    Assyrian hegemony.
