id: fall-of-babylon-539
title: Fall of Babylon (539 BCE)
type: event
cultures: [babylonian, persian]
date:
  from: -539
  to: -539
  display: 539 BCE
scope: >-
  The capture of Babylon by the army of Cyrus II of Persia in October 539 BCE after the defeat
  of Nabonidus' forces at Opis, ending the Neo-Babylonian empire. The Babylonian sources report
  that the city was taken without battle.
