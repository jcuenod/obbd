editorial:
  author_notes:
  - >-
    The Nabonidus Chronicle reports the battle of Opis, the surrender of Sippar, Ugbaru's
    entry into Babylon without battle (16 Tashritu), and Cyrus's entry (3 Arahsamnu).
  - >-
    The Cyrus Cylinder presents the conquest as Marduk's choice of Cyrus, closely matching
    Second Isaiah's theology; both are propaganda for Cyrus.
  - >-
    Herodotus (1.191) and Xenophon tell of diverting the Euphrates and a festival night; these
    later traditions conflict with the peaceful entry in cuneiform sources.
  - >-
    Biblical prophecies of Babylon's violent destruction (Isa 13; Jer 50-51) were not fulfilled
    in 539; discuss rather than harmonise. Darius the Mede has no extrabiblical attestation.
  sources_to_check: [ABC 7, COS 2.124, 'Finkel (ed.), The Cyrus Cylinder (2013)']
