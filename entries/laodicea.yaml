editorial:
  author_notes:
  - >-
    The city rebuilt itself without imperial aid after the earthquake of 60 CE (Tacitus, Ann.
    14.27), which is relevant to Rev 3:17.
  - >-
    The hot/cold/lukewarm water interpretation (Rudwick and Green) is popular but has been
    critiqued (e.g. C. Koester). Present it as one reading.
  - Note the recent Turkish excavations under C. Şimşek.
  sources_to_check:
