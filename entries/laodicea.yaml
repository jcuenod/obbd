id: laodicea
title: Laodicea
type: site
cultures: [greek, roman]
scope: >-
  Laodicea on the Lycus in Phrygia, a prosperous city near Hierapolis and Colossae, known
  for banking, black wool, and a medical school. It appears in Colossians and is addressed
  in the last of the seven messages of Revelation.
passages:
- ref: Rev 3:14-22
  rel: setting
  note: Message to the church in Laodicea
- ref: Rev 3:15-16
  rel: imagery
  disputed: true
  note: >-
    'Neither cold nor hot'; cf. Hierapolis's hot springs, Colossae's cold water, and Laodicea's
    piped supply
- ref: Rev 3:17-18
  rel: imagery
  note: Wealth, clothing, and eye-salve, matching the city's banking, textiles, and medicine
- ref: Col 2:1
  rel: setting
  note: Paul's struggle for those in Laodicea
- ref: Col 4:13-16
  rel: setting
  note: Epaphras; Nympha's house church; the letter from Laodicea
related: [pergamon, temple-of-artemis-ephesus, imperial-cult, cisterns-and-water-systems]
