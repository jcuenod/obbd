scope: >-
  A gilded wooden chest from the Treasury of Tutankhamun's tomb (KV62), surmounted by a recumbent
  black jackal of Anubis and mounted on a sledge with carrying poles. It is one of the clearest
  physical comparanda for a portable sacred chest carried on poles.
