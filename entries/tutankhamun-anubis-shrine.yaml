editorial:
  author_notes:
  - >-
    The comparison is typological. Portable chests and shrines carried on poles were common
    in Egypt (e.g., processional barque shrines). The Anubis shrine is one well-preserved
    example among many.
  - >-
    Note the differences. The Anubis shrine bears a divine image, while the ark bears no image
    and the cherubim flank an empty space (cherub throne).
  - >-
    The pentateuchal ark descriptions (Exod 25; Num 4) are generally assigned to P. Discuss
    the implications for the dating of the comparison.
  - >-
    Many Tutankhamun objects have recently moved from the Egyptian Museum (Tahrir) to the
    Grand Egyptian Museum in Giza. Verify the current location before stating it.
  sources_to_check:
