id: sabbatical-year
title: Sabbatical Year
aliases: [Shemittah, Fallow year, Seventh year]
type: practice
cultures: [hebrew, jewish]
scope: >-
  The seventh-year fallow of fields, vineyards, and olive groves in biblical law, its relation
  to the weekly Sabbath and to debt remission, and the evidence that it was observed in the
  Second Temple period. Debt and slave release are treated under debt-release.
passages:
- ref: Exod 23:10-11
  rel: practice
  note: Seventh-year fallow, the produce left for the poor and wild animals
- ref: Lev 25:1-7
  rel: practice
  note: '''A sabbath for the land'' with no sowing or pruning'
- ref: Lev 25:18-22
  rel: practice
  note: Promise of a sixth-year harvest sufficient for three years
- ref: Lev 26:34-35, 43
  rel: concept
  note: Exile as the land 'enjoying its sabbaths'
- ref: 2Chr 36:21
  rel: concept
  note: Seventy years of exile fulfil the land's neglected sabbaths
- ref: Deut 15:1-2
  rel: practice
  note: Year of remission (šĕmiṭṭâ) linked to the seven-year cycle
- ref: Deut 31:10-13
  rel: practice
