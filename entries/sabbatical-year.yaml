editorial:
  author_notes:
  - >-
    No fixed septennial fallow is attested elsewhere in the ancient Near East. The Ugaritic
    seven-year cycles (e.g., drought in Aqhat) are literary motifs, not institutions. Present
    the institution as an extension of Sabbath logic to agricultural time.
  - >-
    Note the debate whether Exod 23:10-11 assumed a rotating fallow for each field or a single
    universal year, as in Lev 25. Also relate the land's 'rest' to Sabbath work prohibitions.
  - >-
    Practice is attested in the Second Temple period. Sources include 1 Maccabees, Josephus
    (e.g., Caesar's decree remitting tribute in the seventh year, Ant. 14.202), Tacitus' polemic
    (Hist. 5.4), and documents from Murabbaʿat dated by the year of release. Verify specific
    document numbers.
  - >-
    The Chronicler's link between exile and unkept sabbatical years (2 Chr 36:21, combining
    Lev 26 and Jer 25:11) is theological interpretation, not chronological evidence.
