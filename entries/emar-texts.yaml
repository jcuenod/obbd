editorial:
  author_notes:
  - >-
    Excavated 1972-76 by a French team before flooding by the Tabqa dam; many further tablets
    appeared on the antiquities market, so flag provenance problems.
  - >-
    The ritual archive from a diviner's house gives rare insight into West Semitic civic cult;
    Fleming's comparisons with Priestly ritual (installation, festival calendar) are suggestive
    and should not be pressed into claims of influence.
  - >-
    The 'gods and the dead' (ilānū u mētū) in wills are central to debates on teraphim and
    ancestor cult (van der Toorn).
