scope: >-
  The Late Bronze Age tablets from Emar (Tell Meskene) on the Middle Euphrates, a Syrian city
  under Hittite overlordship. They include an unusual archive of local ritual texts (priestess
  installations, the zukru festival) and legal documents on inheritance and the household
  gods.
