id: firmament
title: Firmament (Raqia)
aliases: [raqia, rāqîaʿ, vault of heaven]
type: concept
cultures: [hebrew, babylonian, egyptian]
scope: >-
  The rāqîaʿ ("firmament", "dome", or "expanse") of Gen 1, the barrier set between the upper
  and lower waters in which the heavenly lights are placed, and its comparative background
  in ancient Near Eastern ideas of a solid sky.
