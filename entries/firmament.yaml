editorial:
  author_notes:
  - >-
    The noun is related to the verb rqʿ, "to beat out, stamp, spread" (used of hammered metal
    in Exod 39:3; Num 16:38, MT 17:3). LXX stereōma and Vulgate firmamentum both imply solidity.
    The majority view is that the rāqîaʿ was conceived as a solid barrier. Note that some
    translations ("expanse") and some interpreters resist this.
  - >-
    Key comparandum is Enuma Elish IV, where Marduk splits Tiamat's body and sets half of
    it as the sky, with a bar and guards so that her waters cannot escape. Present it as a
    conceptual parallel, not proof of borrowing.
  - >-
    Mesopotamian texts describe heavens made of different stones (Horowitz). Cf. the sapphire
    pavement of Exod 24:10.
  - >-
    Caution that the often-reproduced "Flammarion engraving" is a 19th-century image, not
    an ancient or medieval depiction.
