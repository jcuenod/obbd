editorial:
  author_notes:
  - >-
    Under the New Kingdom (Eighteenth to Twentieth Dynasties), Beth-shean was an Egyptian
    garrison town. Finds include stelae of Seti I (one mentioning the ʿApiru) and Ramesses
    II, a statue of Ramesses III, and Egyptian-style residences.
  - >-
    The anthropoid clay coffins from the northern cemetery have been attributed to Sea Peoples
    mercenaries, but they are better read as Egyptian-style burials of mixed personnel. The
    attribution is debated.
  - >-
    The University of Pennsylvania excavations (1921-33) linked two Iron Age temples to 1
    Sam 31:10 and 1 Chr 10:10. This is speculative. A. Mazar's excavations (1989-96) revised
    the stratigraphy.
  - >-
    Scythopolis was the leading Decapolis city. The Roman-Byzantine city at the foot of the
    tell is a major site in its own right.
