aliases: [Beth-shan, Tel Beth-Shean, Tell el-Husn, Scythopolis]
type: site
cultures: [egyptian, canaanite, israelite]
scope: >-
  The tell at the junction of the Jezreel and Jordan valleys, an Egyptian administrative centre
  in the Late Bronze Age, an Israelite town in the Iron Age, and the Hellenistic-Roman city
  of Scythopolis at its foot. Covers the Egyptian garrison, the temples, the Iron Age town
  and the Decapolis city in outline.
