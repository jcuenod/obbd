editorial:
  author_notes:
  - >-
    Kramer's rib proposal rests on Sumerian ti = 'rib' and 'to live'; the pun does not work
    in Hebrew (ṣēlāʿ vs. ḥawwâ), so any link is at best indirect. Present it as a famous but
    doubtful suggestion, not as an established source of Gen 2.
  - >-
    Dilmun (historically linked to Bahrain) is a pristine but initially waterless land; the
    myth is largely about fertility, not about a 'fall'. Avoid the older label 'Sumerian paradise
    myth' without qualification.
  - >-
    The animal-peace lines (lion, wolf, lamb) are the most secure point of contact and concern
    prophetic imagery rather than Gen 2-3.
  - >-
    There is no dedicated English Wikipedia article; the title given is a redirect to a section
    of the Ninhursag article.
