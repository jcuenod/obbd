id: enki-and-ninhursag
title: Enki and Ninhursag
type: text
cultures: [sumerian]
date:
  from: -1800
  to: -1800
  circa: true
  display: c. 1800 BCE
scope: >-
  A Sumerian myth set in the pure land of Dilmun, which Enki provides with fresh water, followed
  by Enki's serial impregnations, his eating of plants that the mother goddess Ninhursag has
  made, her curse, and his healing by goddesses born to cure each ailing body part, among
  them Ninti.
passages:
- ref: Gen 2:8-14
  rel: concept
  note: Pristine land (Dilmun) watered by a god; cf. Eden and its rivers
- ref: Gen 2:6
  rel: parallel
  disputed: true
  note: Fresh water rising from the earth to irrigate the land
- ref: Isa 11:6-9
  rel: imagery
  note: Paradisal land where the lion does not kill and the wolf does not seize the lamb
- ref: Isa 65:25
  rel: imagery
  note: Wolf and lamb at peace in the renewed creation
- ref: Gen 3:6, 17-19
  rel: parallel
  disputed: true
  note: Eating plants reserved by the deity incurs a curse
- ref: Gen 2:21-22
  rel: parallel
  disputed: true
  note: Ninti, 'lady of the rib' / 'lady who makes live' (Kramer); widely cited, doubtful
