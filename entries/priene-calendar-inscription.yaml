id: priene-calendar-inscription
title: Priene Calendar Inscription
type: artifact
cultures: [greek, roman]
date:
  from: -9
  to: -9
  display: 9 BCE
scope: >-
  Decree of the provincial council of Asia (9 BCE), preserved at Priene and in other copies,
  adopting a calendar in which the year began on Augustus's birthday. Its accompanying text
  celebrates the birth of 'the god' as the beginning of 'good news' (euangelia) and of a saviour
  who ended war.
passages:
- ref: Mark 1:1
  rel: language
  note: '''Beginning of the good news'' (euangelion), a term also used of imperial benefactions'
- ref: Luke 2:10-11
  rel: language
  note: Angel announces good news and the birth of a 'Saviour'
- ref: Luke 2:14
  rel: concept
  note: Peace on earth; cf. the Augustan peace
- ref: Phil 3:20
  rel: language
  note: Awaiting a 'Saviour' from heaven
- ref: Titus 2:13
  rel: language
  note: '''Appearing'' (epiphaneia) of ''our great God and Saviour'''
- ref: Isa 52:7
  rel: language
  note: Messenger announcing good news (mĕbaśśēr), the Jewish background of euangelion
