editorial:
  author_notes:
  - >-
    Stress the Roman colonial character (Latin public inscriptions; freedmen settlers) after
    the destruction of 146 BCE and refoundation in 44 BCE.
  - >-
    Correct the misconception of '1,000 sacred prostitutes'. Strabo 8.6.20 refers to the pre-146
    city and is unreliable.
  - >-
    Murphy-O'Connor's house-church reconstructions (e.g. the Anaploga villa) are illustrative,
    not evidential.
  sources_to_check:
