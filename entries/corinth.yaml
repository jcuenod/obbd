id: corinth
title: Corinth
type: site
cultures: [roman, greek]
scope: >-
  Roman Corinth, refounded as a colony by Julius Caesar in 44 BCE a century after its destruction,
  capital of Achaia and controller of the Isthmus. The entry covers its archaeology and institutions
  as the setting of Paul's mission and correspondence.
passages:
- ref: Acts 18:1-18
  rel: setting
  note: Paul's eighteen-month stay; Aquila and Priscilla; trial before Gallio
- ref: Acts 18:12-17
  rel: realia
  note: The tribunal (bēma) in the forum
- ref: 1Cor 8:10
  rel: practice
  note: >-
    Eating in an idol's temple; cf. dining rooms at the Asklepieion and the Demeter sanctuary
- ref: 1Cor 10:25
  rel: realia
  note: Meat sold in the market (makellon), attested at Corinth as a macellum
- ref: 1Cor 9:24-27
  rel: practice
  note: Athletic imagery; the Isthmian Games administered by Corinth
- ref: 1Cor 11:17-34
  rel: practice
  note: Communal meals in private houses
- ref: Rom 16:1
  rel: setting
  note: Cenchreae, Corinth's eastern port
- ref: Rom 16:23
  rel: attests
  disputed: true
  note: Erastus the city treasurer
