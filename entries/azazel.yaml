editorial:
  author_notes:
  - >-
    Set out the interpretations: (1) a demon or wilderness deity, the most common critical
    view, supported by the lot 'for YHWH' and 'for Azazel'; (2) 'the goat that goes away'
    (ʿēz ʾōzēl; Septuagint apopompaios, Vulgate caper emissarius, hence Tyndale's 'scapegoat');
    (3) a place name such as 'rugged cliff' (rabbinic; m. Yoma 6:6-8); (4) an abstract noun
    'complete removal'.
  - >-
    Milgrom and others argue that, even if Azazel was originally a demon, Lev 16 neutralizes
    him. The goat is not a sacrifice to Azazel but a vehicle that removes sin to his realm.
    Make this distinction clear.
  - >-
    Qumran texts (4Q180; the Temple Scroll) spell the name with a metathesis, often read as
    ʿzzʾl, 'El is strong' or 'fierce god'. Verify the spellings before citing them. The Enochic
    Asael (Aramaic ʿśʾl) was later assimilated to Azazel (Apocalypse of Abraham).
  - >-
    Keep later Christian and occult demonology (Azazel as Satan, Milton, modern fiction) to
    a brief reception note.
  sources_to_check:
  - DDD, s.v. "Azazel"
  - J. Milgrom, Leviticus 1-16 (AB 3, 1991)
  - D. P. Wright, The Disposal of Impurity (SBLDS 101, 1987)
  - >-
    L. L. Grabbe, 'The Scapegoat Tradition: A Study in Early Jewish Interpretation,' JSJ 18
    (1987)
  - D. Stökl Ben Ezra, The Impact of Yom Kippur on Early Christianity (WUNT 163, 2003)
