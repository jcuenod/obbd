id: azazel
title: Azazel
aliases: [ʿĂzāʾzēl, Asael, scapegoat]
type: deity
cultures: [hebrew, jewish]
scope: >-
  The enigmatic recipient of the second goat on the Day of Atonement (Lev 16) and the figure
  of Asael/Azazel in Second Temple literature, where he becomes a fallen angel blamed for
  teaching forbidden arts. The entry covers the name, its interpretations and its afterlife;
  the ritual and its elimination-rite parallels belong to day-of-atonement-elimination, and
  wilderness demons generally to demons.
passages:
- ref: Lev 16:8
  rel: language
  note: A lot 'for YHWH' and a lot 'for Azazel'; the parallel suggests a personal name
- ref: Lev 16:10
  rel: practice
  note: Goat presented alive and sent 'to Azazel' into the wilderness
- ref: Lev 16:21-22
  rel: practice
  note: Iniquities confessed over the goat, carried off to a 'cut-off land' (ʾereṣ gĕzērâ)
- ref: Lev 16:26
  rel: practice
  note: The one who sets the goat free washes before re-entering the camp
- ref: Lev 17:7
  rel: concept
  note: Ban on sacrifices to goat-demons (śĕʿîrîm) in the open field
- ref: Isa 34:14
  rel: concept
  note: 'Goat-demons and Lilith haunt desolate Edom: the wilderness as demonic realm'
- ref: 1En 8:1
  rel: concept
  note: Asael teaches metalworking, weapons and cosmetics
- ref: 1En 10:4-8
  rel: concept
  note: Raphael binds Asael and casts him into darkness in the desert; all sin ascribed to
    him
