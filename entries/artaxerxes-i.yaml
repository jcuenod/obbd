  note: Ezra sent in Artaxerxes's seventh year (458 if Artaxerxes I; 398 if Artaxerxes II)
- ref: Neh 2:1-8
  rel: attests
  note: Nehemiah, royal cupbearer, commissioned in the twentieth year (445 BCE)
- ref: Neh 5:14
  rel: attests
  note: Nehemiah governor from the twentieth to the thirty-second year
- ref: Neh 13:6
  rel: attests
  note: Nehemiah returns to the king in the thirty-second year (433 BCE)
- ref: Ezra 6:14
  rel: attests
  note: Artaxerxes listed with Cyrus and Darius as patrons of the temple
