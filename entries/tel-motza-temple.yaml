editorial:
  author_notes:
  - >-
    Excavated by the Israel Antiquities Authority (2012-13, with Kisilevitz among the directors),
    followed by a joint expedition with Tel Aviv University (Kisilevitz and Lipschits). The
    temple was built in Iron IIA (early ninth century or earlier) and rebuilt later. Verify
    its end date in recent publications.
  - >-
    Finds include anthropomorphic heads and horse figurines, a courtyard altar and a pit with
    ash and animal bones. The deity worshipped is not named, so avoid calling it a 'YHWH temple'
    without qualification.
  - >-
    Large silos and granaries suggest a royal storage centre serving Jerusalem. The temple
    is important evidence for officially sanctioned worship outside the capital before the
    reforms.
  sources_to_check:
  - Kisilevitz, "The Iron IIA Judahite Temple at Tel Moẓa," Tel Aviv 42 (2015)
