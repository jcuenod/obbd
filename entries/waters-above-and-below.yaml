editorial:
  author_notes:
  - >-
    Mesopotamian cosmology locates the apsû, the freshwater ocean of Enki/Ea, beneath the
    earth as the source of springs and rivers. Egyptian cosmology places the primeval waters
    of Nun around and beneath the ordered world. In both, creation is the setting of bounds
    within surrounding waters.
  - >-
    The flood narrative is best read cosmologically, as the reopening of the barriers set
    in Gen 1. This is a widely held reading, not a fringe one.
  - >-
    Note the beneficent role of the lower waters (springs, fertility) alongside their threatening
    role, and avoid reducing all biblical water imagery to "chaos".
