id: asherah
title: Asherah
aliases: [Athirat, ʾAṯiratu, asherah pole, sacred pole]
type: deity
cultures: [canaanite, ugaritic, judahite, israelite]
scope: >-
  Asherah, the West Semitic goddess known at Ugarit as Athirat, consort of El and mother of
  the gods, and in the Hebrew Bible both a goddess and a cultic object (the ʾăšērâ, a wooden
  pole or stylized tree). The entry covers the goddess, the cult object, and the inscriptional
  evidence for "YHWH and his asherah".
