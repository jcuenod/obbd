editorial:
  author_notes:
  - >-
    The Kuntillet ʿAjrud and Khirbet el-Qom blessings "by YHWH ... and his asherah" are central;
    present the debate over whether "his asherah" denotes the goddess, a cult object, or a
    hypostasis (the pronominal suffix on a personal name is grammatically awkward).
  - >-
    At Ugarit Athirat is El's consort, "Lady Athirat of the Sea", creatress of the gods with
    seventy sons; her pairing with Baal in Kings is a Deuteronomistic construction.
  - >-
    The identification of Judean pillar figurines and the Taanach stand with Asherah is plausible
    but not proven.
  - >-
    Avoid the "fertility goddess" stereotype; note mainstream arguments (Olyan, Hadley, Ackerman)
    that Asherah was part of official Yahwistic cult in both kingdoms before the reforms.
  sources_to_check:
