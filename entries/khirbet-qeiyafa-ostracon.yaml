scope: >-
  A five-line ink inscription on a pottery sherd found in 2008 at Khirbet Qeiyafa, written
  in a late Proto-Canaanite (early alphabetic) script of the late eleventh or early tenth
  century BCE. The entry covers its script, the disputed language and readings, and what it
  does and does not show about literacy in early Iron Age Judah; the site, its fortifications
  and the debate over who built it are treated under khirbet-qeiyafa.
