editorial:
  author_notes:
  - >-
    Found in 2008 and published by Misgav, Garfinkel and Ganor (2009). The ink is faded, and
    even the direction of writing and the division of words have been disputed. Recurring
    legible words include forms of ʿbd ('serve' or 'slave'), špṭ ('judge') and possibly ʾlmn
    ('widow') and mlk ('king').
  - >-
    The readings cannot be reconciled with each other. Galil reads a social-justice text urging
    care for the slave, widow, orphan and sojourner. Puech reads a text connected with the
    establishment of kingship. Others see a list of names or a writing exercise. Present them
    as alternatives and do not build on any one of them.
  - >-
    The language is disputed. Galil and Puech argue for Hebrew on lexical grounds (e.g. the
    verb ʿśh 'do'). Rollston and others hold that the text has too few diagnostic features
    to separate Hebrew from other Canaanite dialects at this date. Avoid calling it 'the earliest
    Hebrew inscription' without qualification.
  - >-
    It shows that someone at a small fortified town could write around 1000 BCE. It does not
    by itself demonstrate a Davidic state bureaucracy or widespread literacy. A second inscription
    from the site, the jar inscription naming ʾšbʿl bn bdʿ (published 2015), is a separate
    object; compare the name Eshbaal (1Chr 8:33).
  sources_to_check:
