editorial:
  author_notes:
  - >-
    Build on Fox's comparative study (1985). The parallels are generic and stylistic. No direct
    dependence is claimed, and several centuries separate the corpora.
  - >-
    The Egyptian songs are secular entertainment, not cult texts, which weighs against cultic
    (sacred-marriage) readings of the Song of Songs. Present the Mesopotamian love lyrics
    as a separate comparandum.
  - >-
    The "sister/brother" address is a convention of lovers' language and does not imply siblings.
  sources_to_check:
  - Fox, The Song of Songs and the Ancient Egyptian Love Songs (1985)
  - AEL 2:181-193
