editorial:
  author_notes:
  - >-
    The name is a misnomer. There is no proven link to the later Greek Aeolic order, and 'volute'
    or 'palmette capital' is often preferred.
  - >-
    The capitals topped engaged pilasters at gateways and palace entrances, not freestanding
    columns. Most were found out of their original context.
  - >-
    Dating of the Hazor, Megiddo and Samaria examples depends on the Iron Age chronology debate
    (9th vs 10th century). Present this neutrally.
  - >-
    The motif is usually read as a stylized palm or sacred tree tied to royal display. Do
    not over-read it as cultic.
  sources_to_check:
  - >-
    Y. Shiloh, The Proto-Aeolic Capital and Israelite Ashlar Masonry (Qedem 11; Jerusalem,
    1979)
