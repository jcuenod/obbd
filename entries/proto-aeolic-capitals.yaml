id: proto-aeolic-capitals
title: Proto-Aeolic Capitals
aliases: [Volute capitals, Palmette capitals, Proto-Ionic capitals]
type: realia
cultures: [israelite, judahite, moabite]
date:
  from: -900
  to: -600
  circa: true
  display: c. 900–600 BCE
scope: >-
  Stone pilaster capitals with paired volutes flanking a central triangle, found in Iron Age
  II royal and administrative architecture in Israel, Judah and Moab (Hazor, Megiddo, Samaria,
  Jerusalem, Ramat Rahel, Medeibiyeh). The entry covers their distribution, dating, architectural
  use and palmette or sacred-tree symbolism.
passages:
- ref: 1Kgs 7:9-12
  rel: setting
  note: Royal ashlar architecture of the kind in which volute capitals are found
- ref: 1Kgs 7:19, 22
  rel: realia
  disputed: true
  note: '''Lily-work'' capitals; a link to volute capitals has been proposed'
- ref: 1Kgs 6:29, 32, 35
  rel: imagery
  note: Carved palm trees (timōrôt) in temple decoration; palmette motif
- ref: Ezek 40:16, 22, 26, 31, 34, 37
  rel: imagery
  note: Palm-tree decoration on gate jambs of the visionary temple
- ref: Amos 5:11
  rel: setting
  note: Elite 'houses of hewn stone' (ashlar) in the northern kingdom
- ref: Jer 22:13-15
  rel: setting
  disputed: true
  note: Jehoiakim's palace; Ramat Rahel, with its capitals, is often proposed
