editorial:
  author_notes:
  - >-
    Potter imagery for divine creation is pan-ancient Near Eastern (clay in Atrahasis; Aruru
    pinching off clay in Gilgamesh). Khnum is one important comparandum, not the source.
  - >-
    The royal birth reliefs (Hatshepsut at Deir el-Bahari; Amenhotep III at Luxor) show Khnum
    shaping the child and its ka. The Roman-period Esna hymns develop his role as universal
    creator.
  - >-
    At Elephantine the Khnum priests were implicated in the destruction of the Judean temple
    (410 BCE). The suggestion that the conflict concerned sacrifice of rams or lambs (Khnum's
    sacred animal) is a hypothesis.
