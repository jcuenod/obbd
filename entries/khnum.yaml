id: khnum
title: Khnum, the Potter God
aliases: [Khnum, the Potter God]
type: deity
cultures: [egyptian]
scope: >-
  The ram-headed Egyptian creator god of the First Cataract (Elephantine) and Esna, who shapes
  humans, and in royal birth scenes the king and his ka, on a potter's wheel. The entry covers
  his iconography, his cult at Elephantine (beside the Judean temple of YHW), and the potter
  imagery for divine creation.
