editorial:
  author_notes:
  - >-
    Atrahasis offers the closest overall plot sequence (creation, overpopulation or noise,
    flood, divine regret). Gilgamesh XI supplies the closest details (boat dimensions, birds,
    mountain landing, sacrifice). Note that critical source divisions of Gen 6-9 (Priestly
    and non-Priestly) parallel different details.
  - >-
    The motive differs. In Atrahasis it is human noise (rigmu) or overpopulation, in Genesis
    it is violence and corruption (Gen 6:5, 11-13). This contrast is often treated as the
    theological centre of the comparison.
  - >-
    Mesopotamian versions were known in the Bronze Age Levant (Akkadian Atrahasis fragment
    from Ugarit; Gilgamesh fragment from Megiddo). This is relevant to transmission.
  - >-
    Woolley's flood deposits at Ur and similar local layers are not evidence for a single
    universal flood. Correct this common misconception.
