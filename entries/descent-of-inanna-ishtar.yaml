editorial:
  author_notes:
  - >-
    Distinguish the Old Babylonian Sumerian poem (c. 400 lines) from the much shorter Akkadian
    versions of the Middle and Neo-Assyrian periods; Dumuzi's role as substitute became clear
    only with the publication of related Sumerian texts in the 1950s.
  - >-
    Frazer's 'dying and rising god' model for Tammuz is now widely criticised (J. Z. Smith;
    M. S. Smith), though Mettinger argues for a qualified version; Ezek 8:14 attests ritual
    mourning, not necessarily a resurrection myth.
  - >-
    Ezek 8:14 is the only explicit biblical reference to Tammuz; the Babylonian month name
    Duʾūzu survives as the Jewish month Tammuz.
  - >-
    The netherworld descriptions (dust as food, darkness, no return) are general Mesopotamian
    imagery; claim shared cultural conception, not literary dependence.
