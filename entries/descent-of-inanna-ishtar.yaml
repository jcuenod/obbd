scope: >-
  The Sumerian myth of Inanna's descent to the netherworld, her death, revival, and the consignment
  of Dumuzi as her substitute, and its shorter Akkadian adaptation (Ishtar's Descent). The
  texts are key sources for Mesopotamian netherworld imagery and the cult of Dumuzi/Tammuz.
