editorial:
  author_notes:
  - >-
    The papyrus is a Nineteenth Dynasty copy; the composition is now usually dated to the
    late Middle Kingdom (Enmarch). It is a literary "chaos description" sharing topoi with
    Neferti, not an eyewitness account of the First Intermediate Period, as older scholarship
    held.
  - >-
    Address the plague connection directly. It was popularised by Velikovsky (Ages in Chaos,
    1952) and repeated in later popular works and documentaries. Scholars reject it for several
    reasons. The genre is a lament topos. The date is centuries before any proposed exodus.
    The text has no departing Semitic group. And the shared phrases (blood in the river, lamentation
    in the land) are stock images.
  - >-
    Present the genuine comparative value. The world-upside-down topos parallels Proverbs,
    Qoheleth, and prophetic oracles, and the closing reproach of the creator is relevant to
    biblical theodicy and lament.
  - >-
    Whether the "Lord of All" addressed at the end is the creator god or the king is debated.
    Both the beginning and the end of the text are lost.
  sources_to_check: ['AEL 1:149-163', ANET 441-444, 'Enmarch, A World Upturned (2008)']
