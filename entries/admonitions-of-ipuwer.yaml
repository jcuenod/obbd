scope: >-
  A fragmentary Egyptian poem, preserved in a single Nineteenth Dynasty papyrus (P. Leiden
  I 344 recto), in which the sage Ipuwer laments a land overturned: social order inverted,
  the poor made rich, and foreigners in Egypt. It ends by reproaching the "Lord of All". The
  entry also addresses the popular, scholarly rejected claim that it records the biblical
  plagues.
