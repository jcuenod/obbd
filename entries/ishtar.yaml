editorial:
  author_notes:
  - >-
    Treat Ishtar and Astarte as cognate but distinct; first-millennium Levantine syncretism
    is plausible but should not be assumed.
  - >-
    The Neo-Assyrian prophecies to Esarhaddon from Ishtar of Arbela are the strongest formal
    parallel to Deutero-Isaiah's salvation oracles.
  - >-
    Love-song parallels to the Song of Songs are typological; avoid the older cultic-mythological
    (sacred-marriage) reading of the Song as consensus.
  - >-
    Correct the "temple prostitution" stereotype; Herodotus 1.199 and related claims are widely
    doubted.
