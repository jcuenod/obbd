title: Ishtar/Inanna
aliases: [Inanna, Ištar]
type: deity
cultures: [mesopotamian, sumerian, assyrian]
scope: >-
  Ishtar (Sumerian Inanna), the Mesopotamian goddess of sexual love and war, identified with
  the planet Venus, with major cults at Uruk, Nineveh and Arbela. The entry covers her mythology
  and cult and the biblical passages most often discussed in relation to her.
