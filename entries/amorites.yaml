editorial:
  author_notes:
  - >-
    In the third millennium MAR.TU / Amurrum referred to West Semitic pastoral groups. Many
    Old Babylonian dynasties, including Hammurabi's and Zimri-Lim's, were of Amorite descent.
  - >-
    The Late Bronze kingdom of Amurru (Abdi-Ashirta, Aziru) appears in the Amarna letters
    and Hittite treaties. Later, Assyrian 'Amurru' means the west in general.
  - >-
    Biblical usage varies. 'Amorite' can mean a hill-country people, the Transjordanian kingdoms,
    or a general name for the pre-Israelite population. Some correlate the 'Amorite' and 'Canaanite'
    labels with different sources.
  - >-
    The 'Amorite hypothesis', which placed the patriarchs within Middle Bronze Amorite migrations
    (Albright), is outdated.
  sources_to_check: ['ABD, s.v. "Amorites"']
