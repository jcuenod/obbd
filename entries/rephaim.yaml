- ref: Ps 88:10
  rel: concept
  note: Do the Rephaim rise to praise God? (MT 88:11)
- ref: Prov 2:18; 9:18; 21:16
  rel: concept
  note: The way of folly leads to the Rephaim
- ref: Job 26:5
  rel: concept
