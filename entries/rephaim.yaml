id: rephaim
title: Rephaim
aliases: [Rapiʾuma, shades, rpum]
type: concept
cultures: [ugaritic, phoenician, hebrew]
scope: >-
  The Rephaim, in Ugaritic and Phoenician texts the (royal) dead or deified ancestors, and
  in the Hebrew Bible both the shades of the netherworld and a legendary race of giant pre-Israelite
  inhabitants of Transjordan and Canaan. The entry addresses both uses and their relationship.
