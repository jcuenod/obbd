editorial:
  author_notes:
  - >-
    The striking match between Og's cities (Ashtaroth and Edrei) and the abode of Rapiʾu in
    KTU 1.108 suggests that the Bashan giant traditions transformed a Rephaim/royal-dead tradition;
    widely accepted, but present the mechanism as hypothesis.
  - >-
    KTU 1.161 is a royal funerary liturgy summoning the ancient Rephaim for a dead king; KTU
    1.20-1.22 are fragmentary Rephaim texts; Phoenician curses (Tabnit, Eshmunazar) deny the
    violator rest "with the Rephaim".
  - >-
    Whether the Rephaim at Ugarit are deified dead kings, a warrior elite, or both is debated;
    etymology from rpʾ "heal" is common but the sense is disputed.
  - Treat claims about actual giants as a biblical ethnographic tradition, not history.
  sources_to_check:
