id: jewish-sects
title: Pharisees, Sadducees, and Essenes
type: concept
cultures: [jewish]
scope: >-
  The Jewish groups of the late Second Temple period: chiefly the Pharisees, Sadducees, and
  Essenes, along with Josephus's 'Fourth Philosophy'. The entry covers how they are presented
  in Josephus, the Dead Sea Scrolls, the New Testament, and rabbinic literature, and the methodological
  problems of reconstructing them.
