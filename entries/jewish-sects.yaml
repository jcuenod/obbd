editorial:
  author_notes:
  - >-
    Josephus frames the groups as Greek-style 'philosophies' (War 2.119-166; Ant. 13.171-173;
    18.11-25). Account for this Hellenizing lens.
  - >-
    The majority view identifies the Qumran yaḥad as Essene or Essene-related. Essenes also
    lived in towns (Philo, Josephus).
  - >-
    Avoid equating Pharisees with later rabbis, and avoid reading Matt 23 as neutral description.
    Sadducees are known almost only through hostile sources.
  - Note that 'scribes' and 'Herodians' are not sects in the same sense.
  sources_to_check:
  - A. J. Saldarini, Pharisees, Scribes and Sadducees in Palestinian Society (1988)
  - S. Mason, Flavius Josephus on the Pharisees (1991)
  - >-
    E. Schürer, G. Vermes, F. Millar, and M. Goodman, The History of the Jewish People in
    the Age of Jesus Christ, vol. 2 (1979)
