editorial:
  author_notes:
  - >-
    Describe the gate as civic space. It held benches in the chambers and a plaza inside the
    gate (Dan, Bethsaida, Beersheba). Note that a bench alone does not prove judicial use.
  - >-
    Danel, seated 'before the gate' by the threshing floor and judging the cause of the widow
    and orphan (Aqhat, KTU 1.17 V), is the closest Levantine literary parallel.
  - >-
    Note the tension between local justice by elders and royal or appointed judges (Deut 16:18;
    2 Chr 19:5-11; 2 Sam 15). Many see a historical development from kin-based to state judiciary.
  - >-
    'Gate' (šaʿar) often stands for 'town' in Deuteronomy. Do not over-read every occurrence
    as a reference to the gate structure.
