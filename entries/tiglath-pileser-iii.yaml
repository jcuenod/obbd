editorial:
  author_notes:
  - >-
    The identity of Pul and Tiglath-pileser is established by Babylonian King List A and the
    Ptolemaic Canon (Poros); 1 Chr 5:26 appears to treat them as two kings.
  - >-
    His reforms (provincial system, standing army, mass two-way deportation) shaped Assyrian
    rule for a century; explain why this matters for Israel's fate.
  - >-
    Hoshea's accession is claimed by Tiglath-pileser; the Bible attributes it to conspiracy
    (2 Kgs 15:30). Both can be true.
