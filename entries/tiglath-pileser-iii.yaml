id: tiglath-pileser-iii
title: Tiglath-pileser III (Pul)
aliases: [Pul, Pulu, Tilgath-pilneser]
type: person
cultures: [assyrian]
date:
  from: -745
  to: -727
  display: 745–727 BCE
scope: >-
  King of Assyria who reorganised the empire, made the Levant into provinces and vassal states,
  and intervened in the Syro-Ephraimite war. He appears in the Bible both as Tiglath-pileser
  (Tilgath-pilneser) and by his Babylonian throne name Pul.
passages:
- ref: 2Kgs 15:19-20
  rel: attests
  note: Pul receives Menahem's tribute
- ref: 2Kgs 15:29
  rel: event
  note: Captures northern Israelite territory and deports its people
- ref: 2Kgs 16:7-10
  rel: event
  note: Ahaz's appeal; capture of Damascus; Ahaz meets him at Damascus
- ref: 1Chr 5:6, 26
  rel: event
  note: Deportation of Reubenites and Transjordanian tribes
- ref: 2Chr 28:16-21
  rel: event
  note: Chronicler's version of Ahaz's appeal to Tilgath-pilneser
- ref: Isa 7:17-20
  rel: setting
  note: Assyria as the 'razor hired beyond the River'
