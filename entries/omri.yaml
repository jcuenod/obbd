scope: >-
  Omri, king of Israel and founder of the Omride dynasty, considered in the light of extrabiblical
  evidence. Kings treats his reign briefly, but the Mesha Stele names him as the conqueror
  of Moab, and Assyrian scribes called Israel 'the House of Omri' (Bīt-Ḫumri) for over a century.
passages:
- ref: 1Kgs 16:15-28
  rel: attests
  note: Omri's rise from army commander, civil war with Tibni, and reign
- ref: 1Kgs 16:24
  rel: setting
  note: Omri buys the hill of Samaria and founds his capital
- ref: 2Kgs 3:4-5
  rel: event
  note: Moab tributary to Israel, as the Mesha Stele says Omri subdued it
- ref: 2Kgs 8:26
  rel: attests
  note: Athaliah, 'daughter' (granddaughter) of Omri, links the dynasty to Judah
- ref: Mic 6:16
  rel: attests
  note: '''The statutes of Omri'' as a byword for apostasy'
