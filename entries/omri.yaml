editorial:
  author_notes:
  - >-
    Contrast the Deuteronomistic brevity (a few verses, judged evil) with Omri's international
    standing in Moabite and Assyrian sources.
  - >-
    Assyrian usage of 'House of Omri' even for Jehu ('son of Omri' on the Black Obelisk) reflects
    how the dynastic name stood for the state, not genealogy.
  - >-
    Discuss the archaeology of the Omride building programme (Samaria, Jezreel; possibly Megiddo
    and Hazor). Finkelstein's low chronology re-dates some 'Solomonic' structures to the Omrides.
  - >-
    Regnal dates follow Tadmor/Cogan (c. 882-871). Thiele has 885-874. The overlap with Tibni
    (1 Kgs 16:21-23) complicates the twelve-year total.
