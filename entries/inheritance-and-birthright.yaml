editorial:
  author_notes:
  - >-
    Practice varied in the ancient Near East. LH generally divides equally among sons (§§165-167),
    while other Mesopotamian and Nuzi sources (and MAL B §1) give the eldest a preferential
    or double share. Verify section numbers.
  - >-
    Emar and Nuzi wills sometimes designate daughters as heirs (e.g., by declaring them 'male
    and female'). These are useful comparanda for Num 27 and 36, with Elephantine (Mibtahiah's
    property) as a later case.
  - >-
    The Nuzi text in which a brother sells an inheritance share for sheep was once a famous
    parallel to Gen 25:29-34. It is now considered weak and should be presented with caution.
  - >-
    The repeated preference for younger sons (Isaac, Jacob, Joseph, Ephraim, David, Solomon)
    is a literary-theological motif. Do not take it as evidence against a legal norm of primogeniture.
  sources_to_check:
  - Roth, Law Collections from Mesopotamia and Asia Minor (SBLWAW 6, 2nd ed. 1997)
  - Westbrook, Property and the Family in Biblical Law (JSOTSup 113, 1991)
