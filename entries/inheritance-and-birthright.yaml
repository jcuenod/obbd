title: Inheritance and Birthright
aliases: [Primogeniture, Firstborn's double portion, Daughters of Zelophehad]
type: practice
cultures: [hebrew, akkadian, assyrian, hurrian]
scope: >-
  Inheritance law and practice in ancient Israel: the firstborn's preferential share, the
  narrative motif of the displaced firstborn, inheritance by daughters, and comparative evidence
  from Mesopotamia, Nuzi, Emar, and Elephantine.
