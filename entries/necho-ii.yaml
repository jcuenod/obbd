editorial:
  author_notes:
  - >-
    The Babylonian Chronicle shows Egypt aiding Assyria in 610-609 (Harran). This supports
    reading 2 Kgs 23:29 as "went up to" (aid) the king of Assyria, not "against" (KJV).
  - >-
    Whether Josiah died in battle (Chronicles) or was executed at a meeting (a possible reading
    of Kings) is debated.
  - >-
    Herodotus (2.158-159) reports Neco's Nile-Red Sea canal and a victory at "Magdolos" and
    capture of "Kadytis". The identifications (Migdol or Megiddo; Gaza or Kadesh) are debated.
  - >-
    Saite involvement in the Levant (Greek mercenaries; cf. Mesad Hashavyahu) provides wider
    context.
  sources_to_check:
  - Grayson, Assyrian and Babylonian Chronicles (1975), Chronicles 3 and 5
  - Herodotus, Histories 2.158-159
