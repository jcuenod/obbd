scope: >-
  Saite (Twenty-sixth Dynasty) pharaoh. He supported the collapsing Assyrian state against
  Babylon, killed Josiah at Megiddo in 609, controlled Judah briefly, and was defeated by
  Nebuchadnezzar at Carchemish in 605.
