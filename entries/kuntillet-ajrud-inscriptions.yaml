editorial:
  author_notes:
  - >-
    Whether ʾšrth is the goddess Asherah ('his Asherah') or a cult object ('his asherah')
    is still debated, since Hebrew does not normally put suffixes on personal names. Present
    both views. Avoid the headline phrase 'Yahweh's wife'.
  - >-
    Whether the drawings on Pithos A (two Bes-like figures and a seated lyre player) relate
    to the inscription above them is disputed. Most specialists now think they do not illustrate
    it.
  - >-
    The script, the phrase 'YHWH of Samaria', and the pottery point to Israelite (northern)
    involvement in a site on a Judahite or southern route. Radiocarbon dating places it c.
    800.
  - >-
    Some plaster texts are in Phoenician script. Discuss the site's function (caravan station
    with a religious dimension, not a temple).
