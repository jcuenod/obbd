id: kuntillet-ajrud-inscriptions
title: Kuntillet ʿAjrud Inscriptions and Drawings
aliases: [Horvat Teman inscriptions]
type: artifact
cultures: [israelite, judahite]
date:
  from: -800
  to: -800
  circa: true
  display: c. 800 BCE
scope: >-
  Inscriptions and drawings on storage jars (pithoi), plaster walls and stone vessels from
  the way-station at Kuntillet ʿAjrud in northeastern Sinai, including blessings 'by YHWH
  of Samaria and his asherah' and 'by YHWH of Teman and his asherah' and a theophany text.
  The site itself is treated under kuntillet-ajrud.
