editorial:
  author_notes:
  - >-
    The foundational study is W. L. Moran, 'The Ancient Near Eastern Background of the Love
    of God in Deuteronomy', CBQ 25 (1963). Evidence includes Amarna letters, where vassals
    'love' the pharaoh, and the Esarhaddon Succession Treaty's demand to love Ashurbanipal
    'as yourselves'.
  - >-
    Later work (e.g. J. Lapsley; B. Arnold) argues that the treaty sense does not exclude
    real affection and that Deuteronomic love also draws on familial language.
  - >-
    Explain that 'hate' (śānēʾ) as a technical term for repudiation or disloyalty underlies
    texts such as Mal 1:2-3.
