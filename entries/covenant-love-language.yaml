id: covenant-love-language
title: '"Love" as Covenant Language'
aliases: [Love of God in Deuteronomy]
type: concept
cultures: [ane, assyrian]
scope: >-
  The use of 'love' (ʾāhab) and 'hate' as terms of political loyalty and disloyalty in ancient
  Near Eastern diplomacy and treaties, and its bearing on the command to love YHWH in Deuteronomy
  and related texts. The entry covers W. L. Moran's thesis and later qualifications of it.
passages:
- ref: Deut 6:5
  rel: language
  note: Love YHWH with all your heart, soul and might
- ref: Deut 7:7-9
  rel: language
  note: YHWH's elective love and covenant loyalty (ḥesed) to those who love him
- ref: Deut 10:12
  rel: language
  note: To fear, walk in his ways, love and serve YHWH
- ref: Deut 11:1, 13, 22
  rel: language
  note: Love YHWH and keep his commandments
- ref: Deut 13:3
  rel: language
  note: Testing whether Israel loves YHWH (MT 13:4)
- ref: 1Kgs 5:1
  rel: language
  note: 'Hiram ''had always loved David'': treaty partner language (MT 5:15)'
- ref: 1Sam 18:1-3
