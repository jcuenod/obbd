editorial:
  author_notes:
  - >-
    Tyre was an island until Alexander's mole (332 BCE) joined it to the mainland. Its Iron
    Age levels are known mainly from Bikai's small sounding (1973-74) and from the cemetery
    at al-Bass on the mainland.
  - >-
    Its history comes largely from Assyrian sources (tribute to Shalmaneser III; Esarhaddon's
    treaty with Baal of Tyre), Josephus' Tyrian king list (via Menander), and the thirteen-year
    Babylonian siege.
  - >-
    The 'king of Tyre' oracle (Ezek 28) uses Eden and divine-mountain mythology. Do not read
    it as background for a fall of Satan.
  - The Tyrian shekel was the standard silver coin for the temple tax in the Roman period.
  sources_to_check:
  - Aubet, The Phoenicians and the West (2nd ed., 2001)
