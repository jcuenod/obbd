editorial:
  author_notes:
  - >-
    Ramesside monuments found at Tanis once led Montet to identify Tanis with Pi-Ramesses.
    The Qantir identification (Bietak; Pusch's excavations and magnetometry) is now standard.
  - >-
    Scholars disagree on what the name "Raamses" implies. Some take it as pointing to a Ramesside
    setting for the oppression tradition. Others (e.g., Redford) note that the name and the
    Ramesside cults survived into the first millennium, so the detail need not date the narrative
    early.
  - >-
    Egyptian scribal compositions praising Pi-Ramesses (Ramesside miscellanies) are useful
    comparanda for the city's fame.
  sources_to_check:
  - Bietak, Avaris. The Capital of the Hyksos (1996)
  - Hoffmeier, Israel in Egypt (1997)
