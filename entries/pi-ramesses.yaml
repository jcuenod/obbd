id: pi-ramesses
title: Pi-Ramesses (Qantir)
aliases: [Per-Ramesses, Qantir, Raamses, Rameses]
type: site
cultures: [egyptian]
scope: >-
  The Delta residence city founded under Seti I and Ramesses II at Qantir, adjacent to Avaris.
  It was the capital of the Ramesside kings until the shifting Pelusiac Nile branch led to
  its abandonment in the 11th century BCE. Its monuments were then moved to Tanis and Bubastis.
  It is usually identified with biblical Raamses or Rameses.
