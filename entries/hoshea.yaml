editorial:
  author_notes:
  - >-
    Tiglath-pileser III records receiving Hoshea's tribute. Hoshea's capture (c. 724) preceded
    the fall of Samaria, so the kingdom fell without a king.
  - >-
    Whether Shalmaneser V or Sargon II took Samaria (722 or 720) bears on 2 Kgs 17:6. See
    fall-of-samaria.
  - >-
    Identify 'So' cautiously. The main proposals are Osorkon IV, a reading of Sais as a place
    name, and Tefnakht.
