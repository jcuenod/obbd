scope: >-
  Hoshea son of Elah, last king of Israel, placed on the throne under Assyrian patronage after
  Pekah's overthrow. He later withheld tribute from Shalmaneser V, sought help from Egypt,
  and was imprisoned before the fall of Samaria.
passages:
- ref: 2Kgs 15:30
  rel: event
  note: Hoshea kills Pekah; Tiglath-pileser claims to have installed him
- ref: 2Kgs 17:1-6
  rel: event
  note: Vassalage, revolt, appeal to 'So, king of Egypt', imprisonment and siege
- ref: 2Kgs 17:4
  rel: attests
  disputed: true
  note: '''So'' king of Egypt; identity (Osorkon IV, or the city of Sais) debated'
- ref: 2Kgs 18:9-11
  rel: event
  note: Siege and capture of Samaria
- ref: Hos 7:11
  rel: setting
  note: Ephraim calling to Egypt and going to Assyria
- ref: Hos 12:1
  rel: setting
  note: Treaty with Assyria while oil is carried to Egypt (MT 12:2)
