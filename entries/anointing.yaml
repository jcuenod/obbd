id: anointing
title: Anointing
type: practice
cultures: [ane, hebrew]
scope: >-
  The application of oil to people and sacred objects for everyday, ritual, and political
  purposes, which provides background for biblical consecration, royal installation, and anointing
  imagery. The entry is a synthesis and index heading for evidence also discussed under Emar,
  priesthood, and olive oil.
passages:
- ref: Gen 28:18-22
  rel: practice
  note: >-
    Jacob oils a standing stone; Emar supplies comparative evidence for anointing sacred stones
- ref: Exod 29:7
  rel: practice
  note: >-
    Pouring oil on Aaron's head belongs to priestly installation, with a useful Emar comparison
- ref: Lev 8:10-12
  rel: practice
  note: Anointing applies to sanctuary furnishings and Aaron within the consecration ceremony
- ref: 1Sam 10:1
  rel: practice
  note: Samuel's anointing marks Saul's royal appointment within the narrative
- ref: Ps 133:2
  rel: imagery
  note: Oil flowing over Aaron's head and beard supplies the psalm's comparison
- ref: Isa 61:1
  rel: imagery
  note: >-
    Anointing language expresses divine commissioning without requiring a narrated oil ceremony
related: [emar-texts, priesthood, olive-oil-production, royal-ideology, massebot, messianic-expectations]
