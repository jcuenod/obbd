id: diplomatic-gift-exchange
title: Diplomacy and Gift Exchange
aliases: [Diplomacy, Gift exchange]
type: practice
cultures: [ane, egyptian, hittite]
scope: >-
  The exchange of gifts, envoys and letters between rulers as the medium of ancient Near Eastern
  diplomacy, best documented in the Amarna correspondence. The entry covers biblical scenes
  of gift-giving between kings and the blurred line between gift, tribute and bribe.
