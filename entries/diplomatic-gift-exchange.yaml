editorial:
  author_notes:
  - >-
    The Amarna letters show the Late Bronze Age 'club of great powers' (R. Cohen and R. Westbrook,
    eds., Amarna Diplomacy, 2000). Kings exchanged gold, horses, chariots and craftsmen, and
    complained about stingy gifts (cf. 1 Kgs 9:11-14).
  - >-
    M. Liverani's work on 'prestige and interest' explains reciprocity and the ideological
    presentation of gifts as tribute.
  - >-
    Hebrew minḥâ covers gift, tribute and offering. Translations should not decide the meaning
    too early.
  - >-
    The Merodach-baladan embassy probably relates to anti-Assyrian coalition-building (c.
    703 BCE). The historicity of the Sheba visit is debated.
  sources_to_check:
  - W. L. Moran, The Amarna Letters (Baltimore, 1992)
