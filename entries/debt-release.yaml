editorial:
  author_notes:
  - >-
    Distinguish three biblical institutions that are often conflated. They are the seventh-year
    remission of loans (Deut 15:1-11), the release of debt-servants after six years (Exod
    21:2-6; Deut 15:12-18), and the Jubilee return of land and persons (Lev 25).
  - >-
    Mesopotamian edicts (Uru-inimgina's amargi; Old Babylonian mīšarum acts such as Ammi-ṣaduqa's)
    were issued at a king's discretion, often on accession, and cancelled consumer debts but
    not commercial loans. The biblical releases are periodic and grounded in divine ownership
    of land and people.
  - >-
    Hebrew dĕrôr is cognate with Akkadian andurārum, but etymology alone does not prove borrowing.
    Present the lexical link with that caution.
  - >-
    Whether the Jubilee was ever practised is debated, and positive evidence is lacking. Jer
    34 and Neh 5 look more like ad hoc royal or gubernatorial acts. Lev 25 is usually assigned
    to H (late pre-exilic to post-exilic). 11QMelchizedek and Luke 4 show its eschatological
    reuse.
  - >-
    Mention Hillel's prozbul (m. Shevi'it 10:3) as evidence that Deut 15 remission was observed
    in later Judaism and caused credit problems.
  sources_to_check:
