id: household-and-kinship
title: Household, Clan, and Tribe
aliases: [Bêt ʾāb, Father's House, Mišpāḥâ, Clan, Tribe]
type: concept
cultures: [hebrew]
scope: >-
  The nested kinship structure of ancient Israelite society: the household or 'father's house'
  (bêt ʾāb), the clan or kin group (mišpāḥâ), and the tribe (šēbeṭ, maṭṭeh), with their economic,
  legal and religious functions and the 'patrimonial household' model of Israelite society
  and kingship. House architecture, inheritance, levirate and marriage are treated in their
  own entries.
passages:
