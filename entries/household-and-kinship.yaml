editorial:
  author_notes:
  - >-
    The terms are fluid. Bêt ʾāb can mean a residential extended family or a wider lineage.
    Mišpāḥâ is often translated 'clan' but sometimes means a larger kin group. Šēbeṭ and maṭṭeh
    both mean 'tribe'. The three-tier hierarchy of Josh 7:14-18 is partly schematic.
  - >-
    Archaeology: Stager's study of clusters of pillared houses as compounds for extended families
    (BASOR 260, 1985). Schloen extends the household model to the state, with the king as
    head of a patrimonial household. Engage both.
  - >-
    Women and the household: C. Meyers on the household economy and on the 'mother's house'
    (Gen 24:28; Ruth 1:8; Song 3:4; 8:2). Use this work rather than a simple model of 'patriarchy'.
  - >-
    Household religion (teraphim, ancestor rites, household shrines) is a distinct layer of
    practice. See Albertz and Schmitt.
  - >-
    Avoid assuming that tribes were purely genealogical. Many scholars see them as territorial
    or political groups expressed in kinship language (cf. segmentary lineage models).
  sources_to_check:
  - L. E. Stager, 'The Archaeology of the Family in Ancient Israel,' BASOR 260 (1985)
  - >-
    J. D. Schloen, The House of the Father as Fact and Symbol: Patrimonialism in Ugarit and
    the Ancient Near East (2001)
  - >-
    R. Albertz and R. Schmitt, Family and Household Religion in Ancient Israel and the Levant
    (2012)
  - 'C. Meyers, Rediscovering Eve: Ancient Israelite Women in Context (2013)'
