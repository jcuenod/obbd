editorial:
  author_notes:
  - >-
    Ceramic typology is the backbone of Levantine chronology (Petrie at Tell el-Hesi, 1890;
    Albright). Explain briefly how pottery dates strata and why this matters for historical
    debates.
  - >-
    Egyptian execration rites involved smashing inscribed pots and figurines. They are commonly
    cited for Jer 19:10-11 and Ps 2:9.
  - >-
    The divine potter appears as Khnum shaping humans on the wheel and in Mesopotamian creation
    from clay (Atrahasis; Aruru in Gilgamesh). It is background for Gen 2:7 and the prophetic
    potter image.
  - Ben Sira 38:29-30 describes the potter at work and complements Jer 18.
  sources_to_check:
  - Amiran, Ancient Pottery of the Holy Land (1969)
  - >-
    Gitin (ed.), The Ancient Pottery of Israel and Its Neighbors from the Iron Age through
    the Hellenistic Period (2015)
