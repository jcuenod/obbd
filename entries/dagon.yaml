id: dagon
title: Dagon
aliases: [Dagan]
type: deity
cultures: [amorite, ugaritic, philistine]
scope: >-
  Dagon (Dagan), a major Syrian and Middle Euphrates deity of the Bronze Age, worshipped at
  Ebla, Mari, Terqa, Tuttul, Emar and Ugarit, and in the Iron Age the chief god of the Philistines
  at Ashdod and Gaza according to the Bible.
passages:
- ref: Judg 16:23
  rel: attests
  note: Philistine lords sacrifice to Dagon their god at Gaza
- ref: 1Sam 5:1-5
  rel: polemic
  note: Dagon falls broken before the ark in his temple at Ashdod
- ref: 1Sam 5:5
  rel: practice
  note: Dagon's priests avoid treading on the threshold
- ref: 1Chr 10:10
  rel: attests
  note: Saul's head fastened in the temple of Dagon
- ref: Josh 15:41
  rel: language
  note: Beth-dagon, a town in the Judean lowland
- ref: 1Macc 10:83-84
  rel: attests
  note: Jonathan burns the temple of Dagon at Azotus
related: [philistines, ashdod, gaza, ark-of-the-covenant, emar-texts, mari-letters, ugarit,
  apkallu-reliefs]
