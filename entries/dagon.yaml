editorial:
  author_notes:
  - >-
    Correct the "fish-god" misconception, based on folk etymology from Hebrew dāg "fish" in
    medieval exegesis and on nineteenth-century misidentification of Assyrian fish-cloaked
    apkallu figures as Dagon.
  - >-
    Etymology is debated (Hebrew dāgān "grain"; a root meaning "cloud, rain"); Philo of Byblos
    equates Dagon with Siton (grain). Present options.
  - >-
    At Ugarit Baal is "son of Dagan", yet Dagan has no role in the myths; two dedicatory stelae
    name Dagan, and one acropolis temple is often attributed to him.
  - >-
    The Philistines likely adopted a Semitic deity after settling; this bears on Philistine
    acculturation.
  sources_to_check:
  - L. Feliu, The God Dagan in Bronze Age Syria (CHANE 19, 2003)
  - DDD, s.v. "Dagon"
