id: elephantine-temple-petition
title: Elephantine Temple Petition (Request to Bagavahya)
aliases: [Request to Bagohi, Petition to Bagavahya]
type: artifact
cultures: [jewish, persian]
date:
  from: -407
  to: -407
  display: 407 BCE
scope: >-
  Aramaic petition (TAD A4.7, with draft A4.8) of 407 BCE from Jedaniah and the priests of
  Elephantine to Bagavahya, governor of Judah, seeking support to rebuild the temple of YHW
  destroyed in 410 BCE. The entry also covers the related memorandum (A4.9) and offer (A4.10)
  that record the reply and conditions.
passages:
- ref: Neh 2:10, 19; 13:28
  rel: attests
  note: >-
    Sanballat governor of Samaria; the colonists also wrote to his sons Delaiah and Shelemiah
- ref: Neh 12:22-23
  rel: attests
  note: Johanan the high priest, who left an earlier letter unanswered
- ref: Neh 5:14-15
  rel: attests
  note: Office of governor (peḥâ) of Judah, held by Bagavahya in 407
- ref: Ezra 6:3-12
  rel: practice
  note: Persian authorization to rebuild a temple, specifying permitted offerings
- ref: Deut 12:5-14
  rel: concept
  disputed: true
  note: >-
    Centralization of sacrifice; the memorandum permits meal-offering and incense, not burnt
    offerings
- ref: Isa 19:19
  rel: concept
  disputed: true
  note: An altar to YHWH in Egypt
- ref: Dan 10:2-3
  rel: practice
  note: Mourning by fasting and abstaining from wine and anointing, as the petitioners report
