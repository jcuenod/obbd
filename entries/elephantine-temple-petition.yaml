editorial:
  author_notes:
  - >-
    Dated 20 Marcheshvan, year 17 of Darius II (late 407 BCE); destruction in year 14 (410)
    by priests of Khnum with the support of the commander Vidranga.
  - >-
    Motives for the destruction are debated (property or space disputes, offence at animal
    sacrifice near the ram-god Khnum's temple). Present the Passover-lamb explanation as speculative.
  - >-
    The memorandum's silence on burnt offerings (and the offer in A4.10) is often read as
    deference to Jerusalem's claims or to Egyptian sensitivities.
  - >-
    Chronological value: Sanballat's sons active in 407 and Johanan as high priest support
    placing Nehemiah under Artaxerxes I, and bear on the date of Ezra (cf. Ezra 10:6).
  sources_to_check:
