editorial:
  author_notes:
  - >-
    The equation Shishak = Shoshenq I is accepted almost universally. Revisionist denials
    (Velikovsky; Rohl's New Chronology) are not accepted by scholars.
  - >-
    The campaign (c. 925) is a principal synchronism for the chronology of the divided monarchy.
    Its absolute date depends on Egyptian Third Intermediate Period chronology, so note the
    uncertainty of several years.
  - >-
    The Megiddo stele fragment, found in the Chicago excavations, confirms his presence at
    Megiddo. Its stratigraphic context is poor.
  - >-
    Sukkiim is often linked to the Egyptian tktn (Libyan auxiliaries or scouts). This is plausible
    but not certain.
  sources_to_check:
