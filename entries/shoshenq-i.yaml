id: shoshenq-i
title: Shoshenq I (Shishak)
aliases: [Shishak, Sheshonq I, Sheshonk I]
type: person
cultures: [egyptian]
date:
  from: -945
  to: -924
  circa: true
  display: c. 945–924 BCE
scope: >-
  Founder of the Libyan Twenty-second Dynasty and biblical Shishak. He sheltered Jeroboam
  and, late in his reign, campaigned in Judah and Israel. The Bubastite Portal at Karnak and
  a stele fragment from Megiddo commemorate the campaign.
passages:
- ref: 1Kgs 11:40
  rel: attests
  note: Jeroboam flees to Shishak, king of Egypt
- ref: 1Kgs 14:25-26
  rel: event
  note: Shishak comes against Jerusalem in Rehoboam's fifth year and takes the treasures
- ref: 2Chr 12:2-9
  rel: event
  note: Chronicler's expanded account of the invasion
- ref: 2Chr 12:3
  rel: attests
  note: Libyans, Sukkiim, and Cushites in Shishak's army
related: [bubastite-portal, megiddo, solomon, chronology-of-kings, low-chronology-debate,
  tanis, jerusalem]
