id: gudea-cylinders
title: Gudea Cylinders
type: artifact
cultures: [sumerian]
date:
  from: -2140
  to: -2120
  circa: true
  display: c. 2140–2120 BCE
scope: >-
  Two large inscribed clay cylinders (A and B) from Girsu recording Gudea's rebuilding of
  the Eninnu temple of Ningirsu, from the god's dream command through gathering of materials
  and construction to the dedication festival. They are the longest known Sumerian literary
  composition and the classic example of the ancient Near Eastern temple-building account.
