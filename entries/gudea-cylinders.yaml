editorial:
  author_notes:
  - >-
    Use Hurowitz's analysis of the building-account pattern (decision, divine approval, preparations,
    construction, dedication, blessing) as the frame for comparison with 1 Kgs 5-8.
  - >-
    Cylinder A narrates the dreams, their interpretation by the goddess Nanshe, and the construction;
    Cylinder B the god's entry and the dedication festival, including a temporary suspension
    of social hierarchy.
  - A third cylinder may once have preceded A; mention this as a scholarly proposal only.
  - >-
    The pattern is widespread across two millennia; argue for a shared genre, not direct dependence
    of Kings on a Sumerian text.
