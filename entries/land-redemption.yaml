editorial:
  author_notes:
  - >-
    Cuneiform comparanda include family redemption rights in Old Babylonian sale documents,
    LE §39 (a seller's right to redeem a house; verify), and restrictions on alienating service-fields
    in LH §§36-41. Ugaritic royal grants show land transfers supervised by the king.
  - >-
    Note the debate whether the inalienability ideal reflects early tribal reality or later
    idealisation. Assess the 'latifundia' thesis for eighth-century Israel and Judah, which
    archaeologists and social historians question.
  - >-
    Jer 32 offers the best documentary-style description, with a sealed and an open copy deposited
    in a jar. Link it to sealed-deeds and to excavated bullae.
  - Treat Ruth 4 as literary. Its legal combination of redemption and marriage is debated.
  sources_to_check:
  - Westbrook, Property and the Family in Biblical Law (JSOTSup 113, 1991)
  - Yaron, The Laws of Eshnunna (2nd ed. 1988)
