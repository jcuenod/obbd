id: land-redemption
title: Land Tenure and Redemption
aliases: [Naḥalah, Gĕʾullah, Kinsman-redeemer, Patrimony]
type: practice
cultures: [hebrew, akkadian, ugaritic]
scope: >-
  Land tenure in ancient Israel: the ideal of inalienable ancestral patrimony (naḥălâ), the
  kinsman's right and duty to redeem alienated land, the theology of divine ownership of the
  land, and prophetic critique of land accumulation, with ancient Near Eastern comparanda.
passages:
- ref: Lev 25:23-28
  rel: practice
  note: Land is YHWH's and cannot be sold in perpetuity; kinsman redeems
- ref: Lev 25:29-34
  rel: practice
  note: Different rules for walled-city houses and Levitical property
- ref: Ruth 4:1-12
  rel: practice
  note: Redemption of Elimelech's field combined with marrying Ruth
- ref: Jer 32:6-15
  rel: practice
  note: Jeremiah exercises the right of redemption at Anathoth; sealed deed
- ref: 1Kgs 21:1-19
  rel: practice
  note: Naboth refuses to sell 'the inheritance of my ancestors'
- ref: Num 27:1-11
  rel: practice
  note: Daughters inherit to keep the patrimony in the clan
- ref: Mic 2:1-2
  rel: practice
  note: Woe to those who covet and seize fields and houses
- ref: Isa 5:8
  rel: practice
  note: Woe to those who join house to house and field to field
- ref: Ezek 46:16-18
  rel: practice
  note: Prince may not dispossess people of their inheritance
