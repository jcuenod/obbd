- ref: Lev 1-7
  rel: practice
  note: Offerings classified by type and by animal, with priestly portions
- ref: Lev 7:28-36
  rel: practice
  note: 'Priestly portions of the well-being offering: breast and right thigh'
- ref: Lev 7:8
  rel: practice
  note: Priest's right to the hide of the burnt offering; Punic tariffs also allocate hides
- ref: Deut 18:3
  rel: practice
  note: 'Priest''s due from sacrifices: shoulder, cheeks, and stomach'
- ref: 1Sam 2:13-16
  rel: practice
  note: '''Custom of the priests'' regarding their share'
- ref: Lev 5:7, 11
  rel: practice
  note: 'Substitutions for poorer offerers: birds and flour; tariff also prices birds'
- ref: 1Sam 7:9
  rel: language
  note: ʿôlâ kālîl 'whole burnt offering'; cf. Punic kll
- ref: Ps 51:19
  rel: language
  note: ʿôlâ and kālîl paired; MT 51:21
- ref: Deut 33:10
