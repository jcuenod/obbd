editorial:
  author_notes:
  - >-
    The stone is generally thought to have come from Carthage. The text heads itself as a
    tariff of a temple of Baal (commonly restored Baal-Ṣaphon). Verify the reading of line
    1. A fragmentary companion tariff from Carthage (KAI 74) should be discussed with it.
  - >-
    The exact meanings of kll, ṣwʿt, and šlm kll are debated. Avoid simply equating them with
    biblical ʿôlâ, ḥaṭṭāʾt, and šĕlāmîm. The parallel lies in the classification and in the
    regulation of priestly portions.
  - >-
    The tariff is a valuable non-biblical example of written regulation protecting offerers
    from priestly overreach (cf. 1 Sam 2:12-17).
  - >-
    Date ranges given in the literature vary (roughly 4th-3rd c. BCE). Verify before stating
    a precise date.
