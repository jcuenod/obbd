date:
  from: -1177
  to: -1177
  circa: true
  display: c. 1177 BCE
scope: >-
  Reliefs and inscriptions on the mortuary temple of Ramesses III at Medinet Habu (western
  Thebes) commemorating his year 8 land and sea battles against a coalition of "Sea Peoples".
  The coalition includes the Peleset (Philistines), Tjeker, Shekelesh, Denyen, and Weshesh.
  The reliefs depict their ships, dress, weapons, and ox-carts carrying families.
