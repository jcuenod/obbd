editorial:
  author_notes:
  - >-
    The identification Peleset = Philistines is generally accepted, as is the Aegean/Cypriot
    cultural background shown by Philistine material culture (Mycenaean IIIC pottery and other
    features). Caphtor is usually identified with Crete or the Aegean.
  - >-
    The reliefs are ideological. Scholars debate whether the land and sea battles were single
    events and where they took place (Delta, Djahy), and whether "invasion" or gradual migration
    within a wider systems collapse better describes the period.
  - >-
    The severed hands and phalli are counted in the scenes of the Libyan wars at Medinet Habu,
    not the Sea Peoples scenes. Keep the distinction clear.
  - >-
    Goliath's armour (1 Sam 17) is a composite, and its correlation with the Medinet Habu
    warriors (feathered headdresses, round shields) is loose. Hence the relation is marked
    as disputed.
