editorial:
  author_notes:
  - >-
    Distinguish the functions: mourning (1 Sam 31:13), petition in crisis (2 Sam 12; Joel
    2), penitence (1 Sam 7:6; Jonah 3), and preparation for revelation (Dan 9:3; 10:2-3).
    D. A. Lambert (2016) argues that biblical fasting is a ritual of distress and appeal rather
    than an expression of inner 'repentance'; note this challenge to the traditional reading.
  - >-
    Comparative evidence for communal fasting is thinner outside Israel than for mourning
    rites. Present it cautiously: Herodotus 2.40 (Egyptians fast before an Isis festival),
    Herodotus 9.24 (Persians extend mourning to horses and pack animals, often cited for Jonah
    3:7-8), and Mesopotamian ritual and hemerological food restrictions.
  - >-
    'Afflict yourselves' in Lev 16 and 23 is not explicitly fasting. The rabbinic definition
    (m. Yoma 8:1) adds abstention from washing, anointing, sandals and sex. Keep the ancient
    text and its later interpretation distinct.
  - >-
    Note late Second Temple practice: regular weekly fasts (Luke 18:12; Didache 8:1 contrasts
    Jewish and Christian fast days) and Mark 2:18-20.
  sources_to_check:
  - D. A. Lambert, How Repentance Became Biblical (2016)
  - >-
    T. Podella, Ṣôm-Fasten: Kollektive Trauer um den verborgenen Gott im Alten Testament (AOAT
    224, 1989)
  - G. A. Anderson, A Time to Mourn, a Time to Dance (1991)
