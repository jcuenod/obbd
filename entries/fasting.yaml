id: fasting
title: Fasting and Penitential Rites
aliases: [ṣôm, self-affliction, penitential rites]
type: practice
cultures: [hebrew, jewish]
scope: >-
  Abstaining from food and drink as a ritual of mourning, petition, penitence and preparation
  in ancient Israel and early Judaism, usually combined with sackcloth, ashes, weeping and
  prayer. It covers individual and communal fasts in crisis, the self-affliction of the Day
  of Atonement, the commemorative fasts for Jerusalem's fall, and fasting in the New Testament.
  General mourning gestures belong to mourning-rites.
