scope: >-
  The Iron Age kingdom of Ammon centred on Rabbah (Amman) and its people. Covers Ammonite
  inscriptions, seals and statuary, relations with Assyria and Babylon, and the biblical portrayal
  from the conquest stories to Nehemiah.
