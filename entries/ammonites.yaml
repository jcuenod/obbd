editorial:
  author_notes:
  - >-
    Assyrian texts call the kingdom Bit-Ammon and name kings such as Sanipu and Amminadab.
    Ammonite inscriptions (Amman Citadel, Tell Siran bottle) and a rich corpus of seals document
    the language and onomastics.
  - >-
    A seal impression from Tell el-ʿUmeiri naming Milkomʾur, servant of Baʿalyašaʿ, is widely
    linked with Baalis of Jer 40:14.
  - >-
    Limestone statues from Amman, some wearing atef crowns, show Egyptianizing royal iconography.
  - >-
    The Tobiad family of the Hellenistic period (ʿIraq al-Amir) may continue Nehemiah's Tobiah,
    but this is debated.
  sources_to_check:
  - MacDonald and Younker (eds.), Ancient Ammon (1999)
