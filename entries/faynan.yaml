editorial:
  author_notes:
  - >-
    The Edom Lowlands Regional Archaeology Project (Levy, Najjar, Ben-Yosef) dated massive
    slag deposits and a fortress at Khirbat en-Naḥas by radiocarbon to the eleventh to ninth
    centuries BCE. This challenged the older view that Edom formed only in the eighth to seventh
    centuries (Bienkowski).
  - >-
    Whether this production was run by an early Edomite polity, a tribal confederation, or
    (as Levy has suggested) related to Davidic or Solomonic power is contested. Treat any
    link to David as speculative.
  - >-
    Faynan is identified with Punon (Num 33:42-43) and with Roman Phaino, the mines to which
    Christians were condemned (Eusebius).
  - >-
    Egyptian amulets and a scarab of the early Twenty-second Dynasty have been linked with
    Shoshenq I's campaign (Levy and others). Treat this as a proposal.
  sources_to_check:
  - >-
    Levy, Najjar and Ben-Yosef (eds.), New Insights into the Iron Age Archaeology of Edom,
    Southern Jordan (2014)
