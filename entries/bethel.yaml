editorial:
  author_notes:
  - >-
    The identification with Beitin (Robinson; Albright and Kelso's excavations 1934 and 1954-60)
    is standard. Alternatives such as el-Bireh are not accepted.
  - >-
    Kelso's results were poorly published. Finkelstein and Singer-Avitz's reappraisal (2009)
    found limited Iron IIA-B and little Babylonian or Persian occupation, which matters for
    theories of Bethel as an exilic-period scribal centre.
  - >-
    No sanctuary remains have been identified, so the location of Jeroboam's temple is unknown.
  - >-
    The deity Bethel (Bayt-il) in Esarhaddon's treaty with Baal of Tyre and at Elephantine
    bears on Jer 48:13. Mark this as possible, not certain.
