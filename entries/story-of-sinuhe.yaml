editorial:
  author_notes:
  - >-
    Sinuhe is a literary work (a fictional autobiography), not a travel report. Use it cautiously
    as evidence for Middle Bronze Age Levantine society, and avoid the older habit of using
    it to "confirm" the patriarchal lifestyle.
  - >-
    The champion combat with David and Goliath is a standard comparison. Note the differences
    in weapons and narrative function, and see the separate entry on champion combat.
  - >-
    Toponyms (Retenu, Qedem, Byblos, Yaa) and the Amorite name of Sinuhe's patron (Ammunenshi)
    are valuable for the Middle Bronze Levant. The location of Yaa is unknown.
  - >-
    Major manuscripts are P. Berlin 3022 and 10499, plus a large Ashmolean ostracon among
    many New Kingdom ostraca.
