  circa: true
  display: c. 1920–1850 BCE
scope: >-
  A Middle Kingdom narrative poem in autobiographical form. On the death of Amenemhat I, the
  courtier Sinuhe flees Egypt and prospers among Asiatic chieftains in Retenu. He defeats
  a local champion and finally returns to Egypt to be buried there by the king's favour. It
  was the most widely copied work of Egyptian literature.
