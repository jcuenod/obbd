  rel: parallel
  note: Flight from pharaoh, welcome by a foreign chief, marriage to his daughter
- ref: 1Kgs 11:17-22
  rel: parallel
  note: Political refugee (Hadad) prospers abroad and longs to return home
- ref: Deut 8:7-9
