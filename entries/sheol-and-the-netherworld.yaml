title: Sheol and the Netherworld
aliases: [Sheol, The Pit, Underworld]
type: concept
cultures: [ane, babylonian, ugaritic]
scope: >-
  Sheol, the shadowy realm of the dead in the Hebrew Bible, set against Mesopotamian and Ugaritic
  conceptions of the netherworld and of Death as a devouring power. Later ideas of resurrection
  and afterlife judgment are covered in a separate entry.
