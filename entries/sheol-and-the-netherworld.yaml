editorial:
  author_notes:
  - >-
    Mesopotamian comparanda include the 'land of no return' with dust as food (Descent of
    Ishtar; Gilgamesh VII and XII). Mot's insatiable appetite in the Baal Cycle is the background
    to Isa 5:14, Hab 2:5 and Isa 25:8.
  - >-
    Sheol is not hell. It is the common destination of all, though Ezek 32 shows some differentiation
    by manner of death and burial.
  - >-
    The etymology of šĕʾôl is uncertain. Older Akkadian derivations (*šuʾālu) are no longer
    accepted.
  - >-
    Trace the tension between Sheol as cut off from YHWH (Ps 6:5; 88) and YHWH's reach into
    it (Ps 139:8; Amos 9:2).
