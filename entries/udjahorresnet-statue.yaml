editorial:
  author_notes:
  - >-
    Debate on whether he was a collaborator or a protector of Egyptian interests. His positive
    portrait of Cambyses contrasts with Herodotus's 'mad Cambyses'.
  - >-
    The parallel to Ezra and Nehemiah is typological (Blenkinsopp 1987): it shows how Persian
    kings used native elites. It is not evidence of direct contact.
  - >-
    Relate him to the Demotic Chronicle's report that Darius ordered Egyptian law collected.
    This is important evidence in the imperial authorization debate.
  sources_to_check:
