id: udjahorresnet-statue
title: Naophorous Statue of Udjahorresnet
type: artifact
cultures: [egyptian, persian]
date:
  from: -519
  to: -519
  circa: true
  display: c. 519 BCE
scope: >-
  Naophorous statue of the Egyptian official Udjahorresnet, priest of Neith at Sais and chief
  physician, whose inscription narrates his service to Cambyses and Darius I. It records his
  role in composing Cambyses' royal titulary, restoring the Neith sanctuary, and, on Darius's
  orders, re-establishing the 'House of Life'.
passages:
- ref: Ezra 7:12-26
  rel: parallel
  note: >-
    A native official commissioned by the Persian king to restore local cult and institutions
- ref: Neh 1:11-2:8
  rel: parallel
  note: A courtier of subject origin gains royal sponsorship for his homeland
- ref: Ezra 6:3-12
  rel: practice
  note: Persian royal patronage of a local sanctuary
related: [persian-imperial-authorization, darius-i, persia, cyrus-cylinder, court-officials,
  scribes-and-scribal-education]
