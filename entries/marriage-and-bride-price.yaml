id: marriage-and-bride-price
title: Marriage, Bride-Price, and Dowry
aliases: [Mohar, Dowry, Betrothal, Marriage contract]
type: practice
cultures: [hebrew, akkadian, assyrian, jewish]
scope: >-
  Marriage formation and marital property in ancient Israel and the wider Near East: betrothal,
  the bride-price (mōhar), the dowry and other marriage gifts, marriage contracts, and divorce,
  with special attention to the Elephantine Aramaic marriage documents.
passages:
- ref: Gen 24:50-53
  rel: practice
  note: Betrothal negotiated with Rebekah's family; gifts to bride, brother, and mother
- ref: Gen 29:15-30
  rel: practice
  note: Jacob's labour as bride-price; a slave-woman given with each daughter
- ref: Gen 31:14-16
  rel: practice
  note: Rachel and Leah complain that their father consumed their 'money'
- ref: Gen 34:12
  rel: practice
  note: Shechem offers any mōhar and gift
- ref: Exod 22:16-17
  rel: practice
  note: Seducer pays the bride-price of virgins (MT 22:15-16); cf. MAL A §§55-56
- ref: Deut 22:28-29
  rel: practice
  note: Fifty shekels and no right of divorce after rape of an unbetrothed virgin
- ref: 1Sam 18:25
  rel: practice
  note: Saul demands a hundred Philistine foreskins as mōhar
- ref: Josh 15:16-19
  rel: practice
  note: Achsah requests springs as a marriage gift (cf. Judg 1:12-15)
- ref: 1Kgs 9:16
  rel: practice
  note: Gezer given as dowry (šillûḥîm) with Pharaoh's daughter
- ref: Deut 24:1-4
  rel: practice
  note: Bill of divorce and ban on remarriage to the first husband
- ref: Tob 7:13-14
  rel: practice
  note: Raguel writes a marriage contract (NRSV 7:13; 7:14 in GI-based versions)
