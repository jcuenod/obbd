editorial:
  author_notes:
  - >-
    Correct the 'wife-purchase' model. Most scholars (e.g., Westbrook, Lemos) see the mōhar
    (Akk. terḫatum) as a marriage payment that creates affinal ties, not a sale price. Distinguish
    it from the dowry (Akk. šeriktum; Heb. šillûḥîm) and from the husband's gift to the wife.
  - >-
    Present the Elephantine marriage documents (e.g., TAD B2.6, B3.3, B3.8; 5th century BCE).
    They give the mōhar, list the dowry, and let either spouse initiate divorce with a declaration
    of 'hating'. Verify numbering in TAD.
  - >-
    Compare Exod 22:16-17 / Deut 22:28-29 with MAL A §55, and LH §§159-161 on broken betrothals.
  - >-
    No Israelite marriage contract survives from the monarchic period. Tobit is the earliest
    Jewish literary reference to a written contract.
  sources_to_check:
  - Porten and Yardeni, Textbook of Aramaic Documents from Ancient Egypt, vol. 2 (1989)
  - Porten, The Elephantine Papyri in English (1996)
  - Roth, Law Collections from Mesopotamia and Asia Minor (SBLWAW 6, 2nd ed. 1997)
  - Lemos, Marriage Gifts and Social Change in Ancient Palestine (2010)
