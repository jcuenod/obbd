editorial:
  author_notes:
  - >-
    The consensus is that tĕhôm and Akkadian tiāmtum ("sea") share a common Semitic root (cf.
    Ugaritic thm/thmt). Tĕhôm is not a loanword from the name Tiamat. The phonology argues
    against direct borrowing (Heidel; Tsumura).
  - >-
    Gunkel's influential view that Gen 1:2 reflects a demythologized Tiamat should be presented
    as historically important but heavily qualified. In Gen 1 tĕhôm is not personified and
    there is no combat.
  - >-
    Tĕhôm usually appears without the article (quasi-proper-noun use), but this alone does
    not show personification.
  - >-
    Note the term's range across creation, flood, blessing (fertile subterranean waters),
    and exodus poetry.
  sources_to_check:
  - David Toshio Tsumura, Creation and Destruction (2005)
  - Hermann Gunkel, Creation and Chaos in the Primeval Era and the Eschaton (ET 2006)
