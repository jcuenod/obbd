cultures: [hebrew, ugaritic, babylonian]
scope: >-
  Hebrew tĕhôm, the primeval and subterranean "deep", in creation, flood, and poetic texts,
  and the long debate over its relation to Akkadian tiāmtum and the goddess Tiamat of Enuma
  Elish.
