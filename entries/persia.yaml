scope: >-
  The Achaemenid Persian Empire from Cyrus II to Darius III, under which Judah became the
  province of Yehud. Covers the empire's history, sources, administration and royal ideology,
  and their reflection in Ezra-Nehemiah, Esther, Daniel, Haggai, Zechariah and Second Isaiah.
