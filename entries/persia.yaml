editorial:
  author_notes:
  - >-
    The sources are Achaemenid royal inscriptions (Behistun and others), the Persepolis archives,
    Aramaic documents (Elephantine, Bactria), and Greek writers (Herodotus, Xenophon, Ctesias).
    Each has its own biases.
  - >-
    Frei's 'imperial authorization' thesis for the Pentateuch is debated and has been substantially
    weakened. Cross-refer persian-imperial-authorization.
  - >-
    The Cyrus Cylinder does not mention Judeans. The popular image of it as a 'charter of
    human rights' is a misconception.
  - >-
    Persian administrative vocabulary in the Bible includes dāt 'law', ʾăḥašdarpĕnîm 'satraps'
    and ganzak 'treasury'. Yehud was a small province.
  sources_to_check:
