id: care-and-feeding-of-the-gods
title: Care and Feeding of the Gods
type: concept
cultures: [ane, babylonian, egyptian, hittite]
scope: >-
  Daily temple service in which cult images were fed, clothed, washed, and entertained, especially
  in Mesopotamia and Egypt, and the biblical traces of this idiom (sacrifices as God's "food",
  the table and bread of the Presence) alongside its critique.
