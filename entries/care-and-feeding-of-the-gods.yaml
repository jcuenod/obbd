editorial:
  author_notes:
  - >-
    Oppenheim's chapter "The Care and Feeding of the Gods" (Ancient Mesopotamia, 1964) gave
    the topic its name. Late Babylonian ritual texts from Uruk prescribe the daily meals of
    Anu and other gods.
  - >-
    The divine meal was redistributed afterwards to the king, priests, and temple personnel.
    This is relevant to priestly portions in Lev 6-7.
  - >-
    The Hebrew Bible keeps food language for offerings while also rejecting the idea that
    God needs feeding (Ps 50). Present this as tension within the tradition, not a simple
    Israelite-versus-pagan contrast.
  - >-
    The Hittite Instructions for Temple Officials stress the purity of those preparing the
    gods' bread. This is a useful comparison for priestly purity rules.
