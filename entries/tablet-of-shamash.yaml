editorial:
  author_notes:
  - >-
    Found by Hormuzd Rassam at Sippar (Abu Habbah) in 1881, stored in a clay box with clay
    impressions of the relief; Woods argues the relief deliberately imitates an older model.
  - >-
    The text tells how the original image was lost in the Sutean disturbances and a new one
    was made after a model was found; key evidence for the making and consecration of cult
    images (mouth-washing).
  - >-
    The presentation scene (king led by an interceding deity) is a classic iconographic type.
  - >-
    The sun disk here is not winged; do not use the tablet as direct background for Mal 4:2's
    'wings'. Shamash as god of justice is the stronger link to solar imagery for YHWH.
  sources_to_check:
  - Woods, "The Sun-God Tablet of Nabû-apla-iddina Revisited," JCS 56 (2004)
