id: tablet-of-shamash
title: Tablet of Shamash
aliases: [Sun-God Tablet, Sippar Sun-God Tablet]
type: artifact
cultures: [babylonian]
date:
  from: -870
  to: -870
  circa: true
  display: c. 870 BCE
scope: >-
  A grey schist tablet from Sippar recording how Nabu-apla-iddina of Babylon (9th century
  BCE) restored the cult image of the sun-god Shamash. The relief shows the king led before
  the enthroned Shamash, with a large sun disk on an altar and the shrine resting above the
  heavenly waters.
