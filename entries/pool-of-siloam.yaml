editorial:
  author_notes:
  - >-
    The 2004 discovery (Reich and Shukron) of a stepped pool dated by coins to the 1st century
    BCE-1st century CE confirms John's topography. Distinguish it from the Byzantine and modern
    pool.
  - Its use as a large miqveh for pilgrims has been proposed but is debated.
  - >-
    Note the ongoing excavation of the stepped street toward the Temple Mount and the political
    sensitivities of excavating under Silwan.
