id: pool-of-siloam
title: Pool of Siloam
type: site
cultures: [jewish, judahite]
scope: >-
  The pool(s) at the southern end of Jerusalem's City of David, fed by Hezekiah's tunnel from
  the Gihon spring. The entry covers the large stepped pool of the late Second Temple period,
  discovered in 2004, as well as its Iron Age and Byzantine predecessors and successors.
