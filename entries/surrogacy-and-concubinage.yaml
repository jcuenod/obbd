id: surrogacy-and-concubinage
title: Surrogacy and Concubinage
aliases: [Pilegesh, Secondary wife, Slave-wife]
type: practice
cultures: [hebrew, akkadian, assyrian, hurrian]
scope: >-
  The practice of an infertile wife giving her slave woman to her husband to bear children
  counted as her own, and the wider status of concubines (secondary wives) in ancient Israel,
  compared with Old Babylonian, Old Assyrian, and Nuzi documents.
