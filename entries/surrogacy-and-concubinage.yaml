editorial:
  author_notes:
  - >-
    Key parallels are LH §§144-147 (a nadītu wife provides a slave woman, who may not claim
    equality with her mistress), Old Assyrian marriage contracts with an infertility clause,
    and a Nuzi marriage contract obliging a barren wife to provide a slave woman. Verify text
    numbers before citing.
  - >-
    Caution on the Nuzi parallels. Speiser and Gordon used them to date the patriarchs to
    the second millennium. Thompson (1974) and Van Seters (1975) showed that comparable arrangements
    span the first millennium too, so the parallels cannot date the narratives.
  - >-
    Distinguish wife-provided surrogacy from concubinage (pîlegeš) in general. Note the political
    use of royal concubines in the succession narratives.
  sources_to_check:
