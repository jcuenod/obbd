id: pilate-stone
title: Pilate Stone
type: artifact
cultures: [roman]
date:
  from: 26
  to: 36
  display: 26–36 CE
scope: >-
  Limestone block found at Caesarea Maritima in 1961, reused in the theatre, bearing a Latin
  dedication of a Tiberieum by Pontius Pilatus, prefect of Judea. It is the only contemporary
  inscription naming Pilate and gives his official title.
passages:
- ref: Luke 3:1
  rel: attests
  note: Pontius Pilate governor of Judea in Tiberius's fifteenth year
- ref: Matt 27:2, 11
  rel: language
  note: '''Governor'' (hēgemōn); the inscription gives the formal title praefectus'
- ref: Mark 15:1-15
  rel: attests
  note: Jesus' trial before Pilate
- ref: John 18:28-19:16
  rel: attests
  note: Pilate's praetorium and the trial
- ref: Acts 4:27
  rel: attests
  note: Pilate with Herod and the nations against Jesus
- ref: 1Tim 6:13
  rel: attests
  note: Christ's testimony before Pontius Pilate
- ref: Acts 23:33-35
  rel: setting
  note: Caesarea as the Roman governor's seat
related: [caesarea-maritima, imperial-cult, caiaphas-ossuary, crucifixion, josephus, herod-the-great]
location:
  institution: Israel Museum, Jerusalem
  accession: null
media:
- id: pilate-stone
  role: primary
