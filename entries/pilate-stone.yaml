editorial:
  author_notes:
  - >-
    Present the reading and restoration, and the debate over what the Tiberieum was (a cultic
    building or a maritime structure such as a lighthouse, per Alföldy).
  - >-
    Prefect (not procurator, as in Tacitus, Ann. 15.44) was the correct title for equestrian
    governors of Judea before 44 CE.
  - >-
    Other evidence for Pilate: his coins (29-31 CE), Philo (Legat. 299-305), Josephus. The
    2018 Herodium ring inscribed 'Pilatus' is of uncertain relevance.
  sources_to_check:
