id: divine-glory-and-melammu
title: Divine Glory (kābôd) and Radiance (melammu)
aliases: [kābôd, melammu, puluḫtu, divine radiance, glory of YHWH]
type: concept
cultures: [hebrew, assyrian, babylonian]
scope: >-
  Divine and royal radiance in Mesopotamia (Akkadian melammu, paired with puluḫtu "awe") and
  the Hebrew Bible's kābôd ("glory") and hôd wĕhādār ("splendour and majesty"), including
  the glory-cloud of the Priestly texts and Ezekiel and the shining face of Moses. The departure
  and return of the glory are treated under divine-abandonment, and divine favour as a shining
  face under light-of-the-face.
passages:
