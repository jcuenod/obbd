editorial:
  author_notes:
  - >-
    Explain melammu as a visible, fearsome aura of gods, temples, monsters and kings, sometimes
    described as a garment or crown that can be removed (Humbaba's auras in Gilgamesh). Assyrian
    annals say the king's or Aššur's melammu 'overwhelmed' enemies (e.g. Sennacherib on Luli
    of Sidon). Oppenheim (1943) and Cassin (1968) are the classic studies.
  - >-
    Hebrew kābôd develops from 'weight, honour' to the visible manifestation of the deity.
    The Priestly and Ezekielian kābôd theology is often contrasted with Deuteronomistic name
    theology (von Rad; Mettinger). That contrast is itself debated, so present it with care.
  - >-
    Aster (2012) argues that Isaiah (e.g. Isa 2:10-21) adapts Assyrian melammu language polemically.
    Treat it as a strong but discussed proposal.
  - >-
    Correct the 'horned Moses' misconception. The Vulgate's cornuta (Exod 34:29) renders qāran,
    which most take as 'shone' (from qeren 'ray'). A minority (e.g. Propp) argue for a real
    horn-like disfigurement.
  sources_to_check:
  - A. L. Oppenheim, 'Akkadian pul(u)ḫ(t)u and melammu,' JAOS 63 (1943)
  - E. Cassin, La splendeur divine (1968)
  - T. N. D. Mettinger, The Dethronement of Sabaoth (ConBOT 18, 1982)
  - 'S. Z. Aster, The Unbeatable Light: Melammu and Its Biblical Parallels (AOAT 384, 2012)'
