editorial:
  author_notes:
  - >-
    The Babylonian Chronicle (ABC 5) dates the capture of Jerusalem to 2 Adar of Nebuchadnezzar's
    7th year (16 March 597). 2 Kgs 24:12 has 'eighth year'. Explain the different reckonings.
  - >-
    The ration tablets (Weidner) date from c. 592 onwards, before his release in 562/561.
    They show Jehoiachin and five sons receiving rations, which complicates 'childless' in
    Jer 22:30.
  - >-
    Correct an older error: the 'Eliakim steward of Yokan' seal impressions were once linked
    to Jehoiachin, but are now dated to the late 8th century and are unrelated.
  - >-
    Exilic dating by Jehoiachin's years (Ezekiel) suggests some still regarded him as the
    legitimate king.
  sources_to_check:
