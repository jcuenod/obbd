date:
  from: -598
  to: -597
  circa: true
  display: c. 598–597 BCE
scope: >-
  Jehoiachin son of Jehoiakim, king of Judah for three months before surrendering to Nebuchadnezzar
  II in 597, and later a royal captive in Babylon. Babylonian ration tablets list oil for
  'Yaʾukīn, king of the land of Yahudu' and his sons.
passages:
- ref: 2Kgs 24:8-17
  rel: event
  note: Brief reign, surrender and deportation in 597
- ref: 2Kgs 25:27-30
  rel: attests
  note: Released by Evil-merodach and given a regular allowance
- ref: Jer 52:31-34
  rel: attests
  note: Parallel account of his release and rations
- ref: Jer 22:24-30
  rel: attests
  note: Coniah as YHWH's signet ring, cast off; 'record this man as childless'
- ref: 1Chr 3:17-18
  rel: attests
  note: Sons of Jeconiah the captive
- ref: Ezek 1:2
  rel: setting
  note: Prophetic dates reckoned from Jehoiachin's exile
