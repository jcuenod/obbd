editorial:
  author_notes:
  - >-
    The best comparanda for the mĕkōnôt are Late Cypriot bronze four-sided wheeled stands
    (12th-11th c. BCE) with openwork panels of animals and sphinxes. This supports the Phoenician
    or Cypriot craft tradition implied by Hiram (1 Kgs 7:13-14).
  - >-
    The description in 1 Kgs 7:27-37 contains rare technical terms and textual difficulties.
    Rely on commentaries when reconstructing it.
  - >-
    Distinguish the ceramic fenestrated stands (Taanach, Pella, Yavneh, Tel Rehov) from the
    bronze basin stands. Their iconography (e.g. on Taanach) and whether it represents Asherah
    and YHWH are debated.
