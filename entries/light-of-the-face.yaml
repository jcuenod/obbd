editorial:
  author_notes:
  - >-
    In the Amarna letters, Levantine vassals address Pharaoh as the sun whose face brings
    life (e.g. Abimilki of Tyre, EA 147). Akkadian idioms of a "bright face" (pānū namrūtu)
    express a god's or king's favour. Present these as the closest analogues to Prov 16:15
    and the Psalms.
  - >-
    The Ketef Hinnom silver amulets (late Iron Age, dating debated) attest a form of the Priestly
    Blessing outside the Bible.
  - >-
    Note the solar overtones of the idiom without assuming a solar cult behind every occurrence.
  image_query: Ketef Hinnom amulet
