id: light-of-the-face
title: Shining Face and Divine Favor
aliases: [shining face, lifting up the face]
type: concept
cultures: [ane, egyptian, canaanite]
scope: >-
  The idiom of a god's or king's shining face as an expression of favour and presence, together
  with "hiding" or "lifting up" the face, in ancient Near Eastern royal and religious language
  and in the Priestly Blessing and the Psalms.
passages:
