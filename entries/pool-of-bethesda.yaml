id: pool-of-bethesda
title: Pool of Bethesda
type: site
cultures: [jewish, roman]
scope: >-
  The twin pools north of the Temple Mount near the Church of St Anne, identified with the
  pool 'by the Sheep Gate' with five porticoes in John 5. The entry covers the pools' history
  and the later Roman healing sanctuary nearby.
passages:
- ref: John 5:2-9
  rel: setting
  note: Pool with five porticoes where the sick waited for healing
- ref: John 5:3-4
  rel: language
  note: The angel stirring the water (5:3b-4) is absent from the earliest manuscripts
- ref: Neh 3:1; 12:39
  rel: setting
  note: The Sheep Gate north of the temple
