editorial:
  author_notes:
  - >-
    Excavations revealed two basins separated by a dam, supporting John's five porticoes (four
    sides plus the dividing dam). The pools' date and function (reservoir, possibly ritual
    bathing in the southern pool) are debated.
  - >-
    A healing sanctuary (Asclepius/Serapis) is attested after 135 CE. Its existence before
    70 is disputed, so do not assume it as the setting of John 5.
  - >-
    The name varies in manuscripts (Bethesda, Bethzatha, Bethsaida). The Copper Scroll (3Q15)
    reading of a dual 'Beth Eshdatayin' is sometimes cited but debated.
  sources_to_check:
  - J. Jeremias, The Rediscovery of Bethesda (1966)
