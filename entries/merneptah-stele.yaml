editorial:
  author_notes:
  - >-
    Explain the determinatives. Ashkelon, Gezer, and Yanoam carry the city/foreign-land sign,
    while Israel carries the sign for a people. Most scholars infer a group not (yet) organised
    as a territorial state, but do not press this too hard, since scribal determinatives can
    be inconsistent.
  - >-
    The reading "Israel" is near-universally accepted. Alternatives such as "Jezreel" are
    minority views. Locating this Israel (central hill country, Jezreel, or Transjordan) and
    reading "his seed is not" (grain or offspring?) are both debated. The phrase is a stock
    formula of defeat.
  - >-
    The stele gives a terminus ante quem (c. 1208) for a group called Israel in Canaan. It
    says nothing about an exodus and does not identify that group with later biblical Israel's
    full tribal structure.
  - >-
    Mention the Karnak "Ashkelon wall" reliefs that Yurco assigned to Merneptah and proposed
    as depicting Israelites. That identification is contested; Rainey, for example, read the
    relevant figures as Shasu. Mention the Berlin pedestal relief (Görg, van der Veen et al.)
    as a debated possible earlier occurrence of the name.
  - The stele was carved on the back of a reused stele of Amenhotep III.
