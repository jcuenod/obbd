scope: >-
  The granite victory stele of Merneptah, dated to his fifth regnal year and found by Petrie
  in 1896 in the king's mortuary temple at western Thebes. Most of the text celebrates victory
  over the Libyans; its closing lines name Canaan, Ashkelon, Gezer, Yanoam, and "Israel",
  the earliest certain extrabiblical occurrence of the name.
