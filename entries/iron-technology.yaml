id: iron-technology
title: Iron Technology and the Philistine Monopoly
aliases: [Philistine iron monopoly, Iron Age metallurgy]
type: concept
cultures: [hebrew, philistine, canaanite]
scope: >-
  The introduction and spread of iron-working in the Levant at the transition from the Late
  Bronze to the Iron Age, and the biblical texts often read as evidence of a Philistine monopoly
  on iron.
passages:
- ref: 1Sam 13:19-22
  rel: practice
  note: No smith in Israel; tools sharpened by Philistines
- ref: 1Sam 13:21
  rel: language
  note: Charge of a pim (two-thirds shekel), confirmed by inscribed pim weights
- ref: Deut 8:9
  rel: realia
  note: '''A land whose stones are iron'''
- ref: Josh 17:16-18
  rel: realia
