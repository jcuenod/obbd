editorial:
  author_notes:
  - >-
    The 'Philistine iron monopoly' (G. E. Wright, Albright) is not supported by archaeology.
    Iron-working spread gradually across the Levant from the 12th to 10th centuries, and Philistine
    sites show no early dominance. Present 1 Sam 13:19-22 as a claim about control of smithing
    or as a literary motif.
  - The related myth of a Hittite iron monopoly should also be corrected.
  - >-
    Iron becomes the dominant metal for tools and weapons only in Iron IIA (10th-9th centuries).
    Carburisation into steel appears gradually. Mention excavated smelting and smithing sites
    (e.g., Tell Hammeh in the Jordan Valley).
  - >-
    The pim weight finds settled the reading of 1 Sam 13:21. This is a good example of epigraphy
    clarifying an obscure Hebrew word.
  sources_to_check: ['Waldbaum, From Bronze to Iron (1978)']
