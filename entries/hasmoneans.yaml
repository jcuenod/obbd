editorial:
  author_notes:
  - >-
    The name 'Hasmonean' comes from Josephus (an ancestor Asamonaios) and rabbinic sources,
    not from 1-2 Maccabees. Rulers: Jonathan (high priest 152), Simon (142-135), John Hyrcanus
    I (135-104), Aristobulus I (104-103, the first to take the royal title according to Josephus),
    Alexander Jannaeus (103-76), Salome Alexandra (76-67), then Hyrcanus II and Aristobulus
    II, Pompey's conquest (63), and Antigonus (40-37).
  - >-
    Opposition: a non-Zadokite family held the high priesthood together with civil and later
    royal power. The Qumran 'Wicked Priest' is often identified with Jonathan or Simon (debated);
    the Pharisees opposed Jannaeus; Pss. Sol. 17 condemns the Hasmoneans for seizing David's
    throne. Pesher Nahum's 'Lion of Wrath' who hanged men alive is usually taken as Jannaeus,
    who crucified 800 opponents (Josephus, Ant. 13.380; verify).
  - >-
    Expansion: Idumea and Iturea were annexed and their people circumcised, and Samaria and
    the Gerizim temple were destroyed. Debate the forced-conversion reading and the date of
    the destruction (archaeology suggests c. 111-110 BCE). This expansion is the background
    to a Jewish Galilee in the NT period.
  - >-
    1 Maccabees is dynastic history written in favour of the house of Simon. The Danielic
    'little help' (Dan 11:34) is read by many as reserve toward the militants, but this is
    contested.
  - >-
    Coins: Yehoḥanan the high priest and 'the council (ḥever) of the Jews'; Jannaeus's bilingual
    'Yehonatan the king / Basileōs Alexandrou'. Who first minted is debated (see coinage).
  sources_to_check:
