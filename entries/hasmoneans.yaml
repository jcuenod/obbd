scope: >-
  The priestly family of Mattathias, which led the Maccabean revolt and then ruled Judea as
  high priests (from Jonathan in 152 BCE) and later as kings until Pompey's intervention in
  63 BCE and the death of Antigonus in 37 BCE. The entry covers their rule, expansion, coinage
  and ideology, and the opposition they provoked. The revolt itself, to 160 BCE, is treated
  under maccabean-revolt.
