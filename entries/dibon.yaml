id: dibon
title: Dibon (Dhiban)
aliases: [Dhiban, Dibon-gad]
type: site
cultures: [moabite]
scope: >-
  The Moabite town at Dhiban north of the Arnon, Mesha's home and the findspot of the Mesha
  Stele. Covers the site's excavations and Iron Age remains and its place in biblical lists
  and oracles against Moab. A separate Dibon in Judah (Neh 11:25) is excluded.
