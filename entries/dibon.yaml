editorial:
  author_notes:
  - >-
    The Mesha Stele was found here in 1868. Its building section (Qarḥoh) probably describes
    Dibon's royal acropolis.
  - >-
    American excavations (1950-56; Winnett, Reed, Tushingham, Morton) and the Dhiban Excavation
    and Development Project (Porter, Routledge and others) found only limited Iron Age remains.
    Routledge's work on Moabite state formation uses the site.
  - Distinguish this Dibon from the Judahite Dibon (Neh 11:25).
  sources_to_check: ['Routledge, Moab in the Iron Age (2004)']
