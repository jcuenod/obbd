id: akitu-festival
title: Akītu (Babylonian New Year) Festival
aliases: [akītu, Babylonian New Year festival]
type: practice
cultures: [babylonian, assyrian, sumerian]
scope: >-
  The Mesopotamian akītu festival, best known from first-millennium Babylon's Nisannu celebrations:
  processions of divine statues, recitation of Enuma Elish, the king's ritual humiliation
  and reinvestiture, and the gods' journey to the akītu house. The entry also covers proposed
  links to biblical enthronement language.
