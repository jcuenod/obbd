editorial:
  author_notes:
  - >-
    Akītu festivals are attested from the third millennium in several cities and at different
    times of year (spring and autumn). The detailed Babylonian Nisannu ritual is known mainly
    from Seleucid-period tablets. Caution against reconstructing earlier practice wholesale
    from them.
  - >-
    The king's humiliation (the high priest strikes his cheek and removes his insignia before
    he is reinvested) and the recitation of Enuma Elish on day 4 are the most-cited elements.
    Note that the Nabonidus Chronicle records years when the festival was not held because
    the king was absent.
  - >-
    Mowinckel's proposed Israelite autumn enthronement festival, built on Ps 47 and 93-99
    by analogy with the akītu, is a classic but unproven hypothesis. There is no direct biblical
    evidence for such a festival, and the translation of YHWH mālāk ("YHWH reigns" or "has
    become king") is debated.
  - >-
    The "dying and rising Marduk" reading of the so-called Marduk Ordeal text, once tied to
    the akītu, is now rejected. That text is a cultic commentary, not evidence of a resurrection
    rite.
  sources_to_check:
