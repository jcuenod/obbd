editorial:
  author_notes:
  - Hebrew nōp and the Hosean variant mōp derive from Mn-nfr. Note the variation.
  - >-
    Esarhaddon captured Memphis in 671. The city was later a Persian administrative centre
    with Carian, Phoenician, and Judean residents.
  - Point to the Memphite Theology (Shabaka Stone) for Ptah theology.
