id: memphis
title: Memphis (Noph)
aliases: [Noph, Moph, Men-nefer, Mit Rahina]
type: site
cultures: [egyptian]
scope: >-
  Memphis (Egyptian Mn-nfr; Hebrew Nōp/Mōp), at the apex of the Delta near modern Mit Rahina.
  It was Egypt's principal administrative capital through much of its history and the cult
  centre of Ptah. The entry covers its prominence in prophetic oracles and its Judean diaspora
  community.
passages:
- ref: Isa 19:13
  rel: attests
  note: The princes of Memphis deluded
- ref: Jer 2:16
  rel: attests
  note: The people of Memphis and Tahpanhes have broken (or shaved) the crown of Judah's head
- ref: Jer 44:1
  rel: attests
  note: Judeans living in Memphis, Migdol, Tahpanhes, and Pathros
- ref: Jer 46:14, 19
  rel: attests
  note: Memphis to become a waste
- ref: Hos 9:6
  rel: attests
  note: Memphis (Mōp) will bury them
- ref: Ezek 30:13, 16
  rel: polemic
  note: Idols and images of Memphis destroyed
