editorial:
  author_notes:
  - >-
    Sources: Josephus (War 5.184-247; Ant. 15.380-425), m. Middot, and archaeology (retaining
    walls, Robinson's and Wilson's arches, southern steps and Huldah gates, Royal Stoa fragments).
    Almost nothing of the sanctuary itself survives.
  - >-
    Josephus gives conflicting start dates (Herod's 18th year, Ant. 15.380; 15th year, War
    1.401). Explain the arithmetic behind John 2:20.
  - >-
    Coins found under Robinson's Arch show that work on the platform continued well after
    Herod's death.
  - Keep a neutral tone on the modern politics of the Temple Mount/Haram al-Sharif.
  sources_to_check:
