title: Herod's Temple
type: site
cultures: [jewish, roman]
date:
  from: -20
  to: 70
  circa: true
  display: c. 20 BCE–70 CE
scope: >-
  The Jerusalem temple as rebuilt and its precinct massively enlarged by Herod from c. 20/19
  BCE until its destruction by Rome in 70 CE. The entry covers the platform, courts, porticoes,
  and sanctuary as known from Josephus, the Mishnah, and archaeology.
