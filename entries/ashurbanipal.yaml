editorial:
  author_notes:
  - >-
    The end of his reign is uncertain (631 or 627); explain why the last years are poorly
    documented.
  - >-
    The Osnappar identification is the consensus view but rests on the name's corruption and
    the deportation context.
  - >-
    Ashurbanipal claimed scribal learning; do not overstate his personal literacy, but his
    inscriptions are unusual in claiming it.
  - >-
    Manasseh's captivity in Chronicles has no Assyrian confirmation and is often seen as theologically
    motivated; present it as debated.
