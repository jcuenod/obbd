id: ashurbanipal
title: Ashurbanipal (Osnappar)
aliases: [Osnappar, Asnappar]
type: person
cultures: [assyrian]
date:
  from: -669
  to: -631
  circa: true
  display: c. 669–631 BCE
scope: >-
  The last great king of Assyria, son of Esarhaddon, who sacked Thebes, defeated his brother
  Shamash-shum-ukin of Babylon and destroyed Susa. He is usually identified with Osnappar
  of Ezra 4:10 and is known for his library and palace reliefs at Nineveh.
passages:
- ref: Ezra 4:9-10
  rel: attests
  note: '''The great and noble Osnappar'' deported peoples including Susians and Elamites'
- ref: Nah 3:8-10
  rel: event
  note: Sack of Thebes (663) as a warning to Nineveh
- ref: 2Kgs 21:1
  rel: attests
  note: Manasseh of Judah, listed among Ashurbanipal's western vassals (Prism C)
- ref: 2Chr 33:10-13
  rel: setting
  disputed: true
  note: Manasseh taken to Babylon; possibly linked to the Babylonian revolt (652-648)
related: [rassam-cylinder, library-of-ashurbanipal, lion-hunt-of-ashurbanipal, nineveh, thebes,
  susa, manasseh, esarhaddon]
