scope: >-
  Hezekiah son of Ahaz, king of Judah, considered in the light of extrabiblical evidence.
  This includes Sennacherib's account of the 701 campaign and Lachish reliefs, the Siloam
  tunnel and inscription, lmlk jars, the Ophel royal bulla, and the archaeology of his fortifications
  and reforms.
