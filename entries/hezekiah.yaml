editorial:
  author_notes:
  - >-
    Chronology: 2 Kgs 18:13 puts 701 in Hezekiah's 14th year (accession c. 715). The synchronism
    with Hoshea (2 Kgs 18:1, 9-10) implies c. 727. State the chronology adopted and the alternatives.
  - >-
    Sennacherib claims 46 cities taken, 200,150 people deported, and Hezekiah shut up 'like
    a bird in a cage'. He reports 30 talents of gold and 800 of silver, against 300 silver
    in Kings. Compare without harmonising.
  - >-
    The Broad Wall in the Jewish Quarter is often linked to Isa 22:10, and Jerusalem expanded
    westward in the late 8th century.
  - >-
    Evidence for a cult reform (Arad sanctuary, Beersheba altar, Lachish gate shrine) is debated.
    See cult-reforms-archaeology.
