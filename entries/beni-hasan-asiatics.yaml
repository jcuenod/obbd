  circa: true
  display: c. 1890 BCE
scope: >-
  A wall painting in the rock-cut tomb of the nomarch Khnumhotep II at Beni Hasan, dated to
  year 6 of Senusret II. It shows a group of 37 Asiatics (Aamu) led by Abisha, "ruler of a
  foreign land", bringing galena (eye paint). Men, women, children, and donkeys appear, with
  patterned garments, weapons, a lyre, and bellows.
