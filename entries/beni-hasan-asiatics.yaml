editorial:
  author_notes:
  - >-
    Abisha's title, ḥqꜣ ḫꜣswt ("ruler of foreign lands"), is the term from which "Hyksos"
    derives. This makes the scene important for Hyksos origins.
  - >-
    The scene records a trading or diplomatic delegation bringing galena, not a famine migration.
    Avoid presenting it as a picture of the patriarchs.
  - >-
    The garment comparison with Joseph's robe is popular but uncertain. Passîm may mean "long-sleeved"
    or "ankle-length" rather than "many-coloured". Mark it as illustrative only.
  - >-
    The bellows on a donkey has prompted proposals of itinerant metalworkers (cf. Kenites).
    Treat these as speculative.
  sources_to_check:
  - Newberry, Beni Hasan, Part I (1893)
  - >-
    Kamrin, 'The Aamu of Shu in the Tomb of Khnumhotep II at Beni Hassan', Journal of Ancient
    Egyptian Interconnections 1 (2009)
