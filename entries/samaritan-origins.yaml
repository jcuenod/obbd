editorial:
  author_notes:
  - >-
    Distinguish Samarians (inhabitants of the province of Samaria) from Samaritans (the Gerizim-centred
    religious community). 2 Kgs 17 is polemical. Assyrian deportations were partial, and much
    of the northern Yahwistic population remained.
  - >-
    Magen dates the first Gerizim sanctuary to the mid-5th century BCE. John Hyrcanus destroyed
    it around 111-110 BCE. Josephus's story of Sanballat and Manasseh in Alexander's time
    (Ant. 11.302-347) conflates traditions.
  - >-
    Yahwistic names in the Samaria papyri, the Elephantine letter to Delaiah and Shelemiah
    sons of Sanballat, the Gerizim inscriptions, and the Delos inscriptions ('Israelites who
    offer to holy Argarizein') show a shared Israelite identity.
  - >-
    Current scholarship (Knoppers, Pummer) replaces a single 'schism' with a gradual parting
    culminating in the 2nd century BCE.
  sources_to_check:
  - Knoppers, Jews and Samaritans (2013)
  - 'Pummer, The Samaritans: A Profile (2016)'
  - Magen, Misgav, and Tsfania, Mount Gerizim Excavations I (2004)
  - 'Gropp, Wadi Daliyeh II: The Samaria Papyri from Wadi Daliyeh (DJD 28, 2001)'
