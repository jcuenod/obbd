id: court-officials
title: Court Titles and Officials
aliases: [Royal officials, Court titles]
type: concept
cultures: [judahite, assyrian, babylonian, egyptian, persian]
scope: >-
  The titles and functions of royal officials in Israel and Judah (secretary, herald or recorder,
  'over the house', king's friend), and foreign court titles appearing in the Bible, many
  of them Akkadian, Egyptian or Persian loans. The entry covers epigraphic attestations on
  seals, bullae and inscriptions.
