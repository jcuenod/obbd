editorial:
  author_notes:
  - >-
    The Akkadian titles in 2 Kgs 18:17 are well established (H. Tadmor). Rab-shakeh is 'chief
    cupbearer', not a personal name.
  - >-
    The Nebo-Sarsekim tablet (British Museum, 595 BCE) names a Nabû-šarrussu-ukīn, rab ša
    rēši. Its identification with Jer 39:3 is debated because the Hebrew of that verse is
    difficult.
  - >-
    Epigraphy: the Silwan 'royal steward' tomb inscription ('…yahu who is over the house');
    seals and bullae with 'servant of the king' and 'who is over the house'.
  - >-
    T. N. D. Mettinger, Solomonic State Officials (1971), argued for Egyptian models. Present
    this as debated.
  image_query: Nebo-Sarsekim tablet
