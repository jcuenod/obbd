scope: >-
  The nine-tablet Akkadian anti-witchcraft ceremony ("Burning") performed by the exorcist
  (āšipu) over one night, in which figurines of the witch are burned and her spells returned
  upon her. It is the principal Mesopotamian source on how witchcraft (kišpū) was conceived
  and countered.
passages:
- ref: Exod 22:18
  rel: practice
  note: Prohibition of the female sorcerer (mĕkaššēpâ; cf. Akk. kaššāptu, 'witch') (MT 22:17)
- ref: Deut 18:10-11
  rel: practice
  note: Forbidden diviners and sorcerers, incl. the mĕkaššēp
- ref: Mic 5:12
