editorial:
  author_notes:
  - >-
    Abusch's edition (2016) and studies reconstruct the ceremony's growth from a shorter rite;
    it was performed at the end of the month Abu.
  - >-
    In Mesopotamia witchcraft (kišpū) was illicit harmful magic, while the āšipu's counter-magic
    was legitimate state-sanctioned expertise. Biblical law rejects a wider range of practices,
    so do not equate the categories.
  - >-
    The root kšp is shared by Hebrew and Akkadian; note the lexical link without assuming
    identical practices.
  sources_to_check:
