scope: >-
  An Egyptian instruction attributed to Ptahhotep, vizier of the Fifth Dynasty king Isesi,
  but composed in the Middle Kingdom. In 37 maxims a father passes on to his son rules for
  proper speech, conduct towards superiors, equals, and inferiors, and life in accordance
  with maat.
