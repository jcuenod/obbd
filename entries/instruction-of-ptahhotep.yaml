editorial:
  author_notes:
  - >-
    The attribution to an Old Kingdom vizier is a literary convention. The text is a Middle
    Kingdom composition, and its fullest copy is Papyrus Prisse (Bibliothèque nationale de
    France).
  - >-
    The comparison with Proverbs concerns genre and topoi (the father-son frame, speech ethics,
    deference to superiors), not demonstrated dependence. Contrast this with the special case
    of Amenemope.
  - >-
    Explain the place of maat as the ordering principle behind the maxims. This is useful
    background for the "deed-consequence" debate in Proverbs.
