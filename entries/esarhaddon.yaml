- ref: Ezra 4:2
  rel: attests
  note: Settlers in Samaria brought by Esarhaddon
- ref: 2Kgs 21:1-18
  rel: setting
  note: Manasseh's long reign as an Assyrian vassal
- ref: Deut 28:23
  rel: parallel
  note: Sky of bronze and earth of iron; close parallel in his succession treaty
- ref: 2Kgs 19:28
  rel: imagery
  note: Hook in the nose; cf. captives led by cords on his Zincirli stele
- ref: Isa 19:4
  rel: event
  disputed: true
  note: Egypt given to 'a hard master', sometimes linked to his conquest
