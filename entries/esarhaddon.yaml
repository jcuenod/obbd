type: person
cultures: [assyrian]
date:
  from: -681
  to: -669
  display: 681–669 BCE
scope: >-
  King of Assyria, younger son and chosen successor of Sennacherib, who won the throne after
  his father's murder, rebuilt Babylon, conquered Egypt (671), and imposed a succession oath
  on his vassals. Manasseh of Judah was among his vassals.
