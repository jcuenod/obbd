editorial:
  author_notes:
  - >-
    His reign is unusually well documented by letters, oracle queries, and prophecies (SAA
    4, 9, 10), useful for comparison with biblical prophecy and divination.
  - >-
    The succession treaty of 672 (found also at Tell Tayinat) is central to the debate on
    Deuteronomy's dependence on Assyrian treaty forms.
  - >-
    The settlement of foreigners in Samaria under Esarhaddon (Ezra 4:2) is otherwise unattested
    but plausible.
