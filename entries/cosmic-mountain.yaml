id: cosmic-mountain
title: Cosmic Mountain and Zaphon
aliases: [Zaphon, Mount Zaphon, mountain of God]
type: concept
cultures: [ugaritic, canaanite, mesopotamian]
scope: >-
  The mountain as divine dwelling and meeting place of heaven and earth, especially Baal's
  Mount Ṣapānu (Zaphon) and El's mountain at Ugarit, and the transfer of such imagery to Zion,
  Sinai, and the "mountain of God" in biblical texts.
passages:
- ref: Ps 48:1-2
  rel: language
  note: Mount Zion 'in the far north' (yarkĕtê ṣāpôn); MT 48:2-3
- ref: Isa 14:13
  rel: parallel
  note: '''Mount of assembly on the heights of Zaphon'''
- ref: Ezek 28:14, 16
  rel: concept
  note: King of Tyre on 'the holy mountain of God'
- ref: Isa 2:2-4
  rel: concept
  note: Mountain of the LORD's house raised highest of the mountains; cf. Mic 4:1-3
- ref: Ps 68:15-16
  rel: imagery
  note: Mountain of Bashan envies the mountain God chose; MT 68:16-17
- ref: Exod 15:17
  rel: concept
  note: '''Mountain of your own possession'' as divine sanctuary'
- ref: Exod 24:9-18
  rel: concept
  note: Sinai as place of theophany and divine presence
- ref: Ps 2:6
  rel: concept
  note: King installed on Zion, the holy hill
- ref: Job 26:7
  rel: language
  note: God 'stretches out Zaphon over the void'
- ref: Ezek 40:2
  rel: concept
