editorial:
  author_notes:
  - >-
    Ṣapānu is a real mountain (Jebel al-Aqraʿ, classical Mons Casius) north of Ugarit, and
    also the Hebrew word for "north". Ps 48:2 transfers Baal's mountain to Zion.
  - >-
    El's abode at "the source of the rivers, the midst of the springs of the two deeps" and
    Baal's Zaphon should be distinguished. Note that El's "mount of assembly" informs Isa
    14:13.
  - >-
    Clifford, The Cosmic Mountain in Canaan and the Old Testament (1972), remains the standard
    comparative study. Caution against importing Eliade's universal "axis mundi" uncritically.
  - >-
    The mountain symbolism of Mesopotamian ziggurats is often asserted but not explicit in
    the native sources. Keep the discussion of ziggurats brief and qualified.
  image_query: Jebel Aqra
