editorial:
  author_notes:
  - >-
    Hebrew yĕʾōr derives from Egyptian itrw ("river"). Šîḥôr (Isa 23:3; Jer 2:18) denotes
    a Nile branch or waterway in the eastern Delta.
  - >-
    The inundation was deified as Hapi. Nile failure meant famine, which provides the background
    for Genesis 41 and the Famine Stele.
  - >-
    The "Brook of Egypt" (naḥal miṣrayim, Num 34:5) is generally identified with the Wadi
    el-ʿArish, not the Nile. This is a common confusion.
