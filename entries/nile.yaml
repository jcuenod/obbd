id: nile
title: The Nile and the Inundation
aliases: [Yeor, Inundation]
type: site
cultures: [egyptian]
scope: >-
  The Nile river and its annual inundation, the basis of Egyptian agriculture, economy, and
  cosmology. The entry covers the Nile in the Joseph and exodus narratives, in prophetic oracles
  against Egypt, and as a contrast with rain-dependent Canaan.
