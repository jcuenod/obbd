id: lachish
title: Lachish
aliases: [Tel Lachish, Tell ed-Duweir, Lakisu]
type: site
cultures: [judahite, canaanite]
scope: >-
  The leading Judahite city of the Shephelah after Jerusalem and a Late Bronze Canaanite city-state.
  Covers its Canaanite temples, the Iron Age palace-fort, the 701 BCE Assyrian siege and its
  depiction at Nineveh, the gate shrine, and the final destruction of 588/586 BCE.
