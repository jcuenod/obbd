editorial:
  author_notes:
  - >-
    Ussishkin's excavations settled the old debate by dating Level III's destruction to 701
    (Sennacherib), not 597. This date anchors the Judahite pottery sequence and the lmlk jars.
  - >-
    The Assyrian siege ramp and the Judahite counter-ramp are the only excavated Assyrian
    siege works. Compare them directly with the Nineveh reliefs.
  - >-
    The Level III gate shrine, with a defaced horned altar and a toilet installation, has
    been read as material evidence of Hezekiah's reform (2 Kgs 18:4). This reading is debated.
  - >-
    The Late Bronze Fosse Temple and the Level VI Canaanite city (destroyed c. 1150) belong
    in the Canaanite background. Level II ends in the Babylonian destruction, the context
    of the Lachish letters.
  sources_to_check:
  - NEAEHL
  - Ussishkin, The Renewed Archaeological Excavations at Lachish (1973-1994) (2004)
