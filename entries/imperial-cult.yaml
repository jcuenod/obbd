id: imperial-cult
title: Roman Imperial Cult
type: practice
cultures: [roman, greek]
scope: >-
  Worship and honours for Roman emperors, living and deified, and for Roma, organized at provincial,
  civic, and private levels, especially in the Greek East. The entry covers its institutions
  and monuments and its bearing on Revelation, Acts, and Paul.
passages:
- ref: Rev 13:4-18
  rel: polemic
  note: Worship of the beast and its image; the mark required for commerce
- ref: Rev 14:9-11
  rel: polemic
  note: Warning against worshipping the beast and its image
- ref: Rev 2:13
  rel: setting
  note: Pergamum, 'where Satan's throne is'
- ref: Acts 12:21-23
  rel: event
  note: Agrippa I hailed as a god and struck down (cf. Ant. 19.343-350)
- ref: Acts 17:7
  rel: concept
  note: Acting against Caesar's decrees by proclaiming another king
- ref: Mark 12:13-17
  rel: practice
  note: Coin bearing Caesar's image and inscription
- ref: Phil 2:9-11
  rel: concept
  disputed: true
  note: Universal acclamation of Jesus as Lord, with possible counter-imperial resonance
- ref: 1Pet 2:13-17
  rel: concept
  note: Honour the emperor, but fear God
- ref: 1Tim 2:1-2
  rel: practice
  note: >-
    Prayers for rulers illustrate a form of public religious concern distinct from worship of the
    ruler.
