editorial:
  author_notes:
  - >-
    Distinguish provincial cults (Pergamon 29 BCE; Smyrna under Tiberius; Ephesus Flavian
    temple of the Sebastoi), civic cults, and private devotion, and divus for deceased emperors
    versus honours for living ones.
  - >-
    Jews were exempt from emperor worship. Sacrifices for (not to) the emperor were offered
    in the Jerusalem temple until 66 (War 2.197, 409).
  - >-
    Systematic persecution under Domitian is now largely doubted. Revelation's critique works
    within everyday participation in imperial cult (Friesen).
  sources_to_check:
  - 'S. R. F. Price, Rituals and Power: The Roman Imperial Cult in Asia Minor (1984)'
  - S. J. Friesen, Imperial Cults and the Apocalypse of John (2001)
