id: arch-of-titus
title: Arch of Titus
type: artifact
cultures: [roman]
date:
  from: 81
  to: 82
  circa: true
  display: c. 81–82 CE
scope: >-
  Single-bay honorific arch on the Via Sacra in Rome, dedicated after Titus's death (81 CE)
  to the deified emperor. Its relief panels show the triumph of 71 CE over Judea, including
  the temple menorah, the table of showbread, and trumpets carried as spoils.
