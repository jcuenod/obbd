editorial:
  author_notes:
  - >-
    Compare Josephus's description of the triumph and spoils (War 7.123-162) and their later
    display in the Temple of Peace.
  - >-
    Debate on how accurately the menorah is depicted (e.g. the decorated octagonal base).
    Note the polychromy research of 2012.
  - >-
    A second, lost arch at the Circus Maximus had an inscription (CIL VI 944) claiming that
    Titus subdued the Jews and destroyed Jerusalem.
