id: prophecy-of-neferti
title: Prophecy of Neferti
aliases: [Prophecy of Neferti, Prophecy of Nefer-rohu]
type: text
cultures: [egyptian]
date:
  from: -1940
  to: -1900
  circa: true
  display: c. 1940–1900 BCE
scope: >-
  A Twelfth Dynasty literary text set at the court of the Fourth Dynasty king Sneferu. The
  sage Neferti foretells chaos in Egypt (the Nile dried up, Asiatics in the Delta, social
  and family breakdown) and then the coming of a saviour king, "Ameny", who will restore order.
  It is political literature legitimating Amenemhat I.
passages:
- ref: Dan 11:2-45
  rel: form
  note: History presented as prediction from a fictive earlier vantage point (ex eventu)
- ref: 1Kgs 13:2
  rel: form
  note: Prophecy naming a future king generations in advance
- ref: Isa 11:1-9
  rel: parallel
  note: Expected just king who restores order after calamity (typological)
- ref: Isa 19:5-8
  rel: imagery
  note: Nile dried up, fishermen and the economy ruined
- ref: Mic 7:6
  rel: parallel
  note: Family turned against itself as a sign of social collapse
