editorial:
  author_notes:
  - >-
    Neferti is not prophecy in the Israelite sense. It is royal propaganda using vaticinium
    ex eventu, which is useful for discussing ex eventu prediction in Daniel and in the Akkadian
    "prophecies" (Uruk, Marduk, Shulgi texts).
  - >-
    The chaos description shares topoi with Ipuwer (the land overturned) and is not historical
    evidence for First Intermediate Period disorder.
  - >-
    The text mentions the "Walls of the Ruler", a fortification line against Asiatics on the
    eastern Delta frontier. Some link Hebrew Shur ("wall"; Gen 16:7; Exod 15:22) to such frontier
    works. Treat this as a hypothesis.
  - >-
    The main manuscript is P. Hermitage 1116B (Eighteenth Dynasty), with many ostraca and
    tablets.
  sources_to_check: ['AEL 1:139-145', ANET 444-446]
