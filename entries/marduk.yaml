editorial:
  author_notes:
  - >-
    Explain Marduk's rise (often linked to the Nebuchadnezzar I period) and his supremacy
    in Enuma Elish; the date of Enuma Elish is debated.
  - >-
    Deutero-Isaiah's idol polemic and procession imagery (Isa 46) are best read against Akitu
    processions and the Cyrus Cylinder's claim that Marduk chose Cyrus.
  - >-
    The derivation of Mordecai from Marduk is consensus; Esther from Ishtar is debated and
    should not be stated as fact.
  sources_to_check:
