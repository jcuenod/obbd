editorial:
  author_notes:
  - >-
    The location is unknown. Candidates include southwestern Arabia, the Horn of Africa (linked
    with Egyptian Punt) and India (LXX Sōphira; Josephus). No archaeological identification
    exists.
  - >-
    The Tell Qasile ostracon ('gold of Ophir to Beth-horon, 30 shekels'; eighth century) shows
    that 'Ophir gold' was a recognized grade or origin of gold.
  - >-
    Nineteenth-century identifications of Ophir with Great Zimbabwe, and later ones with the
    Americas, are colonial-era or fringe curiosities. Mention them only as misconceptions.
  image_query: Tell Qasile ostracon gold of Ophir
