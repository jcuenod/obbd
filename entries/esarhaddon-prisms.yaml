editorial:
  author_notes:
  - >-
    Esarhaddon's account of his accession describes his brothers' rebellion and his own march
    on Nineveh but avoids explicitly describing his father's murder; the Babylonian Chronicle
    reports the killing by 'his son'.
  - >-
    Parpola's identification of Adrammelech with Urad-Mullissu (Arda-Mulišši), a son of Sennacherib,
    is widely accepted; Sharezer is harder to identify.
  - >-
    Manasseh's appearance in the list supports the picture of Judah as a loyal vassal in the
    7th century; the Chronicler's captivity story (2 Chr 33:11) has no Assyrian confirmation.
  - Prisms exist in many duplicates; cite by RINAP number rather than museum object.
  sources_to_check:
