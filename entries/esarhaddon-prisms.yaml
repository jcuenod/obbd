id: esarhaddon-prisms
title: Prisms of Esarhaddon
type: artifact
cultures: [assyrian]
date:
  from: -676
  to: -672
  circa: true
  display: c. 676–672 BCE
scope: >-
  The clay prism inscriptions of Esarhaddon, especially the Nineveh A and B prisms. They narrate
  his contested accession after his father Sennacherib's death and list 22 western vassal
  kings, including 'Manasseh king of Judah', who supplied building materials for Esarhaddon's
  arsenal palace at Nineveh.
