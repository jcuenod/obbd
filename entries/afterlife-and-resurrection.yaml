id: afterlife-and-resurrection
title: Afterlife and Resurrection Beliefs
aliases: [Resurrection of the dead, Immortality]
type: concept
cultures: [ane, persian, egyptian, jewish]
scope: >-
  The development from the Hebrew Bible's dominant Sheol view toward hopes of rescue from
  death, bodily resurrection and judgment of the dead in late biblical and Second Temple texts.
  The entry covers Egyptian, Persian, Canaanite and Greek comparanda and the debates about
  influence.
