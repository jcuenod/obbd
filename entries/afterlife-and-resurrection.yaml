editorial:
  author_notes:
  - >-
    Consensus: Dan 12:2-3 (c. 165 BCE) is the clearest Hebrew Bible text on individual resurrection.
    The date and meaning of Isa 26:19 (Isaiah 24–27) are debated.
  - >-
    Zoroastrian influence is often proposed, but the late date of most Zoroastrian sources
    makes direction and timing contested. Present it as possible, not proven.
  - >-
    The 'dying and rising god' category (Frazer) has been heavily criticized (J. Z. Smith),
    though Mettinger (The Riddle of Resurrection, 2001) defends a revised version. Apply this
    to Hos 6:1-2 with care.
  - >-
    Egyptian judgment of the dead and the Greek immortal soul are distinct models. Note how
    Second Temple texts combine them in different ways (Wisdom of Solomon vs 2 Maccabees).
  image_query: Book of the Dead weighing of the heart
