scope: >-
  The wisdom book of Jesus (Yeshua) son of Eleazar son of Sira, written in Hebrew in Jerusalem
  in the early second century BCE and translated into Greek in Egypt by his grandson after
  132 BCE. The entry covers its Hebrew manuscripts (Cairo Genizah, Masada, Qumran), its place
  among Proverbs and other ancient Near Eastern wisdom, its theology of Wisdom and Torah,
  and its canonical status. The date is that of composition.
