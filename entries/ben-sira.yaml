editorial:
  author_notes:
  - >-
    Hebrew text: six Genizah manuscripts (A-F, identified from 1896 onward), the Masada scroll
    (Sir 39:27-44:17, first century BCE), and Qumran fragments (2Q18 from Sir 6; 11QPs-a with
    Sir 51:13-20, 30b). About two thirds of the book survives in Hebrew. There are two Greek
    forms (GI and the expanded GII) and a Syriac version. Greek manuscripts transpose 30:25-33:13a
    and 33:13b-36:16a; English versions follow the Hebrew order, so check the numbering.
  - >-
    Date: the grandson's prologue puts his arrival in Egypt in the 38th year of Euergetes
    (Ptolemy VIII), 132 BCE. The eulogy of Simon II and the absence of any reference to Antiochus
    IV's persecution place composition c. 190-175 BCE.
  - >-
    Theology: Wisdom identified with Torah (24:23); retribution in this life without a blessed
    afterlife (17:27-28; 41:4); the scribe as ideal (38:34-39:11); devotion to temple and
    priesthood (Aaron, Phinehas, Simon). Sir 25:24 ('from a woman sin had its beginning')
    is usually read of Eve, though some argue otherwise. Present it, and Ben Sira's views
    on women, in context.
  - >-
    Canon: cited in rabbinic literature though not canonized; deuterocanonical in Catholic
    and Orthodox Bibles and among the Apocrypha for Protestants. The Latin title Ecclesiasticus
    means 'church book'.
  sources_to_check:
