editorial:
  author_notes:
  - >-
    The meaning of ʾôb is debated. Hoffner (JBL 1967) compared Hittite a-a-bi and Akkadian
    apu, meaning a ritual pit used to call up the dead. Others derive it from ʾāb ("father,
    ancestor") or take it as the ghost itself. yiddĕʿōnî is usually "knowing one". Present
    the options.
  - >-
    Mesopotamian necromancy is attested but rare (Finkel, AfO 29/30). Ghosts (eṭemmu) were
    more often objects of exorcism and care than sources of oracles. Odyssey 11 is the classic
    Greek comparandum.
  - >-
    Connect necromancy with care for the dead and ancestor cult. The extent of a Judahite
    cult of the dead is debated (Schmidt, Israel's Beneficent Dead, 1994, is sceptical).
  - >-
    1 Sam 28 is a narrative, not a technical description. Avoid reconstructing ritual procedure
    from it.
  sources_to_check:
  - Brian B. Schmidt, Israel's Beneficent Dead (FAT 11, 1994)
  - Josef Tropper, Nekromantie (AOAT 223, 1989)
