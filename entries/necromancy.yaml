id: necromancy
title: Necromancy and Consulting the Dead
aliases: [consulting the dead, ʾôb and yiddĕʿōnî]
type: practice
cultures: [babylonian, hittite, hebrew, greek]
scope: >-
  Consulting the spirits of the dead for knowledge. The entry covers the biblical terminology
  (ʾôb, yiddĕʿōnî, dōrēš ʾel-hammētîm), the medium at Endor, prophetic and legal condemnation,
  and Mesopotamian, Hittite, and Greek comparanda.
