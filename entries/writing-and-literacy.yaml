editorial:
  author_notes:
  - >-
    In Lachish letter 3, the officer Hoshayahu protests that no one has ever had to read a
    letter to him. The letter is central to debates over non-elite literacy.
  - >-
    Positions: Rollston (literacy largely confined to trained scribes and elites) versus Millard
    and others (wider functional literacy). A 2016 computational handwriting study of the
    Arad ostraca (Faigenbaum-Golovin et al., PNAS) argued for many writers c. 600 BCE, and
    its method has been debated.
  - >-
    Schniedewind (How the Bible Became a Book, 2004) argues for a sharp rise in writing in
    the 8th and 7th centuries. The epigraphic record supports a late-Iron-Age peak.
  - >-
    The 10th-century Khirbet Qeiyafa ostracon is disputed in both language and script and
    should not be overused.
