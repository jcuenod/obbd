id: writing-and-literacy
title: Writing and Literacy in Ancient Israel
aliases: [Literacy in ancient Israel]
type: concept
cultures: [judahite, israelite, hebrew]
scope: >-
  The extent and nature of literacy in ancient Israel and Judah, assessed from biblical references
  to writing and reading and from inscriptions, ostraca and abecedaries. The entry covers
  the debate between minimalist and maximalist estimates and the distinction between scribal
  and functional literacy.
