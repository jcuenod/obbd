id: persepolis-fortification-tablets
title: Persepolis Fortification and Treasury Tablets
type: text
cultures: [persian, elamite]
date:
  from: -509
  to: -458
  circa: true
  display: c. 509–458 BCE
scope: >-
  The administrative archives excavated at Persepolis in 1933-34: thousands of Fortification
  tablets (509-493 BCE, mostly Elamite, some Aramaic) recording rations, travel provisions,
  and estate management, and the Treasury tablets (492-458 BCE). They are the primary documentary
  evidence for how the Achaemenid heartland was run.
passages:
- ref: Neh 2:7-9
  rel: practice
  note: >-
    Royal letters for safe passage; cf. sealed travel authorizations for rations on royal
    roads
- ref: Esth 3:13-15; 8:10, 14
  rel: practice
  note: Royal couriers on swift horses; cf. provisions for express messengers
- ref: Neh 2:8
  rel: language
  note: '''Keeper of the king''s park (pardēs)'', a Persian loanword attested in the tablets'
- ref: Eccl 2:5
  rel: language
  note: pardēs 'park', Old Iranian loanword
- ref: Ezra 6:9-10
  rel: practice
  note: Royal provision for sacrifices; tablets record rations for offerings to various gods
- ref: Neh 5:14-18
  rel: practice
  note: The governor's food allowance and table within the ration system
- ref: Ezra 4:7
  rel: language
  note: Aramaic as a language of imperial administration alongside Elamite
