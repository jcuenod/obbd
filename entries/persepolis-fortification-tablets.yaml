editorial:
  author_notes:
  - >-
    Explain the archive's discovery by the Oriental Institute (Chicago), the Persepolis Fortification
    Archive Project, and the legal dispute and phased return of tablets to Iran.
  - >-
    Henkelman's work shows state-funded offerings to Elamite, Iranian, and Babylonian gods.
    This is useful context for Persian support of local cults, but avoid making it a model
    of 'tolerance'.
  - >-
    Several officials named Marduka appear. The name is common, so do not use these texts
    to identify Mordecai.
  - >-
    The royal courier system also lies behind Greek angareuō 'to compel (service)' (Matt 5:41;
    27:32), a possible cross-reference.
  sources_to_check:
