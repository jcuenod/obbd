title: Jerusalem
aliases: [Urusalim, Salem, Zion, Aelia Capitolina]
type: site
cultures: [judahite, canaanite, jewish]
scope: >-
  The city of Jerusalem from its Bronze Age beginnings to the Roman period, treated as an
  archaeological site and as the political and cultic centre of Judah. Detailed treatment
  of the southeastern ridge, the temple platform and the water systems is left to the entries
  on the City of David, the Temple Mount and Hezekiah's Tunnel.
