editorial:
  author_notes:
  - >-
    The Amarna letters of Abdi-Heba of Urusalim (EA 285-290; verify range) show a Late Bronze
    city-state, though architecture of that period is scarce on the ground. The Execration
    Texts may name the city earlier (reading debated).
  - >-
    The size and status of tenth-century Jerusalem is one of the sharpest debates in the field
    (E. Mazar and others vs. Finkelstein and the low chronology). Present the evidence and
    both readings; do not treat either as settled.
  - >-
    The late eighth-century expansion onto the Western Hill (Avigad's Broad Wall) is widely
    linked to population influx after 722 and to Hezekiah's preparations. Population estimates
    vary widely.
  - >-
    Keep this entry a synthesis; detailed stratigraphy belongs in city-of-david, temple-mount
    and herods-temple. Note the political sensitivity of excavation in East Jerusalem neutrally.
  sources_to_check: [NEAEHL, 'Moran, The Amarna Letters (1992)']
