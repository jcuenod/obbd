editorial:
  author_notes:
  - >-
    The Assyrian siege ramp at Lachish (excavated by D. Ussishkin) is the best-preserved Assyrian
    siege ramp. Correlate it with the reliefs from Sennacherib's palace at Nineveh.
  - >-
    Sennacherib says he shut Hezekiah up 'like a bird in a cage'. He claims a blockade, not
    a capture.
  - >-
    Deut 20:19-20 should be read against Assyrian tree-felling as a deliberate tactic (J.
    L. Wright, JBL 127, 2008).
  - >-
    For the Rabshakeh's speech, compare Neo-Assyrian letters reporting negotiations at city
    walls (e.g. the Nimrud letter on Babylon). Check the literature (C. Cohen; P. Machinist)
    before citing.
