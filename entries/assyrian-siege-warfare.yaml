title: Siege Warfare (Assyrian and Babylonian)
aliases: [Siege warfare]
type: practice
cultures: [assyrian, babylonian]
scope: >-
  The techniques and rhetoric of Neo-Assyrian and Neo-Babylonian siege warfare (ramps, battering
  rams, sapping, blockade, psychological warfare) as shown in palace reliefs, inscriptions
  and the Lachish excavations. The entry covers biblical accounts and prophetic depictions
  of siege.
