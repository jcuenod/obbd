id: pliny-trajan-correspondence
title: Pliny and Trajan on Christians
type: text
cultures: [roman, christian]
date:
  from: 112
  to: 112
  circa: true
  display: c. 112 CE
scope: >-
  The correspondence of Pliny the Younger, governor of Bithynia-Pontus, with the emperor Trajan
  around 112 CE about the investigation of Christians, their reported worship and meals, punishment,
  and the emperor's instructions for handling accusations. It postdates Paul and much of the
  New Testament.
passages:
- ref: 1Pet 4:12-16
  rel: practice
  note: >-
    Later comparison for prosecution under the Christian name; not evidence for this letter's
    circumstances
- ref: Rev 13:14-17
  rel: practice
  note: >-
    Later loyalty tests with imperial images do not establish Revelation's date or a universal
    enforcement system
- ref: Acts 25:10-12
  rel: practice
  note: >-
    Pliny's referral of citizens to Rome supplies a later comparison for provincial jurisdiction
- ref: 1Cor 11:17-34
  rel: practice
  note: Later testimony to regular Christian meals does not establish their precise ritual
    form
related:
- imperial-cult
