editorial:
  author_notes:
  - Date it explicitly after Paul and much of the New Testament.
  - >-
    Do not use it to prove a universal first-century persecution policy, identify the setting
    of 1 Peter or Revelation, or resolve the exact nature of the reported Christian meals.
  - Coordinate with the citizenship and associations entries.
  sources_to_check:
