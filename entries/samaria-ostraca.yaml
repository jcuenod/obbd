- ref: Num 26:30-33
  rel: attests
  note: Clans of Manasseh (Abiezer, Helek, Asriel, Shechem, Shemida) and Noah, Hoglah
- ref: Josh 17:2-3
  rel: attests
  note: The same Manassite clan and district names
- ref: Hos 2:16-17
  rel: language
  note: >-
    Baal-names among the recipients; Hosea's polemic against calling YHWH 'my Baal' (MT 2:18-19)
- ref: 1Sam 8:14-15
  rel: practice
