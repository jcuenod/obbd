id: samaria-ostraca
title: Samaria Ostraca
type: artifact
cultures: [israelite]
date:
  from: -800
  to: -750
  circa: true
  display: c. 800–750 BCE
scope: >-
  About a hundred ink-inscribed potsherds found in 1910 in the royal compound of Samaria,
  dated to years 9, 10 and 15 of an unnamed king. They record shipments of wine and oil from
  clan districts of Manasseh to named individuals, and are the main epigraphic source for
  the administration of the northern kingdom.
