  note: Royal grants and produce from estates for courtiers
- ref: Amos 6:4-6
  rel: setting
  note: Samarian elite consumption of wine and fine oil
- ref: 2Kgs 14:23-29
  rel: setting
  note: Probably the reign of Jeroboam II
