editorial:
  author_notes:
  - >-
    The regnal years are usually assigned to Jeroboam II (some to Joash, Jehoahaz or Menahem).
    Year 15 may belong to a different king from years 9-10.
  - >-
    The function is debated: tax receipts, deliveries from crown estates to officials, or
    records of produce owed to absentee landowners at court. Present the options.
  - >-
    The clan names match the genealogies of Manasseh, which shows that these lists preserve
    real territorial units in the Samaria hills.
  - >-
    Personal names show northern -yw (-yaw) Yahwistic forms alongside a notable number of
    Baal names. Use cautiously as evidence for religious practice.
