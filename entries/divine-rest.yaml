editorial:
  author_notes:
  - >-
    In Enuma Elish the younger gods' noise prevents Apsu's rest (Tablet I), and after Marduk's
    victory the gods build Esagil as a resting place (Tablet VI). In Atrahasis human noise
    disturbs Enlil's sleep. These show a pattern of combat, temple building, and divine rest.
  - >-
    Distinguish the vocabulary. šbt means "cease, stop", nwḥ means "rest, settle", and npš
    (niphal) means "be refreshed". Gen 2:2-3 uses the verb šābat, not the noun šabbāt.
  - >-
    Walton's reading of Gen 1 as cosmic temple inauguration is influential but contested.
    Present it as one proposal.
  - >-
    The sleeping-god motif (Batto, "The Sleeping God", Biblica 1987, to verify) appears positively
    (rest as sovereignty) and in lament and polemic (1 Kgs 18:27; Ps 121:4).
