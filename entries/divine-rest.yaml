id: divine-rest
title: Divine Rest in Temple and Creation
type: concept
cultures: [ane, babylonian, hebrew]
scope: >-
  The motif of a deity's rest after victory or creation, typically in a newly built temple,
  and its biblical expressions in God's seventh-day cessation, the ark's "resting place",
  and the temple as YHWH's dwelling. Also covers the contrasting motif of disturbed or sleeping
  gods.
passages:
- ref: Gen 2:2-3
  rel: concept
  note: God ceases (šābat) from work on the seventh day and hallows it
- ref: Exod 20:11
  rel: concept
  note: YHWH 'rested' (wayyānaḥ) on the seventh day
- ref: Exod 31:17
  rel: concept
  note: God 'ceased and was refreshed' (šābat wayyinnāpaš)
- ref: Ps 132:8, 13-14
  rel: concept
  note: Ark brought to its resting place (mĕnûḥâ); Zion as YHWH's rest forever
- ref: 1Chr 28:2
  rel: concept
  note: Temple as 'a house of rest for the ark' and God's footstool
- ref: Isa 66:1
  rel: concept
  note: '''What is the house... and what is my resting place?'''
- ref: 1Kgs 5:4
  rel: concept
  note: Rest from enemies as precondition for temple building; MT 5:18
- ref: 2Sam 7:1-2, 11
  rel: concept
  note: Rest from enemies and the proposal to build a temple
- ref: Ps 44:23
