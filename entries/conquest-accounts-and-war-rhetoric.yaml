editorial:
  author_notes:
  - >-
    K. L. Younger, Ancient Conquest Accounts (JSOTSup 98, 1990), shows that Joshua's syntagms
    and hyperbole match Assyrian, Hittite and Egyptian reports. Examples: Merneptah's 'Israel
    is laid waste, his seed is not' and Mesha's 'Israel has utterly perished forever'.
  - >-
    The rhetorical comparison does not by itself settle historical or ethical questions. Do
    not use it to dismiss the texts' violence or to defend their historicity.
  - >-
    Archaeological consensus (Jericho, Ai) does not support a large-scale 13th-century military
    conquest. Refer to the emergence-of-israel entry and do not argue the case here.
  image_query: Merneptah Stele
