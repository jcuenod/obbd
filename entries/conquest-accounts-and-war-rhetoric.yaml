title: Conquest Accounts and ANE War Rhetoric
aliases: [Conquest accounts]
type: concept
cultures: [assyrian, egyptian, moabite, hittite]
scope: >-
  The conventions of ancient Near Eastern military reports (stereotyped formulae, hyperbole,
  totalizing claims, divine intervention) and their bearing on the conquest narratives of
  Joshua and related texts. The historical and archaeological question of Israel's origins
  is covered in a separate entry.
