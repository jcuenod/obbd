scope: >-
  The oldest known law collection, in Sumerian, attributed to Ur-Nammu or his son Shulgi of
  the Third Dynasty of Ur. A prologue on royal justice for the weak is followed by casuistic
  laws that, notably, use monetary compensation for bodily injury.
