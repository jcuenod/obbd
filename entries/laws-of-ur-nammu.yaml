- ref: Exod 21:18-25
  rel: parallel
  note: 'Bodily injury: LU sets fixed silver payments where Exodus has compensation and talion'
- ref: Num 5:11-31
  rel: practice
  note: River ordeal for a wife accused of adultery (LU §14)
- ref: Deut 22:25-27
  rel: parallel
  note: Rape of a betrothed young woman is a capital offence (LU §6)
- ref: Deut 25:13-16
  rel: concept
  note: Royal standardisation of weights and measures (prologue)
