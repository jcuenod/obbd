editorial:
  author_notes:
  - >-
    Attribution to Ur-Nammu (2112-2095) or Shulgi is debated; manuscripts come from Nippur,
    Ur, and Sippar, with a fuller unprovenanced manuscript published by Civil (2011).
  - >-
    Monetary compensation for injury in the earliest law and talion in later Babylonian and
    biblical law reverse the old evolutionary assumption that talion is 'primitive' (Finkelstein;
    discuss rather than adjudicate).
