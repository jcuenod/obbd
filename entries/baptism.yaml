editorial:
  author_notes:
  - >-
    Greek baptō/baptizō means 'dip, immerse'. Note its LXX and Jewish uses (2 Kgs 5:14; Jdt
    12:7; Sir 34:25 [31:30], numbering to verify) and the NT washings in Mark 7:4 and Luke
    11:38. Whether early Christian baptism was always full immersion is debated: Didache 7
    allows pouring when running or cold water is lacking.
  - >-
    Contrast John's rite with Jewish purification. Jewish immersions were repeated and self-administered.
    John's was apparently once only, administered by him ('baptized by him'), and tied to
    repentance and coming judgment. Josephus (Ant. 18.116-119) says John's baptism did not
    remit sins but consecrated the body once the soul was purified by righteousness. Present
    this tension with Mark 1:4 neutrally.
  - >-
    Qumran: 1QS 3:4-9 and 5:13-14 link washing to repentance and the holy spirit, and ritual
    baths are found at the site. The view that John had Essene connections is possible but
    unproven. Do not present it as established.
  - >-
    Proselyte immersion is clearly attested only in rabbinic sources (e.g. m. Pesaḥ. 8:8;
    b. Yebam. 46a-47b), with a possible earlier allusion in Epictetus (Arrian, Diss. 2.9.20).
    Whether it existed before 70 CE is debated, so it should not be presented as the source
    of John's baptism.
  - >-
    The older history-of-religions derivation of Pauline baptism (Rom 6) from mystery-cult
    initiation (e.g. Isis in Apuleius, Met. 11) is now widely rejected or heavily qualified.
    Mention Matt 28:19's triadic formula beside the 'name of Jesus' formula in Acts, and give
    the household baptisms (Acts 16:15, 33) only as the point where the infant-baptism debate
    begins.
