id: baptism
title: Baptism
aliases: [Immersion, John's baptism, Proselyte baptism]
type: practice
cultures: [jewish, christian]
scope: >-
  Ritual immersion in water as practised by John the Baptist and the early Christian movement,
  set against its background in biblical purification law and Second Temple Jewish washing
  rites (miqvaʾot, Qumran, proselyte immersion). The entry covers the New Testament period;
  later liturgical development and the infant-baptism debate are mentioned only briefly.
