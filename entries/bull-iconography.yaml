id: bull-iconography
title: Bull Iconography and the Golden Calves
aliases: [Golden calf, Calves of Jeroboam]
type: concept
cultures: [canaanite, israelite]
scope: >-
  Bull and calf imagery associated with El, Baal/Hadad and YHWH, and the biblical golden calves
  at Sinai, Bethel and Dan. The entry covers the iconographic background, the archaeological
  finds, and the debate over whether the calves were images of the deity or pedestals for
  an invisible god.
