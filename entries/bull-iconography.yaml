editorial:
  author_notes:
  - >-
    El bears the Ugaritic epithet ṯr ʾil 'Bull El', and storm gods (Hadad/Baal) are shown
    standing on bulls. Present both possibilities: the calves as YHWH images, or as pedestals
    for an invisible deity (Albright and others).
  - >-
    Most critical scholars read Exod 32 as Deuteronomistic polemic shaped by Jeroboam's cult
    (compare 'These are your gods' with 1 Kgs 12:28).
  - >-
    Material comparanda include the Middle Bronze Age silver-plated calf from Ashkelon and
    the Iron I 'Bull Site' bronze from the Samaria hills.
  - >-
    Avoid the claim that Israel worshipped an Egyptian Apis bull here. That is a minority
    older view.
  image_query: Ashkelon silver calf
