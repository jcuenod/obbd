id: mighty-hand-outstretched-arm
title: '"Mighty Hand and Outstretched Arm"'
type: concept
cultures: [egyptian, hebrew]
scope: >-
  The biblical formula for the exodus, "with a mighty hand and an outstretched arm", and related
  arm-and-hand idioms of YHWH's power. It has been proposed as a polemical appropriation of
  Egyptian royal epithets celebrating pharaoh's strong arm. The entry covers the formula's
  distribution and the proposed Egyptian, and wider ancient Near Eastern, background.
passages:
- ref: Exod 6:6
  rel: polemic
  disputed: true
  note: Redemption 'with an outstretched arm' against pharaoh
- ref: Deut 4:34; 5:15; 26:8
