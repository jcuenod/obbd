editorial:
  author_notes:
  - >-
    Hoffmeier and Görg have argued that the formula appropriates Egyptian royal epithets (e.g.,
    the king as "strong of arm", ḫpš), and the polemical reading is plausible. But "strong
    arm" language is also found in Akkadian and in the Amarna letters (Abdi-Heba refers to
    the king's strong arm; verify the EA references). The background is not exclusively Egyptian.
  - >-
    The full formula is characteristic of Deuteronomy and Deuteronomistic texts (Deut; Jer;
    1 Kgs 8:42; Ps 136). Note what this implies for the date of the polemic.
  - >-
    Show how the idiom works in the plague narrative's contest between YHWH's arm and pharaoh's
    (cf. Ezek 30:21-25, where pharaoh's arm is broken).
  sources_to_check:
  - >-
    Hoffmeier, 'The Arm of God versus the Arm of Pharaoh in the Exodus Narratives', Biblica
    67 (1986)
