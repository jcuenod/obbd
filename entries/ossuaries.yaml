id: ossuaries
title: Ossuaries and Secondary Burial
type: realia
cultures: [jewish]
date:
  from: -20
  to: 135
  circa: true
  display: c. 20 BCE–135 CE
scope: >-
  Stone chests used for secondary burial (ossilegium) of bones after the flesh had decomposed
  in rock-cut tombs, characteristic of Jerusalem from the late 1st century BCE to 70 CE and
  continuing elsewhere into the 2nd century. The entry covers the tombs, inscriptions, and
  burial practices they reflect.
