editorial:
  author_notes:
  - >-
    The link between ossilegium and resurrection belief has been proposed (Rahmani) but is
    debated.
  - Inscriptions (Hebrew, Aramaic, Greek) are a major source for onomastics.
  - >-
    Address controversies: the James ossuary (its inscription widely doubted despite the 2012
    acquittal) and the Talpiot 'Jesus family tomb' claims (rejected by mainstream scholars).
  - >-
    Most tomb-blocking stones were square; round rolling stones were rare before 70 CE (Kloner).
