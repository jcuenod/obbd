  note: Whitewashed tombs full of dead bones
- ref: Matt 8:21-22
  rel: practice
  disputed: true
  note: '''Let the dead bury their own dead'', perhaps alluding to secondary burial'
- ref: Matt 27:57-60
  rel: realia
