editorial:
  author_notes:
  - >-
    selaʿ is also a common noun, 'rock', so not every occurrence names a place. The candidates
    for Edomite Sela are as-Silaʿ near Tafila, which has a rock relief of Nabonidus, and Umm
    el-Biyara at Petra. Neither is certain.
  - >-
    Bennett's excavations at Umm el-Biyara found a seventh-century Edomite settlement and
    a seal impression of Qaus-gabri, king of Edom.
  - >-
    Petra's famous monuments are Nabataean (first century BCE to first century CE). Correct
    the popular conflation of Petra with Iron Age Edom's capital, which was Bozrah.
  sources_to_check: ['Bienkowski, Early Edom and Moab (1992)']
