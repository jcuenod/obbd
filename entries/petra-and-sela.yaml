id: petra-and-sela
title: Sela and Petra
aliases: [Sela, Selaʿ, Joktheel, Umm el-Biyara, as-Silaʿ]
type: site
cultures: [edomite, arabian]
scope: >-
  Biblical Sela ('the Rock'), an Edomite stronghold, and Petra, the later Nabataean capital,
  often wrongly equated with it. Covers the candidate sites for Sela (as-Silaʿ and Umm el-Biyara)
  and the Nabataean city as background to the New Testament.
