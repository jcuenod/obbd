editorial:
  author_notes:
  - >-
    The Hebrew Bible has little systematic demonology; harmful powers are usually subordinate
    to YHWH (1 Sam 16:14). Avoid reading later demonology back into it.
  - >-
    Mesopotamian evidence (Udug-hul incantations, Lamashtu and Pazuzu, Maqlû) offers the richest
    comparison; distinguish demons from protective spirits (šēdu/lamassu can be benevolent).
  - >-
    Azazel's identity (demon, place, "complete removal") is debated; link to elimination rites.
  - >-
    Several biblical terms (Deber, Qeteb, Resheph, Lilith) are demoted deities or demons;
    treat individually.
