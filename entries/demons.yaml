id: demons
title: Demons and Evil Spirits
aliases: [evil spirits, šēdîm, śəʿîrîm]
type: concept
cultures: [ane, mesopotamian, hebrew, jewish]
scope: >-
  Demons and harmful spirits in the ancient Near East and the Hebrew Bible: Mesopotamian demons
  and anti-demonic ritual, the šēdîm and śəʿîrîm of the Bible, demoted deities of plague,
  and evil spirits sent by God. The entry stops before the developed demonology of the New
  Testament period, noting it only in outline.
