id: ludlul-bel-nemeqi
title: Ludlul bēl nēmeqi (Poem of the Righteous Sufferer)
aliases: [Poem of the Righteous Sufferer, I Will Praise the Lord of Wisdom, Babylonian Job]
type: text
cultures: [babylonian]
date:
  from: -1300
  to: -1100
  circa: true
  display: c. 1300–1100 BCE
scope: >-
  A Middle Babylonian poem in which Šubši-mešrê-Šakkan, a high official abandoned by his gods,
  describes social ruin and bodily affliction before Marduk restores him. Framed as praise
  of Marduk, it is the fullest Mesopotamian treatment of the righteous sufferer.
passages:
- ref: Job 19:13-22
  rel: parallel
  note: Sufferer shunned by kin, friends, and servants
- ref: Job 7:3-5, 13-14
  rel: parallel
  note: Nights of misery, terrifying dreams, wasting body
- ref: Job 42:10-17
  rel: parallel
  note: Restoration once the deity relents
- ref: Job 11:7-8
  rel: concept
  note: Divine will inscrutable to humans ('Who can learn the way of a god?')
- ref: Job 5:17-18
  rel: concept
  note: The god who strikes also heals
- ref: Ps 38:2-11
  rel: parallel
  note: Illness as divine anger; body wasting, friends stand aloof (MT 38:3-12)
- ref: Ps 22:6-8, 14-17
  rel: parallel
  note: Mockery and bodily disintegration of the sufferer (MT 22:7-9, 15-18)
- ref: Ps 30
  rel: form
  note: Thanksgiving for rescue from near-death, praising the god who wounds and heals
