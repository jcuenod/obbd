editorial:
  author_notes:
  - >-
    Generally dated to the Kassite period (the sufferer bears a Kassite-era name); four (or
    five) tablets, edited by Lambert (1960) and newly by Annus and Lenzi (2010) and Oshima
    (2014).
  - >-
    Formally a hymn of thanksgiving, not a dialogue: it shares motifs with Job but is closer
    in form to biblical thanksgiving psalms. The label 'Babylonian Job' is misleading.
  - >-
    The sufferer does not know his offence and protests his piety, yet the poem never accuses
    Marduk; contrast Job's challenge to God.
  - >-
    No direct literary dependence of Job on Ludlul is demonstrable; present the parallels
    as a shared ANE discourse on undeserved suffering.
  sources_to_check:
  - W. G. Lambert, Babylonian Wisdom Literature (1960)
  - >-
