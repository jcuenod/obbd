date:
  from: -540
  to: -450
  circa: true
  display: c. 540–450 BCE
scope: >-
  The Egyptian-style basalt anthropoid sarcophagus of Eshmunazar II, king of Sidon, found
  in 1855. Its long Phoenician inscription curses anyone who opens the tomb, praying that
  they have no resting place among the Rephaim. It records temple building for Astarte and
  Eshmun and a Persian royal grant of Dor and Joppa.
