- ref: Isa 26:14
  rel: concept
  note: The Rephaim do not rise
- ref: Ps 88:10
  rel: concept
  note: Can the Rephaim praise God? (MT 88:11)
- ref: Isa 14:18-20
  rel: parallel
  note: Honourable royal burial contrasted with being denied a tomb
- ref: 1Kgs 11:5
  rel: attests
