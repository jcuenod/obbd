editorial:
  author_notes:
  - >-
    The date is debated. Older dates put Eshmunazar II in the first half of the 5th century.
    Elayi's Sidonian chronology places him c. 539-525. Say which chronology is followed.
  - >-
    The Rephaim as shades of the dead, not giants, is the key point for Isaiah, Psalms and
    Job. Link to the Ugaritic rpum.
  - >-
    The 'lord of kings' who granted Dor and Joppa is the Persian king, a rare Phoenician witness
    to Achaemenid patronage of coastal cities.
