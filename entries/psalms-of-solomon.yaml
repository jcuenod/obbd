id: psalms-of-solomon
title: Psalms of Solomon
aliases: [Pss. Sol.]
type: text
cultures: [jewish]
date:
  from: -63
  to: -30
  circa: true
  display: c. 63–30 BCE
scope: >-
  Eighteen psalms preserved in Greek and Syriac and probably composed in Hebrew in Jerusalem
  after Pompey's capture of the city in 63 BCE (Pompey's death in 48 BCE is alluded to in
  Psalm 2). They interpret the Roman conquest as judgement on Hasmonean and other 'sinners',
  and Psalms 17-18 portray a Davidic 'Lord Messiah' who will purge Jerusalem and rule in righteousness.
passages:
- ref: 2Sam 7:12-16
  rel: concept
  note: >-
