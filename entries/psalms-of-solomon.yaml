editorial:
  author_notes:
  - >-
    The text survives in medieval Greek manuscripts and in Syriac. It is listed in the table
    of contents of Codex Alexandrinus, but those pages are lost. A Hebrew original is likely.
    Verse numbering differs between Rahlfs and the Wright/OTP edition, so state which is used.
  - >-
    Historical allusions: Pompey's siege and entry into the sanctuary (Pss. Sol. 2; 8; 17),
    his death on the Egyptian shore (2:26-27), and the Hasmoneans who 'laid waste the throne
    of David' (17:4-8). Whether the 'man alien to our race' (17:7) is Pompey or Herod affects
    the date.
  - >-
    Provenance: the older attribution to Pharisees (Ryle and James; Wellhausen) is now held
    more cautiously. Essene authorship is a minority view. 'Pious circles in Jerusalem' is
    the safer description.
  - >-
    The messiah is a human Davidic king who purges Jerusalem of Gentiles and sinners and rules
    by wisdom rather than 'horse and rider and bow' (17:33). The phrase christos kyrios (17:32;
    cf. 18:7) is sometimes emended to christos kyriou ('the Lord's anointed'); note the debate.
    This is key background for NT 'Son of David' and messianic language.
  - The title 'of Solomon' is secondary, perhaps inspired by Ps 72.
  sources_to_check:
  - 'R. B. Wright, The Psalms of Solomon: A Critical Edition of the Greek Text (2007)'
  - >-
    R. B. Wright, 'Psalms of Solomon,' in J. H. Charlesworth (ed.), The Old Testament Pseudepigrapha,
    vol. 2 (1985)
  - >-
    K. Atkinson, I Cried to the Lord: A Study of the Psalms of Solomon's Historical Background
    and Social Setting (JSJSup 84, 2004)
