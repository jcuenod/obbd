editorial:
  author_notes:
  - >-
    Papyrus was the standard medium for Iron Age Levantine documents. Papyrus-fibre impressions
    on the backs of bullae prove sealed papyri, though only one Iron Age Hebrew papyrus survives
    (Wadi Murabbaʿat, Mur 17, a palimpsest).
  - >-
    Wax-covered writing boards (Akkadian lēʾu) are known from the Nimrud ivory and wood boards
    and Assyrian reliefs. They may lie behind Ezek 37:16-20, but this is debated.
  - >-
    Clay tablets were used in the Late Bronze Age Levant (Amarna, Ugarit) and occasionally
    in Iron Age contexts. Leather and parchment dominate the Dead Sea Scrolls.
  - >-
    The stone tablets of the covenant can be compared with monumental and treaty tablets,
    but avoid speculation about their size or contents.
