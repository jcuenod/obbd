id: mesad-hashavyahu-ostracon
title: Meṣad Ḥashavyahu (Yavneh-Yam) Ostracon
aliases: [Yavneh-Yam Ostracon, Reaper's Plea]
type: artifact
cultures: [judahite]
date:
  from: -630
  to: -609
  circa: true
  display: c. 630–609 BCE
scope: >-
  A Hebrew ostracon found in 1960 at the coastal fortress of Meṣad Ḥashavyahu near Yavneh-Yam.
  In it a harvest worker petitions an official for the return of his garment, which an overseer
  named Hoshayahu son of Shobai had confiscated. It is the earliest extrabiblical legal petition
  in Hebrew.
passages:
- ref: Exod 22:26-27
  rel: practice
  note: A garment taken in pledge must be returned before sunset (MT 22:25-26)
- ref: Deut 24:12-15
  rel: practice
  note: Returning the poor man's pledged cloak; paying the labourer promptly
- ref: Amos 2:8
  rel: practice
  note: Garments taken in pledge abused by the powerful
- ref: Job 22:6
  rel: practice
  note: Taking pledges and stripping the naked of clothing
- ref: Deut 19:15
  rel: practice
  note: Testimony of witnesses; the reaper says his companions will testify for him
- ref: Amos 8:5
  rel: practice
  disputed: true
  note: '''before šbt'' perhaps refers to the sabbath as a work boundary'
