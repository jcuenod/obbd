editorial:
  author_notes:
  - >-
    Whether šbt in 'before šbt' means 'sabbath' or 'stopping (work)' is disputed. Present
    both readings.
  - >-
    Who controlled the fort (Josiah's Judah or Egypt under Psammetichus I, with Greek mercenaries)
    is debated. The Hebrew letter and the East Greek pottery both need explaining.
  - >-
    The petition is not a lawsuit before a court but an appeal to an official. Compare biblical
    appeals to the king (2 Sam 14; 2 Kgs 8:3-6).
