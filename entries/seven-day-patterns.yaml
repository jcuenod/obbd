title: Seven-Day Patterns and the Week
aliases: [the week, seven-day unit]
type: concept
cultures: [ane, ugaritic, mesopotamian]
scope: >-
  The literary and ritual use of seven-day units (six days followed by a climactic seventh)
  in Ugaritic and Mesopotamian literature and in biblical narrative and cult, and the emergence
  of the continuous seven-day week.
