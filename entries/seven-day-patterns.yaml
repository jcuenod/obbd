editorial:
  author_notes:
  - >-
    Ugaritic epic regularly uses a six-plus-one day scheme. Fire burns in Baal's palace six
    days and is done on the seventh (KTU 1.4 VI 22-33). Danel's incubation and Kirta's march
    use the same scheme (Loewenstamm, IEJ 15, 1965). In Gilgamesh XI the storm lasts six days
    and seven nights, and the dove is sent out on the seventh day after grounding.
  - >-
    Gudea's dedication of the Eninnu includes seven days of festivity in which "the slave
    woman was equal to her mistress" (verify passage in Statue B and Cylinder B). This is
    a frequently cited analogue to the social dimension of Exod 20:10 and Deut 5:14.
  - >-
    Distinguish the literary or ritual seven-day unit from the continuous week detached from
    the lunar month. The latter appears first in Israel. The planetary week is Hellenistic-Roman.
