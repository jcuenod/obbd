id: lamashtu-pazuzu-amulets
title: Lamashtu and Pazuzu Amulets
type: realia
cultures: [mesopotamian]
scope: >-
  Apotropaic bronze and stone plaques and pendants of the first millennium BCE showing the
  demoness Lamashtu, who attacked pregnant women and infants, often driven off by the wind
  demon Pazuzu, whose head served as a protective amulet.
passages:
- ref: Ps 91:5-6
  rel: concept
  note: Terror by night, arrow by day, pestilence in darkness, destruction at noon
- ref: Isa 34:14
  rel: concept
  note: Lilith (lîlît) among desert creatures; cf. Mesopotamian lilitu demons
- ref: Ps 121:6
  rel: concept
  note: Protection from being struck by sun or moon
- ref: Isa 3:20
  rel: realia
  note: Amulets (laḥăšîm) among the finery of Jerusalem's women
