editorial:
  author_notes:
  - >-
    Lamashtu is distinct from Lilith; the later Jewish Lilith absorbed child-killing traits
    similar to Lamashtu's, but they should not be equated for the biblical period.
  - >-
    Pazuzu was itself a dangerous demon whose image protected against Lamashtu, an example
    of fighting demon with demon.
  - >-
    The closest Iron Age Levantine parallel is the Arslan Tash plaques (7th century), whose
    authenticity has been debated.
  - >-
    Ps 91 is often compared with apotropaic texts; the demonic reading of deber and qeṭeb
    is mainstream but the psalm is not an incantation.
