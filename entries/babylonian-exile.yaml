scope: >-
  The deportations of Judahites to Babylonia in 597, 587/586, and 582 BCE, the life of Judean
  communities in Babylonia, the situation in Judah after 586, and the end of the exile under
  Persian rule. Covers biblical accounts and cuneiform evidence for the exiles.
