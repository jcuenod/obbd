editorial:
  author_notes:
  - >-
    The Āl-Yāhūdu and related tablets (from 572 BCE into the 5th century) show Judeans as
    dependent landholders in rural Babylonia, not prisoners. The Jehoiachin ration tablets
    from Babylon and the Murašû archive (late 5th century) add evidence. Avoid a 'slavery'
    framing.
  - >-
    Present the 'myth of the empty land' debate (Barstad) against evidence of severe destruction
    in Jerusalem and the Shephelah and relative continuity in Benjamin (Lipschits).
  - >-
    Deportation figures differ between 2 Kgs 24:14-16 and Jer 52:28-30. The seventy years
    is a symbolic or schematic figure.
  - >-
    Many Judeans remained in Babylonia after 539. The 'return' was gradual and partial, and
    the 538 date for Cyrus's edict depends on Ezra 1.
  sources_to_check:
  - >-
    Pearce and Wunsch, Documents of Judean Exiles and West Semites in Babylonia in the Collection
    of David Sofer (CUSAS 28, 2014)
