editorial:
  author_notes:
  - >-
    Around 50 Mari texts report oracles by āpilum ("answerer"), muḫḫûm ("ecstatic"), and others,
    often lay persons. The Neo-Assyrian corpus (SAA 9) contains salvation oracles of Ishtar
    of Arbela to Esarhaddon whose "fear not" form parallels Second Isaiah.
  - >-
    The main difference is not phenomenology but the literary afterlife. Only in Israel were
    prophetic oracles collected, expanded, and canonized as books. Present this as the consensus
    contrast.
  - >-
    Nissinen's anthology (SBLWAW 12) is the standard source collection. Stökl (2012) offers
    a philological and sociological comparison.
  - >-
    Treat Wenamun's ecstatic at Byblos and Lachish Letter 3 ("the prophet") as scattered evidence,
    not a coherent Levantine institution.
  sources_to_check:
  - Martti Nissinen, Prophets and Prophecy in the Ancient Near East (SBLWAW 12, 2003)
  - SAA 9
