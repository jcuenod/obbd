id: constellations
title: Constellations in the Hebrew Bible
type: concept
cultures: [babylonian, hebrew]
scope: >-
  The named stars and constellations in the Hebrew Bible (kîmâ, kĕsîl, ʿāš/ʿayiš, mazzālôt,
  mazzārôt), problems of their identification, and the background of Mesopotamian star lore
  and astronomy.
passages:
- ref: Job 9:9
  rel: language
  note: ʿāš, kĕsîl, kîmâ, and the 'chambers of the south' made by God
- ref: Job 38:31-33
  rel: language
  note: Binding the Pleiades (kîmâ), loosing Orion (kĕsîl), leading out mazzārôt, guiding
    ʿayiš
- ref: Amos 5:8
  rel: language
  note: The maker of the Pleiades and Orion
- ref: Isa 13:10
  rel: language
  note: Stars and their 'constellations' (kĕsîlêhem) withhold light
- ref: 2Kgs 23:5
  rel: practice
  note: Offerings to sun, moon, the mazzālôt, and the host of heaven
