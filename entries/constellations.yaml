editorial:
  author_notes:
  - >-
    Standard identifications are kîmâ as the Pleiades and kĕsîl ("fool", or a giant) as Orion.
    ʿāš/ʿayiš is uncertain (Ursa Major, Hyades/Aldebaran, and other proposals). Mazzārôt (Job
    38:32) and mazzālôt (2 Kgs 23:5) are often linked to Akkadian manzaltu/manzāzu ("station")
    and taken as zodiacal constellations or lunar stations. Be clear about the uncertainty.
  - >-
    MUL.APIN (early first millennium copies) is the key compendium of Babylonian star lore.
    The zodiac of twelve equal signs developed in Babylonia around the 5th century BCE, so
    later than most of these biblical texts.
  - >-
    The later identification of Orion with Nimrod is post-biblical and should not be read
    back into the texts.
  sources_to_check:
  - Hermann Hunger and David Pingree, MUL.APIN (AfO Beiheft 24, 1989)
  image_query: MUL.APIN tablet British Museum
