editorial:
  author_notes:
  - >-
    Fragment A was found in 1993 and fragments B1-B2 in 1994, all reused in later construction.
    Whether B joins A, and where, is debated and affects the restoration of the royal names.
  - >-
    The names [Jeho]ram son of [Ahab] and [Ahaz]iahu son of [Joram] are partly restored. Say
    so, and give the consensus restoration.
  - >-
    The reading bytdwd as 'House of David' is now the consensus. Early alternatives (a place
    name, 'house of Dod', and claims of forgery) are marginal and should be mentioned only
    briefly.
  - >-
    Discuss the conflict with 2 Kgs 9: royal hyperbole, Jehu as Hazael's agent, or the biblical
    account crediting Jehu with what Aram claimed. Do not harmonise.
  - >-
    The author's name is lost. Attribution to Hazael is the majority view; a minority suggests
    Bar-Hadad son of Hazael.
