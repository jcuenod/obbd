id: tel-dan-stele
title: Tel Dan Stele
aliases: [House of David Inscription, Tel Dan Inscription]
type: artifact
cultures: [aramean]
date:
  from: -842
  to: -800
  circa: true
  display: c. 842–800 BCE
scope: >-
  Fragments of an Old Aramaic royal victory stele found at Tel Dan in 1993 and 1994, almost
  certainly erected by Hazael of Damascus. The king claims to have killed a king of Israel
  and a king of the 'House of David' (bytdwd), the earliest secure extrabiblical reference
  to the Davidic dynasty.
passages:
- ref: 2Kgs 8:28-29
  rel: event
  note: Joram of Israel and Ahaziah of Judah at war with Hazael at Ramoth-gilead
- ref: 2Kgs 9:14-28
  rel: event
  note: Deaths of Joram and Ahaziah, ascribed to Jehu's coup rather than to Hazael
- ref: 2Kgs 8:7-15
  rel: attests
  note: Hazael's accession at Damascus; the stele claims Hadad made him king
- ref: 2Sam 7:11-16
  rel: attests
