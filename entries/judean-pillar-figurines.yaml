editorial:
  author_notes:
  - >-
    Interpretations include Asherah (Kletter), a generic goddess, votive figures, and healing
    or apotropaic devices (Darby). Recent work stresses domestic and protective uses rather
    than 'fertility cult'.
  - >-
    The figurines continue up to 586 and were not removed by Josiah's reform. This complicates
    simple readings of 2 Kgs 23 and of a 'popular religion' versus 'official religion' split.
  - Most come from fills and refuse, not shrines. Context matters for interpretation.
  - >-
    Every biblical link here is inferential. Mark identifications (Asherah, Queen of Heaven,
    teraphim) as proposals.
  sources_to_check:
