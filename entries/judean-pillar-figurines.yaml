  circa: true
  display: c. 750–586 BCE
scope: >-
  Small terracotta female figurines with a solid pillar base and hands supporting the breasts,
  found by the thousand in 8th to early 6th century Judah, especially in Jerusalem households.
  The entry covers their typology, contexts and the debate over whom or what they represent.
