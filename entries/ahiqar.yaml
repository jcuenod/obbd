  circa: true
  display: c. 700–500 BCE
scope: >-
  The tale of Ahiqar, wise counsellor of the Assyrian kings Sennacherib and Esarhaddon, betrayed
  by his adopted nephew Nadin and later vindicated, combined with a collection of Aramaic
  proverbs. The earliest copy is the late-5th-century Elephantine papyrus; the work circulated
  widely in later languages and is named in Tobit.
passages:
- ref: Tob 1:21-22
  rel: attests
  note: Ahikar as Tobit's nephew and chief cupbearer and administrator under Esarhaddon
- ref: Tob 14:10
  rel: attests
  note: Nadab's treachery against Ahikar as a moral example
- ref: Tob 2:10; 11:18
  rel: attests
  note: Ahikar supports Tobit and attends his son's wedding
- ref: Prov 23:13-14
