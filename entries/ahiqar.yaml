editorial:
  author_notes:
  - >-
    The Elephantine papyrus (written over a customs account from Xerxes' reign, c. 475) has
    the narrative in Imperial Aramaic and proverbs probably older, in a western Aramaic dialect
    (Lindenberger).
  - >-
    A Seleucid tablet from Uruk lists the scholar Aba-enlil-dari 'whom the Arameans call Aḫuqar'
    under Esarhaddon, so the figure may have a historical kernel; do not overstate this.
  - >-
    Later Syriac, Armenian, Arabic, and other versions, and the Greek Life of Aesop, reworked
    the story; distinguish them from the Aramaic text when citing proverbs.
  - >-
    Ahiqar is a key witness to the courtier-tale genre (Joseph, Daniel, Esther) and to the
    shared international wisdom culture.
  sources_to_check:
