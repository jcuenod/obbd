title: Samaria Papyri (Wadi Daliyeh)
aliases: [Wadi Daliyeh papyri]
type: text
cultures: [persian, hebrew]
date:
  from: -375
  to: -335
  circa: true
  display: c. 375–335 BCE
scope: >-
  Fourth-century BCE Aramaic legal papyri (mostly slave-sale deeds) and sealings from Samaria,
  found in 1962 in a cave in Wadi ed-Daliyeh with the remains of refugees. The refugees probably
  fled Alexander's reprisals of 332/331 BCE. The papyri attest governors of Samaria from the
  house of Sanballat.
passages:
- ref: Neh 2:10, 19
  rel: attests
  note: A later governor named as 'son of Sanballat', on a bulla and in a deed
- ref: Neh 13:28
  rel: setting
  note: Sanballat's family as a continuing ruling house in Samaria
- ref: 2Kgs 17:24-41
  rel: setting
  note: Mostly Yahwistic personal names in 4th-century Samaria; bears on the polemical portrait
- ref: Lev 25:44-46
  rel: practice
  note: Chattel slavery and slave sales among Samarians
- ref: Jer 32:9-14
  rel: practice
  note: Sealed legal deeds with bullae
