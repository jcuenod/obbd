editorial:
  author_notes:
  - >-
    Present F. M. Cross's papponymy reconstruction (Sanballat I-III), which links the papyri
    to Josephus, Ant. 11.302-347. Note J. Dušek's critique, which removes the need for a Sanballat
    III.
  - >-
    The latest dated deed is from 335 BCE. The connection with Alexander and Samaria's revolt
    (Curtius Rufus 4.8.9-11) is an inference from the cave context.
  - >-
    Use the onomastics (Yahwistic, Aramaic, and other names) cautiously in Samaritan-origins
    discussions.
