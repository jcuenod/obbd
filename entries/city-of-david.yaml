- ref: 2Sam 5:7-9
  rel: setting
  note: >-
    David takes the stronghold of Zion, 'the city of David', and builds from the Millo inward
- ref: 2Sam 5:8
  rel: realia
  disputed: true
  note: Joab's ascent by the ṣinnôr, often linked to Warren's Shaft (now doubted)
- ref: 1Kgs 1:33-45
  rel: setting
  note: Solomon anointed at the Gihon spring
- ref: 1Kgs 2:10
  rel: setting
  note: David buried in the city of David
- ref: 2Chr 32:30
  rel: setting
  note: Gihon's upper outlet channelled to the west side of the city of David
- ref: Neh 3:15-16
  rel: setting
