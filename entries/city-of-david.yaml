id: city-of-david
title: City of David
aliases: [Ophel, Stronghold of Zion, Wadi Hilweh ridge]
type: site
cultures: [judahite, canaanite]
scope: >-
  The narrow southeastern ridge of Jerusalem above the Gihon spring, the core of the Bronze
  and Iron Age city. Covers its fortifications, the Stepped Stone Structure and Large Stone
  Structure, the spring installations, and the Iron Age houses and bullae; the tunnel and
  the temple platform have their own entries.
