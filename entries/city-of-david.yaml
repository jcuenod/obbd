- ref: Jer 36:10-12
  rel: attests
  note: >-
    Gemariah son of Shaphan; bulla of Gemaryahu son of Shaphan from the 'House of the Bullae'
- ref: Jer 38:1
  rel: attests
  note: Jehucal son of Shelemiah and Gedaliah son of Pashhur named on bullae from the site
