editorial:
  author_notes:
  - >-
    The Stepped Stone Structure and E. Mazar's Large Stone Structure are dated anywhere from
    Iron I to Iron IIA. Whether they form one tenth-century complex (a 'palace of David')
    is contested; give the range of views.
  - >-
    Reich and Shukron showed that the massive spring tower and pool fortifications are Middle
    Bronze Age, and that Warren's Shaft could not have been used as a water shaft in the Bronze
    Age. This undercuts the classic link with 2 Sam 5:8.
  - >-
    Shiloh's Area G houses (House of Ahiel, Burnt Room, House of the Bullae) preserve the
    586 destruction. The bullae corpus is the main epigraphic link to Jeremiah's officials.
  - >-
    The excavations' sponsorship and their setting in the Silwan neighbourhood are politically
    contested. Mention this neutrally.
  sources_to_check:
  - NEAEHL
  - Shiloh, Excavations at the City of David I (Qedem 19, 1984)
  - Reich, Excavating the City of David (2011)
