editorial:
  author_notes:
  - >-
    The Gezer Calendar (10th century) lists the agricultural months (ingathering, sowing,
    late sowing, flax, barley harvest, harvest and measuring, pruning, summer fruit). Its
    genre (school exercise, song, administrative aid) and some readings are debated.
  - >-
    Highland dry farming depended on the timing of autumn and spring rains. This underlies
    the rain theology and anti-Baal polemic of Deut 11 and Hos 2. Terracing and risk-spreading
    strategies (Hopkins) are key.
  - Link the agricultural calendar to the pilgrimage festivals and the sabbatical fallow.
  sources_to_check:
  - Borowski, Agriculture in Iron Age Israel (1987)
  - Hopkins, The Highlands of Canaan (1985)
