id: egyptian-cosmology
title: Egyptian Cosmology
aliases: [Egyptian creation myths]
type: concept
cultures: [egyptian]
scope: >-
  Ancient Egyptian conceptions of the origin and structure of the world: the primeval waters
  (Nun), the emergence of the primeval mound, and the separation of sky (Nut) from earth (Geb)
  by Shu. The entry also covers the complementary Heliopolitan, Hermopolitan, Memphite, and
  Theban creation traditions and their use as comparanda for biblical cosmology.
passages:
- ref: Gen 1:2
  rel: concept
  note: Dark, formless primeval waters before creation; cf. Nun and the Hermopolitan Ogdoad
- ref: Gen 1:6-8
  rel: concept
  note: Separation of the waters and the sky; cf. Shu lifting Nut from Geb
- ref: Gen 1:9-10
  rel: concept
  note: Dry land emerging from the waters; cf. the primeval mound
- ref: Job 26:7-11
  rel: concept
  note: Horizon drawn on the waters; pillars of heaven
- ref: Ps 19:4-6
  rel: imagery
  note: The sun's daily course across the sky; MT 19:5-7
- ref: Gen 1:26-27
  rel: concept
  note: 'Humans as the deity''s image (Merikare: humankind as the creator''s images)'
