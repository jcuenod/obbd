editorial:
  author_notes:
  - >-
    Egyptian cosmogonies coexisted as complementary accounts, not rival dogmas. Present them
    by tradition (Heliopolis, Hermopolis, Memphis, Thebes) with their main sources (Pyramid
    Texts, Coffin Texts, Memphite Theology).
  - >-
    The Gen 1 comparisons (watery precreation, separation, emergence of land, creation by
    word) are commonly noted. Some scholars (e.g., Hoffmeier, Currid) stress Egyptian over
    Mesopotamian background, but most treat both as comparanda without direct dependence.
  - >-
    Egyptian creation lacks a creation-by-combat myth comparable to Enuma Elish, though the
    sun god's daily combat with Apophis offers a partial analogue.
  - >-
    The Instruction for Merikare's passage on humankind as the god's images is relevant to
    the imago Dei discussion.
  sources_to_check:
