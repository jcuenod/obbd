title: Lots and Cleromancy
aliases: [casting lots, pur, cleromancy]
type: practice
cultures: [assyrian, hebrew, persian]
scope: >-
  Decision by lot in the ancient Near East and the Bible: allocating land, offices, and duties;
  identifying the guilty; choosing between alternatives. The entry includes the Assyrian inscribed
  lot (pūru) of Iahali and the pûr of Esther.
