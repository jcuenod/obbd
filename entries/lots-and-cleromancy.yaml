editorial:
  author_notes:
  - >-
    The inscribed clay cube of Iahali, a high official and eponym under Shalmaneser III (9th
    c. BCE), calls itself a pūru (lot) to determine his eponymy year (Hallo, "The First Purim",
    BA 46, 1983). It confirms the Akkadian background of Esther's pûr.
  - >-
    Lots were understood as a legitimate means of divine decision in Israel (Prov 16:33) and
    continued in Second Temple practice (priestly duties, Luke 1:9).
  - >-
    Distinguish lots (gôrāl) from the Urim and Thummim, whose mechanism is unknown, while
    noting the overlap in 1 Sam 14:41-42.
