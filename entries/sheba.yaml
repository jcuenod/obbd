editorial:
  author_notes:
  - >-
    Saba was centred at Marib (great dam, temples of Almaqah such as Awwam and Barʾan). Assyrian
    texts mention Sabaeans under Tiglath-pileser III, Itʾamar the Sabaean under Sargon II,
    and Karibʾil under Sennacherib.
  - >-
    Sabaean monumental inscriptions begin around the eighth century BCE (the chronology is
    still debated). No queen of Saba is known from inscriptions. The visit story may reflect
    later (eighth to seventh century) trade realities. Present the debate, not a verdict.
  - >-
    Distinguish Sheba (Saba) from Seba (Gen 10:7; Isa 43:3; 45:14), possibly in Africa, and
    note the North Arabian Sabaeans of Job. The Ethiopian Kebra Nagast tradition is a later
    reception.
  sources_to_check: ['Retsö, The Arabs in Antiquity (2003)']
