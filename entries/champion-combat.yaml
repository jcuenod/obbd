editorial:
  author_notes:
  - >-
    Sinuhe's duel with the 'strong man of Retenu' is the closest ancient Near Eastern narrative
    parallel. Homeric duels (Paris and Menelaus, Iliad 3; Hector and Ajax, Iliad 7) are often
    cited for an Aegean or Philistine setting.
  - >-
    Studies: R. de Vaux on single combat; H. A. Hoffner, 'A Hittite Analogue to the David
    and Goliath Contest of Champions?' (CBQ 30, 1968). Goliath's armour is eclectic, not purely
    Aegean.
  - >-
    Many hold that 2 Sam 21:19 (Elhanan) preserves an older tradition later transferred to
    David. 1 Chr 20:5 harmonizes.
  - >-
    The Tell es-Safi/Gath ostracon names (ʾlwt/wlt) are etymologically comparable to Goliath
    but do not refer to him.
  sources_to_check:
  - ANET 18-22 (Sinuhe)
  - M. Lichtheim, Ancient Egyptian Literature, vol. 1 (Sinuhe)
