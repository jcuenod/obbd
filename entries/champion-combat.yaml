id: champion-combat
title: Champion (Single) Combat
aliases: [Single combat, Representative combat]
type: practice
cultures: [egyptian, greek, philistine, hittite]
scope: >-
  Combat between selected champions as a substitute for, or prelude to, battle between armies.
  The entry covers David and Goliath and the duels of 2 Samuel in comparison with Sinuhe,
  Homeric and other ancient parallels.
passages:
- ref: 1Sam 17:1-54
  rel: practice
  note: Goliath's challenge; the outcome of the duel to decide subjugation (17:8-9)
- ref: 2Sam 2:12-17
  rel: practice
  note: Twelve young men from each side 'compete' at the pool of Gibeon
- ref: 2Sam 21:15-22
  rel: practice
  note: Duels with Philistine giants; Elhanan kills Goliath (21:19)
- ref: 2Sam 23:20-21
  rel: practice
  note: Benaiah kills an Egyptian with his own spear
- ref: 1Chr 20:5
  rel: practice
  note: 'Chronicler: Elhanan kills Lahmi, brother of Goliath (harmonization)'
