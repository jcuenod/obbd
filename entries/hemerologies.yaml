editorial:
  author_notes:
  - >-
    The ritual hemerology for certain months (including an intercalary Elul and Marchesvan)
    labels days 7, 14, 19, 21, and 28 as ūmu lemnu ("evil day"). On these days the king must
    avoid cooked meat and changing his garment, the diviner may not give a decision, and the
    physician may not touch the sick. Day 19 is the 49th day counted from the previous month's
    start. These are restrictions on office-holders, not a general rest day.
  - >-
    Copies range from the Middle Babylonian period to Late Babylonian times. The major Neo-Assyrian
    collections come from Nineveh. No single date can be given, so the date field is left
    blank.
  - >-
    The Egyptian Calendar of Lucky and Unlucky Days (the Cairo Calendar, New Kingdom) is a
    separate tradition based on mythological events. Present it alongside, not merged with,
    the Mesopotamian texts.
  - >-
    The KJV-style rendering of ʿônēn as "observer of times" reflects early Jewish interpretation
    and is not secure. Mark it as such.
  sources_to_check:
