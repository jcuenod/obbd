id: hemerologies
title: Hemerologies (Favorable and Unfavorable Days)
aliases: [menologies, lucky and unlucky days, calendars of lucky and unlucky days]
type: text
cultures: [babylonian, assyrian, egyptian]
scope: >-
  Mesopotamian hemerologies and menologies, scholarly texts listing favourable and unfavourable
  days and months for particular actions, and Egyptian calendars of lucky and unlucky days.
  They are significant for biblical studies as background to the selection of propitious days
  and in debates over the origins of the Sabbath.
