id: apotropaic-doorposts-and-thresholds
title: Doorposts, Thresholds, and Apotropaic Protection
aliases: [Threshold rites, Mezuzah background]
type: practice
cultures: [ane, assyrian, babylonian]
scope: >-
  Doorways and thresholds as places of danger and protection: blood rites on doorposts, inscribed
  doorposts, threshold taboos, and Mesopotamian protective figures and demons at entrances.
  The entry covers the background of the Passover blood rite and the mezuzah.
passages:
- ref: Exod 12:7, 22-23
  rel: practice
  note: Blood on lintel and doorposts keeps the destroyer from entering
- ref: Deut 6:9
  rel: practice
  note: Words written on the doorposts (mĕzûzôt) of house and gates
- ref: Deut 11:20
  rel: practice
  note: The same command repeated
- ref: Exod 21:6
  rel: practice
  disputed: true
  note: Slave's ear pierced at the door or doorpost 'before God'
- ref: 1Sam 5:4-5
  rel: practice
  note: Dagon's priests do not tread on the threshold at Ashdod
- ref: Zeph 1:9
  rel: practice
  note: Punishing 'all who leap over the threshold'
- ref: Isa 57:8
  rel: practice
  disputed: true
  note: A 'memorial' (zikkārôn) set behind door and doorpost
- ref: Ezek 45:19
  rel: practice
  note: Blood on temple doorposts and gate posts at the new year
- ref: Gen 4:7
  rel: language
