scope: >-
  Ahab son of Omri, king of Israel, considered in the light of extrabiblical evidence, chiefly
  Shalmaneser III's Kurkh Monolith. It names 'Ahab the Israelite' with 2,000 chariots and
  10,000 soldiers in the anti-Assyrian coalition at Qarqar (853). The Mesha Stele and the
  archaeology of Samaria and Jezreel are also relevant.
