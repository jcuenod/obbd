editorial:
  author_notes:
  - >-
    Qarqar is unmentioned in Kings. Explain how Ahab's alliance with Hadadezer of Damascus
    there fits awkwardly with the 1 Kgs 20 and 22 war stories, and the proposal that these
    stories originally concerned Jehoahaz or Joash.
  - >-
    The Kurkh figure of 2,000 chariots is possibly a scribal error or an exaggeration, but
    it is commonly taken as evidence of Israel's military weight.
  - >-
    The Mesha Stele's 'son' of Omri may refer to Ahab or be generic. It fits uneasily with
    the 'after Ahab's death' timing of 2 Kgs 1:1 and 3:5.
  - >-
    Use Samaria and Jezreel archaeology for the Omride state, and treat the narrative portrayal
    (Elijah cycle) as Deuteronomistic and prophetic.
