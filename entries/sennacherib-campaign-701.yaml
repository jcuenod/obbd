editorial:
  author_notes:
  - >-
    The convergence of the Assyrian annals, the Lachish reliefs, the Lachish Level III destruction
    and 2 Kgs 18:13-16 is one of the best-documented events of the biblical period.
  - >-
    The deliverance narrative (2 Kgs 18:17-19:37) is usually analysed as two parallel accounts
    (B1, B2); the plague of 2 Kgs 19:35 has no Assyrian equivalent, and Herodotus 2.141 has
    a separate Egyptian tale.
  - >-
    Tirhakah (Taharqa) was not yet king in 701 (2 Kgs 19:9); he may have commanded as a prince,
    or the title is anachronistic.
  - >-
    The lmlk jars are widely tied to Hezekiah's preparations; note this as consensus but with
    debates over dating.
