id: sennacherib-campaign-701
title: Sennacherib's Campaign to Judah (701 BCE)
type: event
cultures: [assyrian, judahite]
date:
  from: -701
  to: -701
  display: 701 BCE
scope: >-
  Sennacherib's third campaign to the west in 701 BCE against a rebel coalition including
  Hezekiah of Judah, Sidon, Ashkelon, Ekron, and Egyptian and Kushite forces. It devastated
  Judah and took Lachish, but Jerusalem was not captured and Hezekiah paid a heavy tribute.
