editorial:
  author_notes:
  - >-
    French excavations since 1933 (Parrot, then Margueron, then Butterlin) uncovered a third-millennium
    city and the great palace of Zimri-Lim. Hammurabi destroyed the city c. 1761 BCE (middle
    chronology).
  - >-
    Older uses of Mari to authenticate a 'patriarchal age' (the Albright school) are outdated.
    Present the comparisons as typological.
  - >-
    The prophetic letters (āpilum, muḫḫûm and lay prophets) are among the most important comparative
    evidence for Israelite prophecy.
  - The site was badly damaged and looted during the Syrian civil war.
  sources_to_check:
