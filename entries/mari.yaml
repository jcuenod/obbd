id: mari
title: Mari (Tell Hariri)
aliases: [Tell Hariri]
type: site
cultures: [amorite]
scope: >-
  The city on the middle Euphrates whose Old Babylonian palace, destroyed by Hammurabi, yielded
  about 20,000 tablets. Covers the site, its palace and temples, and why the archives matter
  for prophecy, tribal society and treaty-making; the archive itself is treated in mari-letters.
passages:
- ref: Deut 13:1-5
  rel: practice
  note: Prophets and dreamers whose messages must be tested (MT 13:2-6)
- ref: Jer 28
  rel: practice
  note: Prophetic conflict; Mari letters report prophets and test them with omens
- ref: 2Sam 7:1-17
  rel: parallel
  note: Divine promise to a king through a prophet; cf. Adad of Aleppo's message to Zimri-Lim
- ref: Gen 15:9-10, 17
  rel: practice
  note: Covenant made by killing animals; cf. 'killing a donkey' (ḫayaram qaṭālum)
- ref: Gen 35:18
  rel: language
  note: Benjamin; cf. the Binu-Yamina ('sons of the right/south') tribes
- ref: Josh 11:10
  rel: attests
  note: Hazor as a leading city; Mari texts name Hazor and its king
