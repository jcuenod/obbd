editorial:
  author_notes:
  - >-
    Prov 22:17–24:22 depends on Amenemope, which most scholars accept (since Erman, 1924).
    The route of transmission and the reading šlšwm 'thirty' in 22:20 remain discussed.
  - >-
    'Wisdom literature' is a modern category. Note the critique by W. Kynes (An Obituary for
    'Wisdom Literature', 2019) and the instability of the genre label for ancient Near Eastern
    texts (cf. Lambert's caveat).
  - >-
    Key comparanda: Sumerian proverb collections and Shuruppak; Babylonian Theodicy and Ludlul
    (Job); Ahiqar (Elephantine, 5th c. copy); Egyptian instructions (Ptahhotep, Amenemope).
  - Whether Maat lies behind personified Wisdom (Prov 8) is debated.
  sources_to_check:
  - W. G. Lambert, Babylonian Wisdom Literature (Oxford, 1960)
  image_query: Instruction of Amenemope papyrus British Museum
