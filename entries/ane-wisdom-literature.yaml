id: ane-wisdom-literature
title: Wisdom Literature in the Ancient Near East
aliases: [Wisdom literature]
type: concept
cultures: [ane, egyptian, babylonian, sumerian]
scope: >-
  Egyptian, Mesopotamian and Levantine instructions, proverb collections, dialogues and reflective
  texts as the international context of Proverbs, Job and Ecclesiastes. This is a hub entry
  linking to the individual texts, and it covers the debate over 'wisdom literature' as a
  category.
passages:
- ref: 1Kgs 4:29-34
  rel: concept
  note: Solomon's wisdom surpasses that of the east and Egypt (MT 5:9-14)
- ref: Prov 1:8-9
  rel: form
  note: Instruction from father (and mother) to son, as in Egyptian sebayt
- ref: Prov 22:17-24:22
  rel: parallel
  note: '''Thirty sayings'' closely paralleling the Instruction of Amenemope'
- ref: Prov 25:1
  rel: practice
  note: 'Proverbs copied by the men of Hezekiah: court scribal setting'
- ref: Prov 30:1
  rel: concept
  note: Words of Agur son of Jakeh, often taken as a non-Israelite (Massaite) sage
- ref: Prov 31:1
  rel: concept
  note: Words of King Lemuel of Massa, taught by his mother
- ref: Job 1:1
  rel: setting
  note: 'Job of Uz: a non-Israelite wise man'
- ref: Jer 49:7
  rel: concept
