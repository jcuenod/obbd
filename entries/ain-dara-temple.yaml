editorial:
  author_notes:
  - >-
    Excavated by Ali Abou Assaf (1980s). He proposed three phases (about 1300-1000, 1000-900
    and 900-740 BCE); later work has questioned parts of this chronology. Give the dating
    as approximate.
  - The patron deity is unknown; Ishtar (Šaušga) and a storm god have both been proposed.
  - >-
    The footprints, each about a metre long, are carved in the thresholds: a pair at the entrance,
    then a single left and a single right foot further in, as if the deity strode into the
    cella. Monson and others connect them with biblical language of the divine feet in the
    temple (Ezek 43:7). Present this as illustrative, not as evidence for Israelite practice.
  - >-
    The surrounding gallery is not the same as the storeyed side chambers of 1 Kgs 6:5-10.
    Note similarities and differences honestly.
  - >-
    The temple was badly damaged by Turkish air strikes in January 2018 and sculptures were
    later looted. Describe its current condition.
  sources_to_check:
  - A. Abou Assaf, Der Tempel von ʿAin Dārā (Damaszener Forschungen 3, 1990)
  - 'J. Monson, ''The New ʿAin Dara Temple: Closest Solomonic Parallel,'' BAR 26/3 (2000)'
