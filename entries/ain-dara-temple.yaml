id: ain-dara-temple
title: ʿAin Dara Temple
aliases: [ʿAin Dara, Ain Dara temple]
type: site
cultures: [luwian, aramean]
date:
  from: -1300
  to: -740
  circa: true
  display: c. 1300–740 BCE
scope: >-
  A Syro-Hittite temple in the ʿAfrin valley of northwestern Syria, built and rebuilt from
  about the 13th to the 8th century BCE. Its tripartite plan with a two-columned portico,
  its surrounding gallery, its lion and sphinx orthostats and its giant carved footprints
  make it the closest known parallel to the plan and decoration of Solomon's temple.
