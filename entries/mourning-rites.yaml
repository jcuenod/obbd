id: mourning-rites
title: Mourning Rites
aliases: [Mourning customs, Lament]
type: practice
cultures: [ane, ugaritic]
scope: >-
  Mourning practices in the Hebrew Bible: tearing garments, sackcloth, dust and ashes, shaving,
  gashing, fasting, lament and professional keening women. These are compared with Ugaritic
  and other ancient Near Eastern evidence. The entry includes the Pentateuchal prohibitions
  of some rites.
passages:
