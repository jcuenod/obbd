editorial:
  author_notes:
  - >-
    El's mourning for Baal (KTU 1.5 vi 11-25) is a close parallel: he descends from the throne,
    sits in the dust, puts on sackcloth, and gashes cheeks, chin and arms. Anat mourns in
    the same way.
  - >-
    The prohibitions in Lev 19:27-28 and Deut 14:1 contrast with Jeremiah's assumption that
    these rites are normal (Jer 16:6; 41:5). They are best explained as later boundary-drawing,
    not as bans on originally foreign customs.
  - >-
    Use S. M. Olyan, Biblical Mourning: Ritual and Social Dimensions (2004), for the social
    functions of mourning, including non-death mourning such as petition and penitence.
  - >-
    Iconography: the mourning women on the Ahiram sarcophagus (hands on heads, bared breasts).
  sources_to_check: [KTU 1.5 vi 11-25, COS 1.86 (Baal Myth)]
  image_query: Ahiram sarcophagus mourning women
