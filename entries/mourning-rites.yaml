  rel: practice
  note: Jacob tears his garments, wears sackcloth, mourns many days
- ref: Gen 50:10
  rel: practice
  note: Seven days of mourning for Jacob
- ref: 2Sam 1:11-12
  rel: practice
  note: Tearing clothes, weeping and fasting until evening
- ref: 2Sam 3:31-35
  rel: practice
