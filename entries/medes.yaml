editorial:
  author_notes:
  - >-
    The Medes appear in Assyrian sources from Shalmaneser III. For much of the period they
    appear as many local 'city lords', not one state. Herodotus' Median empire (Deioces and
    his successors) has been questioned (Sancisi-Weerdenburg and others).
  - >-
    Cyaxares (Umakishtar) allied with Nabopolassar in the fall of Ashur (614) and Nineveh
    (612). Cyrus defeated Astyages c. 550 (Nabonidus Chronicle).
  - >-
    Daniel's Median kingdom between Babylon and Persia (the four-kingdoms schema) is not historical,
    and 'Darius the Mede' is otherwise unattested. Cross-refer darius-the-mede.
  - >-
    Ecbatana (Hamadan) served as an Achaemenid summer capital, which makes Ezra 6:2 plausible
    in setting.
  sources_to_check:
  - >-
    Lanfranchi, Roaf and Rollinger (eds.), Continuity of Empire (?) - Assyria, Media, Persia
    (2003)
