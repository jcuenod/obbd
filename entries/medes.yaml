scope: >-
  The Iranian-speaking Medes of the Zagros and their polity centred on Ecbatana, allies of
  Babylon in destroying Assyria and later absorbed by Cyrus. Covers Median history and its
  uncertainties, and the place of 'Media' in the Bible, including Daniel's Median kingdom.
