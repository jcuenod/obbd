editorial:
  author_notes:
  - >-
    The Babylonian Chronicle for 609 shows Egypt going to aid Assyria at Harran. This clarifies
    2 Kgs 23:29, which says Necho went up 'to' (not 'against') the king of Assyria.
  - >-
    The historicity and extent of the reform and of Josiah's northward expansion are heavily
    debated (minimalist and maximalist positions; the absence of iconic material in late 7th-century
    bullae; persistence of pillar figurines).
  - >-
    Deuteronomy's dependence on Assyrian treaty forms (Esarhaddon's Succession Treaty) is
    relevant to the 'book of the law'. Present it as a scholarly hypothesis about Deuteronomy,
    not about Josiah.
  - >-
    Bullae of officials named in 2 Kgs 22-23 and Jeremiah (e.g. Nathan-melech) give a prosopographical
    context.
  sources_to_check:
