  circa: true
  display: c. 640–609 BCE
scope: >-
  Josiah son of Amon, king of Judah, remembered for the discovery of the 'book of the law'
  and a cult reform, and killed at Megiddo by Necho II in 609. No extrabiblical text names
  him. He is approached through the Babylonian Chronicle, late 7th-century seals and bullae,
  and the archaeology of Judah.
