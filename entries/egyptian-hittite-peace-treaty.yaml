  circa: true
  display: c. 1259 BCE
scope: >-
  The parity treaty concluded about 1259 BCE between Ramesses II of Egypt and Ḫattušili III
  of Ḫatti, preserved in Akkadian cuneiform tablets from Ḫattuša and in hieroglyphic versions
  at Karnak and the Ramesseum. It sets out non-aggression, mutual defence, support for succession,
  and extradition of fugitives between "brothers".
