id: tebtynis-salt-merchants-papyrus
title: Tebtynis Salt-Merchants Papyrus
aliases: [P.Mich. V 245]
type: artifact
cultures: [roman, egyptian]
date:
  from: 47
  to: 47
  display: 47 CE
scope: >-
  A papyrus of 47 CE recording the Tebtynis salt merchants' rules for trade, taxation, leadership,
  shared funds, monthly drinking gatherings, and penalties for noncompliance. It is a contemporary
  documentary example of an association regulating its members, finances, and gatherings,
  from Roman Egypt.
passages:
- ref: Acts 19:24-27
  rel: practice
  note: >-
    A contemporary Egyptian trade association supplies a regional comparison for artisan organization
- ref: 1Cor 11:17-22
  rel: practice
  note: >-
    Regulated shared drinking offers comparative evidence for organized communal gatherings
    and obligations
related:
- greco-roman-associations
