  accession: null
media: []
external: {}
editorial:
  author_notes:
  - The correct primary reference is P.Mich. V 245, not P.Mich. V 243.
  - >-
    The document regulates beer drinking but does not require idol meals or document Paul's
    congregation.
  - >-
    Egyptian association rules are a regional comparison and must not be generalized into
    universal Roman law.
  - >-
    The artifact designation follows the surviving papyrus; a broader corpus could instead
    be a text entry.
  sources_to_check:
  - P.Mich. V 245 = GRA III 219 = AGRW 302 (Ann Arbor inv. 657)
