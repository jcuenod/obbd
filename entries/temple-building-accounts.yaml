editorial:
  author_notes:
  - >-
    Hurowitz's comparative study is the standard treatment of the pattern. Key comparanda
    are Gudea Cylinders A and B, the building of Baal's palace (KTU 1.4 V-VII), and Assyrian
    and Neo-Babylonian royal building inscriptions (Tiglath-pileser I, Esarhaddon, Nabopolassar,
    Nebuchadnezzar II).
  - >-
    Note royal ideology. Temple building legitimates kingship and follows victory and rest
    (2 Sam 7; 1 Kgs 5:3-5).
  - >-
    The Mesopotamian practice of restoring temples on their original foundations, with laments
    at demolition and rebuilding, is relevant to Ezra 3 and Haggai and Zechariah (Boda and
    Novotny, eds.). The kalû-rite proposals for Zech 4 should be marked as debated.
  - >-
    The account in 1 Kgs 5-9 combines building report, archival details, and Deuteronomistic
    prayer. Do not treat it as a single genre piece.
  sources_to_check:
  - Victor Avigdor Hurowitz, I Have Built You an Exalted House (JSOTSup 115, 1992)
  - >-
    Mark J. Boda and Jamie Novotny, eds., From the Foundations to the Crenellations (AOAT
    366, 2010)
