id: temple-building-accounts
title: Temple-Building Accounts
type: concept
cultures: [ane, sumerian, assyrian, ugaritic]
scope: >-
  The ancient Near Eastern genre and pattern of temple-building narratives: divine command,
  preparation of materials and labour, construction, dedication with festivities, and blessing.
  Covers the comparative background of the tabernacle and Solomon's and the Second Temple
  building accounts.
