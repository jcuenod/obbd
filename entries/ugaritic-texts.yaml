editorial:
  author_notes:
  - >-
    Explain the 30-sign alphabetic cuneiform, the abecedaries, and the multilingual archive
    (Akkadian, Hurrian, Hittite).
  - >-
    Correct the old misconception that KTU 1.23 contains 'cooking a kid in its mother's milk'
    (Exod 23:19). The reading has been abandoned.
  - >-
    Warn against 'pan-Ugaritism' (e.g. Dahood's Psalms commentary). Lexical comparisons need
    checking case by case.
  - >-
    Ugarit is a Late Bronze Age north Syrian city, not 'Canaanite religion' in general. The
    gap of several centuries before most biblical texts must be acknowledged.
