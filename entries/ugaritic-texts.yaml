id: ugaritic-texts
title: Ugaritic Texts (Corpus)
type: text
cultures: [ugaritic]
date:
  from: -1400
  to: -1185
  circa: true
  display: c. 1400–1185 BCE
scope: >-
  The texts written in the alphabetic cuneiform script found from 1929 at Ras Shamra (Ugarit)
  and Ras Ibn Hani, including myths, epics, rituals, letters and administrative records of
  the 14th and 13th centuries. This entry covers the corpus and its significance for Hebrew
  language, poetry and religion. Individual compositions have their own entries.
