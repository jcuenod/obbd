id: papyrus-amherst-63
title: Papyrus Amherst 63
type: artifact
cultures: [aramean, egyptian]
scope: >-
  An Aramaic religious anthology written in Egyptian Demotic script, which preserves a close
  parallel to Psalm 20 and traditions of Aramaic-speaking communities in Egypt. The entry
  distinguishes the surviving papyrus from the dates of its compositions.
passages:
- ref: Ps 20:1-9
  rel: parallel
  note: >-
    A close Aramaic parallel; the direction and history of the relationship remain debated;
    MT 20:2-10
related: [elephantine-papyri, aramaic-language, royal-ideology]
location:
  institution: Morgan Library & Museum, New York
  accession: null
