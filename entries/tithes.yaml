editorial:
  author_notes:
  - >-
    Ugaritic administrative texts record a royal tithe (maʿšr). The Neo-Babylonian temple
    tithe (ešrû) at Eanna (Uruk) and Ebabbar (Sippar) is richly documented (M. Jursa, Der
    Tempelzehnt in Babylonien, AOAT 254, 1998).
  - >-
    The tithe was both a royal tax and a cultic due (1 Sam 8:15, 17; Bethel as royal sanctuary).
    Note the debate over which came first.
  - >-
    Explain the tension between Deut 14 (tithe eaten by the offerer at the sanctuary) and
    Num 18 (tithe given to the Levites), and later harmonizations into first, second and poor
    tithes (Tobit; Jubilees; rabbinic law).
