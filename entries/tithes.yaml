title: Tithes
aliases: [Tithe, Maʿaśer]
type: practice
cultures: [hebrew, ugaritic, babylonian]
scope: >-
  The tenth of produce and livestock given to sanctuary, priests, Levites, the poor or the
  king. The entry covers the varied biblical tithe laws and narratives, and the royal and
  temple tithes of Ugarit and Neo-Babylonian Mesopotamia.
