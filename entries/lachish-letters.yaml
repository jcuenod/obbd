editorial:
  author_notes:
  - >-
    Letter 4 ('we cannot see Azekah') is often read as evidence that Azekah had already fallen,
    following Jer 34:7. This is possible but not certain.
  - >-
    Letter 3 mentions 'the prophet' and a letter he delivered. Identifications with Jeremiah
    or with Uriah (Jer 26:20-23) were popular early on but are now generally regarded as unprovable.
  - >-
    Letter 3 is also a key text for the literacy debate, since the writer protests that he
    can read a letter himself.
  - >-
    Discuss the letter formulas (greeting, 'may YHWH cause my lord to hear good news', oath
    'as YHWH lives') and the Yahwistic personal names.
  - Use the KAI 192-199 numbers alongside the excavation (Lachish 1-21) numbers.
