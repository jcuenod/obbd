id: lachish-letters
title: Lachish Letters (Ostraca)
aliases: [Lachish Ostraca]
type: artifact
cultures: [judahite]
date:
  from: -589
  to: -586
  circa: true
  display: c. 589–586 BCE
scope: >-
  A group of Hebrew ostraca, mostly letters, found in 1935 and 1938 in the gate area of Lachish
  (Tell ed-Duweir) in the destruction layer of the Babylonian conquest. Most are addressed
  to Yaʾush, apparently the commander at Lachish, by a subordinate named Hoshayahu.
passages:
- ref: Jer 34:6-7
  rel: event
  note: Lachish and Azekah the last fortified cities holding out against Babylon
- ref: Jer 6:1
  rel: language
  note: maśʾēt 'fire signal'; Letter 4 watches for the signals of Lachish
- ref: Jer 38:4
  rel: language
  note: '''Weakening the hands'' of soldiers; the same idiom in Letter 6'
- ref: Jer 26:20-23
  rel: attests
  disputed: true
  note: Letter 3's commander Coniah son of Elnathan goes to Egypt; cf. Elnathan son of Achbor
- ref: 2Kgs 25:1-4
  rel: event
  note: Babylonian siege of Judah in Zedekiah's last years
- ref: 2Kgs 5:6
  rel: form
  note: Letter body introduced by 'and now' (wĕʿattâ), as in the ostraca
