editorial:
  author_notes:
  - >-
    Iconographic evidence includes the Black Obelisk (Israelite tribute bearers in long fringed
    garments and caps), the Lachish reliefs (Judahite men in short tunics with headbands,
    women in long mantles), and the Beni Hasan painting (multicoloured garments of Asiatics).
    The last is often adduced for Gen 37:3 but is centuries earlier.
  - >-
    The meaning of kĕtōnet passîm (LXX 'many-coloured'; others 'long-sleeved' or 'reaching
    to palms and soles') is debated.
  - >-
    The hem or corner carried legal and personal identity. At Mari, a prophet's hair and hem
    (sissiktum) were sent with reports. This is background for 1 Sam 24 and Ruth 3:9.
  - The Meṣad Ḥashavyahu ostracon illustrates the garment-pledge law in practice.
