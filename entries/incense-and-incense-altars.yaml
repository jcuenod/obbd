editorial:
  author_notes:
  - >-
    Wellhausen's view that incense offering was a late (post-exilic) development is contradicted
    by Iron Age incense altars and burners. Note this correction.
  - >-
    Two limestone altars from the Arad shrine had organic residues analysed in 2020 (Arie,
    Rosen, and Namdar, Tel Aviv 47), with reported frankincense on one and cannabis on the
    other. Verify details before stating them.
  - >-
    ḥammān has been linked to inscribed incense altars in Palmyrene and other Aramaic inscriptions
    (ḥmn). The identification is plausible but has been debated.
  - >-
    The South Arabian incense trade explains much of the archaeology. Cross-reference incense-trade
    and sheba.
