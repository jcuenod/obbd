id: astarte
title: Astarte (Ashtoreth)
aliases: [Ashtoreth, ʿAštart, ʿAṯtartu]
type: deity
cultures: [phoenician, ugaritic, canaanite]
scope: >-
  Astarte (Hebrew ʿAštōret, a deliberate vocalization after bōšet "shame"), a major West Semitic
  goddess of war, sexuality and royal power, attested at Ugarit and Emar, in Egypt, and especially
  as the chief goddess of Sidon and Tyre. The plural ʿaštārôt is used in the Hebrew Bible
  for goddesses generally.
