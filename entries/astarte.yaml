editorial:
  author_notes:
  - >-
    Explain the vocalization ʿAštōret as a bōšet distortion of ʿAštart; the Greek Astartē
    preserves the original.
  - >-
    Astarte is called "name of Baal" (šm bʿl) in KTU 1.16 VI and in the Eshmunazar inscription;
    relevant to name theology.
  - >-
    Do not conflate Astarte with Asherah or Ishtar, though some syncretism (especially with
    Ishtar) occurred; distinguish them clearly.
  - >-
    Treat "sacred prostitution" in her cult as a largely discredited classical and modern
    construct.
