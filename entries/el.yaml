editorial:
  author_notes:
  - >-
    Give El's Ugaritic epithets (ṯr il "Bull El", ltpn il dpid "Kindly El the Compassionate",
    ab adm "father of humanity", bny bnwt "creator of creatures", mlk) and his abode "at the
    source of the rivers, amid the springs of the two deeps".
  - >-
    Present the main models for El and YHWH: early identification (Cross), originally distinct
    gods later merged (Smith, Eissfeldt), and the patriarchal "religion of El" (Alt; Exod
    6:3); none is settled.
  - >-
    Note the theophoric name Israel and the absence of El-Baal hostility in the Bible; El
    language was absorbed, Baal language contested.
  - >-
    Caution against treating every ʾēl in Hebrew as the Canaanite god; it is also the common
    noun "god".
