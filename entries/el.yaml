id: el
title: El
type: deity
cultures: [canaanite, ugaritic, phoenician, hebrew]
scope: >-
  El (ʾil), both the common Semitic word for "god" and the proper name of the aged creator,
  father and king who heads the Ugaritic pantheon and divine assembly. The entry covers El
  in Ugaritic and other West Semitic sources and the reception of El names and attributes
  in the Hebrew Bible's portrayal of YHWH.
passages:
- ref: Gen 14:18-22
  rel: language
  note: El Elyon 'creator of heaven and earth'; cf. Phoenician ʾl qn ʾrṣ
- ref: Gen 16:13; 21:33
  rel: language
  note: 'Patriarchal El epithets: El Roi, El Olam'
- ref: Gen 33:20; 35:7
  rel: language
  note: El-Elohe-Israel at Shechem; El-Bethel
- ref: Exod 6:2-3
  rel: concept
  note: YHWH identified with the El Shaddai of the ancestors
- ref: Gen 49:24-25
  rel: language
  note: El of your father and Shaddai, blessings of breasts and womb
- ref: Deut 32:8-9
  rel: concept
  note: Elyon apportions the nations among the sons of God (4QDeutj; MT 'sons of Israel')
- ref: Ps 82:1
  rel: concept
  note: God stands in 'the council of El' (ʿădat-ʾēl)
- ref: Isa 14:13
  rel: imagery
  note: '''Stars of El'' and the mount of assembly'
- ref: Ezek 28:2
  rel: imagery
  note: '''I am El, I sit in the seat of gods in the heart of the seas'''
- ref: Num 23:22
  rel: imagery
