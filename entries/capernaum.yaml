editorial:
  author_notes:
  - >-
    The Franciscans (Corbo, Loffreda) excavated the western part of the site and the Greek
    Orthodox the eastern part. Capernaum was a modest village of perhaps 1,000-1,500 people.
  - >-
    The white limestone synagogue dates to the fourth or fifth century CE (dating debated).
    It stands on basalt walls and a floor that some date to the first century and identify
    with the synagogue of Luke 7:5. This is possible, not proven.
  - >-
    The 'House of Peter' was a house venerated from an early date, then enclosed (fourth century)
    and replaced by an octagonal church (fifth century). The identification with Peter rests
    on tradition and graffiti and should be presented with caution.
  sources_to_check:
  - Reed, Archaeology and the Galilean Jesus (2000)
  - NEAEHL
