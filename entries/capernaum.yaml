title: Capernaum
aliases: [Kefar Naḥum, Tell Hum]
type: site
cultures: [jewish, roman]
scope: >-
  The fishing village on the northwest shore of the Sea of Galilee that served as the base
  of Jesus' Galilean ministry. Covers the village houses, the 'House of Peter' and later church,
  and the white limestone synagogue and its basalt foundations.
