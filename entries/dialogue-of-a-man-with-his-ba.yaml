id: dialogue-of-a-man-with-his-ba
title: Dialogue of a Man with His Ba
aliases: [Dispute between a Man and His Ba, Debate between a Man and His Soul, Dispute over
    Suicide]
type: text
cultures: [egyptian]
date:
  from: -1900
  to: -1800
  circa: true
  display: c. 1900–1800 BCE
scope: >-
  A Middle Kingdom poetic dialogue (P. Berlin 3024, beginning lost) between a man weary of
  life and his ba. The man contemplates death as release. The ba urges him to forget care
  and enjoy life, and warns that funerary provision gives no certainty. The entry covers its
  themes of despair, death-wish, and carpe diem.
passages:
- ref: Job 3:20-23
  rel: parallel
  note: Longing for death that does not come, by one bitter in soul
- ref: Eccl 4:2-3
  rel: parallel
  note: The dead (or unborn) more fortunate than the living
- ref: Eccl 9:7-10
  rel: parallel
  note: The ba's counsel to 'follow the happy day' and forget care
- ref: Ps 12:1-2
  rel: parallel
  note: '''To whom can I speak today?'': lament over universal faithlessness; MT 12:2-3'
- ref: Mic 7:2-6
  rel: parallel
  note: The faithful have vanished; neighbours and kin cannot be trusted
