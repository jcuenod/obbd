editorial:
  author_notes:
  - >-
    The comparisons with Job and Qoheleth are typological (shared reflection on despair and
    death), not genetic.
  - >-
    Interpretation is contested. Some see a debate about suicide, others about the value of
    funerary provision and the afterlife. Translations of key passages differ considerably
    (compare Lichtheim, Parkinson, Allen).
  - >-
    The man's four poems ("Death is before me today...", "To whom can I speak today?") are
    among the finest Egyptian lyric. Quote them in a recent translation.
