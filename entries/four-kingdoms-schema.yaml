id: four-kingdoms-schema
title: The Four Kingdoms Schema
type: concept
cultures: [jewish, persian, greek]
scope: >-
  The scheme of four successive world empires, followed by a final, divinely established kingdom,
  in Dan 2 and 7. The entry covers its antecedents and parallels (the Assyria-Media-Persia
  sequence in Greek historiography, Hesiod's metal ages, Persian and Babylonian texts) and
  its later reinterpretation, especially as Rome.
passages:
- ref: Dan 2:31-45
  rel: concept
  note: Statue of four metals destroyed by the stone; God's everlasting kingdom
- ref: Dan 7:1-27
  rel: concept
  note: Four beasts from the sea and the kingdom given to the holy ones
- ref: Dan 8:20-22
  rel: concept
  note: Ram (Media and Persia) and he-goat (Greece) identified
- ref: Rev 13:1-2
  rel: imagery
  note: One beast combining features of Daniel's four beasts
- ref: 2Esd 12:10-12
  rel: concept
  note: Eagle vision reinterprets Daniel's fourth kingdom (as Rome)
related: [darius-the-mede, composite-beasts-daniel, antiochus-iv, medes, persia, zoroastrianism,
  messianic-expectations]
media: []
