editorial:
  author_notes:
  - >-
    Critical consensus identifies Daniel's kingdoms as Babylon, Media, Persia, and Greece
    (with the Seleucids). The traditional sequence of Babylon, Medo-Persia, Greece, and Rome
    should be presented as reception history.
  - >-
    Antecedents: the Assyria-Media-Persia succession (Herodotus, Ctesias), later extended
    to Macedonia and Rome (Aemilius Sura in Velleius Paterculus 1.6.6; Sib. Or. 4.49-101).
  - >-
    Hesiod's ages (Works and Days 106-201) supply metal imagery. The Zand-i Wahman Yasn's
    metal tree is attested only late, so the direction of dependence is debated.
  - >-
    Mention the Babylonian Dynastic Prophecy as a Hellenistic-period ex eventu sequence of
    empires.
  sources_to_check:
  - >-
    J. W. Swain, 'The Theory of the Four Monarchies: Opposition History under the Roman Empire',
    Classical Philology 35 (1940)
  - J. J. Collins, Daniel (Hermeneia, 1993)
