editorial:
  author_notes:
  - >-
    Extrabiblical evidence includes the Amman Citadel Inscription (often read as an oracle
    of Milkom) and theophoric names such as Milkomʾur on the Tell el-ʿUmeiri seal impression
    naming a servant of Baʿalyašaʿ (cf. Baalis, Jer 40:14). Verify readings.
  - >-
    Milkom is distinct from Molek despite their shared root mlk; 1 Kgs 11:7 is commonly regarded
    as a textual confusion.
  - >-
    Ammonite stone heads and statues with atef-like crowns may depict kings or deities; their
    identification with Milkom is uncertain.
  sources_to_check:
