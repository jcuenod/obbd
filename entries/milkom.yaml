id: milkom
title: Milkom
aliases: [Milcom, Malcam]
type: deity
cultures: [ammonite]
scope: >-
  Milkom, the national god of Ammon, attested in the Hebrew Bible and in Ammonite inscriptions
  and seals. Several biblical occurrences depend on the vocalization of the consonants mlkm
  ("Milkom" or "their king").
passages:
- ref: 1Kgs 11:5, 33
  rel: attests
  note: Solomon follows 'Milcom the abomination of the Ammonites'
- ref: 2Kgs 23:13
  rel: attests
  note: Josiah defiles the high place of Milcom
- ref: Jer 49:1, 3
  rel: language
  note: MT malkām 'their king'; LXX and many moderns read Milcom
- ref: Zeph 1:5
  rel: language
  note: Those who swear by malkām, often read as Milcom
- ref: 2Sam 12:30
  rel: language
  disputed: true
  note: Crown of malkām (Milcom or 'their king') taken at Rabbah
- ref: Amos 1:15
  rel: language
  disputed: true
  note: '''Their king'' (malkām) goes into exile; cf. Jer 49:3'
