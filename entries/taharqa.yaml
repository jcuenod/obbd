scope: >-
  Kushite pharaoh of the Twenty-fifth Dynasty, a major builder in Egypt and Nubia. He fought
  the Assyrians and lost Memphis to Esarhaddon in 671. In Kings and Isaiah he is named as
  "Tirhakah king of Cush", marching against Sennacherib in 701, a reference central to debates
  on that campaign's chronology.
