editorial:
  author_notes:
  - >-
    Taharqa reigned from c. 690, so calling him "king" in 701 is anachronistic. The options
    are prolepsis by a later narrator, his role as a prince commanding under his predecessor
    (the Kawa stelae report him coming north as a youth), or the largely abandoned two-campaign
    theory.
  - >-
    The revised Kushite chronology (Shebitku before Shabaka) makes his presence in Egypt by
    701 more plausible. Explain the state of the question.
  - Sennacherib's annals report an Egyptian-Kushite force defeated at Eltekeh (701).
  - >-
    Esarhaddon's Zincirli (Sam'al) stele depicts a kneeling figure usually identified as Taharqa's
    son Ushanahuru. It shows Assyrian propaganda against the Kushites.
