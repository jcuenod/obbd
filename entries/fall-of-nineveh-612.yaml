scope: >-
  The capture and destruction of the Assyrian capital in the summer of 612 BCE by Babylonian
  and Median forces under Nabopolassar and Cyaxares (Umakištar), which ended Assyria as an
  imperial power. The entry covers the event, its archaeology and its biblical echoes; the
  Babylonian chronicle that reports it has its own entry.
