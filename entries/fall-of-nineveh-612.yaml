editorial:
  author_notes:
  - >-
    Sequence: Assur fell to the Medes in 614; Nineveh fell in the month Abu 612 after a siege
    of about three months; Sin-šar-iškun died; Aššur-uballiṭ II held out at Harran until 610,
    and an Egyptian-backed attempt to retake it failed in 609. The fall of Nineveh was therefore
    not quite the end of Assyria.
  - >-
    Excavations at the Halzi Gate (Stronach) found skeletons of defenders and gateways narrowed
    for a last defence, which vividly confirm a violent end.
  - >-
    The story that a flood breached the walls comes from Ctesias via Diodorus, not from Babylonian
    sources. Do not use it to make Nah 2:6 eyewitness detail. Whether Nahum was composed before
    or after 612 is debated; the terminus post quem is the fall of Thebes (663).
  - >-
    Note the reception of Nineveh's fall in Jonah, Tobit and Greek historiography (Herodotus'
    'Assyrian logoi', Xenophon's ruined 'Mespila').
  sources_to_check:
