    Michael Jursa, "Nabû-šarrūssu-ukīn, rab ša-rēši, und 'Nebusarsekim' (Jer. 39:3)," NABU
    2008/1, no. 5, 9-10
  - >-
    Henry Stadhouders, "The Nebu(!)sarsekim Tablet, BM 114789 (1920-12-13, 81): Some Provisional
    Remarks"
  - British Museum collection record, 1920,1213.81 / BM 114789
  image_query: Nebo-Sarsekim tablet British Museum
