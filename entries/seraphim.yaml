id: seraphim
title: Seraphim
aliases: [seraph, śərāpîm]
type: concept
cultures: [judahite, egyptian]
scope: >-
  The seraphim (from śrp "burn"), the six-winged attendants of Isaiah's throne vision, and
  the "fiery serpents" (śərāpîm) of the wilderness and prophetic oracles. The entry covers
  their background in the Egyptian winged uraeus as adopted in Iron Age Judahite iconography.
passages:
- ref: Isa 6:2-7
  rel: imagery
  note: Six-winged seraphim proclaim holiness; one touches Isaiah's lips with a coal
- ref: Num 21:6-9
  rel: imagery
  note: Fiery serpents (śərāpîm) bite Israel; Moses makes a śārāp on a pole
- ref: Deut 8:15
  rel: imagery
  note: Wilderness of fiery serpents and scorpions
- ref: Isa 14:29
  rel: imagery
  note: A 'flying fiery serpent' (śārāp məʿôpēp)
- ref: Isa 30:6
  rel: imagery
  note: Viper and flying seraph in the Negeb
related: [nehushtan, cherubim, divine-council, seals-and-bullae, divine-wings, ezekiel-throne-chariot]
