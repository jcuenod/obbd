editorial:
  author_notes:
  - >-
    The serpent identification is the dominant critical view (Keel; Joines), based on śārāp
    as serpent elsewhere and on four-winged uraei on 8th-century Judahite and Israelite seals;
    some prefer a non-serpentine burning being.
  - >-
    The uraeus's protective, fire-spitting role and its covering wings help explain the seraphim
    covering face and feet.
  - >-
    Do not overstate Egyptian influence as direct borrowing; the motif came through Phoenician
    and Levantine mediation.
  sources_to_check:
