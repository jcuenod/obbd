editorial:
  author_notes:
  - >-
    The Mesha Stele (line 3) records Mesha building "this bmt for Chemosh". It is the key
    extrabiblical attestation of the term.
  - >-
    Bāmâ does not necessarily mean a hilltop. High places could be in valleys (Jer 7:31) or
    at gates (2 Kgs 23:8). The basic sense ("back" or "ridge", hence a raised platform) is
    debated (Vaughan, 1974; Barrick, 2008).
  - >-
    Archaeological identifications (e.g. the Tel Dan platform, often called a "bamah") are
    interpretive. Present them as such.
  - >-
    The negative evaluation is Deuteronomistic and tied to centralization. Before the reforms,
    high places were normal YHWH sanctuaries.
