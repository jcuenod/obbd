external: {}
editorial:
  author_notes:
  - >-
    The imagery draws on building practice (foundation-laying, measuring line, cornerstone).
    Note the overlap with temple-building language and the "temple as cosmos" idea.
  - >-
    Egyptian sources picture the sky held up by four supports or by Shu. Mesopotamian sources
    speak of the "foundations" and "bonds" of heaven and earth. Present these as comparable
    images, not one shared doctrine.
  - >-
    Job 26:7 ("hangs the earth upon nothing") stands beside pillar language in the same book.
    Use this to caution against reconstructing a single fixed model.
