editorial:
  author_notes:
  - >-
    The 1996 royal dedicatory inscription naming ʾkyš (Achish/Ikausu) son of Padi, ruler of
    Ekron, confirmed the Tel Miqne identification. Padi is also known from Sennacherib's annals.
  - >-
    Iron I Philistine levels (Dothan and Gitin, 1981-96) include locally made Aegean-style
    pottery and hearths.
  - >-
    The seventh-century industrial zone, with over 100 olive presses, is a showcase of the
    Assyrian-era economy. The city was destroyed by Nebuchadnezzar c. 604-603.
  - Cross-refer baal-zebub for the 'lord of flies' / Baal-zebul polemical deformation.
