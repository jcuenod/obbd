editorial:
  author_notes:
  - >-
    The twenty-year reign in 2 Kgs 15:27 cannot fit the Assyrian synchronisms. Explain the
    proposals (rival kingdom in Gilead from c. 750, scribal error) and choose none.
  - >-
    Tiglath-pileser's summary inscriptions describe the deportations from Galilee (cf. 2 Kgs
    15:29) and the change of king.
  - >-
    Isaiah's refusal to name Pekah ('son of Remaliah') may be contemptuous. This is a common
    reading.
