cultures: [israelite]
date:
  from: -735
  to: -732
  circa: true
  display: c. 735–732 BCE
scope: >-
  Pekah son of Remaliah, king of Israel, who joined Rezin of Damascus against Assyria and
  Judah in the Syro-Ephraimite war. Tiglath-pileser III claims that the Israelites overthrew
  Pekah (Paqaḫa) and that he installed Hoshea in his place.
passages:
- ref: 2Kgs 15:25
  rel: event
  note: Pekah assassinates Pekahiah
- ref: 2Kgs 15:27-31
  rel: event
  note: Reign, Tiglath-pileser's annexation of Galilee and Gilead, and Pekah's murder by Hoshea
- ref: 2Kgs 16:5-9
  rel: event
  note: Rezin and Pekah besiege Jerusalem; Ahaz appeals to Assyria
- ref: Isa 7:1-9
  rel: event
  note: Isaiah's oracle against the 'two smouldering stumps', Rezin and the son of Remaliah
- ref: 2Chr 28:5-8
  rel: event
  note: The Chronicler's account of Pekah's victory over Judah
