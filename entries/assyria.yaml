editorial:
  author_notes:
  - >-
    Distinguish Old, Middle and Neo-Assyrian Assyria. The Neo-Assyrian heartland cities were
    Ashur, Nimrud (Kalḫu), Khorsabad (Dur-Sharrukin) and Nineveh.
  - >-
    Assyrian sources give rich synchronisms. They name Ahab (853), Jehu (841), Joash, Menahem,
    Pekah, Hoshea, Ahaz, Hezekiah and Manasseh. The eponym list, anchored by the eclipse of
    763, underlies biblical chronology.
  - >-
    Assyrian imperial ideology and treaty language (especially Esarhaddon's Succession Treaty)
    are widely seen as shaping Deuteronomy and First Isaiah. Present this as a major consensus
    line with variants.
  - Deportation worked in both directions. Its scale and demographic effects are debated.
  - The empire fell with Ashur (614), Nineveh (612) and Harran (610-609).
  sources_to_check:
  - Radner, Ancient Assyria - A Very Short Introduction (2015)
  - Frahm (ed.), A Companion to Assyria (2017)
