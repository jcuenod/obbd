editorial:
  author_notes:
  - >-
    Albright held that lime-plastered cisterns made Iron I highland settlement possible. This
    is now revised, since such cisterns are earlier and many villages relied on other sources.
  - >-
    Monumental systems at Megiddo, Hazor, Gibeon, and Beersheba are mostly dated to Iron II
    (9th-8th centuries) rather than to Solomon. Their dating is tied to the chronology debate.
  - >-
    In Jerusalem, Reich and Shukron reinterpreted Warren's Shaft as not used for water drawing
    in the Iron Age. They also identified a Middle Bronze spring tower. This affects readings
    of 2 Sam 5:8.
