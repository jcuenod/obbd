editorial:
  author_notes:
  - >-
    Rimmon is the Akkadian epithet Rammānu, vocalized in Hebrew to resemble rimmôn "pomegranate";
    explain the pun.
  - >-
    Zech 12:11 is debated: a lament for a dying god (Hadad-rimmon), a place name near Megiddo,
    or the mourning for Josiah; do not settle it.
  - >-
    The Tell Fekheriye statue (Hadad of Sikan) and Zincirli Hadad statue are key inscriptional
    sources; Ugaritic Baal is Hadad under another title.
