scope: >-
  Hadad (Akkadian Adad, Addu), the storm god of Syria and Mesopotamia, chief god of the Aramean
  kingdoms and especially Damascus, where he was called Rimmon (Akkadian Rammānu, "thunderer").
  The entry covers the god, his iconography, and Hadad and Rimmon names in the Bible.
