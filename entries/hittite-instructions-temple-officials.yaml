  - J. Milgrom, Studies in Levitical Terminology I (1970)
  - >-
    J. L. Miller, Royal Hittite Instructions and Related Administrative Texts (SBLWAW 31,
    2013)
  - A. Taggar-Cohen, Hittite Priesthood (THeth 26, 2006)
