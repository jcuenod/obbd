id: aramaic-language
title: Aramaic Language and Script
aliases: [Biblical Aramaic, Imperial Aramaic]
type: concept
cultures: [aramean, persian]
scope: >-
  The Aramaic language and script from the earliest Old Aramaic royal inscriptions through
  Imperial (Achaemenid) Aramaic to the Aramaic of the Second Temple period. The entry covers
  the Aramaic portions of the Hebrew Bible, Aramaic words in the New Testament, and the origin
  of the Jewish square script.
