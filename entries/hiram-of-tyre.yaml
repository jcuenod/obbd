editorial:
  author_notes:
  - >-
    Josephus (Ag. Ap. 1.106-127; Ant. 8.141-149) cites Tyrian records for Hiram's reign and
    works. Assess their reliability and their use in the Tyrian king-list chronology (and
    the founding of Carthage).
  - >-
    Dates vary by reconstruction (c. 980-947 or c. 969-936). Note the difficulty of Hiram
    dealing with both David (early in David's reign) and Solomon.
  - >-
    Distinguish King Hiram from Hiram (Huram-abi) the bronze-worker of 1 Kgs 7:13-14 and 2
    Chr 2:13-14.
  - >-
    Archaeological context for Tyre in the 10th century is limited. Expansion to Cyprus and
    the west is mostly later.
