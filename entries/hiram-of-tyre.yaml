scope: >-
  Hiram I, king of Tyre, partner of David and Solomon in building projects and maritime trade.
  No contemporary inscription names him. He is known from Kings and Chronicles and from Tyrian
  annals as excerpted by Josephus from Menander of Ephesus and Dius.
