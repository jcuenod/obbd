id: nabopolassar
title: Nabopolassar
aliases: [Nabû-apla-uṣur]
type: person
cultures: [babylonian]
date:
  from: -626
  to: -605
  display: 626–605 BCE
scope: >-
  Founder of the Neo-Babylonian (Chaldean) dynasty, who seized Babylon in 626 BCE, threw off
  Assyrian rule and, allied with the Medes, destroyed Assyria (Assur 614, Nineveh 612, Harran
  610). The Bible never names him, but his reign is the setting for Nahum, Zephaniah 2, Habakkuk
  1 and the death of Josiah.
passages:
- ref: Nah 2:1-3:19
  rel: event
  note: Oracles on the fall of Nineveh, taken by Nabopolassar and the Medes in 612 (MT 2:2-3:19)
- ref: Zeph 2:13-15
  rel: event
  note: Nineveh to become a desolation
- ref: Hab 1:5-11
  rel: setting
  note: YHWH rouses the Chaldeans, a new power sweeping the region
- ref: 2Kgs 23:29
  rel: event
  note: Necho marches to aid Assyria against Babylon (609); Josiah killed at Megiddo
- ref: Jer 46:2
  rel: event
  note: Necho defeated at Carchemish (605) by Nabopolassar's crown prince Nebuchadnezzar
related: [fall-of-nineveh-612, fall-of-nineveh-chronicle, nebuchadnezzar-ii, babylonia, medes,
  battle-of-carchemish, babylonian-chronicles, etemenanki]
