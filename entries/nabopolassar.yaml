editorial:
  author_notes:
  - >-
    His origins are debated. His own inscriptions call him 'son of a nobody' (mār lā mammāna);
    some link his family to Uruk. 'Chaldean' as a dynastic label comes from later Greek and
    biblical usage.
  - >-
    The Babylonian chronicles (ABC 2-4) give a year-by-year account of his reign, including
    the Median alliance and the campaigns of 616-609. Use them for the chronology rather than
    Greek writers.
  - >-
    His building inscriptions (e.g. the restoration of Etemenanki) present him as a humble,
    god-chosen restorer. This is useful for royal ideology and temple-building comparisons.
  - >-
    He died in August 605, just after Carchemish, and Nebuchadnezzar hurried back to Babylon
    to take the throne.
  sources_to_check:
  - A. K. Grayson, Assyrian and Babylonian Chronicles (1975), Chronicles 2-4
  - >-
    R. Da Riva, The Inscriptions of Nabopolassar, Amēl-Marduk and Neriglissar (SANER 3, 2013)
