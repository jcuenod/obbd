scope: >-
  A Middle Egyptian royal instruction set in the Herakleopolitan period, in which an elder
  king advises his son Merikare on ruling, justice, rebels, the eastern frontier and the judgment
  of the dead. It ends with a hymn to the creator who made the world for humankind, "his images
  who came from his body".
