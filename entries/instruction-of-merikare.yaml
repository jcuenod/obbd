editorial:
  author_notes:
  - >-
    The text is attributed to a Herakleopolitan king (traditionally Khety) but was probably
    composed in the late First Intermediate Period or early 12th Dynasty. The main manuscripts
    (P. Hermitage 1116A, P. Moscow, P. Carlsberg VI) are 18th Dynasty. Say this in the article.
  - >-
    The closing hymn ('well tended is humankind, the cattle of god') is the strongest Egyptian
    parallel to Gen 1:26-28 and Ps 8. Note the difference: in Merikare all humans are the
    god's images, whereas in Egyptian royal ideology the king is the image par excellence.
    Compare this with the biblical democratization of the image.
  - >-
    The saying preferring the upright's character to the wicked's offering is a good comparandum
    for prophetic and sapiential critiques of sacrifice (Prov 21:3; 1 Sam 15:22; Hos 6:6).
    Treat it as typological.
  - >-
    The weighing-of-the-heart imagery sometimes cited for Prov 16:2 belongs to the Book of
    the Dead rather than to Merikare, which speaks of a tribunal of the dead. Do not conflate
    them.
