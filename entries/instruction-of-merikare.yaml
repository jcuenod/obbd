- ref: Gen 1:26-27
  rel: concept
  note: Humans as the creator's images; cf. 'his images who came from his body'
- ref: Ps 8:5-8
  rel: concept
  note: >-
    Humans given rule over animals, birds and fish; cf. sky, earth and food made 'for their
    sake' (MT 8:6-9)
- ref: Gen 2:7
  rel: concept
  note: Breath of life placed in human nostrils; cf. 'he made breath for their noses to live'
- ref: Prov 15:8; 21:3, 27
