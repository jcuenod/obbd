editorial:
  author_notes:
  - >-
    Ashurbanipal's annals describe the Assyrian sack of Thebes, which drove out Tantamani.
    It gives a terminus post quem for Nah 3:8-10, and Nahum's use of it is a key dating argument.
  - >-
    Explain that No-Amon renders Egyptian niwt Imn, "city of Amun". Older translations sometimes
    rendered it "Alexandria" anachronistically.
  - >-
    Point readers to related monuments at Thebes, such as the Bubastite Portal, the Medinet
    Habu reliefs, the Merneptah Stele's findspot, and Rekhmire's tomb.
  sources_to_check:
  - Novotny and Jeffers, The Royal Inscriptions of Ashurbanipal (RINAP 5/1, 2018)
