id: thebes
title: Thebes (No-Amon)
aliases: [No-Amon, 'No', Waset, Luxor]
type: site
cultures: [egyptian]
scope: >-
  Thebes (Egyptian Waset; Hebrew Nōʾ ʾĀmôn, "city of Amun"), the religious capital of New
  Kingdom Egypt in the area of modern Luxor. It includes the temples of Karnak and Luxor on
  the east bank and the royal tombs and mortuary temples on the west. Its sack by Ashurbanipal
  in 664/663 BCE is recalled in Nahum.
passages:
- ref: Nah 3:8-10
  rel: event
  note: Thebes sacked and its people exiled, as a precedent for Nineveh's fall
- ref: Jer 46:25
  rel: attests
  note: Amon of Thebes (Nōʾ) punished with pharaoh and Egypt's gods
- ref: Ezek 30:14-16
  rel: attests
  note: Thebes among the Egyptian cities to be judged
related: [ashurbanipal, rassam-cylinder, taharqa, cush, memphis, medinet-habu-sea-peoples,
  tomb-of-rekhmire, bubastite-portal]
