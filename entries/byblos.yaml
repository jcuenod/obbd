editorial:
  author_notes:
  - >-
    Byblos had close ties with Egypt from the Old Kingdom, chiefly for cedar. Its sanctuaries
    include the temple of Baʿalat Gubal (the 'Lady of Byblos') and the Middle Bronze Obelisk
    Temple.
  - >-
    Rib-Hadda of Byblos is the most prolific correspondent in the Amarna letters, a vivid
    source for Late Bronze politics and the ʿApiru.
  - >-
    The Iron Age royal inscriptions (Ahiram, Yehimilk, Abibaal, Elibaal, Shipitbaal, and the
    later Yehawmilk) are foundational for the early Phoenician alphabet.
  - >-
    Wenamun's visit to Zakar-Baal (c. 1075 BCE) illustrates the city's independence after
    the collapse. The 'Byblos syllabic' script remains undeciphered.
  sources_to_check: ['Moran, The Amarna Letters (1992)']
