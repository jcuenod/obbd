editorial:
  author_notes:
  - >-
    Eissfeldt (1935) argued that Punic mlk is a sacrificial term (molk-offering), not a deity,
    and that biblical lammōlek means "as a molk-offering". This remains debated against the
    deity view (Heider; Day). Present both.
  - >-
    For the Carthage tophet, Greek and Roman literary accounts (e.g. Diodorus 20.14) and the
    inscribed stelae support sacrifice. Some osteological studies argue that many burials
    were of naturally deceased infants. Since about 2010 the debate has continued in Antiquity
    and elsewhere, and the majority view now accepts sacrifice. Present the evidence fairly.
  - >-
    Distinguish polemical accusation from evidence of practice. Jer 7:31; 19:5; 32:35 and
    Ezek 20:25-26 suggest that some in Judah regarded child sacrifice as YHWH-pleasing (Levenson,
    The Death and Resurrection of the Beloved Son; Stavrakopoulou, King Manasseh and Child
    Sacrifice).
  - >-
    Neo-Assyrian contract penalty clauses threatening to "burn" a son to a deity are sometimes
    cited. Their literal force is debated.
