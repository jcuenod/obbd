editorial:
  author_notes:
  - >-
    A Mari letter advises Zimri-Lim to ride in a chariot or on a mule rather than on horseback,
    to honour his Akkadian kingship. It is often cited as ARM 6 76; verify the reference.
    The donkey or mule is thus an honourable royal mount, not only a sign of humility.
  - >-
    At Mari, 'killing a donkey foal' (ḫayāram qaṭālum) sealed treaties. The 'sons of Hamor'
    ('donkey') at Shechem and Baal-berith (Judg 9:4) are sometimes linked to this. Present
    the link as a proposal.
  - >-
    Mention donkey burials in Middle Bronze contexts (e.g., Tell el-Dabʿa) and Old Assyrian
    donkey caravans as background to patriarchal travel.
  - Matthew's two animals (21:2-7) reflect a reading of the parallelism in Zech 9:9.
