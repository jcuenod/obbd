cultures: [hebrew, amorite]
scope: >-
  The donkey and mule as working animals, status mounts, and royal mounts in the ancient Near
  East and the Bible. Covers the background of the king 'riding on a donkey' in Zech 9:9 and
  the Gospel entry narratives.
