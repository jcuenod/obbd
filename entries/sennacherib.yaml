editorial:
  author_notes:
  - >-
    Machinist's study of Assyrian royal language in First Isaiah is the standard starting
    point for the boasts in 2 Kgs 19:23-24 and Isa 10.
  - >-
    The Babylonian Chronicle dates the murder to 681 and attributes it to 'his son'; the biblical
    account compresses the interval between 701 and 681.
  - >-
    Herodotus 2.141 (mice gnawing bowstrings) is a separate Egyptian tradition sometimes linked
    to 2 Kgs 19:35; note it without harmonising.
