editorial:
  author_notes:
  - >-
    Num 6 is usually read as a Priestly regulation of a temporary vow. The lifelong, charismatic
    Nazirite of Samson and Samuel is probably older.
  - >-
    The hair offering at the end of the vow has parallels in Syrian and Greek sanctuary practice
    (e.g. Lucian, De Dea Syria). Present these as typological parallels.
  - >-
    Note the textual evidence: 4QSamᵃ at 1 Sam 1:22 adds that Samuel will be a nāzîr forever.
  - >-
    The Mishnah tractate Nazir and Josephus attest that the practice continued in the Second
    Temple period.
