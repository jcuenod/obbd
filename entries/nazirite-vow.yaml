id: nazirite-vow
title: Nazirite Vow
aliases: [Nazirite, Nazarite]
type: practice
cultures: [hebrew, jewish]
scope: >-
  The Nazirite (nāzîr, 'consecrated, separated'): abstinence from wine and grape products,
  uncut hair, and avoidance of corpse impurity, either for a set period or for life. The entry
  covers the Priestly law, the lifelong Nazirites of narrative, Second Temple practice, and
  hair-offering parallels.
passages:
- ref: Num 6:1-21
  rel: practice
  note: 'Temporary vow: no grape products, no razor, no corpse contact; hair burned at completion'
- ref: Judg 13:4-7
  rel: practice
  note: Samson a Nazirite from the womb; mother abstains
- ref: Judg 16:17
  rel: practice
  note: '''A razor has never come upon my head'''
- ref: 1Sam 1:11
  rel: practice
  note: No razor on Samuel's head; 4QSamᵃ and LXX make him a Nazirite
- ref: Amos 2:11-12
  rel: practice
  note: Nazirites raised up by YHWH and made to drink wine
- ref: Jer 35:6-10
  rel: practice
  disputed: true
  note: 'Rechabites'' abstinence from wine: a comparable but distinct institution'
- ref: 1Macc 3:49
  rel: practice
  note: Nazirites who had completed their days brought to Mizpah
- ref: Luke 1:15
  rel: practice
  disputed: true
  note: John not to drink wine or strong drink
- ref: Acts 18:18
  rel: practice
  note: Paul cuts his hair at Cenchreae because of a vow
- ref: Acts 21:23-26
  rel: practice
  note: Paul pays for four men completing a vow
related: [vows-and-votive-offerings, purity-and-impurity, mourning-rites, sacrifice, jewish-sects,
  josephus]
media: []
