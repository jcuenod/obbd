scope: >-
  The Ugaritic mythological cycle on six tablets (KTU 1.1-1.6) narrating Baal's combat with
  Yam (Sea), the building of his palace on Mount Zaphon, and his death at the hands of Mot
  (Death) and return to life and kingship. The entry covers the composition and its biblical
  comparanda; the deities themselves have their own entries.
passages:
- ref: Ps 29
  rel: parallel
  note: >-
    Storm-god hymn: divine assembly, thunderous voice over the waters, Lebanon and Sirion,
    enthronement
- ref: Ps 93
  rel: parallel
  note: Divine kingship established over the raging floods (neharot)
- ref: Exod 15:1-18
  rel: parallel
  note: Victory at the sea, mountain sanctuary, and eternal kingship in sequence
- ref: Isa 27:1
  rel: parallel
  note: Leviathan the fleeing, twisting serpent; nearly verbatim with KTU 1.5 I 1-3
- ref: Ps 74:13-14
  rel: parallel
  note: Smashing the heads of the sea dragons and Leviathan
- ref: Ps 48:2
  rel: language
  note: Zion as yarkete ṣāpôn, transferring Baal's mountain Zaphon (MT 48:3)
- ref: Ps 68:4
  rel: language
  note: '''Rider on the clouds/steppes'' recalls Baal''s epithet rkb ʿrpt (MT 68:5)'
- ref: Isa 25:8
  rel: imagery
  note: YHWH swallows Death, reversing Mot's all-devouring maw
- ref: Isa 14:12-15
  rel: parallel
  disputed: true
  note: Failed ascent to the divine mountain; cf. Athtar's failed enthronement on Zaphon
- ref: Dan 7:9-14
  rel: parallel
  disputed: true
  note: Aged enthroned judge and cloud-riding figure; El and Baal pattern (Emerton)
- ref: 1Kgs 18:20-40
  rel: polemic
  note: YHWH, not Baal, controls rain and fire; mockery of an absent god
- ref: Deut 14:1
  rel: practice
  note: Gashing oneself in mourning; cf. El and Anat lacerate themselves for Baal
