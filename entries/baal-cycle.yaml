editorial:
  author_notes:
  - >-
    Date refers to the extant tablets, written by the scribe Ilimilku under a King Niqmaddu;
    whether this is Niqmaddu II (mid-14th c.) or Niqmaddu III (late 13th c.) is debated. The
    story is older and orally transmitted.
  - >-
    The tablet order (especially of KTU 1.1-1.3) and whether the six tablets form one continuous
    narrative are disputed; present the standard sequence Yam - palace - Mot as conventional,
    not certain.
  - >-
    Avoid the older seasonal-ritual reading (de Moor's agricultural calendar) and the Frazerian
    "dying and rising god" frame as settled interpretations; both are now widely criticized.
  - >-
    The Ps 29 adaptation thesis (Ginsberg, Cross) is mainstream but not unanimous; distinguish
    shared West Semitic idiom from direct literary dependence throughout.
  - >-
    Note the seven-day building of Baal's palace (fire burning six days, completed on the
    seventh) in connection with seven-day patterns and temple-building accounts.
