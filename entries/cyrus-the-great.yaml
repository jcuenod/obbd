editorial:
  author_notes:
  - >-
    Survey the sources: Cyrus Cylinder, Nabonidus Chronicle, Verse Account, Herodotus, Ctesias,
    and Xenophon's idealizing Cyropaedia.
  - >-
    The title 'anointed' (Isa 45:1) for a foreign king is unique. Date the Cyrus oracles of
    Deutero-Isaiah to the 540s, around the conquest of Babylon.
  - >-
    The return was probably gradual and modest. No Persian document mentions a decree for
    Judeans, and the extent of Cyrus's actual policy toward Judah is debated.
  - Josephus's story that Cyrus read Isaiah's prophecy (Ant. 11.5-6) is legendary.
