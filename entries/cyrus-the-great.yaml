- ref: Ezra 6:3-5
  rel: event
  note: Memorandum of Cyrus found at Ecbatana
- ref: Ezra 5:13-16
  rel: event
  note: Sheshbazzar and the return of the temple vessels
- ref: Dan 1:21; 6:28; 10:1
  rel: attests
