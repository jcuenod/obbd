  rel: attests
  note: Cyrus named as YHWH's shepherd who will rebuild Jerusalem and the temple
- ref: Isa 45:1-7
  rel: attests
  note: Cyrus as YHWH's anointed, his right hand grasped
- ref: Isa 41:2-4, 25
  rel: attests
  note: Unnamed conqueror from the east and north, generally identified with Cyrus
- ref: Ezra 1:1-4
  rel: event
  note: Cyrus's edict of return
- ref: 2Chr 36:22-23
  rel: event
