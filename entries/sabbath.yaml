editorial:
  author_notes:
  - >-
    Distinguish the verb šābat ("cease, stop") from the noun šabbāt. Gen 2:2-3, Exod 23:12,
    and Exod 34:21 use only the verb. The noun first appears in Exod 16:23. Exod 20:11 uses
    nwḥ, Exod 31:17 adds npš ("be refreshed"), and šabbātôn is a related intensive noun. Keep
    the vocabulary of cessation, rest, and refreshment distinct.
  - >-
    Akkadian šapattu (šabattu) is the 15th day of the month, the full moon, glossed lexically
    as ūm nūḫ libbi ("day of the heart's rest", i.e. the god's appeasement). It is not a human
    rest day and not part of a seven-day cycle. An etymological link to šabbāt is possible
    but unproven. The hypothesis that pre-exilic šabbāt was the full-moon day, paired with
    the new moon (2 Kgs 4:23; Amos 8:5; Hos 2:11; Isa 1:13), and was later fused with the
    seventh-day cessation of Exod 23:12 and 34:21 (Meinhold; more recently Grund, Die Entstehung
    des Sabbats, 2011) is a serious but minority position. Present it neutrally as debated.
  - >-
    The Mesopotamian hemerological "evil days" (7th, 14th, 19th, 21st, 28th of certain months)
    restricted specific persons (king, diviner, physician). They reset with each lunar month
    and are not called šapattu. No ancient Near Eastern parallel is known for a continuous
    seven-day cycle independent of the month. Hallo's "contrastive approach" (HUCA 48, 1977)
    is a good model.
  - >-
    Biblical sabbath prohibitions are few and specific. They are kindling fire (Exod 35:3),
    gathering wood (Num 15:32), gathering and preparing manna (Exod 16:23-29), leaving one's
    place (Exod 16:29), ploughing and harvest (Exod 34:21), carrying burdens (Jer 17:21-22),
    trade (Amos 8:5; Neh 10:31; 13:15-20), and pursuing one's own affairs (Isa 58:13). The
    general term is mĕlāʾkâ. Do not retroject the Mishnah's 39 main categories (m. Shabb.
    7:2) or the expanded lists of Jubilees 50 and the Damascus Document onto earlier texts.
  - >-
    The earliest extrabiblical evidence is debated. The Meṣad Ḥashavyahu ostracon (late 7th
    c.) has "before šbt", which may mean "before the sabbath" or "before stopping". The Elephantine
    ostraca (5th c.) clearly mention the šbh. Personal names such as Shabbethai (Ezra 10:15;
    Neh 8:7; 11:16) and Babylonian Šabbatāya also bear on the question.
