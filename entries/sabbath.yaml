id: sabbath
title: Sabbath
aliases: [Shabbat, šabbāt]
type: practice
cultures: [hebrew, babylonian, jewish]
scope: >-
  The seventh-day Sabbath in the Hebrew Bible and early Judaism, viewed against its proposed
  ancient Near Eastern antecedents (Akkadian šapattu, the full-moon day; hemerological "evil
  days") and its earliest extrabiblical attestations. The entry covers the biblical development
  of Sabbath law and rationale but leaves the sabbatical year to its own entry.
