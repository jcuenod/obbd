editorial:
  author_notes:
  - >-
    The widow-orphan pairing is a royal-ideological topos across the ancient Near East. Examples
    are the Ur-Nammu prologue (the orphan not delivered to the rich, the widow not to the
    mighty), the Hammurabi epilogue, Danel judging the widow's and orphan's case (Aqhat),
    Yassib's rebuke of Kirta, and Egyptian texts such as the Eloquent Peasant ('father to
    the orphan, husband to the widow').
  - >-
    The triad including the gēr is characteristically Deuteronomic. The motive clause 'you
    were aliens in Egypt' is a distinctively biblical development.
  - >-
    Note debate on terms. ʾalmānâ may denote a widow without adult male support, not simply
    any widow. Gēr is a legal status that later Greek translation (prosēlytos) reinterprets
    religiously.
  - >-
    Show the transfer of the royal ideal to YHWH as divine king (Ps 68; 82; 146), and the
    prophetic use of the triad as a measure of covenant fidelity.
  sources_to_check:
