id: widow-orphan-sojourner
title: Widow, Orphan, and Sojourner
aliases: [Personae miserae, Resident alien (gēr)]
type: concept
cultures: [hebrew, sumerian, akkadian, egyptian, ugaritic]
scope: >-
  The widow, the orphan, and the resident alien as stock categories of vulnerable persons
  in biblical law, prophecy, and psalmody, and the ancient Near Eastern royal ideal of protecting
  the widow and orphan. The entry covers legal provisions, the ideology of divine and royal
  protection, and the development of the gēr category.
