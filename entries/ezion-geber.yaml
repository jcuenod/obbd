editorial:
  author_notes:
  - >-
    Glueck excavated Tell el-Kheleifeh (1938-40), identified it as Ezion-geber, and interpreted
    its main building as a Solomonic copper smelter. He later withdrew the smelter interpretation
    himself. The building is now seen as a fort or storehouse, and its 'flues' as beam holes.
    Treat the 'Solomon's copper refinery' claim as a discredited misconception.
  - >-
    Pratico's reappraisal of Glueck's records dates the occupation from the eighth to the
    fourth century BCE, with nothing clearly of the tenth century. Tell el-Kheleifeh may therefore
    be Elath, or an Edomite or Judahite fort, rather than Solomon's port. Jeziret Faraʿun
    (Coral Island), with its natural anchorage, is another proposal. Leave the identification
    open.
  - >-
    Edomite material at Tell el-Kheleifeh includes the 'Qosʿanal, servant of the king' jar
    impressions and handmade 'Negebite' pottery. Link to edomite-inscriptions.
  - >-
    The Red Sea trade in the Solomon and Jehoshaphat stories is plausible geographically,
    but its scale and date are debated. Connect to ophir and phoenician-seafaring rather than
    repeating that material.
  - >-
    2 Kgs 16:6: MT reads 'Rezin king of Aram recovered Elath for Aram' with Qere 'Edomites'
    later in the verse; NRSV emends to Edom throughout. Explain this briefly.
  sources_to_check:
  - >-
    G. D. Pratico, Nelson Glueck's 1938-1940 Excavations at Tell el-Kheleifeh: A Reappraisal
    (1993)
