scope: >-
  The port at the head of the Gulf of Aqaba from which Solomon's and Jehoshaphat's Red Sea
  ventures set out, and a station on the wilderness itinerary. The entry covers the unresolved
  identification (Tell el-Kheleifeh, Jeziret Faraʿun), the relation to Elath, and the dismantling
  of Glueck's 'Solomonic smelter'.
