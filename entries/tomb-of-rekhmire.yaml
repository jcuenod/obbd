editorial:
  author_notes:
  - >-
    The brickmakers are captives brought for Amun's temple works, not Israelites. The scene
    shows that Exod 1 and 5 describe realistic Egyptian practice, but cannot establish the
    historicity of the oppression.
  - >-
    Brick quotas are also known from the Louvre Leather Roll (year 5 of Ramesses II), and
    complaints about lacking men and straw from Ramesside miscellanies. Verify exact references
    before citing.
  - >-
    The "Duties of the Vizier" is important background for Joseph's portrayal as second to
    pharaoh. The text probably goes back to an earlier (Middle Kingdom) original (van den
    Boorn).
