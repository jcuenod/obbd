id: tomb-of-rekhmire
title: Brickmaking Scenes in the Tomb of Rekhmire
aliases: [TT100, Rekhmire brickmaking scene]
type: artifact
cultures: [egyptian]
date:
  from: -1450
  to: -1420
  circa: true
  display: c. 1450–1420 BCE
scope: >-
  The Theban tomb (TT100) of Rekhmire, vizier under Thutmose III and Amenhotep II. Its paintings
  show foreign captives making mud bricks under overseers for the temple of Amun, foreign
  tribute bearers, and craft production. Its inscriptions include the "Duties of the Vizier"
  and the "Installation of the Vizier".
