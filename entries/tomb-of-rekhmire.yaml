- ref: Exod 1:13-14
  rel: realia
  note: Forced labour in mortar and brick
- ref: Exod 5:6-19
  rel: realia
  note: Brick production with straw, daily quotas, and beating overseers
- ref: Gen 41:40-43
  rel: practice
  note: The vizier's office, second only to pharaoh; investiture and authority
- ref: Ps 72:10-11
