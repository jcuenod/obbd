scope: >-
  Horse-drawn chariots and horses in warfare, prestige, and cult in the ancient Near East
  and in Israel and Judah. Covers chariot technology, Israelite chariot forces in Assyrian
  sources, the horse trade, and the theological critique of reliance on horses.
