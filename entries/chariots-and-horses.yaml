editorial:
  author_notes:
  - >-
    Ahab fielded 2,000 chariots at Qarqar (Kurkh Monolith), the largest chariot contingent
    there. Sargon II incorporated a Samarian chariot unit into his army, and the Nimrud Horse
    Lists (Dalley, Iraq 47, 1985) attest Israelite charioteers in Assyrian service.
  - >-
    The Megiddo pillared buildings have been read as stables or as storehouses. They are now
    generally dated to the 8th century, not to Solomon. Present the debate.
  - >-
    'Egypt' (miṣrayim) in 1 Kgs 10:28 is sometimes emended to Muṣri in Anatolia. Kue is Cilicia.
    'Iron chariots' probably means chariots with iron fittings.
  - >-
    Trace the shift from Late Bronze chariot elites (Amarna letters, Egyptian reliefs) to
    Iron II cavalry, and the theological critique (Deut 17; Isa 31; Ps 20) of military horse
    power.
  sources_to_check:
  - >-
    Littauer and Crouwel, Wheeled Vehicles and Ridden Animals in the Ancient Near East (1979)
  - Cantrell, The Horsemen of Israel (2011)
