editorial:
  author_notes:
  - >-
    Distinguish the papyrus's administrative sections, and explain the Egyptian labor and
    status terms rather than giving every person one uniform legal position.
  - >-
    Avoid identifying Joseph, Shiphrah, or Israelites from similar names; no historical synchronism
    follows from the comparison.
  - >-
    The institution often translated "Great Prison" (ḫnrt wr) also administered compulsory
    labor. Do not use a simplified prison reconstruction or an unqualified Genesis prison
    tag (Gen 39:20-23).
  - >-
    The date field is an approximate late Middle Kingdom range; check it against the edition.
