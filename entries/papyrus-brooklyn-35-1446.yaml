  display: c. 1800–1700 BCE
scope: >-
  A late Middle Kingdom Egyptian administrative papyrus recording labor obligations and Egyptian
  and foreign household dependents. It supplies concrete documentary background for servitude
  and compulsory labor in Egypt.
passages:
- ref: Gen 39:1-6
  rel: practice
  note: >-
    Compare a foreign dependent's position in an Egyptian household; the papyrus does not
    identify Joseph
- ref: Exod 1:11-14
  rel: practice
  note: >-
    Evidence for compulsory labor and the administration of dependent workers; it does not
    identify Israelites
related: [joseph-story-egyptian-background, slavery, corvee-labor, louvre-leather-roll, hyksos]
