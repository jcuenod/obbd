editorial:
  author_notes:
  - >-
    The British Museum excavated the site in 1911-14 and 1920 (Hogarth, Woolley, with T. E.
    Lawrence). A Turkish-Italian project has worked there since 2011.
  - >-
    In the Late Bronze Age it was the seat of the Hittite viceroy in Syria. In the Iron Age
    it was the capital of a Neo-Hittite kingdom with Luwian hieroglyphic inscriptions and
    sculpted orthostats. Sargon II annexed it in 717.
  - >-
    Woolley found burnt houses containing Egyptian objects, which he linked to the 605 battle.
    The Babylonian Chronicle is the main written source.
  sources_to_check:
