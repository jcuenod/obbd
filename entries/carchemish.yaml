scope: >-
  The city on the Euphrates at the modern Turkish-Syrian border, seat of a Hittite viceroy
  and later capital of a Neo-Hittite kingdom, and site of the decisive battle of 605 BCE.
  Covers its excavations, monuments and inscriptions; the battle has its own entry.
