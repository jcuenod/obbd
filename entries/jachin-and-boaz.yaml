editorial:
  author_notes:
  - >-
    Most scholars take the pillars as freestanding rather than load-bearing. Comparanda: Herodotus
    2.44 on the two pillars of Melqart's temple at Tyre; the two-columned portico of the ʿAin
    Dara temple; Iron Age clay shrine models with flanking pillars.
  - >-
    The meaning of the names is uncertain: yākîn 'he establishes', bōʿaz 'in strength'. R.
    B. Y. Scott's proposal that they are the opening words of dynastic oracles or inscriptions
    is possible but unproven.
  - >-
    Explain the dimensional discrepancies (18 cubits in 1 Kgs 7:15 and Jer 52:21 vs 35 in
    2 Chr 3:15; capitals of 5 vs 3 cubits in 2 Kgs 25:17) without forced harmonization.
  - >-
    Note the royal 'standing by the pillar' (2 Kgs 11:14; 23:3) as a ceremonial station. Set
    aside Masonic and other esoteric interpretations.
