id: jachin-and-boaz
title: Jachin and Boaz (Temple Pillars)
aliases: [Boaz and Jachin, Temple pillars]
type: realia
cultures: [judahite, phoenician]
scope: >-
  The two bronze pillars named Jachin and Boaz that stood at the porch of Solomon's temple,
  cast by the Tyrian craftsman Hiram. The entry covers their description, function, names,
  and the freestanding pillars that flanked temple entrances elsewhere in the Levant.
passages:
- ref: 1Kgs 7:15-22
  rel: realia
  note: >-
    Hiram casts two bronze pillars with capitals, lattice and pomegranates; named Jachin and
    Boaz
- ref: 1Kgs 7:41-42
  rel: realia
  note: Summary inventory of pillars, capital bowls, lattices and pomegranates
- ref: 2Chr 3:15-17
  rel: realia
  note: 'Chronicler''s version: pillars of 35 cubits set before the temple'
- ref: 2Kgs 11:14
  rel: practice
  note: Joash stands 'by the pillar, according to custom' at his enthronement
- ref: 2Kgs 23:3
  rel: practice
  note: Josiah stands by the pillar to make the covenant
- ref: 2Kgs 25:13, 16-17
  rel: realia
