editorial:
  author_notes:
  - >-
    Explain the provenance: the upper fragments surfaced on the antiquities market and were
    joined with fragments excavated at Maresha. This is a rare case of looted and excavated
    pieces being reunited.
  - >-
    The stele shows a real Seleucid policy of supervising sanctuaries. 2 Maccabees 3's angelic
    intervention is legendary elaboration around a plausible administrative episode.
