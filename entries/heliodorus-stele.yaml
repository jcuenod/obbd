id: heliodorus-stele
title: Heliodorus Stele
type: artifact
cultures: [greek]
date:
  from: -178
  to: -178
  display: 178 BCE
scope: >-
  Greek inscribed stele recording correspondence of Seleucus IV (178 BCE) to his minister
  Heliodorus about appointing Olympiodoros as overseer of sanctuaries in Coele-Syria and Phoenicia.
  It provides documentary context for the Heliodorus episode in 2 Maccabees 3.
passages:
- ref: 2Macc 3:1-40
  rel: attests
  note: Heliodorus, chief minister of Seleucus IV, sent to seize the temple treasury
- ref: 2Macc 3:3
  rel: attests
  note: Seleucus IV funding the Jerusalem cult
- ref: Dan 11:20
  rel: attests
  note: 'A ruler who sends an official (nôgēś) for royal revenue: Seleucus IV and Heliodorus'
- ref: 2Macc 4:7-10
  rel: setting
  note: Royal control of sanctuaries; Jason purchases the high priesthood
related: [antiochus-iv, maccabean-revolt, jerusalem, tribute-and-vassalage]
