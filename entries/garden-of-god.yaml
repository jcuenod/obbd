editorial:
  author_notes:
  - >-
    Emphasize the overlap of garden, mountain, and temple symbolism (Ezek 28; 47). Many scholars
    read the Eden narrative with temple imagery in view (cherubim, eastern entrance, gold
    and precious stones), but how far the correspondence goes is debated.
  - >-
    Royal gardens are well attested (Assyrian palace gardens at Nineveh; Persian pairidaēza,
    the source of Greek paradeisos and Hebrew pardēs). Note the ideology of the king as gardener.
  - >-
    The etymology of ʿēden is debated. Proposals are Sumerian/Akkadian edin "steppe" and West
    Semitic ʿdn "abundance, luxuriance", the latter attested in the Tell Fekheriye inscription.
    Present both.
  - >-
    Attempts to locate Eden geographically from the four rivers should be treated as part
    of the text's cosmological geography rather than as a solvable map problem.
