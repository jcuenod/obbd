scope: >-
  The foreign, largely West Semitic rulers of Egypt's Fifteenth Dynasty, who governed northern
  Egypt from Avaris in the Second Intermediate Period until their expulsion by Ahmose. The
  entry covers their origins and their culture at Tell el-Dabʿa. It also covers the long tradition,
  beginning with Manetho and Josephus, of linking them with Joseph and the exodus.
