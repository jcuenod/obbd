editorial:
  author_notes:
  - >-
    Hyksos derives from Egyptian ḥqꜣw ḫꜣswt, "rulers of foreign lands". Josephus's "shepherd
    kings" etymology is wrong.
  - >-
    Current evidence (Bietak's excavations; isotope studies) points to a gradual rise of Levantine-origin
    groups in the eastern Delta, not a sudden invasion. Their material culture is Middle Bronze
    Levantine.
  - >-
    Josephus, quoting Manetho, equated the Hyksos expulsion with the exodus (Against Apion
    1). Some modern scholars (e.g., Redford) see Hyksos memories as one strand behind the
    exodus tradition. Others reject any link, since the c. 1550 expulsion does not fit the
    narrative's Ramesside colour. Present this as debated.
  - >-
    Avoid popular claims that particular Hyksos-era officials or statues at Avaris are Joseph.
  sources_to_check:
  - Josephus, Against Apion 1.73-105
  - Bietak, Avaris. The Capital of the Hyksos (1996)
  - Oren (ed.), The Hyksos. New Historical and Archaeological Perspectives (1997)
