  rel: concept
  note: Divinely revealed sanctuary plan (tabnît); cf. the plan on Statue B's lap
- ref: 1Chr 28:11-19
  rel: concept
  note: David hands Solomon the temple plan received 'in writing from the hand of the LORD'
- ref: Ezek 40:1-4
  rel: concept
  note: Visionary temple measured by a figure holding a measuring reed
- ref: Ezek 34:1-24
  rel: imagery
  note: Ruler as shepherd chosen by the deity to care for the people
- ref: Ps 78:70-72
