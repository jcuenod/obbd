  circa: true
  display: c. 2140–2120 BCE
scope: >-
  The diorite statues of Gudea, ruler of Lagash in the Neo-Sumerian period, many inscribed
  with building and dedicatory texts addressed to Ningirsu and other gods. Statue B, seated
  with a temple ground-plan and measuring rule on his lap, presents the ruler as the god-chosen
  shepherd and temple builder. The cylinders and Gudea's career are treated in separate entries.
