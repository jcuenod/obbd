editorial:
  author_notes:
  - >-
    Distinguish the statues excavated at Tello (ancient Girsu) by de Sarzec from 1877 onward
    from the unprovenanced statues that later reached the market, some of doubtful authenticity.
  - >-
    Gudea's absolute dates vary by chronology (often c. 2140-2120 or slightly later); his
    reign probably overlapped the early Ur III dynasty. Give a range, not a single year.
  - >-
    The clasped-hands posture is a standard Mesopotamian gesture of prayer and attentiveness,
    useful for discussing prayer postures.
  - >-
    Stress that the comparison with biblical temple plans is typological; no direct influence
    on Exodus or Ezekiel is claimed.
  sources_to_check:
