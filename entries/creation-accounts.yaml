scope: >-
  A hub entry surveying Mesopotamian, Egyptian, and Levantine accounts of the origin of the
  world and their relation to the biblical creation texts, both Gen 1-2 and poetic and wisdom
  passages. Detailed treatments are in the entries on individual texts and motifs.
