editorial:
  author_notes:
  - >-
    There is no single Mesopotamian "creation epic". Enuma Elish is mainly a work exalting
    Marduk, and cosmogonic material also appears in incantations, disputation poems, myth
    prologues (e.g. Atrahasis), and god lists. Egypt has several cosmogonies (Heliopolitan,
    Hermopolitan, Memphite) that are not mutually exclusive.
  - >-
    Treat Gen 1:1-2:3 and 2:4b-25 as distinct accounts (Priestly and non-Priestly in most
    critical reconstructions). Note that each has different comparative profiles.
  - >-
    Correct the "Babel-Bibel" overstatement (Delitzsch) that Genesis is derived from Enuma
    Elish. Most specialists see shared conceptual idiom rather than direct literary dependence.
    Lambert's caution is a standard reference point.
  - >-
    Ps 104 and the Hymn to the Aten share themes (cf. Ps 104:20-30). How the dependence came
    about is debated.
  sources_to_check:
