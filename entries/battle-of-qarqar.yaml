id: battle-of-qarqar
title: Battle of Qarqar (853 BCE)
type: event
cultures: [assyrian, israelite, aramean]
date:
  from: -853
  to: -853
  display: 853 BCE
scope: >-
  The battle fought in 853 BCE at Qarqar on the Orontes between Shalmaneser III and a coalition
  of twelve western states led by Damascus and Hamath, in which Ahab of Israel fielded the
  largest chariot force. The Bible does not mention it.
passages:
- ref: 1Kgs 22:1
  rel: setting
  note: Three years without war between Aram and Israel
- ref: 1Kgs 20:31-34
  rel: setting
  disputed: true
  note: >-
    Treaty between Ahab and Ben-hadad, often linked to the Qarqar alliance; chapter's setting
    debated
- ref: 1Kgs 16:29
  rel: attests
  note: >-
    Ahab, named in the Kurkh Monolith's Qarqar account, which places his reign's end near
    853
- ref: 1Kgs 22:39
  rel: setting
  note: Kings refers readers elsewhere for Ahab's deeds; silence about Qarqar
related: [kurkh-monoliths, shalmaneser-iii, ahab, ben-hadad, hamath, chariots-and-horses,
