editorial:
  author_notes:
  - >-
    Shalmaneser claims a great victory, but the coalition held together and he fought it again
    in 849, 848 and 845; most historians judge the outcome indecisive.
  - >-
    The Kurkh numbers for Ahab's forces are disputed; present the scribal-error proposal and
    its critics.
  - >-
    The battle provides the first absolute date in Israelite history and anchors the chronology
    of the Omride kings.
  - >-
    The relationship of Ahab's coalition partner Hadadezer to the Ben-hadad of 1 Kgs 20 and
    22 is a key debate.
