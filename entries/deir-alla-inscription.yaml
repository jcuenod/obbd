id: deir-alla-inscription
title: Deir ʿAlla Inscription (Balaam Text)
aliases: [Balaam Inscription, Deir ʿAlla Plaster Texts]
type: artifact
cultures: [aramean]
date:
  from: -800
  to: -800
  circa: true
  display: c. 800 BCE
scope: >-
  Ink inscriptions on fallen wall plaster found in 1967 at Tell Deir ʿAlla in the Jordan Valley.
  The texts recount the 'book of Balaam son of Beor, a seer of the gods', who receives a night
  vision of a divine assembly decreeing darkness on the earth. They are the only extrabiblical
  text naming a figure known from the Pentateuch.
passages:
- ref: Num 22:5
  rel: attests
  note: Balaam son of Beor, a non-Israelite seer
- ref: Num 22:8-13, 19-20
  rel: parallel
  note: Divine communications reach Balaam at night
- ref: Num 24:4, 16
  rel: language
  note: Balaam sees the vision of Shaddai; cf. the šdyn gods of the plaster text
- ref: Josh 13:22
  rel: attests
  note: Balaam son of Beor called a diviner (qôsēm)
- ref: Num 31:8, 16
  rel: attests
  note: Hostile later tradition about Balaam
- ref: Mic 6:5
  rel: attests
  note: Balaam son of Beor in prophetic memory
- ref: Ps 82:1
  rel: concept
  note: Assembly of the gods deliberating judgment
- ref: Amos 5:18-20
  rel: imagery
  disputed: true
  note: Decreed darkness and gloom, not light
