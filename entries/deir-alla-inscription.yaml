editorial:
  author_notes:
  - >-
    The language is debated: Old Aramaic, a Canaanite dialect, or a local Transjordanian (Gileadite
    or Ammonite) dialect. Show what is at stake in the classification.
  - >-
    Hoftijzer and van der Kooij's 'Combinations' I and II are reconstructions from many fragments,
    and the sequence of lines is uncertain. Combination II is very obscure. Proposed links
    to necromancy or child sacrifice are speculative.
  - >-
    Shows that a Balaam tradition circulated east of the Jordan c. 800, independently of Numbers.
    It does not prove the historicity of Num 22-24.
  - The site's identification (Succoth? Penuel?) is uncertain. Do not assume one.
  sources_to_check:
