  circa: true
  display: c. 572–477 BCE
scope: >-
  Some two hundred cuneiform legal and administrative tablets from the settlements of Āl-Yāhūdu
  ("Judahtown"), Našar, and Bīt-Abī-râm in the Nippur region. They document Judean deportees
  and their descendants as land-holding tenants over several generations, bearing many Yahwistic
  names.
