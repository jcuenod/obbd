editorial:
  author_notes:
  - >-
    Unprovenanced: the tablets surfaced on the antiquities market (mostly in the David Sofer
    collection; exhibited at the Bible Lands Museum, Jerusalem, 2015). Flag the ethical and
    provenance issues explicitly.
  - >-
    The earliest tablet is dated 572 (Nebuchadnezzar's 33rd year); the town name shows deportees
    settled as a group. Judeans appear in the land-for-service (ḫaṭru) system; Yahwistic names
    are written with -yāma/-yāḫu and Yāhû-.
  - >-
    They show integration without loss of identity and continuity long after 539, which complicates
    a simple 'return' narrative (Alstola 2020).
  sources_to_check:
  - >-
    L. E. Pearce and C. Wunsch, Documents of Judean Exiles and West Semites in Babylonia in
    the Collection of David Sofer (CUSAS 28, 2014)
  - >-
    T. Alstola, Judeans in Babylonia: A Study of Deportees in the Sixth and Fifth Centuries
    BCE (CHANE 109, 2020)
