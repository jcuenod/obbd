  wikidata: Q51672
editorial:
  author_notes:
  - >-
    Death in 4 BCE (Josephus; the eclipse at Ant. 17.167) is the consensus. Alternative proposals
    of 1 BCE are a minority, so Jesus' birth is placed before 4 BCE.
  - >-
    The massacre of the infants is absent from Josephus. Its historicity is debated; it fits
    Herod's late cruelty but also Matthew's Moses typology.
  - >-
    Netzer identified his tomb at Herodium (2007); note that some dispute the identification.
  sources_to_check:
  - 'P. Richardson, Herod: King of the Jews and Friend of the Romans (1996)'
  - E. Netzer, The Architecture of Herod, the Great Builder (2006)
