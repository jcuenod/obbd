id: herod-the-great
title: Herod the Great
type: person
cultures: [jewish, roman]
date:
  from: -37
  to: -4
  display: 37–4 BCE
scope: >-
  Herod I, Idumean-born client king of Judea appointed by Rome (40 BCE; ruling from 37 until
  his death in 4 BCE). He was a great builder (temple, Caesarea, Masada, Herodium) and the
  king in whose reign Matthew and Luke set Jesus' birth.
passages:
- ref: Matt 2:1-12
  rel: attests
  note: Jesus born 'in the time of King Herod'; the magi at Herod's court
- ref: Matt 2:16-18
  rel: attests
  note: Massacre of the infants, not independently attested
- ref: Matt 2:19-22
  rel: attests
  note: Herod's death and Archelaus's succession in Judea
- ref: Luke 1:5
  rel: attests
  note: '''In the days of King Herod of Judea'''
- ref: John 2:20
  rel: attests
  note: Temple under construction for forty-six years
- ref: Acts 23:35
  rel: realia
  note: Paul held in 'Herod's headquarters' (praetorium) at Caesarea
related: [herods-temple, caesarea-maritima, masada, josephus, nabataeans, edomites, bethlehem]
