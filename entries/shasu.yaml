editorial:
  author_notes:
  - >-
    Egyptian š3sw denotes Semitic-speaking pastoralists. The topographical lists at Soleb
    (Amenhotep III) and Amarah West (Ramesses II) include 'Shasu land of YHW' and 'Shasu land
    of Seir'.
  - >-
    The YHW toponym is important for the southern-origin hypothesis of YHWH. Note that it
    names a place or group, not explicitly a deity, and its location is debated.
  - >-
    Papyrus Anastasi VI (late thirteenth century) reports Shasu tribes of Edom allowed past
    the fortress at Tjeku to the pools of Pithom.
  - >-
    Rainey identified Merneptah's 'Israel' with Shasu figures in the Karnak reliefs, while
    Yurco and Stager identified them with Canaanites. Both views remain debated. Avoid equating
    Shasu with early Israel without qualification.
