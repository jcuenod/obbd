scope: >-
  The Shasu of New Kingdom Egyptian texts: semi-nomadic pastoralist groups of the southern
  Levant, Sinai and Transjordan. Covers the sources, the 'Shasu land of YHW' and 'Shasu of
  Seir/Edom' references, and their bearing on Israel's origins and on the southern origin
  of YHWH.
