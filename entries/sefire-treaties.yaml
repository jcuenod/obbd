editorial:
  author_notes:
  - >-
    The identity of Barga'yah and of KTK is unresolved. Present the options without choosing.
  - >-
    Sefire is the key Aramaic link in the chain of Hittite, Assyrian (Esarhaddon) and biblical
    treaty language. Note the term ʿdy (treaty, oaths).
  - >-
    The ritual curses ('as this wax is burned', 'as this calf is cut') illustrate simile curses
    performed with objects. Compare Jer 34:18 and the Esarhaddon Succession Treaty.
  - Arpad fell to Tiglath-pileser III in 740. This gives the terminus ante quem.
