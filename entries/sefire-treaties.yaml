id: sefire-treaties
title: Sefire Treaty Inscriptions
aliases: [Sefire Steles, Sefire Inscriptions]
type: artifact
cultures: [aramean]
date:
  from: -760
  to: -740
  circa: true
  display: c. 760–740 BCE
scope: >-
  Three fragmentary basalt steles from Sefire near Aleppo, recording treaties between Barga'yah,
  king of KTK, and Mati'el son of Attarsamak, king of Arpad. They are the fullest Aramaic
  treaty texts, with stipulations, lists of divine witnesses, and vivid curses, some performed
  by ritual acts.
