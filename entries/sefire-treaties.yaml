- ref: Deut 28:38-42
  rel: parallel
  note: Curses of crop failure and locusts
- ref: Jer 34:18-20
  rel: practice
  note: 'Calf cut in two in a covenant rite; Sefire I A: ''as this calf is cut in two'''
- ref: Gen 15:9-17
  rel: practice
  note: Animals cut in two in covenant-making
- ref: Hos 2:3
  rel: parallel
  note: Stripping as a covenant curse; cf. the stripped prostitute in Sefire I A (MT 2:5)
- ref: Mic 1:4
  rel: imagery
