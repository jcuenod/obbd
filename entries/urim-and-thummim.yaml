id: urim-and-thummim
title: Urim and Thummim
type: practice
cultures: [hebrew, assyrian]
scope: >-
  The Urim and Thummim, a priestly oracular device kept in the high priest's breastpiece for
  obtaining binary divine answers. The entry covers its biblical attestations, its disappearance
  after the early monarchy, and proposed ancient Near Eastern analogues.
