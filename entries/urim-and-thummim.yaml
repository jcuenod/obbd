editorial:
  author_notes:
  - >-
    How the device worked is unknown. The texts suggest binary answers, with the possibility
    of no answer (1 Sam 14:37; 28:6). The etymologies ("lights and perfections"; or linked
    to ʾrr "curse" and tmm "be innocent") are uncertain.
  - >-
    Horowitz and Hurowitz (JANES 21, 1992) compared an Assyrian psephomancy ritual using two
    stones (LKA 137). This is the best-documented analogue but not proof of identical practice.
    Van Dam, The Urim and Thummim (1997), surveys proposals.
  - >-
    Note the device's absence from narratives after David, and the postexilic expectation
    of its restoration (Ezra 2:63).
