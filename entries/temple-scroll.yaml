editorial:
  author_notes:
  - Describe Yadin's acquisition of the scroll in 1967 and its condition.
  - >-
    Debate on whether it is a sectarian or pre-sectarian work, and on its claim to authority
    (a 'new Torah'? Wacholder; replacement or supplement).
  - Note the shared 364-day calendar and festival system with Jubilees.
  - >-
    The hanging law (cols. 64) and 4QpNahum are key evidence for Jewish discussions of crucifixion;
    present the debate over whether 'hanging' means crucifixion.
