id: caiaphas-ossuary
title: Caiaphas Ossuary
type: artifact
cultures: [jewish]
date:
  from: 1
  to: 70
  circa: true
  display: c. 1–70 CE
scope: >-
  An ornate limestone ossuary from a family tomb discovered in 1990 in Jerusalem's Peace Forest,
  inscribed 'Yehosef bar Qayafa'. It is widely identified as the ossuary of the high priest
  Joseph Caiaphas (c. 18-36/37 CE).
passages:
- ref: Matt 26:3, 57
  rel: attests
  note: Caiaphas the high priest; Josephus names him 'Joseph called Caiaphas'
- ref: John 11:49-53
  rel: attests
  note: Caiaphas counsels that one man die for the people
- ref: John 18:13-14, 24
  rel: attests
  note: Annas, father-in-law of Caiaphas; Jesus sent to Caiaphas
- ref: Luke 3:2
  rel: attests
  note: High priesthood of Annas and Caiaphas
- ref: Acts 4:6
  rel: attests
  note: Annas and Caiaphas at the hearing of Peter and John
