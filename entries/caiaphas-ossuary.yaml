editorial:
  author_notes:
  - >-
    The identification is widely accepted but has been questioned (the spelling Qafa/Qayafa,
    the modest tomb, the absence of a priestly title). Present it as probable rather than
    certain.
  - Note Josephus, Ant. 18.35, 95, and the family name Caiaphas.
  - >-
    The 'Miriam daughter of Yeshua son of Caiaphas' ossuary (published 2011) was recovered
    from looters. Its authenticity is generally accepted, but its context is lost.
  sources_to_check:
