id: mouth-washing-and-opening
title: Mouth-Washing and Mouth-Opening Rituals
aliases: [mīs pî, pīt pî, Opening of the Mouth]
type: practice
cultures: [babylonian, assyrian, egyptian]
scope: >-
  The Mesopotamian mīs pî ("washing of the mouth") and pīt pî ("opening of the mouth") rituals
  that animated or purified cult statues, and the Egyptian Opening of the Mouth ceremony for
  statues and mummies, as background to biblical polemic against man-made gods.
passages:
- ref: Isa 44:9-20
  rel: polemic
  note: Craftsmen's manufacture stressed; cf. ritual denial of human manufacture in mīs pî
- ref: Jer 10:3-5, 9
  rel: polemic
  note: Image made by craftsmen cannot speak
- ref: Ps 115:4-8
  rel: polemic
  note: '''They have mouths, but do not speak'''
- ref: Ps 135:15-18
  rel: polemic
  note: No breath in the mouths of images
- ref: Hab 2:18-19
  rel: polemic
  note: Image overlaid with gold and silver, with no breath in it
- ref: Isa 6:5-7
  rel: practice
  disputed: true
  note: >-
    Purification of the prophet's 'unclean lips'; comparison with mouth-washing rites proposed
