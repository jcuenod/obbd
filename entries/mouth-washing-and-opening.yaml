editorial:
  author_notes:
  - >-
    The Mesopotamian ritual uses incantations in which the craftsmen swear they did not make
    the statue, and their hands are symbolically cut off with a tamarisk sword. Isa 44 inverts
    exactly this, which makes the polemic especially pointed.
  - >-
    The ritual texts are known mainly from first-millennium Nineveh and Babylon (Walker and
    Dick, 2001). Do not retroject details onto earlier periods without evidence.
  - >-
    The Egyptian Opening of the Mouth (wpt-r) animated statues and mummies with adze-like
    instruments. It is distinct from the Mesopotamian rite and should be treated separately.
  - >-
    Hurowitz (HUCA 60, 1989) compared Isa 6:5-7 with Akkadian mouth-purification. Present
    this as a proposal.
  sources_to_check:
  - >-
    Christopher Walker and Michael Dick, The Induction of the Cult Image in Ancient Mesopotamia
    (SAALT 1, 2001)
