editorial:
  author_notes:
  - >-
    The date is debated: the inscription is usually dated c. 1000 on palaeographic grounds.
    Some argue the sarcophagus and reliefs are older (13th century) and were reused. Present
    both views.
  - >-
    The throne is the best visual parallel for the biblical 'cherub throne'. Keep the iconographic
    argument (cherub = winged sphinx) clear.
  - >-
    Mention the warning graffito in the shaft and the curse formula as early examples of tomb
    protection, and compare the Silwan and Sidonian tomb curses.
