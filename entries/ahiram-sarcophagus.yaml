id: ahiram-sarcophagus
title: Sarcophagus of Ahiram
type: artifact
cultures: [phoenician]
date:
  from: -1000
  to: -1000
  circa: true
  display: c. 1000 BCE
scope: >-
  The limestone sarcophagus of Ahiram, king of Byblos, found in 1923, with relief scenes of
  the king enthroned on a sphinx (cherub) throne and of mourners. It bears a Phoenician inscription
  by his son Ittobaal cursing anyone who disturbs the coffin, one of the earliest substantial
  Phoenician texts.
