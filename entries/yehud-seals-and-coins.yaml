id: yehud-seals-and-coins
title: Yehud Stamp Impressions and Coins
type: realia
cultures: [persian, judahite, jewish]
date:
  from: -500
  to: -150
  circa: true
  display: c. 500–150 BCE
scope: >-
  Inscribed stamp impressions on jar handles (yhd, yhwd, sometimes with names and the title
  phwʾ 'governor') and small silver coins inscribed yhd/yhwd from the Persian and early Hellenistic
  province of Judah. They provide the main epigraphic evidence for Yehud's administration
  and governors.
passages:
- ref: Hag 1:1, 14
  rel: attests
  note: Zerubbabel 'governor (peḥâ) of Judah'; seal impressions attest the office
- ref: Neh 5:14-15
  rel: attests
  note: Earlier governors of Judah before Nehemiah
- ref: Mal 1:8
  rel: attests
  note: '''Offer that to your governor'''
- ref: Ezra 5:8
  rel: language
  note: '''The province of Judah'' (yĕhûd mĕdîntāʾ)'
- ref: Neh 12:10-11, 22
  rel: attests
  disputed: true
  note: Johanan the high priest; a coin of 'Yohanan the priest' may name him
- ref: 1Chr 3:19
  rel: attests
  disputed: true
  note: >-
    Shelomith, 'maidservant of Elnathan the governor' on an unprovenanced seal; identification
    with Zerubbabel's daughter proposed
