editorial:
  author_notes:
  - >-
    Use the Lipschits-Vanderhooft typology and chronology. Their distribution (Ramat Rahel,
    Jerusalem, Mizpah area) helps map provincial boundaries.
  - >-
    Avigad's bullae and seals naming Elnathan and Shelomith are unprovenanced. Note this,
    and present the Shelomith-Zerubbabel identification (Meyers) as conjecture.
  - >-
    Coins: 4th century BCE, including issues naming 'Yehezqiyah the governor' and 'Yohanan
    the priest'. Note the debated BM drachm with a seated deity (reading YHD vs. YHW).
  - >-
    Note the use of Aramaic versus paleo-Hebrew scripts on these objects, and the minting
    of Yehud coins after the Persian period under Ptolemaic rule.
  sources_to_check:
  - O. Lipschits and D. S. Vanderhooft, The Yehud Stamp Impressions (2011)
  - N. Avigad, Bullae and Seals from a Post-Exilic Judean Archive (Qedem 4, 1976)
  - Y. Meshorer, A Treasury of Jewish Coins (2001)
