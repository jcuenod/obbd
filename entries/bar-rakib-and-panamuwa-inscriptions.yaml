editorial:
  author_notes:
  - >-
    Distinguish the pieces. The Hadad statue of Panamuwa I (KAI 214) and the Panamuwa II memorial
    (KAI 215) are in the local Samʾalian dialect. Bar-Rakib's inscriptions (KAI 216-221) are
    in standard Old Aramaic. The shift of written language within one dynasty is itself significant.
    Give holding museums only after verifying each object (Berlin and Istanbul both hold Zincirli
    finds).
  - >-
    KAI 215 tells how Panamuwa II's father Bar-Ṣur was killed with seventy of his kinsmen,
    how Assyria restored the dynasty, and how Panamuwa died in the camp of his lord Tiglath-pileser,
    probably during the Damascus campaign of 733-732. The camp mourned him and his body was
    brought home.
  - >-
    Bar-Rakib's phrases ('I ran at the wheel of my lord, the king of Assyria'; 'because of
    my father's righteousness and my own righteousness') are classic vassal language. They
    make a close comparison with Ahaz's submission in 2 Kgs 16, without implying any literary
    link.
  - >-
    The Hadad statue directs a future king to invoke 'the soul (nbš) of Panamuwa' to eat and
    drink with Hadad. Link this royal ancestor cult to the Katumuwa stele and to care-for-the-dead.
  - >-
    Panammu of Samʾal appears in Tiglath-pileser III's tribute lists alongside Rezin and Menahem;
    verify the list and date (c. 738).
