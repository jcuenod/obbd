  circa: true
  display: c. 770–720 BCE
scope: >-
  The royal inscriptions of eighth-century Samʾal (Zincirli): the Hadad statue of Panamuwa
  I, the memorial inscription set up by Bar-Rakib for his father Panamuwa II, and Bar-Rakib's
  own building inscriptions and reliefs. They document a dynastic coup, Assyrian restoration,
  and the self-presentation of loyal vassals of Tiglath-pileser III. The earlier Kilamuwa
  and Katumuwa stelae have their own entries.
