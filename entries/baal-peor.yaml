editorial:
  author_notes:
  - >-
    The phrase "sacrifices of the dead" (Ps 106:28) has been read as offerings to lifeless
    gods or as a funerary cult; rabbinic tradition (Sifre Num 131) links Peor with the marzeaḥ.
    Present the debate.
  - Num 25 combines Moabite and Midianite strands; flag the composite text.
  - >-
    There is no extrabiblical attestation of a "Baal of Peor"; the name is a local manifestation
    of Baal at Peor/Beth-peor.
