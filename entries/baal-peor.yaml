id: baal-peor
title: Baal of Peor
aliases: [Baal of Peor]
type: deity
cultures: [moabite]
scope: >-
  Baal of Peor, the local god of a Transjordanian site in Moab whose worship by Israelites
  at Shittim is narrated in Num 25 and became a paradigmatic memory of apostasy.
passages:
- ref: Num 25:1-9
  rel: event
  note: Israel 'yokes itself' to Baal of Peor; sacrifices, sexual transgression and plague
- ref: Num 31:16
  rel: concept
  note: Balaam blamed for the Peor apostasy
- ref: Deut 4:3
  rel: concept
  note: Those who followed Baal of Peor destroyed
- ref: Ps 106:28-31
  rel: practice
  disputed: true
  note: Ate 'sacrifices of the dead' at Baal of Peor
- ref: Hos 9:10
  rel: polemic
  note: Israel consecrated itself to 'the shame' at Baal-peor
- ref: 1Cor 10:8
  rel: concept
  note: Paul recalls the Peor plague (23,000; Num 25:9 has 24,000)
related: [marzeah, care-for-the-dead, midianites-and-kenites, moabites, deir-alla-inscription]
