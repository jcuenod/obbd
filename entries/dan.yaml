title: Tel Dan (Laish)
aliases: [Tel Dan, Tell el-Qadi, Laish, Leshem]
type: site
cultures: [israelite, canaanite]
scope: >-
  The site at the main source of the Jordan, Bronze Age Laish and Iron Age Dan, the northern
  limit of Israel. Covers the Middle Bronze rampart and arched gate, the Iron Age cult precinct,
  the city gates, and the inscriptions found there.
