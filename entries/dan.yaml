editorial:
  author_notes:
  - >-
    Laish appears in Bronze Age texts (Mari, Egyptian toponym lists; verify specifics). The
    mudbrick arched gate (Middle Bronze II) is among the best preserved anywhere. The popular
    label 'Abraham's Gate' has no evidential basis.
  - >-
    Biran's Area T podium and precinct is plausibly linked with Jeroboam's sanctuary, but
    its phasing and the reconstructions of the bamah are debated. Finds include a horned altar,
    altar shovels and a hearth.
  - >-
    The Tel Dan Stele fragments (1993-94) were found reused in Iron Age construction near
    the gate. Leave the interpretation to tel-dan-stele.
  - >-
    The Greek and Aramaic bilingual dedication 'to the god who is in Dan' (Hellenistic) confirms
    the site identification.
  sources_to_check: [NEAEHL, 'Biran, Biblical Dan (1994)']
