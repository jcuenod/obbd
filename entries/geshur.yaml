editorial:
  author_notes:
  - >-
    David's marriage to Talmai's daughter is a diplomatic marriage with a neighbouring Aramean
    court, and Absalom's flight to his maternal grandfather follows from it. Link to diplomatic-marriage.
  - >-
    Et-Tell (Bethsaida Excavations Project, directed by R. Arav) has a large Iron IIA-B city
    with a monumental gate and a gate shrine with a stele of a horned, bull-headed figure,
    variously interpreted (often as a moon god). Its identification as Geshur's capital is
    a proposal, not certain. Other Golan and Sea of Galilee sites (e.g. Tel Hadar, ʿEn Gev)
    are also relevant.
  - >-
    Geshur probably ceased as an independent kingdom when Aram-Damascus expanded in the ninth
    century. The region was then devastated by Tiglath-pileser III in 733-732.
  - >-
    Distinguish the southern Geshurites near Philistia (Josh 13:2; 1 Sam 27:8), a different
    group.
