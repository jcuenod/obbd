id: geshur
title: Geshur, Maacah, and the Aramean Golan
aliases: [Geshurites, Maacah, Maacathites, Aram-maacah]
type: people
cultures: [aramean]
scope: >-
  The small Aramean kingdom of Geshur on the Golan east and northeast of the Sea of Galilee,
  together with neighbouring Maacah. Talmai of Geshur's daughter Maacah was David's wife and
  the mother of Absalom. The entry covers the biblical references, the Iron Age remains at
  et-Tell (later identified with Bethsaida) and other Golan sites, and Geshur's absorption
  by Aram-Damascus.
