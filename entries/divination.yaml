editorial:
  author_notes:
  - >-
    The distinction between technical or deductive divination (reading signs) and intuitive
    or inspired divination (dreams, prophecy) goes back to Cicero's De divinatione. It is
    a useful organizing frame, though the categories overlap.
  - >-
    The Hebrew Bible condemns many techniques but sanctions others (Urim and Thummim, lots,
    dreams, prophecy). Deut 18 presents prophecy as Israel's legitimate channel in place of
    the nations' diviners. Explain the logic rather than framing it as "magic versus religion".
  - >-
    In Mesopotamia divination was a scholarly discipline with large omen compendia, closely
    tied to royal decision-making. Note this as a key difference in scale and prestige.
  - >-
    Give the Hebrew terms (qesem, nāḥaš, ʿônēn, mĕkaššēp, ḥōbēr ḥeber, šōʾēl ʾôb) with cautious
    glosses. Several identifications are uncertain.
  sources_to_check:
