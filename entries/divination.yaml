id: divination
title: Divination in the Ancient Near East
type: practice
cultures: [ane]
scope: >-
  A hub entry on the ways ancient Near Eastern people sought knowledge of divine will and
  the future. These include deductive methods (extispicy, astrology, lots, oil and smoke omens)
  and intuitive ones (dreams, prophecy, necromancy). The entry covers biblical prohibitions
  and the forms of divination that biblical texts accept.
