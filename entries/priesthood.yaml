editorial:
  author_notes:
  - >-
    Explain the source-critical debate. Wellhausen held that the Levites were former priests
    of local shrines demoted after Josiah's centralization (2 Kgs 23:8-9; Ezek 44). D's 'Levitical
    priests' and P's distinction between Aaronide priests and Levites reflect different stages
    or circles. Note the continuing debate (Cody; Leuchter and Hutton).
  - >-
    Comparative points: Mesopotamian temples had many specialist offices (šangû, ērib bīti
    'temple-enterer', kalû lamentation priest, āšipu exorcist), and Neo-Babylonian priests
    held rotating prebends (Waerzeggers). Egyptian priests (ḥm-nṯr 'god's servant', wʿb 'pure
    one') served in rotating phyles and shaved their bodies, whereas Israelite priests were
    forbidden certain kinds of shaving (Lev 21:5; Ezek 44:20). Both wore linen (Ezek 44:17-18).
  - >-
    The Hittite Instructions for Temple Officials are the closest comparandum for guard duty,
    purity before handling offerings and penalties for misappropriation (Milgrom).
  - >-
    Women held priestly offices in Mesopotamia (entu, nadītu) and Egypt, but not in the biblical
    priesthood. Say this without speculation.
  sources_to_check:
  - A. Cody, A History of Old Testament Priesthood (AnBib 35, 1969)
  - M. Haran, Temples and Temple-Service in Ancient Israel (1978)
  - >-
