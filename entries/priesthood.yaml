scope: >-
  Priests and other temple personnel in Israel and the ancient Near East: their recruitment
  and lineages, consecration, dress, purity rules, duties, income and ranks. The entry compares
  the biblical priesthood and Levites with Mesopotamian, Egyptian, Hittite and Ugaritic temple
  staff. Sacrifice, tithes and purity are treated in their own entries.
