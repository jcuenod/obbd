editorial:
  author_notes:
  - >-
    The kinnôr is a lyre (Ugaritic knr; the deified Kinnaru at Ugarit). The identification
    of the nēbel as a larger lyre or a harp is debated. The tōp is a frame drum associated
    with women, illustrated by Iron Age terracottas of women holding drums.
  - >-
    Iconography includes the Megiddo ivory (lyre player), the lyre player on Kuntillet ʿAjrud
    Pithos A, and Assyrian reliefs of captive lyre players. Sennacherib lists male and female
    musicians in Hezekiah's tribute.
  - >-
    The Greek loanwords in Dan 3 are a standard argument for a Hellenistic date of the Daniel
    tales in their present form. Present the counter-arguments briefly.
  sources_to_check:
  - Braun, Music in Ancient Israel/Palestine (2002)
