title: Ephesus and the Temple of Artemis
type: site
cultures: [greek, roman]
scope: >-
  Ephesus, metropolis of the Roman province of Asia, and its famous sanctuary of Artemis (the
  Artemision), one of the Seven Wonders. The entry covers the city's civic, cultic, and imperial
  institutions as background to Paul's ministry and to Revelation.
