editorial:
  author_notes:
  - >-
    Outline the Artemision's history (archaic temple, burned 356 BCE, rebuilt), its rediscovery
    by J. T. Wood (1869), and the theatre. The Salutaris foundation (104 CE) documents Artemis
    processions.
  - >-
    Interpretations of the cult statue's 'many breasts' (breasts, eggs, bull scrota, ornaments)
    are debated; avoid fertility-cult clichés.
  - >-
    Acts' civic details (town clerk, Asiarchs, neokoros) are well supported epigraphically,
    but this does not settle the episode's historicity.
