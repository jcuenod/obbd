date:
  from: -1353
  to: -1336
  circa: true
  display: c. 1353–1336 BCE
scope: >-
  Eighteenth Dynasty pharaoh who promoted the exclusive worship of the sun disk (Aten), founded
  a new capital at Akhetaten (Amarna), and suppressed the cult of Amun. His reign is documented
  in the Amarna Letters, and he is a perennial figure in debates about the origins of monotheism.
