- ref: Ps 104:20-30
  rel: parallel
  note: Great Hymn to the Aten, composed under Akhenaten, parallels the creation psalm
- ref: Deut 6:4
  rel: concept
  disputed: true
  note: Exclusive devotion to one deity; Atenism as a comparandum, not a source
