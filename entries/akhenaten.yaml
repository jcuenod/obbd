editorial:
  author_notes:
  - >-
    Present the debate over whether Atenism was monotheism, henotheism, or a royal cult. It
    centred on the king and royal family, without ethical or covenantal dimensions comparable
    to Israelite Yahwism.
  - >-
    Freud's derivation of Mosaic monotheism from Atenism (Moses and Monotheism, 1939) and
    later popular variants are not supported. Assmann's work on "Moses the Egyptian" deals
    with cultural memory, not a historical link.
  - >-
    Regnal dates are conventional (c. 1353-1336). Amarna chronology, including a possible
    coregency with Amenhotep III, is debated.
  - >-
    After his death his monuments were dismantled and his name was suppressed. This is relevant
    to how his religion could, or could not, have been transmitted.
  sources_to_check:
  - Hornung, Akhenaten and the Religion of Light (1999)
  - Assmann, Moses the Egyptian (1997)
  - Moran, The Amarna Letters (1992)
