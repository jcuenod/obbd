scope: >-
  The longest hymn of the Amarna period, inscribed in the tomb of Ay at Amarna. It praises
  the sun disk (Aten) as sole creator and sustainer of all life, with Akhenaten as its unique
  intermediary. The entry covers its contents, its place in Atenist religion, and its long-noted
  resemblance to Psalm 104.
