editorial:
  author_notes:
  - >-
    The Ps 104 parallels are widely accepted, but direct dependence is unlikely given the
    chronological gap and the suppression of Atenism. Most scholars posit a shared tradition
    of Egyptian solar hymnody (also found in Amun hymns), possibly reaching Israel through
    Canaanite or Phoenician mediation.
  - >-
    Ps 104 also draws on West Semitic storm-god imagery (vv. 3-4, 7-9). The Egyptian comparison
    accounts for only part of the psalm.
  - >-
    Present Atenism as an exclusive cult centred on the king and the sun disk. Scholars debate
    whether to call it monotheism. Freud's thesis that Mosaic monotheism derives from Atenism
    (Moses and Monotheism) is not accepted.
  - >-
    The text survives chiefly in Ay's tomb (Amarna Tomb 25), now damaged. Earlier copies,
    such as Bouriant's and Davies', preserve readings now lost.
