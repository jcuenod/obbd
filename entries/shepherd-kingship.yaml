editorial:
  author_notes:
  - >-
    Survey Sumerian and Akkadian royal epithets (sipa, rēʾû 'shepherd'), including Hammurabi's
    prologue and epilogue ('I am the shepherd who brings well-being'). Add the Egyptian crook
    (heka) regalia, the Middle Kingdom image of the king as herdsman, and Assyrian usage.
  - >-
    The image combines care with authority and accountability, which is why it suits prophetic
    critique of rulers (Ezek 34; Jer 23; Zech 11:4-17).
  - >-
    Note that YHWH's own shepherding (Ps 23; Isa 40:11) draws on royal language, not only
    on pastoral life.
  image_query: Tutankhamun crook and flail
