id: shepherd-kingship
title: Shepherd Imagery and Kingship
aliases: [Shepherd of the people, Royal shepherd]
type: concept
cultures: [ane]
scope: >-
  The image of the king or god as shepherd of the people, attested across the ancient Near
  East from third-millennium Sumer onward, and its use in the Hebrew Bible for YHWH, David,
  failed rulers, and an expected Davidic ruler.
