editorial:
  author_notes:
  - >-
    Macalister's excavations (1902-09) had poor stratigraphic control. Later work by Hebrew
    Union College (Dever and others) and the Tandy expedition clarified the sequence.
  - >-
    The Amarna letters include correspondence from Gezer's rulers, and the Merneptah Stele
    claims 'Gezer is captured'.
  - The Middle Bronze 'high place' with ten massebot is a key exhibit for standing stones.
  - >-
    The six-chambered gate's Solomonic date and the identity of the pharaoh in 1 Kgs 9:16
    (often Siamun) are both debated. Give the low chronology view.
  - >-
    Hellenistic or Roman rock-cut boundary inscriptions ('boundary of Gezer') confirmed the
    identification.
