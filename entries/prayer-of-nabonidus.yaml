editorial:
  author_notes:
  - >-
    Consensus: Daniel 4 transferred a tradition about Nabonidus's ten-year absence in Tayma
    to Nebuchadnezzar. 4Q242 reflects a parallel or earlier form, not Daniel's direct source.
  - Compare Nabonidus's own Harran inscriptions and the Tayma evidence.
  - >-
    Note the grammatical ambiguity over who forgave the sin (the diviner or God), and that
    reconstructions vary (Milik, Cross, Collins).
