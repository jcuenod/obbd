id: prayer-of-nabonidus
title: Prayer of Nabonidus (4Q242)
aliases: [4Q242, 4QPrNab]
type: artifact
cultures: [jewish, babylonian]
date:
  from: -75
  to: -50
  circa: true
  display: c. 75–50 BCE
scope: >-
  Fragmentary Aramaic text from Qumran Cave 4 in which Nabonidus tells how he was struck with
  an evil disease for seven years at Teima and healed after a Jewish diviner (gāzar) forgave
  his sin and told him to honour God. It is widely seen as related to the tradition behind
  Daniel 4.
passages:
- ref: Dan 4:1-37
  rel: parallel
  note: >-
    King afflicted for seven years, restored after acknowledging the Most High (MT 3:31-4:34)
- ref: Dan 5:4, 23
  rel: parallel
  note: Praising gods of silver, gold, bronze, iron, wood, and stone
- ref: Dan 2:27; 4:7
  rel: language
  note: gzr 'diviner', the term used of the Jewish healer (4:7 = MT 4:4)
- ref: Mark 2:5-12
  rel: concept
  disputed: true
  note: Forgiveness of sins linked with healing
related: [nabonidus, nebuchadnezzar-ii, verse-account-of-nabonidus, nabonidus-chronicle, dead-sea-scrolls,
  aramaic-language]
