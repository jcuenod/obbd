editorial:
  author_notes:
  - >-
    Threshing floors were public and sacral spaces. At Ugarit, Danel sits by the gate 'on
    the threshing floor' and judges the widow's and orphan's case (KTU 1.17 V). Compare 1
    Kgs 22:10 and the temple site in 2 Sam 24 and 2 Chr 3:1.
  - >-
    Explain the technology. The threshing sledge (môrag) had stone teeth (2 Sam 24:22; Isa
    41:15), followed by winnowing with fork and shovel in the evening breeze (Ruth 3:2).
  - >-
    Archaeological evidence is slight, since floors were open bedrock or beaten earth. Ethnographic
    analogies are useful but should be signalled as such.
  - Note the debated sexual overtones of Ruth 3 and of Hos 9:1.
