id: melqart
title: Melqart
aliases: [Milqart, Tyrian Heracles, Baal of Tyre]
type: deity
cultures: [phoenician]
scope: >-
  Melqart ("king of the city"), the chief god of Tyre, spread with Phoenician colonization
  across the Mediterranean (Carthage, Gades) and identified by Greeks with Heracles. The entry
  covers his cult and its possible bearing on the Baal of Ahab and Jezebel.
passages:
- ref: 1Kgs 16:31-32
  rel: attests
  disputed: true
  note: Jezebel's Baal and the temple in Samaria, often but not certainly Melqart
- ref: 1Kgs 18:27
  rel: practice
  disputed: true
  note: '''He is asleep and must be awakened'': possible allusion to Melqart''s egersis'
- ref: 1Kgs 7:15-22
  rel: realia
  disputed: true
  note: Twin pillars Jachin and Boaz; cf. Herodotus 2.44 on Tyre's temple
- ref: 2Macc 4:18-20
  rel: attests
  note: Games at Tyre; Jason sends money for sacrifice to Heracles
- ref: Matt 17:24-27
  rel: realia
  note: Temple tax, normally paid in Tyrian shekels bearing Melqart-Heracles
related: [tyre, melqart-stele, baal, jezebel, hiram-of-tyre, jachin-and-boaz, coinage, phoenicians]
