editorial:
  author_notes:
  - >-
    The identification of Jezebel's Baal with Melqart (de Vaux, Albright) versus Baal-Shamem
    (Eissfeldt) or a local Baal is unresolved; present all three.
  - >-
    The "awakening" (egersis) of Heracles at Tyre is reported by Josephus citing Menander
    of Ephesus (Against Apion 1.119; Ant. 8.146); verify references and avoid over-reading
    1 Kgs 18:27.
  - Discuss the Melqart stele of Bar-Hadad as evidence for his cult in Aram.
  - >-
    Tyrian shekels (with Melqart's head) were standard for temple dues in the Roman period;
    this is well attested and useful for NT readers.
