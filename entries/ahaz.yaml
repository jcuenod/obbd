scope: >-
  Ahaz (Jehoahaz) son of Jotham, king of Judah, who submitted to Tiglath-pileser III during
  the Syro-Ephraimite war. He appears in Assyrian tribute lists as Jehoahaz (Iauḫazi) of Judah
  and on seal impressions, including his son Hezekiah's bulla.
passages:
- ref: 2Kgs 16:5-9
  rel: event
  note: >-
    Syro-Ephraimite siege; Ahaz declares himself Assyria's 'servant and son' and sends tribute
- ref: 2Kgs 16:10-18
  rel: practice
  note: Altar copied from Damascus and temple changes 'because of the king of Assyria'
- ref: 2Kgs 16:3
  rel: practice
  disputed: true
  note: Ahaz 'made his son pass through fire'
- ref: Isa 7:1-17
  rel: event
