editorial:
  author_notes:
  - >-
    The Assyrian form Iauḫazi shows that his full name was Jehoahaz. The theophoric element
    may have been dropped in the biblical tradition.
  - >-
    His chronology is notoriously difficult: 16 years (2 Kgs 16:2) and the synchronisms with
    Hezekiah conflict. Tadmor/Cogan has c. 743-727 including a co-regency; others have 735-715.
  - >-
    The altar episode is no longer read as forced Assyrian religion. Most now see it as voluntary
    cultural emulation.
  - >-
    Unprovenanced bullae of 'Ahaz son of Jotham, king of Judah' exist. Present the Ophel Hezekiah
    bulla (which names Ahaz) as the excavated witness.
