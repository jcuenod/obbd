id: nebuchadnezzar-ii
title: Nebuchadnezzar II
aliases: [Nebuchadrezzar, Nabû-kudurri-uṣur II]
type: person
cultures: [babylonian]
date:
  from: -605
  to: -562
  display: 605–562 BCE
scope: >-
  The second and greatest king of the Neo-Babylonian dynasty, victor at Carchemish, conqueror
  of Jerusalem in 597 and 587/586, and rebuilder of Babylon. He is the dominant foreign king
  in Kings, Jeremiah, Ezekiel and Daniel.
passages:
- ref: 2Kgs 24:1-17
  rel: event
  note: Jehoiakim's submission and revolt; capture of Jerusalem in 597
- ref: 2Kgs 25:1-21
  rel: event
  note: Siege and destruction of Jerusalem in 587/586
- ref: Jer 46:2
  rel: event
  note: Victory over Necho at Carchemish in Jehoiakim's fourth year
- ref: Jer 27:6
  rel: concept
  note: '''Nebuchadnezzar my servant'' as YHWH''s instrument'
- ref: Ezek 26:7-14
  rel: event
  note: Prophesied siege of Tyre
- ref: Ezek 29:17-20
  rel: event
  note: Egypt given as wages for the fruitless siege of Tyre
- ref: Dan 4:28-33
  rel: parallel
  disputed: true
  note: Boast and madness; widely thought to be transferred from Nabonidus (MT 4:25-30)
- ref: Dan 1:1-2
  rel: setting
  note: Exile of Judean youths; date problem of Jehoiakim's third year
