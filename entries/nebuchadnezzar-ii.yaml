editorial:
  author_notes:
  - >-
    The form Nebuchadrezzar (Jeremiah, Ezekiel) is closer to Akkadian Nabû-kudurri-uṣur; Nebuchadnezzar
    is a dissimilated form.
  - >-
    His inscriptions are almost all building texts; military history comes mainly from the
    Babylonian Chronicles, which break off after 594.
  - >-
    Daniel's portrayal draws on Nabonidus traditions (4Q242) and is historically problematic;
    distinguish the literary figure from the historical king.
  - >-
    The 13-year siege of Tyre is reported by Josephus (citing Phoenician records); Ezekiel
    acknowledges its limited success.
