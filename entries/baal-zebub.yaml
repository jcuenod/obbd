editorial:
  author_notes:
  - >-
    The majority view is that the original was Baal-zebul "Baal the Prince/Exalted" (cf. Ugaritic
    zbl bʿl), deformed into "lord of flies"; some defend a genuine "lord of flies" (an oracular
    or healing deity; LXX Baal muian).
  - >-
    The NT form Beelzebul preserves -l and may reflect wordplay with zəbul "dwelling" (Matt
    10:25) or zebel "dung"; present options.
  - >-
    No extrabiblical attestation of Baal-zebub at Ekron exists; the Ekron inscription names
    the goddess PTGYH.
