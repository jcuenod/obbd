id: nabonidus-cylinders
title: Nabonidus Inscriptions (Ur and Sippar Cylinders, Harran Stelae)
aliases: [Cylinders of Nabonidus, Nabonidus Cylinder from Ur, Nabonidus Cylinder from Sippar]
type: artifact
cultures: [babylonian]
date:
  from: -555
  to: -540
  circa: true
  display: c. 555–540 BCE
scope: >-
  Clay foundation cylinders of Nabonidus, last king of Babylon, recording his restoration
  of temples. They include the Ur cylinders on the ziggurat of Sin, which end with a prayer
  for his eldest son Belshazzar, and the Sippar cylinder on the rebuilding of the Ehulhul
  temple of Sin at Harran.
passages:
- ref: Dan 5:1-2
  rel: attests
  note: Belshazzar (Bēl-šarra-uṣur), eldest son of Nabonidus, named in a royal prayer
- ref: Dan 7:1; 8:1
  rel: attests
  note: Belshazzar as ruler in Babylon
- ref: Dan 5:2, 11, 18, 22
  rel: attests
  note: Daniel calls Belshazzar Nebuchadnezzar's 'son'; the inscriptions name Nabonidus
- ref: Gen 11:31-32
  rel: setting
  note: Ur and Harran, moon-god cities whose temples Nabonidus restored
related: [nabonidus, belshazzar, sin-moon-god, harran, ur, ziggurat, verse-account-of-nabonidus]
location:
  institution: British Museum, London (Ur and Sippar cylinders); other copies elsewhere
  accession: null
