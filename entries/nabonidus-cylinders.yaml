editorial:
  author_notes:
  - >-
    Discovered at Ur in the 1850s; the prayer for Belshazzar answered 19th-c. scepticism about
    his existence. The 'son of Nebuchadnezzar' language in Dan 5 may be a dynastic idiom or
    reflect later tradition; present the options.
  - >-
    The Sippar cylinder narrates a dream in which Marduk orders the Harran temple rebuilt
    and mentions Cyrus's defeat of Astyages; useful for Nabonidus's devotion to Sin.
  - >-
    Nabonidus's antiquarian interest (searching for older foundation deposits, e.g. Naram-Sin's)
    is a distinctive feature of these texts.
  - Do not confuse with the Cyrus Cylinder.
  sources_to_check:
  - H. Schaudig, Die Inschriften Nabonids von Babylon und Kyros' des Großen (AOAT 256, 2001)
