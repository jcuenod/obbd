editorial:
  author_notes:
  - >-
    Excavated by the University of Chicago's Syrian-Hittite Expedition (1935-1938), which
    uncovered Building II and the bit-hilani palaces, and since 2004 by the Tayinat Archaeological
    Project (University of Toronto, T. P. Harrison).
  - >-
    The identification of Kunulua/Kullania with biblical Calno (Isa 10:9) and Calneh (Amos
    6:2) is widely accepted. 'Calneh' in Gen 10:10, set in Shinar, is a separate problem and
    is often emended. Keep them apart.
  - >-
    The treaty tablet (published by Lauinger, 2012) was found in the inner room of a temple,
    apparently displayed there. Check whether its oath-taker is the Assyrian governor of Kunalia
    rather than a vassal king; this affects claims about Judah, which was a vassal state.
  - >-
    Early Iron Age levels with Aegean-style pottery and Luwian inscriptions of a king Taita
    of 'Palistin/Walistin' have fed debate over links with the Philistines. Present it as
    open.
  sources_to_check:
  - R. C. Haines, Excavations in the Plain of Antioch II (OIP 95, 1971)
  - >-
    J. Lauinger, 'Esarhaddon's Succession Treaty at Tell Tayinat: Text and Commentary,' JCS
    64 (2012)
  - >-
    T. P. Harrison and J. F. Osborne, 'Building XVI and the Neo-Assyrian Sacred Precinct at
    Tell Tayinat,' JCS 64 (2012)
