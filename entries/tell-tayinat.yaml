id: tell-tayinat
title: Tell Tayinat (Kunulua)
aliases: [Kunulua, Kullania, Calno, Calneh]
type: site
cultures: [luwian, assyrian]
scope: >-
  A large mound in the Amuq plain of southern Turkey, ancient Kunulua, capital of the Neo-Hittite
  kingdom of Patina (Unqi). Tiglath-pileser III conquered it in 738 BCE and it became the
  Assyrian provincial centre Kullania. It has produced a tripartite temple beside a palace
  (Building II) and, in a later temple (Building XVI), a copy of Esarhaddon's succession treaty.
