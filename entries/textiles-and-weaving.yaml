  rel: realia
  note: Tabernacle curtains of twisted linen and dyed yarns with woven cherubim
- ref: Exod 35:25-26
  rel: practice
  note: Skilled women spin dyed yarn, linen, and goats' hair
- ref: Judg 16:13-14
  rel: realia
