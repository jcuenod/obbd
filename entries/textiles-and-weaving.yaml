editorial:
  author_notes:
  - >-
    Loom weights (evidence of the warp-weighted loom) are common in Iron Age houses. Egypt
    used horizontal ground looms, and which type Judg 16 assumes is debated. Spool-shaped
    Philistine loom weights are an Aegean marker.
  - >-
    Yadin explained the 'weaver's beam' (mĕnôr ʾōrĕgîm) as the leash rod with loops, comparing
    it to a thonged javelin. This is an influential proposal.
  - >-
    Linen-wool textiles at Kuntillet ʿAjrud bear on the šaʿaṭnēz rule and its exemption for
    priestly garments. Dyed textiles from Timna (10th century) include true purple.
  sources_to_check: ['Barber, Prehistoric Textiles (1991)']
