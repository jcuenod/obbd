id: textiles-and-weaving
title: Textiles, Spinning, and Weaving
aliases: [Spinning, Loom, Shaatnez]
type: realia
cultures: [hebrew, ane]
scope: >-
  Fibres (wool, flax, goat hair), spinning, looms, and textile production in ancient Israel
  and its neighbours, as household and specialised labour, and in biblical law, cult, and
  imagery. Dyes and dress have their own entries.
passages:
