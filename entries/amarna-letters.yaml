editorial:
  author_notes:
  - >-
    Two kinds of letter need distinguishing. The "international" letters (Babylon, Mitanni,
    Hatti, Assyria, Alashiya, Arzawa) use brotherhood language and gift exchange. The vassal
    letters from Canaan use servile formulae.
  - >-
    The ʿApiru (Habiru) appear as social outsiders and mercenaries, not an ethnic group. A
    link with ʿibrî ("Hebrew") is possible linguistically but debated, and should not be equated
    with the Israelite conquest, an equation earlier scholarship sometimes made.
  - >-
    Abdi-Heba's letters show a Jerusalem ruler in the 14th century. The size of Late Bronze
    Jerusalem is archaeologically elusive, so treat claims about the city's scale cautiously.
  - >-
    The Canaanite glosses and the hybrid Akkadian of the Canaanite scribes are key evidence
    for the prehistory of Hebrew (Rainey).
  - EA numbering follows Knudtzon. Cite Moran's translation and Rainey's edition.
  sources_to_check:
