scope: >-
  About 380 cuneiform tablets, mostly letters in Akkadian, found at Akhetaten (el-Amarna).
  They hold the diplomatic correspondence of Amenhotep III, Akhenaten, and their immediate
  successors with the great powers and with vassal rulers of Canaan. They are the main written
  source for Late Bronze Age Canaan.
