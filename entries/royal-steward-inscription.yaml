editorial:
  author_notes:
  - Removed by Clermont-Ganneau in 1870 but deciphered only by N. Avigad (1953).
  - >-
    The name is damaged. Restoring it as Shebanyahu (= Shebna, Isa 22:15) is attractive but
    unprovable. Present the identification as possible, not established.
  - >-
    Compare the tomb curses with Phoenician royal sarcophagi (Ahiram, Tabnit, Eshmunazar).
    Note the Silwan necropolis's distinctive Judahite elite tomb architecture (Ussishkin).
