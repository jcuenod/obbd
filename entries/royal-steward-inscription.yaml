scope: >-
  A Hebrew inscription carved over the entrance of a rock-cut tomb in the Silwan necropolis
  opposite the City of David, belonging to '[...]yahu who is over the house'. It declares
  that the tomb holds no silver or gold and curses anyone who opens it.
