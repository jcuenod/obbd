editorial:
  author_notes:
  - >-
    Distinguish Tel Beersheba from the modern city. Settlement begins in Iron I, so there
    are no remains from a 'patriarchal' period. The Genesis traditions reflect a later setting.
  - >-
    Stratum II is a planned administrative town, most often thought destroyed in 701. Its
    date and the date of its destruction have been debated (Aharoni, Herzog, Singer-Avitz).
  - >-
    The horned altar was reassembled from ashlars reused in a storehouse wall. Its original
    location (a temple has been proposed but not found) and the link to Hezekiah are inferences.
  sources_to_check: [NEAEHL, 'Aharoni (ed.), Beer-Sheba I (1973)']
