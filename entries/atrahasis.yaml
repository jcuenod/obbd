editorial:
  author_notes:
  - >-
    Main witness: a three-tablet Old Babylonian copy by the scribe Ipiq-Aya dated to the reign
    of Ammi-ṣaduqa (17th c. BCE); later fragments from Ugarit and Neo-Assyrian Nineveh show
    a long transmission. Gilgamesh XI's flood account draws on this tradition.
  - >-
    The cause of the flood (the gods' disturbance by human rigmu/ḫubūru, 'noise') is read
    as overpopulation (Kilmer, Moran, Frymer-Kensky) or as rebellion/unrest (e.g. Oden); present
    both and link to the post-flood measures (barren women, a demon who snatches infants,
    cultic celibates).
  - >-
    Genesis moralises the cause (violence and corruption, Gen 6:11-13) and has one God who
    both judges and saves; most scholars posit shared Mesopotamian tradition rather than copying
    of this text, with debate over the date and channel of transmission and over Priestly
    vs. non-Priestly strands.
  - >-
    Tablet I: Enki and the mother goddess (Nintu/Mami) mix clay with the flesh and blood of
    the slain god We-ila, whose 'ghost' (eṭemmu) remains in humans; useful for Gen 2:7 but
    distinct from the 'image of God' idea of Gen 1:26-27.
