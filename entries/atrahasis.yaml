scope: >-
  The Old Babylonian epic of human origins and the flood, named after its hero ("exceedingly
  wise"). It narrates the creation of humans to relieve the gods' labour, the gods' repeated
  attempts to curb humanity, and the flood survived by Atrahasis; it is the closest Mesopotamian
  analogue to the sequence of Gen 1-9 as a whole.
