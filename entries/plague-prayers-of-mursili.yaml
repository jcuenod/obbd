  circa: true
  display: c. 1320–1300 BCE
scope: >-
  Prayers of the Hittite king Muršili II asking the gods to end a plague that had ravaged
  Ḫatti for some twenty years. Oracles had traced it to his father's breach of an oath sworn
  to Egypt and to neglected offerings; the king confesses inherited guilt and offers restitution.
passages:
- ref: 2Sam 21:1-14
  rel: parallel
  note: Disaster traced by oracle to a predecessor's broken oath; expiation by the king
- ref: Josh 9:15-20
  rel: concept
  note: Oath sworn by the gods binds later generations
- ref: 2Sam 24:10-17
  rel: parallel
  note: King confesses guilt and pleads for the plague to stop
- ref: Lam 5:7
  rel: concept
  note: Children bear their fathers' sins; cf. Muršili's 'the father's sin comes upon the
    son'
- ref: Ezek 18:2
  rel: concept
  note: Sour-grapes proverb on inherited guilt, rejected by Ezekiel
related: [oaths-and-oath-formulas, divination, hittite-vassal-treaties, apology-of-hattusili,
  sacrifice, hittites-and-hethites]
