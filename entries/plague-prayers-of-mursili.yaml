editorial:
  author_notes:
  - >-
    The plague began under Šuppiluliuma I, reportedly spread by Egyptian prisoners; oracles
    pointed to the breach of the Kuruštama treaty with Egypt and neglected offerings to the
    Mala (Euphrates) river.
  - >-
    Malamat (VT 5, 1955) drew the classic comparison with 2 Sam 21; the parallel concerns
    the theology of causality and oath-breaking, not literary dependence.
  - >-
    The prayers argue like a legal plea (arkuwar) before divine judges; useful for comparing
    biblical intercession and confession.
  sources_to_check:
