id: bozrah
title: Bozrah (Buseirah)
aliases: [Buseirah, Busayra]
type: site
cultures: [edomite]
scope: >-
  The Edomite capital at Buseirah in southern Jordan, a major centre in the eighth to sixth
  centuries BCE. Covers its acropolis buildings, its relation to Assyrian hegemony, and its
  role in prophetic oracles against Edom. Bostra in Syria is a different place.
