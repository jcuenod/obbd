editorial:
  author_notes:
  - >-
    Crystal Bennett's excavations (1971-80) uncovered monumental acropolis buildings of the
    eighth or seventh to sixth centuries BCE in Assyrian-influenced style. Little earlier
    material was found.
  - >-
    Edomite kings (Qaus-malaka, Qaus-gabri) appear in Assyrian sources as vassals. Bozrah's
    floruit fits this period, which supports dating the prophetic references to it.
  - >-
    The 'kings of Edom' list in Gen 36 raises questions of dating against the late flourishing
    of Bozrah. Link to faynan for the early-Edom debate.
  sources_to_check:
  - Bienkowski (ed.), Busayra - Excavations by Crystal-M. Bennett 1971-1980 (2002)
