  rel: setting
  note: Jobab son of Zerah of Bozrah, king of Edom
- ref: Isa 34:6
  rel: setting
  note: YHWH's sacrifice in Bozrah, slaughter in Edom
- ref: Isa 63:1
  rel: imagery
  note: The divine warrior comes from Bozrah in crimsoned garments
- ref: Jer 49:13, 22
  rel: setting
  note: Bozrah to become a horror and a desolation
- ref: Amos 1:12
  rel: setting
  note: Fire on Teman to devour Bozrah's strongholds
