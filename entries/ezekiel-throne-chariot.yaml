editorial:
  author_notes:
  - >-
    Keel (Jahwe-Visionen und Siegelkunst, 1977) and later iconographic studies link Ezek 1
    to Neo-Assyrian and Babylonian glyptic, where bull-men or genii hold up a sky platform
    with a deity or winged disk above.
  - >-
    The four faces (human, lion, ox, eagle) combine familiar Mesopotamian guardian types (lamassu,
    griffin-demons) and should not be read as a single model.
  - >-
    D. I. Block and others compare the glory's departure and return with Mesopotamian accounts
    of divine abandonment and return (Esarhaddon's Babylon inscriptions; Marduk Prophecy).
  - >-
    Mention Merkabah mysticism as reception only. Ancient-astronaut readings do not merit
    discussion.
  image_query: Neo-Assyrian four-winged genie relief
