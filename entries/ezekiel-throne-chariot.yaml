id: ezekiel-throne-chariot
title: Ezekiel's Throne-Chariot Vision and ANE Iconography
aliases: [Merkabah, Chariot vision]
type: concept
cultures: [babylonian, assyrian]
scope: >-
  Ezekiel's visions of the divine glory on a mobile throne-platform borne by four-faced living
  creatures (cherubim) and wheels, set against Mesopotamian iconography of composite guardian
  creatures, sky-bearing figures and divine processional vehicles. Later Merkabah mysticism
  is mentioned only briefly.
