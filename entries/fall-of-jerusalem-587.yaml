id: fall-of-jerusalem-587
title: Babylonian Conquests of Jerusalem (597 and 587/586 BCE)
type: event
cultures: [babylonian, judahite]
date:
  from: -597
  to: -586
  display: 597–586 BCE
scope: >-
  The two Babylonian captures of Jerusalem: the surrender of Jehoiachin in 597 BCE, dated
  precisely by the Babylonian Chronicle, and the destruction of the city and temple after
  the siege of 589/588 to 587 or 586 under Zedekiah, followed by deportations.
