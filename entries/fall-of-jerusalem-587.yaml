editorial:
  author_notes:
  - >-
    The 597 capture is fixed by the Babylonian Chronicle (2 Adar, year 7 = 15/16 March 597).
    The date of the second fall (587 vs 586) depends on how Judah's regnal years were reckoned;
    present both.
  - >-
    Archaeological evidence includes the destruction layers in the City of David (Area G,
    burnt rooms with bullae), Babylonian-type arrowheads, and the Lachish Level II destruction.
  - >-
    The deportation figures in Jer 52:28-30 (4,600 total) differ from 2 Kgs 24:14-16; discuss
    sources and possible meanings.
  - >-
    Avoid portraying the land as empty after 586 (the 'myth of the empty land' debate); Mizpah
    became the administrative centre.
