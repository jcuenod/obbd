editorial:
  author_notes:
  - >-
    The Iron Age city lies under the Roman, Byzantine and Umayyad remains of the Amman Citadel
    (Jebel al-Qalʿa), so Iron Age levels are fragmentary. The Amman Citadel inscription (ninth
    century) comes from the site.
  - >-
    Ammonite stone statuary (some with atef crowns) from the Amman area illustrates royal
    and elite iconography.
  - >-
    Ptolemy II Philadelphus refounded the city as Philadelphia, later a city of the Decapolis.
  - >-
    Speculative explanations of Og's 'bed' (dolmen, basalt sarcophagus) should be marked as
    such.
  sources_to_check:
  - MacDonald and Younker (eds.), Ancient Ammon (1999)
