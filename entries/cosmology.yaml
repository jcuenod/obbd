id: cosmology
title: Ancient Near Eastern Cosmology
type: concept
cultures: [ane]
scope: >-
  The ways ancient Near Eastern cultures pictured the structure of the world: heavens, earth,
  the waters above and below, and the netherworld. The entry surveys Mesopotamian, Egyptian,
  and Levantine conceptions and the cosmological assumptions shared by biblical texts. Creation
  narratives, combat myths, and individual features (firmament, pillars, tehom) have their
  own entries.
