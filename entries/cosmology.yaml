editorial:
  author_notes:
  - >-
    The "three-tiered universe" is a useful shorthand, but biblical texts use several images
    (tent, building on pillars, earth suspended over nothing) and do not offer one systematic
    model. Present the evidence as a family of overlapping pictures.
  - >-
    Mesopotamian sources describe multiple heavens of different stones and a subterranean
    apsû (Horowitz). Egyptian sources picture the sky goddess Nut arched over the earth god
    Geb, separated by Shu, with Nun as the surrounding waters.
  - >-
    Note the scholarly consensus that biblical writers shared the physical cosmology of their
    environment. Avoid concordist readings that harmonize the texts with modern science, and
    avoid presenting the shared picture as a sign of literary dependence.
  - >-
    The Babylonian Map of the World (BM 92687) is a good visual aid for the circular earth
    surrounded by the bitter river (marratu).
  sources_to_check:
  - Wayne Horowitz, Mesopotamian Cosmic Geography (1998)
  - Othmar Keel, The Symbolism of the Biblical World (1978)
