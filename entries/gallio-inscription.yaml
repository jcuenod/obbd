scope: >-
  Fragmentary Greek copy at Delphi of a letter of the emperor Claudius naming 'Lucius Junius
  Gallio, my friend and proconsul' of Achaia. Dated by Claudius's 26th imperial acclamation
  (c. 52 CE), it is the main anchor for absolute Pauline chronology.
passages:
- ref: Acts 18:12-17
  rel: attests
  note: Gallio, proconsul of Achaia, dismisses the Jews' charges against Paul
- ref: Acts 18:1-11
  rel: setting
  note: Paul's eighteen months at Corinth, dated relative to Gallio's term
