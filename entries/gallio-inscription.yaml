editorial:
  author_notes:
  - >-
    Explain the reconstruction of the nine fragments and the dating logic. Gallio's proconsulship
    is usually placed in 51-52 (less often 52-53), so Paul's hearing is in 51 or 52.
  - >-
    Gallio was the brother of Seneca. He left Achaia early because of illness (Seneca, Ep.
    104.1).
  - >-
    Note how Pauline chronology combines this with the expulsion of Jews from Rome under Claudius
    (Acts 18:2; Suetonius, Claud. 25.4), often dated to 49 CE but debated.
