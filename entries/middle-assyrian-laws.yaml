editorial:
  author_notes:
  - >-
    Excavated at Assur in the German campaigns (1903-14); the copies date to about the reign
    of Tiglath-pileser I (late 12th-11th c.), the composition probably earlier (14th c.).
    Penalties are notably harsh and corporal.
  - >-
    Levirate provisions are spread over several sections of Tablet A (c. §§30, 33, 43; verify
    against Roth). They differ from Deut 25:5-10, where the aim is to preserve the deceased's
    name and the brother may refuse.
  - >-
    MAL A §40 requires wives and daughters to veil and forbids prostitutes and slave women
    to do so; Gen 38:15 (Tamar veiled, taken for a prostitute) shows the Israelite custom
    cannot simply be equated. Gen 24:65 can be added.
  - >-
    No dedicated English Wikipedia article exists; the broader article 'Assyrian law' covers
    it.
  sources_to_check:
