scope: >-
  The Middle Assyrian law tablets from Assur, above all Tablet A on offences by and against
  women, marriage, widowhood, and veiling, together with tablets on property and other matters.
  They offer the closest ANE parallels to several laws in Deuteronomy 22 and 25.
passages:
- ref: Deut 25:11-12
  rel: parallel
  note: Woman who injures a man's testicles in a fight is mutilated (MAL A §8)
- ref: Deut 25:5-10
  rel: practice
  note: Widow given to her late husband's brother or father-in-law
- ref: Deut 22:22
  rel: parallel
  note: Adulterers caught in the act both liable to death (MAL A §§13-15)
- ref: Deut 22:23-27
  rel: parallel
  note: Consent and location in judging sexual assault (MAL A §12)
- ref: Deut 22:28-29
  rel: parallel
  note: Violator of an unbetrothed virgin pays her father and must marry her (MAL A §55)
- ref: Exod 22:16-17
  rel: parallel
  note: Seducer pays and may marry the girl at the father's discretion (MAL A §56) (MT 22:15-16)
- ref: Gen 38:14-15
  rel: practice
  note: Veiling regulated by status; prostitutes forbidden to veil (MAL A §40)
- ref: Exod 21:22-25
  rel: parallel
  note: Penalties for causing a miscarriage (MAL A §§21, 50-52)
- ref: Deut 25:1-3
  rel: practice
