scope: >-
  Hazael, king of Aram-Damascus, who seized the throne c. 842 and made Damascus the dominant
  power in the southern Levant. He is attested in Shalmaneser III's annals (as 'son of nobody'),
  probably as the author of the Tel Dan Stele, and in booty inscriptions on ivory and bronze.
