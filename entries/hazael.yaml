editorial:
  author_notes:
  - >-
    Shalmaneser III calls him 'son of a nobody', implying a usurper. This fits 2 Kgs 8:7-15.
    The Tel Dan Stele's mention of the speaker's father as king is a tension to discuss.
  - >-
    Booty inscriptions ('that which Hadad gave our lord Hazael'), on a horse frontlet and
    blinker found at Samos and Eretria and on Arslan Tash ivories, show his reach and how
    his loot later circulated.
  - >-
    The siege works and destruction at Tell eṣ-Ṣafi (Gath) are commonly tied to 2 Kgs 12:17.
    Present this as a strong correlation, not a proof.
