id: burney-relief
title: Burney Relief ("Queen of the Night")
aliases: [Queen of the Night relief]
type: artifact
cultures: [babylonian]
date:
  from: -1800
  to: -1750
  circa: true
  display: c. 1800–1750 BCE
scope: >-
  A fired clay plaque of the Old Babylonian period showing a nude winged goddess with bird's
  talons, standing on two lions flanked by owls and holding rod-and-ring symbols. Its identification
  (Ishtar, Ereshkigal, or a lilitu demon) is debated.
passages:
