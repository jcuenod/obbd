editorial:
  author_notes:
  - >-
    Unprovenanced; it appeared on the market in the 1920s, and its authenticity was questioned
    before it was accepted. The British Museum acquired it in 2003.
  - >-
    The Lilith identification derives from Frankfort (1937) reading of Isa 34:14 and later
    Jewish lore; most scholars now favour Ishtar/Inanna or Ereshkigal.
  - >-
    The biblical connections are weak; this entry is mainly useful for correcting popular
    claims that it depicts 'Lilith'.
