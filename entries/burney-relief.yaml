  rel: concept
  disputed: true
  note: Lîlît; Frankfort's identification of the figure with Lilith is now rarely accepted
- ref: Jer 44:17-19
  rel: concept
  disputed: true
  note: Queen of Heaven, if the figure is Ishtar
