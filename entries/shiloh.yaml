title: Shiloh
aliases: [Tel Shiloh, Khirbet Seilun]
type: site
cultures: [israelite]
scope: >-
  The site in the Ephraimite hill country remembered as the location of the tent of meeting
  and the ark before the monarchy. Covers the Bronze and Iron I remains, the Iron I destruction,
  and how biblical traditions about Shiloh's sanctuary and fall relate to the evidence.
