editorial:
  author_notes:
  - The identification with Khirbet Seilun is secure and fits the directions in Judg 21:19.
  - >-
    Danish (1926-32) and Finkelstein's (1981-84) excavations found Iron I pillared buildings
    with collared-rim jars, destroyed by fire c. 1050. Many link this to the Philistines after
    Ebenezer, though the text never narrates a destruction (Jeremiah and Ps 78 imply one).
  - >-
    No sanctuary structure has been found. Recent claims by the Associates for Biblical Research
    to have located the tabernacle site, and 'horned altar corners', are not mainstream and
    should be flagged as such.
  sources_to_check:
  - NEAEHL
  - Finkelstein (ed.), Shiloh - The Archaeology of a Biblical Site (1993)
  image_query: Tel Shiloh excavations
