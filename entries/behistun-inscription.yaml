id: behistun-inscription
title: Behistun Inscription
aliases: [Bisitun Inscription, Bisotun Inscription]
type: artifact
cultures: [persian, elamite, babylonian]
date:
  from: -520
  to: -518
  circa: true
  display: c. 520–518 BCE
scope: >-
  Monumental rock relief and trilingual inscription (Old Persian, Elamite, Babylonian) of
  Darius I at Bisotun in western Iran, recounting his accession and his suppression of the
  revolts of 522-521 BCE. An Aramaic version on papyrus from Elephantine shows its circulation
  through the empire; the monument was also the key to deciphering cuneiform.
passages:
- ref: Ezra 4:24
  rel: setting
  note: Temple work resumes in Darius's second year, just after the revolts were crushed
- ref: Hag 1:1
  rel: setting
  note: Haggai's oracles dated to Darius's second year (520 BCE)
- ref: Hag 2:6-7, 21-22
  rel: setting
  disputed: true
  note: Shaking of nations and overthrow of kingdoms, perhaps echoing the upheavals of 522-521
- ref: Zech 1:11
  rel: setting
  disputed: true
  note: '''The whole earth remains at peace'' after the empire''s pacification'
- ref: Esth 1:22; 3:12; 8:9
  rel: practice
  note: Royal edicts sent to every province in its own script and language
- ref: Ezra 6:11
  rel: practice
  note: Impalement threatened for violators; Darius records impaling rebel leaders
- ref: Esth 2:23; 7:9-10
  rel: practice
  note: Execution on a stake, a Persian punishment
