editorial:
  author_notes:
  - >-
    Explain Darius's account of the 'false Bardiya' (Gaumata) and the widely held view that
    Darius was himself a usurper; compare Herodotus 3.61-88.
  - >-
    Highlight the Aramaic version from Elephantine (late 5th century copy) as evidence of
    deliberate imperial dissemination of royal texts.
  - >-
    The links to Haggai and Zechariah are contextual (dating and atmosphere). Do not claim
    the prophets allude to the inscription.
  - >-
    Note the role of Ahuramazda ('by the favour of Ahuramazda') for discussions of Achaemenid
    religion, and Rawlinson's decipherment work of the 1830s-40s.
  sources_to_check:
