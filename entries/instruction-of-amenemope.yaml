editorial:
  author_notes:
  - >-
    Erman (1924) first drew the comparison. The once-argued reverse dependence (Amenemope
    on Proverbs) is now abandoned. Mediation through scribal training, or through an Aramaic
    or Phoenician intermediary, remains debated.
  - >-
    The parallels cluster in Prov 22:17-23:11 and thin out afterwards. Proverbs adapts rather
    than translates, adding YHWH-centred motivations (22:19, 23). Whether the section really
    divides into thirty sayings is disputed.
  - >-
    The main manuscript is P. British Museum EA 10474, with further witnesses on tablets and
    ostraca. A Ramesside composition date is usual; the very late (Saite) date once proposed
    has been abandoned.
  - Use the case to explain how Israelite scribes engaged international wisdom.
