id: instruction-of-amenemope
title: Instruction of Amenemope
aliases: [Teaching of Amenemope, Wisdom of Amenemope]
type: text
cultures: [egyptian]
date:
  from: -1250
  to: -1100
  circa: true
  display: c. 1250–1100 BCE
scope: >-
  A New Kingdom Egyptian instruction in thirty numbered chapters, from a father to his son,
  that praises the "silent" self-controlled man over the "heated" man. Its close correspondences
  with Prov 22:17-24:22 are the clearest case of literary dependence of a biblical text on
  an Egyptian one.
passages:
- ref: Prov 22:17-24:22
  rel: parallel
  note: '''Words of the wise'' section; dependence on Amenemope is the consensus'
- ref: Prov 22:20
  rel: language
  note: '''Thirty (sayings)'', usually emended from šlšwm; cf. Amenemope''s thirty chapters'
- ref: Prov 22:22
  rel: parallel
  note: Do not rob the poor (Amenemope ch. 2)
- ref: Prov 22:24-25
  rel: parallel
  note: Avoid the hot-tempered man (Amenemope chs. 9-10)
- ref: Prov 22:28
  rel: parallel
  note: Do not remove the ancient boundary (Amenemope ch. 6); cf. 23:10-11
- ref: Prov 22:29
  rel: parallel
  note: The skilled scribe/official will serve before kings (Amenemope ch. 30)
- ref: Prov 23:1-3
  rel: parallel
