id: forgeries-in-biblical-archaeology
title: Forgeries and Unprovenanced Objects
type: concept
cultures: [hebrew, jewish]
scope: >-
  Forged inscriptions and artefacts relating to the Bible, and the wider problem of unprovenanced
  antiquities, from the 19th-century Shapira affair to the Jehoash Inscription, the James
  Ossuary, the ivory pomegranate and the fake 'Dead Sea Scroll' fragments. The entry covers
  detection methods and the scholarly ethics of publishing looted or unprovenanced material.
passages:
- ref: 2Kgs 12:4-16
  rel: parallel
  note: The forged 'Jehoash Inscription' was modelled on this temple-repair account (MT 12:5-17)
- ref: Exod 28:33-34
  rel: realia
  note: >-
    Pomegranates on the priestly robe; the ivory pomegranate's inscription is widely judged
    forged
- ref: Gal 1:19
  rel: attests
  disputed: true
  note: >-
    James the Lord's brother; the James Ossuary's 'brother of Jesus' is widely judged forged
    or unproven
