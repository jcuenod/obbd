editorial:
  author_notes:
  - >-
    Cover the classic cases: Shapira's Moabite pottery (1870s) and Deuteronomy strips (1883);
    the ivory pomegranate (inscription judged forged, IAA 2004); the Jehoash Inscription;
    the James Ossuary (the 2012 trial did not authenticate it); the Moussaieff ostraca; the
    Museum of the Bible 'DSS' fragments (all judged modern by 2020).
  - >-
    Many seals and bullae that name biblical figures are unprovenanced. Recommend that the
    project flag provenance on every relevant entry.
  - >-
    Explain detection methods (palaeography, patina and petrographic analysis, too-perfect
    biblical phrasing) and their limits. Experts also disagree about some cases.
  - >-
    Note the recent attempt to rehabilitate the Shapira scroll (Dershowitz 2021) and the critical
    responses. Present the scroll as generally regarded as a forgery.
