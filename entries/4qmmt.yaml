id: 4qmmt
title: 4QMMT (Some Precepts of the Torah)
aliases: [Miqṣat Maʿaśê ha-Torah, Halakhic Letter, 4Q394-399]
type: text
cultures: [jewish]
scope: >-
  A legal composition from Qumran preserving Second Temple Jewish rulings on purity and worship.
  It explains communal separation and uses language about "works of the law" and righteousness.
  It is a reconstructed composition preserved in six manuscripts.
passages:
- ref: Gal 2:16
  rel: language
  note: >-
    MMT's 'works of the law' supplies a Jewish lexical comparison; its significance for Paul
    remains debated
- ref: Rom 3:20-28
  rel: language
  note: Compare MMT C26-32 on legal observance and righteousness, without equating the arguments
- ref: Gal 2:11-14
  rel: practice
  note: >-
    Legal disagreements could produce social separation; compare the dispute over shared meals
- ref: Mark 7:1-23
  rel: practice
  note: >-
    Diverse Jewish purity rulings contextualize disputes over practice without identifying
    identical rules or parties
related: [community-rule, temple-scroll, jewish-sects, purity-and-impurity, dead-sea-scrolls,
  calendars-and-month-names]
