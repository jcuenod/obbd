editorial:
  author_notes:
  - Its original addressee, letter form, and attached calendar are debated.
  - >-
    Compare the phrase "works of the law" without identifying Paul's opponents with the MMT
    community or asserting literary dependence. The lexical comparison is clear enough to
    tag; its significance for Paul requires separate argument.
