id: hittite-vassal-treaties
title: Hittite Vassal Treaties
type: text
cultures: [hittite]
date:
  from: -1400
  to: -1200
  circa: true
  display: c. 1400–1200 BCE
scope: >-
  The Late Bronze Age treaties by which Hittite great kings bound subordinate rulers. They
  typically include a preamble, historical prologue, stipulations, provisions for deposit
  and public reading, divine witnesses, and curses and blessings. Since Mendenhall (1954)
  they have been central to the comparison of covenant forms in Exodus, Deuteronomy, and Joshua.
passages:
- ref: Exod 20:2
  rel: form
  note: Self-identification of the overlord with his past benefaction (historical prologue)
- ref: Exod 20:1-17
  rel: form
  disputed: true
  note: Decalogue read as treaty stipulations of exclusive loyalty (Mendenhall)
- ref: Deut 1:6-3:29
  rel: form
  note: Historical review of the relationship before the stipulations
- ref: Josh 24:1-28
  rel: form
  note: 'Covenant ceremony: history, stipulations, witnesses, written record'
- ref: Deut 31:9-13, 24-26
  rel: practice
  note: Document deposited in the sanctuary and periodically read aloud
- ref: Exod 25:16
  rel: practice
  note: Covenant document ('testimony') placed in the ark
- ref: Deut 28
  rel: form
  note: Blessings and curses as treaty sanctions
- ref: Deut 30:19
  rel: form
  note: Heaven and earth invoked as witnesses, as at the end of Hittite divine-witness lists
