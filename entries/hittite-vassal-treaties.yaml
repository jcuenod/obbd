editorial:
  author_notes:
  - >-
    Mendenhall, Baltzer, McCarthy, and Kitchen argued that the Hittite form matches the Sinai/Deuteronomy
    covenant and supports an early date. Most now find Deuteronomy's closest analogues in
    7th-c. Neo-Assyrian oaths, yet Hittite features (historical prologue, blessings) remain;
    Berman revives the Hittite comparison.
  - >-
    Representative texts: Šuppiluliuma I with Aziru of Amurru; Muršili II with Tuppi-Teššub;
    the bronze tablet of Tudḫaliya IV with Kurunta (found at Ḫattuša in 1986).
  - >-
    Treat the Decalogue-as-treaty idea as contested; the analogy holds better for Deuteronomy
    as a whole.
  sources_to_check:
