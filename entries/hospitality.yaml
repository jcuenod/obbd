editorial:
  author_notes:
  - >-
    Danel and Danatay host the craftsman god Kothar-wa-Ḫasis (Aqhat, KTU 1.17 V), a close
    Levantine parallel to Gen 18. Greek xenia and theoxeny tales (e.g., Philemon and Baucis
    in Ovid) are later comparanda for Heb 13:2.
  - >-
    Gen 19 and Judg 19 are paired narratives of violated hospitality. Note the interpretive
    tradition (Ezek 16:49; Wisdom 19) that defines Sodom's sin socially.
  - >-
    Sinuhe's reception by a Syro-Palestinian chief shows Egyptian literary portrayals of Levantine
    hospitality.
  - Caution against reading modern Bedouin ethnography directly back into the Iron Age.
