title: Hospitality
aliases: [Theoxeny, Guest-friendship]
type: practice
cultures: [hebrew, ugaritic, ane]
scope: >-
  Norms of receiving and protecting strangers and guests in biblical narrative and law, with
  ancient Near Eastern and Greek comparanda, including the motif of entertaining divine visitors
  unawares.
passages:
- ref: Gen 18:1-8
  rel: practice
