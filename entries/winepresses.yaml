editorial:
  author_notes:
  - >-
    Rock-cut presses with a treading floor (gat) and collecting vat (yeqeb) are common throughout
    the highlands. Note that they are hard to date.
  - >-
    Gibeon has 8th-7th-century installations interpreted as wine cellars, and jar handles
    inscribed with gbʿn and personal names. The Samaria ostraca mention 'old wine' (yn yšn).
  - >-
    Link to vintage festivals (Judg 9:27; 21:19-21; Booths) and to Neh 13:15 for the Sabbath
    prohibition on treading and transport.
