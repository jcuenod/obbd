id: yam
title: Yam (Sea)
aliases: [Yammu, Sea, Prince Sea, Judge River]
type: deity
cultures: [ugaritic, canaanite]
scope: >-
  Yam ("Sea"), the Ugaritic sea god, also called Judge River (ṯpṭ nhr), whose bid for kingship
  is defeated by Baal in the Baal Cycle. The entry covers the deity and the biblical motif
  of YHWH's rebuke, restraint and defeat of the personified Sea (yām) and Rivers.
passages:
- ref: Job 7:12
  rel: imagery
  note: '''Am I the Sea, or the Dragon, that you set a guard over me?'''
- ref: Job 38:8-11
  rel: imagery
  note: Sea shut in with doors and given its limit
- ref: Ps 74:13
  rel: imagery
  note: YHWH divided the Sea by his might
- ref: Ps 89:9
  rel: imagery
  note: YHWH rules the raging of the Sea (MT 89:10)
- ref: Ps 93:3-4
  rel: imagery
  note: Floods (neharot) lifted up; YHWH mightier than the Sea
- ref: Hab 3:8
  rel: imagery
  note: Wrath against the Rivers and the Sea, mirroring Yam // Nahar
- ref: Nah 1:4
  rel: imagery
  note: He rebukes the Sea and makes it dry
- ref: Isa 51:10
  rel: imagery
  note: Drying the Sea and the great deep at the exodus
- ref: Mark 4:39
  rel: imagery
  note: Jesus rebukes the wind and silences the Sea
- ref: Rev 21:1
  rel: imagery
