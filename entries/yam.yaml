editorial:
  author_notes:
  - >-
    Yam is the clearest Levantine antecedent for biblical Sea-combat language; the older derivation
    from Babylonian Tiamat (Gunkel) has largely given way to a West Semitic background (Day),
    though both matter.
  - >-
    Biblical yām is never worshipped and usually personified only in poetry; distinguish mythic
    imagery from belief in a rival god.
  - Note the parallel pair ym // nhr in Ugaritic and the Hebrew pair yām // nəhārôt.
  - >-
    Baal's victory with clubs made by Kothar (KTU 1.2 IV) and the cry "Yam is dead, Baal reigns"
    link sea-victory to kingship (cf. Ps 93).
  sources_to_check:
  - KTU 1.2
  - J. Day, God's Conflict with the Dragon and the Sea (1985)
  - DDD, s.v. "Yam"
