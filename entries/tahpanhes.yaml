editorial:
  author_notes:
  - >-
    Petrie excavated the site in 1886 and called the main fortress building 'Qasr Bint el-Yehudi'
    ('palace of the Jew's daughter'), linking it to Jer 43. The local name and Petrie's identification
    of the brick pavement of Jer 43:9 are not evidence. Recent British Museum work (Leclère
    and Spencer) has reinterpreted the site.
  - >-
    Herodotus (2.30, 2.154) mentions the garrison at Daphnae and Greek mercenaries in the
    eastern Delta. Abundant East Greek pottery shows a mixed population. This context of foreign
    soldiers and refugees suits Jer 43-44.
  - >-
    Do not confuse the place with Queen Tahpenes (1 Kgs 11:19-20), wife of a pharaoh in Solomon's
    time. The names are only similar.
  - >-
    The fragmentary Babylonian text on Nebuchadnezzar's 37th year (BM 33041) attests a campaign
    against Amasis but gives little detail; Jer 43:10-13 cannot be matched to it closely.
  sources_to_check:
  - 'W. M. F. Petrie, Tanis II: Nebesheh (Am) and Defenneh (Tahpanhes) (1888)'
  - >-
    F. Leclère and J. Spencer, Tell Dafana Reconsidered: The Archaeology of an Egyptian Frontier
    Town (BMRP 199, 2014)
