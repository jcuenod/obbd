id: tahpanhes
title: Tahpanhes (Daphnae)
aliases: [Daphnae, Tell Defenneh, Tell Dafana, Tehaphnehes]
type: site
cultures: [egyptian, judahite, greek]
scope: >-
  A Saite-period fortress town on the eastern edge of the Nile Delta (Tell Defenneh), the
  Greek Daphnae where Psammetichus I stationed a frontier garrison. Jeremiah places Judean
  refugees there after the murder of Gedaliah, and it stands for Egypt in several prophetic
  oracles.
passages:
- ref: Jer 2:16
  rel: setting
  note: People of Memphis and Tahpanhes have broken the crown of your head
- ref: Jer 43:7-9
  rel: setting
  note: >-
    Judean refugees with Jeremiah reach Tahpanhes; stones hidden at the entrance of Pharaoh's
    palace
- ref: Jer 43:10-13
  rel: event
  disputed: true
  note: Nebuchadnezzar to set his throne there; cf. his campaign against Egypt in 568/567
- ref: Jer 44:1
  rel: setting
  note: Judeans living at Migdol, Tahpanhes, Memphis and Pathros
- ref: Jer 46:14
  rel: setting
  note: Proclaim in Migdol, Memphis and Tahpanhes
- ref: Ezek 30:18
  rel: setting
  note: At Tehaphnehes the day shall be dark when Egypt's yokes are broken
