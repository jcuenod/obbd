editorial:
  author_notes:
  - >-
    Lachish 701 is the richest single dataset. It includes arrowheads, sling stones, scale
    armour, and the siege ramp, together with Sennacherib's reliefs showing Judahite slingers
    and archers.
  - >-
    Goliath's equipment is read as Aegean or Philistine (Yadin) or as a literary composite
    reflecting later, even 7th-century hoplite, armour (Finkelstein). Present both views.
  - >-
    The meaning of kîdôn (javelin, scimitar, or sickle-sword) is disputed. The War Scroll
    uses the term for a straight sword.
  - >-
    The ḥiššĕbōnôt of 2 Chr 26:15 cannot be torsion artillery, which appears only in the 4th
    century. Yadin proposed protective screens on towers like those in the Lachish reliefs.
  sources_to_check:
  - Yadin, The Art of Warfare in Biblical Lands (1963)
