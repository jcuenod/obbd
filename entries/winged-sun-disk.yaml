cultures: [egyptian, assyrian, persian, judahite]
scope: >-
  The winged sun disc, an emblem of divine and royal protection in Egypt that spread across
  the Near East (Assyria, Persia, the Levant), and its appearance on Judahite royal seals.
  The entry covers its relevance to biblical solar language for YHWH.
