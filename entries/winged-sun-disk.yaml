editorial:
  author_notes:
  - >-
    The emblem appears on Hezekiah's royal bulla and on the two-winged LMLK stamp type. Its
    adoption in late 8th-century Judah is usually read as royal Egyptianizing iconography,
    though some scholars argue for solar YHWH symbolism.
  - >-
    In Assyria a figure in a winged disc is often identified as Ashur (sometimes Shamash).
    The Persian figure in a winged disc is widely, but not universally, identified with Ahura
    Mazda. Keep the identification hedged.
  - >-
    Taylor (Yahweh and the Sun, 1993) argues for a strong solar dimension in Judahite Yahwism.
    Many reviewers judged that thesis overstated. Use it with caution.
