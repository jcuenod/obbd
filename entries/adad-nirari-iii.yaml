id: adad-nirari-iii
title: Adad-nirari III
type: person
cultures: [assyrian]
date:
  from: -811
  to: -783
  display: 811–783 BCE
scope: >-
  King of Assyria (811-783 BCE), son of Šamši-Adad V and Sammu-ramat. His western campaigns
  around 805-796 broke the power of Aram-Damascus and received tribute from Joash of Samaria,
  Tyre, Sidon, Edom and Philistia, which helps explain Israel's recovery under Joash and Jeroboam
  II. The Tell al-Rimah stele has its own entry.
passages:
- ref: 2Kgs 13:5
  rel: event
  disputed: true
  note: >-
    YHWH gives Israel a 'saviour' from Aram's oppression; often identified with Adad-nirari
    III
- ref: 2Kgs 13:10-13
  rel: attests
  note: Jehoash (Joash) of Israel, 'Iuʾasu the Samarian' on the Tell al-Rimah stele
- ref: 2Kgs 13:22-25
  rel: setting
  note: Joash recovers towns from Ben-hadad son of Hazael after Damascus is weakened
- ref: 2Kgs 14:25-28
  rel: setting
  note: Jeroboam II restores Israel's border from Lebo-hamath, after Aram's decline
