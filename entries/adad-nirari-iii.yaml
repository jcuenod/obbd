editorial:
  author_notes:
  - >-
    The main western sources are the Calah (Nimrud) slab, which lists Tyre, Sidon, 'the land
    of Omri', Edom and Philistia; the Saba'a stele, which records tribute from Mariʾ of Damascus;
    and the Tell al-Rimah stele, which names Joash. They compress several campaigns, so the
    date of Joash's tribute (often 796) is debated.
  - >-
    Identifying the 'saviour' of 2 Kgs 13:5 with Adad-nirari III is common but not certain.
    Alternatives include Jeroboam II (2 Kgs 14:27) and Elisha.
  - >-
    Sammu-ramat, his mother, held unusual prominence in his early reign (e.g. the Pazarcık
    stele). The Greek Semiramis legend draws loosely on her. Keep the historical queen and
    the legend apart.
  - >-
    A dedication on Nabu statues from Nimrud ('Trust in Nabu, do not trust in another god')
    has been read as a monotheistic reform. That reading is not accepted. It is a devotional
    formula in a polytheistic setting.
  sources_to_check:
