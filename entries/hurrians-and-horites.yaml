editorial:
  author_notes:
  - >-
    The Hurrians are attested from the late third millennium (Urkesh). Mitanni was a major
    power in the fifteenth and fourteenth centuries; Tushratta's Amarna letters are an example.
    Hurrian personal and divine names occur in Late Bronze Canaan, as in Abdi-Heba of Jerusalem,
    and Egyptian 'Ḫurru' can denote Syria-Palestine.
  - >-
    The equation Horite = Hurrian is debated. The Horites of Gen 36 bear Semitic names, and
    some read ḥōrî as 'cave dweller' or a local group name. Some link the Hivites with Hurrians
    instead. The LXX evidence should be checked verse by verse.
  - >-
    Nuzi-based explanations of patriarchal customs (Speiser, Gordon) were largely refuted
    by Thompson and Van Seters in the 1970s. Present them historiographically.
  sources_to_check: ['Wilhelm, The Hurrians (1989)']
