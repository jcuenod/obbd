scope: >-
  The Hurrians, a non-Semitic people of northern Mesopotamia and Syria (Urkesh, Mitanni, Nuzi,
  Alalakh), and the biblical Horites of Seir. Covers Hurrian history and influence in the
  Levant and the debated equation of Horites (and Hivites) with Hurrians.
