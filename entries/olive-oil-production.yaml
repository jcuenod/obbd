editorial:
  author_notes:
  - >-
    Ekron (Tel Miqne) in the 7th century had more than 100 olive presses, the largest known
    Iron Age oil centre, flourishing under Assyrian hegemony (Gitin). Its integration into
    the imperial economy is debated.
  - >-
    The Samaria ostraca record deliveries of 'washed' or refined oil (šmn rḥṣ) and wine. They
    are evidence for administrative collection, though their exact function is disputed.
  - >-
    Explain the technology. Olives were crushed in a basin and pressed in a beam press with
    stone weights, later supplemented by screw presses and the rotary crushing mill in the
    Hellenistic-Roman period. 'Beaten' oil (kātît) was the highest grade.
  sources_to_check:
  - >-
    Frankel, Wine and Oil Production in Antiquity in Israel and Other Mediterranean Countries
    (1999)
