id: ten-plagues-and-egyptian-gods
title: The Plagues and the Gods of Egypt
aliases: [Plagues of Egypt]
type: concept
cultures: [egyptian, hebrew]
scope: >-
  The biblical claim that the exodus plagues were YHWH's "judgments on all the gods of Egypt"
  (Exod 12:12; Num 33:4), and modern attempts to correlate individual plagues with particular
  Egyptian deities or natural phenomena. The entry assesses what Egyptian evidence can and
  cannot support.
passages:
- ref: Exod 12:12
  rel: polemic
  note: YHWH will execute judgments on all the gods of Egypt
- ref: Num 33:4
  rel: polemic
  note: YHWH executed judgments on their gods
- ref: Exod 7:8-13
  rel: polemic
  note: Aaron's staff-serpent swallows the magicians' staffs
- ref: Exod 8:18-19
  rel: polemic
  note: 'Magicians fail: ''This is the finger of God''; MT 8:14-15'
- ref: Exod 7:14-24
  rel: polemic
  disputed: true
  note: Nile turned to blood, read as an affront to the deified inundation (Hapi)
- ref: Exod 10:21-23
  rel: polemic
  disputed: true
  note: Darkness over Egypt, read as defeat of the sun god Re
- ref: Isa 19:1
  rel: polemic
  note: The idols of Egypt tremble before YHWH
- ref: Jer 46:25
  rel: polemic
  note: Punishment on Amon of Thebes, pharaoh, and Egypt's gods
