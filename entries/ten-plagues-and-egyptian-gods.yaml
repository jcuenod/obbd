editorial:
  author_notes:
  - >-
    The text itself makes the polemic claim only in general terms (Exod 12:12; Num 33:4) and
    in the contest with the magicians. The popular one-to-one schema (frogs = Heqet, cattle
    = Apis or Hathor, darkness = Re, and so on) is a homiletic construct. Several of its identifications
    rest on minor or misdescribed deities. Present it as such.
  - >-
    Naturalistic sequences explaining the plagues (Hort's algal-bloom chain; the Thera eruption)
    and the Ipuwer correlation are speculative or rejected. Mention them as popular explanations,
    not scholarly consensus.
  - >-
    Source criticism finds interwoven J and P plague cycles, and Pss 78:43-51 and 105:27-36
    give different lists and orders. These literary questions matter for any "historical"
    correlation.
  - >-
    Contest-of-magicians scenes fit Egyptian literary tradition (e.g., the Westcar tales of
    lector-priests). This is a firmer Egyptian background than the deity schema.
  sources_to_check:
  - Hoffmeier, Israel in Egypt (1997)
  - Propp, Exodus 1-18 (Anchor Bible 2, 1999)
  - Currid, Ancient Egypt and the Old Testament (1997)
