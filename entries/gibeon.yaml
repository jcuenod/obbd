editorial:
  author_notes:
  - >-
    Pritchard's excavations (1956-62) found jar handles inscribed gbʿn with personal names,
    which secured the identification with el-Jib.
  - >-
    The rock-cut pool (about 11 m across, with a spiral staircase) and the stepped tunnel
    to the spring are Iron Age. The exact dates are debated. Many rock-cut cellars point to
    a wine industry.
  - >-
    Late Bronze remains are meagre, which bears on the historicity of Josh 9-10. Gibeon is
    also named in Shoshenq I's list.
  sources_to_check:
