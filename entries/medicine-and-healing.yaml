editorial:
  author_notes:
  - >-
    Mesopotamia: the asû (who worked mainly with drugs and bandages) and the āšipu (who worked
    mainly with incantation and diagnosis) overlapped. Avoid a 'rational versus magical' contrast.
    Mention the Diagnostic Handbook (Sakikkû) and Hammurabi §§215-223 on surgeons' fees and
    liabilities. Exod 21:19 has close parallels in Hammurabi §206 and Hittite Laws §10, which
    both require payment of the physician.
  - >-
    Egypt: the Ebers and Edwin Smith papyri, and the reputation of Egyptian physicians abroad
    (Herodotus 2.84; Jer 46:11). The physicians of Gen 50:2 embalm rather than treat.
  - >-
    There is little evidence of professional physicians in Israel before the Hellenistic period.
    Prophets act as healers (1 Kgs 17; 2 Kgs 4-5; 2 Kgs 20). 2 Chr 16:12 criticizes reliance
    on physicians instead of YHWH, perhaps because healing was bound up with other gods. Sir
    38:1-15 reconciles physician and prayer. Present the development and its debates.
  - >-
    Avoid retrospective diagnosis. Ṣāraʿat is not Hansen's disease (leprosy), and 'fig poultice'
    should not be turned into modern pharmacology. Ugaritic horse-medicine texts also prescribe
    pressed figs; verify before citing.
  - >-
    Greco-Roman setting of the NT: Asclepius sanctuaries (Epidaurus, Pergamon, Corinth), Hippocratic
    medicine, and the image of Luke as 'the beloved physician' (Col 4:14).
  sources_to_check:
  - H. Avalos, Illness and Health Care in the Ancient Near East (HSM 54, 1995)
  - J. Scurlock and B. R. Andersen, Diagnoses in Assyrian and Babylonian Medicine (2005)
  - J. F. Nunn, Ancient Egyptian Medicine (1996)
  - 'M. J. Geller, Ancient Babylonian Medicine: Theory and Practice (2010)'
