id: medicine-and-healing
title: Medicine, Physicians, and Healing
aliases: [Physicians, Healing, Disease, Asû, Āšipu]
type: practice
cultures: [hebrew, mesopotamian, egyptian, greek, jewish]
scope: >-
  Illness and its treatment in the ancient Near East and the Greco-Roman world, and in biblical
  texts: the Mesopotamian asû (physician) and āšipu (exorcist), Egyptian medical papyri, Greek
  medicine and healing cults, and biblical attitudes to physicians, remedies and divine healing.
  Skin disease and purity rules, demons and amulets are treated in their own entries.
