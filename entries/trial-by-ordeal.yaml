id: trial-by-ordeal
title: Trial by Ordeal
aliases: [River ordeal, Sotah, Ordeal of bitter water]
type: practice
cultures: [hebrew, akkadian, assyrian, amorite]
scope: >-
  Judicial procedures that referred an unprovable case to divine decision through a physical
  test, especially the Mesopotamian river ordeal, and the ritual for a wife suspected of adultery
  in Num 5:11-31. Covers whether the biblical rite should be classed as ordeal or as conditional
  curse.
passages:
- ref: Num 5:11-31
  rel: practice
  note: Suspected wife drinks 'water of bitterness' under a conditional curse
- ref: Num 5:21-22, 27
  rel: practice
  note: Physical effects on womb and 'thigh' as the sign of guilt
- ref: Exod 22:7-11
  rel: practice
  note: Unprovable deposit cases settled 'before God' and by oath (MT 22:6-10)
- ref: 1Kgs 8:31-32
  rel: practice
  note: Oath at the altar, with God judging between the parties
- ref: Exod 32:20
  rel: parallel
  disputed: true
  note: Israel made to drink water with the ground-up calf, often compared to Num 5
related: [code-of-hammurabi, middle-assyrian-laws, mari-letters, oaths-and-oath-formulas,
  blessings-and-curses, divination]
media: []
