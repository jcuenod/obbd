editorial:
  author_notes:
  - >-
    Mesopotamian river ordeal (Akk. ḫuršān; the divine River) occurs in LH §2 (sorcery) and
    §132 (a wife accused by others), in several Middle Assyrian provisions (e.g., MAL A §§17,
    22, 24; verify), and in Mari letters describing ordeals at Hīt. Under LH §131 a wife accused
    by her husband takes an oath instead.
  - >-
    Frymer-Kensky classifies Num 5 as an ordeal. Milgrom reads it as a ritual protecting the
    woman from mob or husbandly violence. Present both readings; most also note the text's
    composite character.
  - >-
    The physical outcome is ambiguous (miscarriage, prolapse, sterility). Avoid medicalised
    certainty.
  - Mishnah Soṭah records the rite's elaboration and its discontinuation (m. Soṭah 9:9).
  sources_to_check:
  - Roth, Law Collections from Mesopotamia and Asia Minor (SBLWAW 6, 2nd ed. 1997)
  - ANET 163-180
