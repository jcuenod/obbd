cultures: [hebrew, greek, roman]
scope: >-
  Grain-grinding technology from the Iron Age saddle quern to the Hellenistic hopper-rubber
  and Roman rotary and donkey mills, grinding as daily household labour, and the millstone
  in biblical law and imagery.
