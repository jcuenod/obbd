editorial:
  author_notes:
  - >-
    The Iron Age saddle quern (a basalt lower stone with a hand-held upper stone) was operated
    by women for hours each day, which explains why grinding is an image of the household
    and of degradation (Exod 11:5; Judg 16:21; Isa 47:2).
  - >-
    Trace later technology. The Hellenistic hopper-rubber (Olynthus mill) was followed by
    the rotary quern and the large donkey-driven mill. 'Donkey millstone' (mylos onikos) in
    Matt 18:6 refers to the latter.
  - >-
    Deut 24:6 treats the millstone as means of life. Compare garment pledges (Exod 22:26-27).
