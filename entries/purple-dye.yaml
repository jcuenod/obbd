editorial:
  author_notes:
  - >-
    Explain the source. The dye comes from the hypobranchial gland of Hexaplex (Murex) trunculus
    and Bolinus brandaris. Tĕkēlet (blue-violet) and ʾargāmān (red-purple) probably came from
    the same species processed differently. Note the debate.
  - >-
    Archaeology includes the Iron Age dye installation at Tel Shiqmona with purple-stained
    vats and sherds, and Timna textile fragments dyed with true murex purple (late 11th-10th
    century).
  - >-
    Cognates include Ugaritic and Akkadian argamannu (also 'tribute') and takiltu. The derivation
    of 'Phoenician' from a Greek word for purple-red is a common claim but debated.
  sources_to_check:
  - King and Stager, Life in Biblical Israel (2001)
