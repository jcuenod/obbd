scope: >-
  The Midianites of northwestern Arabia and the Kenites, a group linked with Moses' father-in-law
  and with metalworking. Covers the biblical traditions, the archaeology of the Hejaz (Qurayyah)
  and the southern Arabah, and the Midianite-Kenite hypothesis of YHWH's origins.
