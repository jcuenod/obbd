type: site
cultures: [canaanite, israelite]
scope: >-
  The major tell commanding the Wadi Ara pass into the Jezreel Valley, occupied from the Chalcolithic
  to the Persian period. Covers its Bronze Age city-state, its Iron Age palaces, gates, pillared
  buildings and water system, and its role in the chronology debate and in the image of Armageddon.
