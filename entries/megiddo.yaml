editorial:
  author_notes:
  - >-
    Thutmose III's siege (mid-fifteenth century) is the earliest detailed battle account;
    Biridiya of Megiddo writes in the Amarna letters.
  - >-
    The dating of Strata VA-IVB and IVA, the six-chambered gate and Palaces 1723 and 6000
    is central to the low chronology debate (Yadin's 'Solomonic' Megiddo vs. Finkelstein and
    Ussishkin's Omride or later attribution). Do not present the Solomonic attribution as
    established.
  - >-
    The pillared buildings have been read as stables, storehouses or barracks. The Tel Aviv
    expedition has argued for stables and a horse-training centre in the eighth century.
  - >-
    A fragment of a Shoshenq I stele was found in the spoil of the University of Chicago dig
    (1920s-30s). It is unstratified but confirms the pharaoh's presence.
  - >-
    Correct popular 'end-times battlefield' readings. The Hebrew etymology of Armageddon is
    the usual view but not certain.
  sources_to_check: [NEAEHL, 'Moran, The Amarna Letters (1992)']
