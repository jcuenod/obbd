editorial:
  author_notes:
  - >-
    Comparative texts: Hammurabi §§129-133 (adultery; the husband may spare his wife and the
    king the man; rape of a betrothed woman; oath and river ordeal for suspicion) and §§154-158
    (incest); Laws of Eshnunna §§26-28; Middle Assyrian Laws A §§12-16 and 55-56 (the rapist
    of a virgin must marry her and the father may take the rapist's wife; compare Deut 22:28-29
    and Exod 22:16-17); Hittite Laws §§187-200 (incest and bestiality). Hittite Laws §197
    makes the same mountain/house distinction as Deut 22:23-27.
  - >-
    Ancient categories differ from modern ones. The offences are framed largely as wrongs
    against a husband's or father's rights and, in Lev 18 and 20, as pollution of the land
    (Lev 18:24-30). Whether Deut 22:28-29 (tāpaś 'seize') describes rape, and how it relates
    to Exod 22:16-17 (pittâ 'entice'), is debated. Present the debate without anachronistic
    labels in either direction.
  - >-
    The prescribed death penalties are not evidence that they were regularly carried out.
    Prov 6:34-35, Hammurabi §129 and MAL A §15 suggest that the injured husband had a say
    in the penalty.
  - >-
    Lev 18 and 20 belong to the Holiness Code (H) and address men. Discuss the relation between
    the two lists. Present interpretations of Lev 18:22 and 20:13 neutrally and in their ancient
    context, without modern advocacy.
  - >-
    Keep the 'cultic prostitution' question separate and refer readers to cultic-prostitution.
  sources_to_check:
  - M. T. Roth, Law Collections from Mesopotamia and Asia Minor (SBLWAW 6, 2nd ed. 1997)
