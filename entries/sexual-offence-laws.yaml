id: sexual-offence-laws
title: Adultery, Rape, and Sexual Offence Laws
aliases: [Adultery, Rape, Seduction, Incest, Forbidden Unions]
type: practice
cultures: [hebrew, assyrian, babylonian, hittite]
scope: >-
  Biblical laws on adultery, rape and seduction, incest and other prohibited unions (Exod
  22:16-17; Lev 18; 20; Deut 22:13-29), compared with the Laws of Hammurabi, the Middle Assyrian
  Laws (Tablet A), the Hittite Laws and the Laws of Eshnunna, together with narratives that
  presuppose them. Marriage payments, levirate marriage and the ordeal of the suspected wife
  are treated under their own entries.
