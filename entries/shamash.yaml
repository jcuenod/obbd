editorial:
  author_notes:
  - >-
    The "solar Yahwism" thesis (J. G. Taylor) is debated; separate solar imagery for YHWH,
    which is common, from a solar YHWH cult, which is contested.
  - >-
    Shamash as judge, who sees all and is invoked in divination (with Adad), is the main background
    for sun-justice imagery (Ps 19; Mal 4:2).
  - >-
    Ugaritic Shapash is female, the "torch of the gods" who travels to the netherworld; note
    the gender difference from Mesopotamia.
  - >-
    Josh 10:12-13 has been read against omen literature (Holladay); mention only as a proposal.
  sources_to_check:
  - J. G. Taylor, Yahweh and the Sun (JSOTSup 111, 1993)
  - W. G. Lambert, Babylonian Wisdom Literature (1960) (Shamash Hymn)
  - DDD, s.v. "Shemesh"
