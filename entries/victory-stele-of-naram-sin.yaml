id: victory-stele-of-naram-sin
title: Victory Stele of Naram-Sin
type: artifact
cultures: [akkadian]
date:
  from: -2250
  to: -2250
  circa: true
  display: c. 2250 BCE
scope: >-
  The pink limestone stele of Naram-Sin of Akkad celebrating his victory over the Lullubi
  of the Zagros. The king, wearing a horned crown that marks divine status, ascends a mountain
  over fallen enemies beneath celestial symbols. The stele was carried off to Susa as booty
  by the Elamite king Shutruk-Nahhunte in the 12th century.
passages:
- ref: Isa 14:13-14
  rel: imagery
  note: Royal ascent to the heights and claim to be like the Most High
- ref: Ezek 28:2
  rel: imagery
  note: Ruler who claims 'I am a god'
- ref: Ezek 28:14-16
  rel: imagery
  note: Royal figure on the holy mountain of God, cast down
- ref: Josh 10:24
  rel: practice
  note: Victor's feet on the necks of defeated kings
- ref: Ps 110:1
  rel: imagery
  note: Enemies made a footstool for the king's feet
- ref: Ps 18:37-42
  rel: imagery
  note: King tramples and crushes pursued enemies (MT 18:38-43)
