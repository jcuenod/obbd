editorial:
  author_notes:
  - >-
    Found at Susa by the French mission in 1898; explain the Elamite capture and Shutruk-Nahhunte's
    added inscription as an instance of seizing monuments as booty.
  - >-
    Naram-Sin was the first Mesopotamian king to take the divine determinative before his
    name; the horned crown visualises this claim. Avoid saying the Bible 'refers to' Naram-Sin.
  - >-
    The Isaiah and Ezekiel passages belong to a widespread ANE theme of royal hubris and divine
    kingship; present the stele as illustration, not source.
  - >-
    Naram-Sin's later reputation (the Curse of Agade) as a king who offended the gods is relevant
    to the hubris theme.
  sources_to_check:
