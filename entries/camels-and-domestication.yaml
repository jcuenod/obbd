editorial:
  author_notes:
  - >-
    Domestic dromedaries appear in the southern Levant in quantity only from about the late
    10th century BCE. Sapir-Hod and Ben-Yosef (Tel Aviv 41, 2014) date their first appearance
    in the Aravah copper sites to the last third of the 10th century. Camels become common
    with the Iron II Arabian trade.
  - >-
    The anachronism argument is old (Albright and others). The 2014 media coverage overstated
    its novelty. Present it as a long-standing consensus that the patriarchal camel references
    reflect first-millennium conditions, while noting earlier sporadic finds of camel bones
    and images.
  - >-
    Assyrian evidence includes Gindibu the Arab's 1,000 camels at Qarqar (853, Kurkh Monolith),
    camel tribute to Tiglath-pileser III, and Ashurbanipal's reliefs of Arab camel riders.
    Bactrian camels appear on the Black Obelisk.
  - >-
    Midianite camel raiders (Judg 6-7) fit an Iron II rather than an early Iron I setting.
    Note this in the wider debate about the dating of the Judges traditions.
  sources_to_check: ['Eph''al, The Ancient Arabs (1982)']
