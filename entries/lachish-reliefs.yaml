editorial:
  author_notes:
  - >-
    Excavated by Layard in 1847-1850; the epigraph identifies the city as Lachish and the
    king seated on his throne receiving spoil.
  - >-
    Correlate with the excavations at Lachish (Level III), where the Assyrian siege ramp,
    the counter-ramp and masses of arrowheads and sling stones were found (Ussishkin).
  - >-
    Note the prominence given to Lachish rather than Jerusalem, perhaps because Lachish was
    the greatest city actually taken.
  - >-
    The reliefs show impalement and flaying of some captives alongside families going into
    exile; discuss as royal propaganda, not neutral reportage.
  sources_to_check:
  - Ussishkin, The Conquest of Lachish by Sennacherib (1982)
  - >-
    Barnett, Bleibtreu and Turner, Sculptures from the Southwest Palace of Sennacherib at
    Nineveh (1998)
