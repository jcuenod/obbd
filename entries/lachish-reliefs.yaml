scope: >-
  The sequence of carved gypsum wall slabs from a room of Sennacherib's Southwest Palace at
  Nineveh depicting the siege and capture of the Judahite city of Lachish in 701 BCE, from
  the assault on the walls to the deportation of families and the king receiving the spoil.
