editorial:
  author_notes:
  - >-
    Most Egyptologists now read Wenamun as a literary composition in the form of an official
    report (Baines, Schipper), not an actual dispatch. Even so, it reflects real political
    conditions of the late 20th-21st Dynasties (Smendes at Tanis, Herihor at Thebes).
  - >-
    The narrative is set in "year 5" of the "Renaissance era" under Ramesses XI (c. 1075).
    The papyrus and its composition are later (Twenty-first or early Twenty-second Dynasty).
    Say which date is meant.
  - >-
    The Byblian ecstatic is one of the earliest pieces of evidence for West Semitic prophetic
    possession. Compare Mari and the biblical bands of prophets.
  - >-
    Zakar-Baal's insistence on commercial payment rather than tribute illustrates the trade
    relations behind 1 Kgs 5 (Solomon and Hiram).
