scope: >-
  A Late Egyptian narrative, preserved on a papyrus now in Moscow. Wenamun, an official of
  Amun's temple at Thebes, travels to Byblos to buy cedar for the god's barque. On the way
  he is robbed at Dor, a town of the Tjeker, and he is treated with disdain by Zakar-Baal
  of Byblos. It shows Egypt's weakened standing in the Levant at the end of the Late Bronze
  Age.
