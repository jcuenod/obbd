editorial:
  author_notes:
  - >-
    Dating: a pre-70 date (Kloppenborg 2000) is the prevailing view against H. C. Kee's later
    dating.
  - >-
    The identification with the Synagogue of the Freedmen (Acts 6:9) is an attractive conjecture,
    not established.
  - >-
    Note the emphasis on Torah reading and hospitality rather than prayer, and the three generations
    of archisynagogoi.
