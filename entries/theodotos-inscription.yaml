id: theodotos-inscription
title: Theodotos Inscription
type: artifact
cultures: [jewish, greek]
date:
  from: -50
  to: 70
  circa: true
  display: c. 50 BCE–70 CE
scope: >-
  Greek dedicatory inscription found in 1913 on the Ophel/City of David. It records that Theodotos
  son of Vettenos, priest and archisynagogos, built a synagogue for the reading of the Law
  and teaching of the commandments, with guest rooms and water installations for visitors
  from abroad. It is the principal epigraphic evidence for a pre-70 synagogue in Jerusalem.
passages:
- ref: Luke 4:16-21
  rel: practice
  note: Synagogue reading of scripture and teaching on the Sabbath
- ref: Acts 15:21
  rel: practice
  note: Moses read in the synagogues every Sabbath
- ref: Acts 13:15
  rel: language
  note: archisynagōgoi ('synagogue leaders'), the inscription's title
- ref: Acts 2:5-11
  rel: practice
  note: Diaspora Jews in Jerusalem; lodging for visitors from abroad
- ref: Acts 6:9
  rel: attests
  disputed: true
  note: Synagogue of the Freedmen; Theodotos's Latin family name may indicate freedman origin
