editorial:
  author_notes:
  - >-
    The two stands should be distinguished: Sellin found one in 1902, and Lapp found the famous
    one in 1968.
  - >-
    Hestrin's and Taylor's readings (alternating Asherah registers and YHWH registers, with
    an aniconic deity between cherubim and a solar YHWH on top) are influential but contested.
    Present them as interpretations.
  - >-
    Whether Taanach was Israelite or Canaanite in the 10th century is itself debated. Avoid
    calling the stand 'Israelite'.
  - >-
    The quadruped on the top register may be a horse or a bovine. This affects the solar and
    'calf' interpretations.
  sources_to_check:
