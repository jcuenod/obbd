id: taanach-cult-stand
title: Taanach Cult Stands
type: artifact
cultures: [canaanite, israelite]
date:
  from: -1000
  to: -900
  circa: true
  display: c. 1000–900 BCE
scope: >-
  Two decorated terracotta cult stands from Taanach in the Jezreel Valley. The better known,
  found by P. Lapp in 1968, has four registers: a naked female between lions; two winged sphinxes
  flanking an empty space; a sacred tree with ibexes between lions; and a quadruped under
  a winged sun disk.
