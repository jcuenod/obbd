- ref: 1Sam 4:4
  rel: concept
  disputed: true
  note: YHWH 'enthroned on the cherubim'; cf. the empty space between sphinxes
- ref: 2Kgs 23:11
  rel: imagery
  disputed: true
  note: Horses dedicated to the sun; cf. the quadruped beneath the sun disk
- ref: Deut 16:21
  rel: concept
