id: tutankhamun-footstool
title: Footstools and Sandals with Bound Enemies (Tutankhamun)
aliases: [Footstools of Tutankhamun]
type: artifact
cultures: [egyptian]
date:
  from: -1323
  to: -1323
  circa: true
  display: c. 1323 BCE
scope: >-
  Footstools from Tutankhamun's tomb (KV62) decorated with bound foreign captives, Asiatic
  and Nubian, and the "Nine Bows" (Egypt's traditional enemies), so that the king symbolically
  trod on his enemies whenever he was seated. They illustrate the biblical image of enemies
  as a footstool.
passages:
- ref: Ps 110:1
  rel: imagery
  note: '''Until I make your enemies your footstool'''
- ref: Josh 10:24
  rel: practice
  note: Feet on the necks of defeated kings
- ref: 1Kgs 5:3
  rel: imagery
  note: Enemies put under the soles of the king's feet; MT 5:17
- ref: Isa 66:1
  rel: imagery
  note: Earth as YHWH's footstool
- ref: 1Chr 28:2
  rel: realia
  note: Ark as the 'footstool of our God'
related: [footstool, narmer-palette, smiting-the-enemy-motif, egyptian-kingship, cherub-throne,
  royal-ideology]
