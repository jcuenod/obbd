external: {}
editorial:
  author_notes:
  - >-
    The same motif appears on Tutankhamun's sandals, walking sticks, and throne. Present the
    footstools as part of a coherent iconography of royal domination.
  - >-
    Ps 110 is often read against Egyptian royal ideology (the king enthroned at the god's
    right hand, enemies underfoot). Note that Neo-Assyrian parallels are also invoked.
  - >-
    Many Tutankhamun objects have recently moved to the Grand Egyptian Museum in Giza. Verify
    locations before stating them.
  sources_to_check:
