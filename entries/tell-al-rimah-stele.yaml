editorial:
  author_notes:
  - >-
    Excavated by David Oates and published by Stephanie Page (1968). The campaign is usually
    dated c. 796 BCE; the inscription's 'in one year' compression of events is debated.
  - Damascus's king is called Mariʾ ('lord'), probably a title for Ben-hadad son of Hazael.
  - >-
    The identification of the 'saviour' of 2 Kgs 13:5 with Adad-nirari III is common but not
    certain; alternatives include Jeroboam II or Elisha. Mark it as a proposal.
  - >-
    The governor Nergal-ereš's name was deliberately erased at some point, an example of damnatio
    memoriae.
  sources_to_check:
