id: tell-al-rimah-stele
title: Tell al-Rimah Stele of Adad-nirari III
aliases: [Tell al-Rimah stela, Rimah Stele]
type: artifact
cultures: [assyrian]
date:
  from: -797
  to: -783
  circa: true
  display: c. 797–783 BCE
scope: >-
  A stele of the Assyrian king Adad-nirari III and his governor Nergal-ereš found at Tell
  al-Rimah in northern Iraq in 1967. It records a western campaign in which 'Joash (Iuʾasu)
  the Samarian' paid tribute, the first mention of Samaria by name in Assyrian royal inscriptions.
passages:
- ref: 2Kgs 13:10-13
  rel: attests
  note: Jehoash (Joash) son of Jehoahaz, king of Israel
- ref: 2Kgs 13:5
  rel: event
  disputed: true
  note: YHWH gives Israel a 'saviour' from Aram, often identified with Adad-nirari III
- ref: 2Kgs 13:22-25
  rel: setting
  note: Joash recovers towns from Ben-hadad son of Hazael after Damascus is weakened
- ref: 1Kgs 16:24
  rel: attests
  note: Samaria as Israel's capital, here named in an Assyrian text
related: [samaria, ben-hadad, hazael, tribute-and-vassalage, damascus, assyria]
