editorial:
  author_notes:
  - >-
    Hebrew sārîs comes from Akkadian ša rēši ('he of the head'). Most Assyriologists now agree
    that Neo-Assyrian ša rēši were usually eunuchs, the beardless courtiers of the reliefs,
    though there has been debate.
  - >-
    Biblical usage ranges from 'official' (Potiphar was married) to 'eunuch' proper (Isa 56;
    Esther). Decide case by case.
  - >-
    Discuss the tension between Deut 23:1 and Isa 56:3-5, and the reception of Daniel as a
    eunuch in Jewish and Christian tradition.
