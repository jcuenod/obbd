id: eunuchs
title: Eunuchs (sārîs)
aliases: [Saris, Court eunuchs]
type: concept
cultures: [assyrian, persian]
scope: >-
  The sārîs (eunuch or court official) in the Hebrew Bible and its Akkadian background, ša
  rēši, with the role of eunuchs at Assyrian, Babylonian and Persian courts. The entry covers
  the question of castration versus office and the biblical attitudes to eunuchs.
