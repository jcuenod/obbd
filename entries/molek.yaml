  wikidata: Q275010
editorial:
  author_notes:
  - >-
    Present the debate fairly. Eissfeldt (1935) read Punic mlk as a sacrifice type ("as a
    molk-offering"); Heider and Day defend a deity Molek, citing Lev 20:5 and Ugaritic/Akkadian
    Malik/mlk, who is linked to the dead and to ʿAshtaroth (KTU 1.100; 1.108).
  - >-
    The vocalization mōlek may be a bōšet-style distortion of melek "king"; this is a hypothesis.
  - >-
    Whether "pass through the fire" denotes actual immolation or a dedication rite remains
    debated, though most now accept that some child sacrifice occurred.
  - >-
    Correct the popular image of a hollow bronze bull-headed furnace; it derives from medieval
    Jewish commentary (e.g. Rashi on Jer 7:31) and later art, not ancient evidence.
  sources_to_check:
  - G. C. Heider, The Cult of Molek (JSOTSup 43, 1985)
  - 'J. Day, Molech: A God of Human Sacrifice in the Old Testament (1989)'
  - DDD, s.v. "Molech"
