id: molek
title: Molek (Molech)
aliases: [Molech, Moloch]
type: deity
cultures: [canaanite, phoenician, judahite]
scope: >-
  Molek, the recipient of the practice of "making children pass through the fire" condemned
  in Leviticus, Kings and Jeremiah. The entry covers the debate over whether Molek was a deity
  (possibly chthonic) or whether *molk* was a sacrificial term, as in Punic inscriptions.
passages:
- ref: Lev 18:21
  rel: practice
  note: Prohibition of giving offspring 'to Molek'
- ref: Lev 20:2-5
  rel: practice
  note: Death penalty; 'prostituting after Molek' implies a deity
- ref: 2Kgs 23:10
  rel: practice
  note: Josiah defiles Topheth so none may pass a child through fire to Molek
- ref: Jer 32:35
  rel: practice
  note: High places of Baal in the Hinnom valley for passing children to Molek
- ref: 1Kgs 11:7
  rel: language
  note: '''Molech the abomination of the Ammonites'', probably an error for Milcom'
- ref: Isa 30:33
  rel: language
  disputed: true
  note: Topheth prepared 'for the king' (lammelek)
- ref: Isa 57:9
  rel: language
  disputed: true
  note: Journeying 'to the king/Molek' with oil
- ref: Acts 7:43
  rel: language
  note: '''Tent of Moloch'' from LXX Amos 5:26'
related: [child-sacrifice, tophet, milkom, rephaim, gods-of-2-kings-17, phoenicians, chemosh]
media: []
external:
