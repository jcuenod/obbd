scope: >-
  The several thousand Akkadian tablets, mostly private family archives, from Nuzi (Yorghan
  Tepe) in the Hurrian kingdom of Arrapha. In the mid-twentieth century they were used to
  argue that the patriarchal narratives reflect second-millennium customs; that use has since
  been heavily revised.
