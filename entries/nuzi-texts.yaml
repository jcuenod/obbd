editorial:
  author_notes:
  - >-
    Speiser and Gordon used Nuzi to date the patriarchs to the second millennium; Thompson
    (1974), Van Seters (1975), and Selman (1980) showed that many parallels were misread or
    are attested across periods. Present Nuzi as illustrating customary law, not as dating
    evidence.
  - >-
    Speiser's 'wife-sister' adoption theory for Gen 12, 20, and 26 is now rejected; mention
    it as a historiographical misconception.
  - >-
    The household-gods-and-inheritance thesis for Rachel's theft (Gen 31) was challenged by
    Greenberg (1962) and others; keep it as a debated option.
  - >-
    Surrogacy clauses are also known from Old Babylonian and Neo-Assyrian contracts, which
    weakens any Nuzi-specific claim.
  sources_to_check:
  - M. P. Maidman, Nuzi Texts and Their Uses as Historical Evidence (SBLWAW 18, 2010)
  - T. L. Thompson, The Historicity of the Patriarchal Narratives (BZAW 133, 1974)
  - J. Van Seters, Abraham in History and Tradition (1975)
  - >-
    M. J. Selman, 'Comparative Customs and the Patriarchal Age,' in Essays on the Patriarchal
    Narratives (ed. A. R. Millard and D. J. Wiseman, 1980)
