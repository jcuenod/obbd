editorial:
  author_notes:
  - >-
    The setting tags are geographical. The Shasu lists include Seir and point to the southern
    region named in the "YHWH from the south" texts. That holds whether or not Yhw is the
    divine name.
  - >-
    Whether yhwꜣ is a place, a tribe, or a deity's name, and whether it is related to YHWH
    at all, is debated. The identification is widely regarded as plausible, but do not present
    it as proven.
  - >-
    The evidence supports, but does not prove, southern-origin hypotheses (the Kenite-Midianite
    hypothesis). Mention Kuntillet ʿAjrud's "YHWH of Teman".
  - >-
    The Amarah West list (Ramesses II) probably copies the Soleb list. Earlier claims that
    the Soleb list attests "Yahweh" as a deity worshipped in Egypt are unfounded.
  sources_to_check:
  - Giveon, Les bédouins Shosou des documents égyptiens (1971)
  - >-
    Adrom and Müller, 'The Tetragrammaton in Egyptian Sources - Facts and Fiction', in The
    Origins of Yahwism (BZAW 484, 2017)
