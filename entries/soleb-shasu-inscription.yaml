id: soleb-shasu-inscription
title: '"Shasu of YHW" Toponym Lists (Soleb, Amarah West)'
aliases: [Shasu of YHW, Land of the Shasu of Yhw]
type: artifact
cultures: [egyptian]
date:
  from: -1390
  to: -1352
  circa: true
  display: c. 1390–1352 BCE
scope: >-
  Topographical lists of Amenhotep III at his Nubian temple of Soleb, and a later Ramesside
  copy at Amarah West. Among several "lands of the Shasu" they name tꜣ šꜣsw yhwꜣ, "the land
  of the Shasu of Yhw". Many scholars take this as the earliest occurrence of the divine name
  YHWH, used as a toponym or tribal name in the southern Transjordan/Edom region.
passages:
- ref: Exod 3:13-15
  rel: language
  disputed: true
  note: Divine name YHWH; Yhw(ꜣ) as possibly its earliest attestation
- ref: Deut 33:2
  rel: setting
  disputed: true
  note: YHWH comes from Sinai and Seir; the Shasu of Yhw are often located in this region
- ref: Judg 5:4-5
  rel: setting
  disputed: true
  note: YHWH marches out from Seir and the region of Edom
- ref: Hab 3:3
  rel: setting
  disputed: true
  note: God comes from Teman, the Holy One from Mount Paran
related: [yhwh-origins, shasu, midianites-and-kenites, edomites, kuntillet-ajrud-inscriptions,
  papyrus-anastasi]
location:
  institution: In situ, Soleb, Sudan (Amarah West copy also in Sudan)
  accession: null
media:
