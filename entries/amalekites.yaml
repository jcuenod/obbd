editorial:
  author_notes:
  - >-
    No ancient Near Eastern text names Amalek, and no material culture can be assigned to
    it. Say this plainly. Proposed archaeological identifications are speculative.
  - >-
    Amalek functions as a theological archetype (Deut 25; 1 Sam 15; Esther's Agagite) and
    has a long reception in Jewish tradition. Address modern political misuse of the texts
    carefully and neutrally.
