id: statue-of-el
title: Seated Bronze Figurine of El (Ugarit)
type: artifact
cultures: [ugaritic]
date:
  from: -1400
  to: -1200
  circa: true
  display: c. 1400–1200 BCE
scope: >-
  A small Late Bronze Age cast-bronze figurine of a seated, bearded male deity from Ugarit,
  overlaid with gold foil, conventionally identified as El, the aged head of the Ugaritic
  pantheon. The entry uses the object to introduce El's iconography (enthroned, aged, raising
  a hand in blessing).
