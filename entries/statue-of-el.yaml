  rel: imagery
  disputed: true
  note: Ancient of Days enthroned, white-haired; cf. El as aged 'father of years'
- ref: 1Kgs 22:19
  rel: imagery
  note: Deity seated on a throne with the heavenly host standing beside him
- ref: Isa 6:1
  rel: imagery
  note: Enthroned, exalted deity presiding over his court
- ref: Ps 82:1
  rel: concept
  note: God presiding in the 'council of El'
- ref: Job 36:26
  rel: imagery
  disputed: true
  note: Number of God's years unsearchable; cf. El's epithet ab šnm
