editorial:
  author_notes:
  - >-
    Verify the excavation number, find-spot and current location before writing; several seated
    gold-foiled bronzes from Ugarit circulate under the label "El", and the stone "El stele"
    from Ugarit is a different object.
  - >-
    The identification as El rests on typology (seated, bearded, raised hand) rather than
    an inscription; say so.
  - >-
    The meaning of El's epithet ab šnm ("father of years" versus other proposals) is debated;
    do not overstate the Dan 7:9 link.
