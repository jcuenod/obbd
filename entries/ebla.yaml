editorial:
  author_notes:
  - >-
    Italian excavations under Matthiae since 1964. The Palace G archives (c. twenty-fourth
    century BCE) number some 17,000 inventoried pieces, far fewer complete tablets. They include
    Sumerian-Eblaite bilingual lexical lists.
  - >-
    Use the site as a cautionary case. Early claims (Pettinato in the 1970s, amplified in
    the popular press) that the tablets named Sodom, Gomorrah and the cities of Gen 14, that
    the element 'Ya' was YHWH, and that a king Ebrium was Eber have all been rejected. Pettinato
    himself withdrew some of them.
  - >-
    Its real significance lies in early West Semitic personal names, deities (Dagan, Rašap,
    Kamiš, Aštar), administration and scribal culture.
  - >-
    The palace was destroyed in the later third millennium (by Sargon or Naram-Sin of Akkad;
    debated). The Middle Bronze city was destroyed c. 1600.
  sources_to_check:
  - Matthiae, Ebla - An Empire Rediscovered (1980)
