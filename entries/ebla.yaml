scope: >-
  The north Syrian city at Tell Mardikh whose mid-third-millennium palace archive revealed
  an early Semitic language (Eblaite). Covers the site and archive, its real significance
  for Semitic studies and religion, and the 1970s controversy over alleged 'biblical' connections.
