editorial:
  author_notes:
  - >-
    Marquet-Krause (1933-35) and Callaway (1964-72) found a large Early Bronze city destroyed
    c. 2400 BCE (EB III), a gap of over a millennium, then a small unfortified Iron I village.
    There was no city for Joshua to conquer.
  - >-
    Hence the widespread reading of Josh 7-8 as an etiology of a conspicuous ruin (Alt, Noth).
    Callaway himself abandoned historicizing solutions.
  - >-
    Khirbet el-Maqatir, proposed by Bryant Wood and the Associates for Biblical Research,
    rests on a conquest date of c. 1400 and is not accepted in mainstream scholarship. Mention
    it as a minority view.
  - >-
    The identification depends on Bethel being Beitin. Other candidates (e.g. Khirbet Haiyan,
    Khirbet Nisya) have also failed to produce a Late Bronze city.
