id: blessings-and-curses
title: Treaty Blessings and Curses
aliases: [Treaty curses, Futility curses]
type: concept
cultures: [assyrian, aramean, hittite, babylonian]
scope: >-
  The blessings and curses that sanction treaties, law collections and royal inscriptions,
  and their biblical counterparts in Lev 26, Deut 27–28 and prophetic judgment oracles. The
  entry covers specific parallels and the genre of the 'futility curse'.
