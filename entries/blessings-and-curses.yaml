editorial:
  author_notes:
  - >-
    Standard studies: D. R. Hillers, Treaty-Curses and the Old Testament Prophets (1964);
    H. U. Steymans on Deut 28 and the Esarhaddon Succession Treaty (OBO 145, 1995).
  - >-
    Futility curses ('sow but not reap'; ewes suckling a lamb that is not satisfied) appear
    in the Tell Fekheriye and Sefire inscriptions, as well as in prophetic oracles.
  - >-
    Other curse traditions: the Hammurabi epilogue, kudurru curses, and tomb-inscription curses
    (Ahiram, Eshmunazar).
  - >-
    Explain the performative function of curses and the debate over whether prophets drew
    directly on treaty texts or on a shared curse repertoire.
