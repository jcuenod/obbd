scope: >-
  The Akkadian myth of Adapa, sage of Eridu, who breaks the wing of the South Wind, is summoned
  before Anu, and on Ea's advice refuses the "bread of life" and "water of life" offered him,
  thereby forfeiting immortality for himself (and perhaps humankind).
