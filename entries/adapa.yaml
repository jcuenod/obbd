editorial:
  author_notes:
  - >-
    Oldest Akkadian manuscript: a tablet from 14th-c. Amarna used in Egyptian scribal training;
    other fragments are Neo-Assyrian, and a Sumerian Adapa composition is known from the Old
    Babylonian period. Izre'el's edition (2001) is standard.
  - >-
    Interpretive crux: did Ea deceive Adapa, or protect him from what he believed was the
    food of death? Unlike Gen 3, Adapa obeys his god; the loss of immortality is not disobedience.
  - >-
    The proposed Adam/Adapa etymology is not accepted as a linguistic link; mention it only
    as a popular claim.
  - >-
    In later tradition Adapa is identified with the first apkallu, Uan (Berossus's Oannes);
    see the apkallu entry.
