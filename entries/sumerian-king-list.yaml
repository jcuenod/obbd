scope: >-
  A Sumerian list of cities and rulers that presents kingship as "descending from heaven"
  and passing from one city to another. In most versions it begins with antediluvian kings
  with immensely long reigns and treats the flood as the great epochal break.
passages:
- ref: Gen 5:1-32
  rel: parallel
  note: Antediluvian line of very long-lived figures ending at the flood
- ref: Gen 11:10-26
  rel: parallel
  note: Post-flood life spans decline, as SKL reigns shrink after the flood
- ref: Gen 10:1, 32
  rel: concept
  note: '''After the flood'' as an epochal marker; SKL: ''after the flood had swept over'''
- ref: Gen 5:21-24
  rel: concept
  disputed: true
  note: Seventh antediluvian figure; Enmeduranki of Sippar is seventh in some lists
