editorial:
  author_notes:
  - >-
    Composite and ideological: dynasties that were contemporary are listed in succession to
    model a single legitimate kingship. An Ur III manuscript lacks the antediluvian section,
    which most think was prefaced later; the Weld-Blundell prism (c. 1800) is the best-known
    copy.
  - >-
    Reigns are given in sexagesimal units (a šar = 3,600 years); the antediluvian section
    has eight or ten kings depending on the source. Berossus's list of ten antediluvian kings
    gives the closest numerical analogue to the ten generations of Gen 5.
  - >-
    Explanations of the Gen 5 numbers (which differ in MT, SP, and LXX) from Mesopotamian
    arithmetic are speculative; present the parallel as genre (long-lived ancestors, flood
    as divider), not dependence.
  sources_to_check:
