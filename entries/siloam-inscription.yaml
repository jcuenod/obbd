scope: >-
  A six-line Hebrew inscription cut into the wall of the Siloam (Hezekiah's) tunnel in Jerusalem,
  describing the moment when two teams of tunnellers met. It is the longest monumental Hebrew
  inscription from the monarchy. The tunnel itself is treated under hezekiahs-tunnel.
