editorial:
  author_notes:
  - >-
    Found in 1880 near the tunnel's southern end. It was cut out and broken in 1891 and taken
    to Constantinople.
  - >-
    The inscription names no king and was not placed for display. It celebrates the work and
    the workers, which is unusual for ANE building inscriptions.
  - >-
    The attribution to Hezekiah rests on 2 Kgs 20:20 and 2 Chr 32:30, palaeography, and radiometric
    dating of the tunnel plaster (c. 700). A Hasmonean dating (Rogerson and Davies 1996) has
    been rejected. Reich and Shukron's suggestion that the tunnel predates Hezekiah is a minority
    view.
  - >-
    The 'waters of Shiloah' in Isa 8:6 probably refer to the earlier channel (Channel II),
    not to this tunnel.
