editorial:
  author_notes:
  - >-
    The petitions use images that recur in biblical justice language, such as the official
    as balance, steering-oar, and father to the orphan and husband to the widow. Present these
    as a shared ancient Near Eastern ethic of protecting the weak, not as borrowing.
  - >-
    The frame narrative's irony (justice delayed for the sake of eloquence) is debated. Some
    read it as a reflection on rhetoric, others on the king's ultimate justice.
  - >-
    Manuscripts are Middle Kingdom papyri in Berlin and London. Cite Parkinson's edition and
    translation.
