editorial:
  author_notes:
  - >-
    The title is rare in literary sources but well attested epigraphically, mostly in Macedonia
    (G. H. R. Horsley's survey).
  - >-
    Accuracy on local titles shows Luke's familiarity with civic terminology. It does not
    by itself prove the historicity of the episode; avoid apologetic overstatement.
  - >-
    Verify the date of the Vardar Gate inscription, which is often cited as 1st century CE
    but is debated.
  sources_to_check:
