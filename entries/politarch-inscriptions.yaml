id: politarch-inscriptions
title: Politarch Inscriptions (Thessalonica)
type: text
cultures: [greek, roman]
date:
  from: -150
  to: 250
  circa: true
  display: c. 150 BCE–250 CE
scope: >-
  The group of Greek inscriptions, most from Thessalonica and other Macedonian cities, that
  name politarchs as civic magistrates. They include the inscription from the Vardar Gate.
  Together they confirm the title Acts uses for Thessalonica's officials.
passages:
- ref: Acts 17:6, 8
  rel: language
  note: Jason dragged before the city authorities (politarchai)
- ref: Acts 16:20-22, 35-38
  rel: language
  note: 'Different titles at Philippi, a Roman colony: stratēgoi and rhabdouchoi'
- ref: 1Thess 2:14
  rel: setting
  note: Persecution by fellow citizens in Thessalonica
