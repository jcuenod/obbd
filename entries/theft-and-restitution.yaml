editorial:
  author_notes:
  - >-
    Comparative law: Hammurabi §§6-25 (theft from temple or palace is capital; §8 sets thirtyfold
    or tenfold restitution or death; §§21-22 breaking in and robbery) and §§120-126 (deposits,
    with double restitution for denial). Hittite Laws §§57-70 set multiple compensation for
    stolen animals and record that penalties had been reduced. Biblical law has no death penalty
    for theft of ordinary property. Greenberg's argument that this reflects a different hierarchy
    of values is influential but debated.
  - >-
    The day/night distinction for a burglar (Exod 22:2-3) has a close parallel in Laws of
    Eshnunna §§12-13. Explain that in Exod 22:1-4 (MT 21:37-22:3) the verses about the burglar
    appear to interrupt the restitution rule.
  - >-
    In Exod 22:8-9 'before God' (ʾĕlōhîm) has been read as God (oath or oracle at a sanctuary),
    as judges, or as household gods. Present the options.
  - >-
    Lev 6:1-7 (MT 5:20-26) and Num 5:5-8: a voluntary confession reduces the penalty to the
    principal plus a fifth, combined with an ʾāšām. Milgrom reads this as repentance reducing
    a deliberate offence to an expiable one.
  - >-
    Alt's hypothesis that the Decalogue's 'you shall not steal' originally referred to kidnapping
    (cf. Exod 21:16) is older and debated; do not present it as consensus. The 'sevenfold'
    of Prov 6:31 is rhetorical rather than a legal rate.
  sources_to_check:
  - M. T. Roth, Law Collections from Mesopotamia and Asia Minor (SBLWAW 6, 2nd ed. 1997)
  - 'H. A. Hoffner, The Laws of the Hittites: A Critical Edition (1997)'
  - B. S. Jackson, Theft in Early Jewish Law (1972)
  - J. Milgrom, Leviticus 1-16 (AB 3, 1991)
  - R. Westbrook, Studies in Biblical and Cuneiform Law (1988)
