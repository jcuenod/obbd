id: theft-and-restitution
title: Theft, Deposits, and Multiple Restitution
aliases: [Theft, Burglary, Deposits, Multiple Restitution, Kidnapping]
type: practice
cultures: [hebrew, babylonian, hittite]
scope: >-
  Biblical laws on theft, burglary, kidnapping, and the loss or misappropriation of deposited
  goods, with their scales of double, fourfold and fivefold restitution and the priestly rule
  of restoring the principal plus a fifth with a reparation offering. They are compared with
  Mesopotamian and Hittite law. Homicide, bodily injury and the goring ox are treated elsewhere.
passages:
- ref: Exod 20:15
  rel: concept
  note: '''You shall not steal'' in the Decalogue (cf. Deut 5:19)'
- ref: Exod 21:16
  rel: practice
  note: Kidnapping a person punished by death
- ref: Deut 24:7
  rel: practice
  note: Kidnapping and selling a fellow Israelite punished by death
- ref: Exod 22:1-4
  rel: practice
  note: >-
    Fivefold and fourfold restitution for animals; killing a night burglar; double restitution
    (MT 21:37-22:3)
- ref: Exod 22:7-15
  rel: practice
  note: >-
    Deposits, oaths 'before God', double restitution, and liability for loans of animals (MT
    22:6-14)
- ref: Lev 6:1-7
  rel: practice
  note: >-
    False denial of a deposit or theft: restore plus a fifth and bring a reparation offering
    (MT 5:20-26)
- ref: Num 5:5-8
  rel: practice
  note: Confession and restitution plus a fifth, paid to kin or to the priest
- ref: Gen 31:32; 44:9-10
