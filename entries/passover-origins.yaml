scope: >-
  The origins and development of Passover (pesaḥ) and the Feast of Unleavened Bread (maṣṣôt):
  apotropaic blood rite, family slaughter, centralization, and Second Temple practice, with
  comparative and epigraphic evidence such as the Elephantine Passover letter.
