editorial:
  author_notes:
  - >-
    Most critical scholars hold that pesaḥ (a family or clan apotropaic slaughter, often linked
    to pastoral life) and maṣṣôt (an agricultural barley festival) were originally separate
    and later combined. The "pastoral nomad" origin (Rost) is widely repeated but rests on
    analogy and should be presented cautiously.
  - The etymology of psḥ ("pass over", "protect", "limp") is uncertain. Present the options.
  - >-
    Deuteronomy turns a household rite into a sanctuary sacrifice. 2 Chr 35:13 harmonizes
    the conflicting cooking instructions of Exod 12:9 (roast, not boiled) and Deut 16:7 (bšl).
    This is a standard example of inner-biblical exegesis.
  - >-
    The Elephantine "Passover letter" (TAD A4.1, 419 BCE) gives instructions for Unleavened
    Bread on Nisan 15-21. The word "Passover" itself is restored in a lacuna. Some ostraca
    mention psḥ (verify references).
  - >-
    Mesopotamian rites that protected doorways with smeared substances and figurines are comparative
    background for the blood rite. Do not overstate them as a direct source.
  sources_to_check: [TAD A4.1]
