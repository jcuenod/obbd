editorial:
  author_notes:
  - >-
    No excavation has taken place on the platform. The First Temple has not been located archaeologically,
    and finds from the Temple Mount Sifting Project come from unstratified spoil.
  - >-
    The present platform is largely Herodian. Proposed earlier phases (e.g. the 'seam' in
    the eastern wall; Ritmeyer's square pre-Herodian platform) are debated.
  - >-
    The identification of Moriah with the temple hill is late (Chronicles, then Josephus).
    'Zion' first names the City of David stronghold (2 Sam 5:7) and later shifts to the temple
    hill and, later still, to the Western Hill.
  - >-
    The site is a live religious and political flashpoint (Haram al-Sharif). Use neutral language
    and both names.
  sources_to_check:
