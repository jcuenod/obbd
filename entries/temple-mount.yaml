id: temple-mount
title: Temple Mount (Mount Moriah/Zion)
aliases: [Mount Moriah, Mount Zion, Haram al-Sharif, Har ha-Bayit]
type: site
cultures: [judahite, jewish]
scope: >-
  The hill north of the City of David on which the First and Second Temples stood, and the
  platform Herod enlarged. Covers biblical traditions about the site (Moriah, Araunah's threshing
  floor, Zion), what can and cannot be known archaeologically, and the Herodian platform.
