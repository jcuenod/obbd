aliases: [Hama, Epiphania, Lebo-hamath (border)]
type: site
cultures: [luwian, aramean]
scope: >-
  The city on the Orontes in central Syria, capital of a Neo-Hittite and then Aramean kingdom
  in the Iron Age. Covers its citadel excavations and inscriptions, its role in anti-Assyrian
  coalitions, and its conquest by Sargon II. 'Lebo-hamath' as Israel's ideal northern border
  is also discussed.
