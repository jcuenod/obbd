editorial:
  author_notes:
  - >-
    Danish excavations on the citadel (1931-38) revealed a palace complex and Luwian hieroglyphic
    inscriptions of Neo-Hittite kings (e.g. Urhilina). Zakkur of Hamath and Luʿash represents
    the later Aramean dynasty.
  - >-
    Irhuleni of Hamath was a leader of the Qarqar coalition (853). Sargon II crushed Yau-biʾdi
    (Ilu-biʾdi) of Hamath in 720. Whether that name contains the divine element Yahu is debated.
  - >-
    Lebo-hamath is probably Lebweh in the northern Beqaʿ, not Hamath itself. Translations
    that render it 'entrance of Hamath' obscure this.
  sources_to_check:
  - Younger, A Political History of the Arameans (2016)
