title: Pontius Pilate
aliases: [Pilate, Pilatus]
type: person
cultures: [roman]
date:
  from: 26
  to: 36
  display: 26–36 CE
scope: >-
  Pontius Pilate, Roman prefect of Judea under Tiberius (c. 26-36 CE), who ordered the crucifixion
  of Jesus. The entry covers his governorship and portrayal in the Gospels, Philo, Josephus
  and Tacitus, his coinage, and later traditions. The Caesarea inscription naming him is treated
  under pilate-stone.
