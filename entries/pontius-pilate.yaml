editorial:
  author_notes:
  - >-
    Non-biblical sources: Philo, Legat. 299-305 (gilded shields in Herod's palace, with a
    hostile character sketch); Josephus, War 2.169-177 and Ant. 18.55-62 (military standards
    brought into Jerusalem; an aqueduct paid for from temple funds) and Ant. 18.85-89 (the
    Samaritans at Gerizim, which led to his recall by Vitellius); Tacitus, Ann. 15.44 (Christus
    executed by Pilate, called procurator).
  - >-
    His dates (c. 26-36/37) rest on Josephus's ten-year term and the recall before Tiberius's
    death. His title was prefect (see pilate-stone).
  - >-
    His bronze prutot (29-31 CE) bear the lituus and simpulum, Roman cultic implements. Whether
    these were deliberately provocative is debated.
  - >-
    Avoid both caricatures, the vacillating weakling of popular reading and the monster of
    Philo. Assess him as an equestrian prefect with auxiliary troops, working with the high
    priest Caiaphas and subordinate to the legate of Syria. The Gospels increasingly exonerate
    him, a trend that later Christian tradition continues (in the Coptic and Ethiopian churches
    he is venerated as a saint).
  - >-
    The Passover amnesty (Mark 15:6) is not attested outside the Gospels, and Luke 13:1 is
    unconfirmed. Present both as debated.
  sources_to_check:
  - H. K. Bond, Pontius Pilate in History and Interpretation (SNTSMS 100, 1998)
  - >-
    F. H. Colson (trans.), Philo, vol. 10: On the Embassy to Gaius (Loeb Classical Library,
    1962)
