title: Nabonidus Chronicle
aliases: [ABC 7]
type: artifact
cultures: [babylonian]
scope: >-
  The Babylonian chronicle of Nabonidus's reign (556-539 BCE), recording his long residence
  at Tayma, the crown prince's presence in Babylonia, the neglect of the New Year festival,
  and Cyrus's conquest of Babylon in 539.
