editorial:
  author_notes:
  - >-
    Key entries: battle at Opis; Sippar taken without battle; Babylon entered by Ugbaru (Gubaru),
    governor of Gutium, on 16 Tashritu; Cyrus enters on 3 Arahsamnu (late October 539).
  - >-
    The prince is called mār šarri ('son of the king'), not king, which bears on Daniel's
    portrayal of Belshazzar as king and son of Nebuchadnezzar.
  - >-
    Relevant to the 'Darius the Mede' problem: no such figure appears, though Gubaru appoints
    governors. Present the identifications proposed in the literature neutrally.
  - >-
    The supposed reference to Lydia in 547 rests on a damaged sign; avoid citing it as certain.
