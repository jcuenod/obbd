id: nabataeans
title: Nabataeans and King Aretas IV
type: people
cultures: [arabian]
scope: >-
  The Arab people and kingdom centred on Petra, who controlled the incense routes from the
  Hellenistic period until Roman annexation in 106 CE. The entry gives particular attention
  to Aretas IV (9 BCE-40 CE) and to the Nabataeans' interactions with the Hasmoneans, the
  Herods, and Paul.
passages:
- ref: 2Cor 11:32-33
  rel: attests
  note: The ethnarch of King Aretas guards Damascus; Paul escapes in a basket
- ref: Acts 9:23-25
  rel: event
  note: Paul's escape over the Damascus wall
- ref: Gal 1:17
  rel: setting
  note: Paul goes away into 'Arabia', i.e. Nabataean territory
- ref: Gal 4:25
  rel: setting
  note: '''Mount Sinai in Arabia'''
- ref: Mark 6:17-18
  rel: setting
  note: Antipas's marriage to Herodias after divorcing Aretas's daughter (Ant. 18.109-115)
- ref: 1Macc 5:25
  rel: attests
  note: Nabataeans meet Judas Maccabeus peaceably
- ref: 2Macc 5:8
  rel: attests
  note: Aretas (I), 'ruler of the Arabs'
