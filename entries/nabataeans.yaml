editorial:
  author_notes:
  - >-
    Whether and how Aretas IV controlled Damascus c. 37-40 CE is debated (ethnarch as governor
    or as head of a Nabataean community). The gap in Roman civic coinage is suggestive but
    not decisive.
  - >-
    Antipas's war with Aretas (36 CE) and its link to John the Baptist's death (Josephus)
    are relevant.
  - >-
    Correct the misconception that the Nabataeans are the biblical Nebaioth (Gen 25:13). The
    names differ philologically.
  - Note that Nabataean script is the ancestor of Arabic script.
  sources_to_check:
