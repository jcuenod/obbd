scope: >-
  The Bronze and early Iron Age population of the southern Levant and the biblical category
  'Canaanites'. Covers the term in ancient Near Eastern sources, Canaanite material culture,
  the continuity between Canaanites and early Israel, and the ideological use of the label
  in the Bible.
