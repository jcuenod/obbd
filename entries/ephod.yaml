id: ephod
title: Ephod
type: realia
cultures: [hebrew]
scope: >-
  The ʾēpôd in its several biblical senses: a linen priestly garment, the high priest's ornate
  vestment with the breastpiece, an oracular object, and a cult object that could be made
  of gold. The entry also covers its relation to the clothing of cult statues.
