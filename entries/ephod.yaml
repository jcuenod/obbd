editorial:
  author_notes:
  - >-
    Distinguish the senses clearly. The linen garment, the high priest's vestment, and the
    freestanding cult object (Judg 8:27; 17:5) may or may not be the same thing. A common
    proposal links the cult-object ephod to the garment of a divine image (cf. Isa 30:22).
  - >-
    Cognates include Old Assyrian epattum (pl. epadātum), a costly garment, and Ugaritic ipd
    (verify attestations). These support a basic sense of "garment".
  - >-
    The oracular ephod (1 Sam 23; 30) probably carried the lots or Urim and Thummim. Avoid
    claiming more than the texts support.
