title: Nineveh
aliases: [Ninua, Kuyunjik, Nebi Yunus]
type: site
cultures: [assyrian]
scope: >-
  The great Assyrian city on the Tigris opposite modern Mosul, capital under Sennacherib and
  his successors until its fall in 612 BCE. Covers the mounds of Kuyunjik and Nebi Yunus,
  the palaces and their reliefs, the library, and Nineveh in biblical prophecy and narrative.
