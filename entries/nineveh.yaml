editorial:
  author_notes:
  - >-
    Excavations at Kuyunjik by Layard, Rassam, George Smith and others recovered Sennacherib's
    Southwest Palace ('Palace without Rival') and Ashurbanipal's North Palace with their reliefs
    and the library tablets.
  - >-
    Sennacherib made Nineveh the capital c. 700 and enclosed it with a wall about 12 km long.
    Jonah's 'three days' walk' is hyperbole or includes the hinterland. Jonah's portrait of
    Nineveh is literary, not a source for eighth-century history.
  - >-
    The Fall of Nineveh Chronicle records the city's capture by Medes and Babylonians in 612.
  - >-
    ISIS destroyed parts of the site, including the Nebi Yunus shrine and gates, in 2014-16.
    Tunnels dug under Nebi Yunus exposed remains of a palace associated with Esarhaddon.
  sources_to_check:
  - Russell, Sennacherib's Palace without Rival at Nineveh (1991)
