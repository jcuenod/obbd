scope: >-
  The Iron I structure on the northeastern slope of Mount Ebal excavated by Adam Zertal and
  interpreted by him as an altar, perhaps Joshua's. Covers the structure, its faunal remains,
  rival interpretations, and recent claims about an inscribed 'curse tablet'.
