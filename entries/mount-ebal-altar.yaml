editorial:
  author_notes:
  - >-
    Zertal excavated the site in 1982-89. The main structure has a ramp and fill of ash and
    animal bones (largely sheep, goat and cattle, plus fallow deer). He read it as a sacrificial
    altar. Alternatives include a farmhouse or watchtower (Kempinski) or a cultic installation
    unrelated to Joshua.
  - >-
    Text-critically, the Samaritan Pentateuch (and some other witnesses) reads 'Gerizim' at
    Deut 27:4. In 4QJosh(a) the altar episode seems to follow the Jordan crossing. Both points
    matter for the history of the tradition.
  - >-
    The 2022-23 claims of a proto-alphabetic 'curse tablet' naming YHW, from wet-sifted spoil,
    have been widely rejected by epigraphers, and no inscription is visible in published images.
    Present it as a disputed claim and a caution.
