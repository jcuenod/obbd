editorial:
  author_notes:
  - >-
    Instruction of Amenemope chapter 6 ('Do not move the markers on the borders of fields...
    nor encroach on the boundaries of a widow') is widely accepted as a source for Prov 22:28
    and 23:10 within Prov 22:17-24:22.
  - >-
    Kassite and later Babylonian kudurrus record land grants under divine symbols and curse
    anyone who removes or alters the stone. They are a good illustration of the sanctity of
    boundaries, though they are royal grants, not peasant field markers.
  - >-
    Cuneiform law addresses encroachment (Middle Assyrian Laws Tablet B; Hittite Laws). Verify
    section numbers. Greek horoi and the Roman god Terminus are later comparanda.
  sources_to_check:
  - Lichtheim, Ancient Egyptian Literature, vol. 2 (1976)
