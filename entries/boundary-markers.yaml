id: boundary-markers
title: Boundary Markers and Land Theft
aliases: [Landmarks, Moving the boundary stone]
type: practice
cultures: [hebrew, egyptian, babylonian]
scope: >-
  The prohibition of moving a neighbour's boundary marker in biblical law and wisdom, and
  its counterparts in Egyptian instruction literature, Mesopotamian kudurru curses, and cuneiform
  law.
passages:
- ref: Deut 19:14
  rel: practice
  note: Do not move the boundary set by former generations
- ref: Deut 27:17
  rel: practice
  note: Curse on one who moves a neighbour's boundary marker
- ref: Prov 22:28
  rel: parallel
  note: Do not remove the ancient landmark; cf. Amenemope ch. 6
- ref: Prov 23:10-11
  rel: parallel
  note: Landmark and orphans' fields; the strong Redeemer defends them
- ref: Job 24:2
  rel: practice
  note: The wicked remove landmarks and seize flocks
- ref: Hos 5:10
  rel: imagery
  note: Judah's princes 'like those who remove the landmark'
