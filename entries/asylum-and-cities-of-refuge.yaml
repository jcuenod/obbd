title: Asylum and Cities of Refuge
aliases: [Cities of refuge, Altar asylum, Blood avenger (gōʾēl haddām)]
type: practice
cultures: [hebrew, greek]
scope: >-
  Biblical provisions protecting an unintentional killer from the blood avenger, first by
  asylum at the altar and then in designated cities of refuge, with discussion of their literary
  history and of comparative asylum practices.
