editorial:
  author_notes:
  - >-
    Many scholars (e.g., Weinfeld, Milgrom) see the refuge cities as a replacement for altar
    asylum after cult centralisation. The relative dating of the Deuteronomic, Priestly, and
    Joshua texts is debated.
  - >-
    The release of the manslayer at the high priest's death (Num 35:25, 28) is often read
    as expiatory. Present the main interpretations.
  - >-
    Clear ancient Near Eastern parallels to designated refuge cities are lacking. Comparative
    material is sanctuary asylum (Greek asylia, later Egyptian temple asylum). Avoid overstating
    similarity.
  - >-
    Whether the institution functioned historically, and whether the town lists reflect a
    monarchic reality (as Albright held) or an ideal, is debated.
