editorial:
  author_notes:
  - >-
    Stress diversity. There was no single 'Jewish messianic expectation', and many texts (e.g.
    much of Daniel, Jubilees, 1 Maccabees) have no messiah figure.
  - >-
    In the Hebrew Bible, māšîaḥ usually refers to a reigning king or priest. Avoid reading
    later eschatological expectation back into it.
  - >-
    Note Josephus's popular kings and sign-prophets (Judas, Simon, Athronges; Theudas; the
    Egyptian) as social expressions of hope.
  sources_to_check:
  - >-
    J. J. Collins, The Scepter and the Star: Messianism in Light of the Dead Sea Scrolls (2nd
    ed., 2010)
