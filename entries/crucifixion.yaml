id: crucifixion
title: Crucifixion
type: practice
cultures: [roman, jewish]
scope: >-
  Execution by suspension on a stake or cross, used by Persians, Carthaginians, and Hellenistic
  rulers and institutionalized by Rome for slaves, rebels, and provincials. The entry covers
  literary and archaeological evidence, Jewish attitudes (Deut 21:22-23), and its bearing
  on the Passion narratives.
passages:
- ref: Deut 21:22-23
  rel: concept
  note: One hanged on a tree is cursed; the body not left overnight
- ref: Gal 3:13
  rel: concept
  note: Christ became a curse, citing Deut 21:23
- ref: Acts 5:30
  rel: language
  note: '''Hanging on a tree'' for crucifixion (cf. 11QTemple 64; 4QpNah)'
- ref: Mark 15:21-37
  rel: practice
  note: Crossbeam carried, titulus, crucifixion between bandits
- ref: John 19:31-33
  rel: practice
  note: Breaking the legs; bodies removed before the Sabbath
- ref: John 20:25
  rel: practice
  note: Nail marks in the hands
- ref: 1Cor 1:23
  rel: concept
  note: A crucified messiah as stumbling block and folly
- ref: Phil 2:8
  rel: concept
  note: '''Death on a cross'' as the extreme of humiliation'
