  - V. Tzaferis, 'Jewish Tombs at and near Giv'at ha-Mivtar, Jerusalem', IEJ 20 (1970)
  - >-
    J. Zias and E. Sekeles, 'The Crucified Man from Giv'at ha-Mivtar: A Reappraisal', IEJ
    35 (1985)
