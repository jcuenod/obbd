editorial:
  author_notes:
  - >-
    Jewish evidence: Alexander Jannaeus crucified 800 (Ant. 13.380; cf. 4QpNahum); Varus crucified
    2,000 (Ant. 17.295); Titus at Jerusalem (War 5.449-451).
  - >-
    Archaeology: the Giv'at ha-Mivtar heel bone (Yehohanan) with a nail, plus later finds
    from Italy and England. Note Zias and Sekeles's correction of the original reconstruction.
  - >-
    Avoid speculative medical reconstructions of the cause of death. Methods varied widely
    (Seneca, Dial. 6.20.3).
  sources_to_check:
