editorial:
  author_notes:
  - >-
    The "Potiphar's wife" motif (the Phaedra/Bellerophon type) is widespread. Present the
    parallel as a shared folktale motif, not evidence of literary dependence.
  - >-
    Do not use the tale to date the Joseph story. The Joseph story's Egyptian colour is variously
    dated (Ramesside to Saite/Persian), and that debate rests on other evidence.
  - >-
    The papyrus (British Museum) is a scribal copy with a colophon naming the scribe Ennana.
    The tale's second half (Bata's heart in the cedar, his transformations) relates to the
    myths of Bata and Anubis at Saka.
