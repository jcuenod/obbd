title: Tale of Two Brothers
aliases: [Papyrus D'Orbiney, Story of Anubis and Bata]
type: text
cultures: [egyptian]
date:
  from: -1200
  to: -1200
  circa: true
  display: c. 1200 BCE
scope: >-
  A Late Egyptian tale preserved in Papyrus D'Orbiney (Nineteenth Dynasty, late 13th century
  BCE). The wife of the elder brother Anubis tries to seduce the younger brother Bata, then
  falsely accuses him. A long mythological sequel follows. Its opening episode is the classic
  comparandum for Potiphar's wife.
passages:
- ref: Gen 39:7-20
  rel: parallel
  note: Married woman's rebuffed advance on a young man, false accusation, husband's rage
