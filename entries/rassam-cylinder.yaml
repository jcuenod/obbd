id: rassam-cylinder
title: Annals of Ashurbanipal (Rassam Cylinder and Prism C)
aliases: [Ashurbanipal Prism A]
type: artifact
cultures: [assyrian]
date:
  from: -643
  to: -643
  circa: true
  display: c. 643 BCE
scope: >-
  The ten-sided clay prism of Ashurbanipal found by Hormuzd Rassam at Nineveh in 1878, the
  fullest edition of his annals, together with the related prism editions of his reign. It
  narrates the Egyptian campaigns including the sack of Thebes (664/663), the revolt of Shamash-shum-ukin,
  the destruction of Susa, and the wars against the Arabs.
