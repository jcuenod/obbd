editorial:
  author_notes:
  - >-
    Distinguish this object from Sennacherib's Rassam Cylinder (700 BCE), also named after
    Rassam, which contains the earliest account of the 701 campaign.
  - >-
    The list of 22 kings with Manasseh appears in Prism C (and related editions), not in the
    Rassam Cylinder itself; the entry should explain the edition history of Ashurbanipal's
    annals.
  - >-
    The identification of Osnappar (Ezra 4:10) with Ashurbanipal is the consensus view, supported
    by the deportations from Susa and Elam after 647/646.
  - >-
    Ashurbanipal's annals revise earlier events to suit later circumstances; use the editions
    comparatively.
