editorial:
  author_notes:
  - >-
    Josephus credits the first fortification to 'Jonathan the high priest'. Herod built the
    Northern Palace, the Western Palace, storehouses, a bathhouse and cisterns. Yadin excavated
    in 1963-65 and Netzer published the architecture.
  - >-
    The Roman siege by Flavius Silva (73 or 74 CE) left the best-preserved circumvallation,
    camps and siege ramp in the Roman world. The mass suicide account (Josephus, War 7) is
    debated. Yadin's reading of the 'lots' ostraca and the nationalist 'Masada myth' (Ben-Yehuda)
    deserve comment.
  - >-
    Scroll finds include biblical books (among them Leviticus, Deuteronomy, Ezekiel and Psalms),
    Hebrew Ben Sira, and the Songs of the Sabbath Sacrifice, also known from Qumran. How they
    reached Masada is debated.
  - The synagogue is among the earliest known in the land.
  sources_to_check:
  - Yadin, Masada - Herod's Fortress and the Zealots' Last Stand (1966)
  - Netzer, The Architecture of Herod, the Great Builder (2006)
