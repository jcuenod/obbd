scope: >-
  The isolated mesa-top fortress by the Dead Sea, fortified by the Hasmoneans and rebuilt
  by Herod, the last stronghold of the Jewish revolt against Rome. Covers the Herodian palaces,
  the Roman siege works, the scroll finds and the modern myth surrounding the site.
