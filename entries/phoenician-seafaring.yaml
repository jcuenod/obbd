editorial:
  author_notes:
  - >-
    Outline the expansion. It includes Kition on Cyprus (9th century), Carthage (traditional
    date 814), Sardinia (Nora Stone), and Iberia (Huelva). Radiocarbon has pushed some western
    foundations earlier.
  - >-
    The identification of Tarshish (Tartessos in Iberia, Tarsus, or another place) is debated.
    'Ships of Tarshish' may denote a class of long-haul vessel.
  - >-
    Iconography and wrecks include Sennacherib's relief of Luli's flight from Tyre (known
    from Layard's drawing) and the 8th-century Tanit and Elissa wrecks off Ashkelon carrying
    wine amphorae. The Report of Wenamun shows the earlier Byblian timber trade.
  - >-
    Ezek 27 is a key source for the Tyrian commercial network. Discuss its date and literary
    shaping.
  sources_to_check:
