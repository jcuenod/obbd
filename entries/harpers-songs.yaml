id: harpers-songs
title: Harpers' Songs
aliases: [Songs of the Harper, Harper's Song]
type: text
cultures: [egyptian]
scope: >-
  Egyptian songs, attributed to harpers at funerary banquets and attested from the Middle
  Kingdom to the Late Period in tombs and papyri. One group, notably the "Song from the Tomb
  of King Intef" (P. Harris 500), doubts the afterlife's certainty and urges enjoyment of
  life. The entry covers this sceptical group and the more traditional songs that answer it.
passages:
- ref: Eccl 9:7-10
  rel: parallel
  note: Eat, drink, wear fresh garments and oil, enjoy your wife; no work in Sheol
- ref: Eccl 2:24
  rel: parallel
  note: Nothing better than to eat, drink, and find enjoyment
- ref: Eccl 3:19-22
  rel: concept
  note: Uncertainty about what follows death; enjoy one's portion
- ref: Job 7:9-10
  rel: concept
  note: 'No one returns from the grave (Intef song: none comes back to tell)'
- ref: Isa 22:13
  rel: parallel
  note: '''Let us eat and drink, for tomorrow we die'', here condemned by the prophet'
