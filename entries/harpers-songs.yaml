editorial:
  author_notes:
  - >-
    Put the Qoheleth parallel alongside Siduri's advice in the Old Babylonian Gilgamesh (Meyer
    tablet). The carpe diem motif is international.
  - >-
    The sceptical songs belong to tomb and banquet contexts, and New Kingdom harpers' songs
    sometimes reject their scepticism. Do not present Egyptian culture as generally doubting
    the afterlife.
  - >-
    Composition dates vary across the corpus. The Intef song claims Middle Kingdom origin
    but survives in New Kingdom copies (P. Harris 500; the tomb of Paatenemheb).
