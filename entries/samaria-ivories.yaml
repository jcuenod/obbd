id: samaria-ivories
title: Samaria Ivories
type: realia
cultures: [phoenician, israelite]
date:
  from: -875
  to: -725
  circa: true
  display: c. 875–725 BCE
scope: >-
  Hundreds of carved ivory plaques and fragments, mostly furniture inlays, found in the royal
  acropolis of Samaria in the 1930s. They are carved in Phoenician and North Syrian styles,
  with motifs such as sphinxes (cherubim), palmettes, lotus, the infant Horus, and the 'woman
  at the window'.
