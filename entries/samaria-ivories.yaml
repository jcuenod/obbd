editorial:
  author_notes:
  - >-
    The stratigraphic context is poor, so dates range across the 9th to 8th centuries. Do
    not tie individual pieces to Ahab without qualification.
  - >-
    Compare with ivories from Nimrud and Arslan Tash, many of which may be booty or tribute
    from the west. Some Nimrud ivories may come from Samaria itself.
  - >-
    Discuss the Egyptianising iconography in an Israelite royal setting and what it suggests
    about elite taste rather than religious belief.
  sources_to_check:
