id: tell-qasile-ostracon
title: Tell Qasile "Gold of Ophir" Ostracon
type: artifact
cultures: [hebrew]
date:
  from: -800
  to: -700
  circa: true
  display: c. 800–700 BCE
scope: >-
  A Hebrew ostracon found in 1946 at Tell Qasile (Tel Aviv) reading 'Gold of Ophir to Beth-Horon,
  30 shekels'. It is the only extrabiblical attestation of Ophir as a source of gold. The
  entry also covers the second Tell Qasile ostracon recording a quantity of oil.
