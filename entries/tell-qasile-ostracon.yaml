- ref: Isa 13:12
  rel: language
  note: '''Gold of Ophir'' as a byword for rarity'
- ref: 1Kgs 9:17
  rel: attests
  disputed: true
  note: byt ḥrn as the town Beth-horon, or a temple of the god Horon
