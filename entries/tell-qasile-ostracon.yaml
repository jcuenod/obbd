  rel: attests
  note: Hiram's fleet brings gold from Ophir
- ref: 1Kgs 22:48
  rel: attests
  note: Jehoshaphat's failed ships for Ophir gold (MT 22:49)
- ref: Ps 45:9
  rel: language
