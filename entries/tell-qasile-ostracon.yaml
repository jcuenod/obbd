editorial:
  author_notes:
  - Found on the surface, so the 8th-century date is palaeographic.
  - >-
    'Gold of Ophir' may describe a quality or type of gold rather than a shipment just arrived
    from Ophir. Either way it shows the term was current in Iron Age commerce.
  - Whether byt ḥrn is a place (Beth-horon) or a temple of Horon is open.
  - Ophir's location (Arabia, East Africa, India) is not settled by the ostracon.
  sources_to_check:
