editorial:
  author_notes:
  - >-
    Explain the dating debate. Redford argued that the Joseph-story names (Potiphera, Asenath,
    Zaphenath-paneah) are most typical of the Saite period (7th-6th centuries). Kitchen and
    Hoffmeier argue for earlier attestations. Present both sides with the evidence.
  - >-
    Loanwords show contact, but most could have entered Hebrew at many periods. Do not use
    them alone to date a text.
  - >-
    Moses' name is probably Egyptian. Exod 2:10's explanation is a Hebrew wordplay, not the
    historical etymology.
  - >-
    Distinguish true loanwords (tēbâ, gōmeʾ, hîn, ʾêpâ) from Egyptian personal and place names
    transmitted in Hebrew.
  sources_to_check:
  - Lambdin, 'Egyptian Loan Words in the Old Testament', JAOS 73 (1953)
  - Muchiki, Egyptian Proper Names and Loanwords in North-West Semitic (1999)
  - Noonan, Non-Semitic Loanwords in the Hebrew Bible (2019)
