id: egyptian-loanwords
title: Egyptian Loanwords and Names in the Hebrew Bible
type: concept
cultures: [egyptian, hebrew]
scope: >-
  Egyptian loanwords and personal names in the Hebrew Bible, concentrated in the Joseph and
  exodus narratives and in technical vocabulary (measures, materials, writing, the Nile).
  The entry covers their identification, their use as evidence for the date and setting of
  biblical texts, and the limits of that use.
