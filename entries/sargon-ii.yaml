editorial:
  author_notes:
  - >-
    Sargon II was virtually unknown outside Isa 20:1 until Botta excavated Khorsabad in 1843-1844;
    this is a classic case study in the history of biblical archaeology.
  - >-
    Present the debate over who took Samaria (Shalmaneser V in 722 vs Sargon in 720) neutrally.
  - >-
    Sargon's death in battle, with his body lost and unburied, caused theological anxiety
    in Assyria (the 'Sin of Sargon' text); the Isa 14 link (Ginsberg) is debated.
  sources_to_check:
