id: sargon-ii
title: Sargon II
type: person
cultures: [assyrian]
date:
  from: -722
  to: -705
  display: 722–705 BCE
scope: >-
  King of Assyria, probably a usurper, who claimed the conquest of Samaria, crushed western
  revolts at Qarqar (720) and Ashdod (712/711), built Dur-Sharrukin (Khorsabad), and died
  in battle in Anatolia. He is named in the Bible only at Isa 20:1.
passages:
- ref: Isa 20:1
  rel: attests
  note: Sargon sends his commander (tartan) against Ashdod
- ref: 2Kgs 17:6, 24
  rel: event
  note: Capture and resettlement of Samaria, claimed by Sargon
- ref: 2Kgs 18:10-11
  rel: event
  note: Fall of Samaria and deportation
- ref: Isa 10:9-11
  rel: event
  note: Hamath, Arpad and Samaria among Assyria's conquests
- ref: Isa 14:18-20
  rel: event
  disputed: true
  note: The king denied burial, often linked to Sargon's death in battle in 705
related: [sargon-ii-inscriptions, fall-of-samaria, ashdod, samaria, shalmaneser-v, sennacherib,
  merodach-baladan]
