editorial:
  author_notes:
  - >-
    Present the main models: Mary Douglas (Purity and Danger, 1966) on classification; J.
    Milgrom on impurity polluting the sanctuary and on death and life symbolism; J. Klawans
    (Impurity and Sin in Ancient Judaism, 2000) on ritual versus moral impurity.
  - >-
    Comparanda include the Hittite Instructions for Priests and Temple Officials (CTH 264),
    Mesopotamian priestly purity and ikkibu taboos, and Egyptian wab-priest purity.
  - >-
    Correct the common misconception that the impurity laws are hygienic or medical. Impurity
    is not sin and is often unavoidable.
  sources_to_check:
  - CTH 264 (Instructions for Priests and Temple Officials)
