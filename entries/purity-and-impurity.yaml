id: purity-and-impurity
title: Purity and Impurity
aliases: [Ritual purity, Tumah and taharah]
type: practice
cultures: [ane, hittite, babylonian, egyptian]
scope: >-
  Concepts and rites of ritual purity and impurity in the Hebrew Bible (bodily, corpse, animal
  and sanctuary impurity, and moral impurity), compared with Hittite, Mesopotamian and Egyptian
  purity rules for temples and personnel. Food laws, the Day of Atonement and Second Temple
  purity installations have their own entries.
passages:
- ref: Lev 10:10
  rel: concept
  note: Priests distinguish holy from common, unclean from clean
- ref: Lev 11-15
  rel: practice
  note: Impurity from animals, childbirth, skin disease and genital discharges
- ref: Num 19
  rel: practice
  note: Corpse impurity and the red heifer's ash-water
- ref: Num 5:1-4
  rel: practice
  note: Removing the impure from the camp
- ref: Lev 16:16, 19
  rel: concept
  note: The sanctuary cleansed of Israel's impurities
- ref: Lev 18:24-28
  rel: concept
  note: Moral impurity defiles the land, which vomits out its inhabitants
- ref: Hag 2:10-14
  rel: practice
  note: Priestly ruling on the transmission of holiness and impurity
- ref: Ezek 44:23
  rel: practice
  note: Priests teach the difference between clean and unclean
- ref: Isa 6:5-7
  rel: imagery
  note: Unclean lips purified with a coal from the altar
- ref: Ps 51:7
  rel: imagery
  note: '''Purge me with hyssop'' (MT 51:9)'
- ref: Mark 7:1-23
  rel: practice
  note: Dispute over hand-washing and purity
