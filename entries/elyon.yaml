editorial:
  author_notes:
  - >-
    Key debate is whether Elyon was originally an epithet of El or a separate deity; the Sefire
    pair "El and Elyon" (KAI 222) and Philo of Byblos's Elioun are the main evidence for a
    distinct god.
  - >-
    On Deut 32:8-9, present the textual evidence (MT "sons of Israel"; 4QDeutj "sons of God";
    LXX) and the debate over whether Elyon and YHWH are distinct there (Smith) or identical
    (most traditional readings).
  - >-
    Elyon is not attested as an independent deity at Ugarit; ʿly is used of Baal in KTU 1.16.
    Do not claim a Ugaritic god Elyon.
  - >-
    Many scholars connect El Elyon to pre-Israelite Jerusalem (Gen 14; Ps 76:2); present this
    as hypothesis.
