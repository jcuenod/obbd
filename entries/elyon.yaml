    Melchizedek priest of El Elyon, creator of heaven and earth; Abram swears by YHWH El Elyon
- ref: Deut 32:8-9
  rel: concept
  note: Elyon divides the nations; YHWH's portion is Jacob (text-critical issue in v. 8)
- ref: Num 24:16
  rel: language
  note: Balaam 'knows the knowledge of Elyon'
