id: elyon
title: Elyon
aliases: [Most High, ʿElyon]
type: deity
cultures: [hebrew, aramean, phoenician]
scope: >-
  ʿElyon, "Most High", a divine title used in the Hebrew Bible for YHWH, often as El Elyon,
  and attested as a divine name in the Aramaic Sefire treaty and in Philo of Byblos. The entry
  covers the title's origin and its role in Jerusalem royal-temple theology and in Deut 32:8-9.
passages:
- ref: Gen 14:18-22
  rel: language
