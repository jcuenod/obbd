id: avaris
title: Avaris (Tell el-Dabʿa)
aliases: [Tell el-Dabʿa, Hut-waret]
type: site
cultures: [egyptian, canaanite]
scope: >-
  The site of Tell el-Dabʿa in the eastern Nile Delta, identified with Avaris. From the late
  Middle Kingdom it was home to a large Asiatic (Levantine) population, and it was the capital
  of the Hyksos Fifteenth Dynasty. In the New Kingdom it hosted Thutmoside palaces with Minoan-style
  frescoes and later became part of Pi-Ramesses.
