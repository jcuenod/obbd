editorial:
  author_notes:
  - >-
    Manfred Bietak's excavations (from 1966) identified the site and documented Levantine-style
    houses, tombs (including donkey burials), and temples. They show long-term Asiatic presence
    before and during Hyksos rule.
  - >-
    Rohl's and others' identification of an Asiatic official's tomb and statue at Avaris as
    Joseph's is not accepted by scholars. Mention it as a popular misconception.
  - >-
    The location of Goshen is not securely fixed (Wadi Tumilat or the wider eastern Delta).
    Hence the disputed tags.
  sources_to_check:
  - Bietak, Avaris. The Capital of the Hyksos (1996)
  image_query: Tell el-Daba Avaris excavation
