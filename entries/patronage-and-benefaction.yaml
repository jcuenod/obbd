editorial:
  author_notes:
  - >-
    Distinguish personal patronage, civic benefaction, friendship, and gift reciprocity instead
    of treating them as one uniform system.
  - >-
    Phoebe's precise social and legal position remains debated. Do not infer a formal Roman
    patron-client relationship solely from the term prostatis.
  - Do not claim that every Pauline use of charis has one fixed patronage meaning.
  - >-
    Existing coverage to cross-reference rather than repeat. The Erastus Inscription is one
    example of civic expenditure; Hospitality covers receiving and protecting guests, guest-friendship,
    and divine visitors.
  - >-
    Optional enrichment (report P01): the Abila dedication of Nymphaeus, freedman of Lysanias,
    publicizes expenditure on a road, temple, and plantings. It does not give him the title
    euergetēs, and his freed status does not reconstruct every obligation to Lysanias.
  sources_to_check:
  - Seneca, De beneficiis
  - IBerenike 18 = CJZC 70 = AGRW 305
  - Revue Biblique 9.4 (1912), pp. 533-540, inscription A, lines 3-4 (Abila)
