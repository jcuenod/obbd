id: patronage-and-benefaction
title: Patronage, Benefaction, and Reciprocity
type: practice
cultures: [greek, roman, jewish]
scope: >-
  Patronage, civic benefaction, and reciprocal gift exchange organized relationships of support,
  obligation, gratitude, and honor in Jewish and Greco-Roman communities. The entry supplies
  the social framework for gifts, support, obligation, and public honor across the Gospels
  and Paul.
passages:
- ref: Luke 7:1-5
  rel: practice
  note: >-
    Synagogue benefaction and local intermediaries frame the elders' appeal on behalf of the
    centurion
- ref: Luke 14:12-14
  rel: practice
  note: >-
    Invitations to people unable to repay challenge ordinary expectations of reciprocal hospitality
- ref: Luke 22:25-27
  rel: language
  note: The title 'benefactors' belongs to the public language of power, service, and honor
- ref: Rom 16:1-2
  rel: language
  note: Phoebe's designation as prostatis is illuminated by benefaction and protective support
- ref: 1Cor 9:1-18
  rel: practice
  note: >-
    Paul's entitlement to support and refusal to use it intersect with conventions of obligation
    and reciprocity
- ref: Phil 4:10-20
  rel: practice
  note: >-
    Gifts, partnership, and acknowledgment are interpreted against ancient expectations of
    reciprocity
related: [berenike-judean-benefactor-decree, thyatira-dyers-claudia-ammion, meals-and-banqueting,
  greco-roman-associations, lysanias-abila-inscriptions, erastus-inscription, hospitality]
media:
