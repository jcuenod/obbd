editorial:
  author_notes:
  - >-
    Distinguish debt servitude of Israelites (time-limited) from chattel slavery of foreigners
    (Lev 25:44-46). Biblical terminology (ʿebed also means royal servant or official) does
    not map neatly onto these categories.
  - >-
    Hammurabi limits debt servitude of a debtor's family to three years (LH §117), against
    the biblical six. Hammurabi makes harbouring a fugitive slave a capital crime (§§15-16).
    Deut 23:15-16 is unusual in forbidding extradition. Compare the ear-piercing of Exod 21:6
    with LH §282 (slave's ear cut off for repudiating his master).
  - >-
    Discuss whether ʿibrî ('Hebrew') in Exod 21:2 is an ethnic term or a social class, perhaps
    related to ḫabiru, and how Deuteronomy revises the Covenant Code by extending release
    to women.
  - >-
    Documentary evidence includes Old and Neo-Babylonian sale and debt contracts, the Wadi
    Daliyeh slave conveyances from Samaria (4th century BCE), and Elephantine documents.
  - >-
    Avoid both apologetic minimising ('servants, not slaves') and anachronistic equation with
    Atlantic chattel slavery.
  sources_to_check:
