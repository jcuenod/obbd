title: Slavery and Debt Servitude
aliases: [Debt slavery, Debt servitude, Hebrew slave]
type: practice
cultures: [hebrew, ane, egyptian, greek, roman]
scope: >-
  Slavery and debt servitude in biblical law and narrative, compared with ancient Near Eastern
  legal and documentary evidence. Covers the 'Hebrew slave' laws, female servitude, protections
  and their limits, fugitive slaves, the sale of foreign chattel slaves, and the Greco-Roman
  setting of New Testament texts.
