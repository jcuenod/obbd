editorial:
  author_notes:
  - >-
    The leading proposal is Tartessos in southwestern Iberia. Others include Sardinia (a reading
    of the Nora Stone is debated), Tarsus in Cilicia (Josephus) and a generic 'far west'.
    An Esarhaddon inscription names Tarsisi among lands of the sea (verify the text).
  - >-
    Lead-isotope studies of silver hoards from the southern Levant point to Iberian and Sardinian
    sources from the tenth or ninth century BCE (Eshel et al., PNAS 2019; verify). This supports
    early Phoenician western trade.
  - >-
    The phrase 'ship of Tarshish' probably denotes a type of long-haul ship. Chronicles reinterprets
    it as ships sailing to Tarshish from Ezion-geber (2 Chr 9:21; 20:36), which is geographically
    impossible for a western Tarshish.
  sources_to_check:
  - Aubet, The Phoenicians and the West (2nd ed., 2001)
