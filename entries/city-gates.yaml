id: city-gates
title: City Gates and Fortifications
aliases: [Six-chambered gate, Solomonic gates]
type: realia
cultures: [israelite, judahite, canaanite]
scope: >-
  Gateways and fortification systems of Bronze and Iron Age cities in the southern Levant
  (chambered gates, walls, towers, glacis), their archaeology, and their use in biblical texts.
  Covers the debate over 'Solomonic' six-chamber gates; judicial use of gates is treated under
  courts-and-legal-procedure.
