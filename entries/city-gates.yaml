editorial:
  author_notes:
  - >-
    Give the typology. Middle Bronze triple-pier gates (e.g., the mudbrick arched gate at
    Dan) were followed by Iron Age six-, four-, and two-chamber gates.
  - >-
    Yadin's attribution of the Hazor, Megiddo, and Gezer six-chamber gates to Solomon (1 Kgs
    9:15) is the starting point of the tenth-century debate. The same plan also occurs at
    non-Israelite and later sites (e.g., Ashdod, Lachish), so it cannot serve as a royal 'signature'.
  - >-
    Mention gate shrines and cultic installations (Dan's maṣṣebot and podium; the Lachish
    Level III gate shrine with its toilet, compare 2 Kgs 10:27) as background to 2 Kgs 23:8.
  - >-
    Identifications such as Khirbet Qeiyafa's two gates with 'Shaaraim' (1 Sam 17:52) are
    disputed. Present them as proposals.
  image_query: six-chambered gate Megiddo
