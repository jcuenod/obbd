editorial:
  author_notes:
  - >-
    Explain the terms. Nešek ('bite') and tarbît/marbît ('increase') appear together in Lev
    25:36-37 and Ezek 18. Whether they denote interest deducted in advance and interest added
    at repayment, or are near-synonyms, is debated. Hebrew ʿăbōṭ and ḥăbōl denote pledges,
    and ʿērābôn (Gen 38) is the Semitic word behind Greek arrabōn (2 Cor 1:22).
  - >-
    Mesopotamian law regulated rather than banned interest. The Laws of Eshnunna (§18A) and
    the gap sections of Hammurabi's laws set maximum rates of 20 percent on silver and 33⅓
    percent on grain; verify section numbers in Roth. Hammurabi §§113-119 regulate distraint
    and persons held as pledges.
  - >-
    Elephantine Aramaic loan contracts (e.g. TAD B3.1) record monthly interest and penalties
    for default. They show Judeans in the Persian period lending at interest among themselves;
    verify the rates before citing.
  - >-
    The biblical ban protects a needy kinsman (it is framed as charity, not commerce), and
    Deut 23:20 allows interest from foreigners. Pledge limits protect the means of subsistence
    (cloak, millstone). Do not present it as a general ban on commercial credit, and note
    later Jewish and Christian developments only briefly.
  - >-
    Neh 5:11 refers to 'the hundredth' of money, grain, wine and oil, perhaps one percent
    a month. The interpretation is debated.
  sources_to_check:
  - M. T. Roth, Law Collections from Mesopotamia and Asia Minor (SBLWAW 6, 2nd ed. 1997)
  - >-
    B. Porten and A. Yardeni, Textbook of Aramaic Documents from Ancient Egypt, vol. 2: Contracts
    (1989)
  - R. Westbrook (ed.), A History of Ancient Near Eastern Law, 2 vols. (2003)
  - >-
    E. Neufeld, 'The Prohibitions against Loans at Interest in Ancient Hebrew Laws,' HUCA
    26 (1955)
