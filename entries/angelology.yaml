editorial:
  author_notes:
  - >-
    Names and ranks appear only in late texts (Daniel, Tobit, 1 Enoch). Earlier biblical messengers
    are anonymous and often refuse to give a name (Judg 13:17-18). Explain the shift rather
    than reading later angelology back.
  - >-
    Background proposals: Mesopotamian vizier or messenger gods (sukkallu; e.g. Nusku, Papsukkal)
    and Ugaritic messenger pairs for the role; Persian Aməša Spəntas for the seven archangels,
    which is debated; the demon Asmodeus in Tobit, a clear Iranian borrowing (Aēšma). Separate
    the firm from the speculative.
  - >-
    Olyan (1993) argued that many angel names and classes arose from exegesis of biblical
    words. A rabbinic tradition (y. Rosh Hash. 1:2) says the names of the angels 'came up
    from Babylon'. Verify the reference before quoting it.
  - >-
    The War Scroll (1QM 9:15-16) names Michael, Gabriel, Sariel and Raphael on the shields
    of the towers. Note the variation in lists of four and seven across 1 Enoch 9, 20 and
    40 and Qumran.
  sources_to_check:
  - S. M. Olyan, A Thousand Thousands Served Him (TSAJ 36, 1993)
  - >-
    M. Mach, Entwicklungsstadien des jüdischen Engelglaubens in vorrabbinischer Zeit (TSAJ
    34, 1992)
  - ABD, s.v. "Angels"
