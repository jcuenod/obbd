id: angelology
title: Named Angels and Angelic Hierarchies
aliases: [archangels, Michael, Gabriel, Raphael, Uriel, angels of the nations]
type: concept
cultures: [jewish, hebrew]
scope: >-
  The development of named angels, ranks of angels and national angelic "princes" in Persian-
  and Hellenistic-period Judaism (Daniel, Tobit, 1 Enoch, Jubilees, Qumran) and their reception
  in the New Testament. Anonymous divine messengers and the angel of YHWH, and the divine
  council, have their own entries.
