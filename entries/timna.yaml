title: Timna
aliases: [Timna Valley, King Solomon's Mines (popular)]
type: site
cultures: [egyptian, edomite]
scope: >-
  The copper-mining valley north of Eilat in the southern Arabah. Covers Egyptian New Kingdom
  mining and the Hathor shrine, the later 'Midianite' phase with its tent shrine and copper
  snake, and Iron Age smelting.
