editorial:
  author_notes:
  - >-
    Glueck's 1930s label 'King Solomon's Mines' was overturned by Rothenberg's excavations,
    which dated much activity to the Egyptian New Kingdom (Seti I to Ramesses V) and uncovered
    the Hathor shrine.
  - >-
    Ben-Yosef's Central Timna Valley Project showed through radiocarbon that smelting peaked
    in the eleventh to ninth centuries BCE, organized by a local society that left few buildings.
    He proposes a link to early Edom.
  - >-
    Qurayyah painted ('Midianite') pottery and a copper snake with a gilded head come from
    the post-Egyptian phase of the shrine. Rothenberg's tent-shrine reading and the link to
    Num 21 are suggestive only.
  sources_to_check:
  - Rothenberg, The Egyptian Mining Temple at Timna (1988)
  image_query: Timna Hathor temple
