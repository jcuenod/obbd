editorial:
  author_notes:
  - >-
    Two main explanations compete. One reads the image as bird imagery (Deut 32:11; Matt 23:37),
    the other as an allusion to the temple cherubim (Ps 36; 61 pair wings with temple and
    tent). Keel and others draw especially on Egyptian protective winged goddesses. Present
    both.
  - >-
    Egyptian iconography of Isis and Nephthys, the vulture goddess Nekhbet, and the winged
    sun disc above temple doorways is the richest comparative material. Levantine ivories
    and seals adopted it.
  - Do not reduce the image to one source. Several image traditions converge.
  image_query: Isis winged Tutankhamun canopic shrine
