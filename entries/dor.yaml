id: dor
title: Dor (Tel Dor)
aliases: [Tel Dor, Naphath-dor, Dora, Khirbet el-Burj]
type: site
cultures: [phoenician, canaanite, israelite]
scope: >-
  The harbour town on the Carmel coast (Tel Dor), occupied from the Bronze Age to the Roman
  period. It appears as a Sikil (Tjeker) town in the Report of Wenamun, in the Israelite territorial
  lists, as the Assyrian province of Duʾru, as a Phoenician and Hellenistic city, and as a
  stronghold besieged in 1 Maccabees. The entry covers the biblical references and the results
  of the Stern and Gilboa-Sharon excavations.
