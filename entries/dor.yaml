editorial:
  author_notes:
  - >-
    Wenamun (c. 1070s BCE) calls Dor a town of the Tjeker (Sikil) ruled by a prince Beder.
    Stern stressed a Sea Peoples phase, but Gilboa and Sharon find the Iron I town culturally
    Canaanite/Phoenician with limited Aegean features. Present the debate.
  - >-
    When Israel took control of Dor is debated: the tenth century (1 Kgs 4:11 taken at face
    value) or the ninth, under the Omrides. After 732 Dor became the centre of the Assyrian
    province of Duʾru.
  - >-
    The Eshmunazar II sarcophagus records that the Persian king gave 'Dor and Joppa' to Sidon.
    In the Hellenistic and Roman periods Dora was a fortified harbour city; 1 Macc 15 and
    Josephus refer to it.
  - >-
    'Naphath-dor' (Josh 11:2; 12:23; 1 Kgs 4:11) may mean 'the heights of Dor' (the Carmel
    ridge) or simply 'the region of Dor'. Note the uncertainty.
  - >-
    The finds include purple-dye installations, harbour structures and shipwrecks in the lagoon.
    Link to purple-dye and phoenician-seafaring.
  sources_to_check:
