editorial:
  author_notes:
  - >-
    Ashurnasirpal II rebuilt Kalḫu as his capital (the Banquet Stele records its inauguration
    c. 879). Its major buildings include the Northwest Palace, the Nabu temple and Fort Shalmaneser,
    the arsenal where many ivories were stored.
  - >-
    It was excavated by Layard (1845-51), by Mallowan (1949-57, the ivories) and by Iraqi
    teams, who found the queens' tombs with gold jewellery in 1988-89.
  - >-
    The Nimrud ivories include Phoenician, North Syrian and Assyrian styles, much of it booty
    or tribute from the Levant. They are the closest comparanda for the Samaria ivories.
  - ISIS deliberately destroyed much of the Northwest Palace in 2015.
  sources_to_check:
  - Oates and Oates, Nimrud - An Assyrian Imperial City Revealed (2001)
