scope: >-
  The Assyrian capital Kalḫu (biblical Calah) on the Tigris, refounded by Ashurnasirpal II.
  Covers its palaces, reliefs, ivories and royal tombs, and the monuments from the site that
  name Israelite and Judahite kings.
