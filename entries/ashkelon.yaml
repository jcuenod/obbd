cultures: [philistine, canaanite]
scope: >-
  The coastal city of Ashkelon, a Middle Bronze Canaanite port and later a city of the Philistine
  pentapolis, destroyed by Nebuchadnezzar in 604 BCE. Covers the Leon Levy Expedition's results
  from the Bronze Age to the Babylonian destruction; later periods are covered briefly.
