editorial:
  author_notes:
  - >-
    The etymology from npl "fall" ("fallen ones") is uncertain; other proposals exist. Do
    not translate as "fallen angels".
  - >-
    Num 13:33's identification of Anakim with Nephilim is often regarded as a gloss; Gen 6:4's
    "and also afterward" may also harmonize traditions.
  - >-
    Comparative background includes Greek heroes/Titans (Hendel) and the Mesopotamian apkallu
    and Gilgamesh traditions, which the Qumran Book of Giants uses explicitly (Gilgamesh and
    Hobabish).
  - >-
    Exclude sensational claims (giant skeletons, hybrid DNA, modern conspiracy readings) except
    to flag them as misconceptions.
  sources_to_check:
  - >-
    R. S. Hendel, "Of Demigods and the Deluge: Toward an Interpretation of Genesis 6:1-4,"
    JBL 106 (1987)
  - L. T. Stuckenbruck, The Book of Giants from Qumran (TSAJ 63, 1997)
  - B. R. Doak, The Last of the Rephaim (2012)
  - DDD, s.v. "Nephilim"
