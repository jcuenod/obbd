editorial:
  author_notes:
  - >-
    Scholars debate in what sense pharaoh was "divine" (the office versus the person; Posener,
    Frankfort, and later nuancing). Avoid simplistic "god-king" language.
  - >-
    Israelite royal sonship (Ps 2; 2 Sam 7:14) is usually read as adoptive, unlike Egyptian
    physical-mythological sonship. Whether the closest background is Egyptian or Neo-Assyrian
    is debated.
  - >-
    Von Rad's "royal protocol" (ʿēdût = Egyptian nḫbt) and Alt's linking of Isa 9:6 with the
    fivefold titulary are classic proposals that remain contested. Hence they are marked as
    disputed.
  - >-
    Biblical depictions of pharaoh (Exodus; Ezek 29-32) are polemical portraits, drawn in
    part from Egyptian royal self-presentation.
  sources_to_check:
  - Frankfort, Kingship and the Gods (1948)
  - O'Connor and Silverman (eds.), Ancient Egyptian Kingship (1995)
  - von Rad, 'Das judäische Königsritual', TLZ 72 (1947)
