id: egyptian-kingship
title: Egyptian Divine Kingship
aliases: [Pharaonic kingship, Divine kingship in Egypt]
type: concept
cultures: [egyptian]
scope: >-
  The ideology of Egyptian kingship. The pharaoh was the incarnation of Horus, son of Re,
  guarantor of maat, sole mediator between gods and people, and victor over chaos and foreign
  enemies. The entry covers its expression in titulary, iconography, and ritual, and its influence
  on and contrast with Israelite royal ideology.
