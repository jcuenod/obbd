editorial:
  author_notes:
  - >-
    The first secure mention is in Tiglath-pileser I (c. 1100, Aḫlamû-Aramaya). Earlier references
    are debated.
  - >-
    Aramean states (Bit-Adini, Bit-Agusi/Arpad, Samʾal, Guzana, Zobah, Damascus) often had
    mixed Luwian-Aramean cultures. Their inscriptions (Tell Fekheriye, Zakkur, Sefire, Tel
    Dan) are key sources.
  - >-
    The patriarchal 'Aramean' kinship traditions (Gen 24-31; Deut 26:5) raise questions of
    date and anachronism. The meaning of ʾōbēd in Deut 26:5 ('wandering' or 'perishing') is
    debated.
  - >-
    Aramaic spread as the lingua franca of the Assyrian and Persian empires. Cross-refer aramaic-language.
  sources_to_check:
  - Younger, A Political History of the Arameans (2016)
