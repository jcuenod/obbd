editorial:
  author_notes:
  - >-
    Distinguish functions (commemorative, funerary, legal witness, boundary, and cultic representation
    of a deity). Not every standing stone is cultic, and not every biblical "stone" (e.g.
    Josh 4:20) is called a maṣṣēbâ.
  - >-
    Key sites include the Gezer row of monoliths (Middle Bronze Age), the Hazor stelae shrine
    (Late Bronze Age), the Arad shrine (Iron Age, one or two maṣṣēbôt, with debate over their
    number), and Negev and Sinai open-air sanctuaries (Avner).
  - >-
    Note the tension between patriarchal practice and Deut 16:22. Mettinger's "material aniconism"
    frames standing stones as aniconic symbols of divine presence.
