id: massebot
title: Standing Stones (Massebot)
aliases: [maṣṣēbâ, standing stones, betyls]
type: realia
cultures: [hebrew, canaanite, arabian]
scope: >-
  Standing stones (maṣṣēbôt) in the Levant, set up as memorials, witnesses, boundary markers,
  or representations of divine presence. The entry covers their biblical evaluation, from
  patriarchal use to Deuteronomic prohibition, and archaeological examples from Gezer, Hazor,
  Arad, and desert shrines.
