editorial:
  author_notes:
  - >-
    Separate the excavated material (Shiloh's 1982 'House of the Bullae' with c. 50 bullae,
    E. Mazar's 2005 and 2008 finds, the 2019 Givati Parking Lot bulla) from unprovenanced
    material (Avigad's 1986 corpus including the Baruch and Yerahmeel bullae).
  - >-
    Apply explicit identification criteria (provenance, date, name plus patronym or title;
    cf. Mykytiuk). Common names make single-name matches weak.
  - >-
    Goren and Arie (2014) argued that the Baruch bullae are probably forgeries, and many epigraphers
    no longer use them. Do not present them as 'Baruch's seal'.
  - >-
    The 'House of the Bullae' was burned in 586, which baked and preserved the bullae. Note
    that the papyri they sealed are lost.
  sources_to_check:
  - Avigad, Hebrew Bullae from the Time of Jeremiah (1986)
  - Shoham, 'Hebrew Bullae', in City of David Excavations Final Report VI (Qedem 41, 2000)
  - Avigad and Sass, Corpus of West Semitic Stamp Seals (1997)
  - >-
    Mykytiuk, Identifying Biblical Persons in Northwest Semitic Inscriptions of 1200-539 B.C.E.
    (2004)
