id: bullae-of-jeremiah-era-officials
title: Bullae of Jeremiah-Era Officials
type: artifact
cultures: [judahite]
date:
  from: -620
  to: -586
  circa: true
  display: c. 620–586 BCE
scope: >-
  Late Iron Age Hebrew seal impressions (bullae) naming officials who share names and patronyms
  with figures in Jeremiah and 2 Kings. The entry covers the excavated City of David corpora
  ('House of the Bullae', Eilat Mazar's finds) and the large unprovenanced collections, and
  the problem of identifying their owners.
passages:
- ref: Jer 36:10-12, 25
  rel: attests
  note: Gemariah son of Shaphan; bulla 'Gemaryahu son of Shaphan' from the City of David
- ref: Jer 37:3; 38:1
  rel: attests
  note: Jehucal son of Shelemiah; bulla excavated in 2005
- ref: Jer 38:1
  rel: attests
  note: Gedaliah son of Pashhur; bulla excavated in 2008
- ref: 2Kgs 23:11
  rel: attests
  disputed: true
  note: Nathan-melech the official; excavated bulla 'Nathan-melech servant of the king'
- ref: 2Kgs 25:22
  rel: attests
  disputed: true
  note: Lachish bulla 'Gedalyahu who is over the house', possibly Gedaliah son of Ahikam
- ref: Jer 36:4, 32
  rel: attests
  disputed: true
  note: Baruch son of Neriah the scribe; unprovenanced bullae of doubtful authenticity
- ref: Jer 36:26
  rel: attests
  disputed: true
  note: Jerahmeel 'son of the king'; unprovenanced bulla
- ref: Jer 32:10-14
  rel: practice
  note: Sealed deed of purchase; bullae once sealed such papyrus documents
