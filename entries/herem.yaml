editorial:
  author_notes:
  - >-
    Mesha Stele line 17, 'for I had devoted it (hḥrmth) to Ashtar-Chemosh', is the only clear
    extrabiblical war ḥērem. Mari asakkum (taboo booty) is a partial analogue only.
  - >-
    Use P. D. Stern, The Biblical Ḥerem (1991), and Lohfink's TDOT article. Many scholars
    see Deuteronomy's ḥērem against the Canaanites as programmatic and ideological, written
    when those peoples no longer existed, but rooted in older war practice.
  - Distinguish the war ḥērem from the sacral-legal ḥērem of Lev 27 and Num 18:14.
  - >-
    Handle the ethical discussion even-handedly. Avoid both apologetic minimizing and anachronistic
    'genocide' framing without discussion.
