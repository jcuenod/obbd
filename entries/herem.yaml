id: herem
title: Ḥerem (the Ban)
aliases: [The ban, Devotion to destruction, Ḥērem]
type: practice
cultures: [hebrew, moabite, amorite]
scope: >-
  Ḥērem: the devotion of persons or property to the deity, in war by destruction and in sacral
  law by irrevocable consecration. The entry covers the biblical texts, the Mesha Stele parallel,
  other partial ancient Near Eastern analogues, and debates about its historicity and ideology.
passages:
- ref: Deut 7:1-6
  rel: practice
  note: The nations of the land to be devoted; no covenant or intermarriage
- ref: Deut 20:16-18
  rel: practice
  note: In the towns of the land 'let nothing that breathes remain alive'
- ref: Deut 13:12-18
  rel: practice
  note: An apostate Israelite town devoted (MT 13:13-19)
- ref: Num 21:2-3
  rel: practice
  note: Vow of ḥērem and Hormah
- ref: Josh 6:17-21, 24
  rel: practice
  note: Jericho devoted; metals to YHWH's treasury
- ref: Josh 7:1-26
  rel: practice
  note: Achan's violation of the devoted things
- ref: Josh 8:26-27
  rel: practice
  note: Ai devoted, but livestock and spoil allowed
- ref: 1Sam 15:1-33
  rel: practice
  note: Amalek to be devoted; Saul's failure
- ref: 1Kgs 20:42
  rel: practice
  note: Ahab releases 'the man I had devoted to destruction'
- ref: Lev 27:28-29
  rel: practice
  note: Devoted things most holy; devoted persons cannot be ransomed
- ref: Mic 4:13
  rel: language
  note: Devote their gain to YHWH
