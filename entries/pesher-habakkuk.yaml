editorial:
  author_notes:
  - >-
    Survey identifications of the Wicked Priest (Jonathan or Simon Maccabee most often; the
    Groningen hypothesis of several priests). Stress their uncertainty.
  - Kittim = Romans is widely accepted (e.g. sacrificing to their standards, 1QpHab 6:3-5).
  - >-
    The absence of Hab 3 is not evidence that the chapter did not yet exist; the pesher's
    scope may simply have been chapters 1-2.
  - >-
    Note that the Tetragrammaton is written in paleo-Hebrew script within the square-script
    text.
  sources_to_check:
  - 'M. P. Horgan, Pesharim: Qumran Interpretations of Biblical Books (CBQMS 8, 1979)'
  - W. H. Brownlee, The Midrash Pesher of Habakkuk (1979)
  - M. Burrows (ed.), The Dead Sea Scrolls of St. Mark's Monastery, vol. 1 (1950)
