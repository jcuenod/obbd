id: pesher-habakkuk
title: Pesher Habakkuk (1QpHab)
aliases: [1QpHab, Habakkuk Commentary]
type: artifact
cultures: [jewish]
date:
  from: -30
  to: 1
  circa: true
  display: c. 30 BCE–1 CE
scope: >-
  The continuous commentary (pesher) on Habakkuk 1-2 from Qumran Cave 1. It interprets the
  prophet's words as referring to the community's own history: the Teacher of Righteousness,
  the Wicked Priest, the Man of the Lie, and the Kittim (Romans).
passages:
- ref: Hab 1:1-2:20
  rel: form
  note: Running pesher on Habakkuk 1-2; chapter 3 is not included
- ref: Hab 1:6
  rel: language
  note: The Chaldeans reinterpreted as the Kittim, i.e. the Romans (1QpHab 2:10-15)
- ref: Hab 2:2-3
  rel: concept
  note: Prophet ignorant of the end; the Teacher given 'all the mysteries' (1QpHab 7:1-14)
- ref: Hab 2:4
  rel: concept
  note: The righteous live by faithfulness to the Teacher (1QpHab 7:17-8:3)
- ref: Hab 2:15
  rel: concept
  note: Wicked Priest confronts the Teacher on his Day of Atonement (1QpHab 11:2-8)
- ref: Rom 1:17
  rel: concept
  note: Contemporary eschatological reading of Hab 2:4
- ref: Heb 10:37-38
  rel: concept
  note: Delay of the vision and Hab 2:3-4 applied to the community
- ref: Acts 2:16-21
  rel: form
  note: '''This is what was spoken by the prophet'': a fulfilment hermeneutic comparable to
    pesher'
related: [dead-sea-scrolls, qumran, jewish-sects, community-rule, war-scroll, maccabean-revolt]
location:
  institution: Israel Museum, Jerusalem (Shrine of the Book)
  accession: null
media:
