editorial:
  author_notes:
  - >-
    Ostraca (ink or incised texts on sherds) were a cheap medium for short texts. They survive
    far better than papyrus, which skews the evidence toward administrative and military writing.
  - >-
    Major Hebrew corpora: Samaria (8th c.), Meṣad Ḥashavyahu (late 7th c.), Arad (Elyashib
    archive, c. 600), Lachish (c. 588), Horvat ʿUza. Aramaic: Elephantine and Idumean (4th
    c.).
  - >-
    Multispectral imaging has recovered previously unseen text (e.g. Arad 16 verso), so cite
    up-to-date editions.
  sources_to_check:
