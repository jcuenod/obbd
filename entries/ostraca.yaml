    F. W. Dobbs-Allsopp et al., Hebrew Inscriptions: Texts from the Biblical Period of the
    Monarchy (2005)
  - >-
    S. Aḥituv, Echoes from the Past: Hebrew and Cognate Inscriptions from the Biblical Period
    (2008)
