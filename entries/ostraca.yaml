cultures: [judahite, israelite, aramean, hebrew]
scope: >-
  Inscribed potsherds, the commonest surviving medium of everyday writing in the Iron Age
  and Persian-period Levant: letters, receipts, lists and exercises. This general entry covers
  the medium and the main corpora. Individual ostraca have their own entries.
