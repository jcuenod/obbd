scope: >-
  The 'Arabs' of first-millennium BCE Assyrian, Babylonian, Persian and biblical sources,
  especially the Qedarite confederation of northern Arabia. Covers the sources, the Arab queens
  and kings who dealt with Assyria, the incense and caravan trade, and Geshem the Arab of
  Nehemiah.
