scope: >-
  The works of Flavius Josephus (37-c. 100 CE): Jewish War, Jewish Antiquities, Life, and
  Against Apion. They are the principal narrative source for Judea from the Hasmoneans to
  the revolt of 66-73 CE and for the persons, groups, and institutions in the New Testament.
