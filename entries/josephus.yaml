editorial:
  author_notes:
  - >-
    Explain the dates and aims of each work (War c. 75-79; Antiquities 93/94; Life and Against
    Apion later), Flavian patronage, and apologetic tendencies. Do not take his numbers at
    face value.
  - >-
    Testimonium Flavianum (Ant. 18.63-64): the majority view is a partly authentic core with
    Christian interpolations. The James (Ant. 20.200) and John the Baptist passages are generally
    accepted as authentic.
  - >-
    Note divergences from the NT (e.g. Herodias's first husband; the Theudas chronology in
    Acts 5:36). The argument that Luke used Josephus is a minority view.
  - >-
    The so-called 'bust of Josephus' (Ny Carlsberg Glyptotek) has no basis as a portrait.
    Avoid using it as an image.
  sources_to_check:
  - >-
    H. St. J. Thackeray, R. Marcus, A. Wikgren, and L. H. Feldman (trans.), Josephus, 10 vols.
    (Loeb Classical Library, 1926-1965)
