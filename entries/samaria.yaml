cultures: [israelite]
scope: >-
  The capital of the northern kingdom founded by Omri, later an Assyrian provincial centre
  and the Herodian city of Sebaste. Covers the royal acropolis, the ostraca and ivories, and
  the site's later history; the Persian-period province and Samaritan origins are treated
  elsewhere.
