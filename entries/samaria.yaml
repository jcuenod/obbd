editorial:
  author_notes:
  - >-
    Excavated by Harvard (Reisner and Fisher, 1908-10) and the Joint Expedition (Crowfoot,
    Kenyon, Sukenik, 1931-35). Kenyon's 'Building Periods' and pottery periods have been reworked
    by Tappy and others, and the attribution of the first building period to Omri is debated.
  - >-
    The acropolis with its casemate enclosure and fine ashlar masonry is a showcase of Omride
    royal architecture with Phoenician affinities.
  - >-
    The eighth-century Samaria ostraca document fiscal administration and include both Yahwistic
    and Baal-names.
  - >-
    The capture is credited to Shalmaneser V in 2 Kgs 17 but claimed by Sargon II in his inscriptions.
    Leave detail to fall-of-samaria. Herod rebuilt the city as Sebaste with a temple to Augustus.
  sources_to_check:
