editorial:
  author_notes:
  - >-
    Offering first produce and firstlings to the gods is widespread in the ancient Near East
    and the Mediterranean, so the practice itself is unremarkable.
  - >-
    Whether Exod 22:29 once required the sacrifice of firstborn sons is debated (J. D. Levenson,
    The Death and Resurrection of the Beloved Son, 1993; versus readings that assume redemption
    was always intended). Present this neutrally and connect it to Ezek 20:25-26.
  - >-
    Deut 26:5-9 was von Rad's 'small historical credo'. Note that its early dating has been
    widely abandoned.
