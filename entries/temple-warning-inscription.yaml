id: temple-warning-inscription
title: Temple Warning Inscription
aliases: [Soreg inscription]
type: artifact
cultures: [jewish, greek]
date:
  from: -20
  to: 70
  circa: true
  display: c. 20 BCE–70 CE
scope: >-
  Greek inscriptions from the balustrade (soreg) around the inner courts of Herod's temple,
  warning that any foreigner who passed it would be responsible for his own death. One complete
  copy (found 1871) and one fragmentary copy (found 1935) survive.
passages:
- ref: Acts 21:27-30
  rel: practice
  note: Paul accused of bringing Greeks into the temple and defiling it
- ref: Acts 24:6
  rel: practice
  note: Charge of attempting to profane the temple
- ref: Eph 2:14
  rel: imagery
  disputed: true
  note: '''Dividing wall of hostility'' possibly alluding to the balustrade'
- ref: Ezek 44:9
  rel: concept
  note: No foreigner uncircumcised in heart and flesh shall enter the sanctuary
- ref: Lam 1:10
  rel: concept
  note: Nations forbidden to enter the congregation
- ref: Mark 11:17
  rel: concept
  note: '''House of prayer for all the nations'', spoken in the court open to Gentiles'
related: [herods-temple, temple-mount, josephus, purity-and-impurity, trumpeting-place-inscription,
  jerusalem]
location:
  institution: >-
    Istanbul Archaeology Museums (complete copy); Israel Museum, Jerusalem (fragmentary copy)
  accession: null
media:
