editorial:
  author_notes:
  - >-
    Give the text and compare Josephus (War 5.193-194; 6.124-126; Ant. 15.417) and Philo (Legat.
    212). Josephus says such notices were in Greek and Latin.
  - >-
    Debate: whether the warning implies Jewish capital jurisdiction (cf. John 18:31) or lynching/divine
    penalty.
  - >-
    The Eph 2:14 link is popular but uncertain. The metaphor need not refer to the physical
    balustrade, and Ephesians' date and authorship bear on it.
  sources_to_check:
  - OGIS 598
  - 'Corpus Inscriptionum Iudaeae/Palaestinae, vol. 1: Jerusalem (2010-2012)'
