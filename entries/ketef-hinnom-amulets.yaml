editorial:
  author_notes:
  - >-
    The 2004 re-edition (Barkay, Vaughn, Lundberg and Zuckerman) with new imaging supports
    a late 7th to early 6th century date on palaeographic and archaeological grounds. A minority
    has argued for a later (Persian or Hellenistic) date. Report this fairly.
  - >-
    Do not present the amulets as 'the oldest biblical text' or as evidence that Numbers was
    already written. They show that a blessing formula also found in Numbers circulated in
    apotropaic use.
  - >-
    Discuss the apotropaic phrases (e.g. 'the rebuker of evil') and how the blessing worked
    as protection for the dead or the living.
