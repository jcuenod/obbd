id: ketef-hinnom-amulets
title: Ketef Hinnom Silver Amulets
aliases: [Ketef Hinnom scrolls, Silver Scrolls]
type: artifact
cultures: [judahite]
date:
  from: -625
  to: -575
  circa: true
  display: c. 625–575 BCE
scope: >-
  Two tiny rolled silver amulets found in 1979 in a repository of a bench tomb at Ketef Hinnom,
  Jerusalem, inscribed with forms of the Priestly Blessing and other protective formulas.
  They are the earliest known artefacts with text that parallels a biblical passage.
passages:
- ref: Num 6:24-26
  rel: parallel
  note: Shortened forms of the Priestly Blessing
- ref: Deut 7:9
  rel: parallel
  note: God who keeps covenant and steadfast love with those who love him
- ref: Neh 1:5
  rel: parallel
  note: The same covenant-keeping formula in prayer
- ref: Dan 9:4
  rel: parallel
  note: The same covenant-keeping formula in prayer
- ref: Ps 67:1
  rel: parallel
  note: 'Liturgical echo of the blessing: face shining upon us (MT 67:2)'
- ref: Prov 6:21
  rel: practice
  note: Binding protective words around the neck
- ref: Deut 6:8
  rel: practice
  note: Words bound on the body as a sign
