id: nazareth-inscription
title: Nazareth Inscription
type: artifact
cultures: [roman, greek]
date:
  from: -50
  to: 54
  circa: true
  display: c. 50 BCE–54 CE
scope: >-
  A marble slab with a Greek 'ordinance of Caesar' that prescribes capital punishment for
  violating tombs or moving bodies. It entered the Froehner collection in 1878 with a note
  that it had been sent from Nazareth. Its provenance, date, and emperor are uncertain.
passages:
- ref: Matt 28:11-15
  rel: practice
  disputed: true
  note: Charge that the disciples stole Jesus' body; a link to the edict has been proposed
- ref: Matt 27:62-66
  rel: practice
  note: Sealing and guarding a tomb against theft of the body
- ref: John 20:2, 13-15
  rel: practice
  note: Concern that the body has been removed from the tomb
related: [ossuaries, forgeries-in-biblical-archaeology, bench-tombs, care-for-the-dead]
location:
  institution: Cabinet des Médailles, Bibliothèque nationale de France, Paris
  accession: null
