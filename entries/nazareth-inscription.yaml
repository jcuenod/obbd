editorial:
  author_notes:
  - >-
    The note 'sent from Nazareth' does not establish the findspot. A 2020 isotopic study pointed
    to marble from Kos, which weakens any Galilean connection.
  - >-
    The emperor is unnamed. Linking it to Claudius and a reaction to Christian resurrection
    claims is speculative and not mainstream.
  - Discuss it primarily as evidence for Greco-Roman concern with tomb violation.
  sources_to_check:
