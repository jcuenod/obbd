editorial:
  author_notes:
  - >-
    The censuses in the Res Gestae (28 BCE, 8 BCE, 14 CE) are of Roman citizens, not provincial
    registrations. Do not equate them with Luke's census.
  - >-
    Note 'son of the divine' (divi filius) in imperial titulature as background for NT 'Son
    of God' language. Avoid a one-sided derivation.
  - A comparison with Near Eastern royal res gestae (e.g. Behistun) is apt for the genre.
