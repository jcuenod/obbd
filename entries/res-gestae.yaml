scope: >-
  Augustus's first-person account of his achievements, completed by 14 CE and inscribed at
  his mausoleum in Rome. It survives through provincial copies, chiefly the Monumentum Ancyranum
  (Latin and Greek) at Ankara and fragments from Apollonia and Antioch in Pisidia.
