editorial:
  author_notes:
  - >-
    Israel's sacrificial terminology and types (whole burnt offering, well-being/communion
    offering) correspond more closely to West Semitic practice (Ugaritic šrp and šlmm; Punic
    kll, šlm kll) than to Mesopotamia. There, sacrifice was mainly a divine meal, and burnt
    offerings were rare.
  - >-
    Present theories of sacrifice (gift, communion, substitution, purification; Robertson
    Smith, Hubert and Mauss, Girard) as interpretive models. The biblical texts do not offer
    a single theory.
  - >-
    The prophetic critique (Amos 5; Hos 6; Isa 1; Mic 6; Jer 7) is mostly read today as rhetoric
    of priority, not as rejection of sacrifice as such. Note the debate.
  - >-
    Use the terminology carefully. ḥaṭṭāʾt is now often rendered "purification offering",
    ʾāšām "reparation offering", and šĕlāmîm "well-being" or "communion" offering.
