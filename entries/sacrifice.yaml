title: Sacrifice in the Ancient Near East
type: practice
cultures: [ane]
scope: >-
  Animal, grain, and liquid offerings across the ancient Near East: types, terminology, procedures,
  distribution of portions, and theories of meaning. The entry places Israel's sacrificial
  system (Lev 1-7 and elsewhere) and its prophetic critique within the West Semitic and wider
  ancient Near Eastern context.
