editorial:
  author_notes:
  - >-
    Distinguish šuilla (incantation-prayers recited by the āšipu within rituals), eršaḫunga
    (penitential, Sumerian with Akkadian glosses), dingiršadabba, and the communal balag/eršemma
    laments.
  - >-
    Classic comparative study: Widengren (1937); see also Mayer (1976) on the form of the
    'Gebetsbeschwörungen' and Lenzi (ed. 2011) for an introduction with translations.
  - >-
    Key differences: Mesopotamian prayers are embedded in ritual and magic, address many deities,
    and rely on the personal god's intercession; motifs such as unknown sin and 'how long?'
    are shared.
  - >-
    The 'Prayer of Lamentation to Ishtar' (ANET 383-385) is the most-quoted example and can
    anchor the article.
  sources_to_check:
  - ANET 383-385
  - 'A. Lenzi (ed.), Reading Akkadian Prayers and Hymns: An Introduction (2011)'
  - >-
    G. Widengren, The Accadian and Hebrew Psalms of Lamentation as Religious Documents (1937)
  - >-
    W. Mayer, Untersuchungen zur Formensprache der babylonischen 'Gebetsbeschwörungen' (1976)
