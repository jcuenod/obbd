id: mesopotamian-lament-prayers
title: Mesopotamian Prayers of Lament (šuilla, eršaḫunga)
aliases: [Šuila prayers, Prayers of the lifted hand, Eršaḫunga, Penitential psalms (Mesopotamian)]
type: text
cultures: [babylonian, assyrian, sumerian]
scope: >-
  Individual prayers of complaint, petition, and penitence from Mesopotamia, above all the
  Akkadian šuilla ("raising of the hand") incantation-prayers and the bilingual eršaḫunga
  ("lament to appease the heart"). They are the main comparative corpus for the biblical individual
  and penitential laments.
