editorial:
  author_notes:
  - >-
    The colophon credits Kabti-ilani-Marduk, who claims the poem was revealed to him in a
    night vision. The date is debated: proposals range from the 11th to the 8th century (Lambert
    favoured the 8th). Copies are mostly 1st-millennium. Present the range.
  - >-
    Bodi (1991) argued that Ezekiel knew and adapted the poem (Ezek 7, 9, 21, and the departure
    of the deity). The thematic parallels are widely acknowledged, but direct dependence is
    debated. Treat it as a proposal.
  - >-
    Explain the poem's theology. Marduk's absence from his throne, not his destruction, lets
    chaos loose, and an intercessor (Išum) limits divine wrath. Both points bear on Ezekiel
    and on the divine-abandonment motif.
  - >-
    Check the line numbers for the 'righteous and unrighteous' passage (Tablet IV) against
    Cagni's edition before quoting it.
  sources_to_check:
