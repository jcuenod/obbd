title: Erra and Išum
aliases: [Erra Epic, Poem of Erra, Erra and Ishum]
type: text
cultures: [babylonian]
date:
  from: -1100
  to: -700
  circa: true
  display: c. 1100–700 BCE
scope: >-
  An Akkadian poem in five tablets in which the plague and war god Erra persuades Marduk to
  leave his throne, then devastates Babylon and other cities without distinguishing the righteous
  from the wicked until his vizier Išum calms him. The poem explains a period of Babylonian
  disorder as divine anger, and copies were used as amulets against plague.
