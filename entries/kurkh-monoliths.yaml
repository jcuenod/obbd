scope: >-
  Two Assyrian stelae found at Kurkh (Üçtepe) in southeastern Turkey, of Ashurnasirpal II
  and Shalmaneser III. The Shalmaneser Monolith gives the earliest account of the battle of
  Qarqar (853 BCE), naming 'Ahab the Israelite' with 2,000 chariots and 10,000 soldiers in
  a coalition of western states.
