editorial:
  author_notes:
  - >-
    Discovered in 1861 by J. E. Taylor, British consul at Diyarbakır. The Shalmaneser text
    dates to c. 852 BCE, shortly after the battle.
  - >-
    The coalition was led by Adad-idri (Hadadezer) of Damascus and Irhuleni of Hamath; the
    relationship of Hadadezer to the biblical Ben-hadad of 1 Kgs 20 is debated.
  - >-
    The 2,000 chariots credited to Ahab exceed every other contingent; some propose a scribal
    error (e.g. 200), others accept the figure. Present both views.
  - >-
    The text also contains the first datable mention of Arabs (Gindibu with 1,000 camels).
    The engraving is careless and the text has many errors.
