editorial:
  author_notes:
  - >-
    Dating ranges from the 15th to the 13th century BCE in the literature; give a range and
    explain the basis. Verify the Louvre inventory number (commonly given as AO 15775).
  - >-
    The wavy lines beneath the god's feet are often read as mountains and/or sea; present
    as interpretation.
  - >-
    The spear-shaft as lightning-and-vegetation links storm and fertility; useful for explaining
    why Baal's rain is at stake in 1 Kgs 17-18.
  - >-
    Connect to the Egyptian and Levantine "smiting god" figurine type, and to Hadad iconography
    further north.
