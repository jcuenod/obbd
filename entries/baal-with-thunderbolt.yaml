scope: >-
  A limestone relief stele found in 1932 near the Temple of Baal at Ugarit, showing the storm
  god striding in the smiting pose, brandishing a club and holding a spear or lightning-shaft
  that sprouts vegetation, with a small figure (probably the king) beneath his arm.
