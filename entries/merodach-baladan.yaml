scope: >-
  Chaldean chieftain of Bit-Yakin who ruled Babylon in defiance of Assyria from 722 to 710
  and again briefly in 703. His embassy to Hezekiah is narrated in Kings and Isaiah.
passages:
- ref: 2Kgs 20:12-19
  rel: event
  note: Babylonian envoys visit Hezekiah, who shows them his treasures
- ref: Isa 39:1-8
  rel: event
  note: Parallel account; Isaiah predicts exile to Babylon
- ref: 2Chr 32:31
  rel: event
  note: Envoys of Babylon's officials inquire about the sign
related: [hezekiah, sargon-ii, sennacherib, babylonia, kudurru, sennacherib-campaign-701]
