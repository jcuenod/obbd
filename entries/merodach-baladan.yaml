editorial:
  author_notes:
  - >-
    Reigned 722-710, expelled by Sargon II, and returned for about nine months in 703 before
    Sennacherib drove him out; the embassy likely aimed to build an anti-Assyrian coalition
    before 701 (or c. 714-711).
  - >-
    2 Kgs 20:12 reads Berodach-baladan; Isa 39:1 has Merodach-baladan, closer to the Akkadian.
  - Isaiah's prophecy of Babylonian exile is widely regarded as shaped by later events.
