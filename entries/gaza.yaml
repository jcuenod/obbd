editorial:
  author_notes:
  - >-
    The ancient tell (Tell Harube / Tell ʿAzza) lies under the modern city and has seen very
    little excavation, so the article should stress textual sources.
  - >-
    Gaza was the Egyptian New Kingdom administrative base on the Way of Horus, often identified
    with 'the city of Canaan' (pꜣ Knʿn) in Egyptian texts. Hanunu of Gaza fled to Egypt before
    Tiglath-pileser III in 734.
  - >-
    It was the terminus of the Arabian incense trade (Herodotus' Kadytis) and resisted Alexander's
    siege in 332 BCE.
  - >-
    Sites in the Gaza Strip (Anthedon, Tell es-Sakan, Tell el-ʿAjjul) are distinct from Gaza
    proper. Note recent damage to heritage neutrally. Supply an image when a suitable licensed
    photo is found.
