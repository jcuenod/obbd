editorial:
  author_notes:
  - >-
    Ussishkin and Woodhead (1990-96) excavated a large rectangular enclosure with casemate
    walls, corner towers and a rock-cut moat. It was short-lived and of the ninth century.
    Its pottery is a fixed point for the low chronology debate, since it matches strata elsewhere
    once dated to Solomon.
  - >-
    The destruction of the enclosure has been linked to Hazael or to Jehu's coup. Both are
    inferences.
  - >-
    The renewed Jezreel Expedition (from 2013) documented rock-cut wine presses and agricultural
    installations near the tell. Any link to Naboth's vineyard is evocative, not evidential.
  - Its function as a military or chariot base for the Omrides is a hypothesis.
