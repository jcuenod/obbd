editorial:
  author_notes:
  - >-
    The chapter combines a Priestly framework ('these are the descendants of…') with non-Priestly
    material (e.g. 10:8-19, 21, 24-30). It contains duplicates such as Havilah and Sheba.
  - >-
    Its horizon (Cimmerians, Medes, Ionians, Togarmah) fits the Neo-Assyrian and Neo-Babylonian
    world of the 8th to 6th centuries.
  - >-
    Kinship here expresses geography, political relations and sometimes language, not 'race'.
    Address and correct racialized readings of Ham and the 'curse of Ham' (Gen 9:25 curses
    Canaan).
  - >-
    The tradition of seventy nations links to Deut 32:8 and later Jewish and Christian reception.
