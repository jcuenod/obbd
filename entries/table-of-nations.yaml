id: table-of-nations
title: Table of Nations
aliases: [Generations of Noah]
type: concept
cultures: [ane]
scope: >-
  Genesis 10 (with 1 Chr 1), the genealogical map of the world's peoples descended from Shem,
  Ham and Japheth. The entry covers its sources, its geographical and political horizon, the
  identification of the names, and its function.
passages:
- ref: Gen 10:1-32
  rel: concept
  note: Segmented genealogy of the nations after the flood
- ref: Gen 10:2-5
  rel: setting
  note: 'Japheth: Gomer (Cimmerians), Madai (Medes), Javan (Ionians), Tubal, Meshech'
- ref: Gen 10:6-20
  rel: setting
  note: 'Ham: Cush, Egypt, Put, Canaan; includes the Nimrod notice'
- ref: Gen 10:21-31
  rel: setting
  note: 'Shem: Elam, Asshur, Arpachshad, Lud, Aram and Arabian groups'
- ref: 1Chr 1:1-23
  rel: concept
  note: Chronicler's adaptation
- ref: Deut 32:8
  rel: concept
  note: Nations divided according to the number of the sons of God (LXX, 4QDeutʲ)
- ref: Ezek 27:10-24
  rel: setting
  note: Tyre's trading partners share many of the same names
- ref: Ezek 38:2-6
  rel: setting
  note: Gog of Magog with Meshech, Tubal, Gomer and Beth-togarmah
- ref: Isa 66:19
  rel: setting
  note: Tarshish, Pul (read Put with LXX), Lud, Tubal and Javan as distant nations
related: [genealogies, ziggurat-and-babel, nimrod, cush, medes, tarshish, 4qdeut-j, sons-of-god]
