editorial:
  author_notes:
  - >-
    Distinguish Jewish meals, Greek symposia, Roman convivia, and association gatherings by
    period, region, and social level. Do not infer that every communal meal had the same layout
    or ritual meaning.
  - >-
    The Anaploga villa at Corinth is a proposed architectural comparison, not an identified
    Pauline meeting house.
  - >-
    P.Oxy. I 110 is later (second-century CE) Egyptian evidence for a cult meal. It asks its
    recipient to dine at the klinē ('couch') of Sarapis, whereas Paul uses trapeza ('table')
    in 1 Cor 10:21, so the two texts do not share a table formula. It identifies no guild
    or Corinthian event, and it does not make every private meal in 1 Cor 10:27-28 a sanctuary
    meal.
  - >-
    Corinth already discusses sanctuary dining and unequal consumption in 1 Corinthians; Marzeaḥ
    is a specific West Semitic feasting association. Cross-reference both without repeating
    them.
  - >-
    Related background reading (a broader or neighbouring subject, so not linked as this entry's
    Wikipedia/Wikidata identity): Wikipedia, "Symposium".
  sources_to_check:
  - Pliny the Younger, Epistulae 2.6
  - P.Mich. V 245 = GRA III 219 = AGRW 302 (Ann Arbor inv. 657)
  - IG II² 1368 = LSCG 51 = GRA 51 = AGRW 7
  - P.Oxy. I 110, lines 1-4 (HGV/TM 28404; Eton College ECM 2314)
  - >-
    Metropolitan Museum of Art survey of Roman domestic dining rooms, furnishings, and tableware
  image_query: Roman banquet fresco Pompeii triclinium
