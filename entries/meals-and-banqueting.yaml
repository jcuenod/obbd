id: meals-and-banqueting
title: Meals, Banquets, and Dining Status
type: practice
cultures: [jewish, greek, roman]
scope: >-
  Jewish and Greco-Roman meals expressed social relationships through invitations, reclining
  arrangements, service, food distribution, and the religious settings of communal eating.
  The entry is a comparative hub for the social organization of meals; food production and
  diet belong to Bread, Ovens, and Diet.
passages:
- ref: Luke 14:7-14
  rel: practice
  note: >-
    Seating rank, invitations, and expected repayment make dining a setting for negotiating
    status
- ref: John 13:1-30
  rel: realia
  note: >-
    Reclining positions and footwashing clarify the meal's physical setting and acts of service
- ref: 1Cor 8:7-13
  rel: practice
  note: Eating in a deity's sanctuary connects communal dining with participation in cult
- ref: 1Cor 10:14-33
  rel: practice
  note: >-
    Sacrificial meals, marketplace purchases, and private invitations present distinct dining
    situations
- ref: 1Cor 11:17-34
  rel: practice
  note: >-
    Unequal consumption and status distinctions at shared meals provide background for Paul's
    criticism
- ref: Gal 2:11-14
  rel: practice
  note: Shared eating and withdrawal from it publicly express community boundaries
