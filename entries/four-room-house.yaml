editorial:
  author_notes:
  - >-
    Describe the plan. A broad room at the back faced three long spaces divided by pillars.
    The ground floor was used for animals, storage, and work, and there was probably an upper
    storey for living and sleeping.
  - >-
    Stager (BASOR 260, 1985) linked the house to the extended family (bêt ʾāb). Faust argued
    it expressed an egalitarian ethos. Both are influential but debated.
  - >-
    The house as an 'Israelite' ethnic marker is contested. Pillared houses also occur in
    Transjordan and elsewhere, and their antecedents are debated.
  - >-
    Judg 11:31 is often read in light of animals housed inside. The reading is possible but
    not certain.
  sources_to_check:
  - King and Stager, Life in Biblical Israel (2001)
