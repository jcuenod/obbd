editorial:
  author_notes:
  - >-
    The pe-ʿayin order also appears in other abecedaries (e.g. Kuntillet ʿAjrud) and in Lam
    2-4. This makes it an early alternative letter order, not a scribal error.
  - >-
    The script is transitional Proto-Canaanite. Its language and ethnic attribution are uncertain,
    so do not label it 'Israelite'.
  - >-
    The ostracon looks like a student exercise. Use it carefully in literacy debates: it shows
    that someone was learning, not that literacy was widespread.
