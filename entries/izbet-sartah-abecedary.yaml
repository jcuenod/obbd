id: izbet-sartah-abecedary
title: ʿIzbet Ṣarṭah Abecedary
aliases: [ʿIzbet Ṣarṭah Ostracon]
type: artifact
cultures: [canaanite, hebrew]
date:
  from: -1200
  to: -1000
  circa: true
  display: c. 1200–1000 BCE
scope: >-
  An Iron Age I ostracon from ʿIzbet Ṣarṭah near Rosh HaʿAyin (found 1976) with four lines
  of practice letters and a full abecedary. It is a key witness to the early alphabet and
  its letter order, and to writing in a small highland village.
passages:
- ref: Lam 2:16-17; 3:46-51; 4:16-17
  rel: form
  note: Acrostics with pe before ʿayin, the order of the abecedary
- ref: Ps 119
  rel: form
  note: Alphabetic acrostic presupposing a fixed letter order
- ref: Prov 31:10-31
  rel: form
  note: Alphabetic acrostic
- ref: Judg 8:14
  rel: practice
  note: A young man writes down names, implying basic literacy
- ref: Isa 28:9-10
  rel: practice
  disputed: true
  note: ṣaw lāṣāw qaw lāqāw, perhaps letters recited in alphabet teaching
- ref: 1Sam 4:1
  rel: setting
  disputed: true
  note: Site sometimes identified with Ebenezer
