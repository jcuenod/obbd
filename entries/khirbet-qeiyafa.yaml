editorial:
  author_notes:
  - >-
    Excavated by Garfinkel and Ganor (2007-13). It is essentially a single-period site, with
    radiocarbon dates of c. 1020-980 BCE. A casemate wall with houses built into it and two
    gates are its defining features.
  - >-
    Who built it is debated. Proposals include early Judah or David (excavators), a Saulide
    or northern polity (Finkelstein, Na'aman), and Philistine or Canaanite groups. The absence
    of pig bones and the cult objects are used on several sides.
  - >-
    The Shaaraim identification is attractive but not certain, and other identifications have
    been proposed.
  - >-
    The ostracon's language (Hebrew vs. a generic Canaanite) and content are contested. Several
    incompatible readings exist, so avoid calling it the 'earliest Hebrew inscription' without
    qualification.
  sources_to_check:
