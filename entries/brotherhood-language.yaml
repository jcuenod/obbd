id: brotherhood-language
title: '"Brother" Language in Diplomacy'
aliases: [Brotherhood in diplomacy]
type: concept
cultures: [ane, egyptian, hittite]
scope: >-
  The use of 'brother' and 'brotherhood' to express parity relationships between rulers in
  ancient Near Eastern diplomacy (as opposed to father–son or lord–servant language for unequal
  partners), and its echoes in biblical narrative and prophecy.
passages:
- ref: 1Kgs 9:13
  rel: language
  note: Hiram addresses Solomon as 'my brother'
- ref: 1Kgs 20:32-33
  rel: language
  note: '''Is he still alive? He is my brother'': Ahab and Ben-hadad'
- ref: Amos 1:9
  rel: language
  note: Tyre 'did not remember the covenant of brothers' (bĕrît ʾaḥîm)
- ref: Amos 1:11
  rel: language
  disputed: true
  note: 'Edom pursued his brother: treaty or kinship sense debated'
- ref: Num 20:14
  rel: language
  note: '''Thus says your brother Israel'' to the king of Edom'
- ref: Obad 10-12
  rel: language
  note: Violence done to 'your brother Jacob'
- ref: 1Macc 12:21
  rel: language
  note: Spartans and Jews claimed as brothers of Abraham's family
related: [amarna-letters, egyptian-hittite-peace-treaty, covenant-love-language, hiram-of-tyre,
  diplomatic-gift-exchange, covenant-and-treaty-form, edomites]
