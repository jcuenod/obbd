  role: primary
external: {}
editorial:
  author_notes:
  - >-
    In the Amarna letters, 'great kings' call one another 'brother', while vassals address
    the pharaoh as 'my lord' and 'my father'. The Egyptian–Hittite treaty speaks of 'good
    peace and good brotherhood'.
  - >-
    For Amos 1:9, the consensus refers bĕrît ʾaḥîm to a treaty, possibly the Tyre–Israel alliance.
    For Amos 1:11 and Edom, kinship (Jacob–Esau) is the more likely sense.
  - >-
    Distinguish diplomatic brotherhood from the kinship ideology of Israel and Edom in Genesis
    and Deuteronomy (Deut 2:4; 23:7).
