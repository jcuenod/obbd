title: Maccabean Revolt
type: event
cultures: [jewish, greek]
date:
  from: -167
  to: -160
  display: 167–160 BCE
scope: >-
  The Judean uprising against Seleucid rule and Antiochus IV's religious measures, led by
  Mattathias and his sons. It saw the temple rededicated in 164 BCE and led ultimately to
  Hasmonean independence. The entry covers the period to Judas's death in 160 BCE and the
  sources that narrate it.
