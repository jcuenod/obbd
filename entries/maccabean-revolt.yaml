editorial:
  author_notes:
  - >-
    Compare the sources: 1 Maccabees (pro-Hasmonean dynastic history), 2 Maccabees (epitome
    of Jason of Cyrene; temple and martyr focus), Daniel, and Josephus (Ant. 12-13).
  - >-
    Note the problems of Seleucid-era chronology between 1 and 2 Maccabees, and the identity
    of the Hasideans (1 Macc 2:42; 7:13).
  - >-
    Archaeology: the possible identification of the Seleucid Akra (Givati excavations, 2015)
    is debated.
