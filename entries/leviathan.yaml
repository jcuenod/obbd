editorial:
  author_notes:
  - >-
    The Isa 27:1 / KTU 1.5 I 1-3 correspondence is among the closest verbal parallels between
    Ugaritic and Hebrew; Ugaritic ltn is now usually vocalized Litan (not Lotan).
  - >-
    Seven-headed dragons appear in Mesopotamian art from the third millennium (e.g. Tell Asmar
    seal); this and Ps 74's plural "heads" bear on Rev 12-13.
  - >-
    Whether Job 41 describes a mythic creature or a crocodile is debated; the trend is toward
    a mythic reading informed by Egyptian royal hunt imagery.
  - >-
    Ps 104:26 may domesticate the monster as a creature YHWH plays with; note the ambiguity
    of "to play with it".
  sources_to_check:
  - KTU 1.3 III; 1.5 I
  - J. Day, God's Conflict with the Dragon and the Sea (1985)
  - DDD, s.v. "Leviathan"
