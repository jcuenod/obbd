id: leviathan
title: Leviathan
aliases: [Litan, Lotan, Liwyatan]
type: deity
cultures: [ugaritic, hebrew, jewish]
scope: >-
  Leviathan, the multi-headed sea serpent defeated or tamed by YHWH, cognate with Ugaritic
  Litan, the "fleeing, twisting serpent with seven heads" defeated by Baal and Anat. The entry
  traces the figure from Ugarit through the Hebrew Bible to apocalyptic literature.
passages:
- ref: Isa 27:1
  rel: parallel
  note: Leviathan the fleeing, twisting serpent; nearly verbatim with KTU 1.5 I 1-3
- ref: Ps 74:14
  rel: imagery
  note: YHWH crushes the heads of Leviathan
- ref: Job 3:8
  rel: imagery
  note: Those skilled to rouse Leviathan, invoked to curse a day
- ref: Job 41:1-34
  rel: imagery
  note: Leviathan as untameable creature, king over the proud (MT 40:25-41:26)
- ref: Ps 104:26
  rel: polemic
  disputed: true
  note: Leviathan formed to play in the sea
- ref: 1En 60:7-9
  rel: concept
  note: Leviathan, female, in the depths of the sea; Behemoth on land
- ref: 2Esd 6:49-52
  rel: concept
  note: Behemoth and Leviathan created and kept as food (4 Ezra)
- ref: Rev 12:3; 13:1
  rel: imagery
  note: Seven-headed dragon and beast from the sea
related: [baal-cycle, chaoskampf, tannin, rahab-sea-monster, behemoth, yam, first-enoch]
