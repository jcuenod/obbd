editorial:
  author_notes:
  - >-
    Explain the accession crisis of 522 (Behistun) and its relevance to the date-formulas
    of Haggai and Zechariah (520-518 BCE).
  - >-
    Temple completion in Adar of year 6 (515 BCE, Ezra 6:15) is the traditional date. Some
    scholars (e.g. Edelman) argue for a later completion.
  - >-
    Explain that Ezra 4:6-23 (Xerxes, Artaxerxes) is placed out of chronological order before
    the resumption under Darius.
  - >-
    Distinguish Darius I from Darius II (Elephantine documents) and from 'Darius the Persian'
    in Neh 12:22.
