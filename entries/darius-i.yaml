id: darius-i
title: Darius I
aliases: [Darius the Great]
type: person
cultures: [persian]
date:
  from: -522
  to: -486
  display: 522–486 BCE
scope: >-
  Darius I, Achaemenid king who seized the throne in 522 BCE, suppressed widespread revolts,
  and reorganized the empire (satrapies, coinage, royal road, Persepolis). The rebuilding
  of the Jerusalem temple (Haggai, Zechariah, Ezra 5-6) is dated to his reign.
passages:
- ref: Ezra 4:5, 24
  rel: attests
  note: Temple work halted until Darius's second year
- ref: Ezra 5:1-6:15
  rel: event
  note: Temple rebuilding, Tattenai's inquiry, completion in Darius's sixth year
- ref: Ezra 6:6-12
  rel: event
  note: Darius's decree confirming Cyrus's authorization
- ref: Hag 1:1, 15; 2:10
  rel: attests
  note: Haggai's oracles dated by Darius's second year
- ref: Zech 1:1, 7; 7:1
  rel: attests
  note: Zechariah's oracles dated by Darius's reign
- ref: Dan 6:1
  rel: language
  disputed: true
  note: 120 satraps under 'Darius the Mede' may echo Darius I's satrapy system (MT 6:2)
related: [behistun-inscription, persepolis, persepolis-fortification-tablets, tattenai-tablet,
  susa, persia, udjahorresnet-statue, darius-the-mede]
media:
