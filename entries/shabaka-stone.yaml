id: shabaka-stone
title: Shabaka Stone (Memphite Theology)
aliases: [Memphite Theology]
type: artifact
cultures: [egyptian, nubian]
date:
  from: -716
  to: -702
  circa: true
  display: c. 716–702 BCE
scope: >-
  A basalt slab inscribed under the Kushite king Shabaka. It claims to copy a worm-eaten ancient
  document, and it preserves the "Memphite Theology", in which Ptah creates the gods and all
  things through his heart (thought) and tongue (command). It is a standard comparandum for
  creation by divine word.
passages:
- ref: Gen 1:3-31
  rel: concept
  note: Creation by divine utterance ('And God said... and it was so')
- ref: Ps 33:6-9
  rel: concept
  note: By the word of the LORD the heavens were made; he spoke and it came to be
- ref: Ps 148:5
  rel: concept
  note: He commanded and they were created
- ref: Gen 2:1-3
  rel: parallel
  disputed: true
  note: Ptah 'rested/was satisfied' (ḥtp) after making all things
- ref: John 1:1-3
  rel: concept
  disputed: true
  note: Creative word (logos) as agent of creation
related: [egyptian-cosmology, creation-accounts, divine-rest, cush, memphis]
