editorial:
  author_notes:
  - >-
    The date of composition is debated. Older scholarship (Breasted, Sethe) took the text
    as Old Kingdom. Most now consider it a Twenty-fifth Dynasty archaising composition (Junge),
    though some argue for a Ramesside date.
  - >-
    Creation through authoritative utterance (Hu) and perception (Sia) is older in Egypt (e.g.,
    the Coffin Texts), so the motif does not depend on dating this text early.
  - >-
    Treat the Gen 2:2 "rest" parallel cautiously. It depends on translating ḥtp as "rest"
    rather than "be satisfied".
  - >-
    The stone's centre is worn because it was later reused as a millstone, and much of the
    text is damaged.
