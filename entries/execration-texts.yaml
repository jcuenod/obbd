- ref: Josh 10:1
  rel: attests
  note: 'Jerusalem: ''Rushalimum'', with its rulers, is named in the texts'
- ref: Jer 19:10-11
  rel: practice
  note: Smashing a jar as a symbolic act enacting a city's destruction
- ref: Ps 2:9
  rel: imagery
  note: Nations dashed in pieces like a potter's vessel
- ref: Num 22:6
  rel: practice
  note: Commissioned ritual cursing of an enemy people
