editorial:
  author_notes:
  - >-
    Describe the main groups. Sethe published inscribed bowls in Berlin (1926). Posener published
    inscribed figurines from Saqqara, now in Brussels (1940); they are generally somewhat
    later. The Mirgissa deposit in Nubia preserves the full ritual context, including a human
    sacrifice.
  - >-
    The identification of Rushalimum with Jerusalem is widely accepted and makes this the
    earliest mention of the city. Other Levantine identifications (e.g., Ashkelon, Shechem)
    should be checked individually, as some readings are debated.
  - >-
    The ritual logic (breaking an inscribed object to break the enemy) illuminates prophetic
    sign-acts (Jer 19) and royal imagery (Ps 2:9). Do not overstate direct influence.
  sources_to_check:
