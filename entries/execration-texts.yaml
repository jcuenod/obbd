id: execration-texts
title: Egyptian Execration Texts
aliases: [Egyptian Execration Texts, Ächtungstexte]
type: text
cultures: [egyptian]
date:
  from: -1950
  to: -1750
  circa: true
  display: c. 1950–1750 BCE
scope: >-
  Middle Kingdom ritual texts cursing enemies of Egypt: foreign rulers and peoples in Nubia,
  Libya, and the Levant, along with rebellious Egyptians. They were written on pottery bowls
  and clay figurines of bound captives, which were then smashed or buried. They are a major
  source for Middle Bronze Age Levantine place names and Amorite personal names.
