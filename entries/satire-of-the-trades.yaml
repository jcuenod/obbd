editorial:
  author_notes:
  - >-
    The Ben Sira parallel is widely acknowledged. Whether it reflects direct knowledge of
    the Egyptian text (plausible in Ptolemaic Egypt-Judea contacts) or a shared scribal topos
    is debated.
  - >-
    Note the difference in tone. The Egyptian text is satirical and exaggerated, while Ben
    Sira acknowledges that artisans sustain the city (Sir 38:32-34).
  - >-
    The text is a key source for Egyptian scribal self-understanding and education. It is
    preserved mainly in New Kingdom copies (e.g., P. Sallier II and P. Anastasi VII) and many
    ostraca, and its text is often corrupt.
