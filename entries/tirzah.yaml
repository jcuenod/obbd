editorial:
  author_notes:
  - >-
    De Vaux excavated the site in 1946-60. The identification with Tell el-Farʿah (North),
    proposed by Albright, is widely accepted.
  - >-
    De Vaux linked an unfinished building phase to Omri's move to Samaria (1 Kgs 16:23-24).
    This interpretation and the dating of the Iron Age phases are debated in the light of
    the low chronology.
  - >-
    Iron Age houses (including four-room houses) and de Vaux's argument for growing social
    stratification in the eighth century are relevant to prophetic social critique. The site
    also has major Chalcolithic and Early Bronze remains.
