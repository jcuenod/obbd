editorial:
  author_notes:
  - >-
    'Magic' is a modern etic category. Avoid the old magic-versus-religion dichotomy (Frazer).
    In Mesopotamia the exorcist's craft (āšipūtu) was legitimate temple scholarship, and only
    harmful sorcery (kišpū) was condemned. In Egypt heka was a divine power used by priests,
    especially the lector priest.
  - >-
    Biblical texts reject practices mainly by agent and source (Deut 18) and approve comparable
    acts by prophets (Elisha; the bronze serpent, Num 21:8-9). Explain this logic instead
    of labelling Israelite religion as anti-magical.
  - >-
    Several Hebrew terms (kšp, ḥbr, lḥš, ʿnn, lāṭ/lahaṭ 'secret arts') have uncertain exact
    meanings. Give cautious glosses. The obscure kĕsātôt and mispāḥôt of Ezek 13:18 are debated.
  - >-
    The KJV rendering 'witch' in Exod 22:18 and its role in early modern witch trials is reception
    history. Do not let it shape the description of the ancient practice.
  - >-
    Include material evidence: the Ketef Hinnom amulets, Egyptian amulets and apotropaic wands,
    Mesopotamian figurines and incantation texts, and later Aramaic incantation bowls (as
    reception only).
  sources_to_check:
  - A. Jeffers, Magic and Divination in Ancient Palestine and Syria (SHANE 8, 1996)
  - R. Schmitt, Magie im Alten Testament (AOAT 313, 2004)
  - R. K. Ritner, The Mechanics of Ancient Egyptian Magical Practice (SAOC 54, 1993)
  - D. Schwemer, Abwehrzauber und Behexung (2007)
