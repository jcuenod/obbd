title: Magic, Sorcery, and Incantation
aliases: [magic, sorcery, incantation, witchcraft, kĕšāpîm]
type: practice
cultures: [ane, mesopotamian, egyptian, hebrew]
scope: >-
  A hub entry on ritual means of protecting, healing or harming by spells, objects and rites:
  Mesopotamian āšipūtu, Egyptian heka, Hittite ritual, the Hebrew vocabulary of sorcery and
  charming, healing and wonder-working accepted in biblical texts, and magic in the New Testament
  world. Witchcraft rituals (Maqlû), divination and the Egyptian loanword ḥarṭom have their
  own entries.
