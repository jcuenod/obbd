  wikidata: Q16834343
editorial:
  author_notes:
  - >-
    Found at Babylon in the early 19th c. and long held at East India House, London, before
    passing to the British Museum; verify the acquisition history.
  - >-
    The Dan 4:30 echo is of Nebuchadnezzar's building inscriptions generally; his inscriptions
    are pious, crediting Marduk, so Daniel's portrayal of arrogance reverses their tone.
  - >-
    No Nebuchadnezzar building inscription mentions Judah or Jerusalem; avoid implying otherwise.
  sources_to_check:
