id: east-india-house-inscription
title: East India House Inscription of Nebuchadnezzar II
type: artifact
cultures: [babylonian]
date:
  from: -600
  to: -562
  circa: true
  display: c. 600–562 BCE
scope: >-
  A large inscribed stone tablet of Nebuchadnezzar II from Babylon, in archaising script,
  praising Marduk and Nabu and recording the king's building works in Babylon: its temples,
  palaces, processional way, and double walls. It is a prime example of the royal building
  boasts echoed in Daniel.
passages:
- ref: Dan 4:30
  rel: parallel
  note: King's boast of 'great Babylon, which I have built' (MT 4:27)
- ref: Jer 51:58
  rel: realia
  note: Babylon's broad walls, whose construction the inscription describes
- ref: Isa 46:1
  rel: attests
  note: Bel (Marduk) and Nebo (Nabu), the gods the inscription praises
related: [nebuchadnezzar-ii, babylon, ishtar-gate, etemenanki, marduk, nabu, temple-building-accounts]
location:
  institution: British Museum, London
  accession: 1938,0520.1 (British Museum)
media:
