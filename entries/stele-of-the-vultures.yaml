date:
  from: -2450
  to: -2450
  circa: true
  display: c. 2450 BCE
scope: >-
  The fragmentary limestone victory stele of Eannatum of Lagash commemorating his defeat of
  Umma in a long-running border dispute. One face shows the god Ningirsu holding the enemy
  in a great battle-net; the other shows Eannatum's phalanx and vultures carrying off the
  dead. The inscription includes oaths sworn by Umma's ruler.
