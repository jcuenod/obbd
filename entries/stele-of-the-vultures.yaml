editorial:
  author_notes:
  - >-
    Fragments were recovered at Tello (Girsu) from 1881; the reconstruction and the order
    of the registers involve some uncertainty.
  - >-
    The net is a weapon of the gods by which oath-breakers are caught; this is the closest
    ANE analogue to Ezek 17:19-20, where net and broken oath appear together.
  - >-
    The Lagash-Umma border conflict is one of the earliest documented interstate disputes,
    with treaty-like oaths sworn by several gods.
  - >-
    Keep the comparison at the level of shared imagery; there is no route of literary transmission
    from a third-millennium Sumerian stele to Ezekiel.
