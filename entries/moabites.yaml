editorial:
  author_notes:
  - >-
    Moab appears in Ramesses II's Luxor reliefs. The Mesha Stele is the principal Moabite
    source, and Moabite kings appear as tributaries in Assyrian texts.
  - >-
    Routledge's work frames Moabite state formation. Key sites include Dhiban, Khirbat al-Mudayna,
    and Khirbat Ataruz (Ataroth), whose temple and cult objects relate to the Mesha Stele.
  - The Moabite language is very close to Hebrew.
  - >-
    Biblical attitudes range from polemic (Gen 19) and exclusion (Deut 23, used in Ezra-Nehemiah)
    to the positive portrait of Ruth. Discuss these without harmonizing.
  sources_to_check: ['Routledge, Moab in the Iron Age (2004)', 'Bienkowski, Early Edom and
      Moab (1992)']
