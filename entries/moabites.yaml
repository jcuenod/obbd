id: moabites
title: Moab and the Moabites
aliases: [Moab, Moabites]
type: people
cultures: [moabite]
scope: >-
  The Iron Age kingdom of Moab on the plateau east of the Dead Sea and its people. Covers
  Moabite sources (above all the Mesha Stele), state formation, religion and language, and
  Moab's varied portrayal in the Bible.
