id: lex-talionis
title: Lex Talionis
aliases: [Eye for an eye, Talion, Law of retaliation]
type: practice
cultures: [hebrew, akkadian]
scope: >-
  The principle that punishment for bodily injury or homicide should correspond in kind to
  the harm done ("life for life, eye for eye"), as formulated in the biblical law collections
  and in the Laws of Hammurabi. The entry covers its ancient Near Eastern background, its
  function within biblical law, and its reception in early Jewish and Christian interpretation.
passages:
- ref: Exod 21:23-25
  rel: practice
  note: Talion formula applied to injury of a pregnant woman in a brawl
- ref: Exod 21:22
  rel: parallel
  note: Fine for causing miscarriage; cf. LH §§209-214, MAL A §§50-52, HL §§17-18
- ref: Lev 24:17-22
  rel: practice
  note: Talion for homicide and injury, applied equally to alien and citizen
- ref: Deut 19:16-21
  rel: practice
  note: Malicious witness receives the penalty he sought; cf. LH §§1-3
- ref: Deut 24:16
  rel: polemic
  disputed: true
  note: Rejects vicarious punishment of children; contrast LH §§116, 210, 230
- ref: Judg 1:6-7
  rel: concept
  note: Adoni-bezek's mutilation framed as measure-for-measure retribution
- ref: Gen 9:6
  rel: concept
  note: Bloodshed requited by bloodshed, grounded in the divine image
- ref: Obad 15
  rel: concept
  note: '''As you have done, it shall be done to you'' as principle of divine judgment'
- ref: Matt 5:38-42
  rel: concept
