editorial:
  author_notes:
  - >-
    In Hammurabi (§§196-201) talion applies between social equals (awīlum); injuries to commoners
    and slaves are compensated in silver. Talion is thus class-stratified, not 'primitive'.
  - >-
    The older Laws of Ur-Nammu (§§18-22) already fix monetary compensation for bodily injury,
    which tells against the evolutionary scheme of 'talion first, composition later'.
  - >-
    Note the debate whether the biblical formula was applied literally or stated a principle
    of proportionality and a ceiling. Early sources (Josephus, Ant. 4.280; rabbinic Mekhilta
    and b. Bava Qamma 83b-84a) allow or require monetary substitution.
  - >-
    Exod 21:22-25 is textually and exegetically difficult (the LXX distinguishes a 'formed'
    from an 'unformed' fetus). Keep the miscarriage law distinct from the talion formula that
    follows.
