id: azekah
title: Azekah (Tel ʿAzeqa)
aliases: [Tel ʿAzeqa, Tell Zakariya]
type: site
cultures: [judahite, canaanite]
scope: >-
  Tel ʿAzeqa, a high mound on the north side of the Elah Valley in the Shephelah and a fortified
  town on Judah's western frontier. The entry covers its biblical references, the mention
  of Azekah in Lachish Letter 4, the Assyrian 'Azekah Inscription', and the finds of the Lautenschläger
  Azekah Expedition (from 2012).
