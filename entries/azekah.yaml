editorial:
  author_notes:
  - >-
    Bliss and Macalister excavated in 1898-99. The Lautenschläger Azekah Expedition (Tel Aviv
    University and Heidelberg, from 2012) has documented a Late Bronze Age destruction with
    human remains and Iron Age fortifications. Check the latest publications for the stratigraphy.
  - >-
    Lachish Letter 4 ends: 'we are watching for the signals of Lachish ... for we cannot see
    Azekah.' It is often read as meaning that Azekah had already fallen, consistent with Jer
    34:7, but it may describe only what was visible from the writer's post. Present both.
  - >-
    The Azekah Inscription (two joined British Museum fragments, K 6205 + 82-3-23,131) describes
    an Assyrian assault on Azekah, 'situated on a mountain ridge'. Na'aman's join and attribution
    to Sennacherib (701) are widely followed, but some scholars date it to Sargon II's campaign
    of 712. Do not present either as settled.
  - >-
    Azekah, Socoh and Khirbet Qeiyafa frame the Elah Valley. Link the geography of 1 Sam 17
    without claiming the story as history.
