id: verse-account-of-nabonidus
title: Verse Account of Nabonidus
type: text
cultures: [babylonian]
date:
  from: -538
  to: -538
  circa: true
  display: c. 538 BCE
scope: >-
  A Babylonian poem composed after Cyrus's conquest that denounces Nabonidus for impiety,
  his promotion of the moon god Sin, his absence at Tayma, and his neglect of Marduk's festival,
  while presenting Cyrus as restorer of proper cult. It shows that Belshazzar was entrusted
  with kingship.
passages:
- ref: Dan 5:1-2
  rel: attests
  note: Nabonidus 'entrusted the kingship' to his eldest son (Belshazzar) before going to
    Tayma
- ref: Dan 5:7, 16, 29
  rel: attests
  disputed: true
  note: '''Third ruler in the kingdom'' may reflect Belshazzar''s co-regency'
- ref: Dan 4:28-33
  rel: parallel
  disputed: true
  note: >-
    A Babylonian king estranged from his capital; Nabonidus tradition behind Dan 4 (MT 4:25-30)
- ref: Isa 45:1-7
  rel: concept
  note: Cyrus presented as the deity's chosen restorer
