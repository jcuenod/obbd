editorial:
  author_notes:
  - >-
    Pro-Persian propaganda by Babylonian (Marduk) priests; read alongside the Cyrus Cylinder.
    Its picture of Nabonidus as impious and deranged is polemical, not neutral history.
  - >-
    The Daniel 4 connection: 4QPrNab (Prayer of Nabonidus) attests a seven-year illness of
    Nabonidus at Tayma, which suggests that Dan 4 transfers a Nabonidus tradition to Nebuchadnezzar.
    This is widely held; details are debated.
  - >-
    'Entrusted the kingship' does not make Belshazzar formally king (New Year rites lapsed);
    relevant to Daniel's title 'king'.
  - >-
    The Wikipedia title is a redirect to a section of 'Cylinders of Nabonidus'; there is no
    standalone article.
