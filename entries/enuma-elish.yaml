  rel: language
  note: Hebrew tĕhôm cognate with Tiamat (tiāmtum, 'sea'), though not a deity in Genesis
- ref: Gen 1:6-8
  rel: concept
  note: Marduk splits Tiamat to make sky and earth, barring her waters; cf. the firmament
- ref: Gen 1:14-18
  rel: concept
