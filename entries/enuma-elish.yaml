title: Enuma Elish
aliases: [Babylonian Epic of Creation, When on High]
type: text
cultures: [babylonian]
date:
  from: -1400
  to: -1100
  circa: true
  display: c. 1400–1100 BCE
scope: >-
  The seven-tablet Babylonian epic of Marduk's victory over Tiamat (the primeval sea), his
  creation of the ordered cosmos from her body, the making of humans, and the building of
  Babylon. It was recited at the New Year (akītu) festival and is the classic text for the
  "chaos combat" background of biblical creation imagery.
