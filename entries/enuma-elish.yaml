editorial:
  author_notes:
  - >-
    Gunkel's Schöpfung und Chaos (1895) and the Babel-Bible controversy made Enuma Elish central
    to Genesis study; since Heidel (1951) and Lambert (1965) most scholars caution against
    reading Gen 1 as an adaptation of it. Lambert argued the sea-combat motif may be West
    Semitic in origin (cf. the Baal cycle and the Mari letter on Adad's weapons against the
    Sea).
  - >-
    Real points of contact: tĕhôm/tiāmtum (a shared Semitic word, not a borrowed divine name;
    Tsumura), the division of waters to form sky and earth, and the setting of celestial bodies.
    Combat-myth language is much stronger in the Psalms, Job, and Isaiah than in Gen 1.
  - >-
    Date of composition is debated (Old Babylonian, Kassite, or the reign of Nebuchadnezzar
    I, c. 1100, favoured by Lambert); almost all copies are first-millennium. An Assyrian
    version substitutes Ashur for Marduk.
  - >-
    Popular claims that the seven tablets mirror the seven days of Gen 1 should be treated
    as coincidence, not evidence.
  sources_to_check:
