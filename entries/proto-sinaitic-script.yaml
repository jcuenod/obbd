editorial:
  author_notes:
  - >-
    Explain the acrophonic principle (Egyptian signs given Semitic sound values: ʾalp, bayt,
    etc.) and Gardiner's 1916 decipherment of lbʿlt 'for Baalat'.
  - >-
    Dating is debated: Middle Kingdom (c. 1850-1800, Wadi el-Ḥol; Goldwasser's miners' theory)
    versus later Bronze Age dates for some Serabit texts.
  - >-
    Reject fringe claims that the Proto-Sinaitic texts are in Hebrew or mention Moses or the
    exodus.
  - >-
    The Bronze Age alphabet does not establish that Mosaic-era writing as narrated in Exodus
    is historical. Keep the Sinai passages as narrative setting only.
  sources_to_check:
  - Hamilton, The Origins of the West Semitic Alphabet in Egyptian Scripts (2006)
  - Darnell et al., AASOR 59 (2005)
  - >-
    Sass, The Genesis of the Alphabet and Its Development in the Second Millennium B.C. (1988)
  - Goldwasser, BAR 36:2 (2010)
