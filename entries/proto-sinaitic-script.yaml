id: proto-sinaitic-script
title: Origins of the Alphabet (Proto-Sinaitic)
aliases: [Proto-Canaanite script, Early alphabet]
type: concept
cultures: [canaanite, egyptian]
scope: >-
  The invention of the alphabet by Semitic speakers in contact with Egyptian writing in the
  Middle Bronze Age, seen in the inscriptions of Serabit el-Khadim (Sinai) and Wadi el-Ḥol
  (Egypt). The entry also covers its development through Proto-Canaanite to the linear Phoenician
  alphabet c. 1050. Later national scripts are treated under paleo-hebrew-script and aramaic-language.
passages:
