id: aqhat-epic
title: Aqhat Epic
aliases: [Tale of Aqhat, Legend of Danel, Aqhatu Legend]
type: text
cultures: [ugaritic]
date:
  from: -1350
  to: -1185
  circa: true
  display: c. 1350–1185 BCE
scope: >-
  The Ugaritic narrative poem (KTU 1.17-1.19) about the just patriarch-king Danel, the divinely
  granted birth of his son Aqhat, Aqhat's refusal of the goddess Anat's offer of immortality
  in exchange for his bow, his murder, the ensuing drought, and his sister Pughat's revenge.
  The end of the story is lost.
