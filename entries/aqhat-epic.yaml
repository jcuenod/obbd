editorial:
  author_notes:
  - >-
    Present the identification of Ezekiel's Danel (with Noah and Job, all non-Israelite ancients)
    with the Ugaritic Danel as the majority view (e.g. J. Day, VT 30, 1980); it is not the
    Daniel of the book of Daniel.
  - >-
    The list of a son's filial duties (KTU 1.17 I, repeated) is a key source for family religion
    and care of the dead; note the debated meaning of skn ilib ("stele of the ancestral god/divine
    ancestor").
  - >-
    Danel's seven-day ritual before the gods is often read as dream incubation; flag the debate.
  - >-
    Anat's offer of immortality and Aqhat's reply that mortals must die bear on ANE views
    of death and the gods; avoid reading the story as a fertility allegory.
