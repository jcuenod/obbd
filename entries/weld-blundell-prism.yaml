editorial:
  author_notes:
  - >-
    Acquired by Herbert Weld Blundell in 1922; unprovenanced, sometimes said to come from
    Larsa. Usually dated to c. 1800 BCE.
  - >-
    WB 444 lists eight antediluvian kings; another tablet (WB 62) lists ten, closer to Gen
    5's ten generations. Do not overstate the numerical parallel.
  - >-
    The antediluvian section may be a secondary addition to the King List; the List itself
    is a political composition legitimating single kingship.
  - >-
    The comparison concerns structure (long-lived pre-flood figures, flood as divider), not
    names.
