editorial:
  author_notes:
  - >-
    The Merneptah Stele (ca. 1208 BCE) is the earliest attestation of 'Israel', written with
    the determinative for a people, in Canaan.
  - >-
    Present the models. They are Albright's unified conquest, Alt and Noth's peaceful infiltration,
    the Mendenhall-Gottwald peasant revolt, and indigenous emergence or ethnogenesis (Finkelstein,
    Dever, Faust, Killebrew). Current consensus favours a largely indigenous origin with diverse
    elements, including some groups from outside Canaan.
  - >-
    Survey data show a wave of small Iron I highland villages. Their interpretation (sedentarising
    pastoralists, displaced lowlanders) is debated.
  - >-
    Jericho and Ai are standard problem cases for the conquest model. Hazor's destruction
    is real but its agent and date are disputed.
  sources_to_check:
  - Finkelstein, The Archaeology of the Israelite Settlement (1988)
  - Dever, Who Were the Early Israelites and Where Did They Come From? (2003)
  - Killebrew, Biblical Peoples and Ethnicity (2005)
