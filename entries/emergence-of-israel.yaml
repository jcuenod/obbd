title: Emergence of Israel in Canaan
aliases: [Israelite settlement, Conquest models, Ethnogenesis of Israel]
type: concept
cultures: [hebrew, canaanite, egyptian]
scope: >-
  Scholarly reconstruction of the origins of Israel in Canaan at the end of the Late Bronze
  Age and in Iron I, set against the biblical conquest and settlement accounts. Covers the
  main explanatory models and the archaeological and Egyptian evidence.
