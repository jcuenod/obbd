editorial:
  author_notes:
  - >-
    Yadin assigned Megiddo VA-IVB, Hazor X, and Gezer VIII to Solomon on the basis of 1 Kgs
    9:15. Finkelstein's Low Chronology (1996) lowers the Iron I/IIA transition by about 75-100
    years and attributes these strata to the 9th-century Omrides. Mazar's Modified Conventional
    Chronology has Iron IIA spanning about 980-840.
  - >-
    Radiocarbon programmes (Tel Reḥov, Megiddo, Khirbet Qeiyafa, Faynan) have narrowed the
    gap. The debate now concerns decades and the interpretation of social complexity, not
    centuries.
  - >-
    Contested finds include Khirbet Qeiyafa (Judahite fortress under David per Garfinkel,
    or a non-Judahite or Saulide site) and the Large Stone Structure and Stepped Stone Structure
    in Jerusalem ('David's palace' per E. Mazar).
  - >-
    The Shishak (Shoshenq I) campaign list, with the problem of linking specific destructions
    to it, is central.
  sources_to_check:
  - Finkelstein and Mazar, The Quest for the Historical Israel (2007)
  - Levy and Higham (eds.), The Bible and Radiocarbon Dating (2005)
