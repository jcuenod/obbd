title: The Tenth-Century Debate (High and Low Chronology)
aliases: [Low Chronology, United Monarchy debate, Tenth-century debate]
type: concept
cultures: [israelite, judahite]
scope: >-
  The debate over the dating of Iron I-IIA strata in the southern Levant and its consequences
  for the historicity and scale of the united monarchy of David and Solomon. Covers Yadin's
  'Solomonic' synthesis, Finkelstein's Low Chronology, Mazar's Modified Conventional Chronology,
  and the role of radiocarbon dating.
