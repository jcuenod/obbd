editorial:
  author_notes:
  - >-
    Mesha stele lines 10-13: the men of Gad had lived in Ataroth 'from of old', the king of
    Israel built it, and Mesha took it, killed its people as 'satiation' (ryt) for Chemosh
    and Moab, dragged the ʾrʾl dwdh before Chemosh at Kerioth, and resettled it with men of
    Sharon and Maharith. The meaning of ʾrʾl dwdh (altar hearth of its DWD, a cultic object,
    or a person) is disputed.
  - >-
    Excavations led by Chang-Ho Ji (from 2000) uncovered a large Iron IIA temple complex with
    altars, cult stands and figurines. The correlation of building phases with Omride construction
    and Mesha's conquest is debated. Present the excavators' view and note the alternatives.
  - >-
    The inscribed altar or pedestal published in 2018 carries two short texts in an early
    alphabetic script, possibly Moabite, with Egyptian hieratic numerals. The readings are
    provisional, so cite the editio princeps and do not build on details.
  - >-
    Distinguish Moabite Ataroth (Num 32) from Ataroth and Ataroth-addar in Ephraim and Benjamin
    (Josh 16:2, 5, 7; 18:13).
  sources_to_check:
  - KAI 181
  - COS 2.23
  - >-
