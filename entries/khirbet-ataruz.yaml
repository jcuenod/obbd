id: khirbet-ataruz
title: Ataroth (Khirbat Ataruz)
aliases: [Ataroth, Khirbat Ataruz, Khirbat ʿAṭārūz]
type: site
cultures: [moabite, israelite]
scope: >-
  Khirbat ʿAṭārūz in central Jordan, identified with Ataroth, which according to the Mesha
  stele had been held by the 'men of Gad' and fortified by the king of Israel before Mesha
  captured it. The entry covers the Iron Age temple complex and its cult objects, the inscribed
  altar published in 2018, and the site's bearing on Israelite and Moabite history. Ataroth
  in Ephraim (Josh 16) is a different place.
passages:
- ref: Num 32:3
  rel: setting
  note: Ataroth among the lands requested by Gad and Reuben
- ref: Num 32:34
  rel: attests
  note: 'The Gadites build Ataroth; cf. Mesha: ''the men of Gad had lived in the land of Ataroth'''
- ref: 2Kgs 3:4-5
  rel: event
  note: Mesha's rebellion, during which he captured Ataroth from Israel
- ref: 2Sam 23:20
  rel: language
  disputed: true
  note: '''Ariel of Moab'' (ʾărîʾēl), possibly related to the ʾrʾl taken from Ataroth'
- ref: Ezek 43:15-16
  rel: language
  disputed: true
  note: ʾărîʾēl 'altar hearth', a proposed sense of ʾrʾl in Mesha's Ataroth account
