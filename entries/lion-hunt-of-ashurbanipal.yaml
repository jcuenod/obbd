editorial:
  author_notes:
  - >-
    The hunt was staged with captive lions; the reliefs and inscriptions present it as a royal
    ritual tied to the king's duty to protect land and people.
  - >-
    Ezek 19 reflects actual practices of capturing lions with nets and pits and transporting
    them in cages, as shown in Assyrian art.
  - >-
    Nah 2:11-13 turns the Assyrian royal lion image against Nineveh itself; this is a strong
    and widely accepted link.
