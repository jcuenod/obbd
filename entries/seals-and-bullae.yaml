editorial:
  author_notes:
  - >-
    N. Avigad and B. Sass, Corpus of West Semitic Stamp Seals (1997), is the reference corpus.
    Seals bear the formula lX bn Y, with titles such as ʿbd hmlk ('servant of the king') and
    ʾšr ʿl hbyt ('over the house').
  - >-
    Judahite seals shift from iconic to aniconic, name-only designs in the 8th–7th centuries
    (Sass and Uehlinger, eds., OBO 125, 1993). The reasons, religious or administrative, are
    debated.
  - >-
    Provenance is a serious problem. Many seals and bullae are unprovenanced and some are
    forgeries, so prioritize excavated corpora such as the City of David bullae and the Ophel
    bullae.
  - >-
    Papyrus-fibre impressions on the backs of bullae show that they sealed papyrus documents
    (see sealed-deeds).
  sources_to_check:
