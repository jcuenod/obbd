cultures: [judahite, israelite, ane]
scope: >-
  Stamp seals, signet rings and their clay impressions (bullae) in ancient Israel and Judah,
  with ancient Near Eastern comparanda. The entry covers their administrative and legal functions,
  iconography and inscriptions, the provenance problem, and biblical references and metaphors.
