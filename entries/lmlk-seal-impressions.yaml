  circa: true
  display: c. 725–650 BCE
scope: >-
  Stamp impressions reading lmlk ('belonging to the king'), with one of four place names (Hebron,
  Ziph, Socoh, mmšt) and a four-winged scarab or two-winged sun disk, found on the handles
  of thousands of standardised Judahite storage jars. The entry also covers the associated
  private seal impressions and the later rosette stamps.
