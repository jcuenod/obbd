editorial:
  author_notes:
  - >-
    Ussishkin's stratigraphy at Lachish placed lmlk jars before 701 and tied them to Hezekiah.
    Lipschits, Sergi and Koch (2010) argue for a longer sequence into the 7th century, with
    the two-winged type later. Explain both.
  - >-
    The meaning of the four place names (royal estates, production or collection centres)
    and the reading of mmšt (an unknown town or memšelet, 'government') are unresolved.
  - >-
    Avoid presenting the jars as direct evidence for the details of 2 Chr 32. Treat the Chronicles
    link as a plausible correlation.
  sources_to_check:
  - Ussishkin, BASOR 223 (1976)
  - Lipschits, Sergi and Koch, Tel Aviv 37 (2010)
  - >-
    Vaughn, Theology, History, and Archaeology in the Chronicler's Account of Hezekiah (1999)
