id: etemenanki
title: Etemenanki (Ziggurat of Babylon)
type: site
cultures: [babylonian]
scope: >-
  The ziggurat of Marduk at Babylon, 'House, foundation platform of heaven and earth', adjacent
  to the Esagil temple. Restored by Esarhaddon and completed by Nabopolassar and Nebuchadnezzar
  II, it is the most likely historical model for the tower of Babel. Only its foundations
  survive.
passages:
- ref: Gen 11:4
  rel: setting
  note: '''A tower with its top in the heavens'' in the land of Shinar'
- ref: Gen 11:3
  rel: realia
  note: Baked brick and bitumen, Mesopotamian building materials
- ref: Gen 11:9
  rel: language
  note: Babel explained by wordplay on balal 'confuse'; Akkadian Bab-ili 'gate of god'
- ref: Gen 11:1-9
  rel: polemic
  note: Tower story read as a critique of Babylonian imperial pride
- ref: Jer 51:53
  rel: imagery
  note: '''Though Babylon should mount up to heaven'''
related: [ziggurat, ziggurat-and-babel, babylon, nebuchadnezzar-ii, marduk, cosmic-mountain,
  ishtar-gate]
