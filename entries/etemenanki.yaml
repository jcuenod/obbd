editorial:
  author_notes:
  - >-
    The Esagil Tablet gives the dimensions (base c. 91 m square, seven stages); Herodotus
    1.181-182 describes the tower, perhaps from hearsay.
  - >-
    Nebuchadnezzar's building inscriptions speak of raising its top 'to rival the heavens',
    a phrase close to Gen 11:4.
  - >-
    The Schøyen 'Tower of Babel stele' shows Nebuchadnezzar beside the ziggurat; mention it
    and its unprovenanced status.
  - >-
    Gen 11 need not depend on the Neo-Babylonian rebuilding; earlier phases existed, and the
    story's date is debated.
  sources_to_check:
  - George, "The Tower of Babel," AfO 51 (2005/2006)
  - >-
    George, Cuneiform Royal Inscriptions and Related Texts in the Schøyen Collection (CUSAS
    17, 2011)
