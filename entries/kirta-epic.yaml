editorial:
  author_notes:
  - >-
    Early readings of Kirta as a historical epic of patriarchal migrations (Virolleaud's "Terah",
    "Zebulun", "Asher", the Negeb) are discredited and should be mentioned only as a historiographical
    caution.
  - >-
    The text is a key witness to Late Bronze royal ideology (king as son of El, guarantor
    of fertility and justice) and to the tension between sacral kingship and mortality.
  - >-
    The siege of Udum follows a six-days-then-the-seventh pattern; useful for seven-day patterns,
    but avoid claiming dependence for Josh 6.
  - The story may be incomplete (the ending is lost or the cycle unfinished); say so.
