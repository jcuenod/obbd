id: kirta-epic
title: Kirta Epic
aliases: [Keret Epic, Legend of Keret, Kirta Legend]
type: text
cultures: [ugaritic]
date:
  from: -1350
  to: -1185
  circa: true
  display: c. 1350–1185 BCE
scope: >-
  The Ugaritic narrative poem (KTU 1.14-1.16) about King Kirta, who loses his family, is instructed
  by El in a dream to win a new bride by military expedition, obtains heirs, falls mortally
  ill after failing to keep a vow to Athirat, is healed by El, and is challenged by his son
  for neglecting justice.
passages:
- ref: 1Kgs 3:5-15
  rel: parallel
  note: King receives a dream theophany and divine grant (El appears to the weeping Kirta)
- ref: Gen 15:1-6
  rel: parallel
  disputed: true
  note: Lament over lack of heir answered by divine promise of offspring
- ref: Job 1:13-19
  rel: parallel
  disputed: true
  note: Successive calamities wipe out the hero's family
- ref: Job 42:10-17
  rel: parallel
  disputed: true
  note: Restoration of household and new children
- ref: Deut 20:7; 24:5
  rel: practice
  note: >-
    Betrothed and newlywed men exempt from war; contrast Kirta's levy sending even the bridegroom
- ref: Deut 23:21-23
  rel: practice
  note: Danger of an unfulfilled vow; Kirta's broken vow to Athirat brings illness (MT 23:22-24)
- ref: 2Sam 15:1-6
  rel: parallel
  note: Royal son challenges father for not hearing the people's cases
- ref: Ps 72:1-4, 12-14
  rel: concept
  note: King's duty to judge the widow, orphan and poor
- ref: Ps 82:6-7
  rel: parallel
  disputed: true
  note: '''Son of El'' who must nevertheless die; cf. ''Shall Kirta, son of El, die?'''
