id: katumuwa-stele
title: Katumuwa Stele
aliases: [KTMW Stele, Kuttamuwa Stele]
type: artifact
cultures: [aramean, luwian]
date:
  from: -735
  to: -735
  circa: true
  display: c. 735 BCE
scope: >-
  A basalt funerary stele found in situ in 2008 at Zincirli (ancient Samʾal). It shows the
  official Katumuwa, servant of King Panamuwa, seated at a funerary banquet. Its inscription
  in the local Samʾalian dialect provides for annual sacrifices, including one 'for my soul
  (nbš) that is in this stele'.
