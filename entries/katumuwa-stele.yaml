editorial:
  author_notes:
  - >-
    Found by the University of Chicago Neubauer Expedition in a small mortuary chapel, which
    makes it rare as a funerary monument in its original setting.
  - >-
    The idea of a nbš residing in a stone monument, possibly alongside cremation, is a significant
    datum for West Semitic views of the person after death. Avoid reading it directly into
    Hebrew nepeš.
  - Later Aramaic and Nabataean use of npš for 'funerary monument' is relevant background.
  - >-
    The language is Samʾalian, a distinct dialect related to Aramaic. Mention the Luwian cultural
    milieu (the name Katumuwa is Luwian).
  sources_to_check:
