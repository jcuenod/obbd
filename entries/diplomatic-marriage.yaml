editorial:
  author_notes:
  - >-
    In EA 4, Kadashman-Enlil quotes Amenhotep III: 'From time immemorial no daughter of the
    king of Egypt has been given to anyone'. Weigh this against 1 Kgs 3:1. Some (e.g. K. A.
    Kitchen) find such a marriage plausible in the weaker 21st Dynasty; others see it as Solomonic
    legend.
  - >-
    Ramesses II's marriage to a Hittite princess after the treaty (Marriage Stela) is the
    classic case of a marriage sealing a treaty.
  - >-
    The Deuteronomistic critique (Deut 17:17; 1 Kgs 11:1-8) turns diplomatic practice into
    religious apostasy. Explain both sides.
