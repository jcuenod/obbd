id: diplomatic-marriage
title: Diplomatic Marriage
aliases: [Royal intermarriage, Dynastic marriage]
type: practice
cultures: [ane, egyptian, hittite, phoenician]
scope: >-
  Marriages between royal houses used to seal alliances and vassal relationships in the ancient
  Near East. The entry covers the biblical cases (Solomon, Ahab–Jezebel, the Omride–Davidide
  link) and the Deuteronomistic judgment on foreign royal wives.
