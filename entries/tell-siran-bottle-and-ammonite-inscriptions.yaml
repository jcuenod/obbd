editorial:
  author_notes:
  - >-
    Tell Siran (found 1972) names Amminadab king of the Ammonites, son of Hissalel, son of
    Amminadab. An Amminadab of Ammon also appears in Ashurbanipal's records, which helps the
    dating.
  - >-
    The Baʿalyashaʿ = Baalis identification is widely accepted, but it rests on a name variant.
    Present it as probable.
  - >-
    The Ammonite script and language are distinct from Hebrew, Moabite and Aramaic, though
    the distinction is debated for some seals. Note that many 'Ammonite' seals are unprovenanced.
  - >-
    The Amman Citadel inscription is fragmentary. Whether it is a royal building text or a
    divine oracle is debated.
  sources_to_check:
