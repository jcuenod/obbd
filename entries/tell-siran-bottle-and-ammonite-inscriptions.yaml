  circa: true
  display: c. 850–580 BCE
scope: >-
  The small corpus of Ammonite inscriptions from the 9th to 6th centuries, chiefly the Amman
  Citadel Inscription (a building or divine-oracle text invoking Milkom), the bronze Tell
  Siran bottle naming three generations of Ammonite kings, and a seal impression from Tell
  el-ʿUmeiri of 'Milkomʾur, servant of Baʿalyashaʿ', usually identified with Baalis of Jer
  40:14.
