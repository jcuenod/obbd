date:
  from: -1200
  to: -650
  circa: true
  display: c. 1200–650 BCE
scope: >-
  The canonical Babylonian series of about seventy tablets of celestial omens (lunar, solar,
  meteorological, and planetary) used by court scholars to interpret signs in the sky for
  king and state. It is the chief background for biblical references to Babylonian star-gazers
  and portents in the heavens.
passages:
- ref: Isa 47:13
  rel: practice
  note: Babylon's star-gazers who divide the heavens and forecast by the new moons
- ref: Jer 10:2
  rel: concept
  note: '''Do not be dismayed at the signs of the heavens'' as the nations are'
- ref: Dan 2:2, 10
  rel: practice
  note: Babylonian court experts (magicians, enchanters, Chaldeans) consulted by the king
- ref: Amos 8:9
  rel: imagery
  disputed: true
  note: 'Sun set at noon, darkness by day: eclipse as ominous portent'
- ref: Matt 2:1-2
  rel: practice
  note: Magi from the east read a star as the sign of a royal birth
