editorial:
  author_notes:
  - >-
    Omens go back to the Old Babylonian period (the Venus Tablet of Ammi-ṣaduqa is EAE 63);
    the series was standardised in the late second millennium; main copies are 7th-c. Nineveh.
  - >-
    Celestial divination concerned king and land, not individual horoscopes, which appear
    only from the late 5th c. BCE. Neo-Assyrian scholars' reports and letters (SAA 8, SAA
    10) show the series in use, including the substitute-king ritual after eclipses.
  - >-
    Biblical polemic against astral divination is concentrated in exilic and later texts (Deutero-Isaiah,
    Daniel); avoid reading 'astrology' anachronistically into earlier passages.
  sources_to_check:
  - H. Hunger, Astrological Reports to Assyrian Kings (SAA 8, 1992)
  - S. Parpola, Letters from Assyrian and Babylonian Scholars (SAA 10, 1993)
  - E. Reiner and D. Pingree, Babylonian Planetary Omens (1975-2005)
  - F. Rochberg, The Heavenly Writing (2004)
