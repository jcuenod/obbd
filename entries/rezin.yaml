editorial:
  author_notes:
  - >-
    Assyrian Raḫiānu suggests an original Aramaic form like Raḍyān. The Masoretic rĕṣîn may
    be secondary. Note the philological discussion.
  - >-
    Tiglath-pileser lists Rezin among tributaries in 738 (with Menahem), then describes the
    campaign against Damascus in 733-732. The annals are fragmentary.
  - >-
    In 2 Kgs 16:6 the MT has 'Aram' and the Qere and many commentators have 'Edom'. Flag the
    textual issue.
