id: 4q521-messianic-apocalypse
title: 4Q521 (Messianic Apocalypse)
aliases: [4Q521, On Resurrection]
type: artifact
cultures: [jewish]
scope: >-
  A fragmentary Hebrew Qumran manuscript describing eschatological deliverance through scriptural
  images of healing, release, resurrection, and good news to the poor. The entry consolidates
  evidence already discussed under Messianic Expectations.
passages:
- ref: Isa 35:5-6
  rel: parallel
  note: >-
    Restoration of sight and bodily wholeness contributes to the scroll's scriptural account
    of deliverance
- ref: Isa 61:1-2
  rel: parallel
  note: >-
    Good news to the poor and release language recur in the scroll's account of eschatological
    acts
- ref: Ps 146:7-8
  rel: parallel
  note: >-
    Release of prisoners, opening blind eyes, and raising the bowed share wording with frag.
    2 col. II
- ref: Matt 11:2-6
  rel: parallel
  note: >-
    Healing, raising the dead, and good news to the poor form a closely comparable cluster
    of signs
- ref: Luke 7:18-23
  rel: parallel
  note: >-
    Jesus' answer to John's messengers combines signs also associated with deliverance in
    4Q521
related: [messianic-expectations, afterlife-and-resurrection, dead-sea-scrolls, 11qmelchizedek]
