title: Teraphim
type: realia
cultures: [hebrew, hurrian, babylonian, hittite]
scope: >-
  The tĕrāpîm, cultic objects of debated form and function (household gods, ancestor figurines,
  divinatory images) that appear in patriarchal, judges, monarchic, and prophetic texts, at
  first without and later with condemnation.
