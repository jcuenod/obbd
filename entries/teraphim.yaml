editorial:
  author_notes:
  - >-
    The view that Rachel stole the teraphim to secure inheritance rights, based on Nuzi texts
    (Speiser; Draffkorn), is now largely abandoned. Correct it explicitly. Emar and Nuzi texts
    do link household gods (ilānu) with family estates, but this is not evidence for the Genesis
    motive.
  - >-
    Van der Toorn (CBQ 52, 1990) argues that teraphim were ancestor figurines used in divination.
    This is widely followed but not certain.
  - >-
    Size and form are unclear. 1 Sam 19 suggests a human-sized object or a head, while Gen
    31 suggests something small. The etymology is unknown (proposals include Hittite tarpiš
    and Hebrew rp' or "Rephaim"). Avoid overconfident identifications with archaeological
    figurines.
