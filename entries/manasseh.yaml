editorial:
  author_notes:
  - >-
    Esarhaddon's Nineveh prism (c. 673) and Ashurbanipal's Prism C (Egyptian campaign, 667)
    name Menasî of Judah. This gives firm evidence of loyal vassalage.
  - >-
    His reign coincides with the Pax Assyriaca. Note the archaeological evidence for economic
    recovery after 701 (Ekron oil industry, Negev and Judean Desert settlement).
  - >-
    The Chronicler's captivity and repentance story has no Assyrian corroboration. It is usually
    read as theological (explaining the long reign), but some scholars defend a historical
    core.
  - >-
    The Deuteronomistic depiction of his cultic sins should be read alongside debates about
    Assyrian religious influence. Most now reject the idea of an imposed Assyrian cult.
