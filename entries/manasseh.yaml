scope: >-
  Manasseh son of Hezekiah, the longest-reigning king of Judah, considered in the light of
  extrabiblical evidence. Esarhaddon and Ashurbanipal list 'Manasseh king of Judah' among
  the western vassals who supplied building materials and military support.
