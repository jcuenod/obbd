editorial:
  author_notes:
  - >-
    Scholars debate whether Merneptah actually campaigned in Canaan or whether the stele's
    coda is rhetorical. The "subduer of Gezer" epithet (Amada inscription) and the Karnak
    reliefs reassigned to him by Yurco are adduced in support.
  - >-
    He was once a popular candidate for exodus pharaoh. The stele shows Israel already in
    Canaan by his year 5, which rules out its being a group still in Egypt.
  - >-
    The Nephtoah identification rests on the "wells of Merneptah" in the Ramesside miscellanies
    (P. Anastasi III). It is plausible but debated.
  sources_to_check: [COS 2.6, 'AEL 2:73-78']
