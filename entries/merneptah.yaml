scope: >-
  Thirteenth son and successor of Ramesses II. He repelled a Libyan invasion supported by
  Sea Peoples in his year 5 and claimed victories in Canaan. His "Israel Stele" contains the
  earliest certain extrabiblical mention of Israel.
