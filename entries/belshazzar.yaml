editorial:
  author_notes:
  - >-
    Cuneiform sources call him 'son of the king' (crown prince), never king; the Verse Account
    says Nabonidus 'entrusted the kingship' to him. Daniel's 'king' is an approximation.
  - >-
    Before cuneiform evidence was published, critics doubted his existence; the discovery
    is often overstated in apologetic literature as proving Daniel's accuracy.
  - >-
    Nebuchadnezzar as his 'father' (Dan 5) is historically inaccurate; it may be literary
    or a loose use of 'father'.
  - Nothing in Babylonian sources records his death on the night of Babylon's fall.
