editorial:
  author_notes:
  - >-
    Present the comparison of the calendars (Exod 23; 34; Deut 16; Lev 23; Num 28-29) as the
    core evidence for the festivals' development. Covenant Code, Deuteronomic, and Priestly
    stages are the standard critical framework, though details are debated.
  - >-
    Wellhausen's thesis that agricultural festivals were progressively "historicized" (linked
    to exodus and wilderness) remains influential. Present it as a model, not a fact.
  - >-
    Ugaritic ritual texts (e.g. the month calendar in KTU 1.41/1.87) and the Emar zukru festival
    (Fleming, Time at Emar, 2000) give the best Syro-Levantine comparisons. The Gezer calendar
    shows the agricultural year in Hebrew.
  - >-
    Booths (Sukkot) has the clearest harvest origins. Weeks lacks a historical rationale in
    the Hebrew Bible.
  image_query: Gezer calendar
