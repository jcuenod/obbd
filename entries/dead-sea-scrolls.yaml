id: dead-sea-scrolls
title: Dead Sea Scrolls
aliases: [Qumran Scrolls]
type: text
cultures: [jewish]
date:
  from: -250
  to: 68
  circa: true
  display: c. 250 BCE–68 CE
scope: >-
  The roughly 900+ manuscripts recovered between 1947 and 1956 from eleven caves near Qumran,
  copied between about 250 BCE and 68 CE: biblical scrolls, parabiblical literature, and the
  writings of a sectarian community. This hub entry also notes related Judean Desert finds;
  individual scrolls have their own entries.
passages:
- ref: Isa 40:3
  rel: concept
  note: Wilderness 'way' applied to the community's Torah study (1QS 8:13-16)
- ref: Mark 1:2-4
  rel: parallel
  note: John the Baptist in the wilderness, framed by Isa 40:3 as in the Community Rule
- ref: Deut 32:8
  rel: language
  note: 4QDeut-j reads 'sons of God' against MT 'sons of Israel'
- ref: 1Sam 10:27
  rel: language
  note: 4QSam-a preserves a paragraph on Nahash's oppression absent from MT
- ref: 1Sam 17:4
  rel: language
  note: 4QSam-a gives Goliath's height as four cubits and a span, agreeing with LXX
- ref: Jer 10:1-11
  rel: language
  note: 4QJer-b attests the shorter, differently ordered text known from LXX
- ref: Ps 145:13
  rel: language
  note: 11QPs-a preserves the nun-line missing from MT's acrostic
- ref: 2Cor 6:14-7:1
  rel: parallel
  disputed: true
  note: Light/darkness and Belial (Beliar) vocabulary close to sectarian texts
related: [qumran, great-isaiah-scroll, community-rule, 4qdeut-j, pesher-habakkuk, jewish-sects,
  septuagint, forgeries-in-biblical-archaeology]
