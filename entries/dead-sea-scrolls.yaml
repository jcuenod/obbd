editorial:
  author_notes:
  - >-
    Biblical manuscripts (over 200) cover every book of the Hebrew Bible except Esther. They
    show textual plurality (proto-MT, pre-Samaritan, LXX-Vorlage, non-aligned); present Tov's
    and Ulrich's models.
  - >-
    The Essene identification of the Qumran community is the majority view. Note the alternatives
    (Golb; debates over the site's archaeology) and that many scrolls were brought from elsewhere.
  - >-
    Correct misconceptions: there are no New Testament texts at Qumran (the 7Q5 = Mark claim
    is rejected), and the post-2002 unprovenanced 'DSS fragments' (e.g. those of the Museum
    of the Bible) are largely forgeries.
  - Explain how scrolls are dated, by palaeography and AMS radiocarbon.
  sources_to_check:
  - Discoveries in the Judaean Desert (DJD), 40 vols. (1955-2010)
  - E. Tov, Textual Criticism of the Hebrew Bible (3rd ed., 2012)
  - >-
    F. García Martínez and E. J. C. Tigchelaar, The Dead Sea Scrolls Study Edition, 2 vols.
    (1997-98)
  - M. Abegg, P. Flint, and E. Ulrich, The Dead Sea Scrolls Bible (1999)
