editorial:
  author_notes:
  - >-
    Excavated by Mackenzie (1911-12), Grant (1928-33) and Bunimovitz and Lederman (from 1990).
    Very low pig frequencies at Iron I Beth-shemesh, compared with nearby Philistine sites,
    are central to the debate on ethnic boundaries and pig avoidance.
  - >-
    The Iron II town had a large cruciform rock-cut reservoir and industrial installations.
    It was destroyed, probably in 701, and largely abandoned afterwards.
  - >-
    The name ('house of the sun') suggests a solar cult in origin, but there is no direct
    evidence for one at the site. Do not confuse it with Beth-shemesh in Naphtali (Judg 1:33).
