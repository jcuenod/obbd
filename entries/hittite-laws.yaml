editorial:
  author_notes:
  - >-
    The formula 'formerly they did X, now they do Y' documents legal reform, rare in ANE law.
    Penalties are largely compensatory; death is reserved mainly for certain sexual offences
    (ḫurkel) and challenges to authority.
  - >-
    The unsolved-homicide parallel to Deut 21:1-9 comes from a late version of HL §6 (Hoffner's
    numbering); verify against Hoffner (1997).
  - >-
    Keep the Anatolian Hittites distinct from the 'sons of Heth' of Gen 23 and other biblical
    'Hittites' (see hittites-and-hethites).
  sources_to_check:
