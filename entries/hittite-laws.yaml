scope: >-
  The Hittite law collection of about 200 provisions on two tablets, composed in the Old Hittite
  period and recopied with revisions into the 13th century. It is notable for recording changes
  of penalty over time and for its regulation of sexual offences.
passages:
- ref: Lev 18:23
  rel: parallel
  note: Bestiality forbidden; HL distinguishes animals (cattle, sheep, pig, dog vs. horse,
    mule)
- ref: Lev 20:15-16
  rel: parallel
  note: Bestiality as a capital offence (HL §§187-188, 199-200)
- ref: Lev 18:6-18
  rel: parallel
  note: Prohibited sexual unions with close relatives (HL §§189-195)
- ref: Deut 25:5-10
  rel: practice
  note: Widow married by the deceased's brother, then his father (HL §193)
- ref: Gen 38:8-26
  rel: practice
  note: Levirate duty passing from brothers to the father-in-law (HL §193)
- ref: Deut 22:23-27
  rel: parallel
  note: Woman seized in the mountains is innocent; in the house, culpable (HL §197)
- ref: Exod 21:22
  rel: parallel
  note: Compensation for causing a woman's miscarriage (HL §§17-18)
- ref: Deut 21:1-9
  rel: practice
  note: 'Body found in open country: distance measured to the nearest town, which is liable'
