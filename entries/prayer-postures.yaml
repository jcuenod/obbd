editorial:
  author_notes:
  - >-
    Akkadian prayer vocabulary is built on gesture: nīš qāti 'lifting of the hand' and the
    šuʾila ('hand-lifting') prayer genre. M. Gruber, Aspects of Nonverbal Communication in
    the Ancient Near East (1980), is the standard study.
  - >-
    Iconographic comparanda include the Hazor Area C stele with raised hands beneath a crescent,
    worshippers with raised arms on the Kuntillet ʿAjrud pithos, Mesopotamian worshipper statues,
    and the Egyptian 'adoration' gesture.
  - >-
    Standing seems to be the default posture in Hebrew prayer. Kneeling and orientation toward
    the temple or Jerusalem are emphasized in later texts (1 Kgs 8; Dan 6).
