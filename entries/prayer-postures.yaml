id: prayer-postures
title: Prayer Postures and Gestures
aliases: [Gestures of prayer, Orant posture]
type: practice
cultures: [ane]
scope: >-
  The bodily postures and gestures of prayer in the Hebrew Bible: standing, kneeling, spreading
  or lifting the hands, bowing, and orientation toward the sanctuary. These are compared with
  ancient Near Eastern texts and orant iconography. Full prostration is treated in a separate
  entry.
