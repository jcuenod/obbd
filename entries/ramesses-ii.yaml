editorial:
  author_notes:
  - >-
    Use the conventional dates of c. 1279-1213 (Kitchen, Shaw). Older handbooks give 1290-1224
    or 1304-1237, and differences in chronology affect older scholarship's synchronisms.
  - >-
    The identification with the exodus pharaoh rests mainly on Exod 1:11 and is reinforced
    by popular culture (DeMille's The Ten Commandments; The Prince of Egypt). No Egyptian
    evidence connects him with Israelites. Present it as a hypothesis held by those who accept
    a 13th-century exodus.
  - Claims that his mummy shows drowning or salt deposits are popular myths.
  - >-
    Cover Kadesh (year 5), the treaty with Hattusili III (year 21), and the marriage to a
    Hittite princess as international background for the Late Bronze Levant.
  sources_to_check:
