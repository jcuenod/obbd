id: ramesses-ii
title: Ramesses II
aliases: [Rameses the Great, Ramses II, Usermaatre Setepenre]
type: person
cultures: [egyptian]
date:
  from: -1279
  to: -1213
  circa: true
  display: c. 1279–1213 BCE
scope: >-
  Third king of the Nineteenth Dynasty, whose 66-year reign saw the Battle of Kadesh, the
  Egyptian-Hittite peace treaty, a Hittite diplomatic marriage, and vast building projects,
  including the Delta capital Pi-Ramesses. He is popularly cast as the pharaoh of the exodus,
  an identification the entry examines critically.
