editorial:
  author_notes:
  - >-
    Distinguish the Sumerian Bilgames poems, the Old Babylonian epic (c. 18th c.), the Middle
    Babylonian forms, and the Standard Babylonian eleven-tablet epic attributed to Sîn-lēqi-unninni,
    whose main copies come from 7th-c. Nineveh; Tablet XII is a translation of a Sumerian
    poem appended later. A Late Bronze Age fragment from Megiddo shows circulation in the
    Levant.
  - >-
    Tablet XI adapts the Atrahasis flood; its parallels with Gen 6-9 (birds, mountain landing,
    sacrifice) are the closest of any ANE text, and most scholars infer a Mesopotamian source
    tradition behind Genesis, while the route and date of transmission remain debated.
  - >-
    Siduri's carpe diem speech survives only in the Old Babylonian Sippar tablet, not in the
    Standard version; the Eccl 9:7-9 parallel is widely accepted, though direct dependence
    is debated.
  - >-
    The name Gilgamesh survives in the Qumran Book of Giants (4Q530), useful for the afterlife
    of Mesopotamian lore in Second Temple Judaism.
  - >-
    Avoid treating Gilgamesh as a 'fall' story: the serpent and the plant concern rejuvenation,
    and the epic's ethos (accept mortality, enjoy life, fame through building) differs from
    Gen 3.
  sources_to_check:
