scope: >-
  The Mesopotamian epic of Gilgamesh, king of Uruk, from the Sumerian Bilgames poems through
  the Old Babylonian epic to the Standard Babylonian version. It covers Gilgamesh's friendship
  with Enkidu, the quest for immortality, and Utnapishtim's flood narrative in Tablet XI;
  the Nineveh flood tablet has its own entry.
