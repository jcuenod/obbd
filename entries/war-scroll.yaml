scope: >-
  The War Rule from Qumran Cave 1 (1QM), with related Cave 4 manuscripts (4Q491-496). It describes
  an eschatological forty-year war of the 'sons of light' against the 'sons of darkness' (Belial,
  the Kittim), including battle formations, trumpets, standards, and priestly liturgies.
passages:
- ref: Num 2:1-34
  rel: concept
  note: Tribal camp order and standards modelled in the war array
- ref: Num 10:1-10
  rel: practice
  note: Silver trumpets for assembly and battle, with inscriptions prescribed (1QM 2:16-3:11)
- ref: Deut 20:1-9
  rel: practice
  note: Priestly address before battle quoted and expanded (1QM 10:2-8)
- ref: Num 24:17-19
  rel: concept
  note: Star out of Jacob quoted in the war hymn (1QM 11:6-7)
- ref: Dan 11:40-12:3
  rel: concept
  note: Final war, Michael, and the time of distress reworked in 1QM 1
- ref: Ezek 38-39
  rel: concept
  note: Eschatological defeat of Gog (cf. 1QM 11:16)
- ref: Rev 19:11-21
  rel: parallel
  note: Heavenly army in the final battle
- ref: 2Cor 6:14-15
  rel: language
  note: Light vs. darkness and Beliar
