editorial:
  author_notes:
  - >-
    Composite work. The date of composition (late Hasmonean or early Roman) is tied to whether
    the Kittim of Assyria and Egypt are Seleucids/Ptolemies or Romans.
  - Yadin's argument from Roman military equipment and tactics is influential but debated.
  - >-
    Highlight the joint human-angelic warfare and the predetermined dualism (compare the Treatise
    on the Two Spirits).
