editorial:
  author_notes:
  - >-
    The prostrating figure on the Black Obelisk is labelled as Jehu's tribute. Whether it
    depicts Jehu himself or an envoy is debated. It is the only contemporary image of an Israelite
    or Judahite king.
  - >-
    Kings does not mention the tribute to Shalmaneser III (841). Explain the geopolitics:
    Jehu's submission and Hazael's resistance.
  - Set out the options for reconciling Tel Dan with 2 Kgs 9 neutrally (see tel-dan-stele).
  - >-
    Hosea's condemnation contrasts with the approval in 2 Kgs 10:30. Note the tension within
    the biblical tradition.
