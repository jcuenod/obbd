- ref: 2Kgs 9:14-28
  rel: event
  note: Killing of Joram and Ahaziah; cf. the Tel Dan Stele's rival claim
- ref: 2Kgs 9:2, 14
  rel: attests
  note: Jehu son of Jehoshaphat son of Nimshi; Assyrian texts call him 'son of Omri'
- ref: 1Kgs 19:16-17
  rel: attests
  note: Elijah commissioned to anoint Jehu
- ref: 2Kgs 10:32-33
  rel: event
  note: Hazael's conquests in Jehu's days, after Assyria withdrew
- ref: Hos 1:4
  rel: event
  note: Prophetic condemnation of the bloodshed of Jezreel
