scope: >-
  Jehu, the army officer who overthrew the Omride dynasty, considered in the light of extrabiblical
  evidence. Shalmaneser III's Black Obelisk records the tribute of 'Jehu of Bit-Omri' in 841.
  The Tel Dan Stele claims for an Aramean king the killings that 2 Kings attributes to Jehu.
