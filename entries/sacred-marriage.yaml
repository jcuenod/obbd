title: Sacred Marriage (Hieros Gamos)
aliases: [hieros gamos]
type: practice
cultures: [sumerian, babylonian, assyrian, greek]
scope: >-
  The idea of a ritual marriage between deities, or between a king and a goddess, attested
  in Sumerian royal hymns and later Mesopotamian divine-marriage rites, and its proposed relevance
  to biblical marriage metaphors and the Song of Songs.
