editorial:
  author_notes:
  - >-
    The key Sumerian evidence is royal hymns (e.g. Iddin-Dagan A, Shulgi hymns) describing
    the king's union with Inanna. Whether this involved a human sexual rite or was symbolic
    or performed with statues is debated (Cooper; Lapinkivi, The Sumerian Sacred Marriage,
    SAAS 15, 2004).
  - >-
    First-millennium rites of divine marriage (e.g. Nabu and Tashmetu) involved statues and
    a bedchamber, not human couples.
  - >-
    Avoid the older "fertility cult" model linking sacred marriage, sacred prostitution, and
    Canaanite religion. It has been largely abandoned. The biblical marriage metaphor is better
    explained by covenant and family law.
  - >-
    The Warka Vase scene is often but not universally interpreted as a sacred-marriage procession.
    Say so if it is used as an illustration.
  sources_to_check:
  - Martti Nissinen and Risto Uro, eds., Sacred Marriages (2008)
  image_query: Warka Vase
