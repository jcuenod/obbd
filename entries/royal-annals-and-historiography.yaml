editorial:
  author_notes:
  - >-
    Distinguish the genres: Assyrian annals (campaign by campaign, ideological), summary and
    display inscriptions, the more terse Babylonian Chronicle series, king lists and eponym
    lists.
  - >-
    Whether the 'Books of the Annals' cited in Kings were real archival chronicles or a literary
    device is debated. Many (e.g. N. Na'aman) accept some archival or chronicle sources.
  - >-
    J. Van Seters, In Search of History (1983), compares Greek and ancient Near Eastern historiography.
    Note that ideology and propaganda shape all of these sources, Assyrian and biblical alike.
