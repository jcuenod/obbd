id: persian-imperial-authorization
title: Persian Imperial Authorization (Reichsautorisation)
aliases: [Reichsautorisation, Imperial authorization]
type: concept
cultures: [persian]
scope: >-
  The hypothesis, associated with Peter Frei, that the Achaemenid administration ratified
  local norms so that they became binding imperial law, and that the Torah's promulgation
  in Yehud was such a case. The entry covers the thesis, its evidence (Letoon trilingual,
  Demotic Chronicle, Elephantine Passover letter, Ezra 7), and its critique.
passages:
