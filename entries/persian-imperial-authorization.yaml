editorial:
  author_notes:
  - >-
    State Frei's thesis (1984; 2nd ed. 1996) precisely. Note that most specialists now reject
    the strong form: there was no attested legal mechanism for authorizing local codes.
  - >-
    Evaluate the key evidence: the Letoon trilingual (Xanthos, 337 BCE) concerns a local cult
    foundation, not a law code. The Demotic Chronicle's report of Darius codifying Egyptian
    law is late and debated.
  - >-
    A weaker version (Persian interest in local order, combined with local elites' use of
    imperial backing) remains influential in Pentateuch-formation debates.
  - >-
    Note that the irrevocability of Persian law (Esther, Daniel) has no support in Achaemenid
    sources.
  sources_to_check:
  - >-
    J. W. Watts (ed.), Persia and Torah: The Theory of Imperial Authorization of the Pentateuch
    (2001)
  - >-
    P. Frei and K. Koch, Reichsidee und Reichsorganisation im Perserreich (OBO 55, 1984; 2nd
    ed. 1996)
