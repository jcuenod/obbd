editorial:
  author_notes:
  - >-
    Mesopotamian lunar festivals (the eššēšu festivals on fixed days of the month in Ur III
    and Old Babylonian sources) and Ugaritic ritual texts prescribing offerings at the new
    moon provide the comparative frame.
  - >-
    The consistent pairing of new moon and sabbath in pre-exilic texts is central to the debate
    over the origin of the Sabbath (see sabbath). Cross-reference it rather than repeating
    it.
  - >-
    Ps 81:3 keseh ("full moon"; cf. Prov 7:20) has cognates in Phoenician and Syriac (verify).
    It is useful evidence for full-moon observance alongside the new moon.
