id: new-moon
title: New Moon Festival
aliases: [ḥōdeš, Rosh Chodesh]
type: practice
cultures: [hebrew, babylonian, ugaritic]
scope: >-
  The new-moon day (ḥōdeš) as a cultic and social occasion in Israel, with its offerings,
  trumpet blasts, feasts, and cessation of trade, and its background in lunar festivals of
  Mesopotamia and Ugarit.
passages:
- ref: 1Sam 20:5, 18, 24-27
  rel: practice
  note: New-moon royal meal over two days; David's absence noticed
- ref: 2Kgs 4:23
  rel: practice
  note: 'Neither new moon nor sabbath: occasions for visiting a man of God'
- ref: Amos 8:5
  rel: practice
  note: Grain sales suspended until the new moon is over
- ref: Hos 2:11
  rel: practice
  note: New moons among the festivals YHWH will end; MT 2:13
- ref: Isa 1:13-14
  rel: practice
  note: New moons and appointed feasts rejected without justice
- ref: Isa 66:23
  rel: concept
  note: All flesh to worship 'from new moon to new moon'
- ref: Num 10:10
  rel: practice
  note: Trumpets blown at the beginnings of months
- ref: Num 28:11-15
  rel: practice
  note: New-moon burnt offerings and sin offering
- ref: Ps 81:3
  rel: practice
  note: Shofar at the new moon and at the full moon (keseh); MT 81:4
- ref: Ezek 46:1, 3, 6-7
  rel: practice
  note: Inner gate opened on sabbath and new moon; prince's offerings
- ref: Col 2:16
  rel: practice
  note: New moons and sabbaths in early Christian debate
