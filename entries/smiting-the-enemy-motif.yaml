scope: >-
  The iconographic and literary motif of the king or god striking down enemies, trampling
  them, or setting a foot on their necks, from the Egyptian 'smiting scene' to Levantine smiting-god
  figurines and Assyrian royal rhetoric. The entry covers its use in royal psalms and divine
  warrior texts.
