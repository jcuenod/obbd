editorial:
  author_notes:
  - >-
    The Egyptian smiting scene (the king grasping a foe by the hair, mace raised) runs from
    the Narmer Palette to the Roman period. Smiting-god figurines and the Baal stele from
    Ugarit carry the motif into the Levant.
  - >-
    O. Keel's Symbolism of the Biblical World remains the standard treatment of Ps 110 and
    Ps 2:9.
  - >-
    The link between Ps 2:9 and Egyptian execration rites (smashing inscribed vessels) is
    plausible but debated. Present it as a proposal.
  - >-
    Distinguish iconographic ideology from actual practice. Treatment of real captives belongs
    in a separate entry.
