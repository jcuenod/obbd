editorial:
  author_notes:
  - >-
    Manuscripts: Genizah MS A (10th century) and MS B (12th century), now in Cambridge University
    Library (verify shelfmarks). The Qumran copies (earliest 4Q266, first century BCE) show
    that the Genizah text is shortened and partly rearranged. They add the opening, laws on
    skin disease and other matters, a fuller penal code, and an expulsion ceremony. Use Baumgarten's
    DJD 18 edition and note the different column numbering systems.
  - >-
    'Damascus' may be a literal place of exile or a code name (for Qumran, or for Babylon
    in Murphy-O'Connor's hypothesis); the question is debated. The 390 years and the 'twenty
    years' before the Teacher of Righteousness (CD 1:5-11) are schematic and should not be
    used for exact dating.
  - >-
    CD addresses members living in 'camps' with wives and children, unlike the yaḥad of the
    Community Rule. A common view links this with Josephus's marrying Essenes (War 2.160-161),
    but the relationship between the two rules is complex and was revised over time.
  - >-
    The Sabbath code (CD 10:14-11:18) is the fullest pre-rabbinic Sabbath halakhah. It starts
    the Sabbath while the sun is still above the horizon (CD 10:14-17) and is stricter than
    later rabbinic law on rescuing animals (contrast Matt 12:11; Luke 14:5). CD 11:16-17 on
    rescuing a person is textually difficult; compare 4Q265, which permits using a garment.
    Present these details precisely.
  - >-
    Messianic language: 'the messiah of Aaron and Israel' (CD 12:23-13:1; 14:19; 19:10-11;
    20:1) may mean one figure or two (cf. 1QS 9:11). The question is debated.
