type: text
cultures: [jewish]
date:
  from: -125
  to: -75
  circa: true
  display: c. 125–75 BCE
scope: >-
  A sectarian work known from two medieval copies from the Cairo Genizah (CD-A and CD-B, published
  by Schechter in 1910) and from ten fragmentary Qumran manuscripts (4Q266-273, 5Q12, 6Q15).
  It combines an Admonition, which tells the community's origins and interprets scripture,
  with Laws covering oaths, purity, the Sabbath, the organization of the 'camps' and a penal
  code. The date is that of composition; the copies range from the first century BCE to the
  twelfth century CE.
