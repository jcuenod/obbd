editorial:
  author_notes:
  - >-
    Harran's temple of Sin (Ehulhul) was restored by Nabonidus. Stelae of Nabonidus and of
    his mother Adad-guppi were found reused in the Great Mosque.
  - >-
    It was the last Assyrian stronghold under Ashur-uballit II (610-609) before the Babylonian
    conquest, the context of Neco's march in 2 Kgs 23:29.
  - >-
    The names of Abraham's kin (Serug, Nahor, Terah) match place names in the Harran region
    (Sarugi, Nahur, Til-turaḫi). Nahur appears already in the Mari texts.
  sources_to_check:
