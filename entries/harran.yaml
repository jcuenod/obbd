aliases: [Haran, Ḫarrānu, Carrhae]
type: site
cultures: [aramean, assyrian]
scope: >-
  The city in the upper Balikh valley in southeastern Turkey, a major centre of the moon-god
  Sin and the place where Abraham's family settled. Covers its role as a cult and political
  centre from the Bronze Age to Nabonidus and its place in the patriarchal traditions.
