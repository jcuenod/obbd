editorial:
  author_notes:
  - >-
    Abdi-Heba of Jerusalem writes that the king "has placed his name in the land of Jerusalem
    forever" (EA 287:60-63; cf. EA 288). This is the classic Akkadian parallel to šuma šakānu,
    a phrase also used of inscribed monuments claiming territory or a building.
  - >-
    The older view (von Rad; Weinfeld; Mettinger) reads Name theology as a deliberate "demythologizing"
    correction of the idea that YHWH dwells physically in the temple. Richter, The Deuteronomistic
    History and the Name Theology (BZAW 318, 2002), argues that the idiom is a formula of
    ownership and conquest. Present both. Wilson, Out of the Midst of the Fire (1995), also
    challenges the abstraction thesis.
  - >-
    Connect the formula to centralization (Deut 12) and to the question of whether "the place"
    meant a single sanctuary from the start.
