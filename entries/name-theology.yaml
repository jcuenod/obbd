id: name-theology
title: Name Theology ("to Place His Name There")
aliases: [Shem theology, to place his name there]
type: concept
cultures: [hebrew, canaanite, mesopotamian]
scope: >-
  The Deuteronomic and Deuteronomistic formulas by which YHWH chooses a place "to put his
  name there" or "to make his name dwell there", their relation to Akkadian šuma šakānu, and
  the debate over whether they express an abstract theology of divine presence or a claim
  of ownership.
