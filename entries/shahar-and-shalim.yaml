  rel: language
  note: Helel ben Shahar, 'Day Star, son of Dawn'
- ref: Ps 139:9
  rel: imagery
  note: '''Wings of the dawn'' (kanpe-šaḥar)'
- ref: Job 3:9
  rel: imagery
  note: '''Eyelids of the dawn'' personified'
- ref: Job 41:18
  rel: imagery
  note: Leviathan's eyes like the eyelids of dawn (MT 41:10)
- ref: Ps 110:3
  rel: imagery
  disputed: true
  note: '''From the womb of the dawn'' (MT obscure; mišḥār)'
- ref: Gen 14:18
  rel: language
