editorial:
  author_notes:
  - >-
    The derivation of (Uru)salim/Jerusalem as "foundation of Shalem" is widely held but not
    certain; present it with caution, and treat theophoric readings of Absalom and Solomon
    as speculative.
  - >-
    KTU 1.23 combines a liturgical frame with myth; whether it is a sacred-marriage rite or
    royal ritual is debated.
  - >-
    Cite Ratner and Zuckerman (HUCA 57, 1986) for the collapse of the old reading "seethe
    a kid in milk" at line 14.
  - >-
    In Isa 14:12 the closer mythic background may be Athtar or Venus (Helel) rather than Shahar
    himself; Shahar is the father in the epithet.
  sources_to_check:
