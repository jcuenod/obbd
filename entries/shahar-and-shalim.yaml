id: shahar-and-shalim
title: Shahar and Shalim (Dawn and Dusk)
aliases: [Dawn and Dusk, Birth of the Gracious Gods, Shachar, Shalem]
type: deity
cultures: [ugaritic, canaanite]
scope: >-
  Shahar (Dawn) and Shalim (Dusk), twin deities whose conception by El is told in the Ugaritic
  ritual-mythic text KTU 1.23 ("The Birth of the Gracious and Beautiful Gods"). The entry
  covers both deities, the text, and biblical echoes of Shahar and Shalem; the kid-in-milk
  question is treated under its own entry.
