  note: Royal madness and seven 'times' away from society; cf. Nabonidus at Tayma (MT 4:25-34)
- ref: Dan 5:2, 11, 18
  rel: attests
  note: Belshazzar called son of Nebuchadnezzar, though historically son of Nabonidus
- ref: Dan 5:7, 16, 29
  rel: setting
  note: '''Third ruler in the kingdom'', perhaps reflecting Belshazzar''s secondary rank'
- ref: Bar 1:11-12
  rel: attests
  note: Belshazzar named as son of Nebuchadnezzar
- ref: Isa 46:1-2
  rel: setting
  note: Babylonian gods carried off at the fall of Babylon
