editorial:
  author_notes:
  - >-
    The Prayer of Nabonidus (4Q242) describes a king afflicted for seven years at Tayma and
    healed by a Jewish diviner; it is the main evidence that Dan 4 draws on Nabonidus traditions.
  - >-
    Cyrus's propaganda (Cyrus Cylinder, Verse Account) portrays him as impious; treat it as
    hostile.
  - His mother Adad-guppi's autobiography from Harran illuminates his devotion to Sin.
