id: demotic-wisdom
title: Demotic Instructions (Ankhsheshonqy, Papyrus Insinger)
aliases: [Instruction of Ankhsheshonqy, Onchsheshonqy, Papyrus Insinger, Great Demotic Wisdom
    Book]
