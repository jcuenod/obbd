  - J. T. Sanders, Ben Sira and Demotic Wisdom (SBLMS 28, 1983)
  - >-
    S. R. K. Glanville, The Instructions of ʿOnchsheshonqy (Catalogue of Demotic Papyri in
    the British Museum 2, 1955)
