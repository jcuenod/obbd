  circa: true
  display: c. 400 BCE–100 CE
scope: >-
  Late Egyptian wisdom in the Demotic script, chiefly the Instruction of Ankhsheshonqy (with
  its frame story of a priest writing maxims for his son from prison) and the "Great Demotic
  Wisdom Book" of Papyrus Insinger. Their one-line sayings and reflections on fate and divine
  retribution make them contemporaries and comparanda of Ecclesiastes, Ben Sira and late Proverbs.
passages:
- ref: Prov 10:1-22:16
  rel: form
  note: Collections of self-contained one-line sayings, the format of Ankhsheshonqy
- ref: Eccl 11:1
  rel: parallel
  note: >-
    'Send out your bread upon the waters'; cf. Ankhsheshonqy 'Do a good deed and throw it
    in the river'
- ref: Eccl 9:11
  rel: concept
  disputed: true
  note: Time and chance happen to all; cf. Demotic fate (šꜣy) and fortune
- ref: Sir 11:14
  rel: concept
  note: Good and bad, poverty and wealth come from the Lord; cf. Papyrus Insinger's refrains
- ref: Tob 4:3-19
  rel: form
  note: A father's instructions to his son in a moment of crisis; cf. Ankhsheshonqy's frame
