editorial:
  author_notes:
  - >-
    Manuscripts: Ankhsheshonqy is P. British Museum EA 10508 (Ptolemaic, probably 1st c. BCE);
    Papyrus Insinger is in Leiden (1st c. CE), with parallel copies elsewhere. Composition
    dates are uncertain (Late Period to Ptolemaic). Give manuscript and composition dates
    separately.
  - >-
    Lichtheim (1983) stressed that the Demotic texts share an 'international' wisdom culture
    with Greek gnomic literature, Ahiqar and Ben Sira. Sanders (1983) argued that Ben Sira
    knew a version of Papyrus Insinger's teaching. Present this as a proposal.
  - >-
    The Eccl 11:1 and Ankhsheshonqy parallel is the most often quoted. Check the column and
    line reference in Lichtheim's translation before citing it.
  - >-
    Note differences from earlier Egyptian instructions: monostich sayings, a peasant and
    village setting in Ankhsheshonqy, and Insinger's paradoxes on fate and fortune, which
    echo Qohelet's questions.
  sources_to_check:
  - AEL 3:159-217
  - >-
