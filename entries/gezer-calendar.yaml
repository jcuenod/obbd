editorial:
  author_notes:
  - >-
    Found in 1908 by R. A. S. Macalister. It came from a disturbed context, so the 10th-century
    date rests on palaeography.
  - >-
    The language and script are debated: early Hebrew, Phoenician, or a southern Canaanite
    dialect. The forms in -w (yrḥw) may be duals or suffixed forms.
  - >-
    Its purpose is uncertain: a scribal exercise (the tablet is a palimpsest), a mnemonic
    song, or an administrative schedule. Do not present it as an Israelite cultic calendar.
  - >-
    The marginal name ʾbyw (Abijah?) is sometimes read as the scribe's signature. The reading
    is uncertain.
