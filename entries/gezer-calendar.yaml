id: gezer-calendar
title: Gezer Calendar
type: artifact
cultures: [hebrew]
date:
  from: -950
  to: -950
  circa: true
  display: c. 950 BCE
scope: >-
  A small limestone tablet from Gezer (found 1908) listing the months of the agricultural
  year by their main tasks, from ingathering and sowing to summer fruit. It is one of the
  earliest substantial alphabetic inscriptions from the southern Levant.
passages:
- ref: Exod 23:16
  rel: practice
  note: Festival of ingathering (ʾāsîp) at the year's end; the calendar opens with ʾsp
- ref: Exod 34:22
  rel: language
  note: Ingathering 'at the turn of the year' (tĕqûpat haššānâ)
- ref: Deut 16:9-15
  rel: practice
  note: Harvest festivals timed by the agricultural cycle
- ref: Ruth 1:22; 2:23
  rel: setting
  note: Barley harvest followed by wheat harvest, as in the calendar's sequence
- ref: Amos 7:1
  rel: language
  note: leqeš, the late growth; cf. the calendar's 'two months of late sowing' (lqš)
- ref: Lev 25:3-4
  rel: language
  note: zāmar 'to prune' vines; cf. the calendar's month of pruning (zmr)
- ref: Amos 8:1-2
  rel: language
  note: qayiṣ 'summer fruit', the calendar's final month (qṣ), used in a wordplay with 'end'
related: [gezer, agriculture-and-farming, festivals-agricultural, calendars-and-month-names,
