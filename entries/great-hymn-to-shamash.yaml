editorial:
  author_notes:
  - >-
    The main copies are from Ashurbanipal's library at Nineveh (7th c.), with others from
    elsewhere. Composition is probably earlier but cannot be dated closely, which is why no
    date is given here.
  - >-
    Sarna's study of Ps 19 against sun-god literature (1967) is the classic case: the joining
    of solar praise (vv. 1-6) and torah (vv. 7-14) makes sense against Šamaš as lord of light
    and of justice. Do not claim that Ps 19:1-6 was a hymn to the sun god.
  - >-
    Note the hymn's social range (merchants, travellers, fishermen, the captive, the sick),
    which gives a concrete picture of what 'justice' meant in daily life.
  - >-
    Distinguish this hymn from the Egyptian Great Hymn to the Aten, often cited for Ps 104.
    The two are frequently confused in popular literature.
  sources_to_check:
