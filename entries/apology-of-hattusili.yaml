editorial:
  author_notes:
  - >-
    Hoffner (1975) and McCarter (JBL 1980) set out the genre comparison; Knapp (2015) widens
    it to first-millennium apologies (e.g. Esarhaddon's Nineveh A, Kilamuwa), which narrows
    the chronological gap with Samuel.
  - The comparison concerns genre and propaganda, not Hittite literary influence on Samuel.
