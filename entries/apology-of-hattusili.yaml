id: apology-of-hattusili
title: Apology of Ḫattušili III
aliases: [Apology of Ḫattušili III, Autobiography of Hattusili]
type: text
cultures: [hittite]
date:
  from: -1267
  to: -1237
  circa: true
  display: c. 1267–1237 BCE
scope: >-
  The self-justifying account by which Ḫattušili III, who deposed his nephew Urḫi-Teššub,
  presents his rise as guided by the goddess Šaušga (Ishtar) of Šamuḫa and his seizure of
  the throne as forced and lawful. It is the standard example of the ANE royal "apology" genre
  compared with the story of David's rise.
