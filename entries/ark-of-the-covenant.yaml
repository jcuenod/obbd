editorial:
  author_notes:
  - >-
    Separate the conceptions: the Deuteronomistic container of the tablets, the Priestly kappōret
    with cherubim, and the older war palladium (Num 10:35-36; 1 Sam 4).
  - >-
    Close formal parallels are Egyptian portable chests and barque shrines carried on poles
    (e.g. Tutankhamun's Anubis shrine). Hittite and Egyptian treaties were deposited before
    the gods, which bears on Deut 10:1-5.
  - >-
    1 Sam 4–6 should be read alongside the Mesopotamian capture and return of divine statues.
    Rost's 'Ark Narrative' hypothesis remains debated.
  - >-
    The ark's fate is unknown. Note recent proposals tied to Kiriath-jearim excavations as
    hypotheses, and do not engage the popular 'lost ark' claims (Ethiopia, etc.) beyond a
    mention.
