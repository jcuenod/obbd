id: ark-of-the-covenant
title: Ark of the Covenant
aliases: [Ark of YHWH, Ark of God, Ark of the testimony]
type: realia
cultures: [hebrew, egyptian]
scope: >-
  The portable wooden chest of Israelite tradition, variously presented as the container of
  the covenant tablets, the footstool of YHWH enthroned on the cherubim, and a war palladium.
  The entry covers its descriptions and history in the biblical traditions, and its comparanda
  in Egyptian processional chests and barques and in ancient Near Eastern treaty deposits.
