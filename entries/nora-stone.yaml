editorial:
  author_notes:
  - >-
    The text is short and difficult. Whether btršš means 'in Tarshish', and whether Tarshish
    then lies in Sardinia or elsewhere (Tartessos, Spain), is debated. Give the main interpretations
    (e.g. Cross 1972).
  - >-
    The stone is important evidence for Phoenician presence in the west by c. 800, which is
    relevant to the biblical 'ships of Tarshish' and to Tyrian trade in Ezek 27.
  - Do not use the stone alone to locate Tarshish.
