  circa: true
  display: c. 825–780 BCE
scope: >-
  A Phoenician inscription on a stone found in 1773 at Nora in southern Sardinia. It is one
  of the earliest Phoenician texts from the western Mediterranean and contains the earliest
  attestation of the name Sardinia (šrdn). Its first line is often read as mentioning Tarshish
  (trš).
