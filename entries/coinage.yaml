editorial:
  author_notes:
  - >-
    Coinage was invented in Lydia and Ionia around 600 BCE (electrum). Darius I introduced
    the gold daric and silver siglos. Before the Persian period, biblical 'shekels' and 'pieces
    of silver' are weighed metal, not coins.
  - >-
    Small silver Yehud coins (4th century) carry legends such as yhd and the name of a governor
    Yehezqiyah. Samarian coins are contemporary. Hasmonean bronze prutot follow; the first
    Hasmonean issuer is debated.
  - >-
    The Tyrian shekel (minted 126 BCE-66 CE) was the required currency for the temple tax
    (m. Bekhorot 8:7). It is the probable coin of Matt 17:27 and 26:15.
  - >-
    Darkĕmônîm (Ezra 2:69; Neh 7) is probably Greek drachma rather than daric. Note the debate.
  sources_to_check:
  - Meshorer, A Treasury of Jewish Coins (2001)
