editorial:
  author_notes:
  - >-
    Kramer (JAOS 1968) read the Nudimmud spell as a lost golden age of one language ended
    by Enki's confusion of tongues; Alster and Vanstiphout read it as a future-oriented incantation
    in which Enki will unify speech (or as acknowledging existing diversity). Present it as
    debated; do not call it a 'Sumerian Tower of Babel'.
  - There is no tower in the text; the Babel connection lies only in the one-language motif.
  - >-
    Enmerkar is in the Sumerian King List as a king of Uruk; the poem is preserved in Old
    Babylonian copies and probably composed in the Ur III period.
  sources_to_check:
