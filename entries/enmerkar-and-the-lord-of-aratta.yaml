scope: >-
  A Sumerian epic poem about the contest between Enmerkar of Uruk and the lord of the distant
  land of Aratta, notable for the "spell of Nudimmud" passage on a time when all humanity
  spoke one language, and for its tale of the invention of writing on clay.
passages:
- ref: Gen 11:1-9
  rel: parallel
  disputed: true
  note: '''Spell of Nudimmud'': once all people addressed Enlil in one tongue; Enki alters
    speech'
- ref: Gen 10:10
  rel: setting
  note: Uruk (Erech), Enmerkar's city, in Nimrod's kingdom
