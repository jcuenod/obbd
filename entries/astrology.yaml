editorial:
  author_notes:
  - >-
    Distinguish the state-oriented celestial omens of Enuma Anu Enlil, attested in Neo-Assyrian
    scholarly reports and letters (SAA 8; SAA 10), from personal horoscopy. The earliest Babylonian
    horoscopes date to the late 5th century BCE.
  - >-
    The term "Chaldean" (kaśdîm) became a professional term for astrologer in Hellenistic
    usage. This is relevant to Daniel's date and setting.
  - >-
    Avoid astronomical speculation about the star of Matt 2 (conjunctions, comets, novae).
    Focus on the magi as Persian or Babylonian court experts in the Greco-Roman imagination.
  - >-
    The reading of Gen 1:14-18 as deliberate demotion of astral deities is common but disputed.
    Mark it accordingly.
  sources_to_check:
  - SAA 8
  - SAA 10
  - Francesca Rochberg, The Heavenly Writing (2004)
