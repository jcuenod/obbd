editorial:
  author_notes:
  - >-
    Survey the Mesopotamian sources: the Sumerian city laments (gods leave their cities),
    the Marduk Prophecy (Marduk's journeys to Hatti, Assyria and Elam), Esarhaddon's Babylon
    inscriptions (Marduk's anger, seventy years reduced to eleven), Erra and Išum, and the
    Cyrus Cylinder (Marduk angered by Nabonidus chooses Cyrus). The Mesha Stele (Chemosh 'angry
    with his land') shows the same logic in the Levant.
  - >-
    Block's studies of Ezekiel's adaptation of the motif are the standard starting point.
    Note the difference: in Ezekiel there is no statue to remove, so the kābôd departs; and
    YHWH leaves by choice in judgment, not because he is defeated.
  - >-
    Miller and Roberts (1977) read the ark narrative against Mesopotamian capture-and-return
    accounts. Their reading is widely followed, though the date of the narrative is debated.
  - >-
    Distinguish the motif (divine anger and departure) from the practice (removal of statues).
    Ancient sources often merge them: a statue taken as booty can be described as the god
    'going' to the enemy.
  sources_to_check:
  - D. I. Block, The Gods of the Nations (2nd ed. 2000)
  - >-
    D. I. Block, 'Divine Abandonment: Ezekiel's Adaptation of an Ancient Near Eastern Motif,'
    in M. S. Odell and J. T. Strong, eds., The Book of Ezekiel (SBLSymS 9, 2000)
  - P. D. Miller Jr. and J. J. M. Roberts, The Hand of the Lord (1977)
  - >-
    J. F. Kutsko, Between Heaven and Earth: Divine Presence and Absence in the Book of Ezekiel
    (2000)
  - M. Cogan, Imperialism and Religion (SBLMS 19, 1974)
