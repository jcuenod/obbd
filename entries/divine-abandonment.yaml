id: divine-abandonment
title: Divine Abandonment and Captured Divine Images
aliases: [departure of the deity, divine wrath and abandonment, godnapping]
type: concept
cultures: [hebrew, babylonian, assyrian]
scope: >-
  The ancient Near Eastern motif in which an angry deity abandons his city, temple or land,
  leaving it open to enemies, and later relents and returns. It explains defeat in Mesopotamian
  laments, the Marduk Prophecy, Esarhaddon's Babylon inscriptions and the Mesha Stele, and
  shapes Ezekiel's departure and return of the glory. The making and capture of cult statues
  are treated under cult-images.
