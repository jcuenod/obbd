id: bench-tombs
title: Bench Tombs and Burial Practices
aliases: [Judahite bench tombs, Rock-cut tombs]
type: realia
cultures: [judahite]
scope: >-
  The rock-cut family tombs of Iron Age Judah, with burial benches, headrests and repositories
  for bones, and the burial practices and beliefs they reflect. The entry covers biblical
  burial language, major tomb groups (Jerusalem, Ketef Hinnom, Silwan, Khirbet el-Qom), and
  grave goods.
