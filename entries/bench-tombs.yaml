editorial:
  author_notes:
  - >-
    E. Bloch-Smith, Judahite Burial Practices and Beliefs about the Dead (1992), is the standard
    synthesis. Typical features are benches with headrests (some in Hathor-wig shape at St.
    Étienne), a repository pit, and grave goods such as lamps, juglets, jewellery and amulets.
  - >-
    The repository of collected bones is often linked to 'gathered to his people/fathers'.
    The link is plausible but should not be overstated.
  - >-
    Bench tombs were for families who could afford rock-cut tombs. Many people were buried
    in simple graves (Jer 26:23).
  - >-
    Distinguish these tombs from the later loculus (kokh) tombs and ossuary burial of the
    Second Temple period.
