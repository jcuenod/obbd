editorial:
  author_notes:
  - >-
    French excavations (Dieulafoy from 1884, de Morgan from 1897, and later teams) recovered
    Mesopotamian monuments, including the Code of Hammurabi stele and Naram-Sin's victory
    stele, carried off by the Elamite king Shutruk-Nahhunte in the twelfth century.
  - >-
    Darius I built a palace and Apadana. The glazed-brick friezes (archers, lions) and the
    foundation charter (DSf), which lists materials and craftsmen from across the empire,
    are key evidence.
  - >-
    Esther's court details mix authentic Persian colouring with literary invention. Avoid
    using the palace to 'confirm' the narrative.
  - The tradition of the 'Tomb of Daniel' at Shush is medieval.
  sources_to_check:
  - Perrot (ed.), The Palace of Darius at Susa (2013)
