title: Susa (Shushan)
aliases: [Shushan, Shush]
type: site
cultures: [elamite, persian]
scope: >-
  The Elamite capital in southwestern Iran, later an Achaemenid royal residence where Darius
  I built a palace and audience hall. Covers its long history, the Mesopotamian monuments
  taken there as booty, the Achaemenid palace, and its setting in Nehemiah, Esther and Daniel.
