id: dream-stele
title: Dream Stele of Thutmose IV
aliases: [Sphinx Stele, Dream Stela of Thutmose IV]
type: artifact
cultures: [egyptian]
date:
  from: -1400
  to: -1400
  circa: true
  display: c. 1400 BCE
scope: >-
  A granite stele set up between the paws of the Great Sphinx at Giza in year 1 of Thutmose
  IV. It tells how the prince, resting in the Sphinx's shadow, dreamed that the god Horemakhet-Khepri-Re-Atum
  promised him the kingship if he cleared the encroaching sand. It is an example of royal
  legitimation through a divine dream.
