editorial:
  author_notes:
  - >-
    Explain the political function. Thutmose IV may not have been the designated heir, and
    the stele legitimates his accession (debated).
  - >-
    Siegfried Herrmann's thesis that 1 Kgs 3 and 2 Sam 7 follow the Egyptian Königsnovelle
    is influential but contested. Present it as a hypothesis.
  - >-
    The Gibeon dream (1 Kgs 3) is often discussed as incubation. Note the uncertainty, and
    compare Mesopotamian royal dreams (e.g., Gudea) as well as Egyptian ones.
