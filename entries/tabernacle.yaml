editorial:
  author_notes:
  - >-
    Wellhausen saw the Priestly tabernacle as a retrojection of the Jerusalem temple. Present
    this view alongside work showing that portable tent shrines are well attested: Mari large
    tent (D. Fleming), El's tent dwelling at Ugarit, the Timna tent shrine, Egyptian royal
    campaign tents (M. Homan).
  - >-
    Homan's comparison of the tabernacle's layout with Ramesses II's Kadesh camp is suggestive
    but debated. Do not present it as proof of an early date.
  - >-
    Distinguish the Priestly mishkan at the camp's centre from the non-Priestly oracle tent
    outside the camp (Exod 33:7-11; Num 11:16-30; 12:4-5).
  - >-
    Note the literary parallels to creation (seven speeches in Exod 25–31; Exod 39:32, 43
    and 40:33 echo Gen 2:1-3).
