scope: >-
  The portable sanctuary of Exodus–Numbers: the Priestly mishkan and the tent of meeting.
  The entry covers the Priestly descriptions, the non-Priestly oracle tent, the question of
  historicity, and ancient Near Eastern tent shrines and royal campaign tents.
