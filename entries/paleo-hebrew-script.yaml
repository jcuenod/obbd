id: paleo-hebrew-script
title: Paleo-Hebrew Script and Hebrew Epigraphy
aliases: [Old Hebrew script, Hebrew epigraphy]
type: concept
cultures: [hebrew]
scope: >-
  The national script of Israel and Judah, derived from the Phoenician alphabet and distinct
  by the 9th to 8th centuries, and the field of Hebrew epigraphy built on it. The entry covers
  its replacement by the Aramaic-derived square script and its survival in Qumran manuscripts,
  Hasmonean and Revolt coinage, and the Samaritan script.
