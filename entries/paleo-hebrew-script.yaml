editorial:
  author_notes:
  - >-
    Present the main typological and palaeographic dating framework (Cross, Naveh, Rollston)
    and its limits. Palaeography gives ranges, not precise dates.
  - >-
    Note the distinctive Hebrew features (e.g. the shapes of kaph and mem), the use of hieratic
    numerals, and the regional north/south differences.
  - >-
    Scribes kept the old script for the divine name in some Qumran manuscripts and for whole
    scrolls (e.g. paleo-Leviticus). Explain the ideological uses of the script in the Hasmonean
    and Bar Kokhba periods.
  - >-
    Link to the literacy debate (Rollston, Schniedewind) without overclaiming widespread literacy.
  sources_to_check:
