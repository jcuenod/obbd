editorial:
  author_notes:
  - >-
    The acrostic yields roughly 'I, Saggil-kīnam-ubbib, the incantation priest, am adorant
    of the god and the king'; a later tradition places this scholar under Nebuchadnezzar I
    or Adad-apla-iddina (c. 11th c.).
  - >-
    Resolution differs from Job: the friend finally concedes that the gods gave humans a propensity
    to lie and wrong, and the sufferer appeals for mercy; there is no theophany.
  - >-
    The dialogue form and arguments are the closest Mesopotamian analogue to Job 3-31, but
    the relationship is generic; avoid claims of dependence.
