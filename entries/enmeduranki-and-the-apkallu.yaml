id: enmeduranki-and-the-apkallu
title: Antediluvian Sages (Apkallu) and Enmeduranki
aliases: [Apkallū, Seven Sages, Enmeduranna]
type: concept
cultures: [babylonian, mesopotamian]
scope: >-
  The Mesopotamian traditions of the seven antediluvian sages (apkallū) who brought the arts
  of civilisation to humankind, and of Enmeduranki, the antediluvian king of Sippar to whom
  the gods revealed the secrets of divination. These form the main background proposed for
  the figure of Enoch and for the Watchers' teaching in 1 Enoch.
passages:
- ref: Gen 5:21-24
  rel: parallel
  note: >-
    Seventh antediluvian who 'walked with God'; Enmeduranki, seventh king, admitted to divine
    secrets
- ref: Gen 4:17-22
  rel: concept
  note: >-
    Antediluvian culture-bringers (city, herding, music, metalwork); cf. the sages' civilising
    role
- ref: Gen 6:1-4
  rel: concept
  disputed: true
  note: Mighty men of old; post-flood apkallū of partly divine descent
- ref: 1En 6:1-8:4
  rel: parallel
  note: 'Watchers teach forbidden arts: metallurgy, cosmetics, spells, astrology'
- ref: 1En 72-82
  rel: concept
  note: Enoch receives celestial and calendrical knowledge, cf. Enmeduranki's divinatory lore
- ref: Jub 4:17-19
  rel: concept
  note: Enoch first to learn writing and record the signs of heaven
related: [apkallu-reliefs, adapa, sumerian-king-list, first-enoch, nephilim, divination, extispicy]
media: []
