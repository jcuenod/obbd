editorial:
  author_notes:
  - >-
    Key sources: Lambert's edition of the Enmeduranki text (JCS 21, 1967); the Bīt mēseri
    incantation series listing the sages, including Utuabzu 'who ascended to heaven' (Borger
    1974); the Seleucid 'Uruk List of Kings and Sages'; and Berossus on Oannes and the sages.
  - >-
    The Enoch-Enmeduranki/Utuabzu connection is widely accepted (VanderKam, Kvanvig) as reflecting
    Judean contact with Babylonian scholarly lore in the exilic to Hellenistic periods; specifics
    of transmission are debated.
  - >-
    The sages' role is positive in Mesopotamia, while 1 Enoch makes the Watchers' teaching
    illicit; this inversion is often read as polemic (Kvanvig; Annus).
  sources_to_check:
  - 'W. G. Lambert, ''Enmeduranki and Related Matters,'' JCS 21 (1967): 126-138'
  - >-
    R. Borger, 'Die Beschwörungsserie Bīt mēseri und die Himmelfahrt Henochs,' JNES 33 (1974):
    183-196
  - J. C. VanderKam, Enoch and the Growth of an Apocalyptic Tradition (CBQMS 16, 1984)
  - H. S. Kvanvig, Roots of Apocalyptic (WMANT 61, 1988)
