- ref: Mark 1:16-20
  rel: realia
  note: Fishermen, nets, boat, and hired men on the lake
- ref: Mark 4:35-41
  rel: realia
  note: Boat crossing in a storm; Jesus asleep on the cushion in the stern
- ref: Luke 5:1-11
  rel: realia
  note: Two boats working together; nets strained by the catch
- ref: John 21:1-11
  rel: realia
  note: Night fishing from a boat with a net
- ref: Matt 13:47-48
  rel: realia
  note: Dragnet (sagēnē) hauled ashore
