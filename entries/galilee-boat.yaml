editorial:
  author_notes:
  - There is no connection to Jesus or the disciples. 'Jesus Boat' is a popular nickname.
  - >-
    Its construction (mortise-and-tenon, many repairs, mixed timbers) indicates long use and
    limited resources. Its capacity (about 15 people) can be compared with Josephus's lake
    boats (War 2.635-641; 3.522-531).
  - Dating by radiocarbon, pottery, and construction technique.
  sources_to_check:
