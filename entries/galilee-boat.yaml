id: galilee-boat
title: Galilee Boat ("Jesus Boat")
aliases: [Jesus Boat, Sea of Galilee Boat, Ginosar Boat]
type: artifact
cultures: [jewish, roman]
date:
  from: -100
  to: 70
  circa: true
  display: c. 100 BCE–70 CE
scope: >-
  The hull of a wooden fishing boat (about 8.2 m long) recovered from the mud of the Sea of
  Galilee near Ginosar in 1986, dated to the 1st century BCE to 1st century CE. It is the
  type of vessel presupposed in the Gospel fishing and lake-crossing stories.
