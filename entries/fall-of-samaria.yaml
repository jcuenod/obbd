editorial:
  author_notes:
  - >-
    Present the two main reconstructions; Tadmor's two-stage model (capture by Shalmaneser
    in 722, then Sargon's reconquest and deportations in 720) is widely followed.
  - >-
    Sargon's claim of 27,280/27,290 deportees and his statement that he 'repopulated' Samaria
    underlie 2 Kgs 17:24.
  - >-
    Archaeology suggests continuity at Samaria and in the countryside alongside deportation;
    the 'ten lost tribes' image overstates depopulation.
  - >-
    Assyrian sources document Samarians in Assyria (chariot units, Gozan, Halah), consistent
    with 2 Kgs 17:6.
