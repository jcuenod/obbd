editorial:
  author_notes:
  - >-
    Fixed points include the Assyrian eponym list anchored by the solar eclipse of 15 June
    763 (eponymy of Bur-Saggile), Ahab at Qarqar (853), Jehu's tribute (841, Shalmaneser III's
    18th year), and Jehoiachin's capture on 2 Adar (16 March) 597 in the Babylonian Chronicle.
  - >-
    Explain the method problems. They are accession versus non-accession reckoning, spring
    (Nisan) versus autumn (Tishri) new year, coregencies, and textual variation (LXX and Lucianic
    numbers differ, especially for the Omrides).
  - >-
    Compare the main systems (Thiele; Tadmor; Galil; Hughes). Present Thiele's coregencies
    as effective but criticised as harmonising.
  - >-
    The 587 versus 586 date for Jerusalem's fall depends on calendar assumptions. State both.
  sources_to_check:
  - Thiele, The Mysterious Numbers of the Hebrew Kings (3rd ed. 1983)
  - Galil, The Chronology of the Kings of Israel and Judah (1996)
  - Millard, The Eponyms of the Assyrian Empire 910-612 BC (SAAS 2, 1994)
  - Grayson, Assyrian and Babylonian Chronicles (1975)
