id: chronology-of-kings
title: Chronology of the Kings of Israel and Judah
aliases: [Regnal chronology, Synchronisms]
type: concept
cultures: [israelite, judahite, assyrian, babylonian]
scope: >-
  The reconstruction of absolute dates for the kings of Israel and Judah from the regnal formulae
  and synchronisms of Kings and Chronicles, anchored by Assyrian, Babylonian, and Egyptian
  chronology. Covers methods (accession and calendar systems, coregencies), textual variants,
  and the main competing systems.
