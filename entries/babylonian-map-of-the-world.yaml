  circa: true
  display: c. 700–500 BCE
scope: >-
  A small clay tablet, probably from Sippar, bearing a schematic map of the world with Babylon
  at the centre and the land encircled by a 'bitter river' (marratu), beyond which lie triangular
  distant regions (nagû). Accompanying text refers to mythical beasts and legendary figures
  of the remote regions.
