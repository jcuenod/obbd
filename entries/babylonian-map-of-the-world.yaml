editorial:
  author_notes:
  - >-
    The tablet is a Late or Neo-Babylonian copy; its original composition may be somewhat
    earlier. Give the date as approximate.
  - >-
    It is a cosmographic diagram, not a practical map; the encircling ocean and outer regions
    are mythical geography (Horowitz).
  - >-
    The biblical 'circle of the earth' is likewise a disk-shaped earth or horizon, not a sphere;
    avoid apologetic readings.
  - >-
    Placing one's own capital at the centre is a common ANE perspective; compare Ezekiel's
    Jerusalem.
  sources_to_check:
