editorial:
  author_notes:
  - >-
    The Shasu of Edom report (P. Anastasi VI) and the runaway report (P. Anastasi V) show
    routine frontier administration in the eastern Delta. They illustrate the plausibility
    of the Genesis and Exodus settings but are not evidence for those events.
  - >-
    Identifying Succoth with Tjeku and Pithom with Tell er-Retabeh or Tell el-Maskhuta affects
    the dating of the Exodus geography. See the Pithom entry.
  - >-
    P. Anastasi I (Hori's letter to Amenemope) is valuable for Late Bronze Canaanite geography
    (e.g., Megiddo and its pass, Beth-shean, Joppa) and for Egyptian views of Canaan. Its
    giant-like Shasu are literary hyperbole.
  - >-
    Other miscellanies (e.g., P. Anastasi III and IV, which praise Pi-Ramesses and mention
    brickmaking) belong in the discussion but are not covered by this entry's title. Mention
    them as needed.
