  circa: true
  display: c. 1220–1190 BCE
scope: >-
  Nineteenth Dynasty scribal papyri (school miscellanies and model letters). P. Anastasi I
  is a satirical letter testing a scribe's knowledge of Canaanite routes and toponyms. P.
  Anastasi V and VI include frontier reports on escaped servants and on Shasu of Edom admitted
  to pasture in the Wadi Tumilat.
