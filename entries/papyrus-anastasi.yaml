  note: Pithom (Pr-Itm of Tjeku) named in P. Anastasi VI
- ref: Exod 14:5
  rel: parallel
  note: Escaped servants pursued past the frontier forts (P. Anastasi V); not the same event
- ref: Exod 12:37
