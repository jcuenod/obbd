editorial:
  author_notes:
  - >-
    The 'library' is a modern label for several collections in the palaces and the Nabu temple;
    tablets were also seized or copied from Babylonian scholars, especially after 648.
  - >-
    George Smith's 1872 identification of the flood story in this material sparked the Babel-Bibel
    debate; mention this history.
  - >-
    The tablets are mostly scholarly and divinatory, not literary; literary texts are a minority.
  - >-
    The excavated tablets were mixed with other Kuyunjik finds, so 'library' attributions
    need care.
  sources_to_check:
