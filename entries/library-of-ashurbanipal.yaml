id: library-of-ashurbanipal
title: Library of Ashurbanipal
type: site
cultures: [assyrian]
date:
  from: -668
  to: -612
  circa: true
  display: c. 668–612 BCE
scope: >-
  The collections of cuneiform tablets assembled at Nineveh chiefly under Ashurbanipal and
  found by Layard and Rassam in the 1850s at Kuyunjik. They preserve the standard versions
  of Gilgamesh, Enuma Elish and many omen, incantation, lexical and scholarly series, making
  them the main source for first-millennium Mesopotamian literature.
