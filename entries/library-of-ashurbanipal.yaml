- ref: Gen 1:1-2:3
  rel: parallel
  note: Enuma Elish known chiefly from Nineveh copies
- ref: Prov 25:1
  rel: practice
  note: Royal patronage of copying and collecting literature ('men of Hezekiah')
- ref: Isa 47:13
  rel: practice
  note: Astrologers and stargazers; celestial omen series collected at Nineveh
- ref: Ezra 4:10
  rel: attests
  note: Osnappar (Ashurbanipal), the king whose collections these were
- ref: Nah 2:1-3:19
  rel: setting
  note: Oracles on Nineveh, whose destruction in 612 buried the tablets (MT 2:2-3:19)
