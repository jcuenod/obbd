editorial:
  author_notes:
  - >-
    Herod built the city c. 22-10/9 BCE. Its artificial harbour (Sebastos) used hydraulic
    concrete, and a temple of Roma and Augustus dominated the harbour.
  - >-
    The promontory palace was probably later the governor's praetorium (Acts 23:35). The Pilate
    inscription (found 1961) names a Tiberieum.
  - >-
    Josephus' account of Agrippa I's death (Ant. 19) parallels Acts 12:19-23. Civil strife
    at Caesarea helped trigger the revolt of 66 CE.
  - >-
    The city became a major Christian centre (Origen, Eusebius). Keep that later history brief.
  sources_to_check:
