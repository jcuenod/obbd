editorial:
  author_notes:
  - >-
    The term is attested in Late Bronze Canaan. In EA 365 Biridiya of Megiddo reports supplying
    corvée workers (massu) to cultivate at Shunem for Pharaoh, so the institution predates
    Israel.
  - >-
    Note the internal tension between 1 Kgs 5:13-18 (an Israelite levy) and 1 Kgs 9:20-22
    (only Canaanites conscripted), and the role of corvée grievances in 1 Kgs 12.
  - >-
    The Meṣad Ḥashavyahu ostracon (late 7th century) is a harvester's petition over a confiscated
    garment. Whether he was a corvée labourer is debated. It bears on Exod 22:26-27 and Deut
    24:12-13.
  - >-
    An often-cited seal 'belonging to Pelaiah who is over the corvée' is unprovenanced. Cite
    it with caution, if at all.
  sources_to_check:
  - Moran, The Amarna Letters (1992)
  - Rainey, The El-Amarna Correspondence (HdO 110, 2015)
