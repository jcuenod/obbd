id: corvee-labor
title: Forced Labor (mas)
aliases: [Corvée, Mas, Forced labour]
type: practice
cultures: [hebrew, canaanite, egyptian]
scope: >-
  State-imposed labour service (Hebrew mas, mas ʿōbēd, sēbel) in ancient Israel and its Late
  Bronze Age Canaanite and Egyptian background. Covers the biblical portrayal of Solomon's
  levy, subject populations put to forced labour, and the role of corvée in the division of
  the kingdom.
