id: laws-of-eshnunna
title: Laws of Eshnunna
aliases: [LE, Code of Eshnunna]
type: text
cultures: [akkadian]
date:
  from: -1800
  to: -1760
  circa: true
  display: c. 1800–1760 BCE
scope: >-
  An Old Babylonian Akkadian law collection from the kingdom of Eshnunna, known chiefly from
  two tablets found at Tell Harmal. It contains the closest verbal parallel to any biblical
  law, the ruling on an ox that gores another ox.
passages:
- ref: Exod 21:35
  rel: parallel
  note: 'Ox gores ox: owners divide the live ox and the carcass (LE §53), nearly verbatim'
- ref: Exod 21:28-32
  rel: parallel
  note: Owner warned of a goring ox pays when it kills a person (LE §§54-55)
- ref: Exod 22:2-3
  rel: parallel
  note: Thief in a house at night may be killed; by day penalty differs (LE §§12-13) (MT 22:1-2)
- ref: Exod 22:7-8
  rel: practice
  note: 'Lost deposit: depositary clears himself by oath before the god (LE §§36-37) (MT 22:6-7)'
- ref: Deut 22:25-27
  rel: parallel
  note: 'Rape of a betrothed girl: death for the man (LE §26)'
- ref: Deut 22:8
  rel: practice
  note: 'Owner liable for deaths from a known structural hazard (LE §58: tottering wall)'
related: [goring-ox, code-of-hammurabi, ane-law-collections, oaths-and-oath-formulas, laws-of-lipit-ishtar]
