editorial:
  author_notes:
  - >-
    Two tablets from Tell Harmal (Shaduppum) excavated in 1945-49 (Goetze's edition 1956)
    plus a fragment from Tell Haddad; usually dated a generation or two before Hammurabi,
    possibly to Dadusha's reign.
  - >-
    LE §53 and Exod 21:35 are the most celebrated verbal parallel in ANE law (Yaron; Jackson;
    Westbrook). Most explain it by shared legal-scribal tradition rather than Israelite access
    to Eshnunna; Wright posits mediation through LH.
  - >-
    The day/night burglar distinction (§§12-13) is another strong parallel and illustrates
    shared casuistic reasoning.
