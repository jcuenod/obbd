id: ugarit
title: Ugarit (Ras Shamra)
aliases: [Ras Shamra, Minet el-Beida]
type: site
cultures: [ugaritic]
scope: >-
  The Late Bronze Age port-kingdom at Ras Shamra on the north Syrian coast, destroyed c. 1185
  BCE, whose archives in several languages and scripts include the Ugaritic alphabetic literary
  texts. Covers the site, its palaces, temples and archives; the texts themselves are treated
  in ugaritic-texts and related entries.
passages:
- ref: Ps 29
  rel: parallel
  note: Storm-god hymn closely paralleled in Ugaritic Baal texts
- ref: Ps 82
  rel: concept
  note: Divine council and the 'sons of the Most High'; cf. El's assembly
- ref: Deut 32:8-9
  rel: concept
  note: Nations allotted by number of the 'sons of God' (4QDeut(j), LXX); cf. El's seventy
    sons
- ref: Isa 27:1
  rel: language
  note: Leviathan the twisting serpent; cf. Ugaritic ltn
- ref: Ezek 14:14, 20; 28:3
  rel: attests
  disputed: true
  note: Danel, perhaps the Dnil of the Aqhat epic
related: [ugaritic-texts, baal-cycle, aqhat-epic, kirta-epic, el, baal, divine-council, rephaim]
