editorial:
  author_notes:
  - >-
    French excavations since 1929 (Schaeffer, then Yon and others) have recovered archives
    in Ugaritic alphabetic cuneiform, Akkadian, Hurrian, Hittite and other languages, from
    the royal palace and private houses (e.g. Rapanu, Urtenu). The nearby Ras Ibn Hani palace
    also yielded texts.
  - >-
    Ugarit is never mentioned in the Bible. Its importance is linguistic, literary and religious,
    not historical.
  - >-
    Ugaritic texts distinguish Ugarit from 'Canaan'. Avoid presenting Ugaritic religion simply
    as 'Canaanite religion'.
  - >-
    Its final destruction (c. 1185) is linked in the late letters to enemy ships, part of
    the wider Late Bronze collapse.
  sources_to_check:
  - Yon, The City of Ugarit at Tell Ras Shamra (2006)
  - Watson and Wyatt (eds.), Handbook of Ugaritic Studies (1999)
