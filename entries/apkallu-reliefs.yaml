editorial:
  author_notes:
  - >-
    Wiggermann's work on protective figurines established the identification of these figures
    as apkallu; present the different types and their ritual use.
  - >-
    The 'Dagon as fish-god' idea (from Hebrew dag 'fish') is a popular misconception; Dagan
    was a grain/storm deity. Use this entry to correct it.
  - >-
    The link to Gen 6:1-4 and the Enochic Watchers is real but indirect, mediated by the textual
    sage tradition (Uruk List of Kings and Sages; Berossus' Oannes); see Kvanvig and others.
  - >-
    The bucket and cone figures purify and protect; do not overinterpret the 'cone' as pollination
    of the tree.
  sources_to_check:
  - Wiggermann, Mesopotamian Protective Spirits (Cuneiform Monographs 1, 1992)
