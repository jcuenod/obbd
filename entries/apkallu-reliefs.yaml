id: apkallu-reliefs
title: Apkallu Reliefs
type: realia
cultures: [assyrian]
scope: >-
  Neo-Assyrian reliefs and buried figurines of protective apkallu sages and related genies:
  fish-cloaked figures, bird-headed (griffin) figures, and winged human figures with bucket
  and cone. The entry covers this iconography and its link to the antediluvian sages; the
  textual sage tradition is treated under its own entry.
passages:
- ref: Gen 6:1-4
  rel: concept
  disputed: true
  note: Primeval semi-divine figures; apkallu traditions compared with the sons of God
- ref: 1En 6-8
  rel: concept
  disputed: true
  note: Watchers teach forbidden arts; inverted apkallu tradition
- ref: Gen 5:21-24
  rel: concept
  note: >-
    Enoch, seventh antediluvian, compared with seventh king Enmeduranki and seventh sage Utuabzu,
    who ascended
- ref: Ezek 28:12-17
  rel: concept
  disputed: true
  note: Wise primeval figure in Eden compared with an apkallu
- ref: 1Sam 5:2-5
  rel: language
  note: Dagon; the fish-cloaked apkallu is often wrongly cited as a 'fish-god Dagon'
related: [enmeduranki-and-the-apkallu, lamassu, assyrian-sacred-tree, demons, first-enoch,
  dagon, nimrud]
