scope: >-
  The practice of circumcision in the ancient Near East: Egyptian evidence from the Old Kingdom
  onward, West Semitic and biblical evidence, and its absence among the Philistines and Mesopotamians.
  The entry also covers its transformation in Israel into an infant covenant sign.
