editorial:
  author_notes:
  - >-
    The Egyptian evidence includes the Sixth Dynasty relief in the tomb of Ankhmahor at Saqqara
    and the First Intermediate Period stela of Uha (a group circumcision). Egyptian practice
    may not have been universal, and its form is debated.
  - >-
    Herodotus (2.104) claims the Syrians of Palestine learned circumcision from the Egyptians.
    Present this as Herodotus's view, not fact.
  - >-
    Israel is distinctive in performing the rite on infants (Gen 17, P) rather than at puberty
    or marriage. Exod 4:24-26 and Gen 34 may preserve older associations with marriage.
  - >-
    The meaning of "the disgrace of Egypt" (Josh 5:9) and the translation of Jer 9:25-26 ("circumcised
    yet uncircumcised"?) are both debated. Ezekiel's consignment of Egypt to the uncircumcised
    is a deliberate insult.
  sources_to_check: ['Herodotus, Histories 2.104']
