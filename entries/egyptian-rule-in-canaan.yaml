id: egyptian-rule-in-canaan
title: Egyptian Imperial Rule in Late Bronze Canaan
aliases: [Egyptian empire in Canaan, New Kingdom imperialism in the Levant]
type: concept
cultures: [egyptian, canaanite]
date:
  from: -1550
  to: -1130
  circa: true
  display: c. 1550–1130 BCE
scope: >-
  Egyptian imperial control of Canaan in the New Kingdom, from the 18th-Dynasty conquests
  to the withdrawal under the later Ramessides. It covers vassal city-states and Egyptian
  commissioners (Amarna period), garrisons and administrative centres (Gaza, Jaffa, Beth-shean),
  the Ways of Horus, and the intensified Ramesside presence that overlapped with the earliest
  Israel.
