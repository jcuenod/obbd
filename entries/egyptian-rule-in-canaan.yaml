editorial:
  author_notes:
  - >-
    Outline the phases: 18th-Dynasty conquest and the vassal system (Thutmose III's Megiddo
    campaign; the Amarna letters with their commissioners, rabiṣu), then the 19th-20th-Dynasty
    intensification with garrisons, 'governors' residencies' and Egyptian-style material culture
    (Beth-shean, Tel Aphek, Tel Mor, Deir el-Balah, Tell el-Farʿah South), then withdrawal
    by about the reign of Ramesses VI.
  - >-
    Key monuments: Seti I's stelae from Beth-shean, the Karnak reliefs of the Ways of Horus,
    the Merneptah Stele (Ashkelon, Gezer, Yanoam, Israel), and Ramesses III and VI objects
    from Beth-shean and Megiddo.
  - >-
    Stress that the Hebrew Bible is almost silent about Egyptian rule in Canaan, even though
    it overlapped with Israel's emergence. Explain the scholarly debate over why (memory,
    genre, the date of the texts).
  - >-
    The 'Nephtoah = Merneptah' and Num 34 'Egyptian province' proposals (Naʾaman and others)
    are serious but not certain; present them as such.
  - >-
    Distinguish Egyptianization by local elites (Higginbotham) from direct Egyptian occupation;
    both models are in use.
  sources_to_check:
  - D. B. Redford, Egypt, Canaan, and Israel in Ancient Times (1992)
  - E. F. Morris, The Architecture of Imperialism (PdÄ 22, 2005)
  - >-
    C. R. Higginbotham, Egyptianization and Elite Emulation in Ramesside Palestine (CHANE
    2, 2000)
  - W. L. Moran, The Amarna Letters (1992)
