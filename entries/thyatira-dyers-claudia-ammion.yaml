scope: >-
  A marble statue base from Thyatira, dated about 50 CE, recording the dyers' honors for Claudia
  Ammion, a civic and imperial priestess praised for her lavish service as contest director.
  It documents the textile economy, civic honor, and priesthood of a city named in Acts and
  Revelation.
passages:
- ref: Acts 16:14
  rel: setting
  note: >-
    Thyatira's dyers document the city's textile economy, without identifying Lydia or proving
    her guild membership
- ref: Rev 2:18-29
  rel: setting
  note: >-
    Dyers' honors connect occupation, civic prestige, and imperial priesthood in the city
    addressed
