scope: >-
  The store city of Exod 1:11, from Egyptian Pr-Itm, "House of Atum", located in the Wadi
  Tumilat in the eastern Delta. The entry covers the competing identifications, Tell el-Maskhuta
  and Tell er-Retabeh, and what each implies for dating the exodus tradition.
