editorial:
  author_notes:
  - >-
    Naville (1883) identified Tell el-Maskhuta as Pithom from inscriptions naming Pr-Itm.
    Holladay's excavations found that the site was founded in the Saite period (c. 610, linked
    to Necho II's canal) after a Middle Bronze occupation, with no New Kingdom phase.
  - >-
    Tell er-Retabeh has a Ramesside fortress. Some (Kitchen, Hoffmeier) identify it with New
    Kingdom Pithom, with the name later transferred to Maskhuta. Recent excavations at Retabeh
    are relevant.
  - >-
    Redford argued that Exod 1:11 reflects first-millennium (Saite) geography. Present the
    dating implications even-handedly.
  - Pr-Itm of Tjeku appears in P. Anastasi VI (late 13th century).
  sources_to_check:
  - Holladay, Cities of the Delta III. Tell el-Maskhuta (1982)
  - Redford, 'Exodus I 11', VT 13 (1963)
