scope: >-
  A Phoenician-language royal inscription with relief of Kilamuwa, king of Samʾal (Zincirli),
  found in 1902. Kilamuwa contrasts his predecessors' failures with his own care for his people,
  and boasts that he 'hired' the king of Assyria against a stronger neighbour.
