editorial:
  author_notes:
  - >-
    Give the corpus and approximate dates. Ur-Nammu (ca. 2100), Lipit-Ishtar (ca. 1930), Eshnunna
    (ca. 1800), Hammurabi (ca. 1750), Hittite Laws (Old Hittite with later copies), Middle
    Assyrian Laws (tablets of the 11th century), Neo-Babylonian Laws (7th century).
  - >-
    Explain the debate over purpose. Bottéro and Kraus read the collections as scholarly or
    royal-apologetic texts, not statutory legislation, since court records almost never cite
    them. Westbrook reads them as reference works within a shared ANE 'common law'. Most scholars
    now agree they are not codes in the modern sense, so 'law collections' is the preferred
    term.
  - >-
    Alt's casuistic/apodictic distinction is still useful as description. His claim that apodictic
    law is uniquely Israelite is no longer accepted.
  - >-
    Present the current dependence debate, especially D. P. Wright's thesis that the Covenant
    Code draws directly on Hammurabi (Inventing God's Law, 2009), and Levinson's model of
    Deuteronomy as a revision of the Covenant Code.
  - >-
    Note distinctive biblical features: law as divine speech set in narrative, motive clauses,
    cultic and civil law mixed together, and the whole people addressed rather than judges.
  sources_to_check:
  - Roth, Law Collections from Mesopotamia and Asia Minor (SBLWAW 6, 2nd ed. 1997)
  - ANET 159-198
  - 'Hoffner, The Laws of the Hittites: A Critical Edition (1997)'
  - Westbrook (ed.), A History of Ancient Near Eastern Law (HdO 72, 2003)
