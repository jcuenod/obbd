editorial:
  author_notes:
  - >-
    A fiscal bulla reading 'Bethlehem' (bt lḥm), found in 2012 in the City of David, is the
    first extrabiblical Iron Age attestation. A reading of Bethlehem in Amarna letter EA 290
    has been proposed but is disputed.
  - >-
    Iron Age remains at Bethlehem itself are limited. The Church of the Nativity (Constantinian,
    rebuilt under Justinian) stands over a cave tradition attested by Justin Martyr.
  - >-
    The historicity of Jesus' birth at Bethlehem is debated among New Testament scholars,
    given the theological use of Mic 5:2 and the differences between Matthew and Luke. Present
    the views evenly.
  - >-
    Bethlehem of Zebulun (Josh 19:15) has been proposed as an alternative birthplace, but
    this is a minority view.
