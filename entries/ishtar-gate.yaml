id: ishtar-gate
title: Ishtar Gate and Processional Way
type: artifact
cultures: [babylonian]
date:
  from: -575
  to: -575
  circa: true
  display: c. 575 BCE
scope: >-
  The monumental glazed-brick gate on the north side of Babylon's inner city, built by Nebuchadnezzar
  II and dedicated to Ishtar, with the Processional Way leading to Marduk's temple. Its reliefs
  show bulls of Adad and mušḫuššu dragons of Marduk; lions line the Processional Way. A reconstruction
  stands in Berlin.
