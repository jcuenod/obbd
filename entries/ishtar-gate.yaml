editorial:
  author_notes:
  - >-
    Excavated by Robert Koldewey's German expedition (1899-1917); the Berlin reconstruction
    is of the smaller outer gate, using excavated bricks supplemented with modern ones.
  - >-
    The Processional Way was used during the akitu (New Year) festival when Marduk's statue
    was carried in procession; useful for Isa 46:1-2.
  - >-
    The gate dates to Nebuchadnezzar's later reign (c. 575), so it was standing during the
    exile.
  - >-
    The Pergamonmuseum has been closed for long-term renovation; check current display status
    before stating it.
  sources_to_check:
