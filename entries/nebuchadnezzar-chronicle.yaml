id: nebuchadnezzar-chronicle
title: Chronicle of the Early Years of Nebuchadnezzar (ABC 5)
aliases: [ABC 5, BM 21946, Jerusalem Chronicle]
type: artifact
cultures: [babylonian]
scope: >-
  The Babylonian chronicle tablet covering the first years of Nebuchadnezzar II (605-594 BCE),
  including the battle of Carchemish and the capture of "the city of Judah" on 2 Adar of his
  seventh year (March 597). It provides the most precise extra-biblical date in the history
  of Judah.
passages:
- ref: 2Kgs 24:10-17
  rel: event
  note: Capture of Jerusalem (March 597), king seized, 'a king of his own choice' appointed
- ref: 2Chr 36:10
  rel: event
  note: Jehoiachin taken to Babylon; Zedekiah made king
- ref: Jer 46:2
  rel: event
  note: >-
    Egyptian army routed at Carchemish in Nabopolassar's 21st year (605), led by crown prince
    Nebuchadnezzar
- ref: Jer 47:5-7
  rel: event
  note: Ashkelon captured and sacked (Kislev 604)
- ref: 2Kgs 24:1
  rel: event
  note: Costly Babylonian-Egyptian clash of 601, likely context of Jehoiakim's revolt
- ref: Dan 1:1-2
  rel: event
  disputed: true
  note: 605 campaign in Hatti, sometimes linked to Daniel's 'third year of Jehoiakim' siege
related: [babylonian-chronicles, nebuchadnezzar-ii, jehoiachin, battle-of-carchemish, fall-of-jerusalem-587,
  jehoiachin-ration-tablets, ashkelon]
