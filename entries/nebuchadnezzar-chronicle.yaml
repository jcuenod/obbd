editorial:
  author_notes:
  - >-
    Published by Wiseman (1956). Neither Jehoiachin nor Zedekiah is named; the city is 'the
    city of Judah' (URU ia-a-ḫu-du).
  - >-
    Use it for the chronology of 597 (Babylonian year 7, cf. Jer 52:28) against 2 Kgs 24:12
    ('eighth year'), and for accession-year reckoning.
  - >-
    The chronicle does not mention a siege of Jerusalem in 605, so Dan 1:1-2 remains historically
    problematic; present this neutrally.
  - The tablet's own date of writing is uncertain; do not assign it a firm date.
  sources_to_check:
  - A. K. Grayson, Assyrian and Babylonian Chronicles (1975), Chronicle 5
  - D. J. Wiseman, Chronicles of Chaldaean Kings (1956)
