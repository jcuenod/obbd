editorial:
  author_notes:
  - >-
    The Nimrud slabs were removed and reused by Esarhaddon, so the annals survive in fragments
    known partly from Layard's drawings; the line numbering and order were reconstructed by
    Tadmor.
  - >-
    Summary Inscription 7 lists 'Jehoahaz of Judah' among tributaries, the full form of the
    name Ahaz. Tiglath-pileser claims to have placed Hoshea on the throne after Pekah was
    overthrown.
  - >-
    The Iran Stele confirms Menahem's tribute in a dated context (c. 738), helping to fix
    Israelite chronology.
  - >-
    Alt's reading of Isa 9:1 as the three provinces of Dor, Megiddo and Gilead is influential
    but debated.
  sources_to_check:
