id: tiglath-pileser-iii-inscriptions
title: Inscriptions of Tiglath-pileser III
type: text
cultures: [assyrian]
date:
  from: -745
  to: -727
  display: 745–727 BCE
scope: >-
  The royal inscriptions of Tiglath-pileser III: annals carved on palace slabs at Nimrud (later
  dismantled and reused), summary inscriptions, and stelae such as the Iran Stele. They name
  Menahem of Samaria, Rezin of Damascus, Pekah and Hoshea, and Ahaz ('Jehoahaz') of Judah,
  and document the annexation of much of the Levant.
