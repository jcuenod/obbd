editorial:
  author_notes:
  - >-
    On Kuntillet ʿAjrud Pithos A, the two standing figures beneath the 'YHWH of Samaria and
    his asherah' inscription were once identified as YHWH and Asherah (Gilula). Most specialists
    now see Bes-type figures, and Beck argued that the drawings and the inscription are not
    one composition. Correct the popular 'portrait of YHWH and his wife'.
  - >-
    'Bes' is a convenient modern label for a type. In Egypt the iconography covers several
    related demon-gods (Aha and others), and the name Bes is late. Explain this briefly.
  - >-
    Bes's protective role (childbirth, children, sleep, against snakes) explains his popularity
    in households and on amulets in Judah and Israel. This shows Egyptian apotropaic imagery
    used by Judahites without implying worship of Bes as a major deity.
  - >-
    Note Persian-period Bes vessels and the large Bes figures in Phoenician and Cypriot contexts.
  sources_to_check:
  - P. Beck, 'The Drawings from Ḥorvat Teiman (Kuntillet ʿAjrud),' Tel Aviv 9 (1982)
  - O. Keel and C. Uehlinger, Gods, Goddesses, and Images of God in Ancient Israel (1998)
  - V. Dasen, Dwarfs in Ancient Egypt and Greece (1993)
  - C. Herrmann, Ägyptische Amulette aus Palästina/Israel (OBO 138, 1994)
  image_query: Bes amulet faience
