id: bes
title: Bes
aliases: [Bes-image, Bes figures]
type: deity
cultures: [egyptian, phoenician, judahite]
scope: >-
  The Egyptian protective dwarf god with a lion-like mane, frontal face and feathered crown,
  guardian of childbirth, sleep and the household against snakes and demons. Bes amulets,
  figurines and vessels were common in the Iron Age and Persian-period Levant, and Bes-like
  figures appear in the Kuntillet ʿAjrud drawings.
passages:
- ref: Isa 3:18-20
  rel: realia
  note: >-
    Women's ornaments include crescents and amulets (lĕḥāšîm); Bes pendants are among the
    commonest Iron Age amulets
- ref: Ps 91:5-6, 13
  rel: concept
  disputed: true
  note: 'Protection from night terrors, plague, lion and serpent: the dangers Bes warded off'
related: [kuntillet-ajrud-inscriptions, kuntillet-ajrud, amulets, demons, lamashtu-pazuzu-amulets,
  apotropaic-doorposts-and-thresholds]
