id: akkadian-prophecies
title: Akkadian Prophecies (Marduk, Šulgi, Uruk, and Dynastic Prophecies)
aliases: [Akkadian apocalypses, Marduk Prophecy, Šulgi Prophecy, Uruk Prophecy, Dynastic Prophecy,
  literary predictive texts]
type: text
cultures: [babylonian, assyrian]
date:
  from: -1100
  to: -300
  circa: true
  display: c. 1100–300 BCE
scope: >-
  A small group of Akkadian literary texts (the Marduk and Šulgi Prophecies, the Uruk Prophecy,
  the Dynastic Prophecy, and "Text A") that survey a series of unnamed future reigns as good
  or bad and usually climax in a restoring king. They are vaticinia ex eventu written to legitimate
  a ruler or cult, and they are the main Mesopotamian comparanda for the historical reviews
  in Daniel. Oracles of actual prophets belong to neo-assyrian-prophecies and mari-letters.
