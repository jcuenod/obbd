editorial:
  author_notes:
  - >-
    The texts are not prophecy in the sense of oracles delivered by prophets. They are scribal
    compositions that use predictive language (often in the omen style 'a prince will arise
    and rule for N years'). Grayson's label 'literary predictive texts' and Hallo's 'Akkadian
    apocalypses' are both found; explain why neither label is perfect.
  - >-
    Give the dates and agenda of each text separately. The Marduk Prophecy (copies from Assur
    and Nineveh) recounts the god's absences in Hatti, Assyria and Elam and predicts the king
    who will bring him back, probably Nebuchadnezzar I (12th c.). The Uruk Prophecy (late
    copy from Uruk) ends with a king from Uruk, often taken as Nebuchadnezzar II. The Dynastic
    Prophecy (Hellenistic) covers the fall of Assyria to the defeat of Darius III.
  - >-
    Lambert (1978) and others saw these texts as one background for Jewish apocalyptic, especially
    Dan 8 and 11. Present this as a typological and generic comparison, not as proof of direct
    literary dependence.
  - >-
    Note the shared logic with the Egyptian Prophecy of Neferti, a much older example of vaticinium
    ex eventu.
  sources_to_check:
  - A. K. Grayson and W. G. Lambert, 'Akkadian Prophecies,' JCS 18 (1964)
  - A. K. Grayson, Babylonian Historical-Literary Texts (1975)
  - H. Hunger and S. A. Kaufman, 'A New Akkadian Prophecy Text,' JAOS 95 (1975)
  - R. Borger, 'Gott Marduk und Gott-König Šulgi als Propheten,' BiOr 28 (1971)
  - W. G. Lambert, The Background of Jewish Apocalyptic (1978)
  - Tremper Longman III, Fictional Akkadian Autobiography (1991)
  - M. Neujahr, Predicting the Past in the Ancient Near East (BJS 354, 2012)
