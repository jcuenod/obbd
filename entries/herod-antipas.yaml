scope: >-
  Herod Antipas, son of Herod the Great and Malthace, tetrarch of Galilee and Perea from 4
  BCE until Caligula exiled him in 39 CE. He executed John the Baptist and governed the Galilee
  of Jesus' ministry, rebuilt Sepphoris and founded Tiberias. The entry covers him as known
  from the Gospels, Josephus, coins and archaeology.
