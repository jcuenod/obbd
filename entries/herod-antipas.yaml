editorial:
  author_notes:
  - >-
    Mark calls him 'King Herod', a popular usage; Matthew and Luke correct this to 'tetrarch'.
    His request to Caligula for the royal title led to his exile (Josephus, Ant. 18.240-256).
  - >-
    Josephus (Ant. 18.116-119) says Antipas imprisoned John at Machaerus and executed him
    for fear of sedition, and that people saw Antipas's defeat by Aretas IV (whose daughter
    he had divorced to marry Herodias) as divine punishment. Compare the motives and details
    with Mark. Mark names Herodias's former husband Philip, while Josephus calls him Herod.
    Josephus, not the Gospels, names the daughter Salome.
  - >-
    Coins: aniconic bronzes struck at Tiberias with a reed, palm branch or wreath and the
    legend 'of Herod the tetrarch'. Theissen's reading of Matt 11:7 in the light of the reed
    coin type is suggestive but not established.
  - >-
    Building: Sepphoris rebuilt as 'the ornament of all Galilee', and Tiberias founded c.
    19-20 CE partly over tombs (Ant. 18.36-38). How far his urbanization affected the Galilean
    village economy is debated.
  - >-
    Luke 23:6-12 (Jesus before Antipas) is found only in Luke, and its historicity is debated.
  sources_to_check:
  - H. W. Hoehner, Herod Antipas (SNTSMS 17, 1972)
  - M. H. Jensen, Herod Antipas in Galilee (WUNT 2/215, 2006)
