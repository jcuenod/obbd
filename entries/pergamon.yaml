editorial:
  author_notes:
  - >-
    Survey the candidates for 'Satan's throne' neutrally. The provincial imperial temple (29
    BCE; Tacitus, Ann. 4.37) and Pergamon's role as an administrative and judicial centre
    are most often favoured; the Altar of Zeus identification is popular but unprovable.
  - The Great Altar is now in the Pergamonmuseum, Berlin.
  - Pliny's story that parchment was invented at Pergamon (NH 13.70) is partly legendary.
  sources_to_check:
