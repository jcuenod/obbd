id: divine-council
title: Divine Council
aliases: [heavenly council, assembly of the gods, sôd YHWH]
type: concept
cultures: [ane, ugaritic, mesopotamian, hebrew]
scope: >-
  The assembly of the gods presided over by the high god, attested in Mesopotamian, Ugaritic,
  Phoenician and Aramaic sources, and in the Hebrew Bible as YHWH's heavenly court of "sons
  of God", "holy ones" and the host of heaven, to which prophets claim access.
passages:
- ref: Ps 82
  rel: concept
  note: God judges and condemns the gods in 'the council of El'
- ref: 1Kgs 22:19-23
  rel: concept
  note: Micaiah sees YHWH enthroned with the host; a spirit volunteers
- ref: Job 1:6-12
  rel: concept
  note: The sons of God present themselves; the satan among them
- ref: Isa 6:1-8
  rel: concept
  note: Throne vision; 'Who will go for us?'
- ref: Isa 40:1-8
  rel: concept
  note: Plural commands to the heavenly court (Cross)
- ref: Jer 23:18, 22
  rel: concept
  note: True prophets have stood in YHWH's council (sôd)
- ref: Ps 89:5-7
  rel: concept
