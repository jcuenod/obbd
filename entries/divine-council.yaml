editorial:
  author_notes:
  - >-
    Ugaritic terms include phr ilm, ʿdt ilm (KTU 1.15 II) and dr bn il; Mesopotamian puḫrum
    appears in Enuma Elish and Atrahasis; the Deir ʿAlla text has the šdyn assembling.
  - >-
    The Gen 1:26 plural is variously explained (council, plural of majesty, deliberation);
    council is a common critical view but not unanimous.
  - >-
    On Ps 82, note the older reading of the "gods" as human judges (and John 10:34-36) versus
    the now-dominant mythological reading.
  - >-
    Avoid popular maximalist "divine council worldview" readings that systematize all supernatural
    references into one framework; stay with mainstream scholarship (Mullen, Smith, Handy).
  sources_to_check:
