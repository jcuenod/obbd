editorial:
  author_notes:
  - >-
    Grayson's numbering (ABC 1-7 etc.) and Glassner's differ; give both. The chronicles are
    generally reliable and record Babylonian setbacks as well as victories.
  - >-
    Gaps matter: no chronicle covers 594-557, so there is no Babylonian chronicle of the 587/586
    destruction of Jerusalem.
  - >-
    The Šamaraʾin identification (ABC 1 i 28) is widely accepted and bears on whether Shalmaneser
    V or Sargon II took Samaria (see fall-of-samaria).
  sources_to_check:
  - A. K. Grayson, Assyrian and Babylonian Chronicles (TCS 5, 1975)
  - J.-J. Glassner, Mesopotamian Chronicles (SBLWAW 19, 2004)
  - D. J. Wiseman, Chronicles of Chaldaean Kings (626-556 B.C.) in the British Museum (1956)
