  circa: true
  display: c. 747–150 BCE
scope: >-
  The series of terse, year-by-year Babylonian chronicles from the reign of Nabonassar (747)
  into the Seleucid era, recording royal accessions, campaigns, and cultic events. This hub
  entry covers the series as a whole; individual chronicles important for biblical history
  have their own entries.
