id: hezekiahs-tunnel
title: Hezekiah's Tunnel
aliases: [Siloam Tunnel, Channel VIII]
type: site
cultures: [judahite]
scope: >-
  The rock-cut water channel (c. 533 m) carrying the Gihon spring's water under the City of
  David to the Siloam pool, where the Siloam Inscription was found. Covers its engineering,
  dating and relation to biblical notices of Hezekiah's water works; the inscription itself
  has its own entry.
passages:
- ref: 2Kgs 20:20
  rel: attests
  note: Hezekiah 'made the pool and the conduit and brought water into the city'
- ref: 2Chr 32:2-4
  rel: setting
  note: Springs stopped before Sennacherib's arrival
- ref: 2Chr 32:30
  rel: attests
  note: Upper outlet of Gihon channelled down to the west of the city of David
- ref: Isa 22:9-11
  rel: setting
  note: Waters of the lower pool; a reservoir between the two walls
- ref: Isa 8:6
  rel: setting
  disputed: true
  note: '''Waters of Shiloah that flow gently'', perhaps the earlier Siloam Channel'
- ref: Sir 48:17
  rel: attests
  note: Hezekiah tunnelled the rock with iron and built pools
- ref: John 9:7
  rel: setting
  note: Blind man sent to wash in the pool of Siloam
