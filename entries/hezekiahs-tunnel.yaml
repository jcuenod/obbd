editorial:
  author_notes:
  - >-
    The consensus dates the tunnel to Hezekiah's reign (late eighth century). Reich and Shukron
    argued for an earlier date (c. 800) from pottery in related fills; radiometric dating
    published by Frumkin, Shimron and Rosenbaum (Nature, 2003; verify) supported c. 700.
  - >-
    Explain the S-shaped course (following a karst fissure is the leading explanation) and
    the meeting of the two teams described in the inscription.
  - >-
    Distinguish the tunnel from the Middle Bronze spring system, Warren's Shaft and the earlier
    open Siloam Channel (Channel II).
