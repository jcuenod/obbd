scope: >-
  Ben-hadad ('son of Hadad', Aramaic Bar-Hadad), the name given in Kings to several kings
  of Aram-Damascus between c. 900 and c. 775. The entry sorts the biblical references against
  the Zakkur and Melqart stelae and the Assyrian evidence for Hadadezer and 'Mariʾ'.
