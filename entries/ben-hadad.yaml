editorial:
  author_notes:
  - >-
    Explain why the number of Ben-hadads (two or three) is disputed. Shalmaneser III names
    Hadadezer (Adad-idri) as king of Damascus in 853-845, not a Ben-hadad.
  - >-
    Only Ben-hadad son of Hazael is securely attested (Zakkur Stele). 'Mariʾ' in Adad-nirari
    III's inscriptions (e.g. Tell al-Rimah) is probably the same king under an Aramaic title
    meaning 'my lord'.
  - >-
    The Ahab war narratives (1 Kgs 20; 22) may originally have concerned Ben-hadad son of
    Hazael and Jehoahaz or Joash. This hypothesis is widely held but not consensus.
  - >-
    The Melqart Stele's Bar-Hadad is of uncertain identity. Do not use it to settle the sequence.
