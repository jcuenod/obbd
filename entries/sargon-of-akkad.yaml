- ref: Gen 10:10
  rel: attests
  note: Accad among the cities of Nimrod's kingdom in Shinar
- ref: Gen 10:8-12
  rel: parallel
  disputed: true
  note: Nimrod as first mighty empire builder; Sargon proposed among the models
