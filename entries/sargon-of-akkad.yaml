editorial:
  author_notes:
  - >-
    Dates follow the middle chronology and are approximate; his capital Akkad has not been
    located.
  - >-
    The birth legend survives in Neo-Assyrian copies and may reflect Sargon II's era; present
    the Exodus comparison as a shared exposure-legend motif rather than direct borrowing.
  - >-
    The bronze head from Nineveh is often called 'Sargon' but may represent Naram-Sin; say
    so in captions.
  - >-
    Nimrod has also been linked to Tukulti-Ninurta I or the god Ninurta; no identification
    is secure.
