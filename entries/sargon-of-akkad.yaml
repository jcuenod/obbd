  circa: true
  display: c. 2334–2279 BCE
scope: >-
  Founder of the dynasty of Akkad and of the first territorial empire in Mesopotamia. He became
  the archetypal great king of later tradition, including a first-millennium birth legend
  of his exposure in a basket on the river.
passages:
