editorial:
  author_notes:
  - >-
    The ancient tell is Tell Rumeida (Jebel er-Rumeidah), with a Middle Bronze city wall and
    Iron Age remains. A Middle Bronze cuneiform administrative tablet was found there.
  - >-
    The monumental enclosure over the traditional Machpelah (Haram el-Khalil) is Herodian
    in style and generally attributed to Herod. Mamre (Ramat el-Khalil) has a Herodian enclosure
    and a Constantinian church.
  - >-
    The 'Zoan' synchronism (Num 13:22) is a literary claim of antiquity. Tanis became a royal
    city only in the Twenty-first Dynasty.
  - >-
    Hebron was Idumean in the Persian and Hellenistic periods. The present-day setting is
    politically sensitive; handle it neutrally.
