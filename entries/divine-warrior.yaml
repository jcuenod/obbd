title: Divine Warrior
type: concept
cultures: [ane, ugaritic, assyrian]
scope: >-
  The depiction of a god as warrior who fights for his people, marches out with storm phenomena,
  and returns as king, in ancient Near Eastern texts and in biblical hymns, narratives, and
  prophetic oracles.
