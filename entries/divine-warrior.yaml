editorial:
  author_notes:
  - >-
    Cross (Canaanite Myth and Hebrew Epic, 1973) and Miller (The Divine Warrior in Early Israel,
    1973) set the classic framework of the march, the convulsion of nature, victory, and kingship
    and temple. Note the Ugaritic Baal background.
  - >-
    Ancient Near Eastern royal inscriptions routinely credit victory to the god (Ashur "goes
    before" the king; Chemosh in the Mesha Stele). Present Israel's divine war as part of
    this shared idiom.
  - >-
    Note that the motif is later turned against Israel itself (Isa 63; Lam 2) and becomes
    eschatological (Zech 14; Rev 19).
  - >-
    The institution of "holy war" (von Rad) is now widely doubted. Prefer "divine war" or
    "YHWH war".
