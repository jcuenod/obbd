id: pim-weights
title: Inscribed Weights (Shekel, Pim, Beqa, Nesef)
aliases: [Judahite inscribed weights]
type: realia
cultures: [judahite]
date:
  from: -750
  to: -586
  circa: true
  display: c. 750–586 BCE
scope: >-
  Small dome-shaped stone weights of the late Judahite monarchy, inscribed with the shekel
  sign and hieratic numerals or with the names of fractional units: nṣp (nesef), pym (pim)
  and bqʿ (beqaʿ). Their standardisation reveals a Judahite weight system based on a shekel
  of about 11.3 g.
passages:
- ref: 1Sam 13:21
  rel: language
  note: pîm, the charge for sharpening tools, explained by inscribed pim weights
- ref: Exod 38:26
  rel: language
  note: beqaʿ as half a shekel
- ref: Gen 24:22
  rel: language
  note: A gold nose-ring weighing a beqaʿ
- ref: Ezek 45:12
