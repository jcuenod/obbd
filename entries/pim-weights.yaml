editorial:
  author_notes:
  - >-
    Before the pim weights were identified (early 20th century), 1 Sam 13:21 was unintelligible.
    It is a classic case of epigraphy solving a biblical crux.
  - >-
    The use of Egyptian hieratic numerals on Judahite weights is a notable sign of Egyptian
    scribal influence.
  - >-
    Note the variation in actual weight among specimens. Biblical concern for just weights
    is borne out by real variability (Kletter).
  - Some inscribed weights on the market are forgeries. Prefer excavated examples.
  sources_to_check:
  - >-
    Kletter, Economic Keystones: The Weight System of the Kingdom of Judah (JSOTSup 276, 1998)
