id: solomons-temple
title: Solomon's Temple (First Temple)
aliases: [First Temple, House of YHWH]
type: realia
cultures: [judahite, phoenician]
scope: >-
  The First Temple in Jerusalem as a building: its tripartite plan, dimensions, side chambers,
  decoration and furnishings, its place beside the royal palace, and its history until the
  Babylonian destruction, compared with Iron Age temples of the northern Levant. The building-account
  genre, cosmic symbolism, the bronze pillars and the bronze sea have their own entries.
