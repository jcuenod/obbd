editorial:
  author_notes:
  - >-
    The Judean (Yehudaya) garrison served the Persian administration. The petition says their
    temple stood before Cambyses' conquest (525), so the colony probably goes back to the
    Saite period.
  - >-
    In 410 BCE the temple was destroyed at the instigation of the Khnum priests. The colonists
    petitioned Bagavahya (Bagohi), governor of Yehud (407). The temple was later rebuilt,
    apparently without animal sacrifice.
  - >-
    The divine names in the archive (YHW, Anat-Yahu, Eshem-Bethel, Herem-Bethel) raise debate
    over the colony's 'polytheism'. Avoid assuming the colonists knew a Pentateuch.
  - German and Swiss excavations have located the temple area next to the Khnum precinct.
  sources_to_check:
  - Porten, Archives from Elephantine (1968)
  - Porten et al., The Elephantine Papyri in English (1996)
  - TAD A4.7-A4.8
