type: site
cultures: [jewish, egyptian, persian]
scope: >-
  The island at the First Cataract opposite Aswan, home in the Persian period to a Judean
  military colony with a temple of YHW. Covers the site, the colony and its temple; the papyri
  and the temple petition have their own entries.
