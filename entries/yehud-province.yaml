editorial:
  author_notes:
  - >-
    Evidence includes Yehud stamp impressions (yhd/yhwd, some naming governors), 4th-century
    Yehud coins, the Elephantine petition (407 BCE) to Bagavahya governor of Judah, and the
    administrative centre at Ramat Raḥel. Mizpah served as the Babylonian-period centre.
  - >-
    Population estimates are small (Lipschits about 30,000; Carter lower), and Persian-period
    Jerusalem was small. State the methods behind the figures.
  - >-
    Alt's thesis that Judah was subordinate to Samaria until Nehemiah is largely abandoned
    in light of governors' seals and bullae.
  - >-
    Note the debates over the order and dates of Ezra and Nehemiah (458 vs. 398 for Ezra)
    and over Persian 'imperial authorisation' of local law (Frei).
  sources_to_check:
  - Lipschits and Vanderhooft, The Yehud Stamp Impressions (2011)
  - Carter, The Emergence of Yehud in the Persian Period (JSOTSup 294, 1999)
  - Lipschits, The Fall and Rise of Jerusalem (2005)
  - >-
    Porten and Yardeni, Textbook of Aramaic Documents from Ancient Egypt, vol. 1 (1986), A4.7
