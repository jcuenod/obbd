editorial:
  author_notes:
  - >-
    Treat the five booklets separately in date and outlook. The Similitudes are absent at
    Qumran; Enoch Seminar consensus places them before 70 CE, probably late 1st century BCE
    to early 1st century CE.
  - >-
    The Mesopotamian background of the Enoch figure (Enmeduranki, apkallu) is well established
    (VanderKam).
  - >-
    The book is canonical in the Ethiopian Orthodox Tewahedo Church. Jude's citation shows
    its authority in some early Christian circles, not 'canon' in a later sense.
  - >-
    Present the Similitudes' Son of Man in relation to the Gospels carefully: shared tradition,
    with the direction and nature of influence debated.
  sources_to_check:
