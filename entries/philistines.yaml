editorial:
  author_notes:
  - >-
    The Peleset appear in Ramesses III's Medinet Habu inscriptions (Year 8). Assyrian texts
    call them Palastu or Pilistu, the source of the name Palestine.
  - >-
    Aegean-style material culture appears from the early twelfth century, including locally
    made Mycenaean IIIC pottery, hearths, pig consumption and loom weights. This was quickly
    entangled with local Canaanite culture. Present the aDNA results from Ashkelon (2019)
    with care.
  - The 'Philistines' of Gen 21 and 26 are anachronistic.
  - >-
    Few Philistine-language texts survive. Names such as Achish (Ikausu) and the title seren
    (cf. Greek tyrannos) are suggestive. The Ekron inscription is in a Phoenician-type script
    and language.
  - >-
    Goliath's armour has been read as Aegean (Yadin) or as a composite reflecting later, perhaps
    seventh-century, hoplite equipment (Finkelstein).
  sources_to_check:
  - Dothan, The Philistines and Their Material Culture (1982)
  - Killebrew, Biblical Peoples and Ethnicity (2005)
