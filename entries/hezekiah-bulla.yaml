editorial:
  author_notes:
  - >-
    Emphasise provenance. Similar Hezekiah bullae with a winged scarab, and an Ahaz bulla,
    are known from the antiquities market. Their authenticity cannot be checked in the same
    way.
  - >-
    The change from the winged scarab (on unprovenanced bullae and lmlk handles) to the winged
    sun disk is relevant to debates about royal iconography and its possible Assyrianising
    or Egyptianising character.
  - >-
    A bulla found nearby (published 2018) reads Yeshaʿyahu followed by nbʾ[...]. 'Isaiah the
    prophet' is one possible reading. It is debated, and should be treated separately and
    cautiously.
  sources_to_check: ['Deutsch, Messages from the Past (1999)']
