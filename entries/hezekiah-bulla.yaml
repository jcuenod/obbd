id: hezekiah-bulla
title: Bulla of Hezekiah
type: artifact
cultures: [judahite]
date:
  from: -727
  to: -698
  circa: true
  display: c. 727–698 BCE
scope: >-
  A clay seal impression reading 'Belonging to Hezekiah [son of] Ahaz, king of Judah', with
  a two-winged sun disk flanked by ankh signs. It was found in 2009 in the Ophel excavations
  in Jerusalem and published in 2015. It is the first impression of a Judahite king's seal
  from a controlled excavation.
