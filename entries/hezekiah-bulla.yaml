- ref: 2Kgs 18:1
  rel: attests
  note: Hezekiah son of Ahaz, king of Judah
- ref: 1Kgs 21:8
  rel: practice
  note: Royal seal used to authenticate documents
- ref: Mal 4:2
  rel: imagery
  note: '''Sun of righteousness'' with healing in its wings (MT 3:20)'
- ref: Ps 84:11
  rel: imagery
  note: YHWH as sun and shield (MT 84:12)
related: [hezekiah, winged-sun-disk, seals-and-bullae, ahaz, lmlk-seal-impressions, jerusalem,
