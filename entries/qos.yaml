id: qos
title: Qos
aliases: [Qaus, Qaush, Kos]
type: deity
cultures: [edomite, arabian]
scope: >-
  Qos (Qaus), the national god of Edom, known from Assyrian royal inscriptions, Edomite theophoric
  names and inscriptions, and later Nabataean and Idumean sources. He is never named in the
  Hebrew Bible apart from a theophoric name.
passages:
- ref: Ezra 2:53
  rel: language
  note: Barkos ('son of Qos') among returning temple servants
- ref: Neh 7:55
  rel: language
  note: Barkos in the parallel list
- ref: 2Chr 25:14-15
  rel: attests
  note: Amaziah worships 'the gods of the people of Seir'
- ref: Deut 33:2
  rel: concept
  disputed: true
  note: YHWH comes from Seir; southern origins near Edom
- ref: Judg 5:4
  rel: concept
  disputed: true
  note: YHWH marches from Seir and the field of Edom
related: [edomites, yhwh-origins, bozrah, nabataeans, petra-and-sela, kuntillet-ajrud-inscriptions]
