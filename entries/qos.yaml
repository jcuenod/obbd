editorial:
  author_notes:
  - >-
    Assyrian sources name Edomite kings Qaus-malaka (Tiglath-pileser III) and Qaus-gabri (Esarhaddon,
    Ashurbanipal).
  - >-
    The biblical silence about Qos, alongside texts placing YHWH's origin in Seir/Edom, is
    used in the southern-origins debate; present any Qos-YHWH relationship as speculative.
  - >-
    Horvat Qitmit (Negev) has Qos inscriptions, and the Horvat ʿUza ostracon is reported to
    contain a blessing by Qos; verify details.
  - >-
    Qos survives into the Nabataean period (Khirbet et-Tannur) and among Idumeans (Josephus,
    Ant. 15.253 on Costobarus's priestly ancestors of Koze); verify the Josephus reference.
  sources_to_check:
