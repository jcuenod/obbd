editorial:
  author_notes:
  - >-
    rkb ʿrpt is a standing epithet of Baal in the Ugaritic texts (e.g. KTU 1.2 IV 8, 29).
    Most scholars see YHWH's assumption of this role as part of Israel's absorption of storm-god
    imagery and as implicitly polemical.
  - >-
    The reading in Ps 68:4 is debated. MT ʿărābôt usually means "steppes", and many emend
    or explain it as a variant of ʿrpt. Mark it as contested.
  - >-
    The proposal (Emerton; Collins) that Dan 7:9-14 draws on the Canaanite pairing of El (Ancient
    of Days) and Baal (cloud rider) is widely discussed but not universally accepted.
