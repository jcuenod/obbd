  rel: language
  disputed: true
  note: >-
    rōkēb bāʿărābôt, 'rider on the clouds' or 'in the steppes'; cf. Ugaritic rkb ʿrpt; MT
    68:5
- ref: Ps 68:33
  rel: imagery
  note: '''Rider in the heavens, the ancient heavens''; MT 68:34'
