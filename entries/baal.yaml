  rel: polemic
  note: 'Deuteronomistic summary: Israel serves the Baals and Astartes'
- ref: Judg 6:25-32
  rel: polemic
  note: Gideon destroys Baal's altar; etiology of Jerubbaal
- ref: 1Kgs 16:31-33
  rel: attests
  note: Ahab builds a temple and altar of Baal in Samaria
- ref: 1Kgs 18:17-40
  rel: polemic
  note: Contest on Carmel over rain and fire; Elijah mocks Baal's absence
- ref: 2Kgs 10:18-28
  rel: polemic
  note: Jehu destroys the temple and worshippers of Baal
- ref: 2Kgs 11:18
  rel: attests
