id: baal
title: Baal
aliases: [Baʿal, Baʿlu, Hadad]
type: deity
cultures: [canaanite, ugaritic, phoenician]
scope: >-
  Baal ("lord, owner"), the West Semitic storm and fertility god, identified with Hadad, hero
  of the Ugaritic Baal Cycle and chief rival of YHWH in the biblical narratives of the Omride
  period. The entry covers Baal at Ugarit and in the first-millennium Levant, local Baals,
  and biblical polemic.
