editorial:
  author_notes:
  - >-
    Distinguish Baal as the title of a specific god (Baal-Hadad at Ugarit) from the many local
    "baals" (Baal-peor, Baal-berith, Baal-zebub) and from the common noun baʿal "lord, husband".
  - >-
    Which Baal Ahab and Jezebel promoted (Baal-Shamem, Melqart of Tyre, or a local Baal) is
    debated; do not assert Melqart as fact.
  - >-
    Baal-names among Israelites (Jerubbaal, Eshbaal, Meribbaal; Samaria ostraca) suggest baʿal
    could be used of YHWH before Hosea-era polemic; note the later bōšet ("shame") substitutions.
  - >-
    Avoid portraying "Baalism" as a fertility cult with sacred prostitution; that model is
    now widely rejected.
