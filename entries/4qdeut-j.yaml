editorial:
  author_notes:
  - >-
    Most text critics regard 'sons of God' as original and MT 'sons of Israel' as a theological
    correction. NRSV and other modern versions follow the Qumran reading.
  - >-
    LXX evidence: most witnesses read 'angels of God', some 'sons of God'. Check the Göttingen
    apparatus (Wevers) before stating the LXX reading.
  - >-
    Present neutrally the debate over whether Elyon in 32:8 is distinct from YHWH (32:9) or
    identical with him.
  - >-
    The manuscript's excerpted character (Deuteronomy and Exodus passages) suggests liturgical
    or devotional use; verify its exact contents and date in DJD XIV.
  sources_to_check:
