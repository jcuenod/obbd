  circa: true
  display: c. 50 BCE–50 CE
scope: >-
  A Herodian-period manuscript from Qumran Cave 4 containing excerpts of Deuteronomy (and
  Exodus). It preserves at Deut 32:8 the reading 'sons of God', against the Masoretic 'sons
  of Israel'. The entry also covers the related reading of Deut 32:43 in 4QDeutq and the LXX.
passages:
- ref: Deut 32:8-9
  rel: language
  note: Nations divided 'according to the number of the sons of God'; MT 'sons of Israel'
- ref: Deut 32:43
  rel: language
  note: Longer text in 4QDeut-q and LXX calling heavenly beings to worship
- ref: Heb 1:6
  rel: language
  note: Quotes the longer Greek form of Deut 32:43
- ref: Ps 82:1, 6
  rel: concept
  note: God judges among the gods, 'children of the Most High'
- ref: Job 1:6; 2:1; 38:7
  rel: language
  note: bĕnê hāʾĕlōhîm as heavenly beings
- ref: Gen 10:1-32
  rel: concept
  note: The seventy nations, a count often linked with Deut 32:8
- ref: Dan 10:13, 20-21
  rel: concept
  note: Angelic princes over nations, a development of Deut 32:8-9
