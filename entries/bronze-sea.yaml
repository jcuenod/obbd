scope: >-
  The large cast-bronze basin called "the sea" (hayyām), set on twelve bronze oxen in the
  court of Solomon's temple. The entry covers its dimensions, function, symbolism, and ancient
  Near Eastern analogues such as Mesopotamian apsû basins.
