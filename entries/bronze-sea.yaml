editorial:
  author_notes:
  - >-
    Many scholars interpret the sea as cosmological symbolism (the subdued waters or the life-giving
    deep) in light of Mesopotamian apsû basins in temples. The stone basin from the Assur
    temple with fish-garbed figures is a frequent comparandum. The Chronicler gives it a practical
    function (washing).
  - >-
    The capacity figures differ (2,000 baths in 1 Kgs 7:26; 3,000 in 2 Chr 4:5). Note this
    without harmonizing.
  - >-
    The ratio of diameter (10 cubits) to circumference (30 cubits) is often discussed as an
    "approximation of π". Treat this briefly as reception. It is not a central scholarly issue.
  - >-
    The twelve oxen in groups of three facing the four directions relate to bull iconography
    and cosmic orientation. Ahaz's removal of the oxen (2 Kgs 16:17) is usually read as paying
    tribute to Assyria.
