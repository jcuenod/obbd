scope: >-
  The diorite stele inscribed with the laws of Hammurabi of Babylon, about 282 casuistic provisions
  framed by a prologue and epilogue on the king's divine commission to establish justice.
  It is the most extensive ANE law collection and the standard comparandum for the Covenant
  Code.
