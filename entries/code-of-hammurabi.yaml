editorial:
  author_notes:
  - >-
    Found at Susa in 1901-02 by the French expedition; it had been carried off as booty by
    the Elamite king Shutruk-Nahhunte in the 12th c. The relief shows Hammurabi before Shamash.
    Fragments of other stelae and many manuscript copies exist; the text was copied in scribal
    schools for over a millennium.
  - >-
    Nature debated: legislation vs. a royal apologia or 'scientific' compilation of exemplary
    verdicts (Kraus, Bottéro, Westbrook); it is rarely if ever cited in court records.
  - >-
    Covenant Code relationship: shared legal-scribal tradition (Paul, Westbrook) vs. direct
    literary dependence on LH in the Neo-Assyrian period (Wright 2009). Present the range;
    Wright's thesis is influential but contested.
  - >-
    Contrasts worth drawing: social stratification (awīlum, muškēnum, wardum), vicarious punishment
    (§§116, 210, 230; cf. Exod 21:31, Deut 24:16), and divine vs. royal authorship of law.
  sources_to_check:
