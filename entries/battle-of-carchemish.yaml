editorial:
  author_notes:
  - >-
    The Babylonian Chronicle (ABC 5) describes the battle and the pursuit to Hamath; Nebuchadnezzar
    then returned to Babylon on his father's death.
  - >-
    Distinguish the 609 campaign (Josiah's death at Megiddo; 2 Kgs 23:29; 2 Chr 35:20) from
    the 605 battle.
  - >-
    Excavations at Carchemish (Woolley; renewed Turkish-Italian work) found evidence of the
    destruction, including Egyptian objects.
  - >-
    Dan 1:1's dating is a known chronological problem; present proposed explanations (accession-year
    reckoning, error) neutrally.
  sources_to_check: [ABC 5]
