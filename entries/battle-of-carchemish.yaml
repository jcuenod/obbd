  display: 605 BCE
scope: >-
  The decisive battle of 605 BCE at Carchemish on the Euphrates, in which the Babylonian crown
  prince Nebuchadnezzar defeated the Egyptian army of Necho II, ending Egyptian control of
  Syria-Palestine and opening the Levant to Babylon.
passages:
- ref: Jer 46:2-12
  rel: event
  note: Oracle on Pharaoh Necho's army defeated at Carchemish in Jehoiakim's fourth year
- ref: 2Kgs 24:7
  rel: event
  note: Egypt no longer comes out of its land; Babylon controls to the Euphrates
- ref: 2Chr 35:20
  rel: setting
  note: Necho on his way to Carchemish in 609, when Josiah intervened
- ref: 2Kgs 23:29
  rel: setting
  note: Necho's campaign of 609 to aid Assyria on the Euphrates
- ref: Jer 25:1
  rel: setting
  note: Jehoiakim's fourth year equated with Nebuchadnezzar's first
- ref: Dan 1:1
  rel: setting
  note: '''Third year of Jehoiakim''; chronological discrepancy with Jer 25:1 and 46:2'
