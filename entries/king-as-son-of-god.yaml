id: king-as-son-of-god
title: The King as Son of God
aliases: [Divine sonship of the king]
type: concept
cultures: [judahite, egyptian, assyrian]
scope: >-
  The designation of the Davidic king as son of YHWH, set against Egyptian claims of the pharaoh's
  divine birth and Mesopotamian royal language of divine parentage and nursing. The entry
  covers the adoption model, its texts, and their later messianic reuse.
