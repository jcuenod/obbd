editorial:
  author_notes:
  - >-
    Egyptian kings were presented as the physical offspring of Amun-Re (divine birth cycles
    at Deir el-Bahri and Luxor). Mesopotamian kings call themselves children of deities or
    say goddesses nursed them (e.g. Ashurbanipal).
  - >-
    The consensus reads Judahite sonship as adoptive and legal ('today', Ps 2:7) and as covenantal
    (2 Sam 7:14 includes discipline). Compare adoption formulae.
  - >-
    Ps 110:3 and Isa 9:6 involve textual and grammatical cruxes. Proposed comparisons with
    the Egyptian five-part titulary for Isa 9:6 are debated.
  - >-
    Trace the reception in Qumran (4Q174 Florilegium; 4Q246 'Son of God' text) and the New
    Testament, but keep it distinct from the ancient Near Eastern background.
