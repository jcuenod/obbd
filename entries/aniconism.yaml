editorial:
  author_notes:
  - >-
    Mettinger distinguishes de facto (tolerant) from programmatic aniconism, and material
    aniconism (standing stones, empty throne) from empty-space aniconism. This is the standard
    framework (No Graven Image?, 1995).
  - >-
    Note the minority but serious argument that the Jerusalem temple once housed an anthropomorphic
    statue of YHWH (e.g. Niehr). Present it as debated, not established.
  - >-
    Nabataean and other Arabian betyls are often cited as comparative West Semitic aniconism.
  - >-
    Distinguish the image prohibition (no image of YHWH) from the prohibition of other gods'
    images. The two are fused in the Decalogue but have different histories.
