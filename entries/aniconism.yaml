id: aniconism
title: Aniconism in Ancient Israel
type: concept
cultures: [hebrew, israelite, judahite, arabian]
scope: >-
  The absence or rejection of anthropomorphic or theriomorphic images of YHWH in Israelite
  religion: its biblical formulations, its development, the archaeological evidence (standing
  stones, empty throne), and comparative aniconic traditions in the West Semitic world.
passages:
- ref: Exod 20:4-6
  rel: concept
  note: Prohibition of making a carved image (pesel) or any likeness
- ref: Deut 4:12, 15-19
  rel: concept
  note: No form seen at Horeb, only a voice; hence no image
- ref: Deut 5:8-10
  rel: concept
  note: Image prohibition in the Deuteronomic Decalogue
- ref: Exod 20:23
  rel: concept
  note: No gods of silver or gold alongside YHWH
- ref: Exod 34:17
  rel: concept
  note: No cast (massēkâ) gods
- ref: Exod 32:1-6
  rel: polemic
  note: Golden calf as forbidden image
- ref: 1Kgs 12:28-29
  rel: polemic
  note: Jeroboam's calves at Bethel and Dan
- ref: 1Sam 4:4
  rel: concept
  note: 'YHWH enthroned on the cherubim over the ark: an ''empty-space'' throne'
- ref: Gen 28:18-22
  rel: practice
  note: Standing stone at Bethel as 'house of God'
- ref: Isa 40:18, 25
  rel: concept
  note: '''To whom then will you liken God?'''
