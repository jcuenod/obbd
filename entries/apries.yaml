id: apries
title: Apries (Hophra)
aliases: [Hophra, Wahibre]
type: person
cultures: [egyptian]
date:
  from: -589
  to: -570
  circa: true
  display: c. 589–570 BCE
scope: >-
  Saite pharaoh (biblical Hophra) who supported Zedekiah's revolt against Babylon. His army
  briefly relieved the siege of Jerusalem in 588. He was overthrown by Amasis after a failed
  Libyan expedition. He is the target of Jeremiah's and Ezekiel's oracles against Egypt.
passages:
- ref: Jer 44:30
  rel: event
  note: Pharaoh Hophra to be given into the hands of his enemies
- ref: Jer 37:5-11
  rel: event
  note: Pharaoh's army advances; the Babylonians lift the siege of Jerusalem temporarily
- ref: Ezek 17:15-17
  rel: event
  note: Zedekiah's appeal to Egypt for horses and troops
- ref: Ezek 29:1-16
  rel: polemic
  note: Oracle against pharaoh, the great dragon of the Nile
- ref: Ezek 30:20-26
  rel: event
  note: 'Pharaoh''s arm broken: failure of the Egyptian relief'
related: [fall-of-jerusalem-587, lachish-letters, nebuchadnezzar-ii, mighty-hand-outstretched-arm,
  memphis, nile]
