editorial:
  author_notes:
  - >-
    Hebrew ḥopraʿ renders Egyptian Wꜣḥ-ib-rʿ (Wahibre). Jer 44:30 is the only verse that names
    him. The other pharaohs of Jer 37 and Ezek 29-32 are identified with him by date.
  - >-
    Herodotus (2.161-169) describes his Phoenician campaigns, his deposition by Amasis, and
    his death. The Elephantine stele of Amasis gives the Egyptian perspective.
  - >-
    Lachish Letter 3 (a commander going down to Egypt) is often linked to Judah's diplomacy
    with Egypt in this period.
  - Judean refugees in Egypt (Jer 43-44) lived under his rule.
  sources_to_check: ['Herodotus, Histories 2.161-169']
