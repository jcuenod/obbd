editorial:
  author_notes:
  - >-
    Ziggurats supported a high temple and functioned as visible links between heaven and earth;
    they were not tombs or observatories. Correct popular misconceptions.
  - >-
    The Jacob's ladder comparison rests on sullam as a ramp or stair; it is widely cited but
    not certain.
  - >-
    Albright's reading of Ezek 43:13-17 in light of ziggurat terminology (e.g. ḥêq hāʾāreṣ,
    harʾēl) is influential but debated.
  - >-
    Distinguish the general institution (this entry) from Babylon's Etemenanki and from the
    interpretive concept ziggurat-and-babel.
  sources_to_check:
  - >-
    Walton, "The Mesopotamian Background of the Tower of Babel Account and Its Implications,"
    BBR 5 (1995)
