id: ziggurat
title: Ziggurats
type: realia
cultures: [mesopotamian]
scope: >-
  The stepped temple towers of Mesopotamian cities, built from the late third millennium (as
  at Ur under Ur-Nammu) to the Neo-Babylonian period. The entry covers their form, function
  and names, and their role as background for the tower of Babel and for the motif of a stairway
  linking heaven and earth.
passages:
- ref: Gen 11:1-9
  rel: realia
  note: Tower 'with its top in the heavens' built of brick in Shinar
- ref: Gen 28:12
  rel: imagery
  disputed: true
  note: Jacob's stairway (sullam), compared with the ziggurat ramp (simmiltu)
- ref: Gen 28:17
  rel: language
  note: '''Gate of heaven''; cf. Babylon''s name Bab-ili, ''gate of the god'''
- ref: Ezek 43:13-17
  rel: realia
  disputed: true
  note: >-
    Stepped altar with 'bosom of the earth' and 'mountain of God', compared to ziggurat terms
- ref: Isa 14:13
  rel: imagery
  note: Ascent to the mount of assembly in the far north
related: [ziggurat-and-babel, etemenanki, cosmic-mountain, temple-as-cosmos, ur, babylon]
