title: Pig Avoidance and Food Prohibitions
aliases: [Pork taboo, Dietary laws, Kashrut origins]
type: practice
cultures: [hebrew, philistine, egyptian]
scope: >-
  The biblical prohibition of pork within the wider dietary laws, and the zooarchaeological
  evidence for pig consumption and avoidance in the Iron Age southern Levant. The entry covers
  the use of pork avoidance as an ethnic marker and as a test of loyalty in the Hellenistic
  period.
