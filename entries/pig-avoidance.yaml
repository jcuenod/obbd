editorial:
  author_notes:
  - >-
    Pig bones are rare at Iron I highland sites but common at Philistine coastal sites. Some
    (e.g. Finkelstein; Hesse and Wapnish) read this as an ethnic marker. Caution is needed:
    ecology, economy and regional patterns also matter, and pigs appear at some Iron II Israelite
    sites (Sapir-Hen et al.).
  - >-
    Pigs had ambivalent or low status elsewhere in the ancient Near East (Egypt, Mesopotamia,
    Hittite ritual), so Israelite avoidance was not unique.
  - >-
    Survey the explanations (Douglas on classification, M. Harris on ecology, Milgrom on ethics).
    Reject the trichinosis or hygiene explanation.
