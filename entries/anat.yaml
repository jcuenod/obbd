editorial:
  author_notes:
  - >-
    Summarise her portrayal in the Baal Cycle (slaughter in KTU 1.3 II, mourning and burial
    of Baal, destruction of Mot in KTU 1.6 II) and in Aqhat; her epithet btlt ("maiden") concerns
    status, not chastity in a later sense.
  - >-
    At Elephantine the temple accounts name Anat-Yahu and Anat-Bethel; explain the debate
    over whether these are consort goddesses or hypostases.
  - >-
    Note her popularity in Ramesside Egypt as a warrior goddess (e.g. Bint-Anat, Ramesses
    II's daughter).
  - >-
    Avoid portraying Anat as a love or fertility goddess paired sexually with Baal as a settled
    fact; the evidence is contested.
  sources_to_check:
