id: anat
title: Anat
aliases: [ʿAnat, ʿAnatu, Anath]
type: deity
cultures: [ugaritic, egyptian, jewish]
scope: >-
  Anat, the violent warrior goddess of Ugaritic myth, sister and ally of Baal, also venerated
  in New Kingdom Egypt and still attested among the Judeans of Persian-period Elephantine.
  In the Hebrew Bible she survives only in personal and place names.
passages:
- ref: Judg 3:31; 5:6
  rel: language
  note: Shamgar 'son of Anath', perhaps a warrior epithet
- ref: Jer 1:1
  rel: language
  note: Anathoth, Jeremiah's home town
- ref: Josh 21:18
  rel: language
  note: Anathoth as a Levitical city
- ref: Judg 1:33
  rel: language
  note: Beth-anath, an unconquered town in Naphtali
- ref: Exod 32:20
  rel: parallel
  disputed: true
  note: Calf burned, ground and scattered; cf. Anat's destruction of Mot (Loewenstamm)
- ref: Jer 7:18
  rel: concept
  disputed: true
  note: Anat proposed as the Queen of Heaven
- ref: Hos 14:8
  rel: language
  disputed: true
  note: Emendation 'I am his Anat and his Asherah' disputed (MT 14:9)
