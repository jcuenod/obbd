editorial:
  author_notes:
  - >-
    Albright dated it to the 2nd century BCE (Maccabean). Note that later palaeographic comparison
    with Qumran hands broadly supports this.
  - >-
    Connect it to m. Tamid 5:1 (Decalogue and Shema recited in the temple) and to the later
    dropping of the Decalogue from daily liturgy 'because of the heretics' (y. Ber. 1:3; b.
    Ber. 12a).
  - >-
    Highlight its agreements with the LXX Vorlage (commandment order, plus before the Shema).
