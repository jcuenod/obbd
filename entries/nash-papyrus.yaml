id: nash-papyrus
title: Nash Papyrus
type: artifact
cultures: [jewish]
date:
  from: -150
  to: -100
  circa: true
  display: c. 150–100 BCE
scope: >-
  A single papyrus sheet acquired in Egypt in 1898 by W. L. Nash, containing the Decalogue
  (in a form blending Exod 20 and Deut 5) followed by the Shema. Until the Qumran discoveries
  it was the oldest known Hebrew biblical text, and it is probably a liturgical or devotional
  excerpt rather than a biblical scroll.
passages:
- ref: Exod 20:2-17
  rel: language
  note: Decalogue text harmonizing Exodus and Deuteronomy forms
- ref: Deut 5:6-21
  rel: language
  note: Decalogue (Deuteronomic form)
- ref: Deut 6:4-5
  rel: language
  note: Shema, preceded by an introductory clause also found in LXX
- ref: Luke 18:20
  rel: language
  note: Adultery listed before murder, the order of the Nash Papyrus and some LXX witnesses
- ref: Rom 13:9
  rel: language
  note: 'Same order: adultery, murder, theft'
- ref: Mark 12:29-30
  rel: practice
  note: Shema as central confession; Decalogue and Shema recited together in temple liturgy
