  circa: true
  display: c. 1274–1250 BCE
scope: >-
  Reliefs and accompanying texts (the "Poem" and the "Bulletin") commemorating Ramesses II's
  battle against the Hittites at Kadesh on the Orontes in his year 5. They were carved on
  several temples, including Abu Simbel, Luxor, Karnak, the Ramesseum, and Abydos. They depict
  the Egyptian camp, the royal tent, the chariot battle, and the king's rescue by Amun.
