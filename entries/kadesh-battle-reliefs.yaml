editorial:
  author_notes:
  - >-
    The battle was at best a stalemate, despite the Egyptian victory claims. It was followed
    years later by the Egyptian-Hittite treaty (year 21).
  - >-
    Homan's comparison of the camp and royal tent with the tabernacle and Israel's camp is
    suggestive but debated, so it is marked contested. Note that P's tabernacle texts are
    generally dated much later.
  - >-
    The Poem's portrayal of the abandoned king rescued by Amun is useful for comparing ancient
    Near Eastern royal war accounts and divine intervention (cf. Younger on conquest accounts).
