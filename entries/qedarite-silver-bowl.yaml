editorial:
  author_notes:
  - >-
    Published by Rabinowitz (1956). The bowls are said to come from Tell el-Maskhuta, but
    they were acquired through the market, so give the provenance details carefully.
  - >-
    Gashmu here is probably the Geshem of Nehemiah (cf. Neh 6:6, 'Gashmu'). A Lihyanite inscription
    from Dedan naming 'Gashm son of Shahr' is also discussed. Explain the reasoning and the
    uncertainty.
  - >-
    The bowls show a Qedarite kingdom stretching from northern Arabia to the eastern Delta
    under Persian rule. This is the context for Geshem's interest in Judah.
