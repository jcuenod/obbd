scope: >-
  Silver bowls from a shrine of the goddess han-ʾIlat at Tell el-Maskhuta in the Wadi Tumilat
  (Egypt), with Aramaic dedications. One records an offering by 'Qaynu son of Gashmu, king
  of Qedar'. They attest a Qedarite dynasty whose founder is usually identified with Geshem
  the Arab, Nehemiah's opponent.
