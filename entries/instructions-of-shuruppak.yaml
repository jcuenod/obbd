  circa: true
  display: c. 2600–2500 BCE
scope: >-
  A Sumerian collection of practical admonitions given by Shuruppak to his son Ziusudra, the
  flood hero. Attested from Early Dynastic tablets of c. 2500 BCE to Old Babylonian school
  copies, it is among the oldest surviving works of literature and the earliest instance of
  the father-to-son instruction genre.
