editorial:
  author_notes:
  - >-
    Earliest copies from Abu Salabikh and Adab (Early Dynastic IIIa); the Old Babylonian version
    is longer. Alster's edition (2005) is standard.
  - >-
    The link to the flood hero Ziusudra frames ancient wisdom as antediluvian, a point of
    contact with traditions about sages before the flood.
  - >-
    Parallels with Proverbs are of genre and common sense (surety, adultery, speech), not
    of dependence; the father-son frame is pan-Near Eastern (cf. Egyptian instructions, Ahiqar).
