  rel: form
  note: Instruction framed as a father's counsel to his son
- ref: Prov 4:1-4
  rel: form
  note: Father passes on teaching received in turn from his own father
- ref: Prov 6:1-5
  rel: parallel
  note: Do not stand surety for another
- ref: Prov 6:24-29
  rel: parallel
  note: Warnings against sexual involvement with another man's wife
