  circa: true
  display: c. 850–825 BCE
scope: >-
  A basalt statue of Hadad-yithʿi, ruler of Guzan, found in 1979 at Tell Fekheriye (ancient
  Sikani) in northeastern Syria. It carries a dedication to the storm god in Akkadian and
  Old Aramaic. It is the earliest substantial Aramaic text, and it calls the statue both ṣlm
  ('image') and dmwt ('likeness').
