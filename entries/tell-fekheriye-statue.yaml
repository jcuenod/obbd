editorial:
  author_notes:
  - >-
    The statue stood in a temple and represents the ruler before the god. This is important
    for discussions of 'image' as royal representation and presence in the imago Dei debate.
    Do not imply direct dependence of Genesis on this text.
  - >-
    The Aramaic calls Hadad-yithʿi 'king' where the Akkadian has 'governor'. This illustrates
    local versus imperial framing.
  - >-
    Dating is debated (palaeography vs. Assyrian prosopography). Mid-9th century is the common
    estimate.
  - >-
    The futility curses are a widely shared treaty and curse genre (cf. Sefire, Deut 28).
    Present them as a shared genre.
