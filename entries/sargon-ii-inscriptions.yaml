editorial:
  author_notes:
  - >-
    Sargon claims Samaria in several texts, with 27,280 or 27,290 deportees and 50 (or 200)
    chariots, but the earliest texts place it in his accession year while the Annals put it
    in year 2; this bears on the Shalmaneser V vs Sargon debate.
  - >-
    The Nimrud Inscription calls Sargon 'subduer of Judah, which lies far away', evidence
    for Judahite involvement in the 720 or 712/711 events.
  - >-
    Fragments of a Sargon stele found at Ashdod provide local confirmation of the 712/711
    campaign that Isa 20:1 mentions.
  - >-
    The 2 Kgs 17:24 list of settlers reflects several waves of deportation; Sargon's texts
    mention Arabs settled in Samaria (c. 716/715).
