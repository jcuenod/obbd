scope: >-
  The inscriptions of Sargon II from Khorsabad (Dur-Sharrukin), Nimrud, Assur and provincial
  stelae, including the Khorsabad Annals, the Great Display Inscription, the Nimrud Prism,
  and the Ashdod stele fragments. They claim the conquest of Samaria, the deportation and
  resettlement of its population, and the crushing of the Ashdod revolt of 712/711.
