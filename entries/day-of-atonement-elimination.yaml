scope: >-
  The Day of Atonement ritual of Lev 16, especially the goat sent to Azazel, and related biblical
  rites of purification and riddance, set against Hittite, Hurrian, Mesopotamian, and Eblaite
  elimination rituals in which impurity or evil is transferred to a carrier and sent away.
