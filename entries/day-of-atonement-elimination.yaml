editorial:
  author_notes:
  - >-
    Hittite and Hurrian rituals (e.g. those of Ashella, Uhhamuwa, and Pulisa) send an animal
    or human substitute, sometimes adorned, into enemy territory to carry away plague. Wright's
    Disposal of Impurity is the standard comparative study. Two Eblaite texts describe a goat
    with a silver bracelet sent off to the steppe before a royal wedding (Zatelli, VT 1998).
  - >-
    Babylonian kuppuru rites (cognate with Hebrew kipper) include wiping the Ezida shrine
    with a slaughtered sheep's carcass during the akītu, after which the carcass and the officiants
    are expelled. This is a close parallel to Lev 16.
  - >-
    The meaning of ʿăzāʾzēl is debated. It may be a demon's name (cf. 1 En 8:1; 10:4-8, Asael),
    "the goat that goes away", or a place name ("rugged cliff"). The demon interpretation
    is the most common critical view.
  - >-
    Milgrom's interpretation of the ḥaṭṭāʾt as a "purification offering" that purges the sanctuary
    is widely, though not universally, accepted.
  sources_to_check:
  - David P. Wright, The Disposal of Impurity (SBLDS 101, 1987)
  - Jacob Milgrom, Leviticus 1-16 (AB 3, 1991)
