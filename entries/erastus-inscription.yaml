editorial:
  author_notes:
  - >-
    Whether Greek oikonomos tēs poleōs can translate Latin aedilis is disputed (Theissen for;
    Meggitt and Friesen against).
  - >-
    The date is debated: Kent placed it in the mid-1st century CE, while Friesen (2010) argued
    for the 2nd century. Erastus was also a fairly common name.
  - >-
    The identification bears on the 'new consensus' about the social status of Pauline communities.
    Present it as possible, not proven.
  sources_to_check:
