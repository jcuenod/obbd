  circa: true
  display: c. 1–150 CE
scope: >-
  Latin inscription set in a paved square east of the theatre at Corinth, recording that Erastus
  laid the pavement at his own expense in return for his aedileship. Its possible identification
  with the Erastus of Rom 16:23 is debated.
passages:
- ref: Rom 16:23
  rel: attests
  disputed: true
  note: Erastus, 'the city treasurer' (oikonomos tēs poleōs), sends greetings from Corinth
- ref: Acts 19:22
  rel: attests
  disputed: true
  note: Erastus sent to Macedonia with Timothy
- ref: 2Tim 4:20
  rel: attests
  disputed: true
  note: Erastus remained in Corinth
- ref: 1Cor 1:26
  rel: setting
  note: '''Not many of you were powerful'': the social level of the Corinthian believers'
