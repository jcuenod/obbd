editorial:
  author_notes:
  - >-
    The identification of Ahasuerus with Xerxes rests on the name's form (Old Persian Xšayāršā;
    Akkadian and Aramaic forms). LXX Esther and Josephus instead identify him with Artaxerxes.
  - >-
    Herodotus's queen is Amestris, not Vashti or Esther. Do not equate Vashti with Amestris
    uncritically.
  - >-
    Court details in Esther (couriers, banquets, Persian loanwords) are plausible, but the
    narrative's historicity is doubted by most scholars.
  - Mention the daiva inscription (XPh) for Xerxes' religious policy.
