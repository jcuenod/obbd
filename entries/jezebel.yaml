editorial:
  author_notes:
  - >-
    Ethbaal is usually identified with Ittobaal I of Tyre, known from Menander via Josephus
    (Ag. Ap. 1.123). 'King of the Sidonians' was a general term for Phoenician rulers.
  - >-
    The seal inscribed yzbl is unprovenanced (first published by Avigad, IEJ 14, 1964). Korpel
    (2006) argued it belonged to the queen. The reading, its royal symbols and the identification
    are all debated. Mark the link as uncertain.
  - >-
    Her portrait is a polemical Deuteronomistic construct. Discuss gender, foreignness and
    the role of queen mothers.
  - Which Baal Jezebel promoted (Melqart, Baal Shamem, or a generic Baal) is unresolved.
  sources_to_check:
