editorial:
  author_notes:
  - >-
    Mari letters speak of 'killing a donkey foal' (ḥayāram qaṭālum) to make a treaty. At Alalakh,
    Abba-AN cuts the neck of a lamb in the treaty with Yarim-Lim (AT 456).
  - >-
    Self-curse parallels: Ashur-nirari V's treaty with Matiʾilu (the ram's head 'is the head
    of Matiʾilu'; SAA 2 2); Sefire I A 40, 'as this calf is cut in two, so may Matiʿel be
    cut in two'.
  - >-
    The self-curse reading is the consensus for Jer 34. For Gen 15 it is debated, since only
    the divine symbols pass between the pieces. Some read the scene as a promissory oath or
    grant.
  - Aramaic Sefire uses gzr ʿdy, 'cut a treaty', which parallels Hebrew kārat bĕrît.
  sources_to_check: [SAA 2 2 (Aššur-nērārī V treaty), KAI 222 (Sefire I)]
