id: covenant-cutting-ceremony
title: Covenant-Cutting Ceremonies
aliases: [Cutting a covenant, Covenant between the pieces]
type: practice
cultures: [amorite, aramean, assyrian, hittite]
scope: >-
  Rituals that ratified covenants and treaties: cutting animals, passing between the pieces,
  blood rites, sacrificial meals and witness objects. These are compared with Mari, Alalakh,
  Assyrian and Aramaic treaty rites. The idiom 'to cut (kārat) a covenant' is included.
