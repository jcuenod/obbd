editorial:
  author_notes:
  - >-
    The main tablet (Nippur, c. 1600 BCE) is badly broken; Jacobsen's title and his creation-cities-flood
    outline (JBL 1981) are reconstructions. Civil's edition in Lambert and Millard (1969)
    calls it 'The Sumerian Flood Story'. Do not overstate what is preserved.
  - >-
    Ziusudra is the Sumerian counterpart of Atrahasis and Utnapishtim (Berossus's Xisouthros);
    in the Instructions of Shuruppak he is Shuruppak's son.
  - >-
    Unlike Noah, the flood hero receives immortality; the 'first cities before the flood'
    tradition is shared with the Sumerian King List.
