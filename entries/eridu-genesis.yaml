id: eridu-genesis
title: Eridu Genesis (Sumerian Flood Story)
aliases: [Sumerian Flood Story, Ziusudra story, Deluge tablet]
type: text
cultures: [sumerian]
date:
  from: -1700
  to: -1600
  circa: true
  display: c. 1700–1600 BCE
scope: >-
  A fragmentary Sumerian narrative, preserved chiefly on one Old Babylonian tablet from Nippur,
  of the creation of humans and animals, the founding of the first cities, and a flood survived
  by King Ziusudra, who is then granted eternal life. "Eridu Genesis" is Thorkild Jacobsen's
  name for his reconstruction.
