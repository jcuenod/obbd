- ref: Gen 6:5-9:17
  rel: parallel
  note: Ziusudra, warned by Enki, survives a seven-day flood in a great boat
- ref: Gen 8:20-21
  rel: parallel
  note: Hero sacrifices an ox and sheep after the flood
- ref: Gen 4:17
  rel: concept
  disputed: true
  note: First cities founded before the flood (Eridu, Bad-tibira, Larak, Sippar, Shuruppak)
- ref: Gen 5:24
  rel: concept
  disputed: true
  note: Flood hero granted 'life like a god' and settled in Dilmun; cf. Enoch taken by God
- ref: Gen 1:1-9:17
  rel: form
  disputed: true
  note: Jacobsen's reconstructed sequence of creation, first cities, and flood
