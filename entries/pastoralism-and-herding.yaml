id: pastoralism-and-herding
title: Pastoralism, Herding, and Nomadism
aliases: [Shepherding, Nomadism, Transhumance, Sheep and Goats]
type: practice
cultures: [hebrew, amorite, ane]
scope: >-
  Sheep and goat herding (and to a lesser extent cattle) in the southern Levant and the wider
  Near East: village-based herding, seasonal transhumance and mobile pastoralism, the work
  and liability of the herdsman, and the place of herding in biblical narrative and law. Royal
  and divine shepherd imagery is treated under shepherd-kingship and camel nomadism under
  camels-and-domestication.
