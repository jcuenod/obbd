editorial:
  author_notes:
  - >-
    Most herding in Iron Age Israel was part of a mixed farming economy: small flocks kept
    by villages and grazed seasonally nearby. Long-range, camel-based Bedouin nomadism is
    later. Correct the older romantic picture of the patriarchs as desert Bedouin.
  - >-
    Use Mari and anthropology for mobile pastoralism. The Mari archives describe tribal groups
    (the Binu Yamina and others) moving between settlement and steppe. Rowton's 'dimorphic
    society' and later work on pastoral-sedentary interdependence apply here. This feeds the
    debate on whether early Israel emerged partly from sedentarizing pastoralists (Finkelstein).
  - >-
    Herding law: Hammurabi §§261-267 regulate hired herdsmen and losses. Exod 22:10-13, Gen
    31:39 and Amos 3:12 share the rule that a herdsman clears himself by producing the remains
    of an animal killed by a predator.
  - >-
    Nōqēd (Amos 1:1; 2 Kgs 3:4; Ugaritic nqdm) may denote a manager or owner of flocks rather
    than a poor herdsman. Its implications for Amos's social status are debated.
  - >-
    Faunal remains show sheep and goats dominate, with cattle for traction. Note the secondary
    products: milk, wool and hair.
