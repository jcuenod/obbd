id: calendars-and-month-names
title: Calendars and Month Names
type: concept
cultures: [hebrew, babylonian, phoenician, jewish]
scope: >-
  The lunisolar calendars of Israel and its neighbours: early Canaanite/Phoenician month names
  (Abib, Ziv, Ethanim, Bul), ordinal numbering of months, the adoption of Babylonian month
  names after the exile, intercalation, and the spring and autumn new year. The entry also
  covers the 364-day calendar of some Second Temple groups.
