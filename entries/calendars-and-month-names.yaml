editorial:
  author_notes:
  - >-
    The early month names (Abib, Ziv, Ethanim, Bul) are paralleled in Phoenician inscriptions.
    Ordinal numbering predominates in Priestly texts. Babylonian names (Nisan, Sivan, Elul,
    Tishri, Chislev, Tebeth, Shebat, Adar, and others) appear only in exilic and postexilic
    books.
  - >-
    Whether pre-exilic Israel used an autumn or a spring new year is debated (Exod 23:16;
    34:22 versus Exod 12:2). Present the evidence, including the possibility of both civil
    and cultic reckonings.
  - >-
    Babylonian intercalation (a second Adar or Elul) became regularized in the Persian period.
    The Elephantine double-dated papyri are key evidence for Jewish use of the Babylonian
    calendar.
  - >-
    The 364-day calendar of 1 Enoch 72-82, Jubilees, and Qumran texts belongs to Second Temple
    debates. Mention it with cross-references.
  sources_to_check:
