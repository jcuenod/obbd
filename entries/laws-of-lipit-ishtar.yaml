scope: >-
  The Sumerian law collection of Lipit-Ishtar, king of Isin, reconstructed from Old Babylonian
  school copies. It is the earliest well-preserved example of the prologue-laws-epilogue frame
  later used by Hammurabi, with an epilogue of blessings and curses.
passages:
- ref: Lev 26:3-39
  rel: form
  note: Law collection concluding with blessings and curses
- ref: Deut 28
  rel: form
  note: Blessings and curses following a law corpus
- ref: Exod 21:22
  rel: parallel
  note: Fine for causing a woman's miscarriage
- ref: Exod 22:14-15
  rel: parallel
  note: Liability for injury to a hired or borrowed ox (MT 22:13-14)
- ref: Judg 11:1-2
  rel: practice
  note: Status of a prostitute's son; LL §27 makes him heir, Jephthah is expelled
