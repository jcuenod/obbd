editorial:
  author_notes:
  - >-
    The frame (gods call the king; laws; curses on anyone who defaces the stele) predates
    Hammurabi and is often compared with the hortatory endings of the Covenant Code (Exod
    23:20-33) and Holiness Code (Lev 26), which however are divine speech rather than royal
    self-praise.
  - >-
    The text is reconstructed from many fragmentary copies, and the assignment of some provisions
    (e.g. on miscarriage) to LL rather than to Sumerian school exercises should be checked
    against Roth.
