editorial:
  author_notes:
  - >-
    Maeir's long-running excavations (from 1996) have made the identification with Tell eṣ-Ṣafi
    widely accepted. Gath was the largest Philistine city in the tenth and ninth centuries.
  - >-
    A siege trench around the tell and a destruction of c. 830 BCE are attributed to Hazael
    (2 Kgs 12:17). Gath's absence from the eighth-century lists in Amos 1:6-8 and Zeph 2:4
    fits its decline.
  - >-
    The early Iron IIA sherd with the names ʾLWT and WLT shows names of non-Semitic type comparable
    to 'Goliath'. It is not a reference to Goliath himself, and the press framing should be
    corrected.
  - >-
    Other finds include a two-horned altar and Philistine temple remains. Amarna-period Gimti
    (ruler Shuwardata) is probably Gath.
  sources_to_check:
  - NEAEHL
  - Maeir (ed.), Tell es-Safi/Gath I - The 1996-2005 Seasons (2012)
