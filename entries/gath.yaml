scope: >-
  Philistine Gath, identified with Tell eṣ-Ṣafi at the edge of the Shephelah, the largest
  Philistine city in the early Iron Age. Covers its Bronze Age background, its Philistine
  material culture, the Aramean siege, and its later decline.
