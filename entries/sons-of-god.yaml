id: sons-of-god
title: Sons of God (bene elohim)
aliases: [bene elohim, bene elim, sons of the gods]
type: concept
cultures: [hebrew, ugaritic, jewish]
scope: >-
  The "sons of God/gods" (bənê ʾĕlōhîm, bənê ʾēlîm, bənê ʿelyôn), members of the divine council,
  and their reception in Second Temple interpretation of Gen 6:1-4 as fallen angels (the Watchers).
passages:
- ref: Gen 6:1-4
  rel: concept
  note: Sons of God take human wives; Nephilim on the earth
- ref: Job 1:6; 2:1
  rel: concept
  note: Sons of God present themselves before YHWH
- ref: Job 38:7
  rel: concept
  note: Sons of God shout for joy at creation, parallel to morning stars
- ref: Deut 32:8
  rel: concept
  note: 4QDeutj 'sons of God'; LXX 'angels/sons of God'; MT 'sons of Israel'
- ref: Ps 29:1
  rel: concept
  note: Bənê ʾēlîm summoned to ascribe glory to YHWH
- ref: Ps 89:6
