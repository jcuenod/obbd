editorial:
  author_notes:
  - >-
    Ugaritic bn il/bn ilm and the seventy sons of Athirat provide the closest background;
    mainstream critical scholarship reads Gen 6:1-4 of divine beings.
  - >-
    Survey the reception history: angels (1 Enoch, Jubilees, Jude, 2 Pet 2:4), human rulers
    or nobles (targums, rabbis), Sethites (later Christian).
  - The text-critical case for "sons of God" in Deut 32:8 is now widely accepted.
  - >-
    Exclude sensational modern readings (alien or hybrid-genetics theories) except as misconceptions.
