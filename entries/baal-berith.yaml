editorial:
  author_notes:
  - >-
    Debate whether "berith" names a treaty-guaranteeing deity of a Shechemite league (Clements),
    whether El- and Baal- forms are variants of one god, and how this relates to Israelite
    covenant traditions at Shechem (T. J. Lewis, JBL 115, 1996).
  - >-
    The identification of the temple with the Middle and Late Bronze "fortress temple" (migdal)
    excavated at Shechem is common but debated.
