editorial:
  author_notes:
  - >-
    Distinguish the Old Greek from later revisions (kaige, Aquila, Symmachus, Theodotion,
    Hexapla, Lucianic). In Daniel, 'Theodotion' displaced the Old Greek in church use.
  - >-
    Value for textual criticism: Jeremiah, Samuel, Job, Esther, and Exodus 35-40 differ significantly.
    Qumran confirms that some differences reflect Hebrew Vorlagen.
  - >-
    On Isa 7:14: ʿalmâ means 'young woman', and parthenos is not always strictly 'virgin'
    (cf. LXX Gen 34:3).
  - >-
    Earliest witnesses include Rylands 458 (Deut), 4QLXXLev-a, and the Greek Minor Prophets
    scroll from Naḥal Ḥever. NT quotations do not always match later LXX manuscripts.
