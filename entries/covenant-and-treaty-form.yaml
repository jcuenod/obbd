editorial:
  author_notes:
  - >-
    Lay out the history of research: Mendenhall (1954) and Baltzer on the six-part Hittite
    form; D. J. McCarthy, Treaty and Covenant (2nd ed., 1978); Weinfeld on Deuteronomy and
    Neo-Assyrian treaties and on the 'covenant of grant'.
  - >-
    Current mainstream view: Deut 13 and 28 draw closely on Neo-Assyrian treaty traditions
    (EST; Steymans, Otto), and the Tell Tayinat copy shows such tablets circulated in the
    Levant. Kitchen's case for a Late Bronze Age matrix is a minority view.
  - >-
    Distinguish parity, vassal and grant types. Note Perlitt's argument that covenant theology
    is mainly Deuteronomistic, with little trace in eighth-century prophets.
  sources_to_check:
