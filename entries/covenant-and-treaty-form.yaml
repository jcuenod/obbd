id: covenant-and-treaty-form
title: Covenant and Treaty Form
aliases: [Suzerainty treaty, Vassal treaty, Berit]
type: concept
cultures: [hittite, assyrian, aramean]
scope: >-
  The comparison of biblical covenant texts, especially Deuteronomy, Exod 19–24 and Josh 24,
  with Late Bronze Age Hittite treaties and first-millennium Assyrian and Aramaic treaties
  and loyalty oaths. This is a hub entry. Curses, ceremonies and covenant 'love' language
  have their own entries.
passages:
- ref: Exod 20:1-17
  rel: form
  note: Self-identification and historical prologue (20:2) followed by stipulations
- ref: Exod 24:3-8
  rel: practice
  note: Covenant ratified by reading the document and blood rite
- ref: Deut 4:44-28:68
  rel: form
  note: 'Deuteronomy''s core organized like a treaty: history, stipulations, curses'
- ref: Deut 13:1-11
  rel: parallel
  note: >-
    Duty to denounce sedition even by kin; close to the Esarhaddon Succession Treaty (MT 13:2-12)
- ref: Deut 31:9-13, 24-26
  rel: practice
  note: Deposit of the document beside the ark and periodic public reading
- ref: Deut 30:19
  rel: form
  note: Heaven and earth called as witnesses
- ref: Josh 24:1-28
  rel: form
  note: 'Covenant at Shechem: history, demands, witness stone'
- ref: 2Kgs 23:1-3
  rel: practice
