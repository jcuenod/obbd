aliases: [Tell en-Nasbeh, Mizpah of Benjamin]
type: site
cultures: [judahite, babylonian]
scope: >-
  Mizpah of Benjamin, usually identified with Tell en-Nasbeh, a fortified border town of Judah
  that became the seat of Babylonian administration after 586 BCE. Other places named Mizpah
  (Gilead, Moab) are excluded.
