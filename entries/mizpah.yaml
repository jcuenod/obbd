editorial:
  author_notes:
  - >-
    Tell en-Nasbeh is the majority identification. Nebi Samwil has been proposed (Magen) but
    is less widely accepted.
  - >-
    Badè's excavations (1926-35) were reanalysed by Zorn, who identified a Babylonian-period
    stratum with new administrative buildings. This is key for Judah after 586.
  - >-
    Finds include the Jaazaniah seal with a cockerel, and m(w)ṣh stamp impressions, probably
    'Mozah', from the Babylonian period.
