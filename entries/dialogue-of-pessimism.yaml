id: dialogue-of-pessimism
title: Dialogue of Pessimism
aliases:
- Dialogue between a Master and His Slave
- Pessimistic Dialogue between Master and Servant
type: text
cultures: [babylonian, assyrian]
date:
  from: -1000
  to: -700
  circa: true
  display: c. 1000–700 BCE
scope: >-
  A short Akkadian dialogue in which a master proposes a series of undertakings (dining, hunting,
  love, sacrifice, lending, public benefaction) and his slave argues equally well for and
  against each, ending with the question of what is truly good. It is often compared with
  Qoheleth.
passages:
- ref: Eccl 2:1-11
  rel: parallel
  note: Testing pleasures and projects, each found empty
- ref: Eccl 1:2-3
  rel: concept
  note: Futility of human undertakings
- ref: Eccl 2:14-16
  rel: concept
  note: Same fate for wise and fool; skulls in the ruin-mounds cannot be told apart
- ref: Prov 30:4
  rel: parallel
  note: '''Who has ascended to heaven?'' as a proverb of human limits'
- ref: Deut 30:12-13
  rel: parallel
  disputed: true
  note: Who will go up to heaven or cross the sea? (proverbial phrasing)
related: [ludlul-bel-nemeqi, babylonian-theodicy, ane-wisdom-literature, harpers-songs, dialogue-of-a-man-with-his-ba]
