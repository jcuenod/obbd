editorial:
  author_notes:
  - >-
    Genre and tone are debated: satire or parody of courtly advice (Speiser saw comedy), serious
    pessimism, or a scribal exercise in arguing both sides. The ending (the master proposes
    to kill the slave, who retorts the master would not outlive him three days) is ambiguous.
  - >-
    Qoheleth parallels are thematic (the vanity of pursuits); Qoheleth reaches an ethic of
    enjoyment (Eccl 9:7-9, cf. Siduri) that the Dialogue lacks. Avoid claims of dependence.
  - >-
    Known from first-millennium copies (Assur, Nineveh, Sippar); date of composition uncertain.
