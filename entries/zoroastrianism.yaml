id: zoroastrianism
title: Zoroastrianism and Persian Religion
type: concept
cultures: [persian]
scope: >-
  The Iranian religious tradition associated with Zarathustra and the worship of Ahura Mazda,
  together with Achaemenid royal religion more broadly. The entry covers the long debate over
  Persian influence on Second Temple Jewish dualism, angelology, demonology, eschatology,
  and resurrection belief.
passages:
- ref: Isa 45:7
  rel: polemic
  disputed: true
  note: >-
    YHWH forms light and creates darkness, makes weal and creates woe; read by some against
    dualism
- ref: Dan 12:2-3
  rel: concept
  disputed: true
  note: Resurrection to everlasting life or contempt; Persian influence debated
- ref: Dan 10:13, 20-21
  rel: concept
  disputed: true
  note: Angelic princes of the nations; angelology possibly shaped by Persian ideas
- ref: 1Chr 21:1
  rel: concept
  disputed: true
  note: Satan as an independent adversary (contrast 2 Sam 24:1)
- ref: Tob 3:8, 17
  rel: language
  note: Asmodeus, generally derived from Avestan Aēšma daēva, 'demon of wrath'
- ref: Matt 2:1-12
  rel: language
  note: Magi (magoi), originally a Median/Persian priestly caste
