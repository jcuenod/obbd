editorial:
  author_notes:
  - >-
    Stress the source problem: Zarathustra's date is disputed (often c. 1200-1000 BCE, sometimes
    6th century). The Avesta was written down in the Sasanian period and the Pahlavi books
    date to the 9th-10th centuries CE, so claims of dependence are hard to prove.
  - >-
    Whether the Achaemenid kings were 'Zoroastrian' is debated. Their inscriptions invoke
    Ahuramazda but never mention Zarathustra.
  - >-
    Treat proposed influences (dualism, resurrection, angelology, final judgment, world ages)
    as a spectrum of probability. Inner-Israelite development and Hellenistic influences are
    also live explanations.
  - >-
    Isa 45:7 as anti-Zoroastrian polemic is common but contested. Many see it simply as monotheistic
    assertion.
  sources_to_check:
  - M. Boyce, A History of Zoroastrianism, 3 vols. (1975-1991)
  - >-
    M. Stausberg and Y. S.-D. Vevaina (eds.), The Wiley Blackwell Companion to Zoroastrianism
    (2015)
