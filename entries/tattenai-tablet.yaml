  wikidata: Q1641601
editorial:
  author_notes:
  - >-
    In 502 BCE Ebir-nāri still formed part of a combined satrapy with Babylon. Tattannu was
    subordinate to the satrap; explain the later division of the satrapy.
  - >-
    The tablet confirms the name and office, not the authenticity of the Aramaic correspondence
    in Ezra 5-6, which remains debated.
  - >-
    Verify the tablet's current museum and publication history (first identified by A. Ungnad
    and discussed by Olmstead) before citing them.
  sources_to_check:
