id: tattenai-tablet
title: Tattannu (Tattenai) Tablet
type: artifact
cultures: [babylonian, persian]
date:
  from: -502
  to: -502
  display: 502 BCE
scope: >-
  A Babylonian cuneiform legal tablet dated to year 20 of Darius I (502 BCE) that names Tattannu,
  governor (pīḫatu) of Ebir-nāri ('Across the River'), through one of his servants acting
  as witness. It attests the official whom Ezra 5-6 calls Tattenai.
passages:
- ref: Ezra 5:3, 6
  rel: attests
  note: Tattenai, governor of Beyond the River, investigates the temple rebuilding
- ref: Ezra 6:6, 13
  rel: attests
  note: Darius's reply addressed to Tattenai, who complies
- ref: Ezra 4:10-11, 16-17
  rel: language
  note: '''Beyond the River'' (ʿăbar nahărāʾ) = Akkadian Ebir-nāri as a provincial name'
- ref: Neh 2:7, 9
  rel: language
  note: '''Governors of Beyond the River'''
related: [darius-i, yehud-province, persia, persian-imperial-authorization, letter-writing-conventions]
media: []
external:
