    - "Isa 43:1-5 | form | 'Fear not, for I have redeemed you; I am with you'"
    - "Isa 44:2 | imagery | Deity who formed the addressee in the womb; Ishtar as the king's midwife and nurse"
    - "Isa 66:12-13 | imagery | Carried on the hip and comforted like a nursing child"
    - "2Sam 7:8-16 | concept | Divine promise of protection and lasting rule to the chosen king"
    - "Jer 36:1-4 | practice | Oracles written down and collected for preservation"
  related: [prophecy-in-the-ane, mari-letters, esarhaddon, ishtar, ashurbanipal, esarhaddon-succession-treaty]
  wikipedia: null
  image: null
  author_notes:
    - "SAA 9 gathers about 29 oracles on 11 tablets; prophets (raggimu/raggintu, maḫḫû) include women and persons of ambiguous gender. Collection tablets (e.g. SAA 9 1-3) show oracles being edited and archived, relevant to the formation of prophetic books."
