    - "The text compares gods to human masters ('Is the mind of man and god different?'), an explicit statement of the 'care and feeding of the gods' model; contrast biblical polemic (Ps 50:12-13)."
    - "Copies are from the 13th c.; composition may be earlier. See Taggar-Cohen (2006) and Miller (2013)."
  sources_to_check:
