    land-holding tenants over several generations, bearing many Yahwistic names.
  passages:
    - "Jer 29:4-7 | setting | Exiles told to build houses, plant gardens, marry, and seek the city's welfare"
    - "Ezek 3:15 | setting | Judean community at Tel-abib by the river Chebar: exiles settled in rural communities"
    - "Ezek 1:1-3 | setting | Judean exiles by the Chebar canal in Babylonia"
    - "Ps 137:1 | setting | 'By the rivers of Babylon': Judeans in the canal landscape of central Babylonia"
    - "Ezra 2:59 | setting | Exile settlements with Babylonian place names (Tel-melah, Tel-harsha, Cherub, Addan, Immer)"
    - "Ezra 2:1-2 | language | Yahwistic names among deportees and returnees"
  related: [babylonian-exile, murashu-archive, deportation, jehoiachin-ration-tablets, yehud-province, forgeries-in-biblical-archaeology]
  wikipedia: Al-Yahudu Tablets
  image: Al-Yahudu tablet
  author_notes:
    - "Unprovenanced: the tablets surfaced on the antiquities market (mostly in the David Sofer collection; exhibited at the Bible Lands Museum, Jerusalem, 2015). Flag the ethical and provenance issues explicitly."
    - "The earliest tablet is dated 572 (Nebuchadnezzar's 33rd year); the town name shows deportees settled as a group. Judeans appear in the land-for-service (ḫaṭru) system; Yahwistic names are written with -yāma/-yāḫu and Yāhû-."
    - "They show integration without loss of identity and continuity long after 539, which complicates a simple 'return' narrative (Alstola 2020)."
  sources_to_check:
    - "L. E. Pearce and C. Wunsch, Documents of Judean Exiles and West Semites in Babylonia in the Collection of David Sofer (CUSAS 28, 2014)"
    - "T. Alstola, Judeans in Babylonia: A Study of Deportees in the Sixth and Fifth Centuries BCE (CHANE 109, 2020)"

- id: murashu-archive
  aliases: ["Murašû archive", "Murashu Sons"]
  cultures: [babylonian, persian]
  date: [-454, -404]
  circa: true
  scope: >-
    The business archive of the Murašû family firm of Nippur under Artaxerxes I
    and Darius II, recording the management and financing of land-for-service
    holdings. It names the Kebar canal and includes West Semitic, among them
    Judean, clients, and is a key source for Persian-period Babylonia.
  passages:
    - "Ezek 1:1, 3; 3:15 | setting | Kebar canal (nār kabari) near Nippur, named in Murašû texts"
    - "Neh 5:4 | practice | Borrowing against fields and vineyards to pay the king's tax"
    - "Ezra 4:13 | practice | Persian levies (tribute, poll-tax, land-tax) on imperial subjects"
    - "Ezra 8:15-17 | setting | Judean communities remaining in Babylonia under Persian rule"
  related: [al-yahudu-tablets, babylonian-exile, persia, artaxerxes-i, yehud-province, weights-and-silver-money]
  wikipedia: Murashu family
  image: Murashu archive tablet Penn Museum
  author_notes:
    - "Several hundred tablets found at Nippur by the University of Pennsylvania expedition (1893); dates run 454-404. The firm leased and financed ḫaṭru holdings of military colonists who owed service and taxes (Stolper)."
    - "Yahwistic names appear among the clients (Coogan; Zadok); Judeans appear as ordinary participants in the regional economy. Avoid fixed counts unless verified."
    - "The Kebar canal identification links Ezekiel's setting to the Nippur region (also attested in the Āl-Yāhūdu corpus)."
  sources_to_check:
    - "M. W. Stolper, Entrepreneurs and Empire: The Murašû Archive, the Murašû Firm, and Persian Rule in Babylonia (1985)"
    - "M. D. Coogan, West Semitic Personal Names in the Murašû Documents (HSM 7, 1976)"
    - "R. Zadok, The Jews in Babylonia during the Chaldean and Achaemenian Periods (1979)"

- id: east-india-house-inscription
  cultures: [babylonian]
  date: [-600, -562]
  circa: true
  scope: >-
    A large inscribed stone tablet of Nebuchadnezzar II from Babylon, in
    archaising script, praising Marduk and Nabu and recording the king's
    building works in Babylon: its temples, palaces, processional way, and
    double walls. It is a prime example of the royal building boasts echoed in
    Daniel.
  passages:
    - "Dan 4:30 | parallel | King's boast of 'great Babylon, which I have built' (MT 4:27)"
    - "Jer 51:58 | setting | Babylon's broad walls, whose construction the inscription describes"
    - "Isa 46:1 | attests | Bel (Marduk) and Nebo (Nabu), the gods the inscription praises"
  related: [nebuchadnezzar-ii, babylon, ishtar-gate, etemenanki, marduk, nabu, temple-building-accounts]
  wikipedia: East India House Inscription
  image: East India House Inscription British Museum
  location: British Museum, London
  author_notes:
    - "Found at Babylon in the early 19th c. and long held at East India House, London, before passing to the British Museum; verify the acquisition history."
    - "The Dan 4:30 echo is of Nebuchadnezzar's building inscriptions generally; his inscriptions are pious, crediting Marduk, so Daniel's portrayal of arrogance reverses their tone."
    - "No Nebuchadnezzar building inscription mentions Judah or Jerusalem; avoid implying otherwise."
  sources_to_check:
    - "S. Langdon, Die neubabylonischen Königsinschriften (VAB 4, 1912)"

- id: tablet-of-destinies
  aliases: ["ṭuppi šīmāti", "Book of Life"]
  cultures: [babylonian, mesopotamian]
  scope: >-
    The Mesopotamian Tablet of Destinies, the emblem of supreme cosmic
    authority seized by Marduk in Enuma Elish and stolen by Anzu, together with
    the related idea of divine scribes (especially Nabu) writing the fates. The
    entry also covers the biblical "book of life" and heavenly books.
  passages:
    - "Exod 32:32-33 | concept | Divine book from which names may be blotted out"
    - "Ps 69:28 | concept | 'Book of the living' (MT 69:29)"
    - "Ps 139:16 | concept | Days of life written beforehand in God's book"
    - "Isa 4:3 | concept | Those recorded for life in Jerusalem"
    - "Mal 3:16 | concept | Book of remembrance written before YHWH"
    - "Dan 7:10 | concept | Books opened in the heavenly court"
    - "Dan 12:1 | concept | Those written in the book will be delivered"
    - "Rev 20:12 | concept | Books opened and the dead judged; the book of life"
  related: [enuma-elish, divine-council, akitu-festival, nabu, marduk, writing-and-literacy]
  wikipedia: Tablet of Destinies
  image: null
  author_notes:
    - "Distinguish the Tablet of Destinies (Enuma Elish I-IV; the Anzu myth), an emblem of power over the cosmos, from registers of individuals; the closer analogue to the 'book of life' is Nabu as scribe of destinies and the fixing of fates at the akītu festival."
    - "Biblical heavenly books also draw on administrative practice (citizen rolls, Ezek 13:9; Isa 4:3) and records of deeds (Mal 3:16; Dan 7:10); S. Paul (1973) remains the standard survey."
    - "Correct the popular claim that the biblical book of life is simply derived from the Tablet of Destinies."
  sources_to_check:
    - "S. M. Paul, 'Heavenly Tablets and the Book of Life,' JANESCU 5 (1973): 345-353"
    - "A. R. George, 'Sennacherib and the Tablet of Destinies,' Iraq 48 (1986): 133-146"

- id: akkadian-prophecies
  aliases: [Akkadian apocalypses, Marduk Prophecy, Šulgi Prophecy, Uruk Prophecy, Dynastic Prophecy, literary predictive texts]
  cultures: [babylonian, assyrian]
  date: [-1100, -300]
  circa: true
  scope: >-
    A small group of Akkadian literary texts (the Marduk and Šulgi Prophecies, the Uruk
    Prophecy, the Dynastic Prophecy, and "Text A") that survey a series of unnamed future
    reigns as good or bad and usually climax in a restoring king. They are vaticinia ex
    eventu written to legitimate a ruler or cult, and they are the main Mesopotamian
    comparanda for the historical reviews in Daniel. Oracles of actual prophets belong to
    neo-assyrian-prophecies and mari-letters.
  passages:
    - "Dan 11:2-45 | form | Succession of unnamed kings 'arising' as a history disguised as prediction"
    - "Dan 8:23-25 | form | Ex eventu portrait of a coming king, cast in the future tense"
    - "Dan 2:36-45 | parallel? | Sequence of empires; the Dynastic Prophecy runs from Assyria to the Macedonians"
    - "Ezek 43:1-5 | parallel | Deity returns to his temple after departing; cf. the Marduk Prophecy's return from exile"
    - "Ezek 10:18-19; 11:22-23 | parallel | Departure of the god from his city, as Marduk 'goes' to Hatti, Assyria and Elam"
  related: [four-kingdoms-schema, prophecy-of-neferti, divine-abandonment, marduk, prophecy-in-the-ane, neo-assyrian-prophecies, babylonian-chronicles]
  wikipedia: null
  image: null
  author_notes:
    - "The texts are not prophecy in the sense of oracles delivered by prophets. They are scribal compositions that use predictive language (often in the omen style 'a prince will arise and rule for N years'). Grayson's label 'literary predictive texts' and Hallo's 'Akkadian apocalypses' are both found; explain why neither label is perfect."
    - "Give the dates and agenda of each text separately. The Marduk Prophecy (copies from Assur and Nineveh) recounts the god's absences in Hatti, Assyria and Elam and predicts the king who will bring him back, probably Nebuchadnezzar I (12th c.). The Uruk Prophecy (late copy from Uruk) ends with a king from Uruk, often taken as Nebuchadnezzar II. The Dynastic Prophecy (Hellenistic) covers the fall of Assyria to the defeat of Darius III."
    - Lambert (1978) and others saw these texts as one background for Jewish apocalyptic, especially Dan 8 and 11. Present this as a typological and generic comparison, not as proof of direct literary dependence.
    - Note the shared logic with the Egyptian Prophecy of Neferti, a much older example of vaticinium ex eventu.
  sources_to_check:
    - "A. K. Grayson and W. G. Lambert, 'Akkadian Prophecies,' JCS 18 (1964)"
    - A. K. Grayson, Babylonian Historical-Literary Texts (1975)
    - "H. Hunger and S. A. Kaufman, 'A New Akkadian Prophecy Text,' JAOS 95 (1975)"
    - "R. Borger, 'Gott Marduk und Gott-König Šulgi als Propheten,' BiOr 28 (1971)"
    - W. G. Lambert, The Background of Jewish Apocalyptic (1978)
    - Tremper Longman III, Fictional Akkadian Autobiography (1991)
    - "M. Neujahr, Predicting the Past in the Ancient Near East (BJS 354, 2012)"

- id: erra-and-ishum
  aliases: [Erra Epic, Poem of Erra, Erra and Ishum]
  cultures: [babylonian]
  date: [-1100, -700]
  circa: true
  scope: >-
    An Akkadian poem in five tablets in which the plague and war god Erra persuades Marduk
    to leave his throne, then devastates Babylon and other cities without distinguishing the
    righteous from the wicked until his vizier Išum calms him. The poem explains a period of
    Babylonian disorder as divine anger, and copies were used as amulets against plague.
  passages:
    - "Ezek 9:1-11 | parallel? | Divine executioners slaughter the city; the prophet's intercession (v. 8) compared with Išum's"
    - "Ezek 21:3-5 | parallel | YHWH's drawn sword cuts off righteous and wicked alike (MT 21:8-10)"
    - "Ezek 21:9-17 | imagery | Song of the sword sharpened and polished for slaughter (MT 21:14-22)"
    - "Ezek 8:12; 9:9 | concept | 'YHWH has forsaken the land': divine absence precedes disaster"
    - "Gen 18:23-25 | concept | 'Will you sweep away the righteous with the wicked?'"
    - "Hab 3:5 | imagery | Pestilence (Deber) and plague (Resheph) march with the divine warrior"
    - "2Kgs 17:30 | attests | Nergal, with whom Erra is identified, worshipped by the people of Cuth"
  related: [divine-abandonment, marduk, resheph, babylon, divine-warrior, gods-of-2-kings-17, amulets, akkadian-prophecies]
  wikipedia: null
  image: Erra and Ishum amulet tablet
  author_notes:
    - "The colophon credits Kabti-ilani-Marduk, who claims the poem was revealed to him in a night vision. The date is debated: proposals range from the 11th to the 8th century (Lambert favoured the 8th). Copies are mostly 1st-millennium. Present the range."
    - Bodi (1991) argued that Ezekiel knew and adapted the poem (Ezek 7, 9, 21, and the departure of the deity). The thematic parallels are widely acknowledged, but direct dependence is debated. Treat it as a proposal.
    - "Explain the poem's theology. Marduk's absence from his throne, not his destruction, lets chaos loose, and an intercessor (Išum) limits divine wrath. Both points bear on Ezekiel and on the divine-abandonment motif."
    - Check the line numbers for the 'righteous and unrighteous' passage (Tablet IV) against Cagni's edition before quoting it.
  sources_to_check:
    - L. Cagni, The Poem of Erra (SANE 1/3, 1977)
    - D. Bodi, The Book of Ezekiel and the Poem of Erra (OBO 104, 1991)
    - S. Dalley, Myths from Mesopotamia (rev. ed. 2000)
    - B. R. Foster, Before the Muses (3rd ed. 2005)

- id: shurpu
  aliases: [Šurpu, Burning]
  cultures: [babylonian, assyrian]
  date: [-1400, -1000]
  circa: true
  scope: >-
    The Akkadian incantation series Šurpu ("Burning"), a ritual of the exorcist (āšipu) that
    frees a sufferer from a curse or ban (māmītu) incurred through offences he may not know
    he committed. Its long catalogues of possible sins, ritual and ethical, are the main
    Mesopotamian parallel to biblical concern with unwitting and hidden sin. The
    anti-witchcraft ceremony Maqlû has its own entry.
  passages:
    - "Lev 4:2, 13-14 | concept | Sin committed unwittingly (bišgāgâ) that later becomes known"
    - "Lev 5:1-6 | concept | Guilt incurred through unnoticed impurity, an ignored adjuration, or a rash oath; confession required"
    - "Lev 5:17-19 | concept | Guilt offering for an offence committed without knowing"
    - "Ps 19:12 | concept | 'Who can detect their errors? Clear me from hidden faults' (MT 19:13)"
    - "Deut 27:15-26 | parallel | Curses on secret offences: parents dishonoured, boundaries moved, neighbour's wife"
    - "Job 31:5-34 | form? | Oath of clearance listing possible offences; cf. Šurpu II's catalogue"
    - "Ezek 18:5-9 | form? | Catalogue of ethical and cultic acts defining the righteous man"
  related: [maqlu, mesopotamian-lament-prayers, book-of-the-dead, magic-and-sorcery, oaths-and-oath-formulas, purity-and-impurity, boundary-markers]
  wikipedia: Šurpu
  image: null
  author_notes:
    - "Tablet II lists offences that may have caused the sufferer's affliction, mixing ethical wrongs (false scales, moving a boundary, entering a neighbour's house and approaching his wife, saying 'yes' for 'no', despising parents) with ritual faults. Quote from Reiner's edition and check line numbers."
    - "The ritual (peeling an onion, unravelling wool, stripping dates and burning them) enacts the dissolving of the curse. Distinguish this ritual logic from the biblical sacrificial remedy for unwitting sin in Lev 4-5."
    - Composition is usually placed in the Middle Babylonian period; most copies are Neo-Assyrian and later. Say this in the article.
    - Compare and contrast with the Egyptian 'negative confession' (Book of the Dead 125) and Job 31. These are distinct genres with overlapping catalogues, not one form.
  sources_to_check:
    - "E. Reiner, Šurpu: A Collection of Sumerian and Akkadian Incantations (AfO Beiheft 11, 1958)"
    - "K. van der Toorn, Sin and Sanction in Israel and Mesopotamia (SSN 22, 1985)"

- id: great-hymn-to-shamash
  aliases: [Šamaš Hymn, Hymn to the Sun God]
  cultures: [babylonian, assyrian]
  scope: >-
    A 200-line Akkadian hymn praising Šamaš as the sun who lights and surveys the whole world,
    protects travellers and the needy, and punishes the unjust judge, the bribe-taker and the
    merchant with false weights. It is the fullest Mesopotamian statement of the sun god as
    all-seeing guardian of justice. The god himself is treated under shamash.
  passages:
    - "Ps 19:1-6 | imagery | The sun's circuit from end to end of heaven; nothing hidden from its heat (MT 19:2-7)"
    - "Ps 19:7-11 | concept | Sun hymn joined to praise of torah; cf. the sun god as guardian of justice (MT 19:8-12)"
    - "Ps 139:7-12 | concept | No escape from the deity's sight in heaven, Sheol, sea, or darkness"
    - "Ps 33:13-15 | concept | YHWH looks down from heaven and sees all humankind"
    - "Job 34:21-22 | concept | No darkness where evildoers may hide from God's eyes"
    - "Deut 25:13-16 | practice | Two kinds of weights forbidden; cf. the hymn's curse on the dishonest merchant"
    - "Prov 11:1; 20:10, 23 | concept | False balances and differing weights an abomination to YHWH"
    - "Exod 23:8 | practice | Bribes blind officials; cf. Šamaš punishing the judge who takes a bribe"
    - "Mal 4:2 | imagery | Sun of righteousness rising with healing in its wings (MT 3:20)"
  related: [shamash, tablet-of-shamash, justice-and-righteousness, code-of-hammurabi, weights-and-silver-money, great-hymn-to-the-aten, mesopotamian-lament-prayers]
  wikipedia: null
  image: null
  author_notes:
    - "The main copies are from Ashurbanipal's library at Nineveh (7th c.), with others from elsewhere. Composition is probably earlier but cannot be dated closely, which is why no date is given here."
    - "Sarna's study of Ps 19 against sun-god literature (1967) is the classic case: the joining of solar praise (vv. 1-6) and torah (vv. 7-14) makes sense against Šamaš as lord of light and of justice. Do not claim that Ps 19:1-6 was a hymn to the sun god."
    - Note the hymn's social range (merchants, travellers, fishermen, the captive, the sick), which gives a concrete picture of what 'justice' meant in daily life.
    - Distinguish this hymn from the Egyptian Great Hymn to the Aten, often cited for Ps 104. The two are frequently confused in popular literature.
  sources_to_check:
    - W. G. Lambert, Babylonian Wisdom Literature (1960), 121-138
    - ANET 387-389
    - B. R. Foster, Before the Muses (3rd ed. 2005)

- id: esarhaddon-treaty-with-baal-of-tyre
  aliases: [Treaty of Esarhaddon with Baal of Tyre, SAA 2 5]
  cultures: [assyrian, phoenician]
  date: [-681, -669]
  circa: true
  scope: >-
    A fragmentary Neo-Assyrian treaty imposed by Esarhaddon on Baal (Baʿalu), king of Tyre. It
    regulates Tyre's trade, ports and shipwrecks under Assyrian supervision and ends with
    curses invoking Assyrian gods together with Bethel, Anat-Bethel, Baal-shamayin,
    Baal-malage, Baal-saphon, Melqart, Eshmun and Astarte. It is the only surviving Assyrian
    treaty with a Phoenician city.
  passages:
    - "Ezek 27:25-36 | imagery | Tyre as a laden ship wrecked by the east wind in the heart of the seas; cf. the storm-god curse on Tyre's ships"
    - "Ps 48:7 | imagery | The east wind shatters the ships of Tarshish (MT 48:8)"
    - "Ezek 27:12-25 | setting | Tyre's trading partners and goods, the commerce the treaty regulates"
    - "Amos 1:9 | practice | Tyre condemned for forgetting the 'covenant of brothers'"
    - "1Kgs 5:12 | practice | Treaty (bĕrît) between Hiram of Tyre and Solomon (MT 5:26)"
    - "2Kgs 21:1 | setting | Manasseh, listed with Baal of Tyre among Esarhaddon's western vassals"
    - "Jer 48:13 | language? | Bethel as a divine name; the treaty invokes Bethel and Anat-Bethel"
    - "Dan 9:27; 11:31; 12:11 | language | 'Abomination that desolates', widely read as a pun on Baal-shamem, a god invoked in the curses"
  related: [esarhaddon, tyre, melqart, esarhaddon-succession-treaty, covenant-and-treaty-form, blessings-and-curses, phoenician-seafaring, esarhaddon-prisms]
  wikipedia: null
  image: Esarhaddon treaty Baal of Tyre tablet
  location: British Museum, London
  author_notes:
    - The date within Esarhaddon's reign is uncertain; a date soon after the destruction of Sidon (677/676) is often proposed. Ashurbanipal later besieged Baal (Rassam Cylinder), so the treaty did not secure lasting loyalty.
    - "The trade clauses are the most informative part: they name ports and routes (Akko, Dor, the Philistine coast, Byblos, the Lebanon) and specify that the cargo of a Tyrian ship wrecked on Assyrian-controlled coast belongs to the king while the crew is spared. Explain what this shows about Assyrian economic interest in Phoenician trade."
    - The curse list is valuable evidence for the Phoenician pantheon in the 7th century, including the first-millennium god Bethel. Do not overstate links to Jer 48:13, where the reading of Bethel as a god is debated.
    - The tablet is badly broken, so translations differ in restorations. Quote from SAA 2 and mark restorations.
  sources_to_check:
    - "S. Parpola and K. Watanabe, Neo-Assyrian Treaties and Loyalty Oaths (SAA 2, 1988), no. 5"
    - ANET 533-534

