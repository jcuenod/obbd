  location: Istanbul Archaeology Museums (cuneiform tablet); hieroglyphic versions in situ at Karnak and the Ramesseum
  author_notes:
    - "Dated to Ramesses II's year 21, some 15 years after Kadesh; the original silver tablets are lost. Each version presents the other side as seeking peace, which is useful for discussing royal propaganda."
    - "A parity treaty, unlike the vassal treaties used in covenant-form debates. Its clauses on extradition with amnesty for returned fugitives and on support for the legitimate heir are frequently discussed."
    - "Popular claims (e.g. 'the world's first peace treaty', the replica at the United Nations) need careful phrasing; earlier treaties exist."
    - "A royal marriage of Ramesses II to a Hittite princess followed about 13 years later; use it for the diplomatic-marriage link."
  sources_to_check:
    - "G. Beckman, Hittite Diplomatic Texts (2nd ed., 1999), no. 15"
    - "E. Edel, Der Vertrag zwischen Ramses II. von Ägypten und Ḫattušili III. von Ḫatti (1997)"
    - ANET 199-203

- id: plague-prayers-of-mursili
