  circa: true
  scope: >-
    The Sumerian law collection of Lipit-Ishtar, king of Isin, reconstructed
    from Old Babylonian school copies. It is the earliest well-preserved example
    of the prologue-laws-epilogue frame later used by Hammurabi, with an
    epilogue of blessings and curses.
  passages:
