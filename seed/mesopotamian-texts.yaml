    - "Lev 18:6-18 | parallel | Prohibited sexual unions with close relatives (HL §§189-195)"
    - "Deut 25:5-10 | practice | Widow married by the deceased's brother, then his father (HL §193)"
    - "Gen 38:8-26 | practice | Levirate duty passing from brothers to the father-in-law (HL §193)"
    - "Deut 22:23-27 | parallel | Woman seized in the mountains is innocent; in the house, culpable (HL §197)"
    - "Exod 21:22 | parallel | Compensation for causing a woman's miscarriage (HL §§17-18)"
    - "Deut 21:1-9 | practice | Body found in open country: distance measured to the nearest town, which is liable"
  related: [levirate-marriage, ane-law-collections, middle-assyrian-laws, hittites-and-hethites, purity-and-impurity]
