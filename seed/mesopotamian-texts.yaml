- id: hittite-elimination-rituals
  cultures: [hittite, luwian, hurrian]
  date: [-1400, -1200]
  circa: true
  scope: >-
    Hittite-archive rituals, many of Luwian or Hurro-Kizzuwatnean origin, that
    remove plague, impurity, or evil by transferring it to a carrier (a ram, a
    ewe, a donkey, a bird, a mouse, or a human substitute) that is driven away to
    enemy territory or the wild. They are the principal comparanda for the
    biblical scapegoat and bird rites.
  passages:
    - "Lev 16:8-10, 20-22 | parallel | Live animal carries evil away to a remote place (Ashella, Uhhamuwa ram rites)"
    - "Lev 14:4-7, 49-53 | practice | Live bird released into the open field to remove impurity"
    - "Zech 5:5-11 | concept | Personified wickedness carried off to a foreign land (Shinar)"
    - "1Sam 6:1-12 | practice? | Philistines send plague-related objects away on a driverless cart"
  related: [day-of-atonement-elimination, purity-and-impurity, demons, maqlu, sacrifice, hittites-and-hethites]
  wikipedia: null
  image: null
  author_notes:
    - "Key texts: Ashella (CTH 394) and Uhhamuwa (CTH 410), both Arzawan, against army plague; Pulisa (CTH 407) with a human substitute; Kizzuwatna rites with birds. Earlier, a third-millennium Ebla ritual sends a goat to the steppe (Zatelli)."
    - "Wright (1987) and Janowski and Wilhelm (1993) trace the carrier rite to a north Syrian/south Anatolian milieu. Differences: the Hittite carrier goes to the enemy, the biblical goat to Azazel in the wilderness, and the laying on of hands is not part of the Hittite rites."
    - "Avoid presenting Lev 16 as borrowed from a specific Hittite text; the consensus is a shared regional ritual type."
  sources_to_check:
    - "D. P. Wright, The Disposal of Impurity: Elimination Rites in the Bible and in Hittite and Mesopotamian Literature (SBLDS 101, 1987)"
    - "B. Janowski and G. Wilhelm, 'Der Bock, der die Sünden hinausträgt,' in Religionsgeschichtliche Beziehungen zwischen Kleinasien, Nordsyrien und dem Alten Testament (OBO 129, 1993)"

- id: ahiqar
  aliases: ["Ahikar", "Words of Ahiqar", "Story of Ahikar"]
  cultures: [aramean, assyrian]
  date: [-700, -500]
  circa: true
  scope: >-
    The tale of Ahiqar, wise counsellor of the Assyrian kings Sennacherib and
    Esarhaddon, betrayed by his adopted nephew Nadin and later vindicated,
    combined with a collection of Aramaic proverbs. The earliest copy is the
    late-5th-century Elephantine papyrus; the work circulated widely in later
    languages and is named in Tobit.
  passages:
    - "Tob 1:21-22 | attests | Ahikar as Tobit's nephew and chief cupbearer and administrator under Esarhaddon"
    - "Tob 14:10 | attests | Nadab's treachery against Ahikar as a moral example"
    - "Tob 2:10; 11:18 | attests | Ahikar supports Tobit and attends his son's wedding"
    - "Prov 23:13-14 | parallel | Do not withhold the rod from a child; he will not die"
    - "Prov 25:15 | parallel | A soft tongue breaks bones"
    - "Dan 6 | form | Wise courtier at a foreign court, falsely accused, condemned, and vindicated"
    - "Matt 24:45-51 | parallel? | Wicked servant who abuses fellow servants and is punished (cf. Nadin)"
  related: [elephantine-papyri, ane-wisdom-literature, esarhaddon, aramaic-language, court-officials, instruction-of-amenemope]
  wikipedia: Story of Ahikar
  image: Ahiqar papyrus Elephantine
  author_notes:
    - "The Elephantine papyrus (written over a customs account from Xerxes' reign, c. 475) has the narrative in Imperial Aramaic and proverbs probably older, in a western Aramaic dialect (Lindenberger)."
    - "A Seleucid tablet from Uruk lists the scholar Aba-enlil-dari 'whom the Arameans call Aḫuqar' under Esarhaddon, so the figure may have a historical kernel; do not overstate this."
    - "Later Syriac, Armenian, Arabic, and other versions, and the Greek Life of Aesop, reworked the story; distinguish them from the Aramaic text when citing proverbs."
    - "Ahiqar is a key witness to the courtier-tale genre (Joseph, Daniel, Esther) and to the shared international wisdom culture."
  sources_to_check:
