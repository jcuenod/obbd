    - "H. Otten, Die Apologie Hattusilis III (StBoT 24, 1981)"
    - "P. K. McCarter Jr., 'The Apology of David,' JBL 99 (1980): 489-504"
    - "A. Knapp, Royal Apologetic in the Ancient Near East (WAWSup 4, 2015)"

- id: hittite-instructions-temple-officials
