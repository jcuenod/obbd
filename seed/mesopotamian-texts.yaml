    - "Relevant to the 'Darius the Mede' problem: no such figure appears, though Gubaru appoints governors. Present the identifications proposed in the literature neutrally."
    - "The supposed reference to Lydia in 547 rests on a damaged sign; avoid citing it as certain."
  sources_to_check:
