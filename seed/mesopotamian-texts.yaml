  scope: >-
    The Babylonian chronicle tablet covering the first years of Nebuchadnezzar
    II (605-594 BCE), including the battle of Carchemish and the capture of "the
    city of Judah" on 2 Adar of his seventh year (March 597). It provides the
    most precise extra-biblical date in the history of Judah.
  passages:
    - "2Kgs 24:10-17 | event | Capture of Jerusalem (March 597), king seized, 'a king of his own choice' appointed"
    - "2Chr 36:10 | event | Jehoiachin taken to Babylon; Zedekiah made king"
    - "Jer 46:2 | event | Egyptian army routed at Carchemish in Nebuchadnezzar's accession year (605)"
    - "Jer 47:5-7 | event | Ashkelon captured and sacked (Kislev 604)"
    - "2Kgs 24:1 | event | Costly Babylonian-Egyptian clash of 601, likely context of Jehoiakim's revolt"
    - "Dan 1:1-2 | event? | 605 campaign in Hatti, sometimes linked to Daniel's 'third year of Jehoiakim' siege"
  related: [babylonian-chronicles, nebuchadnezzar-ii, jehoiachin, battle-of-carchemish, fall-of-jerusalem-587, jehoiachin-ration-tablets, ashkelon]
  wikipedia: Nebuchadnezzar Chronicle
  image: Nebuchadnezzar Chronicle BM 21946 British Museum
  location: British Museum, London
  author_notes:
    - "Published by Wiseman (1956). Neither Jehoiachin nor Zedekiah is named; the city is 'the city of Judah' (URU ia-a-ḫu-du)."
    - "Use it for the chronology of 597 (Babylonian year 7, cf. Jer 52:28) against 2 Kgs 24:12 ('eighth year'), and for accession-year reckoning."
    - "The chronicle does not mention a siege of Jerusalem in 605, so Dan 1:1-2 remains historically problematic; present this neutrally."
    - "The tablet's own date of writing is uncertain; do not assign it a firm date."
  sources_to_check:
