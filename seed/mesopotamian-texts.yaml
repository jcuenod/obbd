    - ANET 589-591

- id: instructions-of-shuruppak
  aliases: ["Instructions of Šuruppak"]
  cultures: [sumerian]
  date: [-2600, -2500]
  circa: true
  scope: >-
    A Sumerian collection of practical admonitions given by Shuruppak to his son
    Ziusudra, the flood hero. Attested from Early Dynastic tablets of c. 2500 BCE
    to Old Babylonian school copies, it is among the oldest surviving works of
    literature and the earliest instance of the father-to-son instruction genre.
  passages:
    - "Prov 1:8 | form | Instruction framed as a father's counsel to his son"
    - "Prov 4:1-4 | form | Father passes on teaching received in turn from his own father"
    - "Prov 6:1-5 | parallel | Do not stand surety for another"
    - "Prov 6:24-29 | parallel | Warnings against sexual involvement with another man's wife"
  related: [ane-wisdom-literature, instruction-of-amenemope, instruction-of-ptahhotep, eridu-genesis, scribes-and-scribal-education, ahiqar]
  wikipedia: Instructions of Shuruppak
  image: Instructions of Shuruppak tablet
  author_notes:
    - "Earliest copies from Abu Salabikh and Adab (Early Dynastic IIIa); the Old Babylonian version is longer. Alster's edition (2005) is standard."
    - "The link to the flood hero Ziusudra frames ancient wisdom as antediluvian, a point of contact with traditions about sages before the flood."
    - "Parallels with Proverbs are of genre and common sense (surety, adultery, speech), not of dependence; the father-son frame is pan-Near Eastern (cf. Egyptian instructions, Ahiqar)."
  sources_to_check:
