    - "Deut 25:5-10 | practice | Widow given to her late husband's brother or father-in-law"
    - "Deut 22:22 | parallel | Adulterers caught in the act both liable to death (MAL A §§13-15)"
    - "Deut 22:23-27 | parallel | Consent and location in judging sexual assault (MAL A §12)"
    - "Deut 22:28-29 | parallel | Violator of an unbetrothed virgin pays her father and must marry her (MAL A §55)"
    - "Exod 22:16-17 | parallel | Seducer pays and may marry the girl at the father's discretion (MAL A §56) (MT 22:15-16)"
    - "Gen 38:14-15 | practice | Veiling regulated by status; prostitutes forbidden to veil (MAL A §40)"
    - "Exod 21:22-25 | parallel | Penalties for causing a miscarriage (MAL A §§21, 50-52)"
