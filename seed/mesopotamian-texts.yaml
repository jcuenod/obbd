- id: edict-of-ammi-saduqa
  aliases: ["Ammi-ṣaduqa's Edict", "mīšarum edict"]
  cultures: [akkadian, babylonian]
  date: [-1646]
  circa: true
  scope: >-
    The best-preserved Old Babylonian mīšarum ("equity") decree, issued by
    Ammi-ṣaduqa of Babylon, probably at his accession. It cancelled consumer
    debts and arrears and released persons in debt bondage, while excluding
    commercial loans and house-born slaves, and is the main ANE analogue to
    biblical debt-release and jubilee laws.
  passages:
    - "Lev 25:8-17 | practice | Proclamation of release (dĕrôr, cognate with Akk. andurārum) in the jubilee year"
    - "Lev 25:39-46 | practice | Release of indebted kin but not chattel slaves; the edict also excludes house-born slaves"
    - "Deut 15:1-11 | practice | Periodic remission of debts; foreigners excepted, as the edict excepts commercial loans"
    - "Jer 34:8-22 | practice | King's ad hoc proclamation of release, then revoked"
    - "Neh 5:1-13 | practice | Governor's cancellation of debts and pledges in a crisis"
    - "Isa 61:1-2 | language | 'Proclaim liberty (dĕrôr) to the captives'"
    - "Ezek 46:17 | language | 'Year of liberty' (šĕnat dĕrôr) when gifted land reverts"
  related: [debt-release, sabbatical-year, slavery, hammurabi, widow-orphan-sojourner, land-redemption]
  wikipedia: null
  image: Ammi-saduqa edict tablet
  author_notes:
    - "Mīšarum acts were proclaimed by several Old Babylonian kings (Hammurabi included), usually at accession; Ammi-ṣaduqa's (mid-17th c.) is best preserved. Finkelstein (1961) and Kraus (1984) are foundational."
    - "Biblical law turns an ad hoc royal act into a fixed cycle (seventh and fiftieth years) under divine authority (Weinfeld). Whether the jubilee was ever practised is debated."
    - "The andurārum/dĕrôr equation is secure; Neo-Assyrian andurāru decrees show the institution's persistence into the first millennium."
  sources_to_check:
    - "F. R. Kraus, Königliche Verfügungen in altbabylonischer Zeit (1984)"
    - "J. J. Finkelstein, 'Ammiṣaduqa's Edict and the Babylonian Law Codes,' JCS 15 (1961): 91-104"
    - "M. Weinfeld, Social Justice in Ancient Israel and in the Ancient Near East (1995)"
    - ANET 526-528

- id: esarhaddon-succession-treaty
  aliases: ["Vassal Treaties of Esarhaddon", "VTE", "EST", "adê of Esarhaddon"]
  cultures: [assyrian]
  date: [-672]
  scope: >-
    The loyalty oath (adê) imposed in 672 BCE by Esarhaddon of Assyria on
    vassals and subjects to secure the succession of Ashurbanipal, known from
    copies found at Nimrud and Tell Tayinat. Its loyalty clauses and curse
    sequences are the closest known parallels to Deuteronomy 13 and 28.
  passages:
    - "Deut 13:1-18 | parallel | Duty to report and punish incitement to disloyalty, even by prophets or kin (MT 13:2-19)"
    - "Deut 28:26-30 | parallel | Curse sequence: corpses to birds, skin disease, blindness, wife taken (EST §§39-42)"
    - "Deut 28:23 | parallel | Sky of bronze and earth of iron (EST §§63-64)"
    - "Deut 6:5 | language | Command to 'love' the overlord with all one's heart; 'love Ashurbanipal as yourselves'"
    - "Deut 12:32 | parallel | Do not add to or take from the words (MT 13:1); EST forbids altering the treaty tablet"
    - "Deut 6:6-9 | practice? | Oath to be passed on to children and descendants"
    - "2Kgs 21:1-18 | setting? | Manasseh, an Assyrian vassal under Esarhaddon, probably bound by such oaths"
    - "Ezek 17:11-21 | concept | Breaking a vassal oath sworn in the deity's name as an offence against that deity"
  related: [covenant-and-treaty-form, blessings-and-curses, esarhaddon, ashurbanipal, covenant-love-language, oaths-and-oath-formulas, manasseh, sefire-treaties]
  wikipedia: null
  image: Esarhaddon vassal treaty tablet Nimrud
  author_notes:
    - "Copies found in 1955 in the Nabû temple at Nimrud (sworn by Median rulers) and in 2009 at Tell Tayinat in the Syrian west. The Tayinat copy shows western vassals bound by the same text and strengthens (but does not prove) the case that Judah knew it."
    - "Many (Otto, Levinson, Steymans) see Deut 13 and 28 as a deliberate, subversive adaptation that transfers loyalty from the Assyrian king to YHWH; Crouch (2014) and others question the criteria for direct dependence. Present it as influential but contested."
    - "Moran (CBQ 1963) established 'love' as treaty language for loyalty; the EST loyalty clauses are a key comparandum."
    - "Section numbers follow SAA 2 6; check them, since older literature uses line numbers (Wiseman 1958)."
  sources_to_check:
    - "S. Parpola and K. Watanabe, Neo-Assyrian Treaties and Loyalty Oaths (SAA 2, 1988), no. 6"
    - "D. J. Wiseman, 'The Vassal-Treaties of Esarhaddon,' Iraq 20 (1958)"
    - "J. Lauinger, 'Esarhaddon's Succession Treaty at Tell Tayinat: Text and Commentary,' JCS 64 (2012): 87-123"
    - "H. U. Steymans, Deuteronomium 28 und die adê zur Thronfolgeregelung Asarhaddons (OBO 145, 1995)"
    - ANET 534-541

- id: hittite-vassal-treaties
  cultures: [hittite]
  date: [-1400, -1200]
  circa: true
  scope: >-
    The Late Bronze Age treaties by which Hittite great kings bound subordinate
    rulers. They typically include a preamble, historical prologue, stipulations,
    provisions for deposit and public reading, divine witnesses, and curses and
    blessings. Since Mendenhall (1954) they have been central to the comparison
    of covenant forms in Exodus, Deuteronomy, and Joshua.
  passages:
    - "Exod 20:2 | form | Self-identification of the overlord with his past benefaction (historical prologue)"
    - "Exod 20:1-17 | form? | Decalogue read as treaty stipulations of exclusive loyalty (Mendenhall)"
    - "Deut 1:6-3:29 | form | Historical review of the relationship before the stipulations"
    - "Josh 24:1-28 | form | Covenant ceremony: history, stipulations, witnesses, written record"
    - "Deut 31:9-13, 24-26 | practice | Document deposited in the sanctuary and periodically read aloud"
    - "Exod 25:16 | practice | Covenant document ('testimony') placed in the ark"
    - "Deut 28 | form | Blessings and curses as treaty sanctions"
    - "Deut 30:19 | form | Heaven and earth invoked as witnesses, as at the end of Hittite divine-witness lists"
  related: [covenant-and-treaty-form, blessings-and-curses, esarhaddon-succession-treaty, egyptian-hittite-peace-treaty, covenant-lawsuit, sefire-treaties, hittites-and-hethites]
  wikipedia: null
  image: Bronze tablet Hattusa treaty
  author_notes:
    - "Mendenhall, Baltzer, McCarthy, and Kitchen argued that the Hittite form matches the Sinai/Deuteronomy covenant and supports an early date. Most now find Deuteronomy's closest analogues in 7th-c. Neo-Assyrian oaths, yet Hittite features (historical prologue, blessings) remain; Berman revives the Hittite comparison."
    - "Representative texts: Šuppiluliuma I with Aziru of Amurru; Muršili II with Tuppi-Teššub; the bronze tablet of Tudḫaliya IV with Kurunta (found at Ḫattuša in 1986)."
    - "Treat the Decalogue-as-treaty idea as contested; the analogy holds better for Deuteronomy as a whole."
  sources_to_check:
    - "G. Beckman, Hittite Diplomatic Texts (2nd ed., SBLWAW 7, 1999)"
    - "D. J. McCarthy, Treaty and Covenant (rev. ed., AnBib 21A, 1978)"
    - "K. A. Kitchen and P. J. N. Lawrence, Treaty, Law and Covenant in the Ancient Near East (2012)"
    - ANET 203-205

