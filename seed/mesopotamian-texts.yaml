    - "Deut 28 | form | Blessings and curses following a law corpus"
    - "Exod 21:22 | parallel | Fine for causing a woman's miscarriage"
    - "Exod 22:14-15 | parallel | Liability for injury to a hired or borrowed ox (MT 22:13-14)"
    - "Judg 11:1-2 | practice | Status of a prostitute's son; LL §27 makes him heir, Jephthah is expelled"
  related: [ane-law-collections, laws-of-ur-nammu, code-of-hammurabi, blessings-and-curses, inheritance-and-birthright]
  wikipedia: Code of Lipit-Ishtar
  image: Lipit-Ishtar law code tablet
  author_notes:
    - "The frame (gods call the king; laws; curses on anyone who defaces the stele) predates Hammurabi and is often compared with the hortatory endings of the Covenant Code (Exod 23:20-33) and Holiness Code (Lev 26), which however are divine speech rather than royal self-praise."
    - "The text is reconstructed from many fragmentary copies, and the assignment of some provisions (e.g. on miscarriage) to LL rather than to Sumerian school exercises should be checked against Roth."
  sources_to_check:
