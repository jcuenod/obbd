  author_notes:
    - "Speiser and Gordon used Nuzi to date the patriarchs to the second millennium; Thompson (1974), Van Seters (1975), and Selman (1980) showed that many parallels were misread or are attested across periods. Present Nuzi as illustrating customary law, not as dating evidence."
    - "Speiser's 'wife-sister' adoption theory for Gen 12, 20, and 26 is now rejected; mention it as a historiographical misconception."
    - "The household-gods-and-inheritance thesis for Rachel's theft (Gen 31) was challenged by Greenberg (1962) and others; keep it as a debated option."
