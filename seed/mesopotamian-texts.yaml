- id: apology-of-hattusili
  aliases: ["Apology of Ḫattušili III", "Autobiography of Hattusili"]
  cultures: [hittite]
  date: [-1267, -1237]
  circa: true
  scope: >-
    The self-justifying account by which Ḫattušili III, who deposed his nephew
    Urḫi-Teššub, presents his rise as guided by the goddess Šaušga (Ishtar) of
    Šamuḫa and his seizure of the throne as forced and lawful. It is the
    standard example of the ANE royal "apology" genre compared with the story of
    David's rise.
  passages:
    - "1Sam 16-31 | form | History of David's rise as a royal apology for a usurper"
    - "2Sam 1:1-5:10 | form | Continuation of David's rise, defending him against charges of usurpation"
    - "1Sam 18:12-16 | concept | Divine favour and military success legitimate the rising hero"
    - "2Sam 3:28-39 | concept | Protestation of innocence in the deaths of rivals"
    - "1Sam 24:1-22 | concept? | Restraint toward the reigning king before taking power (MT 24:2-23)"
    - "1Kgs 1-2 | form? | Account justifying a contested succession"
  related: [david, royal-ideology, ishtar, royal-annals-and-historiography, plague-prayers-of-mursili, hittites-and-hethites]
  wikipedia: null
  image: null
  author_notes:
    - "Hoffner (1975) and McCarter (JBL 1980) set out the genre comparison; Knapp (2015) widens it to first-millennium apologies (e.g. Esarhaddon's Nineveh A, Kilamuwa), which narrows the chronological gap with Samuel."
    - "The comparison concerns genre and propaganda, not Hittite literary influence on Samuel."
    - "The Edict of Telipinu (an earlier Hittite succession text) is also compared with 1 Kgs 1-2; note it if the article treats succession narratives."
  sources_to_check:
