    - "Mic 5:12 | language | YHWH will cut off sorceries (kĕšāpîm) (MT 5:11)"
    - "Isa 47:9, 12 | language | Babylon's many sorceries and spells"
    - "Nah 3:4 | imagery | Nineveh as a harlot and mistress of sorceries"
    - "Ezek 13:17-23 | practice? | Women's binding bands and veils to 'hunt lives': harmful magic"
  related: [divination, demons, lamashtu-pazuzu-amulets, necromancy, amulets, mouth-washing-and-opening]
  wikipedia: Maqlû
  image: null
  author_notes:
    - "Abusch's edition (2016) and studies reconstruct the ceremony's growth from a shorter rite; it was performed at the end of the month Abu."
    - "In Mesopotamia witchcraft (kišpū) was illicit harmful magic, while the āšipu's counter-magic was legitimate state-sanctioned expertise. Biblical law rejects a wider range of practices, so do not equate the categories."
    - "The root kšp is shared by Hebrew and Akkadian; note the lexical link without assuming identical practices."
  sources_to_check:
    - "T. Abusch, The Magical Ceremony Maqlû: A Critical Edition (2016)"
    - "T. Abusch and D. Schwemer, Corpus of Mesopotamian Anti-Witchcraft Rituals (2011-)"

- id: enuma-anu-enlil
  aliases: ["Enūma Anu Enlil", "EAE"]
  cultures: [babylonian, assyrian]
  date: [-1200, -650]
  circa: true
  scope: >-
    The canonical Babylonian series of about seventy tablets of celestial omens
    (lunar, solar, meteorological, and planetary) used by court scholars to
    interpret signs in the sky for king and state. It is the chief background for
    biblical references to Babylonian star-gazers and portents in the heavens.
  passages:
    - "Isa 47:13 | practice | Babylon's star-gazers who divide the heavens and forecast by the new moons"
    - "Jer 10:2 | concept | 'Do not be dismayed at the signs of the heavens' as the nations are"
    - "Dan 2:2, 10 | practice | Babylonian court experts (magicians, enchanters, Chaldeans) consulted by the king"
    - "Amos 8:9 | imagery? | Sun set at noon, darkness by day: eclipse as ominous portent"
    - "Matt 2:1-2 | practice | Magi from the east read a star as the sign of a royal birth"
  related: [astrology, divination, constellations, host-of-heaven, extispicy, library-of-ashurbanipal]
