  aliases: ["Treaty of Kadesh", "Silver Treaty"]
  cultures: [hittite, egyptian]
  date: [-1259]
  circa: true
  scope: >-
    The parity treaty concluded about 1259 BCE between Ramesses II of Egypt and
    Ḫattušili III of Ḫatti, preserved in Akkadian cuneiform tablets from Ḫattuša
