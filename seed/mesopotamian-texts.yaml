    - ANET 455-463, 611-619
    - "P. Michalowski, The Lamentation over the Destruction of Sumer and Ur (1989)"
    - "F. W. Dobbs-Allsopp, Weep, O Daughter of Zion (BibOr 44, 1993)"

- id: mesopotamian-lament-prayers
  aliases: ["Šuila prayers", "Prayers of the lifted hand", "Eršaḫunga", "Penitential psalms (Mesopotamian)"]
  cultures: [babylonian, assyrian, sumerian]
