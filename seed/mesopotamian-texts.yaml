    - "1Kgs 20:32-34 | language | Ahab calls Ben-hadad 'my brother' and concludes a treaty"
    - "Amos 1:9 | language | 'Covenant of brothers' (bĕrît ʾaḥîm) between states"
    - "1Kgs 2:39-40 | practice? | Fugitive slaves recovered from a neighbouring king (cf. extradition clauses)"
    - "Deut 23:15-16 | practice? | Ban on returning a fugitive slave, against treaty extradition norms (MT 23:16-17)"
    - "1Kgs 3:1 | practice | Diplomatic marriage sealing an alliance with Egypt"
  related: [ramesses-ii, brotherhood-language, diplomatic-marriage, covenant-and-treaty-form, hittite-vassal-treaties, kadesh-battle-reliefs, hiram-of-tyre]
