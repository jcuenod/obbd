- id: laws-of-eshnunna
  aliases: ["LE", "Code of Eshnunna"]
  cultures: [akkadian]
  date: [-1800, -1760]
  circa: true
  scope: >-
    An Old Babylonian Akkadian law collection from the kingdom of Eshnunna,
    known chiefly from two tablets found at Tell Harmal. It contains the closest
    verbal parallel to any biblical law, the ruling on an ox that gores another
    ox.
  passages:
    - "Exod 21:35 | parallel | Ox gores ox: owners divide the live ox and the carcass (LE §53), nearly verbatim"
    - "Exod 21:28-32 | parallel | Owner warned of a goring ox pays when it kills a person (LE §§54-55)"
    - "Exod 22:2-3 | parallel | Thief in a house at night may be killed; by day penalty differs (LE §§12-13) (MT 22:1-2)"
    - "Exod 22:7-8 | practice | Lost deposit: depositary clears himself by oath before the god (LE §§36-37) (MT 22:6-7)"
    - "Deut 22:25-27 | parallel | Rape of a betrothed girl: death for the man (LE §26)"
    - "Deut 22:8 | practice | Owner liable for deaths from a known structural hazard (LE §58: tottering wall)"
  related: [goring-ox, code-of-hammurabi, ane-law-collections, oaths-and-oath-formulas, laws-of-lipit-ishtar]
  wikipedia: Laws of Eshnunna
  image: Laws of Eshnunna tablet
  author_notes:
    - "Two tablets from Tell Harmal (Shaduppum) excavated in 1945-49 (Goetze's edition 1956) plus a fragment from Tell Haddad; usually dated a generation or two before Hammurabi, possibly to Dadusha's reign."
    - "LE §53 and Exod 21:35 are the most celebrated verbal parallel in ANE law (Yaron; Jackson; Westbrook). Most explain it by shared legal-scribal tradition rather than Israelite access to Eshnunna; Wright posits mediation through LH."
    - "The day/night burglar distinction (§§12-13) is another strong parallel and illustrates shared casuistic reasoning."
  sources_to_check:
    - "M. T. Roth, Law Collections from Mesopotamia and Asia Minor (2nd ed., 1997)"
    - COS 2.130
    - ANET 161-163
    - "R. Yaron, The Laws of Eshnunna (2nd ed., 1988)"

- id: middle-assyrian-laws
