- id: babylonian-theodicy
  cultures: [babylonian]
  date: [-1100, -900]
  circa: true
  scope: >-
    An acrostic dialogue poem of 27 eleven-line stanzas between a sufferer and a
    friend on why the pious suffer and the wicked prosper. The acrostic spells
    out the author's name, Saggil-kīnam-ubbib, and the poem is the closest
    Mesopotamian formal analogue to the dialogue of Job.
  passages:
    - "Job 3-31 | form | Alternating dialogue between sufferer and friend(s) on divine justice"
    - "Job 21:7-16 | concept | Prosperity of the wicked versus suffering of the pious"
    - "Ps 73:2-14 | concept | Envy at the prosperity of the wicked; is piety in vain?"
    - "Jer 12:1-2 | concept | Why does the way of the guilty prosper?"
    - "Eccl 8:14 | concept | The righteous treated as the wicked deserve, and vice versa"
    - "Job 4:17-19; 15:14-16 | concept | Humans inherently flawed; the gods made humans prone to falsehood"
    - "Ps 119 | form | Acrostic composition (the Theodicy spells the author's name, not the alphabet)"
  related: [ludlul-bel-nemeqi, dialogue-of-pessimism, ane-wisdom-literature, sumerian-man-and-his-god, scribes-and-scribal-education]
