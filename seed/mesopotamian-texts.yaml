  cultures: [sumerian]
  date: [-2112, -2047]
  circa: true
  scope: >-
    The oldest known law collection, in Sumerian, attributed to Ur-Nammu or his
    son Shulgi of the Third Dynasty of Ur. A prologue on royal justice for the
    weak is followed by casuistic laws that, notably, use monetary compensation
    for bodily injury.
  passages:
    - "Exod 22:22-24 | concept | Protection of widow and orphan as a royal/divine duty (prologue) (MT 22:21-23)"
    - "Exod 21:18-25 | parallel | Bodily injury: LU sets fixed silver payments where Exodus has compensation and talion"
    - "Num 5:11-31 | practice | River ordeal for a wife accused of adultery (LU §14)"
    - "Deut 22:25-27 | parallel | Rape of a betrothed young woman is a capital offence (LU §6)"
    - "Deut 25:13-16 | concept | Royal standardisation of weights and measures (prologue)"
  related: [ane-law-collections, widow-orphan-sojourner, trial-by-ordeal, weights-and-silver-money, laws-of-lipit-ishtar, code-of-hammurabi]
  wikipedia: Code of Ur-Nammu
  image: Code of Ur-Nammu tablet Istanbul
  author_notes:
    - "Attribution to Ur-Nammu (2112-2095) or Shulgi is debated; manuscripts come from Nippur, Ur, and Sippar, with a fuller unprovenanced manuscript published by Civil (2011)."
    - "Monetary compensation for injury in the earliest law and talion in later Babylonian and biblical law reverse the old evolutionary assumption that talion is 'primitive' (Finkelstein; discuss rather than adjudicate)."
    - "Section numbers differ between editions; check them against Roth."
  sources_to_check:
