    - "B. Alster, Wisdom of Ancient Sumer (2005)"

- id: city-laments
  aliases: ["Lament for Ur", "Lamentation over the Destruction of Sumer and Ur", "Lament for Nippur", "Lament for Eridu", "Lament for Uruk"]
  cultures: [sumerian]
  date: [-2000, -1900]
  circa: true
  scope: >-
    The five Sumerian city laments composed after the collapse of the Ur III
    state (c. 2004 BCE), mourning the destruction of cities and temples by divine
    decree, the gods' abandonment of their shrines, and the hope of restoration.
    The entry also notes the later balag and eršemma liturgical laments.
  passages:
    - "Lam 1-5 | form | Communal lament over a destroyed city and sanctuary"
    - "Lam 1:1-2, 16 | imagery | City personified as a weeping woman; cf. the goddess weeping for her city"
    - "Lam 2:1-8 | concept | The deity as enemy who destroys his own city and temple"
    - "Ezek 10:18-19; 11:22-23 | concept | Divine abandonment of the temple before its destruction"
    - "Ps 74:1-11 | form | Communal lament over a desecrated, burned sanctuary"
    - "Ps 79:1-4 | form | Lament over a defiled temple and unburied dead"
    - "Jer 48 | form? | Oracle against Moab drawing on city-lament motifs (Dobbs-Allsopp)"
  related: [fall-of-jerusalem-587, mesopotamian-lament-prayers, ur, mourning-rites, cult-images, babylonian-exile]
  wikipedia: Lament for Ur
  image: Lament for Ur tablet
  author_notes:
    - "The classic laments (Ur; Sumer and Ur; Nippur; Eridu; Uruk) are Isin-period compositions tied to temple rebuilding; the first-millennium balag and eršemma laments provide a possibly more direct chronological bridge to Lamentations."
    - "McDaniel (1968) doubted direct influence on Lamentations; Dobbs-Allsopp (1993) argued for a native Israelite city-lament genre with comparable motifs. Present the comparison as generic and typological."
    - "Divine abandonment of a city is a widespread Mesopotamian theme (also in Esarhaddon's Babylon inscriptions and the Marduk Prophecy) relevant to Ezekiel's departing glory (Block; Bodi)."
  sources_to_check:
