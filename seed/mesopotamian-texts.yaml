# Seed entries for the mesopotamian-texts domain (incl. Hittite, Nuzi, Emar, Ahiqar).
# See docs/seed-guide.md. Master order is preserved.

- id: atrahasis
  aliases: ["Atra-ḫasīs", "Atram-ḫasīs", "Babylonian Flood Story"]
  cultures: [akkadian, babylonian, assyrian]
  date: [-1700, -1600]
  circa: true
  scope: >-
    The Old Babylonian epic of human origins and the flood, named after its
    hero ("exceedingly wise"). It narrates the creation of humans to relieve the
    gods' labour, the gods' repeated attempts to curb humanity, and the flood
    survived by Atrahasis; it is the closest Mesopotamian analogue to the
    sequence of Gen 1-9 as a whole.
  passages:
    - "Gen 6:5-9:17 | parallel | Gods resolve to destroy humanity by flood; hero warned, builds boat, saves family and animals"
    - "Gen 2:7 | parallel | Humans formed from clay, mixed in Atrahasis with a slain god's flesh and blood"
    - "Gen 2:5, 15 | concept | Humans created to work the ground; in Atrahasis to take over the gods' toil"
    - "Gen 8:20-21 | parallel | Post-flood sacrifice; the hungry gods gather like flies at the offering"
    - "Gen 1:28 | concept? | Blessing to multiply set against the gods' annoyance at human 'noise' (overpopulation?)"
    - "Gen 9:1, 7 | concept? | Renewed fertility mandate contrasts with post-flood limits on births in Atrahasis"
    - "Gen 1:1-9:17 | parallel | Shared macro-sequence: creation, human multiplication, crisis, flood, new order"
  related: [gilgamesh-epic, eridu-genesis, flood-traditions, creation-of-humanity, gilgamesh-flood-tablet, care-and-feeding-of-the-gods, enuma-elish]
  wikipedia: Atra-Hasis
  image: Atrahasis tablet British Museum
  author_notes:
    - "Main witness: a three-tablet Old Babylonian copy by the scribe Ipiq-Aya dated to the reign of Ammi-ṣaduqa (17th c. BCE); later fragments from Ugarit and Neo-Assyrian Nineveh show a long transmission. Gilgamesh XI's flood account draws on this tradition."
    - "The cause of the flood (the gods' disturbance by human rigmu/ḫubūru, 'noise') is read as overpopulation (Kilmer, Moran, Frymer-Kensky) or as rebellion/unrest (e.g. Oden); present both and link to the post-flood measures (barren women, a demon who snatches infants, cultic celibates)."
    - "Genesis moralises the cause (violence and corruption, Gen 6:11-13) and has one God who both judges and saves; most scholars posit shared Mesopotamian tradition rather than copying of this text, with debate over the date and channel of transmission and over Priestly vs. non-Priestly strands."
    - "Tablet I: Enki and the mother goddess (Nintu/Mami) mix clay with the flesh and blood of the slain god We-ila, whose 'ghost' (eṭemmu) remains in humans; useful for Gen 2:7 but distinct from the 'image of God' idea of Gen 1:26-27."
  sources_to_check:
    - "W. G. Lambert and A. R. Millard, Atra-ḫasīs: The Babylonian Story of the Flood (1969)"
    - COS 1.130
    - ANET 104-106

- id: gilgamesh-epic
  aliases: ["Gilgamesh Epic", "Ša naqba īmuru (He who saw the Deep)", "Bilgames"]
  cultures: [babylonian, akkadian, sumerian]
  date: [-1800, -1100]
  circa: true
  scope: >-
    The Mesopotamian epic of Gilgamesh, king of Uruk, from the Sumerian Bilgames
    poems through the Old Babylonian epic to the Standard Babylonian version.
    It covers Gilgamesh's friendship with Enkidu, the quest for immortality, and
    Utnapishtim's flood narrative in Tablet XI; the Nineveh flood tablet has its
    own entry.
  passages:
    - "Gen 6:5-9:17 | parallel | Tablet XI: Utnapishtim's flood, the closest ANE parallel in plot and detail"
    - "Gen 6:14-16 | parallel | Boat built to divine specifications and sealed with pitch (Heb. kōper, Akk. kupru)"
    - "Gen 8:4 | parallel | Vessel comes to rest on a mountain (Nimush vs. the mountains of Ararat)"
    - "Gen 8:6-12 | parallel | Birds sent out to test for dry land (dove, swallow, raven)"
    - "Gen 8:20-21 | parallel | Sacrifice on landing; gods smell the sweet savour and gather like flies"
    - "Gen 9:12-17 | imagery? | Goddess's lapis-lazuli fly necklace as flood memorial, compared with the bow"
    - "Gen 3:22-24 | concept | Immortality lost: plant of rejuvenation snatched by a serpent; tree of life barred"
    - "Gen 3:5-7 | parallel? | Enkidu, after sexual initiation, becomes 'wise, like a god' and leaves the animals"
    - "Eccl 9:7-9 | parallel | Siduri's advice (OB version): eat, rejoice, wear clean clothes, cherish wife and child"
    - "Eccl 4:9-12 | parallel? | Two better than one; 'a triple-ply rope' (Sumerian Gilgamesh and Huwawa)"
  related: [gilgamesh-flood-tablet, atrahasis, flood-traditions, tree-of-life, library-of-ashurbanipal, ane-wisdom-literature, megiddo]
  wikipedia: Epic of Gilgamesh
  image: Epic of Gilgamesh cuneiform tablet
  author_notes:
    - "Distinguish the Sumerian Bilgames poems, the Old Babylonian epic (c. 18th c.), the Middle Babylonian forms, and the Standard Babylonian eleven-tablet epic attributed to Sîn-lēqi-unninni, whose main copies come from 7th-c. Nineveh; Tablet XII is a translation of a Sumerian poem appended later. A Late Bronze Age fragment from Megiddo shows circulation in the Levant."
    - "Tablet XI adapts the Atrahasis flood; its parallels with Gen 6-9 (birds, mountain landing, sacrifice) are the closest of any ANE text, and most scholars infer a Mesopotamian source tradition behind Genesis, while the route and date of transmission remain debated."
    - "Siduri's carpe diem speech survives only in the Old Babylonian Sippar tablet, not in the Standard version; the Eccl 9:7-9 parallel is widely accepted, though direct dependence is debated."
    - "The name Gilgamesh survives in the Qumran Book of Giants (4Q530), useful for the afterlife of Mesopotamian lore in Second Temple Judaism."
    - "Avoid treating Gilgamesh as a 'fall' story: the serpent and the plant concern rejuvenation, and the epic's ethos (accept mortality, enjoy life, fame through building) differs from Gen 3."
  sources_to_check:
    - "A. R. George, The Babylonian Gilgamesh Epic: Introduction, Critical Edition and Cuneiform Texts (2003)"
    - "J. H. Tigay, The Evolution of the Gilgamesh Epic (1982)"
    - ANET 72-99

- id: gilgamesh-flood-tablet
  aliases: ["Flood Tablet", "Tablet XI of the Epic of Gilgamesh", "K.3375"]
  cultures: [assyrian, babylonian]
  date: [-700, -600]
  circa: true
  scope: >-
    The Neo-Assyrian clay tablet from Ashurbanipal's libraries at Nineveh that
    preserves Tablet XI of the Standard Babylonian Gilgamesh epic, including
    Utnapishtim's flood story. Its identification by George Smith in 1872 made
    the Babylonian flood narrative famous and launched the modern comparison of
    Genesis with cuneiform literature.
  passages:
    - "Gen 6:5-9:17 | parallel | Flood narrative whose 1872 discovery first exposed the Genesis-Babylon parallel"
    - "Gen 8:4 | parallel | Boat grounds on Mount Nimush; ark rests on the mountains of Ararat"
    - "Gen 8:6-12 | parallel | Dove, swallow, and raven released to find dry land"
    - "Gen 8:20-21 | parallel | Offering after the flood; gods smell the sweet savour"
  related: [gilgamesh-epic, atrahasis, library-of-ashurbanipal, flood-traditions, nineveh, ashurbanipal]
  wikipedia: Gilgamesh flood myth
  image: Flood Tablet Gilgamesh British Museum
  location: British Museum, London
  author_notes:
    - "George Smith announced the identification to the Society of Biblical Archaeology in December 1872; the Daily Telegraph then funded his 1873 Nineveh expedition, which recovered further flood fragments. Verify details against museum and George's accounts."
    - "Present it as one 7th-c. manuscript among several witnesses to Tablet XI, not as 'the original' flood story; the tradition goes back to Old Babylonian Atrahasis."
    - "Its reception history (Smith, Delitzsch's 'Babel und Bibel' lectures of 1902) is part of the story and shows how such finds were used both to defend and to relativise Genesis."
  sources_to_check:
    - "A. R. George, The Babylonian Gilgamesh Epic (2003)"

- id: enuma-elish
  aliases: ["Babylonian Epic of Creation", "When on High"]
  cultures: [babylonian]
  date: [-1400, -1100]
  circa: true
  scope: >-
    The seven-tablet Babylonian epic of Marduk's victory over Tiamat (the
    primeval sea), his creation of the ordered cosmos from her body, the making
    of humans, and the building of Babylon. It was recited at the New Year
    (akītu) festival and is the classic text for the "chaos combat" background of
    biblical creation imagery.
  passages:
    - "Gen 1:2 | language | Hebrew tĕhôm cognate with Tiamat (tiāmtum, 'sea'), though not a deity in Genesis"
    - "Gen 1:6-8 | concept | Marduk splits Tiamat to make sky and earth, barring her waters; cf. the firmament"
    - "Gen 1:14-18 | concept | Marduk sets up stars, moon, and calendar after his victory (Tablet V)"
    - "Gen 1:26-27 | concept | Humans made from rebel god Qingu's blood to bear the gods' labour; contrast Gen 1"
    - "Job 38:8-11 | concept | Sea confined by bars and doors; Marduk posts guards so her waters cannot escape"
    - "Ps 74:12-17 | imagery | God's victory over sea and dragons tied to ordering day, night, and seasons"
    - "Ps 89:9-12 | imagery | Ruling the raging sea, crushing Rahab, founding heaven and earth (MT 89:10-13)"
    - "Job 26:12-13 | imagery | God stills the sea, strikes Rahab; his wind clears the heavens"
    - "Isa 51:9-10 | imagery | YHWH's arm cut Rahab, pierced the dragon, and dried up the sea"
    - "Gen 11:3-4 | parallel? | Gods mould bricks for a year to build Babylon and Esagil (Tablet VI)"
  related: [chaoskampf, tehom, creation-accounts, marduk, akitu-festival, firmament, rahab-sea-monster, tablet-of-destinies]
  wikipedia: Enūma Eliš
  image: Enuma Elish tablet British Museum
  author_notes:
    - "Gunkel's Schöpfung und Chaos (1895) and the Babel-Bible controversy made Enuma Elish central to Genesis study; since Heidel (1951) and Lambert (1965) most scholars caution against reading Gen 1 as an adaptation of it. Lambert argued the sea-combat motif may be West Semitic in origin (cf. the Baal cycle and the Mari letter on Adad's weapons against the Sea)."
    - "Real points of contact: tĕhôm/tiāmtum (a shared Semitic word, not a borrowed divine name; Tsumura), the division of waters to form sky and earth, and the setting of celestial bodies. Combat-myth language is much stronger in the Psalms, Job, and Isaiah than in Gen 1."
    - "Date of composition is debated (Old Babylonian, Kassite, or the reign of Nebuchadnezzar I, c. 1100, favoured by Lambert); almost all copies are first-millennium. An Assyrian version substitutes Ashur for Marduk."
    - "Popular claims that the seven tablets mirror the seven days of Gen 1 should be treated as coincidence, not evidence."
  sources_to_check:
    - "W. G. Lambert, Babylonian Creation Myths (2013)"
    - "P. Talon, The Standard Babylonian Creation Myth Enūma Eliš (SAACT 4, 2005)"
    - COS 1.111
    - ANET 60-72, 501-503
    - "A. Heidel, The Babylonian Genesis (2nd ed., 1951)"

- id: eridu-genesis
  aliases: ["Sumerian Flood Story", "Ziusudra story", "Deluge tablet"]
  cultures: [sumerian]
  date: [-1700, -1600]
  circa: true
  scope: >-
    A fragmentary Sumerian narrative, preserved chiefly on one Old Babylonian
    tablet from Nippur, of the creation of humans and animals, the founding of
    the first cities, and a flood survived by King Ziusudra, who is then granted
    eternal life. "Eridu Genesis" is Thorkild Jacobsen's name for his
    reconstruction.
  passages:
    - "Gen 6:5-9:17 | parallel | Ziusudra, warned by Enki, survives a seven-day flood in a great boat"
    - "Gen 8:20-21 | parallel | Hero sacrifices an ox and sheep after the flood"
    - "Gen 4:17 | concept? | First cities founded before the flood (Eridu, Bad-tibira, Larak, Sippar, Shuruppak)"
    - "Gen 5:24 | concept? | Flood hero granted 'life like a god' and settled in Dilmun; cf. Enoch taken by God"
    - "Gen 1:1-9:17 | form? | Jacobsen's reconstructed sequence of creation, first cities, and flood"
  related: [atrahasis, gilgamesh-epic, sumerian-king-list, flood-traditions, enki-and-ninhursag, creation-accounts]
  wikipedia: Eridu Genesis
  image: Sumerian flood story tablet Nippur
  author_notes:
    - "The main tablet (Nippur, c. 1600 BCE) is badly broken; Jacobsen's title and his creation-cities-flood outline (JBL 1981) are reconstructions. Civil's edition in Lambert and Millard (1969) calls it 'The Sumerian Flood Story'. Do not overstate what is preserved."
    - "Ziusudra is the Sumerian counterpart of Atrahasis and Utnapishtim (Berossus's Xisouthros); in the Instructions of Shuruppak he is Shuruppak's son."
    - "Unlike Noah, the flood hero receives immortality; the 'first cities before the flood' tradition is shared with the Sumerian King List."
  sources_to_check:
    - COS 1.158
    - ANET 42-44
    - "T. Jacobsen, 'The Eridu Genesis,' JBL 100 (1981): 513-529"

- id: sumerian-king-list
  aliases: [SKL]
  cultures: [sumerian]
  date: [-2100, -1800]
  circa: true
  scope: >-
    A Sumerian list of cities and rulers that presents kingship as "descending
    from heaven" and passing from one city to another. In most versions it
    begins with antediluvian kings with immensely long reigns and treats the
    flood as the great epochal break.
  passages:
    - "Gen 5:1-32 | parallel | Antediluvian line of very long-lived figures ending at the flood"
    - "Gen 11:10-26 | parallel | Post-flood life spans decline, as SKL reigns shrink after the flood"
    - "Gen 10:1, 32 | concept | 'After the flood' as an epochal marker; SKL: 'after the flood had swept over'"
    - "Gen 5:21-24 | concept? | Seventh antediluvian figure; Enmeduranki of Sippar is seventh in some lists"
  related: [weld-blundell-prism, genealogies, enmeduranki-and-the-apkallu, eridu-genesis, flood-traditions, royal-annals-and-historiography]
  wikipedia: Sumerian King List
  image: Weld-Blundell Prism Ashmolean
  author_notes:
    - "Composite and ideological: dynasties that were contemporary are listed in succession to model a single legitimate kingship. An Ur III manuscript lacks the antediluvian section, which most think was prefaced later; the Weld-Blundell prism (c. 1800) is the best-known copy."
    - "Reigns are given in sexagesimal units (a šar = 3,600 years); the antediluvian section has eight or ten kings depending on the source. Berossus's list of ten antediluvian kings gives the closest numerical analogue to the ten generations of Gen 5."
    - "Explanations of the Gen 5 numbers (which differ in MT, SP, and LXX) from Mesopotamian arithmetic are speculative; present the parallel as genre (long-lived ancestors, flood as divider), not dependence."
  sources_to_check:
    - "T. Jacobsen, The Sumerian King List (Assyriological Studies 11, 1939)"
    - ANET 265-266
    - "J.-J. Glassner, Mesopotamian Chronicles (SBLWAW 19, 2004)"

- id: enki-and-ninhursag
  cultures: [sumerian]
  date: [-1800]
  circa: true
  scope: >-
    A Sumerian myth set in the pure land of Dilmun, which Enki provides with
    fresh water, followed by Enki's serial impregnations, his eating of plants
    that the mother goddess Ninhursag has made, her curse, and his healing by
    goddesses born to cure each ailing body part, among them Ninti.
  passages:
    - "Gen 2:8-14 | concept | Pristine land (Dilmun) watered by a god; cf. Eden and its rivers"
    - "Gen 2:6 | parallel? | Fresh water rising from the earth to irrigate the land"
    - "Isa 11:6-9 | imagery | Paradisal land where the lion does not kill and the wolf does not seize the lamb"
    - "Isa 65:25 | imagery | Wolf and lamb at peace in the renewed creation"
    - "Gen 3:6, 17-19 | parallel? | Eating plants reserved by the deity incurs a curse"
    - "Gen 2:21-22 | parallel? | Ninti, 'lady of the rib' / 'lady who makes live' (Kramer); widely cited, doubtful"
  related: [garden-of-god, eridu-genesis, creation-of-humanity, adapa, tree-of-life]
  wikipedia: Enki and Ninhursag
  image: Enki and Ninhursag tablet Penn Museum
  author_notes:
    - "Kramer's rib proposal rests on Sumerian ti = 'rib' and 'to live'; the pun does not work in Hebrew (ṣēlāʿ vs. ḥawwâ), so any link is at best indirect. Present it as a famous but doubtful suggestion, not as an established source of Gen 2."
    - "Dilmun (historically linked to Bahrain) is a pristine but initially waterless land; the myth is largely about fertility, not about a 'fall'. Avoid the older label 'Sumerian paradise myth' without qualification."
    - "The animal-peace lines (lion, wolf, lamb) are the most secure point of contact and concern prophetic imagery rather than Gen 2-3."
    - "There is no dedicated English Wikipedia article; the title given is a redirect to a section of the Ninhursag article."
  sources_to_check:
    - ANET 37-41
    - ETCSL 1.1.1
    - "P. Attinger, 'Enki et Ninḫursaĝa,' ZA 74 (1984)"

- id: adapa
  aliases: ["Adapa and the South Wind"]
  cultures: [babylonian]
  date: [-1400]
  circa: true
  scope: >-
    The Akkadian myth of Adapa, sage of Eridu, who breaks the wing of the South
    Wind, is summoned before Anu, and on Ea's advice refuses the "bread of life"
    and "water of life" offered him, thereby forfeiting immortality for himself
    (and perhaps humankind).
  passages:
    - "Gen 3:22-24 | parallel | A human forfeits immortality offered by the high god's food and drink"
    - "Gen 3:4-5 | parallel? | Ambiguous divine counsel: Ea's warning proves misleading (or a test)"
    - "Gen 5:21-24 | parallel? | A wise antediluvian figure brought up to heaven before the high god"
  related: [enmeduranki-and-the-apkallu, tree-of-life, amarna-letters, garden-of-god, afterlife-and-resurrection]
  wikipedia: Adapa
  image: Adapa myth tablet Amarna
  author_notes:
    - "Oldest Akkadian manuscript: a tablet from 14th-c. Amarna used in Egyptian scribal training; other fragments are Neo-Assyrian, and a Sumerian Adapa composition is known from the Old Babylonian period. Izre'el's edition (2001) is standard."
    - "Interpretive crux: did Ea deceive Adapa, or protect him from what he believed was the food of death? Unlike Gen 3, Adapa obeys his god; the loss of immortality is not disobedience."
    - "The proposed Adam/Adapa etymology is not accepted as a linguistic link; mention it only as a popular claim."
    - "In later tradition Adapa is identified with the first apkallu, Uan (Berossus's Oannes); see the apkallu entry."
  sources_to_check:
    - "S. Izre'el, Adapa and the South Wind: Language Has the Power of Life and Death (2001)"
    - ANET 101-103

- id: enmerkar-and-the-lord-of-aratta
  cultures: [sumerian]
  date: [-2100, -1800]
  circa: true
  scope: >-
    A Sumerian epic poem about the contest between Enmerkar of Uruk and the lord
    of the distant land of Aratta, notable for the "spell of Nudimmud" passage
    on a time when all humanity spoke one language, and for its tale of the
    invention of writing on clay.
  passages:
    - "Gen 11:1-9 | parallel? | 'Spell of Nudimmud': once all people addressed Enlil in one tongue; Enki alters speech"
    - "Gen 10:10 | setting | Uruk (Erech), Enmerkar's city, in Nimrod's kingdom"
  related: [ziggurat-and-babel, writing-and-literacy, sumerian-king-list, nimrod]
  wikipedia: Enmerkar and the Lord of Aratta
  image: Enmerkar and the Lord of Aratta tablet
  author_notes:
    - "Kramer (JAOS 1968) read the Nudimmud spell as a lost golden age of one language ended by Enki's confusion of tongues; Alster and Vanstiphout read it as a future-oriented incantation in which Enki will unify speech (or as acknowledging existing diversity). Present it as debated; do not call it a 'Sumerian Tower of Babel'."
    - "There is no tower in the text; the Babel connection lies only in the one-language motif."
    - "Enmerkar is in the Sumerian King List as a king of Uruk; the poem is preserved in Old Babylonian copies and probably composed in the Ur III period."
  sources_to_check:
    - COS 1.170
    - ETCSL 1.8.2.3
    - "H. Vanstiphout, Epics of Sumerian Kings (SBLWAW 20, 2003)"
    - "S. N. Kramer, 'The Babel of Tongues: A Sumerian Version,' JAOS 88 (1968): 108-111"

- id: enmeduranki-and-the-apkallu
  aliases: ["Apkallū", "Seven Sages", "Enmeduranna"]
  cultures: [babylonian, mesopotamian]
  scope: >-
    The Mesopotamian traditions of the seven antediluvian sages (apkallū) who
    brought the arts of civilisation to humankind, and of Enmeduranki, the
    antediluvian king of Sippar to whom the gods revealed the secrets of
    divination. These form the main background proposed for the figure of Enoch
    and for the Watchers' teaching in 1 Enoch.
  passages:
    - "Gen 5:21-24 | parallel | Seventh antediluvian who 'walked with God'; Enmeduranki, seventh king, admitted to divine secrets"
    - "Gen 4:17-22 | concept | Antediluvian culture-bringers (city, herding, music, metalwork); cf. the sages' civilising role"
    - "Gen 6:1-4 | concept? | Mighty men of old; post-flood apkallū of partly divine descent"
    - "1En 6:1-8:4 | parallel | Watchers teach forbidden arts: metallurgy, cosmetics, spells, astrology"
    - "1En 72-82 | concept | Enoch receives celestial and calendrical knowledge, cf. Enmeduranki's divinatory lore"
    - "Jub 4:17-19 | concept | Enoch first to learn writing and record the signs of heaven"
  related: [apkallu-reliefs, adapa, sumerian-king-list, first-enoch, nephilim, divination, extispicy]
  wikipedia: Apkallu
  image: null
  author_notes:
    - "Key sources: Lambert's edition of the Enmeduranki text (JCS 21, 1967); the Bīt mēseri incantation series listing the sages, including Utuabzu 'who ascended to heaven' (Borger 1974); the Seleucid 'Uruk List of Kings and Sages'; and Berossus on Oannes and the sages."
    - "The Enoch-Enmeduranki/Utuabzu connection is widely accepted (VanderKam, Kvanvig) as reflecting Judean contact with Babylonian scholarly lore in the exilic to Hellenistic periods; specifics of transmission are debated."
    - "The sages' role is positive in Mesopotamia, while 1 Enoch makes the Watchers' teaching illicit; this inversion is often read as polemic (Kvanvig; Annus)."
  sources_to_check:
    - "W. G. Lambert, 'Enmeduranki and Related Matters,' JCS 21 (1967): 126-138"
    - "R. Borger, 'Die Beschwörungsserie Bīt mēseri und die Himmelfahrt Henochs,' JNES 33 (1974): 183-196"
    - "J. C. VanderKam, Enoch and the Growth of an Apocalyptic Tradition (CBQMS 16, 1984)"
    - "H. S. Kvanvig, Roots of Apocalyptic (WMANT 61, 1988)"

- id: descent-of-inanna-ishtar
  aliases: ["Inanna's Descent to the Netherworld", "Descent of Ishtar", "Ishtar's Descent"]
  cultures: [sumerian, babylonian, assyrian]
  date: [-1800]
  circa: true
  scope: >-
    The Sumerian myth of Inanna's descent to the netherworld, her death, revival,
    and the consignment of Dumuzi as her substitute, and its shorter Akkadian
    adaptation (Ishtar's Descent). The texts are key sources for Mesopotamian
    netherworld imagery and the cult of Dumuzi/Tammuz.
  passages:
    - "Ezek 8:14 | practice | Women weeping for Tammuz (Dumuzi) at the temple gate"
    - "Job 10:21-22 | imagery | Land of gloom and deep darkness from which none return"
    - "Job 7:9-10 | concept | One who goes down to Sheol does not come up (Akk. 'land of no return')"
    - "Isa 14:9-11 | imagery | Shades of the dead roused; maggots and worms as bed and covering"
    - "Isa 38:10 | imagery | Gates of Sheol; the netherworld has seven gates in the Descent"
    - "Job 38:17 | imagery | Gates of death and of deep darkness"
  related: [tammuz, ishtar, sheol-and-the-netherworld, mourning-rites, afterlife-and-resurrection, sumerian-love-songs]
  wikipedia: Descent of Inanna into the Underworld
  image: Descent of Ishtar tablet British Museum
  author_notes:
    - "Distinguish the Old Babylonian Sumerian poem (c. 400 lines) from the much shorter Akkadian versions of the Middle and Neo-Assyrian periods; Dumuzi's role as substitute became clear only with the publication of related Sumerian texts in the 1950s."
    - "Frazer's 'dying and rising god' model for Tammuz is now widely criticised (J. Z. Smith; M. S. Smith), though Mettinger argues for a qualified version; Ezek 8:14 attests ritual mourning, not necessarily a resurrection myth."
    - "Ezek 8:14 is the only explicit biblical reference to Tammuz; the Babylonian month name Duʾūzu survives as the Jewish month Tammuz."
    - "The netherworld descriptions (dust as food, darkness, no return) are general Mesopotamian imagery; claim shared cultural conception, not literary dependence."
  sources_to_check:
    - COS 1.108
    - ANET 52-57, 106-109
    - ETCSL 1.4.1
    - "P. Lapinkivi, The Neo-Assyrian Myth of Ištar's Descent and Resurrection (SAACT 6, 2010)"

- id: ludlul-bel-nemeqi
  aliases: ["Poem of the Righteous Sufferer", "I Will Praise the Lord of Wisdom", "Babylonian Job"]
  cultures: [babylonian]
  date: [-1300, -1100]
  circa: true
  scope: >-
    A Middle Babylonian poem in which Šubši-mešrê-Šakkan, a high official
    abandoned by his gods, describes social ruin and bodily affliction before
    Marduk restores him. Framed as praise of Marduk, it is the fullest
    Mesopotamian treatment of the righteous sufferer.
  passages:
    - "Job 19:13-22 | parallel | Sufferer shunned by kin, friends, and servants"
    - "Job 7:3-5, 13-14 | parallel | Nights of misery, terrifying dreams, wasting body"
