  related: [nabonidus, belshazzar, cyrus-the-great, fall-of-babylon-539, cyrus-cylinder, darius-the-mede, verse-account-of-nabonidus, akitu-festival]
  wikipedia: Nabonidus Chronicle
  image: Nabonidus Chronicle British Museum
  location: British Museum, London
  author_notes:
