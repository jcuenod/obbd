- id: maqlu
  aliases: ["Maqlû", "Burning"]
  cultures: [assyrian, babylonian]
  date: [-900, -600]
  circa: true
  scope: >-
    The nine-tablet Akkadian anti-witchcraft ceremony ("Burning") performed by
    the exorcist (āšipu) over one night, in which figurines of the witch are
    burned and her spells returned upon her. It is the principal Mesopotamian
    source on how witchcraft (kišpū) was conceived and countered.
  passages:
    - "Exod 22:18 | practice | Prohibition of the female sorcerer (mĕkaššēpâ; cf. Akk. kaššāptu, 'witch') (MT 22:17)"
