    - "Ps 22:6-8, 14-17 | parallel | Mockery and bodily disintegration of the sufferer (MT 22:7-9, 15-18)"
    - "Ps 30 | form | Thanksgiving for rescue from near-death, praising the god who wounds and heals"
  related: [babylonian-theodicy, sumerian-man-and-his-god, ane-wisdom-literature, marduk, mesopotamian-lament-prayers, dialogue-of-pessimism]
