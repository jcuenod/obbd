    Individual prayers of complaint, petition, and penitence from Mesopotamia,
    above all the Akkadian šuilla ("raising of the hand") incantation-prayers and
    the bilingual eršaḫunga ("lament to appease the heart"). They are the main
    comparative corpus for the biblical individual and penitential laments.
  passages:
    - "Ps 6 | form | Lament of the sick: plea that divine anger cease"
    - "Ps 13:1-2 | language | 'How long?' (Akk. adi mati) formula of lament (MT 13:2-3)"
    - "Ps 38 | form | Penitential lament linking illness to sin"
    - "Ps 51 | form | Penitential prayer confessing sin and seeking cleansing"
    - "Ps 130 | form | Penitential plea from the depths for forgiveness"
    - "Ps 143:2 | concept | No one living is righteous before the deity"
    - "Ps 19:12 | concept | Forgiveness sought for hidden or unknown faults (MT 19:13)"
    - "Ps 141:2 | practice | Lifting of hands in prayer; šu-ila means 'raised hand'"
    - "Ps 88 | form | Lament from the edge of death"
  related: [sumerian-man-and-his-god, ludlul-bel-nemeqi, prayer-postures, city-laments, ishtar, prostration-and-obeisance]
  wikipedia: null
  image: null
  author_notes:
    - "Distinguish šuilla (incantation-prayers recited by the āšipu within rituals), eršaḫunga (penitential, Sumerian with Akkadian glosses), dingiršadabba, and the communal balag/eršemma laments."
    - "Classic comparative study: Widengren (1937); see also Mayer (1976) on the form of the 'Gebetsbeschwörungen' and Lenzi (ed. 2011) for an introduction with translations."
    - "Key differences: Mesopotamian prayers are embedded in ritual and magic, address many deities, and rely on the personal god's intercession; motifs such as unknown sin and 'how long?' are shared."
    - "The 'Prayer of Lamentation to Ishtar' (ANET 383-385) is the most-quoted example and can anchor the article."
  sources_to_check:
