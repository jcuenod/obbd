    - "2Kgs 20:12 | attests | Merodach-baladan (Marduk-apla-iddina II) as king of Babylon"
    - "2Kgs 23:29 | event | Egyptian army marches to aid Assyria at Harran, 609 (ABC 3)"
    - "Jer 46:2 | event | Egypt defeated at Carchemish, 605 (ABC 5)"
    - "2Kgs 24:10-17 | event | Nebuchadnezzar captures 'the city of Judah', 597, and appoints a new king (ABC 5)"
    - "Dan 5:30-31 | event | Babylon falls to Cyrus's army, 539 (ABC 7) (MT 5:30-6:1)"
  related: [nebuchadnezzar-chronicle, fall-of-nineveh-chronicle, nabonidus-chronicle, royal-annals-and-historiography, chronology-of-kings, merodach-baladan, assyrian-eponym-list]
  wikipedia: Babylonian Chronicles
  image: Babylonian Chronicle tablet British Museum
  author_notes:
    - "Grayson's numbering (ABC 1-7 etc.) and Glassner's differ; give both. The chronicles are generally reliable and record Babylonian setbacks as well as victories."
    - "Gaps matter: no chronicle covers 594-557, so there is no Babylonian chronicle of the 587/586 destruction of Jerusalem."
    - "The Šamaraʾin identification (ABC 1 i 28) is widely accepted and bears on whether Shalmaneser V or Sargon II took Samaria (see fall-of-samaria)."
  sources_to_check:
    - "A. K. Grayson, Assyrian and Babylonian Chronicles (TCS 5, 1975)"
    - "J.-J. Glassner, Mesopotamian Chronicles (SBLWAW 19, 2004)"
