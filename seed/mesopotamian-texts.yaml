    - "Josh 9:15-20 | concept | Oath sworn by the gods binds later generations"
    - "2Sam 24:10-17 | parallel | King confesses guilt and pleads for the plague to stop"
    - "Lam 5:7 | concept | Children bear the sins of the fathers ('the father's sin comes upon the son')"
    - "Ezek 18:2 | concept | Sour-grapes proverb on inherited guilt, rejected by Ezekiel"
  related: [oaths-and-oath-formulas, divination, hittite-vassal-treaties, apology-of-hattusili, sacrifice, hittites-and-hethites]
  wikipedia: null
  image: null
  author_notes:
    - "The plague began under Šuppiluliuma I, reportedly spread by Egyptian prisoners; oracles pointed to the breach of the Kuruštama treaty with Egypt and neglected offerings to the Mala (Euphrates) river."
    - "Malamat (VT 5, 1955) drew the classic comparison with 2 Sam 21; the parallel concerns the theology of causality and oath-breaking, not literary dependence."
    - "The prayers argue like a legal plea (arkuwar) before divine judges; useful for comparing biblical intercession and confession."
  sources_to_check:
