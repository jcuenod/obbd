    - "Dan 4:28-33 | parallel? | A Babylonian king estranged from his capital; Nabonidus tradition behind Dan 4 (MT 4:25-30)"
    - "Isa 45:1-7 | concept | Cyrus presented as the deity's chosen restorer"
  related: [nabonidus, belshazzar, cyrus-cylinder, cyrus-the-great, prayer-of-nabonidus, nabonidus-chronicle, persian-imperial-authorization]
