    - ANET 438-440

- id: dialogue-of-pessimism
  aliases: ["Dialogue between a Master and His Slave", "Pessimistic Dialogue between Master and Servant"]
  cultures: [babylonian, assyrian]
  date: [-1000, -700]
  circa: true
  scope: >-
    A short Akkadian dialogue in which a master proposes a series of
    undertakings (dining, hunting, love, sacrifice, lending, public benefaction)
    and his slave argues equally well for and against each, ending with the
    question of what is truly good. It is often compared with Qoheleth.
  passages:
    - "Eccl 2:1-11 | parallel | Testing pleasures and projects, each found empty"
    - "Eccl 1:2-3 | concept | Futility of human undertakings"
    - "Eccl 2:14-16 | concept | Same fate for wise and fool; skulls in the ruin-mounds cannot be told apart"
    - "Prov 30:4 | parallel | 'Who has ascended to heaven?' as a proverb of human limits"
    - "Deut 30:12-13 | parallel? | Who will go up to heaven or cross the sea? (proverbial phrasing)"
  related: [ludlul-bel-nemeqi, babylonian-theodicy, ane-wisdom-literature, harpers-songs, dialogue-of-a-man-with-his-ba]
  wikipedia: Dialogue of Pessimism
  image: null
  author_notes:
    - "Genre and tone are debated: satire or parody of courtly advice (Speiser saw comedy), serious pessimism, or a scribal exercise in arguing both sides. The ending (the master proposes to kill the slave, who retorts the master would not outlive him three days) is ambiguous."
    - "Qoheleth parallels are thematic (the vanity of pursuits); Qoheleth reaches an ethic of enjoyment (Eccl 9:7-9, cf. Siduri) that the Dialogue lacks. Avoid claims of dependence."
    - "Known from first-millennium copies (Assur, Nineveh, Sippar); date of composition uncertain."
  sources_to_check:
    - "W. G. Lambert, Babylonian Wisdom Literature (1960)"
    - ANET 437-438

- id: sumerian-man-and-his-god
  aliases: ["A Man and His God", "Sumerian Job"]
  cultures: [sumerian]
  date: [-1800]
  circa: true
  scope: >-
    A Sumerian poem in which a young man afflicted by illness and social
    rejection laments to his personal god, confesses his sins, and is restored.
    It is the earliest known treatment of the righteous-sufferer theme.
  passages:
    - "Job 19:13-19 | parallel | Sufferer estranged from friends and kin"
    - "Job 14:4 | concept | 'Never has a sinless child been born to its mother'; no one is clean"
    - "Ps 51:5 | concept | Sinful from birth (MT 51:7)"
    - "Ps 32:3-5 | concept | Confession of sin leads to the god's turning and healing"
    - "Ps 6 | form | Individual lament of the sick sufferer pleading with the deity"
    - "Job 42:10-12 | parallel | God hears the plea and restores the sufferer"
  related: [ludlul-bel-nemeqi, babylonian-theodicy, mesopotamian-lament-prayers, ane-wisdom-literature]
  wikipedia: null
  image: null
  author_notes:
    - "Kramer's 1955 publication ('Man and His God: A Sumerian Variation on the Job Motif', VTSup 3) introduced it to biblical studies; the standard English translation is Klein's in COS."
    - "Unlike Job, the sufferer assumes his own guilt and is restored after confession; it is a didactic lament-and-thanksgiving, closer to the penitential psalms than to Job's protest of innocence."
    - "Old Babylonian copies (Nippur); composition perhaps Ur III. The 'no sinless child' line is the most quoted parallel."
    - "Do not confuse it with the Akkadian Old Babylonian 'Dialogue between a Man and His God', a different text (which has its own Wikipedia article)."
  sources_to_check:
