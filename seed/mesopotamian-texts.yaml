  cultures: [hittite]
  date: [-1400, -1200]
  circa: true
  scope: >-
    A Hittite instruction text regulating the conduct of priests and temple
    personnel: purity before handling divine food, nightly guard of the temple,
    prompt delivery of offerings, and penalties for misappropriation. Milgrom
    used it extensively for the Priestly legislation on sanctuary service.
  passages:
    - "Num 18:1-7 | practice | Priests and Levites guard the sanctuary; an encroaching outsider is put to death"
    - "Num 3:38 | practice | Guard stations at the sanctuary; outsider who approaches is killed"
    - "Lev 22:1-9 | practice | Personnel in a state of impurity may not touch holy food"
    - "Lev 15:16-18 | practice | Bathing after sexual intercourse before contact with the holy"
    - "1Sam 21:4-5 | practice | Abstinence from women required to eat holy bread (MT 21:5-6)"
    - "1Sam 2:12-17 | practice | Personnel misappropriating offerings due to the deity"
    - "Exod 22:29-30 | practice | Offerings and firstlings must not be delayed (MT 22:28-29)"
  related: [purity-and-impurity, tithes, firstfruits-and-firstborn, care-and-feeding-of-the-gods, sacrifice, hittites-and-hethites]
  wikipedia: null
  image: null
