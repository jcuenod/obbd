  related: [sargon-of-akkad, sargon-ii, exodus-historical-questions, royal-ideology]
  wikipedia: null
  image: Sargon birth legend tablet British Museum
  author_notes:
    - "Known from Neo-Assyrian and Neo-Babylonian copies; many date its composition to Sargon II's reign (721-705), when a usurper bearing the old king's name had reason to celebrate him. This matters for dating Exod 2 (Redford, Otto argue for 7th-c. dependence)."
    - "The exposed-hero motif is widespread (Lewis collected dozens of tales: Cyrus, Romulus, etc.); a motif parallel is not by itself proof of borrowing."
