    - "J. M. Lindenberger, The Aramaic Proverbs of Ahiqar (1983)"
    - ANET 427-430

- id: babylonian-chronicles
  aliases: ["Neo-Babylonian Chronicle Series", "ABC"]
  cultures: [babylonian]
  date: [-747, -150]
