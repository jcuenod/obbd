    - "1Cor 11:17-34 | practice | Association gatherings provide comparative evidence for the social organization of communal meals"
    - "1Cor 14:26-40 | practice | Later association regulations offer comparative evidence for order, participation, and discipline at gatherings"
    - "Rev 2:18-29 | practice | Thyatiran associations connect occupation, civic honor, and imperial priesthood"
    - "Rev 2:20 | practice? | Guild-related cult meals are one proposed context for the sacrificial eating criticized here"
  related: [thyatira-dyers-claudia-ammion, ephesus-silversmiths-hermeias-inscription, tebtynis-salt-merchants-papyrus, meals-and-banqueting, patronage-and-benefaction, temple-of-artemis-ephesus, marzeah, synagogues]
  wikipedia: Collegium (ancient Rome)
  image: null
  author_notes:
    - No cited inscription establishes universal compulsory guild membership or compulsory participation in idol meals. The reconstruction of Rev 2:20 as a guild-meal dispute is contested and must remain flagged.
    - The Iobacchoi regulations (IG II² 1368) date to 164/165 CE. Present them as later comparative evidence, not direct evidence for Paul's congregation.
