- id: murabbaat-divorce-deed
  aliases: [Mur 19, P.Mur. 19]
  cultures: [jewish]
  date: [71, 112]
  circa: true
  scope: >-
    An Aramaic divorce deed issued at Masada by Joseph son of Naqsan to Miriam daughter of
    Jonathan and found at Wadi Murabbaʿat. It records the dissolution of their marriage, her
    permission to remarry, financial obligations, and witnesses.
  passages:
    - "Deut 24:1-4 | form | A surviving divorce instrument supplies a comparison for the written certificate and the permission to remarry"
    - "Matt 5:31-32 | practice | Documents the legal procedure presupposed by the discussion of divorce and remarriage"
    - "Matt 19:7-9 | practice | Clarifies what issuing a certificate could entail without resolving the Gospel's ethical argument"
    - "Mark 10:4-12 | practice | A concrete instrument for the certificate of divorce; it is husband-issued and says nothing of wife-initiated divorce"
  related: [marriage-and-bride-price, sealed-deeds, masada, dead-sea-scrolls, greco-roman-households, elephantine-papyri]
  wikipedia: null
  image: null
  location: Israel Antiquities Authority, Jerusalem
  author_notes:
    - The date is disputed. Proposed readings of "year six" yield 71/72 CE or 111/112 CE, and a 2025 reassessment leaves the question open. Do not describe the deed as securely contemporary with Jesus. The date field spans both proposals.
    - Do not infer a universal Jewish procedure from one document. This husband-issued deed neither documents wife-initiated divorce nor establishes uniform practice.
    - Mur 19 names Masada as its place of issue but was found at Wadi Murabbaʿat; keep the place of issue, findspot, and debated setting distinct. It is not a Qumran sectarian manuscript.
    - Existing references to Mur 17, Mur 18, and Mur 24E concern different documents. Distinguish the deed's legal function from the double-document format.
  sources_to_check:
    - DJD II no. 19, pp. 104-109
    - MPAT no. 40, pp. 138-141
    - Revue de Qumran 37.1 (2025), pp. 3-39, DOI 10.2143/RQ.37.1.3294505
    - IAA, Leon Levy Dead Sea Scrolls Digital Library, plate 879, photograph B-496369

- id: sarapis-dinner-invitation
  aliases: [P.Oxy. I 110]
  cultures: [roman, egyptian, greek]
  date: [101, 200]
  circa: true
  scope: >-
    A papyrus invitation from Oxyrhynchus asking its recipient to dine at the couch (klinē)
    of the lord Sarapis in his sanctuary. It documents participation in a cult meal and is a
    later (second-century CE) Egyptian comparison for the meals discussed in 1 Corinthians.
  passages:
    - "1Cor 8:10 | practice | A sanctuary dinner invitation helps readers picture the social setting of reclining in an idol's temple"
    - "1Cor 10:20-21 | practice | Cult dining as a comparison for participation and allegiance; the Greek nouns for couch and table differ"
    - "1Cor 10:27-28 | practice | Compare a cult invitation with the distinct situation of a private invitation and food identified as sacrificial"
  related: [meals-and-banqueting, greco-roman-associations, corinth, sacrifice, imperial-cult]
  wikipedia: Oxyrhynchus Papyri
  image: Oxyrhynchus papyrus 110 Sarapis invitation
  location: Eton College (ECM 2314)
  author_notes:
    - HGV dates the papyrus to the second century CE. It is later comparative evidence, not a contemporary Corinthian record.
    - The invitation uses klinē ("couch"), whereas 1 Cor 10:21 uses trapeza ("table"). An older English translation ("table") should not become a claim of identical Greek wording.
    - The invitation names no occupational association. Do not infer compulsory guild meals or treat it as an explanation of every meal Paul discusses.
  sources_to_check:
    - P.Oxy. I 110, lines 1-4 (HGV/TM 28404; Eton College ECM 2314)

- id: delphic-manumission-antigona
  aliases: [SGDI II 1722]
  cultures: [greek, jewish]
  date: [-170, -156]
  circa: true
  scope: >-
    A Greek inscription from Delphi recording the formal sale to Pythian Apollo of Antigona,
    a woman identified as Jewish, and her daughters Theodora and Dorothea, to secure their
    freedom and protection against re-enslavement. It is a Greek legal document for sacral
    manumission.
  passages:
    - "1Cor 6:19-20 | imagery | Purchase and belonging supply a comparative legal setting for the metaphor of being bought for a price"
    - "1Cor 7:21-23 | practice | Compare manumission, legal freedom, and protection against enslavement, preserving the differences from Paul"
    - "Phlm 15-16 | practice | A broad comparison for changes of status involving an enslaved person; the letter does not prescribe this procedure"
  related: [slavery, debt-release, greco-roman-households, adoption]
  wikipedia: null
  image: Delphi polygonal wall manumission inscriptions
  author_notes:
    - Use a broad mid-second-century BCE date. PHI gives 170-157/6 BCE; some translations specify 158/7.
    - A legal comparison does not establish that Paul's purchase language derives from sacral manumission, and it does not settle whether Philemon requests legal manumission.
    - The identification of Antigona as Jewish does not establish the women's private religious beliefs. This document contains no requirement of continuing service (paramonē) to a former owner.
  sources_to_check:
    - SGDI II 1722, lines 1-16 (PHI Greek Inscriptions)
    - Meyer Reinhold, Diaspora (1996), item C (translation, adapted)

- id: lysanias-abila-inscriptions
  cultures: [greek, roman]
  date: [14, 29]
  circa: true
  scope: >-
    Greek dedications near Abila (Abilene) by Nymphaeus, a freedman of Lysanias the tetrarch,
    recording benefactions and preserving a ruler's name and title relevant to Luke's
    geographical introduction. The paired witnesses are treated together.
  passages:
    - "Luke 3:1 | attests? | The inscriptions name a Lysanias called tetrarch near Abila; identification with Luke's ruler depends on dating"
  related: [patronage-and-benefaction, imperial-cult, herod-antipas, census-of-quirinius]
  wikipedia: Lysanias
  image: null
  author_notes:
    - Optional record in the report (group E).
    - Distinguish the secure reading of the name and title from identification with the ruler in Luke.
    - The usual interpretation of the imperial titulature as Tiberius and Livia yields a proposed 14-29 CE date. The date field reflects that inference; do not present it as an inscribed date.
    - Use Savignac's primary publication for the text, and assess its older historical argument against later scholarship. The online translation contains a chronological slip concerning Augustus.
    - The dedication names the safety of the Augusti as its occasion but is dedicated to Kronos and the fatherland; it does not by itself attest worship addressed to the emperors (report R19).
  sources_to_check:
    - Savignac, Revue Biblique 9.4 (1912), pp. 533-540, inscription A, lines 3-4

- id: darius-susa-foundation-dsf
  aliases: [DSf, Susa foundation charter]
  cultures: [persian]
  scope: >-
    Darius I's foundation inscription describing the materials, supply routes, and workers
    drawn from across his empire to build the palace at Susa. The composition survives in
    multiple witnesses, including the Old Persian clay tablet Louvre SB 2789.
  passages:
    - "Esth 1:2-7 | setting | Background for Susa's imperial palace and resources; Darius's project predates the narrative's reign of Ahasuerus"
    - "Ezra 3:7 | practice | Compare procurement of materials and skilled labor across regions; the projects and politics differ"
  related: [susa, darius-i, persia, temple-building-accounts, persepolis]
  wikipedia: null
  image: Darius Susa foundation charter Louvre
  author_notes:
    - Susa already summarizes this composition; it should not be counted as absent evidence.
    - The type is text, for the multi-witness composition. An artifact treatment would have to specify SB 2789 and its physical properties. Do not describe SB 2789 alone as trilingual; that witness is Old Persian.
    - The account does not establish Esther's banquet or identify its room or participants.
  sources_to_check:
    - Darius DSf, especially lines 22-58
    - Louvre collection record SB 2789
