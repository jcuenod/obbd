# Seed entries: Persian period, Second Temple Judaism, and New Testament background.
# Order follows seed/master.txt (## persian-hellenistic-nt).

- id: cyrus-cylinder
  cultures: [persian, babylonian]
  date: [-539, -538]
  circa: true
  scope: >-
    Inscribed clay barrel cylinder in Akkadian cuneiform, found at Babylon in 1879,
    issued in the name of Cyrus II after his capture of Babylon in 539 BCE. It presents
    Cyrus as chosen by Marduk to replace the impious Nabonidus and records the return of
    divine images and displaced peoples to their sanctuaries.
  passages:
    - "Isa 44:28-45:7 | concept | Cyrus called by name and his hand grasped by the deity; cf. Marduk choosing Cyrus"
    - "Ezra 1:1-4 | parallel | Cyrus's decree permitting return and temple rebuilding; comparable restoration policy"
    - "Ezra 6:3-5 | parallel | Aramaic memorandum of Cyrus on rebuilding the Jerusalem temple"
    - "2Chr 36:22-23 | parallel | Cyrus charged by the God of heaven to build him a house"
    - "Ezra 1:7-11 | practice | Return of temple vessels; cf. the Cylinder's return of divine images to their shrines"
    - "Dan 5:30-31 | event | Fall of Babylon; Daniel assigns the kingdom to Darius the Mede (5:31 = MT 6:1)"
  related: [cyrus-the-great, fall-of-babylon-539, nabonidus-chronicle, verse-account-of-nabonidus, marduk, persian-imperial-authorization, babylon]
  wikipedia: Cyrus Cylinder
  image: Cyrus Cylinder British Museum
  location: British Museum, London
  author_notes:
    - "Present the text as a Babylonian royal building inscription in Mesopotamian tradition (it even cites an inscription of Ashurbanipal), written to legitimate Cyrus before a Babylonian audience."
    - "Correct the popular claim that it is a 'charter of human rights'; the restorations it describes are pragmatic imperial policy toward Mesopotamian cult centres."
    - "The Cylinder does not mention Judah, Jerusalem, or Jews. The link to Ezra 1 is an analogy of policy, not direct attestation of the biblical decree."
    - "Note the debate over the authenticity of Ezra's decrees: the Aramaic memorandum (Ezra 6:3-5) is more often defended than the Hebrew edict (Ezra 1:2-4)."
    - "Mention the joined Yale fragment and the cuneiform tablet copies of the same text identified in the British Museum in 2010."
  sources_to_check:
    - "ANET 315-316"
    - "COS 2.124"
    - "I. Finkel (ed.), The Cyrus Cylinder: The King of Persia's Proclamation from Ancient Babylon (2013)"
    - "A. Kuhrt, The Persian Empire: A Corpus of Sources from the Achaemenid Period (2007)"

- id: behistun-inscription
  aliases: [Bisitun Inscription, Bisotun Inscription]
  cultures: [persian, elamite, babylonian]
  date: [-520, -518]
  circa: true
  scope: >-
    Monumental rock relief and trilingual inscription (Old Persian, Elamite, Babylonian)
    of Darius I at Bisotun in western Iran, recounting his accession and his suppression
    of the revolts of 522-521 BCE. An Aramaic version on papyrus from Elephantine shows its
    circulation through the empire; the monument was also the key to deciphering cuneiform.
  passages:
    - "Ezra 4:24 | setting | Temple work resumes in Darius's second year, just after the revolts were crushed"
    - "Hag 1:1 | setting | Haggai's oracles dated to Darius's second year (520 BCE)"
    - "Hag 2:6-7, 21-22 | setting? | Shaking of nations and overthrow of kingdoms, perhaps echoing the upheavals of 522-521"
    - "Zech 1:11 | setting? | 'The whole earth remains at peace' after the empire's pacification"
    - "Esth 1:22; 3:12; 8:9 | practice | Royal edicts sent to every province in its own script and language"
    - "Ezra 6:11 | practice | Impalement threatened for violators; Darius records impaling rebel leaders"
    - "Esth 2:23; 7:9-10 | practice | Execution on a stake, a Persian punishment"
  related: [darius-i, persia, elephantine-papyri, aramaic-language, medes, zoroastrianism, winged-sun-disk]
  wikipedia: Behistun inscription
  image: Behistun Inscription relief Darius
  location: In situ, Bisotun, Kermanshah Province, Iran
  author_notes:
    - "Explain Darius's account of the 'false Bardiya' (Gaumata) and the widely held view that Darius was himself a usurper; compare Herodotus 3.61-88."
    - "Highlight the Aramaic version from Elephantine (late 5th century copy) as evidence of deliberate imperial dissemination of royal texts."
    - "The links to Haggai and Zechariah are contextual (dating and atmosphere). Do not claim the prophets allude to the inscription."
    - "Note the role of Ahuramazda ('by the favour of Ahuramazda') for discussions of Achaemenid religion, and Rawlinson's decipherment work of the 1830s-40s."
  sources_to_check:
    - "R. Schmitt, The Bisitun Inscriptions of Darius the Great: Old Persian Text (Corpus Inscriptionum Iranicarum, 1991)"
    - "J. C. Greenfield and B. Porten, The Bisitun Inscription of Darius the Great: Aramaic Version (Corpus Inscriptionum Iranicarum, 1982)"
    - "TAD C2.1"
    - "R. G. Kent, Old Persian: Grammar, Texts, Lexicon (2nd ed., 1953)"
    - "A. Kuhrt, The Persian Empire: A Corpus of Sources from the Achaemenid Period (2007)"

- id: elephantine-papyri
  cultures: [jewish, persian, egyptian]
  date: [-495, -399]
  circa: true
  scope: >-
    The Aramaic papyri and ostraca of the Judean military colony on Elephantine island
    (Yeb) at Egypt's southern frontier, mostly from the 5th century BCE. The corpus
    includes family archives, contracts, communal letters about the temple of YHW, lists,
    and literary texts (Ahiqar, the Bisitun inscription). Individual key documents have
    their own entries.
  passages:
    - "Jer 44:1 | setting | Judeans settled in Egypt, including Pathros (Upper Egypt)"
    - "Jer 44:15-19 | practice | Judeans in Egypt honouring other deities; cf. Anat-Yahu and Eshem-Bethel in Elephantine texts"
    - "Neh 2:10, 19 | attests | Sanballat governor of Samaria, whose sons the colonists petitioned"
    - "Neh 12:22-23 | attests | Johanan the high priest, addressed by the colonists"
    - "Ezra 4:11-16; 5:7-17 | form | Aramaic official letter formulae, address and 'and now' transitions"
    - "Neh 13:23-27 | practice | Intermarriage; Elephantine contracts record Judean-Egyptian marriages"
    - "Deut 24:1-4 | practice | Divorce; Elephantine marriage contracts let either spouse initiate divorce"
    - "Mal 2:16 | language | 'Hate' (śnʾ) as technical term for divorce, as in Elephantine contracts"
    - "Neh 13:15-22 | practice | Ostraca refer to the Sabbath as a fixed day in diaspora life"
  related: [elephantine, elephantine-temple-petition, elephantine-passover-letter, ahiqar, aramaic-language, sabbath, marriage-and-bride-price, letter-writing-conventions]
  wikipedia: Elephantine papyri and ostraca
  image: Elephantine Aramaic papyrus
  location: Dispersed; major holdings in the Ägyptisches Museum und Papyrussammlung, Berlin, the Brooklyn Museum, and the Egyptian Museum, Cairo
  author_notes:
    - "The colony predates Cambyses (525 BCE) according to the temple petition. Its origins (Saite mercenaries? refugees after 587?) are debated."
    - "Discuss the colonists' self-designation (yhwdyʾ 'Judeans', also 'Arameans') and their worship of YHW alongside other named deities. Avoid anachronistic labels such as 'heterodox Judaism', and note the debate over syncretism versus Aramean neighbours."
    - "Emphasize the absence of any clear knowledge of a written Torah, which matters for dating Pentateuchal authority."
    - "Distinguish the main archives (Mibtahiah, Ananiah/Tamet, Jedaniah communal letters) and cite documents by TAD number."
  sources_to_check:
    - "B. Porten and A. Yardeni, Textbook of Aramaic Documents from Ancient Egypt (TAD), 4 vols. (1986-1999)"
    - "B. Porten (ed.), The Elephantine Papyri in English (1996; 2nd ed. 2011)"
    - "A. E. Cowley, Aramaic Papyri of the Fifth Century B.C. (1923)"
    - "E. G. Kraeling, The Brooklyn Museum Aramaic Papyri (1953)"
    - "B. Porten, Archives from Elephantine: The Life of an Ancient Jewish Military Colony (1968)"

- id: elephantine-temple-petition
  aliases: [Request to Bagohi, Petition to Bagavahya]
  cultures: [jewish, persian]
  date: [-407]
  scope: >-
    Aramaic petition (TAD A4.7, with draft A4.8) of 407 BCE from Jedaniah and the priests of
    Elephantine to Bagavahya, governor of Judah, seeking support to rebuild the temple of
    YHW destroyed in 410 BCE. The entry also covers the related memorandum (A4.9) and offer
    (A4.10) that record the reply and conditions.
  passages:
    - "Neh 2:10, 19; 13:28 | attests | Sanballat governor of Samaria; the colonists also wrote to his sons Delaiah and Shelemiah"
    - "Neh 12:22-23 | attests | Johanan the high priest, who left an earlier letter unanswered"
    - "Neh 5:14-15 | attests | Office of governor (peḥâ) of Judah, held by Bagavahya in 407"
    - "Ezra 6:3-12 | practice | Persian authorization to rebuild a temple, specifying permitted offerings"
    - "Deut 12:5-14 | concept? | Centralization of sacrifice; the memorandum permits meal-offering and incense, not burnt offerings"
    - "Isa 19:19 | concept? | An altar to YHWH in Egypt"
    - "Dan 10:2-3 | practice | Mourning by fasting and abstaining from wine and anointing, as the petitioners report"
  related: [elephantine-papyri, elephantine, sanballat, yehud-province, samaritan-origins, persian-imperial-authorization, khnum]
  wikipedia: null
  image: Elephantine papyrus petition Bagohi temple
  location: Ägyptisches Museum und Papyrussammlung, Berlin
  author_notes:
    - "Dated 20 Marcheshvan, year 17 of Darius II (late 407 BCE); destruction in year 14 (410) by priests of Khnum with the support of the commander Vidranga."
    - "Motives for the destruction are debated (property or space disputes, offence at animal sacrifice near the ram-god Khnum's temple). Present the Passover-lamb explanation as speculative."
    - "The memorandum's silence on burnt offerings (and the offer in A4.10) is often read as deference to Jerusalem's claims or to Egyptian sensitivities."
    - "Chronological value: Sanballat's sons active in 407 and Johanan as high priest support placing Nehemiah under Artaxerxes I, and bear on the date of Ezra (cf. Ezra 10:6)."
  sources_to_check:
    - "TAD A4.7-A4.10"
    - "A. E. Cowley, Aramaic Papyri of the Fifth Century B.C. (1923), nos. 30-33"
    - "J. M. Lindenberger, Ancient Aramaic and Hebrew Letters (2nd ed., 2003)"

- id: elephantine-passover-letter
  cultures: [jewish, persian]
  date: [-419, -418]
  scope: >-
    Fragmentary Aramaic letter (TAD A4.1) of 419/418 BCE, year 5 of Darius II, from one
    Hananiah to Jedaniah and the Judean garrison at Elephantine. It conveys instructions,
    linked to a royal message to the satrap Arshama, for observing a festival from the 14th
    to the 21st of Nisan with purity and avoidance of leaven.
  passages:
    - "Exod 12:15-20 | practice | Seven days of unleavened bread to the 21st day; removal of leaven"
    - "Lev 23:5-8 | practice | Passover on the 14th and unleavened bread from the 15th for seven days"
    - "Deut 16:1-8 | practice | Passover and unleavened bread as a pilgrimage feast"
    - "Ezra 6:19-22 | practice | Passover kept by the purified returnees under Darius"
    - "Ezra 7:12-26 | concept? | Royal involvement in Judean cultic norms, if the letter conveys a royal authorization"
  related: [elephantine-papyri, elephantine, passover-origins, persian-imperial-authorization, calendars-and-month-names, festivals-agricultural]
  wikipedia: null
  image: Elephantine Passover papyrus
  location: Ägyptisches Museum und Papyrussammlung, Berlin
  author_notes:
    - "Stress the damaged state: the word 'Passover' (psḥ) is restored in the letter, though psḥ is attested in Elephantine ostraca."
    - "What the royal message concerned is debated: authorization of the festival itself, or something more general. Do not state that Darius II 'decreed the Passover'."
    - "The letter is often cited as evidence for, or against, Frei's imperial authorization thesis; present both readings."
    - "Discuss whether the instructions reflect knowledge of Priestly calendar laws (Exod 12; Lev 23), or a practice still being standardized."
  sources_to_check:
    - "TAD A4.1"
    - "A. E. Cowley, Aramaic Papyri of the Fifth Century B.C. (1923), no. 21"
    - "J. M. Lindenberger, Ancient Aramaic and Hebrew Letters (2nd ed., 2003)"

- id: persepolis-fortification-tablets
  cultures: [persian, elamite]
  date: [-509, -458]
  circa: true
  scope: >-
    The administrative archives excavated at Persepolis in 1933-34: thousands of
    Fortification tablets (509-493 BCE, mostly Elamite, some Aramaic) recording rations,
    travel provisions, and estate management, and the Treasury tablets (492-458 BCE). They
    are the primary documentary evidence for how the Achaemenid heartland was run.
  passages:
    - "Neh 2:7-9 | practice | Royal letters for safe passage; cf. sealed travel authorizations for rations on royal roads"
    - "Esth 3:13-15; 8:10, 14 | practice | Royal couriers on swift horses; cf. provisions for express messengers"
    - "Neh 2:8 | language | 'Keeper of the king's park (pardēs)', a Persian loanword attested in the tablets"
    - "Eccl 2:5 | language | pardēs 'park', Old Iranian loanword"
    - "Ezra 6:9-10 | practice | Royal provision for sacrifices; tablets record rations for offerings to various gods"
    - "Neh 5:14-18 | practice | The governor's food allowance and table within the ration system"
    - "Ezra 4:7 | language | Aramaic as a language of imperial administration alongside Elamite"
  related: [persepolis, darius-i, xerxes-i, persia, aramaic-language, marduka-tablet, roads-and-highways, court-officials]
  wikipedia: Persepolis Administrative Archives
  image: Persepolis Fortification Tablet Elamite
  author_notes:
    - "Explain the archive's discovery by the Oriental Institute (Chicago), the Persepolis Fortification Archive Project, and the legal dispute and phased return of tablets to Iran."
    - "Henkelman's work shows state-funded offerings to Elamite, Iranian, and Babylonian gods. This is useful context for Persian support of local cults, but avoid making it a model of 'tolerance'."
    - "Several officials named Marduka appear. The name is common, so do not use these texts to identify Mordecai."
    - "The royal courier system also lies behind Greek angareuō 'to compel (service)' (Matt 5:41; 27:32), a possible cross-reference."
  sources_to_check:
    - "R. T. Hallock, Persepolis Fortification Tablets (OIP 92, 1969)"
    - "G. G. Cameron, Persepolis Treasury Tablets (OIP 65, 1948)"
    - "W. F. M. Henkelman, The Other Gods Who Are: Studies in Elamite-Iranian Acculturation Based on the Persepolis Fortification Texts (Achaemenid History 14, 2008)"
    - "A. Kuhrt, The Persian Empire: A Corpus of Sources from the Achaemenid Period (2007)"

- id: tattenai-tablet
  cultures: [babylonian, persian]
  date: [-502]
  scope: >-
    A Babylonian cuneiform legal tablet dated to year 20 of Darius I (502 BCE) that names
    Tattannu, governor (pīḫatu) of Ebir-nāri ('Across the River'), through one of his
    servants acting as witness. It attests the official whom Ezra 5-6 calls Tattenai.
  passages:
    - "Ezra 5:3, 6 | attests | Tattenai, governor of Beyond the River, investigates the temple rebuilding"
    - "Ezra 6:6, 13 | attests | Darius's reply addressed to Tattenai, who complies"
    - "Ezra 4:10-11, 16-17 | language | 'Beyond the River' (ʿăbar nahărāʾ) = Akkadian Ebir-nāri as a provincial name"
    - "Neh 2:7, 9 | language | 'Governors of Beyond the River'"
  related: [darius-i, yehud-province, persia, persian-imperial-authorization, letter-writing-conventions]
  wikipedia: Tattenai
  image: Tattenai cuneiform tablet
  author_notes:
    - "In 502 BCE Ebir-nāri still formed part of a combined satrapy with Babylon. Tattannu was subordinate to the satrap; explain the later division of the satrapy."
    - "The tablet confirms the name and office, not the authenticity of the Aramaic correspondence in Ezra 5-6, which remains debated."
    - "Verify the tablet's current museum and publication history (first identified by A. Ungnad and discussed by Olmstead) before citing them."
  sources_to_check:
    - "M. W. Stolper, 'The Governor of Babylon and Across-the-River in 486 B.C.', JNES 48 (1989)"

- id: samaria-papyri
  aliases: [Wadi Daliyeh papyri]
  cultures: [persian, hebrew]
  date: [-375, -335]
  circa: true
  scope: >-
    Fourth-century BCE Aramaic legal papyri (mostly slave-sale deeds) and sealings
    from Samaria, found in 1962 in a cave in Wadi ed-Daliyeh with the remains of refugees.
    The refugees probably fled Alexander's reprisals of 332/331 BCE. The papyri attest
    governors of Samaria from the house of Sanballat.
  passages:
    - "Neh 2:10, 19 | attests | A later governor named as 'son of Sanballat', on a bulla and in a deed"
    - "Neh 13:28 | setting | Sanballat's family as a continuing ruling house in Samaria"
    - "2Kgs 17:24-41 | setting | Mostly Yahwistic personal names in 4th-century Samaria; bears on the polemical portrait"
    - "Lev 25:44-46 | practice | Chattel slavery and slave sales among Samarians"
    - "Jer 32:9-14 | practice | Sealed legal deeds with bullae"
  related: [sanballat, samaritan-origins, samaria, mount-gerizim, sealed-deeds, slavery, seals-and-bullae]
  wikipedia: Wadi Daliyeh
  image: Wadi Daliyeh papyrus Samaria
  author_notes:
    - "Present F. M. Cross's papponymy reconstruction (Sanballat I-III), which links the papyri to Josephus, Ant. 11.302-347. Note J. Dušek's critique, which removes the need for a Sanballat III."
    - "The latest dated deed is from 335 BCE. The connection with Alexander and Samaria's revolt (Curtius Rufus 4.8.9-11) is an inference from the cave context."
    - "Use the onomastics (Yahwistic, Aramaic, and other names) cautiously in Samaritan-origins discussions."
  sources_to_check:
    - "D. M. Gropp et al., Wadi Daliyeh II: The Samaria Papyri from Wadi Daliyeh (DJD XXVIII, 2001)"
    - "M. J. W. Leith, Wadi Daliyeh I: The Wadi Daliyeh Seal Impressions (DJD XXIV, 1997)"
    - "P. W. Lapp and N. L. Lapp (eds.), Discoveries in the Wâdī ed-Dâliyeh (AASOR 41, 1974)"
    - "J. Dušek, Les manuscrits araméens du Wadi Daliyeh et la Samarie vers 450-332 av. J.-C. (2007)"

- id: yehud-seals-and-coins
  cultures: [persian, judahite, jewish]
  date: [-500, -150]
  circa: true
  scope: >-
    Inscribed stamp impressions on jar handles (yhd, yhwd, sometimes with names and the
    title phwʾ 'governor') and small silver coins inscribed yhd/yhwd from the Persian and
    early Hellenistic province of Judah. They provide the main epigraphic evidence for
    Yehud's administration and governors.
  passages:
    - "Hag 1:1, 14 | attests | Zerubbabel 'governor (peḥâ) of Judah'; seal impressions attest the office"
    - "Neh 5:14-15 | attests | Earlier governors of Judah before Nehemiah"
    - "Mal 1:8 | attests | 'Offer that to your governor'"
    - "Ezra 5:8 | language | 'The province of Judah' (yĕhûd mĕdîntāʾ)"
    - "Neh 12:10-11, 22 | attests? | Johanan the high priest; a coin of 'Yohanan the priest' may name him"
    - "1Chr 3:19 | attests? | Shelomith, 'maidservant of Elnathan the governor' on an unprovenanced seal; identification with Zerubbabel's daughter proposed"
  related: [yehud-province, coinage, seals-and-bullae, ramat-rahel, paleo-hebrew-script, samaria-papyri]
  wikipedia: Yehud coinage
  image: Yehud coin
  author_notes:
    - "Use the Lipschits-Vanderhooft typology and chronology. Their distribution (Ramat Rahel, Jerusalem, Mizpah area) helps map provincial boundaries."
    - "Avigad's bullae and seals naming Elnathan and Shelomith are unprovenanced. Note this, and present the Shelomith-Zerubbabel identification (Meyers) as conjecture."
    - "Coins: 4th century BCE, including issues naming 'Yehezqiyah the governor' and 'Yohanan the priest'. Note the debated BM drachm with a seated deity (reading YHD vs. YHW)."
    - "Note the use of Aramaic versus paleo-Hebrew scripts on these objects, and the minting of Yehud coins after the Persian period under Ptolemaic rule."
  sources_to_check:
    - "O. Lipschits and D. S. Vanderhooft, The Yehud Stamp Impressions (2011)"
    - "N. Avigad, Bullae and Seals from a Post-Exilic Judean Archive (Qedem 4, 1976)"
    - "Y. Meshorer, A Treasury of Jewish Coins (2001)"

- id: udjahorresnet-statue
  cultures: [egyptian, persian]
  date: [-519]
  circa: true
  scope: >-
    Naophorous statue of the Egyptian official Udjahorresnet, priest of Neith at Sais and
    chief physician, whose inscription narrates his service to Cambyses and Darius I.
    It records his role in composing Cambyses' royal titulary, restoring the Neith
    sanctuary, and, on Darius's orders, re-establishing the 'House of Life'.
  passages:
    - "Ezra 7:12-26 | parallel | A native official commissioned by the Persian king to restore local cult and institutions"
    - "Neh 1:11-2:8 | parallel | A courtier of subject origin gains royal sponsorship for his homeland"
    - "Ezra 6:3-12 | practice | Persian royal patronage of a local sanctuary"
  related: [persian-imperial-authorization, darius-i, persia, cyrus-cylinder, court-officials, scribes-and-scribal-education]
  wikipedia: Udjahorresnet
  image: Udjahorresnet statue Vatican
  location: Museo Gregoriano Egizio, Vatican Museums
  author_notes:
    - "Debate on whether he was a collaborator or a protector of Egyptian interests. His positive portrait of Cambyses contrasts with Herodotus's 'mad Cambyses'."
    - "The parallel to Ezra and Nehemiah is typological (Blenkinsopp 1987): it shows how Persian kings used native elites. It is not evidence of direct contact."
    - "Relate him to the Demotic Chronicle's report that Darius ordered Egyptian law collected. This is important evidence in the imperial authorization debate."
  sources_to_check:
    - "M. Lichtheim, Ancient Egyptian Literature, vol. 3 (1980)"
    - "G. Posener, La première domination perse en Égypte (1936)"
    - "J. Blenkinsopp, 'The Mission of Udjahorresnet and Those of Ezra and Nehemiah', JBL 106 (1987)"
    - "A. Kuhrt, The Persian Empire: A Corpus of Sources from the Achaemenid Period (2007)"

- id: persian-imperial-authorization
  aliases: [Reichsautorisation, Imperial authorization]
  cultures: [persian]
  scope: >-
    The hypothesis, associated with Peter Frei, that the Achaemenid administration
    ratified local norms so that they became binding imperial law, and that the Torah's
    promulgation in Yehud was such a case. The entry covers the thesis, its evidence
    (Letoon trilingual, Demotic Chronicle, Elephantine Passover letter, Ezra 7), and its
    critique.
  passages:
    - "Ezra 7:25-26 | concept | 'The law of your God and the law of the king' enforced by royal sanction"
    - "Ezra 7:12-26 | concept | Artaxerxes' rescript commissioning Ezra to implement the divine law"
    - "Ezra 7:12, 14, 21 | language | dāt 'law', a Persian loanword"
    - "Ezra 6:3-12 | concept | Royal authorization of temple rebuilding and its cult"
    - "Neh 8:1-8 | setting | Public promulgation of the Torah under Persian-appointed leaders"
    - "Esth 1:19; 8:8 | concept | Irrevocable 'laws of the Persians and Medes' (literary motif)"
    - "Dan 6:8, 12, 15 | concept | Unalterable law of the Medes and Persians (MT 6:9, 13, 16)"
  related: [udjahorresnet-statue, elephantine-passover-letter, artaxerxes-i, persia, cyrus-cylinder, yehud-province, ane-law-collections]
  wikipedia: null
  image: null
  author_notes:
    - "State Frei's thesis (1984; 2nd ed. 1996) precisely. Note that most specialists now reject the strong form: there was no attested legal mechanism for authorizing local codes."
    - "Evaluate the key evidence: the Letoon trilingual (Xanthos, 337 BCE) concerns a local cult foundation, not a law code. The Demotic Chronicle's report of Darius codifying Egyptian law is late and debated."
    - "A weaker version (Persian interest in local order, combined with local elites' use of imperial backing) remains influential in Pentateuch-formation debates."
    - "Note that the irrevocability of Persian law (Esther, Daniel) has no support in Achaemenid sources."
  sources_to_check:
    - "J. W. Watts (ed.), Persia and Torah: The Theory of Imperial Authorization of the Pentateuch (2001)"
    - "P. Frei and K. Koch, Reichsidee und Reichsorganisation im Perserreich (OBO 55, 1984; 2nd ed. 1996)"

- id: marduka-tablet
  cultures: [babylonian, persian]
  date: [-500, -480]
  circa: true
  scope: >-
    A Babylonian administrative tablet from the late reign of Darius I or early reign of
    Xerxes that names a Marduka as an official (sipīru) on business from Susa.
    A. Ungnad published it in 1940-41 as a possible extrabiblical reference to Mordecai.
  passages:
    - "Esth 2:5 | attests? | Mordecai (= Babylonian Marduka), a Judean at the Susa court"
    - "Esth 2:19, 21 | attests? | Mordecai 'sitting at the king's gate', i.e. holding an office"
    - "Ezra 2:2 | language | Mordecai among the returnees: a name formed on Marduk (cf. Neh 7:7)"
  related: [xerxes-i, persepolis-fortification-tablets, susa, marduk, court-officials, murashu-archive]
  wikipedia: null
  image: Marduka cuneiform tablet Ungnad
  author_notes:
    - "Marduka was a common name: several are attested in the Persepolis Fortification texts and in Babylonian archives. The identification with Mordecai cannot be shown, and Clines's critique should be presented."
