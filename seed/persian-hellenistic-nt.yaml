  related: [purity-and-impurity, pool-of-siloam, pool-of-bethesda, qumran, jewish-sects, synagogues, magdala-stone]
  wikipedia: Mikveh
  image: Herodian stone vessels Jerusalem
  author_notes:
    - "Stone vessels: chalk workshops near Jerusalem (e.g. Ḥizma, Mount Scopus) and in Galilee (Reina, ʿEinot Amitai). Their distribution marks Jewish settlement; the rationale appears later in m. Kelim 10:1 and m. Parah 3:2."
    - "Miqvaʾot appear from the late 2nd or early 1st century BCE. Do not read later rabbinic specifications (40 seʾahs, ʾotsar) back into all early pools."
    - "John 2:6's 'two or three measures' (metrētai) per jar fits the large lathe-turned stone jars known archaeologically."
  sources_to_check:
    - "J. Magness, Stone and Dung, Oil and Spit: Jewish Daily Life in the Time of Jesus (2011)"
    - "Y. Adler, The Origins of Judaism: An Archaeological-Historical Reappraisal (2022)"

- id: synagogues
  cultures: [jewish]
  scope: >-
    Jewish assembly buildings and institutions (synagōgē, proseuchē) before 135 CE. The
    entry covers their debated origins, the excavated pre-70 buildings in the land of
    Israel and the diaspora, and their functions of scripture reading, teaching, and
    community life as reflected in the New Testament.
  passages:
    - "Luke 4:16-30 | practice | Sabbath reading from the prophets and teaching at Nazareth"
    - "Mark 1:21 | setting | Jesus teaches in the Capernaum synagogue"
    - "Luke 7:5 | practice | A centurion's benefaction: 'he built our synagogue'"
    - "Acts 13:14-15 | practice | Reading of the law and prophets; officials invite a word of exhortation"
    - "Acts 15:21 | practice | Moses read every Sabbath in every city"
    - "Acts 16:13 | language | proseuchē 'place of prayer' at Philippi"
    - "Mark 5:22 | language | archisynagōgos 'leader of the synagogue'"
    - "Matt 23:2, 6 | realia | 'Moses' seat' and seats of honour"
    - "Ps 74:8 | language? | 'Meeting places of God' in the land, sometimes read as synagogues"
  related: [theodotos-inscription, magdala-stone, capernaum, masada, stone-vessels-and-mikvaot, septuagint]
  wikipedia: Synagogue
  image: Gamla synagogue
  author_notes:
    - "Origins debated (exilic, Hellenistic Egypt, Judean town gate). The earliest firm evidence is 3rd-century BCE proseuchē dedications from Ptolemaic Egypt."
    - "Pre-70 buildings: Gamla, Masada, Herodium, Magdala, Qiryat Sefer, Modiʿin, among others. The white-limestone Capernaum synagogue is late antique, built over an earlier basalt structure."
    - "Avoid retrojecting later rabbinic liturgy. Reading and teaching Torah are the best-attested functions; the prominence of prayer is debated."
  sources_to_check:
    - "L. I. Levine, The Ancient Synagogue: The First Thousand Years (2nd ed., 2005)"
    - "A. Runesson, D. D. Binder, and B. Olsson, The Ancient Synagogue from Its Origins to 200 C.E.: A Source Book (2008)"

- id: galilee-boat
  aliases: [Jesus Boat, Sea of Galilee Boat, Ginosar Boat]
  cultures: [jewish, roman]
  date: [-100, 70]
  circa: true
  scope: >-
    The hull of a wooden fishing boat (about 8.2 m long) recovered from the mud of the Sea
    of Galilee near Ginosar in 1986, dated to the 1st century BCE to 1st century CE. It is
    the type of vessel presupposed in the Gospel fishing and lake-crossing stories.
  passages:
    - "Mark 1:16-20 | realia | Fishermen, nets, boat, and hired men on the lake"
    - "Mark 4:35-41 | realia | Boat crossing in a storm; Jesus asleep on the cushion in the stern"
    - "Luke 5:1-11 | realia | Two boats working together; nets strained by the catch"
    - "John 21:1-11 | realia | Night fishing from a boat with a net"
    - "Matt 13:47-48 | realia | Dragnet (sagēnē) hauled ashore"
  related: [capernaum, magdala-stone, josephus, phoenician-seafaring]
  wikipedia: Sea of Galilee Boat
  image: Ancient Galilee Boat Ginosar
  location: Yigal Allon Centre, Kibbutz Ginosar
  author_notes:
    - "There is no connection to Jesus or the disciples. 'Jesus Boat' is a popular nickname."
    - "Its construction (mortise-and-tenon, many repairs, mixed timbers) indicates long use and limited resources. Its capacity (about 15 people) can be compared with Josephus's lake boats (War 2.635-641; 3.522-531)."
    - "Dating by radiocarbon, pottery, and construction technique."
  sources_to_check:
    - "S. Wachsmann, The Sea of Galilee Boat: A 2000-Year-Old Discovery from the Sea of Legends (1995)"
    - "S. Wachsmann (ed.), 'The Excavations of an Ancient Boat in the Sea of Galilee (Lake Kinneret)', ʿAtiqot 19 (1990)"

- id: pool-of-siloam
  cultures: [jewish, judahite]
  scope: >-
    The pool(s) at the southern end of Jerusalem's City of David, fed by Hezekiah's tunnel
    from the Gihon spring. The entry covers the large stepped pool of the late Second
    Temple period, discovered in 2004, as well as its Iron Age and Byzantine predecessors
    and successors.
  passages:
    - "John 9:7 | setting | The man born blind washes in the pool of Siloam ('Sent')"
    - "John 7:37-38 | practice | Sukkot water ceremony drawing water from Siloam (m. Sukkah 4:9)"
    - "Luke 13:4 | setting | The tower in Siloam that fell"
    - "Isa 8:6 | language | 'The waters of Shiloah that flow gently'"
    - "Neh 3:15 | setting | Wall of the Pool of Shelah by the king's garden"
    - "2Kgs 20:20 | setting | Hezekiah's pool and conduit"
    - "Isa 22:9-11 | setting | Lower pool and reservoir between the two walls"
  related: [hezekiahs-tunnel, city-of-david, stone-vessels-and-mikvaot, herods-temple, pool-of-bethesda, jerusalem, siloam-inscription]
  wikipedia: Pool of Siloam
  image: Pool of Siloam steps excavation
  author_notes:
    - "The 2004 discovery (Reich and Shukron) of a stepped pool dated by coins to the 1st century BCE-1st century CE confirms John's topography. Distinguish it from the Byzantine and modern pool."
    - "Its use as a large miqveh for pilgrims has been proposed but is debated."
    - "Note the ongoing excavation of the stepped street toward the Temple Mount and the political sensitivities of excavating under Silwan."

- id: pool-of-bethesda
  cultures: [jewish, roman]
  scope: >-
    The twin pools north of the Temple Mount near the Church of St Anne, identified with the
    pool 'by the Sheep Gate' with five porticoes in John 5. The entry covers the pools'
    history and the later Roman healing sanctuary nearby.
  passages:
    - "John 5:2-9 | setting | Pool with five porticoes where the sick waited for healing"
    - "John 5:3-4 | language | The angel stirring the water (5:3b-4) is absent from the earliest manuscripts"
    - "Neh 3:1; 12:39 | setting | The Sheep Gate north of the temple"
  related: [pool-of-siloam, herods-temple, stone-vessels-and-mikvaot, jerusalem, temple-mount, dead-sea-scrolls]
  wikipedia: Pool of Bethesda
  image: Pool of Bethesda St Anne Jerusalem
  author_notes:
    - "Excavations revealed two basins separated by a dam, supporting John's five porticoes (four sides plus the dividing dam). The pools' date and function (reservoir, possibly ritual bathing in the southern pool) are debated."
    - "A healing sanctuary (Asclepius/Serapis) is attested after 135 CE. Its existence before 70 is disputed, so do not assume it as the setting of John 5."
    - "The name varies in manuscripts (Bethesda, Bethzatha, Bethsaida). The Copper Scroll (3Q15) reading of a dual 'Beth Eshdatayin' is sometimes cited but debated."
  sources_to_check:
    - "J. Jeremias, The Rediscovery of Bethesda (1966)"

- id: arch-of-titus
  cultures: [roman]
  date: [81, 82]
  circa: true
  scope: >-
    Single-bay honorific arch on the Via Sacra in Rome, dedicated after Titus's death (81
    CE) to the deified emperor. Its relief panels show the triumph of 71 CE over Judea,
    including the temple menorah, the table of showbread, and trumpets carried as spoils.
  passages:
    - "Mark 13:1-2 | event | Destruction of the temple foretold"
    - "Luke 19:41-44 | event | Jerusalem besieged and razed"
    - "Luke 21:20-24 | event | Jerusalem surrounded by armies; inhabitants led captive among the nations"
    - "Exod 25:31-40 | realia | The lampstand among the spoils"
    - "Exod 25:23-30 | realia | The table of the bread of the presence among the spoils"
    - "Num 10:1-10 | realia | Silver trumpets carried in the procession"
    - "2Cor 2:14 | practice | Roman triumphal procession as metaphor"
  related: [judaea-capta-coins, herods-temple, menorah, josephus, imperial-cult, masada]
  wikipedia: Arch of Titus
  image: Arch of Titus spoils relief menorah
  location: In situ, Roman Forum, Rome
  author_notes:
    - "Compare Josephus's description of the triumph and spoils (War 7.123-162) and their later display in the Temple of Peace."
    - "Debate on how accurately the menorah is depicted (e.g. the decorated octagonal base). Note the polychromy research of 2012."
    - "A second, lost arch at the Circus Maximus had an inscription (CIL VI 944) claiming that Titus subdued the Jews and destroyed Jerusalem."
  sources_to_check:
    - "CIL VI 945"
    - "CIL VI 944"
    - "S. Fine, The Menorah: From the Bible to Modern Israel (2016)"
    - "M. Pfanner, Der Titusbogen (1983)"

- id: judaea-capta-coins
  cultures: [roman]
  date: [70, 96]
  circa: true
  scope: >-
    Roman coins issued by Vespasian, Titus, and Domitian to commemorate the suppression of
    the Jewish revolt. Typical types show a mourning woman (Judaea) seated beneath a palm
    tree, often with a bound captive, and the legend IVDAEA CAPTA.
  passages:
    - "Isa 3:26 | imagery | Zion as a ravaged woman sitting on the ground at her gates"
    - "Lam 1:1 | imagery | Jerusalem as a widow sitting alone"
    - "Luke 21:24 | event | Jerusalem trampled by the Gentiles; people taken captive"
    - "Rev 18:7 | imagery? | Babylon boasts 'I am no widow', perhaps inverting Flavian imagery"
  related: [arch-of-titus, coinage, imperial-cult, josephus, herods-temple, masada]
  wikipedia: Judaea Capta coinage
  image: Judaea Capta sestertius
  author_notes:
    - "Place them in the Roman convention of conquered-province iconography (e.g. Germania capta) and in Flavian legitimation."
    - "The parallel with the biblical image of Zion as a mourning woman is iconographic and conceptual. Do not claim the mints drew on Isaiah."
    - "Contrast with the Jewish revolt coinage ('Jerusalem the Holy', 'Freedom of Zion') and mention the fiscus Iudaicus imposed after 70."
  sources_to_check:
    - "Roman Imperial Coinage, vol. II.1 (2nd ed., 2007)"
    - "D. Hendin, Guide to Biblical Coins (5th ed., 2010)"

- id: gallio-inscription
  aliases: [Delphi Inscription]
  cultures: [roman, greek]
  date: [52]
  circa: true
  scope: >-
    Fragmentary Greek copy at Delphi of a letter of the emperor Claudius naming 'Lucius
    Junius Gallio, my friend and proconsul' of Achaia. Dated by Claudius's 26th imperial
    acclamation (c. 52 CE), it is the main anchor for absolute Pauline chronology.
  passages:
    - "Acts 18:12-17 | attests | Gallio, proconsul of Achaia, dismisses the Jews' charges against Paul"
    - "Acts 18:1-11 | setting | Paul's eighteen months at Corinth, dated relative to Gallio's term"
  related: [corinth, erastus-inscription, politarch-inscriptions]
  wikipedia: Delphi Inscription
  image: Gallio inscription Delphi
  location: Delphi Archaeological Museum
  author_notes:
    - "Explain the reconstruction of the nine fragments and the dating logic. Gallio's proconsulship is usually placed in 51-52 (less often 52-53), so Paul's hearing is in 51 or 52."
    - "Gallio was the brother of Seneca. He left Achaia early because of illness (Seneca, Ep. 104.1)."
    - "Note how Pauline chronology combines this with the expulsion of Jews from Rome under Claudius (Acts 18:2; Suetonius, Claud. 25.4), often dated to 49 CE but debated."
  sources_to_check:
    - "SIG³ 801 D"
    - "J. Murphy-O'Connor, St. Paul's Corinth: Texts and Archaeology (3rd ed., 2002)"

- id: erastus-inscription
  cultures: [roman]
  date: [1, 150]
  circa: true
  scope: >-
    Latin inscription set in a paved square east of the theatre at Corinth, recording that
    Erastus laid the pavement at his own expense in return for his aedileship. Its
    possible identification with the Erastus of Rom 16:23 is debated.
  passages:
    - "Rom 16:23 | attests? | Erastus, 'the city treasurer' (oikonomos tēs poleōs), sends greetings from Corinth"
    - "Acts 19:22 | attests? | Erastus sent to Macedonia with Timothy"
    - "2Tim 4:20 | attests? | Erastus remained in Corinth"
    - "1Cor 1:26 | setting | 'Not many of you were powerful': the social level of the Corinthian believers"
  related: [corinth, gallio-inscription, politarch-inscriptions]
  wikipedia: Erastus of Corinth
  image: Erastus inscription Corinth
  location: In situ, Ancient Corinth
  author_notes:
    - "Whether Greek oikonomos tēs poleōs can translate Latin aedilis is disputed (Theissen for; Meggitt and Friesen against)."
    - "The date is debated: Kent placed it in the mid-1st century CE, while Friesen (2010) argued for the 2nd century. Erastus was also a fairly common name."
    - "The identification bears on the 'new consensus' about the social status of Pauline communities. Present it as possible, not proven."
  sources_to_check:
    - "J. H. Kent, Corinth VIII.3: The Inscriptions 1926-1950 (1966), no. 232"
    - "S. J. Friesen, 'The Wrong Erastus: Ideology, Archaeology, and Exegesis', in S. J. Friesen, D. N. Schowalter, and J. C. Walters (eds.), Corinth in Context (2010)"
    - "G. Theissen, The Social Setting of Pauline Christianity (1982)"

- id: politarch-inscriptions
  cultures: [greek, roman]
  date: [-150, 250]
  circa: true
  scope: >-
    The group of Greek inscriptions, most from Thessalonica and other Macedonian cities,
    that name politarchs as civic magistrates. They include the inscription from the
    Vardar Gate. Together they confirm the title Acts uses for Thessalonica's officials.
  passages:
    - "Acts 17:6, 8 | language | Jason dragged before the city authorities (politarchai)"
    - "Acts 16:20-22, 35-38 | language | Different titles at Philippi, a Roman colony: stratēgoi and rhabdouchoi"
    - "1Thess 2:14 | setting | Persecution by fellow citizens in Thessalonica"
  related: [gallio-inscription, erastus-inscription, imperial-cult, corinth]
  wikipedia: Politarch
  image: Vardar Gate inscription politarchs British Museum
  location: British Museum, London (Vardar Gate inscription); others in Macedonian collections
  author_notes:
    - "The title is rare in literary sources but well attested epigraphically, mostly in Macedonia (G. H. R. Horsley's survey)."
    - "Accuracy on local titles shows Luke's familiarity with civic terminology. It does not by itself prove the historicity of the episode; avoid apologetic overstatement."
    - "Verify the date of the Vardar Gate inscription, which is often cited as 1st century CE but is debated."
  sources_to_check:
    - "G. H. R. Horsley, 'The Politarchs', in D. W. J. Gill and C. Gempf (eds.), The Book of Acts in Its Graeco-Roman Setting (1994)"

- id: nazareth-inscription
  cultures: [roman, greek]
  date: [-50, 54]
  circa: true
  scope: >-
    A marble slab with a Greek 'ordinance of Caesar' that prescribes capital punishment for
    violating tombs or moving bodies. It entered the Froehner collection in 1878 with a note
    that it had been sent from Nazareth. Its provenance, date, and emperor are uncertain.
  passages:
    - "Matt 28:11-15 | event? | Rumour that the disciples stole Jesus' body; a link to an imperial edict proposed"
    - "Matt 27:62-66 | practice | Sealing and guarding a tomb against theft of the body"
    - "John 20:2, 13-15 | practice | Concern that the body has been removed from the tomb"
  related: [ossuaries, forgeries-in-biblical-archaeology, bench-tombs, care-for-the-dead]
  wikipedia: Nazareth Inscription
  image: Nazareth Inscription Cabinet des Médailles
  location: Cabinet des Médailles, Bibliothèque nationale de France, Paris
  author_notes:
    - "The note 'sent from Nazareth' does not establish the findspot. A 2020 isotopic study pointed to marble from Kos, which weakens any Galilean connection."
    - "The emperor is unnamed. Linking it to Claudius and a reaction to Christian resurrection claims is speculative and not mainstream."
    - "Discuss it primarily as evidence for Greco-Roman concern with tomb violation."
  sources_to_check:
    - "F. Cumont, 'Un rescrit impérial sur la violation de sépulture', Revue historique 163 (1930)"

- id: priene-calendar-inscription
  cultures: [greek, roman]
  date: [-9]
  scope: >-
    Decree of the provincial council of Asia (9 BCE), preserved at Priene and in other
    copies, adopting a calendar in which the year began on Augustus's birthday. Its
    accompanying text celebrates the birth of 'the god' as the beginning of 'good news'
    (euangelia) and of a saviour who ended war.
  passages:
    - "Mark 1:1 | language | 'Beginning of the good news' (euangelion), a term also used of imperial benefactions"
    - "Luke 2:10-11 | language | Angel announces good news and the birth of a 'Saviour'"
    - "Luke 2:14 | concept | Peace on earth; cf. the Augustan peace"
    - "Phil 3:20 | language | Awaiting a 'Saviour' from heaven"
    - "Titus 2:13 | language | 'Appearing' (epiphaneia) of 'our great God and Saviour'"
    - "Isa 52:7 | language | Messenger announcing good news (mĕbaśśēr), the Jewish background of euangelion"
  related: [imperial-cult, res-gestae, census-of-quirinius, pergamon]
  wikipedia: Priene calendar inscription
  image: Priene calendar inscription Augustus
  location: Antikensammlung, Staatliche Museen zu Berlin (Priene copy)
  author_notes:
    - "The decree was proposed by the proconsul Paullus Fabius Maximus. Note the plural euangelia."
    - "Present the debate over the extent of counter-imperial meaning in NT 'gospel' language. Isaianic usage (Isa 40:9; 52:7; 61:1) is the other key background."
    - "Verify the current locations of the Priene fragments and of the other copies (Apameia, Eumeneia, Dorylaion, Maionia)."
  sources_to_check:
    - "OGIS 458"
    - "R. K. Sherk, Roman Documents from the Greek East (1969)"

- id: res-gestae
  aliases: [Monumentum Ancyranum]
  cultures: [roman]
  date: [14]
  scope: >-
    Augustus's first-person account of his achievements, completed by 14 CE and inscribed
    at his mausoleum in Rome. It survives through provincial copies, chiefly the
    Monumentum Ancyranum (Latin and Greek) at Ankara and fragments from Apollonia and
    Antioch in Pisidia.
  passages:
    - "Luke 2:1 | setting | A decree of Augustus; the Res Gestae records three censuses of Roman citizens"
    - "Luke 2:14 | concept | Peace on earth; cf. the Pax Augusta and the closing of Janus"
    - "1Thess 5:3 | concept? | 'Peace and security', possibly echoing imperial slogans"
    - "Acts 13:14 | setting | Antioch in Pisidia, where a Latin copy stood"
  related: [priene-calendar-inscription, imperial-cult, census-of-quirinius, royal-annals-and-historiography, behistun-inscription]
  wikipedia: Res Gestae Divi Augusti
  image: Monumentum Ancyranum Res Gestae Ankara
  location: In situ, Temple of Augustus and Rome, Ankara (Monumentum Ancyranum)
  author_notes:
    - "The censuses in the Res Gestae (28 BCE, 8 BCE, 14 CE) are of Roman citizens, not provincial registrations. Do not equate them with Luke's census."
    - "Note 'son of the divine' (divi filius) in imperial titulature as background for NT 'Son of God' language. Avoid a one-sided derivation."
    - "A comparison with Near Eastern royal res gestae (e.g. Behistun) is apt for the genre."
  sources_to_check:
    - "A. E. Cooley, Res Gestae Divi Augusti: Text, Translation, and Commentary (2009)"
    - "P. A. Brunt and J. M. Moore, Res Gestae Divi Augusti (1967)"

- id: census-of-quirinius
  cultures: [roman, jewish]
  date: [6]
  scope: >-
    The Roman provincial census of Judea carried out under P. Sulpicius Quirinius, legate
    of Syria, in 6 CE after Archelaus was deposed. The entry covers Luke's association of it
    with Jesus' birth and the chronological problem this creates.
  passages:
    - "Luke 2:1-5 | event | Registration 'while Quirinius was governor of Syria' linked to Jesus' birth"
    - "Acts 5:37 | event | Judas the Galilean revolted 'at the time of the census'"
    - "Luke 1:5 | setting | Birth narrative set 'in the days of King Herod' (d. 4 BCE)"
    - "Mark 12:14-17 | practice | Paying the tax (kēnsos) to Caesar"
  related: [josephus, herod-the-great, res-gestae, imperial-cult, priene-calendar-inscription, bethlehem, jewish-sects]
  wikipedia: Census of Quirinius
  image: null
  author_notes:
    - "Josephus (Ant. 17.355; 18.1-10, 26) dates the census to 6 CE. Herod died in 4 BCE (cf. Matt 2; Luke 1:5)."
    - "Harmonizations (an earlier governorship based on the anonymous Lapis Tiburtinus; prōtē as 'before'; Tertullian's Saturninus) have not won wide acceptance. The mainstream view is that Luke's chronology is confused or theologically motivated."
    - "No empire-wide census under Augustus is attested, and registration at an ancestral home is not attested Roman practice. The Egyptian edict of 104 CE ordering return home is a different situation."
    - "The Apamea inscription of Q. Aemilius Secundus records a census under Quirinius."
  sources_to_check:
    - "CIL III 6687"
    - "E. Schürer, G. Vermes, and F. Millar, The History of the Jewish People in the Age of Jesus Christ, vol. 1 (1973)"
    - "R. E. Brown, The Birth of the Messiah (2nd ed., 1993)"

- id: imperial-cult
  cultures: [roman, greek]
  scope: >-
    Worship and honours for Roman emperors, living and deified, and for Roma, organized at
    provincial, civic, and private levels, especially in the Greek East. The entry covers
    its institutions and monuments and its bearing on Revelation, Acts, and Paul.
  passages:
    - "Rev 13:4-18 | polemic | Worship of the beast and its image; the mark required for commerce"
    - "Rev 14:9-11 | polemic | Warning against worshipping the beast and its image"
    - "Rev 2:13 | setting | Pergamum, 'where Satan's throne is'"
    - "Acts 12:21-23 | event | Agrippa I hailed as a god and struck down (cf. Ant. 19.343-350)"
    - "Acts 17:7 | concept | Acting against Caesar's decrees by proclaiming another king"
    - "Mark 12:13-17 | practice | Coin bearing Caesar's image and inscription"
    - "Phil 2:9-11 | concept? | Universal acclamation of Jesus as Lord, with possible counter-imperial resonance"
    - "1Pet 2:13-17 | concept | Honour the emperor, but fear God"
  related: [priene-calendar-inscription, res-gestae, pergamon, temple-of-artemis-ephesus, caesarea-maritima, judaea-capta-coins, king-as-son-of-god]
  wikipedia: Roman imperial cult
  image: Sebasteion Aphrodisias relief
  author_notes:
    - "Distinguish provincial cults (Pergamon 29 BCE; Smyrna under Tiberius; Ephesus Flavian temple of the Sebastoi), civic cults, and private devotion, and divus for deceased emperors versus honours for living ones."
    - "Jews were exempt from emperor worship. Sacrifices for (not to) the emperor were offered in the Jerusalem temple until 66 (War 2.197, 409)."
    - "Systematic persecution under Domitian is now largely doubted. Revelation's critique works within everyday participation in imperial cult (Friesen)."
  sources_to_check:
    - "S. R. F. Price, Rituals and Power: The Roman Imperial Cult in Asia Minor (1984)"
    - "S. J. Friesen, Imperial Cults and the Apocalypse of John (2001)"

- id: temple-of-artemis-ephesus
  cultures: [greek, roman]
  scope: >-
    Ephesus, metropolis of the Roman province of Asia, and its famous sanctuary of Artemis
    (the Artemision), one of the Seven Wonders. The entry covers the city's civic, cultic,
    and imperial institutions as background to Paul's ministry and to Revelation.
  passages:
    - "Acts 19:23-41 | setting | Silversmiths' riot; 'Great is Artemis of the Ephesians'; the theatre"
    - "Acts 19:24 | realia | Silver shrines (naoi) of Artemis made by Demetrius"
    - "Acts 19:31 | language | Asiarchs, attested provincial dignitaries"
    - "Acts 19:35 | language | Ephesus as temple warden (neōkoros) of Artemis; image 'fallen from heaven'"
    - "Acts 19:19 | practice | Burning of magic books; cf. the 'Ephesian letters'"
    - "1Cor 15:32 | setting | 'Fought with wild beasts at Ephesus'"
    - "Rev 2:1-7 | setting | Message to the church in Ephesus"
  related: [imperial-cult, pergamon, laodicea, corinth, priene-calendar-inscription]
  wikipedia: Ephesus
  image: Temple of Artemis Ephesus column
  author_notes:
    - "Outline the Artemision's history (archaic temple, burned 356 BCE, rebuilt), its rediscovery by J. T. Wood (1869), and the theatre. The Salutaris foundation (104 CE) documents Artemis processions."
    - "Interpretations of the cult statue's 'many breasts' (breasts, eggs, bull scrota, ornaments) are debated; avoid fertility-cult clichés."
    - "Acts' civic details (town clerk, Asiarchs, neokoros) are well supported epigraphically, but this does not settle the episode's historicity."
  sources_to_check:
    - "G. M. Rogers, The Sacred Identity of Ephesos: Foundation Myths of a Roman City (1991)"
    - "P. Trebilco, The Early Christians in Ephesus from Paul to Ignatius (2004)"

- id: pergamon
  cultures: [greek, roman]
  scope: >-
    Pergamon (Pergamum), the Attalid capital in Mysia and a major Roman city of Asia. It was
    known for the Great Altar, the Asklepieion, and the province's first temple to Roma and
    Augustus. It is addressed in Rev 2:12-17 as the place 'where Satan's throne is'.
  passages:
    - "Rev 2:12-17 | setting | Message to Pergamum; the martyr Antipas"
    - "Rev 2:13 | concept? | 'Satan's throne': imperial temple, Great Altar, Asclepius cult, or Roman judicial seat"
    - "Rev 2:14 | practice | Eating food sacrificed to idols"
  related: [imperial-cult, temple-of-artemis-ephesus, laodicea, satan-the-adversary, corinth]
  wikipedia: Pergamon
  image: Pergamon acropolis Trajaneum
  author_notes:
    - "Survey the candidates for 'Satan's throne' neutrally. The provincial imperial temple (29 BCE; Tacitus, Ann. 4.37) and Pergamon's role as an administrative and judicial centre are most often favoured; the Altar of Zeus identification is popular but unprovable."
    - "The Great Altar is now in the Pergamonmuseum, Berlin."
    - "Pliny's story that parchment was invented at Pergamon (NH 13.70) is partly legendary."
  sources_to_check:
    - "W. Radt, Pergamon: Geschichte und Bauten einer antiken Metropole (1999)"
    - "H. Koester (ed.), Pergamon, Citadel of the Gods (HTS 46, 1998)"

- id: corinth
  cultures: [roman, greek]
  scope: >-
    Roman Corinth, refounded as a colony by Julius Caesar in 44 BCE a century after its
    destruction, capital of Achaia and controller of the Isthmus. The entry covers its
    archaeology and institutions as the setting of Paul's mission and correspondence.
  passages:
    - "Acts 18:1-18 | setting | Paul's eighteen-month stay; Aquila and Priscilla; trial before Gallio"
    - "Acts 18:12-17 | realia | The tribunal (bēma) in the forum"
    - "1Cor 8:10 | practice | Eating in an idol's temple; cf. dining rooms at the Asklepieion and the Demeter sanctuary"
    - "1Cor 10:25 | realia | Meat sold in the market (makellon), attested at Corinth as a macellum"
    - "1Cor 9:24-27 | practice | Athletic imagery; the Isthmian Games administered by Corinth"
    - "1Cor 11:17-34 | practice | Communal meals in private houses"
    - "Rom 16:1 | setting | Cenchreae, Corinth's eastern port"
    - "Rom 16:23 | attests? | Erastus the city treasurer"
  related: [gallio-inscription, erastus-inscription, imperial-cult, temple-of-artemis-ephesus, politarch-inscriptions]
  wikipedia: Ancient Corinth
  image: Ancient Corinth Temple of Apollo
  author_notes:
    - "Stress the Roman colonial character (Latin public inscriptions; freedmen settlers) after the destruction of 146 BCE and refoundation in 44 BCE."
    - "Correct the misconception of '1,000 sacred prostitutes'. Strabo 8.6.20 refers to the pre-146 city and is unreliable."
    - "Murphy-O'Connor's house-church reconstructions (e.g. the Anaploga villa) are illustrative, not evidential."
  sources_to_check:
    - "J. Murphy-O'Connor, St. Paul's Corinth: Texts and Archaeology (3rd ed., 2002)"
    - "J. H. Kent, Corinth VIII.3: The Inscriptions 1926-1950 (1966)"

- id: laodicea
  cultures: [greek, roman]
  scope: >-
    Laodicea on the Lycus in Phrygia, a prosperous city near Hierapolis and Colossae, known
    for banking, black wool, and a medical school. It appears in Colossians and is
    addressed in the last of the seven messages of Revelation.
  passages:
    - "Rev 3:14-22 | setting | Message to the church in Laodicea"
    - "Rev 3:15-16 | imagery | 'Neither cold nor hot'; cf. Hierapolis's hot springs, Colossae's cold water, and Laodicea's piped supply"
    - "Rev 3:17-18 | imagery | Wealth, clothing, and eye-salve, matching the city's banking, textiles, and medicine"
    - "Col 2:1 | setting | Paul's struggle for those in Laodicea"
    - "Col 4:13-16 | setting | Epaphras; Nympha's house church; the letter from Laodicea"
  related: [pergamon, temple-of-artemis-ephesus, imperial-cult, cisterns-and-water-systems]
  wikipedia: Laodicea on the Lycus
  image: Laodicea on the Lycus ruins
  author_notes:
    - "The city rebuilt itself without imperial aid after the earthquake of 60 CE (Tacitus, Ann. 14.27), which is relevant to Rev 3:17."
    - "The hot/cold/lukewarm water interpretation (Rudwick and Green) is popular but has been critiqued (e.g. C. Koester). Present it as one reading."
    - "Note the recent Turkish excavations under C. Şimşek."
  sources_to_check:
    - "C. J. Hemer, The Letters to the Seven Churches of Asia in Their Local Setting (1986)"
    - "C. R. Koester, 'The Message to Laodicea and the Problem of Its Local Context', NTS 49 (2003)"

- id: nabataeans
  cultures: [arabian]
  scope: >-
    The Arab people and kingdom centred on Petra, who controlled the incense routes from the
    Hellenistic period until Roman annexation in 106 CE. The entry gives particular
    attention to Aretas IV (9 BCE-40 CE) and to the Nabataeans' interactions with the
    Hasmoneans, the Herods, and Paul.
  passages:
    - "2Cor 11:32-33 | attests | The ethnarch of King Aretas guards Damascus; Paul escapes in a basket"
    - "Acts 9:23-25 | event | Paul's escape over the Damascus wall"
    - "Gal 1:17 | setting | Paul goes away into 'Arabia', i.e. Nabataean territory"
    - "Gal 4:25 | setting | 'Mount Sinai in Arabia'"
    - "Mark 6:17-18 | setting | Antipas's marriage to Herodias after divorcing Aretas's daughter (Ant. 18.109-115)"
    - "1Macc 5:25 | attests | Nabataeans meet Judas Maccabeus peaceably"
    - "2Macc 5:8 | attests | Aretas (I), 'ruler of the Arabs'"
  related: [petra-and-sela, qedarites-and-arabs, herod-the-great, edomites, damascus, incense-trade]
  wikipedia: Nabataeans
  image: Aretas IV Nabataean coin
  author_notes:
    - "Whether and how Aretas IV controlled Damascus c. 37-40 CE is debated (ethnarch as governor or as head of a Nabataean community). The gap in Roman civic coinage is suggestive but not decisive."
    - "Antipas's war with Aretas (36 CE) and its link to John the Baptist's death (Josephus) are relevant."
    - "Correct the misconception that the Nabataeans are the biblical Nebaioth (Gen 25:13). The names differ philologically."
    - "Note that Nabataean script is the ancestor of Arabic script."
  sources_to_check:
    - "J. F. Healey, The Religion of the Nabataeans: A Conspectus (2001)"
    - "G. W. Bowersock, Roman Arabia (1983)"

- id: jewish-sects
  cultures: [jewish]
  scope: >-
    The Jewish groups of the late Second Temple period: chiefly the Pharisees, Sadducees,
    and Essenes, along with Josephus's 'Fourth Philosophy'. The entry covers how they are
    presented in Josephus, the Dead Sea Scrolls, the New Testament, and rabbinic
    literature, and the methodological problems of reconstructing them.
  passages:
    - "Matt 3:7 | attests | Pharisees and Sadducees coming to John's baptism"
    - "Mark 7:1-13 | practice | Pharisaic 'tradition of the elders' and handwashing"
    - "Mark 12:18-27 | concept | Sadducees deny the resurrection"
    - "Acts 23:6-8 | concept | Sadducees deny resurrection, angels, and spirits; Pharisees affirm them"
    - "Acts 5:34 | attests | Gamaliel, a Pharisee and teacher of the law"
    - "Acts 15:5 | language | 'The sect (hairesis) of the Pharisees', Josephus's term for the schools"
    - "Phil 3:5 | attests | Paul: 'as to the law, a Pharisee'"
    - "Matt 23:1-36 | polemic | Woes against scribes and Pharisees; a polemical portrayal"
  related: [community-rule, josephus, dead-sea-scrolls, qumran, messianic-expectations, stone-vessels-and-mikvaot, afterlife-and-resurrection, synagogues]
  wikipedia: null
  image: null
  author_notes:
    - "Josephus frames the groups as Greek-style 'philosophies' (War 2.119-166; Ant. 13.171-173; 18.11-25). Account for this Hellenizing lens."
    - "The majority view identifies the Qumran yaḥad as Essene or Essene-related. Essenes also lived in towns (Philo, Josephus)."
    - "Avoid equating Pharisees with later rabbis, and avoid reading Matt 23 as neutral description. Sadducees are known almost only through hostile sources."
    - "Note that 'scribes' and 'Herodians' are not sects in the same sense."
  sources_to_check:
    - "A. J. Saldarini, Pharisees, Scribes and Sadducees in Palestinian Society (1988)"
    - "S. Mason, Flavius Josephus on the Pharisees (1991)"
    - "E. Schürer, G. Vermes, F. Millar, and M. Goodman, The History of the Jewish People in the Age of Jesus Christ, vol. 2 (1979)"

- id: messianic-expectations
  cultures: [jewish]
  scope: >-
    The varied hopes in Second Temple Judaism for anointed or agent figures of the end time:
    Davidic king, priestly messiah, eschatological prophet, and heavenly 'son of man'. The
    entry covers their scriptural roots and their expression in the Scrolls,
    Psalms of Solomon, Enoch, and the New Testament.
  passages:
    - "Ps 2:2, 7 | concept | The LORD's anointed as son, reread messianically (4QFlorilegium; Pss. Sol. 17)"
    - "2Sam 7:12-14 | concept | Dynastic promise read eschatologically in 4QFlorilegium"
    - "Isa 11:1-5 | concept | Davidic shoot who strikes the wicked with the breath of his lips (Pss. Sol. 17)"
    - "Zech 4:14 | concept | Two 'sons of oil', background for royal and priestly messiahs (1QS 9:11)"
    - "Num 24:17 | concept | Star from Jacob, read messianically (CD 7:18-21; 1QM 11:6-7)"
    - "Dan 7:13-14 | concept | One like a son of man, reinterpreted in the Similitudes and the Gospels"
    - "Matt 11:2-6 | concept | Signs of the Messiah: blind see, dead raised, good news to the poor (cf. 4Q521)"
    - "Luke 1:32-35 | parallel | 'Son of the Most High' and 'Son of God' language paralleled in 4Q246"
    - "John 1:19-25 | concept | Messiah, Elijah, and 'the prophet' as distinct expected figures"
    - "Mark 8:27-30 | concept | Peter's confession: 'You are the Messiah'"
  related: [community-rule, first-enoch, dead-sea-scrolls, king-as-son-of-god, jewish-sects, war-scroll, four-kingdoms-schema, josephus]
  wikipedia: Messiah in Judaism
  image: null
  author_notes:
    - "Stress diversity. There was no single 'Jewish messianic expectation', and many texts (e.g. much of Daniel, Jubilees, 1 Maccabees) have no messiah figure."
    - "In the Hebrew Bible, māšîaḥ usually refers to a reigning king or priest. Avoid reading later eschatological expectation back into it."
    - "Note Josephus's popular kings and sign-prophets (Judas, Simon, Athronges; Theudas; the Egyptian) as social expressions of hope."
  sources_to_check:
    - "J. J. Collins, The Scepter and the Star: Messianism in Light of the Dead Sea Scrolls (2nd ed., 2010)"

- id: first-jewish-revolt
  aliases: [First Jewish-Roman War, Great Revolt, Jewish War]
  cultures: [jewish, roman]
  date: [66, 74]
  scope: >-
    The Judean revolt against Rome from 66 CE to the fall of Masada in 73 or 74 CE: its
    causes and factions, Vespasian's campaign in Galilee, Titus's siege and the destruction of
    Jerusalem and the temple in 70, and its aftermath. It also covers the revolt's importance
    for dating and reading the Gospels. The Arch of Titus, the Judaea Capta coins, the revolt
    coinage and Masada have their own entries.
  passages:
    - "Mark 13:1-2 | event | Jesus foretells that no stone of the temple will be left on another"
    - "Mark 13:14-20 | event | The 'desolating sacrilege' and flight to the mountains"
    - "Luke 19:41-44 | event | Jerusalem encircled by a rampart and dashed to the ground"
    - "Luke 21:20-24 | event | Jerusalem surrounded by armies; its people taken captive among the nations"
    - "Matt 22:7 | event? | The king sends troops and burns the city, often read as reflecting 70 CE"
    - "Rev 11:1-2 | event? | The outer court and holy city trampled by the nations; its relation to 70 CE is debated"
    - "Dan 9:26-27 | concept | Destruction of city and sanctuary, applied by Josephus (Ant. 10.276) to the Romans"
    - "2Esd 10:21-23 | event | Lament for the sanctuary laid waste, written after 70 CE but set after 587 BCE"
  related: [josephus, masada, arch-of-titus, judaea-capta-coins, jewish-revolt-coinage, herods-temple, jewish-sects, messianic-expectations]
  wikipedia: First Jewish–Roman War
  image: Burnt House Jerusalem
  author_notes:
    - "Josephus's Jewish War is almost the only narrative source. He commanded rebel forces in Galilee, then served with Titus, so read him critically. Add Tacitus (Hist. 5.1-13), Cassius Dio, and archaeology: Gamla, Yodefat (Jotapata), Jerusalem (the Burnt House, the Herodian street with fallen Temple Mount stones), and Masada."
    - "Causes and factions: misgovernment under Florus, conflict at Caesarea, and the end of the sacrifice for the emperor (War 2.409-410). The factions included the Zealots, the Sicarii, John of Gischala and Simon bar Giora. Do not treat 'the Zealots' as a single movement existing long before 66."
    - "Timeline: Cestius Gallus defeated (66); Vespasian in Galilee (67); Titus's siege (spring to summer 70) and the burning of the temple in Ab; Masada (73 or 74)."
    - "For the NT, discuss whether Mark 13 and Luke 21:20-24 are prophecies after the event, and how far Luke's more specific siege language reflects 70. The usual dating of Mark around 70 and of Matthew and Luke later depends on this. The tradition of the Jerusalem church's flight to Pella (Eusebius, Hist. eccl. 3.5.3) is debated."
    - "Aftermath: the fiscus Iudaicus, the end of sacrificial worship, the rabbinic gathering at Yavneh, and the decline of the Sadducees."
  sources_to_check:
    - "H. St. J. Thackeray (trans.), Josephus: The Jewish War, 3 vols. (Loeb Classical Library, 1927-1928)"
    - "M. Goodman, The Ruling Class of Judaea: The Origins of the Jewish Revolt against Rome A.D. 66-70 (1987)"
    - "A. M. Berlin and J. A. Overman (eds.), The First Jewish Revolt: Archaeology, History, and Ideology (2002)"

- id: hasmoneans
  aliases: [Hasmonean Dynasty, Maccabees (dynasty), Hasmonaeans]
  cultures: [jewish, greek]
  date: [-152, -37]
  scope: >-
    The priestly family of Mattathias, which led the Maccabean revolt and then ruled Judea
    as high priests (from Jonathan in 152 BCE) and later as kings until Pompey's intervention
    in 63 BCE and the death of Antigonus in 37 BCE. The entry covers their rule, expansion,
    coinage and ideology, and the opposition they provoked. The revolt itself, to 160 BCE, is
    treated under maccabean-revolt.
  passages:
    - "1Macc 2:1-5 | attests | Mattathias, a priest of the family of Joarib, and his five sons"
    - "1Macc 8:17-32 | event | Judas's embassy to Rome and treaty of friendship"
    - "1Macc 10:18-21 | event | Alexander Balas makes Jonathan high priest; he dons the vestments at Tabernacles (152 BCE)"
    - "1Macc 13:41-42 | event | 'The yoke of the Gentiles was removed'; documents dated by Simon's years"
    - "1Macc 14:27-47 | event | Decree making Simon high priest, commander and ruler 'until a trustworthy prophet should arise'"
    - "1Macc 16:11-22 | event | Simon murdered at Dok; John Hyrcanus succeeds"
    - "Dan 11:34 | event? | 'A little help' for the persecuted, often read as a cool view of the Maccabees"
    - "John 4:20 | setting | Samaritan worship on Gerizim, whose temple John Hyrcanus destroyed"
  related: [maccabean-revolt, antiochus-iv, herod-the-great, jewish-sects, psalms-of-solomon, dead-sea-scrolls, samaritan-origins, coinage]
  wikipedia: Hasmonean dynasty
  image: Alexander Jannaeus prutah anchor star
  author_notes:
    - "The name 'Hasmonean' comes from Josephus (an ancestor Asamonaios) and rabbinic sources, not from 1-2 Maccabees. Rulers: Jonathan (high priest 152), Simon (142-135), John Hyrcanus I (135-104), Aristobulus I (104-103, the first to take the royal title according to Josephus), Alexander Jannaeus (103-76), Salome Alexandra (76-67), then Hyrcanus II and Aristobulus II, Pompey's conquest (63), and Antigonus (40-37)."
    - "Opposition: a non-Zadokite family held the high priesthood together with civil and later royal power. The Qumran 'Wicked Priest' is often identified with Jonathan or Simon (debated); the Pharisees opposed Jannaeus; Pss. Sol. 17 condemns the Hasmoneans for seizing David's throne. Pesher Nahum's 'Lion of Wrath' who hanged men alive is usually taken as Jannaeus, who crucified 800 opponents (Josephus, Ant. 13.380; verify)."
    - "Expansion: Idumea and Iturea were annexed and their people circumcised, and Samaria and the Gerizim temple were destroyed. Debate the forced-conversion reading and the date of the destruction (archaeology suggests c. 111-110 BCE). This expansion is the background to a Jewish Galilee in the NT period."
    - "1 Maccabees is dynastic history written in favour of the house of Simon. The Danielic 'little help' (Dan 11:34) is read by many as reserve toward the militants, but this is contested."
    - "Coins: Yehoḥanan the high priest and 'the council (ḥever) of the Jews'; Jannaeus's bilingual 'Yehonatan the king / Basileōs Alexandrou'. Who first minted is debated (see coinage)."
  sources_to_check:
    - "J. A. Goldstein, I Maccabees (AB 41, 1976)"
    - "E. Regev, The Hasmoneans: Ideology, Archaeology, Identity (2013)"
    - "K. Atkinson, A History of the Hasmonean State (2016)"

- id: herod-antipas
  aliases: [Antipas, Herod the Tetrarch]
  cultures: [jewish, roman]
  date: [-4, 39]
  scope: >-
    Herod Antipas, son of Herod the Great and Malthace, tetrarch of Galilee and Perea from
    4 BCE until Caligula exiled him in 39 CE. He executed John the Baptist and governed the
    Galilee of Jesus' ministry, rebuilt Sepphoris and founded Tiberias. The entry covers
    him as known from the Gospels, Josephus, coins and archaeology.
  passages:
    - "Mark 6:14-29 | event | 'King Herod' has John the Baptist beheaded at the request of Herodias's daughter"
    - "Luke 3:1 | attests | Herod tetrarch of Galilee in Tiberius's fifteenth year"
    - "Luke 3:19-20 | event | John rebukes Herod over Herodias and is imprisoned"
    - "Luke 8:3 | attests | Joanna, wife of Herod's steward Chuza, among Jesus' supporters"
    - "Luke 13:31-32 | attests | 'Go and tell that fox'"
    - "Luke 23:6-12 | event | Pilate sends Jesus to Herod; the two become friends"
    - "Acts 4:27 | attests | Herod and Pontius Pilate gathered against Jesus"
    - "Acts 13:1 | attests | Manaen, a member of Herod the tetrarch's court"
    - "John 6:23 | setting | Boats from Tiberias, Antipas's new capital"
    - "Matt 11:7-8 | imagery? | 'A reed shaken by the wind' and soft robes in royal palaces; the reed on Antipas's coins"
  related: [herod-the-great, josephus, pontius-pilate, nabataeans, capernaum, magdala-stone, galilee-boat, coinage]
  wikipedia: Herod Antipas
  image: Herod Antipas coin Tiberias reed
  author_notes:
    - "Mark calls him 'King Herod', a popular usage; Matthew and Luke correct this to 'tetrarch'. His request to Caligula for the royal title led to his exile (Josephus, Ant. 18.240-256)."
    - "Josephus (Ant. 18.116-119) says Antipas imprisoned John at Machaerus and executed him for fear of sedition, and that people saw Antipas's defeat by Aretas IV (whose daughter he had divorced to marry Herodias) as divine punishment. Compare the motives and details with Mark. Mark names Herodias's former husband Philip, while Josephus calls him Herod. Josephus, not the Gospels, names the daughter Salome."
    - "Coins: aniconic bronzes struck at Tiberias with a reed, palm branch or wreath and the legend 'of Herod the tetrarch'. Theissen's reading of Matt 11:7 in the light of the reed coin type is suggestive but not established."
    - "Building: Sepphoris rebuilt as 'the ornament of all Galilee', and Tiberias founded c. 19-20 CE partly over tombs (Ant. 18.36-38). How far his urbanization affected the Galilean village economy is debated."
    - "Luke 23:6-12 (Jesus before Antipas) is found only in Luke, and its historicity is debated."
  sources_to_check:
    - "H. W. Hoehner, Herod Antipas (SNTSMS 17, 1972)"
    - "M. H. Jensen, Herod Antipas in Galilee (WUNT 2/215, 2006)"

- id: pontius-pilate
  aliases: [Pilate, Pilatus]
  cultures: [roman]
  date: [26, 36]
  scope: >-
    Pontius Pilate, Roman prefect of Judea under Tiberius (c. 26-36 CE), who ordered the
    crucifixion of Jesus. The entry covers his governorship and portrayal in the Gospels,
    Philo, Josephus and Tacitus, his coinage, and later traditions. The Caesarea
    inscription naming him is treated under pilate-stone.
  passages:
    - "Mark 15:1-15 | event | Jesus handed over to Pilate; Barabbas released; Jesus sent to be crucified"
    - "Mark 15:42-45 | practice | Pilate releases Jesus' body to Joseph of Arimathea"
    - "Matt 27:11-26 | event | The trial with the wife's dream and the washing of hands"
    - "Luke 3:1 | attests | Pilate governor of Judea in Tiberius's fifteenth year"
    - "Luke 13:1 | event? | Galileans whose blood Pilate mingled with their sacrifices, not attested elsewhere"
    - "Luke 23:1-25 | event | Pilate three times declares Jesus innocent and sends him to Herod"
    - "John 18:28-19:16 | event | Interrogation at the praetorium; 'What is truth?'; judgement at Gabbatha"
    - "John 19:19-22 | practice | The title 'King of the Jews' in Hebrew, Latin and Greek"
    - "Acts 3:13 | attests | Pilate had decided to release Jesus"
    - "1Tim 6:13 | attests | Christ's testimony before Pontius Pilate"
  related: [pilate-stone, herod-antipas, caiaphas-ossuary, crucifixion, caesarea-maritima, josephus, imperial-cult, herods-temple]
  wikipedia: Pontius Pilate
  image: Pontius Pilate prutah lituus
  author_notes:
    - "Non-biblical sources: Philo, Legat. 299-305 (gilded shields in Herod's palace, with a hostile character sketch); Josephus, War 2.169-177 and Ant. 18.55-62 (military standards brought into Jerusalem; an aqueduct paid for from temple funds) and Ant. 18.85-89 (the Samaritans at Gerizim, which led to his recall by Vitellius); Tacitus, Ann. 15.44 (Christus executed by Pilate, called procurator)."
    - "His dates (c. 26-36/37) rest on Josephus's ten-year term and the recall before Tiberius's death. His title was prefect (see pilate-stone)."
    - "His bronze prutot (29-31 CE) bear the lituus and simpulum, Roman cultic implements. Whether these were deliberately provocative is debated."
    - "Avoid both caricatures, the vacillating weakling of popular reading and the monster of Philo. Assess him as an equestrian prefect with auxiliary troops, working with the high priest Caiaphas and subordinate to the legate of Syria. The Gospels increasingly exonerate him, a trend that later Christian tradition continues (in the Coptic and Ethiopian churches he is venerated as a saint)."
    - "The Passover amnesty (Mark 15:6) is not attested outside the Gospels, and Luke 13:1 is unconfirmed. Present both as debated."
  sources_to_check:
    - "H. K. Bond, Pontius Pilate in History and Interpretation (SNTSMS 100, 1998)"
    - "F. H. Colson (trans.), Philo, vol. 10: On the Embassy to Gaius (Loeb Classical Library, 1962)"

- id: damascus-document
  aliases: [CD, Zadokite Fragments, Damascus Rule, 4QD]
  cultures: [jewish]
  date: [-125, -75]
  circa: true
  scope: >-
    A sectarian work known from two medieval copies from the Cairo Genizah (CD-A and CD-B,
    published by Schechter in 1910) and from ten fragmentary Qumran manuscripts (4Q266-273,
    5Q12, 6Q15). It combines an Admonition, which tells the community's origins and
    interprets scripture, with Laws covering oaths, purity, the Sabbath, the organization of
    the 'camps' and a penal code. The date is that of composition; the copies range from the
    first century BCE to the twelfth century CE.
  passages:
    - "Num 21:18 | concept | The well dug with the staff read as the Law and its Interpreter (CD 6:3-11)"
    - "Amos 5:26-27 | concept | Sikkut and Kiyyun exiled 'beyond Damascus' reread as the books of the Law and the Prophets (CD 7:14-21)"
    - "Acts 7:42-43 | parallel | Stephen quotes Amos 5:25-27 with 'beyond Babylon', another reworking of the same text"
    - "Isa 24:17 | concept | 'Terror, pit and snare' read as Belial's three nets: fornication, wealth, defiling the sanctuary (CD 4:12-19)"
    - "Num 24:17 | concept | Star and sceptre read as the Interpreter of the Law and the Prince of the congregation (CD 7:18-21)"
    - "Ezek 44:15 | concept | Priests, Levites and sons of Zadok applied to the community's members (CD 3:21-4:4)"
    - "Mark 10:6-9 | parallel | Gen 1:27 used against divorce; CD 4:20-5:2 uses it against taking two wives"
    - "Exod 16:29 | practice | Basis for Sabbath limits: 1,000 cubits outside the town, 2,000 for grazing (CD 10:21; 11:5-6)"
    - "Jer 17:21-22 | practice | No carrying out of the house on the Sabbath (CD 11:7-9)"
    - "Isa 58:13 | practice | No talk of business or the next day's work on the Sabbath (CD 10:17-19)"
    - "Matt 12:11-12 | parallel | Sheep fallen into a pit; CD 11:13-14 forbids lifting an animal out on the Sabbath"
    - "Luke 14:5 | parallel | Child or ox fallen into a well on the Sabbath; contrast CD 11:13-14"
    - "Matt 18:15-17 | parallel | Graduated reproof before witnesses, as in CD 9:2-8 and 1QS 5:24-6:1"
  related: [dead-sea-scrolls, community-rule, sabbath, qumran, jewish-sects, messianic-expectations, sakkut-and-kaiwan, temple-scroll]
  wikipedia: Damascus Document
  image: Damascus Document Cairo Genizah
  author_notes:
    - "Manuscripts: Genizah MS A (10th century) and MS B (12th century), now in Cambridge University Library (verify shelfmarks). The Qumran copies (earliest 4Q266, first century BCE) show that the Genizah text is shortened and partly rearranged. They add the opening, laws on skin disease and other matters, a fuller penal code, and an expulsion ceremony. Use Baumgarten's DJD 18 edition and note the different column numbering systems."
    - "'Damascus' may be a literal place of exile or a code name (for Qumran, or for Babylon in Murphy-O'Connor's hypothesis); the question is debated. The 390 years and the 'twenty years' before the Teacher of Righteousness (CD 1:5-11) are schematic and should not be used for exact dating."
    - "CD addresses members living in 'camps' with wives and children, unlike the yaḥad of the Community Rule. A common view links this with Josephus's marrying Essenes (War 2.160-161), but the relationship between the two rules is complex and was revised over time."
    - "The Sabbath code (CD 10:14-11:18) is the fullest pre-rabbinic Sabbath halakhah. It starts the Sabbath while the sun is still above the horizon (CD 10:14-17) and is stricter than later rabbinic law on rescuing animals (contrast Matt 12:11; Luke 14:5). CD 11:16-17 on rescuing a person is textually difficult; compare 4Q265, which permits using a garment. Present these details precisely."
    - "Messianic language: 'the messiah of Aaron and Israel' (CD 12:23-13:1; 14:19; 19:10-11; 20:1) may mean one figure or two (cf. 1QS 9:11). The question is debated."
  sources_to_check:
    - "J. M. Baumgarten, Qumran Cave 4.XIII: The Damascus Document (4Q266-273) (DJD 18, 1996)"
    - "S. Schechter, Documents of Jewish Sectaries, vol. 1: Fragments of a Zadokite Work (1910)"
    - "M. Broshi (ed.), The Damascus Document Reconsidered (1992)"
    - "C. Hempel, The Damascus Texts (2000)"
    - "L. Doering, Schabbat: Sabbathalacha und -praxis im antiken Judentum und Urchristentum (TSAJ 78, 1999)"

- id: psalms-of-solomon
  aliases: [Pss. Sol.]
  cultures: [jewish]
  date: [-63, -30]
  circa: true
  scope: >-
    Eighteen psalms preserved in Greek and Syriac and probably composed in Hebrew in
    Jerusalem after Pompey's capture of the city in 63 BCE (Pompey's death in 48 BCE is
    alluded to in Psalm 2). They interpret the Roman conquest as judgement on Hasmonean and
    other 'sinners', and Psalms 17-18 portray a Davidic 'Lord Messiah' who will purge
    Jerusalem and rule in righteousness.
  passages:
    - "2Sam 7:12-16 | concept | God's oath that David's kingdom would not fail, invoked against the Hasmoneans (Pss. Sol. 17:4-6)"
    - "Ps 2:8-9 | parallel | Shattering sinners with an iron rod like a potter's vessel (Pss. Sol. 17:23-24)"
    - "Isa 11:2-4 | parallel | The king strikes the earth with the word of his mouth, wise and strong in the holy spirit (Pss. Sol. 17)"
    - "Isa 66:18-20 | parallel | Nations come to see the glory and bring Jerusalem's scattered children (Pss. Sol. 17:31)"
    - "Dan 12:2 | concept | The righteous rise to eternal life while sinners perish (Pss. Sol. 3:11-12)"
    - "Mark 10:47-48 | language | 'Son of David' as a messianic title, first clearly attested in Pss. Sol. 17:21"
    - "Luke 2:11 | language | 'Messiah, the Lord' (christos kyrios), as in Pss. Sol. 17:32"
  related: [messianic-expectations, hasmoneans, david, jewish-sects, royal-ideology, afterlife-and-resurrection, herods-temple, septuagint]
  wikipedia: Psalms of Solomon
  image: null
  author_notes:
    - "The text survives in medieval Greek manuscripts and in Syriac. It is listed in the table of contents of Codex Alexandrinus, but those pages are lost. A Hebrew original is likely. Verse numbering differs between Rahlfs and the Wright/OTP edition, so state which is used."
    - "Historical allusions: Pompey's siege and entry into the sanctuary (Pss. Sol. 2; 8; 17), his death on the Egyptian shore (2:26-27), and the Hasmoneans who 'laid waste the throne of David' (17:4-8). Whether the 'man alien to our race' (17:7) is Pompey or Herod affects the date."
    - "Provenance: the older attribution to Pharisees (Ryle and James; Wellhausen) is now held more cautiously. Essene authorship is a minority view. 'Pious circles in Jerusalem' is the safer description."
    - "The messiah is a human Davidic king who purges Jerusalem of Gentiles and sinners and rules by wisdom rather than 'horse and rider and bow' (17:33). The phrase christos kyrios (17:32; cf. 18:7) is sometimes emended to christos kyriou ('the Lord's anointed'); note the debate. This is key background for NT 'Son of David' and messianic language."
    - "The title 'of Solomon' is secondary, perhaps inspired by Ps 72."
  sources_to_check:
    - "R. B. Wright, The Psalms of Solomon: A Critical Edition of the Greek Text (2007)"
    - "R. B. Wright, 'Psalms of Solomon,' in J. H. Charlesworth (ed.), The Old Testament Pseudepigrapha, vol. 2 (1985)"
    - "K. Atkinson, I Cried to the Lord: A Study of the Psalms of Solomon's Historical Background and Social Setting (JSJSup 84, 2004)"

- id: ben-sira
  aliases: [Sirach, Ecclesiasticus, Ben Sirach]
  cultures: [jewish, greek]
  date: [-190, -175]
  circa: true
  scope: >-
    The wisdom book of Jesus (Yeshua) son of Eleazar son of Sira, written in Hebrew in
    Jerusalem in the early second century BCE and translated into Greek in Egypt by his
    grandson after 132 BCE. The entry covers its Hebrew manuscripts (Cairo Genizah, Masada,
    Qumran), its place among Proverbs and other ancient Near Eastern wisdom, its theology of
    Wisdom and Torah, and its canonical status. The date is that of composition.
  passages:
    - "Sir 24:1-23 | concept | Wisdom dwells in Israel and is identified with 'the book of the covenant' (24:23)"
    - "Prov 8:22-31 | parallel | Personified Wisdom created before the world, the model for Sir 24"
    - "Sir 38:24-39:11 | parallel | The scribe's leisure compared with the trades, like the Egyptian Satire of the Trades"
    - "Sir 44:1-50:24 | form | Praise of the ancestors, ending with the high priest Simon"
    - "Sir 50:1-21 | attests | Simon son of Onias (Simon II, c. 200 BCE) officiating in the temple"
    - "Mal 4:5-6 | concept | Sir 48:10 cites Elijah's return to turn the hearts of parents (MT 3:23-24)"
    - "Sir 51:23 | language | 'Lodge in my house of instruction' (Hebrew bêt midrāš)"
    - "Matt 11:28-30 | parallel | 'Come to me ... take my yoke', echoing Sir 51:23-27 and 6:24-30"
    - "Luke 12:16-21 | parallel | The rich fool who plans to enjoy his goods; cf. Sir 11:18-19"
    - "Jas 1:19 | parallel | 'Quick to listen, slow to speak'; cf. Sir 5:11"
  related: [ane-wisdom-literature, satire-of-the-trades, scribes-and-scribal-education, masada, septuagint, dead-sea-scrolls, medicine-and-healing]
  wikipedia: Book of Sirach
  image: Ben Sira scroll Masada
  author_notes:
    - "Hebrew text: six Genizah manuscripts (A-F, identified from 1896 onward), the Masada scroll (Sir 39:27-44:17, first century BCE), and Qumran fragments (2Q18 from Sir 6; 11QPs-a with Sir 51:13-20, 30b). About two thirds of the book survives in Hebrew. There are two Greek forms (GI and the expanded GII) and a Syriac version. Greek manuscripts transpose 30:25-33:13a and 33:13b-36:16a; English versions follow the Hebrew order, so check the numbering."
    - "Date: the grandson's prologue puts his arrival in Egypt in the 38th year of Euergetes (Ptolemy VIII), 132 BCE. The eulogy of Simon II and the absence of any reference to Antiochus IV's persecution place composition c. 190-175 BCE."
    - "Theology: Wisdom identified with Torah (24:23); retribution in this life without a blessed afterlife (17:27-28; 41:4); the scribe as ideal (38:34-39:11); devotion to temple and priesthood (Aaron, Phinehas, Simon). Sir 25:24 ('from a woman sin had its beginning') is usually read of Eve, though some argue otherwise. Present it, and Ben Sira's views on women, in context."
    - "Canon: cited in rabbinic literature though not canonized; deuterocanonical in Catholic and Orthodox Bibles and among the Apocrypha for Protestants. The Latin title Ecclesiasticus means 'church book'."
  sources_to_check:
    - "P. W. Skehan and A. A. Di Lella, The Wisdom of Ben Sira (AB 39, 1987)"
    - "P. C. Beentjes, The Book of Ben Sira in Hebrew (VTSup 68, 1997)"
    - "Y. Yadin, The Ben Sira Scroll from Masada (1965)"

- id: jewish-revolt-coinage
  aliases: [Shekel of Israel, First Revolt shekel, Bar Kokhba coins]
  cultures: [jewish]
  date: [66, 135]
  scope: >-
    The coins struck by Jewish authorities during the First Revolt (66-70 CE), chiefly
    silver shekels and half-shekels dated years 1-5 and bronze prutot, and during the Bar
    Kokhba revolt (132-135 CE), struck over Roman coins. Both series use paleo-Hebrew
    legends and temple-related imagery as statements of independence. Roman victory coinage
    is treated under judaea-capta-coins and the Tyrian shekel separately.
  passages:
    - "Exod 30:13 | language | 'Half a shekel by the sanctuary shekel'; cf. the legends 'shekel of Israel' and 'half shekel'"
    - "Exod 30:13-16 | practice? | Revolt shekels perhaps minted for temple dues in place of Tyrian coins"
    - "Isa 52:1 | language | 'Jerusalem, the holy city'; cf. the shekel legend 'Jerusalem the holy'"
    - "Lev 23:40 | realia | Lulav and etrog of Sukkot on year-four bronzes and Bar Kokhba coins"
    - "Num 10:2 | realia | Silver trumpets, depicted on Bar Kokhba coins"
    - "Num 24:17 | concept | 'A star out of Jacob' applied to Bar Kosiba; a star above the temple facade on some tetradrachms"
    - "1Macc 15:6 | practice | The right to mint coins as a mark of sovereignty"
  related: [first-jewish-revolt, coinage, tyrian-shekel, judaea-capta-coins, paleo-hebrew-script, herods-temple, masada, messianic-expectations]
  wikipedia: First Jewish Revolt coinage
  image: First Jewish Revolt shekel year 2
  author_notes:
    - "First Revolt silver: shekels and half-shekels (rare quarters) of high-quality silver, dated year 1 to year 5 (the year-5 issue is very rare). They have a chalice with 'shekel of Israel' and a stem with three pomegranates with 'Jerusalem the holy'. They were probably minted in Jerusalem under temple authority. Whether the chalice and pomegranates refer to temple vessels or Aaron's rod is speculative."
    - "First Revolt bronzes: year 2-3 prutot with amphora and vine leaf and the legend 'freedom of Zion' (ḥērût ṣîyôn). The larger year-4 bronzes have lulav and etrog and the legend 'for the redemption of Zion'."
    - "Bar Kokhba coins were struck over Roman denarii and tetradrachms. Legends include 'Simon', 'Simon prince of Israel', 'Eleazar the priest', 'year one of the redemption of Israel' and 'for the freedom of Jerusalem'. Types include a temple facade (with an object inside variously read as the ark or the showbread table), lulav, trumpets, lyres and jugs. See Mildenberg."
    - "The paleo-Hebrew script was by then an archaizing national symbol, already used on Hasmonean coins. Mention that forgeries of revolt coins are common on the market."
    - "Link to judaea-capta-coins for the Roman answer to these claims of freedom, and to tyrian-shekel for the temple-tax standard they replaced."
  sources_to_check:
    - "Y. Meshorer, A Treasury of Jewish Coins (2001)"
    - "D. Hendin, Guide to Biblical Coins (5th ed., 2010)"
    - "L. Mildenberg, The Coinage of the Bar Kokhba War (1984)"

- id: tyrian-shekel
  aliases: [Tyrian tetradrachm, Shekel of Tyre, Didrachm (half-shekel)]
  cultures: [phoenician, jewish]
  date: [-126, 66]
  scope: >-
    The silver shekels (tetradrachms) and half-shekels minted at Tyre from 126/125 BCE to
    the mid-60s CE, with the head of Melqart-Herakles and an eagle. Because of their
    reliable weight and purity they were required for the temple tax in late Second Temple
    Jerusalem. The entry covers the coin, the half-shekel tax and the money changers;
    coinage in general is treated under coinage.
  passages:
    - "Exod 30:11-16 | practice | Half-shekel 'by the shekel of the sanctuary' as ransom at the census, the basis of the later annual tax"
    - "2Chr 24:6-9 | practice | The tax of Moses collected for the house of God"
    - "Neh 10:32 | practice | A third of a shekel yearly for the service of the temple (MT 10:33)"
    - "Matt 17:24-27 | practice | Collectors of the didrachma; a stater (one shekel) pays for Jesus and Peter"
    - "Matt 21:12 | practice | Money changers' tables overturned in the temple"
    - "Mark 11:15-17 | practice | Money changers and dove sellers driven out"
    - "John 2:13-16 | practice | Money changers in the temple at Passover"
    - "Matt 26:15; 27:3-10 | realia? | Thirty pieces of silver, perhaps Tyrian shekels, returned to the temple treasury"
  related: [coinage, melqart, tyre, jewish-revolt-coinage, herods-temple, weights-and-silver-money]
  wikipedia: Tyrian shekel
  image: Tyrian shekel Melqart eagle
  author_notes:
    - "Describe the coin: obverse laureate head of Melqart (Herakles), reverse eagle with the legend 'of Tyre the holy and inviolable'; dated by the Tyrian era from 126/125 BCE. Meshorer argued that from c. 18 BCE cruder 'KP/KAP' shekels were struck in Jerusalem under Herod's authority. That is a hypothesis and is debated."
    - "Temple tax: rabbinic texts specify Tyrian currency for sanctuary payments (e.g. m. Bekhorot 8:7), probably for its weight and purity despite the pagan image. Money changers set up tables in the provinces on 15 Adar and in the temple on 25 Adar (m. Sheqalim 1:3) and charged an agio (qolbon)."
    - "The annual half-shekel tax is a Second Temple development out of the one-time ransom of Exod 30 and the third-shekel of Neh 10:32. 4Q159 (Ordinances) appears to limit the half-shekel to once in a lifetime, which shows that the practice was disputed."
    - "Matt 17:24-27: the didrachma (half-shekel) paid by each man, and the stater (tetradrachm) paying for two. After 70 the tax was diverted to the fiscus Iudaicus, which may affect how Matthew's readers heard the story."
    - "The identification of the 'thirty pieces of silver' with Tyrian shekels is plausible but cannot be proved."
  sources_to_check:
    - "Y. Meshorer, A Treasury of Jewish Coins (2001)"
    - "D. Hendin, Guide to Biblical Coins (5th ed., 2010)"

- id: baptism
  aliases: [Immersion, John's baptism, Proselyte baptism]
  cultures: [jewish, christian]
  scope: >-
    Ritual immersion in water as practised by John the Baptist and the early Christian
    movement, set against its background in biblical purification law and Second Temple
    Jewish washing rites (miqvaʾot, Qumran, proselyte immersion). The entry covers the
    New Testament period; later liturgical development and the infant-baptism debate are
    mentioned only briefly.
  passages:
    - "Mark 1:4-11 | practice | John's 'baptism of repentance' in the Jordan; Jesus baptized by John"
    - "Luke 3:7-16 | practice | John's ethical demands on those coming for baptism; water contrasted with Spirit and fire"
    - "John 3:22-4:2 | practice | John and Jesus' disciples baptizing side by side; dispute 'about purification'"
    - "Lev 15:5-13 | practice | Bathing in water to end impurity, the basis of later Jewish immersion"
    - "2Kgs 5:10-14 | language | Naaman dips seven times in the Jordan; LXX renders the verb ebaptisato"
    - "Ezek 36:25-27 | imagery | Eschatological cleansing with water joined to the gift of a new spirit"
    - "Mark 7:3-4 | language | baptizō/baptismos used for Jewish washings of persons and vessels"
    - "Acts 2:38-41 | practice | Baptism 'in the name of Jesus Christ' for forgiveness, with the gift of the Spirit"
    - "Acts 19:1-7 | practice | Disciples who knew only 'John's baptism' are baptized in the name of Jesus"
    - "Rom 6:3-4 | concept | Baptism as burial with Christ into death and rising to new life"
  related: [stone-vessels-and-mikvaot, purity-and-impurity, qumran, community-rule, jewish-sects, josephus, herod-antipas, circumcision]
  wikipedia: Baptism
  image: null
  author_notes:
    - "Greek baptō/baptizō means 'dip, immerse'. Note its LXX and Jewish uses (2 Kgs 5:14; Jdt 12:7; Sir 34:25 [31:30], numbering to verify) and the NT washings in Mark 7:4 and Luke 11:38. Whether early Christian baptism was always full immersion is debated: Didache 7 allows pouring when running or cold water is lacking."
    - "Contrast John's rite with Jewish purification. Jewish immersions were repeated and self-administered. John's was apparently once only, administered by him ('baptized by him'), and tied to repentance and coming judgment. Josephus (Ant. 18.116-119) says John's baptism did not remit sins but consecrated the body once the soul was purified by righteousness. Present this tension with Mark 1:4 neutrally."
    - "Qumran: 1QS 3:4-9 and 5:13-14 link washing to repentance and the holy spirit, and ritual baths are found at the site. The view that John had Essene connections is possible but unproven. Do not present it as established."
    - "Proselyte immersion is clearly attested only in rabbinic sources (e.g. m. Pesaḥ. 8:8; b. Yebam. 46a-47b), with a possible earlier allusion in Epictetus (Arrian, Diss. 2.9.20). Whether it existed before 70 CE is debated, so it should not be presented as the source of John's baptism."
    - "The older history-of-religions derivation of Pauline baptism (Rom 6) from mystery-cult initiation (e.g. Isis in Apuleius, Met. 11) is now widely rejected or heavily qualified. Mention Matt 28:19's triadic formula beside the 'name of Jesus' formula in Acts, and give the household baptisms (Acts 16:15, 33) only as the point where the infant-baptism debate begins."
  sources_to_check:
    - "Josephus, Antiquities 18.116-119"
    - "1QS (Community Rule) 3:4-9; 5:13-14"
    - "Didache 7"
    - "J. E. Taylor, The Immerser: John the Baptist within Second Temple Judaism (1997)"
    - "R. L. Webb, John the Baptizer and Prophet: A Socio-Historical Study (JSNTSup 62, 1991)"
    - "J. D. Lawrence, Washing in Water: Trajectories of Ritual Bathing in the Hebrew Bible and Second Temple Literature (2006)"
    - "A. J. M. Wedderburn, Baptism and Resurrection: Studies in Pauline Theology against Its Graeco-Roman Background (WUNT 44, 1987)"
    - "E. Ferguson, Baptism in the Early Church: History, Theology, and Liturgy in the First Five Centuries (2009)"

- id: patronage-and-benefaction
  cultures: [greek, roman, jewish]
  scope: >-
    Patronage, civic benefaction, and reciprocal gift exchange organized relationships of
    support, obligation, gratitude, and honor in Jewish and Greco-Roman communities. The entry
    supplies the social framework for gifts, support, obligation, and public honor across the
    Gospels and Paul.
  passages:
    - "Luke 7:1-5 | practice | Synagogue benefaction and local intermediaries frame the elders' appeal on behalf of the centurion"
    - "Luke 14:12-14 | practice | Invitations to people unable to repay challenge ordinary expectations of reciprocal hospitality"
    - "Luke 22:25-27 | language | The title 'benefactors' belongs to the public language of power, service, and honor"
    - "Rom 16:1-2 | language | Phoebe's designation as prostatis is illuminated by benefaction and protective support"
    - "1Cor 9:1-18 | practice | Paul's entitlement to support and refusal to use it intersect with conventions of obligation and reciprocity"
    - "Phil 4:10-20 | practice | Gifts, partnership, and acknowledgment are interpreted against ancient expectations of reciprocity"
  related: [berenike-judean-benefactor-decree, thyatira-dyers-claudia-ammion, meals-and-banqueting, greco-roman-associations, lysanias-abila-inscriptions, erastus-inscription, hospitality]
  wikipedia: Patronage in ancient Rome
  image: null
  author_notes:
    - Distinguish personal patronage, civic benefaction, friendship, and gift reciprocity instead of treating them as one uniform system.
    - Phoebe's precise social and legal position remains debated. Do not infer a formal Roman patron-client relationship solely from the term prostatis.
    - Do not claim that every Pauline use of charis has one fixed patronage meaning.
    - Existing coverage to cross-reference rather than repeat. The Erastus Inscription is one example of civic expenditure; Hospitality covers receiving and protecting guests, guest-friendship, and divine visitors.
    - "Optional enrichment (report P01): the Abila dedication of Nymphaeus, freedman of Lysanias, publicizes expenditure on a road, temple, and plantings. It does not give him the title euergetēs, and his freed status does not reconstruct every obligation to Lysanias."
  sources_to_check:
    - Seneca, De beneficiis
    - IBerenike 18 = CJZC 70 = AGRW 305
    - Revue Biblique 9.4 (1912), pp. 533-540, inscription A, lines 3-4 (Abila)

- id: meals-and-banqueting
  cultures: [jewish, greek, roman]
  scope: >-
    Jewish and Greco-Roman meals expressed social relationships through invitations, reclining
    arrangements, service, food distribution, and the religious settings of communal eating.
    The entry is a comparative hub for the social organization of meals; food production and
    diet belong to Bread, Ovens, and Diet.
  passages:
    - "Luke 14:7-14 | practice | Seating rank, invitations, and expected repayment make dining a setting for negotiating status"
    - "John 13:1-30 | realia | Reclining positions and footwashing clarify the meal's physical setting and acts of service"
    - "1Cor 8:7-13 | practice | Eating in a deity's sanctuary connects communal dining with participation in cult"
    - "1Cor 10:14-33 | practice | Sacrificial meals, marketplace purchases, and private invitations present distinct dining situations"
    - "1Cor 11:17-34 | practice | Unequal consumption and status distinctions at shared meals provide background for Paul's criticism"
    - "Gal 2:11-14 | practice | Shared eating and withdrawal from it publicly express community boundaries"
  related: [patronage-and-benefaction, greco-roman-associations, tebtynis-salt-merchants-papyrus, sarapis-dinner-invitation, corinth, bread-and-diet, hospitality, marzeah]
  wikipedia: Symposium
  image: Roman banquet fresco Pompeii triclinium
  author_notes:
    - Distinguish Jewish meals, Greek symposia, Roman convivia, and association gatherings by period, region, and social level. Do not infer that every communal meal had the same layout or ritual meaning.
    - The Anaploga villa at Corinth is a proposed architectural comparison, not an identified Pauline meeting house.
    - "P.Oxy. I 110 is later (second-century CE) Egyptian evidence for a cult meal. It asks its recipient to dine at the klinē ('couch') of Sarapis, whereas Paul uses trapeza ('table') in 1 Cor 10:21, so the two texts do not share a table formula. It identifies no guild or Corinthian event, and it does not make every private meal in 1 Cor 10:27-28 a sanctuary meal."
    - Corinth already discusses sanctuary dining and unequal consumption in 1 Corinthians; Marzeaḥ is a specific West Semitic feasting association. Cross-reference both without repeating them.
  sources_to_check:
    - Pliny the Younger, Epistulae 2.6
    - P.Mich. V 245 = GRA III 219 = AGRW 302 (Ann Arbor inv. 657)
    - IG II² 1368 = LSCG 51 = GRA 51 = AGRW 7
    - P.Oxy. I 110, lines 1-4 (HGV/TM 28404; Eton College ECM 2314)
    - Metropolitan Museum of Art survey of Roman domestic dining rooms, furnishings, and tableware

- id: greco-roman-associations
  cultures: [greek, roman]
  scope: >-
    Greco-Roman associations organized people around occupations, cults, origins, and social
    ties through officers, contributions, gatherings, meals, mutual obligations, and
    commemorative practices. The entry treats the institution across the Mediterranean;
