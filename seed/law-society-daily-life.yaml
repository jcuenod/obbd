  author_notes:
    - "The Merneptah Stele (ca. 1208 BCE) is the earliest attestation of 'Israel', written with the determinative for a people, in Canaan."
    - "Present the models. They are Albright's unified conquest, Alt and Noth's peaceful infiltration, the Mendenhall-Gottwald peasant revolt, and indigenous emergence or ethnogenesis (Finkelstein, Dever, Faust, Killebrew). Current consensus favours a largely indigenous origin with diverse elements, including some groups from outside Canaan."
