    - "Judg 1:19, 21, 27-35 | event | Incomplete, piecemeal occupation with Canaanite enclaves"
    - "Judg 5:14-18 | setting | Tribal coalition in the Song of Deborah"
    - "Josh 24:1-28 | concept | Shechem assembly; ancestors 'served other gods'"
