    - "Num 5:11-31 | practice | Ritual for a wife suspected of adultery without witnesses"
    - "Gen 38:24 | practice | Judah orders Tamar burned for apparent unchastity"
    - "2Sam 13:1-22 | practice | Amnon's rape of Tamar; her plea that the king would permit marriage (13:13)"
