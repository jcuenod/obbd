  wikipedia: null
  image: null
  author_notes:
    - "Comparative law: Hammurabi §§6-25 (theft from temple or palace is capital; §8 sets thirtyfold or tenfold restitution or death; §§21-22 breaking in and robbery) and §§120-126 (deposits, with double restitution for denial). Hittite Laws §§57-70 set multiple compensation for stolen animals and record that penalties had been reduced. Biblical law has no death penalty for theft of ordinary property. Greenberg's argument that this reflects a different hierarchy of values is influential but debated."
    - "The day/night distinction for a burglar (Exod 22:2-3) has a close parallel in Laws of Eshnunna §§12-13. Explain that in Exod 22:1-4 (MT 21:37-22:3) the verses about the burglar appear to interrupt the restitution rule."
