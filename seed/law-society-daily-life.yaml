  related: [olive-oil-production, menorah, tabernacle, four-room-house, millstones-and-grinding, david]
  wikipedia: Oil lamp
  image: Iron Age oil lamp
  author_notes:
    - "Give the typology. Bronze and Iron Age lamps are open saucers with a pinched spout, and Iron II lamps often have a thick disc base. Hellenistic lamps are closed and mould-made. Late Second Temple Judea has wheel-made 'Herodian' (knife-pared) lamps. Mention lamp-and-bowl foundation deposits."
    - "Multi-spouted (seven-spouted) lamps occur in cultic contexts and illuminate Zech 4:2."
    - "The 'lamp' (nîr) for David (1 Kgs 11:36; 15:4; 2 Kgs 8:19) has been reinterpreted as 'dominion' or 'yoke' (P. D. Hanson, 1968). Present both readings."
    - "The lampades of Matt 25 may be torches rather than clay lamps. Note this as a debated point."

