  related: [sheba, qedarites-and-arabs, camels-and-domestication, incense-and-incense-altars, nabataeans, arad, roads-and-highways]
  wikipedia: Incense trade route
  image: Incense Route Avdat
  author_notes:
    - "The overland trade depended on camel domestication and grew from the 8th century. Tiglath-pileser III received tribute from Samsi, queen of the Arabs, and from Sabaeans, and Sargon II received tribute from the Sabaean Itʾamra. The Nabataeans controlled the route in Hellenistic-Roman times."
    - "The earliest Sabaean royal inscriptions are usually dated to the 8th century. Be careful in using the Queen of Sheba story as 10th-century evidence."
    - "Residue analysis of the Arad shrine's incense altars (published 2020) identified frankincense on one and cannabis on the other. This is direct evidence of imported aromatics in Judah. South Arabian inscribed sherds from Iron Age Jerusalem also attest contacts."

