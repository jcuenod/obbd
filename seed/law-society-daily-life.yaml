- id: iron-technology
  aliases: [Philistine iron monopoly, Iron Age metallurgy]
  cultures: [hebrew, philistine, canaanite]
  scope: >-
    The introduction and spread of iron-working in the Levant at the transition from the
    Late Bronze to the Iron Age, and the biblical texts often read as evidence of a
    Philistine monopoly on iron.
  passages:
    - "1Sam 13:19-22 | practice | No smith in Israel; tools sharpened by Philistines"
    - "1Sam 13:21 | language | Charge of a pim (two-thirds shekel), confirmed by inscribed pim weights"
    - "Deut 8:9 | realia | 'A land whose stones are iron'"
    - "Josh 17:16-18 | realia | Canaanites of the valleys have iron chariots"
    - "Judg 1:19 | realia | Judah cannot dislodge plain-dwellers with iron chariots"
    - "Gen 4:22 | concept | Tubal-cain, forger of bronze and iron implements"
    - "Deut 3:11 | realia? | Og's 'iron' bed, perhaps a basalt sarcophagus"
    - "Deut 4:20 | imagery | Egypt as an 'iron-smelter' (kûr habbarzel)"
    - "2Sam 12:31 | realia | Ammonites set to work with iron picks and axes (sense debated)"
  related: [pim-weights, philistines, weapons, copper-production, chariots-and-horses, rephaim]
  wikipedia: Ferrous metallurgy
  image: null
  author_notes:
    - "The 'Philistine iron monopoly' (G. E. Wright, Albright) is not supported by archaeology. Iron-working spread gradually across the Levant from the 12th to 10th centuries, and Philistine sites show no early dominance. Present 1 Sam 13:19-22 as a claim about control of smithing or as a literary motif."
    - "The related myth of a Hittite iron monopoly should also be corrected."
    - "Iron becomes the dominant metal for tools and weapons only in Iron IIA (10th-9th centuries). Carburisation into steel appears gradually. Mention excavated smelting and smithing sites (e.g., Tell Hammeh in the Jordan Valley)."
    - "The pim weight finds settled the reading of 1 Sam 13:21. This is a good example of epigraphy clarifying an obscure Hebrew word."
  sources_to_check:
    - "Waldbaum, From Bronze to Iron (1978)"

