  related: [pim-weights, coinage, sealed-deeds, land-redemption, ostraca]
  wikipedia: Shekel
  image: Hacksilber hoard
  author_notes:
    - "Hacksilber (cut silver, often bagged and sealed) hoards are known from Bronze and Iron Age sites (e.g., Eshtemoa, Dor, ʿEin Ḥofez). Lead-isotope studies trace silver sources to the Aegean, Anatolia, Sardinia, and Iberia."
    - "Judahite inscribed weights (late 8th-7th centuries) use a shekel of about 11.3-11.4 g, with hieratic numerals and the signs nṣp, pym, and bqʿ (Kletter). Biblical 'sanctuary' and 'king's' weights suggest more than one standard."
    - "Translations that render kesep as 'money' or 'coins' in pre-Persian contexts are anachronistic. Address this explicitly."
  sources_to_check:
