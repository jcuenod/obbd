- id: household-and-kinship
  aliases: [Bêt ʾāb, Father's House, Mišpāḥâ, Clan, Tribe]
  cultures: [hebrew]
  scope: >-
    The nested kinship structure of ancient Israelite society: the household or 'father's
    house' (bêt ʾāb), the clan or kin group (mišpāḥâ), and the tribe (šēbeṭ, maṭṭeh), with
    their economic, legal and religious functions and the 'patrimonial household' model of
    Israelite society and kingship. House architecture, inheritance, levirate and marriage
    are treated in their own entries.
  passages:
    - "Josh 7:14-18 | practice | Lot narrows from tribe to clan to household to individual"
    - "1Sam 10:20-21 | practice | Saul chosen by lot through tribe, clan and individual"
    - "Num 1:2 | practice | Census 'by their clans, by their ancestral houses'"
    - "Exod 12:3 | practice | A Passover lamb for each father's house, a lamb for each household"
    - "1Sam 20:6, 29 | practice | Yearly sacrifice of David's clan at Bethlehem"
    - "Judg 17:1-13 | practice | Micah's household shrine, ephod and teraphim, with a hired Levite"
    - "Judg 18:19 | practice | The Levite offered a post as priest to a tribe and clan rather than one household"
    - "Ruth 1:8 | language | 'Return to your mother's house' (bêt ʾēm)"
    - "Ruth 2:1, 20 | practice | Boaz, a kinsman of Elimelech's clan and one of the family's redeemers"
    - "Num 27:1-11 | practice | Zelophehad's daughters keep their father's name and land within the clan"
    - "Mic 7:6 | concept | Household members as enemies: the breakdown of kin solidarity"
    - "Matt 10:34-37 | concept | Jesus' saying about divided households, quoting Mic 7:6"
  related: [four-room-house, inheritance-and-birthright, land-redemption, levirate-marriage, genealogies, marriage-and-bride-price, teraphim, care-for-the-dead]
  wikipedia: null
  image: null
  author_notes:
    - "The terms are fluid. Bêt ʾāb can mean a residential extended family or a wider lineage. Mišpāḥâ is often translated 'clan' but sometimes means a larger kin group. Šēbeṭ and maṭṭeh both mean 'tribe'. The three-tier hierarchy of Josh 7:14-18 is partly schematic."
    - "Archaeology: Stager's study of clusters of pillared houses as compounds for extended families (BASOR 260, 1985). Schloen extends the household model to the state, with the king as head of a patrimonial household. Engage both."
    - "Women and the household: C. Meyers on the household economy and on the 'mother's house' (Gen 24:28; Ruth 1:8; Song 3:4; 8:2). Use this work rather than a simple model of 'patriarchy'."
    - "Household religion (teraphim, ancestor rites, household shrines) is a distinct layer of practice. See Albertz and Schmitt."
    - "Avoid assuming that tribes were purely genealogical. Many scholars see them as territorial or political groups expressed in kinship language (cf. segmentary lineage models)."
  sources_to_check:
    - "L. E. Stager, 'The Archaeology of the Family in Ancient Israel,' BASOR 260 (1985)"
    - "J. D. Schloen, The House of the Father as Fact and Symbol: Patrimonialism in Ugarit and the Ancient Near East (2001)"
    - "R. Albertz and R. Schmitt, Family and Household Religion in Ancient Israel and the Levant (2012)"
    - "C. Meyers, Rediscovering Eve: Ancient Israelite Women in Context (2013)"

- id: pastoralism-and-herding
  aliases: [Shepherding, Nomadism, Transhumance, Sheep and Goats]
  cultures: [hebrew, amorite, ane]
  scope: >-
    Sheep and goat herding (and to a lesser extent cattle) in the southern Levant and the
    wider Near East: village-based herding, seasonal transhumance and mobile pastoralism,
    the work and liability of the herdsman, and the place of herding in biblical narrative
    and law. Royal and divine shepherd imagery is treated under shepherd-kingship and camel
    nomadism under camels-and-domestication.
  passages:
    - "Gen 4:2 | practice | Abel a keeper of sheep, Cain a tiller of the ground"
    - "Gen 13:2-12 | practice | Abram and Lot separate because the land cannot support both herds"
    - "Gen 29:1-10 | practice | Flocks gathered at a well covered by a stone"
    - "Gen 30:25-43 | practice | Jacob's wages from the flock; breeding of speckled and dark animals"
    - "Gen 31:38-40 | practice | The herdsman bears losses to predators and theft; heat by day, frost by night"
    - "Gen 37:12-17 | practice | The brothers move the flocks from Hebron to Shechem and Dothan"
    - "Exod 22:10-13 | practice | A herdsman cleared by oath; a mauled animal brought as evidence (MT 22:9-12)"
    - "1Sam 17:34-35 | practice | The shepherd defends the flock against lion and bear"
    - "1Sam 25:2-8 | practice | Sheep-shearing at Carmel as a festive occasion"
    - "2Kgs 3:4 | language | Mesha of Moab a sheep-breeder (nōqēd) paying lambs and wool as tribute"
    - "Amos 1:1; 7:14-15 | language | Amos among the nōqĕdîm of Tekoa, a herdsman taken from the flock"
    - "Amos 3:12 | practice | A shepherd rescues two legs or an ear from a lion as proof of loss"
    - "Luke 2:8 | practice | Shepherds watching their flock by night"
  related: [shepherd-kingship, camels-and-domestication, shasu, midianites-and-kenites, agriculture-and-farming, textiles-and-weaving, emergence-of-israel, mari-letters]
  wikipedia: Pastoralism
  image: null
  author_notes:
    - "Most herding in Iron Age Israel was part of a mixed farming economy: small flocks kept by villages and grazed seasonally nearby. Long-range, camel-based Bedouin nomadism is later. Correct the older romantic picture of the patriarchs as desert Bedouin."
    - "Use Mari and anthropology for mobile pastoralism. The Mari archives describe tribal groups (the Binu Yamina and others) moving between settlement and steppe. Rowton's 'dimorphic society' and later work on pastoral-sedentary interdependence apply here. This feeds the debate on whether early Israel emerged partly from sedentarizing pastoralists (Finkelstein)."
    - "Herding law: Hammurabi §§261-267 regulate hired herdsmen and losses. Exod 22:10-13, Gen 31:39 and Amos 3:12 share the rule that a herdsman clears himself by producing the remains of an animal killed by a predator."
    - "Nōqēd (Amos 1:1; 2 Kgs 3:4; Ugaritic nqdm) may denote a manager or owner of flocks rather than a poor herdsman. Its implications for Amos's social status are debated."
    - "Faunal remains show sheep and goats dominate, with cattle for traction. Note the secondary products: milk, wool and hair."
  sources_to_check:
    - "O. Borowski, Every Living Thing: Daily Use of Animals in Ancient Israel (1998)"
    - "P. J. King and L. E. Stager, Life in Biblical Israel (2001)"
    - "M. B. Rowton, 'Dimorphic Structure and the Parasocial Element,' JNES 36 (1977)"

- id: bread-and-diet
  aliases: [Baking, Ovens, Tannur, Tabun, Food]
  cultures: [hebrew]
  scope: >-
    Bread-making and everyday diet in ancient Israel: kneading, leavening and baking on
    hot stones, griddles and clay ovens (tannûr), professional bakers, and a diet based on
    cereals, legumes, olive oil, wine and fruit, with meat eaten mainly on special
    occasions. Grinding is treated under millstones-and-grinding, and food laws under
    pig-avoidance and related entries.
  passages:
    - "Gen 18:6 | realia | Three measures of fine flour kneaded into cakes for guests"
    - "Exod 12:34, 39 | realia | Dough carried in kneading bowls; unleavened cakes baked on the way"
    - "Lev 2:4-7 | realia | Grain offerings baked in an oven, on a griddle, or in a pan"
    - "Lev 26:26 | practice | Ten women baking in a single oven; bread rationed by weight"
    - "1Sam 8:13 | practice | The king will take daughters as perfumers, cooks and bakers"
    - "2Sam 17:27-29 | practice | Provisions for David: wheat, barley, parched grain, beans, lentils, honey, curds, cheese"
    - "1Kgs 19:6 | realia | A cake baked on hot stones beside Elijah"
    - "Ruth 2:14 | practice | Bread dipped in sour wine and parched grain at the harvest meal"
    - "Hos 7:4-7 | imagery | Conspirators like a heated oven whose baker rests while the dough rises"
    - "Jer 37:21 | practice | Jeremiah given a loaf a day from the bakers' street"
    - "Ezek 4:9-15 | practice | Siege bread of mixed grains and legumes, rationed and baked over dung"
    - "Matt 13:33 | realia | Leaven mixed into three measures of flour"
  related: [millstones-and-grinding, agriculture-and-farming, olive-oil-production, winepresses, four-room-house, pig-avoidance, passover-origins, hospitality]
  wikipedia: Ancient Israelite cuisine
  image: Tabun oven
  author_notes:
    - "Ovens: the tannûr was a cylindrical clay oven heated from inside, with dough slapped against the wall; 'tabun' is the later Arabic term. Courtyard ovens are common in Iron Age houses, and some appear to have been shared (cf. Lev 26:26). Bread was also baked on embers, hot stones and griddles."
    - "Diet: cereals (wheat and barley) supplied most calories, with legumes, olive oil, wine, figs, dates, grapes and dairy products. Meat was mainly eaten at sacrifices and feasts. Do not quote precise calorie percentages unless they come from a source such as MacDonald."
    - "Grinding and baking took many hours a day and were women's work in the household (Meyers). Cities also had professional bakers (Jer 37:21; Gen 40)."
    - "Leaven was a sourdough starter (śĕʾōr). Explain its ritual exclusion (Passover; Lev 2:11) without claiming that leaven always symbolizes evil (contrast Lev 23:17; Matt 13:33)."
    - "Leḥem can mean 'food' in general, and the 'staff of bread' (Lev 26:26; Ezek 4:16) is the food supply."
  sources_to_check:
    - "N. MacDonald, What Did the Ancient Israelites Eat? Diet in Biblical Times (2008)"
    - "P. J. King and L. E. Stager, Life in Biblical Israel (2001)"
    - "C. Meyers, Rediscovering Eve: Ancient Israelite Women in Context (2013)"

- id: medicine-and-healing
  aliases: [Physicians, Healing, Disease, Asû, Āšipu]
  cultures: [hebrew, mesopotamian, egyptian, greek, jewish]
  scope: >-
    Illness and its treatment in the ancient Near East and the Greco-Roman world, and in
    biblical texts: the Mesopotamian asû (physician) and āšipu (exorcist), Egyptian medical
    papyri, Greek medicine and healing cults, and biblical attitudes to physicians, remedies
    and divine healing. Skin disease and purity rules, demons and amulets are treated in
    their own entries.
  passages:
    - "Exod 15:26 | concept | 'I am YHWH who heals you'; obedience keeps away the diseases of Egypt"
    - "Exod 21:18-19 | practice | An assailant pays for the victim's lost time and his full healing"
    - "Gen 50:2 | practice | Joseph's physicians (rōpĕʾîm) embalm Jacob"
    - "2Kgs 1:2 | practice | Ahaziah sends to Baal-zebub of Ekron to ask whether he will recover"
    - "2Kgs 20:7 | practice | A fig poultice applied to Hezekiah's boil"
    - "2Chr 16:12 | concept | Asa seeks physicians rather than YHWH in his illness"
    - "Isa 1:6 | realia | Wounds not drained, bound up or softened with oil"
    - "Jer 8:22 | imagery | 'Is there no balm in Gilead? Is there no physician there?'"
    - "Jer 46:11 | imagery | Egypt's many medicines are in vain"
    - "Sir 38:1-15 | concept | Honour the physician; God created medicines from the earth"
    - "Tob 2:10; 11:7-13 | practice | Physicians' ointments fail; Tobit's eyes healed with fish gall"
    - "Mark 5:25-26 | practice | A woman who had suffered much under many physicians"
    - "Luke 10:34 | practice | Oil and wine poured on wounds and bandaged"
  related: [magic-and-sorcery, lamashtu-pazuzu-amulets, demons, amulets, purity-and-impurity, baal-zebub, ludlul-bel-nemeqi, hezekiah]
  wikipedia: null
  image: Edwin Smith Papyrus
  author_notes:
    - "Mesopotamia: the asû (who worked mainly with drugs and bandages) and the āšipu (who worked mainly with incantation and diagnosis) overlapped. Avoid a 'rational versus magical' contrast. Mention the Diagnostic Handbook (Sakikkû) and Hammurabi §§215-223 on surgeons' fees and liabilities. Exod 21:19 has close parallels in Hammurabi §206 and Hittite Laws §10, which both require payment of the physician."
    - "Egypt: the Ebers and Edwin Smith papyri, and the reputation of Egyptian physicians abroad (Herodotus 2.84; Jer 46:11). The physicians of Gen 50:2 embalm rather than treat."
    - "There is little evidence of professional physicians in Israel before the Hellenistic period. Prophets act as healers (1 Kgs 17; 2 Kgs 4-5; 2 Kgs 20). 2 Chr 16:12 criticizes reliance on physicians instead of YHWH, perhaps because healing was bound up with other gods. Sir 38:1-15 reconciles physician and prayer. Present the development and its debates."
    - "Avoid retrospective diagnosis. Ṣāraʿat is not Hansen's disease (leprosy), and 'fig poultice' should not be turned into modern pharmacology. Ugaritic horse-medicine texts also prescribe pressed figs; verify before citing."
    - "Greco-Roman setting of the NT: Asclepius sanctuaries (Epidaurus, Pergamon, Corinth), Hippocratic medicine, and the image of Luke as 'the beloved physician' (Col 4:14)."
  sources_to_check:
    - "H. Avalos, Illness and Health Care in the Ancient Near East (HSM 54, 1995)"
    - "J. Scurlock and B. R. Andersen, Diagnoses in Assyrian and Babylonian Medicine (2005)"
    - "J. F. Nunn, Ancient Egyptian Medicine (1996)"
    - "M. J. Geller, Ancient Babylonian Medicine: Theory and Practice (2010)"

