- id: loans-interest-pledges
  aliases: [Usury, Interest (nešek and tarbît), Pledges, Surety]
  cultures: [hebrew, akkadian, babylonian, jewish]
  scope: >-
    Lending in biblical law and practice: the ban on charging interest (nešek, tarbît) to a
    fellow Israelite in need, the rules limiting what may be taken in pledge, suretyship, and
    the prophetic and wisdom critique of creditors, compared with Mesopotamian loan law and
    the Aramaic loan contracts from Elephantine. Debt remission and debt-servant release are
    treated under debt-release and slavery; the Meṣad Ḥashavyahu petition has its own entry.
  passages:
    - "Exod 22:25-27 | practice | No interest from the poor; a pledged cloak returned before sunset (MT 22:24-26)"
    - "Lev 25:35-37 | practice | No nešek or tarbît from an impoverished kinsman"
    - "Deut 23:19-20 | practice | Interest banned between Israelites but allowed from a foreigner (MT 23:20-21)"
    - "Deut 24:6, 10-13, 17 | practice | Limits on pledges: no millstone, no entering the house, cloak returned, widow's garment exempt"
    - "Gen 38:17-18 | language | Judah's seal, cord and staff given as a pledge (ʿērābôn)"
    - "2Kgs 4:1 | practice | A creditor comes to take a widow's children as slaves"
    - "Job 24:3, 9 | practice | The widow's ox and the infant of the poor taken in pledge"
    - "Amos 2:8 | practice | Garments taken in pledge spread out beside altars"
    - "Ezek 18:8, 13, 17 | practice | Taking advance or accrued interest among the marks of the wicked"
    - "Neh 5:1-13 | practice | Fields, houses and children pledged; Nehemiah halts lending at interest"
    - "Ps 15:5 | practice | The righteous does not lend money at interest"
    - "Prov 22:26-27 | practice | Warning against giving pledges as surety for another's debts"
    - "Luke 19:23 | practice | Money deposited with bankers to earn interest"
  related: [debt-release, mesad-hashavyahu-ostracon, slavery, widow-orphan-sojourner, laws-of-eshnunna, code-of-hammurabi, elephantine-papyri, weights-and-silver-money]
  wikipedia: null
  image: null
  author_notes:
    - "Explain the terms. Nešek ('bite') and tarbît/marbît ('increase') appear together in Lev 25:36-37 and Ezek 18. Whether they denote interest deducted in advance and interest added at repayment, or are near-synonyms, is debated. Hebrew ʿăbōṭ and ḥăbōl denote pledges, and ʿērābôn (Gen 38) is the Semitic word behind Greek arrabōn (2 Cor 1:22)."
    - "Mesopotamian law regulated rather than banned interest. The Laws of Eshnunna (§18A) and the gap sections of Hammurabi's laws set maximum rates of 20 percent on silver and 33⅓ percent on grain; verify section numbers in Roth. Hammurabi §§113-119 regulate distraint and persons held as pledges."
    - "Elephantine Aramaic loan contracts (e.g. TAD B3.1) record monthly interest and penalties for default. They show Judeans in the Persian period lending at interest among themselves; verify the rates before citing."
    - "The biblical ban protects a needy kinsman (it is framed as charity, not commerce), and Deut 23:20 allows interest from foreigners. Pledge limits protect the means of subsistence (cloak, millstone). Do not present it as a general ban on commercial credit, and note later Jewish and Christian developments only briefly."
    - "Neh 5:11 refers to 'the hundredth' of money, grain, wine and oil, perhaps one percent a month. The interpretation is debated."
  sources_to_check:
    - "M. T. Roth, Law Collections from Mesopotamia and Asia Minor (SBLWAW 6, 2nd ed. 1997)"
    - "B. Porten and A. Yardeni, Textbook of Aramaic Documents from Ancient Egypt, vol. 2: Contracts (1989)"
    - "R. Westbrook (ed.), A History of Ancient Near Eastern Law, 2 vols. (2003)"
    - "E. Neufeld, 'The Prohibitions against Loans at Interest in Ancient Hebrew Laws,' HUCA 26 (1955)"

