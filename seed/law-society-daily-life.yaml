# Seed entries for the law-society-daily-life domain.
# Passage references use English (NRSV) versification; MT differences are given in notes.

- id: lex-talionis
  aliases: [Eye for an eye, Talion, Law of retaliation]
  cultures: [hebrew, akkadian]
  scope: >-
    The principle that punishment for bodily injury or homicide should correspond in kind
    to the harm done ("life for life, eye for eye"), as formulated in the biblical law
    collections and in the Laws of Hammurabi. The entry covers its ancient Near Eastern
    background, its function within biblical law, and its reception in early Jewish and
    Christian interpretation.
  passages:
    - "Exod 21:23-25 | practice | Talion formula applied to injury of a pregnant woman in a brawl"
    - "Exod 21:22 | parallel | Fine for causing miscarriage; cf. LH §§209-214, MAL A §§50-52, HL §§17-18"
    - "Lev 24:17-22 | practice | Talion for homicide and injury, applied equally to alien and citizen"
    - "Deut 19:16-21 | practice | Malicious witness receives the penalty he sought; cf. LH §§1-3"
    - "Deut 24:16 | polemic? | Rejects vicarious punishment of children; contrast LH §§116, 210, 230"
    - "Judg 1:6-7 | concept | Adoni-bezek's mutilation framed as measure-for-measure retribution"
    - "Gen 9:6 | concept | Bloodshed requited by bloodshed, grounded in the divine image"
    - "Obad 15 | concept | 'As you have done, it shall be done to you' as principle of divine judgment"
    - "Matt 5:38-42 | concept | Jesus' antithesis rejecting retaliation"
  related: [code-of-hammurabi, ane-law-collections, laws-of-ur-nammu, goring-ox, middle-assyrian-laws, hittite-laws]
  wikipedia: Eye for an eye
  image: Code of Hammurabi stele Louvre
  author_notes:
    - "In Hammurabi (§§196-201) talion applies between social equals (awīlum); injuries to commoners and slaves are compensated in silver. Talion is thus class-stratified, not 'primitive'."
    - "The older Laws of Ur-Nammu (§§18-22) already fix monetary compensation for bodily injury, which tells against the evolutionary scheme of 'talion first, composition later'."
    - "Note the debate whether the biblical formula was applied literally or stated a principle of proportionality and a ceiling. Early sources (Josephus, Ant. 4.280; rabbinic Mekhilta and b. Bava Qamma 83b-84a) allow or require monetary substitution."
    - "Exod 21:22-25 is textually and exegetically difficult (the LXX distinguishes a 'formed' from an 'unformed' fetus). Keep the miscarriage law distinct from the talion formula that follows."
  sources_to_check:
    - "Roth, Law Collections from Mesopotamia and Asia Minor (SBLWAW 6, 2nd ed. 1997)"
    - "ANET 163-180"
    - "Westbrook (ed.), A History of Ancient Near Eastern Law (HdO 72, 2003)"

- id: goring-ox
  cultures: [hebrew, akkadian]
  scope: >-
    The law of the goring ox in the Covenant Code (Exod 21:28-36) and its close cuneiform
    counterparts in the Laws of Eshnunna and the Laws of Hammurabi. It is the classic test
    case for how biblical law relates to the wider ancient Near Eastern legal tradition.
  passages:
    - "Exod 21:28-32 | parallel | Ox kills a person; owner liable if forewarned; cf. LE §§54-55, LH §§250-252"
    - "Exod 21:32 | practice | Thirty shekels for a slave gored; cf. LH §252 (twenty shekels)"
    - "Exod 21:30 | practice | Ransom (kōper) allowed in place of the negligent owner's death"
    - "Exod 21:35-36 | parallel | Ox gores ox: live ox sold and price divided, nearly verbatim with LE §53"
    - "Exod 21:33-34 | practice | Liability for an uncovered pit, same casuistic unit"
    - "Gen 9:5 | concept | God requires a reckoning for human blood even from animals"
  related: [ane-law-collections, laws-of-eshnunna, code-of-hammurabi, lex-talionis, slavery]
  wikipedia: null
  image: Laws of Eshnunna tablet
  author_notes:
    - "The verbal closeness of Exod 21:35 to LE §53 is among the strongest cases of shared legal tradition. Lay out the competing explanations, written dependence (D. P. Wright argues for use of Hammurabi) versus a common scribal or oral legal tradition (Westbrook, Malul), without deciding."
    - "Distinctive biblical features are the stoning of the ox and the ban on eating its flesh (Exod 21:28). J. J. Finkelstein (The Ox That Gored, 1981) explained these by the animal's violation of the created hierarchy. Compare Gen 9:5."
    - "The cuneiform versions deal only in monetary liability. The biblical version makes the negligent owner liable to death, though a ransom may be accepted (21:30). The ransom provision fits uneasily with Num 35:31."
    - "The goring ox works as a scholastic 'problem case' in the law collections, so do not assume it reflects frequent litigation."
  sources_to_check:
    - "Roth, Law Collections from Mesopotamia and Asia Minor (SBLWAW 6, 2nd ed. 1997)"
    - "Yaron, The Laws of Eshnunna (2nd ed. 1988)"
    - "ANET 161-163"

- id: ane-law-collections
  aliases: [Cuneiform law, Ancient Near Eastern law codes]
  cultures: [sumerian, akkadian, assyrian, hittite, babylonian, hebrew]
  scope: >-
    Overview of the cuneiform law collections (Ur-Nammu, Lipit-Ishtar, Eshnunna, Hammurabi,
    the Middle Assyrian and Hittite laws, the Neo-Babylonian laws) and their relation to the
    biblical law corpora: the Covenant Code, the Holiness Code, and the Deuteronomic Code.
    The entry is the hub for questions of genre, form, purpose, and literary dependence;
    individual collections and topics have their own entries.
  passages:
    - "Exod 20:22-23:33 | form | Covenant Code: casuistic and apodictic law framed by altar and cult rules"
    - "Exod 21:2-22:17 | form | Casuistic 'if a man...' laws closest in form to cuneiform collections (MT 21:2-22:16)"
    - "Exod 22:18-20 | form | Apodictic death-penalty prohibitions (MT 22:17-19)"
    - "Lev 17-26 | form | Holiness Code, with concluding blessings and curses"
    - "Deut 12-26 | form | Deuteronomic law corpus, revising and expanding the Covenant Code"
    - "Deut 28 | form | Blessings and curses closing a law corpus; cf. LH epilogue curses"
    - "Deut 4:5-8 | concept | Israel's laws as wisdom admired by the nations; cf. royal claims in LH prologue/epilogue"
    - "Ezra 7:25-26 | practice | Persian authorisation of 'the law of your God and the law of the king'"
  related: [code-of-hammurabi, laws-of-ur-nammu, laws-of-lipit-ishtar, laws-of-eshnunna, middle-assyrian-laws, hittite-laws, covenant-and-treaty-form, persian-imperial-authorization]
  wikipedia: Cuneiform law
  image: Code of Hammurabi stele Louvre
  author_notes:
    - "Give the corpus and approximate dates. Ur-Nammu (ca. 2100), Lipit-Ishtar (ca. 1930), Eshnunna (ca. 1800), Hammurabi (ca. 1750), Hittite Laws (Old Hittite with later copies), Middle Assyrian Laws (tablets of the 11th century), Neo-Babylonian Laws (7th century)."
    - "Explain the debate over purpose. Bottéro and Kraus read the collections as scholarly or royal-apologetic texts, not statutory legislation, since court records almost never cite them. Westbrook reads them as reference works within a shared ANE 'common law'. Most scholars now agree they are not codes in the modern sense, so 'law collections' is the preferred term."
    - "Alt's casuistic/apodictic distinction is still useful as description. His claim that apodictic law is uniquely Israelite is no longer accepted."
    - "Present the current dependence debate, especially D. P. Wright's thesis that the Covenant Code draws directly on Hammurabi (Inventing God's Law, 2009), and Levinson's model of Deuteronomy as a revision of the Covenant Code."
    - "Note distinctive biblical features: law as divine speech set in narrative, motive clauses, cultic and civil law mixed together, and the whole people addressed rather than judges."
  sources_to_check:
    - "Roth, Law Collections from Mesopotamia and Asia Minor (SBLWAW 6, 2nd ed. 1997)"
    - "ANET 159-198"
    - "Hoffner, The Laws of the Hittites: A Critical Edition (1997)"
    - "Westbrook (ed.), A History of Ancient Near Eastern Law (HdO 72, 2003)"

- id: debt-release
  aliases: [Jubilee, Year of Release, Shemittah, Mīšarum, Andurārum, Derôr]
  cultures: [hebrew, akkadian, sumerian, assyrian]
  scope: >-
    Biblical laws for cancelling debts, releasing debt-servants, and returning alienated land
    (the seventh-year release of Deut 15 and the fiftieth-year Jubilee of Lev 25), compared
    with Mesopotamian royal edicts of 'justice' (mīšarum) and 'release' (andurārum). The
    fallow year is treated under sabbatical-year.
  passages:
    - "Lev 25:8-17 | practice | Jubilee: proclamation of release (dĕrôr, cf. Akk. andurārum) and return of land"
    - "Lev 25:39-55 | practice | Release of Israelite debt-servants in the Jubilee"
    - "Deut 15:1-11 | practice | Seventh-year remission (šĕmiṭṭâ) of loans between Israelites"
    - "Deut 15:12-18 | practice | Release of Hebrew debt-servants in the seventh year"
    - "Exod 21:2-6 | practice | Release of a Hebrew slave after six years' service"
    - "Jer 34:8-22 | event | Zedekiah's proclamation of release (dĕrôr) and its revocation"
    - "Neh 5:1-13 | practice | Ad hoc remission of debts and pledges, comparable to a royal mīšarum"
    - "Neh 10:31 | practice | Covenant pledge to forgo debts in the seventh year (MT 10:32)"
    - "Ezek 46:17 | practice | 'Year of liberty' (šĕnat hadĕrôr) when gifted land reverts"
    - "Isa 61:1-2 | concept | Proclaiming liberty (dĕrôr) to captives, the year of YHWH's favour"
    - "Luke 4:18-19 | concept | Jesus applies Isa 61:1-2 and 58:6 to his ministry"
  related: [sabbatical-year, edict-of-ammi-saduqa, slavery, land-redemption, code-of-hammurabi, hammurabi, widow-orphan-sojourner]
  wikipedia: Jubilee (biblical)
  image: null
  author_notes:
    - "Distinguish three biblical institutions that are often conflated. They are the seventh-year remission of loans (Deut 15:1-11), the release of debt-servants after six years (Exod 21:2-6; Deut 15:12-18), and the Jubilee return of land and persons (Lev 25)."
    - "Mesopotamian edicts (Uru-inimgina's amargi; Old Babylonian mīšarum acts such as Ammi-ṣaduqa's) were issued at a king's discretion, often on accession, and cancelled consumer debts but not commercial loans. The biblical releases are periodic and grounded in divine ownership of land and people."
    - "Hebrew dĕrôr is cognate with Akkadian andurārum, but etymology alone does not prove borrowing. Present the lexical link with that caution."
    - "Whether the Jubilee was ever practised is debated, and positive evidence is lacking. Jer 34 and Neh 5 look more like ad hoc royal or gubernatorial acts. Lev 25 is usually assigned to H (late pre-exilic to post-exilic). 11QMelchizedek and Luke 4 show its eschatological reuse."
    - "Mention Hillel's prozbul (m. Shevi'it 10:3) as evidence that Deut 15 remission was observed in later Judaism and caused credit problems."
  sources_to_check:
    - "Kraus, Königliche Verfügungen in altbabylonischer Zeit (1984)"
    - "Weinfeld, Social Justice in Ancient Israel and in the Ancient Near East (1995)"
    - "Bergsma, The Jubilee from Leviticus to Qumran (2007)"
    - "ANET 526-528"

- id: sabbatical-year
  aliases: [Shemittah, Fallow year, Seventh year]
  cultures: [hebrew, jewish]
  scope: >-
    The seventh-year fallow of fields, vineyards, and olive groves in biblical law, its
    relation to the weekly Sabbath and to debt remission, and the evidence that it was
    observed in the Second Temple period. Debt and slave release are treated under
    debt-release.
  passages:
    - "Exod 23:10-11 | practice | Seventh-year fallow, the produce left for the poor and wild animals"
    - "Lev 25:1-7 | practice | 'A sabbath for the land' with no sowing or pruning"
    - "Lev 25:18-22 | practice | Promise of a sixth-year harvest sufficient for three years"
    - "Lev 26:34-35, 43 | concept | Exile as the land 'enjoying its sabbaths'"
    - "2Chr 36:21 | concept | Seventy years of exile fulfil the land's neglected sabbaths"
    - "Deut 15:1-2 | practice | Year of remission (šĕmiṭṭâ) linked to the seven-year cycle"
    - "Deut 31:10-13 | practice | Public reading of the law at Booths in the year of remission"
    - "Neh 10:31 | practice | Covenant pledge to forgo the seventh year's crops and debts (MT 10:32)"
    - "1Macc 6:49, 53 | event | Food shortage at Beth-zur and Jerusalem because it was a sabbatical year"
  related: [sabbath, debt-release, seven-day-patterns, agriculture-and-farming, babylonian-exile, calendars-and-month-names]
  wikipedia: Shmita
  image: null
  author_notes:
    - "No fixed septennial fallow is attested elsewhere in the ancient Near East. The Ugaritic seven-year cycles (e.g., drought in Aqhat) are literary motifs, not institutions. Present the institution as an extension of Sabbath logic to agricultural time."
    - "Note the debate whether Exod 23:10-11 assumed a rotating fallow for each field or a single universal year, as in Lev 25. Also relate the land's 'rest' to Sabbath work prohibitions."
    - "Practice is attested in the Second Temple period. Sources include 1 Maccabees, Josephus (e.g., Caesar's decree remitting tribute in the seventh year, Ant. 14.202), Tacitus' polemic (Hist. 5.4), and documents from Murabbaʿat dated by the year of release. Verify specific document numbers."
    - "The Chronicler's link between exile and unkept sabbatical years (2 Chr 36:21, combining Lev 26 and Jer 25:11) is theological interpretation, not chronological evidence."

- id: slavery
  aliases: [Debt slavery, Debt servitude, Hebrew slave]
  cultures: [hebrew, ane]
  scope: >-
    Slavery and debt servitude in biblical law and narrative, compared with ancient Near
    Eastern legal and documentary evidence. Covers the 'Hebrew slave' laws, female
    servitude, protections and their limits, fugitive slaves, the sale of foreign chattel
    slaves, and the Greco-Roman setting of New Testament texts.
  passages:
    - "Exod 21:2-6 | practice | Hebrew slave released after six years; ear-piercing at the doorpost for life service"
    - "Exod 21:7-11 | practice | Daughter sold as a slave-wife, with protections"
    - "Exod 21:20-21, 26-27 | practice | Penalties for beating a slave; freedom for loss of eye or tooth"
    - "Exod 21:16 | practice | Kidnapping for sale is a capital crime; cf. LH §14"
    - "Lev 25:39-46 | practice | Israelite debtors as hired labourers; foreign slaves as permanent property"
    - "Deut 15:12-18 | practice | Release of male and female debt-servants with provisions; ear-piercing"
    - "Deut 23:15-16 | practice | Fugitive slaves not to be returned (MT 23:16-17); contrast LH §§15-20"
    - "2Kgs 4:1 | practice | Creditor seizes a widow's children for debt"
    - "Neh 5:1-5 | practice | Judeans pledging children as debt-slaves in the Persian period"
    - "Jer 34:8-22 | event | Release and re-enslavement of Hebrew slaves under Zedekiah"
    - "Phlm 8-21 | setting | Onesimus, within Roman household slavery"
  related: [debt-release, code-of-hammurabi, edict-of-ammi-saduqa, samaria-papyri, habiru, elephantine-papyri, corvee-labor, treatment-of-captives]
  wikipedia: The Bible and slavery
  image: null
  author_notes:
    - "Distinguish debt servitude of Israelites (time-limited) from chattel slavery of foreigners (Lev 25:44-46). Biblical terminology (ʿebed also means royal servant or official) does not map neatly onto these categories."
    - "Hammurabi limits debt servitude of a debtor's family to three years (LH §117), against the biblical six. Hammurabi makes harbouring a fugitive slave a capital crime (§§15-16). Deut 23:15-16 is unusual in forbidding extradition. Compare the ear-piercing of Exod 21:6 with LH §282 (slave's ear cut off for repudiating his master)."
    - "Discuss whether ʿibrî ('Hebrew') in Exod 21:2 is an ethnic term or a social class, perhaps related to ḫabiru, and how Deuteronomy revises the Covenant Code by extending release to women."
    - "Documentary evidence includes Old and Neo-Babylonian sale and debt contracts, the Wadi Daliyeh slave conveyances from Samaria (4th century BCE), and Elephantine documents."
    - "Avoid both apologetic minimising ('servants, not slaves') and anachronistic equation with Atlantic chattel slavery."
  sources_to_check:
    - "Roth, Law Collections from Mesopotamia and Asia Minor (SBLWAW 6, 2nd ed. 1997)"
    - "Chirichigno, Debt-Slavery in Israel and the Ancient Near East (JSOTSup 141, 1993)"
    - "Dandamaev, Slavery in Babylonia (1984)"
    - "Gropp, Wadi Daliyeh II: The Samaria Papyri from Wadi Daliyeh (DJD 28, 2001)"

- id: widow-orphan-sojourner
  aliases: [Personae miserae, Resident alien (gēr)]
  cultures: [hebrew, sumerian, akkadian, egyptian, ugaritic]
  scope: >-
    The widow, the orphan, and the resident alien as stock categories of vulnerable persons
    in biblical law, prophecy, and psalmody, and the ancient Near Eastern royal ideal of
    protecting the widow and orphan. The entry covers legal provisions, the ideology of
    divine and royal protection, and the development of the gēr category.
  passages:
    - "Exod 22:21-24 | practice | Do not wrong the alien, widow, or orphan; God hears their cry (MT 22:20-23)"
    - "Deut 10:18 | concept | YHWH executes justice for orphan and widow and loves the alien"
    - "Deut 14:28-29 | practice | Triennial tithe for the Levite, alien, orphan, and widow"
    - "Deut 24:17-22 | practice | No pledge from a widow; gleanings left for the triad"
    - "Deut 27:19 | practice | Curse on one who perverts their justice"
    - "Ps 68:5 | concept | God as 'father of orphans and protector of widows' (MT 68:6)"
    - "Ps 82:3-4 | concept | Gods judged for failing the weak and the orphan"
    - "Ps 146:9 | concept | YHWH watches over strangers, orphan, and widow"
    - "Isa 1:17, 23 | practice | Prophetic demand to defend orphan and widow"
    - "Jer 22:3 | concept | Royal duty to protect alien, orphan, and widow"
    - "Mal 3:5 | practice | Judgment on oppressors of hired worker, widow, orphan, and alien"
    - "Jas 1:27 | concept | Care for orphans and widows as true religion"
  related: [code-of-hammurabi, laws-of-ur-nammu, aqhat-epic, kirta-epic, eloquent-peasant, royal-ideology, courts-and-legal-procedure, debt-release]
  wikipedia: null
  image: null
  author_notes:
    - "The widow-orphan pairing is a royal-ideological topos across the ancient Near East. Examples are the Ur-Nammu prologue (the orphan not delivered to the rich, the widow not to the mighty), the Hammurabi epilogue, Danel judging the widow's and orphan's case (Aqhat), Yassib's rebuke of Kirta, and Egyptian texts such as the Eloquent Peasant ('father to the orphan, husband to the widow')."
    - "The triad including the gēr is characteristically Deuteronomic. The motive clause 'you were aliens in Egypt' is a distinctively biblical development."
    - "Note debate on terms. ʾalmānâ may denote a widow without adult male support, not simply any widow. Gēr is a legal status that later Greek translation (prosēlytos) reinterprets religiously."
    - "Show the transfer of the royal ideal to YHWH as divine king (Ps 68; 82; 146), and the prophetic use of the triad as a measure of covenant fidelity."
  sources_to_check:
    - "Roth, Law Collections from Mesopotamia and Asia Minor (SBLWAW 6, 2nd ed. 1997)"
    - "Weinfeld, Social Justice in Ancient Israel and in the Ancient Near East (1995)"

- id: courts-and-legal-procedure
  aliases: [Elders at the gate]
  cultures: [hebrew, ugaritic]
  scope: >-
    The city gate complex as the place where elders heard disputes, witnessed transactions,
    and administered local justice in ancient Israel, with comparative Ugaritic evidence.
    The architecture of gates is treated under city-gates.
  passages:
    - "Gen 23:10-18 | practice | Land purchase witnessed by 'all who went in at the gate of his city'"
    - "Deut 21:18-21 | practice | Rebellious son brought to the elders at the gate"
    - "Deut 22:15 | practice | Evidence of virginity brought to the elders at the gate"
    - "Deut 25:7-9 | practice | Levirate refusal heard by the elders at the gate"
    - "Ruth 4:1-11 | practice | Boaz convenes ten elders at the gate to settle redemption"
    - "Josh 20:4 | practice | Manslayer states his case at the gate of the refuge city"
    - "2Sam 15:2-6 | practice | Absalom intercepts litigants at the gate, undermining royal justice"
    - "Amos 5:10-15 | practice | Corruption of justice 'in the gate'"
    - "Prov 31:23 | practice | Husband respected 'in the gates' among the elders"
    - "Job 29:7-17 | practice | Job's seat in the square, defending the poor and orphan"
    - "Deut 16:18 | practice | Judges appointed 'in all your gates' (towns)"
  related: [city-gates, aqhat-epic, levirate-marriage, land-redemption, widow-orphan-sojourner, dan]
  wikipedia: null
  image: Tel Dan Israelite gate
  author_notes:
    - "Describe the gate as civic space. It held benches in the chambers and a plaza inside the gate (Dan, Bethsaida, Beersheba). Note that a bench alone does not prove judicial use."
    - "Danel, seated 'before the gate' by the threshing floor and judging the cause of the widow and orphan (Aqhat, KTU 1.17 V), is the closest Levantine literary parallel."
    - "Note the tension between local justice by elders and royal or appointed judges (Deut 16:18; 2 Chr 19:5-11; 2 Sam 15). Many see a historical development from kin-based to state judiciary."
    - "'Gate' (šaʿar) often stands for 'town' in Deuteronomy. Do not over-read every occurrence as a reference to the gate structure."

- id: city-gates
  aliases: [Six-chambered gate, Solomonic gates]
  cultures: [israelite, judahite, canaanite]
  scope: >-
    Gateways and fortification systems of Bronze and Iron Age cities in the southern Levant
    (chambered gates, walls, towers, glacis), their archaeology, and their use in biblical
    texts. Covers the debate over 'Solomonic' six-chamber gates; judicial use of gates is
    treated under courts-and-legal-procedure.
  passages:
    - "1Kgs 9:15 | attests? | Solomon's building at Hazor, Megiddo, and Gezer, linked by Yadin to six-chamber gates"
    - "2Sam 18:24-33 | realia | Watchman on the gate roof; chamber over the gate (MT 18:24-19:1)"
    - "Neh 3:1-32 | realia | Rebuilding of Jerusalem's named gates and wall sections"
    - "Neh 2:13-15 | realia | Nehemiah's night inspection of the walls and gates"
    - "2Kgs 23:8 | realia | High places 'of the gates' at the gate of Joshua; cf. gate shrines at Dan and Lachish"
    - "Judg 16:3 | realia | Samson carries off Gaza's gate doors, posts, and bar"
    - "Isa 22:9-11 | realia | Houses torn down to fortify Jerusalem's wall; reservoir between walls"
    - "Ps 24:7-10 | imagery | Gates commanded to lift their heads for the King of glory"
    - "1Kgs 22:10 | setting | Kings enthroned at the threshing floor at the entrance of Samaria's gate"
  related: [courts-and-legal-procedure, megiddo, hazor, gezer, lachish, dan, low-chronology-debate, cult-reforms-archaeology]
  wikipedia: City gate
  image: six-chambered gate Megiddo
  author_notes:
    - "Give the typology. Middle Bronze triple-pier gates (e.g., the mudbrick arched gate at Dan) were followed by Iron Age six-, four-, and two-chamber gates."
    - "Yadin's attribution of the Hazor, Megiddo, and Gezer six-chamber gates to Solomon (1 Kgs 9:15) is the starting point of the tenth-century debate. The same plan also occurs at non-Israelite and later sites (e.g., Ashdod, Lachish), so it cannot serve as a royal 'signature'."
    - "Mention gate shrines and cultic installations (Dan's maṣṣebot and podium; the Lachish Level III gate shrine with its toilet, compare 2 Kgs 10:27) as background to 2 Kgs 23:8."
    - "Identifications such as Khirbet Qeiyafa's two gates with 'Shaaraim' (1 Sam 17:52) are disputed. Present them as proposals."

- id: asylum-and-cities-of-refuge
  aliases: [Cities of refuge, Altar asylum, Blood avenger (gōʾēl haddām)]
  cultures: [hebrew, greek]
  scope: >-
    Biblical provisions protecting an unintentional killer from the blood avenger, first by
    asylum at the altar and then in designated cities of refuge, with discussion of their
    literary history and of comparative asylum practices.
  passages:
    - "Exod 21:12-14 | practice | Unintentional killer given 'a place to flee'; deliberate murderer taken even from the altar"
    - "Num 35:9-34 | practice | Six cities of refuge; distinction of intent; release on the high priest's death"
    - "Deut 4:41-43 | practice | Three Transjordanian refuge cities: Bezer, Ramoth, Golan"
    - "Deut 19:1-13 | practice | Refuge cities in the land; elders hand over a deliberate murderer"
    - "Josh 20 | practice | Designation of Kedesh, Shechem, Hebron, Bezer, Ramoth, and Golan"
    - "1Kgs 1:50-53 | practice | Adonijah seizes the horns of the altar"
    - "1Kgs 2:28-34 | practice | Joab killed at the altar despite seeking asylum"
    - "2Sam 14:4-11 | practice | Woman of Tekoa's fictive plea against the blood avenger"
  related: [horned-altars, altars, lex-talionis, courts-and-legal-procedure, shechem, hebron]
  wikipedia: Cities of Refuge
  image: null
  author_notes:
    - "Many scholars (e.g., Weinfeld, Milgrom) see the refuge cities as a replacement for altar asylum after cult centralisation. The relative dating of the Deuteronomic, Priestly, and Joshua texts is debated."
    - "The release of the manslayer at the high priest's death (Num 35:25, 28) is often read as expiatory. Present the main interpretations."
    - "Clear ancient Near Eastern parallels to designated refuge cities are lacking. Comparative material is sanctuary asylum (Greek asylia, later Egyptian temple asylum). Avoid overstating similarity."
    - "Whether the institution functioned historically, and whether the town lists reflect a monarchic reality (as Albright held) or an ideal, is debated."

- id: trial-by-ordeal
  aliases: [River ordeal, Sotah, Ordeal of bitter water]
  cultures: [hebrew, akkadian, assyrian, amorite]
  scope: >-
    Judicial procedures that referred an unprovable case to divine decision through a
    physical test, especially the Mesopotamian river ordeal, and the ritual for a wife
    suspected of adultery in Num 5:11-31. Covers whether the biblical rite should be
    classed as ordeal or as conditional curse.
  passages:
    - "Num 5:11-31 | practice | Suspected wife drinks 'water of bitterness' under a conditional curse"
