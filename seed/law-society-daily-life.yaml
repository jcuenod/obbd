  image: Tel Rehov beehives
  author_notes:
    - "The Tel Reḥov apiary (10th-9th centuries, excavated by A. Mazar) is the earliest excavated apiary in the Near East. It had rows of unfired clay cylinder hives, and analysis suggests imported Anatolian bees. Give hive numbers carefully, separating those found from estimates."
    - "Dĕbaš can mean bee honey or fruit (date, grape, fig) syrup. Context decides; the seven-species list of Deut 8:8 and the firstfruits in 2 Chr 31:5 favour fruit syrup."
    - "Background for the 'milk and honey' formula includes the Ugaritic Baal Cycle ('the wadis run with honey', KTU 1.6 III) and Egyptian descriptions of Canaan (Sinuhe). Beekeeping is attested in Egyptian reliefs and Hittite Laws (beehive theft)."

