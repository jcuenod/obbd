  related: [solomon, david, khirbet-qeiyafa, megiddo, hazor, gezer, city-gates, bubastite-portal]
  wikipedia: Kingdom of Israel (united monarchy)
  image: Khirbet Qeiyafa
  author_notes:
    - "Yadin assigned Megiddo VA-IVB, Hazor X, and Gezer VIII to Solomon on the basis of 1 Kgs 9:15. Finkelstein's Low Chronology (1996) lowers the Iron I/IIA transition by about 75-100 years and attributes these strata to the 9th-century Omrides. Mazar's Modified Conventional Chronology has Iron IIA spanning about 980-840."
