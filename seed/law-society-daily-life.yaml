    - "'Egypt' (miṣrayim) in 1 Kgs 10:28 is sometimes emended to Muṣri in Anatolia. Kue is Cilicia. 'Iron chariots' probably means chariots with iron fittings."
    - "Trace the shift from Late Bronze chariot elites (Amarna letters, Egyptian reliefs) to Iron II cavalry, and the theological critique (Deut 17; Isa 31; Ps 20) of military horse power."
