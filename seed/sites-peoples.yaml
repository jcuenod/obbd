- id: gaza
  aliases: [ʿAzzah, Tell Harube]
  cultures: [philistine, egyptian]
  scope: >-
    The southernmost Philistine city, gateway between Egypt and the Levant and
    terminus of the Arabian incense route. Ancient Gaza lies mostly beneath the
    modern city, so the entry relies chiefly on textual evidence from Egyptian,
    Assyrian, biblical and Greek sources.
  passages:
    - "Gen 10:19 | setting | Canaanite territory reaching to Gaza"
    - "Judg 16:1-3 | setting | Samson carries off Gaza's city gates"
    - "Judg 16:21-30 | setting | Samson's death in the temple of Dagon at Gaza"
    - "1Sam 6:17 | setting | Gaza among the five Philistine cities"
    - "2Kgs 18:8 | setting | Hezekiah strikes the Philistines as far as Gaza"
    - "Amos 1:6-7 | setting | Gaza's trade in captives to Edom"
    - "Jer 47:1 | setting | Pharaoh strikes Gaza"
    - "Zeph 2:4 | language | Wordplay: Gaza (ʿazzâ) shall be deserted (ʿăzûbâ)"
    - "Acts 8:26 | setting | Road from Jerusalem to Gaza; Philip and the Ethiopian official"
  related: [philistines, roads-and-highways, tiglath-pileser-iii, incense-trade, dagon, ashdod]
  wikipedia: History of Gaza
  image: null
  author_notes:
    - The ancient tell (Tell Harube / Tell ʿAzza) lies under the modern city and has seen very little excavation, so the article should stress textual sources.
    - Gaza was the Egyptian New Kingdom administrative base on the Way of Horus, often identified with 'the city of Canaan' (pꜣ Knʿn) in Egyptian texts. Hanunu of Gaza fled to Egypt before Tiglath-pileser III in 734.
    - It was the terminus of the Arabian incense trade (Herodotus' Kadytis) and resisted Alexander's siege in 332 BCE.
    - Sites in the Gaza Strip (Anthedon, Tell es-Sakan, Tell el-ʿAjjul) are distinct from Gaza proper. Note recent damage to heritage neutrally. Supply an image when a suitable licensed photo is found.

- id: beth-shemesh
  aliases: [Tel Beth-Shemesh, Tell er-Rumeileh, Ir-shemesh]
  cultures: [judahite, canaanite]
  scope: >-
    The town in the Sorek Valley on the border between Judah and Philistia.
    Covers its Late Bronze and Iron Age strata, its role in discussions of ethnic
    boundaries, and the Iron II water reservoir and industry.
  passages:
    - "Josh 15:10 | setting | Beth-shemesh on Judah's northern border"
    - "Josh 21:16 | setting | Levitical city"
    - "1Sam 6:9-21 | setting | The ark returned from the Philistines by way of Beth-shemesh"
    - "1Kgs 4:9 | setting | Beth-shemesh in Ben-deker's district"
    - "2Kgs 14:11-13 | setting | Jehoash of Israel defeats Amaziah at Beth-shemesh"
    - "2Chr 28:18 | setting | Philistines take Beth-shemesh under Ahaz"
  related: [philistines, ark-of-the-covenant, pig-avoidance, ethnicity-and-material-culture, cisterns-and-water-systems, ekron]
  wikipedia: Tel Beit Shemesh
  image: Tel Beth Shemesh
  author_notes:
    - Excavated by Mackenzie (1911-12), Grant (1928-33) and Bunimovitz and Lederman (from 1990). Very low pig frequencies at Iron I Beth-shemesh, compared with nearby Philistine sites, are central to the debate on ethnic boundaries and pig avoidance.
    - The Iron II town had a large cruciform rock-cut reservoir and industrial installations. It was destroyed, probably in 701, and largely abandoned afterwards.
    - The name ('house of the sun') suggests a solar cult in origin, but there is no direct evidence for one at the site. Do not confuse it with Beth-shemesh in Naphtali (Judg 1:33).
  sources_to_check:
    - NEAEHL

- id: beth-shean
  aliases: [Beth-shan, Tel Beth-Shean, Tell el-Husn, Scythopolis]
  cultures: [egyptian, canaanite, israelite]
  scope: >-
    The tell at the junction of the Jezreel and Jordan valleys, an Egyptian
    administrative centre in the Late Bronze Age, an Israelite town in the Iron Age,
    and the Hellenistic-Roman city of Scythopolis at its foot. Covers the Egyptian
    garrison, the temples, the Iron Age town and the Decapolis city in outline.
  passages:
    - "Josh 17:11-16 | setting | Manasseh cannot dispossess Beth-shean; Canaanites with iron chariots"
    - "Judg 1:27 | setting | Canaanites remain in Beth-shean"
    - "1Sam 31:8-13 | setting | Saul's body fastened to the wall of Beth-shan; armour in the temple of Astarte"
    - "2Sam 21:12 | setting | Saul's bones taken from the public square of Beth-shan"
    - "1Kgs 4:12 | setting | Beth-shean in Baana's district"
    - "1Chr 10:10 | setting | Saul's head fastened in the temple of Dagon"
    - "1Kgs 14:25-26 | attests | Shoshenq I's campaign; Beth-shean in his Karnak list"
    - "2Macc 12:29-31 | setting | Scythopolis treats its Jewish residents well"
    - "Mark 5:20 | setting | The Decapolis, of which Scythopolis was the largest city"
  related: [shoshenq-i, astarte, dagon, chariots-and-horses, amarna-letters, philistines, habiru]
  wikipedia: Beit She'an
  image: Tel Beit Shean Scythopolis
  author_notes:
    - Under the New Kingdom (Eighteenth to Twentieth Dynasties), Beth-shean was an Egyptian garrison town. Finds include stelae of Seti I (one mentioning the ʿApiru) and Ramesses II, a statue of Ramesses III, and Egyptian-style residences.
    - The anthropoid clay coffins from the northern cemetery have been attributed to Sea Peoples mercenaries, but they are better read as Egyptian-style burials of mixed personnel. The attribution is debated.
    - The University of Pennsylvania excavations (1921-33) linked two Iron Age temples to 1 Sam 31:10 and 1 Chr 10:10. This is speculative. A. Mazar's excavations (1989-96) revised the stratigraphy.
    - Scythopolis was the leading Decapolis city. The Roman-Byzantine city at the foot of the tell is a major site in its own right.
  sources_to_check:
    - NEAEHL

- id: tyre
  aliases: [Ṣur, Ṣor, Tyros]
  cultures: [phoenician]
  scope: >-
    The leading Phoenician city of the Iron Age, an island city off the Lebanese
    coast. Covers its history from Hiram I to Alexander's siege, its commercial
