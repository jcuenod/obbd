    the southern Levant, Sinai and Transjordan. Covers the sources, the 'Shasu
    land of YHW' and 'Shasu of Seir/Edom' references, and their bearing on Israel's
    origins and on the southern origin of YHWH.
  passages:
    - "Deut 33:2 | concept? | YHWH comes from Sinai, Seir and Paran; cf. 'Shasu land of YHW'"
    - "Judg 5:4-5 | concept? | YHWH marches from Seir and Edom"
    - "Hab 3:3 | concept? | God comes from Teman, the Holy One from Mount Paran"
    - "Gen 47:4-6 | practice | Pastoralists admitted to the eastern Delta; cf. Shasu of Edom admitted at Tjeku (Papyrus Anastasi VI)"
  related: [soleb-shasu-inscription, yhwh-origins, papyrus-anastasi, edomites, midianites-and-kenites, merneptah-stele, habiru]
  wikipedia: Shasu
  image: Shasu captive relief Egypt
  author_notes:
    - Egyptian š3sw denotes Semitic-speaking pastoralists. The topographical lists at Soleb (Amenhotep III) and Amarah West (Ramesses II) include 'Shasu land of YHW' and 'Shasu land of Seir'.
    - The YHW toponym is important for the southern-origin hypothesis of YHWH. Note that it names a place or group, not explicitly a deity, and its location is debated.
    - Papyrus Anastasi VI (late thirteenth century) reports Shasu tribes of Edom allowed past the fortress at Tjeku to the pools of Pithom.
    - Rainey identified Merneptah's 'Israel' with Shasu figures in the Karnak reliefs, while Yurco and Stager identified them with Canaanites. Both views remain debated. Avoid equating Shasu with early Israel without qualification.
  sources_to_check:
    - Giveon, Les bédouins Shosou des documents égyptiens (1971)

