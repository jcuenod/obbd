- id: qumran
  aliases: [Khirbet Qumran]
  cultures: [jewish]
  date: [-100, 68]
  circa: true
  scope: >-
    The settlement on a marl terrace above the northwestern Dead Sea and the
    nearby caves where most of the Dead Sea Scrolls were found. Covers the
    excavated buildings, stepped pools, cemetery and pottery, the link between
    site and caves, and rival interpretations of the site.
  passages:
    - "Isa 40:3 | concept | 'In the wilderness prepare the way'; cited in the Community Rule (1QS 8) for withdrawal to the desert"
    - "Josh 15:61-62 | setting? | Secacah or the City of Salt in the wilderness district, proposed identifications"
    - "2Chr 26:10 | setting? | Uzziah builds towers in the wilderness; the Iron Age fort beneath the site"
    - "Lev 15:13-18 | practice? | Immersion for purity; the site's many stepped pools"
    - "Matt 3:1-6 | setting? | John the Baptist in the Judean wilderness; proposed Qumran connections"
  related: [dead-sea-scrolls, community-rule, pesher-habakkuk, great-isaiah-scroll, jewish-sects, stone-vessels-and-mikvaot, temple-scroll, josephus]
  wikipedia: Qumran
  image: Qumran Cave 4
  author_notes:
    - De Vaux excavated the site in 1951-56. Magness revised his phasing, placing the sectarian settlement from c. 100-50 BCE to its destruction by Rome in 68 CE. An Iron Age II fort lies beneath.
    - The Essene hypothesis (based on Pliny, Nat. Hist. 5.73; Philo; Josephus) remains the majority view. Alternatives include a villa, a fortress, a pottery workshop, and scrolls brought from Jerusalem. Pottery and proximity (especially Caves 4, 7-10) support a link between site and caves.
    - The stepped pools are read as ritual baths (miqvaʾot) by most, though some see them as cisterns. The cemetery holds about 1,100 graves, and the excavated sample is mostly male.
    - Links with John the Baptist or Jesus are popular but speculative. Do not equate the Qumran group with all Essenes.
  sources_to_check:
    - de Vaux, Archaeology and the Dead Sea Scrolls (1973)
    - Magness, The Archaeology of Qumran and the Dead Sea Scrolls (2002; 2nd ed. 2021)

- id: masada
  aliases: [Meṣada]
  cultures: [jewish, roman]
  scope: >-
    The isolated mesa-top fortress by the Dead Sea, fortified by the Hasmoneans
    and rebuilt by Herod, the last stronghold of the Jewish revolt against Rome.
    Covers the Herodian palaces, the Roman siege works, the scroll finds and the
    modern myth surrounding the site.
  passages:
    - "1Sam 24:22 | language | David goes up to the 'stronghold' (mĕṣûdâ), the word behind the name (MT 24:23)"
    - "Sir 39:27-44:17 | attests | Hebrew Ben Sira scroll from Masada"
    - "Ezek 35:11-38:14 | attests | Ezekiel scroll from Masada, including the dry bones vision"
    - "Ps 81-85 | attests | Psalms scroll from Masada, close to the later Masoretic text"
  related: [herod-the-great, josephus, dead-sea-scrolls, judaea-capta-coins, synagogues, qumran]
  wikipedia: Masada
  image: Masada aerial view
  author_notes:
    - Josephus credits the first fortification to 'Jonathan the high priest'. Herod built the Northern Palace, the Western Palace, storehouses, a bathhouse and cisterns. Yadin excavated in 1963-65 and Netzer published the architecture.
    - The Roman siege by Flavius Silva (73 or 74 CE) left the best-preserved circumvallation, camps and siege ramp in the Roman world. The mass suicide account (Josephus, War 7) is debated. Yadin's reading of the 'lots' ostraca and the nationalist 'Masada myth' (Ben-Yehuda) deserve comment.
    - Scroll finds include biblical books (among them Leviticus, Deuteronomy, Ezekiel and Psalms), Hebrew Ben Sira, and the Songs of the Sabbath Sacrifice, also known from Qumran. How they reached Masada is debated.
    - The synagogue is among the earliest known in the land.
  sources_to_check:
    - Yadin, Masada - Herod's Fortress and the Zealots' Last Stand (1966)
    - Netzer, The Architecture of Herod, the Great Builder (2006)

- id: caesarea-maritima
  aliases: [Caesarea, Straton's Tower, Caesarea Palaestinae]
  cultures: [roman, jewish]
  scope: >-
    The harbour city Herod founded on the site of Straton's Tower, later the seat
