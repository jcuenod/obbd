  related: [ekron-royal-dedicatory-inscription, philistines, olive-oil-production, baal-zebub, sennacherib-campaign-701, gath, ashdod]
  wikipedia: Ekron
  image: Tel Miqne Ekron olive oil press
  author_notes:
    - The 1996 royal dedicatory inscription naming ʾkyš (Achish/Ikausu) son of Padi, ruler of Ekron, confirmed the Tel Miqne identification. Padi is also known from Sennacherib's annals.
    - Iron I Philistine levels (Dothan and Gitin, 1981-96) include locally made Aegean-style pottery and hearths.
    - The seventh-century industrial zone, with over 100 olive presses, is a showcase of the Assyrian-era economy. The city was destroyed by Nebuchadnezzar c. 604-603.
    - Cross-refer baal-zebub for the 'lord of flies' / Baal-zebul polemical deformation.
  sources_to_check:
    - NEAEHL

- id: ashkelon
  aliases: [Ascalon, Tel Ashkelon]
  cultures: [philistine, canaanite]
  scope: >-
    The coastal city of Ashkelon, a Middle Bronze Canaanite port and later a city of
    the Philistine pentapolis, destroyed by Nebuchadnezzar in 604 BCE. Covers the
    Leon Levy Expedition's results from the Bronze Age to the Babylonian
    destruction; later periods are covered briefly.
  passages:
    - "Judg 1:18 | setting | Judah takes Ashkelon (LXX: did not take)"
    - "Judg 14:19 | setting | Samson kills thirty men of Ashkelon"
    - "1Sam 6:17 | setting | Ashkelon among the five Philistine cities"
