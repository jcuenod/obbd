    - "Judg 1:27-33 | setting | Canaanites remain among the tribes"
    - "Isa 19:18 | language | 'The language of Canaan', i.e. Hebrew"
    - "Ezek 16:3 | setting | 'Your origin and your birth were in the land of the Canaanites'"
    - "Prov 31:24 | language | kĕnaʿănî as 'merchant'"
