  wikipedia: Sheba
  image: Marib Temple of Awwam
  author_notes:
    - Saba was centred at Marib (great dam, temples of Almaqah such as Awwam and Barʾan). Assyrian texts mention Sabaeans under Tiglath-pileser III, Itʾamar the Sabaean under Sargon II, and Karibʾil under Sennacherib.
    - Sabaean monumental inscriptions begin around the eighth century BCE (the chronology is still debated). No queen of Saba is known from inscriptions. The visit story may reflect later (eighth to seventh century) trade realities. Present the debate, not a verdict.
