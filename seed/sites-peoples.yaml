  related: [amarna-letters, ugarit, emergence-of-israel, ethnicity-and-material-culture, herem, table-of-nations, amorites, phoenicians]
  wikipedia: Canaanites
  image: Megiddo ivories Canaanite
  author_notes:
    - The term Canaan (Kinaḫḫu, Kinaḫni) appears in Mari, Alalakh (Idrimi), Amarna and Egyptian sources. In the Late Bronze Age Canaan was an Egyptian province.
    - Archaeologically, early Israel emerged largely from within the local population, with continuity in pottery, language and script. In the Bible 'Canaanite' is often an ideological foil rather than an ethnographic description.
    - Ugaritic texts treat a 'man of Canaan' as a foreigner. Be careful about labelling Ugarit 'Canaanite'.
    - Ancient DNA (e.g. Agranat-Tamir et al., Cell 2020; verify) shows strong continuity in Bronze Age Levantine populations. The lists of seven nations are stereotyped and not ethnographic.
  sources_to_check:
