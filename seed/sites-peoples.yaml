  related: [nebuchadnezzar-ii, babylon, nabonidus, babylonian-exile, babylonian-chronicles, merodach-baladan, al-yahudu-tablets, fall-of-babylon-539]
  wikipedia: Neo-Babylonian Empire
  image: Ishtar Gate Pergamon Museum
  author_notes:
    - The Chaldeans (Kaldu) were tribal groups of southern Babylonia from the ninth century. The origins of Nabopolassar's dynasty are debated. In Daniel 'Chaldeans' also names a class of diviners.
    - The Babylonian Chronicles give the capture of Jerusalem on 2 Adar of Nebuchadnezzar's year 7 (597). The date of the final fall is debated (587 vs. 586).
    - Evidence for exile communities includes the Al-Yahudu tablets, the Murashu archive (later, Persian period) and the Jehoiachin ration tablets. Babylonian deportation policy, unlike the Assyrian, did not resettle foreigners in Judah.
    - Neo-Babylonian royal inscriptions are mostly building texts, not annals, so the chronicles and administrative texts carry more historical weight.
