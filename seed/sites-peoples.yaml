  cultures: [aramean]
  scope: >-
    The Aramaic-speaking peoples and states of Iron Age Syria and upper
    Mesopotamia (Aram-Damascus, Zobah, Arpad, Samʾal, Guzana and others).
    Covers their emergence, their relations with Israel, Assyrian conquest, and
    the biblical memory of Aramean ancestry.
  passages:
    - "Gen 22:20-24 | setting | Aram as a grandson of Nahor"
    - "Gen 25:20 | setting | Rebekah daughter of Bethuel the Aramean of Paddan-aram"
    - "Gen 31:47 | language | Laban names the cairn in Aramaic (Jegar-sahadutha), Jacob in Hebrew (Galeed)"
    - "Deut 26:5 | concept | 'A wandering Aramean was my father'"
    - "2Sam 8:3-12 | setting | David defeats Hadadezer of Zobah and the Arameans of Damascus"
    - "1Kgs 20 | setting | Ben-hadad's wars with Ahab"
    - "2Kgs 5 | setting | Naaman the Aramean commander"
