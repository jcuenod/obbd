- id: bozrah
  aliases: [Buseirah, Busayra]
  cultures: [edomite]
  scope: >-
    The Edomite capital at Buseirah in southern Jordan, a major centre in the
    eighth to sixth centuries BCE. Covers its acropolis buildings, its relation to
    Assyrian hegemony, and its role in prophetic oracles against Edom. Bostra in
    Syria is a different place.
  passages:
    - "Gen 36:33 | setting | Jobab son of Zerah of Bozrah, king of Edom"
    - "Isa 34:6 | setting | YHWH's sacrifice in Bozrah, slaughter in Edom"
    - "Isa 63:1 | imagery | The divine warrior comes from Bozrah in crimsoned garments"
    - "Jer 49:13, 22 | setting | Bozrah to become a horror and a desolation"
    - "Amos 1:12 | setting | Fire on Teman to devour Bozrah's strongholds"
  related: [edomites, qos, faynan, petra-and-sela, assyria, divine-warrior]
  wikipedia: Bozrah
  image: Buseirah Jordan excavations
  author_notes:
    - Crystal Bennett's excavations (1971-80) uncovered monumental acropolis buildings of the eighth or seventh to sixth centuries BCE in Assyrian-influenced style. Little earlier material was found.
    - Edomite kings (Qaus-malaka, Qaus-gabri) appear in Assyrian sources as vassals. Bozrah's floruit fits this period, which supports dating the prophetic references to it.
    - The 'kings of Edom' list in Gen 36 raises questions of dating against the late flourishing of Bozrah. Link to faynan for the early-Edom debate.
  sources_to_check:
    - Bienkowski (ed.), Busayra - Excavations by Crystal-M. Bennett 1971-1980 (2002)

- id: petra-and-sela
  aliases: [Sela, Selaʿ, Joktheel, Umm el-Biyara, as-Silaʿ]
  cultures: [edomite, arabian]
  scope: >-
    Biblical Sela ('the Rock'), an Edomite stronghold, and Petra, the later
    Nabataean capital, often wrongly equated with it. Covers the candidate sites for
    Sela (as-Silaʿ and Umm el-Biyara) and the Nabataean city as background to the
    New Testament.
  passages:
    - "2Kgs 14:7 | setting? | Amaziah takes Sela and renames it Joktheel"
    - "2Chr 25:11-12 | setting? | Edomite captives thrown from the top of 'the rock'"
    - "Isa 16:1 | setting? | Lambs sent from Sela by way of the desert"
    - "Isa 42:11 | setting | 'Let the inhabitants of Sela sing'"
    - "Jer 49:16 | language | Edom 'living in the clefts of the rock (selaʿ)'"
    - "Obad 3 | language | 'You who live in the clefts of the rock'"
    - "2Cor 11:32 | setting | King Aretas IV of Nabataea, ruling from Petra"
  related: [edomites, nabataeans, bozrah, qos, qedarites-and-arabs, nabonidus]
  wikipedia: Petra
  image: Petra Umm el-Biyara
  author_notes:
    - selaʿ is also a common noun, 'rock', so not every occurrence names a place. The candidates for Edomite Sela are as-Silaʿ near Tafila, which has a rock relief of Nabonidus, and Umm el-Biyara at Petra. Neither is certain.
    - Bennett's excavations at Umm el-Biyara found a seventh-century Edomite settlement and a seal impression of Qaus-gabri, king of Edom.
    - Petra's famous monuments are Nabataean (first century BCE to first century CE). Correct the popular conflation of Petra with Iron Age Edom's capital, which was Bozrah.
  sources_to_check:
