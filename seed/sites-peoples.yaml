    - "Dan 5:28-31 | setting | Kingdom given to the Medes and Persians; Darius the Mede (5:31 = MT 6:1)"
    - "Dan 6:8 | language | 'The law of the Medes and the Persians', which cannot be revoked (MT 6:9)"
    - "Dan 8:20 | setting | The two-horned ram: the kings of Media and Persia"
    - "Esth 1:3, 19 | setting | 'The army of Persia and Media'; laws of the Persians and the Medes"
    - "Ezra 6:2 | setting | Scroll found at Ecbatana in the province of Media"
  related: [persia, darius-the-mede, four-kingdoms-schema, fall-of-nineveh-chronicle, assyria, babylonia, cyrus-the-great]
  wikipedia: Medes
  image: Persepolis relief Median dignitary
  author_notes:
    - The Medes appear in Assyrian sources from Shalmaneser III. For much of the period they appear as many local 'city lords', not one state. Herodotus' Median empire (Deioces and his successors) has been questioned (Sancisi-Weerdenburg and others).
