- id: ezion-geber
  aliases: [Ezion-geber, Tell el-Kheleifeh, Elath]
  cultures: [judahite, edomite]
  scope: >-
    The port at the head of the Gulf of Aqaba from which Solomon's and Jehoshaphat's Red
    Sea ventures set out, and a station on the wilderness itinerary. The entry covers the
    unresolved identification (Tell el-Kheleifeh, Jeziret Faraʿun), the relation to Elath,
    and the dismantling of Glueck's 'Solomonic smelter'.
  passages:
    - "Num 33:35-36 | setting | A station on the wilderness itinerary before Kadesh"
    - "Deut 2:8 | setting | Israel passes Elath and Ezion-geber on the Arabah road"
    - "1Kgs 9:26-28 | setting | Solomon builds ships at Ezion-geber near Eloth; Hiram's sailors fetch gold from Ophir"
    - "2Chr 8:17-18 | setting | Solomon at Ezion-geber and Eloth on the shore in Edom"
    - "1Kgs 22:48 | setting | Jehoshaphat's ships wrecked at Ezion-geber (MT 22:49)"
    - "2Chr 20:35-37 | setting | Jehoshaphat's joint fleet with Ahaziah wrecked"
    - "2Kgs 14:22 | setting | Azariah rebuilds Elath and restores it to Judah"
    - "2Kgs 16:6 | setting | Elath lost to Edom (MT reads Aram; Qere 'Edomites')"
  related: [ophir, phoenician-seafaring, edomites, edomite-inscriptions, solomon, hiram-of-tyre, copper-production, timna]
  wikipedia: Ezion-Geber
  image: Tell el-Kheleifeh
  author_notes:
    - "Glueck excavated Tell el-Kheleifeh (1938-40), identified it as Ezion-geber, and interpreted its main building as a Solomonic copper smelter. He later withdrew the smelter interpretation himself. The building is now seen as a fort or storehouse, and its 'flues' as beam holes. Treat the 'Solomon's copper refinery' claim as a discredited misconception."
    - "Pratico's reappraisal of Glueck's records dates the occupation from the eighth to the fourth century BCE, with nothing clearly of the tenth century. Tell el-Kheleifeh may therefore be Elath, or an Edomite or Judahite fort, rather than Solomon's port. Jeziret Faraʿun (Coral Island), with its natural anchorage, is another proposal. Leave the identification open."
    - "Edomite material at Tell el-Kheleifeh includes the 'Qosʿanal, servant of the king' jar impressions and handmade 'Negebite' pottery. Link to edomite-inscriptions."
    - "The Red Sea trade in the Solomon and Jehoshaphat stories is plausible geographically, but its scale and date are debated. Connect to ophir and phoenician-seafaring rather than repeating that material."
    - "2 Kgs 16:6: MT reads 'Rezin king of Aram recovered Elath for Aram' with Qere 'Edomites' later in the verse; NRSV emends to Edom throughout. Explain this briefly."
  sources_to_check:
    - "G. D. Pratico, Nelson Glueck's 1938-1940 Excavations at Tell el-Kheleifeh: A Reappraisal (1993)"

