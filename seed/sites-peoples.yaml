- id: ararat-urartu
  aliases: [Urartu, Uruaṭri, Biainili, Kingdom of Van]
  cultures: [urartian]
  date: [-850, -590]
  circa: true
  scope: >-
    The Iron Age kingdom of Urartu around Lake Van, Assyria's northern rival,
    called Ararat in the Hebrew Bible. Covers Urartian history and culture in
    outline and the biblical references, including the 'mountains of Ararat' of
    the flood story.
  passages:
    - "Gen 8:4 | setting | The ark rests on 'the mountains of Ararat', a region rather than one peak"
    - "2Kgs 19:37 | setting | Sennacherib's assassins flee to the land of Ararat"
    - "Isa 37:38 | setting | Sennacherib's assassins flee to the land of Ararat"
    - "Jer 51:27 | setting | Ararat, Minni and Ashkenaz summoned against Babylon"
    - "Tob 1:21 | setting | Sennacherib's sons flee to the mountains of Ararat"
  related: [flood-traditions, gilgamesh-epic, sennacherib, esarhaddon, assyria, medes]
  wikipedia: Urartu
  image: Van Fortress Tushpa
  author_notes:
    - Hebrew ʾărārāṭ corresponds to Assyrian Urarṭu/Uruaṭri. The kingdom, which called itself Biainili, had its capital at Tushpa (Van). It spoke Urartian, a language related to Hurrian, and rivalled Assyria in the ninth to seventh centuries.
    - Gen 8:4 names a mountainous region. The identification with the volcano Ağrı Dağı ('Mount Ararat') is much later. Other traditions locate the landing at Jebel Judi (Syriac and Qurʾan), and Gilgamesh XI has Mount Nimush.
    - Correct claims of discovering the ark (e.g. the Durupınar formation) as pseudo-archaeology.
    - Urartu ended in the early sixth century, probably under Median or Scythian pressure (the details are debated).
  sources_to_check:
    - Zimansky, Ecology and Empire - The Structure of the Urartian State (1985)

