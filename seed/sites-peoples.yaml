    - "1Sam 17:12 | setting | Jesse the Ephrathite of Bethlehem"
    - "2Sam 23:14-17 | setting | Philistine garrison; water from the well of Bethlehem"
    - "Mic 5:2 | concept | A ruler from Bethlehem Ephrathah (MT 5:1)"
    - "Matt 2:1-16 | setting | Jesus' birth, the magi and the slaughter of infants"
    - "Luke 2:4-15 | setting | Joseph goes to Bethlehem, the city of David"
    - "John 7:42 | concept | Expectation that the Messiah comes from Bethlehem"
  related: [david, messianic-expectations, census-of-quirinius, herod-the-great, seals-and-bullae, amarna-letters]
  wikipedia: Bethlehem
  image: Church of the Nativity Bethlehem
  author_notes:
    - A fiscal bulla reading 'Bethlehem' (bt lḥm), found in 2012 in the City of David, is the first extrabiblical Iron Age attestation. A reading of Bethlehem in Amarna letter EA 290 has been proposed but is disputed.
    - Iron Age remains at Bethlehem itself are limited. The Church of the Nativity (Constantinian, rebuilt under Justinian) stands over a cave tradition attested by Justin Martyr.
    - The historicity of Jesus' birth at Bethlehem is debated among New Testament scholars, given the theological use of Mic 5:2 and the differences between Matthew and Luke. Present the views evenly.
    - Bethlehem of Zebulun (Josh 19:15) has been proposed as an alternative birthplace, but this is a minority view.
  sources_to_check:
