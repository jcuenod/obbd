- id: amorites
  aliases: [Amurru, MAR.TU]
  cultures: [amorite]
  scope: >-
    The West Semitic 'westerners' (Akkadian Amurrum) of third- and
    second-millennium Mesopotamia and Syria, the Late Bronze kingdom of Amurru,
    and the biblical Amorites as a pre-Israelite people. Covers how the term's
    meaning shifts across sources.
  passages:
    - "Gen 10:16 | setting | Amorites among Canaan's descendants"
    - "Gen 14:13 | setting | Mamre the Amorite, Abram's ally"
    - "Gen 15:16 | concept | 'The iniquity of the Amorites is not yet complete'"
    - "Num 13:29 | setting | Amorites in the hill country"
    - "Num 21:21-35 | setting | Sihon and Og, kings of the Amorites"
    - "Josh 10:5 | setting | Five kings of the Amorites"
    - "Josh 24:15 | setting | 'The gods of the Amorites in whose land you are living'"
    - "Ezek 16:3, 45 | setting | 'Your father was an Amorite'"
    - "Amos 2:9-10 | imagery | Amorites tall as cedars and strong as oaks"
  related: [mari-letters, mari, canaanites, hammurabi, rephaim, hyksos]
  wikipedia: Amorites
  image: Investiture of Zimri-Lim painting
  author_notes:
    - In the third millennium MAR.TU / Amurrum referred to West Semitic pastoral groups. Many Old Babylonian dynasties, including Hammurabi's and Zimri-Lim's, were of Amorite descent.
    - The Late Bronze kingdom of Amurru (Abdi-Ashirta, Aziru) appears in the Amarna letters and Hittite treaties. Later, Assyrian 'Amurru' means the west in general.
    - Biblical usage varies. 'Amorite' can mean a hill-country people, the Transjordanian kingdoms, or a general name for the pre-Israelite population. Some correlate the 'Amorite' and 'Canaanite' labels with different sources.
    - The 'Amorite hypothesis', which placed the patriarchs within Middle Bronze Amorite migrations (Albright), is outdated.
  sources_to_check:
    - ABD, s.v. "Amorites"

- id: hittites-and-hethites
  aliases: [Hittites, Sons of Heth, Hatti, Neo-Hittites]
  cultures: [hittite, luwian]
  scope: >-
    The Hittites of the Bible and their possible referents: the Late Bronze
    Hittite empire of Anatolia, the Iron Age Neo-Hittite states of Syria, and the
    'sons of Heth' living in Canaan in Genesis. The entry sets out how these
    relate and where the biblical usage fits.
  passages:
    - "Gen 15:20 | setting | Hittites in the list of peoples of the land"
    - "Gen 23:3-20 | setting | Abraham buys Machpelah from Ephron and the 'sons of Heth'"
    - "Gen 26:34; 27:46 | setting | Esau's Hittite wives"
    - "Num 13:29 | setting | Hittites in the hill country"
    - "Josh 1:4 | language | 'All the land of the Hittites', cf. Assyrian māt Ḫatti for Syria-Palestine"
    - "2Sam 11:3 | setting | Uriah the Hittite"
    - "1Kgs 10:28-29 | setting | Horses and chariots exported to the kings of the Hittites and Aram"
    - "1Kgs 11:1 | setting | Hittite women among Solomon's wives"
    - "2Kgs 7:6 | setting | Arameans fear the kings of the Hittites and of Egypt"
    - "Ezek 16:3, 45 | setting | 'Your mother was a Hittite'"
  related: [hittite-vassal-treaties, hittite-laws, egyptian-hittite-peace-treaty, kadesh-battle-reliefs, carchemish, hamath, covenant-and-treaty-form, hurrians-and-horites]
  wikipedia: Hittites
  image: Hattusa Lion Gate
  author_notes:
    - Distinguish three referents. (1) The Late Bronze Hittite empire centred at Hattusa (c. 1650-1180 BCE). (2) The Iron Age Neo-Hittite (Luwian and Luwian-Aramean) states such as Carchemish and Hamath, the 'kings of the Hittites' in Kings and the 'Hatti' of Assyrian texts. (3) The 'sons of Heth' in Canaan (Gen 23), whose names are Semitic, probably a literary or local category rather than Anatolian Hittites.
    - Mendenhall's comparison of Hittite vassal treaties with biblical covenant form remains important but is debated against the Neo-Assyrian treaties. Cross-refer the treaty entries.
    - The Yahwistic name of Uriah 'the Hittite' leaves his ethnicity uncertain.
  sources_to_check:
    - Bryce, The Kingdom of the Hittites (new ed., 2005)
    - Collins, The Hittites and Their World (2007)

- id: hurrians-and-horites
  aliases: [Hurrians, Horites, Mitanni, Hurri]
  cultures: [hurrian]
  scope: >-
    The Hurrians, a non-Semitic people of northern Mesopotamia and Syria
    (Urkesh, Mitanni, Nuzi, Alalakh), and the biblical Horites of Seir. Covers
    Hurrian history and influence in the Levant and the debated equation of
    Horites (and Hivites) with Hurrians.
  passages:
    - "Gen 14:6 | setting | Horites in the hill country of Seir"
    - "Gen 36:20-30 | setting | Genealogy of Seir the Horite"
    - "Deut 2:12, 22 | setting | Horites displaced from Seir by Esau's descendants"
    - "Gen 34:2 | setting? | Hamor 'the Hivite' (LXX: Horite)"
    - "Josh 9:7 | setting? | Gibeonites as Hivites (LXX: Horites)"
  related: [nuzi-texts, amarna-letters, edomites, hittites-and-hethites, teraphim, adoption]
  wikipedia: Hurrians
  image: Urkesh Tish-atal foundation lion
  author_notes:
    - The Hurrians are attested from the late third millennium (Urkesh). Mitanni was a major power in the fifteenth and fourteenth centuries; Tushratta's Amarna letters are an example. Hurrian personal and divine names occur in Late Bronze Canaan, as in Abdi-Heba of Jerusalem, and Egyptian 'Ḫurru' can denote Syria-Palestine.
    - The equation Horite = Hurrian is debated. The Horites of Gen 36 bear Semitic names, and some read ḥōrî as 'cave dweller' or a local group name. Some link the Hivites with Hurrians instead. The LXX evidence should be checked verse by verse.
    - Nuzi-based explanations of patriarchal customs (Speiser, Gordon) were largely refuted by Thompson and Van Seters in the 1970s. Present them historiographically.
  sources_to_check:
    - Wilhelm, The Hurrians (1989)

- id: philistines
  aliases: [Peleset, Pelishtim, Pentapolis]
  cultures: [philistine]
  date: [-1175, -604]
  circa: true
  scope: >-
    The people of the southern coastal plain whose five cities (Gaza, Ashkelon,
    Ashdod, Ekron, Gath) were Israel's western neighbours and rivals. Covers their
    Egyptian and Assyrian attestations, Aegean-linked material culture and its
    development, language and religion, and the biblical portrait.
  passages:
    - "Gen 26:1-18 | setting | Isaac and Abimelech, 'king of the Philistines' at Gerar (anachronistic)"
    - "Josh 13:2-3 | language | The five 'lords' (sĕrānîm), a title probably of non-Semitic origin"
    - "Judg 13-16 | setting | The Samson cycle"
    - "1Sam 4-6 | setting | Capture and return of the ark"
    - "1Sam 13:19-22 | realia | Philistine control of smithing"
    - "1Sam 17:4-7 | realia? | Goliath's armour, a mixture of Aegean and other elements"
    - "1Sam 31 | setting | Saul's death on Gilboa"
    - "Amos 9:7 | setting | Philistines brought from Caphtor"
    - "Jer 47:4 | setting | 'The remnant of the coastland of Caphtor'"
  related: [sea-peoples, medinet-habu-sea-peoples, gath, ekron, ashkelon, ashdod, pig-avoidance, dagon]
  wikipedia: Philistines
  image: Medinet Habu Peleset relief
  author_notes:
    - The Peleset appear in Ramesses III's Medinet Habu inscriptions (Year 8). Assyrian texts call them Palastu or Pilistu, the source of the name Palestine.
    - Aegean-style material culture appears from the early twelfth century, including locally made Mycenaean IIIC pottery, hearths, pig consumption and loom weights. This was quickly entangled with local Canaanite culture. Present the aDNA results from Ashkelon (2019) with care.
    - The 'Philistines' of Gen 21 and 26 are anachronistic.
    - Few Philistine-language texts survive. Names such as Achish (Ikausu) and the title seren (cf. Greek tyrannos) are suggestive. The Ekron inscription is in a Phoenician-type script and language.
    - Goliath's armour has been read as Aegean (Yadin) or as a composite reflecting later, perhaps seventh-century, hoplite equipment (Finkelstein).
  sources_to_check:
    - Dothan, The Philistines and Their Material Culture (1982)
    - Killebrew, Biblical Peoples and Ethnicity (2005)

- id: sea-peoples
  aliases: [Peoples of the Sea]
  cultures: [philistine, egyptian]
  date: [-1210, -1170]
  circa: true
  scope: >-
    The groups called 'Sea Peoples' in modern scholarship, after Egyptian texts
    of Merneptah and Ramesses III that describe invaders 'from the islands'.
    Covers the sources, the groups named, and their role in the Late Bronze
    Age collapse and in the settlement of the Philistines and others on the
    Levantine coast.
  passages:
    - "Gen 10:14 | setting | Caphtorim in the Table of Nations (the Philistine clause is probably misplaced)"
    - "Deut 2:23 | setting | Caphtorim from Caphtor destroy the Avvim as far as Gaza"
    - "Amos 9:7 | setting | Philistines brought from Caphtor"
    - "Jer 47:4 | setting | Philistines, 'the remnant of the coastland of Caphtor'"
    - "Ezek 25:16 | setting | Cherethites (Cretans?) and the remnant of the seacoast"
    - "Zeph 2:5 | setting | 'Nation of the Cherethites' on the seacoast"
    - "2Sam 8:18 | setting? | Cherethites and Pelethites in David's guard"
    - "Josh 17:11 | setting | Dor, a Tjeker (Sikil) town in the Report of Wenamun"
  related: [philistines, medinet-habu-sea-peoples, report-of-wenamun, merneptah-stele, ugarit, hittites-and-hethites]
  wikipedia: Sea Peoples
  image: Medinet Habu Sea Peoples naval battle relief
  author_notes:
    - The term is modern (Maspero). The Egyptian sources are Merneptah's Libyan war texts and the Ramesses III Year 8 inscriptions and reliefs at Medinet Habu. They name the Peleset, Tjeker (Sikil), Shekelesh, Denyen, Weshesh, Sherden, Lukka and Ekwesh.
    - The Late Bronze collapse had many causes (drought, systems collapse, earthquakes, migration). Avoid a single-cause story in which the Sea Peoples destroyed everything.
    - Sherden appear earlier as Egyptian mercenaries (e.g. in the Kadesh reliefs). The proposed link between the Denyen and the tribe of Dan (Yadin) is speculative.
    - Ugarit's final letters about enemy ships are often cited. Cross-refer ugarit.
  sources_to_check:
    - Killebrew and Lehmann (eds.), The Philistines and Other 'Sea Peoples' in Text and Archaeology (2013)

