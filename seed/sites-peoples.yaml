- id: gath
  aliases: [Tell es-Safi, Tel Zafit, Gimti]
  cultures: [philistine, canaanite]
  scope: >-
    Philistine Gath, identified with Tell eṣ-Ṣafi at the edge of the Shephelah, the
    largest Philistine city in the early Iron Age. Covers its Bronze Age
    background, its Philistine material culture, the Aramean siege, and its later
    decline.
  passages:
    - "Josh 11:22 | setting | Anakim remain in Gaza, Gath and Ashdod"
    - "1Sam 5:8-9 | setting | The ark brought to Gath; plague follows"
    - "1Sam 17:4 | language? | Goliath of Gath; cf. the names ʾLWT and WLT on a sherd from the site"
    - "1Sam 21:10-15 | setting | David feigns madness before Achish of Gath (MT 21:11-16)"
    - "1Sam 27:2-12 | setting | David as Achish's vassal at Ziklag"
    - "2Sam 15:18 | setting | Ittai and the Gittites in David's guard"
    - "2Kgs 12:17 | attests | Hazael takes Gath; siege trench and late-ninth-century destruction (MT 12:18)"
    - "Amos 6:2 | attests | 'Go down to Gath of the Philistines', a city already fallen"
    - "Mic 1:10 | setting | 'Tell it not in Gath'"
  related: [philistines, hazael, ekron, ashdod, champion-combat, khirbet-qeiyafa, horned-altars, sea-peoples]
  wikipedia: Tell es-Safi
  image: Tell es-Safi Gath excavations
  author_notes:
    - Maeir's long-running excavations (from 1996) have made the identification with Tell eṣ-Ṣafi widely accepted. Gath was the largest Philistine city in the tenth and ninth centuries.
    - A siege trench around the tell and a destruction of c. 830 BCE are attributed to Hazael (2 Kgs 12:17). Gath's absence from the eighth-century lists in Amos 1:6-8 and Zeph 2:4 fits its decline.
    - The early Iron IIA sherd with the names ʾLWT and WLT shows names of non-Semitic type comparable to 'Goliath'. It is not a reference to Goliath himself, and the press framing should be corrected.
    - Other finds include a two-horned altar and Philistine temple remains. Amarna-period Gimti (ruler Shuwardata) is probably Gath.
  sources_to_check:
    - NEAEHL
    - Maeir (ed.), Tell es-Safi/Gath I - The 1996-2005 Seasons (2012)

