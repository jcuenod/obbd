  related: [philistines, dagon, sargon-ii, sargon-ii-inscriptions, sea-peoples, gaza]
  wikipedia: Ashdod
  image: Ashdoda figurine
  author_notes:
    - M. Dothan's excavations (1962-72) revealed Philistine strata with locally made Mycenaean IIIC pottery and the 'Ashdoda' figurine, a female figure merged with a throne.
    - Fragments of a basalt victory stele of Sargon II were found at the site, confirming the campaign of Isa 20. The revolt of Yamani is known from Sargon's inscriptions.
    - Ashdod became the seat of an Assyrian province and later of a Persian-period province, which is the context of Neh 13:24.
    - No temple of Dagon has been identified archaeologically. Dagon as a Philistine god is known mainly from biblical and later sources.
