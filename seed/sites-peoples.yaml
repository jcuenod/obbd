    - "Zech 9:5 | setting | Ashkelon shall see it and be afraid"
  related: [philistines, sea-peoples, nebuchadnezzar-ii, nebuchadnezzar-chronicle, ethnicity-and-material-culture, merneptah-stele, phoenicians]
  wikipedia: Ashkelon
  image: Ashkelon Canaanite gate
  author_notes:
    - The Leon Levy Expedition (Stager, then Master, 1985-2016) exposed a Middle Bronze rampart and mudbrick arched gate, an early Philistine settlement with Aegean-style pottery and pig consumption, and a dramatic 604 destruction.
    - The Philistine cemetery (eleventh to eighth centuries) and an aDNA study (Feldman et al., Science Advances, 2019) showed a European-related genetic component in early Iron Age individuals that was diluted later. Avoid the headline claim that DNA 'proved' a migration.
    - The Babylonian Chronicle dates Nebuchadnezzar's capture of Ashkelon to Kislev of his first year (604). Ashkelon also appears in the Merneptah Stele and in Sennacherib's deposition of Sidqa.
  sources_to_check:
    - NEAEHL
    - Stager, Schloen and Master (eds.), Ashkelon 1 - Introduction and Overview (1985-2006) (2008)

- id: ashdod
  aliases: [Tel Ashdod, Azotus, Ashdod-Yam]
  cultures: [philistine]
  scope: >-
    The Philistine city of Ashdod on the southern coastal plain and its port at
