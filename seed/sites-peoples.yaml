  author_notes:
    - Excavated by the Israel Antiquities Authority (2012-13, with Kisilevitz among the directors), followed by a joint expedition with Tel Aviv University (Kisilevitz and Lipschits). The temple was built in Iron IIA (early ninth century or earlier) and rebuilt later. Verify its end date in recent publications.
