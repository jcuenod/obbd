- id: jezreel
  aliases: [Tel Jezreel, Zerʿin]
  cultures: [israelite]
  scope: >-
    The Omride royal enclosure at Tel Jezreel overlooking the Jezreel Valley, and
    the town associated with Ahab, Jezebel and Jehu's coup. Covers the
    ninth-century compound, its role in chronology debates, and the agricultural
    installations around the tell.
  passages:
    - "1Sam 29:1 | setting | Israel camps by the fountain in Jezreel"
    - "1Kgs 18:45-46 | setting | Ahab rides to Jezreel with Elijah running ahead"
    - "1Kgs 21 | setting | Naboth's vineyard beside Ahab's palace"
    - "2Kgs 9:14-37 | setting | Jehu kills Joram and Jezebel at Jezreel"
    - "2Kgs 10:1-11 | setting | Heads of Ahab's sons piled at the gate of Jezreel"
    - "Hos 1:4-5 | setting | 'The blood of Jezreel' punished on the house of Jehu"
  related: [ahab, jezebel, jehu, omri, tel-dan-stele, samaria, winepresses, low-chronology-debate]
  wikipedia: Tel Jezreel
  image: Tel Jezreel
  author_notes:
    - Ussishkin and Woodhead (1990-96) excavated a large rectangular enclosure with casemate walls, corner towers and a rock-cut moat. It was short-lived and of the ninth century. Its pottery is a fixed point for the low chronology debate, since it matches strata elsewhere once dated to Solomon.
    - The destruction of the enclosure has been linked to Hazael or to Jehu's coup. Both are inferences.
    - The renewed Jezreel Expedition (from 2013) documented rock-cut wine presses and agricultural installations near the tell. Any link to Naboth's vineyard is evocative, not evidential.
    - Its function as a military or chariot base for the Omrides is a hypothesis.

- id: tirzah
  aliases: [Tell el-Farʿah (North)]
  cultures: [israelite]
  scope: >-
    The early capital of the northern kingdom before Omri moved to Samaria,
    usually identified with Tell el-Farʿah (North) northeast of Nablus. Covers the
    identification, de Vaux's excavations and the Iron Age town.
  passages:
    - "Num 26:33 | language | Tirzah as a daughter of Zelophehad, a clan and place name"
    - "Josh 12:24 | setting | King of Tirzah in the list of defeated kings"
    - "1Kgs 14:17 | setting | Jeroboam's wife returns to Tirzah"
    - "1Kgs 15:21, 33 | setting | Baasha reigns at Tirzah"
    - "1Kgs 16:8-23 | setting | Zimri burns the palace; Omri reigns six years at Tirzah"
    - "2Kgs 15:14-16 | setting | Menahem comes up from Tirzah"
    - "Song 6:4 | imagery | The beloved 'beautiful as Tirzah, comely as Jerusalem'"
  related: [omri, samaria, shechem, four-room-house, low-chronology-debate]
  wikipedia: Tirzah (ancient city)
  image: Tell el-Far'ah North
  author_notes:
    - De Vaux excavated the site in 1946-60. The identification with Tell el-Farʿah (North), proposed by Albright, is widely accepted.
    - De Vaux linked an unfinished building phase to Omri's move to Samaria (1 Kgs 16:23-24). This interpretation and the dating of the Iron Age phases are debated in the light of the low chronology.
    - Iron Age houses (including four-room houses) and de Vaux's argument for growing social stratification in the eighth century are relevant to prophetic social critique. The site also has major Chalcolithic and Early Bronze remains.
  sources_to_check:
    - NEAEHL

- id: tarshish
  aliases: [Tartessos (proposed), Ships of Tarshish]
  cultures: [phoenician]
  scope: >-
    The distant western source of silver and metals reached by 'ships of
    Tarshish', and the byword for the far end of the sea. Covers the proposed
    identifications, the Phoenician metals trade, and the biblical usage of
    'ships of Tarshish' as a class of ship.
  passages:
    - "Gen 10:4 | setting | Tarshish among the sons of Javan"
    - "1Kgs 10:22 | realia | 'Ships of Tarshish' bringing gold, silver, ivory, apes and peacocks"
    - "1Kgs 22:48 | realia | Jehoshaphat's ships of Tarshish wrecked at Ezion-geber (MT 22:49)"
    - "Ps 72:10 | setting | Kings of Tarshish and the isles bring tribute"
    - "Isa 2:16 | realia | Ships of Tarshish as symbols of pride"
    - "Isa 23:1-14 | setting | 'Wail, O ships of Tarshish' over Tyre"
    - "Jer 10:9 | realia | Beaten silver brought from Tarshish"
    - "Ezek 27:12 | realia | Tarshish trades silver, iron, tin and lead with Tyre"
    - "Jonah 1:3 | setting | Jonah flees toward Tarshish, the far west"
    - "Isa 66:19 | setting | Tarshish among the distant nations"
  related: [phoenicians, phoenician-seafaring, tyre, ophir, table-of-nations, nora-stone]
  wikipedia: Tarshish
  image: Phoenician ship relief Nineveh Luli
  author_notes:
    - The leading proposal is Tartessos in southwestern Iberia. Others include Sardinia (a reading of the Nora Stone is debated), Tarsus in Cilicia (Josephus) and a generic 'far west'. An Esarhaddon inscription names Tarsisi among lands of the sea (verify the text).
    - Lead-isotope studies of silver hoards from the southern Levant point to Iberian and Sardinian sources from the tenth or ninth century BCE (Eshel et al., PNAS 2019; verify). This supports early Phoenician western trade.
    - The phrase 'ship of Tarshish' probably denotes a type of long-haul ship. Chronicles reinterprets it as ships sailing to Tarshish from Ezion-geber (2 Chr 9:21; 20:36), which is geographically impossible for a western Tarshish.
  sources_to_check:
    - Aubet, The Phoenicians and the West (2nd ed., 2001)

- id: ophir
  aliases: [Gold of Ophir]
  cultures: [arabian]
  scope: >-
    The unlocated land famed for fine gold, reached by Solomon's and Hiram's Red
    Sea fleet. Covers the biblical evidence, the Tell Qasile ostracon, and the
    proposed locations.
  passages:
    - "Gen 10:29 | setting | Ophir among the sons of Joktan, with South Arabian names"
    - "1Kgs 9:26-28 | setting | Solomon and Hiram's fleet sails from Ezion-geber to Ophir"
    - "1Kgs 10:11 | realia | Gold, almug wood and precious stones from Ophir"
    - "1Kgs 22:48 | setting | Jehoshaphat's ships fail to reach Ophir (MT 22:49)"
    - "1Chr 29:4 | realia | Gold of Ophir given for the temple"
    - "Job 28:16 | language | 'Gold of Ophir' as a byword for the finest gold"
    - "Ps 45:9 | imagery | The queen in gold of Ophir (MT 45:10)"
    - "Isa 13:12 | imagery | Humans made rarer than the gold of Ophir"
  related: [tell-qasile-ostracon, sheba, tarshish, phoenician-seafaring, hiram-of-tyre, solomon, diplomatic-gift-exchange]
  wikipedia: Ophir
  image: Tell Qasile ostracon gold of Ophir
  author_notes:
    - The location is unknown. Candidates include southwestern Arabia, the Horn of Africa (linked with Egyptian Punt) and India (LXX Sōphira; Josephus). No archaeological identification exists.
    - The Tell Qasile ostracon ('gold of Ophir to Beth-horon, 30 shekels'; eighth century) shows that 'Ophir gold' was a recognized grade or origin of gold.
    - Nineteenth-century identifications of Ophir with Great Zimbabwe, and later ones with the Americas, are colonial-era or fringe curiosities. Mention them only as misconceptions.

- id: sheba
  aliases: [Saba, Sabaeans, Queen of the South]
  cultures: [arabian]
  date: [-800, 275]
  circa: true
  scope: >-
    The South Arabian kingdom of Saba centred on Marib in Yemen, a major supplier
    of frankincense and myrrh, and its portrayal in the Bible, above all in the
    visit of the queen of Sheba. Covers Sabaean history and inscriptions in
    outline and distinguishes Sheba from Seba and North Arabian groups.
  passages:
    - "Gen 10:7, 28 | setting | Sheba as both a Cushite and a Joktanite name"
    - "1Kgs 10:1-13 | setting | The queen of Sheba's visit to Solomon"
    - "Job 1:15 | setting | Sabeans raid Job's herds"
    - "Job 6:19 | setting | 'The caravans of Sheba'"
    - "Ps 72:10, 15 | setting | Kings of Sheba bring gifts; gold of Sheba"
    - "Isa 60:6 | realia | Camels from Sheba bringing gold and frankincense"
    - "Jer 6:20 | realia | Frankincense from Sheba"
    - "Ezek 27:22-23 | setting | Merchants of Sheba trade spices, gems and gold with Tyre"
