- id: khirbet-qeiyafa
  aliases: [Elah Fortress, Shaaraim (proposed)]
  cultures: [hebrew]
  date: [-1020, -980]
  circa: true
  scope: >-
    A short-lived fortified town above the Elah Valley, dated by radiocarbon to the
    late eleventh or early tenth century BCE. Covers its casemate wall and two gates,
    the cult rooms and shrine models, the ostracon, and the debate over who built it.
  passages:
    - "1Sam 17:1-3 | setting | Philistines and Israelites face each other across the Elah Valley"
    - "1Sam 17:52 | setting? | Philistines flee 'on the way from Shaaraim', a proposed identification"
    - "Josh 15:36 | setting? | Shaaraim ('two gates') in the Shephelah list; Garfinkel's identification"
    - "1Kgs 6:4-5 | realia? | Recessed frames on a stone shrine model compared to temple windows"
  related: [low-chronology-debate, philistines, gath, champion-combat, ethnicity-and-material-culture, david, city-gates, pig-avoidance]
  wikipedia: Khirbet Qeiyafa
  image: Khirbet Qeiyafa gate
  author_notes:
    - Excavated by Garfinkel and Ganor (2007-13). It is essentially a single-period site, with radiocarbon dates of c. 1020-980 BCE. A casemate wall with houses built into it and two gates are its defining features.
    - Who built it is debated. Proposals include early Judah or David (excavators), a Saulide or northern polity (Finkelstein, Na'aman), and Philistine or Canaanite groups. The absence of pig bones and the cult objects are used on several sides.
    - The Shaaraim identification is attractive but not certain, and other identifications have been proposed.
    - The ostracon's language (Hebrew vs. a generic Canaanite) and content are contested. Several incompatible readings exist, so avoid calling it the 'earliest Hebrew inscription' without qualification.
