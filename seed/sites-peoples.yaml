- id: assyria
  aliases: [Neo-Assyrian Empire, Asshur, Aššur]
  cultures: [assyrian]
  date: [-911, -609]
  scope: >-
    The Neo-Assyrian Empire (911-609 BCE), which dominated the Levant from the
    ninth century, destroyed Israel and made Judah a vassal. Covers its history,
    sources, imperial ideology and administration, and its imprint on the Hebrew
    Bible; earlier Assyrian history is treated briefly.
  passages:
    - "Gen 10:11-12 | setting | Asshur, Nineveh and Calah in the Table of Nations"
    - "2Kgs 15:19-20, 29 | setting | Tiglath-pileser III (Pul) takes tribute and deports Galilee"
    - "2Kgs 16:7-18 | setting | Ahaz becomes a vassal of Assyria"
    - "2Kgs 17:1-24 | setting | Fall of Samaria and Assyrian resettlement"
    - "2Kgs 18:13-19:37 | setting | Sennacherib's campaign against Judah"
    - "Isa 10:5-19 | concept | Assyria, the rod of YHWH's anger, and its arrogant king"
    - "Hos 5:13 | setting | Ephraim turns to Assyria"
    - "Jonah 3 | setting | Repentance of Nineveh"
    - "Nah 3 | setting | Doom of Nineveh"
    - "Zeph 2:13-15 | setting | Assyria and Nineveh made desolate"
  related: [tiglath-pileser-iii, sennacherib, sargon-ii, ashurbanipal, nineveh, assyrian-siege-warfare, deportation, esarhaddon-succession-treaty]
  wikipedia: Neo-Assyrian Empire
  image: Ashurnasirpal II relief Nimrud
  author_notes:
    - Distinguish Old, Middle and Neo-Assyrian Assyria. The Neo-Assyrian heartland cities were Ashur, Nimrud (Kalḫu), Khorsabad (Dur-Sharrukin) and Nineveh.
    - Assyrian sources give rich synchronisms. They name Ahab (853), Jehu (841), Joash, Menahem, Pekah, Hoshea, Ahaz, Hezekiah and Manasseh. The eponym list, anchored by the eclipse of 763, underlies biblical chronology.
    - Assyrian imperial ideology and treaty language (especially Esarhaddon's Succession Treaty) are widely seen as shaping Deuteronomy and First Isaiah. Present this as a major consensus line with variants.
    - Deportation worked in both directions. Its scale and demographic effects are debated.
    - The empire fell with Ashur (614), Nineveh (612) and Harran (610-609).
  sources_to_check:
    - Radner, Ancient Assyria - A Very Short Introduction (2015)
    - Frahm (ed.), A Companion to Assyria (2017)

