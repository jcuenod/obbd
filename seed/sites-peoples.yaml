  related: [yhwh-origins, shasu, timna, camels-and-domestication, edomites, amalekites, qedarites-and-arabs]
  wikipedia: Midian
  image: Qurayyah painted pottery
  author_notes:
    - Midian is generally located in the northern Hejaz, east of the Gulf of Aqaba. Qurayyah painted ware (thirteenth to twelfth centuries), found also at Timna and elsewhere in the Arabah, is often called 'Midianite pottery'.
    - The Midianite-Kenite hypothesis (Budde, Rowley, Blenkinsopp and others) traces YHWH worship to southern groups. It is debated but well within the mainstream. Cross-refer yhwh-origins and shasu.
    - Midianites are also called Ishmaelites (Gen 37; Judg 8:24). Their camels (Judg 6:5) raise questions of date in the light of camel domestication.
    - The etymological link of qênî to 'smith' (cf. Gen 4:22) is suggestive, not proven.
  sources_to_check:
