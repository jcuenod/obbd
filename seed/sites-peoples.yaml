  passages:
    - "2Sam 5:11 | setting | Hiram of Tyre sends cedar and craftsmen to David"
    - "1Kgs 5:1-12 | setting | Hiram and Solomon's timber agreement (MT 5:15-26)"
    - "1Kgs 9:11-14 | setting | Solomon cedes the land of Cabul to Hiram"
    - "Isa 23 | setting | Oracle against Tyre and Sidon"
    - "Amos 1:9-10 | setting | Tyre's breach of the 'covenant of kinship'"
    - "Ezek 26-28 | setting | Oracles against Tyre: siege, lament over the ship, the king of Tyre"
    - "Ezek 29:17-20 | setting | Nebuchadnezzar's long siege of Tyre without reward"
    - "Joel 3:4-8 | setting | Tyre and Sidon sell Judeans to the Greeks (MT 4:4-8)"
    - "Mark 7:24-31 | setting | Jesus in the region of Tyre"
    - "Acts 21:3-7 | setting | Paul's ship unloads at Tyre"
  related: [phoenicians, hiram-of-tyre, melqart, phoenician-seafaring, purple-dye, nebuchadnezzar-ii, sidon, tarshish]
  wikipedia: Tyre, Lebanon
  image: Tyre Al-Mina archaeological site
  author_notes:
    - Tyre was an island until Alexander's mole (332 BCE) joined it to the mainland. Its Iron Age levels are known mainly from Bikai's small sounding (1973-74) and from the cemetery at al-Bass on the mainland.
    - Its history comes largely from Assyrian sources (tribute to Shalmaneser III; Esarhaddon's treaty with Baal of Tyre), Josephus' Tyrian king list (via Menander), and the thirteen-year Babylonian siege.
    - The 'king of Tyre' oracle (Ezek 28) uses Eden and divine-mountain mythology. Do not read it as background for a fall of Satan.
    - The Tyrian shekel was the standard silver coin for the temple tax in the Roman period.
  sources_to_check:
    - Aubet, The Phoenicians and the West (2nd ed., 2001)

- id: sidon
  aliases: [Ṣidon, Saida]
  cultures: [phoenician]
  scope: >-
    The Phoenician city of Sidon on the Lebanese coast. Covers its Bronze Age
    remains, its Iron Age history under Assyria, its Persian-period royal dynasty
    and Eshmun sanctuary, and the use of 'Sidonians' as a general term for
    Phoenicians.
  passages:
    - "Gen 10:15, 19 | setting | Sidon as Canaan's firstborn; border of the Canaanites"
    - "Judg 18:7, 28 | setting | Laish lived 'after the manner of the Sidonians'"
    - "1Kgs 5:6 | language | 'No one among us knows how to cut timber like the Sidonians' (MT 5:20)"
    - "1Kgs 16:31 | setting | Jezebel daughter of Ethbaal, king of the Sidonians"
    - "1Kgs 17:9 | setting | Zarephath, which belongs to Sidon"
    - "Isa 23:2-4, 12 | setting | Oracle on Sidon's merchants and 'virgin daughter Sidon'"
    - "Ezek 28:20-23 | setting | Oracle against Sidon"
    - "Matt 15:21 | setting | Jesus withdraws to the district of Tyre and Sidon"
    - "Acts 27:3 | setting | Paul allowed to visit friends at Sidon"
  related: [phoenicians, eshmunazar-sarcophagus, tyre, jezebel, ahab, astarte, phoenician-seafaring]
  wikipedia: Sidon
  image: Temple of Eshmun Sidon
  author_notes:
    - In the Hebrew Bible and in Homer, 'Sidonians' often means Phoenicians in general. Ethbaal (Ittobaal) of 1 Kgs 16:31 was king of Tyre according to Josephus.
    - Sennacherib drove out Luli in 701. Esarhaddon destroyed Sidon c. 677 and founded Kar-Esarhaddon.
    - In the Persian period Sidon flourished under a royal dynasty (sarcophagi of Tabnit and Eshmunazar II). The Eshmun temple at Bustan esh-Sheikh yielded the Bodashtart inscriptions.
    - British Museum excavations at the 'College site' (Doumet-Serhal) have produced important Bronze Age burials.
  sources_to_check:
    - Aubet, The Phoenicians and the West (2nd ed., 2001)

- id: byblos
  aliases: [Gebal, Gubla, Jbeil]
  cultures: [phoenician, egyptian]
  scope: >-
    The ancient port of Byblos (Gebal) north of Beirut, a city with close
    Egyptian ties from the third millennium and an early centre of Phoenician
    royal inscriptions. Covers its temples and its role in the timber and papyrus
    trade.
  passages:
    - "Josh 13:5 | setting | 'The land of the Gebalites' among the unconquered lands"
    - "1Kgs 5:18 | setting | Gebalites help prepare timber and stone for the temple (MT 5:32)"
    - "Ezek 27:9 | setting | Elders of Gebal as caulkers of Tyre's ship"
    - "Matt 1:1 | language | Greek biblos 'book', from byblos 'papyrus', linked to the city's trade"
  related: [ahiram-sarcophagus, report-of-wenamun, amarna-letters, phoenicians, writing-materials, phoenician-seafaring]
  wikipedia: Byblos
  image: Byblos Obelisk Temple
  author_notes:
    - Byblos had close ties with Egypt from the Old Kingdom, chiefly for cedar. Its sanctuaries include the temple of Baʿalat Gubal (the 'Lady of Byblos') and the Middle Bronze Obelisk Temple.
    - Rib-Hadda of Byblos is the most prolific correspondent in the Amarna letters, a vivid source for Late Bronze politics and the ʿApiru.
    - The Iron Age royal inscriptions (Ahiram, Yehimilk, Abibaal, Elibaal, Shipitbaal, and the later Yehawmilk) are foundational for the early Phoenician alphabet.
    - Wenamun's visit to Zakar-Baal (c. 1075 BCE) illustrates the city's independence after the collapse. The 'Byblos syllabic' script remains undeciphered.
  sources_to_check:
    - Moran, The Amarna Letters (1992)

- id: damascus
  aliases: [Aram-Damascus, Dimashq, Ša-imērīšu]
  cultures: [aramean]
  scope: >-
    Damascus as the capital of the leading Aramean kingdom of the Iron Age and
    as a New Testament city. Covers the textual evidence for its history from
    David to its capture by Tiglath-pileser III, the scant archaeology, and
    Paul's Damascus.
  passages:
    - "Gen 14:15 | setting | Abram pursues the kings to Hobah, north of Damascus"
    - "2Sam 8:5-6 | setting | David's garrisons in Aram of Damascus"
    - "1Kgs 15:18-20 | setting | Asa bribes Ben-hadad of Damascus to attack Israel"
    - "1Kgs 20:34 | practice | Trading quarters (ḥûṣôt) granted in Damascus and Samaria"
    - "2Kgs 16:9-12 | setting | Tiglath-pileser III takes Damascus; Ahaz copies its altar"
    - "Isa 17:1-3 | setting | Oracle: Damascus to become a heap of ruins"
    - "Amos 1:3-5 | setting | Damascus threshed Gilead; the 'house of Hazael'"
    - "Acts 9:1-25 | setting | Paul's conversion and escape from Damascus"
    - "2Cor 11:32-33 | setting | The ethnarch of King Aretas guards Damascus"
  related: [arameans, hazael, ben-hadad, rezin, hadad-rimmon, tiglath-pileser-iii, tel-dan-stele, nabataeans]
  wikipedia: Damascus
  image: Temple of Jupiter Damascus
  author_notes:
    - Iron Age Damascus lies beneath the Old City and is almost unexcavated. The temple of Hadad is presumed to underlie the Roman temple of Jupiter and the Umayyad Mosque, where a basalt orthostat with a sphinx was found.
    - Assyrian sources call the kingdom KUR ša-imērīšu. Its kings include Hadadezer (Adad-idri at Qarqar), Hazael, Bar-Hadad, and Rezin (Raḫiānu). The biblical Ben-hadads are hard to number and correlate.
    - How and when the Nabataean ethnarch controlled the city (2 Cor 11:32) is debated.
  sources_to_check:
    - Younger, A Political History of the Arameans (2016)

- id: hamath
  aliases: [Hama, Epiphania, Lebo-hamath (border)]
  cultures: [luwian, aramean]
  scope: >-
    The city on the Orontes in central Syria, capital of a Neo-Hittite and then
    Aramean kingdom in the Iron Age. Covers its citadel excavations and
    inscriptions, its role in anti-Assyrian coalitions, and its conquest by Sargon
    II. 'Lebo-hamath' as Israel's ideal northern border is also discussed.
  passages:
    - "Num 34:8 | setting | Lebo-hamath on the ideal northern border"
    - "2Sam 8:9-10 | setting | Toi king of Hamath congratulates David"
    - "1Kgs 8:65 | setting | 'From Lebo-hamath to the Wadi of Egypt'"
    - "2Kgs 14:28 | setting | Jeroboam II's recovery of Damascus and Hamath (text difficult)"
    - "2Kgs 17:24, 30 | setting | Deportees from Hamath settled in Samaria; their god Ashima"
    - "2Kgs 18:34 | setting | 'Where are the gods of Hamath?'"
    - "Isa 10:9 | setting | 'Is not Hamath like Arpad?'"
    - "Amos 6:2 | setting | 'Go to Hamath the great'"
    - "Amos 6:14 | setting | 'From Lebo-hamath to the Wadi Arabah'"
  related: [zakkur-stele, battle-of-qarqar, arameans, sargon-ii, gods-of-2-kings-17, hittites-and-hethites, kurkh-monoliths]
  wikipedia: Hama
  image: Hama citadel
  author_notes:
    - Danish excavations on the citadel (1931-38) revealed a palace complex and Luwian hieroglyphic inscriptions of Neo-Hittite kings (e.g. Urhilina). Zakkur of Hamath and Luʿash represents the later Aramean dynasty.
    - Irhuleni of Hamath was a leader of the Qarqar coalition (853). Sargon II crushed Yau-biʾdi (Ilu-biʾdi) of Hamath in 720. Whether that name contains the divine element Yahu is debated.
    - Lebo-hamath is probably Lebweh in the northern Beqaʿ, not Hamath itself. Translations that render it 'entrance of Hamath' obscure this.
  sources_to_check:
    - Younger, A Political History of the Arameans (2016)

- id: ugarit
  aliases: [Ras Shamra, Minet el-Beida]
  cultures: [ugaritic]
  scope: >-
    The Late Bronze Age port-kingdom at Ras Shamra on the north Syrian coast,
    destroyed c. 1185 BCE, whose archives in several languages and scripts
    include the Ugaritic alphabetic literary texts. Covers the site, its palaces,
    temples and archives; the texts themselves are treated in ugaritic-texts and
    related entries.
  passages:
    - "Ps 29 | parallel | Storm-god hymn closely paralleled in Ugaritic Baal texts"
    - "Ps 82 | concept | Divine council and the 'sons of the Most High'; cf. El's assembly"
    - "Deut 32:8-9 | concept | Nations allotted by number of the 'sons of God' (4QDeut(j), LXX); cf. El's seventy sons"
    - "Isa 27:1 | language | Leviathan the twisting serpent; cf. Ugaritic ltn"
    - "Ezek 14:14, 20; 28:3 | attests? | Danel, perhaps the Dnil of the Aqhat epic"
  related: [ugaritic-texts, baal-cycle, aqhat-epic, kirta-epic, el, baal, divine-council, rephaim]
  wikipedia: Ugarit
  image: Ugarit Ras Shamra royal palace
  author_notes:
    - French excavations since 1929 (Schaeffer, then Yon and others) have recovered archives in Ugaritic alphabetic cuneiform, Akkadian, Hurrian, Hittite and other languages, from the royal palace and private houses (e.g. Rapanu, Urtenu). The nearby Ras Ibn Hani palace also yielded texts.
    - Ugarit is never mentioned in the Bible. Its importance is linguistic, literary and religious, not historical.
    - Ugaritic texts distinguish Ugarit from 'Canaan'. Avoid presenting Ugaritic religion simply as 'Canaanite religion'.
    - Its final destruction (c. 1185) is linked in the late letters to enemy ships, part of the wider Late Bronze collapse.
  sources_to_check:
    - Yon, The City of Ugarit at Tell Ras Shamra (2006)
    - Watson and Wyatt (eds.), Handbook of Ugaritic Studies (1999)

- id: mari
  aliases: [Tell Hariri]
  cultures: [amorite]
  scope: >-
    The city on the middle Euphrates whose Old Babylonian palace, destroyed by
    Hammurabi, yielded about 20,000 tablets. Covers the site, its palace and
    temples, and why the archives matter for prophecy, tribal society and
    treaty-making; the archive itself is treated in mari-letters.
  passages:
    - "Deut 13:1-5 | practice | Prophets and dreamers whose messages must be tested (MT 13:2-6)"
    - "Jer 28 | practice | Prophetic conflict; Mari letters report prophets and test them with omens"
    - "2Sam 7:1-17 | parallel | Divine promise to a king through a prophet; cf. Adad of Aleppo's message to Zimri-Lim"
    - "Gen 15:9-10, 17 | practice | Covenant made by killing animals; cf. 'killing a donkey' (ḫayaram qaṭālum)"
    - "Gen 35:18 | language | Benjamin; cf. the Binu-Yamina ('sons of the right/south') tribes"
    - "Josh 11:10 | attests | Hazor as a leading city; Mari texts name Hazor and its king"
  related: [mari-letters, prophecy-in-the-ane, amorites, covenant-cutting-ceremony, hazor, hammurabi, dreams-and-dream-interpretation]
  wikipedia: Mari, Syria
  image: Mari palace of Zimri-Lim
  author_notes:
    - French excavations since 1933 (Parrot, then Margueron, then Butterlin) uncovered a third-millennium city and the great palace of Zimri-Lim. Hammurabi destroyed the city c. 1761 BCE (middle chronology).
    - Older uses of Mari to authenticate a 'patriarchal age' (the Albright school) are outdated. Present the comparisons as typological.
    - The prophetic letters (āpilum, muḫḫûm and lay prophets) are among the most important comparative evidence for Israelite prophecy.
    - The site was badly damaged and looted during the Syrian civil war.
  sources_to_check:
    - Nissinen, Prophets and Prophecy in the Ancient Near East (2003)
    - Fleming, Democracy's Ancient Ancestors - Mari and Early Collective Governance (2004)

- id: ebla
  aliases: [Tell Mardikh]
  cultures: [ane]
  scope: >-
    The north Syrian city at Tell Mardikh whose mid-third-millennium palace
    archive revealed an early Semitic language (Eblaite). Covers the site and
    archive, its real significance for Semitic studies and religion, and the
    1970s controversy over alleged 'biblical' connections.
  passages:
    - "1Sam 5:2-5 | language | Dagon; Dagan is prominent in Ebla's pantheon"
    - "Num 21:29 | language | Chemosh; cf. the god Kamiš attested at Ebla"
    - "Hab 3:5 | language | Resheph (pestilence); cf. the god Rašap at Ebla"
  related: [chemosh, resheph, dagon, amorites, mari, scribes-and-scribal-education, writing-and-literacy]
  wikipedia: Ebla
  image: Ebla Tell Mardikh royal palace
  author_notes:
    - Italian excavations under Matthiae since 1964. The Palace G archives (c. twenty-fourth century BCE) number some 17,000 inventoried pieces, far fewer complete tablets. They include Sumerian-Eblaite bilingual lexical lists.
    - Use the site as a cautionary case. Early claims (Pettinato in the 1970s, amplified in the popular press) that the tablets named Sodom, Gomorrah and the cities of Gen 14, that the element 'Ya' was YHWH, and that a king Ebrium was Eber have all been rejected. Pettinato himself withdrew some of them.
    - Its real significance lies in early West Semitic personal names, deities (Dagan, Rašap, Kamiš, Aštar), administration and scribal culture.
    - The palace was destroyed in the later third millennium (by Sargon or Naram-Sin of Akkad; debated). The Middle Bronze city was destroyed c. 1600.
  sources_to_check:
    - Matthiae, Ebla - An Empire Rediscovered (1980)

- id: babylon
  aliases: [Babel, Bābilim, Hillah ruins]
  cultures: [babylonian]
  scope: >-
    The city of Babylon on the Euphrates, capital of Hammurabi's dynasty and of
    the Neo-Babylonian Empire. Covers the excavated Neo-Babylonian city, its
    monuments and its symbolic role in the Bible from Genesis to Revelation; the
    empire is treated in babylonia.
  passages:
    - "Gen 10:10 | setting | Babel in Nimrod's kingdom"
    - "Gen 11:1-9 | setting | The tower of Babel; wordplay on the name (Akk. bāb-ilim 'gate of god')"
    - "2Kgs 24:10-17 | setting | Jehoiachin and Jerusalem's elite deported to Babylon"
    - "2Kgs 25:27-30 | attests | Jehoiachin's release; ration tablets from Babylon's Southern Palace"
    - "Isa 13-14 | setting | Oracle against Babylon and taunt over its king"
    - "Isa 46:1-2 | setting | Bel and Nebo bow down"
    - "Jer 50-51 | setting | Oracles against Babylon"
    - "Ps 137 | setting | 'By the rivers of Babylon'"
    - "Dan 4:30 | attests | 'Is this not magnificent Babylon, which I have built?' (Aram. 4:27)"
    - "Rev 17-18 | imagery | Babylon the great as a cipher for Rome"
  related: [etemenanki, ishtar-gate, marduk, nebuchadnezzar-ii, babylonia, ziggurat-and-babel, east-india-house-inscription, jehoiachin-ration-tablets]
  wikipedia: Babylon
  image: Babylon ruins Iraq
  author_notes:
    - Koldewey's German excavations (1899-1917) exposed mainly the Neo-Babylonian city of Nebuchadnezzar II, including the Ishtar Gate, the Processional Way, the Southern Palace, the foundation of Etemenanki and Esagila. Earlier levels lie below the water table.
    - The 'Hanging Gardens' have not been securely identified. Koldewey's 'vaulted building' is now usually read as a storehouse, where the Jehoiachin ration tablets were found. Dalley has argued for Nineveh.
    - Saddam Hussein's reconstruction damaged the ruins. Babylon was inscribed as a UNESCO World Heritage Site in 2019.
    - In Revelation and 1 Pet 5:13 'Babylon' is code for Rome. Keep the symbolic afterlife distinct from the historical city.
  sources_to_check:
    - George, Babylonian Topographical Texts (1992)
    - Koldewey, The Excavations at Babylon (1914)

- id: nineveh
  aliases: [Ninua, Kuyunjik, Nebi Yunus]
  cultures: [assyrian]
  scope: >-
    The great Assyrian city on the Tigris opposite modern Mosul, capital under
    Sennacherib and his successors until its fall in 612 BCE. Covers the mounds of
    Kuyunjik and Nebi Yunus, the palaces and their reliefs, the library, and
    Nineveh in biblical prophecy and narrative.
  passages:
    - "Gen 10:11-12 | setting | Nineveh and Calah built; 'that is the great city'"
    - "2Kgs 18:14 | attests | Sennacherib at Lachish; the Lachish reliefs from his Nineveh palace"
    - "2Kgs 19:36-37 | setting | Sennacherib returns to Nineveh and is murdered"
    - "Jonah 1:2 | setting | 'Nineveh, that great city'"
    - "Jonah 3:3 | setting | 'Three days' walk across', a hyperbolic size"
    - "Nah 2:1-3:19 | setting | Poetic depiction of Nineveh's fall in 612 (MT 2:2-3:19)"
    - "Zeph 2:13-15 | setting | Nineveh to become a desolation"
    - "Tob 1:3, 10 | setting | Tobit among the exiles in Nineveh"
    - "Matt 12:41 | setting | The people of Nineveh repented at Jonah's preaching"
  related: [sennacherib, ashurbanipal, library-of-ashurbanipal, lachish-reliefs, fall-of-nineveh-chronicle, assyria, gilgamesh-flood-tablet]
  wikipedia: Nineveh
  image: Nineveh Kuyunjik mound
  author_notes:
    - Excavations at Kuyunjik by Layard, Rassam, George Smith and others recovered Sennacherib's Southwest Palace ('Palace without Rival') and Ashurbanipal's North Palace with their reliefs and the library tablets.
    - Sennacherib made Nineveh the capital c. 700 and enclosed it with a wall about 12 km long. Jonah's 'three days' walk' is hyperbole or includes the hinterland. Jonah's portrait of Nineveh is literary, not a source for eighth-century history.
    - The Fall of Nineveh Chronicle records the city's capture by Medes and Babylonians in 612.
    - ISIS destroyed parts of the site, including the Nebi Yunus shrine and gates, in 2014-16. Tunnels dug under Nebi Yunus exposed remains of a palace associated with Esarhaddon.
  sources_to_check:
    - Russell, Sennacherib's Palace without Rival at Nineveh (1991)

- id: nimrud
  aliases: [Calah, Kalḫu]
  cultures: [assyrian]
  scope: >-
    The Assyrian capital Kalḫu (biblical Calah) on the Tigris, refounded by
    Ashurnasirpal II. Covers its palaces, reliefs, ivories and royal tombs, and
    the monuments from the site that name Israelite and Judahite kings.
  passages:
    - "Gen 10:11-12 | setting | Calah built by Nimrod (or Asshur)"
    - "2Kgs 9:1-13 | attests | Jehu, shown paying tribute on the Black Obelisk found at Nimrud"
    - "2Kgs 15:19-20 | attests | Menahem's tribute; Tiglath-pileser III's inscriptions from Calah"
    - "1Kgs 22:39 | realia | Ahab's ivory house; cf. the Nimrud ivories, many of Levantine origin"
    - "Amos 6:4 | realia | Beds inlaid with ivory"
    - "Ezek 23:14-15 | realia | Men portrayed on the wall in vermilion; painted Mesopotamian palace reliefs"
  related: [black-obelisk, shalmaneser-iii, tiglath-pileser-iii, samaria-ivories, lamassu, apkallu-reliefs, assyria, nineveh]
  wikipedia: Nimrud
  image: Nimrud Northwest Palace lamassu
  author_notes:
    - Ashurnasirpal II rebuilt Kalḫu as his capital (the Banquet Stele records its inauguration c. 879). Its major buildings include the Northwest Palace, the Nabu temple and Fort Shalmaneser, the arsenal where many ivories were stored.
    - It was excavated by Layard (1845-51), by Mallowan (1949-57, the ivories) and by Iraqi teams, who found the queens' tombs with gold jewellery in 1988-89.
    - The Nimrud ivories include Phoenician, North Syrian and Assyrian styles, much of it booty or tribute from the Levant. They are the closest comparanda for the Samaria ivories.
    - ISIS deliberately destroyed much of the Northwest Palace in 2015.
  sources_to_check:
    - Oates and Oates, Nimrud - An Assyrian Imperial City Revealed (2001)

- id: ur
  aliases: [Tell el-Muqayyar, Urim, Ur of the Chaldeans]
  cultures: [sumerian, babylonian]
  scope: >-
    The Sumerian and Babylonian city in southern Iraq, famous for its Royal
    Cemetery and the ziggurat of Ur-Nammu, and named in Genesis as Abraham's
    place of origin. Covers the site, its main periods and the problems of the
    biblical 'Ur of the Chaldeans'.
  passages:
    - "Gen 11:28 | setting | Haran dies in Ur of the Chaldeans"
    - "Gen 11:31 | setting | Terah's family leaves Ur of the Chaldeans (LXX: 'land of the Chaldeans')"
    - "Gen 15:7 | setting | 'I brought you from Ur of the Chaldeans'"
    - "Neh 9:7 | setting | God chose Abram and brought him out of Ur"
    - "Acts 7:2-4 | setting | Stephen: Abraham in Mesopotamia before Haran"
  related: [harran, sin-moon-god, ziggurat, babylonia, laws-of-ur-nammu, city-laments, nabonidus]
  wikipedia: Ur
  image: Ziggurat of Ur
  author_notes:
    - Woolley excavated Ur from 1922 to 1934. Key finds are the Royal Cemetery (c. 2600 BCE), the Ur III ziggurat of Ur-Nammu, and Nabonidus' restorations, including the residence of his daughter, the en-priestess Ennigaldi-Nanna.
    - The phrase 'of the Chaldeans' is anachronistic for any second-millennium setting. The Chaldeans (Kaldu) are attested only from the ninth century BCE, which points to a first-millennium perspective in the text.
    - A northern location (Urfa or a northern 'Ura'; Gordon and others) is a minority view. Most scholars accept southern Ur, but the problem should be stated. The Ur-Harran link through the moon-god Sin is often noted.
    - Woolley's 'flood deposit' is a local flood layer and should not be presented as evidence for Gen 6-9.
  sources_to_check:
    - Woolley and Moorey, Ur 'of the Chaldees' (1982)

- id: harran
  aliases: [Haran, Ḫarrānu, Carrhae]
  cultures: [aramean, assyrian]
  scope: >-
    The city in the upper Balikh valley in southeastern Turkey, a major centre of
    the moon-god Sin and the place where Abraham's family settled. Covers its
    role as a cult and political centre from the Bronze Age to Nabonidus and its
    place in the patriarchal traditions.
  passages:
    - "Gen 11:31-32 | setting | Terah settles and dies in Haran"
    - "Gen 12:4-5 | setting | Abram departs from Haran"
    - "Gen 27:43 | setting | Jacob told to flee to Laban in Haran"
    - "Gen 28:10 | setting | Jacob sets out for Haran"
    - "Gen 29:4 | setting | 'We are from Haran'"
    - "2Kgs 19:12 | setting | Gozan, Haran and Rezeph among nations conquered by Assyria"
    - "Ezek 27:23 | setting | Haran among Tyre's trading partners"
    - "Acts 7:2-4 | setting | Abraham in Haran before Canaan"
  related: [ur, sin-moon-god, nabonidus, arameans, fall-of-nineveh-chronicle, mari-letters]
  wikipedia: Harran
  image: Harran ancient ruins
  author_notes:
    - Harran's temple of Sin (Ehulhul) was restored by Nabonidus. Stelae of Nabonidus and of his mother Adad-guppi were found reused in the Great Mosque.
    - It was the last Assyrian stronghold under Ashur-uballit II (610-609) before the Babylonian conquest, the context of Neco's march in 2 Kgs 23:29.
    - The names of Abraham's kin (Serug, Nahor, Terah) match place names in the Harran region (Sarugi, Nahur, Til-turaḫi). Nahur appears already in the Mari texts.
  sources_to_check:
    - Green, The City of the Moon God - Religious Traditions of Harran (1992)

- id: susa
  aliases: [Shushan, Shush]
  cultures: [elamite, persian]
  scope: >-
    The Elamite capital in southwestern Iran, later an Achaemenid royal residence
    where Darius I built a palace and audience hall. Covers its long history, the
    Mesopotamian monuments taken there as booty, the Achaemenid palace, and its
    setting in Nehemiah, Esther and Daniel.
  passages:
    - "Ezra 4:9 | setting | People of Susa (Elamites) among those settled in Samaria"
    - "Neh 1:1 | setting | Nehemiah in Susa the citadel (bîrâ)"
    - "Esth 1:2-5 | setting | Ahasuerus's banquet in Susa the citadel"
    - "Esth 1:6 | realia | Palace furnishings: hangings, couches and a mosaic pavement"
    - "Esth 2:3-8 | setting | Young women gathered to Susa"
    - "Esth 3:15 | setting | 'The city of Susa was thrown into confusion'"
    - "Dan 8:2 | setting | Daniel's vision at Susa by the Ulai canal"
  related: [persia, darius-i, xerxes-i, artaxerxes-i, persepolis, code-of-hammurabi, victory-stele-of-naram-sin, medes]
  wikipedia: Susa
  image: Susa Apadana palace Darius
  author_notes:
    - French excavations (Dieulafoy from 1884, de Morgan from 1897, and later teams) recovered Mesopotamian monuments, including the Code of Hammurabi stele and Naram-Sin's victory stele, carried off by the Elamite king Shutruk-Nahhunte in the twelfth century.
    - Darius I built a palace and Apadana. The glazed-brick friezes (archers, lions) and the foundation charter (DSf), which lists materials and craftsmen from across the empire, are key evidence.
    - Esther's court details mix authentic Persian colouring with literary invention. Avoid using the palace to 'confirm' the narrative.
    - The tradition of the 'Tomb of Daniel' at Shush is medieval.
  sources_to_check:
