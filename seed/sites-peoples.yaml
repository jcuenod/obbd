    - Ammonite stone statuary (some with atef crowns) from the Amman area illustrates royal and elite iconography.
    - Ptolemy II Philadelphus refounded the city as Philadelphia, later a city of the Decapolis.
    - Speculative explanations of Og's 'bed' (dolmen, basalt sarcophagus) should be marked as such.
