    - "Acts 8:40 | setting | Philip arrives at Caesarea"
    - "Acts 10:1-48 | setting | Cornelius the centurion of the Italian Cohort"
    - "Acts 12:19-23 | setting | Death of Herod Agrippa I at Caesarea"
    - "Acts 21:8-14 | setting | Paul at the house of Philip the evangelist"
    - "Acts 23:23-35 | setting | Paul brought to Felix and held in Herod's praetorium"
    - "Acts 25:1-26:32 | setting | Paul before Festus and Agrippa II"
  related: [pilate-stone, herod-the-great, imperial-cult, josephus, roads-and-highways]
  wikipedia: Caesarea Maritima
  image: Caesarea Maritima aqueduct
  author_notes:
    - Herod built the city c. 22-10/9 BCE. Its artificial harbour (Sebastos) used hydraulic concrete, and a temple of Roma and Augustus dominated the harbour.
    - The promontory palace was probably later the governor's praetorium (Acts 23:35). The Pilate inscription (found 1961) names a Tiberieum.
    - Josephus' account of Agrippa I's death (Ant. 19) parallels Acts 12:19-23. Civil strife at Caesarea helped trigger the revolt of 66 CE.
    - The city became a major Christian centre (Origen, Eusebius). Keep that later history brief.
  sources_to_check:
    - NEAEHL
