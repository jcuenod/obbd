    - "Judg 1:27 | setting | Manasseh fails to drive out the inhabitants of Dor"
    - "1Kgs 4:11 | setting | Ben-abinadab over Naphath-dor, married to Solomon's daughter Taphath"
    - "1Chr 7:29 | setting | Dor among the towns of the Manassites"
    - "1Macc 15:11-14, 25 | event | Antiochus VII besieges the usurper Tryphon in Dor"
  related: [report-of-wenamun, sea-peoples, phoenicians, phoenician-seafaring, purple-dye, eshmunazar-sarcophagus, tiglath-pileser-iii, caesarea-maritima]
  wikipedia: Tel Dor
  image: Tel Dor
  author_notes:
    - "Wenamun (c. 1070s BCE) calls Dor a town of the Tjeker (Sikil) ruled by a prince Beder. Stern stressed a Sea Peoples phase, but Gilboa and Sharon find the Iron I town culturally Canaanite/Phoenician with limited Aegean features. Present the debate."
    - "When Israel took control of Dor is debated: the tenth century (1 Kgs 4:11 taken at face value) or the ninth, under the Omrides. After 732 Dor became the centre of the Assyrian province of Duʾru."
    - "The Eshmunazar II sarcophagus records that the Persian king gave 'Dor and Joppa' to Sidon. In the Hellenistic and Roman periods Dora was a fortified harbour city; 1 Macc 15 and Josephus refer to it."
    - "'Naphath-dor' (Josh 11:2; 12:23; 1 Kgs 4:11) may mean 'the heights of Dor' (the Carmel ridge) or simply 'the region of Dor'. Note the uncertainty."
    - "The finds include purple-dye installations, harbour structures and shipwrecks in the lagoon. Link to purple-dye and phoenician-seafaring."
  sources_to_check:
    - "E. Stern, Dor, Ruler of the Seas (rev. ed. 2000)"
    - "E. Stern et al., Excavations at Dor, Final Report, vols. IA-IB (Qedem Reports 1-2, 1995)"

- id: azekah
  aliases: [Tel ʿAzeqa, Tell Zakariya]
  cultures: [judahite, canaanite]
  scope: >-
    Tel ʿAzeqa, a high mound on the north side of the Elah Valley in the Shephelah and a
    fortified town on Judah's western frontier. The entry covers its biblical references,
    the mention of Azekah in Lachish Letter 4, the Assyrian 'Azekah Inscription', and the
    finds of the Lautenschläger Azekah Expedition (from 2012).
  passages:
    - "Josh 10:10-11 | setting | The Amorite kings pursued as far as Azekah; hailstones on the fleeing army"
    - "Josh 15:35 | setting | Azekah among the Shephelah towns of Judah"
    - "1Sam 17:1 | setting | The Philistines camp between Socoh and Azekah"
    - "2Chr 11:9 | setting | Azekah in Rehoboam's list of fortified cities"
    - "2Kgs 18:13 | event? | Sennacherib takes Judah's fortified cities; the Azekah Inscription is attributed to 701 or to Sargon II"
    - "Jer 34:7 | event | Lachish and Azekah the last fortified cities of Judah holding out"
    - "Neh 11:30 | setting | Azekah and its villages resettled by Judahites"
  related: [lachish-letters, lachish, sennacherib-campaign-701, sargon-ii-inscriptions, fall-of-jerusalem-587, khirbet-qeiyafa, gath, champion-combat]
  wikipedia: Azekah
  image: Tel Azekah
  author_notes:
    - "Bliss and Macalister excavated in 1898-99. The Lautenschläger Azekah Expedition (Tel Aviv University and Heidelberg, from 2012) has documented a Late Bronze Age destruction with human remains and Iron Age fortifications. Check the latest publications for the stratigraphy."
    - "Lachish Letter 4 ends: 'we are watching for the signals of Lachish ... for we cannot see Azekah.' It is often read as meaning that Azekah had already fallen, consistent with Jer 34:7, but it may describe only what was visible from the writer's post. Present both."
    - "The Azekah Inscription (two joined British Museum fragments, K 6205 + 82-3-23,131) describes an Assyrian assault on Azekah, 'situated on a mountain ridge'. Na'aman's join and attribution to Sennacherib (701) are widely followed, but some scholars date it to Sargon II's campaign of 712. Do not present either as settled."
    - "Azekah, Socoh and Khirbet Qeiyafa frame the Elah Valley. Link the geography of 1 Sam 17 without claiming the story as history."
  sources_to_check:
    - "N. Na'aman, 'Sennacherib's Letter to God on His Campaign to Judah,' BASOR 214 (1974)"
    - KAI 194

- id: khirbet-ataruz
  aliases: [Ataroth, Khirbat Ataruz, Khirbat ʿAṭārūz]
  cultures: [moabite, israelite]
  scope: >-
    Khirbat ʿAṭārūz in central Jordan, identified with Ataroth, which according to the Mesha
    stele had been held by the 'men of Gad' and fortified by the king of Israel before Mesha
    captured it. The entry covers the Iron Age temple complex and its cult objects, the
    inscribed altar published in 2018, and the site's bearing on Israelite and Moabite
    history. Ataroth in Ephraim (Josh 16) is a different place.
  passages:
    - "Num 32:3 | setting | Ataroth among the lands requested by Gad and Reuben"
    - "Num 32:34 | attests | The Gadites build Ataroth; cf. Mesha: 'the men of Gad had lived in the land of Ataroth'"
    - "2Kgs 3:4-5 | event | Mesha's rebellion, during which he captured Ataroth from Israel"
    - "2Sam 23:20 | language? | 'Ariel of Moab' (ʾărîʾēl), possibly related to the ʾrʾl taken from Ataroth"
    - "Ezek 43:15-16 | language? | ʾărîʾēl 'altar hearth', a proposed sense of ʾrʾl in Mesha's Ataroth account"
  related: [mesha-stele, moabites, chemosh, dibon, omri, altars, cult-stands, high-places]
  wikipedia: Khirbat Ataruz
  image: Khirbat Ataruz temple
  author_notes:
    - "Mesha stele lines 10-13: the men of Gad had lived in Ataroth 'from of old', the king of Israel built it, and Mesha took it, killed its people as 'satiation' (ryt) for Chemosh and Moab, dragged the ʾrʾl dwdh before Chemosh at Kerioth, and resettled it with men of Sharon and Maharith. The meaning of ʾrʾl dwdh (altar hearth of its DWD, a cultic object, or a person) is disputed."
    - "Excavations led by Chang-Ho Ji (from 2000) uncovered a large Iron IIA temple complex with altars, cult stands and figurines. The correlation of building phases with Omride construction and Mesha's conquest is debated. Present the excavators' view and note the alternatives."
    - "The inscribed altar or pedestal published in 2018 carries two short texts in an early alphabetic script, possibly Moabite, with Egyptian hieratic numerals. The readings are provisional, so cite the editio princeps and do not build on details."
    - "Distinguish Moabite Ataroth (Num 32) from Ataroth and Ataroth-addar in Ephraim and Benjamin (Josh 16:2, 5, 7; 18:13)."
  sources_to_check:
    - KAI 181
    - COS 2.23
    - "A. Bean, C. A. Rollston, P. K. McCarter and S. J. Wimmer, 'An Inscribed Altar from the Khirbat Ataruz Moabite Sanctuary,' Levant 50 (2018)"

- id: geshur
  aliases: [Geshurites, Maacah, Maacathites, Aram-maacah]
  cultures: [aramean]
  scope: >-
    The small Aramean kingdom of Geshur on the Golan east and northeast of the Sea of
    Galilee, together with neighbouring Maacah. Talmai of Geshur's daughter Maacah was
    David's wife and the mother of Absalom. The entry covers the biblical references, the
    Iron Age remains at et-Tell (later identified with Bethsaida) and other Golan sites,
    and Geshur's absorption by Aram-Damascus.
  passages:
    - "Deut 3:14 | setting | Jair takes Argob as far as the border of the Geshurites and Maacathites"
    - "Josh 12:5 | setting | Og's realm reaches the boundary of the Geshurites and Maacathites"
    - "Josh 13:11-13 | setting | Geshur and Maacah not driven out; they live within Israel 'to this day'"
    - "2Sam 3:3 | attests | Absalom's mother Maacah, daughter of King Talmai of Geshur"
    - "2Sam 13:37-38 | setting | Absalom flees to Talmai of Geshur for three years"
    - "2Sam 15:8 | setting | Absalom's vow 'while I lived at Geshur in Aram'"
    - "1Chr 2:23 | setting | Geshur and Aram take the towns of Jair"
    - "2Sam 10:6-8 | setting | The king of Maacah among the Aramean allies of Ammon"
  related: [arameans, david, diplomatic-marriage, damascus, hazael, city-gates, massebot, bull-iconography]
  wikipedia: Geshur
  image: Bethsaida et-Tell city gate
  author_notes:
    - "David's marriage to Talmai's daughter is a diplomatic marriage with a neighbouring Aramean court, and Absalom's flight to his maternal grandfather follows from it. Link to diplomatic-marriage."
    - "Et-Tell (Bethsaida Excavations Project, directed by R. Arav) has a large Iron IIA-B city with a monumental gate and a gate shrine with a stele of a horned, bull-headed figure, variously interpreted (often as a moon god). Its identification as Geshur's capital is a proposal, not certain. Other Golan and Sea of Galilee sites (e.g. Tel Hadar, ʿEn Gev) are also relevant."
    - "Geshur probably ceased as an independent kingdom when Aram-Damascus expanded in the ninth century. The region was then devastated by Tiglath-pileser III in 733-732."
    - "Distinguish the southern Geshurites near Philistia (Josh 13:2; 1 Sam 27:8), a different group."
  sources_to_check:
    - "B. Mazar, 'Geshur and Maacah,' JBL 80 (1961)"
    - "R. Arav and R. A. Freund (eds.), Bethsaida: A City by the North Shore of the Sea of Galilee, 4 vols. (1995-2009)"

