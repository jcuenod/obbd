  author_notes:
    - Glueck's 1930s label 'King Solomon's Mines' was overturned by Rothenberg's excavations, which dated much activity to the Egyptian New Kingdom (Seti I to Ramesses V) and uncovered the Hathor shrine.
    - Ben-Yosef's Central Timna Valley Project showed through radiocarbon that smelting peaked in the eleventh to ninth centuries BCE, organized by a local society that left few buildings. He proposes a link to early Edom.
    - Qurayyah painted ('Midianite') pottery and a copper snake with a gilded head come from the post-Egyptian phase of the shrine. Rothenberg's tent-shrine reading and the link to Num 21 are suggestive only.
  sources_to_check:
    - Rothenberg, The Egyptian Mining Temple at Timna (1988)

- id: faynan
  aliases: [Feinan, Punon, Khirbat en-Nahas, Phaino]
  cultures: [edomite]
  scope: >-
    The copper-ore district on the eastern side of the Arabah in southern Jordan,
    including the Iron Age smelting centre of Khirbat en-Naḥas. Covers the scale and
    dating of Iron Age copper production and its implications for the formation of
    Edom.
  passages:
    - "Num 33:42-43 | setting | Punon, a station on the wilderness route"
    - "Gen 36:31-39 | setting? | Kings of Edom 'before any king reigned over the Israelites'"
    - "2Sam 8:13-14 | setting? | David's victory and garrisons in Edom"
    - "1Kgs 11:14-16 | setting? | Joab's campaign in Edom"
  related: [copper-production, timna, edomites, low-chronology-debate, bozrah, shoshenq-i]
  wikipedia: Khirbat en-Nahas
  image: Khirbat en-Nahas copper smelting
  author_notes:
    - The Edom Lowlands Regional Archaeology Project (Levy, Najjar, Ben-Yosef) dated massive slag deposits and a fortress at Khirbat en-Naḥas by radiocarbon to the eleventh to ninth centuries BCE. This challenged the older view that Edom formed only in the eighth to seventh centuries (Bienkowski).
    - Whether this production was run by an early Edomite polity, a tribal confederation, or (as Levy has suggested) related to Davidic or Solomonic power is contested. Treat any link to David as speculative.
    - Faynan is identified with Punon (Num 33:42-43) and with Roman Phaino, the mines to which Christians were condemned (Eusebius).
    - Egyptian amulets and a scarab of the early Twenty-second Dynasty have been linked with Shoshenq I's campaign (Levy and others). Treat this as a proposal.
  sources_to_check:
    - Levy, Najjar and Ben-Yosef (eds.), New Insights into the Iron Age Archaeology of Edom, Southern Jordan (2014)

- id: kuntillet-ajrud
  aliases: [Horvat Teman]
  cultures: [israelite, judahite]
  date: [-800]
  circa: true
  scope: >-
    The isolated Iron Age site in northeastern Sinai on a desert route, known for
    its plastered and pithos inscriptions and drawings. Covers the buildings, the
    site's function and date, and its Israelite connections; the inscriptions
    themselves have their own entry.
  passages:
    - "Deut 33:2 | language | YHWH comes from Sinai, Seir and Paran; cf. 'YHWH of Teman'"
    - "Hab 3:3 | language | 'God came from Teman'; cf. 'YHWH of Teman' at the site"
    - "Judg 5:4 | concept | YHWH marching from Seir and Edom"
    - "Deut 16:21 | practice? | Ban on an asherah beside YHWH's altar; cf. 'YHWH ... and his asherah'"
    - "Amos 8:14 | concept | Local manifestations of a god; cf. 'YHWH of Samaria'"
  related: [kuntillet-ajrud-inscriptions, asherah, yhwh-origins, khirbet-el-qom-inscription, shasu, roads-and-highways]
  wikipedia: Kuntillet Ajrud
  image: Kuntillet Ajrud pithos drawing
  author_notes:
    - Meshel excavated the site in 1975-76, and the final report appeared in 2012. It is essentially a single-phase site dated by radiocarbon to c. 800 BCE, with strong links to the northern kingdom (the Joash and Jeroboam II era).
    - Its function is debated. Most see a way station or caravanserai with a religious dimension rather than a temple proper. The 'bench room' held the inscribed pithoi.
    - The drawings (Bes-like figures, a seated lyre player, a cow suckling a calf) need not illustrate the inscriptions. Avoid identifying the lyre player as Asherah.
  sources_to_check:
