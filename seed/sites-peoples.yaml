  circa: true
  scope: >-
    The ḫabiru/ʿapiru of second-millennium texts from Mesopotamia to Egypt,
    socially marginal people outside the normal political order, and the
    long-debated question of their relation to the biblical 'Hebrews' (ʿibrîm).
  passages:
