  related: [tyre, sidon, byblos, phoenician-seafaring, purple-dye, melqart, hiram-of-tyre, ahiram-sarcophagus]
  wikipedia: Phoenicia
  image: Nimrud ivory woman at the window
  author_notes:
    - The name 'Phoenician' is a Greek exonym. The inhabitants identified themselves by city (Sidonians, Tyrians) or as Canaanites; Augustine reports that North African Punic speakers called themselves 'Chanani'.
    - The Phoenician alphabet was transmitted to the Greeks. Phoenician inscriptions (Byblos, Karatepe, Kilamuwa) are basic to Hebrew and Aramaic epigraphy.
    - The dates of westward expansion (Kition, Carthage, Sardinia, Iberia) are debated (late tenth to eighth centuries). Radiocarbon has pushed some earlier.
    - Their religion (Baal, Melqart, Astarte, Eshmun) and the tophet debate should be cross-referenced. Phoenician craftsmanship (ivories, metalwork, architecture) is background to the Solomonic building accounts.
