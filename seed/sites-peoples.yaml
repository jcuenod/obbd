    - "Ezra 7:11-26 | practice | Artaxerxes' rescript: 'the law of your God and the law of the king'"
    - "Neh 2:1-9 | practice | Nehemiah as cupbearer; royal letters to governors"
    - "Hag 1:1 | setting | Dating by Darius's regnal years; Zerubbabel governor of Judah"
    - "Esth 1 | setting | The Achaemenid court at Susa"
    - "Dan 6 | setting | Satrapal administration under 'Darius the Mede'"
    - "Dan 11:2 | setting | Four Persian kings to arise"
  related: [cyrus-the-great, darius-i, cyrus-cylinder, behistun-inscription, persian-imperial-authorization, yehud-province, persepolis, susa]
  wikipedia: Achaemenid Empire
  image: Tomb of Cyrus Pasargadae
  author_notes:
    - The sources are Achaemenid royal inscriptions (Behistun and others), the Persepolis archives, Aramaic documents (Elephantine, Bactria), and Greek writers (Herodotus, Xenophon, Ctesias). Each has its own biases.
    - Frei's 'imperial authorization' thesis for the Pentateuch is debated and has been substantially weakened. Cross-refer persian-imperial-authorization.
    - The Cyrus Cylinder does not mention Judeans. The popular image of it as a 'charter of human rights' is a misconception.
