  author_notes:
    - Magen's excavations date the first sacred precinct to the mid-fifth century BCE (Persian period). It was rebuilt in the second century BCE and destroyed by John Hyrcanus (c. 111-110 BCE, from coins). Josephus' account of a temple founded under Alexander (Ant. 11) is thus too late for the first phase.
    - Hundreds of Aramaic and Hebrew dedicatory inscriptions are primary evidence for Samarian Yahwism.
    - Avoid using 'Samaritan' in the later sectarian sense for the fifth-century worshippers. The parting between Samaritans and Jews was gradual.
