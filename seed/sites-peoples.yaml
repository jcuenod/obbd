- id: persepolis
  aliases: [Pārsa, Takht-e Jamshid]
  cultures: [persian]
  date: [-518, -330]
  circa: true
  scope: >-
    The Achaemenid ceremonial capital in Fars, founded by Darius I and burned by
    Alexander. Covers its terrace palaces and reliefs, the Fortification and
    Treasury archives, and what they show about Persian court life and
    administration as background to Persian-period biblical books.
  passages:
    - "Ezra 7:12 | language | 'Artaxerxes, king of kings', the Achaemenid royal title"
    - "Ezra 6:1-2 | practice | Search of the royal archives; cf. Persepolis administrative archives"
    - "Esth 1:3-8 | practice | Royal banquet and court protocol of the Achaemenid court"
    - "Esth 1:14 | practice | Seven officials who 'saw the king's face'"
    - "Esth 8:10 | practice | Royal couriers on swift horses; cf. travel rations in the Fortification tablets"
    - "Isa 60:6-11 | imagery? | Nations' processions bearing gifts; cf. the Apadana delegations"
  related: [persepolis-fortification-tablets, persia, darius-i, xerxes-i, susa, tribute-and-vassalage, court-officials, roads-and-highways]
  wikipedia: Persepolis
  image: Persepolis Apadana staircase reliefs
  author_notes:
    - Founded by Darius I c. 518 BCE and expanded by Xerxes and later kings, the site has the Gate of All Nations, the Apadana and the Hall of a Hundred Columns. Alexander burned it in 330.
    - The Fortification tablets (c. 509-493, mostly Elamite, some Aramaic) and the Treasury tablets document the economy, rations, travel and sealing practice. They are prime evidence for Achaemenid administration.
    - The Apadana reliefs show gift-bearing delegations of subject peoples. Their reading as 'tribute' versus ceremonial gifts is debated.
    - Esther is set at Susa, not Persepolis. Use Persepolis for the court culture, not as the stage of the story.
  sources_to_check:
    - Schmidt, Persepolis I-III (1953-70)
    - Hallock, Persepolis Fortification Tablets (1969)

- id: carchemish
  aliases: [Karkemiš, Jerablus]
  cultures: [luwian, hittite]
  scope: >-
    The city on the Euphrates at the modern Turkish-Syrian border, seat of a
    Hittite viceroy and later capital of a Neo-Hittite kingdom, and site of the
    decisive battle of 605 BCE. Covers its excavations, monuments and
    inscriptions; the battle has its own entry.
  passages:
    - "Isa 10:9 | setting | 'Is not Calno like Carchemish?', conquered by Sargon II (717)"
    - "2Kgs 23:29 | setting | Neco marches to the Euphrates to aid Assyria"
    - "2Chr 35:20 | setting | Neco goes to fight at Carchemish; Josiah goes out against him"
    - "Jer 46:2-12 | setting | Defeat of Neco's army at Carchemish (605 BCE)"
    - "2Kgs 24:7 | setting | Babylon controls from the Wadi of Egypt to the Euphrates"
  related: [battle-of-carchemish, nebuchadnezzar-chronicle, necho-ii, josiah, nebuchadnezzar-ii, sargon-ii, hittites-and-hethites]
  wikipedia: Carchemish
  image: Carchemish orthostat relief
  author_notes:
    - The British Museum excavated the site in 1911-14 and 1920 (Hogarth, Woolley, with T. E. Lawrence). A Turkish-Italian project has worked there since 2011.
    - In the Late Bronze Age it was the seat of the Hittite viceroy in Syria. In the Iron Age it was the capital of a Neo-Hittite kingdom with Luwian hieroglyphic inscriptions and sculpted orthostats. Sargon II annexed it in 717.
    - Woolley found burnt houses containing Egyptian objects, which he linked to the 605 battle. The Babylonian Chronicle is the main written source.
  sources_to_check:
    - Hogarth, Woolley and Barnett, Carchemish I-III (1914-52)

- id: elephantine
  aliases: [Yeb, Abu, Syene (Aswan)]
  cultures: [jewish, egyptian, persian]
  scope: >-
    The island at the First Cataract opposite Aswan, home in the Persian period
    to a Judean military colony with a temple of YHW. Covers the site, the
    colony and its temple; the papyri and the temple petition have their own
    entries.
  passages:
    - "Jer 44:1 | setting | Judeans living in Egypt, including Pathros (Upper Egypt)"
    - "Jer 44:15-19 | practice? | Judeans in Egypt worship the Queen of Heaven; cf. Anat-Yahu at Elephantine"
    - "Isa 19:18-19 | setting? | An altar to YHWH in Egypt; often compared with Elephantine (or Leontopolis)"
    - "Ezek 29:10 | setting | 'From Migdol to Syene', the southern limit of Egypt"
    - "Neh 2:10, 19 | attests | Sanballat, whose sons are named in the Elephantine petition"
    - "Neh 12:22 | attests | Johanan the high priest, addressed in the Elephantine petition"
    - "Exod 12:15-20 | practice | Unleavened bread; cf. the 'Passover letter'"
  related: [elephantine-papyri, elephantine-temple-petition, elephantine-passover-letter, persia, queen-of-heaven, sanballat, anat, aramaic-language]
  wikipedia: Elephantine
  image: Elephantine Island Aswan ruins
  author_notes:
    - The Judean (Yehudaya) garrison served the Persian administration. The petition says their temple stood before Cambyses' conquest (525), so the colony probably goes back to the Saite period.
    - In 410 BCE the temple was destroyed at the instigation of the Khnum priests. The colonists petitioned Bagavahya (Bagohi), governor of Yehud (407). The temple was later rebuilt, apparently without animal sacrifice.
    - The divine names in the archive (YHW, Anat-Yahu, Eshem-Bethel, Herem-Bethel) raise debate over the colony's 'polytheism'. Avoid assuming the colonists knew a Pentateuch.
    - German and Swiss excavations have located the temple area next to the Khnum precinct.
  sources_to_check:
