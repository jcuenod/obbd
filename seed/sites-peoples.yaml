    - Sellin's German excavations and G. E. Wright's Drew-McCormick expedition identified a massive fortress (migdal) temple and a large massebah, which Wright linked to Judg 9. Whether the temple remained in use into Iron I is debated.
    - The Hellenistic city has been linked with the Samaritan community. It was destroyed by John Hyrcanus in the late second century BCE.
