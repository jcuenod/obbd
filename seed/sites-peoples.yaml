    - "2Sam 2:1-4 | setting | David anointed king of Judah at Hebron"
    - "2Sam 5:1-5 | setting | David reigns seven and a half years at Hebron"
    - "2Sam 15:7-10 | setting | Absalom proclaims himself king at Hebron"
    - "2Chr 32:28 | attests? | Royal storehouses; 'ḥbrn' among the place names on lmlk stamps"
    - "1Macc 5:65 | setting | Judas captures Hebron from the Idumeans"
  related: [lmlk-seal-impressions, herod-the-great, david, bench-tombs, edomites, hittites-and-hethites]
  wikipedia: Hebron
  image: Cave of the Patriarchs Hebron Herodian enclosure
  author_notes:
    - The ancient tell is Tell Rumeida (Jebel er-Rumeidah), with a Middle Bronze city wall and Iron Age remains. A Middle Bronze cuneiform administrative tablet was found there.
    - The monumental enclosure over the traditional Machpelah (Haram el-Khalil) is Herodian in style and generally attributed to Herod. Mamre (Ramat el-Khalil) has a Herodian enclosure and a Constantinian church.
    - The 'Zoan' synchronism (Num 13:22) is a literary claim of antiquity. Tanis became a royal city only in the Twenty-first Dynasty.
    - Hebron was Idumean in the Persian and Hellenistic periods. The present-day setting is politically sensitive; handle it neutrally.
  sources_to_check:
