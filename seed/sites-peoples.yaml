- id: bethlehem
  aliases: [Ephrathah, Beit Lahm]
  cultures: [judahite, jewish]
  scope: >-
    The Judahite town south of Jerusalem associated with Rachel, Ruth, David and
    the birth of Jesus. Covers its slight Iron Age and later evidence, the
    Church of the Nativity, and the traditions that shaped its biblical role.
  passages:
    - "Gen 35:19 | setting? | Rachel buried on the way to Ephrath; 'that is, Bethlehem' may be a gloss (cf. 1 Sam 10:2)"
    - "Ruth 1:1-2, 19-22 | setting | Naomi's family from Bethlehem in Judah"
