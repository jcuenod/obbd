# Seed entries for the sites-peoples domain: archaeological sites and places
# (Levant, Mesopotamia, Egypt, Persia, selected NT sites) and peoples,
# kingdoms and empires. See docs/seed-guide.md.

- id: jerusalem
  aliases: [Urusalim, Salem, Zion, Aelia Capitolina]
  cultures: [judahite, canaanite, jewish]
  scope: >-
    The city of Jerusalem from its Bronze Age beginnings to the Roman period,
    treated as an archaeological site and as the political and cultic centre of
    Judah. Detailed treatment of the southeastern ridge, the temple platform and
    the water systems is left to the entries on the City of David, the Temple
    Mount and Hezekiah's Tunnel.
  passages:
    - "Gen 14:18 | setting? | Melchizedek king of Salem, traditionally Jerusalem (cf. Ps 76:2 [MT 76:3])"
    - "Josh 10:1-5 | setting | Adoni-zedek of Jerusalem leads the southern coalition"
    - "Josh 15:63 | setting | Jebusites of Jerusalem not dispossessed"
    - "2Sam 5:6-10 | setting | David takes the stronghold of Zion and makes it his capital"
    - "1Kgs 6-8 | setting | Solomon's temple and palace complex"
    - "Isa 22:9-11 | attests | Houses torn down to fortify the wall; cf. the 'Broad Wall' on the Western Hill"
    - "2Kgs 18:13-19:37 | setting | Jerusalem besieged but not taken by Sennacherib (701 BCE)"
    - "2Kgs 25:8-17 | attests | Babylonian burning of the city; 586 destruction layers across the City of David"
    - "Neh 2:11-3:32 | setting | Nehemiah's inspection and rebuilding of the walls"
    - "Ps 48 | concept | Zion as the inviolable city of God"
  related: [city-of-david, temple-mount, hezekiahs-tunnel, amarna-letters, sennacherib-campaign-701, fall-of-jerusalem-587, herods-temple, yehud-province]
  wikipedia: Jerusalem
  image: Jerusalem Old City from Mount of Olives
  author_notes:
    - The Amarna letters of Abdi-Heba of Urusalim (EA 285-290; verify range) show a Late Bronze city-state, though architecture of that period is scarce on the ground. The Execration Texts may name the city earlier (reading debated).
    - The size and status of tenth-century Jerusalem is one of the sharpest debates in the field (E. Mazar and others vs. Finkelstein and the low chronology). Present the evidence and both readings; do not treat either as settled.
    - The late eighth-century expansion onto the Western Hill (Avigad's Broad Wall) is widely linked to population influx after 722 and to Hezekiah's preparations. Population estimates vary widely.
    - Keep this entry a synthesis; detailed stratigraphy belongs in city-of-david, temple-mount and herods-temple. Note the political sensitivity of excavation in East Jerusalem neutrally.
  sources_to_check:
    - NEAEHL
    - Moran, The Amarna Letters (1992)

- id: city-of-david
  aliases: [Ophel, Stronghold of Zion, Wadi Hilweh ridge]
  cultures: [judahite, canaanite]
  scope: >-
    The narrow southeastern ridge of Jerusalem above the Gihon spring, the core of
    the Bronze and Iron Age city. Covers its fortifications, the Stepped Stone
    Structure and Large Stone Structure, the spring installations, and the Iron Age
    houses and bullae; the tunnel and the temple platform have their own entries.
  passages:
    - "2Sam 5:7-9 | setting | David takes the stronghold of Zion, 'the city of David', and builds from the Millo inward"
    - "2Sam 5:8 | realia? | Joab's ascent by the ṣinnôr, often linked to Warren's Shaft (now doubted)"
    - "1Kgs 1:33-45 | setting | Solomon anointed at the Gihon spring"
    - "1Kgs 2:10 | setting | David buried in the city of David"
    - "2Chr 32:30 | setting | Gihon's upper outlet channelled to the west side of the city of David"
    - "Neh 3:15-16 | setting | Pool of Shelah, king's garden, and stairs down from the city of David"
    - "Jer 36:10-12 | attests | Gemariah son of Shaphan; bulla of Gemaryahu son of Shaphan from the 'House of the Bullae'"
    - "Jer 38:1 | attests | Jehucal son of Shelemiah and Gedaliah son of Pashhur named on bullae from the site"
  related: [jerusalem, temple-mount, hezekiahs-tunnel, pool-of-siloam, bullae-of-jeremiah-era-officials, low-chronology-debate, david, cisterns-and-water-systems]
  wikipedia: City of David (historic)
  image: City of David Stepped Stone Structure
  author_notes:
    - The Stepped Stone Structure and E. Mazar's Large Stone Structure are dated anywhere from Iron I to Iron IIA. Whether they form one tenth-century complex (a 'palace of David') is contested; give the range of views.
    - Reich and Shukron showed that the massive spring tower and pool fortifications are Middle Bronze Age, and that Warren's Shaft could not have been used as a water shaft in the Bronze Age. This undercuts the classic link with 2 Sam 5:8.
    - Shiloh's Area G houses (House of Ahiel, Burnt Room, House of the Bullae) preserve the 586 destruction. The bullae corpus is the main epigraphic link to Jeremiah's officials.
    - The excavations' sponsorship and their setting in the Silwan neighbourhood are politically contested. Mention this neutrally.
  sources_to_check:
    - NEAEHL
    - Shiloh, Excavations at the City of David I (Qedem 19, 1984)
    - Reich, Excavating the City of David (2011)

- id: temple-mount
  aliases: [Mount Moriah, Mount Zion, Haram al-Sharif, Har ha-Bayit]
  cultures: [judahite, jewish]
  scope: >-
    The hill north of the City of David on which the First and Second Temples
    stood, and the platform Herod enlarged. Covers biblical traditions about the
    site (Moriah, Araunah's threshing floor, Zion), what can and cannot be known
    archaeologically, and the Herodian platform.
  passages:
    - "Gen 22:2 | setting? | 'Land of Moriah' of Abraham's test, equated with the temple hill only later (2 Chr 3:1)"
    - "2Sam 24:18-25 | setting | David buys Araunah's threshing floor and builds an altar"
    - "2Chr 3:1 | setting | Solomon builds on Mount Moriah at Ornan's threshing floor"
    - "1Kgs 6 | setting | Construction of Solomon's temple"
    - "Ps 2:6 | concept | Zion, YHWH's holy hill, where the king is installed"
    - "Isa 2:2-4 | concept | Mountain of YHWH's house raised above the hills (cf. Mic 4:1-3)"
    - "Ezra 3:8-13 | setting | Foundation of the Second Temple"
    - "Mark 13:1-2 | setting | Disciples admire the Herodian temple's great stones"
  related: [jerusalem, city-of-david, herods-temple, cosmic-mountain, temple-as-cosmos, threshing-floors, temple-warning-inscription, trumpeting-place-inscription]
  wikipedia: Temple Mount
  image: Temple Mount Jerusalem aerial
  author_notes:
    - No excavation has taken place on the platform. The First Temple has not been located archaeologically, and finds from the Temple Mount Sifting Project come from unstratified spoil.
    - The present platform is largely Herodian. Proposed earlier phases (e.g. the 'seam' in the eastern wall; Ritmeyer's square pre-Herodian platform) are debated.
    - The identification of Moriah with the temple hill is late (Chronicles, then Josephus). 'Zion' first names the City of David stronghold (2 Sam 5:7) and later shifts to the temple hill and, later still, to the Western Hill.
    - The site is a live religious and political flashpoint (Haram al-Sharif). Use neutral language and both names.
  sources_to_check:
    - NEAEHL
    - Ritmeyer, The Quest - Revealing the Temple Mount in Jerusalem (2006)

- id: hezekiahs-tunnel
  aliases: [Siloam Tunnel, Channel VIII]
  cultures: [judahite]
  scope: >-
    The rock-cut water channel (c. 533 m) carrying the Gihon spring's water under
    the City of David to the Siloam pool, where the Siloam Inscription was found.
    Covers its engineering, dating and relation to biblical notices of Hezekiah's
    water works; the inscription itself has its own entry.
  passages:
    - "2Kgs 20:20 | attests | Hezekiah 'made the pool and the conduit and brought water into the city'"
    - "2Chr 32:2-4 | setting | Springs stopped before Sennacherib's arrival"
    - "2Chr 32:30 | attests | Upper outlet of Gihon channelled down to the west of the city of David"
    - "Isa 22:9-11 | setting | Waters of the lower pool; a reservoir between the two walls"
    - "Isa 8:6 | setting? | 'Waters of Shiloah that flow gently', perhaps the earlier Siloam Channel"
    - "Sir 48:17 | attests | Hezekiah tunnelled the rock with iron and built pools"
    - "John 9:7 | setting | Blind man sent to wash in the pool of Siloam"
  related: [siloam-inscription, hezekiah, city-of-david, pool-of-siloam, sennacherib-campaign-701, cisterns-and-water-systems]
  wikipedia: Siloam tunnel
  image: Hezekiah's Tunnel Siloam water channel
  author_notes:
    - The consensus dates the tunnel to Hezekiah's reign (late eighth century). Reich and Shukron argued for an earlier date (c. 800) from pottery in related fills; radiometric dating published by Frumkin, Shimron and Rosenbaum (Nature, 2003; verify) supported c. 700.
    - Explain the S-shaped course (following a karst fissure is the leading explanation) and the meeting of the two teams described in the inscription.
    - Distinguish the tunnel from the Middle Bronze spring system, Warren's Shaft and the earlier open Siloam Channel (Channel II).
  sources_to_check:
    - NEAEHL
    - COS 2.28

- id: samaria
  aliases: [Shomron, Sebaste, Sebastia]
  cultures: [israelite]
  scope: >-
    The capital of the northern kingdom founded by Omri, later an Assyrian
    provincial centre and the Herodian city of Sebaste. Covers the royal
    acropolis, the ostraca and ivories, and the site's later history; the
    Persian-period province and Samaritan origins are treated elsewhere.
  passages:
    - "1Kgs 16:24 | setting | Omri buys the hill of Shemer and builds Samaria"
    - "1Kgs 16:32 | setting | Ahab builds a temple of Baal in Samaria"
    - "1Kgs 22:39 | attests | Ahab's 'ivory house'; carved ivories from the royal acropolis"
    - "Amos 3:15 | attests | 'Houses of ivory shall perish'"
    - "Amos 6:4 | attests | Beds inlaid with ivory"
    - "Amos 4:1 | setting | 'Cows of Bashan on the mountain of Samaria'"
    - "Mic 1:6 | setting | Samaria to become a heap in the open country"
    - "2Kgs 17:5-6 | setting | Assyrian siege and capture of Samaria"
    - "2Kgs 17:24 | setting | Assyrian resettlement of deportees in the cities of Samaria"
  related: [samaria-ostraca, samaria-ivories, omri, ahab, fall-of-samaria, sargon-ii, samaritan-origins, herod-the-great]
  wikipedia: Samaria (ancient city)
  image: Sebastia Samaria royal acropolis
  author_notes:
    - Excavated by Harvard (Reisner and Fisher, 1908-10) and the Joint Expedition (Crowfoot, Kenyon, Sukenik, 1931-35). Kenyon's 'Building Periods' and pottery periods have been reworked by Tappy and others, and the attribution of the first building period to Omri is debated.
    - The acropolis with its casemate enclosure and fine ashlar masonry is a showcase of Omride royal architecture with Phoenician affinities.
    - The eighth-century Samaria ostraca document fiscal administration and include both Yahwistic and Baal-names.
    - The capture is credited to Shalmaneser V in 2 Kgs 17 but claimed by Sargon II in his inscriptions. Leave detail to fall-of-samaria. Herod rebuilt the city as Sebaste with a temple to Augustus.
  sources_to_check:
    - NEAEHL
    - Tappy, The Archaeology of Israelite Samaria (2 vols., 1992, 2001)

- id: megiddo
  aliases: [Tel Megiddo, Tell el-Mutesellim, Armageddon]
  cultures: [canaanite, israelite]
  scope: >-
    The major tell commanding the Wadi Ara pass into the Jezreel Valley, occupied
    from the Chalcolithic to the Persian period. Covers its Bronze Age city-state,
    its Iron Age palaces, gates, pillared buildings and water system, and its role
    in the chronology debate and in the image of Armageddon.
  passages:
    - "Josh 12:21 | setting | King of Megiddo in the list of defeated kings"
    - "Judg 1:27 | setting | Manasseh fails to dispossess Megiddo"
    - "Judg 5:19 | setting | Kings fight at Taanach by the waters of Megiddo"
    - "1Kgs 4:12 | setting | Megiddo in Baana's administrative district"
    - "1Kgs 9:15 | attests? | Solomon builds Hazor, Megiddo and Gezer; the 'Solomonic' gate debate"
    - "1Kgs 10:26 | realia? | Chariot cities; Stratum IVA pillared buildings as stables or storehouses"
    - "2Kgs 9:27 | setting | Ahaziah flees to Megiddo and dies there"
    - "2Kgs 23:29-30 | setting | Josiah killed at Megiddo by Pharaoh Neco"
    - "Zech 12:11 | setting | Mourning for Hadad-rimmon in the plain of Megiddo"
    - "Rev 16:16 | language | Armageddon, most likely 'mountain of Megiddo' (Har Megiddo)"
  related: [low-chronology-debate, chariots-and-horses, shoshenq-i, josiah, necho-ii, cisterns-and-water-systems, amarna-letters, hazor]
  wikipedia: Tel Megiddo
  image: Tel Megiddo aerial view
  author_notes:
    - Thutmose III's siege (mid-fifteenth century) is the earliest detailed battle account; Biridiya of Megiddo writes in the Amarna letters.
    - The dating of Strata VA-IVB and IVA, the six-chambered gate and Palaces 1723 and 6000 is central to the low chronology debate (Yadin's 'Solomonic' Megiddo vs. Finkelstein and Ussishkin's Omride or later attribution). Do not present the Solomonic attribution as established.
    - The pillared buildings have been read as stables, storehouses or barracks. The Tel Aviv expedition has argued for stables and a horse-training centre in the eighth century.
    - A fragment of a Shoshenq I stele was found in the spoil of the University of Chicago dig (1920s-30s). It is unstratified but confirms the pharaoh's presence.
    - Correct popular 'end-times battlefield' readings. The Hebrew etymology of Armageddon is the usual view but not certain.
  sources_to_check:
    - NEAEHL
    - Moran, The Amarna Letters (1992)

- id: hazor
  aliases: [Tel Hazor, Tell el-Qedah]
  cultures: [canaanite, israelite]
  scope: >-
    The largest Bronze Age city of the southern Levant, in the Huleh basin of upper
    Galilee, with an upper city and a vast lower city, and later an Israelite
    fortified town. Covers its Bronze Age prominence, the Late Bronze destruction,
    and the Iron Age strata down to the Assyrian conquest.
  passages:
    - "Josh 11:1-13 | setting? | Jabin of Hazor's coalition; Hazor 'head of all those kingdoms' burned by Joshua"
    - "Josh 19:36 | setting | Hazor in the allotment of Naphtali"
    - "Judg 4:2, 17 | setting | Jabin king of Canaan, who reigned in Hazor"
    - "1Kgs 9:15 | attests? | Solomon builds Hazor; six-chambered gate and casemate wall"
    - "2Kgs 15:29 | attests | Tiglath-pileser III takes Hazor (732 BCE); destruction of Stratum V"
  related: [low-chronology-debate, emergence-of-israel, mari-letters, amarna-letters, tiglath-pileser-iii, megiddo, gezer]
  wikipedia: Tel Hazor
  image: Tel Hazor
  author_notes:
    - Hazor appears in the Mari archives (eighteenth century) as a major trading city and in the Amarna letters (e.g. EA 227-228; verify). Both are unusual for a southern Levantine city.
    - The violent destruction of the Late Bronze city (thirteenth century) is undisputed, but who caused it is not. Ben-Tor and Yadin attribute it to Israelites, Zuckerman argues for an internal revolt, and others propose Egyptian or other agents. The date is also debated.
    - Yadin assigned the Stratum X gate and casemate wall to Solomon. Finkelstein and others place them in the ninth century. Present this as part of the chronology debate.
    - Jabin appears both in Josh 11 and in Judg 4, which raises literary-historical questions. The 'Hazor' of Jer 49:28-33 is an Arabian location and should not be confused with this site.
  sources_to_check:
    - NEAEHL
    - Ben-Tor, Hazor - Canaanite Metropolis, Israelite City (2016)

- id: gezer
  aliases: [Tel Gezer, Tell el-Jazari, Gazara]
  cultures: [canaanite, israelite]
  scope: >-
    A strategic city at the junction of the Shephelah and the coastal plain on the
    road to Jerusalem. Covers its Bronze Age city-state, the row of standing stones,
    its Egyptian connections, the Iron Age gate and the Hellenistic Gazara.
  passages:
    - "Josh 10:33 | setting | Horam king of Gezer defeated when aiding Lachish"
    - "Josh 16:10 | setting | Canaanites remain in Gezer as forced labour"
    - "Judg 1:29 | setting | Ephraim fails to drive out Gezer's Canaanites"
    - "Josh 21:21 | setting | Gezer as a Levitical city of Ephraim"
    - "2Sam 5:25 | setting | David strikes the Philistines as far as Gezer"
    - "1Kgs 9:15-17 | attests? | Pharaoh captures Gezer as a dowry; Solomon rebuilds it; six-chambered gate"
    - "1Macc 13:43-48 | setting | Simon captures and purifies Gazara"
  related: [gezer-calendar, merneptah-stele, massebot, amarna-letters, low-chronology-debate, diplomatic-marriage, boundary-markers]
  wikipedia: Tel Gezer
  image: Tel Gezer standing stones
  author_notes:
    - Macalister's excavations (1902-09) had poor stratigraphic control. Later work by Hebrew Union College (Dever and others) and the Tandy expedition clarified the sequence.
    - The Amarna letters include correspondence from Gezer's rulers, and the Merneptah Stele claims 'Gezer is captured'.
    - The Middle Bronze 'high place' with ten massebot is a key exhibit for standing stones.
    - The six-chambered gate's Solomonic date and the identity of the pharaoh in 1 Kgs 9:16 (often Siamun) are both debated. Give the low chronology view.
    - Hellenistic or Roman rock-cut boundary inscriptions ('boundary of Gezer') confirmed the identification.
  sources_to_check:
    - NEAEHL

- id: lachish
  aliases: [Tel Lachish, Tell ed-Duweir, Lakisu]
  cultures: [judahite, canaanite]
  scope: >-
    The leading Judahite city of the Shephelah after Jerusalem and a Late Bronze
    Canaanite city-state. Covers its Canaanite temples, the Iron Age palace-fort,
    the 701 BCE Assyrian siege and its depiction at Nineveh, the gate shrine, and
    the final destruction of 588/586 BCE.
  passages:
    - "Josh 10:31-35 | setting | Joshua takes Lachish"
    - "Josh 15:39 | setting | Lachish in Judah's Shephelah district list"
    - "2Chr 11:5-9 | setting | Rehoboam fortifies Lachish"
    - "2Kgs 14:19 | setting | Amaziah flees to Lachish and is killed there"
    - "2Kgs 18:14, 17; 19:8 | attests | Sennacherib's headquarters; Level III destruction and siege ramp (701 BCE)"
    - "2Chr 32:9 | setting | Sennacherib at Lachish with all his forces"
    - "Mic 1:13 | setting | Lachish to harness steeds; 'beginning of sin to daughter Zion'"
    - "Jer 34:7 | attests | Lachish and Azekah the last fortified cities; cf. Lachish Letter 4"
    - "Neh 11:30 | setting | Lachish resettled in the Persian period"
  related: [lachish-reliefs, lachish-letters, sennacherib-campaign-701, sennacherib, assyrian-siege-warfare, lmlk-seal-impressions, fall-of-jerusalem-587, city-gates]
  wikipedia: Tel Lachish
  image: Tel Lachish aerial
  author_notes:
    - Ussishkin's excavations settled the old debate by dating Level III's destruction to 701 (Sennacherib), not 597. This date anchors the Judahite pottery sequence and the lmlk jars.
    - The Assyrian siege ramp and the Judahite counter-ramp are the only excavated Assyrian siege works. Compare them directly with the Nineveh reliefs.
    - The Level III gate shrine, with a defaced horned altar and a toilet installation, has been read as material evidence of Hezekiah's reform (2 Kgs 18:4). This reading is debated.
    - The Late Bronze Fosse Temple and the Level VI Canaanite city (destroyed c. 1150) belong in the Canaanite background. Level II ends in the Babylonian destruction, the context of the Lachish letters.
  sources_to_check:
    - NEAEHL
    - Ussishkin, The Renewed Archaeological Excavations at Lachish (1973-1994) (2004)

- id: dan
  aliases: [Tel Dan, Tell el-Qadi, Laish, Leshem]
  cultures: [israelite, canaanite]
  scope: >-
    The site at the main source of the Jordan, Bronze Age Laish and Iron Age Dan,
    the northern limit of Israel. Covers the Middle Bronze rampart and arched gate,
    the Iron Age cult precinct, the city gates, and the inscriptions found there.
  passages:
    - "Gen 14:14 | setting | Abram pursues the kings 'as far as Dan' (anachronistic name)"
    - "Judg 18 | setting | Danite migration, capture of Laish and installation of Micah's image"
    - "1Sam 3:20 | setting | 'From Dan to Beersheba' as the ideal extent of Israel"
    - "1Kgs 12:28-30 | attests? | Jeroboam's golden calf at Dan; the cult precinct (Area T)"
    - "1Kgs 15:20 | setting | Ben-hadad of Damascus conquers Dan"
    - "2Kgs 10:29 | setting | Golden calves at Bethel and Dan persist under Jehu"
    - "Amos 8:14 | attests | Oath 'As your god lives, O Dan'; cf. Hellenistic dedication 'to the god who is in Dan'"
  related: [tel-dan-stele, high-places, bull-iconography, hazael, ben-hadad, horned-altars, city-gates, bethel]
  wikipedia: Tel Dan
  image: Tel Dan Middle Bronze gate
  author_notes:
    - Laish appears in Bronze Age texts (Mari, Egyptian toponym lists; verify specifics). The mudbrick arched gate (Middle Bronze II) is among the best preserved anywhere. The popular label 'Abraham's Gate' has no evidential basis.
    - Biran's Area T podium and precinct is plausibly linked with Jeroboam's sanctuary, but its phasing and the reconstructions of the bamah are debated. Finds include a horned altar, altar shovels and a hearth.
    - The Tel Dan Stele fragments (1993-94) were found reused in Iron Age construction near the gate. Leave the interpretation to tel-dan-stele.
    - The Greek and Aramaic bilingual dedication 'to the god who is in Dan' (Hellenistic) confirms the site identification.
  sources_to_check:
    - NEAEHL
    - Biran, Biblical Dan (1994)

- id: beersheba
  aliases: [Tel Beersheba, Tell es-Sebaʿ, Beer-sheba]
  cultures: [judahite]
  scope: >-
    The Iron Age Judahite town at Tel Beersheba in the northern Negev and the
    biblical traditions about Beersheba as a patriarchal and cultic site. Covers
    the planned Iron II town, its water system and storehouses, and the
    dismantled horned altar.
  passages:
    - "Gen 21:22-33 | setting | Abraham and Abimelech's oath; naming of Beersheba"
    - "Gen 26:23-33 | setting | Isaac's altar, covenant and well at Beersheba"
    - "Gen 46:1-5 | setting | Jacob sacrifices at Beersheba before going to Egypt"
    - "1Sam 8:2 | setting | Samuel's sons judge at Beersheba"
    - "1Kgs 19:3 | setting | Elijah flees to Beersheba"
    - "2Kgs 18:4 | realia? | Aharoni linked the dismantled horned altar to Hezekiah's reform"
    - "2Kgs 23:8 | setting | Josiah defiles the high places 'from Geba to Beersheba'"
    - "Amos 5:5 | setting | 'Do not cross over to Beersheba'"
    - "Amos 8:14 | setting | Oath by 'the way of Beersheba'"
  related: [horned-altars, cult-reforms-archaeology, altars, hezekiah, oaths-and-oath-formulas, four-room-house, cisterns-and-water-systems, dan]
  wikipedia: Tel Be'er Sheva
  image: Tel Beersheba horned altar
  author_notes:
    - Distinguish Tel Beersheba from the modern city. Settlement begins in Iron I, so there are no remains from a 'patriarchal' period. The Genesis traditions reflect a later setting.
    - Stratum II is a planned administrative town, most often thought destroyed in 701. Its date and the date of its destruction have been debated (Aharoni, Herzog, Singer-Avitz).
    - The horned altar was reassembled from ashlars reused in a storehouse wall. Its original location (a temple has been proposed but not found) and the link to Hezekiah are inferences.
  sources_to_check:
    - NEAEHL
    - Aharoni (ed.), Beer-Sheba I (1973)

- id: arad
  aliases: [Tel Arad]
  cultures: [judahite, canaanite]
  scope: >-
    The two-part site of Tel Arad in the eastern Negev: an Early Bronze Age city
    and, on its hill, a series of Iron Age Judahite fortresses containing a shrine.
    Covers the fortress and shrine, the ostraca, and the problem of the Late
    Bronze Canaanite king of Arad.
  passages:
    - "Num 21:1-3 | setting? | Canaanite king of Arad attacks Israel; the Late Bronze gap at Tel Arad"
    - "Num 33:40 | setting | King of Arad in the Negeb hears of Israel's coming"
    - "Josh 12:14 | setting | King of Arad in the list of defeated kings"
    - "Judg 1:16 | setting | Kenites settle in the wilderness of Judah near Arad"
    - "1Kgs 14:25-26 | attests | Shoshenq I's campaign; 'Arad' toponyms in his Karnak list"
    - "Deut 12:13-14 | practice | Centralization law, against which a royal Yahwistic shrine at a fortress stands out"
    - "2Kgs 18:4 | practice? | Decommissioning of the shrine linked to Hezekiah's (or Josiah's) reform"
    - "Ezra 2:44 | attests? | Keros; a 'Kerosite' named in the Arad ostraca"
  related: [arad-ostraca, cult-reforms-archaeology, massebot, incense-and-incense-altars, shoshenq-i, bubastite-portal, midianites-and-kenites, high-places]
  wikipedia: Tel Arad
  image: Tel Arad temple
  author_notes:
    - There is no Late Bronze occupation at Tel Arad. Proposed solutions to Num 21 include Tel Malhata or 'Arad' as the name of a region. Present this as a known problem.
    - The shrine has a raised niche with one (perhaps two) massebot and two limestone altars. Residue analysis (Arie et al., 2020) identified cannabis on one altar and frankincense on the other; report this carefully.
    - The dating of the shrine and its dismantling is contested. Aharoni placed it from Strata XI-VII with closure under Hezekiah or Josiah; Herzog's reappraisal limits it to Strata X-IX (eighth century) with closure c. 715-700.
    - The Eliashib archive (Stratum VI, c. 600) mentions Kittim and the Edomite threat. Leave detail to arad-ostraca.
  sources_to_check:
    - NEAEHL
    - Aharoni, Arad Inscriptions (1981)

- id: jericho
  aliases: [Tell es-Sultan, Ariha, City of Palms]
  cultures: [canaanite]
  scope: >-
    The oasis site of Tell es-Sultan near the spring of ʿAin es-Sultan, one of the
