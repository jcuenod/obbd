  related: [aramaic-language, hazael, ben-hadad, damascus, tel-dan-stele, zakkur-stele, sefire-treaties, tell-fekheriye-statue]
  wikipedia: Arameans
  image: Tell Halaf orthostat relief
  author_notes:
    - The first secure mention is in Tiglath-pileser I (c. 1100, Aḫlamû-Aramaya). Earlier references are debated.
    - Aramean states (Bit-Adini, Bit-Agusi/Arpad, Samʾal, Guzana, Zobah, Damascus) often had mixed Luwian-Aramean cultures. Their inscriptions (Tell Fekheriye, Zakkur, Sefire, Tel Dan) are key sources.
    - The patriarchal 'Aramean' kinship traditions (Gen 24-31; Deut 26:5) raise questions of date and anachronism. The meaning of ʾōbēd in Deut 26:5 ('wandering' or 'perishing') is debated.
    - Aramaic spread as the lingua franca of the Assyrian and Persian empires. Cross-refer aramaic-language.
  sources_to_check:
    - Younger, A Political History of the Arameans (2016)

- id: moabites
  aliases: [Moab, Moabites]
  cultures: [moabite]
  scope: >-
    The Iron Age kingdom of Moab on the plateau east of the Dead Sea and its
    people. Covers Moabite sources (above all the Mesha Stele), state formation,
    religion and language, and Moab's varied portrayal in the Bible.
  passages:
    - "Gen 19:30-38 | polemic | Moab's origin from Lot's incestuous union"
    - "Num 21:26-30 | setting | Sihon's conquest of Moabite land; the Song of Heshbon"
    - "Num 22-24 | setting | Balak of Moab hires Balaam"
    - "Deut 23:3-6 | practice | Moabites excluded from the assembly (MT 23:4-7)"
    - "Judg 3:12-30 | setting | Ehud kills Eglon king of Moab"
    - "Ruth 1:1-4 | setting | Ruth the Moabite"
    - "2Sam 8:2 | setting | David subdues Moab"
    - "2Kgs 3:4-27 | event | Mesha's revolt and the Israelite campaign; sacrifice on the wall"
    - "Jer 48 | setting | Oracle against Moab, closely related to Isa 15-16"
    - "Amos 2:1-3 | setting | Moab burned the bones of the king of Edom"
  related: [mesha-stele, chemosh, dibon, deir-alla-inscription, ammonites, edomites, omri, herem]
  wikipedia: Moab
  image: Balua stele
  author_notes:
    - Moab appears in Ramesses II's Luxor reliefs. The Mesha Stele is the principal Moabite source, and Moabite kings appear as tributaries in Assyrian texts.
    - Routledge's work frames Moabite state formation. Key sites include Dhiban, Khirbat al-Mudayna, and Khirbat Ataruz (Ataroth), whose temple and cult objects relate to the Mesha Stele.
    - The Moabite language is very close to Hebrew.
    - Biblical attitudes range from polemic (Gen 19) and exclusion (Deut 23, used in Ezra-Nehemiah) to the positive portrait of Ruth. Discuss these without harmonizing.
  sources_to_check:
    - Routledge, Moab in the Iron Age (2004)
    - Bienkowski, Early Edom and Moab (1992)

- id: ammonites
  aliases: [Ammon, Bene-ʿAmmon, Bit-Ammon]
  cultures: [ammonite]
  scope: >-
    The Iron Age kingdom of Ammon centred on Rabbah (Amman) and its people.
    Covers Ammonite inscriptions, seals and statuary, relations with Assyria and
    Babylon, and the biblical portrayal from the conquest stories to Nehemiah.
  passages:
    - "Gen 19:38 | polemic | Ben-ammi, ancestor of the Ammonites, born of incest"
    - "Deut 2:19, 37 | setting | Ammonite territory not given to Israel"
    - "Deut 23:3-6 | practice | Ammonites excluded from the assembly (MT 23:4-7)"
    - "Judg 10:6-11:33 | setting | Jephthah's war with Ammon"
    - "1Sam 11 | setting | Nahash besieges Jabesh-gilead"
    - "2Sam 10-12 | setting | David's war with Hanun and the siege of Rabbah"
    - "1Kgs 11:5, 7 | setting | Milcom, 'the abomination of the Ammonites'"
    - "Jer 40:14 | attests | Baalis king of the Ammonites; probably Baʿalyašaʿ of the Tell el-ʿUmeiri seal impression"
    - "Amos 1:13-15 | setting | Ammonites ripped open pregnant women in Gilead"
    - "Neh 2:10, 19 | setting | Tobiah 'the Ammonite official'"
  related: [rabbah, milkom, tell-siran-bottle-and-ammonite-inscriptions, moabites, seals-and-bullae, david]
  wikipedia: Ammon
  image: Ammonite statue Amman Citadel Museum
  author_notes:
    - Assyrian texts call the kingdom Bit-Ammon and name kings such as Sanipu and Amminadab. Ammonite inscriptions (Amman Citadel, Tell Siran bottle) and a rich corpus of seals document the language and onomastics.
    - A seal impression from Tell el-ʿUmeiri naming Milkomʾur, servant of Baʿalyašaʿ, is widely linked with Baalis of Jer 40:14.
    - Limestone statues from Amman, some wearing atef crowns, show Egyptianizing royal iconography.
    - The Tobiad family of the Hellenistic period (ʿIraq al-Amir) may continue Nehemiah's Tobiah, but this is debated.
  sources_to_check:
    - MacDonald and Younker (eds.), Ancient Ammon (1999)

- id: edomites
  aliases: [Edom, Seir, Idumea, Idumeans]
  cultures: [edomite]
  scope: >-
    The land and people of Edom in southern Transjordan and, later, Idumea in the
    southern Judean hills. Covers Egyptian and Assyrian evidence, the debate over
    when the Edomite state formed, Edomite religion and expansion, and the
    hostility toward Edom in biblical texts after 586.
  passages:
    - "Gen 25:30 | language | Esau called Edom from the 'red stuff' (ʾādōm)"
    - "Gen 36:31-39 | setting | Kings who reigned in Edom before Israel had kings"
    - "Num 20:14-21 | setting | Edom refuses Israel passage"
    - "Deut 23:7-8 | practice | 'You shall not abhor any of the Edomites, for they are your kin' (MT 23:8-9)"
    - "2Sam 8:13-14 | setting | David's garrisons in Edom"
    - "2Kgs 8:20-22 | setting | Edom revolts against Judah under Joram"
    - "2Kgs 14:7 | setting | Amaziah defeats Edom and takes Sela"
    - "Ps 137:7 | setting | Edomites cheer Jerusalem's fall"
    - "Obad 10-14 | setting | Edom's betrayal of Judah"
    - "Mal 1:2-5 | concept | 'I have loved Jacob but I have hated Esau'; Edom laid waste"
  related: [bozrah, qos, faynan, petra-and-sela, shasu, nabataeans, yhwh-origins, hurrians-and-horites]
  wikipedia: Edom
  image: Horvat Qitmit Edomite goddess head
  author_notes:
    - Egyptian texts mention Shasu of Edom and Seir (Papyrus Anastasi VI). Assyrian sources name Edomite kings (Qaus-malaka, Qaus-gabri). Qos is the national god.
    - When the state formed is debated, with options ranging from the late seventh century (Bienkowski, centred on Bozrah) or much earlier, from the Faynan copper evidence of the eleventh to ninth centuries (Levy, Ben-Yosef).
    - In the seventh and sixth centuries Edom expanded into the Negev (Horvat Qitmit shrine, ʿEn Ḥaṣeva). Arad ostracon 24 warns of an Edomite threat. Later Idumea was absorbed by the Hasmoneans, and Herod was of Idumean descent.
    - Post-586 anti-Edom polemic (Obadiah, Ps 137, Lam 4:21-22) should be read against both these material realities and kinship traditions (Deut 23:7).
  sources_to_check:
    - Bienkowski (ed.), Early Edom and Moab (1992)
    - Levy, Najjar and Ben-Yosef (eds.), New Insights into the Iron Age Archaeology of Edom, Southern Jordan (2014)

- id: midianites-and-kenites
  aliases: [Midian, Kenites, Qenites]
  cultures: [arabian]
  scope: >-
    The Midianites of northwestern Arabia and the Kenites, a group linked with
    Moses' father-in-law and with metalworking. Covers the biblical traditions,
    the archaeology of the Hejaz (Qurayyah) and the southern Arabah, and the
    Midianite-Kenite hypothesis of YHWH's origins.
  passages:
    - "Gen 25:1-4 | setting | Midian, son of Abraham and Keturah"
    - "Gen 37:28, 36 | setting | Midianite (Ishmaelite) traders sell Joseph"
    - "Exod 2:15-22 | setting | Moses flees to Midian and marries Zipporah"
    - "Exod 18 | setting | Jethro, priest of Midian, sacrifices and advises Moses"
    - "Num 10:29-32 | setting | Hobab the Midianite asked to guide Israel"
    - "Num 25:6-18 | setting | Cozbi the Midianite at Baal Peor"
