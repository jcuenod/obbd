- id: capernaum
  aliases: [Kefar Naḥum, Tell Hum]
  cultures: [jewish, roman]
  scope: >-
    The fishing village on the northwest shore of the Sea of Galilee that served
    as the base of Jesus' Galilean ministry. Covers the village houses, the
