  image: Ashurbanipal Arab camel riders relief
  author_notes:
    - The first mention of 'Arabs' is Gindibu the Arab with 1,000 camels at Qarqar (853), in Shalmaneser III's Kurkh Monolith.
    - Assyrian texts from Tiglath-pileser III to Ashurbanipal name Arab queens (Zabibe, Samsi, Yatie, Teʾelhunu) and Qedarite kings (Hazael, Yauta/Uaite').
    - Nehemiah's Geshem is widely identified with the Gashmu of a silver bowl from Tell el-Maskhuta and of an inscription from Dedan.
    - Nabonidus resided at Tayma for about ten years. Avoid reading the modern ethnic identity 'Arab' back into these sources.
  sources_to_check:
    - Eph'al, The Ancient Arabs (1982)
