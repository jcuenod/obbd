  wikipedia: Papyrus Amherst 63
  image: Papyrus Amherst 63
  location: Morgan Library & Museum, New York
  author_notes:
    - The Psalm 20 parallel is the recommended passage tag. The wider Egyptian diaspora setting is contextual information, not evidence for Jeremiah 44.
    - Present competing reconstructions of the psalm relationship without asserting an original or a proven direction of borrowing.
    - Check the papyrus's date and its current holding institution against the edition before stating them.
  sources_to_check:
