    - Tawny Lee Holm, critical edition project, "The Aramaic World through an Egyptian Lens" (Penn State, 2015-2016)

- id: papyrus-brooklyn-35-1446
  cultures: [egyptian]
  date: [-1800, -1700]
  circa: true
  scope: >-
    A late Middle Kingdom Egyptian administrative papyrus recording labor obligations and
    Egyptian and foreign household dependents. It supplies concrete documentary background
    for servitude and compulsory labor in Egypt.
  passages:
    - "Gen 39:1-6 | practice | Compare a foreign dependent's position in an Egyptian household; the papyrus does not identify Joseph"
    - "Exod 1:11-14 | practice | Evidence for compulsory labor and the administration of dependent workers; it does not identify Israelites"
  related: [joseph-story-egyptian-background, slavery, corvee-labor, louvre-leather-roll, hyksos]
  wikipedia: Papyrus Brooklyn 35.1446
  image: Papyrus Brooklyn 35.1446
  location: Brooklyn Museum, New York
  author_notes:
    - Distinguish the papyrus's administrative sections, and explain the Egyptian labor and status terms rather than giving every person one uniform legal position.
    - Avoid identifying Joseph, Shiphrah, or Israelites from similar names; no historical synchronism follows from the comparison.
    - The institution often translated "Great Prison" (ḫnrt wr) also administered compulsory labor. Do not use a simplified prison reconstruction or an unqualified Genesis prison tag (Gen 39:20-23).
    - The date field is an approximate late Middle Kingdom range; check it against the edition.
