- id: nabonidus
  cultures: [babylonian]
  date: [-556, -539]
  scope: >-
    The last king of the Neo-Babylonian empire, devotee of the moon god Sin, who spent
    about ten years at Tayma in Arabia while his son Belshazzar governed Babylon.
    Traditions about him underlie parts of Daniel.
  passages:
    - "Dan 4:28-37 | parallel? | Royal madness and seven 'times' away from society; cf. Nabonidus at Tayma (MT 4:25-34)"
    - "Dan 5:2, 11, 18 | attests? | Belshazzar called son of Nebuchadnezzar, though historically son of Nabonidus"
    - "Dan 5:7, 16, 29 | setting | 'Third ruler in the kingdom', perhaps reflecting Belshazzar's secondary rank"
    - "Bar 1:11-12 | attests | Belshazzar named as son of Nebuchadnezzar"
    - "Isa 46:1-2 | setting | Babylonian gods carried off at the fall of Babylon"
  related: [belshazzar, prayer-of-nabonidus, nabonidus-chronicle, verse-account-of-nabonidus, nabonidus-cylinders, cyrus-cylinder, sin-moon-god, harran]
  wikipedia: Nabonidus
  image: Nabonidus stele British Museum
  author_notes:
    - The Prayer of Nabonidus (4Q242) describes a king afflicted for seven years at Tayma and healed by a Jewish diviner; it is the main evidence that Dan 4 draws on Nabonidus traditions.
    - Cyrus's propaganda (Cyrus Cylinder, Verse Account) portrays him as impious; treat it as hostile.
    - His mother Adad-guppi's autobiography from Harran illuminates his devotion to Sin.
  sources_to_check:
    - Beaulieu, The Reign of Nabonidus, King of Babylon 556-539 B.C. (YNER 10, 1989)
    - Schaudig, Die Inschriften Nabonids von Babylon und Kyros' des Großen (AOAT 256, 2001)
    - ABC 7

- id: belshazzar
  cultures: [babylonian]
  date: [-553, -543]
  circa: true
  scope: >-
    Crown prince of Babylon, son of Nabonidus, entrusted with royal authority in
    Babylon during his father's stay at Tayma. In Daniel he is the king whose feast is
    interrupted by the writing on the wall on the night Babylon falls.
  passages:
    - "Dan 5:1-30 | attests | Belshazzar's feast and the writing on the wall"
    - "Dan 7:1 | attests | Vision dated to Belshazzar's first year"
    - "Dan 8:1 | attests | Vision dated to Belshazzar's third year"
    - "Dan 5:7, 16, 29 | setting | 'Third ruler in the kingdom', perhaps reflecting the co-regency"
    - "Bar 1:11-12 | attests | Prayer for Nebuchadnezzar and Belshazzar his son"
  related: [nabonidus, nabonidus-chronicle, verse-account-of-nabonidus, nabonidus-cylinders, fall-of-babylon-539, darius-the-mede]
  wikipedia: Belshazzar
  image: Nabonidus cylinder Belshazzar British Museum
  author_notes:
    - Cuneiform sources call him 'son of the king' (crown prince), never king; the Verse Account says Nabonidus 'entrusted the kingship' to him. Daniel's 'king' is an approximation.
    - Before cuneiform evidence was published, critics doubted his existence; the discovery is often overstated in apologetic literature as proving Daniel's accuracy.
    - Nebuchadnezzar as his 'father' (Dan 5) is historically inaccurate; it may be literary or a loose use of 'father'.
    - Nothing in Babylonian sources records his death on the night of Babylon's fall.
  sources_to_check:
    - Beaulieu, The Reign of Nabonidus (YNER 10, 1989)
    - ABC 7

- id: battle-of-qarqar
  cultures: [assyrian, israelite, aramean]
  date: [-853]
  scope: >-
    The battle fought in 853 BCE at Qarqar on the Orontes between Shalmaneser III and a
    coalition of twelve western states led by Damascus and Hamath, in which Ahab of
    Israel fielded the largest chariot force. The Bible does not mention it.
  passages:
    - "1Kgs 22:1 | setting | Three years without war between Aram and Israel"
    - "1Kgs 20:31-34 | setting | Treaty between Ahab and Ben-hadad"
    - "1Kgs 16:29 | attests | Ahab, king of Israel, dated by the battle"
    - "1Kgs 22:39 | setting | Kings refers readers elsewhere for Ahab's deeds; silence about Qarqar"
  related: [kurkh-monoliths, shalmaneser-iii, ahab, ben-hadad, hamath, chariots-and-horses, chronology-of-kings]
  wikipedia: Battle of Qarqar
  image: Kurkh Monolith Shalmaneser III British Museum
  author_notes:
    - Shalmaneser claims a great victory, but the coalition held together and he fought it again in 849, 848 and 845; most historians judge the outcome indecisive.
    - The Kurkh numbers for Ahab's forces are disputed; present the scribal-error proposal and its critics.
    - The battle provides the first absolute date in Israelite history and anchors the chronology of the Omride kings.
    - The relationship of Ahab's coalition partner Hadadezer to the Ben-hadad of 1 Kgs 20 and 22 is a key debate.
  sources_to_check:
    - COS 2.113A
    - Yamada, The Construction of the Assyrian Empire (2000)

- id: fall-of-samaria
  cultures: [assyrian, israelite]
  date: [-722, -720]
  scope: >-
    The Assyrian conquest of Samaria, capital of the northern kingdom, after a siege
    begun under Shalmaneser V, followed by deportation of its population and
    resettlement by Sargon II. The end of the kingdom of Israel.
  passages:
    - "2Kgs 17:1-6 | event | Hoshea's revolt, siege of Samaria and deportation"
    - "2Kgs 18:9-12 | event | Siege and capture in Hezekiah's fourth to sixth years"
    - "2Kgs 17:24-41 | event | Resettlement of Samaria with foreign deportees"
    - "2Kgs 17:7-23 | concept | Deuteronomistic theological explanation of the fall"
    - "Isa 28:1-4 | setting | Oracle against the 'proud garland' of Ephraim's drunkards"
    - "Mic 1:6-7 | setting | Samaria to become a heap of ruins"
    - "Hos 13:16 | setting | Samaria shall bear her guilt (MT 14:1)"
    - "Isa 10:9-11 | event | Samaria among Assyria's conquests"
  related: [shalmaneser-v, sargon-ii, sargon-ii-inscriptions, hoshea, samaria, deportation, samaritan-origins, babylonian-chronicles]
  wikipedia: null
  image: Sargon II Khorsabad relief
  author_notes:
    - Present the two main reconstructions; Tadmor's two-stage model (capture by Shalmaneser in 722, then Sargon's reconquest and deportations in 720) is widely followed.
    - Sargon's claim of 27,280/27,290 deportees and his statement that he 'repopulated' Samaria underlie 2 Kgs 17:24.
    - Archaeology suggests continuity at Samaria and in the countryside alongside deportation; the 'ten lost tribes' image overstates depopulation.
    - Assyrian sources document Samarians in Assyria (chariot units, Gozan, Halah), consistent with 2 Kgs 17:6.
  sources_to_check:
    - Becking, The Fall of Samaria (1992)
    - Tadmor, "The Campaigns of Sargon II of Assur," JCS 12 (1958)
    - ABC 1

- id: sennacherib-campaign-701
  cultures: [assyrian, judahite]
  date: [-701]
  scope: >-
    Sennacherib's third campaign to the west in 701 BCE against a rebel coalition
    including Hezekiah of Judah, Sidon, Ashkelon, Ekron, and Egyptian and Kushite
    forces. It devastated Judah and took Lachish, but Jerusalem was not captured and
    Hezekiah paid a heavy tribute.
  passages:
    - "2Kgs 18:13-16 | event | Fortified cities taken; Hezekiah's tribute"
    - "2Kgs 18:17-19:37 | event | Rabshakeh at Jerusalem and the city's deliverance"
    - "Isa 36-37 | event | Parallel account"
    - "2Chr 32:1-23 | event | Hezekiah's preparations and the Chronicler's account"
    - "Isa 22:8-11 | setting | Defensive works and water supply of Jerusalem"
    - "2Chr 32:2-5, 30 | setting | Stopping springs, building walls; Hezekiah's water tunnel"
    - "Mic 1:10-16 | setting | Lament over the towns of the Shephelah"
    - "Isa 1:7-9 | setting | Desolate land; Zion left like a booth"
  related: [sennacherib, sennacherib-annals, lachish-reliefs, hezekiah, lachish, hezekiahs-tunnel, lmlk-seal-impressions, taharqa]
  wikipedia: Sennacherib's campaign in the Levant
  image: Lachish reliefs British Museum
  author_notes:
    - The convergence of the Assyrian annals, the Lachish reliefs, the Lachish Level III destruction and 2 Kgs 18:13-16 is one of the best-documented events of the biblical period.
    - The deliverance narrative (2 Kgs 18:17-19:37) is usually analysed as two parallel accounts (B1, B2); the plague of 2 Kgs 19:35 has no Assyrian equivalent, and Herodotus 2.141 has a separate Egyptian tale.
    - Tirhakah (Taharqa) was not yet king in 701 (2 Kgs 19:9); he may have commanded as a prince, or the title is anachronistic.
    - The lmlk jars are widely tied to Hezekiah's preparations; note this as consensus but with debates over dating.
  sources_to_check:
    - RINAP 3/1 (Grayson and Novotny 2012)
    - Grabbe (ed.), 'Like a Bird in a Cage' (JSOTSup 363, 2003)
    - Kalimi and Richardson (eds.), Sennacherib at the Gates of Jerusalem (2014)

- id: fall-of-jerusalem-587
  cultures: [babylonian, judahite]
  date: [-597, -586]
  scope: >-
    The two Babylonian captures of Jerusalem: the surrender of Jehoiachin in 597 BCE,
    dated precisely by the Babylonian Chronicle, and the destruction of the city and
    temple after the siege of 589/588 to 587 or 586 under Zedekiah, followed by deportations.
  passages:
    - "2Kgs 24:10-17 | event | Siege of 597, surrender and deportation of Jehoiachin; Zedekiah installed"
    - "2Kgs 25:1-21 | event | Siege, breach, flight of Zedekiah, burning of temple and city"
    - "Jer 39:1-10 | event | Fall of the city and Zedekiah's fate"
    - "Jer 52:4-30 | event | Parallel account with deportee numbers (52:28-30)"
    - "2Chr 36:9-21 | event | Chronicler's account and the seventy years"
    - "Ezek 24:1-2 | event | Siege begins, dated the same day as 2 Kgs 25:1"
    - "Ezek 33:21 | event | A fugitive reports to Ezekiel that the city has fallen"
    - "Jer 34:7 | setting | Lachish and Azekah the last fortified cities; cf. Lachish Letter 4"
    - "Lam 2:1-9 | event | Lament over the destruction of Zion"
    - "Ps 137:7 | setting | Edom's role on the day of Jerusalem"
  related: [nebuchadnezzar-ii, nebuchadnezzar-chronicle, lachish-letters, jehoiachin, babylonian-exile, jerusalem, city-of-david, jehoiachin-ration-tablets]
  wikipedia: Siege of Jerusalem (587 BC)
  image: Nebuchadnezzar Chronicle British Museum
  author_notes:
    - The 597 capture is fixed by the Babylonian Chronicle (2 Adar, year 7 = 15/16 March 597). The date of the second fall (587 vs 586) depends on how Judah's regnal years were reckoned; present both.
    - Archaeological evidence includes the destruction layers in the City of David (Area G, burnt rooms with bullae), Babylonian-type arrowheads, and the Lachish Level II destruction.
    - The deportation figures in Jer 52:28-30 (4,600 total) differ from 2 Kgs 24:14-16; discuss sources and possible meanings.
    - Avoid portraying the land as empty after 586 (the 'myth of the empty land' debate); Mizpah became the administrative centre.
  sources_to_check:
    - ABC 5
    - Lipschits, The Fall and Rise of Jerusalem (2005)

- id: battle-of-carchemish
  cultures: [babylonian, egyptian]
  date: [-605]
  scope: >-
    The decisive battle of 605 BCE at Carchemish on the Euphrates, in which the
    Babylonian crown prince Nebuchadnezzar defeated the Egyptian army of Necho II,
    ending Egyptian control of Syria-Palestine and opening the Levant to Babylon.
  passages:
    - "Jer 46:2-12 | event | Oracle on Pharaoh Necho's army defeated at Carchemish in Jehoiakim's fourth year"
    - "2Kgs 24:7 | event | Egypt no longer comes out of its land; Babylon controls to the Euphrates"
    - "2Chr 35:20 | setting | Necho on his way to Carchemish in 609, when Josiah intervened"
    - "2Kgs 23:29 | setting | Necho's campaign of 609 to aid Assyria on the Euphrates"
    - "Jer 25:1 | setting | Jehoiakim's fourth year equated with Nebuchadnezzar's first"
    - "Dan 1:1 | setting | 'Third year of Jehoiakim'; chronological discrepancy with Jer 25:1 and 46:2"
  related: [nebuchadnezzar-ii, necho-ii, carchemish, nebuchadnezzar-chronicle, babylonian-chronicles, josiah]
  wikipedia: Battle of Carchemish
  image: Nebuchadnezzar Chronicle British Museum
  author_notes:
    - The Babylonian Chronicle (ABC 5) describes the battle and the pursuit to Hamath; Nebuchadnezzar then returned to Babylon on his father's death.
    - Distinguish the 609 campaign (Josiah's death at Megiddo; 2 Kgs 23:29; 2 Chr 35:20) from the 605 battle.
    - Excavations at Carchemish (Woolley; renewed Turkish-Italian work) found evidence of the destruction, including Egyptian objects.
    - Dan 1:1's dating is a known chronological problem; present proposed explanations (accession-year reckoning, error) neutrally.
  sources_to_check:
    - ABC 5

- id: fall-of-babylon-539
  cultures: [babylonian, persian]
  date: [-539]
  scope: >-
    The capture of Babylon by the army of Cyrus II of Persia in October 539 BCE after
    the defeat of Nabonidus' forces at Opis, ending the Neo-Babylonian empire. The
    Babylonian sources report that the city was taken without battle.
  passages:
    - "Dan 5:30-31 | event | Belshazzar killed; 'Darius the Mede' receives the kingdom (MT 5:30-6:1)"
    - "Isa 45:1-3 | event | Cyrus, YHWH's anointed, before whom gates are opened"
    - "Isa 21:1-10 | event | 'Fallen, fallen is Babylon'; Elam and Media attack"
    - "Isa 13:17-19 | event | The Medes stirred up against Babylon"
    - "Jer 51:11, 28 | event | The kings of the Medes against Babylon"
    - "Isa 47:1-15 | setting | Taunt over Babylon's humiliation"
    - "Ezra 1:1-4 | event | Cyrus's decree in his first year"
  related: [cyrus-the-great, cyrus-cylinder, nabonidus, belshazzar, nabonidus-chronicle, darius-the-mede, babylon, medes]
  wikipedia: Fall of Babylon
  image: Cyrus Cylinder British Museum
  author_notes:
    - The Nabonidus Chronicle reports the battle of Opis, the surrender of Sippar, Ugbaru's entry into Babylon without battle (16 Tashritu), and Cyrus's entry (3 Arahsamnu).
    - The Cyrus Cylinder presents the conquest as Marduk's choice of Cyrus, closely matching Second Isaiah's theology; both are propaganda for Cyrus.
    - Herodotus (1.191) and Xenophon tell of diverting the Euphrates and a festival night; these later traditions conflict with the peaceful entry in cuneiform sources.
    - Biblical prophecies of Babylon's violent destruction (Isa 13; Jer 50-51) were not fulfilled in 539; discuss rather than harmonise. Darius the Mede has no extrabiblical attestation.
  sources_to_check:
    - ABC 7
    - COS 2.124
    - Finkel (ed.), The Cyrus Cylinder (2013)

- id: adad-nirari-iii
  cultures: [assyrian]
  date: [-811, -783]
  scope: >-
    King of Assyria (811-783 BCE), son of Šamši-Adad V and Sammu-ramat. His western campaigns
    around 805-796 broke the power of Aram-Damascus and received tribute from Joash of Samaria,
    Tyre, Sidon, Edom and Philistia, which helps explain Israel's recovery under Joash and
    Jeroboam II. The Tell al-Rimah stele has its own entry.
  passages:
    - "2Kgs 13:5 | event? | YHWH gives Israel a 'saviour' from Aram's oppression; often identified with Adad-nirari III"
    - "2Kgs 13:10-13 | attests | Jehoash (Joash) of Israel, 'Iuʾasu the Samarian' on the Tell al-Rimah stele"
    - "2Kgs 13:22-25 | setting | Joash recovers towns from Ben-hadad son of Hazael after Damascus is weakened"
    - "2Kgs 14:25-28 | setting | Jeroboam II restores Israel's border from Lebo-hamath, after Aram's decline"
  related: [tell-al-rimah-stele, ben-hadad, hazael, damascus, samaria, tribute-and-vassalage, assyria]
  wikipedia: Adad-nirari III
  image: Adad-nirari III stele
  author_notes:
    - "The main western sources are the Calah (Nimrud) slab, which lists Tyre, Sidon, 'the land of Omri', Edom and Philistia; the Saba'a stele, which records tribute from Mariʾ of Damascus; and the Tell al-Rimah stele, which names Joash. They compress several campaigns, so the date of Joash's tribute (often 796) is debated."
    - Identifying the 'saviour' of 2 Kgs 13:5 with Adad-nirari III is common but not certain. Alternatives include Jeroboam II (2 Kgs 14:27) and Elisha.
    - Sammu-ramat, his mother, held unusual prominence in his early reign (e.g. the Pazarcık stele). The Greek Semiramis legend draws loosely on her. Keep the historical queen and the legend apart.
    - "A dedication on Nabu statues from Nimrud ('Trust in Nabu, do not trust in another god') has been read as a monotheistic reform. That reading is not accepted. It is a devotional formula in a polytheistic setting."
  sources_to_check:
    - "A. K. Grayson, Assyrian Rulers of the Early First Millennium BC II (858-745 BC) (RIMA 3, 1996)"
    - ANET 281-282

- id: nabopolassar
  aliases: [Nabû-apla-uṣur]
  cultures: [babylonian]
  date: [-626, -605]
  scope: >-
    Founder of the Neo-Babylonian (Chaldean) dynasty, who seized Babylon in 626 BCE, threw off
    Assyrian rule and, allied with the Medes, destroyed Assyria (Assur 614, Nineveh 612, Harran
    610). The Bible never names him, but his reign is the setting for Nahum, Zephaniah 2,
    Habakkuk 1 and the death of Josiah.
  passages:
    - "Nah 2:1-3:19 | event | Oracles on the fall of Nineveh, taken by Nabopolassar and the Medes in 612 (MT 2:2-3:19)"
    - "Zeph 2:13-15 | event | Nineveh to become a desolation"
    - "Hab 1:5-11 | setting | YHWH rouses the Chaldeans, a new power sweeping the region"
    - "2Kgs 23:29 | event | Necho marches to aid Assyria against Babylon (609); Josiah killed at Megiddo"
    - "Jer 46:2 | event | Necho defeated at Carchemish (605) by Nabopolassar's crown prince Nebuchadnezzar"
  related: [fall-of-nineveh-612, fall-of-nineveh-chronicle, nebuchadnezzar-ii, babylonia, medes, battle-of-carchemish, babylonian-chronicles, etemenanki]
  wikipedia: Nabopolassar
  image: Nabopolassar cylinder
  author_notes:
    - His origins are debated. His own inscriptions call him 'son of a nobody' (mār lā mammāna); some link his family to Uruk. 'Chaldean' as a dynastic label comes from later Greek and biblical usage.
    - "The Babylonian chronicles (ABC 2-4) give a year-by-year account of his reign, including the Median alliance and the campaigns of 616-609. Use them for the chronology rather than Greek writers."
    - "His building inscriptions (e.g. the restoration of Etemenanki) present him as a humble, god-chosen restorer. This is useful for royal ideology and temple-building comparisons."
    - He died in August 605, just after Carchemish, and Nebuchadnezzar hurried back to Babylon to take the throne.
  sources_to_check:
    - A. K. Grayson, Assyrian and Babylonian Chronicles (1975), Chronicles 2-4
    - "R. Da Riva, The Inscriptions of Nabopolassar, Amēl-Marduk and Neriglissar (SANER 3, 2013)"

- id: fall-of-nineveh-612
  aliases: [Battle of Nineveh, Sack of Nineveh]
  cultures: [assyrian, babylonian]
  date: [-612]
  scope: >-
    The capture and destruction of the Assyrian capital in the summer of 612 BCE by Babylonian
    and Median forces under Nabopolassar and Cyaxares (Umakištar), which ended Assyria as an
    imperial power. The entry covers the event, its archaeology and its biblical echoes; the
    Babylonian chronicle that reports it has its own entry.
  passages:
    - "Nah 2:1-13 | event | Assault on Nineveh: chariots in the streets, river gates opened, plunder (MT 2:2-14)"
    - "Nah 3:1-19 | event | Woe to the bloody city; Thebes' fall in 663 cited as precedent (vv. 8-10)"
    - "Zeph 2:13-15 | event | Nineveh made a desolation, a lair for wild animals"
    - "Ezek 31:3-18 | imagery | Assyria as a felled cosmic cedar, a warning to Pharaoh"
    - "Jonah 3:1-10 | setting | Nineveh's reprieve, told for readers who knew of its fall in 612"
    - "2Kgs 23:29 | event | Necho goes to aid the Assyrian remnant (609); Josiah killed"
    - "Tob 14:15 | event | Tobias hears of Nineveh's destruction by Cyaxares of Media (GI reads Nebuchadnezzar and Ahasuerus)"
  related: [nineveh, fall-of-nineveh-chronicle, nabopolassar, medes, assyria, harran, josiah, necho-ii]
  wikipedia: Fall of Nineveh
  image: Halzi Gate Nineveh
  author_notes:
    - "Sequence: Assur fell to the Medes in 614; Nineveh fell in the month Abu 612 after a siege of about three months; Sin-šar-iškun died; Aššur-uballiṭ II held out at Harran until 610, and an Egyptian-backed attempt to retake it failed in 609. The fall of Nineveh was therefore not quite the end of Assyria."
    - Excavations at the Halzi Gate (Stronach) found skeletons of defenders and gateways narrowed for a last defence, which vividly confirm a violent end.
    - The story that a flood breached the walls comes from Ctesias via Diodorus, not from Babylonian sources. Do not use it to make Nah 2:6 eyewitness detail. Whether Nahum was composed before or after 612 is debated; the terminus post quem is the fall of Thebes (663).
    - Note the reception of Nineveh's fall in Jonah, Tobit and Greek historiography (Herodotus' 'Assyrian logoi', Xenophon's ruined 'Mespila').
  sources_to_check:
    - A. K. Grayson, Assyrian and Babylonian Chronicles (1975), Chronicle 3
    - C. J. Gadd, The Fall of Nineveh (1923)

- id: iran-stele
  aliases: [Iran Stela of Tiglath-pileser III]
  cultures: [assyrian]
  date: [-737]
  circa: true
  scope: >-
    A stele of Tiglath-pileser III, reportedly from western Iran, that commemorates his
    campaign to Media and includes a list of western rulers who paid tribute in 738 BCE,
    among them Menahem of Samaria and Rezin of Damascus. It is the best-preserved list of
    these tributaries and anchors Menahem's chronology.
  passages:
    - "2Kgs 15:19-20 | event | Menahem's tribute of a thousand talents to Pul (Tiglath-pileser III)"
    - "2Kgs 15:17 | attests | Menahem son of Gadi, king of Israel in Samaria"
    - "2Kgs 15:37; 16:5-9 | attests | Rezin of Damascus, later Ahaz's enemy, listed among the tributaries"
    - "Isa 7:1-9 | attests | Rezin of Aram allied with Pekah against Judah"
  related: [tiglath-pileser-iii-inscriptions, tiglath-pileser-iii, menahem, rezin, tribute-and-vassalage, chronology-of-kings, qedarites-and-arabs]
  wikipedia: Iran Stele
  image: Iran Stele Tiglath-pileser III Israel Museum
  location: Israel Museum, Jerusalem
  author_notes:
    - The stele is unprovenanced (acquired, reportedly from western Iran) and was published by L. D. Levine (1972). Note the provenance problem but also that its text agrees with the excavated Nimrud annals.
    - "Check the king of Tyre named in the list. RINAP 1 no. 35 appears to read Tubaʾil (Ethbaal) of Tyre, whereas the annals' tribute list has Hiram. Tadmor discussed the discrepancy as evidence of a change of ruler. Do not assert 'Hiram' for the stele without checking."
    - The list also names Zabibe, queen of the Arabs, and rulers of Byblos, Carchemish, Hamath and Samʾal (Panamuwa). It gives a full picture of the western vassal system on the eve of the Syro-Ephraimite crisis.
    - The date of Menahem's tribute (738, or 740 in some reconstructions) conflicts with some biblical chronologies; refer to chronology-of-kings rather than resolving it here.
  sources_to_check:
    - "H. Tadmor and S. Yamada, The Royal Inscriptions of Tiglath-pileser III and Shalmaneser V (RINAP 1, 2011), no. 35"
    - L. D. Levine, Two Neo-Assyrian Stelae from Iran (1972)
    - H. Tadmor, The Inscriptions of Tiglath-pileser III, King of Assyria (1994)

