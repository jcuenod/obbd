- id: tang-i-var-inscription
  cultures: [assyrian]
  scope: >-
    Sargon II's rock inscription at Tang-i Var in western Iran, which recounts the Ashdod
    rebellion and the extradition of its leader Yamani by the Kushite ruler Shebitku. It
    illuminates relations among Assyria, Philistia, and Kush.
  passages:
