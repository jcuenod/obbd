meals-and-banqueting:
  - file: "File:Wall painting - banquet scene in triclinium - Pompeii (V 2 4) - Napoli MAN 120031 - 01.jpg"
    caption: "Banquet scene from a triclinium at Pompeii (V 2, 4): men and women recline on couches while a young slave serves, Fourth Style (Museo Archeologico Nazionale, Naples, 120031)."
