    caption: "Honorific decree of the Judean politeuma of Berenike (Cyrenaica) for the Roman official Marcus Tittius, an example of public honors for a benefactor. This is a different decree from the one for Decimus Valerius Dionysios."
    role: primary

delphic-manumission-antigona:
  - file: "File:Manumission Inscriptions at Delphi by Joy of Museums.jpg"
    caption: "Manumission inscriptions carved at Delphi. The photograph illustrates the genre of Delphic manumission records; it does not necessarily show the Antigona inscription (SGDI II 1722)."
    role: primary

pliny-trajan-correspondence:
