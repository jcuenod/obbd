nebo-sarsekim-tablet:
  - file: 'File:The chief eunuch, Nabu-sharussu-ukin (Nebuchadnezzar II''s right-hand man), "rab sha-reshi", donated gold to the god Marduk temple at Babylon. His name and title occur as Nebo-Sarsekim,"rab-saris", in Hebrew in the Book of Jeremiah.jpg'
    caption: "Receipt recording gold delivered by Nabû-šarrūssu-ukīn, rab ša-rēši, to the temple of Marduk in Babylon (British Museum, BM 114789)."
    role: primary

tang-i-var-inscription:
