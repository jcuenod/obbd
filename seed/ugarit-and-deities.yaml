  cultures: [ane, ugaritic, mesopotamian, hebrew]
  scope: >-
    The assembly of the gods presided over by the high god, attested in Mesopotamian,
    Ugaritic, Phoenician and Aramaic sources, and in the Hebrew Bible as YHWH's
    heavenly court of "sons of God", "holy ones" and the host of heaven, to which
    prophets claim access.
  passages:
    - "Ps 82 | concept | God judges and condemns the gods in 'the council of El'"
    - "1Kgs 22:19-23 | concept | Micaiah sees YHWH enthroned with the host; a spirit volunteers"
    - "Job 1:6-12 | concept | The sons of God present themselves; the satan among them"
    - "Isa 6:1-8 | concept | Throne vision; 'Who will go for us?'"
    - "Isa 40:1-8 | concept | Plural commands to the heavenly court (Cross)"
    - "Jer 23:18, 22 | concept | True prophets have stood in YHWH's council (sôd)"
    - "Ps 89:5-7 | concept | 'Assembly of the holy ones', incomparability among heavenly beings (MT 89:6-8)"
    - "Gen 1:26; 3:22; 11:7 | concept? | Divine plurals: 'let us make', 'like one of us', 'let us go down'"
    - "Zech 3:1-7 | concept | Heavenly court scene with the accuser"
    - "Deut 32:8-9 | concept | Nations allotted to the sons of God (4QDeutj, LXX)"
  related: [sons-of-god, el, elyon, 4qdeut-j, satan-the-adversary, prophecy-in-the-ane, deir-alla-inscription, enuma-elish]
  wikipedia: Divine council
  image: null
  author_notes:
    - Ugaritic terms include phr ilm, ʿdt ilm (KTU 1.15 II) and dr bn il; Mesopotamian puḫrum appears in Enuma Elish and Atrahasis; the Deir ʿAlla text has the šdyn assembling.
    - The Gen 1:26 plural is variously explained (council, plural of majesty, deliberation); council is a common critical view but not unanimous.
    - On Ps 82, note the older reading of the "gods" as human judges (and John 10:34-36) versus the now-dominant mythological reading.
    - Avoid popular maximalist "divine council worldview" readings that systematize all supernatural references into one framework; stay with mainstream scholarship (Mullen, Smith, Handy).
  sources_to_check:
    - E. T. Mullen, The Assembly of the Gods (HSM 24, 1980)
    - F. M. Cross, "The Council of Yahweh in Second Isaiah," JNES 12 (1953)
    - L. K. Handy, Among the Host of Heaven (1994)

- id: sons-of-god
  aliases: [bene elohim, bene elim, sons of the gods]
  cultures: [hebrew, ugaritic, jewish]
  scope: >-
    The "sons of God/gods" (bənê ʾĕlōhîm, bənê ʾēlîm, bənê ʿelyôn), members of the
    divine council, and their reception in Second Temple interpretation of Gen 6:1-4
    as fallen angels (the Watchers).
  passages:
    - "Gen 6:1-4 | concept | Sons of God take human wives; Nephilim on the earth"
    - "Job 1:6; 2:1 | concept | Sons of God present themselves before YHWH"
    - "Job 38:7 | concept | Sons of God shout for joy at creation, parallel to morning stars"
    - "Deut 32:8 | concept | 4QDeutj 'sons of God'; LXX 'angels/sons of God'; MT 'sons of Israel'"
    - "Ps 29:1 | concept | Bənê ʾēlîm summoned to ascribe glory to YHWH"
    - "Ps 89:6 | concept | None among the bənê ʾēlîm is like YHWH (MT 89:7)"
    - "Ps 82:6 | concept | 'Sons of Elyon' sentenced to die like mortals"
    - "Dan 3:25 | concept | Fourth figure in the furnace 'like a son of gods'"
    - "1En 6:1-7:6 | concept | Watchers descend and beget giants"
    - "Jude 6 | concept | Angels who left their proper dwelling kept in chains"
  related: [divine-council, nephilim, 4qdeut-j, first-enoch, el, elyon, king-as-son-of-god]
  wikipedia: Sons of God
  image: null
  author_notes:
    - Ugaritic bn il/bn ilm and the seventy sons of Athirat provide the closest background; mainstream critical scholarship reads Gen 6:1-4 of divine beings.
    - 'Survey the reception history: angels (1 Enoch, Jubilees, Jude, 2 Pet 2:4), human rulers or nobles (targums, rabbis), Sethites (later Christian).'
    - The text-critical case for "sons of God" in Deut 32:8 is now widely accepted.
    - Exclude sensational modern readings (alien or hybrid-genetics theories) except as misconceptions.
  sources_to_check:
    - 'R. S. Hendel, "Of Demigods and the Deluge: Toward an Interpretation of Genesis 6:1-4," JBL 106 (1987)'
    - DDD, s.v. "Sons of (the) God(s)"

- id: satan-the-adversary
  aliases: [haśśāṭān, the accuser]
  cultures: [hebrew, persian, jewish]
  scope: >-
    The śāṭān ("adversary, accuser") in the Hebrew Bible, from human opponents to the
    heavenly "satan" of Job and Zechariah, and the emergence of Satan as a proper name
    and chief of evil powers in the Persian and Hellenistic periods.
  passages:
    - "Job 1:6-12; 2:1-7 | concept | 'The satan' among the sons of God tests Job with permission"
    - "Zech 3:1-2 | concept | The satan accuses the high priest Joshua"
    - "1Chr 21:1 | concept | Satan (or 'an adversary') incites David; cf. 2 Sam 24:1 (YHWH)"
    - "Num 22:22, 32 | language | YHWH's angel stands as a śāṭān to block Balaam"
    - "1Kgs 11:14, 23, 25 | language | Hadad and Rezon raised up as political adversaries"
    - "1Sam 29:4 | language | David as a potential śāṭān in battle"
    - "Ps 109:6 | practice | Accuser at the right hand in a legal setting"
    - "Wis 2:24 | concept | Death entered through the devil's envy; first link to Gen 3"
  related: [divine-council, sons-of-god, angel-of-yhwh, demons, zoroastrianism, persia]
  wikipedia: Satan
  image: null
  author_notes:
    - In Job and Zechariah haśśāṭān has the article and denotes a role in the heavenly court, not a proper name; 1 Chr 21:1 (no article) is debated as the first proper-name use.
    - The Persian "eyes of the king" informer model (Oppenheim) and Zoroastrian dualism as influences are debated; present them as hypotheses.
    - Correct the misconceptions that the Gen 3 serpent or Isa 14:12 and Ezek 28 refer to Satan in their original contexts.
  sources_to_check:
    - 'P. L. Day, An Adversary in Heaven: śāṭān in the Hebrew Bible (HSM 43, 1988)'
    - 'R. E. Stokes, The Satan: How God''s Executioner Became the Enemy (2019)'
    - DDD, s.v. "Satan"

- id: angel-of-yhwh
  aliases: [Angel of the Lord, malʾak YHWH, divine messengers]
  cultures: [hebrew, ugaritic, ane]
  scope: >-
    Divine messengers in the ancient Near East and the Hebrew Bible, and in
    particular the "angel (messenger) of YHWH", whose identity often merges with YHWH
    in the narratives. The entry covers ANE messenger conventions and the main
    interpretive models.
  passages:
    - "Gen 16:7-13 | concept | The angel speaks to Hagar, who names 'the God who sees'"
    - "Gen 22:11-18 | concept | The angel calls from heaven, speaking as YHWH"
    - "Gen 31:11-13 | concept | The angel of God says 'I am the God of Bethel'"
    - "Exod 3:2-6 | concept | The angel appears in the bush; God speaks from it"
    - "Exod 23:20-23 | concept | Angel sent before Israel; 'my name is in him'"
    - "Judg 6:11-24 | concept | The angel commissions Gideon; fear of having seen God"
    - "Judg 13:3-23 | concept | Annunciation to Manoah's wife; the angel's wondrous name"
    - "Gen 19:1 | form | Two messengers; cf. paired divine messengers at Ugarit"
    - "Hag 1:13 | language | Prophet called 'the messenger of YHWH'"
  related: [divine-council, name-theology, letter-writing-conventions, prophecy-in-the-ane, cherubim, sons-of-god]
  wikipedia: Angel of the Lord
  image: null
  author_notes:
    - 'Present the main models for the angel-YHWH fluidity: representation or agency (the messenger speaks in the sender''s voice), interpolation (angel added to earlier theophanies), and hypostasis; avoid later christological identifications as historical exegesis.'
    - Ugaritic and Mesopotamian messengers (often paired, e.g. Gapn and Ugar) deliver messages verbatim in the first person of the sender, a key analogy.
    - Distinguish malʾāk "messenger" (human or divine) from later angelology with names and ranks (Daniel, Tobit, 1 Enoch).
  sources_to_check:
    - S. A. Meier, The Messenger in the Ancient Semitic World (HSM 45, 1988)
    - DDD, s.v. "Angel of Yahweh"

- id: cherubim
  aliases: [cherub, kərûbîm]
  cultures: [hebrew, phoenician, assyrian]
  scope: >-
    The cherubim, winged composite guardian creatures of the Hebrew Bible who guard
    Eden, flank the ark, bear YHWH's throne and decorate the sanctuary. The entry
    covers their ANE iconographic background in winged sphinxes and guardian figures.
  passages:
    - "Gen 3:24 | concept | Cherubim and flaming sword guard the way to the tree of life"
    - "Exod 25:18-22 | realia | Two golden cherubim over the mercy seat"
    - "1Kgs 6:23-28 | realia | Two olivewood cherubim ten cubits high in the inner sanctuary"
    - "1Sam 4:4 | imagery | YHWH 'enthroned on the cherubim'"
    - "Ps 18:10 | imagery | YHWH rides on a cherub and flies (MT 18:11; 2 Sam 22:11)"
    - "Ezek 1:5-14 | imagery | Four living creatures with four faces and wings"
    - "Ezek 10:1-22 | imagery | Living creatures identified as cherubim beneath the throne-chariot"
    - "Ezek 28:14-16 | concept | Guardian cherub on the holy mountain of God"
    - "Ezek 41:18-20 | realia | Carved cherubim with human and lion faces alternating with palms"
  related: [cherub-throne, lamassu, ahiram-sarcophagus, samaria-ivories, ark-of-the-covenant, ezekiel-throne-chariot, garden-of-god, seraphim]
  wikipedia: Cherub
  image: Phoenician ivory winged sphinx
  author_notes:
    - Mainstream view identifies the cherub with the Levantine winged sphinx (lion body, human head, wings), as on the Ahiram sarcophagus throne and Megiddo and Samaria ivories.
    - Etymology from Akkadian kāribu/kurību (intercessory genius) is common but debated.
    - Correct the later image of cherubs as winged infants (Renaissance putti).
    - Ezekiel's cherubim combine several iconographic types (Assyrian lamassu, four-winged genii, atlas figures); see the throne-chariot entry.
  sources_to_check:
    - O. Keel and C. Uehlinger, Gods, Goddesses, and Images of God in Ancient Israel (1998)
