- id: shadday
  aliases: [El Shaddai, Shaddai, the Almighty]
  cultures: [hebrew]
  scope: >-
    The divine name or epithet Shadday, alone or as ʾēl šadday, used in the Priestly
    patriarchal narratives, in archaic and archaizing poetry, and above all in Job. The entry
    covers its distribution, the Priestly theory of revelation in Exod 6:3, the debated
    etymology, and the šdyn gods of the Deir ʿAlla inscription.
  passages:
    - "Gen 17:1 | language | 'I am El Shaddai': divine self-presentation to Abraham in P"
    - "Exod 6:3 | concept | The patriarchs knew God as El Shaddai, not by the name YHWH"
    - "Gen 28:3; 35:11; 48:3 | language | El Shaddai in Priestly promises of fertility and descendants"
    - "Gen 49:25 | language | Shadday and the 'blessings of the breasts (šādayim) and of the womb': wordplay"
    - "Num 24:4, 16 | language | Balaam sees 'the vision of Shadday'; cf. the šdyn in the Deir ʿAlla text"
    - "Ruth 1:20-21 | language | Shadday has dealt bitterly with Naomi"
    - "Job 6:4 | language | 'Arrows of Shadday', one of some thirty uses in Job"
    - "Ps 91:1 | language | Elyon and Shadday in parallel"
    - "Isa 13:6 | language | 'Destruction from Shadday' (šōd miššadday) wordplay; repeated in Joel 1:15"
    - "Ezek 10:5 | imagery | Sound of the cherubim's wings like the voice of El Shaddai; cf. 1:24"
  related: [el, elyon, deir-alla-inscription, yhwh-origins, divine-council, amorites]
  wikipedia: El Shaddai
  image: null
  author_notes:
    - "Set out the etymologies neutrally: 'the one of the mountain(s)' (Akkadian šadû; Albright, Cross), 'the one of the field/steppe' (Hebrew śādeh), and links with šad 'breast' (fertility; cf. Gen 49:25). The mountain etymology is the most widely held but is not certain."
    - "The translation 'Almighty' comes from the Septuagint (pantokratōr, mainly in Job) and the Vulgate (omnipotens), and from the rabbinic folk etymology še-day 'who is sufficient'. It is not the original sense."
    - "Whether Shadday is genuinely archaic or deliberately archaizing (in P and Job) is debated. Note the personal names Shedeur, Zurishaddai and Ammishaddai (Num 1:5-12), which some date early."
    - "The Deir ʿAlla plaster text (8th c.) has šdyn, a group of gods in council, alongside ʾlhn. This is the clearest extrabiblical evidence but does not settle the etymology."
  sources_to_check:
    - DDD, s.v. "Shadday"
    - F. M. Cross, Canaanite Myth and Hebrew Epic (1973)
    - "J. A. Hackett, The Balaam Text from Deir ʿAllā (HSM 31, 1984)"

- id: athtar
  aliases: [ʿAṯtar, Ashtar, Attar]
  cultures: [ugaritic, arabian, moabite]
  scope: >-
    The West Semitic and South Arabian male deity ʿAṯtar, associated with the Venus star. In
    the Ugaritic Baal Cycle he is made king after Baal's death but proves too small for Baal's
    throne and comes down to rule the earth. The entry covers his Ugaritic, Moabite
    (Ashtar-Chemosh) and South Arabian forms and the proposal that his myth lies behind the
    fall of the "Day Star" in Isa 14.
  passages:
    - "Isa 14:12-15 | parallel? | Day Star, son of Dawn, aspires to the mount of assembly in Zaphon and is cast down; Athtar's failed enthronement compared"
    - "Ezek 28:2-10 | parallel? | A ruler who claims to sit on the seat of the gods is brought down to the Pit"
  related: [baal-cycle, astarte, ishtar, shahar-and-shalim, mesha-stele, chemosh, cosmic-mountain]
  wikipedia: ʿAṯtar
  image: null
  author_notes:
    - "The key Ugaritic passage is KTU 1.6 I 43-67: El and Athirat choose ʿAṯtar ʿrẓ ('the terrible'?), whose feet do not reach the footstool and whose head does not reach the top of Baal's throne; he descends and rules 'the earth'. In KTU 1.2 III he complains that he has no palace. Quote from a standard translation."
    - "Linking Isa 14:12-15 to ʿAṯtar is one of several proposals (others include Helel and Shahar as Venus and Dawn, or Greek Phaethon). Present it as debated. H. R. Page (1996) traces a 'cosmic rebellion' myth through Ugaritic and biblical texts; note that this is a reconstruction."
    - "ʿAṯtar is the male counterpart of Astarte (ʿAštart) and Mesopotamian Ishtar; keep the gender distinction clear. On the Mesha Stele (line 17) Mesha devotes Nebo's population to ʿštr kmš (Ashtar-Chemosh), probably a compound or a consort pairing; its meaning is debated."
    - "In South Arabia ʿAṯtar was a leading god (often first in lists). Some scholars connect him with irrigation and rain; avoid building too much on later Arabic etymologies."
  sources_to_check:
    - COS 1.86
    - DDD, s.v. "Athtar"
    - "H. R. Page Jr., The Myth of Cosmic Rebellion (VTSup 65, 1996)"
    - M. S. Smith, The Origins of Biblical Monotheism (2001)

- id: azazel
  aliases: [ʿĂzāʾzēl, Asael, scapegoat]
  cultures: [hebrew, jewish]
  scope: >-
    The enigmatic recipient of the second goat on the Day of Atonement (Lev 16) and the
    figure of Asael/Azazel in Second Temple literature, where he becomes a fallen angel
    blamed for teaching forbidden arts. The entry covers the name, its interpretations and
    its afterlife; the ritual and its elimination-rite parallels belong to
    day-of-atonement-elimination, and wilderness demons generally to demons.
  passages:
    - "Lev 16:8 | language | A lot 'for YHWH' and a lot 'for Azazel'; the parallel suggests a personal name"
    - "Lev 16:10 | practice | Goat presented alive and sent 'to Azazel' into the wilderness"
    - "Lev 16:21-22 | practice | Iniquities confessed over the goat, carried off to a 'cut-off land' (ʾereṣ gĕzērâ)"
    - "Lev 16:26 | practice | The one who sets the goat free washes before re-entering the camp"
    - "Lev 17:7 | concept | Ban on sacrifices to goat-demons (śĕʿîrîm) in the open field"
    - "Isa 34:14 | concept | Goat-demons and Lilith haunt desolate Edom: the wilderness as demonic realm"
    - "1En 8:1 | concept | Asael teaches metalworking, weapons and cosmetics"
    - "1En 10:4-8 | concept | Raphael binds Asael and casts him into darkness in the desert; all sin ascribed to him"
  related: [day-of-atonement-elimination, demons, first-enoch, hittite-elimination-rituals, lots-and-cleromancy, nephilim, satan-the-adversary]
  wikipedia: Azazel
  image: null
  author_notes:
    - "Set out the interpretations: (1) a demon or wilderness deity, the most common critical view, supported by the lot 'for YHWH' and 'for Azazel'; (2) 'the goat that goes away' (ʿēz ʾōzēl; Septuagint apopompaios, Vulgate caper emissarius, hence Tyndale's 'scapegoat'); (3) a place name such as 'rugged cliff' (rabbinic; m. Yoma 6:6-8); (4) an abstract noun 'complete removal'."
    - Milgrom and others argue that, even if Azazel was originally a demon, Lev 16 neutralizes him. The goat is not a sacrifice to Azazel but a vehicle that removes sin to his realm. Make this distinction clear.
    - "Qumran texts (4Q180; the Temple Scroll) spell the name with a metathesis, often read as ʿzzʾl, 'El is strong' or 'fierce god'. Verify the spellings before citing them. The Enochic Asael (Aramaic ʿśʾl) was later assimilated to Azazel (Apocalypse of Abraham)."
    - Keep later Christian and occult demonology (Azazel as Satan, Milton, modern fiction) to a brief reception note.
  sources_to_check:
    - DDD, s.v. "Azazel"
    - "J. Milgrom, Leviticus 1-16 (AB 3, 1991)"
    - "D. P. Wright, The Disposal of Impurity (SBLDS 101, 1987)"
    - "L. L. Grabbe, 'The Scapegoat Tradition: A Study in Early Jewish Interpretation,' JSJ 18 (1987)"
    - "D. Stökl Ben Ezra, The Impact of Yom Kippur on Early Christianity (WUNT 163, 2003)"

- id: bes
  aliases: [Bes-image, Bes figures]
  cultures: [egyptian, phoenician, judahite]
  scope: >-
    The Egyptian protective dwarf god with a lion-like mane, frontal face and feathered crown,
    guardian of childbirth, sleep and the household against snakes and demons. Bes amulets,
    figurines and vessels were common in the Iron Age and Persian-period Levant, and Bes-like
    figures appear in the Kuntillet ʿAjrud drawings.
  passages:
    - "Isa 3:18-20 | realia | Women's ornaments include crescents and amulets (lĕḥāšîm); Bes pendants are among the commonest Iron Age amulets"
    - "Ps 91:5-6, 13 | concept? | Protection from night terrors, plague, lion and serpent: the dangers Bes warded off"
  related: [kuntillet-ajrud-inscriptions, kuntillet-ajrud, amulets, demons, lamashtu-pazuzu-amulets, apotropaic-doorposts-and-thresholds]
  wikipedia: Bes
  image: Bes amulet faience
  author_notes:
    - "On Kuntillet ʿAjrud Pithos A, the two standing figures beneath the 'YHWH of Samaria and his asherah' inscription were once identified as YHWH and Asherah (Gilula). Most specialists now see Bes-type figures, and Beck argued that the drawings and the inscription are not one composition. Correct the popular 'portrait of YHWH and his wife'."
    - "'Bes' is a convenient modern label for a type. In Egypt the iconography covers several related demon-gods (Aha and others), and the name Bes is late. Explain this briefly."
    - Bes's protective role (childbirth, children, sleep, against snakes) explains his popularity in households and on amulets in Judah and Israel. This shows Egyptian apotropaic imagery used by Judahites without implying worship of Bes as a major deity.
    - "Note Persian-period Bes vessels and the large Bes figures in Phoenician and Cypriot contexts."
  sources_to_check:
    - "P. Beck, 'The Drawings from Ḥorvat Teiman (Kuntillet ʿAjrud),' Tel Aviv 9 (1982)"
    - O. Keel and C. Uehlinger, Gods, Goddesses, and Images of God in Ancient Israel (1998)
    - V. Dasen, Dwarfs in Ancient Egypt and Greece (1993)
    - "C. Herrmann, Ägyptische Amulette aus Palästina/Israel (OBO 138, 1994)"

- id: angelology
  aliases: [archangels, Michael, Gabriel, Raphael, Uriel, angels of the nations]
  cultures: [jewish, hebrew]
  scope: >-
    The development of named angels, ranks of angels and national angelic "princes" in
    Persian- and Hellenistic-period Judaism (Daniel, Tobit, 1 Enoch, Jubilees, Qumran) and
    their reception in the New Testament. Anonymous divine messengers and the angel of YHWH,
    and the divine council, have their own entries.
  passages:
    - "Deut 32:8 | concept | Nations allotted to the 'sons of God' (LXX 'angels of God'); background for national princes"
    - "Zech 1:9-14 | concept | An unnamed interpreting angel mediates the vision"
    - "Ezek 9:2-3 | concept | Man clothed in linen with a scribe's writing case among the executioners"
    - "Dan 8:16; 9:21 | concept | Gabriel, the first angel named in the Hebrew Bible, interprets visions"
    - "Dan 10:13, 20-21 | concept | Michael, 'one of the chief princes', fights the princes of Persia and Greece"
    - "Dan 12:1 | concept | Michael, the great prince who protects Israel, arises at the end time"
    - "Tob 12:15 | concept | Raphael, 'one of the seven angels who stand ready' before the Lord; cf. 3:17"
    - "1En 20:1-8 | concept | Names and duties of the archangels (seven in Greek, six in Ethiopic)"
    - "Jub 2:2 | concept | Angels of the presence, of sanctification and of the elements created on the first day"
    - "Luke 1:19, 26 | concept | Gabriel, 'who stands in the presence of God', announces births"
    - "Jude 9 | concept | The archangel Michael disputes with the devil over Moses' body"
    - "Rev 12:7-9 | concept | Michael and his angels fight the dragon"
  related: [angel-of-yhwh, divine-council, sons-of-god, first-enoch, zoroastrianism, satan-the-adversary, war-scroll, demons]
  wikipedia: Angels in Judaism
  image: null
  author_notes:
    - Names and ranks appear only in late texts (Daniel, Tobit, 1 Enoch). Earlier biblical messengers are anonymous and often refuse to give a name (Judg 13:17-18). Explain the shift rather than reading later angelology back.
    - "Background proposals: Mesopotamian vizier or messenger gods (sukkallu; e.g. Nusku, Papsukkal) and Ugaritic messenger pairs for the role; Persian Aməša Spəntas for the seven archangels, which is debated; the demon Asmodeus in Tobit, a clear Iranian borrowing (Aēšma). Separate the firm from the speculative."
    - "Olyan (1993) argued that many angel names and classes arose from exegesis of biblical words. A rabbinic tradition (y. Rosh Hash. 1:2) says the names of the angels 'came up from Babylon'. Verify the reference before quoting it."
    - The War Scroll (1QM 9:15-16) names Michael, Gabriel, Sariel and Raphael on the shields of the towers. Note the variation in lists of four and seven across 1 Enoch 9, 20 and 40 and Qumran.
  sources_to_check:
    - "S. M. Olyan, A Thousand Thousands Served Him (TSAJ 36, 1993)"
    - "M. Mach, Entwicklungsstadien des jüdischen Engelglaubens in vorrabbinischer Zeit (TSAJ 34, 1992)"
    - ABD, s.v. "Angels"

