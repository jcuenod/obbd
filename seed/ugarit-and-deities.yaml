    - "Deut 3:11 | concept | Og's nine-cubit iron/basalt bed"
    - "Josh 11:21-22 | concept | Joshua cuts off the Anakim; survivors in Gaza, Gath and Ashdod"
    - "1Sam 17:4 | concept | Goliath's height (MT six cubits; 4QSama and LXX four)"
    - "Ezek 32:27 | concept? | Fallen warriors of old in Sheol (reading nōpəlîm with LXX)"
    - "Sir 16:7 | concept | The ancient giants who revolted were not forgiven"
    - "1En 7:1-6 | concept | Giants born of the Watchers devour humanity"
    - "Jub 5:1-11 | concept | Watchers' offspring destroyed before the flood"
  related: [sons-of-god, rephaim, first-enoch, enmeduranki-and-the-apkallu, gilgamesh-epic, champion-combat, jubilees, dead-sea-scrolls]
  wikipedia: Nephilim
  image: null
  author_notes:
    - The etymology from npl "fall" ("fallen ones") is uncertain; other proposals exist. Do not translate as "fallen angels".
    - Num 13:33's identification of Anakim with Nephilim is often regarded as a gloss; Gen 6:4's "and also afterward" may also harmonize traditions.
    - Comparative background includes Greek heroes/Titans (Hendel) and the Mesopotamian apkallu and Gilgamesh traditions, which the Qumran Book of Giants uses explicitly (Gilgamesh and Hobabish).
