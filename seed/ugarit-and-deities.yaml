  wikipedia: Sin (mythology)
  image: Nabonidus stele British Museum
  author_notes:
    - Nabonidus's devotion to Sin of Harran is the best-documented first-millennium case; link to the Nabonidus entries and Harran stelae.
    - The Aramean bull-headed moon-god stelae with crescent (e.g. Bethsaida) show a Levantine Harran-type cult; verify details.
    - Correct speculative etymologies (Sinai from Sin; Laban "white" or Jericho from yārēaḥ as evidence of patriarchal moon worship); they are not mainstream.
  sources_to_check:
