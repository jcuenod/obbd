- id: marduk
  aliases: [Bel, Merodach]
  cultures: [babylonian]
  scope: >-
    Marduk, city god of Babylon and from the late second millennium head of the
    Babylonian pantheon, celebrated in Enuma Elish as victor over Tiamat and king of
    the gods; often called simply Bel ("lord"). The entry covers his cult and its
    reflection in exilic prophecy and later Jewish literature.
  passages:
    - "Isa 46:1-2 | polemic | Bel bows down, Nebo stoops; idols carried as burdens on beasts"
    - "Jer 50:2 | polemic | 'Bel is put to shame, Merodach is dismayed'"
    - "Jer 51:44 | polemic | YHWH punishes Bel in Babylon and makes him disgorge"
    - "Isa 44:24-45:7 | polemic | YHWH, not Marduk, calls Cyrus; cf. Cyrus Cylinder"
    - "Bel 1-22 | polemic | Daniel exposes the priests who 'feed' the idol Bel"
    - "Dan 4:8 | language | Belteshazzar 'named after the name of my god' (Aram. 4:5)"
    - "Isa 39:1 | language | Merodach-baladan (Marduk-apla-iddina)"
    - "2Kgs 25:27 | language | Evil-merodach (Amel-Marduk)"
    - "Esth 2:5 | language | Mordecai, a name derived from Marduk"
  related: [enuma-elish, babylon, akitu-festival, cyrus-cylinder, nabu, cult-images, etemenanki, amel-marduk]
  wikipedia: Marduk
  image: Marduk cylinder seal lapis lazuli
  author_notes:
    - Explain Marduk's rise (often linked to the Nebuchadnezzar I period) and his supremacy in Enuma Elish; the date of Enuma Elish is debated.
    - Deutero-Isaiah's idol polemic and procession imagery (Isa 46) are best read against Akitu processions and the Cyrus Cylinder's claim that Marduk chose Cyrus.
    - The derivation of Mordecai from Marduk is consensus; Esther from Ishtar is debated and should not be stated as fact.
  sources_to_check:
    - W. G. Lambert, Babylonian Creation Myths (2013)
    - DDD, s.v. "Marduk"

- id: nabu
  aliases: [Nebo, Nabû]
  cultures: [babylonian, assyrian]
  scope: >-
    Nabu, Babylonian god of scribes and writing, son of Marduk, with his main temple
    (Ezida) at Borsippa and a major cult in first-millennium Assyria. The entry covers
    his cult and his presence in biblical names and polemic.
  passages:
    - "Isa 46:1 | polemic | 'Nebo stoops' beside Bel in the procession of Babylon's gods"
    - "Dan 1:7 | language | Abednego, a deformation of Abed-Nabu 'servant of Nabu'"
    - "2Kgs 25:8 | language | Nebuzaradan (Nabu-zer-iddin), captain of the guard"
    - "Jer 39:13 | language | Nebushazban, a Babylonian officer"
    - "Num 32:38 | language? | The Moabite town Nebo, possibly named for the god"
    - "Ezek 9:2-4 | imagery? | Man in linen with a scribe's writing case who marks the righteous"
  related: [marduk, nebuchadnezzar-ii, tablet-of-destinies, scribes-and-scribal-education, babylon, nimrud]
  wikipedia: Nabu
  image: Statue of Nabu Nimrud British Museum
  author_notes:
    - Nebuchadnezzar (Nabu-kudurri-uṣur) and many Babylonian names carry Nabu; give the etymology.
    - Nabu as keeper of the Tablet of Destinies and divine scribe is a frequent comparison for heavenly books and the scribal figure in Ezek 9; present as background, not source.
    - Whether Mount Nebo and the Moabite town reflect the Mesopotamian god is debated.
    - Aramaic papyri from Hermopolis mention a temple of Nabu at Syene, showing the cult among Arameans in Egypt.
  sources_to_check:
    - DDD, s.v. "Nabu"

- id: ishtar
  aliases: [Inanna, Ištar]
  cultures: [mesopotamian, sumerian, assyrian]
  scope: >-
    Ishtar (Sumerian Inanna), the Mesopotamian goddess of sexual love and war,
    identified with the planet Venus, with major cults at Uruk, Nineveh and Arbela.
    The entry covers her mythology and cult and the biblical passages most often
    discussed in relation to her.
  passages:
    - "Jer 7:18 | concept? | Ishtar (šarrat šamê) as the leading candidate for the Queen of Heaven"
    - "Jer 44:17-19 | practice? | Cakes and libations for the Queen of Heaven; cf. kamānu cakes for Ishtar"
    - "Ezek 8:14 | concept | Weeping for Tammuz, Ishtar's consort"
    - "Isa 41:8-13 | form | 'Fear not' oracles; cf. Neo-Assyrian oracles of Ishtar of Arbela"
    - "Song 4:9-12 | parallel? | 'My sister, my bride'; cf. Inanna-Dumuzi love songs"
    - "Esth 2:7 | language? | Esther possibly from Ishtar, or from Persian 'star'"
  related: [descent-of-inanna-ishtar, ishtar-gate, queen-of-heaven, tammuz, astarte, sumerian-love-songs, neo-assyrian-prophecies, burney-relief]
  wikipedia: Inanna
  image: Ishtar Akkadian cylinder seal
  author_notes:
    - Treat Ishtar and Astarte as cognate but distinct; first-millennium Levantine syncretism is plausible but should not be assumed.
    - The Neo-Assyrian prophecies to Esarhaddon from Ishtar of Arbela are the strongest formal parallel to Deutero-Isaiah's salvation oracles.
    - Love-song parallels to the Song of Songs are typological; avoid the older cultic-mythological (sacred-marriage) reading of the Song as consensus.
    - Correct the "temple prostitution" stereotype; Herodotus 1.199 and related claims are widely doubted.
  sources_to_check:
    - SAA 9
    - DDD, s.v. "Ishtar"

- id: hadad-rimmon
  aliases: [Hadad, Adad, Addu, Rimmon, Ramman]
  cultures: [aramean, assyrian, ugaritic]
  scope: >-
    Hadad (Akkadian Adad, Addu), the storm god of Syria and Mesopotamia, chief god of
    the Aramean kingdoms and especially Damascus, where he was called Rimmon
    (Akkadian Rammānu, "thunderer"). The entry covers the god, his iconography, and
    Hadad and Rimmon names in the Bible.
  passages:
    - "2Kgs 5:18 | attests | The temple of Rimmon in Damascus, where Naaman's master worships"
    - "1Kgs 15:18 | language | Ben-hadad son of Tabrimmon: Hadad and Rimmon names in Damascus"
    - "2Sam 8:3 | language | Hadadezer, 'Hadad is help', king of Zobah"
    - "1Kgs 20:23 | concept | Arameans claim Israel's gods are 'gods of the hills'"
    - "2Chr 28:23 | practice | Ahaz sacrifices to the gods of Damascus"
    - "Zech 12:11 | practice? | Mourning for Hadad-rimmon in the plain of Megiddo (deity or place)"
  related: [baal, damascus, arameans, ben-hadad, tell-fekheriye-statue, melqart-stele, baal-with-thunderbolt, tammuz]
  wikipedia: Hadad
  image: Adad storm god stele bull
  author_notes:
    - Rimmon is the Akkadian epithet Rammānu, vocalized in Hebrew to resemble rimmôn "pomegranate"; explain the pun.
    - 'Zech 12:11 is debated: a lament for a dying god (Hadad-rimmon), a place name near Megiddo, or the mourning for Josiah; do not settle it.'
    - The Tell Fekheriye statue (Hadad of Sikan) and Zincirli Hadad statue are key inscriptional sources; Ugaritic Baal is Hadad under another title.
  sources_to_check:
