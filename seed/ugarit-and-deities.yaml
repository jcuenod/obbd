- id: seraphim
  aliases: [seraph, śərāpîm]
  cultures: [judahite, egyptian]
  scope: >-
    The seraphim (from śrp "burn"), the six-winged attendants of Isaiah's throne
    vision, and the "fiery serpents" (śərāpîm) of the wilderness and prophetic oracles.
    The entry covers their background in the Egyptian winged uraeus as adopted in
    Iron Age Judahite iconography.
  passages:
    - "Isa 6:2-7 | imagery | Six-winged seraphim proclaim holiness; one touches Isaiah's lips with a coal"
    - "Num 21:6-9 | imagery | Fiery serpents (śərāpîm) bite Israel; Moses makes a śārāp on a pole"
    - "Deut 8:15 | imagery | Wilderness of fiery serpents and scorpions"
    - "Isa 14:29 | imagery | A 'flying fiery serpent' (śārāp məʿôpēp)"
    - "Isa 30:6 | imagery | Viper and flying seraph in the Negeb"
  related: [nehushtan, cherubim, divine-council, seals-and-bullae, divine-wings, ezekiel-throne-chariot]
  wikipedia: Seraph
  image: winged uraeus Hebrew seal
  author_notes:
    - The serpent identification is the dominant critical view (Keel; Joines), based on śārāp as serpent elsewhere and on four-winged uraei on 8th-century Judahite and Israelite seals; some prefer a non-serpentine burning being.
    - The uraeus's protective, fire-spitting role and its covering wings help explain the seraphim covering face and feet.
    - Do not overstate Egyptian influence as direct borrowing; the motif came through Phoenician and Levantine mediation.
  sources_to_check:
    - O. Keel, Jahwe-Visionen und Siegelkunst (SBS 84/85, 1977)
    - DDD, s.v. "Seraphim"

- id: nehushtan
  aliases: [bronze serpent, copper serpent]
  cultures: [judahite, egyptian, arabian]
  scope: >-
    The bronze serpent made by Moses according to Num 21 and destroyed by Hezekiah
    as the cult object Nehushtan, together with the archaeological corpus of copper
    and bronze serpents from Bronze and Iron Age sanctuaries in the southern Levant.
  passages:
    - "Num 21:4-9 | realia | Moses makes a bronze serpent on a pole that heals the bitten"
    - "2Kgs 18:4 | realia | Hezekiah breaks the bronze serpent 'called Nehushtan' that received offerings"
    - "Wis 16:5-7 | concept | The serpent as a 'symbol of salvation', healing by God not the object"
    - "John 3:14-15 | imagery | The Son of Man lifted up like the serpent in the wilderness"
  related: [seraphim, timna, hezekiah, cult-reforms-archaeology, midianites-and-kenites, copper-production, cult-images]
  wikipedia: Nehushtan
  image: Timna copper snake
  author_notes:
    - The gilded copper snake from the Timna shrine (Rothenberg's Midianite phase) is the most cited parallel, alongside bronze serpents from Megiddo, Hazor and Gezer; note Midianite associations with the Num 21 setting.
    - Note the wordplay nəḥaš nəḥōšet; whether "Nehushtan" was the cult name or Hezekiah's dismissive label is debated.
    - Many scholars read Num 21:4-9 as an etiology legitimating a Jerusalem cult object; present this alongside the narrative's own claim.
    - The historicity of Hezekiah's reform is debated archaeologically; link to the cult-reform entry.
  sources_to_check:
    - K. R. Joines, "The Bronze Serpent in the Israelite Cult," JBL 87 (1968)
    - 'B. Rothenberg, Timna: Valley of the Biblical Copper Mines (1972)'
    - DDD, s.v. "Nehushtan"

- id: leviathan
  aliases: [Litan, Lotan, Liwyatan]
  cultures: [ugaritic, hebrew, jewish]
  scope: >-
    Leviathan, the multi-headed sea serpent defeated or tamed by YHWH, cognate with
    Ugaritic Litan, the "fleeing, twisting serpent with seven heads" defeated by Baal
    and Anat. The entry traces the figure from Ugarit through the Hebrew Bible to
    apocalyptic literature.
  passages:
    - "Isa 27:1 | parallel | Leviathan the fleeing, twisting serpent; nearly verbatim with KTU 1.5 I 1-3"
    - "Ps 74:14 | imagery | YHWH crushes the heads of Leviathan"
    - "Job 3:8 | imagery | Those skilled to rouse Leviathan, invoked to curse a day"
    - "Job 41:1-34 | imagery | Leviathan as untameable creature, king over the proud (MT 40:25-41:26)"
    - "Ps 104:26 | polemic? | Leviathan formed to play in the sea"
    - "1En 60:7-9 | concept | Leviathan, female, in the depths of the sea; Behemoth on land"
    - "2Esd 6:49-52 | concept | Behemoth and Leviathan created and kept as food (4 Ezra)"
    - "Rev 12:3; 13:1 | imagery | Seven-headed dragon and beast from the sea"
  related: [baal-cycle, chaoskampf, tannin, rahab-sea-monster, behemoth, yam, first-enoch]
  wikipedia: Leviathan
  image: Seven-headed dragon Akkadian cylinder seal
  author_notes:
    - The Isa 27:1 / KTU 1.5 I 1-3 correspondence is among the closest verbal parallels between Ugaritic and Hebrew; Ugaritic ltn is now usually vocalized Litan (not Lotan).
    - Seven-headed dragons appear in Mesopotamian art from the third millennium (e.g. Tell Asmar seal); this and Ps 74's plural "heads" bear on Rev 12-13.
    - Whether Job 41 describes a mythic creature or a crocodile is debated; the trend is toward a mythic reading informed by Egyptian royal hunt imagery.
    - Ps 104:26 may domesticate the monster as a creature YHWH plays with; note the ambiguity of "to play with it".
  sources_to_check:
    - KTU 1.3 III; 1.5 I
    - J. Day, God's Conflict with the Dragon and the Sea (1985)
    - DDD, s.v. "Leviathan"

- id: rahab-sea-monster
  aliases: [Rahab (monster)]
  cultures: [hebrew]
  scope: >-
    Rahab ("boisterous, arrogant one"), a primordial sea monster defeated by YHWH in
    Hebrew poetry and used as a sobriquet for Egypt. The name is not attested outside
    the Bible and is unrelated to Rahab of Jericho.
  passages:
    - "Job 9:13 | imagery | 'The helpers of Rahab' bow beneath God"
    - "Job 26:12 | imagery | By his understanding he struck down Rahab"
    - "Ps 89:10 | imagery | YHWH crushed Rahab like a carcass (MT 89:11)"
    - "Isa 51:9 | imagery | Arm of YHWH that cut Rahab in pieces and pierced the dragon"
    - "Isa 30:7 | language | Egypt's help is vain; 'Rahab who sits still'"
    - "Ps 87:4 | language | Rahab (Egypt) and Babylon among those who know YHWH"
    - "Ps 40:4 | language? | rəhābîm 'the proud', possibly Rahab's allies (MT 40:5)"
  related: [chaoskampf, leviathan, tannin, yam, tehom, enuma-elish]
  wikipedia: Rahab (term)
  image: null
  author_notes:
    - Distinguish Rahab (rahab) the monster from Rahab (rāḥāb) of Jericho; the spellings differ.
    - Unlike Leviathan and Tannin, Rahab has no secure extrabiblical cognate; note this.
    - Isa 51:9-10 fuses the defeat of Rahab with the Sea crossing, typical of the historicizing of combat myth.
    - The text of Isa 30:7 is difficult; present emendations neutrally.
  sources_to_check:
    - J. Day, God's Conflict with the Dragon and the Sea (1985)
    - DDD, s.v. "Rahab"

- id: behemoth
  cultures: [hebrew, jewish, egyptian]
  scope: >-
    Behemoth, the mighty land creature presented in God's second speech to Job, and
    in later Jewish apocalyptic the land counterpart of Leviathan. The entry covers
    natural (hippopotamus) and mythological interpretations.
  passages:
    - "Job 40:15-24 | imagery | Behemoth, 'first of the great acts of God', untameable by humans"
    - "1En 60:7-9 | concept | Behemoth, male, in the desert of Dendain; Leviathan in the sea"
    - "2Esd 6:49-52 | concept | Behemoth and Leviathan kept for the end-time (4 Ezra)"
  related: [leviathan, chaoskampf, first-enoch, baal-cycle, egyptian-kingship, smiting-the-enemy-motif]
  wikipedia: Behemoth
  image: Horus harpooning hippopotamus relief Edfu
  author_notes:
    - The hippopotamus identification is traditional and still common; Keel's reading via Egyptian royal and Horus hippopotamus-hunt iconography (hippo as Seth) offers a bridge between natural and mythic readings.
    - Some (Pope, Day) connect Behemoth with Ugaritic ʿgl il ʿtk ("El's calf Atik") among Baal's and Anat's defeated foes (KTU 1.3 III); this is disputed.
    - The form is an intensive plural of bəhēmâ "beast"; Hebrew grammar, not a loanword, explains it.
    - Correct popular claims that Behemoth is a dinosaur; this is a fringe reading.
  sources_to_check:
    - O. Keel, Jahwes Entgegnung an Ijob (FRLANT 121, 1978)
    - J. Day, God's Conflict with the Dragon and the Sea (1985)
    - DDD, s.v. "Behemoth"

- id: tannin
  aliases: [tannîn, tanninim, dragon, Tunnanu]
  cultures: [hebrew, ugaritic]
  scope: >-
    Tannin (plural tanninim), the sea dragon or serpent of Hebrew poetry, cognate with
    Ugaritic tnn, defeated by Baal and Anat. The term ranges from a mythic chaos
