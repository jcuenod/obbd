# Seed entries: Ugaritic literature, ANE deities and divine beings, sea monsters,
# the divine council and related concepts. See docs/seed-guide.md.

- id: baal-cycle
  aliases: [Baal Epic, Baʿlu Myth, Baal and Anat]
  cultures: [ugaritic]
  date: [-1350, -1185]
  circa: true
  scope: >-
    The Ugaritic mythological cycle on six tablets (KTU 1.1-1.6) narrating Baal's
    combat with Yam (Sea), the building of his palace on Mount Zaphon, and his
    death at the hands of Mot (Death) and return to life and kingship. The entry
    covers the composition and its biblical comparanda; the deities themselves
    have their own entries.
  passages:
    - "Ps 29 | parallel | Storm-god hymn: divine assembly, thunderous voice over the waters, Lebanon and Sirion, enthronement"
    - "Ps 93 | parallel | Divine kingship established over the raging floods (neharot)"
    - "Exod 15:1-18 | parallel | Victory at the sea, mountain sanctuary, and eternal kingship in sequence"
    - "Isa 27:1 | parallel | Leviathan the fleeing, twisting serpent; nearly verbatim with KTU 1.5 I 1-3"
    - "Ps 74:13-14 | parallel | Smashing the heads of the sea dragons and Leviathan"
    - "Ps 48:2 | language | Zion as yarkete ṣāpôn, transferring Baal's mountain Zaphon (MT 48:3)"
    - "Ps 68:4 | language | 'Rider on the clouds/steppes' recalls Baal's epithet rkb ʿrpt (MT 68:5)"
    - "Isa 25:8 | imagery | YHWH swallows Death, reversing Mot's all-devouring maw"
    - "Isa 14:12-15 | parallel? | Failed ascent to the divine mountain; cf. Athtar's failed enthronement on Zaphon"
    - "Dan 7:9-14 | parallel? | Aged enthroned judge and cloud-riding figure; El and Baal pattern (Emerton)"
    - "1Kgs 18:20-40 | polemic | YHWH, not Baal, controls rain and fire; mockery of an absent god"
    - "Deut 14:1 | practice | Gashing oneself in mourning; cf. El and Anat lacerate themselves for Baal"
  related: [ugaritic-texts, ugarit, baal, chaoskampf, cloud-rider, cosmic-mountain, leviathan, temple-building-accounts]
  wikipedia: Baal Cycle
  image: Baal Cycle tablet Ugarit
  author_notes:
    - Date refers to the extant tablets, written by the scribe Ilimilku under a King Niqmaddu; whether this is Niqmaddu II (mid-14th c.) or Niqmaddu III (late 13th c.) is debated. The story is older and orally transmitted.
    - The tablet order (especially of KTU 1.1-1.3) and whether the six tablets form one continuous narrative are disputed; present the standard sequence Yam - palace - Mot as conventional, not certain.
    - Avoid the older seasonal-ritual reading (de Moor's agricultural calendar) and the Frazerian "dying and rising god" frame as settled interpretations; both are now widely criticized.
    - The Ps 29 adaptation thesis (Ginsberg, Cross) is mainstream but not unanimous; distinguish shared West Semitic idiom from direct literary dependence throughout.
    - Note the seven-day building of Baal's palace (fire burning six days, completed on the seventh) in connection with seven-day patterns and temple-building accounts.
  sources_to_check:
    - KTU 1.1-1.6 (= CTA 1-6)
    - COS 1.86
    - ANET 129-142
    - M. S. Smith in S. B. Parker (ed.), Ugaritic Narrative Poetry (1997)
    - M. S. Smith and W. T. Pitard, The Ugaritic Baal Cycle, vols. 1-2 (VTSup 55, 114)
    - N. Wyatt, Religious Texts from Ugarit (2nd ed., 2002)

- id: aqhat-epic
  title: Aqhat Epic
  aliases: [Tale of Aqhat, Legend of Danel, Aqhatu Legend]
  cultures: [ugaritic]
  date: [-1350, -1185]
  circa: true
  scope: >-
    The Ugaritic narrative poem (KTU 1.17-1.19) about the just patriarch-king Danel,
    the divinely granted birth of his son Aqhat, Aqhat's refusal of the goddess Anat's
    offer of immortality in exchange for his bow, his murder, the ensuing drought, and
    his sister Pughat's revenge. The end of the story is lost.
  passages:
    - "Ezek 14:14, 20; 28:3 | attests | Danel (Ketiv dnʾl) as proverbial ancient righteous and wise man"
    - "Jub 4:20 | attests | Danel named as father-in-law of Enoch"
    - "Gen 18:1-8 | parallel | Hospitality to a divine visitor: Danel and Danatiya feed Kothar-wa-Hasis"
    - "Gen 15:1-6 | parallel | Childless patriarch receives divine promise of a son"
    - "1Sam 1:9-20 | parallel? | Childless petitioner at a sanctuary is granted a son"
    - "Isa 1:17 | language | Judging the cause of widow and orphan; cf. Danel's justice at the gate"
    - "Isa 51:17-18 | parallel | A son's duty to take a drunken parent by the hand"
    - "2Sam 18:18 | practice | Son raising a memorial stele for his father; cf. the duties of the ideal son"
    - "2Sam 1:21 | parallel | Curse withholding dew and rain from a place of death (KTU 1.19 I)"
  related: [ugaritic-texts, anat, rephaim, hospitality, widow-orphan-sojourner, courts-and-legal-procedure, care-for-the-dead, dream-incubation]
  wikipedia: Tale of Aqhat
  image: Aqhat tablet Ugarit
  author_notes:
    - Present the identification of Ezekiel's Danel (with Noah and Job, all non-Israelite ancients) with the Ugaritic Danel as the majority view (e.g. J. Day, VT 30, 1980); it is not the Daniel of the book of Daniel.
    - The list of a son's filial duties (KTU 1.17 I, repeated) is a key source for family religion and care of the dead; note the debated meaning of skn ilib ("stele of the ancestral god/divine ancestor").
    - Danel's seven-day ritual before the gods is often read as dream incubation; flag the debate.
    - Anat's offer of immortality and Aqhat's reply that mortals must die bear on ANE views of death and the gods; avoid reading the story as a fertility allegory.
  sources_to_check:
    - KTU 1.17-1.19 (= CTA 17-19)
    - COS 1.103
    - ANET 149-155
    - S. B. Parker (ed.), Ugaritic Narrative Poetry (1997)
    - N. Wyatt, Religious Texts from Ugarit (2nd ed., 2002)

- id: kirta-epic
  aliases: [Keret Epic, Legend of Keret, Kirta Legend]
  cultures: [ugaritic]
  date: [-1350, -1185]
  circa: true
  scope: >-
    The Ugaritic narrative poem (KTU 1.14-1.16) about King Kirta, who loses his
    family, is instructed by El in a dream to win a new bride by military expedition,
    obtains heirs, falls mortally ill after failing to keep a vow to Athirat, is healed
    by El, and is challenged by his son for neglecting justice.
  passages:
    - "1Kgs 3:5-15 | parallel | King receives a dream theophany and divine grant (El appears to the weeping Kirta)"
    - "Gen 15:1-6 | parallel? | Lament over lack of heir answered by divine promise of offspring"
    - "Job 1:13-19 | parallel? | Successive calamities wipe out the hero's family"
    - "Job 42:10-17 | parallel? | Restoration of household and new children"
    - "Deut 20:7 | practice | Newlywed exempt from war; contrast Kirta's total levy taking even the bridegroom"
    - "Deut 23:21-23 | practice | Danger of an unfulfilled vow; Kirta's broken vow to Athirat brings illness"
    - "2Sam 15:1-6 | parallel | Royal son challenges father for not hearing the people's cases"
    - "Ps 72:1-4, 12-14 | concept | King's duty to judge the widow, orphan and poor"
    - "Ps 82:6-7 | parallel? | 'Son of El' who must nevertheless die; cf. 'Shall Kirta, son of El, die?'"
  related: [ugaritic-texts, el, asherah, royal-ideology, king-as-son-of-god, dream-incubation, vows-and-votive-offerings, widow-orphan-sojourner]
  wikipedia: Legend of Keret
  image: Kirta tablet Ugarit
  author_notes:
    - Early readings of Kirta as a historical epic of patriarchal migrations (Virolleaud's "Terah", "Zebulun", "Asher", the Negeb) are discredited and should be mentioned only as a historiographical caution.
    - The text is a key witness to Late Bronze royal ideology (king as son of El, guarantor of fertility and justice) and to the tension between sacral kingship and mortality.
    - The siege of Udum follows a six-days-then-the-seventh pattern; useful for seven-day patterns, but avoid claiming dependence for Josh 6.
    - The story may be incomplete (the ending is lost or the cycle unfinished); say so.
  sources_to_check:
    - KTU 1.14-1.16 (= CTA 14-16)
    - COS 1.102
    - ANET 142-149
    - E. L. Greenstein in S. B. Parker (ed.), Ugaritic Narrative Poetry (1997)
    - N. Wyatt, Religious Texts from Ugarit (2nd ed., 2002)

- id: shahar-and-shalim
  aliases: [Dawn and Dusk, Birth of the Gracious Gods, Shachar, Shalem]
  cultures: [ugaritic, canaanite]
  scope: >-
    Shahar (Dawn) and Shalim (Dusk), twin deities whose conception by El is told in
    the Ugaritic ritual-mythic text KTU 1.23 ("The Birth of the Gracious and Beautiful
    Gods"). The entry covers both deities, the text, and biblical echoes of Shahar and
    Shalem; the kid-in-milk question is treated under its own entry.
  passages:
    - "Isa 14:12 | language | Helel ben Shahar, 'Day Star, son of Dawn'"
    - "Ps 139:9 | imagery | 'Wings of the dawn' (kanpe-šaḥar)"
    - "Job 3:9 | imagery | 'Eyelids of the dawn' personified"
    - "Job 41:18 | imagery | Leviathan's eyes like the eyelids of dawn (MT 41:10)"
    - "Ps 110:3 | imagery? | 'From the womb of the dawn' (MT obscure; mišḥār)"
    - "Gen 14:18 | language? | Salem, often linked to the god Shalem in the name Jerusalem"
    - "Ps 76:2 | language? | Salem as YHWH's abode (MT 76:3)"
    - "Exod 23:19 | practice? | Formerly linked to KTU 1.23:14; the Ugaritic reading is now doubted"
  related: [el, jerusalem, kid-in-mothers-milk, ugaritic-texts, host-of-heaven, cosmic-mountain]
  wikipedia: Shahar (god)
  image: null
  author_notes:
    - The derivation of (Uru)salim/Jerusalem as "foundation of Shalem" is widely held but not certain; present it with caution, and treat theophoric readings of Absalom and Solomon as speculative.
    - KTU 1.23 combines a liturgical frame with myth; whether it is a sacred-marriage rite or royal ritual is debated.
    - Cite Ratner and Zuckerman (HUCA 57, 1986) for the collapse of the old reading "seethe a kid in milk" at line 14.
    - In Isa 14:12 the closer mythic background may be Athtar or Venus (Helel) rather than Shahar himself; Shahar is the father in the epithet.
  sources_to_check:
    - KTU 1.23 (= CTA 23)
    - COS 1.87
    - T. J. Lewis in S. B. Parker (ed.), Ugaritic Narrative Poetry (1997)
    - DDD, s.v. "Shahar"; "Shalem"; "Helel"

- id: statue-of-el
  cultures: [ugaritic]
  date: [-1400, -1200]
  circa: true
  scope: >-
    A small Late Bronze Age cast-bronze figurine of a seated, bearded male deity
    from Ugarit, overlaid with gold foil, conventionally identified as El, the aged
    head of the Ugaritic pantheon. The entry uses the object to introduce El's
    iconography (enthroned, aged, raising a hand in blessing).
  passages:
    - "Dan 7:9 | imagery? | Ancient of Days enthroned, white-haired; cf. El as aged 'father of years'"
    - "1Kgs 22:19 | imagery | Deity seated on a throne with the heavenly host standing beside him"
    - "Isa 6:1 | imagery | Enthroned, exalted deity presiding over his court"
    - "Ps 82:1 | concept | God presiding in the 'council of El'"
    - "Job 36:26 | imagery? | Number of God's years unsearchable; cf. El's epithet ab šnm"
  related: [el, divine-council, ugarit, cult-images, composite-beasts-daniel, cherub-throne]
  wikipedia: null
  image: Seated god El bronze statuette Ugarit gold
  author_notes:
    - Verify the excavation number, find-spot and current location before writing; several seated gold-foiled bronzes from Ugarit circulate under the label "El", and the stone "El stele" from Ugarit is a different object.
    - The identification as El rests on typology (seated, bearded, raised hand) rather than an inscription; say so.
    - The meaning of El's epithet ab šnm ("father of years" versus other proposals) is debated; do not overstate the Dan 7:9 link.
  sources_to_check:
    - M. H. Pope, El in the Ugaritic Texts (VTSup 2, 1955)
    - I. Cornelius and H. Niehr, Götter und Kulte in Ugarit (2004)

- id: baal-with-thunderbolt
  aliases: [Baal au foudre, Baal Stele]
  cultures: [ugaritic]
  date: [-1500, -1200]
  circa: true
  scope: >-
    A limestone relief stele found in 1932 near the Temple of Baal at Ugarit,
    showing the storm god striding in the smiting pose, brandishing a club and
    holding a spear or lightning-shaft that sprouts vegetation, with a small figure
    (probably the king) beneath his arm.
  passages:
    - "Ps 29:3-9 | imagery | YHWH's thundering voice over the waters, shaking forests and wilderness"
    - "Ps 18:13-14 | imagery | Thunder and lightning as the deity's arrows (MT 18:14-15)"
    - "Ps 77:17-18 | imagery | Thunder, flashing arrows and lightning at the sea (MT 77:18-19)"
    - "Hab 3:11 | imagery | Light of the divine arrows, gleam of the flashing spear"
    - "Zech 9:14 | imagery | YHWH's arrow going forth like lightning"
    - "Job 37:2-5 | imagery | God's voice thunders; lightning to the ends of the earth"
  related: [baal, baal-cycle, ugarit, hadad-rimmon, smiting-the-enemy-motif, divine-warrior]
  wikipedia: Baal with Thunderbolt
  image: Baal with Thunderbolt Louvre
  location: Musée du Louvre, Paris
  author_notes:
    - Dating ranges from the 15th to the 13th century BCE in the literature; give a range and explain the basis. Verify the Louvre inventory number (commonly given as AO 15775).
    - The wavy lines beneath the god's feet are often read as mountains and/or sea; present as interpretation.
    - The spear-shaft as lightning-and-vegetation links storm and fertility; useful for explaining why Baal's rain is at stake in 1 Kgs 17-18.
    - Connect to the Egyptian and Levantine "smiting god" figurine type, and to Hadad iconography further north.
  sources_to_check:
    - I. Cornelius, The Iconography of the Canaanite Gods Reshef and Baʿal (OBO 140, 1994)
    - M. Yon, The City of Ugarit at Tell Ras Shamra (2006)

- id: marzeah
  aliases: [marzeaḥ, mrzḥ, marziḥu]
  cultures: [ugaritic, phoenician, hebrew]
  scope: >-
    The marzeaḥ, a West Semitic association of elite members who met for ritual
    feasting and heavy drinking under a patron deity, attested from Ebla and Ugarit
    through Phoenician, Aramaic, Nabataean and Palmyrene sources to rabbinic texts.
    The entry covers the institution and its debated funerary associations.
  passages:
    - "Amos 6:4-7 | practice | Ivory beds, wine, oil and music; 'the marzeaḥ of the loungers' (v. 7)"
    - "Jer 16:5-9 | practice | Prophet barred from the 'house of marzeaḥ' in a mourning context"
    - "Amos 2:8 | practice? | Drinking confiscated wine in the house of their god"
    - "Ps 106:28 | practice? | Eating 'sacrifices of the dead' at Baal-peor; linked to the marzeaḥ by rabbinic tradition"
  related: [care-for-the-dead, baal-peor, rephaim, mourning-rites, marseilles-tariff, samaria-ivories, ugaritic-texts]
  wikipedia: Marzeah
  image: null
  author_notes:
    - Central debate is whether the marzeaḥ was intrinsically funerary (cult of the dead, Rephaim) or a social-religious drinking club whose links to mourning are occasional; J. L. McLaughlin argues against an intrinsic funerary character.
    - KTU 1.114 depicts El drunk at his own marzeaḥ; legal texts (e.g. KTU 3.9) show the institution owned property and had a head (rb).
    - Note the Moabite "marzeaḥ papyrus" is unprovenanced and of doubtful authenticity; do not use it as primary evidence.
  sources_to_check:
    - KTU 1.114
    - KTU 3.9
    - KAI 60
    - J. L. McLaughlin, The Marzēaḥ in the Prophetic Literature (VTSup 86, 2001)

- id: rephaim
  aliases: [Rapiʾuma, shades, rpum]
  cultures: [ugaritic, phoenician, hebrew]
  scope: >-
    The Rephaim, in Ugaritic and Phoenician texts the (royal) dead or deified
    ancestors, and in the Hebrew Bible both the shades of the netherworld and a
    legendary race of giant pre-Israelite inhabitants of Transjordan and Canaan.
    The entry addresses both uses and their relationship.
  passages:
    - "Isa 14:9 | concept | Sheol rouses the Rephaim, former kings, to greet the dead tyrant"
    - "Isa 26:14, 19 | concept | Rephaim do not rise; earth gives birth to the Rephaim"
    - "Ps 88:10 | concept | Do the Rephaim rise to praise God? (MT 88:11)"
    - "Prov 2:18; 9:18; 21:16 | concept | The way of folly leads to the Rephaim"
    - "Job 26:5 | concept | The Rephaim tremble beneath the waters"
    - "Deut 2:10-11, 20-21 | attests | Rephaim as ancient giant inhabitants (Emim, Zamzummim)"
    - "Deut 3:11, 13 | attests | Og the last of the Rephaim; Bashan 'land of Rephaim'"
    - "Josh 12:4 | concept | Og at Ashtaroth and Edrei, the seat of Rapiʾu in KTU 1.108"
    - "2Sam 21:15-22 | attests? | Gittite warriors 'descendants of hārāpāh'"
  related: [nephilim, care-for-the-dead, sheol-and-the-netherworld, necromancy, afterlife-and-resurrection, eshmunazar-sarcophagus, aqhat-epic, ugaritic-texts]
  wikipedia: Rephaite
  image: null
  author_notes:
    - The striking match between Og's cities (Ashtaroth and Edrei) and the abode of Rapiʾu in KTU 1.108 suggests that the Bashan giant traditions transformed a Rephaim/royal-dead tradition; widely accepted, but present the mechanism as hypothesis.
    - KTU 1.161 is a royal funerary liturgy summoning the ancient Rephaim for a dead king; KTU 1.20-1.22 are fragmentary Rephaim texts; Phoenician curses (Tabnit, Eshmunazar) deny the violator rest "with the Rephaim".
    - Whether the Rephaim at Ugarit are deified dead kings, a warrior elite, or both is debated; etymology from rpʾ "heal" is common but the sense is disputed.
    - Treat claims about actual giants as a biblical ethnographic tradition, not history.
  sources_to_check:
    - KTU 1.20-1.22
    - KTU 1.108
    - KTU 1.161
    - KAI 13
    - KAI 14
    - D. Pardee, Ritual and Cult at Ugarit (2002)
    - DDD, s.v. "Rephaim"

- id: el
  cultures: [canaanite, ugaritic, phoenician, hebrew]
  scope: >-
    El (ʾil), both the common Semitic word for "god" and the proper name of the
    aged creator, father and king who heads the Ugaritic pantheon and divine
    assembly. The entry covers El in Ugaritic and other West Semitic sources and
    the reception of El names and attributes in the Hebrew Bible's portrayal of YHWH.
  passages:
    - "Gen 14:18-22 | language | El Elyon 'creator of heaven and earth'; cf. Phoenician ʾl qn ʾrṣ"
    - "Gen 16:13; 21:33 | language | Patriarchal El epithets: El Roi, El Olam"
    - "Gen 33:20; 35:7 | language | El-Elohe-Israel at Shechem; El-Bethel"
    - "Exod 6:2-3 | concept | YHWH identified with the El Shaddai of the ancestors"
    - "Gen 49:24-25 | language | El of your father and Shaddai, blessings of breasts and womb"
    - "Deut 32:8-9 | concept | Elyon apportions the nations among the sons of God"
    - "Ps 82:1 | concept | God stands in 'the council of El' (ʿădat-ʾēl)"
    - "Isa 14:13 | imagery | 'Stars of El' and the mount of assembly"
    - "Ezek 28:2 | imagery | 'I am El, I sit in the seat of gods in the heart of the seas'"
    - "Num 23:22 | imagery? | El likened to the horns of a wild ox; cf. 'Bull El'"
  related: [elyon, divine-council, statue-of-el, sons-of-god, asherah, yhwh-origins, bull-iconography, baal]
  wikipedia: El (deity)
  image: El stele Ugarit
  author_notes:
    - Give El's Ugaritic epithets (ṯr il "Bull El", ltpn il dpid "Kindly El the Compassionate", ab adm "father of humanity", bny bnwt "creator of creatures", mlk) and his abode "at the source of the rivers, amid the springs of the two deeps".
    - 'Present the main models for El and YHWH: early identification (Cross), originally distinct gods later merged (Smith, Eissfeldt), and the patriarchal "religion of El" (Alt; Exod 6:3); none is settled.'
    - Note the theophoric name Israel and the absence of El-Baal hostility in the Bible; El language was absorbed, Baal language contested.
    - Caution against treating every ʾēl in Hebrew as the Canaanite god; it is also the common noun "god".
  sources_to_check:
    - KTU 1.23
    - KTU 1.114
    - M. H. Pope, El in the Ugaritic Texts (VTSup 2, 1955)
    - F. M. Cross, Canaanite Myth and Hebrew Epic (1973)
    - DDD, s.v. "El"

- id: elyon
  aliases: [Most High, ʿElyon]
  cultures: [hebrew, aramean, phoenician]
  scope: >-
    ʿElyon, "Most High", a divine title used in the Hebrew Bible for YHWH, often as
    El Elyon, and attested as a divine name in the Aramaic Sefire treaty and in
    Philo of Byblos. The entry covers the title's origin and its role in
    Jerusalem royal-temple theology and in Deut 32:8-9.
  passages:
    - "Gen 14:18-22 | language | Melchizedek priest of El Elyon, creator of heaven and earth; Abram swears by YHWH El Elyon"
    - "Deut 32:8-9 | concept | Elyon divides the nations; YHWH's portion is Jacob (text-critical issue in v. 8)"
    - "Num 24:16 | language | Balaam 'knows the knowledge of Elyon'"
    - "Ps 82:6 | concept | Gods as 'children of Elyon' who will die like mortals"
    - "Isa 14:14 | concept | The tyrant aspires to be 'like Elyon'"
    - "Ps 46:4 | concept | Holy habitation of Elyon by the river in the city of God (MT 46:5)"
    - "Ps 47:2 | language | 'YHWH Elyon, great king over all the earth' (MT 47:3)"
    - "Ps 18:13 | language | Elyon utters his voice in thunder (MT 18:14; 2 Sam 22:14)"
    - "Dan 7:18, 22, 25, 27 | language | 'Holy ones of the Most High'"
  related: [el, divine-council, sons-of-god, 4qdeut-j, sefire-treaties, cosmic-mountain]
  wikipedia: Elyon
  image: null
  author_notes:
    - Key debate is whether Elyon was originally an epithet of El or a separate deity; the Sefire pair "El and Elyon" (KAI 222) and Philo of Byblos's Elioun are the main evidence for a distinct god.
    - On Deut 32:8-9, present the textual evidence (MT "sons of Israel"; 4QDeutj "sons of God"; LXX) and the debate over whether Elyon and YHWH are distinct there (Smith) or identical (most traditional readings).
    - Elyon is not attested as an independent deity at Ugarit; ʿly is used of Baal in KTU 1.16. Do not claim a Ugaritic god Elyon.
    - Many scholars connect El Elyon to pre-Israelite Jerusalem (Gen 14; Ps 76:2); present this as hypothesis.
  sources_to_check:
    - KAI 222
    - DDD, s.v. "Elyon"

- id: baal
  aliases: [Baʿal, Baʿlu, Hadad]
  cultures: [canaanite, ugaritic, phoenician]
  scope: >-
    Baal ("lord, owner"), the West Semitic storm and fertility god, identified with
    Hadad, hero of the Ugaritic Baal Cycle and chief rival of YHWH in the biblical
    narratives of the Omride period. The entry covers Baal at Ugarit and in the
    first-millennium Levant, local Baals, and biblical polemic.
  passages:
    - "Judg 2:11-13 | polemic | Deuteronomistic summary: Israel serves the Baals and Astartes"
    - "Judg 6:25-32 | polemic | Gideon destroys Baal's altar; etiology of Jerubbaal"
    - "1Kgs 16:31-33 | attests | Ahab builds a temple and altar of Baal in Samaria"
    - "1Kgs 18:17-40 | polemic | Contest on Carmel over rain and fire; Elijah mocks Baal's absence"
    - "2Kgs 10:18-28 | polemic | Jehu destroys the temple and worshippers of Baal"
    - "2Kgs 11:18 | attests | Temple of Baal and its priest Mattan in Jerusalem"
    - "Hos 2:8 | polemic | Grain, wine and oil come from YHWH, not Baal (MT 2:10)"
    - "Hos 2:16-17 | language | 'My husband' (ʾîšî), not 'my baal'; names of the Baals removed (MT 2:18-19)"
    - "2Sam 2:8 | language | Ishbosheth, for Eshbaal (1 Chr 8:33): bōšet substituted for Baal"
    - "Ps 29 | imagery | Storm theophany drawing on Baal's attributes"
  related: [baal-cycle, baal-with-thunderbolt, hadad-rimmon, melqart, baal-zebub, jezebel, cloud-rider, asherah]
  wikipedia: Baal
  image: Baal bronze statuette Ugarit
  author_notes:
    - Distinguish Baal as the title of a specific god (Baal-Hadad at Ugarit) from the many local "baals" (Baal-peor, Baal-berith, Baal-zebub) and from the common noun baʿal "lord, husband".
    - Which Baal Ahab and Jezebel promoted (Baal-Shamem, Melqart of Tyre, or a local Baal) is debated; do not assert Melqart as fact.
    - Baal-names among Israelites (Jerubbaal, Eshbaal, Meribbaal; Samaria ostraca) suggest baʿal could be used of YHWH before Hosea-era polemic; note the later bōšet ("shame") substitutions.
    - Avoid portraying "Baalism" as a fertility cult with sacred prostitution; that model is now widely rejected.
  sources_to_check:
    - KTU 1.1-1.6
    - J. Day, Yahweh and the Gods and Goddesses of Canaan (JSOTSup 265, 2000)
    - DDD, s.v. "Baal"

- id: asherah
  aliases: [Athirat, ʾAṯiratu, asherah pole, sacred pole]
  cultures: [canaanite, ugaritic, judahite, israelite]
  scope: >-
    Asherah, the West Semitic goddess known at Ugarit as Athirat, consort of El and
    mother of the gods, and in the Hebrew Bible both a goddess and a cultic object
    (the ʾăšērâ, a wooden pole or stylized tree). The entry covers the goddess, the
    cult object, and the inscriptional evidence for "YHWH and his asherah".
  passages:
    - "Deut 16:21 | practice | Prohibition of planting an asherah beside YHWH's altar"
    - "Exod 34:13 | practice | Command to cut down the asherim"
    - "Judg 6:25-30 | practice | The asherah beside Baal's altar is cut down for firewood"
    - "1Kgs 15:13 | attests | Queen mother Maacah makes an image for Asherah"
    - "1Kgs 18:19 | attests? | Four hundred prophets of Asherah (often judged secondary)"
    - "2Kgs 21:7 | attests | Manasseh sets a carved image of Asherah in the temple"
    - "2Kgs 23:4-7 | practice | Josiah removes Asherah's vessels and image; women weave for Asherah"
    - "2Kgs 13:6 | attests | The asherah remains standing in Samaria"
    - "Hos 14:8 | language? | Emendation 'I am his Anat and his Asherah' (Wellhausen) disputed (MT 14:9)"
    - "Mic 5:14 | practice | YHWH will uproot the asherim (MT 5:13)"
  related: [kuntillet-ajrud-inscriptions, khirbet-el-qom-inscription, judean-pillar-figurines, taanach-cult-stand, el, baal, astarte, cult-reforms-archaeology]
  wikipedia: Asherah
  image: Kuntillet Ajrud pithos drawing
  author_notes:
    - The Kuntillet ʿAjrud and Khirbet el-Qom blessings "by YHWH ... and his asherah" are central; present the debate over whether "his asherah" denotes the goddess, a cult object, or a hypostasis (the pronominal suffix on a personal name is grammatically awkward).
    - At Ugarit Athirat is El's consort, "Lady Athirat of the Sea", creatress of the gods with seventy sons; her pairing with Baal in Kings is a Deuteronomistic construction.
    - The identification of Judean pillar figurines and the Taanach stand with Asherah is plausible but not proven.
    - Avoid the "fertility goddess" stereotype; note mainstream arguments (Olyan, Hadley, Ackerman) that Asherah was part of official Yahwistic cult in both kingdoms before the reforms.
  sources_to_check:
    - S. M. Olyan, Asherah and the Cult of Yahweh in Israel (SBLMS 34, 1988)
    - J. M. Hadley, The Cult of Asherah in Ancient Israel and Judah (2000)
    - DDD, s.v. "Asherah"

- id: anat
  aliases: [ʿAnat, ʿAnatu, Anath]
  cultures: [ugaritic, egyptian, jewish]
  scope: >-
    Anat, the violent warrior goddess of Ugaritic myth, sister and ally of Baal,
    also venerated in New Kingdom Egypt and still attested among the Judeans of
    Persian-period Elephantine. In the Hebrew Bible she survives only in personal
    and place names.
  passages:
    - "Judg 3:31; 5:6 | language | Shamgar 'son of Anath', perhaps a warrior epithet"
    - "Jer 1:1 | language | Anathoth, Jeremiah's home town"
    - "Josh 21:18 | language | Anathoth as a Levitical city"
    - "Judg 1:33 | language | Beth-anath, an unconquered town in Naphtali"
    - "Exod 32:20 | parallel? | Calf burned, ground and scattered; cf. Anat's destruction of Mot (Loewenstamm)"
    - "Jer 7:18 | concept? | Anat proposed as the Queen of Heaven"
    - "Hos 14:8 | language? | Emendation 'I am his Anat and his Asherah' disputed (MT 14:9)"
  related: [baal-cycle, aqhat-epic, baal, mot, astarte, queen-of-heaven, elephantine-papyri]
  wikipedia: Anat
  image: Anat Egyptian stela
  author_notes:
    - Summarise her portrayal in the Baal Cycle (slaughter in KTU 1.3 II, mourning and burial of Baal, destruction of Mot in KTU 1.6 II) and in Aqhat; her epithet btlt ("maiden") concerns status, not chastity in a later sense.
    - At Elephantine the temple accounts name Anat-Yahu and Anat-Bethel; explain the debate over whether these are consort goddesses or hypostases.
    - Note her popularity in Ramesside Egypt as a warrior goddess (e.g. Bint-Anat, Ramesses II's daughter).
    - Avoid portraying Anat as a love or fertility goddess paired sexually with Baal as a settled fact; the evidence is contested.
  sources_to_check:
    - KTU 1.3
    - KTU 1.6
    - DDD, s.v. "Anat"
    - J. Day, Yahweh and the Gods and Goddesses of Canaan (JSOTSup 265, 2000)

- id: astarte
  aliases: [Ashtoreth, ʿAštart, ʿAṯtartu]
  cultures: [phoenician, ugaritic, canaanite]
  scope: >-
    Astarte (Hebrew ʿAštōret, a deliberate vocalization after bōšet "shame"), a
    major West Semitic goddess of war, sexuality and royal power, attested at Ugarit
    and Emar, in Egypt, and especially as the chief goddess of Sidon and Tyre. The
    plural ʿaštārôt is used in the Hebrew Bible for goddesses generally.
  passages:
    - "1Kgs 11:5, 33 | attests | 'Astarte the goddess of the Sidonians' worshipped by Solomon"
    - "2Kgs 23:13 | attests | Josiah defiles the high places built for Astarte, Chemosh and Milcom"
    - "Judg 2:13; 10:6 | language | 'The Baals and the Astartes' as generic gods and goddesses"
    - "1Sam 7:3-4; 12:10 | language | Israel puts away the Baals and Astartes"
    - "1Sam 31:10 | attests | Saul's armour placed in the Philistine temple of Astarte"
    - "Deut 7:13 | language | ʿaštərōt ṣōʾnekā, 'increase of your flock', a fossilized divine name"
    - "Gen 14:5 | language | Ashteroth-karnaim, a Bashan town named for the goddess"
    - "Jer 7:18 | concept? | Astarte as a candidate for the Queen of Heaven"
  related: [queen-of-heaven, ishtar, anat, asherah, sidon, eshmunazar-sarcophagus, name-theology, phoenicians]
  wikipedia: Astarte
  image: Astarte figurine Phoenician
  author_notes:
    - Explain the vocalization ʿAštōret as a bōšet distortion of ʿAštart; the Greek Astartē preserves the original.
    - Astarte is called "name of Baal" (šm bʿl) in KTU 1.16 VI and in the Eshmunazar inscription; relevant to name theology.
    - Do not conflate Astarte with Asherah or Ishtar, though some syncretism (especially with Ishtar) occurred; distinguish them clearly.
    - Treat "sacred prostitution" in her cult as a largely discredited classical and modern construct.
  sources_to_check:
    - KAI 14
    - DDD, s.v. "Astarte"
    - I. Cornelius, The Many Faces of the Goddess (OBO 204, 2004)

- id: mot
  aliases: [Môtu, Death]
  cultures: [ugaritic]
  scope: >-
    Mot ("Death"), the Ugaritic god of death and the netherworld, beloved of El,
    whose insatiable maw swallows Baal in the Baal Cycle. The entry also covers the
    personification of Death (māwet) in the Hebrew Bible.
  passages:
    - "Isa 25:8 | imagery | YHWH will swallow up Death forever, reversing the swallower"
    - "Isa 28:15, 18 | concept | Covenant with Death and agreement with Sheol"
    - "Hab 2:5 | imagery | Appetite wide as Sheol, never satisfied like Death"
    - "Isa 5:14 | imagery | Sheol opens its throat and mouth without limit"
    - "Jer 9:21 | imagery | Death climbs in through the windows (MT 9:20)"
    - "Ps 49:14 | imagery | Death shepherds the foolish into Sheol (MT 49:15)"
    - "Hos 13:14 | imagery | 'O Death, where are your plagues? O Sheol, where is your sting?'"
    - "Job 18:13-14 | imagery | 'Firstborn of Death' and 'king of terrors'"
    - "Song 8:6 | imagery | Love strong as Death, passion fierce as Sheol"
    - "1Cor 15:54-55 | imagery | Paul cites Isa 25:8 and Hos 13:14 on Death's defeat"
  related: [baal-cycle, baal, anat, sheol-and-the-netherworld, resheph, afterlife-and-resurrection]
  wikipedia: Mot (god)
  image: null
  author_notes:
    - Mot's gaping throat ("a lip to earth, a lip to heaven", KTU 1.5 II) is the most-cited image for biblical swallowing Death/Sheol.
    - In the Hebrew Bible māwet is a personification rather than a worshipped god; avoid implying a cult of Mot in Israel.
    - The Jer 9:21 "death through the window" link to the window in Baal's palace (Cassuto) is suggestive; Mesopotamian Lamashtu has also been proposed. Present as debated.
    - No secure iconography of Mot is known.
  sources_to_check:
    - KTU 1.4-1.6
    - DDD, s.v. "Mot"

- id: yam
  aliases: [Yammu, Sea, Prince Sea, Judge River]
  cultures: [ugaritic, canaanite]
  scope: >-
    Yam ("Sea"), the Ugaritic sea god, also called Judge River (ṯpṭ nhr), whose bid
    for kingship is defeated by Baal in the Baal Cycle. The entry covers the deity
    and the biblical motif of YHWH's rebuke, restraint and defeat of the personified
    Sea (yām) and Rivers.
  passages:
    - "Job 7:12 | imagery | 'Am I the Sea, or the Dragon, that you set a guard over me?'"
    - "Job 38:8-11 | imagery | Sea shut in with doors and given its limit"
    - "Ps 74:13 | imagery | YHWH divided the Sea by his might"
    - "Ps 89:9 | imagery | YHWH rules the raging of the Sea (MT 89:10)"
    - "Ps 93:3-4 | imagery | Floods (neharot) lifted up; YHWH mightier than the Sea"
    - "Hab 3:8 | imagery | Wrath against the Rivers and the Sea, mirroring Yam // Nahar"
    - "Nah 1:4 | imagery | He rebukes the Sea and makes it dry"
    - "Isa 51:10 | imagery | Drying the Sea and the great deep at the exodus"
    - "Mark 4:39 | imagery | Jesus rebukes the wind and silences the Sea"
    - "Rev 21:1 | imagery | 'And the sea was no more'"
  related: [chaoskampf, baal-cycle, leviathan, rahab-sea-monster, tannin, tehom, divine-warrior]
  wikipedia: Yam (god)
  image: null
  author_notes:
    - Yam is the clearest Levantine antecedent for biblical Sea-combat language; the older derivation from Babylonian Tiamat (Gunkel) has largely given way to a West Semitic background (Day), though both matter.
    - Biblical yām is never worshipped and usually personified only in poetry; distinguish mythic imagery from belief in a rival god.
    - Note the parallel pair ym // nhr in Ugaritic and the Hebrew pair yām // nəhārôt.
    - Baal's victory with clubs made by Kothar (KTU 1.2 IV) and the cry "Yam is dead, Baal reigns" link sea-victory to kingship (cf. Ps 93).
  sources_to_check:
    - KTU 1.2
    - J. Day, God's Conflict with the Dragon and the Sea (1985)
    - DDD, s.v. "Yam"

- id: resheph
  aliases: [Reshef, Rašap]
  cultures: [canaanite, ugaritic, egyptian, phoenician]
  scope: >-
    Resheph, a West Semitic god of plague and war, archer and gatekeeper of the
    netherworld, attested from Ebla to Cyprus and popular in New Kingdom Egypt as a
    smiting warrior god. In the Hebrew Bible rešep appears as a demoted divine figure
    and as a word for pestilence, flame or lightning.
  passages:
    - "Hab 3:5 | imagery | Deber (Pestilence) and Resheph (Plague) march in YHWH's retinue"
    - "Deut 32:24 | imagery | Devoured by Resheph and bitter Qeteb"
    - "Ps 78:48 | imagery | Flocks given over to rəšāpîm (thunderbolts or plagues)"
    - "Ps 76:3 | imagery | YHWH broke the 'rəšāpîm of the bow', flashing arrows (MT 76:4)"
    - "Job 5:7 | imagery | 'Sons of Resheph' fly upward (sparks or birds)"
    - "Song 8:6 | imagery | Love's flashes are 'flashes of fire'"
    - "1Chr 7:25 | language | Resheph as an Ephraimite personal name"
  related: [demons, divine-warrior, mot, smiting-the-enemy-motif, gods-of-2-kings-17, baal-with-thunderbolt]
  wikipedia: Resheph
  image: Reshef stela Egypt
  author_notes:
    - Resheph's archery (Cypriot "Resheph of the arrow", ršp ḥṣ, equated with Apollo) explains the arrow and flame imagery in Ps 76 and Song 8.
    - At Ugarit he is equated with Nergal in god lists; relevant to plague and netherworld associations.
    - Present Hab 3:5 as the clearest case of a demoted deity in YHWH's entourage; the other passages show varying degrees of demythologization.
    - His Egyptian iconography (gazelle-headed crown, smiting pose) is well documented; use it for the image.
  sources_to_check:
    - I. Cornelius, The Iconography of the Canaanite Gods Reshef and Baʿal (OBO 140, 1994)
    - M. M. Münnich, The God Resheph in the Ancient Near East (2013)
    - DDD, s.v. "Resheph"

- id: dagon
  aliases: [Dagan]
  cultures: [amorite, ugaritic, philistine]
  scope: >-
    Dagon (Dagan), a major Syrian and Middle Euphrates deity of the Bronze Age,
    worshipped at Ebla, Mari, Terqa, Tuttul, Emar and Ugarit, and in the Iron Age the
    chief god of the Philistines at Ashdod and Gaza according to the Bible.
  passages:
    - "Judg 16:23 | attests | Philistine lords sacrifice to Dagon their god at Gaza"
    - "1Sam 5:1-5 | polemic | Dagon falls broken before the ark in his temple at Ashdod"
    - "1Sam 5:5 | practice | Dagon's priests avoid treading on the threshold"
    - "1Chr 10:10 | attests | Saul's head fastened in the temple of Dagon"
    - "Josh 15:41 | language | Beth-dagon, a town in the Judean lowland"
    - "1Macc 10:83-84 | attests | Jonathan burns the temple of Dagon at Azotus"
  related: [philistines, ashdod, gaza, ark-of-the-covenant, emar-texts, mari-letters, ugarit, apkallu-reliefs]
  wikipedia: Dagon
  image: Dagan stele Ugarit
  author_notes:
    - Correct the "fish-god" misconception, based on folk etymology from Hebrew dāg "fish" in medieval exegesis and on nineteenth-century misidentification of Assyrian fish-cloaked apkallu figures as Dagon.
    - Etymology is debated (Hebrew dāgān "grain"; a root meaning "cloud, rain"); Philo of Byblos equates Dagon with Siton (grain). Present options.
    - At Ugarit Baal is "son of Dagan", yet Dagan has no role in the myths; two dedicatory stelae name Dagan, and one acropolis temple is often attributed to him.
    - The Philistines likely adopted a Semitic deity after settling; this bears on Philistine acculturation.
  sources_to_check:
    - L. Feliu, The God Dagan in Bronze Age Syria (CHANE 19, 2003)
    - DDD, s.v. "Dagon"

- id: molek
  title: Molek (Molech)
  aliases: [Molech, Moloch]
  cultures: [canaanite, phoenician, judahite]
  scope: >-
    Molek, the recipient of the practice of "making children pass through the fire"
    condemned in Leviticus, Kings and Jeremiah. The entry covers the debate over
    whether Molek was a deity (possibly chthonic) or whether *molk* was a sacrificial
    term, as in Punic inscriptions.
  passages:
    - "Lev 18:21 | practice | Prohibition of giving offspring 'to Molek'"
    - "Lev 20:2-5 | practice | Death penalty; 'prostituting after Molek' implies a deity"
    - "2Kgs 23:10 | practice | Josiah defiles Topheth so none may pass a child through fire to Molek"
    - "Jer 32:35 | practice | High places of Baal in the Hinnom valley for passing children to Molek"
    - "1Kgs 11:7 | language | 'Molech the abomination of the Ammonites', probably an error for Milcom"
    - "Isa 30:33 | language? | Topheth prepared 'for the king' (lammelek)"
    - "Isa 57:9 | language? | Journeying 'to the king/Molek' with oil"
    - "Acts 7:43 | language | 'Tent of Moloch' from LXX Amos 5:26"
  related: [child-sacrifice, tophet, milkom, rephaim, gods-of-2-kings-17, phoenicians, chemosh]
  wikipedia: Moloch
  image: null
  author_notes:
    - Present the debate fairly. Eissfeldt (1935) read Punic mlk as a sacrifice type ("as a molk-offering"); Heider and Day defend a deity Molek, citing Lev 20:5 and Ugaritic/Akkadian Malik/mlk, who is linked to the dead and to ʿAshtaroth (KTU 1.100; 1.108).
    - The vocalization mōlek may be a bōšet-style distortion of melek "king"; this is a hypothesis.
    - Whether "pass through the fire" denotes actual immolation or a dedication rite remains debated, though most now accept that some child sacrifice occurred.
    - Correct the popular image of a hollow bronze bull-headed furnace; it derives from medieval Jewish commentary (e.g. Rashi on Jer 7:31) and later art, not ancient evidence.
  sources_to_check:
    - G. C. Heider, The Cult of Molek (JSOTSup 43, 1985)
    - 'J. Day, Molech: A God of Human Sacrifice in the Old Testament (1989)'
    - DDD, s.v. "Molech"

- id: chemosh
  aliases: [Kemosh, Kamish]
  cultures: [moabite]
  scope: >-
    Chemosh, the national god of Moab, known chiefly from the Mesha Stele and the
    Hebrew Bible, with earlier attestations of a god Kamish in third-millennium Syria.
  passages:
    - "Num 21:29 | language | Moab as 'people of Chemosh', his sons and daughters made captives"
    - "Judg 11:24 | concept | Chemosh as land-giving national god, set beside YHWH"
    - "1Kgs 11:7, 33 | attests | Solomon builds a high place for Chemosh"
    - "2Kgs 23:13 | attests | Josiah defiles the high place of Chemosh"
    - "2Kgs 3:27 | practice | Mesha sacrifices his firstborn; 'great wrath' falls on Israel"
    - "Jer 48:7, 13, 46 | polemic | Chemosh goes into exile; Moab ashamed of Chemosh"
  related: [mesha-stele, moabites, dibon, herem, child-sacrifice, milkom]
  wikipedia: Chemosh
  image: Mesha Stele Louvre
  author_notes:
    - The Mesha Stele presents Chemosh in terms closely parallel to YHWH in Kings (anger with his land, ordering conquest, ḥērem devoted to Ashtar-Chemosh).
    - Explain the debate over whose "great wrath" falls on Israel in 2 Kgs 3:27.
    - Judg 11:24 attributes to Chemosh what is elsewhere Milcom's land (Ammon); note this as a known difficulty.
    - No secure iconography exists; identifications of figures on Moabite stelae (Shihan, Baluʿa) with Chemosh are uncertain.
  sources_to_check:
    - KAI 181
    - COS 2.23
    - DDD, s.v. "Chemosh"

- id: milkom
  aliases: [Milcom, Malcam]
  cultures: [ammonite]
  scope: >-
    Milkom, the national god of Ammon, attested in the Hebrew Bible and in Ammonite
    inscriptions and seals. Several biblical occurrences depend on the vocalization of
    the consonants mlkm ("Milkom" or "their king").
  passages:
    - "1Kgs 11:5, 33 | attests | Solomon follows 'Milcom the abomination of the Ammonites'"
    - "2Kgs 23:13 | attests | Josiah defiles the high place of Milcom"
    - "Jer 49:1, 3 | language | MT malkām 'their king'; LXX and many moderns read Milcom"
    - "Zeph 1:5 | language | Those who swear by malkām, often read as Milcom"
    - "2Sam 12:30 | language? | Crown of malkām (Milcom or 'their king') taken at Rabbah"
    - "Amos 1:15 | language? | 'Their king' (malkām) goes into exile; cf. Jer 49:3"
  related: [ammonites, rabbah, molek, chemosh, tell-siran-bottle-and-ammonite-inscriptions, seals-and-bullae]
  wikipedia: Milcom
  image: Ammonite statue Amman
  author_notes:
    - Extrabiblical evidence includes the Amman Citadel Inscription (often read as an oracle of Milkom) and theophoric names such as Milkomʾur on the Tell el-ʿUmeiri seal impression naming a servant of Baʿalyašaʿ (cf. Baalis, Jer 40:14). Verify readings.
    - Milkom is distinct from Molek despite their shared root mlk; 1 Kgs 11:7 is commonly regarded as a textual confusion.
    - Ammonite stone heads and statues with atef-like crowns may depict kings or deities; their identification with Milkom is uncertain.
  sources_to_check:
    - W. E. Aufrecht, A Corpus of Ammonite Inscriptions (1989)
    - DDD, s.v. "Milcom"

- id: qos
  aliases: [Qaus, Qaush, Kos]
  cultures: [edomite, arabian]
  scope: >-
    Qos (Qaus), the national god of Edom, known from Assyrian royal inscriptions,
    Edomite theophoric names and inscriptions, and later Nabataean and Idumean
    sources. He is never named in the Hebrew Bible apart from a theophoric name.
  passages:
    - "Ezra 2:53 | language | Barkos ('son of Qos') among returning temple servants"
    - "Neh 7:55 | language | Barkos in the parallel list"
    - "2Chr 25:14-15 | attests | Amaziah worships 'the gods of the people of Seir'"
    - "Deut 33:2 | concept? | YHWH comes from Seir; southern origins near Edom"
    - "Judg 5:4 | concept? | YHWH marches from Seir and the field of Edom"
  related: [edomites, yhwh-origins, bozrah, nabataeans, petra-and-sela, kuntillet-ajrud-inscriptions]
  wikipedia: Qos (deity)
  image: Horvat Qitmit Edomite shrine figurine
  author_notes:
    - Assyrian sources name Edomite kings Qaus-malaka (Tiglath-pileser III) and Qaus-gabri (Esarhaddon, Ashurbanipal).
    - The biblical silence about Qos, alongside texts placing YHWH's origin in Seir/Edom, is used in the southern-origins debate; present any Qos-YHWH relationship as speculative.
    - Horvat Qitmit (Negev) has Qos inscriptions, and the Horvat ʿUza ostracon is reported to contain a blessing by Qos; verify details.
    - Qos survives into the Nabataean period (Khirbet et-Tannur) and among Idumeans (Josephus, Ant. 15.253 on Costobarus's priestly ancestors of Koze); verify the Josephus reference.
  sources_to_check:
    - 'I. Beit-Arieh (ed.), Ḥorvat Qitmit: An Edomite Shrine in the Biblical Negev (1995)'
    - DDD, s.v. "Qos"

- id: melqart
  aliases: [Milqart, Tyrian Heracles, Baal of Tyre]
  cultures: [phoenician]
  scope: >-
    Melqart ("king of the city"), the chief god of Tyre, spread with Phoenician
    colonization across the Mediterranean (Carthage, Gades) and identified by Greeks
    with Heracles. The entry covers his cult and its possible bearing on the Baal of
    Ahab and Jezebel.
  passages:
    - "1Kgs 16:31-32 | attests? | Jezebel's Baal and the temple in Samaria, often but not certainly Melqart"
    - "1Kgs 18:27 | practice? | 'He is asleep and must be awakened': possible allusion to Melqart's egersis"
    - "1Kgs 7:15-22 | realia? | Twin pillars Jachin and Boaz; cf. Herodotus 2.44 on Tyre's temple"
    - "2Macc 4:18-20 | attests | Games at Tyre; Jason sends money for sacrifice to Heracles"
    - "Matt 17:24-27 | realia | Temple tax paid in Tyrian shekels bearing Melqart-Heracles"
  related: [tyre, melqart-stele, baal, jezebel, hiram-of-tyre, jachin-and-boaz, coinage, phoenicians]
  wikipedia: Melqart
  image: Tyrian shekel Melqart
  author_notes:
    - The identification of Jezebel's Baal with Melqart (de Vaux, Albright) versus Baal-Shamem (Eissfeldt) or a local Baal is unresolved; present all three.
    - The "awakening" (egersis) of Heracles at Tyre is reported by Josephus citing Menander of Ephesus (Against Apion 1.119; Ant. 8.146); verify references and avoid over-reading 1 Kgs 18:27.
    - Discuss the Melqart stele of Bar-Hadad as evidence for his cult in Aram.
    - Tyrian shekels (with Melqart's head) were standard for temple dues in the Roman period; this is well attested and useful for NT readers.
  sources_to_check:
    - KAI 201
    - 'C. Bonnet, Melqart: cultes et mythes de l''Héraclès tyrien en Méditerranée (1988)'
    - DDD, s.v. "Melqart"

- id: queen-of-heaven
  aliases: [malkat haššāmayim]
  cultures: [judahite, mesopotamian]
  scope: >-
    The "Queen of Heaven" whose cult, with cakes, libations and incense, Jeremiah
    condemns among Judahites in Jerusalem and in Egypt. The entry covers the
    identification of the goddess and the household, women-led character of the cult.
  passages:
    - "Jer 7:18 | practice | Families bake cakes (kawwānîm) for the Queen of Heaven"
    - "Jer 44:15-19, 25 | practice | Judahites in Egypt defend offerings; cakes 'in her image'"
  related: [ishtar, astarte, anat, host-of-heaven, elephantine-papyri, judean-pillar-figurines]
  wikipedia: Queen of heaven (antiquity)
  image: Mari mould nude goddess
  author_notes:
    - Main candidates are Ishtar (Akkadian šarrat šamê), Astarte, Anat and Asherah; many favour a syncretistic Ishtar-Astarte (Ackerman). Present the options.
    - MT vocalizes məleket ("work/host of heaven"), probably a scribal avoidance; the versions and most moderns read malkat.
    - The kawwānîm likely relate to Akkadian kamānu cakes offered to Ishtar; cake moulds from Mari are often cited (verify which moulds show a goddess).
    - The Hermopolis papyri mention a temple of the Queen of Heaven at Syene in the Persian period.
  sources_to_check:
    - S. Ackerman, Under Every Green Tree (HSM 46, 1992)
    - TAD A2.1-A2.7 (Hermopolis papyri)
    - DDD, s.v. "Queen of Heaven"

- id: tammuz
  aliases: [Dumuzi, Dumuzid]
  cultures: [mesopotamian, sumerian]
  scope: >-
    Tammuz (Sumerian Dumuzi), the shepherd god and consort of Inanna/Ishtar whose
    death and descent to the netherworld were annually lamented in Mesopotamia. The
    entry covers the Mesopotamian evidence, the women's lament in Ezek 8:14, and the
    later Adonis cult.
  passages:
    - "Ezek 8:14 | practice | Women weeping for Tammuz at the north gate of the temple"
    - "Isa 17:10-11 | practice? | 'Pleasant plants' possibly Adonis gardens"
    - "Dan 11:37 | concept? | 'The one beloved by women', perhaps Tammuz-Adonis"
    - "Zech 12:11 | practice? | Mourning for Hadad-rimmon, sometimes compared with Tammuz laments"
  related: [descent-of-inanna-ishtar, ishtar, sumerian-love-songs, mourning-rites, calendars-and-month-names, sacred-marriage, hadad-rimmon]
  wikipedia: Dumuzid
  image: null
  author_notes:
    - Correct the Frazerian "dying and rising god" model; Dumuzi's alternation with his sister in the netherworld (Inanna's Descent) is not resurrection in the later sense (J. Z. Smith; M. S. Smith; but see Mettinger for a contrary view).
    - The fourth month of the Babylonian and later Jewish calendar bears his name.
    - Identification of Adonis with Tammuz is ancient (e.g. Jerome on Ezek 8:14) but involves a distinct, later Phoenician-Greek cult.
  sources_to_check:
    - DDD, s.v. "Tammuz"
    - T. N. D. Mettinger, The Riddle of Resurrection (ConBOT 50, 2001)

- id: shamash
  aliases: [Utu, Shemesh, Shapash, sun god]
  cultures: [ane, mesopotamian, ugaritic]
  scope: >-
    The sun god of Mesopotamia (Utu/Shamash, god of justice and divination), the
    Ugaritic sun goddess Shapash, and solar worship and imagery in Israel and Judah.
    The entry covers sun cult and solar language for YHWH; the winged sun disk has
    its own entry.
  passages:
    - "2Kgs 23:5, 11 | practice | Josiah removes priests of the sun and burns the 'chariots of the sun'"
    - "Ezek 8:16 | practice | Men in the temple court bow eastward to the sun"
    - "Deut 4:19; 17:3 | polemic | Sun, moon and host of heaven forbidden as objects of worship"
    - "Job 31:26-28 | practice | Kissing the hand to the shining sun or moon"
    - "Ps 19:4-6 | imagery | Sun as bridegroom and runner; cf. Shamash hymns joining sun and law (MT 19:5-7)"
    - "Mal 4:2 | imagery | Sun of righteousness with healing in its wings (MT 3:20)"
    - "Ps 84:11 | imagery | 'YHWH God is a sun and shield' (MT 84:12)"
    - "Josh 15:10 | language | Beth-shemesh, 'house of the sun'"
  related: [tablet-of-shamash, code-of-hammurabi, winged-sun-disk, host-of-heaven, beth-shemesh, light-of-the-face, divine-wings]
  wikipedia: Shamash
  image: Tablet of Shamash British Museum
  author_notes:
    - The "solar Yahwism" thesis (J. G. Taylor) is debated; separate solar imagery for YHWH, which is common, from a solar YHWH cult, which is contested.
    - Shamash as judge, who sees all and is invoked in divination (with Adad), is the main background for sun-justice imagery (Ps 19; Mal 4:2).
    - Ugaritic Shapash is female, the "torch of the gods" who travels to the netherworld; note the gender difference from Mesopotamia.
    - Josh 10:12-13 has been read against omen literature (Holladay); mention only as a proposal.
  sources_to_check:
    - J. G. Taylor, Yahweh and the Sun (JSOTSup 111, 1993)
    - W. G. Lambert, Babylonian Wisdom Literature (1960) (Shamash Hymn)
