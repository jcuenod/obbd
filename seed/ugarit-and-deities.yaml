    - DDD, s.v. "Hadad"; "Rimmon"

- id: baal-zebub
  aliases: [Beelzebul, Beelzebub, Baal-zebul]
  cultures: [philistine, ugaritic, jewish]
  scope: >-
    Baal-zebub, the god of Ekron consulted by King Ahaziah, and Beelzebul, the
    "ruler of demons" in the Gospels. The entry covers the name's form and meaning
    and its development into a name for Satan.
  passages:
    - "2Kgs 1:2-3, 6, 16 | attests | Ahaziah sends to inquire of Baal-zebub, god of Ekron"
    - "Matt 12:24-27 | language | Jesus accused of casting out demons by Beelzebul"
    - "Mark 3:22 | language | Beelzebul as ruler of demons"
    - "Luke 11:15-19 | language | Beelzebul controversy"
    - "Matt 10:25 | language | Master of the house called Beelzebul"
    - "1Kgs 8:13 | language | bêt zəbul 'exalted house', showing the root zbl"
  related: [ekron, ekron-royal-dedicatory-inscription, baal, philistines, demons, divination, satan-the-adversary]
  wikipedia: Beelzebub
  image: null
  author_notes:
    - The majority view is that the original was Baal-zebul "Baal the Prince/Exalted" (cf. Ugaritic zbl bʿl), deformed into "lord of flies"; some defend a genuine "lord of flies" (an oracular or healing deity; LXX Baal muian).
    - The NT form Beelzebul preserves -l and may reflect wordplay with zəbul "dwelling" (Matt 10:25) or zebel "dung"; present options.
    - No extrabiblical attestation of Baal-zebub at Ekron exists; the Ekron inscription names the goddess PTGYH.
  sources_to_check:
    - DDD, s.v. "Baal-zebub"

- id: baal-peor
  aliases: [Baal of Peor]
  cultures: [moabite]
  scope: >-
    Baal of Peor, the local god of a Transjordanian site in Moab whose worship by
    Israelites at Shittim is narrated in Num 25 and became a paradigmatic memory of
    apostasy.
  passages:
    - "Num 25:1-9 | event | Israel 'yokes itself' to Baal of Peor; sacrifices, sexual transgression and plague"
    - "Num 31:16 | concept | Balaam blamed for the Peor apostasy"
    - "Deut 4:3 | concept | Those who followed Baal of Peor destroyed"
    - "Ps 106:28-31 | practice? | Ate 'sacrifices of the dead' at Baal of Peor"
    - "Hos 9:10 | polemic | Israel consecrated itself to 'the shame' at Baal-peor"
    - "1Cor 10:8 | concept | Paul recalls the Peor plague (23,000; Num 25:9 has 24,000)"
  related: [marzeah, care-for-the-dead, midianites-and-kenites, moabites, deir-alla-inscription]
  wikipedia: Baal-peor
  image: null
  author_notes:
    - The phrase "sacrifices of the dead" (Ps 106:28) has been read as offerings to lifeless gods or as a funerary cult; rabbinic tradition (Sifre Num 131) links Peor with the marzeaḥ. Present the debate.
    - Num 25 combines Moabite and Midianite strands; flag the composite text.
    - There is no extrabiblical attestation of a "Baal of Peor"; the name is a local manifestation of Baal at Peor/Beth-peor.
  sources_to_check:
    - DDD, s.v. "Baal-peor"

- id: baal-berith
  aliases: [El-berith, Baal of the Covenant]
  cultures: [canaanite, israelite]
  scope: >-
    Baal-berith ("Lord of the covenant"), also El-berith, the god of Shechem whose
    temple funded Abimelech's rise and served as the citizens' stronghold in Judges 9.
  passages:
    - "Judg 8:33 | attests | Israel makes Baal-berith its god after Gideon's death"
    - "Judg 9:4 | attests | Seventy shekels from the house of Baal-berith fund Abimelech"
    - "Judg 9:46 | attests | Stronghold of the temple of El-berith at Shechem"
    - "Judg 9:27 | practice | Vintage festival in the house of their god at Shechem"
    - "Josh 24:25-27 | concept | Covenant-making at Shechem with a standing stone"
    - "Gen 33:18-20 | language | Jacob's altar El-Elohe-Israel at Shechem"
  related: [shechem, covenant-and-treaty-form, oaths-and-oath-formulas, el, baal]
  wikipedia: Baal Berith
  image: null
  author_notes:
    - Debate whether "berith" names a treaty-guaranteeing deity of a Shechemite league (Clements), whether El- and Baal- forms are variants of one god, and how this relates to Israelite covenant traditions at Shechem (T. J. Lewis, JBL 115, 1996).
