    - "Job 31:26-28 | practice | The moon 'moving in splendour' as an object of veneration"
    - "Jer 8:2 | practice | Bones spread before sun, moon and host they served"
    - "Judg 8:21, 26 | realia | Crescent ornaments on the Midianite kings' camels"
    - "Isa 3:18 | realia | Crescents (śahărōnîm) among Jerusalem women's ornaments"
