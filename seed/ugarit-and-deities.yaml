- id: gods-of-2-kings-17
  aliases: [Succoth-benoth, Nergal, Ashima, Nibhaz, Tartak, Adrammelech, Anammelech]
  cultures: [assyrian, babylonian, aramean]
  scope: >-
    The deities of the peoples Assyria resettled in Samaria after 722 BCE, as listed
    in 2 Kgs 17:29-31: Succoth-benoth, Nergal, Ashima, Nibhaz, Tartak, Adrammelech and
    Anammelech. The entry covers the identification of each and the polemical purpose
    of the list.
  passages:
    - "2Kgs 17:24 | event | Assyrian resettlement of Babylon, Cuthah, Avva, Hamath and Sepharvaim in Samaria"
    - "2Kgs 17:29-31 | attests | Each nation makes its own gods; Sepharvaites burn children"
    - "2Kgs 17:32-41 | polemic | Settlers fear YHWH yet serve their own gods"
    - "Amos 8:14 | language? | 'Ashimah of Samaria' (MT ʾašmat, 'guilt')"
    - "Ezra 4:2, 9-10 | event | Samarian settlers trace their deportation to Esarhaddon and Osnappar"
    - "2Kgs 18:34 | setting | Sepharvaim, Hena and Ivvah among cities conquered by Assyria"
  related: [samaritan-origins, fall-of-samaria, deportation, sargon-ii-inscriptions, child-sacrifice, molek, hamath, elephantine-papyri]
  wikipedia: null
  image: null
  author_notes:
    - Only Nergal of Cuthah is securely identified; Succoth-benoth (perhaps Zarpanitu or a garbled term), Ashima (cf. Ashim-Bethel at Elephantine), Nibhaz, Tartak and Adrammelech/Anammelech (perhaps Adad-milki/Anu-milki or Attar-malk) are uncertain.
    - Sepharvaim's location (Sippar vs. Sibraim in Syria, Ezek 47:16) is debated.
    - Assyrian inscriptions of Sargon II confirm deportations into Samaria; the list's anti-Samaritan function in the Deuteronomistic History should be noted.
    - Adrammelech the god should be distinguished from Sennacherib's son Adrammelech (2 Kgs 19:37).
  sources_to_check:
    - M. Cogan and H. Tadmor, II Kings (AB 11, 1988)
    - DDD, s.v. "Nergal"; "Ashima"; "Adrammelech"

- id: sakkut-and-kaiwan
  aliases: [Sakkuth, Kaiwan, Kiyyun, Chiun, Rephan]
  cultures: [assyrian, babylonian, israelite]
  scope: >-
    Sakkuth and Kaiwan, astral deities named in Amos 5:26, generally identified with
    Mesopotamian SAG.KUD (an epithet of Ninurta) and kayyamānu, the planet Saturn.
    The entry covers the identifications, the textual tradition (MT, LXX, Acts, CD) and
    the date of the verse.
  passages:
    - "Amos 5:26 | language | 'Sakkuth your king and Kaiwan your star-god', vocalized after šiqqûṣ"
    - "Amos 5:25-27 | polemic | Images carried into exile 'beyond Damascus'"
    - "Acts 7:42-43 | language | Stephen quotes LXX: 'tent of Moloch and the star of Rephan'"
  related: [host-of-heaven, astrology, constellations, gods-of-2-kings-17, septuagint, dead-sea-scrolls]
  wikipedia: null
  image: null
  author_notes:
    - The MT vowels follow šiqqûṣ ("abomination"); the reconstructed forms Sakkut and Kaiwan are widely accepted.
    - Many scholars take v. 26 as a post-722 addition reflecting Assyrian-period cults (cf. 2 Kgs 17:30); others defend it as Amos's own.
    - LXX "Rephan" arises from a misreading of k as r; the Damascus Document (CD VII 14-21) reinterprets the verse as the "booth of the king" and the books of the Torah.
  sources_to_check:
    - S. M. Paul, Amos (Hermeneia, 1991)
    - DDD, s.v. "Sakkuth"; "Kaiwan"

- id: lilith
  aliases: [lîlît, lilītu]
  cultures: [mesopotamian, judahite, jewish]
  scope: >-
    Lilith, a female night demon named once in the Hebrew Bible (Isa 34:14), derived
    from the Mesopotamian lilû/lilītu wind-demons, and prominent in later Jewish magic
    and legend. The entry covers the ancient evidence and distinguishes it from
    medieval developments.
  passages:
    - "Isa 34:14 | language | Lilith rests among the ruins of Edom with wild creatures and goat-demons"
    - "Isa 13:21-22 | imagery | Goat-demons and desert creatures haunting ruined Babylon"
  related: [demons, lamashtu-pazuzu-amulets, burney-relief, amulets, dead-sea-scrolls]
  wikipedia: Lilith
  image: Aramaic incantation bowl Lilith
  author_notes:
    - Correct the misconception that the Bible presents Lilith as Adam's first wife; this comes from the medieval Alphabet of Ben Sira.
    - Identification of the Burney Relief figure and of the ki-sikil-lil-la in the Sumerian Gilgamesh-Huluppu tale with Lilith is disputed.
    - Qumran Songs of the Sage (4Q510-511) list lilin among demons; later Aramaic incantation bowls depict Lilith.
    - Translations vary (KJV "screech owl"); explain the lexical history.
  sources_to_check:
    - DDD, s.v. "Lilith"

- id: demons
  aliases: [evil spirits, šēdîm, śəʿîrîm]
  cultures: [ane, mesopotamian, hebrew, jewish]
  scope: >-
    Demons and harmful spirits in the ancient Near East and the Hebrew Bible:
    Mesopotamian demons and anti-demonic ritual, the šēdîm and śəʿîrîm of the Bible,
    demoted deities of plague, and evil spirits sent by God. The entry stops before
    the developed demonology of the New Testament period, noting it only in outline.
  passages:
    - "Lev 17:7 | practice | Sacrifices to goat-demons (śəʿîrîm) prohibited"
    - "Deut 32:17 | polemic | Sacrifices to šēdîm, not God; cf. Akkadian šēdu"
    - "Ps 106:37 | polemic | Sons and daughters sacrificed to šēdîm"
    - "Ps 91:5-6 | concept | Terror of the night, arrow by day, Deber and Qeteb at noon"
    - "Lev 16:8-10 | practice | Goat sent to Azazel in the wilderness"
    - "1Sam 16:14-23 | concept | An evil spirit from YHWH torments Saul; music as remedy"
    - "Isa 13:21 | imagery | Goat-demons dance among ruins"
    - "Tob 3:8 | concept | The demon Asmodeus kills Sarah's husbands"
    - "Mark 5:1-20 | concept | Exorcism of the Gerasene demoniac"
  related: [lamashtu-pazuzu-amulets, day-of-atonement-elimination, maqlu, amulets, lilith, resheph, satan-the-adversary, hittite-elimination-rituals]
  wikipedia: null
  image: Pazuzu statuette Louvre
  author_notes:
    - The Hebrew Bible has little systematic demonology; harmful powers are usually subordinate to YHWH (1 Sam 16:14). Avoid reading later demonology back into it.
    - Mesopotamian evidence (Udug-hul incantations, Lamashtu and Pazuzu, Maqlû) offers the richest comparison; distinguish demons from protective spirits (šēdu/lamassu can be benevolent).
    - Azazel's identity (demon, place, "complete removal") is debated; link to elimination rites.
    - Several biblical terms (Deber, Qeteb, Resheph, Lilith) are demoted deities or demons; treat individually.
  sources_to_check:
    - 'M. J. Geller, Evil Demons: Canonical Utukkū Lemnūtu Incantations (2007)'
    - F. A. M. Wiggermann, Mesopotamian Protective Spirits (1992)
    - DDD, s.v. "Azazel"; "Deber"; "Qeteb"

- id: yhwh-origins
  aliases: [origins of Yahweh, Kenite hypothesis, Midianite hypothesis]
  cultures: [hebrew, egyptian, arabian, edomite]
  scope: >-
    The historical origins of the worship of YHWH: the earliest extrabiblical
    attestations, biblical traditions of a southern homeland (Sinai, Seir, Edom, Teman,
    Midian), the Midianite-Kenite hypothesis, and YHWH's relationship to El. The entry
    covers critical debate without endorsing any one reconstruction.
  passages:
    - "Exod 3:13-15 | concept | Revelation of the divine name at Horeb in Midian"
    - "Exod 6:2-3 | concept | YHWH unknown by name to the ancestors, who knew El Shaddai"
    - "Deut 33:2 | concept | YHWH comes from Sinai, Seir and Mount Paran"
    - "Judg 5:4-5 | concept | YHWH marches from Seir and Edom; 'the One of Sinai'"
    - "Hab 3:3, 7 | concept | God comes from Teman and Paran; Cushan and Midian tremble"
    - "Ps 68:7-8 | concept | God of Sinai marches through the wilderness (MT 68:8-9)"
    - "Exod 18:1-12 | concept | Jethro, priest of Midian, sacrifices and blesses YHWH"
    - "Judg 1:16; 4:11 | attests | Kenites as kin of Moses' father-in-law"
    - "Gen 4:26 | concept | People begin to call on YHWH's name in primeval times (non-P)"
  related: [soleb-shasu-inscription, shasu, midianites-and-kenites, kuntillet-ajrud-inscriptions, el, qos, mesha-stele, divine-warrior]
  wikipedia: Yahweh
  image: Soleb temple Shasu of Yhw inscription
  author_notes:
    - The earliest possible attestation is the Egyptian toponym "land of the Shasu of Yhw(3)" at Soleb (Amenhotep III) and Amarah West (Ramesses II); its link to the divine name is widely but not universally accepted.
    - Present the Midianite-Kenite hypothesis as influential but debated (Blenkinsopp 2008); recent reconstructions (Römer, Lewis) differ on the southern origin.
    - Kuntillet ʿAjrud's "YHWH of Teman" supports southern associations; the Mesha Stele (9th c.) is the earliest secure mention of YHWH.
    - Flag as fringe or discredited the claims of YHWH at Ebla (ya- names) or in Ugaritic yw (KTU 1.1 IV 14).
  sources_to_check:
    - J. Blenkinsopp, "The Midianite-Kenite Hypothesis Revisited," JSOT 33 (2008)
    - T. Römer, The Invention of God (2015)
    - T. J. Lewis, The Origin and Character of God (2020)
    - DDD, s.v. "Yahweh"

- id: divine-council
