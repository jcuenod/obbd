    - DDD, s.v. "Tannin"

- id: nephilim
  aliases: [giants, gibborim, Anakim]
  cultures: [hebrew, jewish]
  scope: >-
    The Nephilim of Gen 6:4 and Num 13:33 and related biblical traditions of giant
    pre-Israelite peoples (Anakim, Emim, Zamzummim, Rephaim), together with their
