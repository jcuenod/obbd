    - "Isa 27:1 | imagery | YHWH kills the tannin in the sea"
    - "Isa 51:9 | imagery | YHWH pierces the tannin"
    - "Job 7:12 | imagery | 'Am I the Sea, or the Tannin?'"
    - "Exod 7:9-12 | language | Aaron's staff becomes a tannin before Pharaoh"
    - "Ezek 29:3; 32:2 | imagery | Pharaoh as the great tannin in the Nile"
    - "Jer 51:34 | imagery | Nebuchadnezzar swallows Jerusalem like a tannin"
    - "Neh 2:13 | language | 'Dragon's Spring' in Jerusalem"
    - "Bel 23-27 | concept | Daniel kills the dragon venerated in Babylon"
  related: [leviathan, rahab-sea-monster, chaoskampf, creation-accounts, yam, marduk, ishtar-gate]
