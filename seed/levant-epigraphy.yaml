    - "Deut 26:14 | practice | Disavowal of offerings given to the dead"
    - "Ps 106:28 | practice | Eating sacrifices offered to the dead"
    - "2Sam 18:18 | practice | Absalom's memorial pillar to keep his name remembered"
    - "Isa 56:5 | language | yād wāšēm 'monument and name' as a memorial"
    - "Gen 35:20 | practice | Jacob sets up a pillar over Rachel's grave"
    - "Gen 35:18 | concept | The nepeš departing at death; cf. the nbš dwelling in the stele"
  related: [care-for-the-dead, marzeah, kilamuwa-stele, afterlife-and-resurrection, massebot, hadad-rimmon, aramaic-language, arameans]
  wikipedia: Kuttamuwa stele
  image: Katumuwa stele Zincirli
  author_notes:
    - "Found by the University of Chicago Neubauer Expedition in a small mortuary chapel, which makes it rare as a funerary monument in its original setting."
    - "The idea of a nbš residing in a stone monument, possibly alongside cremation, is a significant datum for West Semitic views of the person after death. Avoid reading it directly into Hebrew nepeš."
    - "Later Aramaic and Nabataean use of npš for 'funerary monument' is relevant background."
    - "The language is Samʾalian, a distinct dialect related to Aramaic. Mention the Luwian cultural milieu (the name Katumuwa is Luwian)."
  sources_to_check:
    - Pardee, BASOR 356 (2009)
    - Struble and Herrmann, BASOR 356 (2009)
    - "Herrmann and Schloen (eds.), In Remembrance of Me: Feasting with the Dead in the Ancient Middle East (2014)"

- id: karatepe-inscription
  aliases: [Azatiwada Inscription, Karatepe Bilingual]
  cultures: [luwian, phoenician]
  date: [-725, -675]
  circa: true
  scope: >-
    The Phoenician and Hieroglyphic Luwian bilingual of Azatiwada, a vassal ruler under
    Awariku, king of the Danunians (Adana), carved at the gates of the fortress of
    Karatepe-Aslantaş in Cilicia (found 1946). It describes the peace, plenty and
    security of his rule and was key to the decipherment of Hieroglyphic Luwian.
  passages:
    - "1Kgs 4:25 | concept | Peace and security: each under vine and fig tree (MT 5:5)"
    - "Mic 4:4 | concept | Security under vine and fig tree, with none to make afraid"
    - "Judg 5:6 | imagery | Roads deserted in insecurity; Azatiwada says a woman could walk alone with her spindles"
    - "Zech 8:4-5 | imagery | Old and young safe in the streets as a sign of restored order"
    - "1Kgs 10:28-29 | setting | Kue (Que, Cilicia), the Danunian kingdom, as a source of horses"
  related: [royal-ideology, kilamuwa-stele, phoenicians, resheph, chariots-and-horses, hittites-and-hethites]
  wikipedia: Karatepe bilingual
  image: Karatepe Aslantas inscription
  location: Karatepe-Aslantaş Open-Air Museum, Osmaniye (in situ)
  author_notes:
    - "Awariku is the Urikki of Que in Assyrian sources (Tiglath-pileser III, Sargon II). This anchors the date in the late 8th century, though some prefer the early 7th."
    - "The bilingual is valuable for divine-name equivalences, e.g. Phoenician Baal and Luwian Tarhunza, and Resheph of the birds (ršp ṣprm)."
    - "The link between the Danunians (dnnym) and the biblical tribe of Dan or the Homeric Danaoi is speculative. If mentioned, label it as such."
  sources_to_check:
    - KAI 26
    - COS 2.31
    - "Çambel, Corpus of Hieroglyphic Luwian Inscriptions II: Karatepe-Aslantaş (1999)"

- id: nora-stone
  cultures: [phoenician]
  date: [-825, -780]
  circa: true
  scope: >-
    A Phoenician inscription on a stone found in 1773 at Nora in southern Sardinia. It
    is one of the earliest Phoenician texts from the western Mediterranean and contains
    the earliest attestation of the name Sardinia (šrdn). Its first line is often read as
    mentioning Tarshish (trš).
  passages:
    - "Gen 10:4 | attests? | Tarshish among the sons of Javan"
    - "Ps 72:10 | attests? | Kings of Tarshish and the isles bring tribute"
    - "Isa 23:1 | attests? | Ships of Tarshish in the oracle against Tyre"
    - "Ezek 27:12 | attests? | Tarshish trades silver, iron, tin and lead with Tyre"
    - "Jonah 1:3 | attests? | Tarshish as the far western destination"
  related: [tarshish, phoenician-seafaring, phoenicians, tyre, hiram-of-tyre]
  wikipedia: Nora Stone
  image: Nora Stone Cagliari
  location: Museo Archeologico Nazionale di Cagliari
  author_notes:
    - "The text is short and difficult. Whether btršš means 'in Tarshish', and whether Tarshish then lies in Sardinia or elsewhere (Tartessos, Spain), is debated. Give the main interpretations (e.g. Cross 1972)."
    - "The stone is important evidence for Phoenician presence in the west by c. 800, which is relevant to the biblical 'ships of Tarshish' and to Tyrian trade in Ezek 27."
    - "Do not use the stone alone to locate Tarshish."
  sources_to_check:
    - KAI 46
    - Cross, BASOR 208 (1972)

- id: izbet-sartah-abecedary
  aliases: [ʿIzbet Ṣarṭah Ostracon]
  cultures: [canaanite, hebrew]
  date: [-1200, -1000]
  circa: true
  scope: >-
    An Iron Age I ostracon from ʿIzbet Ṣarṭah near Rosh HaʿAyin (found 1976) with four
    lines of practice letters and a full abecedary. It is a key witness to the early
    alphabet and its letter order, and to writing in a small highland village.
  passages:
    - "Lam 2:16-17; 3:46-51; 4:16-17 | form | Acrostics with pe before ʿayin, the order of the abecedary"
    - "Ps 119 | form | Alphabetic acrostic presupposing a fixed letter order"
    - "Prov 31:10-31 | form | Alphabetic acrostic"
    - "Judg 8:14 | practice | A young man writes down names, implying basic literacy"
    - "Isa 28:9-10 | practice? | ṣaw lāṣāw qaw lāqāw, perhaps letters recited in alphabet teaching"
    - "1Sam 4:1 | setting? | Site sometimes identified with Ebenezer"
  related: [writing-and-literacy, scribes-and-scribal-education, proto-sinaitic-script, paleo-hebrew-script, emergence-of-israel, ostraca]
  wikipedia: Izbet Sartah abecedary
  image: Izbet Sartah ostracon abecedary
  author_notes:
    - "The pe-ʿayin order also appears in other abecedaries (e.g. Kuntillet ʿAjrud) and in Lam 2-4. This makes it an early alternative letter order, not a scribal error."
    - "The script is transitional Proto-Canaanite. Its language and ethnic attribution are uncertain, so do not label it 'Israelite'."
    - "The ostracon looks like a student exercise. Use it carefully in literacy debates: it shows that someone was learning, not that literacy was widespread."
  sources_to_check:
    - Kochavi, Tel Aviv 4 (1977)
    - Demsky, Tel Aviv 4 (1977)
    - Finkelstein, ʿIzbet Ṣarṭah (BAR International Series 299, 1986)

- id: mesad-hashavyahu-ostracon
  aliases: [Yavneh-Yam Ostracon, Reaper's Plea]
  cultures: [judahite]
  date: [-630, -609]
  circa: true
  scope: >-
    A Hebrew ostracon found in 1960 at the coastal fortress of Meṣad Ḥashavyahu near
    Yavneh-Yam. In it a harvest worker petitions an official for the return of his
    garment, which an overseer named Hoshayahu son of Shobai had confiscated. It is the
    earliest extrabiblical legal petition in Hebrew.
  passages:
    - "Exod 22:26-27 | practice | A garment taken in pledge must be returned before sunset (MT 22:25-26)"
    - "Deut 24:12-15 | practice | Returning the poor man's pledged cloak; paying the labourer promptly"
    - "Amos 2:8 | practice | Garments taken in pledge abused by the powerful"
    - "Job 22:6 | practice | Taking pledges and stripping the naked of clothing"
    - "Deut 19:15 | practice | Testimony of witnesses; the reaper says his companions will testify for him"
    - "Amos 8:5 | practice? | 'before šbt' perhaps refers to the sabbath as a work boundary"
  related: [widow-orphan-sojourner, courts-and-legal-procedure, agriculture-and-farming, clothing-and-dress, sabbath, ostraca, josiah]
  wikipedia: Yavne-Yam ostracon
  image: Mesad Hashavyahu ostracon Israel Museum
  location: Israel Museum, Jerusalem
  author_notes:
    - "Whether šbt in 'before šbt' means 'sabbath' or 'stopping (work)' is disputed. Present both readings."
    - "Who controlled the fort (Josiah's Judah or Egypt under Psammetichus I, with Greek mercenaries) is debated. The Hebrew letter and the East Greek pottery both need explaining."
    - "The petition is not a lawsuit before a court but an appeal to an official. Compare biblical appeals to the king (2 Sam 14; 2 Kgs 8:3-6)."
  sources_to_check:
    - KAI 200
    - COS 3.41
    - Naveh, IEJ 10 (1960)
    - Dobbs-Allsopp et al., Hebrew Inscriptions (2005)

- id: tell-qasile-ostracon
  cultures: [hebrew]
  date: [-800, -700]
  circa: true
  scope: >-
    A Hebrew ostracon found in 1946 at Tell Qasile (Tel Aviv) reading 'Gold of Ophir to
    Beth-Horon, 30 shekels'. It is the only extrabiblical attestation of Ophir as a
    source of gold. The entry also covers the second Tell Qasile ostracon recording a
    quantity of oil.
  passages:
    - "1Kgs 9:28 | attests | Gold brought from Ophir by Hiram's and Solomon's fleet"
    - "1Kgs 10:11 | attests | Hiram's fleet brings gold from Ophir"
    - "1Kgs 22:48 | attests | Jehoshaphat's failed ships for Ophir gold (MT 22:49)"
    - "Ps 45:9 | language | 'Gold of Ophir' as the finest gold (MT 45:10)"
    - "Job 28:16 | language | 'Gold of Ophir' as a standard of value"
    - "Isa 13:12 | language | 'Gold of Ophir' as a byword for rarity"
    - "1Kgs 9:17 | attests? | byt ḥrn as the town Beth-horon, or a temple of the god Horon"
  related: [ophir, phoenician-seafaring, solomon, hiram-of-tyre, weights-and-silver-money, ostraca]
  wikipedia: Tel Qasile ostraca
  image: Tell Qasile ostracon gold of Ophir
  author_notes:
    - "Found on the surface, so the 8th-century date is palaeographic."
    - "'Gold of Ophir' may describe a quality or type of gold rather than a shipment just arrived from Ophir. Either way it shows the term was current in Iron Age commerce."
    - "Whether byt ḥrn is a place (Beth-horon) or a temple of Horon is open."
    - "Ophir's location (Arabia, East Africa, India) is not settled by the ostracon."
  sources_to_check:
    - Maisler (Mazar), JNES 10 (1951)
    - Dobbs-Allsopp et al., Hebrew Inscriptions (2005)

- id: uzziah-epitaph
  aliases: [Uzziah Tablet]
  cultures: [jewish]
  date: [-50, 50]
  circa: true
  scope: >-
    A square stone plaque with an Aramaic inscription in Jewish square script, reading
    'Hither were brought the bones of Uzziah, king of Judah. Do not open!'. It records a
    reburial of the king's remains in the late Second Temple period and was identified
    by E. L. Sukenik in 1931 in a collection on the Mount of Olives.
  passages:
    - "2Chr 26:23 | event | Uzziah buried in a field of the royal burial ground because he was leprous"
    - "2Kgs 15:7 | event | Azariah (Uzziah) buried with his ancestors in the City of David"
    - "2Chr 26:19-21 | setting | Uzziah's skin disease and isolation"
    - "Neh 3:16 | setting | Tombs of David as a Jerusalem landmark after the exile"
    - "Acts 2:29 | setting | David's tomb still known in the 1st century CE"
  related: [ossuaries, city-of-david, jerusalem, aramaic-language, bench-tombs, chronology-of-kings]
  wikipedia: null
  image: Uzziah burial plaque Israel Museum
  location: Israel Museum, Jerusalem
  author_notes:
    - "This is not an 8th-century artefact. The script dates it to the 1st century BCE or 1st century CE, contemporary with ossuary burial."
    - "The original findspot is unknown. It is not known whether the bones were really Uzziah's. The plaque is evidence for Second Temple memory of the royal tombs and for reburial practice."
    - "Discuss the Chronicler's distinction between Uzziah's burial and that of other kings, which may lie behind the reburial."
  sources_to_check:
    - Corpus Inscriptionum Iudaeae/Palaestinae I (Jerusalem)

- id: tell-siran-bottle-and-ammonite-inscriptions
  cultures: [ammonite]
  date: [-850, -580]
  circa: true
  scope: >-
    The small corpus of Ammonite inscriptions from the 9th to 6th centuries, chiefly the
    Amman Citadel Inscription (a building or divine-oracle text invoking Milkom), the
    bronze Tell Siran bottle naming three generations of Ammonite kings, and a seal
    impression from Tell el-ʿUmeiri of 'Milkomʾur, servant of Baʿalyashaʿ', usually
    identified with Baalis of Jer 40:14.
  passages:
    - "Jer 40:14 | attests | Baalis king of the Ammonites, who sent Ishmael to kill Gedaliah"
    - "1Kgs 11:5, 33 | attests | Milcom, god of the Ammonites"
    - "2Kgs 23:13 | attests | Milcom, 'abomination of the Ammonites'"
    - "Jer 49:1, 3 | attests | Milcom in the oracle against Ammon (MT malkām)"
    - "2Sam 12:30 | language? | Crown of malkām: 'their king' or Milcom"
    - "Amos 1:13-15 | setting | Oracle against Ammon and Rabbah"
    - "Eccl 2:4-6 | parallel? | Royal works of vineyards, gardens and pools; cf. the Tell Siran bottle"
  related: [ammonites, milkom, rabbah, seals-and-bullae, mizpah, fall-of-jerusalem-587, moabites]
  wikipedia: Ammonite language
  image: Tell Siran bottle Ammonite inscription
  author_notes:
    - "Tell Siran (found 1972) names Amminadab king of the Ammonites, son of Hissalel, son of Amminadab. An Amminadab of Ammon also appears in Ashurbanipal's records, which helps the dating."
    - "The Baʿalyashaʿ = Baalis identification is widely accepted, but it rests on a name variant. Present it as probable."
    - "The Ammonite script and language are distinct from Hebrew, Moabite and Aramaic, though the distinction is debated for some seals. Note that many 'Ammonite' seals are unprovenanced."
    - "The Amman Citadel inscription is fragmentary. Whether it is a royal building text or a divine oracle is debated."
  sources_to_check:
