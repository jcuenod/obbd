    - "1Kgs 12:28-30 | imagery | Jeroboam's calves at Bethel and Dan"
    - "Hos 8:5-6 | polemic | 'Your calf, O Samaria'"
    - "Hos 13:2 | polemic | People kiss calves"
    - "Gen 49:24 | language? | ʾăbîr yaʿăqōb, 'Mighty One of Jacob', related to ʾabbîr 'bull'"
    - "Num 23:22 | imagery? | God's 'horns like a wild ox'"
  related: [bull-iconography, el, baal, aniconism, emergence-of-israel, cult-images, high-places]
