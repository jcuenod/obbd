    The earlier Kilamuwa and Katumuwa stelae have their own entries.
  passages:
    - "2Kgs 16:5-9 | event | Rezin's war and Tiglath-pileser's capture of Damascus, the campaign in which Panamuwa II probably died"
    - "2Kgs 16:7-8 | practice | Ahaz, 'your servant and your son', buys Assyrian help; Samʾal's kings as loyal vassals"
    - "2Kgs 16:10 | setting | Ahaz meets Tiglath-pileser at Damascus after its capture"
    - "Judg 9:5 | parallel | Seventy brothers killed in a coup; cf. Bar-Ṣur and his seventy kinsmen"
    - "2Kgs 10:6-7 | parallel | Seventy sons of Ahab slaughtered in Jehu's coup"
    - "1Kgs 3:6 | concept | Son seated on his father's throne because of the father's righteousness"
    - "Ps 21:2-4 | concept | God grants the king what he asks, as in Panamuwa I's Hadad inscription (MT 21:3-5)"
    - "1Sam 8:11 | imagery | Men running before the king's chariots; cf. 'I ran at the wheel of my lord'"
  related: [tiglath-pileser-iii, tiglath-pileser-iii-inscriptions, tribute-and-vassalage, kilamuwa-stele, katumuwa-stele, ahaz, rezin, aramaic-language]
  wikipedia: Panamuwa II inscription
  image: Barrakib relief scribe Zincirli
  author_notes:
    - "Distinguish the pieces. The Hadad statue of Panamuwa I (KAI 214) and the Panamuwa II memorial (KAI 215) are in the local Samʾalian dialect. Bar-Rakib's inscriptions (KAI 216-221) are in standard Old Aramaic. The shift of written language within one dynasty is itself significant. Give holding museums only after verifying each object (Berlin and Istanbul both hold Zincirli finds)."
    - "KAI 215 tells how Panamuwa II's father Bar-Ṣur was killed with seventy of his kinsmen, how Assyria restored the dynasty, and how Panamuwa died in the camp of his lord Tiglath-pileser, probably during the Damascus campaign of 733-732. The camp mourned him and his body was brought home."
    - "Bar-Rakib's phrases ('I ran at the wheel of my lord, the king of Assyria'; 'because of my father's righteousness and my own righteousness') are classic vassal language. They make a close comparison with Ahaz's submission in 2 Kgs 16, without implying any literary link."
    - "The Hadad statue directs a future king to invoke 'the soul (nbš) of Panamuwa' to eat and drink with Hadad. Link this royal ancestor cult to the Katumuwa stele and to care-for-the-dead."
    - "Panammu of Samʾal appears in Tiglath-pileser III's tribute lists alongside Rezin and Menahem; verify the list and date (c. 738)."
  sources_to_check:
    - KAI 214
    - KAI 215
    - KAI 216
    - "J. Tropper, Die Inschriften von Zincirli (ALASP 6, 1993)"

- id: edomite-inscriptions
  aliases: [Horvat ʿUza Ostracon, Qos-gabar Seal, Qosʿanal Seal Impressions]
  cultures: [edomite]
  date: [-700, -550]
  circa: true
  scope: >-
    The small corpus of Iron Age Edomite inscriptions: ostraca, seals and seal impressions
    from Buseirah (Bozrah), Umm el-Biyara, Tell el-Kheleifeh and the eastern Negev,
    including the Horvat ʿUza letter that blesses its recipient by Qos. It covers the
    Edomite script and language and what the texts show about Edomite religion and
    expansion. Edomite history in general is treated under edomites and the god under qos.
  passages:
    - "2Kgs 16:6 | setting | Edomites settle at Elath (MT Kethiv 'Arameans', Qere 'Edomites'); cf. Edomite seal impressions at Tell el-Kheleifeh"
    - "2Chr 28:17 | setting | Edomite raids on Judah in the reign of Ahaz"
    - "Ezek 35:10 | setting | Edom claims Judah's land; cf. Edomite letters and a shrine in the Negev"
    - "Obad 10-14 | setting | Edom's conduct at Judah's fall, against the background of Edomite expansion westward"
    - "Jer 49:7-22 | setting | Oracle against Edom naming Teman and Bozrah"
    - "Ezra 2:53 | language | Barkos, a Qos-theophoric name of the type common in Edomite inscriptions"
  related: [qos, edomites, bozrah, arad-ostraca, ezion-geber, seals-and-bullae, ostraca, petra-and-sela]
  wikipedia: Edomite language
  image: Horvat Uza Edomite ostracon
  author_notes:
    - "Outline the corpus and verify each item: the Horvat ʿUza ostracon (a letter of c. 600 BCE invoking a blessing by Qos), the Umm el-Biyara seal impression of Qos-gabar king of Edom (the Qaus-gabri of Esarhaddon's and Ashurbanipal's inscriptions), the Tell el-Kheleifeh jar impressions of 'Qosʿanal, servant of the king', ostraca and seals from Buseirah, and the inscriptions from the Horvat Qitmit shrine."
    - "The Edomite script had developed distinctive letter forms by the seventh century, with influence from Aramaic cursive. Whether particular finds from Judahite sites are Edomite or Judahite is sometimes debated, so classify them with care."
    - "The texts confirm Qos as the main Edomite god and an Edomite presence in the eastern Negev in the late seventh and early sixth centuries; compare Arad ostracon 24, which warns of Edom. Do not assume all Edomite presence was military. Trade and mixed settlement are also likely."
    - "The fourth-century Idumean ostraca are Aramaic and much later. Many are unprovenanced. Treat them as continuity evidence (they contain many Qos names), not as part of the Iron Age corpus."
  sources_to_check:
    - "I. Beit-Arieh and B. Cresson, 'An Edomite Ostracon from Ḥorvat ʿUza,' Tel Aviv 12 (1985)"
    - "I. Beit-Arieh (ed.), Ḥorvat Qitmit: An Edomite Shrine in the Biblical Negev (1995)"
    - "S. Aḥituv, Echoes from the Past: Hebrew and Cognate Inscriptions from the Biblical Period (2008)"

