    - Aḥituv, Echoes from the Past (2008)

- id: qedarite-silver-bowl
  aliases: [Tell el-Maskhuta Bowls, Qainu Bowl]
  cultures: [arabian, persian]
  date: [-425, -400]
  circa: true
  scope: >-
    Silver bowls from a shrine of the goddess han-ʾIlat at Tell el-Maskhuta in the Wadi
    Tumilat (Egypt), with Aramaic dedications. One records an offering by 'Qaynu son of
    Gashmu, king of Qedar'. They attest a Qedarite dynasty whose founder is usually
    identified with Geshem the Arab, Nehemiah's opponent.
  passages:
    - "Neh 2:19 | attests | Geshem the Arab among Nehemiah's opponents"
    - "Neh 6:1-2, 6 | attests | Geshem (Gashmu) and the plot against Nehemiah"
    - "Gen 25:13 | attests | Kedar as a son of Ishmael"
    - "Isa 21:16-17 | attests | The glory and archers of Kedar"
    - "Ezek 27:21 | attests | Arabia and the princes of Kedar trading with Tyre"
    - "Ps 120:5 | attests | 'Tents of Kedar' as a byword for foreign dwelling"
  related: [qedarites-and-arabs, sanballat, yehud-province, persia, incense-trade, aramaic-language]
  wikipedia: null
  image: Tell el-Maskhuta silver bowl Qaynu Brooklyn Museum
  location: Brooklyn Museum, New York
  author_notes:
    - "Published by Rabinowitz (1956). The bowls are said to come from Tell el-Maskhuta, but they were acquired through the market, so give the provenance details carefully."
    - "Gashmu here is probably the Geshem of Nehemiah (cf. Neh 6:6, 'Gashmu'). A Lihyanite inscription from Dedan naming 'Gashm son of Shahr' is also discussed. Explain the reasoning and the uncertainty."
    - "The bowls show a Qedarite kingdom stretching from northern Arabia to the eastern Delta under Persian rule. This is the context for Geshem's interest in Judah."
  sources_to_check:
    - Rabinowitz, JNES 15 (1956)

- id: pim-weights
  aliases: [Judahite inscribed weights]
  cultures: [judahite]
  date: [-750, -586]
  circa: true
  scope: >-
    Small dome-shaped stone weights of the late Judahite monarchy, inscribed with the
    shekel sign and hieratic numerals or with the names of fractional units: nṣp (nesef),
    pym (pim) and bqʿ (beqaʿ). Their standardisation reveals a Judahite weight system
    based on a shekel of about 11.3 g.
  passages:
    - "1Sam 13:21 | language | pîm, the charge for sharpening tools, explained by inscribed pim weights"
    - "Exod 38:26 | language | beqaʿ as half a shekel"
    - "Gen 24:22 | language | A gold nose-ring weighing a beqaʿ"
    - "Ezek 45:12 | practice | The shekel defined as twenty gerahs; cf. hieratic gerah numerals"
    - "Gen 23:16 | practice | Silver weighed out at the merchants' standard"
    - "Lev 19:35-36 | practice | Just balances and just weights ('stones')"
    - "Deut 25:13-16 | practice | Prohibition of two different weights, large and small"
    - "Prov 11:1 | practice | False balances an abomination to YHWH"
    - "Amos 8:5 | practice | Merchants making the shekel great to cheat"
    - "Mic 6:11 | practice | A bag of deceitful weights"
  related: [weights-and-silver-money, coinage, iron-technology, lmlk-seal-impressions, scribes-and-scribal-education]
  wikipedia: Pim weight
  image: Pim weight stone Judah
  author_notes:
    - "Before the pim weights were identified (early 20th century), 1 Sam 13:21 was unintelligible. It is a classic case of epigraphy solving a biblical crux."
    - "The use of Egyptian hieratic numerals on Judahite weights is a notable sign of Egyptian scribal influence."
    - "Note the variation in actual weight among specimens. Biblical concern for just weights is borne out by real variability (Kletter)."
    - "Some inscribed weights on the market are forgeries. Prefer excavated examples."
  sources_to_check:
    - "Kletter, Economic Keystones: The Weight System of the Kingdom of Judah (JSOTSup 276, 1998)"

- id: judean-pillar-figurines
  aliases: [JPFs]
  cultures: [judahite]
  date: [-750, -586]
  circa: true
  scope: >-
    Small terracotta female figurines with a solid pillar base and hands supporting the
    breasts, found by the thousand in 8th to early 6th century Judah, especially in
    Jerusalem households. The entry covers their typology, contexts and the debate over
    whom or what they represent.
  passages:
    - "Jer 7:18 | practice? | Families bake cakes for the Queen of Heaven"
    - "Jer 44:15-19 | practice? | Women's offerings to the Queen of Heaven, cakes 'in her image'"
    - "2Kgs 23:6-7 | concept? | Asherah and women weaving for Asherah in the temple"
    - "Gen 31:19, 34-35 | practice? | Household images (teraphim) kept by women"
    - "Deut 4:16 | polemic? | Prohibition of images 'in the likeness of male or female'"
  related: [asherah, queen-of-heaven, teraphim, cult-reforms-archaeology, aniconism, amulets, cult-images]
  wikipedia: Judean pillar figure
  image: Judean pillar figurine
  author_notes:
    - "Interpretations include Asherah (Kletter), a generic goddess, votive figures, and healing or apotropaic devices (Darby). Recent work stresses domestic and protective uses rather than 'fertility cult'."
    - "The figurines continue up to 586 and were not removed by Josiah's reform. This complicates simple readings of 2 Kgs 23 and of a 'popular religion' versus 'official religion' split."
    - "Most come from fills and refuse, not shrines. Context matters for interpretation."
    - "Every biblical link here is inferential. Mark identifications (Asherah, Queen of Heaven, teraphim) as proposals."
  sources_to_check:
    - Kletter, The Judean Pillar-Figurines and the Archaeology of Asherah (BAR International Series 636, 1996)
    - Darby, Interpreting Judean Pillar Figurines (2014)
    - Keel and Uehlinger, Gods, Goddesses, and Images of God in Ancient Israel (1998)

- id: taanach-cult-stand
  cultures: [canaanite, israelite]
  date: [-1000, -900]
  circa: true
  scope: >-
    Two decorated terracotta cult stands from Taanach in the Jezreel Valley. The better
    known, found by P. Lapp in 1968, has four registers: a naked female between lions;
    two winged sphinxes flanking an empty space; a sacred tree with ibexes between lions;
    and a quadruped under a winged sun disk.
  passages:
    - "1Kgs 7:27-37 | realia | Bronze stands of Solomon's temple decorated with lions, oxen, cherubim and palms"
    - "1Sam 4:4 | concept? | YHWH 'enthroned on the cherubim'; cf. the empty space between sphinxes"
    - "2Kgs 23:11 | imagery? | Horses dedicated to the sun; cf. the quadruped beneath the sun disk"
    - "Deut 16:21 | concept? | Asherah and the sacred tree"
    - "Judg 5:19 | setting | The kings of Canaan fought at Taanach"
    - "1Kgs 4:12 | setting | Taanach in an Israelite administrative district"
  related: [cult-stands, cherubim, asherah, winged-sun-disk, cherub-throne, aniconism, shamash]
  wikipedia: Ta'anakh cult stand
  image: Taanach cult stand Israel Museum
  location: Israel Museum, Jerusalem (Lapp stand)
  author_notes:
    - "The two stands should be distinguished: Sellin found one in 1902, and Lapp found the famous one in 1968."
    - "Hestrin's and Taylor's readings (alternating Asherah registers and YHWH registers, with an aniconic deity between cherubim and a solar YHWH on top) are influential but contested. Present them as interpretations."
    - "Whether Taanach was Israelite or Canaanite in the 10th century is itself debated. Avoid calling the stand 'Israelite'."
    - "The quadruped on the top register may be a horse or a bovine. This affects the solar and 'calf' interpretations."
  sources_to_check:
    - Keel and Uehlinger, Gods, Goddesses, and Images of God in Ancient Israel (1998)
    - Taylor, Yahweh and the Sun (JSOTSup 111, 1993)

- id: bull-site-figurine
  aliases: [Dhahrat et-Tawileh bull]
  cultures: [israelite, canaanite]
  date: [-1200, -1100]
  circa: true
  scope: >-
    A bronze figurine of a zebu bull found in 1977 at an open-air Iron Age I cult place
