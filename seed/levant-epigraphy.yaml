    - "Amos 6:4 | realia | Beds of ivory of the Samarian elite"
    - "Ps 45:8 | realia | Ivory palaces in a royal wedding song (MT 45:9)"
    - "1Kgs 6:29, 32, 35 | realia | Temple decoration of cherubim, palm trees and open flowers"
    - "2Kgs 9:30 | imagery | 'Woman at the window' motif; cf. Jezebel looking out of the window"
    - "Ezek 27:6, 15 | realia | Ivory in Phoenician trade and inlay"
