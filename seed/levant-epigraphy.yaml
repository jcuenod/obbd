# Seed entries for the levant-epigraphy domain.
# Regnal dates for Israelite and Judahite kings follow the Tadmor/Cogan chronology
# (Anchor Bible I-II Kings; ABD "Chronology"). Alternatives are noted where they matter.

- id: mesha-stele
  aliases: [Moabite Stone]
  cultures: [moabite]
  date: [-840]
  circa: true
  scope: >-
    The basalt victory and building inscription of Mesha, king of Moab, found at
    Dhiban in 1868. It records Moab's liberation from Israelite control after the
    reign of Omri's dynasty and Mesha's building works, and is the longest Iron Age
    inscription from the southern Levant.
  passages:
    - "2Kgs 3:4-27 | event | Mesha's rebellion against Israel, told from the Moabite side"
    - "2Kgs 1:1 | event | Moab's rebellion after Ahab's death"
    - "1Kgs 16:21-28 | attests | Omri named as oppressor of Moab"
    - "Num 21:29 | language | Moabites as the 'people of Chemosh'"
    - "Judg 11:24 | concept | Chemosh as the national god who grants territory"
    - "Num 32:34-38 | setting | Dibon, Ataroth, Nebo, Baal-meon, Kiriathaim: towns named in the stele"
    - "Josh 6:17-21 | practice | ḥērem: Mesha devotes Nebo's population to Ashtar-Chemosh"
    - "Isa 15-16 | setting | Oracle against Moab naming many of the same towns"
    - "Jer 48:18-24 | setting | Dibon, Aroer, Jahaz, Nebo, Kiriathaim, Beth-meon, Kerioth: stele towns in the oracle"
    - "2Sam 23:20 | language? | 'ariel(s) of Moab'; cf. ʾrʾl in line 12, sense debated"
    - "2Sam 8:2 | attests? | 'House of David' reading in line 31 (bt[d]wd) is debated"
    - "Judg 3:12-30 | setting | Earlier Moabite domination under Eglon: the long Moab–Israel contest over the Transjordanian plateau"
  related: [chemosh, omri, moabites, dibon, herem, tel-dan-stele, ahab, yhwh-origins]
  wikipedia: Mesha Stele
  image: Mesha Stele Louvre
  location: Musée du Louvre, Paris
  author_notes:
    - "Explain the discovery in 1868, the stone's breakage, and the role of Clermont-Ganneau's squeeze in its reconstruction."
    - "Contrast the Moabite and biblical accounts of the revolt's timing ('in his days' vs. after Ahab's death) and outcome. The stele's 'forty years' of Omride control is a round number and does not fit biblical chronology."
    - "Lines 17-18 (Mesha takes the [vessels] of YHWH from Nebo and drags them before Chemosh) contain the earliest datable extrabiblical attestation of the divine name YHWH."
    - "Note the theological parallel of a national god angry with his land (Chemosh/YHWH) and the language of ḥērem. The stele says nothing about the sacrifice of the king's son in 2 Kgs 3:27."
    - "Present the 'House of David' (line 31) reading as proposed and debated, not as settled. Lemaire proposed it in 1994; Finkelstein, Na'aman and Römer (2019) proposed 'Balak'; new imaging has been claimed for both readings."
  sources_to_check:
    - KAI 181
    - COS 2.23
    - ANET 320-321
    - Aḥituv, Echoes from the Past (2008)

- id: tel-dan-stele
  aliases: [House of David Inscription, Tel Dan Inscription]
  cultures: [aramean]
  date: [-842, -800]
  circa: true
  scope: >-
    Fragments of an Old Aramaic royal victory stele found at Tel Dan in 1993 and 1994,
    almost certainly erected by Hazael of Damascus. The king claims to have killed a
    king of Israel and a king of the 'House of David' (bytdwd), the earliest secure
    extrabiblical reference to the Davidic dynasty.
  passages:
    - "2Kgs 8:28-29 | event | Joram of Israel and Ahaziah of Judah at war with Hazael at Ramoth-gilead"
    - "2Kgs 9:14-28 | event | Deaths of Joram and Ahaziah, ascribed to Jehu's coup rather than to Hazael"
    - "2Kgs 8:7-15 | attests | Hazael's accession at Damascus; the stele claims Hadad made him king"
    - "2Sam 7:11-16 | attests | bytdwd 'House of David' names Judah's ruling dynasty"
    - "Isa 7:2, 13 | language | 'House of David' as a designation of the Judahite dynasty"
    - "2Kgs 10:32-33 | event | Hazael's conquests of Israelite territory"
    - "1Kgs 15:20 | setting | Dan taken by Aram in an earlier war"
    - "1Kgs 12:28-30 | setting | Dan as a royal Israelite sanctuary and border city"
  related: [hazael, jehu, david, dan, arameans, mesha-stele, hadad-rimmon, damascus]
  wikipedia: Tel Dan stele
  image: Tel Dan Stele Israel Museum
  location: Israel Museum, Jerusalem
  author_notes:
    - "Fragment A was found in 1993 and fragments B1-B2 in 1994, all reused in later construction. Whether B joins A, and where, is debated and affects the restoration of the royal names."
    - "The names [Jeho]ram son of [Ahab] and [Ahaz]iahu son of [Joram] are partly restored. Say so, and give the consensus restoration."
    - "The reading bytdwd as 'House of David' is now the consensus. Early alternatives (a place name, 'house of Dod', and claims of forgery) are marginal and should be mentioned only briefly."
    - "Discuss the conflict with 2 Kgs 9: royal hyperbole, Jehu as Hazael's agent, or the biblical account crediting Jehu with what Aram claimed. Do not harmonise."
    - "The author's name is lost. Attribution to Hazael is the majority view; a minority suggests Bar-Hadad son of Hazael."
  sources_to_check:
    - KAI 310
    - COS 2.39
    - Biran and Naveh, IEJ 43 (1993) and IEJ 45 (1995)
    - Athas, The Tel Dan Inscription (JSOTSup 360, 2003)
    - Aḥituv, Echoes from the Past (2008)

- id: siloam-inscription
  aliases: [Siloam Tunnel Inscription]
  cultures: [judahite]
  date: [-700]
  circa: true
  scope: >-
    A six-line Hebrew inscription cut into the wall of the Siloam (Hezekiah's) tunnel
    in Jerusalem, describing the moment when two teams of tunnellers met. It is the
    longest monumental Hebrew inscription from the monarchy. The tunnel itself is
    treated under hezekiahs-tunnel.
  passages:
    - "2Kgs 20:20 | event | Hezekiah made the pool and the conduit and brought water into the city"
    - "2Chr 32:30 | event | Hezekiah channelled the upper Gihon waters down to the west of the City of David"
    - "2Chr 32:2-4 | setting | Stopping the springs before Sennacherib's invasion"
    - "Isa 22:9-11 | setting | Collecting the waters of the lower pool and building a reservoir"
    - "Sir 48:17 | event | Hezekiah tunnelled the rock with iron and built pools"
    - "Neh 3:15 | setting | Pool of Shelah by the king's garden"
    - "John 9:7 | setting | Pool of Siloam, still fed by the tunnel in the Roman period"
  related: [hezekiahs-tunnel, hezekiah, city-of-david, sennacherib-campaign-701, pool-of-siloam, cisterns-and-water-systems, paleo-hebrew-script]
  wikipedia: Siloam inscription
  image: Siloam inscription Istanbul Archaeology Museum
  location: Istanbul Archaeology Museums
  author_notes:
    - "Found in 1880 near the tunnel's southern end. It was cut out and broken in 1891 and taken to Constantinople."
    - "The inscription names no king and was not placed for display. It celebrates the work and the workers, which is unusual for ANE building inscriptions."
    - "The attribution to Hezekiah rests on 2 Kgs 20:20 and 2 Chr 32:30, palaeography, and radiometric dating of the tunnel plaster (c. 700). A Hasmonean dating (Rogerson and Davies 1996) has been rejected. Reich and Shukron's suggestion that the tunnel predates Hezekiah is a minority view."
    - "The 'waters of Shiloah' in Isa 8:6 probably refer to the earlier channel (Channel II), not to this tunnel."
  sources_to_check:
    - KAI 189
    - COS 2.28
    - ANET 321
    - Dobbs-Allsopp et al., Hebrew Inscriptions (2005)

- id: gezer-calendar
  cultures: [hebrew]
  date: [-950]
  circa: true
  scope: >-
    A small limestone tablet from Gezer (found 1908) listing the months of the
    agricultural year by their main tasks, from ingathering and sowing to summer
    fruit. It is one of the earliest substantial alphabetic inscriptions from the
    southern Levant.
  passages:
    - "Exod 23:16 | practice | Festival of ingathering (ʾāsîp) at the year's end; the calendar opens with ʾsp"
    - "Exod 34:22 | language | Ingathering 'at the turn of the year' (tĕqûpat haššānâ)"
    - "Deut 16:9-15 | practice | Harvest festivals timed by the agricultural cycle"
    - "Ruth 1:22; 2:23 | setting | Barley harvest followed by wheat harvest, as in the calendar's sequence"
    - "Amos 7:1 | language | leqeš, the late growth; cf. the calendar's 'two months of late sowing' (lqš)"
    - "Lev 25:3-4 | language | zāmar 'to prune' vines; cf. the calendar's month of pruning (zmr)"
    - "Amos 8:1-2 | language | qayiṣ 'summer fruit', the calendar's final month (qṣ), used in a wordplay with 'end'"
  related: [gezer, agriculture-and-farming, festivals-agricultural, calendars-and-month-names, writing-and-literacy, paleo-hebrew-script, scribes-and-scribal-education]
  wikipedia: Gezer calendar
  image: Gezer calendar Istanbul Archaeology Museum
  location: Istanbul Archaeology Museums
  author_notes:
    - "Found in 1908 by R. A. S. Macalister. It came from a disturbed context, so the 10th-century date rests on palaeography."
    - "The language and script are debated: early Hebrew, Phoenician, or a southern Canaanite dialect. The forms in -w (yrḥw) may be duals or suffixed forms."
    - "Its purpose is uncertain: a scribal exercise (the tablet is a palimpsest), a mnemonic song, or an administrative schedule. Do not present it as an Israelite cultic calendar."
    - "The marginal name ʾbyw (Abijah?) is sometimes read as the scribe's signature. The reading is uncertain."
  sources_to_check:
    - KAI 182
    - COS 2.85
    - ANET 320
    - Dobbs-Allsopp et al., Hebrew Inscriptions (2005)
    - Talmon, JAOS 83 (1963)

- id: lachish-letters
  aliases: [Lachish Ostraca]
  cultures: [judahite]
  date: [-589, -586]
  circa: true
  scope: >-
    A group of Hebrew ostraca, mostly letters, found in 1935 and 1938 in the gate area
    of Lachish (Tell ed-Duweir) in the destruction layer of the Babylonian conquest.
    Most are addressed to Yaʾush, apparently the commander at Lachish, by a subordinate
    named Hoshayahu.
  passages:
    - "Jer 34:6-7 | event | Lachish and Azekah the last fortified cities holding out against Babylon"
    - "Jer 6:1 | language | maśʾēt 'fire signal'; Letter 4 watches for the signals of Lachish"
    - "Jer 38:4 | language | 'Weakening the hands' of soldiers; the same idiom in Letter 6"
    - "Jer 26:20-23 | attests? | Letter 3's commander Coniah son of Elnathan goes to Egypt; cf. Elnathan son of Achbor"
    - "2Kgs 25:1-4 | event | Babylonian siege of Judah in Zedekiah's last years"
    - "2Kgs 5:6 | form | Letter body introduced by 'and now' (wĕʿattâ), as in the ostraca"
  related: [lachish, fall-of-jerusalem-587, nebuchadnezzar-ii, letter-writing-conventions, ostraca, writing-and-literacy, prophecy-in-the-ane]
  wikipedia: Lachish letters
  image: Lachish letters ostracon
  location: British Museum, London, and Israel Museum, Jerusalem (divided)
  author_notes:
    - "Letter 4 ('we cannot see Azekah') is often read as evidence that Azekah had already fallen, following Jer 34:7. This is possible but not certain."
    - "Letter 3 mentions 'the prophet' and a letter he delivered. Identifications with Jeremiah or with Uriah (Jer 26:20-23) were popular early on but are now generally regarded as unprovable."
    - "Letter 3 is also a key text for the literacy debate, since the writer protests that he can read a letter himself."
    - "Discuss the letter formulas (greeting, 'may YHWH cause my lord to hear good news', oath 'as YHWH lives') and the Yahwistic personal names."
    - "Use the KAI 192-199 numbers alongside the excavation (Lachish 1-21) numbers."
  sources_to_check:
    - KAI 192-199
    - COS 3.42
    - ANET 321-322
    - Torczyner, Lachish I. The Lachish Letters (1938)
    - Dobbs-Allsopp et al., Hebrew Inscriptions (2005)

- id: arad-ostraca
  cultures: [judahite]
  date: [-605, -587]
  circa: true
  scope: >-
    More than a hundred Hebrew ostraca from the Judahite fortress at Arad, with smaller
    Aramaic and other groups. The best-known group is the archive of Eliashib son of
    Eshiyahu (early 6th century), recording rations of wine, flour and oil for the
    Kittim and others and military orders about an Edomite threat.
  passages:
    - "Obad 10-14 | setting | Edom's hostility toward Judah in the last years of the kingdom"
    - "Ps 137:7 | setting | Edom remembered for its part in Jerusalem's fall"
    - "Ezek 25:12-14 | setting | Oracle against Edom for vengeance on Judah"
    - "Gen 10:4 | attests | Kittim, here apparently Aegean or Cypriot mercenaries in Judahite service"
    - "Jer 2:10 | language | 'Coasts of Kittim' as a western people"
    - "1Chr 9:19 | attests? | 'Sons of Korah' on Arad ostracon 49, perhaps a Levitical family"
  related: [arad, edomites, ostraca, letter-writing-conventions, fall-of-jerusalem-587, qos, writing-and-literacy, cult-reforms-archaeology]
  wikipedia: Arad ostraca
  image: Arad ostracon Eliashib
  location: Israel Museum, Jerusalem (many)
  author_notes:
    - "Date given is for the Eliashib archive (Stratum VI). The corpus as a whole runs from the 8th (perhaps 9th) century to the Persian and later periods, and Arad's stratigraphy has been revised since Aharoni (Herzog; Singer-Avitz)."
    - "Arad 24 orders troops to Ramat-negeb 'lest Edom should come there'. Arad 40, earlier, also refers to Edom. These letters support the biblical memory of Edomite hostility, but do not tie it to a specific biblical event."
    - "Arad 18 mentions 'the house of YHWH', most likely the Jerusalem temple. Keep it distinct from the Arad shrine, which is treated under arad and cult-reforms-archaeology."
    - "The ostraca are important evidence for literacy, administration, and the bureaucratic use of hieratic numerals and measures in Judah."
  sources_to_check:
    - COS 3.43
    - Aharoni, Arad Inscriptions (1981)
    - Dobbs-Allsopp et al., Hebrew Inscriptions (2005)

- id: samaria-ostraca
  cultures: [israelite]
  date: [-800, -750]
  circa: true
  scope: >-
    About a hundred ink-inscribed potsherds found in 1910 in the royal compound of
    Samaria, dated to years 9, 10 and 15 of an unnamed king. They record shipments of
    wine and oil from clan districts of Manasseh to named individuals, and are the main
    epigraphic source for the administration of the northern kingdom.
  passages:
    - "Num 26:30-33 | attests | Clans of Manasseh (Abiezer, Helek, Asriel, Shechem, Shemida) and Noah, Hoglah"
    - "Josh 17:2-3 | attests | The same Manassite clan and district names"
    - "Hos 2:16-17 | language | Baal-names among the recipients; Hosea's polemic against calling YHWH 'my Baal' (MT 2:18-19)"
    - "1Sam 8:14-15 | practice? | Royal grants and produce from estates for courtiers"
    - "Amos 6:4-6 | setting | Samarian elite consumption of wine and fine oil"
    - "2Kgs 14:23-29 | setting | Probably the reign of Jeroboam II"
  related: [samaria, ostraca, olive-oil-production, winepresses, genealogies, writing-and-literacy, baal, chronology-of-kings]
  wikipedia: Samaria Ostraca
  image: Samaria ostraca
  author_notes:
    - "The regnal years are usually assigned to Jeroboam II (some to Joash, Jehoahaz or Menahem). Year 15 may belong to a different king from years 9-10."
    - "The function is debated: tax receipts, deliveries from crown estates to officials, or records of produce owed to absentee landowners at court. Present the options."
    - "The clan names match the genealogies of Manasseh, which shows that these lists preserve real territorial units in the Samaria hills."
    - "Personal names show northern -yw (-yaw) Yahwistic forms alongside a notable number of Baal names. Use cautiously as evidence for religious practice."
  sources_to_check:
    - KAI 183-188
    - COS 3.44
    - Reisner, Fisher and Lyon, Harvard Excavations at Samaria 1908-1910 (1924)
    - Dobbs-Allsopp et al., Hebrew Inscriptions (2005)

- id: kuntillet-ajrud-inscriptions
  aliases: [Horvat Teman inscriptions]
  cultures: [israelite, judahite]
  date: [-800]
  circa: true
  scope: >-
    Inscriptions and drawings on storage jars (pithoi), plaster walls and stone vessels
    from the way-station at Kuntillet ʿAjrud in northeastern Sinai, including blessings
    'by YHWH of Samaria and his asherah' and 'by YHWH of Teman and his asherah' and a
    theophany text. The site itself is treated under kuntillet-ajrud.
  passages:
    - "Hab 3:3 | language | God comes from Teman; cf. 'YHWH of Teman'"
    - "Deut 33:2 | concept | YHWH dawns from Seir and shines from Paran in the south"
    - "Judg 5:4-5 | parallel | Theophany: mountains quake as the deity marches; cf. the plaster text"
    - "Mic 1:3-4 | parallel | Mountains melt at the divine appearance"
    - "2Sam 15:7 | concept | YHWH identified by place ('YHWH in Hebron'); cf. 'YHWH of Samaria'"
    - "Amos 8:14 | concept | Deities invoked by sanctuary town (Samaria, Dan, Beersheba)"
    - "Deut 16:21 | practice | Prohibition of an asherah beside YHWH's altar"
    - "2Kgs 21:7 | concept | Asherah image in YHWH's temple"
    - "Num 6:24 | parallel | 'May he bless you and keep you' blessing formula on Pithos B"
    - "Deut 6:4 | polemic? | 'YHWH is one' perhaps countering local manifestations of YHWH"
  related: [kuntillet-ajrud, asherah, khirbet-el-qom-inscription, yhwh-origins, ketef-hinnom-amulets, divine-warrior, samaria, aniconism]
  wikipedia: Kuntillet Ajrud
  image: Kuntillet Ajrud pithos drawing
  author_notes:
    - "Whether ʾšrth is the goddess Asherah ('his Asherah') or a cult object ('his asherah') is still debated, since Hebrew does not normally put suffixes on personal names. Present both views. Avoid the headline phrase 'Yahweh's wife'."
    - "Whether the drawings on Pithos A (two Bes-like figures and a seated lyre player) relate to the inscription above them is disputed. Most specialists now think they do not illustrate it."
    - "The script, the phrase 'YHWH of Samaria', and the pottery point to Israelite (northern) involvement in a site on a Judahite or southern route. Radiocarbon dating places it c. 800."
    - "Some plaster texts are in Phoenician script. Discuss the site's function (caravan station with a religious dimension, not a temple)."
  sources_to_check:
    - COS 2.47
    - Meshel, Kuntillet ʿAjrud (Ḥorvat Teman) (2012)
    - Dobbs-Allsopp et al., Hebrew Inscriptions (2005)
    - Hadley, The Cult of Asherah in Ancient Israel and Judah (2000)
    - Keel and Uehlinger, Gods, Goddesses, and Images of God in Ancient Israel (1998)

- id: khirbet-el-qom-inscription
  cultures: [judahite]
  date: [-750, -700]
  circa: true
  scope: >-
    A Hebrew tomb inscription from Khirbet el-Qom west of Hebron, blessing one
    Uriyahu 'by YHWH' and stating that he was saved from his enemies 'by his asherah'.
    An incised human hand appears below the text. The entry also covers the other
    inscriptions from the site's tombs.
  passages:
    - "Deut 16:21 | practice | Prohibition of an asherah beside YHWH's altar"
    - "2Kgs 23:6 | practice | Josiah removes the asherah from YHWH's temple"
    - "1Sam 15:13 | language | Blessing formula bārûk ... laYHWH 'blessed by YHWH'"
    - "Ps 18:3 | parallel | Calling on YHWH and being saved from enemies (MT 18:4)"
  related: [asherah, kuntillet-ajrud-inscriptions, bench-tombs, hebron, ketef-hinnom-amulets, yhwh-origins]
  wikipedia: Khirbet el-Qom
  image: Khirbet el-Qom inscription hand
  author_notes:
    - "Found by W. G. Dever in 1967 after tomb robbers had been active. The text is badly incised over earlier lines, so readings vary widely. Compare Dever, Zevit, Hadley and Dobbs-Allsopp et al."
    - "The phrase 'by his asherah' parallels Kuntillet ʿAjrud. Treat the two corpora together, but note that the el-Qom readings are less secure."
    - "The function of the hand (apotropaic, or a memorial yād) is uncertain. Present suggestions as such."
  sources_to_check:
    - COS 2.52
    - Dever, HUCA 40-41 (1969-1970)
    - Zevit, BASOR 255 (1984)
    - Dobbs-Allsopp et al., Hebrew Inscriptions (2005)

- id: ketef-hinnom-amulets
  aliases: [Ketef Hinnom scrolls, Silver Scrolls]
  cultures: [judahite]
  date: [-625, -575]
  circa: true
  scope: >-
    Two tiny rolled silver amulets found in 1979 in a repository of a bench tomb at
    Ketef Hinnom, Jerusalem, inscribed with forms of the Priestly Blessing and other
    protective formulas. They are the earliest known artefacts with text that parallels
    a biblical passage.
  passages:
    - "Num 6:24-26 | parallel | Shortened forms of the Priestly Blessing"
    - "Deut 7:9 | parallel | God who keeps covenant and steadfast love with those who love him"
    - "Neh 1:5 | parallel | The same covenant-keeping formula in prayer"
    - "Dan 9:4 | parallel | The same covenant-keeping formula in prayer"
    - "Ps 67:1 | parallel | Liturgical echo of the blessing: face shining upon us (MT 67:2)"
    - "Prov 6:21 | practice | Binding protective words around the neck"
    - "Deut 6:8 | practice | Words bound on the body as a sign"
  related: [amulets, bench-tombs, apotropaic-doorposts-and-thresholds, kuntillet-ajrud-inscriptions, light-of-the-face, jerusalem]
  wikipedia: Ketef Hinnom scrolls
  image: Ketef Hinnom silver scroll Israel Museum
  location: Israel Museum, Jerusalem
  author_notes:
    - "The 2004 re-edition (Barkay, Vaughn, Lundberg and Zuckerman) with new imaging supports a late 7th to early 6th century date on palaeographic and archaeological grounds. A minority has argued for a later (Persian or Hellenistic) date. Report this fairly."
    - "Do not present the amulets as 'the oldest biblical text' or as evidence that Numbers was already written. They show that a blessing formula also found in Numbers circulated in apotropaic use."
    - "Discuss the apotropaic phrases (e.g. 'the rebuker of evil') and how the blessing worked as protection for the dead or the living."
  sources_to_check:
    - Barkay, Vaughn, Lundberg and Zuckerman, BASOR 334 (2004)
    - COS 2.83
    - Dobbs-Allsopp et al., Hebrew Inscriptions (2005)
    - Smoak, The Priestly Blessing in Inscription and Scripture (2016)

- id: royal-steward-inscription
  aliases: [Shebna Inscription, Silwan Tomb Inscription]
  cultures: [judahite]
  date: [-700]
  circa: true
  scope: >-
    A Hebrew inscription carved over the entrance of a rock-cut tomb in the Silwan
    necropolis opposite the City of David, belonging to '[...]yahu who is over the
    house'. It declares that the tomb holds no silver or gold and curses anyone who
    opens it.
  passages:
    - "Isa 22:15-16 | attests? | Shebna 'over the house' rebuked for hewing a tomb on the height"
    - "2Kgs 18:18 | language | Title 'over the house' (ʾăšer ʿal-habbayit) for Eliakim"
    - "1Kgs 4:6 | language | The royal steward among Solomon's officials"
    - "Deut 27:15 | language | Curse formula 'Cursed be anyone who...' (ʾārûr hāʾîš ʾăšer)"
    - "Josh 6:26 | language | Curse on whoever undoes a site"
  related: [court-officials, bench-tombs, jerusalem, hezekiah, blessings-and-curses, ahiram-sarcophagus, eshmunazar-sarcophagus]
  wikipedia: Royal Steward inscription
  image: Royal Steward inscription British Museum
  location: British Museum, London
  author_notes:
    - "Removed by Clermont-Ganneau in 1870 but deciphered only by N. Avigad (1953)."
    - "The name is damaged. Restoring it as Shebanyahu (= Shebna, Isa 22:15) is attractive but unprovable. Present the identification as possible, not established."
    - "Compare the tomb curses with Phoenician royal sarcophagi (Ahiram, Tabnit, Eshmunazar). Note the Silwan necropolis's distinctive Judahite elite tomb architecture (Ussishkin)."
  sources_to_check:
    - KAI 191
    - Avigad, IEJ 3 (1953)
    - Ussishkin, The Village of Silwan (1993)
    - Dobbs-Allsopp et al., Hebrew Inscriptions (2005)

- id: hezekiah-bulla
  cultures: [judahite]
  date: [-727, -698]
  circa: true
  scope: >-
    A clay seal impression reading 'Belonging to Hezekiah [son of] Ahaz, king of Judah',
    with a two-winged sun disk flanked by ankh signs. It was found in 2009 in the Ophel
    excavations in Jerusalem and published in 2015. It is the first impression of a
    Judahite king's seal from a controlled excavation.
  passages:
    - "2Kgs 18:1 | attests | Hezekiah son of Ahaz, king of Judah"
    - "1Kgs 21:8 | practice | Royal seal used to authenticate documents"
    - "Mal 4:2 | imagery | 'Sun of righteousness' with healing in its wings (MT 3:20)"
    - "Ps 84:11 | imagery | YHWH as sun and shield (MT 84:12)"
  related: [hezekiah, winged-sun-disk, seals-and-bullae, ahaz, lmlk-seal-impressions, jerusalem, forgeries-in-biblical-archaeology]
  wikipedia: King Hezekiah bulla
  image: King Hezekiah bulla Ophel
  author_notes:
    - "Emphasise provenance. Similar Hezekiah bullae with a winged scarab, and an Ahaz bulla, are known from the antiquities market. Their authenticity cannot be checked in the same way."
    - "The change from the winged scarab (on unprovenanced bullae and lmlk handles) to the winged sun disk is relevant to debates about royal iconography and its possible Assyrianising or Egyptianising character."
