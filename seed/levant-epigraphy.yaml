- id: proto-sinaitic-script
  aliases: [Proto-Canaanite script, Early alphabet]
  cultures: [canaanite, egyptian]
  scope: >-
    The invention of the alphabet by Semitic speakers in contact with Egyptian writing
    in the Middle Bronze Age, seen in the inscriptions of Serabit el-Khadim (Sinai) and
    Wadi el-Ḥol (Egypt). The entry also covers its development through Proto-Canaanite
    to the linear Phoenician alphabet c. 1050. Later national scripts are treated under
    paleo-hebrew-script and aramaic-language.
  passages:
    - "Ps 119 | form | Alphabetic acrostic built on the inherited letter sequence"
    - "Lam 1 | form | Alphabetic acrostic"
    - "Exod 17:14; 24:4; 34:27-28 | setting? | Writing in the Sinai traditions; date and relevance debated"
  related: [writing-and-literacy, paleo-hebrew-script, izbet-sartah-abecedary, ahiram-sarcophagus, scribes-and-scribal-education, ugaritic-texts, egyptian-loanwords]
  wikipedia: Proto-Sinaitic script
  image: Proto-Sinaitic inscription sphinx Serabit el-Khadim British Museum
  author_notes:
    - "Explain the acrophonic principle (Egyptian signs given Semitic sound values: ʾalp, bayt, etc.) and Gardiner's 1916 decipherment of lbʿlt 'for Baalat'."
    - "Dating is debated: Middle Kingdom (c. 1850-1800, Wadi el-Ḥol; Goldwasser's miners' theory) versus later Bronze Age dates for some Serabit texts."
    - "Reject fringe claims that the Proto-Sinaitic texts are in Hebrew or mention Moses or the exodus."
    - "The Bronze Age alphabet does not establish that Mosaic-era writing as narrated in Exodus is historical. Keep the Sinai passages as narrative setting only."
  sources_to_check:
    - Hamilton, The Origins of the West Semitic Alphabet in Egyptian Scripts (2006)
    - Darnell et al., AASOR 59 (2005)
    - Sass, The Genesis of the Alphabet and Its Development in the Second Millennium B.C. (1988)
    - Goldwasser, BAR 36:2 (2010)

- id: paleo-hebrew-script
  aliases: [Old Hebrew script, Hebrew epigraphy]
  cultures: [hebrew]
  scope: >-
    The national script of Israel and Judah, derived from the Phoenician alphabet and
    distinct by the 9th to 8th centuries, and the field of Hebrew epigraphy built on it.
    The entry covers its replacement by the Aramaic-derived square script and its
    survival in Qumran manuscripts, Hasmonean and Revolt coinage, and the Samaritan
    script.
  passages:
    - "Isa 8:1 | practice | Writing on a large tablet 'in common characters' (ḥereṭ ʾĕnôš)"
    - "Job 19:23-24 | realia | Words engraved in rock with iron stylus and lead"
    - "Jer 17:1 | realia | Writing with an iron pen and diamond point"
    - "Deut 27:2-8 | practice | Law written on plastered stones"
    - "Hab 2:2 | practice | Writing the vision plainly on tablets"
    - "2Kgs 18:26 | language | 'Judean' (yĕhûdît) as the language of Jerusalem, distinct from Aramaic"
    - "Neh 13:24 | language | Children who cannot speak 'Judean'"
    - "Ezra 4:7 | language | A letter written in Aramaic script"
  related: [writing-and-literacy, proto-sinaitic-script, aramaic-language, siloam-inscription, samaritan-origins, dead-sea-scrolls, scribes-and-scribal-education, ostraca]
  wikipedia: Paleo-Hebrew alphabet
  image: Paleo-Hebrew Leviticus scroll Qumran
  author_notes:
    - "Present the main typological and palaeographic dating framework (Cross, Naveh, Rollston) and its limits. Palaeography gives ranges, not precise dates."
    - "Note the distinctive Hebrew features (e.g. the shapes of kaph and mem), the use of hieratic numerals, and the regional north/south differences."
    - "Scribes kept the old script for the divine name in some Qumran manuscripts and for whole scrolls (e.g. paleo-Leviticus). Explain the ideological uses of the script in the Hasmonean and Bar Kokhba periods."
    - "Link to the literacy debate (Rollston, Schniedewind) without overclaiming widespread literacy."
  sources_to_check:
    - Naveh, Early History of the Alphabet (1982)
    - Rollston, Writing and Literacy in the World of Ancient Israel (2010)
    - Renz and Röllig, Handbuch der althebräischen Epigraphik (1995-2003)
    - Dobbs-Allsopp et al., Hebrew Inscriptions (2005)

- id: aramaic-language
  aliases: [Biblical Aramaic, Imperial Aramaic]
  cultures: [aramean, persian]
  scope: >-
    The Aramaic language and script from the earliest Old Aramaic royal inscriptions
    through Imperial (Achaemenid) Aramaic to the Aramaic of the Second Temple period.
    The entry covers the Aramaic portions of the Hebrew Bible, Aramaic words in the New
    Testament, and the origin of the Jewish square script.
  passages:
    - "Ezra 4:8-6:18 | language | Aramaic section with official correspondence"
    - "Ezra 7:12-26 | language | Artaxerxes' rescript in Aramaic"
    - "Dan 2:4-7:28 | language | Aramaic section, beginning in 2:4b"
    - "Jer 10:11 | language | A single Aramaic verse against the idols"
    - "Gen 31:47 | language | Laban's Aramaic name Jegar-sahadutha for the cairn"
    - "2Kgs 18:26 | language | Aramaic as the language of diplomacy, unknown to ordinary Judahites"
    - "Ezra 4:7 | language | A letter written in Aramaic script and language"
    - "Mark 5:41 | language | talitha koum"
    - "Mark 15:34 | language | Eloi, Eloi, lema sabachthani"
    - "Neh 8:8 | practice? | Reading the law 'with interpretation', traditionally linked to Aramaic rendering"
  related: [arameans, elephantine-papyri, ahiqar, tel-dan-stele, sefire-treaties, tell-fekheriye-statue, paleo-hebrew-script, persia]
  wikipedia: Aramaic
  image: Aramaic papyrus Elephantine
  author_notes:
    - "Outline the standard periodisation (Old, Imperial or Official, Middle, Late) and its main corpora, e.g. Fekheriye, Sefire, Tel Dan, Elephantine, Qumran."
    - "The Aramaic of Daniel and Ezra is used in dating arguments. Present the linguistic evidence carefully, as the arguments are contested in both directions."
    - "Distinguish Aramaic language from Aramaic script. Explain the shift of Jews from the paleo-Hebrew to the square script in the Persian and Hellenistic periods."
  sources_to_check:
    - Gzella, A Cultural History of Aramaic (2015)
    - Fitzmyer, A Wandering Aramean (1979)
    - Porten and Yardeni, Textbook of Aramaic Documents from Ancient Egypt (TAD)
    - Rosenthal, A Grammar of Biblical Aramaic

- id: ugaritic-texts
  cultures: [ugaritic]
  date: [-1400, -1185]
  circa: true
  scope: >-
    The texts written in the alphabetic cuneiform script found from 1929 at Ras Shamra
    (Ugarit) and Ras Ibn Hani, including myths, epics, rituals, letters and
    administrative records of the 14th and 13th centuries. This entry covers the corpus
    and its significance for Hebrew language, poetry and religion. Individual
    compositions have their own entries.
  passages:
    - "Ps 29 | parallel | Hymn to the storm god's voice; widely compared with Baal hymnody"
    - "Ps 92:9 | parallel | 'Your enemies, O YHWH', a staircase tricolon matching KTU 1.2 IV (MT 92:10)"
    - "Isa 27:1 | parallel | Leviathan the fleeing and twisting serpent, as Lotan in the Baal Cycle"
    - "Ps 68:4 | language | 'Rider on the clouds', Baal's epithet rkb ʿrpt (MT 68:5)"
    - "Ps 82:1 | concept | God presiding in the divine council"
    - "Prov 26:23 | language | kspsgym 'like glaze', clarified by Ugaritic spsg"
    - "Ezek 14:14, 20; 28:3 | attests? | Danel the righteous; cf. Dnil in the Aqhat epic"
    - "2Sam 1:21 | language? | Emendation of 'fields of offerings' after an Ugaritic phrase"
  related: [ugarit, baal-cycle, aqhat-epic, kirta-epic, el, baal, leviathan, divine-council]
  wikipedia: Ugaritic texts
  image: Ugaritic alphabet tablet Ras Shamra
  author_notes:
    - "Explain the 30-sign alphabetic cuneiform, the abecedaries, and the multilingual archive (Akkadian, Hurrian, Hittite)."
    - "Correct the old misconception that KTU 1.23 contains 'cooking a kid in its mother's milk' (Exod 23:19). The reading has been abandoned."
    - "Warn against 'pan-Ugaritism' (e.g. Dahood's Psalms commentary). Lexical comparisons need checking case by case."
    - "Ugarit is a Late Bronze Age north Syrian city, not 'Canaanite religion' in general. The gap of several centuries before most biblical texts must be acknowledged."
  sources_to_check:
    - KTU3, Dietrich, Loretz and Sanmartín (2013)
    - COS 1.86
    - Parker (ed.), Ugaritic Narrative Poetry (SBLWAW 9, 1997)
    - Pardee, Ritual and Cult at Ugarit (SBLWAW 10, 2002)
    - Smith and Pitard, The Ugaritic Baal Cycle (1994-2009)

- id: forgeries-in-biblical-archaeology
  cultures: [hebrew, jewish]
  scope: >-
    Forged inscriptions and artefacts relating to the Bible, and the wider problem of
    unprovenanced antiquities, from the 19th-century Shapira affair to the
    Jehoash Inscription, the James Ossuary, the ivory pomegranate and the fake 'Dead Sea
    Scroll' fragments. The entry covers detection methods and the scholarly ethics of
    publishing looted or unprovenanced material.
  passages:
    - "2Kgs 12:4-16 | parallel | The forged 'Jehoash Inscription' was modelled on this temple-repair account (MT 12:5-17)"
    - "Exod 28:33-34 | realia | Pomegranates on the priestly robe; the ivory pomegranate's inscription is forged"
    - "Gal 1:19 | attests? | James the Lord's brother; the James Ossuary's 'brother of Jesus' is widely judged forged or unproven"
  related: [seals-and-bullae, bullae-of-jeremiah-era-officials, dead-sea-scrolls, ossuaries, mesha-stele, hezekiah-bulla, writing-and-literacy, caiaphas-ossuary]
  wikipedia: Archaeological forgery
  image: Jehoash Inscription
  author_notes:
    - "Cover the classic cases: Shapira's Moabite pottery (1870s) and Deuteronomy strips (1883); the ivory pomegranate (inscription judged forged, IAA 2004); the Jehoash Inscription; the James Ossuary (the 2012 trial did not authenticate it); the Moussaieff ostraca; the Museum of the Bible 'DSS' fragments (all judged modern by 2020)."
    - "Many seals and bullae that name biblical figures are unprovenanced. Recommend that the project flag provenance on every relevant entry."
    - "Explain detection methods (palaeography, patina and petrographic analysis, too-perfect biblical phrasing) and their limits. Experts also disagree about some cases."
    - "Note the recent attempt to rehabilitate the Shapira scroll (Dershowitz 2021) and the critical responses. Present the scroll as generally regarded as a forgery."
  sources_to_check:
    - Rollston, Maarav 10 (2003)
    - Rollston, Maarav 11 (2004)
    - Goren et al., IEJ 55 (2005)

- id: omri
  cultures: [israelite]
  date: [-882, -871]
  circa: true
  scope: >-
    Omri, king of Israel and founder of the Omride dynasty, considered in the light of
    extrabiblical evidence. Kings treats his reign briefly, but the Mesha Stele names
    him as the conqueror of Moab, and Assyrian scribes called Israel 'the House of Omri'
    (Bīt-Ḫumri) for over a century.
  passages:
    - "1Kgs 16:15-28 | attests | Omri's rise from army commander, civil war with Tibni, and reign"
    - "1Kgs 16:24 | setting | Omri buys the hill of Samaria and founds his capital"
    - "2Kgs 3:4-5 | event | Moab tributary to Israel, as the Mesha Stele says Omri subdued it"
    - "2Kgs 8:26 | attests | Athaliah, 'daughter' (granddaughter) of Omri, links the dynasty to Judah"
    - "Mic 6:16 | attests | 'The statutes of Omri' as a byword for apostasy"
  related: [mesha-stele, samaria, ahab, jezebel, jehu, black-obelisk, tirzah, chronology-of-kings]
  wikipedia: Omri
  image: Mesha Stele Louvre
  author_notes:
    - "Contrast the Deuteronomistic brevity (a few verses, judged evil) with Omri's international standing in Moabite and Assyrian sources."
    - "Assyrian usage of 'House of Omri' even for Jehu ('son of Omri' on the Black Obelisk) reflects how the dynastic name stood for the state, not genealogy."
    - "Discuss the archaeology of the Omride building programme (Samaria, Jezreel; possibly Megiddo and Hazor). Finkelstein's low chronology re-dates some 'Solomonic' structures to the Omrides."
    - "Regnal dates follow Tadmor/Cogan (c. 882-871). Thiele has 885-874. The overlap with Tibni (1 Kgs 16:21-23) complicates the twelve-year total."
  sources_to_check:
    - KAI 181
    - Cogan, I Kings (AB 10, 2001)

- id: ahab
  cultures: [israelite]
  date: [-873, -852]
  circa: true
  scope: >-
    Ahab son of Omri, king of Israel, considered in the light of extrabiblical evidence,
    chiefly Shalmaneser III's Kurkh Monolith. It names 'Ahab the Israelite' with 2,000
    chariots and 10,000 soldiers in the anti-Assyrian coalition at Qarqar (853). The
    Mesha Stele and the archaeology of Samaria and Jezreel are also relevant.
  passages:
    - "1Kgs 16:29-34 | attests | Ahab's accession, marriage to Jezebel and Baal temple in Samaria"
    - "1Kgs 22:39 | realia | Ahab's ivory house and the cities he built"
    - "1Kgs 22:1 | setting | Three years without war between Aram and Israel; cf. the Qarqar coalition"
    - "1Kgs 20:1-34 | event? | Wars with Ben-hadad; many think these stories once concerned later kings"
    - "1Kgs 22:1-38 | event? | Death at Ramoth-gilead; historicity and original setting debated"
    - "1Kgs 21:1-16 | setting | Naboth's vineyard beside the royal palace at Jezreel"
    - "2Kgs 3:5 | event | Mesha rebels after Ahab's death"
  related: [kurkh-monoliths, battle-of-qarqar, omri, jezebel, samaria-ivories, mesha-stele, ben-hadad, jezreel]
  wikipedia: Ahab
  image: Kurkh Monolith British Museum
  author_notes:
    - "Qarqar is unmentioned in Kings. Explain how Ahab's alliance with Hadadezer of Damascus there fits awkwardly with the 1 Kgs 20 and 22 war stories, and the proposal that these stories originally concerned Jehoahaz or Joash."
    - "The Kurkh figure of 2,000 chariots is possibly a scribal error or an exaggeration, but it is commonly taken as evidence of Israel's military weight."
    - "The Mesha Stele's 'son' of Omri may refer to Ahab or be generic. It fits uneasily with the 'after Ahab's death' timing of 2 Kgs 1:1 and 3:5."
    - "Use Samaria and Jezreel archaeology for the Omride state, and treat the narrative portrayal (Elijah cycle) as Deuteronomistic and prophetic."
  sources_to_check:
    - COS 2.113A
    - ANET 278-279
    - Grayson, RIMA 3 (1996)

- id: jezebel
  cultures: [phoenician, israelite]
  date: [-873, -841]
  circa: true
  scope: >-
    Jezebel, daughter of Ethbaal king of the Sidonians, wife of Ahab and queen mother of
    Israel, considered in the light of Phoenician history and the iconography of
    royal women. The entry includes an unprovenanced seal inscribed yzbl.
  passages:
    - "1Kgs 16:31 | attests | Daughter of Ethbaal, king of the Sidonians (Ittobaal of Tyre)"
    - "1Kgs 18:19 | setting | Prophets of Baal and Asherah eating at Jezebel's table"
    - "1Kgs 21:8 | practice | Letters written in Ahab's name and sealed with his seal"
    - "2Kgs 9:30-37 | imagery | Painted eyes and the 'woman at the window'"
    - "2Kgs 10:13 | language | gĕbîrâ 'queen mother' as a court title"
    - "Rev 2:20 | imagery | Jezebel as a type of false prophecy"
  related: [ahab, phoenicians, tyre, baal, melqart, samaria-ivories, seals-and-bullae, sidon]
  wikipedia: Jezebel
  image: Jezebel seal yzbl Israel Museum
  author_notes:
    - "Ethbaal is usually identified with Ittobaal I of Tyre, known from Menander via Josephus (Ag. Ap. 1.123). 'King of the Sidonians' was a general term for Phoenician rulers."
    - "The seal inscribed yzbl is unprovenanced (first published by Avigad, IEJ 14, 1964). Korpel (2006) argued it belonged to the queen. The reading, its royal symbols and the identification are all debated. Mark the link as uncertain."
    - "Her portrait is a polemical Deuteronomistic construct. Discuss gender, foreignness and the role of queen mothers."
    - "Which Baal Jezebel promoted (Melqart, Baal Shamem, or a generic Baal) is unresolved."
  sources_to_check:
    - Avigad and Sass, Corpus of West Semitic Stamp Seals (1997)

- id: jehu
  cultures: [israelite]
  date: [-842, -814]
  circa: true
  scope: >-
    Jehu, the army officer who overthrew the Omride dynasty, considered in the light of
    extrabiblical evidence. Shalmaneser III's Black Obelisk records the tribute of
    'Jehu of Bit-Omri' in 841. The Tel Dan Stele claims for an Aramean king the killings
    that 2 Kings attributes to Jehu.
  passages:
    - "2Kgs 9:1-10:36 | event | Jehu's anointing, coup and reign"
    - "2Kgs 9:14-28 | event | Killing of Joram and Ahaziah; cf. the Tel Dan Stele's rival claim"
    - "2Kgs 9:2, 14 | attests | Jehu son of Jehoshaphat son of Nimshi; Assyrian texts call him 'son of Omri'"
    - "1Kgs 19:16-17 | attests | Elijah commissioned to anoint Jehu"
    - "2Kgs 10:32-33 | event | Hazael's conquests in Jehu's days, after Assyria withdrew"
    - "Hos 1:4 | event | Prophetic condemnation of the bloodshed of Jezreel"
  related: [black-obelisk, tel-dan-stele, shalmaneser-iii, hazael, omri, jezebel, jezreel, samaria]
  wikipedia: Jehu
  image: Black Obelisk Jehu panel British Museum
  author_notes:
    - "The prostrating figure on the Black Obelisk is labelled as Jehu's tribute. Whether it depicts Jehu himself or an envoy is debated. It is the only contemporary image of an Israelite or Judahite king."
    - "Kings does not mention the tribute to Shalmaneser III (841). Explain the geopolitics: Jehu's submission and Hazael's resistance."
    - "Set out the options for reconciling Tel Dan with 2 Kgs 9 neutrally (see tel-dan-stele)."
    - "Hosea's condemnation contrasts with the approval in 2 Kgs 10:30. Note the tension within the biblical tradition."
  sources_to_check:
    - ANET 280-281
    - Grayson, RIMA 3 (1996)

- id: menahem
  cultures: [israelite]
  date: [-747, -737]
  circa: true
  scope: >-
    Menahem son of Gadi, king of Israel, who seized the throne in Samaria and paid
    heavy tribute to Tiglath-pileser III. He is named as 'Menahem of Samaria' in the
    Assyrian king's annals and on the Iran Stele.
  passages:
    - "2Kgs 15:14-16 | event | Menahem's seizure of power and atrocity at Tiphsah"
    - "2Kgs 15:19-20 | event | Tribute of a thousand talents to Pul, raised at fifty shekels per wealthy man"
    - "1Chr 5:26 | attests | Pul identified with Tiglath-pileser"
    - "Hos 5:13 | setting | Ephraim turns to Assyria for help"
    - "Hos 8:9-10 | setting | Ephraim hires lovers among the nations"
  related: [tiglath-pileser-iii, tiglath-pileser-iii-inscriptions, tribute-and-vassalage, samaria, rezin, pekah, assyria, chronology-of-kings]
  wikipedia: Menahem
  image: Iran Stele Tiglath-pileser III Israel Museum
  author_notes:
    - "Pul is Tiglath-pileser III's name as king of Babylon (Pulu in Babylonian sources). 1 Chr 5:26 seems to treat them as two kings."
    - "The tribute is dated to 738 (or 740) in Assyrian sources. This constrains Menahem's chronology and conflicts with some biblical reckonings (Thiele's 752-742). Explain the problem."
    - "Fifty shekels a head is close to the Assyrian price of a slave. The sum implies about 60,000 landowners, a figure discussed in socioeconomic studies."
  sources_to_check:
    - Tadmor and Yamada, RINAP 1 (2011)

- id: pekah
  cultures: [israelite]
  date: [-735, -732]
  circa: true
  scope: >-
    Pekah son of Remaliah, king of Israel, who joined Rezin of Damascus against Assyria
    and Judah in the Syro-Ephraimite war. Tiglath-pileser III claims that the
    Israelites overthrew Pekah (Paqaḫa) and that he installed Hoshea in his place.
  passages:
    - "2Kgs 15:25 | event | Pekah assassinates Pekahiah"
    - "2Kgs 15:27-31 | event | Reign, Tiglath-pileser's annexation of Galilee and Gilead, and Pekah's murder by Hoshea"
    - "2Kgs 16:5-9 | event | Rezin and Pekah besiege Jerusalem; Ahaz appeals to Assyria"
    - "Isa 7:1-9 | event | Isaiah's oracle against the 'two smouldering stumps', Rezin and the son of Remaliah"
    - "2Chr 28:5-8 | event | The Chronicler's account of Pekah's victory over Judah"
  related: [tiglath-pileser-iii-inscriptions, tiglath-pileser-iii, rezin, ahaz, hoshea, menahem, damascus, chronology-of-kings]
  wikipedia: Pekah
  image: Tiglath-pileser III relief British Museum
  author_notes:
    - "The twenty-year reign in 2 Kgs 15:27 cannot fit the Assyrian synchronisms. Explain the proposals (rival kingdom in Gilead from c. 750, scribal error) and choose none."
    - "Tiglath-pileser's summary inscriptions describe the deportations from Galilee (cf. 2 Kgs 15:29) and the change of king."
    - "Isaiah's refusal to name Pekah ('son of Remaliah') may be contemptuous. This is a common reading."
  sources_to_check:
    - Tadmor and Yamada, RINAP 1 (2011)

- id: hoshea
  cultures: [israelite]
  date: [-732, -724]
  circa: true
  scope: >-
    Hoshea son of Elah, last king of Israel, placed on the throne under Assyrian
    patronage after Pekah's overthrow. He later withheld tribute from Shalmaneser V,
    sought help from Egypt, and was imprisoned before the fall of Samaria.
  passages:
    - "2Kgs 15:30 | event | Hoshea kills Pekah; Tiglath-pileser claims to have installed him"
    - "2Kgs 17:1-6 | event | Vassalage, revolt, appeal to 'So, king of Egypt', imprisonment and siege"
    - "2Kgs 17:4 | attests? | 'So' king of Egypt; identity (Osorkon IV, or the city of Sais) debated"
    - "2Kgs 18:9-11 | event | Siege and capture of Samaria"
    - "Hos 7:11 | setting | Ephraim calling to Egypt and going to Assyria"
    - "Hos 12:1 | setting | Treaty with Assyria while oil is carried to Egypt (MT 12:2)"
  related: [shalmaneser-v, fall-of-samaria, tiglath-pileser-iii-inscriptions, sargon-ii-inscriptions, pekah, samaria, deportation, tribute-and-vassalage]
  wikipedia: Hoshea
  image: null
  author_notes:
    - "Tiglath-pileser III records receiving Hoshea's tribute. Hoshea's capture (c. 724) preceded the fall of Samaria, so the kingdom fell without a king."
    - "Whether Shalmaneser V or Sargon II took Samaria (722 or 720) bears on 2 Kgs 17:6. See fall-of-samaria."
    - "Identify 'So' cautiously. The main proposals are Osorkon IV, a reading of Sais as a place name, and Tefnakht."
  sources_to_check:
    - Tadmor and Yamada, RINAP 1 (2011)
    - Cogan and Tadmor, II Kings (AB 11, 1988)

- id: ahaz
  cultures: [judahite]
  date: [-743, -727]
  circa: true
  scope: >-
    Ahaz (Jehoahaz) son of Jotham, king of Judah, who submitted to Tiglath-pileser III
    during the Syro-Ephraimite war. He appears in Assyrian tribute lists as Jehoahaz
    (Iauḫazi) of Judah and on seal impressions, including his son Hezekiah's bulla.
  passages:
    - "2Kgs 16:5-9 | event | Syro-Ephraimite siege; Ahaz declares himself Assyria's 'servant and son' and sends tribute"
    - "2Kgs 16:10-18 | practice | Altar copied from Damascus and temple changes 'because of the king of Assyria'"
    - "2Kgs 16:3 | practice? | Ahaz 'made his son pass through fire'"
    - "Isa 7:1-17 | event | Isaiah confronts Ahaz; the Immanuel sign"
    - "2Chr 28:16-21 | event | Appeal to Assyria; Edomite and Philistine raids"
    - "Isa 14:28 | setting | Oracle dated to the year Ahaz died"
  related: [tiglath-pileser-iii-inscriptions, tiglath-pileser-iii, rezin, pekah, hezekiah-bulla, tribute-and-vassalage, child-sacrifice, damascus]
  wikipedia: Ahaz
  image: Hezekiah bulla Ophel
  author_notes:
    - "The Assyrian form Iauḫazi shows that his full name was Jehoahaz. The theophoric element may have been dropped in the biblical tradition."
    - "His chronology is notoriously difficult: 16 years (2 Kgs 16:2) and the synchronisms with Hezekiah conflict. Tadmor/Cogan has c. 743-727 including a co-regency; others have 735-715."
    - "The altar episode is no longer read as forced Assyrian religion. Most now see it as voluntary cultural emulation."
    - "Unprovenanced bullae of 'Ahaz son of Jotham, king of Judah' exist. Present the Ophel Hezekiah bulla (which names Ahaz) as the excavated witness."
  sources_to_check:
    - Tadmor and Yamada, RINAP 1 (2011)

- id: hezekiah
  cultures: [judahite]
  date: [-727, -698]
  circa: true
  scope: >-
    Hezekiah son of Ahaz, king of Judah, considered in the light of extrabiblical
