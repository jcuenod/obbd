  related: [passover-origins, amulets, lamassu, demons, lamashtu-pazuzu-amulets, apkallu-reliefs, city-gates]
  wikipedia: Mezuzah
  image: Lamassu gateway Khorsabad
  author_notes:
    - "In Mesopotamia, protective figurines (apkallu, fish-men and others) were buried beneath thresholds, and lamassu guarded gates. F. A. M. Wiggermann, Mesopotamian Protective Spirits: The Ritual Texts (1992), is the standard study."
    - "The rābiṣu 'lurker' demon is an attractive background for Gen 4:7 but is not certain. Mark it as a proposal."
    - "The theory that pesaḥ grew from an apotropaic nomadic blood rite (Rost and others) is widespread but unprovable. Link to the passover-origins entry."
    - "Treat the inscribed mezuzah (Qumran examples) as a later literalizing development."

