- id: magic-and-sorcery
  aliases: [magic, sorcery, incantation, witchcraft, kĕšāpîm]
  cultures: [ane, mesopotamian, egyptian, hebrew]
  scope: >-
    A hub entry on ritual means of protecting, healing or harming by spells, objects and
    rites: Mesopotamian āšipūtu, Egyptian heka, Hittite ritual, the Hebrew vocabulary of
    sorcery and charming, healing and wonder-working accepted in biblical texts, and magic in
    the New Testament world. Witchcraft rituals (Maqlû), divination and the Egyptian
    loanword ḥarṭom have their own entries.
  passages:
    - "Exod 7:11, 22; 8:7, 18-19 | practice | Egypt's ḥarṭummîm imitate Aaron's signs by 'secret arts' until they fail (MT 8:3, 14-15)"
    - "Exod 22:18 | practice | 'You shall not permit a female sorcerer to live' (MT 22:17)"
    - "Deut 18:10-12 | practice | Sorcerer (mĕkaššēp) and charmer (ḥōbēr ḥeber) among forbidden practitioners"
    - "Isa 47:9-13 | polemic | Babylon's many sorceries and enchantments cannot save her"
    - "Ezek 13:17-23 | practice? | Women sew bands and veils to 'hunt lives'"
    - "Num 5:11-31 | practice | Written curses washed into water and drunk by the suspected wife"
    - "Ps 58:4-5 | practice | Snake-charming: the deaf adder that will not hear the charmer (MT 58:5-6)"
    - "2Kgs 2:19-22; 4:38-41; 6:1-7 | practice? | Elisha's wonders using salt, flour and a stick; classification as 'magic' debated"
    - "Acts 8:9-24 | practice | Simon 'practised magic' in Samaria and tries to buy the Spirit"
    - "Acts 19:13-20 | practice | Exorcists use Jesus' name; magic books worth fifty thousand silver coins burned at Ephesus"
  related: [maqlu, shurpu, divination, demons, amulets, egyptian-loanwords, medicine-and-healing, necromancy]
  wikipedia: null
  image: Egyptian apotropaic wand
  author_notes:
    - "'Magic' is a modern etic category. Avoid the old magic-versus-religion dichotomy (Frazer). In Mesopotamia the exorcist's craft (āšipūtu) was legitimate temple scholarship, and only harmful sorcery (kišpū) was condemned. In Egypt heka was a divine power used by priests, especially the lector priest."
    - Biblical texts reject practices mainly by agent and source (Deut 18) and approve comparable acts by prophets (Elisha; the bronze serpent, Num 21:8-9). Explain this logic instead of labelling Israelite religion as anti-magical.
    - "Several Hebrew terms (kšp, ḥbr, lḥš, ʿnn, lāṭ/lahaṭ 'secret arts') have uncertain exact meanings. Give cautious glosses. The obscure kĕsātôt and mispāḥôt of Ezek 13:18 are debated."
    - The KJV rendering 'witch' in Exod 22:18 and its role in early modern witch trials is reception history. Do not let it shape the description of the ancient practice.
    - "Include material evidence: the Ketef Hinnom amulets, Egyptian amulets and apotropaic wands, Mesopotamian figurines and incantation texts, and later Aramaic incantation bowls (as reception only)."
  sources_to_check:
    - "A. Jeffers, Magic and Divination in Ancient Palestine and Syria (SHANE 8, 1996)"
    - "R. Schmitt, Magie im Alten Testament (AOAT 313, 2004)"
    - "R. K. Ritner, The Mechanics of Ancient Egyptian Magical Practice (SAOC 54, 1993)"
    - D. Schwemer, Abwehrzauber und Behexung (2007)

- id: fasting
  aliases: [ṣôm, self-affliction, penitential rites]
  cultures: [hebrew, jewish]
  scope: >-
    Abstaining from food and drink as a ritual of mourning, petition, penitence and
    preparation in ancient Israel and early Judaism, usually combined with sackcloth, ashes,
    weeping and prayer. It covers individual and communal fasts in crisis, the
    self-affliction of the Day of Atonement, the commemorative fasts for Jerusalem's fall,
    and fasting in the New Testament. General mourning gestures belong to mourning-rites.
  passages:
    - "Lev 16:29-31 | practice | 'Afflict yourselves' (ʿinnâ nepeš) on the Day of Atonement, later understood as fasting; cf. 23:27-32"
    - "Judg 20:26 | practice | Israel weeps and fasts until evening at Bethel before renewed battle"
    - "1Sam 7:6 | practice | Water poured out, fasting and confession at Mizpah"
    - "1Sam 31:13 | practice | Men of Jabesh fast seven days after burying Saul"
    - "2Sam 12:16-23 | practice | David fasts while his child is ill and stops when it dies"
    - "1Kgs 21:27-29 | practice | Ahab fasts in sackcloth and the disaster is postponed"
    - "Joel 2:12-17 | practice | Sanctify a fast and call a solemn assembly in national crisis"
    - "Jonah 3:5-9 | practice | Ninevites, human and animal, fast in sackcloth by royal decree"
    - "Isa 58:3-7 | concept | Prophetic critique: the true fast is to loose the bonds of injustice"
    - "Zech 7:3-5; 8:19 | practice | Fasts of the fourth, fifth, seventh and tenth months commemorating Jerusalem's fall"
    - "Esth 4:16 | practice | Three-day fast before Esther approaches the king"
    - "Matt 6:16-18 | practice | Fast in secret, not with disfigured faces"
  related: [mourning-rites, day-of-atonement-elimination, mesopotamian-lament-prayers, city-laments, fall-of-jerusalem-587, prayer-postures, jewish-sects]
  wikipedia: null
  image: null
  author_notes:
    - "Distinguish the functions: mourning (1 Sam 31:13), petition in crisis (2 Sam 12; Joel 2), penitence (1 Sam 7:6; Jonah 3), and preparation for revelation (Dan 9:3; 10:2-3). D. A. Lambert (2016) argues that biblical fasting is a ritual of distress and appeal rather than an expression of inner 'repentance'; note this challenge to the traditional reading."
    - "Comparative evidence for communal fasting is thinner outside Israel than for mourning rites. Present it cautiously: Herodotus 2.40 (Egyptians fast before an Isis festival), Herodotus 9.24 (Persians extend mourning to horses and pack animals, often cited for Jonah 3:7-8), and Mesopotamian ritual and hemerological food restrictions."
    - "'Afflict yourselves' in Lev 16 and 23 is not explicitly fasting. The rabbinic definition (m. Yoma 8:1) adds abstention from washing, anointing, sandals and sex. Keep the ancient text and its later interpretation distinct."
    - "Note late Second Temple practice: regular weekly fasts (Luke 18:12; Didache 8:1 contrasts Jewish and Christian fast days) and Mark 2:18-20."
  sources_to_check:
    - "D. A. Lambert, How Repentance Became Biblical (2016)"
    - "T. Podella, Ṣôm-Fasten: Kollektive Trauer um den verborgenen Gott im Alten Testament (AOAT 224, 1989)"
    - G. A. Anderson, A Time to Mourn, a Time to Dance (1991)
