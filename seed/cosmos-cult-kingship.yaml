- id: ain-dara-temple
  aliases: [ʿAin Dara, Ain Dara temple]
  cultures: [luwian, aramean]
  date: [-1300, -740]
  circa: true
  scope: >-
    A Syro-Hittite temple in the ʿAfrin valley of northwestern Syria, built and rebuilt from
    about the 13th to the 8th century BCE. Its tripartite plan with a two-columned portico, its
    surrounding gallery, its lion and sphinx orthostats and its giant carved footprints make
    it the closest known parallel to the plan and decoration of Solomon's temple.
  passages:
    - "1Kgs 6:2-3 | realia | Tripartite long-room plan with an entrance porch"
    - "1Kgs 6:5-10 | realia | Side chambers around the house; cf. the gallery added around ʿAin Dara's temple"
    - "1Kgs 7:21 | realia | Two pillars at the porch; ʿAin Dara's portico had two columns"
    - "1Kgs 6:29, 32 | realia | Carved cherubim, palms and flowers; cf. the sphinx and lion orthostats"
    - "Ezek 43:7 | concept | The temple as 'the place of the soles of my feet'; cf. the carved divine footprints"
    - "Isa 60:13 | concept | 'I will glorify where my feet rest': the sanctuary as the place of the divine feet"
    - "Ezek 41:5-11 | realia | Side chambers around Ezekiel's visionary temple"
  related: [solomons-temple, tell-tayinat, jachin-and-boaz, cherubim, lion-imagery, footstool, temple-as-cosmos]
  wikipedia: Ain Dara (archaeological site)
  image: Ain Dara temple footprints
  author_notes:
    - "Excavated by Ali Abou Assaf (1980s). He proposed three phases (about 1300-1000, 1000-900 and 900-740 BCE); later work has questioned parts of this chronology. Give the dating as approximate."
    - The patron deity is unknown; Ishtar (Šaušga) and a storm god have both been proposed.
    - "The footprints, each about a metre long, are carved in the thresholds: a pair at the entrance, then a single left and a single right foot further in, as if the deity strode into the cella. Monson and others connect them with biblical language of the divine feet in the temple (Ezek 43:7). Present this as illustrative, not as evidence for Israelite practice."
    - The surrounding gallery is not the same as the storeyed side chambers of 1 Kgs 6:5-10. Note similarities and differences honestly.
    - The temple was badly damaged by Turkish air strikes in January 2018 and sculptures were later looted. Describe its current condition.
  sources_to_check:
