    The dedication to the deity of the first produce of the harvest and the
    firstborn of humans and animals, with provisions for redemption and
    substitution. The entry covers the biblical laws and rituals, their ancient
    Near Eastern analogues, and the debate over child sacrifice.
  passages:
    - "Exod 13:1-2, 11-16 | practice | Consecration of the firstborn; redemption of sons and donkeys; Passover rationale"
    - "Exod 22:29-30 | practice | 'The firstborn of your sons you shall give to me' (MT 22:28-29)"
    - "Exod 23:19 | practice | Best of the firstfruits brought to the house of YHWH"
    - "Exod 34:19-20, 26 | practice | Firstborn redeemed; firstfruits brought"
    - "Lev 23:9-14 | practice | First sheaf (ʿōmer) waved before YHWH"
    - "Num 3:11-13, 40-51 | practice | Levites substituted for Israel's firstborn; redemption money"
    - "Num 18:12-18 | practice | Firstfruits and firstborn belong to the priests"
    - "Deut 26:1-11 | practice | Basket of firstfruits and the 'wandering Aramean' recital"
    - "Ezek 20:25-26 | concept? | 'Statutes that were not good': offering the firstborn; tie to child sacrifice debated"
    - "Luke 2:22-24 | practice | Jesus presented as firstborn at the temple"
  related: [child-sacrifice, tithes, festivals-agricultural, passover-origins, inheritance-and-birthright, sacrifice]
  wikipedia: First fruits
  image: null
  author_notes:
    - "Offering first produce and firstlings to the gods is widespread in the ancient Near East and the Mediterranean, so the practice itself is unremarkable."
    - "Whether Exod 22:29 once required the sacrifice of firstborn sons is debated (J. D. Levenson, The Death and Resurrection of the Beloved Son, 1993; versus readings that assume redemption was always intended). Present this neutrally and connect it to Ezek 20:25-26."
    - "Deut 26:5-9 was von Rad's 'small historical credo'. Note that its early dating has been widely abandoned."

- id: purity-and-impurity
  aliases: [Ritual purity, Tumah and taharah]
  cultures: [ane, hittite, babylonian, egyptian]
  scope: >-
    Concepts and rites of ritual purity and impurity in the Hebrew Bible
    (bodily, corpse, animal and sanctuary impurity, and moral impurity), compared
    with Hittite, Mesopotamian and Egyptian purity rules for temples and personnel.
    Food laws, the Day of Atonement and Second Temple purity installations have
    their own entries.
  passages:
    - "Lev 10:10 | concept | Priests distinguish holy from common, unclean from clean"
    - "Lev 11-15 | practice | Impurity from animals, childbirth, skin disease and genital discharges"
    - "Num 19 | practice | Corpse impurity and the red heifer's ash-water"
    - "Num 5:1-4 | practice | Removing the impure from the camp"
    - "Lev 16:16, 19 | concept | The sanctuary cleansed of Israel's impurities"
    - "Lev 18:24-28 | concept | Moral impurity defiles the land, which vomits out its inhabitants"
    - "Hag 2:10-14 | practice | Priestly ruling on the transmission of holiness and impurity"
    - "Ezek 44:23 | practice | Priests teach the difference between clean and unclean"
    - "Isa 6:5-7 | imagery | Unclean lips purified with a coal from the altar"
    - "Ps 51:7 | imagery | 'Purge me with hyssop' (MT 51:9)"
    - "Mark 7:1-23 | practice | Dispute over hand-washing and purity"
  related: [day-of-atonement-elimination, hittite-instructions-temple-officials, pig-avoidance, stone-vessels-and-mikvaot, nazirite-vow, mourning-rites, sacrifice, maqlu]
  wikipedia: Tumah and taharah
  image: null
  author_notes:
    - "Present the main models: Mary Douglas (Purity and Danger, 1966) on classification; J. Milgrom on impurity polluting the sanctuary and on death and life symbolism; J. Klawans (Impurity and Sin in Ancient Judaism, 2000) on ritual versus moral impurity."
    - "Comparanda include the Hittite Instructions for Priests and Temple Officials (CTH 264), Mesopotamian priestly purity and ikkibu taboos, and Egyptian wab-priest purity."
    - "Correct the common misconception that the impurity laws are hygienic or medical. Impurity is not sin and is often unavoidable."
  sources_to_check:
    - "CTH 264 (Instructions for Priests and Temple Officials)"

- id: pig-avoidance
  aliases: [Pork taboo, Dietary laws, Kashrut origins]
  cultures: [hebrew, philistine, egyptian]
  scope: >-
    The biblical prohibition of pork within the wider dietary laws, and the
    zooarchaeological evidence for pig consumption and avoidance in the Iron Age
    southern Levant. The entry covers the use of pork avoidance as an ethnic marker
    and as a test of loyalty in the Hellenistic period.
  passages:
    - "Lev 11:1-47 | practice | Clean and unclean animals"
    - "Lev 11:7 | practice | Pig unclean: divided hoof but does not chew the cud"
    - "Deut 14:3-21 | practice | Dietary laws (Deuteronomic version)"
    - "Deut 14:8 | practice | Pig prohibited"
    - "Isa 65:4 | practice | Eating swine's flesh alongside sitting in tombs"
    - "Isa 66:3, 17 | practice | Swine's blood offering; eating pig and mice in garden rites"
    - "1Macc 1:47 | practice | Antiochus IV orders the sacrifice of swine"
    - "2Macc 6:18-31 | practice | Eleazar dies rather than eat pork"
    - "Mark 5:11-13 | setting | Herd of swine in Gentile territory"
    - "Acts 10:9-16 | practice | Peter's vision abolishing food distinctions"
  related: [purity-and-impurity, ethnicity-and-material-culture, philistines, emergence-of-israel, antiochus-iv, maccabean-revolt, kid-in-mothers-milk]
  wikipedia: Religious restrictions on the consumption of pork
  image: null
  author_notes:
    - "Pig bones are rare at Iron I highland sites but common at Philistine coastal sites. Some (e.g. Finkelstein; Hesse and Wapnish) read this as an ethnic marker. Caution is needed: ecology, economy and regional patterns also matter, and pigs appear at some Iron II Israelite sites (Sapir-Hen et al.)."
    - "Pigs had ambivalent or low status elsewhere in the ancient Near East (Egypt, Mesopotamia, Hittite ritual), so Israelite avoidance was not unique."
    - "Survey the explanations (Douglas on classification, M. Harris on ecology, Milgrom on ethics). Reject the trichinosis or hygiene explanation."

- id: kid-in-mothers-milk
  aliases: [Milk and meat, Kid in its mother's milk]
  cultures: [hebrew, ugaritic]
  scope: >-
    The thrice-repeated prohibition 'You shall not boil a kid in its mother's
    milk', its contexts and proposed rationales, and the history of the claim that
    it targeted a Canaanite rite known from Ugarit. Later rabbinic separation of
    meat and dairy is mentioned only as reception.
  passages:
    - "Exod 23:19 | practice | Prohibition appended to the festival and firstfruits law"
    - "Exod 34:26 | practice | Repeated in the 'ritual decalogue'"
    - "Deut 14:21 | practice | Placed among dietary laws after the rule on carcasses"
    - "Lev 22:28 | concept | Comparable law: not slaughtering an animal and its young on one day"
    - "Deut 22:6-7 | concept | Comparable law: sparing the mother bird"
  related: [shahar-and-shalim, ugaritic-texts, pig-avoidance, purity-and-impurity, festivals-agricultural, firstfruits-and-firstborn]
  wikipedia: Milk and meat in Jewish law
  image: null
  author_notes:
    - "Correct the widespread misconception. H. L. Ginsberg's restoration of KTU 1.23:14 as 'cook a kid in milk' depends on restored and misread signs and was refuted by R. Ratner and B. Zuckerman, 'A Kid in Milk?' (HUCA 57, 1986). There is no Ugaritic evidence for such a rite."
    - "Other rationales: humanitarian or ethical (Philo; compare Lev 22:28; Deut 22:6-7), Milgrom's life–death symbolism, Keel's mother-and-suckling iconography (Das Böcklein in der Milch seiner Mutter, 1980), and Maimonides' 'idolatrous practice' guess."
    - "The rabbinic extension to all meat and dairy is a later development and should be described as reception."

- id: mourning-rites
  aliases: [Mourning customs, Lament]
  cultures: [ane, ugaritic]
  scope: >-
    Mourning practices in the Hebrew Bible: tearing garments, sackcloth, dust and
    ashes, shaving, gashing, fasting, lament and professional keening women. These
    are compared with Ugaritic and other ancient Near Eastern evidence. The entry
    includes the Pentateuchal prohibitions of some rites.
  passages:
    - "Gen 37:34 | practice | Jacob tears his garments, wears sackcloth, mourns many days"
    - "Gen 50:10 | practice | Seven days of mourning for Jacob"
    - "2Sam 1:11-12 | practice | Tearing clothes, weeping and fasting until evening"
    - "2Sam 3:31-35 | practice | Sackcloth, following the bier, lament and fasting for Abner"
    - "Lev 19:27-28 | practice | Prohibition of trimming the beard and gashing for the dead"
    - "Deut 14:1 | practice | No gashing or shaving the forehead for the dead"
    - "Jer 16:6-7 | practice | Gashing, shaving, bread of mourning and cup of consolation assumed as normal"
    - "Jer 41:5 | practice | Pilgrims with shaved beards, torn clothes and gashed bodies"
    - "Jer 9:17-20 | practice | Professional keening women (MT 9:16-19)"
    - "Isa 15:2-3 | practice | Moab's mourning: baldness, shaved beards, sackcloth"
    - "Ezek 24:15-24 | practice | Ezekiel forbidden the customary mourning rites"
    - "Job 2:12-13 | practice | Torn robes, dust on heads, sitting seven days in silence"
    - "Amos 8:10 | practice | Sackcloth, baldness, mourning as for an only son"
  related: [care-for-the-dead, baal-cycle, ahiram-sarcophagus, marzeah, sheol-and-the-netherworld, bench-tombs, city-laments]
  wikipedia: Mourning
  image: Ahiram sarcophagus mourning women
  author_notes:
    - "El's mourning for Baal (KTU 1.5 vi 11-25) is a close parallel: he descends from the throne, sits in the dust, puts on sackcloth, and gashes cheeks, chin and arms. Anat mourns in the same way."
    - "The prohibitions in Lev 19:27-28 and Deut 14:1 contrast with Jeremiah's assumption that these rites are normal (Jer 16:6; 41:5). They are best explained as later boundary-drawing, not as bans on originally foreign customs."
    - "Use S. M. Olyan, Biblical Mourning: Ritual and Social Dimensions (2004), for the social functions of mourning, including non-death mourning such as petition and penitence."
    - "Iconography: the mourning women on the Ahiram sarcophagus (hands on heads, bared breasts)."
  sources_to_check:
    - "KTU 1.5 vi 11-25"
    - "COS 1.86 (Baal Myth)"

- id: care-for-the-dead
  aliases: [Cult of the dead, Ancestor veneration, Kispu]
  cultures: [ane, ugaritic, babylonian, aramean]
  scope: >-
    Practices of feeding, commemorating, invoking and consulting dead kin and
    ancestors in Israel and its neighbours: Mesopotamian kispu, Ugaritic royal
    ancestor rites, and the Katumuwa stele. The entry covers the debate over how
    widespread such practices were in Israel and Judah.
  passages:
    - "Deut 26:14 | practice | Tithe declaration: 'I have not offered any of it to the dead'"
    - "Ps 106:28 | practice | Eating 'sacrifices of the dead' at Baal Peor"
    - "Gen 35:20 | practice | Jacob sets up a pillar on Rachel's grave"
    - "2Sam 18:18 | practice | Absalom's pillar: no son 'to keep my name in remembrance'"
    - "1Sam 28:13-15 | concept | The dead Samuel as an ʾĕlōhîm rising from the earth"
    - "Isa 8:19-20 | practice | Consulting the dead on behalf of the living"
    - "Isa 57:6-8 | practice? | Offerings among the 'smooth stones of the wadi'; mortuary reading debated"
    - "Isa 65:4 | practice | Sitting in tombs and spending nights in secret places"
    - "Jer 16:5 | practice | The 'house of mourning' (bêt marzēaḥ)"
    - "Tob 4:17 | practice | 'Place your bread on the grave of the righteous'"
    - "Sir 30:18 | polemic | Food set on a grave compared to offerings before an idol"
  related: [necromancy, rephaim, marzeah, katumuwa-stele, aqhat-epic, teraphim, bench-tombs, sheol-and-the-netherworld]
  wikipedia: Veneration of the dead
  image: Katumuwa stele
  author_notes:
    - "Mesopotamian kispu (regular food and water offerings and invocation of the name, with a pāqidu caretaker) and the Ugaritic duties of the ideal son (KTU 1.17 i 26-34, including setting up a stele for the ancestral god) are central comparanda."
    - "The Katumuwa stele (Zincirli, c. 735 BCE) speaks of the dead man's 'soul' (nbš) in the stele and of annual offerings."
    - "Present the range of views: maximalists such as E. Bloch-Smith and T. J. Lewis see an established cult of the dead in Judah; B. B. Schmidt (Israel's Beneficent Dead, 1994) argues for a late, limited one. Distinguish feeding and commemoration from worship."
    - "The identification of the teraphim as ancestor figurines (K. van der Toorn) is one hypothesis among several."
  sources_to_check:
    - "KTU 1.17 i 26-34 (duties of the son)"
    - "KTU 1.161 (Ugaritic royal funerary ritual)"

- id: sheol-and-the-netherworld
