    Sheol, the shadowy realm of the dead in the Hebrew Bible, set against
    Mesopotamian and Ugaritic conceptions of the netherworld and of Death as a
    devouring power. Later ideas of resurrection and afterlife judgment are covered
    in a separate entry.
  passages:
    - "Gen 37:35 | concept | Jacob will go down to Sheol mourning"
    - "Num 16:30-33 | concept | Korah's company goes down alive into Sheol"
    - "1Sam 2:6 | concept | YHWH brings down to Sheol and raises up"
    - "Job 10:21-22 | concept | Land of gloom and deep darkness"
    - "Job 17:13-16 | concept | Sheol as house; the Pit as father, the worm as mother"
    - "Ps 6:5 | concept | No remembrance or praise of God in Sheol (MT 6:6)"
    - "Ps 88:3-12 | concept | The Pit, the shades (rĕpāʾîm), Abaddon, land of forgetfulness (MT 88:4-13)"
    - "Isa 5:14 | imagery | Sheol opens its throat wide, like Mot's devouring mouth"
    - "Isa 14:9-20 | concept | Shades rise to greet the fallen king of Babylon"
    - "Isa 25:8 | imagery | YHWH swallows up Death forever, reversing Mot's swallowing"
    - "Ezek 32:17-32 | concept | Nations' dead lying in the Pit, grouped by manner of death"
    - "Jonah 2:2-6 | imagery | Belly of Sheol; the bars of the earth (MT 2:3-7)"
  related: [descent-of-inanna-ishtar, mot, rephaim, afterlife-and-resurrection, care-for-the-dead, gilgamesh-epic, necromancy]
  wikipedia: Sheol
  image: null
  author_notes:
    - "Mesopotamian comparanda include the 'land of no return' with dust as food (Descent of Ishtar; Gilgamesh VII and XII). Mot's insatiable appetite in the Baal Cycle is the background to Isa 5:14, Hab 2:5 and Isa 25:8."
    - "Sheol is not hell. It is the common destination of all, though Ezek 32 shows some differentiation by manner of death and burial."
    - "The etymology of šĕʾôl is uncertain. Older Akkadian derivations (*šuʾālu) are no longer accepted."
    - "Trace the tension between Sheol as cut off from YHWH (Ps 6:5; 88) and YHWH's reach into it (Ps 139:8; Amos 9:2)."

- id: bench-tombs
