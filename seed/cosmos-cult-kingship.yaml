    - "1Sam 5:4-5 | practice | Dagon's priests do not tread on the threshold at Ashdod"
    - "Zeph 1:9 | practice | Punishing 'all who leap over the threshold'"
    - "Isa 57:8 | practice? | A 'memorial' (zikkārôn) set behind door and doorpost"
    - "Ezek 45:19 | practice | Blood on temple doorposts and gate posts at the new year"
