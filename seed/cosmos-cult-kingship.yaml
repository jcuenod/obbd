    - "Judg 17:7-13 | practice | Micah hires a wandering Levite as household priest"
    - "1Sam 2:12-17 | practice | Eli's sons seize meat before the fat is burned"
    - "2Sam 8:17-18 | practice | Zadok and Ahimelech as royal priests; David's sons also priests"
    - "Ezek 44:10-31 | practice | Levites demoted to temple service; Zadokites alone at the altar, with dress and purity rules"
  related: [hittite-instructions-temple-officials, care-and-feeding-of-the-gods, sacrifice, purity-and-impurity, tithes, urim-and-thummim, ephod, solomons-temple]
  wikipedia: null
  image: null
  author_notes:
    - "Explain the source-critical debate. Wellhausen held that the Levites were former priests of local shrines demoted after Josiah's centralization (2 Kgs 23:8-9; Ezek 44). D's 'Levitical priests' and P's distinction between Aaronide priests and Levites reflect different stages or circles. Note the continuing debate (Cody; Leuchter and Hutton)."
    - "Comparative points: Mesopotamian temples had many specialist offices (šangû, ērib bīti 'temple-enterer', kalû lamentation priest, āšipu exorcist), and Neo-Babylonian priests held rotating prebends (Waerzeggers). Egyptian priests (ḥm-nṯr 'god's servant', wʿb 'pure one') served in rotating phyles and shaved their bodies, whereas Israelite priests were forbidden certain kinds of shaving (Lev 21:5; Ezek 44:20). Both wore linen (Ezek 44:17-18)."
    - The Hittite Instructions for Temple Officials are the closest comparandum for guard duty, purity before handling offerings and penalties for misappropriation (Milgrom).
    - Women held priestly offices in Mesopotamia (entu, nadītu) and Egypt, but not in the biblical priesthood. Say this without speculation.
  sources_to_check:
    - "A. Cody, A History of Old Testament Priesthood (AnBib 35, 1969)"
    - M. Haran, Temples and Temple-Service in Ancient Israel (1978)
    - "M. Leuchter and J. M. Hutton, eds., Levites and Priests in Biblical History and Tradition (AIL 9, 2011)"
    - "C. Waerzeggers, The Ezida Temple of Borsippa: Priesthood, Cult, Archives (Achaemenid History 15, 2010)"
    - "A. Taggar-Cohen, Hittite Priesthood (THeth 26, 2006)"

- id: divine-glory-and-melammu
  aliases: [kābôd, melammu, puluḫtu, divine radiance, glory of YHWH]
  cultures: [hebrew, assyrian, babylonian]
  scope: >-
    Divine and royal radiance in Mesopotamia (Akkadian melammu, paired with puluḫtu "awe")
    and the Hebrew Bible's kābôd ("glory") and hôd wĕhādār ("splendour and majesty"),
    including the glory-cloud of the Priestly texts and Ezekiel and the shining face of
    Moses. The departure and return of the glory are treated under divine-abandonment, and
    divine favour as a shining face under light-of-the-face.
  passages:
    - "Exod 24:15-18 | concept | The glory settles on Sinai as cloud and devouring fire"
    - "Exod 33:18-23 | concept | Moses asks to see the glory and sees only God's back"
    - "Exod 34:29-35 | imagery | The skin of Moses' face 'shone' (qāran); cf. the Vulgate's 'horned'"
    - "Exod 40:34-35 | concept | Cloud covers the tent and the glory fills the tabernacle"
    - "1Kgs 8:10-11 | concept | Priests cannot minister because the glory fills the temple"
    - "Ezek 1:26-28 | concept | Radiance around the enthroned figure: 'the likeness of the glory of YHWH'"
    - "Isa 2:10, 19, 21 | imagery | Hiding from the terror of YHWH and the splendour of his majesty; cf. puluḫtu and melammu"
    - "Ps 104:1-2 | imagery | Clothed in honour and majesty, wrapped in light as a garment"
    - "Hab 3:3-4 | imagery | His splendour covers the heavens; rays flash from his hand"
    - "Ps 21:5 | imagery | Splendour and majesty bestowed on the king (MT 21:6)"
    - "Dan 4:36 | imagery | Nebuchadnezzar's majesty and splendour restored with his kingdom (MT 4:33)"
  related: [light-of-the-face, ezekiel-throne-chariot, name-theology, tabernacle, divine-abandonment, royal-ideology, sennacherib-annals, cloud-rider]
  wikipedia: null
  image: null
  author_notes:
    - "Explain melammu as a visible, fearsome aura of gods, temples, monsters and kings, sometimes described as a garment or crown that can be removed (Humbaba's auras in Gilgamesh). Assyrian annals say the king's or Aššur's melammu 'overwhelmed' enemies (e.g. Sennacherib on Luli of Sidon). Oppenheim (1943) and Cassin (1968) are the classic studies."
    - "Hebrew kābôd develops from 'weight, honour' to the visible manifestation of the deity. The Priestly and Ezekielian kābôd theology is often contrasted with Deuteronomistic name theology (von Rad; Mettinger). That contrast is itself debated, so present it with care."
    - "Aster (2012) argues that Isaiah (e.g. Isa 2:10-21) adapts Assyrian melammu language polemically. Treat it as a strong but discussed proposal."
    - "Correct the 'horned Moses' misconception. The Vulgate's cornuta (Exod 34:29) renders qāran, which most take as 'shone' (from qeren 'ray'). A minority (e.g. Propp) argue for a real horn-like disfigurement."
  sources_to_check:
    - "A. L. Oppenheim, 'Akkadian pul(u)ḫ(t)u and melammu,' JAOS 63 (1943)"
    - E. Cassin, La splendeur divine (1968)
    - "T. N. D. Mettinger, The Dethronement of Sabaoth (ConBOT 18, 1982)"
    - "S. Z. Aster, The Unbeatable Light: Melammu and Its Biblical Parallels (AOAT 384, 2012)"

- id: justice-and-righteousness
  aliases: [mišpāṭ ûṣĕdāqâ, kittum u mīšarum, social justice, royal equity]
  cultures: [hebrew, babylonian, egyptian]
  scope: >-
    The paired ideals of "justice and righteousness" (mišpāṭ ûṣĕdāqâ) in the Hebrew Bible
    and their ancient Near Eastern counterparts, especially Akkadian kittum u mīšarum ("truth
    and equity") and Egyptian maat. It covers the king's duty to protect the weak, royal
    acts of release, and justice as the foundation of the divine throne. Maat, the mīšarum
    edicts and debt release have their own entries.
  passages:
    - "Ps 72:1-4 | concept | Prayer that the king judge with righteousness and defend the poor"
    - "Ps 89:14 | concept | Righteousness and justice the foundation of YHWH's throne (MT 89:15)"
    - "Ps 85:10-13 | imagery | Righteousness and peace personified, going before the deity; cf. Kittu and Mīšaru as Šamaš's attendants (MT 85:11-14)"
    - "Ps 99:4 | language | 'You have established equity (mêšārîm)', cognate with Akkadian mīšarum"
    - "2Sam 8:15 | concept | David administered justice and equity to all his people"
    - "Isa 9:7 | concept | Davidic throne upheld with justice and righteousness (MT 9:6)"
    - "Isa 11:3-5 | concept | Ideal ruler judges the poor with righteousness"
    - "Jer 22:15-16 | concept | Josiah did justice and righteousness and judged the cause of the poor"
    - "Isa 5:7 | language | Wordplay: mišpāṭ/miśpāḥ (bloodshed), ṣĕdāqâ/ṣĕʿāqâ (outcry)"
    - "Amos 5:24 | concept | Let justice roll down like waters, righteousness like an ever-flowing stream"
    - "Jer 34:8-10 | practice | Zedekiah's proclamation of release (dĕrôr), a royal act like a mīšarum edict"
  related: [maat, code-of-hammurabi, edict-of-ammi-saduqa, debt-release, widow-orphan-sojourner, royal-ideology, shamash, great-hymn-to-shamash]
  wikipedia: null
  image: null
  author_notes:
    - "Weinfeld (1995) argued that mišpāṭ ûṣĕdāqâ, like kittum u mīšarum, refers above all to royal social reform and release, not abstract jurisprudence. His thesis is influential; note criticisms that it can flatten differences between texts."
    - "Hammurabi's prologue and epilogue (he was called 'to make justice appear in the land' and styles himself 'king of justice', šar mīšarim) and Old Babylonian mīšarum edicts give the institutional background. Kittum (from kânu 'be firm') and mīšarum (from ešēru 'be straight') parallel Hebrew ʾĕmet/ṣedeq and mêšārîm."
    - "Kittu and Mīšaru appear as deified attendants of Šamaš, which helps explain personified righteousness and justice around the divine throne (Ps 85; 89:14; 97:2). Egyptian maat is also depicted as the base of the throne."
    - The prophetic critique (Amos, Isaiah, Jeremiah) applies the royal ideal to the whole society and judges kings by it. Keep this distinction clear from the ideology itself.
  sources_to_check:
    - M. Weinfeld, Social Justice in Ancient Israel and in the Ancient Near East (1995)
    - "F. R. Kraus, Königliche Verfügungen in altbabylonischer Zeit (SD 11, 1984)"
    - "H. H. Schmid, Gerechtigkeit als Weltordnung (BHT 40, 1968)"

- id: divine-abandonment
  aliases: [departure of the deity, divine wrath and abandonment, godnapping]
  cultures: [hebrew, babylonian, assyrian]
  scope: >-
    The ancient Near Eastern motif in which an angry deity abandons his city, temple or
    land, leaving it open to enemies, and later relents and returns. It explains defeat in
    Mesopotamian laments, the Marduk Prophecy, Esarhaddon's Babylon inscriptions and the
    Mesha Stele, and shapes Ezekiel's departure and return of the glory. The making and
    capture of cult statues are treated under cult-images.
  passages:
    - "Ezek 8:6 | concept | Abominations that 'drive me far from my sanctuary'"
    - "Ezek 9:9 | concept | The people say 'YHWH has forsaken the land'; cf. 8:12"
    - "Ezek 10:18-19; 11:22-23 | concept | The glory leaves the temple and the city eastward"
    - "Ezek 43:1-5 | concept | The glory returns from the east and fills the temple"
    - "1Sam 4:1-7:2 | parallel | The ark is captured, afflicts its captors, and returns: a capture-and-return narrative"
    - "Ps 78:59-61 | concept | God abandons Shiloh and gives his 'power' (the ark) into captivity"
    - "Jer 12:7 | concept | 'I have forsaken my house, I have abandoned my heritage'"
    - "Lam 2:1, 7 | concept | YHWH has forgotten his footstool, scorned his altar and disowned his sanctuary"
    - "Isa 46:1-2 | polemic | Bel and Nebo themselves go into captivity"
    - "2Kgs 18:25 | concept | The Rabshakeh claims that YHWH sent Assyria against Judah"
    - "Jer 25:11-12 | parallel | Seventy years of desolation; Esarhaddon's Marduk decreed seventy years, then reduced them to eleven"
    - "Ezra 1:7-11 | practice | Cyrus returns the temple vessels, the counterpart of restoring captured gods"
  related: [cult-images, city-laments, akkadian-prophecies, erra-and-ishum, mesha-stele, cyrus-cylinder, ark-of-the-covenant, divine-glory-and-melammu]
  wikipedia: null
  image: Black Stone of Esarhaddon British Museum
  author_notes:
    - "Survey the Mesopotamian sources: the Sumerian city laments (gods leave their cities), the Marduk Prophecy (Marduk's journeys to Hatti, Assyria and Elam), Esarhaddon's Babylon inscriptions (Marduk's anger, seventy years reduced to eleven), Erra and Išum, and the Cyrus Cylinder (Marduk angered by Nabonidus chooses Cyrus). The Mesha Stele (Chemosh 'angry with his land') shows the same logic in the Levant."
    - "Block's studies of Ezekiel's adaptation of the motif are the standard starting point. Note the difference: in Ezekiel there is no statue to remove, so the kābôd departs; and YHWH leaves by choice in judgment, not because he is defeated."
    - "Miller and Roberts (1977) read the ark narrative against Mesopotamian capture-and-return accounts. Their reading is widely followed, though the date of the narrative is debated."
    - "Distinguish the motif (divine anger and departure) from the practice (removal of statues). Ancient sources often merge them: a statue taken as booty can be described as the god 'going' to the enemy."
  sources_to_check:
    - "D. I. Block, The Gods of the Nations (2nd ed. 2000)"
    - "D. I. Block, 'Divine Abandonment: Ezekiel's Adaptation of an Ancient Near Eastern Motif,' in M. S. Odell and J. T. Strong, eds., The Book of Ezekiel (SBLSymS 9, 2000)"
    - "P. D. Miller Jr. and J. J. M. Roberts, The Hand of the Lord (1977)"
    - "J. F. Kutsko, Between Heaven and Earth: Divine Presence and Absence in the Book of Ezekiel (2000)"
    - "M. Cogan, Imperialism and Religion (SBLMS 19, 1974)"

