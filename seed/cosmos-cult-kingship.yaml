  cultures: [judahite]
  scope: >-
    The rock-cut family tombs of Iron Age Judah, with burial benches, headrests and
    repositories for bones, and the burial practices and beliefs they reflect. The
    entry covers biblical burial language, major tomb groups (Jerusalem, Ketef
    Hinnom, Silwan, Khirbet el-Qom), and grave goods.
  passages:
    - "Gen 23:1-20 | practice | Abraham buys the cave of Machpelah as a family tomb"
    - "Gen 25:8-10 | language | Abraham 'gathered to his people' and buried in the family cave"
    - "Gen 49:29-32 | practice | Jacob asks to be buried with his ancestors"
    - "2Sam 2:32 | practice | Asahel buried in his father's tomb at Bethlehem"
    - "1Kgs 13:30-31 | practice | 'Lay my bones beside his bones' in the family tomb"
    - "2Kgs 13:21 | practice | A corpse thrown into Elisha's grave touches his bones"
    - "2Kgs 22:20 | language | 'Gathered to your grave in peace'"
    - "2Kgs 23:6, 16 | practice | Graves of common people; Josiah takes bones from tombs on the mount"
    - "Isa 22:16 | realia | Shebna hews himself a tomb on the height"
    - "Jer 26:23 | practice | Body thrown into the burial place of the common people"
  related: [ketef-hinnom-amulets, royal-steward-inscription, khirbet-el-qom-inscription, care-for-the-dead, mourning-rites, sheol-and-the-netherworld, ossuaries]
  wikipedia: null
  image: Ketef Hinnom burial cave
  author_notes:
    - "E. Bloch-Smith, Judahite Burial Practices and Beliefs about the Dead (1992), is the standard synthesis. Typical features are benches with headrests (some in Hathor-wig shape at St. Étienne), a repository pit, and grave goods such as lamps, juglets, jewellery and amulets."
    - "The repository of collected bones is often linked to 'gathered to his people/fathers'. The link is plausible but should not be overstated."
    - "Bench tombs were for families who could afford rock-cut tombs. Many people were buried in simple graves (Jer 26:23)."
    - "Distinguish these tombs from the later loculus (kokh) tombs and ossuary burial of the Second Temple period."

- id: afterlife-and-resurrection
  aliases: [Resurrection of the dead, Immortality]
  cultures: [ane, persian, egyptian, jewish]
  scope: >-
    The development from the Hebrew Bible's dominant Sheol view toward hopes of
    rescue from death, bodily resurrection and judgment of the dead in late
    biblical and Second Temple texts. The entry covers Egyptian, Persian, Canaanite
    and Greek comparanda and the debates about influence.
  passages:
    - "Dan 12:2-3 | concept | Many who sleep in the dust will awake, some to everlasting life, some to contempt"
    - "Isa 26:19 | concept | 'Your dead shall live'; earth gives birth to the shades"
    - "Ezek 37:1-14 | imagery | Valley of dry bones: national restoration as resurrection"
    - "Hos 6:1-2 | imagery? | Revived after two days, raised on the third; dying-god background debated"
    - "Gen 5:24 | concept | Enoch 'taken' by God"
    - "2Kgs 2:11 | concept | Elijah taken up to heaven"
    - "Ps 49:15 | concept | God will ransom my life from Sheol (MT 49:16)"
    - "Ps 73:24 | concept? | 'Afterward you will receive me with honour'"
    - "Job 19:25-27 | concept? | 'My redeemer lives': whether a post-mortem vindication is meant is debated"
    - "2Macc 7:9, 14, 23 | concept | Martyrs' hope of bodily resurrection"
    - "1En 22 | concept | Hollow places where the spirits of the dead await judgment"
    - "Wis 3:1-4 | concept | Souls of the righteous in God's hand; hope of immortality"
    - "1Cor 15:12-57 | concept | Paul on resurrection of the body"
  related: [sheol-and-the-netherworld, zoroastrianism, book-of-the-dead, first-enoch, maccabean-revolt, baal-cycle, care-for-the-dead]
  wikipedia: Resurrection of the dead
  image: Book of the Dead weighing of the heart
  author_notes:
    - "Consensus: Dan 12:2-3 (c. 165 BCE) is the clearest Hebrew Bible text on individual resurrection. The date and meaning of Isa 26:19 (Isaiah 24–27) are debated."
    - "Zoroastrian influence is often proposed, but the late date of most Zoroastrian sources makes direction and timing contested. Present it as possible, not proven."
    - "The 'dying and rising god' category (Frazer) has been heavily criticized (J. Z. Smith), though Mettinger (The Riddle of Resurrection, 2001) defends a revised version. Apply this to Hos 6:1-2 with care."
    - "Egyptian judgment of the dead and the Greek immortal soul are distinct models. Note how Second Temple texts combine them in different ways (Wisdom of Solomon vs 2 Maccabees)."

- id: apotropaic-doorposts-and-thresholds
