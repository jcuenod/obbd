  wikipedia: Solomon's Temple
  image: null
  author_notes:
    - No remains of the First Temple have been excavated; the Temple Mount cannot be dug, and finds from sifting spoil are out of context. The 'Jehoash inscription' and the inscription on the ivory pomegranate are judged forgeries by most specialists. Do not use them as evidence.
    - "The closest plans are Iron Age temples of northern Syria: ʿAin Dara (portico, antechamber, cella, and a surrounding gallery) and Tell Tayinat Building II (tripartite temple next to a palace). Stress that these are typological parallels that show the plan is plausible for the Iron Age; they do not date 1 Kgs 6-7."
    - The description in 1 Kgs 6-7 probably reflects the temple as later Judahite scribes knew it, with editorial layers. Whether the building goes back to Solomon in its described form is tied to the debate over 10th-century Jerusalem; present the range of views (see low-chronology-debate).
