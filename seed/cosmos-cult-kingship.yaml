# Seed entries for the cosmos-cult-kingship domain, part 1 (cosmology through bronze-sea).
# See docs/seed-guide.md for the field specification.

- id: cosmology
  cultures: [ane]
  scope: >-
    The ways ancient Near Eastern cultures pictured the structure of the world: heavens,
    earth, the waters above and below, and the netherworld. The entry surveys Mesopotamian,
    Egyptian, and Levantine conceptions and the cosmological assumptions shared by biblical
    texts. Creation narratives, combat myths, and individual features (firmament, pillars,
    tehom) have their own entries.
  passages:
    - "Gen 1:1-2:3 | concept | Ordering of a pre-existing watery mass into heavens, earth, and seas"
    - "Gen 1:6-8 | concept | A dome (rāqîaʿ) separates the waters above from the waters below"
    - "Gen 7:11 | concept | Fountains of the deep and windows of the heavens opened in the flood"
    - "Exod 20:4 | concept | Tripartite formula: heaven above, earth beneath, water under the earth"
    - "Ps 104:2-9 | concept | Heavens stretched like a tent, earth on foundations, waters given bounds"
    - "Job 26:7-14 | concept | Earth hung over the void, waters bound in clouds, pillars of heaven"
    - "Job 38:4-11 | concept | Earth founded and measured like a building; the sea shut in with doors"
    - "Prov 8:22-31 | concept | Wisdom present as heavens, deep, and earth's foundations are set"
    - "Isa 40:22 | imagery | God enthroned above the 'circle' (ḥûg) of the earth; heavens as a tent"
    - "Phil 2:10 | concept | Beings in heaven, on earth, and under the earth"
    - "Ps 148:4 | concept | 'You waters above the heavens' summoned to praise"
  related: [egyptian-cosmology, babylonian-map-of-the-world, firmament, waters-above-and-below, pillars-and-foundations-of-the-earth, sheol-and-the-netherworld, creation-accounts, enuma-elish]
  wikipedia: Biblical cosmology
  image: Nut Geb Shu Greenfield papyrus
  author_notes:
    - The "three-tiered universe" is a useful shorthand, but biblical texts use several images (tent, building on pillars, earth suspended over nothing) and do not offer one systematic model. Present the evidence as a family of overlapping pictures.
    - Mesopotamian sources describe multiple heavens of different stones and a subterranean apsû (Horowitz). Egyptian sources picture the sky goddess Nut arched over the earth god Geb, separated by Shu, with Nun as the surrounding waters.
    - Note the scholarly consensus that biblical writers shared the physical cosmology of their environment. Avoid concordist readings that harmonize the texts with modern science, and avoid presenting the shared picture as a sign of literary dependence.
    - The Babylonian Map of the World (BM 92687) is a good visual aid for the circular earth surrounded by the bitter river (marratu).
  sources_to_check:
    - Wayne Horowitz, Mesopotamian Cosmic Geography (1998)
    - Othmar Keel, The Symbolism of the Biblical World (1978)

- id: firmament
  aliases: [raqia, rāqîaʿ, vault of heaven]
  cultures: [hebrew, babylonian, egyptian]
  scope: >-
    The rāqîaʿ ("firmament", "dome", or "expanse") of Gen 1, the barrier set between the
    upper and lower waters in which the heavenly lights are placed, and its comparative
    background in ancient Near Eastern ideas of a solid sky.
  passages:
    - "Gen 1:6-8 | concept | Rāqîaʿ made to separate waters above from waters below; named 'sky'"
    - "Gen 1:14-17 | concept | Sun, moon, and stars set in the rāqîaʿ"
    - "Gen 1:20 | concept | Birds fly across the face of the rāqîaʿ"
    - "Job 37:18 | concept | Skies spread out 'hard as a molten mirror'"
    - "Ezek 1:22-26 | imagery | Gleaming rāqîaʿ over the living creatures, with the throne above it"
    - "Ps 19:1 | concept | The rāqîaʿ proclaims God's handiwork; MT 19:2"
    - "Ps 150:1 | concept | God praised 'in his mighty firmament'"
    - "Dan 12:3 | imagery | The wise shine like the brightness of the rāqîaʿ"
    - "Exod 39:3 | language | Verb rqʿ 'beat out' used for hammering gold into thin sheets"
    - "Gen 7:11 | concept | Windows ('ărubbôt) of the heavens opened to release the upper waters"
  related: [cosmology, waters-above-and-below, enuma-elish, egyptian-cosmology, ezekiel-throne-chariot, babylonian-map-of-the-world]
  wikipedia: Firmament
  image: null
  author_notes:
    - The noun is related to the verb rqʿ, "to beat out, stamp, spread" (used of hammered metal in Exod 39:3; Num 16:38, MT 17:3). LXX stereōma and Vulgate firmamentum both imply solidity. The majority view is that the rāqîaʿ was conceived as a solid barrier. Note that some translations ("expanse") and some interpreters resist this.
    - Key comparandum is Enuma Elish IV, where Marduk splits Tiamat's body and sets half of it as the sky, with a bar and guards so that her waters cannot escape. Present it as a conceptual parallel, not proof of borrowing.
    - Mesopotamian texts describe heavens made of different stones (Horowitz). Cf. the sapphire pavement of Exod 24:10.
    - Caution that the often-reproduced "Flammarion engraving" is a 19th-century image, not an ancient or medieval depiction.

- id: waters-above-and-below
  cultures: [ane]
  scope: >-
    The widespread ancient Near Eastern idea that the inhabited world is enclosed by waters,
    held back above by the sky and lying beneath the earth as a subterranean ocean that feeds
    springs. Covers biblical references to the upper waters, the 'water under the earth', and
    the opening of both in the flood.
  passages:
    - "Gen 1:6-7 | concept | Waters divided into those above and those below the rāqîaʿ"
    - "Gen 7:11 | concept | Fountains of the great deep burst and windows of heaven opened"
    - "Gen 8:2 | concept | Fountains of the deep and windows of heaven closed"
    - "Ps 148:4 | concept | 'You waters above the heavens' summoned to praise"
    - "Ps 104:3 | concept | Beams of God's chambers laid on the waters"
    - "Exod 20:4 | concept | No image of anything 'in the water under the earth'"
    - "Deut 4:18 | concept | Fish 'in the water under the earth'"
    - "Ps 24:2 | concept | Earth founded on the seas and established on the rivers"
    - "Ps 136:6 | concept | Earth spread out on the waters"
    - "Gen 49:25 | concept | 'Blessings of the deep that lies beneath'; cf. Deut 33:13"
  related: [cosmology, firmament, tehom, enuma-elish, egyptian-cosmology, flood-traditions, bronze-sea]
  wikipedia: null
  image: null
  author_notes:
    - Mesopotamian cosmology locates the apsû, the freshwater ocean of Enki/Ea, beneath the earth as the source of springs and rivers. Egyptian cosmology places the primeval waters of Nun around and beneath the ordered world. In both, creation is the setting of bounds within surrounding waters.
    - The flood narrative is best read cosmologically, as the reopening of the barriers set in Gen 1. This is a widely held reading, not a fringe one.
    - Note the beneficent role of the lower waters (springs, fertility) alongside their threatening role, and avoid reducing all biblical water imagery to "chaos".

- id: pillars-and-foundations-of-the-earth
  cultures: [ane]
  scope: >-
    Biblical and ancient Near Eastern language picturing the earth (and sometimes the sky) as
    a built structure resting on pillars, foundations, and bases, which God established and can
    shake. The entry covers architectural metaphors for creation and their cosmological
    assumptions.
  passages:
    - "1Sam 2:8 | concept | 'The pillars of the earth are the LORD's; on them he has set the world'"
    - "Job 9:6 | concept | God shakes the earth so that its pillars tremble"
    - "Job 26:11 | concept | The pillars of heaven tremble at God's rebuke"
    - "Job 38:4-6 | imagery | Earth founded like a building: measurements, line, bases, cornerstone"
    - "Ps 75:3 | concept | God keeps the earth's pillars steady; MT 75:4"
    - "Ps 104:5 | concept | Earth set on its foundations, never to be shaken"
    - "Prov 8:29 | concept | God marks out the foundations of the earth"
    - "Ps 18:7, 15 | concept | Foundations of the mountains and of the world shaken and laid bare; MT 18:8, 16"
    - "Isa 24:18 | concept | The foundations of the earth tremble in judgment"
    - "Mic 6:2 | concept | 'Enduring foundations of the earth' summoned as witnesses"
  related: [cosmology, cosmic-mountain, temple-building-accounts, waters-above-and-below, creation-accounts, egyptian-cosmology]
  wikipedia: null
  image: null
  author_notes:
    - The imagery draws on building practice (foundation-laying, measuring line, cornerstone). Note the overlap with temple-building language and the "temple as cosmos" idea.
    - Egyptian sources picture the sky held up by four supports or by Shu. Mesopotamian sources speak of the "foundations" and "bonds" of heaven and earth. Present these as comparable images, not one shared doctrine.
    - Job 26:7 ("hangs the earth upon nothing") stands beside pillar language in the same book. Use this to caution against reconstructing a single fixed model.

- id: tehom
  aliases: [the Deep]
  cultures: [hebrew, ugaritic, babylonian]
  scope: >-
    Hebrew tĕhôm, the primeval and subterranean "deep", in creation, flood, and poetic texts,
    and the long debate over its relation to Akkadian tiāmtum and the goddess Tiamat of
    Enuma Elish.
  passages:
    - "Gen 1:2 | language | Darkness over the face of tĕhôm, without the article; cognate of Akkadian tiāmtum"
    - "Gen 7:11 | concept | Fountains of the great tĕhôm burst open"
    - "Gen 8:2 | concept | Fountains of tĕhôm closed"
    - "Gen 49:25 | concept | 'Blessings of tĕhôm that lies beneath'"
    - "Ps 104:6 | concept | Tĕhôm covered the earth like a garment"
    - "Prov 8:27-28 | concept | A circle drawn on the face of tĕhôm; its fountains established"
    - "Isa 51:10 | imagery | Drying up 'the waters of the great tĕhôm' at the exodus"
    - "Ps 77:16 | imagery | The deeps tremble before God; MT 77:17"
    - "Hab 3:10 | imagery | Tĕhôm gives forth its voice before the divine warrior"
    - "Ps 33:7 | concept | The deeps put in storehouses"
  related: [enuma-elish, chaoskampf, waters-above-and-below, yam, leviathan, cosmology, flood-traditions]
  wikipedia: Tehom
  image: null
  author_notes:
    - The consensus is that tĕhôm and Akkadian tiāmtum ("sea") share a common Semitic root (cf. Ugaritic thm/thmt). Tĕhôm is not a loanword from the name Tiamat. The phonology argues against direct borrowing (Heidel; Tsumura).
    - Gunkel's influential view that Gen 1:2 reflects a demythologized Tiamat should be presented as historically important but heavily qualified. In Gen 1 tĕhôm is not personified and there is no combat.
    - Tĕhôm usually appears without the article (quasi-proper-noun use), but this alone does not show personification.
    - Note the term's range across creation, flood, blessing (fertile subterranean waters), and exodus poetry.
  sources_to_check:
    - David Toshio Tsumura, Creation and Destruction (2005)
    - Hermann Gunkel, Creation and Chaos in the Primeval Era and the Eschaton (ET 2006)

- id: chaoskampf
  aliases: [Chaoskampf, combat myth, divine conflict with the sea]
  cultures: [ugaritic, babylonian, amorite, hittite]
  scope: >-
    The motif of a storm or warrior deity defeating the Sea or a sea dragon, attested at Ugarit
    (Baal and Yam), in Mesopotamia (Marduk and Tiamat), at Mari, and among the Hittites, and
    reused in biblical poetry for YHWH's victory over Sea, Rahab, Leviathan, and the dragon.
  passages:
    - "Ps 74:12-17 | parallel | God divides the sea, breaks the heads of the dragons, crushes Leviathan"
    - "Ps 89:9-10 | parallel | YHWH rules the raging sea and crushes Rahab; MT 89:10-11"
    - "Job 26:12-13 | parallel | God stills the Sea, strikes Rahab, pierces the fleeing serpent"
    - "Job 7:12 | parallel | 'Am I the Sea, or the Dragon, that you set a guard over me?'"
    - "Job 38:8-11 | concept | The sea shut in with doors and set bounds; restraint without combat"
    - "Isa 27:1 | parallel | Leviathan the fleeing and twisting serpent; close wording to KTU 1.5 I 1-3"
    - "Isa 51:9-10 | parallel | Arm of YHWH that cut Rahab and pierced the dragon, applied to the exodus"
    - "Hab 3:8-15 | parallel | Divine warrior's rage against rivers and sea"
    - "Nah 1:4 | imagery | YHWH rebukes the sea and makes it dry"
    - "Gen 1:2, 21 | polemic? | Deep and sea creatures (tannînim) without combat; demythologizing reading debated"
    - "Dan 7:2-8 | imagery | Beasts arise from the churning sea"
    - "Rev 12:3-9 | imagery | The great dragon defeated and thrown down"
    - "Rev 21:1 | imagery | 'The sea was no more'"
  related: [baal-cycle, enuma-elish, leviathan, rahab-sea-monster, tannin, yam, divine-warrior, tehom]
  wikipedia: Chaoskampf
  image: Nimrud relief Ninurta fighting monster
  author_notes:
    - The closest biblical parallels are Ugaritic (Baal versus Yam, and Anat's and Baal's defeat of Litan/Lotan, the seven-headed serpent). The parallels are not mainly Babylonian (Day, God's Conflict with the Dragon and the Sea). Isa 27:1 echoes KTU 1.5 I 1-3 almost word for word.
    - Distinguish combat from creation. At Ugarit, Baal's victory over Yam secures kingship and a palace and is not a creation story. In Enuma Elish combat leads to creation. Biblical texts link the combat to creation (Ps 74; 89), to the exodus (Isa 51), and to eschatology (Isa 27; Rev).
    - Whether Gen 1 deliberately demythologizes the combat myth is debated (Gunkel versus Tsumura; Watson, Chaos Uncreated). Present it as a debate. Some scholars question whether "chaos" is the right category at all.
    - Mention the Mari letter (A.1968) in which Addu gives Zimri-Lim the weapons with which he fought Sea, as evidence of the motif in the Amorite West.
  sources_to_check:
    - John Day, God's Conflict with the Dragon and the Sea (1985)
    - Rebecca S. Watson, Chaos Uncreated (BZAW 341, 2005)
    - CAT 1.2 IV; 1.3 III; 1.5 I

- id: creation-accounts
  cultures: [ane]
  scope: >-
    A hub entry surveying Mesopotamian, Egyptian, and Levantine accounts of the origin of the
    world and their relation to the biblical creation texts, both Gen 1-2 and poetic and
    wisdom passages. Detailed treatments are in the entries on individual texts and motifs.
  passages:
    - "Gen 1:1-2:3 | parallel | Priestly creation in six days; separation, naming, and rest"
    - "Gen 2:4-25 | parallel | Non-Priestly account: human from soil, garden, rivers, animals, woman"
    - "Gen 1:3 | concept? | Creation by divine word; cf. Memphite Theology (Shabaka Stone)"
    - "Ps 104:20-30 | parallel | Night, beasts, sea, and life-giving breath; close themes to the Great Hymn to the Aten"
    - "Ps 74:12-17 | parallel | Creation linked to victory over the sea and dragons"
    - "Prov 8:22-31 | parallel | Wisdom present before and during creation"
    - "Job 38:4-11 | parallel | Creation as building and as confining the sea"
    - "Isa 45:7, 18 | concept | YHWH forms light and darkness; creates the earth to be inhabited"
    - "John 1:1-3 | concept | Creation through the Word"
  related: [enuma-elish, atrahasis, shabaka-stone, great-hymn-to-the-aten, egyptian-cosmology, creation-of-humanity, chaoskampf, eridu-genesis]
  wikipedia: Genesis creation narrative
  image: Enuma Elish tablet British Museum
  author_notes:
    - There is no single Mesopotamian "creation epic". Enuma Elish is mainly a work exalting Marduk, and cosmogonic material also appears in incantations, disputation poems, myth prologues (e.g. Atrahasis), and god lists. Egypt has several cosmogonies (Heliopolitan, Hermopolitan, Memphite) that are not mutually exclusive.
    - Treat Gen 1:1-2:3 and 2:4b-25 as distinct accounts (Priestly and non-Priestly in most critical reconstructions). Note that each has different comparative profiles.
    - Correct the "Babel-Bibel" overstatement (Delitzsch) that Genesis is derived from Enuma Elish. Most specialists see shared conceptual idiom rather than direct literary dependence. Lambert's caution is a standard reference point.
    - Ps 104 and the Hymn to the Aten share themes (cf. Ps 104:20-30). How the dependence came about is debated.
  sources_to_check:
    - W. G. Lambert, Babylonian Creation Myths (2013)
    - Richard J. Clifford, Creation Accounts in the Ancient Near East and in the Bible (CBQMS 26, 1994)
    - COS 1.111
    - COS 1.130

- id: creation-of-humanity
  cultures: [ane]
  scope: >-
    Ancient Near Eastern accounts of how and why humans were made: from clay, divine blood,
    or tears; shaped by a potter god; and created to relieve the gods of labour. Covers the
    comparative background of Gen 1:26-28 and 2:7 and related poetic texts.
  passages:
    - "Gen 2:7 | parallel | Human formed from dust of the ground and animated by divine breath; cf. clay and divine blood in Atrahasis"
    - "Gen 2:15 | concept | Human placed to till and keep the garden; contrast humans created to bear the gods' toil"
    - "Gen 1:26-28 | concept | Humanity created in the divine image to rule"
    - "Gen 2:21-22 | parallel? | Woman built from the man's side; 'rib' wordplay with Enki and Ninhursag is contested"
    - "Job 10:8-9 | imagery | 'You fashioned me like clay'"
    - "Job 33:6 | imagery | 'I too was formed from a piece of clay'"
    - "Isa 64:8 | imagery | 'We are the clay, and you are our potter'; MT 64:7"
    - "Jer 18:1-6 | imagery | Potter and clay"
    - "Ps 8:3-8 | concept | Humans made a little lower than God, crowned to rule; MT 8:4-9"
    - "Rom 9:20-21 | imagery | Potter's right over the clay"
  related: [atrahasis, enuma-elish, khnum, image-of-god, creation-accounts, enki-and-ninhursag, pottery-and-potters]
  wikipedia: Creation of man from clay
  image: Khnum potter's wheel relief
  author_notes:
    - Atrahasis I narrates the mixing of clay with the flesh and blood of a slain god (We-ila) so that humans bear the labour of the gods. Enuma Elish VI has humans made from Kingu's blood for the same purpose. Contrast Gen 2:15, where humans tend God's garden, and Gen 1:28, where they receive dominion.
    - Egyptian images include Khnum shaping humans on a potter's wheel and humans arising from the tears of the creator (a wordplay on rmṯ "people" and rmyt "tears"). The Instruction for Merikare calls humans the god's "cattle" and his images.
    - The Sumerian "rib" pun (ti = "rib" and "life") in Enki and Ninhursag, proposed as background to Gen 2:21-22, is widely repeated but contested. Mark it as such.

- id: image-of-god
  aliases: [imago Dei]
  cultures: [ane, egyptian, assyrian, aramean]
  scope: >-
    The biblical claim that humans are made "in the image (ṣelem) and likeness (dĕmût)" of
    God, read against ancient Near Eastern uses of image language for cult statues and for
    kings as earthly representatives of gods.
  passages:
    - "Gen 1:26-28 | concept | Humans made in God's ṣelem and dĕmût, given dominion"
    - "Gen 5:1-3 | language | Adam fathers Seth 'in his likeness, according to his image'"
    - "Gen 9:6 | concept | Murder prohibited because humans are made in God's image"
    - "Ps 8:5-8 | concept | Royal language of crowning and dominion applied to humanity; MT 8:6-9"
    - "2Kgs 11:18 | language | ṣelem used of cult images in the temple of Baal"
    - "Num 33:52 | language | ṣalmê massēkōt 'cast images' to be destroyed"
    - "Col 1:15 | concept | Christ as 'the image of the invisible God'"
    - "Jas 3:9 | concept | Humans 'made in the likeness of God'"
  related: [tell-fekheriye-statue, cult-images, royal-ideology, egyptian-kingship, creation-of-humanity, mouth-washing-and-opening]
  wikipedia: Image of God
  image: Tell Fekheriye statue
  author_notes:
    - The Tell Fekheriye bilingual (9th c. BCE) uses both Aramaic ṣlm and dmwt for the ruler's statue. This makes it a key text against sharp distinctions between "image" and "likeness".
    - Egyptian kings are called the "living image" of a god, and Neo-Assyrian letters call the king the image (ṣalmu) of Bel or Shamash. Many scholars therefore read Gen 1:26-28 as a "democratization" of royal ideology (Clines; Middleton, The Liberating Image). The Instruction for Merikare already extends image language to humanity.
    - Present the main interpretive families (functional/royal, relational, structural) neutrally. The royal-functional reading is the dominant critical view.
    - Note the tension with biblical aniconism. Humans, not statues, represent God on earth, and some see this as implicit polemic.

- id: flood-traditions
  cultures: [mesopotamian, greek]
  scope: >-
    A hub entry for ancient flood narratives (Sumerian Flood Story, Atrahasis, Gilgamesh XI,
    Berossus, and Greek Deucalion traditions) and their relationship to Gen 6:5-9:17 and later
    biblical references to the flood.
  passages:
    - "Gen 6:5-9:17 | parallel | Divine decision to destroy humanity, warned hero, boat, survival, sacrifice"
    - "Gen 6:14-16 | parallel | Instructions for building and caulking the boat"
    - "Gen 7:11 | concept | Flood as reopening of the cosmic waters"
    - "Gen 8:4 | parallel | Boat grounds on a mountain (Ararat; cf. Nimush/Nisir in Gilgamesh XI)"
    - "Gen 8:6-12 | parallel | Birds released to test for dry land; cf. Gilgamesh XI"
    - "Gen 8:20-21 | parallel | Sacrifice after the flood; deity smells the pleasing odour"
    - "Gen 9:8-17 | parallel? | Bow as sign of a divine pledge; cf. the mother goddess's lapis necklace of remembrance in Gilgamesh XI"
    - "Isa 54:9 | concept | The 'waters of Noah' as an oath never repeated"
    - "Matt 24:37-39 | concept | Flood as type of sudden judgment"
    - "2Pet 3:5-6 | concept | World formed out of water and destroyed by water"
  related: [atrahasis, gilgamesh-epic, gilgamesh-flood-tablet, eridu-genesis, sumerian-king-list, creation-accounts]
  wikipedia: Flood myth
  image: Gilgamesh flood tablet British Museum
  author_notes:
    - Atrahasis offers the closest overall plot sequence (creation, overpopulation or noise, flood, divine regret). Gilgamesh XI supplies the closest details (boat dimensions, birds, mountain landing, sacrifice). Note that critical source divisions of Gen 6-9 (Priestly and non-Priestly) parallel different details.
    - The motive differs. In Atrahasis it is human noise (rigmu) or overpopulation, in Genesis it is violence and corruption (Gen 6:5, 11-13). This contrast is often treated as the theological centre of the comparison.
    - Mesopotamian versions were known in the Bronze Age Levant (Akkadian Atrahasis fragment from Ugarit; Gilgamesh fragment from Megiddo). This is relevant to transmission.
    - Woolley's flood deposits at Ur and similar local layers are not evidence for a single universal flood. Correct this common misconception.
  sources_to_check:
    - A. R. George, The Babylonian Gilgamesh Epic (2003)
    - W. G. Lambert and A. R. Millard, Atra-ḫasīs, The Babylonian Story of the Flood (1969)
    - COS 1.130

- id: garden-of-god
  aliases: [Eden, Garden of Eden, paradise]
  cultures: [ane, assyrian, persian]
  scope: >-
    The garden of God (Eden) as a mythic and royal-sacral motif: the well-watered divine garden
    with sacred trees, cherub guardians, and rivers, its links to temple symbolism, and its
    background in ancient Near Eastern royal and temple gardens.
  passages:
    - "Gen 2:8-3:24 | concept | Garden planted by God with trees, rivers, and cherubim at the east gate"
    - "Gen 2:10-14 | concept | One river dividing into four, watering the world"
    - "Ezek 28:12-19 | parallel | King of Tyre in 'Eden, the garden of God' on the holy mountain, with a guardian cherub"
    - "Ezek 31:8-9, 16-18 | imagery | Cedars and trees of Eden in the garden of God"
    - "Isa 51:3 | imagery | Zion's wilderness to become like Eden, the garden of the LORD"
    - "Joel 2:3 | imagery | Land like the garden of Eden before the locust army"
    - "Ezek 47:1-12 | concept | Life-giving river flowing from the temple, with fruit trees on its banks"
    - "Ps 46:4 | concept | A river whose streams gladden the city of God; MT 46:5"
    - "1Kgs 6:29-35 | realia | Temple carved with cherubim, palm trees, and open flowers"
    - "2Kgs 21:18 | realia | Royal burial in the 'garden of Uzza'"
    - "Eccl 2:4-6 | realia | Royal gardens and parks (pardēsîm) with pools for irrigation"
    - "Neh 2:8 | language | Keeper of the king's 'park' (pardēs), a Persian loanword"
  related: [tree-of-life, cosmic-mountain, temple-as-cosmos, cherubim, enki-and-ninhursag, assyrian-sacred-tree, tell-fekheriye-statue, adapa]
  wikipedia: Garden of Eden
  image: Ashurbanipal garden party relief
  author_notes:
    - Emphasize the overlap of garden, mountain, and temple symbolism (Ezek 28; 47). Many scholars read the Eden narrative with temple imagery in view (cherubim, eastern entrance, gold and precious stones), but how far the correspondence goes is debated.
    - Royal gardens are well attested (Assyrian palace gardens at Nineveh; Persian pairidaēza, the source of Greek paradeisos and Hebrew pardēs). Note the ideology of the king as gardener.
    - The etymology of ʿēden is debated. Proposals are Sumerian/Akkadian edin "steppe" and West Semitic ʿdn "abundance, luxuriance", the latter attested in the Tell Fekheriye inscription. Present both.
    - Attempts to locate Eden geographically from the four rivers should be treated as part of the text's cosmological geography rather than as a solvable map problem.

- id: tree-of-life
  cultures: [ane, assyrian, egyptian, hebrew]
  scope: >-
    The tree (or plant) of life in Genesis, wisdom literature, Ezekiel, and Revelation, and
    the ancient Near Eastern motifs of life-giving plants, sacred trees flanked by animals or
    genii, and tree goddesses.
  passages:
    - "Gen 2:9 | concept | Tree of life in the midst of the garden"
    - "Gen 3:22-24 | concept | Access to the tree of life barred by cherubim"
    - "Prov 3:18 | imagery | Wisdom is 'a tree of life to those who lay hold of her'"
    - "Prov 11:30 | imagery | Fruit of the righteous as a tree of life"
    - "Prov 13:12 | imagery | 'A desire fulfilled is a tree of life'"
    - "Prov 15:4 | imagery | A gentle tongue as a tree of life"
    - "Ezek 47:12 | imagery | Trees by the temple river bearing monthly fruit and healing leaves"
    - "Rev 22:2, 14 | imagery | Tree of life in the new Jerusalem"
    - "Exod 25:31-36 | realia | Lampstand with branches, almond blossoms, and calyxes as a stylized tree"
  related: [garden-of-god, assyrian-sacred-tree, asherah, menorah, gilgamesh-epic, adapa, taanach-cult-stand]
  wikipedia: Tree of life (biblical)
  image: Lachish ewer
  author_notes:
    - Mesopotamian literature has life-giving plants rather than a "tree of life" as such (Gilgamesh XI's plant "Old Man Becomes Young", Adapa's bread and water of life). Present these as thematic parallels.
    - The stylized tree flanked by caprids is common in Levantine iconography (Lachish ewer, Kuntillet ʿAjrud pithos A, Taanach stand). Its association with Asherah is widely argued but debated. The Assyrian "sacred tree" has its own entry, and its meaning is uncertain.
    - Mention Egyptian tree goddesses (Nut or Hathor in a sycamore offering water to the deceased) as a separate image complex.
    - Parpola's Kabbalistic interpretation of the Assyrian tree is not mainstream. Leave it out or flag it as such.

- id: cosmic-mountain
  aliases: [Zaphon, Mount Zaphon, mountain of God]
  cultures: [ugaritic, canaanite, mesopotamian]
  scope: >-
    The mountain as divine dwelling and meeting place of heaven and earth, especially Baal's
    Mount Ṣapānu (Zaphon) and El's mountain at Ugarit, and the transfer of such imagery to
    Zion, Sinai, and the "mountain of God" in biblical texts.
  passages:
    - "Ps 48:1-2 | language | Mount Zion 'in the far north' (yarkĕtê ṣāpôn); MT 48:2-3"
    - "Isa 14:13 | parallel | 'Mount of assembly on the heights of Zaphon'"
    - "Ezek 28:14, 16 | concept | King of Tyre on 'the holy mountain of God'"
    - "Isa 2:2-4 | concept | Mountain of the LORD's house raised highest of the mountains; cf. Mic 4:1-3"
    - "Ps 68:15-16 | imagery | Mountain of Bashan envies the mountain God chose; MT 68:16-17"
    - "Exod 15:17 | concept | 'Mountain of your own possession' as divine sanctuary"
    - "Exod 24:9-18 | concept | Sinai as place of theophany and divine presence"
    - "Ps 2:6 | concept | King installed on Zion, the holy hill"
    - "Job 26:7 | language | God 'stretches out Zaphon over the void'"
    - "Ezek 40:2 | concept | Visionary temple on a very high mountain"
  related: [baal-cycle, baal, el, divine-council, temple-as-cosmos, garden-of-god, ziggurat, jerusalem]
  wikipedia: Jebel Aqra
  image: Jebel Aqra
  author_notes:
    - Ṣapānu is a real mountain (Jebel al-Aqraʿ, classical Mons Casius) north of Ugarit, and also the Hebrew word for "north". Ps 48:2 transfers Baal's mountain to Zion.
    - El's abode at "the source of the rivers, the midst of the springs of the two deeps" and Baal's Zaphon should be distinguished. Note that El's "mount of assembly" informs Isa 14:13.
    - Clifford, The Cosmic Mountain in Canaan and the Old Testament (1972), remains the standard comparative study. Caution against importing Eliade's universal "axis mundi" uncritically.
    - The mountain symbolism of Mesopotamian ziggurats is often asserted but not explicit in the native sources. Keep the discussion of ziggurats brief and qualified.

- id: divine-rest
  cultures: [ane, babylonian, hebrew]
  scope: >-
    The motif of a deity's rest after victory or creation, typically in a newly built temple,
    and its biblical expressions in God's seventh-day cessation, the ark's "resting place", and
    the temple as YHWH's dwelling. Also covers the contrasting motif of disturbed or sleeping
    gods.
  passages:
    - "Gen 2:2-3 | concept | God ceases (šābat) from work on the seventh day and hallows it"
    - "Exod 20:11 | concept | YHWH 'rested' (wayyānaḥ) on the seventh day"
    - "Exod 31:17 | concept | God 'ceased and was refreshed' (šābat wayyinnāpaš)"
    - "Ps 132:8, 13-14 | concept | Ark brought to its resting place (mĕnûḥâ); Zion as YHWH's rest forever"
    - "1Chr 28:2 | concept | Temple as 'a house of rest for the ark' and God's footstool"
    - "Isa 66:1 | concept | 'What is the house... and what is my resting place?'"
    - "1Kgs 5:4 | concept | Rest from enemies as precondition for temple building; MT 5:18"
    - "2Sam 7:1-2, 11 | concept | Rest from enemies and the proposal to build a temple"
    - "Ps 44:23 | imagery | 'Rouse yourself! Why do you sleep, O Lord?'; MT 44:24"
    - "Ps 121:4 | polemic? | Israel's keeper 'neither slumbers nor sleeps'"
    - "Heb 4:1-11 | concept | Sabbath rest and God's rest reinterpreted"
  related: [enuma-elish, atrahasis, sabbath, temple-as-cosmos, temple-building-accounts, footstool, ark-of-the-covenant, seven-day-patterns]
  wikipedia: null
  image: null
  author_notes:
    - In Enuma Elish the younger gods' noise prevents Apsu's rest (Tablet I), and after Marduk's victory the gods build Esagil as a resting place (Tablet VI). In Atrahasis human noise disturbs Enlil's sleep. These show a pattern of combat, temple building, and divine rest.
    - Distinguish the vocabulary. šbt means "cease, stop", nwḥ means "rest, settle", and npš (niphal) means "be refreshed". Gen 2:2-3 uses the verb šābat, not the noun šabbāt.
    - Walton's reading of Gen 1 as cosmic temple inauguration is influential but contested. Present it as one proposal.
    - The sleeping-god motif (Batto, "The Sleeping God", Biblica 1987, to verify) appears positively (rest as sovereignty) and in lament and polemic (1 Kgs 18:27; Ps 121:4).

- id: temple-as-cosmos
  aliases: [temple as microcosm]
  cultures: [ane, egyptian, babylonian, hebrew]
  scope: >-
    The idea that temples were built and decorated as models of the cosmos or of primeval
    creation, and the biblical correspondences between creation and the construction of the
    tabernacle and temple.
  passages:
    - "Exod 39:32, 43 | parallel | Work 'finished' and Moses sees and blesses it; cf. Gen 1:31-2:3"
    - "Exod 40:33-34 | parallel | 'Moses finished the work'; the glory fills the tabernacle"
    - "Exod 25:1-31:17 | parallel? | Seven divine speeches culminating in the Sabbath (Exod 31:12-17); creation pattern debated"
    - "Ps 78:69 | concept | Sanctuary built 'like the high heavens, like the earth'"
    - "Isa 66:1 | concept | Heaven as throne, earth as footstool, relativizing the temple"
    - "1Kgs 8:27 | concept | Heaven cannot contain God, much less the temple"
    - "1Kgs 7:23-26 | realia | Bronze 'sea' in the temple court"
    - "1Kgs 6:29 | realia | Garden decoration of cherubim, palms, and flowers"
    - "Ezek 47:1-12 | concept | Temple as source of life-giving waters"
    - "Heb 8:5 | concept | Earthly sanctuary as copy and shadow of the heavenly one"
  related: [temple-building-accounts, cosmic-mountain, garden-of-god, bronze-sea, tabernacle, etemenanki, divine-rest, egyptian-cosmology]
  wikipedia: null
  image: Dendera temple astronomical ceiling
  author_notes:
    - Mesopotamian temple names express cosmic roles. Examples are E-temen-anki ("House, foundation platform of heaven and earth") at Babylon and Dur-an-ki ("bond of heaven and earth") for Nippur. Egyptian temples represent the primeval mound, with papyrus columns and star-studded ceilings.
    - The verbal links between Gen 1:1-2:3 and Exod 39-40 (finishing the work, seeing, blessing) are widely accepted (Blenkinsopp; Weinfeld). The seven-speech structure of Exod 25-31 as a creation pattern (Kearney) is more speculative.
    - Josephus (Ant. 3.180-187) and Philo explicitly read the tabernacle cosmologically. Use them as reception, not as evidence for the original design.
    - Avoid maximal claims that every temple feature has a cosmic referent. Levenson, "The Temple and the World" (JR 1984), is a balanced starting point.

- id: temple-building-accounts
  cultures: [ane, sumerian, assyrian, ugaritic]
  scope: >-
    The ancient Near Eastern genre and pattern of temple-building narratives: divine command,
    preparation of materials and labour, construction, dedication with festivities, and
    blessing. Covers the comparative background of the tabernacle and Solomon's and the
    Second Temple building accounts.
  passages:
    - "1Kgs 5:1-9:9 | form | Solomon's temple building from preparations to dedication and divine response; MT 5:15-9:9"
    - "Exod 25-31 | form | Divine instructions and revealed plan for the tabernacle"
    - "Exod 35-40 | form | Execution, completion, and indwelling of the glory"
    - "2Sam 7:1-13 | form | King proposes a temple; divine permission is deferred"
    - "1Kgs 6:37-38 | form | Dated foundation and completion in named months; seven years"
    - "1Kgs 8:62-66 | form | Dedication with sacrifices and a feast of seven plus seven days"
    - "Ezra 3:10-13 | form | Foundation laying with music, shouting, and weeping"
    - "Ezra 6:14-18 | form | Completion and dedication of the Second Temple"
    - "Hag 1:1-2:9 | form | Prophetic call to rebuild; future glory of the house"
    - "Zech 4:7-10 | practice? | 'Top stone' and stone in Zerubbabel's hand; Mesopotamian foundation rites proposed"
    - "Ezek 40-48 | form | Visionary temple plan and measurements"
  related: [gudea-cylinders, baal-cycle, statue-of-gudea, temple-as-cosmos, tabernacle, esarhaddon-prisms, solomon, divine-rest]
  wikipedia: null
  image: Ashurbanipal stele carrying basket
  author_notes:
    - Hurowitz's comparative study is the standard treatment of the pattern. Key comparanda are Gudea Cylinders A and B, the building of Baal's palace (KTU 1.4 V-VII), and Assyrian and Neo-Babylonian royal building inscriptions (Tiglath-pileser I, Esarhaddon, Nabopolassar, Nebuchadnezzar II).
    - Note royal ideology. Temple building legitimates kingship and follows victory and rest (2 Sam 7; 1 Kgs 5:3-5).
    - The Mesopotamian practice of restoring temples on their original foundations, with laments at demolition and rebuilding, is relevant to Ezra 3 and Haggai and Zechariah (Boda and Novotny, eds.). The kalû-rite proposals for Zech 4 should be marked as debated.
    - The account in 1 Kgs 5-9 combines building report, archival details, and Deuteronomistic prayer. Do not treat it as a single genre piece.
  sources_to_check:
    - Victor Avigdor Hurowitz, I Have Built You an Exalted House (JSOTSup 115, 1992)
    - Mark J. Boda and Jamie Novotny, eds., From the Foundations to the Crenellations (AOAT 366, 2010)

- id: name-theology
  aliases: [Shem theology, "to place his name there"]
  cultures: [hebrew, canaanite, mesopotamian]
  scope: >-
    The Deuteronomic and Deuteronomistic formulas by which YHWH chooses a place "to put his
    name there" or "to make his name dwell there", their relation to Akkadian šuma šakānu, and
    the debate over whether they express an abstract theology of divine presence or a claim
    of ownership.
  passages:
    - "Deut 12:5 | language | The place YHWH will choose 'to put his name there' (lāśûm šĕmô šām)"
    - "Deut 12:11 | language | 'To make his name dwell there' (lĕšakkēn šĕmô šām)"
    - "Deut 14:23-24 | language | Tithes eaten at the place chosen 'to make his name dwell'"
    - "Deut 16:2, 6, 11 | language | Passover and Weeks at the place of the name"
    - "Exod 20:24 | concept | 'In every place where I cause my name to be remembered'"
    - "2Sam 7:13 | concept | A house 'for my name'"
    - "1Kgs 8:16, 29 | concept | Temple as the place where 'my name shall be', God hearing from heaven"
    - "1Kgs 9:3 | concept | 'Putting my name there forever'"
    - "2Kgs 21:4, 7 | concept | Manasseh's altars and Asherah image in the house of the name"
    - "Jer 7:12 | concept | Shiloh, 'where I made my name dwell at first'"
  related: [amarna-letters, cult-reforms-archaeology, josiah, temple-building-accounts, aniconism, shiloh, jerusalem]
  wikipedia: null
  image: null
  author_notes:
    - Abdi-Heba of Jerusalem writes that the king "has placed his name in the land of Jerusalem forever" (EA 287:60-63; cf. EA 288). This is the classic Akkadian parallel to šuma šakānu, a phrase also used of inscribed monuments claiming territory or a building.
    - The older view (von Rad; Weinfeld; Mettinger) reads Name theology as a deliberate "demythologizing" correction of the idea that YHWH dwells physically in the temple. Richter, The Deuteronomistic History and the Name Theology (BZAW 318, 2002), argues that the idiom is a formula of ownership and conquest. Present both. Wilson, Out of the Midst of the Fire (1995), also challenges the abstraction thesis.
    - Connect the formula to centralization (Deut 12) and to the question of whether "the place" meant a single sanctuary from the start.

- id: cult-images
  aliases: [idols, cult statues]
  cultures: [ane]
  scope: >-
    The making, care, transport, capture, and theology of divine statues in Mesopotamia, Egypt,
    and the Levant, and the biblical polemic against "idols". Covers godnapping and the return
    of statues. The induction rituals and Israel's aniconic tradition have their own entries.
  passages:
    - "Isa 44:9-20 | polemic | Parody of the manufacture of a cult image from a tree"
    - "Isa 40:18-20 | polemic | Craftsmen fashion an image that will not topple"
    - "Isa 46:1-7 | polemic | Bel and Nebo carried on beasts; images borne versus YHWH who carries"
    - "Jer 10:1-16 | polemic | Images like scarecrows that must be carried"
    - "Ps 115:4-8 | polemic | Images with mouths, eyes, and ears that do not function"
    - "Hab 2:18-19 | polemic | No breath in the overlaid image"
    - "1Sam 5:1-5 | practice | Ark placed beside Dagon's statue; Dagon falls"
    - "Jer 48:7 | practice | Chemosh to go into exile with his priests: captured divine statues"
    - "2Chr 25:14 | practice | Amaziah brings home and worships the gods of Seir"
    - "Dan 3:1-18 | practice | Nebuchadnezzar's golden image (ṣĕlēm)"
    - "Bel 1-22 | polemic | Daily food of Bel's statue exposed as eaten by priests"
    - "Acts 17:29 | polemic | Deity not like gold, silver, or stone shaped by human art"
  related: [mouth-washing-and-opening, aniconism, care-and-feeding-of-the-gods, marduk, nabu, tablet-of-shamash, bull-iconography, image-of-god]
  wikipedia: Cult image
  image: Assyrian soldiers carrying statues of gods relief
  author_notes:
    - In Mesopotamian theology the statue was a locus of divine presence. It was "born in heaven", consecrated by ritual, and treated as a living being, but not simply identical with the god. Note that the biblical parodies (Isa 44; Jer 10) deliberately collapse this distinction.
    - Godnapping and return were standard imperial practice. Examples are Marduk's statue taken to Hatti and Elam, Assyrian removal of divine images, and the Cyrus Cylinder's account of returning gods to their shrines. This is relevant to 1 Sam 4-6 and Isa 46.
    - Cult statues were made of a wooden core overlaid with precious metal and clothed (cf. Isa 30:22; Jer 10:9). Give the material realities.
    - Avoid the term "idolatry" in descriptive sections, or explain it as an insider polemical category.
  sources_to_check:
    - Michael B. Dick, ed., Born in Heaven, Made on Earth (1999)

- id: aniconism
  cultures: [hebrew, israelite, judahite, arabian]
  scope: >-
    The absence or rejection of anthropomorphic or theriomorphic images of YHWH in Israelite
    religion: its biblical formulations, its development, the archaeological evidence (standing
    stones, empty throne), and comparative aniconic traditions in the West Semitic world.
  passages:
    - "Exod 20:4-6 | concept | Prohibition of making a carved image (pesel) or any likeness"
    - "Deut 4:12, 15-19 | concept | No form seen at Horeb, only a voice; hence no image"
    - "Deut 5:8-10 | concept | Image prohibition in the Deuteronomic Decalogue"
    - "Exod 20:23 | concept | No gods of silver or gold alongside YHWH"
    - "Exod 34:17 | concept | No cast (massēkâ) gods"
    - "Exod 32:1-6 | polemic | Golden calf as forbidden image"
    - "1Kgs 12:28-29 | polemic | Jeroboam's calves at Bethel and Dan"
    - "1Sam 4:4 | concept | YHWH enthroned on the cherubim over the ark: an 'empty-space' throne"
    - "Gen 28:18-22 | practice | Standing stone at Bethel as 'house of God'"
    - "Isa 40:18, 25 | concept | 'To whom then will you liken God?'"
  related: [cult-images, massebot, cherub-throne, bull-iconography, ark-of-the-covenant, arad, nabataeans, judean-pillar-figurines]
  wikipedia: Aniconism in Judaism
  image: Arad sanctuary standing stone Israel Museum
  author_notes:
    - Mettinger distinguishes de facto (tolerant) from programmatic aniconism, and material aniconism (standing stones, empty throne) from empty-space aniconism. This is the standard framework (No Graven Image?, 1995).
    - Note the minority but serious argument that the Jerusalem temple once housed an anthropomorphic statue of YHWH (e.g. Niehr). Present it as debated, not established.
    - Nabataean and other Arabian betyls are often cited as comparative West Semitic aniconism.
    - Distinguish the image prohibition (no image of YHWH) from the prohibition of other gods' images. The two are fused in the Decalogue but have different histories.

- id: mouth-washing-and-opening
  aliases: [mīs pî, pīt pî, Opening of the Mouth]
  cultures: [babylonian, assyrian, egyptian]
  scope: >-
    The Mesopotamian mīs pî ("washing of the mouth") and pīt pî ("opening of the mouth")
    rituals that animated or purified cult statues, and the Egyptian Opening of the Mouth
    ceremony for statues and mummies, as background to biblical polemic against man-made gods.
  passages:
    - "Isa 44:9-20 | polemic | Craftsmen's manufacture stressed; cf. ritual denial of human manufacture in mīs pî"
    - "Jer 10:3-5, 9 | polemic | Image made by craftsmen cannot speak"
    - "Ps 115:4-8 | polemic | 'They have mouths, but do not speak'"
    - "Ps 135:15-18 | polemic | No breath in the mouths of images"
    - "Hab 2:18-19 | polemic | Image overlaid with gold and silver, with no breath in it"
    - "Isa 6:5-7 | practice? | Purification of the prophet's 'unclean lips'; comparison with mouth-washing rites proposed"
  related: [cult-images, care-and-feeding-of-the-gods, aniconism, book-of-the-dead, mummification, image-of-god]
  wikipedia: Opening of the mouth ceremony
  image: Opening of the mouth ceremony Hunefer papyrus
  author_notes:
    - The Mesopotamian ritual uses incantations in which the craftsmen swear they did not make the statue, and their hands are symbolically cut off with a tamarisk sword. Isa 44 inverts exactly this, which makes the polemic especially pointed.
    - The ritual texts are known mainly from first-millennium Nineveh and Babylon (Walker and Dick, 2001). Do not retroject details onto earlier periods without evidence.
    - The Egyptian Opening of the Mouth (wpt-r) animated statues and mummies with adze-like instruments. It is distinct from the Mesopotamian rite and should be treated separately.
    - Hurowitz (HUCA 60, 1989) compared Isa 6:5-7 with Akkadian mouth-purification. Present this as a proposal.
  sources_to_check:
    - Christopher Walker and Michael Dick, The Induction of the Cult Image in Ancient Mesopotamia (SAALT 1, 2001)

- id: care-and-feeding-of-the-gods
  cultures: [ane, babylonian, egyptian, hittite]
  scope: >-
    Daily temple service in which cult images were fed, clothed, washed, and entertained,
    especially in Mesopotamia and Egypt, and the biblical traces of this idiom (sacrifices as
    God's "food", the table and bread of the Presence) alongside its critique.
  passages:
    - "Ps 50:12-13 | polemic | 'If I were hungry, I would not tell you... Do I eat the flesh of bulls?'"
    - "Deut 32:37-38 | polemic | Gods 'who ate the fat of their sacrifices and drank the wine of their libations'"
    - "Bel 1-22 | polemic | Bel's daily provisions exposed as eaten by the priests"
    - "Lev 3:11, 16 | language | Well-being offering as 'food' (leḥem) by fire to YHWH"
    - "Lev 21:6, 8 | language | Priests offer 'the food of their God'"
    - "Num 28:2 | language | 'My offering, the food for my offerings by fire'"
    - "Gen 8:21 | concept | YHWH smells the pleasing odour (rêaḥ nîḥōaḥ)"
    - "Exod 25:30 | practice | Bread of the Presence regularly set on the table"
    - "Lev 24:5-9 | practice | Twelve loaves set out each sabbath and eaten by priests"
    - "Ezek 44:7 | language | 'When you offer to me my food, the fat and the blood'"
    - "Mal 1:7, 12 | language | 'The LORD's table'"
    - "Isa 65:11 | practice | Table set for Gad (Fortune) and cups for Meni (Destiny)"
  related: [sacrifice, cult-images, hittite-instructions-temple-officials, mouth-washing-and-opening, divine-rest, queen-of-heaven, incense-and-incense-altars]
  wikipedia: null
  image: null
  author_notes:
    - Oppenheim's chapter "The Care and Feeding of the Gods" (Ancient Mesopotamia, 1964) gave the topic its name. Late Babylonian ritual texts from Uruk prescribe the daily meals of Anu and other gods.
    - The divine meal was redistributed afterwards to the king, priests, and temple personnel. This is relevant to priestly portions in Lev 6-7.
    - The Hebrew Bible keeps food language for offerings while also rejecting the idea that God needs feeding (Ps 50). Present this as tension within the tradition, not a simple Israelite-versus-pagan contrast.
    - The Hittite Instructions for Temple Officials stress the purity of those preparing the gods' bread. This is a useful comparison for priestly purity rules.

- id: divine-warrior
  cultures: [ane, ugaritic, assyrian]
  scope: >-
    The depiction of a god as warrior who fights for his people, marches out with storm
    phenomena, and returns as king, in ancient Near Eastern texts and in biblical hymns,
    narratives, and prophetic oracles.
  passages:
    - "Exod 15:1-18 | concept | 'YHWH is a warrior'; victory at the sea and procession to the sanctuary"
    - "Judg 5:4-5 | imagery | YHWH marches from Seir; earth trembles, mountains quake"
    - "Judg 5:20 | imagery | Stars fight from heaven"
    - "Deut 33:2-3, 26-29 | imagery | YHWH comes from Sinai and Seir and rides the heavens to help"
    - "Ps 18:7-15 | imagery | Storm theophany: smoke, fire, thunder, arrows of lightning; MT 18:8-16"
    - "Ps 68:7-8, 17 | imagery | God marches through the wilderness with myriads of chariots; MT 68:8-9, 18"
    - "Hab 3:3-15 | imagery | God comes from Teman with Deber and Resheph in attendance"
    - "Ps 24:7-10 | concept | 'YHWH, strong and mighty, mighty in battle' enters the gates"
    - "Isa 59:15-20 | imagery | YHWH puts on righteousness as a breastplate"
    - "Isa 63:1-6 | imagery | Warrior returns from Edom with garments stained from treading"
    - "Zech 14:3-5 | imagery | YHWH fights against the nations on the Mount of Olives"
    - "Josh 10:11-14 | concept | YHWH fights for Israel with hailstones"
    - "Rev 19:11-16 | imagery | Rider on the white horse judges and makes war"
  related: [baal, chaoskampf, cloud-rider, herem, conquest-accounts-and-war-rhetoric, mesha-stele, smiting-the-enemy-motif, resheph]
  wikipedia: null
  image: Ashur archer in winged disk relief
  author_notes:
    - Cross (Canaanite Myth and Hebrew Epic, 1973) and Miller (The Divine Warrior in Early Israel, 1973) set the classic framework of the march, the convulsion of nature, victory, and kingship and temple. Note the Ugaritic Baal background.
    - Ancient Near Eastern royal inscriptions routinely credit victory to the god (Ashur "goes before" the king; Chemosh in the Mesha Stele). Present Israel's divine war as part of this shared idiom.
    - Note that the motif is later turned against Israel itself (Isa 63; Lam 2) and becomes eschatological (Zech 14; Rev 19).
    - The institution of "holy war" (von Rad) is now widely doubted. Prefer "divine war" or "YHWH war".

- id: cloud-rider
  aliases: [rider on the clouds]
  cultures: [ugaritic, canaanite]
  scope: >-
    The portrayal of YHWH as riding on clouds, winds, or cherubim, and its background in the
    Ugaritic epithet of Baal, rkb ʿrpt ("Rider of the Clouds"), and in Near Eastern storm-god
    imagery. Includes the Danielic "one like a son of man" coming with the clouds.
  passages:
    - "Ps 68:4 | language? | rōkēb bāʿărābôt, 'rider on the clouds' or 'in the steppes'; cf. Ugaritic rkb ʿrpt; MT 68:5"
    - "Ps 68:33 | imagery | 'Rider in the heavens, the ancient heavens'; MT 68:34"
    - "Deut 33:26 | imagery | God rides through the heavens and the skies"
    - "Ps 18:10-11 | imagery | Rode on a cherub, flew on the wings of the wind; MT 18:11-12"
    - "Ps 104:3 | imagery | Clouds as chariot, riding on the wings of the wind"
    - "Isa 19:1 | imagery | YHWH rides on a swift cloud to Egypt"
    - "Nah 1:3 | imagery | Clouds are the dust of his feet"
    - "Dan 7:13 | imagery? | One like a human being comes with the clouds; Baal-El background proposed"
    - "Mark 14:62 | imagery | Son of Man coming with the clouds of heaven"
  related: [baal, baal-cycle, divine-warrior, cherub-throne, ezekiel-throne-chariot, composite-beasts-daniel, hadad-rimmon]
  wikipedia: null
  image: Baal with thunderbolt stele Louvre
  author_notes:
    - rkb ʿrpt is a standing epithet of Baal in the Ugaritic texts (e.g. KTU 1.2 IV 8, 29). Most scholars see YHWH's assumption of this role as part of Israel's absorption of storm-god imagery and as implicitly polemical.
    - The reading in Ps 68:4 is debated. MT ʿărābôt usually means "steppes", and many emend or explain it as a variant of ʿrpt. Mark it as contested.
    - The proposal (Emerton; Collins) that Dan 7:9-14 draws on the Canaanite pairing of El (Ancient of Days) and Baal (cloud rider) is widely discussed but not universally accepted.

- id: divine-wings
  aliases: [shadow of your wings]
  cultures: [egyptian, ane]
  scope: >-
    Biblical images of God's protective wings and their background in winged deities,
    protective goddesses, winged sun discs, and the cherubim whose wings overshadowed the ark.
  passages:
    - "Exod 19:4 | imagery | 'I bore you on eagles' wings'"
    - "Deut 32:11 | imagery | Eagle hovering over its young and bearing them on its pinions"
    - "Ruth 2:12 | imagery | Refuge under YHWH's wings (kĕnāpāyw)"
    - "Ps 17:8 | imagery | 'Hide me in the shadow of your wings'"
    - "Ps 36:7 | imagery | Refuge in the shadow of your wings, in a temple context; MT 36:8"
    - "Ps 57:1 | imagery | Refuge in the shadow of your wings; MT 57:2"
    - "Ps 61:4 | imagery | Abiding in your tent, refuge under your wings; MT 61:5"
    - "Ps 91:4 | imagery | Covered with his pinions, under his wings"
    - "Exod 25:20 | realia | Cherubim spread their wings over the mercy seat"
    - "Mal 4:2 | imagery | Sun of righteousness with healing in its wings; MT 3:20"
    - "Matt 23:37 | imagery | Hen gathering her brood under her wings"
  related: [winged-sun-disk, cherubim, cherub-throne, lmlk-seal-impressions, egyptian-kingship, ark-of-the-covenant]
  wikipedia: null
  image: Isis winged Tutankhamun canopic shrine
  author_notes:
    - Two main explanations compete. One reads the image as bird imagery (Deut 32:11; Matt 23:37), the other as an allusion to the temple cherubim (Ps 36; 61 pair wings with temple and tent). Keel and others draw especially on Egyptian protective winged goddesses. Present both.
    - Egyptian iconography of Isis and Nephthys, the vulture goddess Nekhbet, and the winged sun disc above temple doorways is the richest comparative material. Levantine ivories and seals adopted it.
    - Do not reduce the image to one source. Several image traditions converge.

- id: winged-sun-disk
  aliases: [winged sun, winged disc]
  cultures: [egyptian, assyrian, persian, judahite]
  scope: >-
    The winged sun disc, an emblem of divine and royal protection in Egypt that spread across
    the Near East (Assyria, Persia, the Levant), and its appearance on Judahite royal seals. The
    entry covers its relevance to biblical solar language for YHWH.
  passages:
    - "Mal 4:2 | imagery | 'Sun of righteousness shall rise, with healing in its wings'; MT 3:20"
    - "Ps 84:11 | imagery | 'YHWH God is a sun and shield'; MT 84:12"
    - "2Kgs 23:11 | practice | Josiah removes horses and chariots dedicated to the sun"
    - "Ezek 8:16 | practice | Men in the temple court bowing to the sun"
    - "Ps 19:4-6 | imagery | Sun's tent and course; MT 19:5-7"
    - "Deut 4:19 | polemic | Warning against worshipping sun, moon, and stars"
  related: [lmlk-seal-impressions, hezekiah-bulla, shamash, divine-wings, egyptian-kingship, persia, light-of-the-face, host-of-heaven]
  wikipedia: Winged sun
  image: Hezekiah bulla winged sun
  author_notes:
    - The emblem appears on Hezekiah's royal bulla and on the two-winged LMLK stamp type. Its adoption in late 8th-century Judah is usually read as royal Egyptianizing iconography, though some scholars argue for solar YHWH symbolism.
    - In Assyria a figure in a winged disc is often identified as Ashur (sometimes Shamash). The Persian figure in a winged disc is widely, but not universally, identified with Ahura Mazda. Keep the identification hedged.
    - Taylor (Yahweh and the Sun, 1993) argues for a strong solar dimension in Judahite Yahwism. Many reviewers judged that thesis overstated. Use it with caution.

- id: light-of-the-face
  aliases: [shining face, lifting up the face]
  cultures: [ane, egyptian, canaanite]
  scope: >-
    The idiom of a god's or king's shining face as an expression of favour and presence,
    together with "hiding" or "lifting up" the face, in ancient Near Eastern royal and
    religious language and in the Priestly Blessing and the Psalms.
  passages:
    - "Num 6:24-26 | language | 'YHWH make his face to shine upon you... lift up his countenance'"
    - "Ps 4:6 | language | 'Let the light of your face shine on us'; MT 4:7"
    - "Ps 31:16 | language | 'Let your face shine upon your servant'; MT 31:17"
    - "Ps 67:1 | language | Priestly Blessing echoed in prayer; MT 67:2"
    - "Ps 80:3, 7, 19 | language | Refrain 'let your face shine, that we may be saved'; MT 80:4, 8, 20"
    - "Ps 89:15 | language | Walking in the light of your face; MT 89:16"
    - "Prov 16:15 | imagery | 'In the light of a king's face there is life'"
    - "Dan 9:17 | language | 'Let your face shine upon your desolated sanctuary'"
    - "Ps 13:1 | language | 'How long will you hide your face from me?'; MT 13:2"
  related: [ketef-hinnom-amulets, amarna-letters, winged-sun-disk, shamash, prayer-postures, egyptian-kingship]
  wikipedia: Priestly Blessing
  image: Ketef Hinnom amulet
  author_notes:
    - In the Amarna letters, Levantine vassals address Pharaoh as the sun whose face brings life (e.g. Abimilki of Tyre, EA 147). Akkadian idioms of a "bright face" (pānū namrūtu) express a god's or king's favour. Present these as the closest analogues to Prov 16:15 and the Psalms.
    - The Ketef Hinnom silver amulets (late Iron Age, dating debated) attest a form of the Priestly Blessing outside the Bible.
    - Note the solar overtones of the idiom without assuming a solar cult behind every occurrence.

- id: host-of-heaven
  aliases: [ṣĕbāʾ haššāmayim, astral worship]
  cultures: [assyrian, judahite, ane]
  scope: >-
    The "host of heaven", meaning the stars and astral powers, both as YHWH's heavenly army and
    council and as objects of worship condemned in Deuteronomistic and prophetic texts,
    especially for late Iron Age Judah.
  passages:
    - "Deut 4:19 | polemic | Sun, moon, stars, 'all the host of heaven' allotted to the nations"
    - "Deut 17:3 | polemic | Worship of sun, moon, or host of heaven a capital offence"
    - "2Kgs 17:16 | polemic | Israel worshipped all the host of heaven"
    - "2Kgs 21:3, 5 | practice | Manasseh builds altars for the host of heaven in the temple courts"
    - "2Kgs 23:4-5, 11-12 | practice | Josiah removes vessels and priests of the astral cult and rooftop altars"
    - "Jer 8:2 | practice | Bones spread before the sun, moon, and host they served"
    - "Jer 19:13 | practice | Offerings to the host of heaven on rooftops"
    - "Zeph 1:5 | practice | Bowing on the roofs to the host of heaven"
    - "1Kgs 22:19 | concept | Host of heaven standing beside YHWH's throne"
    - "Isa 40:26 | polemic | YHWH calls the stars by name and numbers their host"
    - "Job 38:7 | concept | Morning stars and heavenly beings (bĕnê ʾĕlōhîm) sing at creation"
  related: [divine-council, astrology, sakkut-and-kaiwan, queen-of-heaven, shamash, sin-moon-god, constellations, manasseh]
  wikipedia: Heavenly host
  image: null
  author_notes:
    - The older view that Assyria imposed astral cults on vassal Judah has been widely rejected (Cogan, Imperialism and Religion, 1974; McKay, 1973). Most now see Assyrian-period astralization of Levantine religion as cultural influence rather than imposition (Keel and Uehlinger, Gods, Goddesses, and Images of God, 1998).
    - Note the iconographic evidence from Iron IIC seals (crescent moon of Harran, stars, astral symbols).
    - The host as YHWH's army and council (1 Kgs 22:19; "YHWH of hosts") and the host as forbidden objects of worship belong to the same concept. Avoid treating them as unrelated.

- id: constellations
  cultures: [babylonian, hebrew]
  scope: >-
    The named stars and constellations in the Hebrew Bible (kîmâ, kĕsîl, ʿāš/ʿayiš, mazzālôt,
    mazzārôt), problems of their identification, and the background of Mesopotamian star
    lore and astronomy.
  passages:
    - "Job 9:9 | language | ʿāš, kĕsîl, kîmâ, and the 'chambers of the south' made by God"
    - "Job 38:31-33 | language | Binding the Pleiades (kîmâ), loosing Orion (kĕsîl), leading out mazzārôt, guiding ʿayiš"
    - "Amos 5:8 | language | The maker of the Pleiades and Orion"
    - "Isa 13:10 | language | Stars and their 'constellations' (kĕsîlêhem) withhold light"
    - "2Kgs 23:5 | practice | Offerings to sun, moon, the mazzālôt, and the host of heaven"
    - "Gen 15:5 | imagery | Abraham told to count the stars"
  related: [astrology, host-of-heaven, enuma-anu-enlil, nimrod, cosmology]
  wikipedia: MUL.APIN
  image: MUL.APIN tablet British Museum
  author_notes:
    - Standard identifications are kîmâ as the Pleiades and kĕsîl ("fool", or a giant) as Orion. ʿāš/ʿayiš is uncertain (Ursa Major, Hyades/Aldebaran, and other proposals). Mazzārôt (Job 38:32) and mazzālôt (2 Kgs 23:5) are often linked to Akkadian manzaltu/manzāzu ("station") and taken as zodiacal constellations or lunar stations. Be clear about the uncertainty.
    - MUL.APIN (early first millennium copies) is the key compendium of Babylonian star lore. The zodiac of twelve equal signs developed in Babylonia around the 5th century BCE, so later than most of these biblical texts.
    - The later identification of Orion with Nimrod is post-biblical and should not be read back into the texts.
  sources_to_check:
    - Hermann Hunger and David Pingree, MUL.APIN (AfO Beiheft 24, 1989)

- id: calendars-and-month-names
  cultures: [hebrew, babylonian, phoenician, jewish]
  scope: >-
    The lunisolar calendars of Israel and its neighbours: early Canaanite/Phoenician month
    names (Abib, Ziv, Ethanim, Bul), ordinal numbering of months, the adoption of Babylonian
    month names after the exile, intercalation, and the spring and autumn new year. The entry
    also covers the 364-day calendar of some Second Temple groups.
  passages:
    - "Exod 12:2 | practice | This month to be the first of the months (spring reckoning)"
    - "Exod 13:4 | language | 'Month of Abib' (ripening ears of grain)"
    - "Deut 16:1 | language | Passover in the month of Abib"
    - "1Kgs 6:1, 37-38 | language | Ziv as the second month and Bul as the eighth; dates of temple construction"
    - "1Kgs 8:2 | language | Ethanim, the seventh month"
    - "Exod 23:16 | practice | Ingathering 'at the end of the year' (autumn reckoning)"
    - "Exod 34:22 | practice | Ingathering 'at the turn of the year'"
    - "Esth 3:7 | language | Babylonian month names Nisan and Adar"
    - "Neh 1:1 | language | Chislev"
    - "Neh 2:1 | language | Nisan"
    - "Zech 1:7 | language | Shebat, glossed as the eleventh month"
  related: [gezer-calendar, new-moon, festivals-agricultural, hemerologies, jubilees, first-enoch, akitu-festival, elephantine-papyri]
  wikipedia: Hebrew calendar
  image: Gezer calendar
  author_notes:
    - The early month names (Abib, Ziv, Ethanim, Bul) are paralleled in Phoenician inscriptions. Ordinal numbering predominates in Priestly texts. Babylonian names (Nisan, Sivan, Elul, Tishri, Chislev, Tebeth, Shebat, Adar, and others) appear only in exilic and postexilic books.
    - Whether pre-exilic Israel used an autumn or a spring new year is debated (Exod 23:16; 34:22 versus Exod 12:2). Present the evidence, including the possibility of both civil and cultic reckonings.
    - Babylonian intercalation (a second Adar or Elul) became regularized in the Persian period. The Elephantine double-dated papyri are key evidence for Jewish use of the Babylonian calendar.
    - The 364-day calendar of 1 Enoch 72-82, Jubilees, and Qumran texts belongs to Second Temple debates. Mention it with cross-references.
  sources_to_check:
    - Mark E. Cohen, The Cultic Calendars of the Ancient Near East (1993)
    - Sacha Stern, Calendar and Community (2001)
    - Richard A. Parker and Waldo H. Dubberstein, Babylonian Chronology 626 B.C.-A.D. 75 (1956)

- id: sabbath
  aliases: [Shabbat, šabbāt]
  cultures: [hebrew, babylonian, jewish]
  scope: >-
    The seventh-day Sabbath in the Hebrew Bible and early Judaism, viewed against its
    proposed ancient Near Eastern antecedents (Akkadian šapattu, the full-moon day;
    hemerological "evil days") and its earliest extrabiblical attestations. The entry covers
    the biblical development of Sabbath law and rationale but leaves the sabbatical year to
    its own entry.
  passages:
    - "Gen 2:2-3 | language? | God 'ceased' (šābat) and hallowed the seventh day; relation of šbt and šabbāt to Akkadian šapattu debated"
    - "Exod 16:22-30 | practice | Manna: double portion on the sixth day; first use of šabbāt (v. 23); stay in place (v. 29)"
    - "Exod 20:8-11 | practice | 'Remember' the sabbath; no mĕlāʾkâ for household, slaves, animals, alien; creation rationale"
    - "Deut 5:12-15 | practice | 'Observe' the sabbath; rest of slaves grounded in the exodus"
    - "Exod 23:12 | practice | Seventh-day cessation (verb šbt only) so that animals, slave, and alien may rest"
    - "Exod 34:21 | practice | Seventh-day cessation even in ploughing and harvest"
    - "Exod 31:12-17 | concept | Sabbath as perpetual covenant sign; death penalty for profanation"
    - "Exod 35:2-3 | practice | No kindling of fire in dwellings on the sabbath"
    - "Num 15:32-36 | practice | Wood-gatherer executed for sabbath violation"
    - "Lev 23:3 | practice | Sabbath as šabbat šabbātôn and holy convocation heading the festival calendar"
    - "Lev 23:11, 15-16 | language | 'Day after the sabbath' and seven šabbātôt before Weeks; meaning disputed in antiquity"
    - "2Kgs 4:23 | practice? | New moon and sabbath paired as visiting days; cited for a pre-exilic full-moon sabbath"
    - "Amos 8:5 | practice? | Trade halted on new moon and sabbath; same pairing"
    - "Hos 2:11 | practice? | Festivals, new moons, and sabbaths ended; MT 2:13"
    - "Isa 1:13 | practice? | New moon and sabbath in prophetic critique of cult"
    - "2Kgs 11:5-9 | practice | Temple guard rotations change on the sabbath"
    - "Isa 56:2-7 | concept | Sabbath-keeping marks foreigners and eunuchs joined to YHWH"
    - "Isa 58:13-14 | practice | Refrain from pursuing one's own affairs on the sabbath"
    - "Jer 17:19-27 | practice | No carrying of burdens through Jerusalem's gates or out of houses"
    - "Ezek 20:12-24 | concept | Sabbaths given as a sign and profaned in the wilderness"
    - "Neh 10:31 | practice | Pledge not to buy from foreign traders on the sabbath; MT 10:32"
    - "Neh 13:15-22 | practice | Nehemiah halts sabbath treading, loading, and trade, and shuts the gates"
    - "Jub 50:6-13 | practice | Expanded list of prohibited sabbath activities"
  related: [seven-day-patterns, hemerologies, new-moon, sabbatical-year, divine-rest, mesad-hashavyahu-ostracon, elephantine-papyri, al-yahudu-tablets]
  wikipedia: Biblical Sabbath
  image: Mesad Hashavyahu ostracon
  author_notes:
    - Distinguish the verb šābat ("cease, stop") from the noun šabbāt. Gen 2:2-3, Exod 23:12, and Exod 34:21 use only the verb. The noun first appears in Exod 16:23. Exod 20:11 uses nwḥ, Exod 31:17 adds npš ("be refreshed"), and šabbātôn is a related intensive noun. Keep the vocabulary of cessation, rest, and refreshment distinct.
    - Akkadian šapattu (šabattu) is the 15th day of the month, the full moon, glossed lexically as ūm nūḫ libbi ("day of the heart's rest", i.e. the god's appeasement). It is not a human rest day and not part of a seven-day cycle. An etymological link to šabbāt is possible but unproven. The hypothesis that pre-exilic šabbāt was the full-moon day, paired with the new moon (2 Kgs 4:23; Amos 8:5; Hos 2:11; Isa 1:13), and was later fused with the seventh-day cessation of Exod 23:12 and 34:21 (Meinhold; more recently Grund, Die Entstehung des Sabbats, 2011) is a serious but minority position. Present it neutrally as debated.
    - The Mesopotamian hemerological "evil days" (7th, 14th, 19th, 21st, 28th of certain months) restricted specific persons (king, diviner, physician). They reset with each lunar month and are not called šapattu. No ancient Near Eastern parallel is known for a continuous seven-day cycle independent of the month. Hallo's "contrastive approach" (HUCA 48, 1977) is a good model.
    - Biblical sabbath prohibitions are few and specific. They are kindling fire (Exod 35:3), gathering wood (Num 15:32), gathering and preparing manna (Exod 16:23-29), leaving one's place (Exod 16:29), ploughing and harvest (Exod 34:21), carrying burdens (Jer 17:21-22), trade (Amos 8:5; Neh 10:31; 13:15-20), and pursuing one's own affairs (Isa 58:13). The general term is mĕlāʾkâ. Do not retroject the Mishnah's 39 main categories (m. Shabb. 7:2) or the expanded lists of Jubilees 50 and the Damascus Document onto earlier texts.
    - The earliest extrabiblical evidence is debated. The Meṣad Ḥashavyahu ostracon (late 7th c.) has "before šbt", which may mean "before the sabbath" or "before stopping". The Elephantine ostraca (5th c.) clearly mention the šbh. Personal names such as Shabbethai (Ezra 10:15; Neh 8:7; 11:16) and Babylonian Šabbatāya also bear on the question.
  sources_to_check:
    - Bezalel Porten and Ada Yardeni, Textbook of Aramaic Documents from Ancient Egypt, vol. 4 (1999)
    - Alasdair Livingstone, Hemerologies of Assyrian and Babylonian Scholars (CUSAS 25, 2013)
    - 'William W. Hallo, "New Moons and Sabbaths: A Case-Study in the Contrastive Approach," HUCA 48 (1977)'

- id: seven-day-patterns
  aliases: [the week, seven-day unit]
  cultures: [ane, ugaritic, mesopotamian]
  scope: >-
    The literary and ritual use of seven-day units (six days followed by a climactic seventh)
    in Ugaritic and Mesopotamian literature and in biblical narrative and cult, and the
    emergence of the continuous seven-day week.
  passages:
    - "Gen 1:1-2:3 | form | Six days of work and a climactic seventh day"
    - "Gen 7:4, 10 | form | Seven days before the flood"
    - "Gen 8:10-12 | parallel | Dove sent out at seven-day intervals; cf. Gilgamesh XI"
    - "Exod 24:16 | form | Cloud covers Sinai six days; YHWH calls on the seventh"
    - "Josh 6:3-4, 15 | form | Six days' circuit of Jericho, sevenfold on the seventh"
    - "Exod 29:35-37 | practice | Seven-day ordination and altar consecration"
    - "1Kgs 8:65-66 | practice | Dedication feast of seven days and seven days"
    - "Lev 23:6, 34-36 | practice | Seven-day festivals of Unleavened Bread and Booths"
    - "Gen 29:27-28 | practice | Bride's 'week' (šābûaʿ) of wedding festivities"
    - "Judg 14:12, 17 | practice | Seven-day wedding feast"
    - "Gen 50:10 | practice | Seven days of mourning"
    - "Job 2:13 | practice | Friends sit silent seven days and nights"
    - "Ezek 3:15-16 | form | Prophet sits stunned seven days before the word comes"
  related: [sabbath, baal-cycle, gilgamesh-epic, gudea-cylinders, aqhat-epic, kirta-epic, temple-building-accounts, festivals-agricultural]
  wikipedia: Week
  image: null
  author_notes:
    - Ugaritic epic regularly uses a six-plus-one day scheme. Fire burns in Baal's palace six days and is done on the seventh (KTU 1.4 VI 22-33). Danel's incubation and Kirta's march use the same scheme (Loewenstamm, IEJ 15, 1965). In Gilgamesh XI the storm lasts six days and seven nights, and the dove is sent out on the seventh day after grounding.
    - Gudea's dedication of the Eninnu includes seven days of festivity in which "the slave woman was equal to her mistress" (verify passage in Statue B and Cylinder B). This is a frequently cited analogue to the social dimension of Exod 20:10 and Deut 5:14.
    - Distinguish the literary or ritual seven-day unit from the continuous week detached from the lunar month. The latter appears first in Israel. The planetary week is Hellenistic-Roman.

- id: hemerologies
  aliases: [menologies, lucky and unlucky days, calendars of lucky and unlucky days]
  cultures: [babylonian, assyrian, egyptian]
  scope: >-
    Mesopotamian hemerologies and menologies, scholarly texts listing favourable and
    unfavourable days and months for particular actions, and Egyptian calendars of lucky and
    unlucky days. They are significant for biblical studies as background to the selection of
    propitious days and in debates over the origins of the Sabbath.
  passages:
    - "Esth 3:7 | practice | Pur cast before Haman to fix a propitious day and month"
    - "Exod 20:8-11 | concept? | Seventh-day cessation compared and contrasted with restrictions on 'evil days' 7, 14, 19, 21, 28"
    - "Lev 19:26 | language? | ʿônēn, sometimes understood as 'observing times'"
    - "Deut 18:10, 14 | language? | mĕʿônēn among forbidden diviners; 'observer of times' interpretation"
    - "Job 3:1-10 | concept? | Job curses the day of his birth as if to strike it from the calendar"
  related: [sabbath, seven-day-patterns, calendars-and-month-names, lots-and-cleromancy, divination, astrology, library-of-ashurbanipal]
  wikipedia: Hemerology
  image: Cairo Calendar papyrus lucky unlucky days
  author_notes:
    - The ritual hemerology for certain months (including an intercalary Elul and Marchesvan) labels days 7, 14, 19, 21, and 28 as ūmu lemnu ("evil day"). On these days the king must avoid cooked meat and changing his garment, the diviner may not give a decision, and the physician may not touch the sick. Day 19 is the 49th day counted from the previous month's start. These are restrictions on office-holders, not a general rest day.
    - Copies range from the Middle Babylonian period to Late Babylonian times. The major Neo-Assyrian collections come from Nineveh. No single date can be given, so the date field is left blank.
    - The Egyptian Calendar of Lucky and Unlucky Days (the Cairo Calendar, New Kingdom) is a separate tradition based on mythological events. Present it alongside, not merged with, the Mesopotamian texts.
    - The KJV-style rendering of ʿônēn as "observer of times" reflects early Jewish interpretation and is not secure. Mark it as such.
  sources_to_check:
    - Alasdair Livingstone, Hemerologies of Assyrian and Babylonian Scholars (CUSAS 25, 2013)
    - René Labat, Hémérologies et ménologies d'Assur (1939)

- id: new-moon
  aliases: [ḥōdeš, Rosh Chodesh]
  cultures: [hebrew, babylonian, ugaritic]
  scope: >-
    The new-moon day (ḥōdeš) as a cultic and social occasion in Israel, with its offerings,
    trumpet blasts, feasts, and cessation of trade, and its background in lunar festivals of
    Mesopotamia and Ugarit.
  passages:
    - "1Sam 20:5, 18, 24-27 | practice | New-moon royal meal over two days; David's absence noticed"
    - "2Kgs 4:23 | practice | Neither new moon nor sabbath: occasions for visiting a man of God"
    - "Amos 8:5 | practice | Grain sales suspended until the new moon is over"
    - "Hos 2:11 | practice | New moons among the festivals YHWH will end; MT 2:13"
    - "Isa 1:13-14 | practice | New moons and appointed feasts rejected without justice"
    - "Isa 66:23 | concept | All flesh to worship 'from new moon to new moon'"
    - "Num 10:10 | practice | Trumpets blown at the beginnings of months"
    - "Num 28:11-15 | practice | New-moon burnt offerings and sin offering"
    - "Ps 81:3 | practice | Shofar at the new moon and at the full moon (keseh); MT 81:4"
    - "Ezek 46:1, 3, 6-7 | practice | Inner gate opened on sabbath and new moon; prince's offerings"
    - "Col 2:16 | practice | New moons and sabbaths in early Christian debate"
  related: [calendars-and-month-names, sabbath, sin-moon-god, hemerologies, festivals-agricultural, ugaritic-texts]
  wikipedia: Rosh Chodesh
  image: null
  author_notes:
    - Mesopotamian lunar festivals (the eššēšu festivals on fixed days of the month in Ur III and Old Babylonian sources) and Ugaritic ritual texts prescribing offerings at the new moon provide the comparative frame.
    - The consistent pairing of new moon and sabbath in pre-exilic texts is central to the debate over the origin of the Sabbath (see sabbath). Cross-reference it rather than repeating it.
    - Ps 81:3 keseh ("full moon"; cf. Prov 7:20) has cognates in Phoenician and Syriac (verify). It is useful evidence for full-moon observance alongside the new moon.

- id: akitu-festival
  aliases: [akītu, Babylonian New Year festival]
  cultures: [babylonian, assyrian, sumerian]
  scope: >-
    The Mesopotamian akītu festival, best known from first-millennium Babylon's Nisannu
    celebrations: processions of divine statues, recitation of Enuma Elish, the king's ritual
    humiliation and reinvestiture, and the gods' journey to the akītu house. The entry also
    covers proposed links to biblical enthronement language.
  passages:
    - "Isa 46:1-2 | polemic | Bel and Nebo, processional gods, bowed down and carried off as burdens"
    - "Isa 45:1 | language? | Cyrus 'whose right hand I have grasped'; cf. the Babylonian king 'taking the hand of Bel'"
    - "Ps 47:5-8 | concept? | God 'has gone up with a shout' and reigns; enthronement-festival hypothesis; MT 47:6-9"
    - "Ps 93:1 | concept? | 'YHWH is king' (YHWH mālāk); Mowinckel's enthronement psalms"
    - "Ps 96:10 | concept? | 'Say among the nations, YHWH is king'"
    - "Ps 97:1 | concept? | 'YHWH is king! Let the earth rejoice'"
    - "Ps 99:1 | concept? | 'YHWH is king; he sits enthroned upon the cherubim'"
    - "Ps 24:7-10 | concept? | Gates lift up their heads for the King of glory; processional entry"
    - "Zech 14:16-17 | concept | Nations go up yearly to worship the King at Booths"
  related: [enuma-elish, marduk, nabu, babylon, etemenanki, royal-ideology, cult-images, nabonidus-chronicle]
  wikipedia: Akitu
  image: Ishtar Gate processional way Pergamon
  author_notes:
    - Akītu festivals are attested from the third millennium in several cities and at different times of year (spring and autumn). The detailed Babylonian Nisannu ritual is known mainly from Seleucid-period tablets. Caution against reconstructing earlier practice wholesale from them.
    - The king's humiliation (the high priest strikes his cheek and removes his insignia before he is reinvested) and the recitation of Enuma Elish on day 4 are the most-cited elements. Note that the Nabonidus Chronicle records years when the festival was not held because the king was absent.
    - Mowinckel's proposed Israelite autumn enthronement festival, built on Ps 47 and 93-99 by analogy with the akītu, is a classic but unproven hypothesis. There is no direct biblical evidence for such a festival, and the translation of YHWH mālāk ("YHWH reigns" or "has become king") is debated.
    - The "dying and rising Marduk" reading of the so-called Marduk Ordeal text, once tied to the akītu, is now rejected. That text is a cultic commentary, not evidence of a resurrection rite.
  sources_to_check:
    - Julye Bidmead, The Akītu Festival (2002)
    - ANET 331-334
    - Marc J. H. Linssen, The Cults of Uruk and Babylon (CM 25, 2004)

- id: festivals-agricultural
  aliases: [pilgrimage festivals]
  cultures: [hebrew, canaanite, ugaritic]
  scope: >-
    Israel's annual festivals tied to the agricultural year (Unleavened Bread, Weeks/Harvest,
    Booths/Ingathering), their calendars in the biblical law codes, and comparative evidence
    from Levantine and Syrian ritual calendars and the Gezer calendar.
  passages:
    - "Exod 23:14-17 | practice | Three annual feasts: Unleavened Bread, Harvest, Ingathering; males appear before YHWH"
    - "Exod 34:18-26 | practice | Parallel festival calendar with Weeks and firstfruits of wheat"
    - "Lev 23:4-44 | practice | Priestly festival calendar with dates, offerings, and booths"
    - "Deut 16:1-17 | practice | Festivals centralized at the chosen place"
    - "Num 28:16-29:39 | practice | Festival offerings by date"
    - "Judg 9:27 | practice | Shechemites' vintage festival (hillûlîm) in their god's temple"
    - "Judg 21:19-21 | practice | Yearly feast of YHWH at Shiloh with dancing in the vineyards"
    - "1Kgs 12:32-33 | practice | Jeroboam's festival in the eighth month"
    - "Deut 26:1-11 | practice | Presentation of firstfruits with a historical credo"
    - "Isa 9:3 | imagery | Joy 'as at the harvest'; MT 9:2"
  related: [gezer-calendar, passover-origins, firstfruits-and-firstborn, emar-texts, calendars-and-month-names, agriculture-and-farming, new-moon, threshing-floors]
  wikipedia: Three Pilgrimage Festivals
  image: Gezer calendar
  author_notes:
    - Present the comparison of the calendars (Exod 23; 34; Deut 16; Lev 23; Num 28-29) as the core evidence for the festivals' development. Covenant Code, Deuteronomic, and Priestly stages are the standard critical framework, though details are debated.
    - Wellhausen's thesis that agricultural festivals were progressively "historicized" (linked to exodus and wilderness) remains influential. Present it as a model, not a fact.
    - Ugaritic ritual texts (e.g. the month calendar in KTU 1.41/1.87) and the Emar zukru festival (Fleming, Time at Emar, 2000) give the best Syro-Levantine comparisons. The Gezer calendar shows the agricultural year in Hebrew.
    - Booths (Sukkot) has the clearest harvest origins. Weeks lacks a historical rationale in the Hebrew Bible.

- id: passover-origins
  aliases: [Pesach, Feast of Unleavened Bread, maṣṣôt]
  cultures: [hebrew, jewish]
  scope: >-
    The origins and development of Passover (pesaḥ) and the Feast of Unleavened Bread
    (maṣṣôt): apotropaic blood rite, family slaughter, centralization, and Second Temple
    practice, with comparative and epigraphic evidence such as the Elephantine Passover letter.
  passages:
    - "Exod 12:1-14 | practice | Lamb slaughtered at twilight on the 14th; blood on doorposts and lintel"
    - "Exod 12:21-23 | practice | Blood applied with hyssop; YHWH will not let the destroyer (mašḥît) enter"
    - "Exod 12:43-49 | practice | Who may eat the Passover; circumcision requirement"
    - "Exod 12:15-20 | practice | Seven days of unleavened bread"
    - "Exod 34:25 | practice | Sacrifice of the Passover not to remain until morning"
    - "Deut 16:1-8 | practice | Passover centralized at the chosen place; meat 'cooked' (bšl)"
    - "2Chr 35:13 | practice | Passover 'cooked (bšl) in fire', harmonizing Exod 12:9 and Deut 16:7"
    - "2Kgs 23:21-23 | practice | Josiah's Passover, unprecedented since the judges"
    - "2Chr 30:1-27 | practice | Hezekiah's Passover in the second month"
    - "Num 9:1-14 | practice | Second Passover for the impure or travelling"
    - "Josh 5:10-12 | practice | Passover at Gilgal and the end of manna"
    - "Ezra 6:19-22 | practice | Passover of the returned exiles"
  related: [elephantine-passover-letter, apotropaic-doorposts-and-thresholds, festivals-agricultural, josiah, demons, firstfruits-and-firstborn, calendars-and-month-names]
  wikipedia: Korban Pesach
  image: Elephantine Passover letter papyrus
  author_notes:
    - Most critical scholars hold that pesaḥ (a family or clan apotropaic slaughter, often linked to pastoral life) and maṣṣôt (an agricultural barley festival) were originally separate and later combined. The "pastoral nomad" origin (Rost) is widely repeated but rests on analogy and should be presented cautiously.
    - The etymology of psḥ ("pass over", "protect", "limp") is uncertain. Present the options.
    - Deuteronomy turns a household rite into a sanctuary sacrifice. 2 Chr 35:13 harmonizes the conflicting cooking instructions of Exod 12:9 (roast, not boiled) and Deut 16:7 (bšl). This is a standard example of inner-biblical exegesis.
    - The Elephantine "Passover letter" (TAD A4.1, 419 BCE) gives instructions for Unleavened Bread on Nisan 15-21. The word "Passover" itself is restored in a lacuna. Some ostraca mention psḥ (verify references).
    - Mesopotamian rites that protected doorways with smeared substances and figurines are comparative background for the blood rite. Do not overstate them as a direct source.
  sources_to_check:
    - TAD A4.1

- id: day-of-atonement-elimination
  aliases: [Yom Kippur, scapegoat, Azazel]
  cultures: [hittite, hurrian, babylonian, hebrew]
  scope: >-
    The Day of Atonement ritual of Lev 16, especially the goat sent to Azazel, and related
    biblical rites of purification and riddance, set against Hittite, Hurrian, Mesopotamian,
    and Eblaite elimination rituals in which impurity or evil is transferred to a carrier and
    sent away.
  passages:
    - "Lev 16:1-34 | practice | Annual purgation of the sanctuary and people"
    - "Lev 16:8-10, 20-22 | parallel | Lots over two goats; sins confessed over one and sent to Azazel in the wilderness"
    - "Lev 16:14-19 | practice | Blood rites purging the sanctuary"
    - "Lev 14:4-7 | parallel | Live bird released into the open field after a skin disease is cured"
    - "Lev 14:49-53 | parallel | Same bird rite for a house"
    - "Zech 5:5-11 | parallel | Wickedness in a basket carried off to Shinar"
    - "1Sam 6:1-9 | parallel? | Philistines send the ark away with guilt offerings to end a plague; cf. Hittite plague rituals"
    - "Lev 23:26-32 | practice | Day of Atonement as šabbat šabbātôn with self-affliction"
    - "Heb 9:6-14 | concept | High priest's annual entry reinterpreted"
  related: [hittite-elimination-rituals, purity-and-impurity, akitu-festival, demons, sacrifice, ebla, lots-and-cleromancy]
  wikipedia: Scapegoat
  image: null
  author_notes:
    - Hittite and Hurrian rituals (e.g. those of Ashella, Uhhamuwa, and Pulisa) send an animal or human substitute, sometimes adorned, into enemy territory to carry away plague. Wright's Disposal of Impurity is the standard comparative study. Two Eblaite texts describe a goat with a silver bracelet sent off to the steppe before a royal wedding (Zatelli, VT 1998).
    - Babylonian kuppuru rites (cognate with Hebrew kipper) include wiping the Ezida shrine with a slaughtered sheep's carcass during the akītu, after which the carcass and the officiants are expelled. This is a close parallel to Lev 16.
    - The meaning of ʿăzāʾzēl is debated. It may be a demon's name (cf. 1 En 8:1; 10:4-8, Asael), "the goat that goes away", or a place name ("rugged cliff"). The demon interpretation is the most common critical view.
    - Milgrom's interpretation of the ḥaṭṭāʾt as a "purification offering" that purges the sanctuary is widely, though not universally, accepted.
  sources_to_check:
    - David P. Wright, The Disposal of Impurity (SBLDS 101, 1987)
    - Jacob Milgrom, Leviticus 1-16 (AB 3, 1991)

- id: sacrifice
  cultures: [ane]
  scope: >-
    Animal, grain, and liquid offerings across the ancient Near East: types, terminology,
    procedures, distribution of portions, and theories of meaning. The entry places Israel's
    sacrificial system (Lev 1-7 and elsewhere) and its prophetic critique within the West
    Semitic and wider ancient Near Eastern context.
  passages:
    - "Lev 1-7 | practice | Burnt, grain, well-being, purification, and reparation offerings"
    - "Gen 8:20-21 | parallel | Burnt offerings after the flood; pleasing odour; cf. Gilgamesh XI"
    - "Exod 20:24 | practice | Burnt and well-being offerings on an earthen altar"
    - "Exod 24:5-8 | practice | Covenant sacrifices and blood rite at Sinai"
    - "1Sam 2:12-17 | practice | Priests' share taken before the fat is burned"
    - "Lev 17:10-14 | concept | Blood prohibition; blood as life given for atonement"
    - "Ps 50:8-15 | polemic | God needs no sacrifices; thanksgiving demanded"
    - "1Sam 15:22 | concept | Obedience better than sacrifice"
    - "Hos 6:6 | concept | Steadfast love, not sacrifice"
    - "Amos 5:21-24 | concept | Festivals and offerings rejected without justice"
    - "Ps 51:16-17 | concept | Broken spirit as acceptable sacrifice; MT 51:18-19"
  related: [marseilles-tariff, care-and-feeding-of-the-gods, altars, ugaritic-texts, child-sacrifice, extispicy, tithes, purity-and-impurity]
  wikipedia: Animal sacrifice
  image: Ashurbanipal libation over dead lions relief
  author_notes:
    - Israel's sacrificial terminology and types (whole burnt offering, well-being/communion offering) correspond more closely to West Semitic practice (Ugaritic šrp and šlmm; Punic kll, šlm kll) than to Mesopotamia. There, sacrifice was mainly a divine meal, and burnt offerings were rare.
    - Present theories of sacrifice (gift, communion, substitution, purification; Robertson Smith, Hubert and Mauss, Girard) as interpretive models. The biblical texts do not offer a single theory.
    - The prophetic critique (Amos 5; Hos 6; Isa 1; Mic 6; Jer 7) is mostly read today as rhetoric of priority, not as rejection of sacrifice as such. Note the debate.
    - Use the terminology carefully. ḥaṭṭāʾt is now often rendered "purification offering", ʾāšām "reparation offering", and šĕlāmîm "well-being" or "communion" offering.

- id: marseilles-tariff
  aliases: [Marseille Tariff, Marseilles Sacrificial Tariff]
  cultures: [phoenician]
  date: [-400, -200]
  circa: true
  scope: >-
    A Punic inscription found at Marseille in 1845, probably brought from Carthage. It sets
    out the fees and the priests' and offerers' portions for different sacrifices by animal
    type, using offering terms (kll, ṣwʿt, šlm kll) comparable to biblical sacrificial
    vocabulary.
  passages:
    - "Lev 1-7 | practice | Offerings classified by type and by animal, with priestly portions"
    - "Lev 7:28-36 | practice | Priestly portions of the well-being offering: breast and right thigh"
    - "Lev 7:8 | practice | Priest's right to the hide of the burnt offering; Punic tariffs also allocate hides"
    - "Deut 18:3 | practice | Priest's due from sacrifices: shoulder, cheeks, and stomach"
    - "1Sam 2:13-16 | practice | 'Custom of the priests' regarding their share"
    - "Lev 5:7, 11 | practice | Substitutions for poorer offerers: birds and flour; tariff also prices birds"
    - "1Sam 7:9 | language | ʿôlâ kālîl 'whole burnt offering'; cf. Punic kll"
    - "Ps 51:19 | language | ʿôlâ and kālîl paired; MT 51:21"
    - "Deut 33:10 | language | kālîl on the altar"
  related: [sacrifice, phoenicians, baal, tophet, ugaritic-texts, tithes]
  wikipedia: Marseille Tariff
  image: Marseille Tariff Punic inscription
  location: Musée d'Archéologie Méditerranéenne, Marseille
  author_notes:
    - The stone is generally thought to have come from Carthage. The text heads itself as a tariff of a temple of Baal (commonly restored Baal-Ṣaphon). Verify the reading of line 1. A fragmentary companion tariff from Carthage (KAI 74) should be discussed with it.
    - The exact meanings of kll, ṣwʿt, and šlm kll are debated. Avoid simply equating them with biblical ʿôlâ, ḥaṭṭāʾt, and šĕlāmîm. The parallel lies in the classification and in the regulation of priestly portions.
    - The tariff is a valuable non-biblical example of written regulation protecting offerers from priestly overreach (cf. 1 Sam 2:12-17).
    - Date ranges given in the literature vary (roughly 4th-3rd c. BCE). Verify before stating a precise date.
  sources_to_check:
    - KAI 69
    - CIS I 165

- id: child-sacrifice
  cultures: [phoenician, judahite, moabite, ane]
  scope: >-
    The ritual killing of children as offerings, as alleged and condemned in the Hebrew Bible
    ("passing through the fire", offerings "to Molek"), as narrated in stories such as Gen 22
    and 2 Kgs 3:27, and as debated for Phoenician and Punic tophets.
  passages:
    - "Gen 22:1-19 | concept | Command to offer Isaac and its reversal"
    - "Judg 11:30-40 | practice | Jephthah's vow and sacrifice of his daughter"
    - "2Kgs 3:27 | practice | Mesha of Moab offers his firstborn on the wall; 'great wrath' on Israel"
    - "2Kgs 16:3 | practice | Ahaz makes his son pass through fire"
    - "2Kgs 17:31 | practice | Sepharvites burn children to Adrammelech and Anammelech"
    - "2Kgs 21:6 | practice | Manasseh makes his son pass through fire"
    - "2Kgs 23:10 | practice | Josiah defiles Topheth so none may pass a child through fire to Molek"
    - "Lev 18:21 | language? | 'Give your offspring to Molek': deity name or sacrificial term (mlk) debated"
    - "Lev 20:2-5 | practice | Death penalty for giving offspring to Molek"
    - "Jer 7:31 | polemic | Burning sons and daughters at Topheth, 'which I did not command'"
    - "Jer 19:5 | polemic | Children burned as burnt offerings to Baal"
    - "Ezek 20:25-26 | concept | 'Statutes that were not good': offering every firstborn"
    - "Mic 6:7 | concept | 'Shall I give my firstborn for my transgression?'"
    - "Exod 22:29 | concept | 'The firstborn of your sons you shall give to me'; MT 22:28"
  related: [tophet, molek, mesha-stele, firstfruits-and-firstborn, phoenicians, vows-and-votive-offerings, ahaz, manasseh]
  wikipedia: Child sacrifice
  image: Carthage tophet stelae
  author_notes:
    - Eissfeldt (1935) argued that Punic mlk is a sacrificial term (molk-offering), not a deity, and that biblical lammōlek means "as a molk-offering". This remains debated against the deity view (Heider; Day). Present both.
    - For the Carthage tophet, Greek and Roman literary accounts (e.g. Diodorus 20.14) and the inscribed stelae support sacrifice. Some osteological studies argue that many burials were of naturally deceased infants. Since about 2010 the debate has continued in Antiquity and elsewhere, and the majority view now accepts sacrifice. Present the evidence fairly.
    - Distinguish polemical accusation from evidence of practice. Jer 7:31; 19:5; 32:35 and Ezek 20:25-26 suggest that some in Judah regarded child sacrifice as YHWH-pleasing (Levenson, The Death and Resurrection of the Beloved Son; Stavrakopoulou, King Manasseh and Child Sacrifice).
    - Neo-Assyrian contract penalty clauses threatening to "burn" a son to a deity are sometimes cited. Their literal force is debated.

- id: tophet
  aliases: [Topheth]
  cultures: [judahite, phoenician]
  scope: >-
    Topheth, the cult place in the Valley of Hinnom outside Jerusalem associated with burning
    children, and by extension the modern scholarly term "tophet" for Phoenician-Punic sacred
    precincts with urn burials of infants and animals (Carthage, Motya, Tharros, Sulcis).
  passages:
    - "2Kgs 23:10 | setting | Josiah defiles Topheth in the valley of Ben-hinnom"
    - "Jer 7:31-32 | setting | High place of Topheth; the valley renamed 'valley of Slaughter'"
    - "Jer 19:6, 11-14 | setting | Topheth as burial place; Jerusalem's houses to be defiled like Topheth"
    - "Isa 30:33 | language | 'His burning place (topteh) has long been prepared; it is made ready for the king (lammelek)'"
    - "Josh 15:8 | setting | Valley of the son of Hinnom on Judah's boundary"
    - "Mark 9:43-48 | concept | Gehenna as place of unquenchable fire"
  related: [child-sacrifice, molek, jerusalem, josiah, phoenicians, sheol-and-the-netherworld]
  wikipedia: Tophet
  image: Tophet of Salammbo Carthage
  author_notes:
    - The vocalization tōpet is often explained as a deliberate distortion with the vowels of bōšet ("shame"), from a word meaning "hearth" or "fireplace" (cf. Aramaic). Present this as the common proposal.
    - The Jerusalem Topheth has not been located archaeologically. The application of "tophet" to Punic sanctuaries is modern scholarly usage.
    - Trace the line from the Hinnom valley to Gehenna as a place of eschatological punishment (1 En 27; NT) briefly, with cross-reference.

- id: cultic-prostitution
  aliases: [sacred prostitution, temple prostitution, qedeshah]
  cultures: [hebrew, babylonian, ugaritic, greek]
  scope: >-
    The once-standard view that ancient Near Eastern and Canaanite temples employed "sacred
    prostitutes", the biblical terms qādēš and qĕdēšâ on which it was partly based, and the
    present scholarly consensus that the category is largely unsupported by primary evidence.
  passages:
    - "Gen 38:15, 21-22 | language | Tamar called zônâ by Judah, and qĕdēšâ in Hirah's inquiry"
    - "Deut 23:17-18 | language | No qĕdēšâ or qādēš in Israel; 'fee of a prostitute' and 'wages of a dog'; MT 23:18-19"
    - "Hos 4:13-14 | polemic | Men 'sacrifice with qĕdēšôt' in parallel with prostitutes"
    - "1Kgs 14:24 | language | qādēš personnel 'in the land'"
    - "1Kgs 15:12 | language | Asa expels the qĕdēšîm"
    - "2Kgs 23:7 | language | Houses of the qĕdēšîm in the temple where women wove for Asherah"
  related: [ishtar, asherah, sacred-marriage, astarte, ugaritic-texts, cult-reforms-archaeology]
  wikipedia: Sacred prostitution
  image: null
  author_notes:
    - The present consensus is sceptical (Westenholz, HTR 82, 1989; Budin, The Myth of Sacred Prostitution in Antiquity, 2008). Akkadian qadištu designates a class of women with cultic and social roles (e.g. wet-nursing and midwifery), not prostitutes. Ugaritic qdšm are a class of temple personnel listed alongside priests.
    - Herodotus 1.199 (Babylonian women and Mylitta) is the main classical source. It is widely regarded as unreliable or misunderstood. Treat Lucian and Strabo similarly.
    - In biblical texts, the parallel of qĕdēšâ with zônâ (Gen 38; Hos 4; Deut 23) is the main basis for the older view. Explain it as polemical association, not documentation of a sexual cult.
    - Note that translations such as NRSV "temple prostitute" perpetuate the older view.

- id: sacred-marriage
  aliases: [hieros gamos]
  cultures: [sumerian, babylonian, assyrian, greek]
  scope: >-
    The idea of a ritual marriage between deities, or between a king and a goddess, attested in
    Sumerian royal hymns and later Mesopotamian divine-marriage rites, and its proposed
    relevance to biblical marriage metaphors and the Song of Songs.
  passages:
    - "Hos 2:14-23 | imagery | YHWH woos and betroths Israel; 'my husband' not 'my Baal'; MT 2:16-25"
    - "Jer 2:2 | imagery | Israel's devotion as a bride"
    - "Ezek 16:8 | imagery | YHWH enters into covenant with Jerusalem as his bride"
    - "Isa 62:4-5 | imagery | Land called 'Married'; God rejoices over Zion as bridegroom"
    - "Song 1-8 | parallel? | Cultic hieros gamos readings of the Song (Meek; Pope) are a minority view"
    - "Ezek 8:14 | practice | Women weeping for Tammuz (Dumuzi)"
    - "Rev 21:2, 9 | imagery | New Jerusalem as the bride of the Lamb"
  related: [sumerian-love-songs, tammuz, ishtar, cultic-prostitution, egyptian-love-poetry, baal]
  wikipedia: Hieros gamos
  image: Warka Vase
  author_notes:
    - The key Sumerian evidence is royal hymns (e.g. Iddin-Dagan A, Shulgi hymns) describing the king's union with Inanna. Whether this involved a human sexual rite or was symbolic or performed with statues is debated (Cooper; Lapinkivi, The Sumerian Sacred Marriage, SAAS 15, 2004).
    - First-millennium rites of divine marriage (e.g. Nabu and Tashmetu) involved statues and a bedchamber, not human couples.
    - Avoid the older "fertility cult" model linking sacred marriage, sacred prostitution, and Canaanite religion. It has been largely abandoned. The biblical marriage metaphor is better explained by covenant and family law.
    - The Warka Vase scene is often but not universally interpreted as a sacred-marriage procession. Say so if it is used as an illustration.
  sources_to_check:
    - Martti Nissinen and Risto Uro, eds., Sacred Marriages (2008)

- id: sumerian-love-songs
  aliases: [Dumuzi-Inanna songs, Shu-Sin love song]
  cultures: [sumerian]
  date: [-2100, -1600]
  circa: true
  scope: >-
    Sumerian love poetry, chiefly the songs of Inanna and Dumuzi and love songs addressed to
    kings such as Shu-Sin of Ur. The compositions are known mostly from Old Babylonian copies.
    They are the oldest love lyrics in the Near East and are often compared with the Song of
    Songs.
  passages:
    - "Song 1:2-4 | parallel | Royal lover; 'the king has brought me into his chambers'"
    - "Song 3:4 | parallel | Bringing the lover into 'my mother's house', a recurrent motif in the Inanna-Dumuzi songs"
    - "Song 8:1-2 | parallel | Wish to bring the beloved to the mother's house"
    - "Song 4:12-5:1 | imagery | The beloved as garden; sexual imagery of garden, field, and honey"
    - "Song 3:6-11 | parallel | Royal wedding procession and crowning by the mother"
    - "Ezek 8:14 | setting | Mourning for Tammuz (Dumuzi)"
  related: [sacred-marriage, egyptian-love-poetry, tammuz, ishtar, descent-of-inanna-ishtar]
  wikipedia: null
  image: Shu-Sin love song tablet Istanbul
  author_notes:
    - The date range covers the Ur III origin of some compositions (Shu-Sin reigned in the late 21st c. BCE) and the Old Babylonian copies that preserve most of them. State which is meant.
    - Parallels with the Song of Songs are at the level of motif and genre (royal lover, the mother's house, garden imagery, terms of endearment), not textual dependence. Egyptian love poetry is closer in date and form and should be weighed alongside.
    - The cultic-mythological interpretation of the Song (Pope's Anchor Bible commentary, 1977) depends heavily on these texts. Present it as a minority reading.
    - The Shu-Sin song (Istanbul Ni 2461) is often popularized as "the world's oldest love poem". Note this as a popular label.
  sources_to_check:
    - Yitschak Sefati, Love Songs in Sumerian Literature (1998)
    - Thorkild Jacobsen, The Harps That Once (1987)

- id: divination
  cultures: [ane]
  scope: >-
    A hub entry on the ways ancient Near Eastern people sought knowledge of divine will and
    the future. These include deductive methods (extispicy, astrology, lots, oil and smoke
    omens) and intuitive ones (dreams, prophecy, necromancy). The entry covers biblical
    prohibitions and the forms of divination that biblical texts accept.
  passages:
    - "Deut 18:9-14 | practice | List of forbidden diviners, sorcerers, and consulters of the dead"
    - "Lev 19:26, 31 | practice | No augury or soothsaying; no turning to mediums"
    - "Num 22:7 | practice | Balak's elders bring 'fees for divination' (qĕsāmîm) to Balaam"
    - "Num 23:23 | concept | 'No enchantment against Jacob, no divination against Israel'"
    - "Gen 44:5, 15 | practice | Joseph's divining cup: lecanomancy"
    - "Gen 30:27 | practice | Laban 'learned by divination' that he was blessed because of Jacob"
    - "1Sam 6:2 | practice | Philistine priests and diviners consulted about the ark"
    - "Ezek 21:21 | practice | King of Babylon shakes arrows, consults teraphim, inspects the liver; MT 21:26"
    - "Hos 4:12 | practice | People consult wood and a divining rod"
    - "Isa 44:25 | polemic | YHWH frustrates the omens of diviners"
    - "Acts 16:16 | practice | Slave girl with a spirit of divination (pythōn)"
  related: [extispicy, necromancy, astrology, dreams-and-dream-interpretation, lots-and-cleromancy, urim-and-thummim, prophecy-in-the-ane, enuma-anu-enlil]
  wikipedia: Divination
  image: Mari clay liver models
  author_notes:
    - The distinction between technical or deductive divination (reading signs) and intuitive or inspired divination (dreams, prophecy) goes back to Cicero's De divinatione. It is a useful organizing frame, though the categories overlap.
    - The Hebrew Bible condemns many techniques but sanctions others (Urim and Thummim, lots, dreams, prophecy). Deut 18 presents prophecy as Israel's legitimate channel in place of the nations' diviners. Explain the logic rather than framing it as "magic versus religion".
    - In Mesopotamia divination was a scholarly discipline with large omen compendia, closely tied to royal decision-making. Note this as a key difference in scale and prestige.
    - Give the Hebrew terms (qesem, nāḥaš, ʿônēn, mĕkaššēp, ḥōbēr ḥeber, šōʾēl ʾôb) with cautious glosses. Several identifications are uncertain.
  sources_to_check:
    - Frederick H. Cryer, Divination in Ancient Israel and Its Near Eastern Environment (JSOTSup 142, 1994)
    - Ulla Susanne Koch, Mesopotamian Divination Texts (GMTR 7, 2015)

- id: extispicy
  aliases: [hepatoscopy, liver divination, bārûtu]
  cultures: [babylonian, assyrian, amorite, hittite]
  scope: >-
    Divination by inspecting the entrails, especially the liver, of a sacrificed sheep. It was
    the most prestigious Mesopotamian divinatory science, practised by the bārû, and spread to
    Syria, Anatolia, and the Levant. The biblical references are few but explicit.
  passages:
    - "Ezek 21:21 | practice | King of Babylon 'looks at the liver' at the crossroads; MT 21:26"
    - "2Kgs 16:15 | practice? | Ahaz keeps the bronze altar 'to inquire by' (lĕbaqqēr); extispicy proposed"
    - "Lev 3:4 | practice? | Appendage of the liver (yōteret hakkābēd) burned; link to removing the divinatory organ debated"
    - "Ps 27:4 | language? | 'To inquire (lĕbaqqēr) in his temple'; cf. Akkadian bārû 'inspector'"
  related: [liver-models, divination, mari-letters, sacrifice, astrology, prophecy-in-the-ane]
  wikipedia: Extispicy
  image: Babylonian clay liver model British Museum
  author_notes:
    - Extispicy is attested from the Old Babylonian period (omen compendia, Mari letters) to the first millennium (the bārûtu series; Neo-Assyrian queries to Shamash, SAA 4). Liver models are known from Mari, Babylonia, Hattusa, Ugarit, and Late Bronze Hazor and Megiddo.
    - Ezek 21:21 is the only unambiguous biblical reference. Mark proposals for 2 Kgs 16:15, the burning of the liver's appendage, and bqr as debated.
    - The consultation was framed as a legal-style query to Shamash and Adad, with the answer "written" on the liver. This framing explains its prestige and its connection to royal decision-making.
  sources_to_check:
    - SAA 4
    - Ulla Koch-Westenholz, Babylonian Liver Omens (2000)

- id: necromancy
  aliases: [consulting the dead, ʾôb and yiddĕʿōnî]
  cultures: [babylonian, hittite, hebrew, greek]
  scope: >-
    Consulting the spirits of the dead for knowledge. The entry covers the biblical
    terminology (ʾôb, yiddĕʿōnî, dōrēš ʾel-hammētîm), the medium at Endor, prophetic and legal
    condemnation, and Mesopotamian, Hittite, and Greek comparanda.
  passages:
    - "1Sam 28:3-25 | practice | Saul consults the medium (baʿălat-ʾôb) at Endor; Samuel rises as an ʾĕlōhîm"
    - "Lev 19:31 | practice | Do not turn to mediums (ʾōbōt) or wizards (yiddĕʿōnîm)"
    - "Lev 20:6, 27 | practice | Penalties for consulting and for being a medium"
    - "Deut 18:11 | practice | Medium, wizard, and 'one who seeks the dead' forbidden"
    - "Isa 8:19-20 | practice | Ghosts that chirp and mutter; consulting the dead for the living"
    - "Isa 19:3 | practice | Egyptians consult idols, spirits of the dead, ghosts, and familiar spirits"
    - "Isa 29:4 | imagery | Jerusalem's voice from the ground like a ghost"
    - "2Kgs 21:6 | practice | Manasseh deals with mediums and wizards"
    - "2Kgs 23:24 | practice | Josiah removes mediums, wizards, and teraphim"
    - "Isa 65:4 | practice | Sitting in tombs and spending the night in secret places"
  related: [care-for-the-dead, divination, rephaim, sheol-and-the-netherworld, teraphim, marzeah, dream-incubation]
  wikipedia: Necromancy
  image: null
  author_notes:
    - The meaning of ʾôb is debated. Hoffner (JBL 1967) compared Hittite a-a-bi and Akkadian apu, meaning a ritual pit used to call up the dead. Others derive it from ʾāb ("father, ancestor") or take it as the ghost itself. yiddĕʿōnî is usually "knowing one". Present the options.
    - Mesopotamian necromancy is attested but rare (Finkel, AfO 29/30). Ghosts (eṭemmu) were more often objects of exorcism and care than sources of oracles. Odyssey 11 is the classic Greek comparandum.
    - Connect necromancy with care for the dead and ancestor cult. The extent of a Judahite cult of the dead is debated (Schmidt, Israel's Beneficent Dead, 1994, is sceptical).
    - 1 Sam 28 is a narrative, not a technical description. Avoid reconstructing ritual procedure from it.
  sources_to_check:
    - Brian B. Schmidt, Israel's Beneficent Dead (FAT 11, 1994)
    - Josef Tropper, Nekromantie (AOAT 223, 1989)

- id: astrology
  aliases: [astral omens, celestial divination]
  cultures: [babylonian, assyrian, persian, greek]
  scope: >-
    Celestial divination in Mesopotamia, from the omen series Enuma Anu Enlil and the reports
    of Assyrian court scholars to the later development of the zodiac and personal horoscopes,
    and its reception and critique in biblical and early Jewish and Christian texts.
  passages:
    - "Isa 47:13 | practice | Babylon's 'dividers of the heavens', stargazers, and monthly prognosticators"
    - "Jer 10:2 | polemic | 'Do not be dismayed at the signs of the heavens'"
    - "Dan 2:2, 27 | practice | Chaldeans and other court experts summoned to interpret"
    - "Dan 4:7 | practice | Magicians, enchanters, Chaldeans, and diviners fail; MT 4:4"
    - "Dan 5:7, 11 | practice | Chaldeans and diviners (gāzĕrîn) summoned"
    - "Gen 1:14-18 | polemic? | Sun and moon unnamed, made 'lights' for signs and seasons; anti-astral reading debated"
    - "Matt 2:1-12 | practice | Magi from the East following a star"
  related: [enuma-anu-enlil, constellations, host-of-heaven, divination, zoroastrianism, persia]
  wikipedia: Babylonian astrology
  image: Venus tablet of Ammisaduqa
  author_notes:
    - Distinguish the state-oriented celestial omens of Enuma Anu Enlil, attested in Neo-Assyrian scholarly reports and letters (SAA 8; SAA 10), from personal horoscopy. The earliest Babylonian horoscopes date to the late 5th century BCE.
    - The term "Chaldean" (kaśdîm) became a professional term for astrologer in Hellenistic usage. This is relevant to Daniel's date and setting.
    - Avoid astronomical speculation about the star of Matt 2 (conjunctions, comets, novae). Focus on the magi as Persian or Babylonian court experts in the Greco-Roman imagination.
    - The reading of Gen 1:14-18 as deliberate demotion of astral deities is common but disputed. Mark it accordingly.
  sources_to_check:
    - SAA 8
    - SAA 10
    - Francesca Rochberg, The Heavenly Writing (2004)

- id: dreams-and-dream-interpretation
  cultures: [egyptian, babylonian, assyrian, amorite]
  scope: >-
    Dreams as a medium of divine communication in the ancient Near East: message dreams to
    kings, symbolic dreams needing expert interpretation, dream books, and dream reports at
    Mari. The entry also covers the biblical evaluation of dreams from Genesis to Daniel and
    Matthew.
  passages:
    - "Gen 20:3-7 | practice | God warns Abimelech in a dream of the night"
    - "Gen 28:12-15 | practice | Jacob's dream at Bethel: message dream with vision"
    - "Gen 37:5-11 | practice | Joseph's symbolic dreams"
    - "Gen 40:1-41:36 | practice | Egyptian officials and Pharaoh dream; Joseph interprets where magicians fail"
    - "Gen 41:8 | language | ḥarṭummîm 'magicians', from Egyptian ḥry-tp, lector-priest"
    - "Num 12:6 | concept | Prophets receive dreams and visions, Moses face to face"
    - "Deut 13:1-5 | concept | Dreamer who leads to other gods is to be put to death; MT 13:2-6"
    - "Judg 7:13-15 | practice | Midianite's dream overheard and interpreted"
    - "1Kgs 3:5-15 | practice | Solomon's dream at Gibeon"
    - "Jer 23:25-32 | polemic | Lying dreams versus YHWH's word"
    - "Dan 2:1-45 | practice | Nebuchadnezzar's dream and the failure of court experts"
    - "Dan 4:4-27 | practice | Dream of the great tree; MT 4:1-24"
    - "Matt 2:12-13 | practice | Warnings given in dreams"
  related: [dream-incubation, dream-stele, gudea-cylinders, mari-letters, divination, egyptian-loanwords, prophecy-in-the-ane]
  wikipedia: Dream interpretation
  image: Egyptian dream book Chester Beatty papyrus
  author_notes:
    - Oppenheim's typology (message dreams versus symbolic dreams, and the dream-report form) remains standard (Oppenheim, The Interpretation of Dreams in the Ancient Near East, TAPS 46/3, 1956).
    - The Egyptian dream book (P. Chester Beatty III, New Kingdom) and the Assyrian dream book (Ziqīqu) list dream omens. Joseph's interpretations rely on divine revelation, not manuals (Gen 40:8; 41:16). This contrast is often noted.
    - Royal dream reports include Gudea, Thutmose IV's Dream Stele, Hattusili III, Ashurbanipal, and Nabonidus. Mari letters report dreams by non-specialists.
    - Gen 41:8 ḥarṭōm is a secure Egyptian loanword. Many (e.g. Redford) place several Egyptian names and terms in the Joseph story in the first millennium, which is relevant to dating. This is debated.
  sources_to_check:
    - Kasia Szpakowska, Behind Closed Eyes (2003)
    - Frances Flannery-Dailey, Dreamers, Scribes, and Priests (2004)

- id: dream-incubation
  aliases: [incubation]
  cultures: [ugaritic, sumerian, hittite, egyptian, greek]
  scope: >-
    The deliberate seeking of a divine dream, often by sleeping at a sanctuary after ritual
    preparation. It is attested in Sumerian, Hittite, and Ugaritic texts and later Egyptian and
    Greek healing sanctuaries, and proposed for several biblical narratives.
  passages:
    - "1Kgs 3:4-15 | practice | Solomon sacrifices at Gibeon, then receives a dream revelation"
    - "1Sam 3:1-15 | practice? | Samuel sleeping in the temple near the ark receives a revelation"
    - "Gen 28:10-22 | practice? | Jacob's dream at a sacred place followed by a vow; unsought"
    - "Gen 46:1-4 | practice? | Sacrifice at Beersheba followed by night visions"
    - "Isa 65:4 | practice | Those who 'sit in tombs and spend the night in secret places'"
  related: [dreams-and-dream-interpretation, aqhat-epic, kirta-epic, gudea-cylinders, gibeon, bethel, plague-prayers-of-mursili]
  wikipedia: Incubation (ritual)
  image: null
  author_notes:
    - The Ugaritic Aqhat epic (Danel's seven-day ritual before El's blessing) and Kirta (weeping and sleeping, then El's appearance) are the closest West Semitic parallels. Gudea's dreams (Cylinder A) and Hittite prayers asking for a dream are also relevant.
    - The term is often applied too loosely. Distinguish deliberate solicitation from unsought dreams at holy places, and mark biblical cases accordingly (only 1 Kgs 3 has a strong claim).
    - Greek Asclepieia and Late Period Egyptian sanatoria (e.g. Saqqara) are later and should not be read back into Iron Age practice.

- id: lots-and-cleromancy
  aliases: [casting lots, pur, cleromancy]
  cultures: [assyrian, hebrew, persian]
  scope: >-
    Decision by lot in the ancient Near East and the Bible: allocating land, offices, and
    duties; identifying the guilty; choosing between alternatives. The entry includes the
    Assyrian inscribed lot (pūru) of Iahali and the pûr of Esther.
  passages:
    - "Josh 18:6-10 | practice | Land allotted by lot before YHWH at Shiloh"
    - "Num 26:55-56 | practice | Land to be divided by lot"
    - "Josh 7:14-18 | practice | Achan identified by successive lots"
    - "1Sam 10:20-21 | practice | Saul chosen king by lot"
    - "1Sam 14:41-42 | practice | Lot falls on Jonathan"
    - "Lev 16:8-10 | practice | Lots cast over the two goats"
    - "Prov 16:33 | concept | 'The lot is cast into the lap, but the decision is YHWH's alone'"
    - "Jonah 1:7 | practice | Sailors cast lots to find the culprit"
    - "Esth 3:7 | language | pûr, 'that is, the lot' (gôrāl); Akkadian pūru"
    - "Esth 9:24-26 | language | Purim named after pûr"
    - "1Chr 24:5, 31 | practice | Priestly divisions assigned by lot"
    - "Ps 22:18 | practice | Lots cast for clothing; MT 22:19"
    - "Acts 1:26 | practice | Matthias chosen by lot"
  related: [urim-and-thummim, divination, assyrian-eponym-list, shalmaneser-iii, hemerologies, day-of-atonement-elimination, ephod]
  wikipedia: Cleromancy
  image: Iahali die Yale
  author_notes:
    - The inscribed clay cube of Iahali, a high official and eponym under Shalmaneser III (9th c. BCE), calls itself a pūru (lot) to determine his eponymy year (Hallo, "The First Purim", BA 46, 1983). It confirms the Akkadian background of Esther's pûr.
    - Lots were understood as a legitimate means of divine decision in Israel (Prov 16:33) and continued in Second Temple practice (priestly duties, Luke 1:9).
    - Distinguish lots (gôrāl) from the Urim and Thummim, whose mechanism is unknown, while noting the overlap in 1 Sam 14:41-42.

- id: urim-and-thummim
  cultures: [hebrew, assyrian]
  scope: >-
    The Urim and Thummim, a priestly oracular device kept in the high priest's breastpiece
    for obtaining binary divine answers. The entry covers its biblical attestations, its
    disappearance after the early monarchy, and proposed ancient Near Eastern analogues.
  passages:
    - "Exod 28:30 | practice | Urim and Thummim placed in the breastpiece of judgment"
    - "Lev 8:8 | practice | Moses puts the Urim and Thummim in Aaron's breastpiece"
    - "Num 27:21 | practice | Eleazar to inquire by the judgment of the Urim for Joshua"
    - "Deut 33:8 | practice | Thummim and Urim given to Levi"
    - "1Sam 14:41 | practice | Fuller LXX text: 'give Urim... give Thummim' (followed by NRSV)"
    - "1Sam 14:37 | practice | God does not answer Saul's inquiry"
    - "1Sam 28:6 | practice | No answer by dreams, Urim, or prophets"
    - "1Sam 23:9-12 | practice | David's yes/no inquiries by the ephod"
    - "Ezra 2:63 | practice | Decision deferred until a priest with Urim and Thummim arises; cf. Neh 7:65"
  related: [ephod, lots-and-cleromancy, divination, teraphim, prophecy-in-the-ane]
  wikipedia: Urim and Thummim
  image: null
  author_notes:
    - How the device worked is unknown. The texts suggest binary answers, with the possibility of no answer (1 Sam 14:37; 28:6). The etymologies ("lights and perfections"; or linked to ʾrr "curse" and tmm "be innocent") are uncertain.
    - Horowitz and Hurowitz (JANES 21, 1992) compared an Assyrian psephomancy ritual using two stones (LKA 137). This is the best-documented analogue but not proof of identical practice. Van Dam, The Urim and Thummim (1997), surveys proposals.
    - Note the device's absence from narratives after David, and the postexilic expectation of its restoration (Ezra 2:63).

- id: teraphim
  cultures: [hebrew, hurrian, babylonian, hittite]
  scope: >-
    The tĕrāpîm, cultic objects of debated form and function (household gods, ancestor
    figurines, divinatory images) that appear in patriarchal, judges, monarchic, and prophetic
    texts, at first without and later with condemnation.
  passages:
    - "Gen 31:19 | realia | Rachel steals her father's teraphim"
    - "Gen 31:30-35 | realia | Laban seeks his 'gods'; Rachel hides them in the camel saddle"
    - "Judg 17:5 | realia | Micah's shrine with ephod and teraphim"
    - "Judg 18:14-20 | realia | Danites take the ephod, teraphim, and image"
    - "1Sam 19:13-16 | realia | Michal places teraphim in David's bed as a decoy"
    - "1Sam 15:23 | polemic | Stubbornness likened to iniquity and teraphim"
    - "2Kgs 23:24 | practice | Josiah removes mediums, wizards, teraphim, and idols"
    - "Ezek 21:21 | practice | King of Babylon consults the teraphim; MT 21:26"
    - "Hos 3:4 | realia | Israel to remain without ephod or teraphim"
    - "Zech 10:2 | polemic | 'The teraphim utter nonsense'"
  related: [nuzi-texts, care-for-the-dead, necromancy, ephod, divination, emar-texts, cult-images]
  wikipedia: Teraphim
  image: null
  author_notes:
    - The view that Rachel stole the teraphim to secure inheritance rights, based on Nuzi texts (Speiser; Draffkorn), is now largely abandoned. Correct it explicitly. Emar and Nuzi texts do link household gods (ilānu) with family estates, but this is not evidence for the Genesis motive.
    - Van der Toorn (CBQ 52, 1990) argues that teraphim were ancestor figurines used in divination. This is widely followed but not certain.
    - Size and form are unclear. 1 Sam 19 suggests a human-sized object or a head, while Gen 31 suggests something small. The etymology is unknown (proposals include Hittite tarpiš and Hebrew rp' or "Rephaim"). Avoid overconfident identifications with archaeological figurines.

- id: ephod
  cultures: [hebrew]
  scope: >-
    The ʾēpôd in its several biblical senses: a linen priestly garment, the high priest's
    ornate vestment with the breastpiece, an oracular object, and a cult object that could be
    made of gold. The entry also covers its relation to the clothing of cult statues.
  passages:
    - "Exod 28:4-14 | realia | High priest's ephod of gold, blue, purple, and crimson, with onyx stones"
    - "Exod 28:15-30 | realia | Breastpiece attached to the ephod, holding the Urim and Thummim"
    - "1Sam 2:18 | realia | Boy Samuel ministers wearing a linen ephod"
    - "1Sam 22:18 | realia | Eighty-five priests 'who wore the linen ephod'"
    - "2Sam 6:14 | realia | David dances before the ark girded with a linen ephod"
    - "1Sam 23:6, 9-12 | practice | Abiathar brings the ephod; David inquires through it"
    - "1Sam 30:7-8 | practice | Ephod brought for oracular inquiry"
    - "1Sam 14:18 | practice | MT 'ark of God', LXX 'ephod', in an oracular context"
    - "Judg 8:24-27 | realia | Gideon makes a gold ephod at Ophrah that becomes a snare"
    - "Judg 17:5 | realia | Micah's ephod and teraphim"
    - "1Sam 21:9 | realia | Goliath's sword kept behind the ephod at Nob"
    - "Isa 30:22 | language | ʾăpuddâ, the gold plating of cast images"
    - "Hos 3:4 | realia | Without ephod or teraphim"
  related: [urim-and-thummim, teraphim, clothing-and-dress, textiles-and-weaving, divination, cult-images]
  wikipedia: Ephod
  image: null
  author_notes:
    - Distinguish the senses clearly. The linen garment, the high priest's vestment, and the freestanding cult object (Judg 8:27; 17:5) may or may not be the same thing. A common proposal links the cult-object ephod to the garment of a divine image (cf. Isa 30:22).
    - Cognates include Old Assyrian epattum (pl. epadātum), a costly garment, and Ugaritic ipd (verify attestations). These support a basic sense of "garment".
    - The oracular ephod (1 Sam 23; 30) probably carried the lots or Urim and Thummim. Avoid claiming more than the texts support.

- id: prophecy-in-the-ane
  aliases: [ancient Near Eastern prophecy]
  cultures: [amorite, assyrian, aramean, egyptian, ane]
  scope: >-
    A hub entry on intuitive, inspired divination by prophets in the ancient Near East. Covers
    Old Babylonian Mari and Eshnunna, Neo-Assyrian prophecies to Esarhaddon and Ashurbanipal,
    West Semitic inscriptions (Zakkur, Deir ʿAlla), and Egyptian and other scattered evidence,
    with their bearing on Israelite prophecy.
  passages:
    - "Deut 18:15-22 | concept | Prophet like Moses and tests of true prophecy"
    - "Deut 13:1-5 | concept | Prophet or dreamer who leads to other gods; MT 13:2-6"
    - "1Kgs 22:1-28 | practice | Court prophets consulted before battle; Micaiah's dissent"
    - "1Kgs 18:26-29 | practice | Ecstatic behaviour of Baal's prophets"
    - "1Sam 10:5-13 | practice | Band of prophets with music falling into ecstasy"
    - "Jer 29:26 | language | 'Every madman (mĕšuggāʿ) who plays the prophet'; cf. Mari muḫḫûm"
    - "Jer 28:1-17 | practice | Conflict between prophets with opposing oracles"
    - "Amos 7:10-17 | practice | Royal sanctuary priest expels a prophet"
    - "Isa 41:10, 13-14 | form | 'Do not fear' oracles; cf. Neo-Assyrian oracles to Esarhaddon"
    - "Num 22-24 | attests | Balaam son of Beor, known also from the Deir ʿAlla plaster texts"
  related: [mari-letters, neo-assyrian-prophecies, zakkur-stele, deir-alla-inscription, report-of-wenamun, divination, lachish-letters]
  wikipedia: null
  image: Deir Alla inscription plaster
  author_notes:
    - Around 50 Mari texts report oracles by āpilum ("answerer"), muḫḫûm ("ecstatic"), and others, often lay persons. The Neo-Assyrian corpus (SAA 9) contains salvation oracles of Ishtar of Arbela to Esarhaddon whose "fear not" form parallels Second Isaiah.
    - The main difference is not phenomenology but the literary afterlife. Only in Israel were prophetic oracles collected, expanded, and canonized as books. Present this as the consensus contrast.
    - Nissinen's anthology (SBLWAW 12) is the standard source collection. Stökl (2012) offers a philological and sociological comparison.
    - Treat Wenamun's ecstatic at Byblos and Lachish Letter 3 ("the prophet") as scattered evidence, not a coherent Levantine institution.
  sources_to_check:
    - Martti Nissinen, Prophets and Prophecy in the Ancient Near East (SBLWAW 12, 2003)
    - SAA 9

- id: massebot
  aliases: [maṣṣēbâ, standing stones, betyls]
  cultures: [hebrew, canaanite, arabian]
  scope: >-
    Standing stones (maṣṣēbôt) in the Levant, set up as memorials, witnesses, boundary
    markers, or representations of divine presence. The entry covers their biblical
    evaluation, from patriarchal use to Deuteronomic prohibition, and archaeological examples
    from Gezer, Hazor, Arad, and desert shrines.
  passages:
    - "Gen 28:18-22 | practice | Jacob's pillar at Bethel, anointed and called 'house of God'"
    - "Gen 31:45-52 | practice | Pillar and cairn as witness to a treaty"
    - "Gen 35:14 | practice | Libation and oil on a pillar at Bethel"
    - "Gen 35:20 | practice | Pillar over Rachel's grave"
    - "Exod 24:4 | practice | Twelve pillars at Sinai for the twelve tribes"
    - "Exod 23:24 | polemic | Canaanite pillars to be broken"
    - "Deut 16:22 | polemic | No pillar, 'which YHWH your God hates'"
    - "2Sam 18:18 | practice | Absalom's memorial pillar, for lack of a son"
    - "Josh 24:26-27 | practice | Large stone set up as witness at Shechem"
    - "1Kgs 14:23 | polemic | Pillars and sacred poles on every high hill"
    - "2Kgs 18:4 | polemic | Hezekiah breaks down the pillars"
    - "Hos 3:4 | realia | Without sacrifice or pillar"
    - "Isa 19:19 | practice | Pillar to YHWH at Egypt's border"
  related: [aniconism, high-places, arad, gezer, hazor, bethel, boundary-markers, katumuwa-stele]
  wikipedia: Matzevah
  image: Gezer standing stones
  author_notes:
    - Distinguish functions (commemorative, funerary, legal witness, boundary, and cultic representation of a deity). Not every standing stone is cultic, and not every biblical "stone" (e.g. Josh 4:20) is called a maṣṣēbâ.
    - Key sites include the Gezer row of monoliths (Middle Bronze Age), the Hazor stelae shrine (Late Bronze Age), the Arad shrine (Iron Age, one or two maṣṣēbôt, with debate over their number), and Negev and Sinai open-air sanctuaries (Avner).
    - Note the tension between patriarchal practice and Deut 16:22. Mettinger's "material aniconism" frames standing stones as aniconic symbols of divine presence.

- id: high-places
  aliases: [bāmôt, bamah]
  cultures: [hebrew, israelite, judahite, moabite]
  scope: >-
    The bāmâ ("high place"), a local cult place or platform for sacrifice, criticized in the
    books of Kings and suppressed in the reforms of Hezekiah and Josiah. The entry covers the
    term's meaning, its Moabite parallel, and the archaeology of Iron Age cult platforms.
  passages:
    - "1Sam 9:12-25 | practice | Samuel presides at a sacrifice at the bāmâ with a hall for guests"
    - "1Sam 10:5 | practice | Prophets descending from the high place"
    - "1Kgs 3:2-4 | practice | People sacrifice at high places; Gibeon the 'great high place'"
    - "1Kgs 11:7 | practice | Solomon builds high places for Chemosh and Molek"
    - "1Kgs 12:31-32 | practice | Jeroboam's houses on high places and non-Levitical priests"
    - "2Kgs 18:4, 22 | practice | Hezekiah removes the high places"
    - "2Kgs 23:8-9, 13, 15 | practice | Josiah defiles high places from Geba to Beersheba and at Bethel"
    - "Jer 7:31 | practice | High place of Topheth in the Hinnom valley"
    - "Ezek 20:29 | language | Wordplay on bāmâ: 'What is the high place to which you go?'"
    - "Num 22:41 | language | Bamoth-baal, 'high places of Baal'"
    - "Amos 7:9 | practice | High places of Isaac to be made desolate"
  related: [mesha-stele, altars, massebot, cult-reforms-archaeology, dan, josiah, hezekiah, gibeon]
  wikipedia: High place
  image: Tel Dan high place
  author_notes:
    - The Mesha Stele (line 3) records Mesha building "this bmt for Chemosh". It is the key extrabiblical attestation of the term.
    - Bāmâ does not necessarily mean a hilltop. High places could be in valleys (Jer 7:31) or at gates (2 Kgs 23:8). The basic sense ("back" or "ridge", hence a raised platform) is debated (Vaughan, 1974; Barrick, 2008).
    - Archaeological identifications (e.g. the Tel Dan platform, often called a "bamah") are interpretive. Present them as such.
    - The negative evaluation is Deuteronomistic and tied to centralization. Before the reforms, high places were normal YHWH sanctuaries.

- id: altars
  cultures: [hebrew, canaanite]
  scope: >-
    Altars for sacrifice and offering in Israel and the Levant: earthen and fieldstone altars,
    bronze-plated altars, the large stepped temple altar of Ezekiel's vision, and
    archaeological examples. The entry covers the biblical laws on construction and the
    contested history of altar legislation.
  passages:
    - "Exod 20:24-26 | realia | Altar of earth or unhewn stone, without steps"
    - "Exod 27:1-8 | realia | Tabernacle altar of acacia overlaid with bronze, five cubits square"
    - "Deut 27:5-6 | realia | Altar of unhewn stones on Mount Ebal"
    - "Josh 8:30-31 | realia | Joshua's altar of unhewn stones on Ebal"
    - "Josh 22:10-34 | practice | Transjordanian altar as a witness, not for sacrifice"
    - "1Sam 14:33-35 | practice | A great stone used as an improvised altar"
    - "1Kgs 18:30-32 | practice | Elijah repairs the altar with twelve stones"
    - "1Kgs 8:64 | realia | Bronze altar too small for the dedication offerings"
    - "2Kgs 16:10-16 | realia | Ahaz copies an altar seen at Damascus"
    - "2Chr 4:1 | realia | Bronze altar twenty cubits square and ten high"
    - "Ezek 43:13-17 | realia | Stepped altar with 'bosom of the earth' base and 'altar hearth' (harʾēl/ʾărîʾēl)"
  related: [horned-altars, incense-and-incense-altars, mount-ebal-altar, arad, tel-motza-temple, sacrifice, high-places, beersheba]
  wikipedia: Altar (Bible)
  image: Arad sanctuary altar
  author_notes:
    - The Arad sanctuary altar (fieldstones and earth, about five cubits square) is often compared with Exod 20:25 and 27:1. The Beersheba horned altar of dressed stones contradicts Exod 20:25. Use both to discuss the gap between law and practice.
    - The Mount Ebal structure (Zertal) is interpreted by some as an early Israelite altar and by others as a watchtower or farmstead. Present it as contested.
    - Ezekiel's harʾēl/ʾărîʾēl has been compared to the Mesha Stele's ʾrʾl (line 12) and to Akkadian terms. These links are debated.
    - The relationship between the altar law of Exod 20:24 ("in every place") and Deuteronomic centralization is a classic crux of pentateuchal criticism. Give it brief treatment.

- id: horned-altars
  cultures: [hebrew, philistine, canaanite]
  scope: >-
    Altars with projecting "horns" at the four corners, known from biblical descriptions and
    from Iron Age examples at Beersheba, Megiddo, Dan, and Ekron. The entry covers the ritual
    use of the horns in blood rites and as a place of asylum.
  passages:
    - "Exod 27:2 | realia | Horns on the four corners of the altar of burnt offering"
    - "Exod 29:12 | practice | Blood put on the altar's horns at ordination"
    - "Exod 30:2-3, 10 | realia | Horns of the incense altar, purged annually"
    - "Lev 4:7, 18, 25, 30, 34 | practice | Purification-offering blood daubed on the horns"
    - "Lev 16:18 | practice | Altar's horns purged on the Day of Atonement"
    - "1Kgs 1:50-51 | practice | Adonijah grasps the horns of the altar for asylum"
    - "1Kgs 2:28 | practice | Joab flees to the altar's horns"
    - "Amos 3:14 | realia | Horns of the Bethel altar to be cut off"
    - "Jer 17:1 | imagery | Sin engraved on the horns of the altars"
    - "Ps 118:27 | practice | Festal procession 'up to the horns of the altar'"
    - "Rev 9:13 | imagery | Voice from the four horns of the golden altar"
  related: [altars, incense-and-incense-altars, asylum-and-cities-of-refuge, beersheba, ekron, megiddo, cult-reforms-archaeology]
  wikipedia: Horned altar
  image: Beersheba horned altar
  author_notes:
    - The Beersheba altar of dressed stones was found dismantled and reused in later walls. Its dismantling is often linked to Hezekiah's reform (2 Kgs 18:4, 22), but that link and the stratigraphy are debated.
    - Small four-horned limestone altars (Megiddo, Ekron, and elsewhere) were probably for incense or other non-animal offerings. Distinguish them from large altars of burnt offering.
    - The original function or symbolism of the horns is unknown. Present the proposals without choosing one.

- id: incense-and-incense-altars
  aliases: [qĕṭōret, ḥammānîm]
  cultures: [hebrew, arabian, phoenician]
  scope: >-
    Incense offering in Israel and the ancient Near East: aromatic substances (especially
    frankincense from South Arabia), the golden incense altar of the tabernacle, censers, and
    the small limestone incense altars known archaeologically from Iron Age sites.
  passages:
    - "Exod 30:1-10 | realia | Golden altar of incense before the curtain"
    - "Exod 30:34-38 | practice | Recipe of sacred incense: stacte, onycha, galbanum, frankincense"
    - "Lev 10:1-2 | practice | Nadab and Abihu offer 'strange fire' in their censers"
    - "Lev 16:12-13 | practice | Cloud of incense covers the mercy seat"
    - "Num 16:46-48 | practice | Aaron's censer stops the plague; MT 17:11-13"
    - "2Chr 26:16-21 | practice | Uzziah struck with skin disease for burning incense"
    - "Jer 6:20 | realia | Frankincense from Sheba and sweet cane from a distant land"
    - "Jer 44:15-25 | practice | Offerings burned to the queen of heaven"
    - "Lev 26:30 | language | ḥammānîm 'incense altars' to be cut down; cf. Isa 17:8; 27:9; Ezek 6:4, 6"
    - "Ps 141:2 | imagery | 'Let my prayer be counted as incense before you'"
    - "Mal 1:11 | concept | Incense offered to YHWH's name in every place"
    - "Luke 1:9-11 | practice | Zechariah chosen by lot to offer incense"
  related: [incense-trade, horned-altars, arad, sheba, queen-of-heaven, altars, tabernacle]
  wikipedia: Altar of incense
  image: Arad incense altars Israel Museum
  author_notes:
    - Wellhausen's view that incense offering was a late (post-exilic) development is contradicted by Iron Age incense altars and burners. Note this correction.
    - Two limestone altars from the Arad shrine had organic residues analysed in 2020 (Arie, Rosen, and Namdar, Tel Aviv 47), with reported frankincense on one and cannabis on the other. Verify details before stating them.
    - ḥammān has been linked to inscribed incense altars in Palmyrene and other Aramaic inscriptions (ḥmn). The identification is plausible but has been debated.
    - The South Arabian incense trade explains much of the archaeology. Cross-reference incense-trade and sheba.

- id: cult-stands
  aliases: [mĕkōnôt, wheeled stands]
  cultures: [hebrew, canaanite, philistine]
  scope: >-
    Cult stands in the Levant, especially the ten bronze wheeled stands (mĕkōnôt) with basins
    in Solomon's temple and their Cypriot bronze analogues, and the decorated ceramic stands
    from Taanach and other sites.
  passages:
    - "1Kgs 7:27-37 | realia | Ten bronze stands on wheels with panels of lions, oxen, cherubim, and palms"
    - "1Kgs 7:38-39 | realia | Ten bronze basins (kiyyōrôt) on the stands"
    - "2Kgs 16:17 | realia | Ahaz cuts off the stands' frames and removes the basins"
    - "2Kgs 25:13, 16 | realia | Babylonians break up and carry off the stands"
    - "Jer 52:17, 20 | realia | Stands among the bronze temple furnishings taken to Babylon"
    - "Jer 27:19 | realia | Stands among the remaining vessels"
    - "2Chr 4:6, 14 | realia | Basins for rinsing burnt offerings; stands"
  related: [taanach-cult-stand, bronze-sea, jachin-and-boaz, hiram-of-tyre, solomon, cherubim, lion-imagery]
  wikipedia: null
  image: Cypriot bronze wheeled stand British Museum
  author_notes:
    - The best comparanda for the mĕkōnôt are Late Cypriot bronze four-sided wheeled stands (12th-11th c. BCE) with openwork panels of animals and sphinxes. This supports the Phoenician or Cypriot craft tradition implied by Hiram (1 Kgs 7:13-14).
    - The description in 1 Kgs 7:27-37 contains rare technical terms and textual difficulties. Rely on commentaries when reconstructing it.
    - Distinguish the ceramic fenestrated stands (Taanach, Pella, Yavneh, Tel Rehov) from the bronze basin stands. Their iconography (e.g. on Taanach) and whether it represents Asherah and YHWH are debated.

- id: bronze-sea
  aliases: [Molten Sea, the Sea]
  cultures: [hebrew, phoenician, assyrian]
  scope: >-
    The large cast-bronze basin called "the sea" (hayyām), set on twelve bronze oxen in the
    court of Solomon's temple. The entry covers its dimensions, function, symbolism, and
    ancient Near Eastern analogues such as Mesopotamian apsû basins.
  passages:
    - "1Kgs 7:23-26 | realia | Cast sea ten cubits across on twelve oxen, holding 2,000 baths"
    - "1Kgs 7:39 | realia | Sea placed at the southeast corner of the house"
    - "2Chr 4:2-6, 10 | realia | Sea for the priests to wash in; 3,000 baths"
    - "1Chr 18:8 | realia | Bronze for the sea from Hadadezer's cities"
    - "2Kgs 16:17 | realia | Ahaz removes the sea from the bronze oxen"
    - "2Kgs 25:13, 16 | realia | Sea broken up by the Babylonians"
    - "Jer 52:17, 20 | realia | Sea and twelve oxen taken as bronze"
    - "Exod 30:17-21 | practice | Tabernacle basin for priestly washing"
    - "Rev 4:6 | imagery | Sea of glass before the heavenly throne"
  related: [temple-as-cosmos, waters-above-and-below, cult-stands, jachin-and-boaz, tehom, chaoskampf, hiram-of-tyre, bull-iconography]
  wikipedia: Molten Sea
  image: Assur temple cult basin Pergamon Museum
  author_notes:
    - Many scholars interpret the sea as cosmological symbolism (the subdued waters or the life-giving deep) in light of Mesopotamian apsû basins in temples. The stone basin from the Assur temple with fish-garbed figures is a frequent comparandum. The Chronicler gives it a practical function (washing).
    - The capacity figures differ (2,000 baths in 1 Kgs 7:26; 3,000 in 2 Chr 4:5). Note this without harmonizing.
    - The ratio of diameter (10 cubits) to circumference (30 cubits) is often discussed as an "approximation of π". Treat this briefly as reception. It is not a central scholarly issue.
    - The twelve oxen in groups of three facing the four directions relate to bull iconography and cosmic orientation. Ahaz's removal of the oxen (2 Kgs 16:17) is usually read as paying tribute to Assyria.

# Seed entries: cosmos-cult-kingship, part 2 (jachin-and-boaz .. sealed-deeds).
# Temple furnishings, royal ideology, iconographic motifs, prayer and vows, purity,
# mourning and death, covenant/treaty, war, diplomacy and court, scribal culture.

- id: jachin-and-boaz
  aliases: [Boaz and Jachin, Temple pillars]
  cultures: [judahite, phoenician]
  scope: >-
    The two bronze pillars named Jachin and Boaz that stood at the porch of
    Solomon's temple, cast by the Tyrian craftsman Hiram. The entry covers
    their description, function, names, and the freestanding pillars that
    flanked temple entrances elsewhere in the Levant.
  passages:
    - "1Kgs 7:15-22 | realia | Hiram casts two bronze pillars with capitals, lattice and pomegranates; named Jachin and Boaz"
    - "1Kgs 7:41-42 | realia | Summary inventory of pillars, capital bowls, lattices and pomegranates"
    - "2Chr 3:15-17 | realia | Chronicler's version: pillars of 35 cubits set before the temple"
    - "2Kgs 11:14 | practice | Joash stands 'by the pillar, according to custom' at his enthronement"
    - "2Kgs 23:3 | practice | Josiah stands by the pillar to make the covenant"
    - "2Kgs 25:13, 16-17 | realia | Babylonians break up the pillars; capital of three cubits"
    - "Jer 52:17, 20-23 | realia | Fuller account of the pillars at the destruction: hollow, four fingers thick"
    - "Ezek 40:49 | realia | Pillars beside the jambs of the vestibule in the visionary temple"
  related: [bronze-sea, proto-aeolic-capitals, hiram-of-tyre, temple-building-accounts, massebot, phoenicians, temple-as-cosmos]
  wikipedia: Boaz and Jachin
  image: Ain Dara temple portico
  author_notes:
    - "Most scholars take the pillars as freestanding rather than load-bearing. Comparanda: Herodotus 2.44 on the two pillars of Melqart's temple at Tyre; the two-columned portico of the ʿAin Dara temple; Iron Age clay shrine models with flanking pillars."
    - "The meaning of the names is uncertain: yākîn 'he establishes', bōʿaz 'in strength'. R. B. Y. Scott's proposal that they are the opening words of dynastic oracles or inscriptions is possible but unproven."
    - "Explain the dimensional discrepancies (18 cubits in 1 Kgs 7:15 and Jer 52:21 vs 35 in 2 Chr 3:15; capitals of 5 vs 3 cubits in 2 Kgs 25:17) without forced harmonization."
    - "Note the royal 'standing by the pillar' (2 Kgs 11:14; 23:3) as a ceremonial station. Set aside Masonic and other esoteric interpretations."

- id: proto-aeolic-capitals
  aliases: [Volute capitals, Palmette capitals, Proto-Ionic capitals]
  cultures: [israelite, judahite, moabite]
  date: [-900, -600]
  circa: true
  scope: >-
    Stone pilaster capitals with paired volutes flanking a central triangle,
    found in Iron Age II royal and administrative architecture in Israel, Judah
    and Moab (Hazor, Megiddo, Samaria, Jerusalem, Ramat Rahel, Medeibiyeh). The
    entry covers their distribution, dating, architectural use and palmette or
    sacred-tree symbolism.
  passages:
    - "1Kgs 7:9-12 | setting | Royal ashlar architecture of the kind in which volute capitals are found"
    - "1Kgs 7:19, 22 | realia? | 'Lily-work' capitals; a link to volute capitals has been proposed"
    - "1Kgs 6:29, 32, 35 | imagery | Carved palm trees (timōrôt) in temple decoration; palmette motif"
    - "Ezek 40:16, 22, 26, 31, 34, 37 | imagery | Palm-tree decoration on gate jambs of the visionary temple"
    - "Amos 5:11 | setting | Elite 'houses of hewn stone' (ashlar) in the northern kingdom"
    - "Jer 22:13-15 | setting? | Jehoiakim's palace; Ramat Rahel, with its capitals, is often proposed"
  related: [samaria, megiddo, hazor, ramat-rahel, jachin-and-boaz, assyrian-sacred-tree, samaria-ivories, tree-of-life]
  wikipedia: Proto-Aeolic capital
  image: Proto-Aeolic capital Ramat Rahel
  author_notes:
    - "The name is a misnomer. There is no proven link to the later Greek Aeolic order, and 'volute' or 'palmette capital' is often preferred."
    - "The capitals topped engaged pilasters at gateways and palace entrances, not freestanding columns. Most were found out of their original context."
    - "Dating of the Hazor, Megiddo and Samaria examples depends on the Iron Age chronology debate (9th vs 10th century). Present this neutrally."
    - "The motif is usually read as a stylized palm or sacred tree tied to royal display. Do not over-read it as cultic."
  sources_to_check:
    - "Y. Shiloh, The Proto-Aeolic Capital and Israelite Ashlar Masonry (Qedem 11; Jerusalem, 1979)"

- id: menorah
  aliases: [Temple lampstand, Seven-branched lampstand]
  cultures: [hebrew, jewish]
  scope: >-
    The gold lampstand of the tabernacle and Second Temple, described in Exodus as
    a six-branched stand with almond-blossom cups bearing seven lamps. The entry
    covers its biblical descriptions, its tree symbolism, Solomon's ten lampstands,
    Zechariah's vision, and its Second Temple and Roman-period depictions.
  passages:
    - "Exod 25:31-40 | realia | Lampstand of hammered gold with six branches and almond-blossom cups"
    - "Exod 37:17-24 | realia | Construction of the lampstand"
    - "Exod 27:20-21 | practice | Pure olive oil for the lamp to burn regularly"
    - "Lev 24:1-4 | practice | Lamps tended from evening to morning before YHWH"
    - "1Sam 3:3 | realia | The 'lamp of God' in the Shiloh sanctuary"
    - "1Kgs 7:49 | realia | Ten gold lampstands in Solomon's temple, five on each side"
    - "2Chr 13:11 | realia | Chronicler presupposes a single gold lampstand"
    - "Zech 4:1-14 | imagery | Lampstand with a bowl, seven lamps with spouts, flanked by two olive trees"
    - "1Macc 1:21; 4:49-50 | event | Lampstand removed by Antiochus IV and replaced at the rededication"
    - "Rev 1:12-13, 20 | imagery | Seven golden lampstands as the churches"
  related: [tabernacle, arch-of-titus, magdala-stone, tree-of-life, oil-lamps, herods-temple, antiochus-iv]
  wikipedia: Temple menorah
  image: Arch of Titus menorah relief
  author_notes:
    - "Carol Meyers (The Tabernacle Menorah, 1976) argued that its form derives from Late Bronze Age stylized-tree imagery. This is widely accepted as background, not as proof of a date."
    - "The Exodus description belongs to the Priestly source. Kings gives Solomon ten lampstands, so trace the development rather than harmonizing."
    - "Zechariah's lampstand (a bowl with seven spouted lamps) recalls Iron Age multi-spouted lamps. It is not the same as the Exodus form."
    - "Earliest securely dated depictions: Mattathias Antigonus coins (40–37 BCE), the Magdala stone, and the Arch of Titus (after 81 CE). Note the debate over the Arch's stepped/octagonal base."

- id: ark-of-the-covenant
  aliases: [Ark of YHWH, Ark of God, Ark of the testimony]
  cultures: [hebrew, egyptian]
  scope: >-
    The portable wooden chest of Israelite tradition, variously presented as the
    container of the covenant tablets, the footstool of YHWH enthroned on the
    cherubim, and a war palladium. The entry covers its descriptions and history in
    the biblical traditions, and its comparanda in Egyptian processional chests and
    barques and in ancient Near Eastern treaty deposits.
  passages:
    - "Exod 25:10-22 | realia | Acacia chest overlaid with gold, carrying poles, kappōret and two cherubim"
    - "Deut 10:1-5 | practice | The ark as container for the tablets; cf. treaty deposit before the deity"
    - "Num 10:35-36 | concept | 'Arise, O LORD': the ark as the presence of the divine warrior"
    - "Josh 3:3-17 | practice | The ark leads the procession across the Jordan"
    - "1Sam 4-6 | concept | Ark captured and returned; cf. the capture of divine images in war"
    - "2Sam 6 | practice | David's procession of the ark to Jerusalem"
    - "1Kgs 8:1-9 | realia | Ark installed under the cherubim in the inner sanctuary; holds only the tablets"
    - "1Chr 28:2 | concept | Ark as 'the footstool of our God'"
    - "Ps 132:8 | concept | 'You and the ark of your might' brought to rest"
    - "Jer 3:16 | concept | The ark will not be remembered or remade"
  related: [cherub-throne, footstool, tabernacle, cherubim, divine-warrior, covenant-and-treaty-form, tutankhamun-anubis-shrine, cult-images]
  wikipedia: Ark of the Covenant
  image: Tutankhamun Anubis shrine carrying poles
  author_notes:
    - "Separate the conceptions: the Deuteronomistic container of the tablets, the Priestly kappōret with cherubim, and the older war palladium (Num 10:35-36; 1 Sam 4)."
    - "Close formal parallels are Egyptian portable chests and barque shrines carried on poles (e.g. Tutankhamun's Anubis shrine). Hittite and Egyptian treaties were deposited before the gods, which bears on Deut 10:1-5."
    - "1 Sam 4–6 should be read alongside the Mesopotamian capture and return of divine statues. Rost's 'Ark Narrative' hypothesis remains debated."
    - "The ark's fate is unknown. Note recent proposals tied to Kiriath-jearim excavations as hypotheses, and do not engage the popular 'lost ark' claims (Ethiopia, etc.) beyond a mention."

- id: tabernacle
  aliases: [Mishkan, Tent of meeting]
  cultures: [hebrew, egyptian, amorite, ugaritic]
  scope: >-
    The portable sanctuary of Exodus–Numbers: the Priestly mishkan and the tent of
    meeting. The entry covers the Priestly descriptions, the non-Priestly oracle
    tent, the question of historicity, and ancient Near Eastern tent shrines and
    royal campaign tents.
  passages:
    - "Exod 25:8-9 | concept | 'That I may dwell among them', built according to a revealed pattern (tabnît)"
    - "Exod 25-31 | realia | Instructions for the tabernacle and its furnishings"
    - "Exod 35-40 | realia | Construction of the tabernacle"
    - "Exod 39:32, 43 | concept | Completion language echoing Gen 2:1-3"
    - "Exod 40:34-38 | concept | Cloud and glory fill the completed tabernacle"
    - "Exod 33:7-11 | practice | Non-Priestly tent of meeting pitched outside the camp for oracles"
    - "Num 2 | parallel? | Tribes camped around the central tent; compared to Ramesses II's Kadesh camp"
    - "2Sam 7:6 | concept | YHWH 'moving about in a tent and a tabernacle'"
    - "Ps 78:60 | setting | The tent at Shiloh abandoned"
    - "Heb 9:1-10 | concept | Christian typological reading of the tabernacle"
  related: [temple-building-accounts, temple-as-cosmos, ark-of-the-covenant, menorah, kadesh-battle-reliefs, timna, shiloh, mari]
  wikipedia: Tabernacle
  image: Ramesses II camp Kadesh relief Abu Simbel
  author_notes:
    - "Wellhausen saw the Priestly tabernacle as a retrojection of the Jerusalem temple. Present this view alongside work showing that portable tent shrines are well attested: Mari large tent (D. Fleming), El's tent dwelling at Ugarit, the Timna tent shrine, Egyptian royal campaign tents (M. Homan)."
    - "Homan's comparison of the tabernacle's layout with Ramesses II's Kadesh camp is suggestive but debated. Do not present it as proof of an early date."
    - "Distinguish the Priestly mishkan at the camp's centre from the non-Priestly oracle tent outside the camp (Exod 33:7-11; Num 11:16-30; 12:4-5)."
    - "Note the literary parallels to creation (seven speeches in Exod 25–31; Exod 39:32, 43 and 40:33 echo Gen 2:1-3)."

- id: cherub-throne
  aliases: ["Enthroned on the cherubim", Sphinx throne]
  cultures: [phoenician, canaanite, judahite]
  scope: >-
    The image of YHWH 'enthroned on the cherubim' and the Levantine sphinx-flanked
    throne behind it, as known from Late Bronze and Iron Age ivories and the Ahiram
    sarcophagus. The entry covers the epithet, the cherubim of the temple's inner
    sanctuary, and the debate over an 'empty throne'.
  passages:
    - "1Sam 4:4 | language | 'YHWH of hosts, who is enthroned on the cherubim'"
    - "2Sam 6:2 | language | Same epithet attached to the ark"
    - "2Kgs 19:15 | language | Hezekiah addresses the one enthroned above the cherubim (= Isa 37:16)"
    - "Ps 80:1 | language | Shepherd of Israel enthroned on the cherubim (MT 80:2)"
    - "Ps 99:1 | language | YHWH is king, enthroned on the cherubim"
    - "1Kgs 6:23-28 | realia | Two olivewood cherubim, ten cubits high, with outspread wings in the inner sanctuary"
    - "1Kgs 8:6-7 | realia | Cherubim's wings overshadow the ark"
    - "Exod 25:18-22 | realia | Cherubim on the kappōret; YHWH speaks from between them"
    - "Ps 18:10 | imagery | YHWH rides on a cherub (MT 18:11)"
    - "Ezek 10:1 | imagery | Throne-like sapphire above the cherubim"
  related: [cherubim, ark-of-the-covenant, footstool, ahiram-sarcophagus, samaria-ivories, aniconism, ezekiel-throne-chariot, lamassu]
  wikipedia: null
  image: Megiddo ivory cherub throne
  author_notes:
    - "The key comparanda are the Megiddo ivory plaque and the Ahiram sarcophagus, both showing a king on a throne with winged-sphinx sides. Cherubim are winged sphinxes, not Renaissance putti."
    - "Explain the reconstruction (Haran, Keel, Mettinger): the inner-sanctuary cherubim formed a throne and the ark served as its footstool. Mettinger's 'empty throne' model of aniconism is influential but debated."
    - "The epithet yōšēb hakkĕrûbîm is attached to the ark in Samuel. Whether it originated at Shiloh or in Jerusalem temple theology is debated."

- id: footstool
  cultures: [egyptian, ane]
  scope: >-
    The royal and divine footstool as an object and as an image of sovereignty and
    subjugation. The entry covers the ark or temple as YHWH's footstool, the
    cosmic footstool, and enemies made a footstool.
  passages:
    - "Ps 110:1 | imagery | Enemies made the king's footstool"
    - "Ps 99:5 | imagery | Worship at YHWH's footstool"
    - "Ps 132:7 | imagery | 'Let us worship at his footstool' (ark procession)"
    - "1Chr 28:2 | concept | Ark as the footstool of God"
    - "Lam 2:1 | imagery | YHWH did not remember his footstool (Zion/temple)"
    - "Isa 66:1 | imagery | Heaven my throne, earth my footstool"
    - "2Chr 9:18 | realia | Golden footstool attached to Solomon's throne"
    - "Matt 5:35 | imagery | Earth as God's footstool in the oath saying"
    - "Heb 1:13 | imagery | Ps 110:1 applied to Christ"
  related: [tutankhamun-footstool, cherub-throne, ark-of-the-covenant, smiting-the-enemy-motif, royal-ideology, temple-as-cosmos]
  wikipedia: Footstool
  image: Tutankhamun footstool bound captives
  author_notes:
    - "Tutankhamun's footstools decorated with bound foreign enemies (the Nine Bows) illustrate Ps 110:1 literally. Egyptian sandals and floors with enemy figures are related."
    - "The ark as footstool goes with the cherub throne above it. Explain how Isa 66:1 shifts the image to a cosmic scale and critiques the temple."
    - "The image is very often cited in the New Testament through Ps 110:1. Keep the focus on its ancient Near Eastern background."

- id: ezekiel-throne-chariot
  aliases: [Merkabah, Chariot vision]
  cultures: [babylonian, assyrian]
  scope: >-
    Ezekiel's visions of the divine glory on a mobile throne-platform borne by
    four-faced living creatures (cherubim) and wheels, set against Mesopotamian
    iconography of composite guardian creatures, sky-bearing figures and divine
    processional vehicles. Later Merkabah mysticism is mentioned only briefly.
  passages:
    - "Ezek 1:4-28 | imagery | Four living creatures, wheels, a platform (rāqîaʿ) and a humanlike figure on a throne"
    - "Ezek 10:1-22 | imagery | Creatures identified as cherubim; the glory moves to the temple threshold"
