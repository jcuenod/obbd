    - "J. Monson, 'The New ʿAin Dara Temple: Closest Solomonic Parallel,' BAR 26/3 (2000)"

- id: tell-tayinat
  aliases: [Kunulua, Kullania, Calno, Calneh]
  cultures: [luwian, assyrian]
  scope: >-
    A large mound in the Amuq plain of southern Turkey, ancient Kunulua, capital of the
    Neo-Hittite kingdom of Patina (Unqi). Tiglath-pileser III conquered it in 738 BCE and it
    became the Assyrian provincial centre Kullania. It has produced a tripartite temple beside
    a palace (Building II) and, in a later temple (Building XVI), a copy of Esarhaddon's
    succession treaty.
  passages:
    - "Isa 10:9 | attests | 'Is not Calno like Carchemish?': Kullania, conquered by Tiglath-pileser III in 738"
    - "Amos 6:2 | attests | 'Cross over to Calneh, and see'"
    - "1Kgs 6:2-3 | realia | Tripartite temple with porch; Tayinat Building II is a close Iron Age parallel"
    - "1Kgs 7:1-12 | realia | Temple built within the royal palace complex, as at Tayinat"
    - "Deut 31:24-26 | practice | Covenant document deposited in the sanctuary; cf. the treaty tablet found in Building XVI"
    - "Deut 13:1-18 | parallel | Loyalty clauses paralleled in the Tayinat copy of Esarhaddon's succession treaty (MT 13:2-19)"
    - "Deut 28:23 | parallel | Sky of bronze and earth of iron, a curse in the treaty"
  related: [esarhaddon-succession-treaty, solomons-temple, ain-dara-temple, tiglath-pileser-iii, philistines, covenant-and-treaty-form, carchemish, hamath]
  wikipedia: Tell Tayinat
  image: Tell Tayinat temple excavation
  author_notes:
    - "Excavated by the University of Chicago's Syrian-Hittite Expedition (1935-1938), which uncovered Building II and the bit-hilani palaces, and since 2004 by the Tayinat Archaeological Project (University of Toronto, T. P. Harrison)."
    - "The identification of Kunulua/Kullania with biblical Calno (Isa 10:9) and Calneh (Amos 6:2) is widely accepted. 'Calneh' in Gen 10:10, set in Shinar, is a separate problem and is often emended. Keep them apart."
    - "The treaty tablet (published by Lauinger, 2012) was found in the inner room of a temple, apparently displayed there. Check whether its oath-taker is the Assyrian governor of Kunalia rather than a vassal king; this affects claims about Judah, which was a vassal state."
    - "Early Iron Age levels with Aegean-style pottery and Luwian inscriptions of a king Taita of 'Palistin/Walistin' have fed debate over links with the Philistines. Present it as open."
  sources_to_check:
    - "R. C. Haines, Excavations in the Plain of Antioch II (OIP 95, 1971)"
    - "J. Lauinger, 'Esarhaddon's Succession Treaty at Tell Tayinat: Text and Commentary,' JCS 64 (2012)"
    - "T. P. Harrison and J. F. Osborne, 'Building XVI and the Neo-Assyrian Sacred Precinct at Tell Tayinat,' JCS 64 (2012)"

